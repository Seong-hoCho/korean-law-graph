eleted":false,"text":"①청산인은 취임한 후 지체없이 회사의 재산상태를 조사하여 재산목록과 대차대조표를 작성하고 이를 주주총회에 제출하여 그 승인을 얻어야 한다.\n②청산인은 전항의 승인을 얻은 후 지체없이 재산목록과 대차대조표를 법원에 제출하여야 한다.\n제533조(회사재산조사보고의무)","kind":"L"},{"id":"L:534","label":"법 제534조","title":"대차대조표ㆍ사무보고서ㆍ부속명세서의 제출ㆍ감사ㆍ공시ㆍ승인","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①청산인은 정기총회회일로부터 4주간전에 대차대조표 및 그 부속명세서와 사무보고서를 작성하여 감사에게 제출하여야 한다.\n②감사는 정기총회회일로부터 1주간전에 제1항의 서류에 관한 감사보고서를 청산인에게 제출하여야 한다.\n③청산인은 정기총회회일의 1주간전부터 제1항의 서류와 제2항의 감사보고서를 본점에 비치하여야 한다.\n④제448조제2항의 규정은 제3항의 서류에 관하여 이를 준용한다.\n⑤청산인은 대차대조표 및 사무보고서를 정기총회에 제출하여 그 승인을 요구하여야 한다.\n제534조(대차대조표ㆍ사무보고서ㆍ부속명세서의 제출ㆍ감사ㆍ공시ㆍ승인)","kind":"L"},{"id":"L:535","label":"법 제535조","title":"회사채권자에의 최고","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①청산인은 취임한 날로부터 2월내에 회사채권자에 대하여 일정한 기간내에 그 채권을 신고할 것과 그 기간내에 신고하지 아니하면 청산에서 제외될 뜻을 2회 이상 공고로써 최고하여야 한다. 그러나 그 기간은 2월 이상이어야 한다.\n②청산인은 알고 있는 채권자에 대하여는 각별로 그 채권의 신고를 최고하여야 하며 그 채권자가 신고하지 아니한 경우에도 이를 청산에서 제외하지 못한다.\n제535조(회사채권자에의 최고)","kind":"L"},{"id":"L:536","label":"법 제536조","title":"채권신고기간내의 변제","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①청산인은 전조제1항의 신고기간내에는 채권자에 대하여 변제를 하지 못한다. 그러나 회사는 그 변제의 지연으로 인한 손해배상의 책임을 면하지 못한다.\n②청산인은 전항의 규정에 불구하고 소액의 채권, 담보있는 채권 기타 변제로 인하여 다른 채권자를 해할 염려가 없는 채권에 대하여는 법원의 허가를 얻어 이를 변제할 수 있다.\n제536조(채권신고기간내의 변제)","kind":"L"},{"id":"L:537","label":"법 제537조","title":"제외된 채권자에 대한 변제","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①청산에서 제외된 채권자는 분배되지 아니한 잔여재산에 대하여서만 변제를 청구할 수 있다.\n②일부의 주주에 대하여 재산의 분배를 한 경우에는 그와 동일한 비율로 다른 주주에게 분배할 재산은 전항의 잔여재산에서 공제한다.\n제537조(제외된 채권자에 대한 변제)","kind":"L"},{"id":"L:538","label":"법 제538조","title":"잔여재산의 분배","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제538조(잔여재산의 분배) 잔여재산은 각 주주가 가진 주식의 수에 따라 주주에게 분배하여야 한다. 그러나 제344조제1항의 규정을 적용하는 경우에는 그러하지 아니하다.","kind":"L"},{"id":"L:539","label":"법 제539조","title":"청산인의 해임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①청산인은 법원이 선임한 경우 외에는 언제든지 주주총회의 결의로 이를 해임할 수 있다.\n②청산인이 그 업무를 집행함에 현저하게 부적임하거나 중대한 임무에 위반한 행위가 있는 때에는 발행주식의 총수의 100분의 3 이상에 해당하는 주식을 가진 주주는 법원에 그 청산인의 해임을 청구할 수 있다. <개정 1998.12.28>\n③제186조의 규정은 제2항의 청구에 관한 소에 준용한다. <개정 1998.12.28>\n제539조(청산인의 해임)","kind":"L"},{"id":"L:540","label":"법 제540조","title":"청산의 종결","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①청산사무가 종결한 때에는 청산인은 지체없이 결산보고서를 작성하고 이를 주주총회에 제출하여 승인을 얻어야 한다.\n②전항의 승인이 있는 때에는 회사는 청산인에 대하여 그 책임을 해제한 것으로 본다. 그러나 청산인의 부정행위에 대하여는 그러하지 아니하다.\n제540조(청산의 종결)","kind":"L"},{"id":"L:541","label":"법 제541조","title":"서류의 보존","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사의 장부 기타 영업과 청산에 관한 중요한 서류는 본점소재지에서 청산종결의 등기를 한 후 10년간 이를 보존하여야 한다. 다만, 전표 또는 이와 유사한 서류는 5년간 이를 보존하여야 한다. <개정 1995.12.29>\n②전항의 보존에 관하여는 청산인 기타의 이해관계인의 청구에 의하여 법원이 보존인과 보존방법을 정한다.\n제541조(서류의 보존)","kind":"L"},{"id":"L:542","label":"법 제542조","title":"준용규정","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①제245조, 제252조 내지 제255조, 제259조, 제260조와 제264조의 규정은 주식회사에 준용한다.\n②제362조, 제363조의2, 제366조, 제367조, 제373조, 제376조, 제377조, 제382조제2항, 제386조, 제388조 내지 제394조, 제396조, 제398조부터 제406조까지, 제406조의2, 제407조, 제408조, 제411조 내지 제413조, 제414조제3항, 제449조제3항, 제450조와 제466조는 청산인에 준용한다. <개정 1962.12.12, 1984.4.10, 1998.12.28, 2020.12.29>\n제542조(준용규정)","kind":"L"},{"id":"L:542-2","label":"법 제542조의2","title":"적용범위","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 이 절은 대통령령으로 정하는 증권시장(증권의 매매를 위하여 개설된 시장을 말한다)에 상장된 주권을 발행한 주식회사(이하 \"상장회사\"라 한다)에 대하여 적용한다. 다만, 집합투자(2인 이상에게 투자권유를 하여 모은 금전이나 그 밖의 재산적 가치가 있는 재산을 취득ㆍ처분, 그 밖의 방법으로 운용하고 그 결과를 투자자에게 배분하여 귀속시키는 것을 말한다)를 수행하기 위한 기구로서 대통령령으로 정하는 주식회사는 제외한다.\n② 이 절은 이 장 다른 절에 우선하여 적용한다.\n제542조의2(적용범위)","kind":"L"},{"id":"L:542-3","label":"법 제542조의3","title":"주식매수선택권","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 상장회사는 제340조의2제1항 본문에 규정된 자 외에도 대통령령으로 정하는 관계 회사의 이사, 집행임원, 감사 또는 피용자에게 주식매수선택권을 부여할 수 있다. 다만, 제542조의8제2항제5호의 최대주주 등 대통령령으로 정하는 자에게는 주식매수선택권을 부여할 수 없다. <개정 2011.4.14>\n② 상장회사는 제340조의2제3항에도 불구하고 발행주식총수의 100분의 20의 범위에서 대통령령으로 정하는 한도까지 주식매수선택권을 부여할 수 있다.\n③ 상장회사는 제340조의2제1항 본문에도 불구하고 정관으로 정하는 바에 따라 발행주식총수의 100분의 10의 범위에서 대통령령으로 정하는 한도까지 이사회가 제340조의3제2항 각 호의 사항을 결의함으로써 해당 회사의 집행임원ㆍ감사 또는 피용자 및 제1항에 따른 관계 회사의 이사ㆍ집행임원ㆍ감사 또는 피용자에게 주식매수선택권을 부여할 수 있다. 이 경우 주식매수선택권을 부여한 후 처음으로 소집되는 주주총회의 승인을 받아야 한다. <개정 2011.4.14>\n④ 상장회사의 주식매수선택권을 부여받은 자는 제340조의4제1항에도 불구하고 대통령령으로 정하는 경우를 제외하고는 주식매수선택권을 부여하기로 한 주주총회 또는 이사회의 결의일부터 2년 이상 재임하거나 재직하여야 주식매수선택권을 행사할 수 있다.\n⑤ 제1항부터 제4항까지에서 규정한 사항 외에 상장회사의 주식매수선택권 부여, 취소, 그 밖에 필요한 사항은 대통령령으로 정한다.\n제542조의3(주식매수선택권)","kind":"L"},{"id":"L:542-4","label":"법 제542조의4","title":"주주총회 소집공고 등","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 상장회사가 주주총회를 소집하는 경우 대통령령으로 정하는 수 이하의 주식을 소유하는 주주에게는 정관으로 정하는 바에 따라 주주총회일의 2주 전에 주주총회를 소집하는 뜻과 회의의 목적사항을 둘 이상의 일간신문에 각각 2회 이상 공고하거나 대통령령으로 정하는 바에 따라 전자적 방법으로 공고함으로써 제363조제1항의 소집통지를 갈음할 수 있다.\n② 상장회사가 이사ㆍ감사의 선임에 관한 사항을 목적으로 하는 주주총회를 소집통지 또는 공고하는 경우에는 이사ㆍ감사 후보자의 성명, 약력, 추천인, 그 밖에 대통령령으로 정하는 후보자에 관한 사항을 통지하거나 공고하여야 한다.\n③ 상장회사가 주주총회 소집의 통지 또는 공고를 하는 경우에는 제542조의8제1항의 독립이사 등의 활동내역과 보수에 관한 사항, 사업개요 등 대통령령으로 정하는 사항을 통지 또는 공고하여야 한다. 다만, 상장회사가 그 사항을 대통령령으로 정하는 방법으로 일반인이 열람할 수 있도록 하는 경우에는 그러하지 아니하다. <개정 2025.7.22>\n제542조의4(주주총회 소집공고 등)","kind":"L"},{"id":"L:542-5","label":"법 제542조의5","title":"이사ㆍ감사의 선임방법","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제542조의5(이사ㆍ감사의 선임방법) 상장회사가 주주총회에서 이사 또는 감사를 선임하려는 경우에는 제542조의4제2항에 따라 통지하거나 공고한 후보자 중에서 선임하여야 한다.","kind":"L"},{"id":"L:542-6","label":"법 제542조의6","title":"소수주주권","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 6개월 전부터 계속하여 상장회사 발행주식총수의 1천분의 15 이상에 해당하는 주식을 보유한 자는 제366조(제542조에서 준용하는 경우를 포함한다) 및 제467조에 따른 주주의 권리를 행사할 수 있다.\n② 6개월 전부터 계속하여 상장회사의 의결권 없는 주식을 제외한 발행주식총수의 1천분의 10(대통령령으로 정하는 상장회사의 경우에는 1천분의 5) 이상에 해당하는 주식을 보유한 자는 제363조의2(제542조에서 준용하는 경우를 포함한다)에 따른 주주의 권리를 행사할 수 있다.\n③ 6개월 전부터 계속하여 상장회사 발행주식총수의 1만분의 50(대통령령으로 정하는 상장회사의 경우에는 1만분의 25) 이상에 해당하는 주식을 보유한 자는 제385조(제415조에서 준용하는 경우를 포함한다) 및 제539조에 따른 주주의 권리를 행사할 수 있다.\n④ 6개월 전부터 계속하여 상장회사 발행주식총수의 1만분의 10(대통령령으로 정하는 상장회사의 경우에는 1만분의 5) 이상에 해당하는 주식을 보유한 자는 제466조(제542조에서 준용하는 경우를 포함한다)에 따른 주주의 권리를 행사할 수 있다.\n⑤ 6개월 전부터 계속하여 상장회사 발행주식총수의 10만분의 50(대통령령으로 정하는 상장회사의 경우에는 10만분의 25) 이상에 해당하는 주식을 보유한 자는 제402조(제408조의9 및 제542조에서 준용하는 경우를 포함한다)에 따른 주주의 권리를 행사할 수 있다. <개정 2011.4.14>\n⑥ 6개월 전부터 계속하여 상장회사 발행주식총수의 1만분의 1 이상에 해당하는 주식을 보유한 자는 제403조(제324조, 제408조의9, 제415조, 제424조의2, 제467조의2 및 제542조에서 준용하는 경우를 포함한다)에 따른 주주의 권리를 행사할 수 있다. <개정 2011.4.14>\n⑦ 6개월 전부터 계속하여 상장회사 발행주식총수의 1만분의 50 이상에 해당하는 주식을 보유한 자는 제406조의2(제324조, 제408조의9, 제415조 및 제542조에서 준용하는 경우를 포함한다)에 따른 주주의 권리를 행사할 수 있다. <신설 2020.12.29>\n⑧ 상장회사는 정관에서 제1항부터 제6항까지 규정된 것보다 단기의 주식 보유기간을 정하거나 낮은 주식 보유비율을 정할 수 있다. <개정 2020.12.29>\n⑨ 제1항부터 제6항까지 및 제542조의7제2항에서 \"주식을 보유한 자\"란 주식을 소유한 자, 주주권 행사에 관한 위임을 받은 자, 2명 이상 주주의 주주권을 공동으로 행사하는 자를 말한다. <개정 2020.12.29>\n⑩ 제1항부터 제7항까지는 제542조의2제2항에도 불구하고 이 장의 다른 절에 따른 소수주주권의 행사에 영향을 미치지 아니한다. <신설 2020.12.29>\n제542조의6(소수주주권)","kind":"L"},{"id":"L:542-7","label":"법 제542조의7","title":"집중투표에 관한 특례","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 상장회사에 대하여 제382조의2에 따라 집중투표의 방법으로 이사를 선임할 것을 청구하는 경우 주주총회일(정기주주총회의 경우에는 직전 연도의 정기주주총회일에 해당하는 그 해의 해당일. 이하 제542조의8제5항에서 같다)의 6주 전까지 서면 또는 전자문서로 회사에 청구하여야 한다.\n② 자산 규모 등을 고려하여 대통령령으로 정하는 상장회사의 의결권 없는 주식을 제외한 발행주식총수의 100분의 1 이상에 해당하는 주식을 보유한 자는 제382조의2에 따라 집중투표의 방법으로 이사를 선임할 것을 청구할 수 있다.\n③ 제2항의 상장회사는 제382조의2제1항에도 불구하고 정관으로 집중투표를 배제할 수 없다. <개정 2025.9.9>\n④ 삭제 <2025.9.9>\n제542조의7(집중투표에 관한 특례)","kind":"L"},{"id":"L:542-8","label":"법 제542조의8","title":"독립이사의 선임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 상장회사는 자산 규모 등을 고려하여 대통령령으로 정하는 경우를 제외하고는 이사 총수의 3분의 1 이상을 독립이사(제382조제3항의 사외이사로서 사내이사, 집행임원 및 업무집행지시자로부터 독립적인 기능을 수행하는 이사를 말한다. 이하 같다)로 하여야 한다. 다만, 자산 규모 등을 고려하여 대통령령으로 정하는 상장회사의 독립이사는 3명 이상으로 하되, 이사 총수의 과반수가 되도록 하여야 한다. <개정 2025.7.22>\n② 상장회사의 독립이사는 제382조제3항 각 호 뿐만 아니라 다음 각 호의 어느 하나에 해당되지 아니하여야 하며, 이에 해당하게 된 경우에는 그 직을 상실한다. <개정 2011.4.14, 2018.9.18, 2025.7.22>\n1. 미성년자, 피성년후견인 또는 피한정후견인\n2. 파산선고를 받고 복권되지 아니한 자\n3. 금고 이상의 형을 선고받고 그 집행이 끝나거나 집행이 면제된 후 2년이 지나지 아니한 자\n4. 대통령령으로 별도로 정하는 법률을 위반하여 해임되거나 면직된 후 2년이 지나지 아니한 자\n5. 상장회사의 주주로서 의결권 없는 주식을 제외한 발행주식총수를 기준으로 본인 및 그와 대통령령으로 정하는 특수한 관계에 있는 자(이하 \"특수관계인\"이라 한다)가 소유하는 주식의 수가 가장 많은 경우 그 본인(이하 \"최대주주\"라 한다) 및 그의 특수관계인\n6. 누구의 명의로 하든지 자기의 계산으로 의결권 없는 주식을 제외한 발행주식총수의 100분의 10 이상의 주식을 소유하거나 이사ㆍ집행임원ㆍ감사의 선임과 해임 등 상장회사의 주요 경영사항에 대하여 사실상의 영향력을 행사하는 주주(이하 \"주요주주\"라 한다) 및 그의 배우자와 직계 존속ㆍ비속\n7. 그 밖에 독립이사로서의 직무를 충실하게 수행하기 곤란하거나 상장회사의 경영에 영향을 미칠 수 있는 자로서 대통령령으로 정하는 자\n③ 제1항의 상장회사는 독립이사의 사임ㆍ사망 등의 사유로 인하여 독립이사의 수가 제1항의 이사회의 구성요건에 미달하게 되면 그 사유가 발생한 후 처음으로 소집되는 주주총회에서 제1항의 요건에 합치되도록 독립이사를 선임하여야 한다. <개정 2025.7.22>\n④ 제1항 단서의 상장회사는 독립이사 후보를 추천하기 위하여 제393조의2의 위원회(이하 이 조에서 \"독립이사 후보추천위원회\"라 한다)를 설치하여야 한다. 이 경우 독립이사 후보추천위원회는 독립이사가 총위원의 과반수가 되도록 구성하여야 한다. <개정 2011.4.14, 2025.7.22>\n⑤ 제1항 단서에서 규정하는 상장회사가 주주총회에서 독립이사를 선임하려는 때에는 독립이사 후보추천위원회의 추천을 받은 자 중에서 선임하여야 한다. 이 경우 독립이사 후보추천위원회가 독립이사 후보를 추천할 때에는 제363조의2제1항, 제542조의6제1항ㆍ제2항의 권리를 행사할 수 있는 요건을 갖춘 주주가 주주총회일(정기주주총회의 경우 직전연도의 정기주주총회일에 해당하는 해당 연도의 해당일)의 6주 전에 추천한 독립이사 후보를 포함시켜야 한다. <개정 2011.4.14, 2025.7.22>\n제542조의8(독립이사의 선임)","kind":"L"},{"id":"L:542-9","label":"법 제542조의9","title":"주요주주 등 이해관계자와의 거래","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 상장회사는 다음 각 호의 어느 하나에 해당하는 자를 상대방으로 하거나 그를 위하여 신용공여(금전 등 경제적 가치가 있는 재산의 대여, 채무이행의 보증, 자금 지원적 성격의 증권 매입, 그 밖에 거래상의 신용위험이 따르는 직접적ㆍ간접적 거래로서 대통령령으로 정하는 거래를 말한다. 이하 이 조에서 같다)를 하여서는 아니 된다. <개정 2011.4.14>\n1. 주요주주 및 그의 특수관계인\n2. 이사(제401조의2제1항 각 호의 어느 하나에 해당하는 자를 포함한다. 이하 이 조에서 같다) 및 집행임원\n3. 감사\n② 제1항에도 불구하고 다음 각 호의 어느 하나에 해당하는 경우에는 신용공여를 할 수 있다. <개정 2011.4.14>\n1. 복리후생을 위한 이사ㆍ집행임원 또는 감사에 대한 금전대여 등으로서 대통령령으로 정하는 신용공여\n2. 다른 법령에서 허용하는 신용공여\n3. 그 밖에 상장회사의 경영건전성을 해칠 우려가 없는 금전대여 등으로서 대통령령으로 정하는 신용공여\n③ 자산 규모 등을 고려하여 대통령령으로 정하는 상장회사는 최대주주, 그의 특수관계인 및 그 상장회사의 특수관계인으로서 대통령령으로 정하는 자를 상대방으로 하거나 그를 위하여 다음 각 호의 어느 하나에 해당하는 거래(제1항에 따라 금지되는 거래는 제외한다)를 하려는 경우에는 이사회의 승인을 받아야 한다.\n1. 단일 거래규모가 대통령령으로 정하는 규모 이상인 거래\n2. 해당 사업연도 중에 특정인과의 해당 거래를 포함한 거래총액이 대통령령으로 정하는 규모 이상이 되는 경우의 해당 거래\n④ 제3항의 경우 상장회사는 이사회의 승인 결의 후 처음으로 소집되는 정기주주총회에 해당 거래의 목적, 상대방, 그 밖에 대통령령으로 정하는 사항을 보고하여야 한다.\n⑤ 제3항에도 불구하고 상장회사가 경영하는 업종에 따른 일상적인 거래로서 다음 각 호의 어느 하나에 해당하는 거래는 이사회의 승인을 받지 아니하고 할 수 있으며, 제2호에 해당하는 거래에 대하여는 그 거래내용을 주주총회에 보고하지 아니할 수 있다.\n1. 약관에 따라 정형화된 거래로서 대통령령으로 정하는 거래\n2. 이사회에서 승인한 거래총액의 범위 안에서 이행하는 거래\n제542조의9(주요주주 등 이해관계자와의 거래)","kind":"L"},{"id":"L:542-10","label":"법 제542조의10","title":"상근감사","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 대통령령으로 정하는 상장회사는 주주총회 결의에 의하여 회사에 상근하면서 감사업무를 수행하는 감사(이하 \"상근감사\"라고 한다)를 1명 이상 두어야 한다. 다만, 이 절 및 다른 법률에 따라 감사위원회를 설치한 경우(감사위원회 설치 의무가 없는 상장회사가 이 절의 요건을 갖춘 감사위원회를 설치한 경우를 포함한다)에는 그러하지 아니하다. <개정 2011.4.14>\n② 다음 각 호의 어느 하나에 해당하는 자는 제1항 본문의 상장회사의 상근감사가 되지 못하며, 이에 해당하게 되는 경우에는 그 직을 상실한다. <개정 2011.4.14>\n1. 제542조의8제2항제1호부터 제4호까지 및 제6호에 해당하는 자\n2. 회사의 상무(常務)에 종사하는 이사ㆍ집행임원 및 피용자 또는 최근 2년 이내에 회사의 상무에 종사한 이사ㆍ집행임원 및 피용자. 다만, 이 절에 따른 감사위원회위원으로 재임 중이거나 재임하였던 이사는 제외한다.\n3. 제1호 및 제2호 외에 회사의 경영에 영향을 미칠 수 있는 자로서 대통령령으로 정하는 자\n제542조의10(상근감사)","kind":"L"},{"id":"L:542-11","label":"법 제542조의11","title":"감사위원회","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 자산 규모 등을 고려하여 대통령령으로 정하는 상장회사는 감사위원회를 설치하여야 한다.\n② 제1항의 상장회사의 감사위원회는 제415조의2제2항의 요건 및 다음 각 호의 요건을 모두 갖추어야 한다. <개정 2025.7.22>\n1. 위원 중 1명 이상은 대통령령으로 정하는 회계 또는 재무 전문가일 것\n2. 감사위원회의 대표는 독립이사일 것\n③ 제542조의10제2항 각 호의 어느 하나에 해당하는 자는 제1항의 상장회사의 독립이사가 아닌 감사위원회위원이 될 수 없고, 이에 해당하게 된 경우에는 그 직을 상실한다. <개정 2025.7.22>\n④ 상장회사는 감사위원회위원인 독립이사의 사임ㆍ사망 등의 사유로 인하여 독립이사의 수가 다음 각 호의 감사위원회의 구성요건에 미달하게 되면 그 사유가 발생한 후 처음으로 소집되는 주주총회에서 그 요건에 합치되도록 하여야 한다. <개정 2025.7.22>\n1. 제1항에 따라 감사위원회를 설치한 상장회사는 제2항 각 호 및 제415조의2제2항의 요건\n2. 제415조의2제1항에 따라 감사위원회를 설치한 상장회사는 제415조의2제2항의 요건\n제542조의11(감사위원회)","kind":"L"},{"id":"L:542-12","label":"법 제542조의12","title":"감사위원회의 구성 등","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 제542조의11제1항의 상장회사의 경우 제393조의2에도 불구하고 감사위원회위원을 선임하거나 해임하는 권한은 주주총회에 있다.\n② 제542조의11제1항의 상장회사는 주주총회에서 이사를 선임한 후 선임된 이사 중에서 감사위원회위원을 선임하여야 한다. 다만, 감사위원회위원 중 2명(정관에서 3명 이상으로 정할 수 있으며, 정관으로 정한 경우에는 그에 따른 인원으로 한다)은 주주총회 결의로 다른 이사들과 분리하여 감사위원회위원이 되는 이사로 선임하여야 한다. <개정 2020.12.29, 2025.9.9>\n③ 제1항에 따른 감사위원회위원은 제434조에 따른 주주총회의 결의로 해임할 수 있다. 이 경우 제2항 단서에 따른 감사위원회위원은 이사와 감사위원회위원의 지위를 모두 상실한다. <개정 2020.12.29>\n④ 제1항에 따른 감사위원회위원을 선임 또는 해임할 때에는 상장회사의 의결권 없는 주식을 제외한 발행주식총수의 100분의 3(정관에서 더 낮은 주식 보유비율을 정할 수 있으며, 정관에서 더 낮은 주식 보유비율을 정한 경우에는 그 비율로 한다)을 초과하는 수의 주식을 가진 주주(최대주주인 경우에는 그의 특수관계인, 그 밖에 대통령령으로 정하는 자가 소유하는 주식을 합산한다)는 그 초과하는 주식에 관하여 의결권을 행사하지 못한다. <개정 2020.12.29, 2025.7.22>\n⑤ 상장회사가 주주총회의 목적사항으로 감사의 선임 또는 감사의 보수결정을 위한 의안을 상정하려는 경우에는 이사의 선임 또는 이사의 보수결정을 위한 의안과는 별도로 상정하여 의결하여야 한다.\n⑥ 상장회사의 감사 또는 감사위원회는 제447조의4제1항에도 불구하고 이사에게 감사보고서를 주주총회일의 1주 전까지 제출할 수 있다.\n⑦ 제4항은 상장회사가 감사를 선임하거나 해임할 때에 준용한다. <신설 2020.12.29, 2025.7.22>\n⑧ 회사가 제368조의4제1항에 따라 전자적 방법으로 의결권을 행사할 수 있도록 한 경우에는 제368조제1항에도 불구하고 출석한 주주의 의결권의 과반수로써 제1항에 따른 감사위원회위원의 선임을 결의할 수 있다. <신설 2020.12.29>\n제542조의12(감사위원회의 구성 등)","kind":"L"},{"id":"L:542-13","label":"법 제542조의13","title":"준법통제기준 및 준법지원인","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 자산 규모 등을 고려하여 대통령령으로 정하는 상장회사는 법령을 준수하고 회사경영을 적정하게 하기 위하여 임직원이 그 직무를 수행할 때 따라야 할 준법통제에 관한 기준 및 절차(이하 \"준법통제기준\"이라 한다)를 마련하여야 한다.\n② 제1항의 상장회사는 준법통제기준의 준수에 관한 업무를 담당하는 사람(이하 \"준법지원인\"이라 한다)을 1명 이상 두어야 한다.\n③ 준법지원인은 준법통제기준의 준수여부를 점검하여 그 결과를 이사회에 보고하여야 한다.\n④ 제1항의 상장회사는 준법지원인을 임면하려면 이사회 결의를 거쳐야 한다.\n⑤ 준법지원인은 다음 각 호의 사람 중에서 임명하여야 한다.\n1. 변호사 자격을 가진 사람\n2. 「고등교육법」 제2조에 따른 학교에서 법률학을 가르치는 조교수 이상의 직에 5년 이상 근무한 사람\n3. 그 밖에 법률적 지식과 경험이 풍부한 사람으로서 대통령령으로 정하는 사람\n⑥ 준법지원인의 임기는 3년으로 하고, 준법지원인은 상근으로 한다.\n⑦ 준법지원인은 선량한 관리자의 주의로 그 직무를 수행하여야 한다.\n⑧ 준법지원인은 재임 중뿐만 아니라 퇴임 후에도 직무상 알게 된 회사의 영업상 비밀을 누설하여서는 아니 된다.\n⑨ 제1항의 상장회사는 준법지원인이 그 직무를 독립적으로 수행할 수 있도록 하여야 하고, 제1항의 상장회사의 임직원은 준법지원인이 그 직무를 수행할 때 자료나 정보의 제출을 요구하는 경우 이에 성실하게 응하여야 한다.\n⑩ 제1항의 상장회사는 준법지원인이었던 사람에 대하여 그 직무수행과 관련된 사유로 부당한 인사상의 불이익을 주어서는 아니 된다.\n⑪ 준법지원인에 관하여 다른 법률에 특별한 규정이 있는 경우를 제외하고는 이 법에서 정하는 바에 따른다. 다만, 다른 법률의 규정이 준법지원인의 임기를 제6항보다 단기로 정하고 있는 경우에는 제6항을 다른 법률에 우선하여 적용한다.\n⑫ 그 밖의 준법통제기준 및 준법지원인에 관하여 필요한 사항은 대통령령으로 정한다.\n제542조의13(준법통제기준 및 준법지원인)","kind":"L"},{"id":"L:542-14","label":"법 제542조의14","title":"전자주주총회","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 상장회사는 정관으로 달리 정하는 경우를 제외하고는 이사회의 결의로 주주의 일부가 소집지에 직접 출석하지 아니하고 원격지에서 전자적 방법에 의하여 결의에 참가할 수 있는 방식의 총회(이하 \"전자주주총회\"라 한다)를 개최할 수 있다.\n② 자산규모 등을 고려하여 대통령령으로 정하는 상장회사는 전자주주총회를 개최하여야 한다.\n③ 상장회사가 전자주주총회를 개최하는 경우 주주는 소집지에 직접 출석하는 방식과 전자통신수단에 의하여 출석하는 방식 중 어느 한 가지 방식에 의하여만 총회에 출석할 수 있다.\n④ 전자주주총회에 출석한 주주 등은 제364조에 따른 소집지에 직접 출석한 것으로 본다.\n⑤ 상장회사가 전자주주총회를 개최하는 경우 제363조제1항에 따른 소집통지에 전자주주총회를 개최한다는 뜻과 출석방법, 그 밖에 대통령령으로 정하는 사항을 포함하여야 한다.\n⑥ 제1항부터 제5항까지에 따른 전자통신수단, 전자주주총회 개최요건 및 그 밖에 필요한 사항은 대통령령으로 정한다.\n제542조의14(전자주주총회)","kind":"L"},{"id":"L:542-15","label":"법 제542조의15","title":"전자주주총회의 운영 등","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 상장회사가 제542조의14에 따라 전자주주총회를 개최하는 경우 주주가 총회의 의사진행 및 결의에 실시간으로 참가할 수 있도록 총회를 적정하게 운영하여야 한다.\n② 상장회사는 전자주주총회 운영의 효율성 및 공정성을 확보하기 위하여 대통령령으로 정하는 바에 따라 전자주주총회를 관리하는 기관을 지정하여 전자주주총회의 의사진행 및 결의에 참가하는 절차의 운영을 위탁할 수 있다.\n③ 제2항에 따라 지정된 전자주주총회 관리기관 및 그 임직원은 직무상 알게 된 정보로서 외부에 공개되지 아니한 정보를 정당한 사유 없이 자기 또는 제3자의 이익을 위하여 이용하여서는 아니 된다.\n④ 상장회사는 대통령령으로 정하는 바에 따라 전자주주총회의 개최에 관한 기록을 총회가 끝난 날부터 5년간 보존하여야 한다.\n⑤ 상장회사는 제4항에 따른 기록을 총회가 끝난 날부터 3개월간 본점에 갖추어 두어야 하고, 주주는 영업시간 내에 기록의 열람을 청구할 수 있다.\n⑥ 주주의 질의 방법 및 절차, 의장의 의사진행 등 전자주주총회의 운영과 그 밖에 필요한 사항은 대통령령으로 정한다.\n제542조의15(전자주주총회의 운영 등)","kind":"L"},{"id":"L:543","label":"법 제543조","title":"정관의 작성, 절대적 기재사항","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①유한회사를 설립함에는 사원이 정관을 작성하여야 한다. <개정 2001.7.24>\n②정관에는 다음의 사항을 기재하고 각 사원이 기명날인 또는 서명하여야 한다. <개정 1984.4.10, 1995.12.29, 2001.7.24, 2011.4.14>\n1. 제179조제1호 내지 제3호에 정한 사항\n2. 자본금의 총액\n3. 출자1좌의 금액\n4. 각 사원의 출자좌수\n5. 본점의 소재지\n③제292조의 규정은 유한회사에 준용한다.\n제543조(정관의 작성, 절대적 기재사항)","kind":"L"},{"id":"L:544","label":"법 제544조","title":"변태설립사항","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"1. 현물출자를 하는 자의 성명과 그 목적인 재산의 종류, 수량, 가격과 이에 대하여 부여하는 출자좌수\n2. 회사의 설립후에 양수할 것을 약정한 재산의 종류, 수량, 가격과 그 양도인의 성명\n3. 회사가 부담할 설립비용\n제544조(변태설립사항) 다음의 사항은 정관에 기재함으로써 그 효력이 있다.","kind":"L"},{"id":"L:545","label":"법 제545조","title":"","chapter":"제3편 회사 제5장 유한회사","deleted":true,"text":"제545조 삭제 <2011.4.14>","kind":"L"},{"id":"L:546","label":"법 제546조","title":"출자 1좌의 금액의 제한","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제546조(출자 1좌의 금액의 제한) 출자 1좌의 금액은 100원 이상으로 균일하게 하여야 한다.","kind":"L"},{"id":"L:547","label":"법 제547조","title":"초대이사의 선임","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①정관으로 이사를 정하지 아니한 때에는 회사성립전에 사원총회를 열어 이를 선임하여야 한다.\n②전항의 사원총회는 각 사원이 소집할 수 있다.\n제547조(초대이사의 선임)","kind":"L"},{"id":"L:548","label":"법 제548조","title":"출자의 납입","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①이사는 사원으로 하여금 출자전액의 납입 또는 현물출자의 목적인 재산전부의 급여를 시켜야 한다.\n②제295조제2항의 규정은 사원이 현물출자를 하는 경우에 준용한다.\n제548조(출자의 납입)","kind":"L"},{"id":"L:549","label":"법 제549조","title":"설립의 등기","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①유한회사의 설립등기는 제548조의 납입 또는 현물출자의 이행이 있은 날로부터 2주간 내에 하여야 한다. <개정 1995.12.29>\n②제1항의 등기에서 다음 각 호의 사항을 등기하여야 한다. <개정 1995.12.29, 2011.4.14>\n1. 제179조제1호ㆍ제2호 및 제5호에 규정된 사항과 지점을 둔 때에는 그 소재지\n2. 제543조제2항제2호와 제3호에 게기한 사항\n3. 이사의 성명ㆍ주민등록번호 및 주소. 다만, 회사를 대표할 이사를 정한 때에는 그 외의 이사의 주소를 제외한다.\n4. 회사를 대표할 이사를 정한 때에는 그 성명, 주소와 주민등록번호\n5. 수인의 이사가 공동으로 회사를 대표할 것을 정한 때에는 그 규정\n6. 존립기간 기타의 해산사유를 정한 때에는 그 기간과 사유\n7. 감사가 있는 때에는 그 성명 및 주민등록번호\n③ 삭제 <2024.9.20>\n④제181조 내지 제183조의 규정은 유한회사의 등기에 준용한다. <개정 1962.12.12>\n제549조(설립의 등기)","kind":"L"},{"id":"L:550","label":"법 제550조","title":"현물출자 등에 관한 회사성립시의 사원의 책임","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①제544조제1호와 제2호의 재산의 회사성립당시의 실가가 정관에 정한 가격에 현저하게 부족한 때에는 회사성립당시의 사원은 회사에 대하여 그 부족액을 연대하여 지급할 책임이 있다.\n②전항의 사원의 책임은 면제하지 못한다. <신설 1962.12.12>\n제550조(현물출자 등에 관한 회사성립시의 사원의 책임)","kind":"L"},{"id":"L:551","label":"법 제551조","title":"출자미필액에 대한 회사성립시의 사원 등의 책임","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①회사성립후에 출자금액의 납입 또는 현물출자의 이행이 완료되지 아니하였음이 발견된 때에는 회사성립당시의 사원, 이사와 감사는 회사에 대하여 그 납입되지 아니한 금액 또는 이행되지 아니한 현물의 가액을 연대하여 지급할 책임이 있다. <개정 1962.12.12>\n②전항의 사원의 책임은 면제하지 못한다. <신설 1962.12.12>\n③제1항의 이사와 감사의 책임은 총사원의 동의가 없으면 면제하지 못한다. <신설 1962.12.12>\n제551조(출자미필액에 대한 회사성립시의 사원 등의 책임)","kind":"L"},{"id":"L:552","label":"법 제552조","title":"설립무효, 취소의 소","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①회사의 설립의 무효는 그 사원, 이사와 감사에 한하여 설립의 취소는 그 취소권있는 자에 한하여 회사설립의 날로부터 2년내에 소만으로 이를 주장할 수 있다.\n②제184조제2항과 제185조 내지 제193조의 규정은 전항의 소에 준용한다.\n제552조(설립무효, 취소의 소)","kind":"L"},{"id":"L:553","label":"법 제553조","title":"사원의 책임","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제553조(사원의 책임) 사원의 책임은 본법에 다른 규정이 있는 경우 외에는 그 출자금액을 한도로 한다.","kind":"L"},{"id":"L:554","label":"법 제554조","title":"사원의 지분","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제554조(사원의 지분) 각 사원은 그 출자좌수에 따라 지분을 가진다.","kind":"L"},{"id":"L:555","label":"법 제555조","title":"지분에 관한 증권","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제555조(지분에 관한 증권) 유한회사는 사원의 지분에 관하여 지시식 또는 무기명식의 증권을 발행하지 못한다.","kind":"L"},{"id":"L:556","label":"법 제556조","title":"지분의 양도","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제556조(지분의 양도) 사원은 그 지분의 전부 또는 일부를 양도하거나 상속할 수 있다. 다만, 정관으로 지분의 양도를 제한할 수 있다.","kind":"L"},{"id":"L:557","label":"법 제557조","title":"지분이전의 대항요건","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제557조(지분이전의 대항요건) 지분의 이전은 취득자의 성명, 주소와 그 목적이 되는 출자좌수를 사원명부에 기재하지 아니하면 이로써 회사와 제3자에게 대항하지 못한다.","kind":"L"},{"id":"L:558","label":"법 제558조","title":"지분의 공유","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제558조(지분의 공유) 제333조의 규정은 지분이 수인의 공유에 속하는 경우에 준용한다.","kind":"L"},{"id":"L:559","label":"법 제559조","title":"지분의 입질","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①지분은 질권의 목적으로 할 수 있다.\n②제556조와 제557조의 규정은 지분의 입질에 준용한다.\n제559조(지분의 입질)","kind":"L"},{"id":"L:560","label":"법 제560조","title":"준용규정","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"① 사원의 지분에 대하여는 제339조, 제340조제1항ㆍ제2항, 제341조의2, 제341조의3, 제342조 및 제343조제1항을 준용한다. <개정 2011.4.14>\n②제353조의 규정은 사원에 대한 통지 또는 최고에 준용한다.\n제560조(준용규정)","kind":"L"},{"id":"L:561","label":"법 제561조","title":"이사","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제561조(이사) 유한회사에는 1인 또는 수인의 이사를 두어야 한다.","kind":"L"},{"id":"L:562","label":"법 제562조","title":"회사대표","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①이사는 회사를 대표한다.\n②이사가 수인인 경우에 정관에 다른 정함이 없으면 사원총회에서 회사를 대표할 이사를 선정하여야 한다.\n③정관 또는 사원총회는 수인의 이사가 공동으로 회사를 대표할 것을 정할 수 있다.\n④제208조제2항의 규정은 전항의 경우에 준용한다.\n제562조(회사대표)","kind":"L"},{"id":"L:563","label":"법 제563조","title":"이사, 회사간의 소에 관한 대표","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제563조(이사, 회사간의 소에 관한 대표) 회사가 이사에 대하여 또는 이사가 회사에 대하여 소를 제기하는 경우에는 사원총회는 그 소에 관하여 회사를 대표할 자를 선정하여야 한다.","kind":"L"},{"id":"L:564","label":"법 제564조","title":"업무집행의 결정, 이사와 회사간의 거래","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①이사가 수인인 경우에 정관에 다른 정함이 없으면 회사의 업무집행, 지배인의 선임 또는 해임과 지점의 설치ㆍ이전 또는 폐지는 이사 과반수의 결의에 의하여야 한다. <개정 1984.4.10>\n②사원총회는 제1항의 규정에 불구하고 지배인의 선임 또는 해임을 할 수 있다. <개정 1984.4.10>\n③이사는 감사가 있는 때에는 그 승인이, 감사가 없는 때에는 사원총회의 승인이 있는 때에 한하여 자기 또는 제3자의 계산으로 회사와 거래를 할 수 있다. 이 경우에는 민법 제124조의 규정을 적용하지 아니한다. <신설 1962.12.12>\n제564조(업무집행의 결정, 이사와 회사간의 거래)","kind":"L"},{"id":"L:564-2","label":"법 제564조의2","title":"유지청구권","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제564조의2(유지청구권) 이사가 법령 또는 정관에 위반한 행위를 하여 이로 인하여 회사에 회복할 수 없는 손해가 생길 염려가 있는 경우에는 감사 또는 자본금 총액의 100분의 3 이상에 해당하는 출자좌수를 가진 사원은 회사를 위하여 이사에 대하여 그 행위를 유지할 것을 청구할 수 있다. <개정 2011.4.14>","kind":"L"},{"id":"L:565","label":"법 제565조","title":"사원의 대표소송","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①자본금 총액의 100분의 3 이상에 해당하는 출자좌수를 가진 사원은 회사에 대하여 이사의 책임을 추궁할 소의 제기를 청구할 수 있다. <개정 1999.12.31, 2011.4.14>\n②제403조제2항 내지 제7항과 제404조 내지 제406조의 규정은 제1항의 경우에 준용한다. <개정 1998.12.28>\n제565조(사원의 대표소송)","kind":"L"},{"id":"L:566","label":"법 제566조","title":"서류의 비치, 열람","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①이사는 정관과 사원총회의 의사록을 본점과 지점에, 사원명부를 본점에 비치하여야 한다.\n②사원명부에는 사원의 성명, 주소와 그 출자좌수를 기재하여야 한다.\n③사원과 회사채권자는 영업시간 내에 언제든지 제1항에 게기한 서류의 열람 또는 등사를 청구할 수 있다.\n제566조(서류의 비치, 열람)","kind":"L"},{"id":"L:567","label":"법 제567조","title":"준용규정","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제567조(준용규정) 제209조, 제210조, 제382조, 제385조, 제386조, 제388조, 제395조, 제397조, 제399조 내지 제401조, 제407조와 제408조의 규정은 유한회사의 이사에 준용한다. 이 경우 제397조의 \"이사회\"는 이를 \"사원총회\"로 한다. <개정 1962.12.12, 1998.12.28, 1999.12.31>","kind":"L"},{"id":"L:568","label":"법 제568조","title":"감사","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①유한회사는 정관에 의하여 1인 또는 수인의 감사를 둘 수 있다.\n②제547조의 규정은 정관에서 감사를 두기로 정한 경우에 준용한다.\n제568조(감사)","kind":"L"},{"id":"L:569","label":"법 제569조","title":"감사의 권한","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제569조(감사의 권한) 감사는 언제든지 회사의 업무와 재산상태를 조사할 수 있고 이사에 대하여 영업에 관한 보고를 요구할 수 있다.","kind":"L"},{"id":"L:570","label":"법 제570조","title":"준용규정","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제570조(준용규정) 제382조, 제385조제1항, 제386조, 제388조, 제400조, 제407조, 제411조, 제413조, 제414조와 제565조의 규정은 감사에 준용한다.","kind":"L"},{"id":"L:571","label":"법 제571조","title":"사원총회의 소집","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"① 사원총회는 이 법에서 달리 규정하는 경우 외에는 이사가 소집한다. 그러나 임시총회는 감사도 소집할 수 있다.\n② 사원총회를 소집할 때에는 사원총회일의 1주 전에 각 사원에게 서면으로 통지서를 발송하거나 각 사원의 동의를 받아 전자문서로 통지서를 발송하여야 한다.\n③ 사원총회의 소집에 관하여는 제363조제2항 및 제364조를 준용한다.\n제571조(사원총회의 소집)","kind":"L"},{"id":"L:572","label":"법 제572조","title":"소수사원에 의한 총회소집청구","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①자본금 총액의 100분의 3 이상에 해당하는 출자좌수를 가진 사원은 회의의 목적사항과 소집의 이유를 기재한 서면을 이사에게 제출하여 총회의 소집을 청구할 수 있다. <개정 1999.12.31, 2011.4.14>\n②전항의 규정은 정관으로 다른 정함을 할 수 있다.\n③제366조제2항과 제3항의 규정은 제1항의 경우에 준용한다.\n제572조(소수사원에 의한 총회소집청구)","kind":"L"},{"id":"L:573","label":"법 제573조","title":"소집절차의 생략","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제573조(소집절차의 생략) 총사원의 동의가 있을 때에는 소집절차없이 총회를 열 수 있다.","kind":"L"},{"id":"L:574","label":"법 제574조","title":"총회의 정족수, 결의방법","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제574조(총회의 정족수, 결의방법) 사원총회의 결의는 정관 또는 본법에 다른 규정이 있는 경우 외에는 총사원의 의결권의 과반수를 가지는 사원이 출석하고 그 의결권의 과반수로써 하여야 한다.","kind":"L"},{"id":"L:575","label":"법 제575조","title":"사원의 의결권","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제575조(사원의 의결권) 각 사원은 출자1좌마다 1개의 의결권을 가진다. 그러나 정관으로 의결권의 수에 관하여 다른 정함을 할 수 있다.","kind":"L"},{"id":"L:576","label":"법 제576조","title":"유한회사의 영업양도 등에 특별결의를 받아야 할 사항","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"① 유한회사가 제374조제1항제1호부터 제3호까지의 규정에 해당되는 행위를 하려면 제585조에 따른 총회의 결의가 있어야 한다. <개정 2011.4.14>\n②전항의 규정은 유한회사가 그 성립후 2년내에 성립전으로부터 존재하는 재산으로서 영업을 위하여 계속하여 사용할 것을 자본금의 20분의 1 이상에 상당한 대가로 취득하는 계약을 체결하는 경우에 준용한다. <개정 2011.4.14>\n제576조(유한회사의 영업양도 등에 특별결의를 받아야 할 사항)","kind":"L"},{"id":"L:577","label":"법 제577조","title":"서면에 의한 결의","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①총회의 결의를 하여야 할 경우에 총사원의 동의가 있는 때에는 서면에 의한 결의를 할 수 있다.\n②결의의 목적사항에 대하여 총사원이 서면으로 동의를 한 때에는 서면에 의한 결의가 있은 것으로 본다.\n③서면에 의한 결의는 총회의 결의와 동일한 효력이 있다.\n④총회에 관한 규정은 서면에 의한 결의에 준용한다.\n제577조(서면에 의한 결의)","kind":"L"},{"id":"L:578","label":"법 제578조","title":"준용규정","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제578조(준용규정) 제365조, 제367조, 제368조제2항ㆍ제3항, 제369조제2항, 제371조제2항, 제372조, 제373조와 제376조 내지 제381조의 규정은 사원총회에 준용한다. <개정 2014.5.20>","kind":"L"},{"id":"L:579","label":"법 제579조","title":"재무제표의 작성","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①이사는 매결산기에 다음의 서류와 그 부속명세서를 작성하여야 한다. <개정 2011.4.14>\n1. 대차대조표\n2. 손익계산서\n3. 그 밖에 회사의 재무상태와 경영성과를 표시하는 것으로서 제447조제1항제3호에 따른 서류\n②감사가 있는 때에는 이사는 정기총회회일로부터 4주간전에 제1항의 서류를 감사에게 제출하여야 한다.\n③감사는 제2항의 서류를 받은 날로부터 3주간내에 감사보고서를 이사에게 제출하여야 한다.\n제579조(재무제표의 작성)","kind":"L"},{"id":"L:579-2","label":"법 제579조의2","title":"영업보고서의 작성","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①이사는 매결산기에 영업보고서를 작성하여야 한다.\n②제579조제2항 및 제3항의 규정은 제1항의 영업보고서에 관하여 이를 준용한다.\n제579조의2(영업보고서의 작성)","kind":"L"},{"id":"L:579-3","label":"법 제579조의3","title":"재무제표등의 비치ㆍ공시","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①이사는 정기총회회일의 1주간전부터 5년간 제579조 및 제579조의2의 서류와 감사보고서를 본점에 비치하여야 한다.\n②제448조제2항의 규정은 제1항의 서류에 관하여 이를 준용한다.\n제579조의3(재무제표등의 비치ㆍ공시)","kind":"L"},{"id":"L:580","label":"법 제580조","title":"이익배당의 기준","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제580조(이익배당의 기준) 이익의 배당은 정관에 다른 정함이 있는 경우 외에는 각사원의 출자좌수에 따라 하여야 한다.","kind":"L"},{"id":"L:581","label":"법 제581조","title":"사원의 회계장부열람권","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①자본금의 100분의 3 이상에 해당하는 출자좌수를 가진 사원은 회계의 장부와 서류의 열람 또는 등사를 청구할 수 있다. <개정 1999.12.31, 2011.4.14>\n②회사는 정관으로 각 사원이 제1항의 청구를 할 수 있다는 뜻을 정할 수 있다. 이 경우 제579조제1항의 규정에 불구하고 부속명세서는 이를 작성하지 아니한다. <개정 1984.4.10>\n제581조(사원의 회계장부열람권)","kind":"L"},{"id":"L:582","label":"법 제582조","title":"업무, 재산상태의 검사","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①회사의 업무집행에 관하여 부정행위 또는 법령이나 정관에 위반한 중대한 사유가 있는 때에는 자본금 총액의 100분의 3 이상에 해당하는 출자좌수를 가진 사원은 회사의 업무와 재산상태를 조사하게 하기 위하여 법원에 검사인의 선임을 청구할 수 있다. <개정 1999.12.31, 2011.4.14>\n②검사인은 그 조사의 결과를 서면으로 법원에 보고하여야 한다.\n③법원은 전항의 보고서에 의하여 필요하다고 인정한 경우에는 감사가 있는 때에는 감사에게, 감사가 없는 때에는 이사에게 사원총회의 소집을 명할 수 있다. 제310조제2항의 규정은 이 경우에 준용한다. <개정 1962.12.12>\n제582조(업무, 재산상태의 검사)","kind":"L"},{"id":"L:583","label":"법 제583조","title":"준용규정","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"① 유한회사의 계산에 대하여는 제449조제1항ㆍ제2항, 제450조, 제458조부터 제460조까지, 제462조, 제462조의3 및 제466조를 준용한다. <개정 2011.4.14>\n②제468조의 규정은 유한회사와 피용자간에 고용관계로 인하여 생긴 채권에 준용한다. <개정 1999.12.31>\n제583조(준용규정)","kind":"L"},{"id":"L:584","label":"법 제584조","title":"정관변경의 방법","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제584조(정관변경의 방법) 정관을 변경함에는 사원총회의 결의가 있어야 한다.","kind":"L"},{"id":"L:585","label":"법 제585조","title":"정관변경의 특별결의","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①전조의 결의는 총사원의 반수 이상이며 총사원의 의결권의 4분의 3 이상을 가지는 자의 동의로 한다.\n②전항의 규정을 적용함에 있어서는 의결권을 행사할 수 없는 사원은 이를 총사원의 수에, 그 행사할 수 없는 의결권은 이를 의결권의 수에 산입하지 아니한다.\n제585조(정관변경의 특별결의)","kind":"L"},{"id":"L:586","label":"법 제586조","title":"자본금 증가의 결의","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"1. 현물출자를 하는 자의 성명과 그 목적인 재산의 종류, 수량, 가격과 이에 대하여 부여할 출자좌수\n2. 자본금 증가 후에 양수할 것을 약정한 재산의 종류, 수량, 가격과 그 양도인의 성명\n3. 증가할 자본금에 대한 출자의 인수권을 부여할 자의 성명과 그 권리의 내용\n제586조(자본금 증가의 결의) 다음 각 호의 사항은 정관에 다른 정함이 없더라도 자본금 증가의 결의에서 정할 수 있다.","kind":"L"},{"id":"L:587","label":"법 제587조","title":"자본금 증가의 경우의 출자인수권의 부여","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제587조(자본금 증가의 경우의 출자인수권의 부여) 유한회사가 특정한 자에 대하여 장래 그 자본금을 증가할 때 출자의 인수권을 부여할 것을 약속하는 경우에는 제585조에서 정하는 결의에 의하여야 한다.","kind":"L"},{"id":"L:588","label":"법 제588조","title":"사원의 출자인수권","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제588조(사원의 출자인수권) 사원은 증가할 자본금에 대하여 그 지분에 따라 출자를 인수할 권리가 있다. 그러나 전2조의 결의에서 출자의 인수자를 정한 때에는 그러하지 아니하다. <개정 2011.4.14>","kind":"L"},{"id":"L:589","label":"법 제589조","title":"출자인수의 방법","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①자본금 증가의 경우에 출자의 인수를 하고자 하는 자는 인수를 증명하는 서면에 그 인수할 출자의 좌수와 주소를 기재하고 기명날인 또는 서명하여야 한다. <개정 1995.12.29, 2011.4.14>\n②유한회사는 광고 기타의 방법에 의하여 인수인을 공모하지 못한다.\n제589조(출자인수의 방법)","kind":"L"},{"id":"L:590","label":"법 제590조","title":"출자인수인의 지위","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제590조(출자인수인의 지위) 자본금 증가의 경우에 출자의 인수를 한 자는 출자의 납입의 기일 또는 현물출자의 목적인 재산의 급여의 기일로부터 이익배당에 관하여 사원과 동일한 권리를 가진다. <개정 2011.4.14>","kind":"L"},{"id":"L:591","label":"법 제591조","title":"자본금 증가의 등기","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제591조(자본금 증가의 등기) 유한회사는 자본금 증가로 인한 출자 전액의 납입 또는 현물출자의 이행이 완료된 날부터 2주 내에 본점소재지에서 자본금 증가로 인한 변경등기를 하여야 한다.","kind":"L"},{"id":"L:592","label":"법 제592조","title":"자본금 증가의 효력발생","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제592조(자본금 증가의 효력발생) 자본금의 증가는 본점소재지에서 제591조의 등기를 함으로써 효력이 생긴다.","kind":"L"},{"id":"L:593","label":"법 제593조","title":"현물출자등에 관한 사원의 책임","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①제586조제1호와 제2호의 재산의 자본금 증가당시의 실가가 자본금 증가의 결의에 의하여 정한 가격에 현저하게 부족한 때에는 그 결의에 동의한 사원은 회사에 대하여 그 부족액을 연대하여 지급할 책임이 있다. <개정 2011.4.14>\n②제550조제2항과 제551조제2항의 규정은 전항의 경우에 준용한다. <개정 1962.12.12>\n제593조(현물출자등에 관한 사원의 책임)","kind":"L"},{"id":"L:594","label":"법 제594조","title":"미인수출자 등에 관한 이사 등의 책임","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①자본금 증가후에 아직 인수되지 아니한 출자가 있는 때에는 이사와 감사가 공동으로 이를 인수한 것으로 본다. <개정 1962.12.12, 2011.4.14>\n②자본금 증가후에 아직 출자전액의 납입 또는 현물출자의 목적인 재산의 급여가 미필된 출자가 있는 때에는 이사와 감사는 연대하여 그 납입 또는 급여미필재산의 가액을 지급할 책임이 있다. <개정 1962.12.12, 2011.4.14>\n③제551조제3항의 규정은 전항의 경우에 준용한다. <개정 1962.12.12>\n제594조(미인수출자 등에 관한 이사 등의 책임)","kind":"L"},{"id":"L:595","label":"법 제595조","title":"증자무효의 소","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①자본금 증가의 무효는 사원, 이사 또는 감사에 한하여 제591조의 규정에 의한 본점소재지에서의 등기를 한 날로부터 6월내에 소만으로 이를 주장할 수 있다. <개정 1962.12.12, 2011.4.14>\n②제430조 내지 제432조의 규정은 전항의 경우에 준용한다.\n제595조(증자무효의 소)","kind":"L"},{"id":"L:596","label":"법 제596조","title":"준용규정","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제596조(준용규정) 제421조제2항, 제548조와 제576조제2항의 규정은 자본금 증가의 경우에 준용한다. <개정 1962.12.12, 2011.4.14>","kind":"L"},{"id":"L:597","label":"법 제597조","title":"동전","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제597조(동전) 제439조제1항, 제2항, 제443조, 제445조와 제446조의 규정은 자본금감소의 경우에 준용한다. <개정 2011.4.14>","kind":"L"},{"id":"L:598","label":"법 제598조","title":"합병의 방법","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제598조(합병의 방법) 유한회사가 다른 회사와 합병을 함에는 제585조의 규정에 의한 사원총회의 결의가 있어야 한다.","kind":"L"},{"id":"L:599","label":"법 제599조","title":"설립위원의 선임","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제599조(설립위원의 선임) 제175조의 규정에 의한 설립위원의 선임은 제585조의 규정에 의한 사원총회의 결의에 의하여야 한다.","kind":"L"},{"id":"L:600","label":"법 제600조","title":"유한회사와 주식회사의 합병","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①유한회사가 주식회사와 합병하는 경우에 합병후 존속하는 회사 또는 합병으로 인하여 설립되는 회사가 주식회사인 때에는 법원의 인가를 얻지 아니하면 합병의 효력이 없다.\n②합병을 하는 회사의 일방이 사채의 상환을 완료하지 아니한 주식회사인 때에는 합병후 존속하는 회사 또는 합병으로 인하여 설립되는 회사는 유한회사로 하지 못한다.\n제600조(유한회사와 주식회사의 합병)","kind":"L"},{"id":"L:601","label":"법 제601조","title":"물상대위","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①유한회사가 주식회사와 합병하는 경우에 합병후 존속하는 회사 또는 합병으로 인하여 설립되는 회사가 유한회사인 때에는 제339조의 규정은 종전의 주식을 목적으로 하는 질권에 준용한다.\n②전항의 경우에 질권의 목적인 지분에 관하여 출자좌수와 질권자의 성명 및 주소를 사원명부에 기재하지 아니하면 그 질권으로써 회사 기타의 제3자에 대항하지 못한다.\n제601조(물상대위)","kind":"L"},{"id":"L:602","label":"법 제602조","title":"합병의 등기","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제602조(합병의 등기) 유한회사가 합병을 한 때에는 제603조에서 준용하는 제526조 또는 제527조에 따른 사원총회가 종결된 날부터 2주일 내에 본점의 소재지에서 합병 후 존속하는 유한회사의 변경등기, 합병으로 인하여 소멸하는 유한회사의 해산등기, 합병으로 인하여 설립되는 유한회사의 설립등기를 하여야 한다.","kind":"L"},{"id":"L:603","label":"법 제603조","title":"준용규정","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제603조(준용규정) 제232조, 제234조, 제235조, 제237조 내지 제240조, 제443조, 제522조제1항ㆍ제2항, 제522조의2, 제523조, 제524조, 제526조제1항ㆍ제2항, 제527조제1항 내지 제3항 및 제529조의 규정은 유한회사의 합병의 경우에 준용한다. <개정 1962.12.12, 1984.4.10, 1998.12.28>","kind":"L"},{"id":"L:604","label":"법 제604조","title":"주식회사의 유한회사에의 조직변경","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①주식회사는 총주주의 일치에 의한 총회의 결의로 그 조직을 변경하여 이를 유한회사로 할 수 있다. 그러나 사채의 상환을 완료하지 아니한 경우에는 그러하지 아니하다.\n②전항의 조직변경의 경우에는 회사에 현존하는 순재산액보다 많은 금액을 자본금의 총액으로 하지 못한다. <개정 2011.4.14>\n③제1항의 결의에 있어서는 정관 기타 조직변경에 필요한 사항을 정하여야 한다.\n④제601조의 규정은 제1항의 조직변경의 경우에 준용한다.\n제604조(주식회사의 유한회사에의 조직변경)","kind":"L"},{"id":"L:605","label":"법 제605조","title":"이사, 주주의 순재산액전보책임","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①전조의 조직변경의 경우에 회사에 현존하는 순재산액이 자본금의 총액에 부족하는 때에는 전조제1항의 결의당시의 이사와 주주는 회사에 대하여 연대하여 그 부족액을 지급할 책임이 있다. <개정 2011.4.14>\n②제550조제2항과 제551조제2항, 제3항의 규정은 전항의 경우에 준용한다. <개정 1962.12.12>\n제605조(이사, 주주의 순재산액전보책임)","kind":"L"},{"id":"L:606","label":"법 제606조","title":"조직변경의 등기","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제606조(조직변경의 등기) 주식회사가 제604조에 따라 그 조직을 변경한 때에는 본점의 소재지에서 2주일 내에 주식회사의 해산등기, 유한회사의 설립등기를 하여야 한다.","kind":"L"},{"id":"L:607","label":"법 제607조","title":"유한회사의 주식회사로의 조직변경","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"① 유한회사는 총사원의 일치에 의한 총회의 결의로 주식회사로 조직을 변경할 수 있다. 다만, 회사는 그 결의를 정관으로 정하는 바에 따라 제585조의 사원총회의 결의로 할 수 있다.\n② 제1항에 따라 조직을 변경할 때 발행하는 주식의 발행가액의 총액은 회사에 현존하는 순재산액을 초과하지 못한다.\n③ 제1항의 조직변경은 법원의 인가를 받지 아니하면 효력이 없다.\n④ 제1항에 따라 조직을 변경하는 경우 회사에 현존하는 순재산액이 조직변경으로 발행하는 주식의 발행가액 총액에 부족할 때에는 제1항의 결의 당시의 이사, 감사 및 사원은 연대하여 회사에 그 부족액을 지급할 책임이 있다. 이 경우에 제550조제2항 및 제551조제2항ㆍ제3항을 준용한다.\n⑤ 제1항에 따라 조직을 변경하는 경우 제340조제3항, 제601조제1항, 제604조제3항 및 제606조를 준용한다.\n제607조(유한회사의 주식회사로의 조직변경)","kind":"L"},{"id":"L:608","label":"법 제608조","title":"준용규정","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제608조(준용규정) 제232조의 규정은 제604조와 제607조의 조직변경의 경우에 준용한다. <개정 1984.4.10>","kind":"L"},{"id":"L:609","label":"법 제609조","title":"해산사유","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①유한회사는 다음의 사유로 인하여 해산한다. <개정 2001.7.24>\n1. 제227조제1호ㆍ제4호 내지 제6호에 규정된 사유\n2. 사원총회의 결의\n②전항제2호의 결의는 제585조의 규정에 의하여야 한다.\n제609조(해산사유)","kind":"L"},{"id":"L:610","label":"법 제610조","title":"회사의 계속","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①제227조제1호 또는 전조제1항제2호의 사유로 인하여 회사가 해산한 경우에는 제585조의 규정에 의한 사원총회의 결의로써 회사를 계속할 수 있다.\n② 삭제 <2001.7.24>\n제610조(회사의 계속)","kind":"L"},{"id":"L:611","label":"법 제611조","title":"준용규정","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제611조(준용규정) 제229조제3항의 규정은 전조의 회사 계속의 경우에 준용한다.","kind":"L"},{"id":"L:612","label":"법 제612조","title":"잔여재산의 분배","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"제612조(잔여재산의 분배) 잔여재산은 정관에 다른 정함이 있는 경우 외에는 각사원의 출자좌수에 따라 사원에게 분배하여야 한다.","kind":"L"},{"id":"L:613","label":"법 제613조","title":"준용규정","chapter":"제3편 회사 제5장 유한회사","deleted":false,"text":"①제228조, 제245조, 제252조 내지 제255조, 제259조, 제260조, 제264조, 제520조, 제531조 내지 제537조, 제540조와 제541조의 규정은 유한회사에 준용한다. <개정 1962.12.12>\n②제209조, 제210조, 제366조제2항ㆍ제3항, 제367조, 제373조제2항, 제376조, 제377조, 제382조제2항, 제386조, 제388조, 제399조 내지 제402조, 제407조, 제408조, 제411조 내지 제413조, 제414조제3항, 제450조, 제466조제2항, 제539조, 제562조, 제563조, 제564조제3항, 제565조, 제566조, 제571조, 제572조제1항과 제581조의 규정은 유한회사의 청산인에 준용한다. <개정 1962.12.12, 1984.4.10>\n제613조(준용규정)","kind":"L"},{"id":"L:614","label":"법 제614조","title":"대표자, 영업소의 설정과 등기","chapter":"제3편 회사 제6장 외국회사","deleted":false,"text":"① 외국회사가 대한민국에서 영업을 하려면 대한민국에서의 대표자를 정하고 대한민국 내에 영업소를 설치하거나 대표자 중 1명 이상이 대한민국에 그 주소를 두어야 한다. <개정 2011.4.14>\n② 외국회사가 제1항의 영업소를 설치하는 경우에는 그 설치일부터 3주일 내에 영업소의 소재지에서 다음 각 호의 사항을 등기하여야 한다. <개정 2024.9.20>\n1. 목적\n2. 상호\n3. 회사를 대표할 자의 성명ㆍ주소 및 주민등록번호(외국인인 경우 외국인등록번호로 하되, 외국인등록번호가 없는 경우에는 생년월일로 한다)\n4. 공동으로 회사를 대표할 것을 정한 때에는 그 규정\n5. 본점의 소재지\n6. 영업소의 소재지(다른 영업소의 소재지는 제외한다)\n7. 회사의 존립기간 내지 해산사유를 정한 때에는 그 기간 또는 사유\n8. 대한민국에서의 같은 종류의 회사 또는 가장 비슷한 회사가 주식회사인 경우에는 본국에서의 공고방법 및 제616조의2에 따른 대한민국에서의 공고방법\n③ 제2항의 등기에는 회사설립의 준거법과 대한민국에서의 대표자의 성명ㆍ주소 및 주민등록번호(외국인인 경우 외국인등록번호로 하되, 외국인등록번호가 없는 경우에는 생년월일로 한다)가 포함되어야 한다. <개정 2024.9.20>\n④제209조와 제210조의 규정은 외국회사의 대표자에게 준용한다. <개정 1962.12.12>\n제614조(대표자, 영업소의 설정과 등기)","kind":"L"},{"id":"L:614-2","label":"법 제614조의2","title":"영업소의 이전ㆍ변경등기","chapter":"제3편 회사 제6장 외국회사","deleted":false,"text":"① 외국회사가 영업소를 이전한 경우에는 3주일 내에 종전 소재지에서는 새 소재지와 이전 연월일을, 새 소재지에서는 제614조제2항 및 제3항의 사항을 등기하여야 한다.\n② 제614조제2항 또는 제3항의 사항이 변경되었을 때에는 영업소의 소재지에서 3주일 내에 변경등기를 하여야 한다.\n제614조의2(영업소의 이전ㆍ변경등기)","kind":"L"},{"id":"L:615","label":"법 제615조","title":"등기기간의 기산점","chapter":"제3편 회사 제6장 외국회사","deleted":false,"text":"제615조(등기기간의 기산점) 제614조제2항ㆍ제3항 및 제614조의2의 등기사항이 외국에서 발생한 경우 등기기간은 그 통지가 도달한 날부터 기산한다.","kind":"L"},{"id":"L:616","label":"법 제616조","title":"등기전의 계속거래의 금지","chapter":"제3편 회사 제6장 외국회사","deleted":false,"text":"①외국회사는 그 영업소의 소재지에서 제614조의 규정에 의한 등기를 하기 전에는 계속하여 거래를 하지 못한다.\n②전항의 규정에 위반하여 거래를 한 자는 그 거래에 대하여 회사와 연대하여 책임을 진다.\n제616조(등기전의 계속거래의 금지)","kind":"L"},{"id":"L:616-2","label":"법 제616조의2","title":"대차대조표 또는 이에 상당하는 것의 공고","chapter":"제3편 회사 제6장 외국회사","deleted":false,"text":"① 외국회사로서 이 법에 따라 등기를 한 외국회사(대한민국에서의 같은 종류의 회사 또는 가장 비슷한 회사가 주식회사인 것만 해당한다)는 제449조에 따른 승인과 같은 종류의 절차 또는 이와 비슷한 절차가 종결된 후 지체 없이 대차대조표 또는 이에 상당하는 것으로서 대통령령으로 정하는 것을 대한민국에서 공고하여야 한다.\n② 제1항의 공고에 대하여는 제289조제3항부터 제6항까지의 규정을 준용한다.\n제616조의2(대차대조표 또는 이에 상당하는 것의 공고)","kind":"L"},{"id":"L:617","label":"법 제617조","title":"유사외국회사","chapter":"제3편 회사 제6장 외국회사","deleted":false,"text":"제617조(유사외국회사) 외국에서 설립된 회사라도 대한민국에 그 본점을 설치하거나 대한민국에서 영업할 것을 주된 목적으로 하는 때에는 대한민국에서 설립된 회사와 같은 규정에 따라야 한다.","kind":"L"},{"id":"L:618","label":"법 제618조","title":"준용규정","chapter":"제3편 회사 제6장 외국회사","deleted":false,"text":"①제335조, 제335조의2부터 제335조의7까지, 제336조부터 제338조까지, 제340조제1항, 제355조, 제356조, 제356조의2, 제478조제1항, 제479조 및 제480조의 규정은 대한민국에서의 외국회사의 주권 또는 채권의 발행과 그 주식의 이전이나 입질 또는 사채의 이전에 준용한다. <개정 2014.5.20>\n②전항의 경우에는 처음 대한민국에 설치한 영업소를 본점으로 본다.\n제618조(준용규정)","kind":"L"},{"id":"L:619","label":"법 제619조","title":"영업소폐쇄명령","chapter":"제3편 회사 제6장 외국회사","deleted":false,"text":"①외국회사가 대한민국에 영업소를 설치한 경우에 다음의 사유가 있는 때에는 법원은 이해관계인 또는 검사의 청구에 의하여 그 영업소의 폐쇄를 명할 수 있다. <개정 1962.12.12>\n1. 영업소의 설치목적이 불법한 것인 때\n2. 영업소의 설치등기를 한 후 정당한 사유없이 1년내에 영업을 개시하지 아니하거나 1년 이상 영업을 휴지한 때 또는 정당한 사유없이 지급을 정지한 때\n3. 회사의 대표자 기타 업무를 집행하는 자가 법령 또는 선량한 풍속 기타 사회질서에 위반한 행위를 한 때\n②제176조제2항 내지 제4항의 규정은 전항의 경우에 준용한다.\n제619조(영업소폐쇄명령)","kind":"L"},{"id":"L:620","label":"법 제620조","title":"한국에 있는 재산의 청산","chapter":"제3편 회사 제6장 외국회사","deleted":false,"text":"①전조제1항의 규정에 의하여 영업소의 폐쇄를 명한 경우에는 법원은 이해관계인의 신청에 의하여 또는 직권으로 대한민국에 있는 그 회사재산의 전부에 대한 청산의 개시를 명할 수 있다. 이 경우에는 법원은 청산인을 선임하여야 한다.\n②제535조 내지 제537조와 제542조의 규정은 그 성질이 허하지 아니하는 경우 외에는 전항의 청산에 준용한다.\n③전2항의 규정은 외국회사가 스스로 영업소를 폐쇄한 경우에 준용한다.\n제620조(한국에 있는 재산의 청산)","kind":"L"},{"id":"L:621","label":"법 제621조","title":"외국회사의 지위","chapter":"제3편 회사 제6장 외국회사","deleted":false,"text":"제621조(외국회사의 지위) 외국회사는 다른 법률의 적용에 있어서는 법률에 다른 규정이 있는 경우 외에는 대한민국에서 성립된 동종 또는 가장 유사한 회사로 본다.","kind":"L"},{"id":"L:622","label":"법 제622조","title":"발기인, 이사 기타의 임원등의 특별배임죄","chapter":"제3편 회사 제7장 벌칙","deleted":false,"text":"①회사의 발기인, 업무집행사원, 이사, 집행임원, 감사위원회 위원, 감사 또는 제386조제2항, 제407조제1항, 제415조 또는 제567조의 직무대행자, 지배인 기타 회사영업에 관한 어느 종류 또는 특정한 사항의 위임을 받은 사용인이 그 임무에 위배한 행위로써 재산상의 이익을 취하거나 제3자로 하여금 이를 취득하게 하여 회사에 손해를 가한 때에는 10년 이하의 징역 또는 3천만원 이하의 벌금에 처한다. <개정 1984.4.10, 1995.12.29, 1999.12.31, 2011.4.14>\n②회사의 청산인 또는 제542조제2항의 직무대행자, 제175조의 설립위원이 제1항의 행위를 한 때에도 제1항과 같다. <개정 1984.4.10>\n제622조(발기인, 이사 기타의 임원등의 특별배임죄)","kind":"L"},{"id":"L:623","label":"법 제623조","title":"사채권자집회의 대표자 등의 특별배임죄","chapter":"제3편 회사 제7장 벌칙","deleted":false,"text":"제623조(사채권자집회의 대표자 등의 특별배임죄) 사채권자집회의 대표자 또는 그 결의를 집행하는 자가 그 임무에 위배한 행위로써 재산상의 이익을 취하거나 제3자로 하여금 이를 취득하게 하여 사채권자에게 손해를 가한 때에는 7년 이하의 징역 또는 2천만원 이하의 벌금에 처한다. <개정 1984.4.10, 1995.12.29>","kind":"L"},{"id":"L:624","label":"법 제624조","title":"특별배임죄의 미수","chapter":"제3편 회사 제7장 벌칙","deleted":false,"text":"제624조(특별배임죄의 미수) 전2조의 미수범은 처벌한다.","kind":"L"},{"id":"L:624-2","label":"법 제624조의2","title":"주요주주 등 이해관계자와의 거래 위반의 죄","chapter":"제3편 회사 제7장 벌칙","deleted":false,"text":"제624조의2(주요주주 등 이해관계자와의 거래 위반의 죄) 제542조의9제1항을 위반하여 신용공여를 한 자는 5년 이하의 징역 또는 2억원 이하의 벌금에 처한다.","kind":"L"},{"id":"L:625","label":"법 제625조","title":"회사재산을 위태롭게 하는 죄","chapter":"제3편 회사 제7장 벌칙","deleted":false,"text":"1. 주식 또는 출자의 인수나 납입, 현물출자의 이행, 제290조, 제416조제4호 또는 제544조에 규정된 사항에 관하여 법원ㆍ총회 또는 발기인에게 부실한 보고를 하거나 사실을 은폐한 때\n2. 누구의 명의로 하거나를 불문하고 회사의 계산으로 부정하게 그 주식 또는 지분을 취득하거나 질권의 목적으로 이를 받은 때\n3. 법령 또는 정관에 위반하여 이익배당을 한 때\n4. 회사의 영업범위외에서 투기행위를 하기 위하여 회사재산을 처분한 때\n제625조(회사재산을 위태롭게 하는 죄) 제622조제1항에 규정된 자, 검사인, 제298조제3항ㆍ제299조의2ㆍ제310조제3항 또는 제313조제2항의 공증인(인가공증인의 공증담당변호사를 포함한다. 이하 이 章에서 같다)이나 제299조의2, 제310조제3항 또는 제422조제1항의 감정인이 다음의 행위를 한 때에는 5년 이하의 징역 또는 1천500만 원 이하의 벌금에 처한다. <개정 2009.2.6, 2011.4.14>","kind":"L"},{"id":"L:625-2","label":"법 제625조의2","title":"주식의 취득제한 등에 위반한 죄","chapter":"제3편 회사 제7장 벌칙","deleted":false,"text":"1. 제342조의2제1항 또는 제2항을 위반한 자\n2. 제360조의3제7항을 위반한 자\n3. 제523조의2제2항을 위반한 자\n4. 제530조의6제5항을 위반한 자\n제625조의2(주식의 취득제한 등에 위반한 죄) 다음 각 호의 어느 하나에 해당하는 자는 2천만원 이하의 벌금에 처한다.","kind":"L"},{"id":"L:626","label":"법 제626조","title":"부실보고죄","chapter":"제3편 회사 제7장 벌칙","deleted":false,"text":"제626조(부실보고죄) 회사의 이사, 집행임원, 감사위원회 위원, 감사 또는 제386조제2항, 제407조제1항, 제415조 또는 제567조의 직무대행자가 제604조 또는 제607조의 조직변경의 경우에 제604조제2항 또는 제607조제2항의 순재산액에 관하여 법원 또는 총회에 부실한 보고를 하거나 사실을 은폐한 경우에는 5년 이하의 징역 또는 1천500만원 이하의 벌금에 처한다.","kind":"L"},{"id":"L:627","label":"법 제627조","title":"부실문서행사죄","chapter":"제3편 회사 제7장 벌칙","deleted":false,"text":"①제622조제1항에 게기한 자, 외국회사의 대표자, 주식 또는 사채의 모집의 위탁을 받은 자가 주식 또는 사채를 모집함에 있어서 중요한 사항에 관하여 부실한 기재가 있는 주식청약서, 사채청약서, 사업계획서, 주식 또는 사채의 모집에 관한 광고 기타의 문서를 행사한 때에는 5년 이하의 징역 또는 1천500만원 이하의 벌금에 처한다. <개정 1984.4.10, 1995.12.29>\n②주식 또는 사채를 매출하는 자가 그 매출에 관한 문서로서 중요한 사항에 관하여 부실한 기재가 있는 것을 행사한 때에도 제1항과 같다. <개정 1984.4.10>\n제627조(부실문서행사죄)","kind":"L"},{"id":"L:628","label":"법 제628조","title":"납입가장죄등","chapter":"제3편 회사 제7장 벌칙","deleted":false,"text":"①제622조제1항에 게기한 자가 납입 또는 현물출자의 이행을 가장하는 행위를 한 때에는 5년 이하의 징역 또는 1천500만원 이하의 벌금에 처한다. <개정 1984.4.10, 1995.12.29>\n②제1항의 행위에 응하거나 이를 중개한 자도 제1항과 같다. <개정 1984.4.10>\n제628조(납입가장죄등)","kind":"L"},{"id":"L:629","label":"법 제629조","title":"초과발행의 죄","chapter":"제3편 회사 제7장 벌칙","deleted":false,"text":"제629조(초과발행의 죄) 회사의 발기인, 이사, 집행임원 또는 제386조제2항 또는 제407조제1항의 직무대행자가 회사가 발행할 주식의 총수를 초과하여 주식을 발행한 경우에는 5년 이하의 징역 또는 1천500만원 이하의 벌금에 처한다.","kind":"L"},{"id":"L:630","label":"법 제630조","title":"발기인, 이사 기타의 임원의 독직죄","chapter":"제3편 회사 제7장 벌칙","deleted":false,"text":"①제622조와 제623조에 규정된 자, 검사인, 제298조제3항ㆍ제299조의2ㆍ제310조제3항 또는 제313조제2항의 공증인이나 제299조의2, 제310조제3항 또는 제422조제1항의 감정인이 그 직무에 관하여 부정한 청탁을 받고 재산상의 이익을 수수, 요구 또는 약속한 때에는 5년 이하의 징역 또는 1천500만원 이하의 벌금에 처한다. <개정 1984.4.10, 1995.12.29, 1998.12.28>\n②제1항의 이익을 약속, 공여 또는 공여의 의사를 표시한 자도 제1항과 같다. <개정 1984.4.10>\n제630조(발기인, 이사 기타의 임원의 독직죄)","kind":"L"},{"id":"L:631","label":"법 제631조","title":"권리행사방해 등에 관한 증수뢰죄","chapter":"제3편 회사 제7장 벌칙","deleted":false,"text":"①다음의 사항에 관하여 부정한 청탁을 받고 재산상의 이익을 수수, 요구 또는 약속한 자는 1년 이하의 징역 또는 300만원 이하의 벌금에 처한다. <개정 1962.12.12, 1984.4.10, 1995.12.29, 1998.12.28, 1999.12.31, 2011.4.14>\n1. 창립총회, 사원총회, 주주총회 또는 사채권자집회에서의 발언 또는 의결권의 행사\n2. 제3편에 정하는 소의 제기, 발행주식의 총수의 100분의 1 또는 100분의 3 이상에 해당하는 주주, 사채총액의 100분의 10 이상에 해당하는 사채권자 또는 자본금의 100분의 3 이상에 해당하는 출자좌수를 가진 사원의 권리의 행사\n3. 제402조 또는 제424조에 정하는 권리의 행사\n②제1항의 이익을 약속, 공여 또는 공여의 의사를 표시한 자도 제1항과 같다. <개정 1984.4.10>\n제631조(권리행사방해 등에 관한 증수뢰죄)","kind":"L"},{"id":"L:632","label":"법 제632조","title":"징역과 벌금의 병과","chapter":"제3편 회사 제7장 벌칙","deleted":false,"text":"제632조(징역과 벌금의 병과) 제622조 내지 전조의 징역과 벌금은 이를 병과할 수 있다.","kind":"L"},{"id":"L:633","label":"법 제633조","title":"몰수, 추징","chapter":"제3편 회사 제7장 벌칙","deleted":false,"text":"제633조(몰수, 추징) 제630조제1항 또는 제631조제1항의 경우에는 범인이 수수한 이익은 이를 몰수한다. 그 전부 또는 일부를 몰수하기 불능한 때에는 그 가액을 추징한다.","kind":"L"},{"id":"L:634","label":"법 제634조","title":"납입책임면탈의 죄","chapter":"제3편 회사 제7장 벌칙","deleted":false,"text":"제634조(납입책임면탈의 죄) 납입의 책임을 면하기 위하여 타인 또는 가설인의 명의로 주식 또는 출자를 인수한 자는 1년 이하의 징역 또는 300만원 이하의 벌금에 처한다. <개정 1984.4.10, 1995.12.29>","kind":"L"},{"id":"L:634-2","label":"법 제634조의2","title":"주주의 권리행사에 관한 이익공여의 죄","chapter":"제3편 회사 제7장 벌칙","deleted":false,"text":"① 주식회사의 이사, 집행임원, 감사위원회 위원, 감사, 제386조제2항ㆍ제407조제1항 또는 제415조의 직무대행자, 지배인, 그 밖의 사용인이 주주의 권리 행사와 관련하여 회사의 계산으로 재산상의 이익을 공여(供與)한 경우에는 1년 이하의 징역 또는 300만원 이하의 벌금에 처한다. <개정 2011.4.14>\n②제1항의 이익을 수수하거나, 제3자에게 이를 공여하게 한 자도 제1항과 같다.\n제634조의2(주주의 권리행사에 관한 이익공여의 죄)","kind":"L"},{"id":"L:634-3","label":"법 제634조의3","title":"양벌규정","chapter":"제3편 회사 제7장 벌칙","deleted":false,"text":"제634조의3(양벌규정) 회사의 대표자나 대리인, 사용인, 그 밖의 종업원이 그 회사의 업무에 관하여 제624조의2의 위반행위를 하면 그 행위자를 벌하는 외에 그 회사에도 해당 조문의 벌금형을 과(科)한다. 다만, 회사가 제542조의13에 따른 의무를 성실히 이행한 경우 등 회사가 그 위반행위를 방지하기 위하여 해당 업무에 관하여 상당한 주의와 감독을 게을리하지 아니한 경우에는 그러하지 아니하다. <개정 2011.4.14>","kind":"L"},{"id":"L:635","label":"법 제635조","title":"과태료에 처할 행위","chapter":"제3편 회사 제7장 벌칙","deleted":false,"text":"① 회사의 발기인, 설립위원, 업무집행사원, 업무집행자, 이사, 집행임원, 감사, 감사위원회 위원, 외국회사의 대표자, 검사인, 제298조제3항ㆍ제299조의2ㆍ제310조제3항 또는 제313조제2항의 공증인, 제299조의2ㆍ제310조제3항 또는 제422조제1항의 감정인, 지배인, 청산인, 명의개서대리인, 사채모집을 위탁받은 회사와 그 사무승계자 또는 제386조제2항ㆍ제407조제1항ㆍ제415조ㆍ제542조제2항 또는 제567조의 직무대행자가 다음 각 호의 어느 하나에 해당하는 행위를 한 경우에는 500만원 이하의 과태료를 부과한다. 다만, 그 행위에 대하여 형(刑)을 과(科)할 때에는 그러하지 아니하다. <개정 2011.4.14>\n1. 이 편(編)에서 정한 등기를 게을리한 경우\n2. 이 편에서 정한 공고 또는 통지를 게을리하거나 부정(不正)한 공고 또는 통지를 한 경우\n3. 이 편에서 정한 검사 또는 조사를 방해한 경우\n4. 이 편의 규정을 위반하여 정당한 사유 없이 서류의 열람 또는 등사, 등본 또는 초본의 발급을 거부한 경우\n5. 관청, 총회, 사채권자집회 또는 발기인에게 부실한 보고를 하거나 사실을 은폐한 경우\n6. 주권, 채권 또는 신주인수권증권에 적을 사항을 적지 아니하거나 부실하게 적은 경우\n7. 정당한 사유 없이 주권의 명의개서를 하지 아니한 경우\n8. 법률 또는 정관에서 정한 이사 또는 감사의 인원수를 궐(闕)한 경우에 그 선임절차를 게을리한 경우\n9. 정관ㆍ주주명부 또는 그 복본(複本), 사원명부ㆍ사채원부 또는 그 복본, 의사록, 감사록, 재산목록, 대차대조표, 영업보고서, 사무보고서, 손익계산서, 그 밖에 회사의 재무상태와 경영성과를 표시하는 것으로서 제287조의33 및 제447조제1항제3호에 따라 대통령령으로 정하는 서류, 결산보고서, 회계장부, 제447조ㆍ제534조ㆍ제579조제1항 또는 제613조제1항의 부속명세서 또는 감사보고서에 적을 사항을 적지 아니하거나 부실하게 적은 경우\n10. 법원이 선임한 청산인에 대한 사무의 인계(引繼)를 게을리하거나 거부한 경우\n11. 청산의 종결을 늦출 목적으로 제247조제3항, 제535조제1항 또는 제613조제1항의 기간을 부당하게 장기간으로 정한 경우\n12. 제254조제4항, 제542조제1항 또는 제613조제1항을 위반하여 파산선고 청구를 게을리한 경우\n13. 제589조제2항을 위반하여 출자의 인수인을 공모한 경우\n14. 제232조, 제247조제3항, 제439조제2항, 제527조의5, 제530조제2항, 제530조의9제4항, 제530조의11제2항, 제597조, 제603조 또는 제608조를 위반하여 회사의 합병ㆍ분할ㆍ분할합병 또는 조직변경, 회사재산의 처분 또는 자본금의 감소를 한 경우\n15. 제260조, 제542조제1항 또는 제613조제1항을 위반하여 회사재산을 분배한 경우\n16. 제302조제2항, 제347조, 제420조, 제420조의2, 제474조제2항 또는 제514조을 위반하여 주식청약서, 신주인수권증서 또는 사채청약서를 작성하지 아니하거나 이에 적을 사항을 적지 아니하거나 또는 부실하게 적은 경우\n17. 제342조 또는 제560조제1항을 위반하여 주식 또는 지분의 실효 절차, 주식 또는 지분의 질권 처분을 게을리한 경우\n18. 제343조제1항 또는 제560조제1항을 위반하여 주식 또는 출자를 소각한 경우\n19. 제355조제1항ㆍ제2항 또는 제618조를 위반하여 주권을 발행한 경우\n20. 제358조의2제2항을 위반하여 주주명부에 기재를 하지 아니한 경우\n21. 제363조의2제1항, 제542조제2항 또는 제542조의6제2항을 위반하여 주주가 제안한 사항을 주주총회의 목적사항으로 하지 아니한 경우\n22. 제365조제1항ㆍ제2항, 제578조, 제467조제3항, 제582조제3항에 따른 법원의 명령을 위반하여 주주총회를 소집하지 아니하거나, 정관으로 정한 곳 외의 장소에서 주주총회를 소집하거나, 제363조, 제364조, 제571조제2항ㆍ제3항을 위반하여 주주총회를 소집한 경우\n23. 제374조제2항, 제530조제2항 또는 제530조의11제2항을 위반하여 주식매수청구권의 내용과 행사방법을 통지 또는 공고하지 아니하거나 부실한 통지 또는 공고를 한 경우\n24. 제287조의34제1항, 제396조제1항, 제448조제1항, 제510조제2항, 제522조의2제1항, 제527조의6제1항, 제530조의7, 제534조제3항, 제542조제2항, 제566조제1항, 제579조의3, 제603조 또는 제613조를 위반하여 장부 또는 서류를 갖추어 두지 아니한 경우\n25. 제412조의5제3항을 위반하여 정당한 이유 없이 감사 또는 감사위원회의 조사를 거부한 경우\n26. 제458조부터 제460조까지 또는 제583조를 위반하여 준비금을 적립하지 아니하거나 이를 사용한 경우\n27. 제464조의2제1항의 기간에 배당금을 지급하지 아니한 경우\n28. 제478조제1항 또는 제618조를 위반하여 채권을 발행한 경우\n29. 제536조 또는 제613조제1항을 위반하여 채무 변제를 한 경우\n30. 제542조의5를 위반하여 이사 또는 감사를 선임한 경우\n31. 제555조를 위반하여 지분에 대한 지시식 또는 무기명식의 증권을 발행한 경우\n32. 제619조제1항에 따른 법원의 명령을 위반한 경우\n② 발기인, 이사 또는 집행임원이 주권의 인수로 인한 권리를 양도한 경우에도 제1항과 같다. <개정 2011.4.14>\n③ 제1항 각 호 외의 부분에 규정된 자가 다음 각 호의 어느 하나에 해당하는 행위를 한 경우에는 5천만원 이하의 과태료를 부과한다. <신설 2009.1.30, 2025.7.22>\n1. 제542조의8제1항을 위반하여 독립이사 선임의무를 이행하지 아니한 경우\n2. 제542조의8제4항을 위반하여 독립이사 후보추천위원회를 설치하지 아니하거나 독립이사가 총위원의 2분의 1 이상이 되도록 독립이사 후보추천위원회를 구성하지 아니한 경우\n3. 제542조의8제5항에 따라 독립이사를 선임하지 아니한 경우\n4. 제542조의9제3항을 위반하여 이사회 승인 없이 거래한 경우\n5. 제542조의11제1항을 위반하여 감사위원회를 설치하지 아니한 경우\n6. 제542조의11제2항을 위반하여 제415조의2제2항 및 제542조의11제2항 각 호의 감사위원회의 구성요건에 적합한 감사위원회를 설치하지 아니한 경우\n7. 제542조의11제4항제1호 및 제2호를 위반하여 감사위원회가 제415조의2제2항 및 제542조의11제2항 각 호의 감사위원회의 구성요건에 적합하도록 하지 아니한 경우\n8. 제542조의12제2항을 위반하여 감사위원회위원의 선임절차를 준수하지 아니한 경우\n④ 제1항 각 호 외의 부분에 규정된 자가 다음 각 호의 어느 하나에 해당하는 행위를 한 경우에는 1천만원 이하의 과태료를 부과한다. <신설 2009.1.30, 2025.9.9>\n1. 제542조의4에 따른 주주총회 소집의 통지ㆍ공고를 게을리하거나 부정한 통지 또는 공고를 한 경우\n2. 제542조의12제5항을 위반하여 의안을 별도로 상정하여 의결하지 아니한 경우\n제635조(과태료에 처할 행위)","kind":"L"},{"id":"L:636","label":"법 제636조","title":"등기전의 회사명의의 영업 등","chapter":"제3편 회사 제7장 벌칙","deleted":false,"text":"①회사의 성립전에 회사의 명의로 영업을 한 자는 회사설립의 등록세의 배액에 상당한 과태료에 처한다.\n②전항의 규정은 제616조제1항의 규정에 위반한 자에 준용한다.\n제636조(등기전의 회사명의의 영업 등)","kind":"L"},{"id":"L:637","label":"법 제637조","title":"법인에 대한 벌칙의 적용","chapter":"제3편 회사 제7장 벌칙","deleted":false,"text":"제637조(법인에 대한 벌칙의 적용) 제622조, 제623조, 제625조, 제627조, 제628조 또는 제630조제1항에 규정된 자가 법인인 경우에는 이 장의 벌칙은 그 행위를 한 이사, 집행임원, 감사, 그 밖에 업무를 집행한 사원 또는 지배인에게 적용한다.","kind":"L"},{"id":"L:637-2","label":"법 제637조의2","title":"과태료의 부과ㆍ징수","chapter":"제3편 회사 제7장 벌칙","deleted":false,"text":"① 제635조(제1항제1호는 제외한다) 또는 제636조에 따른 과태료는 대통령령으로 정하는 바에 따라 법무부장관이 부과ㆍ징수한다.\n② 제1항에 따른 과태료 처분에 불복하는 자는 그 처분을 고지받은 날부터 60일 이내에 법무부장관에게 이의를 제기할 수 있다.\n③ 제1항에 따른 과태료 처분을 받은 자가 제2항에 따라 이의를 제기한 때에는 법무부장관은 지체 없이 관할 법원에 그 사실을 통보하여야 하며, 그 통보를 받은 관할 법원은 「비송사건절차법」에 따른 과태료 재판을 한다.\n④ 제2항에서 규정하는 기간 내에 이의를 제기하지 아니하고 과태료를 납부하지 아니한 때에는 국세 체납처분의 예에 따라 징수한다.\n제637조의2(과태료의 부과ㆍ징수)","kind":"L"},{"id":"L:638","label":"법 제638조","title":"보험계약의 의의","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"제638조(보험계약의 의의) 보험계약은 당사자 일방이 약정한 보험료를 지급하고 재산 또는 생명이나 신체에 불확정한 사고가 발생할 경우에 상대방이 일정한 보험금이나 그 밖의 급여를 지급할 것을 약정함으로써 효력이 생긴다.","kind":"L"},{"id":"L:638-2","label":"법 제638조의2","title":"보험계약의 성립","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"①보험자가 보험계약자로부터 보험계약의 청약과 함께 보험료 상당액의 전부 또는 일부의 지급을 받은 때에는 다른 약정이 없으면 30일내에 그 상대방에 대하여 낙부의 통지를 발송하여야 한다. 그러나 인보험계약의 피보험자가 신체검사를 받아야 하는 경우에는 그 기간은 신체검사를 받은 날부터 기산한다.\n②보험자가 제1항의 규정에 의한 기간내에 낙부의 통지를 해태한 때에는 승낙한 것으로 본다.\n③보험자가 보험계약자로부터 보험계약의 청약과 함께 보험료 상당액의 전부 또는 일부를 받은 경우에 그 청약을 승낙하기 전에 보험계약에서 정한 보험사고가 생긴 때에는 그 청약을 거절할 사유가 없는 한 보험자는 보험계약상의 책임을 진다. 그러나 인보험계약의 피보험자가 신체검사를 받아야 하는 경우에 그 검사를 받지 아니한 때에는 그러하지 아니하다.\n제638조의2(보험계약의 성립)","kind":"L"},{"id":"L:638-3","label":"법 제638조의3","title":"보험약관의 교부ㆍ설명 의무","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"① 보험자는 보험계약을 체결할 때에 보험계약자에게 보험약관을 교부하고 그 약관의 중요한 내용을 설명하여야 한다.\n② 보험자가 제1항을 위반한 경우 보험계약자는 보험계약이 성립한 날부터 3개월 이내에 그 계약을 취소할 수 있다.\n제638조의3(보험약관의 교부ㆍ설명 의무)","kind":"L"},{"id":"L:639","label":"법 제639조","title":"타인을 위한 보험","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"①보험계약자는 위임을 받거나 위임을 받지 아니하고 특정 또는 불특정의 타인을 위하여 보험계약을 체결할 수 있다. 그러나 손해보험계약의 경우에 그 타인의 위임이 없는 때에는 보험계약자는 이를 보험자에게 고지하여야 하고, 그 고지가 없는 때에는 타인이 그 보험계약이 체결된 사실을 알지 못하였다는 사유로 보험자에게 대항하지 못한다. <개정 1991.12.31>\n②제1항의 경우에는 그 타인은 당연히 그 계약의 이익을 받는다. 그러나 손해보험계약의 경우에 보험계약자가 그 타인에게 보험사고의 발생으로 생긴 손해의 배상을 한 때에는 보험계약자는 그 타인의 권리를 해하지 아니하는 범위안에서 보험자에게 보험금액의 지급을 청구할 수 있다. <신설 1991.12.31>\n③제1항의 경우에는 보험계약자는 보험자에 대하여 보험료를 지급할 의무가 있다. 그러나 보험계약자가 파산선고를 받거나 보험료의 지급을 지체한 때에는 그 타인이 그 권리를 포기하지 아니하는 한 그 타인도 보험료를 지급할 의무가 있다. <개정 1991.12.31>\n제639조(타인을 위한 보험)","kind":"L"},{"id":"L:640","label":"법 제640조","title":"보험증권의 교부","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"①보험자는 보험계약이 성립한 때에는 지체없이 보험증권을 작성하여 보험계약자에게 교부하여야 한다. 그러나 보험계약자가 보험료의 전부 또는 최초의 보험료를 지급하지 아니한 때에는 그러하지 아니하다. <개정 1991.12.31>\n②기존의 보험계약을 연장하거나 변경한 경우에는 보험자는 그 보험증권에 그 사실을 기재함으로써 보험증권의 교부에 갈음할 수 있다. <신설 1991.12.31>\n제640조(보험증권의 교부)","kind":"L"},{"id":"L:641","label":"법 제641조","title":"증권에 관한 이의약관의 효력","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"제641조(증권에 관한 이의약관의 효력) 보험계약의 당사자는 보험증권의 교부가 있은 날로부터 일정한 기간내에 한하여 그 증권내용의 정부에 관한 이의를 할 수 있음을 약정할 수 있다. 이 기간은 1월을 내리지 못한다.","kind":"L"},{"id":"L:642","label":"법 제642조","title":"증권의 재교부청구","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"제642조(증권의 재교부청구) 보험증권을 멸실 또는 현저하게 훼손한 때에는 보험계약자는 보험자에 대하여 증권의 재교부를 청구할 수 있다. 그 증권작성의 비용은 보험계약자의 부담으로 한다.","kind":"L"},{"id":"L:643","label":"법 제643조","title":"소급보험","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"제643조(소급보험) 보험계약은 그 계약전의 어느 시기를 보험기간의 시기로 할 수 있다.","kind":"L"},{"id":"L:644","label":"법 제644조","title":"보험사고의 객관적 확정의 효과","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"제644조(보험사고의 객관적 확정의 효과) 보험계약당시에 보험사고가 이미 발생하였거나 또는 발생할 수 없는 것인 때에는 그 계약은 무효로 한다. 그러나 당사자 쌍방과 피보험자가 이를 알지 못한 때에는 그러하지 아니하다.","kind":"L"},{"id":"L:645","label":"법 제645조","title":"","chapter":"제4편 보험 제1장 통칙","deleted":true,"text":"제645조 삭제 <1991.12.31>","kind":"L"},{"id":"L:646","label":"법 제646조","title":"대리인이 안 것의 효과","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"제646조(대리인이 안 것의 효과) 대리인에 의하여 보험계약을 체결한 경우에 대리인이 안 사유는 그 본인이 안 것과 동일한 것으로 한다.","kind":"L"},{"id":"L:646-2","label":"법 제646조의2","title":"보험대리상 등의 권한","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"① 보험대리상은 다음 각 호의 권한이 있다.\n1. 보험계약자로부터 보험료를 수령할 수 있는 권한\n2. 보험자가 작성한 보험증권을 보험계약자에게 교부할 수 있는 권한\n3. 보험계약자로부터 청약, 고지, 통지, 해지, 취소 등 보험계약에 관한 의사표시를 수령할 수 있는 권한\n4. 보험계약자에게 보험계약의 체결, 변경, 해지 등 보험계약에 관한 의사표시를 할 수 있는 권한\n② 제1항에도 불구하고 보험자는 보험대리상의 제1항 각 호의 권한 중 일부를 제한할 수 있다. 다만, 보험자는 그러한 권한 제한을 이유로 선의의 보험계약자에게 대항하지 못한다.\n③ 보험대리상이 아니면서 특정한 보험자를 위하여 계속적으로 보험계약의 체결을 중개하는 자는 제1항제1호(보험자가 작성한 영수증을 보험계약자에게 교부하는 경우만 해당한다) 및 제2호의 권한이 있다.\n④ 피보험자나 보험수익자가 보험료를 지급하거나 보험계약에 관한 의사표시를 할 의무가 있는 경우에는 제1항부터 제3항까지의 규정을 그 피보험자나 보험수익자에게도 적용한다.\n제646조의2(보험대리상 등의 권한)","kind":"L"},{"id":"L:647","label":"법 제647조","title":"특별위험의 소멸로 인한 보험료의 감액청구","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"제647조(특별위험의 소멸로 인한 보험료의 감액청구) 보험계약의 당사자가 특별한 위험을 예기하여 보험료의 액을 정한 경우에 보험기간중 그 예기한 위험이 소멸한 때에는 보험계약자는 그 후의 보험료의 감액을 청구할 수 있다.","kind":"L"},{"id":"L:648","label":"법 제648조","title":"보험계약의 무효로 인한 보험료반환청구","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"제648조(보험계약의 무효로 인한 보험료반환청구) 보험계약의 전부 또는 일부가 무효인 경우에 보험계약자와 피보험자가 선의이며 중대한 과실이 없는 때에는 보험자에 대하여 보험료의 전부 또는 일부의 반환을 청구할 수 있다. 보험계약자와 보험수익자가 선의이며 중대한 과실이 없는 때에도 같다.","kind":"L"},{"id":"L:649","label":"법 제649조","title":"사고발생전의 임의해지","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"①보험사고가 발생하기 전에는 보험계약자는 언제든지 계약의 전부 또는 일부를 해지할 수 있다. 그러나 제639조의 보험계약의 경우에는 보험계약자는 그 타인의 동의를 얻지 아니하거나 보험증권을 소지하지 아니하면 그 계약을 해지하지 못한다. <개정 1991.12.31>\n②보험사고의 발생으로 보험자가 보험금액을 지급한 때에도 보험금액이 감액되지 아니하는 보험의 경우에는 보험계약자는 그 사고발생후에도 보험계약을 해지할 수 있다. <신설 1991.12.31>\n③제1항의 경우에는 보험계약자는 당사자간에 다른 약정이 없으면 미경과보험료의 반환을 청구할 수 있다. <개정 1991.12.31>\n제649조(사고발생전의 임의해지)","kind":"L"},{"id":"L:650","label":"법 제650조","title":"보험료의 지급과 지체의 효과","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"①보험계약자는 계약체결후 지체없이 보험료의 전부 또는 제1회 보험료를 지급하여야 하며, 보험계약자가 이를 지급하지 아니하는 경우에는 다른 약정이 없는 한 계약성립후 2월이 경과하면 그 계약은 해제된 것으로 본다.\n②계속보험료가 약정한 시기에 지급되지 아니한 때에는 보험자는 상당한 기간을 정하여 보험계약자에게 최고하고 그 기간내에 지급되지 아니한 때에는 그 계약을 해지할 수 있다.\n③특정한 타인을 위한 보험의 경우에 보험계약자가 보험료의 지급을 지체한 때에는 보험자는 그 타인에게도 상당한 기간을 정하여 보험료의 지급을 최고한 후가 아니면 그 계약을 해제 또는 해지하지 못한다.\n제650조(보험료의 지급과 지체의 효과)","kind":"L"},{"id":"L:650-2","label":"법 제650조의2","title":"보험계약의 부활","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"제650조의2(보험계약의 부활) 제650조제2항에 따라 보험계약이 해지되고 해지환급금이 지급되지 아니한 경우에 보험계약자는 일정한 기간내에 연체보험료에 약정이자를 붙여 보험자에게 지급하고 그 계약의 부활을 청구할 수 있다. 제638조의2의 규정은 이 경우에 준용한다.","kind":"L"},{"id":"L:651","label":"법 제651조","title":"고지의무위반으로 인한 계약해지","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"제651조(고지의무위반으로 인한 계약해지) 보험계약당시에 보험계약자 또는 피보험자가 고의 또는 중대한 과실로 인하여 중요한 사항을 고지하지 아니하거나 부실의 고지를 한 때에는 보험자는 그 사실을 안 날로부터 1월내에, 계약을 체결한 날로부터 3년내에 한하여 계약을 해지할 수 있다. 그러나 보험자가 계약당시에 그 사실을 알았거나 중대한 과실로 인하여 알지 못한 때에는 그러하지 아니하다. <개정 1991.12.31>","kind":"L"},{"id":"L:651-2","label":"법 제651조의2","title":"서면에 의한 질문의 효력","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"제651조의2(서면에 의한 질문의 효력) 보험자가 서면으로 질문한 사항은 중요한 사항으로 추정한다.","kind":"L"},{"id":"L:652","label":"법 제652조","title":"위험변경증가의 통지와 계약해지","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"①보험기간 중에 보험계약자 또는 피보험자가 사고발생의 위험이 현저하게 변경 또는 증가된 사실을 안 때에는 지체없이 보험자에게 통지하여야 한다. 이를 해태한 때에는 보험자는 그 사실을 안 날로부터 1월내에 한하여 계약을 해지할 수 있다.\n②보험자가 제1항의 위험변경증가의 통지를 받은 때에는 1월내에 보험료의 증액을 청구하거나 계약을 해지할 수 있다. <신설 1991.12.31>\n제652조(위험변경증가의 통지와 계약해지)","kind":"L"},{"id":"L:653","label":"법 제653조","title":"보험계약자 등의 고의나 중과실로 인한 위험증가와 계약해지","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"제653조(보험계약자 등의 고의나 중과실로 인한 위험증가와 계약해지) 보험기간중에 보험계약자, 피보험자 또는 보험수익자의 고의 또는 중대한 과실로 인하여 사고발생의 위험이 현저하게 변경 또는 증가된 때에는 보험자는 그 사실을 안 날부터 1월내에 보험료의 증액을 청구하거나 계약을 해지할 수 있다. <개정 1991.12.31>","kind":"L"},{"id":"L:654","label":"법 제654조","title":"보험자의 파산선고와 계약해지","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"①보험자가 파산의 선고를 받은 때에는 보험계약자는 계약을 해지할 수 있다.\n②제1항의 규정에 의하여 해지하지 아니한 보험계약은 파산선고 후 3월을 경과한 때에는 그 효력을 잃는다. <개정 1991.12.31>\n제654조(보험자의 파산선고와 계약해지)","kind":"L"},{"id":"L:655","label":"법 제655조","title":"계약해지와 보험금청구권","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"제655조(계약해지와 보험금청구권) 보험사고가 발생한 후라도 보험자가 제650조, 제651조, 제652조 및 제653조에 따라 계약을 해지하였을 때에는 보험금을 지급할 책임이 없고 이미 지급한 보험금의 반환을 청구할 수 있다. 다만, 고지의무(告知義務)를 위반한 사실 또는 위험이 현저하게 변경되거나 증가된 사실이 보험사고 발생에 영향을 미치지 아니하였음이 증명된 경우에는 보험금을 지급할 책임이 있다.","kind":"L"},{"id":"L:656","label":"법 제656조","title":"보험료의 지급과 보험자의 책임개시","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"제656조(보험료의 지급과 보험자의 책임개시) 보험자의 책임은 당사자간에 다른 약정이 없으면 최초의 보험료의 지급을 받은 때로부터 개시한다.","kind":"L"},{"id":"L:657","label":"법 제657조","title":"보험사고발생의 통지의무","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"①보험계약자 또는 피보험자나 보험수익자는 보험사고의 발생을 안 때에는 지체없이 보험자에게 그 통지를 발송하여야 한다.\n②보험계약자 또는 피보험자나 보험수익자가 제1항의 통지의무를 해태함으로 인하여 손해가 증가된 때에는 보험자는 그 증가된 손해를 보상할 책임이 없다. <신설 1991.12.31>\n제657조(보험사고발생의 통지의무)","kind":"L"},{"id":"L:658","label":"법 제658조","title":"보험금액의 지급","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"제658조(보험금액의 지급) 보험자는 보험금액의 지급에 관하여 약정기간이 있는 경우에는 그 기간내에 약정기간이 없는 경우에는 제657조제1항의 통지를 받은 후 지체없이 지급할 보험금액을 정하고 그 정하여진 날부터 10일내에 피보험자 또는 보험수익자에게 보험금액을 지급하여야 한다.","kind":"L"},{"id":"L:659","label":"법 제659조","title":"보험자의 면책사유","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"①보험사고가 보험계약자 또는 피보험자나 보험수익자의 고의 또는 중대한 과실로 인하여 생긴 때에는 보험자는 보험금액을 지급할 책임이 없다.\n② 삭제 <1991.12.31>\n제659조(보험자의 면책사유)","kind":"L"},{"id":"L:660","label":"법 제660조","title":"전쟁위험 등으로 인한 면책","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"제660조(전쟁위험 등으로 인한 면책) 보험사고가 전쟁 기타의 변란으로 인하여 생긴 때에는 당사자간에 다른 약정이 없으면 보험자는 보험금액을 지급할 책임이 없다.","kind":"L"},{"id":"L:661","label":"법 제661조","title":"재보험","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"제661조(재보험) 보험자는 보험사고로 인하여 부담할 책임에 대하여 다른 보험자와 재보험계약을 체결할 수 있다. 이 재보험계약은 원보험계약의 효력에 영향을 미치지 아니한다.","kind":"L"},{"id":"L:662","label":"법 제662조","title":"소멸시효","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"제662조(소멸시효) 보험금청구권은 3년간, 보험료 또는 적립금의 반환청구권은 3년간, 보험료청구권은 2년간 행사하지 아니하면 시효의 완성으로 소멸한다.","kind":"L"},{"id":"L:663","label":"법 제663조","title":"보험계약자 등의 불이익변경금지","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"제663조(보험계약자 등의 불이익변경금지) 이 편의 규정은 당사자간의 특약으로 보험계약자 또는 피보험자나 보험수익자의 불이익으로 변경하지 못한다. 그러나 재보험 및 해상보험 기타 이와 유사한 보험의 경우에는 그러하지 아니하다. <개정 1991.12.31>","kind":"L"},{"id":"L:664","label":"법 제664조","title":"상호보험, 공제 등에의 준용","chapter":"제4편 보험 제1장 통칙","deleted":false,"text":"제664조(상호보험, 공제 등에의 준용) 이 편(編)의 규정은 그 성질에 반하지 아니하는 범위에서 상호보험(相互保險), 공제(共濟), 그 밖에 이에 준하는 계약에 준용한다.","kind":"L"},{"id":"L:665","label":"법 제665조","title":"손해보험자의 책임","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제665조(손해보험자의 책임) 손해보험계약의 보험자는 보험사고로 인하여 생길 피보험자의 재산상의 손해를 보상할 책임이 있다.","kind":"L"},{"id":"L:666","label":"법 제666조","title":"손해보험증권","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"1. 보험의 목적\n2. 보험사고의 성질\n3. 보험금액\n4. 보험료와 그 지급방법\n5. 보험기간을 정한 때에는 그 시기와 종기\n6. 무효와 실권의 사유\n7. 보험계약자의 주소와 성명 또는 상호\n7의2. 피보험자의 주소, 성명 또는 상호\n8. 보험계약의 연월일\n9. 보험증권의 작성지와 그 작성년월일\n제666조(손해보험증권) 손해보험증권에는 다음의 사항을 기재하고 보험자가 기명날인 또는 서명하여야 한다. <개정 1991.12.31, 2014.3.11>","kind":"L"},{"id":"L:667","label":"법 제667조","title":"상실이익 등의 불산입","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제667조(상실이익 등의 불산입) 보험사고로 인하여 상실된 피보험자가 얻을 이익이나 보수는 당사자간에 다른 약정이 없으면 보험자가 보상할 손해액에 산입하지 아니한다.","kind":"L"},{"id":"L:668","label":"법 제668조","title":"보험계약의 목적","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제668조(보험계약의 목적) 보험계약은 금전으로 산정할 수 있는 이익에 한하여 보험계약의 목적으로 할 수 있다.","kind":"L"},{"id":"L:669","label":"법 제669조","title":"초과보험","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"①보험금액이 보험계약의 목적의 가액을 현저하게 초과한 때에는 보험자 또는 보험계약자는 보험료와 보험금액의 감액을 청구할 수 있다. 그러나 보험료의 감액은 장래에 대하여서만 그 효력이 있다.\n②제1항의 가액은 계약당시의 가액에 의하여 정한다. <개정 1991.12.31>\n③보험가액이 보험기간 중에 현저하게 감소된 때에도 제1항과 같다.\n④제1항의 경우에 계약이 보험계약자의 사기로 인하여 체결된 때에는 그 계약은 무효로 한다. 그러나 보험자는 그 사실을 안 때까지의 보험료를 청구할 수 있다.\n제669조(초과보험)","kind":"L"},{"id":"L:670","label":"법 제670조","title":"기평가보험","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제670조(기평가보험) 당사자간에 보험가액을 정한 때에는 그 가액은 사고발생시의 가액으로 정한 것으로 추정한다. 그러나 그 가액이 사고발생시의 가액을 현저하게 초과할 때에는 사고발생시의 가액을 보험가액으로 한다.","kind":"L"},{"id":"L:671","label":"법 제671조","title":"미평가보험","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제671조(미평가보험) 당사자간에 보험가액을 정하지 아니한 때에는 사고발생시의 가액을 보험가액으로 한다.","kind":"L"},{"id":"L:672","label":"법 제672조","title":"중복보험","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"①동일한 보험계약의 목적과 동일한 사고에 관하여 수개의 보험계약이 동시에 또는 순차로 체결된 경우에 그 보험금액의 총액이 보험가액을 초과한 때에는 보험자는 각자의 보험금액의 한도에서 연대책임을 진다. 이 경우에는 각 보험자의 보상책임은 각자의 보험금액의 비율에 따른다. <개정 1991.12.31>\n②동일한 보험계약의 목적과 동일한 사고에 관하여 수개의 보험계약을 체결하는 경우에는 보험계약자는 각 보험자에 대하여 각 보험계약의 내용을 통지하여야 한다. <개정 1991.12.31>\n③제669조제4항의 규정은 제1항의 보험계약에 준용한다.\n제672조(중복보험)","kind":"L"},{"id":"L:673","label":"법 제673조","title":"중복보험과 보험자 1인에 대한 권리포기","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제673조(중복보험과 보험자 1인에 대한 권리포기) 제672조의 규정에 의한 수개의 보험계약을 체결한 경우에 보험자 1인에 대한 권리의 포기는 다른 보험자의 권리의무에 영향을 미치지 아니한다. <개정 1991.12.31>","kind":"L"},{"id":"L:674","label":"법 제674조","title":"일부보험","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제674조(일부보험) 보험가액의 일부를 보험에 붙인 경우에는 보험자는 보험금액의 보험가액에 대한 비율에 따라 보상할 책임을 진다. 그러나 당사자간에 다른 약정이 있는 때에는 보험자는 보험금액의 한도내에서 그 손해를 보상할 책임을 진다. <개정 1991.12.31>","kind":"L"},{"id":"L:675","label":"법 제675조","title":"사고발생 후의 목적멸실과 보상책임","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제675조(사고발생 후의 목적멸실과 보상책임) 보험의 목적에 관하여 보험자가 부담할 손해가 생긴 경우에는 그 후 그 목적이 보험자가 부담하지 아니하는 보험사고의 발생으로 인하여 멸실된 때에도 보험자는 이미 생긴 손해를 보상할 책임을 면하지 못한다. <개정 1962.12.12>","kind":"L"},{"id":"L:676","label":"법 제676조","title":"손해액의 산정기준","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"①보험자가 보상할 손해액은 그 손해가 발생한 때와 곳의 가액에 의하여 산정한다. 그러나 당사자간에 다른 약정이 있는 때에는 그 신품가액에 의하여 손해액을 산정할 수 있다. <개정 1991.12.31>\n②제1항의 손해액의 산정에 관한 비용은 보험자의 부담으로 한다. <개정 1991.12.31>\n제676조(손해액의 산정기준)","kind":"L"},{"id":"L:677","label":"법 제677조","title":"보험료체납과 보상액의 공제","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제677조(보험료체납과 보상액의 공제) 보험자가 손해를 보상할 경우에 보험료의 지급을 받지 아니한 잔액이 있으면 그 지급기일이 도래하지 아니한 때라도 보상할 금액에서 이를 공제할 수 있다.","kind":"L"},{"id":"L:678","label":"법 제678조","title":"보험자의 면책사유","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제678조(보험자의 면책사유) 보험의 목적의 성질, 하자 또는 자연소모로 인한 손해는 보험자가 이를 보상할 책임이 없다.","kind":"L"},{"id":"L:679","label":"법 제679조","title":"보험목적의 양도","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"①피보험자가 보험의 목적을 양도한 때에는 양수인은 보험계약상의 권리와 의무를 승계한 것으로 추정한다. <개정 1991.12.31>\n②제1항의 경우에 보험의 목적의 양도인 또는 양수인은 보험자에 대하여 지체없이 그 사실을 통지하여야 한다. <신설 1991.12.31>\n제679조(보험목적의 양도)","kind":"L"},{"id":"L:680","label":"법 제680조","title":"손해방지의무","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"①보험계약자와 피보험자는 손해의 방지와 경감을 위하여 노력하여야 한다. 그러나 이를 위하여 필요 또는 유익하였던 비용과 보상액이 보험금액을 초과한 경우라도 보험자가 이를 부담한다. <개정 1991.12.31>\n② 삭제 <1991.12.31>\n제680조(손해방지의무)","kind":"L"},{"id":"L:681","label":"법 제681조","title":"보험목적에 관한 보험대위","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제681조(보험목적에 관한 보험대위) 보험의 목적의 전부가 멸실한 경우에 보험금액의 전부를 지급한 보험자는 그 목적에 대한 피보험자의 권리를 취득한다. 그러나 보험가액의 일부를 보험에 붙인 경우에는 보험자가 취득할 권리는 보험금액의 보험가액에 대한 비율에 따라 이를 정한다.","kind":"L"},{"id":"L:682","label":"법 제682조","title":"제3자에 대한 보험대위","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"① 손해가 제3자의 행위로 인하여 발생한 경우에 보험금을 지급한 보험자는 그 지급한 금액의 한도에서 그 제3자에 대한 보험계약자 또는 피보험자의 권리를 취득한다. 다만, 보험자가 보상할 보험금의 일부를 지급한 경우에는 피보험자의 권리를 침해하지 아니하는 범위에서 그 권리를 행사할 수 있다.\n② 보험계약자나 피보험자의 제1항에 따른 권리가 그와 생계를 같이 하는 가족에 대한 것인 경우 보험자는 그 권리를 취득하지 못한다. 다만, 손해가 그 가족의 고의로 인하여 발생한 경우에는 그러하지 아니하다.\n제682조(제3자에 대한 보험대위)","kind":"L"},{"id":"L:683","label":"법 제683조","title":"화재보험자의 책임","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제683조(화재보험자의 책임) 화재보험계약의 보험자는 화재로 인하여 생길 손해를 보상할 책임이 있다.","kind":"L"},{"id":"L:684","label":"법 제684조","title":"소방 등의 조치로 인한 손해의 보상","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제684조(소방 등의 조치로 인한 손해의 보상) 보험자는 화재의 소방 또는 손해의 감소에 필요한 조치로 인하여 생긴 손해를 보상할 책임이 있다.","kind":"L"},{"id":"L:685","label":"법 제685조","title":"화재보험증권","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"1. 건물을 보험의 목적으로 한 때에는 그 소재지, 구조와 용도\n2. 동산을 보험의 목적으로 한 때에는 그 존치한 장소의 상태와 용도\n3. 보험가액을 정한 때에는 그 가액\n제685조(화재보험증권) 화재보험증권에는 제666조에 게기한 사항외에 다음의 사항을 기재하여야 한다.","kind":"L"},{"id":"L:686","label":"법 제686조","title":"집합보험의 목적","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제686조(집합보험의 목적) 집합된 물건을 일괄하여 보험의 목적으로 한 때에는 피보험자의 가족과 사용인의 물건도 보험의 목적에 포함된 것으로 한다. 이 경우에는 그 보험은 그 가족 또는 사용인을 위하여서도 체결한 것으로 본다.","kind":"L"},{"id":"L:687","label":"법 제687조","title":"동전","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제687조(동전) 집합된 물건을 일괄하여 보험의 목적으로 한 때에는 그 목적에 속한 물건이 보험기간중에 수시로 교체된 경우에도 보험사고의 발생 시에 현존한 물건은 보험의 목적에 포함된 것으로 한다.","kind":"L"},{"id":"L:688","label":"법 제688조","title":"운송보험자의 책임","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제688조(운송보험자의 책임) 운송보험계약의 보험자는 다른 약정이 없으면 운송인이 운송물을 수령한 때로부터 수하인에게 인도할 때까지 생길 손해를 보상할 책임이 있다.","kind":"L"},{"id":"L:689","label":"법 제689조","title":"운송보험의 보험가액","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"①운송물의 보험에 있어서는 발송한 때와 곳의 가액과 도착지까지의 운임 기타의 비용을 보험가액으로 한다.\n②운송물의 도착으로 인하여 얻을 이익은 약정이 있는 때에 한하여 보험가액 중에 산입한다.\n제689조(운송보험의 보험가액)","kind":"L"},{"id":"L:690","label":"법 제690조","title":"운송보험증권","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"1. 운송의 노순과 방법\n2. 운송인의 주소와 성명 또는 상호\n3. 운송물의 수령과 인도의 장소\n4. 운송기간을 정한 때에는 그 기간\n5. 보험가액을 정한 때에는 그 가액\n제690조(운송보험증권) 운송보험증권에는 제666조에 게기한 사항외에 다음의 사항을 기재하여야 한다.","kind":"L"},{"id":"L:691","label":"법 제691조","title":"운송의 중지나 변경과 계약효력","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제691조(운송의 중지나 변경과 계약효력) 보험계약은 다른 약정이 없으면 운송의 필요에 의하여 일시운송을 중지하거나 운송의 노순 또는 방법을 변경한 경우에도 그 효력을 잃지 아니한다.","kind":"L"},{"id":"L:692","label":"법 제692조","title":"운송보조자의 고의, 중과실과 보험자의 면책","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제692조(운송보조자의 고의, 중과실과 보험자의 면책) 보험사고가 송하인 또는 수하인의 고의 또는 중대한 과실로 인하여 발생한 때에는 보험자는 이로 인하여 생긴 손해를 보상할 책임이 없다.","kind":"L"},{"id":"L:693","label":"법 제693조","title":"해상보험자의 책임","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제693조(해상보험자의 책임) 해상보험계약의 보험자는 해상사업에 관한 사고로 인하여 생길 손해를 보상할 책임이 있다. <개정 1991.12.31>","kind":"L"},{"id":"L:694","label":"법 제694조","title":"공동해손분담액의 보상","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제694조(공동해손분담액의 보상) 보험자는 피보험자가 지급할 공동해손의 분담액을 보상할 책임이 있다. 그러나 보험의 목적의 공동해손분담가액이 보험가액을 초과할 때에는 그 초과액에 대한 분담액은 보상하지 아니한다. <개정 1991.12.31>","kind":"L"},{"id":"L:694-2","label":"법 제694조의2","title":"구조료의 보상","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제694조의2(구조료의 보상) 보험자는 피보험자가 보험사고로 인하여 발생하는 손해를 방지하기 위하여 지급할 구조료를 보상할 책임이 있다. 그러나 보험의 목적물의 구조료분담가액이 보험가액을 초과할 때에는 그 초과액에 대한 분담액은 보상하지 아니한다.","kind":"L"},{"id":"L:694-3","label":"법 제694조의3","title":"특별비용의 보상","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제694조의3(특별비용의 보상) 보험자는 보험의 목적의 안전이나 보존을 위하여 지급할 특별비용을 보험금액의 한도내에서 보상할 책임이 있다.","kind":"L"},{"id":"L:695","label":"법 제695조","title":"해상보험증권","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"1. 선박을 보험에 붙인 경우에는 그 선박의 명칭, 국적과 종류 및 항해의 범위\n2. 적하를 보험에 붙인 경우에는 선박의 명칭, 국적과 종류, 선적항, 양륙항 및 출하지와 도착지를 정한 때에는 그 지명\n3. 보험가액을 정한 때에는 그 가액\n제695조(해상보험증권) 해상보험증권에는 제666조에 게기한 사항외에 다음의 사항을 기재하여야 한다. <개정 1991.12.31>","kind":"L"},{"id":"L:696","label":"법 제696조","title":"선박보험의 보험가액과 보험목적","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"①선박의 보험에 있어서는 보험자의 책임이 개시될 때의 선박가액을 보험가액으로 한다.\n②제1항의 경우에는 선박의 속구, 연료, 양식 기타 항해에 필요한 모든 물건은 보험의 목적에 포함된 것으로 한다. <개정 1991.12.31>\n제696조(선박보험의 보험가액과 보험목적)","kind":"L"},{"id":"L:697","label":"법 제697조","title":"적하보험의 보험가액","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제697조(적하보험의 보험가액) 적하의 보험에 있어서는 선적한 때와 곳의 적하의 가액과 선적 및 보험에 관한 비용을 보험가액으로 한다. <개정 1962.12.12>","kind":"L"},{"id":"L:698","label":"법 제698조","title":"희망이익보험의 보험가액","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제698조(희망이익보험의 보험가액) 적하의 도착으로 인하여 얻을 이익 또는 보수의 보험에 있어서는 계약으로 보험가액을 정하지 아니한 때에는 보험금액을 보험가액으로 한 것으로 추정한다.","kind":"L"},{"id":"L:699","label":"법 제699조","title":"해상보험의 보험기간의 개시","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"①항해단위로 선박을 보험에 붙인 경우에는 보험기간은 하물 또는 저하의 선적에 착수한 때에 개시한다.\n②적하를 보험에 붙인 경우에는 보험기간은 하물의 선적에 착수한 때에 개시한다. 그러나 출하지를 정한 경우에는 그 곳에서 운송에 착수한 때에 개시한다.\n③하물 또는 저하의 선적에 착수한 후에 제1항 또는 제2항의 규정에 의한 보험계약이 체결된 경우에는 보험기간은 계약이 성립한 때에 개시한다.\n제699조(해상보험의 보험기간의 개시)","kind":"L"},{"id":"L:700","label":"법 제700조","title":"해상보험의 보험기간의 종료","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제700조(해상보험의 보험기간의 종료) 보험기간은 제699조제1항의 경우에는 도착항에서 하물 또는 저하를 양륙한 때에, 동조제2항의 경우에는 양륙항 또는 도착지에서 하물을 인도한 때에 종료한다. 그러나 불가항력으로 인하지 아니하고 양륙이 지연된 때에는 그 양륙이 보통종료될 때에 종료된 것으로 한다. <개정 1991.12.31>","kind":"L"},{"id":"L:701","label":"법 제701조","title":"항해변경의 효과","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"①선박이 보험계약에서 정하여진 발항항이 아닌 다른 항에서 출항한 때에는 보험자는 책임을 지지 아니한다.\n②선박이 보험계약에서 정하여진 도착항이 아닌 다른 항을 향하여 출항한 때에도 제1항의 경우와 같다.\n③보험자의 책임이 개시된 후에 보험계약에서 정하여진 도착항이 변경된 경우에는 보험자는 그 항해의 변경이 결정된 때부터 책임을 지지 아니한다.\n제701조(항해변경의 효과)","kind":"L"},{"id":"L:701-2","label":"법 제701조의2","title":"이로","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제701조의2(이로) 선박이 정당한 사유없이 보험계약에서 정하여진 항로를 이탈한 경우에는 보험자는 그때부터 책임을 지지 아니한다. 선박이 손해발생전에 원항로로 돌아온 경우에도 같다.","kind":"L"},{"id":"L:702","label":"법 제702조","title":"발항 또는 항해의 지연의 효과","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제702조(발항 또는 항해의 지연의 효과) 피보험자가 정당한 사유없이 발항 또는 항해를 지연한 때에는 보험자는 발항 또는 항해를 지체한 이후의 사고에 대하여 책임을 지지 아니한다.","kind":"L"},{"id":"L:703","label":"법 제703조","title":"선박변경의 효과","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제703조(선박변경의 효과) 적하를 보험에 붙인 경우에 보험계약자 또는 피보험자의 책임있는 사유로 인하여 선박을 변경한 때에는 그 변경후의 사고에 대하여 책임을 지지 아니한다. <개정 1991.12.31>","kind":"L"},{"id":"L:703-2","label":"법 제703조의2","title":"선박의 양도 등의 효과","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"1. 선박을 양도할 때\n2. 선박의 선급을 변경한 때\n3. 선박을 새로운 관리로 옮긴 때\n제703조의2(선박의 양도 등의 효과) 선박을 보험에 붙인 경우에 다음의 사유가 있을 때에는 보험계약은 종료한다. 그러나 보험자의 동의가 있는 때에는 그러하지 아니하다.","kind":"L"},{"id":"L:704","label":"법 제704조","title":"선박미확정의 적하예정보험","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"①보험계약의 체결당시에 하물을 적재할 선박을 지정하지 아니한 경우에 보험계약자 또는 피보험자가 그 하물이 선적되었음을 안 때에는 지체없이 보험자에 대하여 그 선박의 명칭, 국적과 하물의 종류, 수량과 가액의 통지를 발송하여야 한다. <개정 1991.12.31>\n②제1항의 통지를 해태한 때에는 보험자는 그 사실을 안 날부터 1월내에 계약을 해지할 수 있다. <개정 1991.12.31>\n제704조(선박미확정의 적하예정보험)","kind":"L"},{"id":"L:705","label":"법 제705조","title":"","chapter":"제4편 보험 제2장 손해보험","deleted":true,"text":"제705조 삭제 <1991.12.31>","kind":"L"},{"id":"L:706","label":"법 제706조","title":"해상보험자의 면책사유","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"1. 선박 또는 운임을 보험에 붙인 경우에는 발항당시 안전하게 항해를 하기에 필요한 준비를 하지 아니하거나 필요한 서류를 비치하지 아니함으로 인하여 생긴 손해\n2. 적하를 보험에 붙인 경우에는 용선자, 송하인 또는 수하인의 고의 또는 중대한 과실로 인하여 생긴 손해\n3. 도선료, 입항료, 등대료, 검역료, 기타 선박 또는 적하에 관한 항해 중의 통상비용\n제706조(해상보험자의 면책사유) 보험자는 다음의 손해와 비용을 보상할 책임이 없다. <개정 1991.12.31>","kind":"L"},{"id":"L:707","label":"법 제707조","title":"","chapter":"제4편 보험 제2장 손해보험","deleted":true,"text":"제707조 삭제 <1991.12.31>","kind":"L"},{"id":"L:707-2","label":"법 제707조의2","title":"선박의 일부손해의 보상","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"①선박의 일부가 훼손되어 그 훼손된 부분의 전부를 수선한 경우에는 보험자는 수선에 따른 비용을 1회의 사고에 대하여 보험금액을 한도로 보상할 책임이 있다.\n②선박의 일부가 훼손되어 그 훼손된 부분의 일부를 수선한 경우에는 보험자는 수선에 따른 비용과 수선을 하지 아니함으로써 생긴 감가액을 보상할 책임이 있다.\n③선박의 일부가 훼손되었으나 이를 수선하지 아니한 경우에는 보험자는 그로 인한 감가액을 보상할 책임이 있다.\n제707조의2(선박의 일부손해의 보상)","kind":"L"},{"id":"L:708","label":"법 제708조","title":"적하의 일부손해의 보상","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제708조(적하의 일부손해의 보상) 보험의 목적인 적하가 훼손되어 양륙항에 도착한 때에는 보험자는 그 훼손된 상태의 가액과 훼손되지 아니한 상태의 가액과의 비율에 따라 보험가액의 일부에 대한 손해를 보상할 책임이 있다.","kind":"L"},{"id":"L:709","label":"법 제709조","title":"적하매각으로 인한 손해의 보상","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"①항해도중에 불가항력으로 보험의 목적인 적하를 매각한 때에는 보험자는 그 대금에서 운임 기타 필요한 비용을 공제한 금액과 보험가액과의 차액을 보상하여야 한다.\n②제1항의 경우에 매수인이 대금을 지급하지 아니한 때에는 보험자는 그 금액을 지급하여야 한다. 보험자가 그 금액을 지급한 때에는 피보험자의 매수인에 대한 권리를 취득한다. <개정 1991.12.31>\n제709조(적하매각으로 인한 손해의 보상)","kind":"L"},{"id":"L:710","label":"법 제710조","title":"보험위부의 원인","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"1. 피보험자가 보험사고로 인하여 자기의 선박 또는 적하의 점유를 상실하여 이를 회복할 가능성이 없거나 회복하기 위한 비용이 회복하였을 때의 가액을 초과하리라고 예상될 경우\n2. 선박이 보험사고로 인하여 심하게 훼손되어 이를 수선하기 위한 비용이 수선하였을 때의 가액을 초과하리라고 예상될 경우\n3. 적하가 보험사고로 인하여 심하게 훼손되어서 이를 수선하기 위한 비용과 그 적하를 목적지까지 운송하기 위한 비용과의 합계액이 도착하는 때의 적하의 가액을 초과하리라고 예상될 경우\n제710조(보험위부의 원인) 다음의 경우에는 피보험자는 보험의 목적을 보험자에게 위부하고 보험금액의 전부를 청구할 수 있다. <개정 1991.12.31>","kind":"L"},{"id":"L:711","label":"법 제711조","title":"선박의 행방불명","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"①선박의 존부가 2월간 분명하지 아니한 때에는 그 선박의 행방이 불명한 것으로 한다. <개정 1991.12.31>\n②제1항의 경우에는 전손으로 추정한다. <개정 1991.12.31>\n제711조(선박의 행방불명)","kind":"L"},{"id":"L:712","label":"법 제712조","title":"대선에 의한 운송의 계속과 위부권의 소멸","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제712조(대선에 의한 운송의 계속과 위부권의 소멸) 제710조제2호의 경우에 선장이 지체없이 다른 선박으로 적하의 운송을 계속한 때에는 피보험자는 그 적하를 위부할 수 없다. <개정 1991.12.31>","kind":"L"},{"id":"L:713","label":"법 제713조","title":"위부의 통지","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"①피보험자가 위부를 하고자 할 때에는 상당한 기간내에 보험자에 대하여 그 통지를 발송하여야 한다. <개정 1991.12.31>\n② 삭제 <1991.12.31>\n제713조(위부의 통지)","kind":"L"},{"id":"L:714","label":"법 제714조","title":"위부권행사의 요건","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"①위부는 무조건이어야 한다.\n②위부는 보험의 목적의 전부에 대하여 이를 하여야 한다. 그러나 위부의 원인이 그 일부에 대하여 생긴 때에는 그 부분에 대하여서만 이를 할 수 있다.\n③보험가액의 일부를 보험에 붙인 경우에는 위부는 보험금액의 보험가액에 대한 비율에 따라서만 이를 할 수 있다.\n제714조(위부권행사의 요건)","kind":"L"},{"id":"L:715","label":"법 제715조","title":"다른 보험계약등에 관한 통지","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"①피보험자가 위부를 함에 있어서는 보험자에 대하여 보험의 목적에 관한 다른 보험계약과 그 부담에 속한 채무의 유무와 그 종류 및 내용을 통지하여야 한다.\n②보험자는 제1항의 통지를 받을 때까지 보험금액의 지급을 거부할 수 있다. <개정 1991.12.31>\n③보험금액의 지급에 관한 기간의 약정이 있는 때에는 그 기간은 제1항의 통지를 받은 날로부터 기산한다.\n제715조(다른 보험계약등에 관한 통지)","kind":"L"},{"id":"L:716","label":"법 제716조","title":"위부의 승인","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제716조(위부의 승인) 보험자가 위부를 승인한 후에는 그 위부에 대하여 이의를 하지 못한다.","kind":"L"},{"id":"L:717","label":"법 제717조","title":"위부의 불승인","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제717조(위부의 불승인) 보험자가 위부를 승인하지 아니한 때에는 피보험자는 위부의 원인을 증명하지 아니하면 보험금액의 지급을 청구하지 못한다.","kind":"L"},{"id":"L:718","label":"법 제718조","title":"위부의 효과","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"①보험자는 위부로 인하여 그 보험의 목적에 관한 피보험자의 모든 권리를 취득한다.\n②피보험자가 위부를 한 때에는 보험의 목적에 관한 모든 서류를 보험자에게 교부하여야 한다.\n제718조(위부의 효과)","kind":"L"},{"id":"L:719","label":"법 제719조","title":"책임보험자의 책임","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제719조(책임보험자의 책임) 책임보험계약의 보험자는 피보험자가 보험기간 중의 사고로 인하여 제3자에게 배상할 책임을 진 경우에 이를 보상할 책임이 있다.","kind":"L"},{"id":"L:720","label":"법 제720조","title":"피보험자가 지출한 방어비용의 부담","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"①피보험자가 제3자의 청구를 방어하기 위하여 지출한 재판상 또는 재판외의 필요비용은 보험의 목적에 포함된 것으로 한다. 피보험자는 보험자에 대하여 그 비용의 선급을 청구할 수 있다.\n②피보험자가 담보의 제공 또는 공탁으로써 재판의 집행을 면할 수 있는 경우에는 보험자에 대하여 보험금액의 한도내에서 그 담보의 제공 또는 공탁을 청구할 수 있다.\n③제1항 또는 제2항의 행위가 보험자의 지시에 의한 것인 경우에는 그 금액에 손해액을 가산한 금액이 보험금액을 초과하는 때에도 보험자가 이를 부담하여야 한다. <개정 1991.12.31>\n제720조(피보험자가 지출한 방어비용의 부담)","kind":"L"},{"id":"L:721","label":"법 제721조","title":"영업책임보험의 목적","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제721조(영업책임보험의 목적) 피보험자가 경영하는 사업에 관한 책임을 보험의 목적으로 한 때에는 피보험자의 대리인 또는 그 사업감독자의 제3자에 대한 책임도 보험의 목적에 포함된 것으로 한다.","kind":"L"},{"id":"L:722","label":"법 제722조","title":"피보험자의 배상청구 사실 통지의무","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"① 피보험자가 제3자로부터 배상청구를 받았을 때에는 지체 없이 보험자에게 그 통지를 발송하여야 한다.\n② 피보험자가 제1항의 통지를 게을리하여 손해가 증가된 경우 보험자는 그 증가된 손해를 보상할 책임이 없다. 다만, 피보험자가 제657조제1항의 통지를 발송한 경우에는 그러하지 아니하다.\n제722조(피보험자의 배상청구 사실 통지의무)","kind":"L"},{"id":"L:723","label":"법 제723조","title":"피보험자의 변제 등의 통지와 보험금액의 지급","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"①피보험자가 제3자에 대하여 변제, 승인, 화해 또는 재판으로 인하여 채무가 확정된 때에는 지체없이 보험자에게 그 통지를 발송하여야 한다.\n②보험자는 특별한 기간의 약정이 없으면 전항의 통지를 받은 날로부터 10일내에 보험금액을 지급하여야 한다.\n③피보험자가 보험자의 동의없이 제3자에 대하여 변제, 승인 또는 화해를 한 경우에는 보험자가 그 책임을 면하게 되는 합의가 있는 때에도 그 행위가 현저하게 부당한 것이 아니면 보험자는 보상할 책임을 면하지 못한다.\n제723조(피보험자의 변제 등의 통지와 보험금액의 지급)","kind":"L"},{"id":"L:724","label":"법 제724조","title":"보험자와 제3자와의 관계","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"①보험자는 피보험자가 책임을 질 사고로 인하여 생긴 손해에 대하여 제3자가 그 배상을 받기 전에는 보험금액의 전부 또는 일부를 피보험자에게 지급하지 못한다.\n②제3자는 피보험자가 책임을 질 사고로 입은 손해에 대하여 보험금액의 한도내에서 보험자에게 직접 보상을 청구할 수 있다. 그러나 보험자는 피보험자가 그 사고에 관하여 가지는 항변으로써 제3자에게 대항할 수 있다. <개정 1991.12.31>\n③보험자가 제2항의 규정에 의한 청구를 받은 때에는 지체없이 피보험자에게 이를 통지하여야 한다. <신설 1991.12.31>\n④제2항의 경우에 피보험자는 보험자의 요구가 있을 때에는 필요한 서류ㆍ증거의 제출, 증언 또는 증인의 출석에 협조하여야 한다. <신설 1991.12.31>\n제724조(보험자와 제3자와의 관계)","kind":"L"},{"id":"L:725","label":"법 제725조","title":"보관자의 책임보험","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제725조(보관자의 책임보험) 임차인 기타 타인의 물건을 보관하는 자가 그 지급할 손해배상을 위하여 그 물건을 보험에 붙인 경우에는 그 물건의 소유자는 보험자에 대하여 직접 그 손해의 보상을 청구할 수 있다.","kind":"L"},{"id":"L:725-2","label":"법 제725조의2","title":"수개의 책임보험","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제725조의2(수개의 책임보험) 피보험자가 동일한 사고로 제3자에게 배상책임을 짐으로써 입은 손해를 보상하는 수개의 책임보험계약이 동시 또는 순차로 체결된 경우에 그 보험금액의 총액이 피보험자의 제3자에 대한 손해배상액을 초과하는 때에는 제672조와 제673조의 규정을 준용한다.","kind":"L"},{"id":"L:726","label":"법 제726조","title":"재보험에의 준용","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제726조(재보험에의 준용) 이 절(節)의 규정은 그 성질에 반하지 아니하는 범위에서 재보험계약에 준용한다.","kind":"L"},{"id":"L:726-2","label":"법 제726조의2","title":"자동차보험자의 책임","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제726조의2(자동차보험자의 책임) 자동차보험계약의 보험자는 피보험자가 자동차를 소유, 사용 또는 관리하는 동안에 발생한 사고로 인하여 생긴 손해를 보상할 책임이 있다.","kind":"L"},{"id":"L:726-3","label":"법 제726조의3","title":"자동차 보험증권","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"1. 자동차소유자와 그 밖의 보유자의 성명과 생년월일 또는 상호\n2. 피보험자동차의 등록번호, 차대번호, 차형년식과 기계장치\n3. 차량가액을 정한 때에는 그 가액\n제726조의3(자동차 보험증권) 자동차 보험증권에는 제666조에 게기한 사항외에 다음의 사항을 기재하여야 한다.","kind":"L"},{"id":"L:726-4","label":"법 제726조의4","title":"자동차의 양도","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"①피보험자가 보험기간 중에 자동차를 양도한 때에는 양수인은 보험자의 승낙을 얻은 경우에 한하여 보험계약으로 인하여 생긴 권리와 의무를 승계한다.\n②보험자가 양수인으로부터 양수사실을 통지받은 때에는 지체없이 낙부를 통지하여야 하고 통지받은 날부터 10일내에 낙부의 통지가 없을 때에는 승낙한 것으로 본다.\n제726조의4(자동차의 양도)","kind":"L"},{"id":"L:726-5","label":"법 제726조의5","title":"보증보험자의 책임","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제726조의5(보증보험자의 책임) 보증보험계약의 보험자는 보험계약자가 피보험자에게 계약상의 채무불이행 또는 법령상의 의무불이행으로 입힌 손해를 보상할 책임이 있다.","kind":"L"},{"id":"L:726-6","label":"법 제726조의6","title":"적용 제외","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"① 보증보험계약에 관하여는 제639조제2항 단서를 적용하지 아니한다.\n② 보증보험계약에 관하여는 보험계약자의 사기, 고의 또는 중대한 과실이 있는 경우에도 이에 대하여 피보험자에게 책임이 있는 사유가 없으면 제651조, 제652조, 제653조 및 제659조제1항을 적용하지 아니한다.\n제726조의6(적용 제외)","kind":"L"},{"id":"L:726-7","label":"법 제726조의7","title":"준용규정","chapter":"제4편 보험 제2장 손해보험","deleted":false,"text":"제726조의7(준용규정) 보증보험계약에 관하여는 그 성질에 반하지 아니하는 범위에서 보증채무에 관한 「민법」의 규정을 준용한다.","kind":"L"},{"id":"L:727","label":"법 제727조","title":"인보험자의 책임","chapter":"제4편 보험 제3장 인보험","deleted":false,"text":"①인보험계약의 보험자는 피보험자의 생명이나 신체에 관하여 보험사고가 발생할 경우에 보험계약으로 정하는 바에 따라 보험금이나 그 밖의 급여를 지급할 책임이 있다. <개정 2014.3.11>\n② 제1항의 보험금은 당사자 간의 약정에 따라 분할하여 지급할 수 있다. <신설 2014.3.11>\n제727조(인보험자의 책임)","kind":"L"},{"id":"L:728","label":"법 제728조","title":"인보험증권","chapter":"제4편 보험 제3장 인보험","deleted":false,"text":"1. 보험계약의 종류\n2. 피보험자의 주소ㆍ성명 및 생년월일\n3. 보험수익자를 정한 때에는 그 주소ㆍ성명 및 생년월일\n제728조(인보험증권) 인보험증권에는 제666조에 게기한 사항외에 다음의 사항을 기재하여야 한다. <개정 1991.12.31>","kind":"L"},{"id":"L:729","label":"법 제729조","title":"제3자에 대한 보험대위의 금지","chapter":"제4편 보험 제3장 인보험","deleted":false,"text":"제729조(제3자에 대한 보험대위의 금지) 보험자는 보험사고로 인하여 생긴 보험계약자 또는 보험수익자의 제3자에 대한 권리를 대위하여 행사하지 못한다. 그러나 상해보험계약의 경우에 당사자간에 다른 약정이 있는 때에는 보험자는 피보험자의 권리를 해하지 아니하는 범위안에서 그 권리를 대위하여 행사할 수 있다. <개정 1991.12.31>","kind":"L"},{"id":"L:730","label":"법 제730조","title":"생명보험자의 책임","chapter":"제4편 보험 제3장 인보험","deleted":false,"text":"제730조(생명보험자의 책임) 생명보험계약의 보험자는 피보험자의 사망, 생존, 사망과 생존에 관한 보험사고가 발생할 경우에 약정한 보험금을 지급할 책임이 있다. <개정 2014.3.11>","kind":"L"},{"id":"L:731","label":"법 제731조","title":"타인의 생명의 보험","chapter":"제4편 보험 제3장 인보험","deleted":false,"text":"①타인의 사망을 보험사고로 하는 보험계약에는 보험계약 체결시에 그 타인의 서면(「전자서명법」 제2조제2호에 따른 전자서명이 있는 경우로서 대통령령으로 정하는 바에 따라 본인 확인 및 위조ㆍ변조 방지에 대한 신뢰성을 갖춘 전자문서를 포함한다)에 의한 동의를 얻어야 한다. <개정 1991.12.31, 2017.10.31, 2020.6.9>\n②보험계약으로 인하여 생긴 권리를 피보험자가 아닌 자에게 양도하는 경우에도 제1항과 같다. <개정 1991.12.31>\n제731조(타인의 생명의 보험)","kind":"L"},{"id":"L:732","label":"법 제732조","title":"15세미만자등에 대한 계약의 금
