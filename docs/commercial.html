지","chapter":"제4편 보험 제3장 인보험","deleted":false,"text":"제732조(15세미만자등에 대한 계약의 금지) 15세미만자, 심신상실자 또는 심신박약자의 사망을 보험사고로 한 보험계약은 무효로 한다. 다만, 심신박약자가 보험계약을 체결하거나 제735조의3에 따른 단체보험의 피보험자가 될 때에 의사능력이 있는 경우에는 그러하지 아니하다. <개정 1962.12.12, 1991.12.31, 2014.3.11>","kind":"L"},{"id":"L:732-2","label":"법 제732조의2","title":"중과실로 인한 보험사고 등","chapter":"제4편 보험 제3장 인보험","deleted":false,"text":"① 사망을 보험사고로 한 보험계약에서는 사고가 보험계약자 또는 피보험자나 보험수익자의 중대한 과실로 인하여 발생한 경우에도 보험자는 보험금을 지급할 책임을 면하지 못한다.\n② 둘 이상의 보험수익자 중 일부가 고의로 피보험자를 사망하게 한 경우 보험자는 다른 보험수익자에 대한 보험금 지급 책임을 면하지 못한다.\n제732조의2(중과실로 인한 보험사고 등)","kind":"L"},{"id":"L:733","label":"법 제733조","title":"보험수익자의 지정 또는 변경의 권리","chapter":"제4편 보험 제3장 인보험","deleted":false,"text":"①보험계약자는 보험수익자를 지정 또는 변경할 권리가 있다.\n②보험계약자가 제1항의 지정권을 행사하지 아니하고 사망한 때에는 피보험자를 보험수익자로 하고 보험계약자가 제1항의 변경권을 행사하지 아니하고 사망한 때에는 보험수익자의 권리가 확정된다. 그러나 보험계약자가 사망한 경우에는 그 승계인이 제1항의 권리를 행사할 수 있다는 약정이 있는 때에는 그러하지 아니하다. <개정 1991.12.31>\n③보험수익자가 보험존속 중에 사망한 때에는 보험계약자는 다시 보험수익자를 지정할 수 있다. 이 경우에 보험계약자가 지정권을 행사하지 아니하고 사망한 때에는 보험수익자의 상속인을 보험수익자로 한다.\n④보험계약자가 제2항과 제3항의 지정권을 행사하기 전에 보험사고가 생긴 경우에는 피보험자 또는 보험수익자의 상속인을 보험수익자로 한다. <신설 1991.12.31>\n제733조(보험수익자의 지정 또는 변경의 권리)","kind":"L"},{"id":"L:734","label":"법 제734조","title":"보험수익자지정권 등의 통지","chapter":"제4편 보험 제3장 인보험","deleted":false,"text":"①보험계약자가 계약체결후에 보험수익자를 지정 또는 변경할 때에는 보험자에 대하여 그 통지를 하지 아니하면 이로써 보험자에게 대항하지 못한다.\n②제731조제1항의 규정은 제1항의 지정 또는 변경에 준용한다. <개정 1962.12.12, 1991.12.31>\n제734조(보험수익자지정권 등의 통지)","kind":"L"},{"id":"L:735","label":"법 제735조","title":"","chapter":"제4편 보험 제3장 인보험","deleted":true,"text":"제735조 삭제 <2014.3.11>","kind":"L"},{"id":"L:735-2","label":"법 제735조의2","title":"","chapter":"제4편 보험 제3장 인보험","deleted":true,"text":"제735조의2 삭제 <2014.3.11>","kind":"L"},{"id":"L:735-3","label":"법 제735조의3","title":"단체보험","chapter":"제4편 보험 제3장 인보험","deleted":false,"text":"①단체가 규약에 따라 구성원의 전부 또는 일부를 피보험자로 하는 생명보험계약을 체결하는 경우에는 제731조를 적용하지 아니한다.\n②제1항의 보험계약이 체결된 때에는 보험자는 보험계약자에 대하여서만 보험증권을 교부한다.\n③ 제1항의 보험계약에서 보험계약자가 피보험자 또는 그 상속인이 아닌 자를 보험수익자로 지정할 때에는 단체의 규약에서 명시적으로 정하는 경우 외에는 그 피보험자의 제731조제1항에 따른 서면 동의를 받아야 한다. <신설 2014.3.11, 2017.10.31>\n제735조의3(단체보험)","kind":"L"},{"id":"L:736","label":"법 제736조","title":"보험적립금반환의무 등","chapter":"제4편 보험 제3장 인보험","deleted":false,"text":"①제649조, 제650조, 제651조 및 제652조 내지 제655조의 규정에 의하여 보험계약이 해지된 때, 제659조와 제660조의 규정에 의하여 보험금액의 지급책임이 면제된 때에는 보험자는 보험수익자를 위하여 적립한 금액을 보험계약자에게 지급하여야 한다. 그러나 다른 약정이 없으면 제659조제1항의 보험사고가 보험계약자에 의하여 생긴 경우에는 그러하지 아니하다. <개정 1991.12.31>\n② 삭제 <1991.12.31>\n제736조(보험적립금반환의무 등)","kind":"L"},{"id":"L:737","label":"법 제737조","title":"상해보험자의 책임","chapter":"제4편 보험 제3장 인보험","deleted":false,"text":"제737조(상해보험자의 책임) 상해보험계약의 보험자는 신체의 상해에 관한 보험사고가 생길 경우에 보험금액 기타의 급여를 할 책임이 있다.","kind":"L"},{"id":"L:738","label":"법 제738조","title":"상해보험증권","chapter":"제4편 보험 제3장 인보험","deleted":false,"text":"제738조(상해보험증권) 상해보험의 경우에 피보험자와 보험계약자가 동일인이 아닐 때에는 그 보험증권기재사항중 제728조제2호에 게기한 사항에 갈음하여 피보험자의 직무 또는 직위만을 기재할 수 있다.","kind":"L"},{"id":"L:739","label":"법 제739조","title":"준용규정","chapter":"제4편 보험 제3장 인보험","deleted":false,"text":"제739조(준용규정) 상해보험에 관하여는 제732조를 제외하고 생명보험에 관한 규정을 준용한다.","kind":"L"},{"id":"L:739-2","label":"법 제739조의2","title":"질병보험자의 책임","chapter":"제4편 보험 제3장 인보험","deleted":false,"text":"제739조의2(질병보험자의 책임) 질병보험계약의 보험자는 피보험자의 질병에 관한 보험사고가 발생할 경우 보험금이나 그 밖의 급여를 지급할 책임이 있다.","kind":"L"},{"id":"L:739-3","label":"법 제739조의3","title":"질병보험에 대한 준용규정","chapter":"제4편 보험 제3장 인보험","deleted":false,"text":"제739조의3(질병보험에 대한 준용규정) 질병보험에 관하여는 그 성질에 반하지 아니하는 범위에서 생명보험 및 상해보험에 관한 규정을 준용한다.","kind":"L"},{"id":"L:740","label":"법 제740조","title":"선박의 의의","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제740조(선박의 의의) 이 법에서 \"선박\"이란 상행위나 그 밖의 영리를 목적으로 항해에 사용하는 선박을 말한다.","kind":"L"},{"id":"L:741","label":"법 제741조","title":"적용범위","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"①항해용 선박에 대하여는 상행위나 그 밖의 영리를 목적으로 하지 아니하더라도 이 편의 규정을 준용한다. 다만, 국유 또는 공유의 선박에 대하여는 「선박법」 제29조 단서에도 불구하고 항해의 목적ㆍ성질 등을 고려하여 이 편의 규정을 준용하는 것이 적합하지 아니한 경우로서 대통령령으로 정하는 경우에는 그러하지 아니하다.\n②이 편의 규정은 단정(短艇) 또는 주로 노 또는 상앗대로 운전하는 선박에는 적용하지 아니한다.\n제741조(적용범위)","kind":"L"},{"id":"L:742","label":"법 제742조","title":"선박의 종물","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제742조(선박의 종물) 선박의 속구목록(屬具目錄)에 기재한 물건은 선박의 종물로 추정한다.","kind":"L"},{"id":"L:743","label":"법 제743조","title":"선박소유권의 이전","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제743조(선박소유권의 이전) 등기 및 등록할 수 있는 선박의 경우 그 소유권의 이전은 당사자 사이의 합의만으로 그 효력이 생긴다. 다만, 이를 등기하고 선박국적증서에 기재하지 아니하면 제3자에게 대항하지 못한다.","kind":"L"},{"id":"L:744","label":"법 제744조","title":"선박의 압류ㆍ가압류","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"①항해의 준비를 완료한 선박과 그 속구는 압류 또는 가압류를 하지 못한다. 다만, 항해를 준비하기 위하여 생긴 채무에 대하여는 그러하지 아니하다.\n②제1항은 총톤수 20톤 미만의 선박에는 적용하지 아니한다.\n제744조(선박의 압류ㆍ가압류)","kind":"L"},{"id":"L:745","label":"법 제745조","title":"선장의 선임ㆍ해임","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제745조(선장의 선임ㆍ해임) 선장은 선박소유자가 선임 또는 해임한다.","kind":"L"},{"id":"L:746","label":"법 제746조","title":"선장의 부당한 해임에 대한 손해배상청구권","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제746조(선장의 부당한 해임에 대한 손해배상청구권) 선박소유자가 정당한 사유 없이 선장을 해임한 때에는 선장은 이로 인하여 생긴 손해의 배상을 청구할 수 있다.","kind":"L"},{"id":"L:747","label":"법 제747조","title":"선장의 계속직무집행의 책임","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제747조(선장의 계속직무집행의 책임) 선장은 항해 중에 해임 또는 임기가 만료된 경우에도 다른 선장이 그 업무를 처리할 수 있는 때 또는 그 선박이 선적항에 도착할 때까지 그 직무를 집행할 책임이 있다.","kind":"L"},{"id":"L:748","label":"법 제748조","title":"선장의 대선장 선임의 권한 및 책임","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제748조(선장의 대선장 선임의 권한 및 책임) 선장은 불가항력으로 인하여 그 직무를 집행하기가 불능한 때에 법령에 다른 규정이 있는 경우를 제외하고는 자기의 책임으로 타인을 선정하여 선장의 직무를 집행하게 할 수 있다.","kind":"L"},{"id":"L:749","label":"법 제749조","title":"대리권의 범위","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"①선적항 외에서는 선장은 항해에 필요한 재판상 또는 재판 외의 모든 행위를 할 권한이 있다.\n②선적항에서는 선장은 특히 위임을 받은 경우 외에는 해원의 고용과 해고를 할 권한만을 가진다.\n제749조(대리권의 범위)","kind":"L"},{"id":"L:750","label":"법 제750조","title":"특수한 행위에 대한 권한","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"①선장은 선박수선료ㆍ해난구조료, 그 밖에 항해의 계속에 필요한 비용을 지급하여야 할 경우 외에는 다음의 행위를 하지 못한다.\n1. 선박 또는 속구를 담보에 제공하는 일\n2. 차재(借財)하는 일\n3. 적하의 전부나 일부를 처분하는 일\n②적하를 처분할 경우의 손해배상액은 그 적하가 도달할 시기의 양륙항의 가격에 의하여 정한다. 다만, 그 가격 중에서 지급을 요하지 아니하는 비용을 공제하여야 한다.\n제750조(특수한 행위에 대한 권한)","kind":"L"},{"id":"L:751","label":"법 제751조","title":"대리권에 대한 제한","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제751조(대리권에 대한 제한) 선장의 대리권에 대한 제한은 선의의 제3자에게 대항하지 못한다.","kind":"L"},{"id":"L:752","label":"법 제752조","title":"이해관계인을 위한 적하의 처분","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"①선장이 항해 중에 적하를 처분하는 경우에는 이해관계인의 이익을 위하여 가장 적당한 방법으로 하여야 한다.\n②제1항의 경우에 이해관계인은 선장의 처분으로 인하여 생긴 채권자에게 적하의 가액을 한도로 하여 그 책임을 진다. 다만, 그 이해관계인에게 과실이 있는 때에는 그러하지 아니하다.\n제752조(이해관계인을 위한 적하의 처분)","kind":"L"},{"id":"L:753","label":"법 제753조","title":"선박경매권","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제753조(선박경매권) 선적항 외에서 선박이 수선하기 불가능하게 된 때에는 선장은 해무관청의 인가를 받아 이를 경매할 수 있다.","kind":"L"},{"id":"L:754","label":"법 제754조","title":"선박의 수선불능","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"①다음 각 호의 경우에는 선박은 수선하기 불가능하게 된 것으로 본다.\n1. 선박이 그 현재지에서 수선을 받을 수 없으며 또 그 수선을 할 수 있는 곳에 도달하기 불가능한 때\n2. 수선비가 선박의 가액의 4분의 3을 초과할 때\n②제1항제2호의 가액은 선박이 항해 중 훼손된 경우에는 그 발항한 때의 가액으로 하고 그 밖의 경우에는 그 훼손 전의 가액으로 한다.\n제754조(선박의 수선불능)","kind":"L"},{"id":"L:755","label":"법 제755조","title":"보고ㆍ계산의 의무","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"①선장은 항해에 관한 중요한 사항을 지체 없이 선박소유자에게 보고하여야 한다.\n②선장은 매 항해를 종료한 때에는 그 항해에 관한 계산서를 지체 없이 선박소유자에게 제출하여 그 승인을 받아야 한다.\n③선장은 선박소유자의 청구가 있을 때에는 언제든지 항해에 관한 사항과 계산의 보고를 하여야 한다.\n제755조(보고ㆍ계산의 의무)","kind":"L"},{"id":"L:756","label":"법 제756조","title":"선박공유자의 업무결정","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"①공유선박의 이용에 관한 사항은 공유자의 지분의 가격에 따라 그 과반수로 결정한다.\n②선박공유에 관한 계약을 변경하는 사항은 공유자의 전원일치로 결정하여야 한다.\n제756조(선박공유자의 업무결정)","kind":"L"},{"id":"L:757","label":"법 제757조","title":"선박공유와 비용의 부담","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제757조(선박공유와 비용의 부담) 선박공유자는 그 지분의 가격에 따라 선박의 이용에 관한 비용과 이용에 관하여 생긴 채무를 부담한다.","kind":"L"},{"id":"L:758","label":"법 제758조","title":"손익분배","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제758조(손익분배) 손익의 분배는 매 항해의 종료 후에 있어서 선박공유자의 지분의 가격에 따라서 한다.","kind":"L"},{"id":"L:759","label":"법 제759조","title":"지분의 양도","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제759조(지분의 양도) 선박공유자 사이에 조합관계가 있는 경우에도 각 공유자는 다른 공유자의 승낙 없이 그 지분을 타인에게 양도할 수 있다. 다만, 선박관리인의 경우에는 그러하지 아니하다.","kind":"L"},{"id":"L:760","label":"법 제760조","title":"공유선박의 국적상실과 지분의 매수 또는 경매청구","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제760조(공유선박의 국적상실과 지분의 매수 또는 경매청구) 선박공유자의 지분의 이전 또는 그 국적상실로 인하여 선박이 대한민국의 국적을 상실할 때에는 다른 공유자는 상당한 대가로 그 지분을 매수하거나 그 경매를 법원에 청구할 수 있다.","kind":"L"},{"id":"L:761","label":"법 제761조","title":"결의반대자의 지분매수청구권","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"①선박공유자가 신항해를 개시하거나 선박을 대수선할 것을 결의한 때에는 그 결의에 이의가 있는 공유자는 다른 공유자에 대하여 상당한 가액으로 자기의 지분을 매수할 것을 청구할 수 있다.\n②제1항의 청구를 하고자 하는 자는 그 결의가 있은 날부터, 결의에 참가하지 아니한 경우에는 결의통지를 받은 날부터 3일 이내에 다른 공유자 또는 선박관리인에 대하여 그 통지를 발송하여야 한다.\n제761조(결의반대자의 지분매수청구권)","kind":"L"},{"id":"L:762","label":"법 제762조","title":"해임선장의 지분매수청구권","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"①선박공유자인 선장이 그 의사에 반하여 해임된 때에는 다른 공유자에 대하여 상당한 가액으로 그 지분을 매수할 것을 청구할 수 있다.\n②선박공유자가 제1항의 청구를 하고자 하는 때에는 지체 없이 다른 공유자 또는 선박관리인에 대하여 그 통지를 발송하여야 한다.\n제762조(해임선장의 지분매수청구권)","kind":"L"},{"id":"L:763","label":"법 제763조","title":"항해 중 선박 등의 양도","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제763조(항해 중 선박 등의 양도) 항해 중에 있는 선박이나 그 지분을 양도한 경우에 당사자 사이에 다른 약정이 없으면 양수인이 그 항해로부터 생긴 이익을 얻고 손실을 부담한다.","kind":"L"},{"id":"L:764","label":"법 제764조","title":"선박관리인의 선임ㆍ등기","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"①선박공유자는 선박관리인을 선임하여야 한다. 이 경우 선박공유자가 아닌 자를 선박관리인으로 선임함에는 공유자 전원의 동의가 있어야 한다.\n②선박관리인의 선임과 그 대리권의 소멸은 등기하여야 한다.\n제764조(선박관리인의 선임ㆍ등기)","kind":"L"},{"id":"L:765","label":"법 제765조","title":"선박관리인의 권한","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"①선박관리인은 선박의 이용에 관한 재판상 또는 재판 외의 모든 행위를 할 권한이 있다.\n②선박관리인의 대리권에 대한 제한은 선의의 제3자에게 대항하지 못한다.\n제765조(선박관리인의 권한)","kind":"L"},{"id":"L:766","label":"법 제766조","title":"선박관리인의 권한의 제한","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"1. 선박을 양도ㆍ임대 또는 담보에 제공하는 일\n2. 신항해를 개시하는 일\n3. 선박을 보험에 붙이는 일\n4. 선박을 대수선하는 일\n5. 차재하는 일\n제766조(선박관리인의 권한의 제한) 선박관리인은 선박공유자의 서면에 의한 위임이 없으면 다음 각 호의 행위를 하지 못한다.","kind":"L"},{"id":"L:767","label":"법 제767조","title":"장부의 기재ㆍ비치","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제767조(장부의 기재ㆍ비치) 선박관리인은 업무집행에 관한 장부를 비치하고 그 선박의 이용에 관한 모든 사항을 기재하여야 한다.","kind":"L"},{"id":"L:768","label":"법 제768조","title":"선박관리인의 보고ㆍ승인","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제768조(선박관리인의 보고ㆍ승인) 선박관리인은 매 항해의 종료 후에 지체 없이 그 항해의 경과상황과 계산에 관한 서면을 작성하여 선박공유자에게 보고하고 그 승인을 받아야 한다.","kind":"L"},{"id":"L:769","label":"법 제769조","title":"선박소유자의 유한책임","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"1. 선박에서 또는 선박의 운항에 직접 관련하여 발생한 사람의 사망, 신체의 상해 또는 그 선박 외의 물건의 멸실 또는 훼손으로 인하여 생긴 손해에 관한 채권\n2. 운송물, 여객 또는 수하물의 운송의 지연으로 인하여 생긴 손해에 관한 채권\n3. 제1호 및 제2호 외에 선박의 운항에 직접 관련하여 발생한 계약상의 권리 외의 타인의 권리의 침해로 인하여 생긴 손해에 관한 채권\n4. 제1호부터 제3호까지의 채권의 원인이 된 손해를 방지 또는 경감하기 위한 조치에 관한 채권 또는 그 조치의 결과로 인하여 생긴 손해에 관한 채권\n제769조(선박소유자의 유한책임) 선박소유자는 청구원인의 여하에 불구하고 다음 각 호의 채권에 대하여 제770조에 따른 금액의 한도로 그 책임을 제한할 수 있다. 다만, 그 채권이 선박소유자 자신의 고의 또는 손해발생의 염려가 있음을 인식하면서 무모하게 한 작위 또는 부작위로 인하여 생긴 손해에 관한 것인 때에는 그러하지 아니하다.","kind":"L"},{"id":"L:770","label":"법 제770조","title":"책임의 한도액","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"①선박소유자가 제한할 수 있는 책임의 한도액은 다음 각 호의 금액으로 한다.\n1. 여객의 사망 또는 신체의 상해로 인한 손해에 관한 채권에 대한 책임의 한도액은 그 선박의 선박검사증서에 기재된 여객의 정원에 17만5천 계산단위(국제통화기금의 1 특별인출권에 상당하는 금액을 말한다. 이하 같다)를 곱하여 얻은 금액으로 한다.\n2. 여객 외의 사람의 사망 또는 신체의 상해로 인한 손해에 관한 채권에 대한 책임의 한도액은 그 선박의 톤수에 따라서 다음 각 목에 정하는 바에 따라 계산된 금액으로 한다. 다만, 300톤 미만의 선박의 경우에는 16만7천 계산단위에 상당하는 금액으로 한다.\n가. 500톤 이하의 선박의 경우에는 33만3천 계산단위에 상당하는 금액\n나. 500톤을 초과하는 선박의 경우에는 가목의 금액에 500톤을 초과하여 3천톤까지의 부분에 대하여는 매 톤당 500 계산단위, 3천톤을 초과하여 3만톤까지의 부분에 대하여는 매 톤당 333 계산단위, 3만톤을 초과하여 7만톤까지의 부분에 대하여는 매 톤당 250 계산단위 및 7만톤을 초과한 부분에 대하여는 매 톤당 167 계산단위를 각 곱하여 얻은 금액을 순차로 가산한 금액\n3. 제1호 및 제2호 외의 채권에 대한 책임의 한도액은 그 선박의 톤수에 따라서 다음 각 목에 정하는 바에 따라 계산된 금액으로 한다. 다만, 300톤 미만의 선박의 경우에는 8만3천 계산단위에 상당하는 금액으로 한다.\n가. 500톤 이하의 선박의 경우에는 16만7천 계산단위에 상당하는 금액\n나. 500톤을 초과하는 선박의 경우에는 가목의 금액에 500톤을 초과하여 3만톤까지의 부분에 대하여는 매 톤당 167 계산단위, 3만톤을 초과하여 7만톤까지의 부분에 대하여는 매 톤당 125 계산단위 및 7만톤을 초과한 부분에 대하여는 매 톤당 83 계산단위를 각 곱하여 얻은 금액을 순차로 가산한 금액\n②제1항 각 호에 따른 각 책임한도액은 선박마다 동일한 사고에서 생긴 각 책임한도액에 대응하는 선박소유자에 대한 모든 채권에 미친다.\n③제769조에 따라 책임이 제한되는 채권은 제1항 각 호에 따른 각 책임한도액에 대하여 각 채권액의 비율로 경합한다.\n④제1항제2호에 따른 책임한도액이 같은 호의 채권의 변제에 부족한 때에는 제3호에 따른 책임한도액을 그 잔액채권의 변제에 충당한다. 이 경우 동일한 사고에서 제3호의 채권도 발생한 때에는 이 채권과 제2호의 잔액채권은 제3호에 따른 책임한도액에 대하여 각 채권액의 비율로 경합한다.\n제770조(책임의 한도액)","kind":"L"},{"id":"L:771","label":"법 제771조","title":"동일한 사고로 인한 반대채권액의 공제","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제771조(동일한 사고로 인한 반대채권액의 공제) 선박소유자가 책임의 제한을 받는 채권자에 대하여 동일한 사고로 인하여 생긴 손해에 관한 채권을 가지는 경우에는 그 채권액을 공제한 잔액에 한하여 책임의 제한을 받는 채권으로 한다.","kind":"L"},{"id":"L:772","label":"법 제772조","title":"책임제한을 위한 선박톤수","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제772조(책임제한을 위한 선박톤수) 제770조제1항에서 규정하는 선박의 톤수는 국제항해에 종사하는 선박의 경우에는 「선박법」에서 규정하는 국제총톤수로 하고 그 밖의 선박의 경우에는 같은 법에서 규정하는 총톤수로 한다.","kind":"L"},{"id":"L:773","label":"법 제773조","title":"유한책임의 배제","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"1. 선장ㆍ해원, 그 밖의 사용인으로서 그 직무가 선박의 업무에 관련된 자 또는 그 상속인, 피부양자, 그 밖의 이해관계인의 선박소유자에 대한 채권\n2. 해난구조로 인한 구조료 채권 및 공동해손의 분담에 관한 채권\n3. 1969년 11월 29일 성립한 「유류오염손해에 대한 민사책임에 관한 국제조약」 또는 그 조약의 개정조항이 적용되는 유류오염손해에 관한 채권\n4. 침몰ㆍ난파ㆍ좌초ㆍ유기, 그 밖의 해양사고를 당한 선박 및 그 선박 안에 있거나 있었던 적하와 그 밖의 물건의 인양ㆍ제거ㆍ파괴 또는 무해조치에 관한 채권\n5. 원자력손해에 관한 채권\n제773조(유한책임의 배제) 선박소유자는 다음 각 호의 채권에 대하여는 그 책임을 제한하지 못한다.","kind":"L"},{"id":"L:774","label":"법 제774조","title":"책임제한을 할 수 있는 자의 범위","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"①다음 각 호의 어느 하나에 해당하는 자는 이 절의 규정에 따라 선박소유자의 경우와 동일하게 책임을 제한할 수 있다.\n1. 용선자ㆍ선박관리인 및 선박운항자\n2. 법인인 선박소유자 및 제1호에 규정된 자의 무한책임사원\n3. 자기의 행위로 인하여 선박소유자 또는 제1호에 규정된 자에 대하여 제769조 각 호에 따른 채권이 성립하게 한 선장ㆍ 해원ㆍ도선사, 그 밖의 선박소유자 또는 제1호에 규정된 자의 사용인 또는 대리인\n②동일한 사고에서 발생한 모든 채권에 대한 선박소유자 및 제1항에 규정된 자에 의한 책임제한의 총액은 선박마다 제770조에 따른 책임한도액을 초과하지 못한다.\n③선박소유자 또는 제1항 각 호에 규정된 자의 1인이 책임제한절차개시의 결정을 받은 때에는 책임제한을 할 수 있는 다른 자도 이를 원용할 수 있다.\n제774조(책임제한을 할 수 있는 자의 범위)","kind":"L"},{"id":"L:775","label":"법 제775조","title":"구조자의 책임제한","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"①구조자 또는 그 피용자의 구조활동과 직접 관련하여 발생한 사람의 사망ㆍ신체의 상해, 재산의 멸실이나 훼손, 계약상 권리 외의 타인의 권리의 침해로 인하여 생긴 손해에 관한 채권 및 그러한 손해를 방지 혹은 경감하기 위한 조치에 관한 채권 또는 그 조치의 결과로 인하여 생긴 손해에 관한 채권에 대하여는 제769조부터 제774조(제769조제2호 및 제770조제1항제1호를 제외한다)까지의 규정에 따라 구조자도 책임을 제한할 수 있다.\n②구조활동을 선박으로부터 행하지 아니한 구조자 또는 구조를 받는 선박에서만 행한 구조자는 제770조에 따른 책임의 한도액에 관하여 1천500톤의 선박에 의한 구조자로 본다.\n③구조자의 책임의 한도액은 구조선마다 또는 제2항의 경우에는 구조자마다 동일한 사고로 인하여 생긴 모든 채권에 미친다.\n④제1항에서 \"구조자\"란 구조활동에 직접 관련된 용역을 제공한 자를 말하며, \"구조활동\"이란 해난구조 시의 구조활동은 물론 침몰ㆍ난파ㆍ좌초ㆍ유기, 그 밖의 해양사고를 당한 선박 및 그 선박 안에 있거나 있었던 적하와 그 밖의 물건의 인양ㆍ제거ㆍ파괴 또는 무해조치 및 이와 관련된 손해를 방지 또는 경감하기 위한 모든 조치를 말한다.\n제775조(구조자의 책임제한)","kind":"L"},{"id":"L:776","label":"법 제776조","title":"책임제한의 절차","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"①이 절의 규정에 따라 책임을 제한하고자 하는 자는 채권자로부터 책임한도액을 초과하는 청구금액을 명시한 서면에 의한 청구를 받은 날부터 1년 이내에 법원에 책임제한절차개시의 신청을 하여야 한다.\n②책임제한절차 개시의 신청, 책임제한의 기금의 형성ㆍ공고ㆍ참가ㆍ배당, 그 밖에 필요한 사항은 별도로 법률로 정한다.\n제776조(책임제한의 절차)","kind":"L"},{"id":"L:777","label":"법 제777조","title":"선박우선특권 있는 채권","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"①다음의 채권을 가진 자는 선박ㆍ그 속구, 그 채권이 생긴 항해의 운임, 그 선박과 운임에 부수한 채권에 대하여 우선특권이 있다.\n1. 채권자의 공동이익을 위한 소송비용, 항해에 관하여 선박에 과한 제세금, 도선료ㆍ예선료, 최후 입항 후의 선박과 그 속구의 보존비ㆍ검사비\n2. 선원과 그 밖의 선박사용인의 고용계약으로 인한 채권\n3. 해난구조로 인한 선박에 대한 구조료 채권과 공동해손의 분담에 대한 채권\n4. 선박의 충돌과 그 밖의 항해사고로 인한 손해, 항해시설ㆍ항만시설 및 항로에 대한 손해와 선원이나 여객의 생명ㆍ신체에 대한 손해의 배상채권\n②제1항의 우선특권을 가진 선박채권자는 이 법과 그 밖의 법률의 규정에 따라 제1항의 재산에 대하여 다른 채권자보다 자기채권의 우선변제를 받을 권리가 있다. 이 경우 그 성질에 반하지 아니하는 한 「민법」의 저당권에 관한 규정을 준용한다.\n제777조(선박우선특권 있는 채권)","kind":"L"},{"id":"L:778","label":"법 제778조","title":"선박ㆍ운임에 부수한 채권","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"1. 선박 또는 운임의 손실로 인하여 선박소유자에게 지급할 손해배상\n2. 공동해손으로 인한 선박 또는 운임의 손실에 대하여 선박소유자에게 지급할 상금\n3. 해난구조로 인하여 선박소유자에게 지급할 구조료\n제778조(선박ㆍ운임에 부수한 채권) 제777조에 따른 선박과 운임에 부수한 채권은 다음과 같다.","kind":"L"},{"id":"L:779","label":"법 제779조","title":"운임에 대한 우선특권","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제779조(운임에 대한 우선특권) 운임에 대한 우선특권은 지급을 받지 아니한 운임 및 지급을 받은 운임 중 선박소유자나 그 대리인이 소지한 금액에 한하여 행사할 수 있다.","kind":"L"},{"id":"L:780","label":"법 제780조","title":"보험금 등의 제외","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제780조(보험금 등의 제외) 보험계약에 의하여 선박소유자에게 지급할 보험금과 그 밖의 장려금이나 보조금에 대하여는 제778조를 적용하지 아니한다.","kind":"L"},{"id":"L:781","label":"법 제781조","title":"선박사용인의 고용계약으로 인한 채권","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제781조(선박사용인의 고용계약으로 인한 채권) 제777조제1항제2호에 따른 채권은 고용계약 존속 중의 모든 항해로 인한 운임의 전부에 대하여 우선특권이 있다.","kind":"L"},{"id":"L:782","label":"법 제782조","title":"동일항해로 인한 채권에 대한 우선특권의 순위","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"①동일항해로 인한 채권의 우선특권이 경합하는 때에는 그 우선의 순위는 제777조제1항 각 호의 순서에 따른다.\n②제777조제1항제3호에 따른 채권의 우선특권이 경합하는 때에는 후에 생긴 채권이 전에 생긴 채권에 우선한다. 동일한 사고로 인한 채권은 동시에 생긴 것으로 본다.\n제782조(동일항해로 인한 채권에 대한 우선특권의 순위)","kind":"L"},{"id":"L:783","label":"법 제783조","title":"수회항해에 관한 채권에 대한 우선특권의 순위","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"①수회의 항해에 관한 채권의 우선특권이 경합하는 때에는 후의 항해에 관한 채권이 전의 항해에 관한 채권에 우선한다.\n②제781조에 따른 우선특권은 그 최후의 항해에 관한 다른 채권과 동일한 순위로 한다.\n제783조(수회항해에 관한 채권에 대한 우선특권의 순위)","kind":"L"},{"id":"L:784","label":"법 제784조","title":"동일순위의 우선특권이 경합한 경우","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제784조(동일순위의 우선특권이 경합한 경우) 제781조부터 제783조까지의 규정에 따른 동일순위의 우선특권이 경합하는 때에는 각 채권액의 비율에 따라 변제한다.","kind":"L"},{"id":"L:785","label":"법 제785조","title":"우선특권의 추급권","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제785조(우선특권의 추급권) 선박채권자의 우선특권은 그 선박소유권의 이전으로 인하여 영향을 받지 아니한다.","kind":"L"},{"id":"L:786","label":"법 제786조","title":"우선특권의 소멸","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제786조(우선특권의 소멸) 선박채권자의 우선특권은 그 채권이 생긴 날부터 1년 이내에 실행하지 아니하면 소멸한다.","kind":"L"},{"id":"L:787","label":"법 제787조","title":"선박저당권","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"①등기한 선박은 저당권의 목적으로 할 수 있다.\n②선박의 저당권은 그 속구에 미친다.\n③선박의 저당권에는 「민법」의 저당권에 관한 규정을 준용한다.\n제787조(선박저당권)","kind":"L"},{"id":"L:788","label":"법 제788조","title":"선박저당권 등과 우선특권의 경합","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제788조(선박저당권 등과 우선특권의 경합) 선박채권자의 우선특권은 질권과 저당권에 우선한다.","kind":"L"},{"id":"L:789","label":"법 제789조","title":"등기선박의 입질불허","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제789조(등기선박의 입질불허) 등기한 선박은 질권의 목적으로 하지 못한다.","kind":"L"},{"id":"L:790","label":"법 제790조","title":"건조 중의 선박에의 준용","chapter":"제5편 해상 제1장 해상기업","deleted":false,"text":"제790조(건조 중의 선박에의 준용) 이 절의 규정은 건조 중의 선박에 준용한다.","kind":"L"},{"id":"L:791","label":"법 제791조","title":"개품운송계약의 의의","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"제791조(개품운송계약의 의의) 개품운송계약은 운송인이 개개의 물건을 해상에서 선박으로 운송할 것을 인수하고, 송하인이 이에 대하여 운임을 지급하기로 약정함으로써 그 효력이 생긴다.","kind":"L"},{"id":"L:792","label":"법 제792조","title":"운송물의 제공","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①송하인은 당사자 사이의 합의 또는 선적항의 관습에 의한 때와 곳에서 운송인에게 운송물을 제공하여야 한다.\n②제1항에 따른 때와 곳에서 송하인이 운송물을 제공하지 아니한 경우에는 계약을 해제한 것으로 본다. 이 경우 선장은 즉시 발항할 수 있고, 송하인은 운임의 전액을 지급하여야 한다.\n제792조(운송물의 제공)","kind":"L"},{"id":"L:793","label":"법 제793조","title":"운송에 필요한 서류의 교부","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"제793조(운송에 필요한 서류의 교부) 송하인은 선적기간 이내에 운송에 필요한 서류를 선장에게 교부하여야 한다.","kind":"L"},{"id":"L:794","label":"법 제794조","title":"감항능력 주의의무","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"1. 선박이 안전하게 항해를 할 수 있게 할 것\n2. 필요한 선원의 승선, 선박의장(艤裝)과 필요품의 보급\n3. 선창ㆍ냉장실, 그 밖에 운송물을 적재할 선박의 부분을 운송물의 수령ㆍ운송과 보존을 위하여 적합한 상태에 둘 것\n제794조(감항능력 주의의무) 운송인은 자기 또는 선원이나 그 밖의 선박사용인이 발항 당시 다음의 사항에 관하여 주의를 해태하지 아니하였음을 증명하지 아니하면 운송물의 멸실ㆍ훼손 또는 연착으로 인한 손해를 배상할 책임이 있다.","kind":"L"},{"id":"L:795","label":"법 제795조","title":"운송물에 관한 주의의무","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①운송인은 자기 또는 선원이나 그 밖의 선박사용인이 운송물의 수령ㆍ선적ㆍ적부(積付)ㆍ운송ㆍ보관ㆍ양륙과 인도에 관하여 주의를 해태하지 아니하였음을 증명하지 아니하면 운송물의 멸실ㆍ훼손 또는 연착으로 인한 손해를 배상할 책임이 있다.\n②운송인은 선장ㆍ해원ㆍ도선사, 그 밖의 선박사용인의 항해 또는 선박의 관리에 관한 행위 또는 화재로 인하여 생긴 운송물에 관한 손해를 배상할 책임을 면한다. 다만, 운송인의 고의 또는 과실로 인한 화재의 경우에는 그러하지 아니하다.\n제795조(운송물에 관한 주의의무)","kind":"L"},{"id":"L:796","label":"법 제796조","title":"운송인의 면책사유","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"1. 해상이나 그 밖에 항행할 수 있는 수면에서의 위험 또는 사고\n2. 불가항력\n3. 전쟁ㆍ폭동 또는 내란\n4. 해적행위나 그 밖에 이에 준한 행위\n5. 재판상의 압류, 검역상의 제한, 그 밖에 공권에 의한 제한\n6. 송하인 또는 운송물의 소유자나 그 사용인의 행위\n7. 동맹파업이나 그 밖의 쟁의행위 또는 선박폐쇄\n8. 해상에서의 인명이나 재산의 구조행위 또는 이로 인한 항로이탈이나 그 밖의 정당한 사유로 인한 항로이탈\n9. 운송물의 포장의 불충분 또는 기호의 표시의 불완전\n10. 운송물의 특수한 성질 또는 숨은 하자\n11. 선박의 숨은 하자\n제796조(운송인의 면책사유) 운송인은 다음 각 호의 사실이 있었다는 것과 운송물에 관한 손해가 그 사실로 인하여 보통 생길 수 있는 것임을 증명한 때에는 이를 배상할 책임을 면한다. 다만, 제794조 및 제795조제1항에 따른 주의를 다하였더라면 그 손해를 피할 수 있었음에도 불구하고 그 주의를 다하지 아니하였음을 증명한 때에는 그러하지 아니하다.","kind":"L"},{"id":"L:797","label":"법 제797조","title":"책임의 한도","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①제794조부터 제796조까지의 규정에 따른 운송인의 손해배상의 책임은 당해 운송물의 매 포장당 또는 선적단위당 666과 100분의 67 계산단위의 금액과 중량 1킬로그램당 2 계산단위의 금액 중 큰 금액을 한도로 제한할 수 있다. 다만, 운송물에 관한 손해가 운송인 자신의 고의 또는 손해발생의 염려가 있음을 인식하면서 무모하게 한 작위 또는 부작위로 인하여 생긴 것인 때에는 그러하지 아니하다.\n②제1항의 적용에 있어서 운송물의 포장 또는 선적단위의 수는 다음과 같이 정한다.\n1. 컨테이너나 그 밖에 이와 유사한 운송용기가 운송물을 통합하기 위하여 사용되는 경우에 그러한 운송용기에 내장된 운송물의 포장 또는 선적단위의 수를 선하증권이나 그 밖에 운송계약을 증명하는 문서에 기재한 때에는 그 각 포장 또는 선적단위를 하나의 포장 또는 선적단위로 본다. 이 경우를 제외하고는 이러한 운송용기 내의 운송물 전부를 하나의 포장 또는 선적단위로 본다.\n2. 운송인이 아닌 자가 공급한 운송용기 자체가 멸실 또는 훼손된 경우에는 그 용기를 별개의 포장 또는 선적단위로 본다.\n③제1항 및 제2항은 송하인이 운송인에게 운송물을 인도할 때에 그 종류와 가액을 고지하고 선하증권이나 그 밖에 운송계약을 증명하는 문서에 이를 기재한 경우에는 적용하지 아니한다. 다만, 송하인이 운송물의 종류 또는 가액을 고의로 현저하게 부실의 고지를 한 때에는 운송인은 자기 또는 그 사용인이 악의인 경우를 제외하고 운송물의 손해에 대하여 책임을 면한다.\n④제1항부터 제3항까지의 규정은 제769조부터 제774조까지 및 제776조의 적용에 영향을 미치지 아니한다.\n제797조(책임의 한도)","kind":"L"},{"id":"L:798","label":"법 제798조","title":"비계약적 청구에 대한 적용","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①이 절의 운송인의 책임에 관한 규정은 운송인의 불법행위로 인한 손해배상의 책임에도 적용한다.\n②운송물에 관한 손해배상청구가 운송인의 사용인 또는 대리인에 대하여 제기된 경우에 그 손해가 그 사용인 또는 대리인의 직무집행에 관하여 생긴 것인 때에는 그 사용인 또는 대리인은 운송인이 주장할 수 있는 항변과 책임제한을 원용할 수 있다. 다만, 그 손해가 그 사용인 또는 대리인의 고의 또는 운송물의 멸실ㆍ훼손 또는 연착이 생길 염려가 있음을 인식하면서 무모하게 한 작위 또는 부작위로 인하여 생긴 것인 때에는 그러하지 아니하다.\n③제2항 본문의 경우에 운송인과 그 사용인 또는 대리인의 운송물에 대한 책임제한금액의 총액은 제797조제1항에 따른 한도를 초과하지 못한다.\n④제1항부터 제3항까지의 규정은 운송물에 관한 손해배상청구가 운송인 외의 실제운송인 또는 그 사용인이나 대리인에 대하여 제기된 경우에도 적용한다.\n제798조(비계약적 청구에 대한 적용)","kind":"L"},{"id":"L:799","label":"법 제799조","title":"운송인의 책임경감금지","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①제794조부터 제798조까지의 규정에 반하여 운송인의 의무 또는 책임을 경감 또는 면제하는 당사자 사이의 특약은 효력이 없다. 운송물에 관한 보험의 이익을 운송인에게 양도하는 약정 또는 이와 유사한 약정도 또한 같다.\n②제1항은 산 동물의 운송 및 선하증권이나 그 밖에 운송계약을 증명하는 문서의 표면에 갑판적(甲板積)으로 운송할 취지를 기재하여 갑판적으로 행하는 운송에 대하여는 적용하지 아니한다.\n제799조(운송인의 책임경감금지)","kind":"L"},{"id":"L:800","label":"법 제800조","title":"위법선적물의 처분","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①선장은 법령 또는 계약을 위반하여 선적된 운송물은 언제든지 이를 양륙할 수 있고, 그 운송물이 선박 또는 다른 운송물에 위해를 미칠 염려가 있는 때에는 이를 포기할 수 있다.\n②선장이 제1항의 물건을 운송하는 때에는 선적한 때와 곳에서의 동종 운송물의 최고운임의 지급을 청구할 수 있다.\n③제1항 및 제2항은 운송인과 그 밖의 이해관계인의 손해배상청구에 영향을 미치지 아니한다.\n제800조(위법선적물의 처분)","kind":"L"},{"id":"L:801","label":"법 제801조","title":"위험물의 처분","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①인화성ㆍ폭발성이나 그 밖의 위험성이 있는 운송물은 운송인이 그 성질을 알고 선적한 경우에도 그 운송물이 선박이나 다른 운송물에 위해를 미칠 위험이 있는 때에는 선장은 언제든지 이를 양륙ㆍ파괴 또는 무해조치할 수 있다.\n②운송인은 제1항의 처분에 의하여 그 운송물에 발생한 손해에 대하여는 공동해손분담책임을 제외하고 그 배상책임을 면한다.\n제801조(위험물의 처분)","kind":"L"},{"id":"L:802","label":"법 제802조","title":"운송물의 수령","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"제802조(운송물의 수령) 운송물의 도착통지를 받은 수하인은 당사자 사이의 합의 또는 양륙항의 관습에 의한 때와 곳에서 지체 없이 운송물을 수령하여야 한다.","kind":"L"},{"id":"L:803","label":"법 제803조","title":"운송물의 공탁 등","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①수하인이 운송물의 수령을 게을리한 때에는 선장은 이를 공탁하거나 세관이나 그 밖에 법령으로 정한 관청의 허가를 받은 곳에 인도할 수 있다. 이 경우 지체 없이 수하인에게 그 통지를 발송하여야 한다.\n②수하인을 확실히 알 수 없거나 수하인이 운송물의 수령을 거부한 때에는 선장은 이를 공탁하거나 세관이나 그 밖에 법령으로 정한  관청의 허가를 받은 곳에 인도하고 지체 없이 용선자 또는 송하인 및 알고 있는 수하인에게 그 통지를 발송하여야 한다.\n③제1항 및 제2항에 따라 운송물을 공탁하거나 세관이나 그 밖에 법령으로 정한 관청의 허가를 받은 곳에 인도한 때에는 선하증권소지인이나 그 밖의 수하인에게 운송물을 인도한 것으로 본다.\n제803조(운송물의 공탁 등)","kind":"L"},{"id":"L:804","label":"법 제804조","title":"운송물의 일부 멸실ㆍ훼손에 관한 통지","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①수하인이 운송물의 일부 멸실 또는 훼손을 발견한 때에는 수령 후 지체 없이 그 개요에 관하여 운송인에게 서면에 의한 통지를 발송하여야 한다. 다만, 그 멸실 또는 훼손이 즉시 발견할 수 없는 것인 때에는 수령한 날부터 3일 이내에 그 통지를 발송하여야 한다.\n②제1항의 통지가 없는 경우에는 운송물이 멸실 또는 훼손 없이 수하인에게 인도된 것으로 추정한다.\n③제1항 및 제2항은 운송인 또는 그 사용인이 악의인 경우에는 적용하지 아니한다.\n④운송물에 멸실 또는 훼손이 발생하였거나 그 의심이 있는 경우에는 운송인과 수하인은 서로 운송물의 검사를 위하여 필요한 편의를 제공하여야 한다.\n⑤제1항부터 제4항까지의 규정에 반하여 수하인에게 불리한 당사자 사이의 특약은 효력이 없다.\n제804조(운송물의 일부 멸실ㆍ훼손에 관한 통지)","kind":"L"},{"id":"L:805","label":"법 제805조","title":"운송물의 중량ㆍ용적에 따른 운임","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"제805조(운송물의 중량ㆍ용적에 따른 운임) 운송물의 중량 또는 용적으로 운임을 정한 때에는 운송물을 인도하는 때의 중량 또는 용적에 의하여 그 액을 정한다.","kind":"L"},{"id":"L:806","label":"법 제806조","title":"운송기간에 따른 운임","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①기간으로 운임을 정한 때에는 운송물의 선적을 개시한 날부터 그 양륙을 종료한 날까지의 기간에 의하여 그 액을 정한다.\n②제1항의 기간에는 불가항력으로 인하여 선박이 선적항이나 항해도중에 정박한 기간 또는 항해 도중에 선박을 수선한 기간을 산입하지 아니한다.\n제806조(운송기간에 따른 운임)","kind":"L"},{"id":"L:807","label":"법 제807조","title":"수하인의 의무, 선장의 유치권","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①수하인이 운송물을 수령하는 때에는 운송계약 또는 선하증권의 취지에 따라 운임ㆍ부수비용ㆍ체당금ㆍ체선료, 운송물의 가액에 따른 공동해손 또는 해난구조로 인한 부담액을 지급하여야 한다.\n②선장은 제1항에 따른 금액의 지급과 상환하지 아니하면 운송물을 인도할 의무가 없다.\n제807조(수하인의 의무, 선장의 유치권)","kind":"L"},{"id":"L:808","label":"법 제808조","title":"운송인의 운송물경매권","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①운송인은 제807조제1항에 따른 금액의 지급을 받기 위하여 법원의 허가를 받아 운송물을 경매하여 우선변제를 받을 권리가 있다.\n②선장이 수하인에게 운송물을 인도한 후에도 운송인은 그 운송물에 대하여 제1항의 권리를 행사할 수 있다. 다만, 인도한 날부터 30일을 경과하거나 제3자가 그 운송물에 점유를 취득한 때에는 그러하지 아니하다.\n제808조(운송인의 운송물경매권)","kind":"L"},{"id":"L:809","label":"법 제809조","title":"항해용선자 등의 재운송계약시 선박소유자의 책임","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"제809조(항해용선자 등의 재운송계약시 선박소유자의 책임) 항해용선자 또는 정기용선자가 자기의 명의로 제3자와 운송계약을 체결한 경우에는 그 계약의 이행이 선장의 직무에 속한 범위 안에서 선박소유자도 그 제3자에 대하여 제794조 및 제795조에 따른 책임을 진다.","kind":"L"},{"id":"L:810","label":"법 제810조","title":"운송계약의 종료사유","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①운송계약은 다음의 사유로 인하여 종료한다.\n1. 선박이 침몰 또는 멸실한 때\n2. 선박이 수선할 수 없게 된 때\n3. 선박이 포획된 때\n4. 운송물이 불가항력으로 인하여 멸실된 때\n②제1항제1호부터 제3호까지의 사유가 항해 도중에 생긴 때에는 송하인은 운송의 비율에 따라 현존하는 운송물의 가액의 한도에서 운임을 지급하여야 한다.\n제810조(운송계약의 종료사유)","kind":"L"},{"id":"L:811","label":"법 제811조","title":"법정사유로 인한 해제 등","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①항해 또는 운송이 법령을 위반하게 되거나 그 밖에 불가항력으로 인하여 계약의 목적을 달할 수 없게 된 때에는 각 당사자는 계약을 해제할 수 있다.\n②제1항의 사유가 항해 도중에 생긴 경우에 계약을 해지한 때에는 송하인은 운송의 비율에 따라 운임을 지급하여야 한다.\n제811조(법정사유로 인한 해제 등)","kind":"L"},{"id":"L:812","label":"법 제812조","title":"운송물의 일부에 관한 불가항력","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①제810조제1항제4호 및 제811조제1항의 사유가 운송물의 일부에 대하여 생긴 때에는 송하인은 운송인의 책임이 가중되지 아니하는 범위 안에서 다른 운송물을 선적할 수 있다.\n②송하인이 제1항의 권리를 행사하고자 하는 때에는 지체 없이 운송물의 양륙 또는 선적을 하여야 한다. 그 양륙 또는 선적을 게을리한 때에는 운임의 전액을 지급하여야 한다.\n제812조(운송물의 일부에 관한 불가항력)","kind":"L"},{"id":"L:813","label":"법 제813조","title":"선장의 적하처분과 운임","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"1. 선장이 제750조제1항에 따라 적하를 처분하였을 때\n2. 선장이 제865조에 따라 적하를 처분하였을 때\n제813조(선장의 적하처분과 운임) 운송인은 다음 각 호의 어느 하나에 해당하는 경우에는 운임의 전액을 청구할 수 있다.","kind":"L"},{"id":"L:814","label":"법 제814조","title":"운송인의 채권ㆍ채무의 소멸","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①운송인의 송하인 또는 수하인에 대한 채권 및 채무는 그 청구원인의 여하에 불구하고 운송인이 수하인에게 운송물을 인도한 날 또는 인도할 날부터 1년 이내에 재판상 청구가 없으면 소멸한다. 다만, 이 기간은 당사자의 합의에 의하여 연장할 수 있다.\n②운송인이 인수한 운송을 다시 제3자에게 위탁한 경우에 송하인 또는 수하인이 제1항의 기간 이내에 운송인과 배상 합의를 하거나 운송인에게 재판상 청구를 하였다면, 그 합의 또는 청구가 있은 날부터 3개월이 경과하기 이전에는 그 제3자에 대한 운송인의 채권ㆍ채무는 제1항에도 불구하고 소멸하지 아니한다. 운송인과 그 제3자 사이에 제1항 단서와 동일한 취지의 약정이 있는 경우에도 또한 같다.\n③제2항의 경우에 있어서 재판상 청구를 받은 운송인이 그로부터 3개월 이내에 그 제3자에 대하여 소송고지를 하면 3개월의 기간은 그 재판이 확정되거나 그 밖에 종료된 때부터 기산한다.\n제814조(운송인의 채권ㆍ채무의 소멸)","kind":"L"},{"id":"L:815","label":"법 제815조","title":"준용규정","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"제815조(준용규정) 제134조, 제136조부터 제140조까지의 규정은 이 절에서 정한 운송인에 준용한다.","kind":"L"},{"id":"L:816","label":"법 제816조","title":"복합운송인의 책임","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①운송인이 인수한 운송에 해상 외의 운송구간이 포함된 경우 운송인은 손해가 발생한 운송구간에 적용될 법에 따라 책임을 진다.\n②어느 운송구간에서 손해가 발생하였는지 불분명한 경우 또는 손해의 발생이 성질상 특정한 지역으로 한정되지 아니하는 경우에는 운송인은 운송거리가 가장 긴 구간에 적용되는 법에 따라 책임을 진다. 다만, 운송거리가 같거나 가장 긴 구간을 정할 수 없는 경우에는 운임이 가장 비싼 구간에 적용되는 법에 따라 책임을 진다.\n제816조(복합운송인의 책임)","kind":"L"},{"id":"L:817","label":"법 제817조","title":"해상여객운송계약의 의의","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"제817조(해상여객운송계약의 의의) 해상여객운송계약은 운송인이 특정한 여객을 출발지에서 도착지까지 해상에서 선박으로 운송할 것을 인수하고, 이에 대하여 상대방이 운임을 지급하기로 약정함으로써 그 효력이 생긴다.","kind":"L"},{"id":"L:818","label":"법 제818조","title":"기명식의 선표","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"제818조(기명식의 선표) 기명식의 선표는 타인에게 양도하지 못한다.","kind":"L"},{"id":"L:819","label":"법 제819조","title":"식사ㆍ거처제공의무 등","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①여객의 항해 중의 식사는 다른 약정이 없으면 운송인의 부담으로 한다.\n②항해 도중에 선박을 수선하는 경우에는 운송인은 그 수선 중 여객에게 상당한 거처와 식사를 제공하여야 한다. 다만, 여객의 권리를 해하지 아니하는 범위 안에서 상륙항까지의 운송의 편의를 제공한 때에는 그러하지 아니하다.\n③제2항의 경우에 여객은 항해의 비율에 따른 운임을 지급하고 계약을 해지할 수 있다.\n제819조(식사ㆍ거처제공의무 등)","kind":"L"},{"id":"L:820","label":"법 제820조","title":"수하물 무임운송의무","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"제820조(수하물 무임운송의무) 여객이 계약에 의하여 선내에서 휴대할 수 있는 수하물에 대하여는 운송인은 다른 약정이 없으면 별도로 운임을 청구하지 못한다.","kind":"L"},{"id":"L:821","label":"법 제821조","title":"승선지체와 선장의 발항권","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①여객이 승선시기까지 승선하지 아니한 때에는 선장은 즉시 발항할 수 있다. 항해 도중의 정박항에서도 또한 같다.\n②제1항의 경우에는 여객은 운임의 전액을 지급하여야 한다.\n제821조(승선지체와 선장의 발항권)","kind":"L"},{"id":"L:822","label":"법 제822조","title":"여객의 계약해제와 운임","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"제822조(여객의 계약해제와 운임) 여객이 발항 전에 계약을 해제하는 경우에는 운임의 반액을 지급하고, 발항 후에 계약을 해제하는 경우에는 운임의 전액을 지급하여야 한다.","kind":"L"},{"id":"L:823","label":"법 제823조","title":"법정사유에 의한 해제","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"제823조(법정사유에 의한 해제) 여객이 발항 전에 사망ㆍ질병이나 그 밖의 불가항력으로 인하여 항해할 수 없게 된 때에는 운송인은 운임의 10분의 3을 청구할 수 있고, 발항 후에 그 사유가 생긴 때에는 운송인의 선택으로 운임의 10분의 3 또는 운송의 비율에 따른 운임을 청구할 수 있다.","kind":"L"},{"id":"L:824","label":"법 제824조","title":"사망한 여객의 수하물처분의무","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"제824조(사망한 여객의 수하물처분의무) 여객이 사망한 때에는 선장은 그 상속인에게 가장 이익이 되는 방법으로 사망자가 휴대한 수하물을 처분하여야 한다.","kind":"L"},{"id":"L:825","label":"법 제825조","title":"법정종료사유","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"제825조(법정종료사유) 운송계약은 제810조제1항제1호부터 제3호까지의 사유로 인하여 종료한다. 그 사유가 항해 도중에 생긴 때에는 여객은 운송의 비율에 따른 운임을 지급하여야 한다.","kind":"L"},{"id":"L:826","label":"법 제826조","title":"준용규정","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①제148조ㆍ제794조ㆍ제799조제1항 및 제809조는 해상여객운송에 준용한다.\n②제134조ㆍ제136조ㆍ제149조제2항ㆍ제794조부터 제801조까지ㆍ제804조ㆍ제807조ㆍ제809조ㆍ제811조 및 제814조는 운송인이 위탁을 받은 여객의 수하물의 운송에 준용한다.\n③제150조, 제797조제1항ㆍ제4항, 제798조, 제799조제1항, 제809조 및 제814조는 운송인이 위탁을 받지 아니한 여객의 수하물에 준용한다.\n제826조(준용규정)","kind":"L"},{"id":"L:827","label":"법 제827조","title":"항해용선계약의 의의","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①항해용선계약은 특정한 항해를 할 목적으로 선박소유자가 용선자에게 선원이 승무하고 항해장비를 갖춘 선박의 전부 또는 일부를 물건의 운송에 제공하기로 약정하고 용선자가 이에 대하여 운임을 지급하기로 약정함으로써 그 효력이 생긴다.\n②이 절의 규정은 그 성질에 반하지 아니하는 한 여객운송을 목적으로 하는 항해용선계약에도 준용한다.\n③선박소유자가 일정한 기간 동안 용선자에게 선박을 제공할 의무를 지지만 항해를 단위로 운임을 계산하여 지급하기로 약정한 경우에도 그 성질에 반하지 아니하는 한 이 절의 규정을 준용한다.\n제827조(항해용선계약의 의의)","kind":"L"},{"id":"L:828","label":"법 제828조","title":"용선계약서","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"제828조(용선계약서) 용선계약의 당사자는 상대방의 청구에 의하여 용선계약서를 교부하여야 한다.","kind":"L"},{"id":"L:829","label":"법 제829조","title":"선적준비완료의 통지, 선적기간","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①선박소유자는 운송물을 선적함에 필요한 준비가 완료된 때에는 지체 없이 용선자에게 그 통지를 발송하여야 한다.\n②운송물을 선적할 기간의 약정이 있는 경우에는 그 기간은 제1항의 통지가 오전에 있은 때에는 그 날의 오후 1시부터 기산하고, 오후에 있은 때에는 다음날 오전 6시부터 기산한다. 이 기간에는 불가항력으로 인하여 선적할 수 없는 날과 그 항의 관습상 선적작업을 하지 아니하는 날을 산입하지 아니한다.\n③제2항의 기간을 경과한 후 운송물을 선적한 때에는 선박소유자는 상당한 보수를 청구할 수 있다.\n제829조(선적준비완료의 통지, 선적기간)","kind":"L"},{"id":"L:830","label":"법 제830조","title":"제3자가 선적인인 경우의 통지ㆍ선적","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"제830조(제3자가 선적인인 경우의 통지ㆍ선적) 용선자 외의 제3자가 운송물을 선적할 경우에 선장이 그 제3자를 확실히 알 수 없거나 그 제3자가 운송물을 선적하지 아니한 때에는 선장은 지체 없이 용선자에게 그 통지를 발송하여야 한다. 이 경우 선적기간 이내에 한하여 용선자가 운송물을 선적할 수 있다.","kind":"L"},{"id":"L:831","label":"법 제831조","title":"용선자의 발항청구권, 선장의 발항권","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①용선자는 운송물의 전부를 선적하지 아니한 경우에도 선장에게 발항을 청구할 수 있다.\n②선적기간의 경과 후에는 용선자가 운송물의 전부를 선적하지 아니한 경우에도 선장은 즉시 발항할 수 있다.\n③제1항 및 제2항의 경우에 용선자는 운임의 전액과 운송물의 전부를 선적하지 아니함으로 인하여 생긴 비용을 지급하고, 또한 선박소유자의 청구가 있는 때에는 상당한 담보를 제공하여야 한다.\n제831조(용선자의 발항청구권, 선장의 발항권)","kind":"L"},{"id":"L:832","label":"법 제832조","title":"전부용선의 발항 전의 계약해제 등","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①발항 전에는 전부용선자는 운임의 반액을 지급하고 계약을 해제할 수 있다.\n②왕복항해의 용선계약인 경우에 전부용선자가 그 회항 전에 계약을 해지하는 때에는 운임의 3분의 2를 지급하여야 한다.\n③선박이 다른 항에서 선적항에 항행하여야 할 경우에 전부용선자가 선적항에서 발항하기 전에 계약을 해지하는 때에도 제2항과 같다.\n제832조(전부용선의 발항 전의 계약해제 등)","kind":"L"},{"id":"L:833","label":"법 제833조","title":"일부용선과 발항 전의 계약해제 등","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①일부용선자나 송하인은 다른 용선자와 송하인 전원과 공동으로 하는 경우에 한하여 제832조의 해제 또는 해지를 할 수 있다.\n②제1항의 경우 외에는 일부용선자나 송하인이 발항 전에 계약을 해제 또는 해지한 때에도 운임의 전액을 지급하여야 한다.\n③발항 전이라도 일부용선자나 송하인이 운송물의 전부 또는 일부를 선적한 경우에는 다른 용선자와 송하인의 동의를 받지 아니하면 계약을 해제 또는 해지하지 못한다.\n제833조(일부용선과 발항 전의 계약해제 등)","kind":"L"},{"id":"L:834","label":"법 제834조","title":"부수비용ㆍ체당금 등의 지급의무","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①용선자나 송하인이 제832조 및 제833조제1항에 따라 계약을 해제 또는 해지를 한 때에도 부수비용과 체당금을 지급할 책임을 면하지 못한다.\n②제832조제2항 및 제3항의 경우에는 용선자나 송하인은 제1항에 규정된 것 외에도 운송물의 가액에 따라 공동해손 또는 해난구조로 인하여 부담할 금액을 지급하여야 한다.\n제834조(부수비용ㆍ체당금 등의 지급의무)","kind":"L"},{"id":"L:835","label":"법 제835조","title":"선적ㆍ양륙비용의 부담","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"제835조(선적ㆍ양륙비용의 부담) 제833조 및 제834조의 경우에 운송물의 전부 또는 일부를 선적한 때에는 그 선적과 양륙의 비용은 용선자 또는 송하인이 부담한다.","kind":"L"},{"id":"L:836","label":"법 제836조","title":"선적기간 내의 불선적의 효과","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"제836조(선적기간 내의 불선적의 효과) 용선자가 선적기간 내에 운송물의 선적을 하지 아니한 때에는 계약을 해제 또는 해지한 것으로 본다.","kind":"L"},{"id":"L:837","label":"법 제837조","title":"발항 후의 계약해지","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"제837조(발항 후의 계약해지) 발항 후에는 용선자나 송하인은 운임의 전액, 체당금ㆍ체선료와 공동해손 또는 해난구조의 부담액을 지급하고 그 양륙하기 위하여 생긴 손해를 배상하거나 이에 대한 상당한 담보를 제공하지 아니하면 계약을 해지하지 못한다.","kind":"L"},{"id":"L:838","label":"법 제838조","title":"운송물의 양륙","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①운송물을 양륙함에 필요한 준비가 완료된 때에는 선장은 지체 없이 수하인에게 그 통지를 발송하여야 한다.\n②제829조제2항은 운송물의 양륙기간의 계산에 준용한다.\n③제2항의 양륙기간을 경과한 후 운송물을 양륙한 때에는 선박소유자는 상당한 보수를 청구할 수 있다.\n제838조(운송물의 양륙)","kind":"L"},{"id":"L:839","label":"법 제839조","title":"선박소유자의 책임경감 금지","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①제794조에 반하여 이 절에서 정한 선박소유자의 의무 또는 책임을 경감 또는 면제하는 당사자 사이의 특약은 효력이 없다. 운송물에 관한 보험의 이익을 선박소유자에게 양도하는 약정 또는 이와 유사한 약정도 또한 같다.\n②제799조제2항은 제1항의 경우에 준용한다.\n제839조(선박소유자의 책임경감 금지)","kind":"L"},{"id":"L:840","label":"법 제840조","title":"선박소유자의 채권ㆍ채무의 소멸","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①선박소유자의 용선자 또는 수하인에 대한 채권 및 채무는 그 청구원인의 여하에 불구하고 선박소유자가 운송물을 인도한 날 또는 인도할 날부터 2년 이내에 재판상 청구가 없으면 소멸한다. 이 경우 제814조제1항 단서를 준용한다.\n②제1항의 기간을 단축하는 선박소유자와 용선자의 약정은 이를 운송계약에 명시적으로 기재하지 아니하면 그 효력이 없다.\n제840조(선박소유자의 채권ㆍ채무의 소멸)","kind":"L"},{"id":"L:841","label":"법 제841조","title":"준용규정","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①제134조, 제136조, 제137조, 제140조, 제793조부터 제797조까지, 제798조제1항부터 제3항까지, 제800조, 제801조, 제803조, 제804조제1항부터 제4항까지, 제805조부터 제808조까지와 제810조부터 제813조까지의 규정은 항해용선계약에 준용한다.\n②제1항에 따라 제806조의 운임을 계산함에 있어서 제829조제2항의 선적기간 또는 제838조제2항의 양륙기간이 경과한 후에 운송물을 선적 또는 양륙한 경우에는 그 기간경과 후의 선적 또는 양륙기간은 선적 또는 양륙기간에 산입하지 아니하고 제829조제3항 및 제838조제3항에 따라 별도로 보수를 정한다.\n제841조(준용규정)","kind":"L"},{"id":"L:842","label":"법 제842조","title":"정기용선계약의 의의","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"제842조(정기용선계약의 의의) 정기용선계약은 선박소유자가 용선자에게 선원이 승무하고 항해장비를 갖춘 선박을 일정한 기간동안 항해에 사용하게 할 것을 약정하고 용선자가 이에 대하여 기간으로 정한 용선료를 지급하기로 약정함으로써 그 효력이 생긴다.","kind":"L"},{"id":"L:843","label":"법 제843조","title":"정기용선자의 선장지휘권","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①정기용선자는 약정한 범위 안의 선박의 사용을 위하여 선장을 지휘할 권리가 있다.\n②선장ㆍ해원, 그 밖의 선박사용인이 정기용선자의 정당한 지시를 위반하여 정기용선자에게 손해가 발생한 경우에는 선박소유자가 이를 배상할 책임이 있다.\n제843조(정기용선자의 선장지휘권)","kind":"L"},{"id":"L:844","label":"법 제844조","title":"선박소유자의 운송물유치권 및 경매권","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①제807조제2항 및 제808조는 정기용선자가 선박소유자에게 용선료ㆍ체당금, 그 밖에 이와 유사한 정기용선계약에 의한 채무를 이행하지 아니하는 경우에 준용한다. 다만, 선박소유자는 정기용선자가 발행한 선하증권을 선의로 취득한 제3자에게 대항하지 못한다.\n②제1항에 따른 선박소유자의 운송물에 대한 권리는 정기용선자가 운송물에 관하여 약정한 용선료 또는 운임의 범위를 넘어서 행사하지 못한다.\n제844조(선박소유자의 운송물유치권 및 경매권)","kind":"L"},{"id":"L:845","label":"법 제845조","title":"용선료의 연체와 계약해지 등","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①정기용선자가 용선료를 약정기일에 지급하지 아니한 때에는 선박소유자는 계약을 해제 또는 해지할 수 있다.\n②정기용선자가 제3자와 운송계약을 체결하여 운송물을 선적한 후 선박의 항해 중에 선박소유자가 제1항에 따라 계약을 해제 또는 해지한 때에는 선박소유자는 적하이해관계인에 대하여 정기용선자와 동일한 운송의무가 있다.\n③선박소유자가 제2항에 따른 계약의 해제 또는 해지 및 운송계속의 뜻을 적하이해관계인에게 서면으로 통지를 한 때에는 선박소유자의 정기용선자에 대한 용선료ㆍ체당금, 그 밖에 이와 유사한 정기용선계약상의 채권을 담보하기 위하여 정기용선자가 적하이해관계인에 대하여 가지는 용선료 또는 운임의 채권을 목적으로 질권을 설정한 것으로 본다.\n④제1항부터 제3항까지의 규정은 선박소유자 또는 적하이해관계인의 정기용선자에 대한 손해배상청구에 영향을 미치지 아니한다.\n제845조(용선료의 연체와 계약해지 등)","kind":"L"},{"id":"L:846","label":"법 제846조","title":"정기용선계약상의 채권의 소멸","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①정기용선계약에 관하여 발생한 당사자 사이의 채권은 선박이 선박소유자에게 반환된 날부터 2년 이내에 재판상 청구가 없으면 소멸한다. 이 경우 제814조제1항 단서를 준용한다.\n②제840조제2항은 제1항의 경우에 준용한다.\n제846조(정기용선계약상의 채권의 소멸)","kind":"L"},{"id":"L:847","label":"법 제847조","title":"선체용선계약의 의의","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①선체용선계약은 용선자의 관리ㆍ지배 하에 선박을 운항할 목적으로 선박소유자가 용선자에게 선박을 제공할 것을 약정하고 용선자가 이에 따른 용선료를 지급하기로 약정함으로써 그 효력이 생긴다.\n②선박소유자가 선장과 그 밖의 해원을 공급할 의무를 지는 경우에도 용선자의 관리ㆍ지배하에서 해원이 선박을 운항하는 것을 목적으로 하면 이를 선체용선계약으로 본다.\n제847조(선체용선계약의 의의)","kind":"L"},{"id":"L:848","label":"법 제848조","title":"법적 성질","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①선체용선계약은 그 성질에 반하지 아니하는 한 「민법」상 임대차에 관한 규정을 준용한다.\n②용선기간이 종료된 후에 용선자가 선박을 매수 또는 인수할 권리를 가지는 경우 및 금융의 담보를 목적으로 채권자를 선박소유자로 하여 선체용선계약을 체결한 경우에도 용선기간 중에는 당사자 사이에서는 이 절의 규정에 따라 권리와 의무가 있다.\n제848조(법적 성질)","kind":"L"},{"id":"L:849","label":"법 제849조","title":"선체용선자의 등기청구권, 등기의 효력","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①선체용선자는 선박소유자에 대하여 선체용선등기에 협력할 것을 청구할 수 있다.\n②선체용선을 등기한 때에는 그 때부터 제3자에 대하여 효력이 생긴다.\n제849조(선체용선자의 등기청구권, 등기의 효력)","kind":"L"},{"id":"L:850","label":"법 제850조","title":"선체용선과 제3자에 대한 법률관계","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①선체용선자가 상행위나 그 밖의 영리를 목적으로 선박을 항해에 사용하는 경우에는 그 이용에 관한 사항에는 제3자에 대하여 선박소유자와 동일한 권리의무가 있다.\n②제1항의 경우에 선박의 이용에 관하여 생긴 우선특권은 선박소유자에 대하여도 그 효력이 있다. 다만, 우선특권자가 그 이용의 계약에 반함을 안 때에는 그러하지 아니하다.\n제850조(선체용선과 제3자에 대한 법률관계)","kind":"L"},{"id":"L:851","label":"법 제851조","title":"선체용선계약상의 채권의 소멸","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①선체용선계약에 관하여 발생한 당사자 사이의 채권은 선박이 선박소유자에게 반환된 날부터 2년 이내에 재판상 청구가 없으면 소멸한다. 이 경우 제814조제1항 단서를 준용한다.\n②제840조제2항은 제1항의 경우에 준용한다.\n제851조(선체용선계약상의 채권의 소멸)","kind":"L"},{"id":"L:852","label":"법 제852조","title":"선하증권의 발행","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①운송인은 운송물을 수령한 후 송하인의 청구에 의하여 1통 또는 수통의 선하증권을 교부하여야 한다.\n②운송인은 운송물을 선적한 후 송하인의 청구에 의하여 1통 또는 수통의 선적선하증권을 교부하거나 제1항의 선하증권에 선적의 뜻을 표시하여야 한다.\n③운송인은 선장 또는 그 밖의 대리인에게 선하증권의 교부 또는 제2항의 표시를 위임할 수 있다.\n제852조(선하증권의 발행)","kind":"L"},{"id":"L:853","label":"법 제853조","title":"선하증권의 기재사항","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①선하증권에는 다음 각 호의 사항을 기재하고 운송인이 기명날인 또는 서명하여야 한다.\n1. 선박의 명칭ㆍ국적 및 톤수\n2. 송하인이 서면으로 통지한 운송물의 종류, 중량 또는 용적, 포장의 종별, 개수와 기호\n3. 운송물의 외관상태\n4. 용선자 또는 송하인의 성명ㆍ상호\n5. 수하인 또는 통지수령인의 성명ㆍ상호\n6. 선적항\n7. 양륙항\n8. 운임\n9. 발행지와 그 발행연월일\n10. 수통의 선하증권을 발행한 때에는 그 수\n11. 운송인의 성명 또는 상호\n12. 운송인의 주된 영업소 소재지\n②제1항제2호의 기재사항 중 운송물의 중량ㆍ용적ㆍ개수 또는 기호가 운송인이 실제로 수령한 운송물을 정확하게 표시하고 있지 아니하다고 의심할 만한 상당한 이유가 있는 때 또는 이를 확인할 적당한 방법이 없는 때에는 그 기재를 생략할 수 있다.\n③송하인은 제1항제2호의 기재사항이 정확함을 운송인에게 담보한 것으로 본다.\n④운송인이 선하증권에 기재된 통지수령인에게 운송물에 관한 통지를 한 때에는 송하인 및 선하증권소지인과 그 밖의 수하인에게 통지한 것으로 본다.\n제853조(선하증권의 기재사항)","kind":"L"},{"id":"L:854","label":"법 제854조","title":"선하증권 기재의 효력","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①제853조제1항에 따라 선하증권이 발행된 경우 운송인과 송하인 사이에 선하증권에 기재된 대로 개품운송계약이 체결되고 운송물을 수령 또는 선적한 것으로 추정한다.\n②제1항의 선하증권을 선의로 취득한 소지인에 대하여 운송인은 선하증권에 기재된 대로 운송물을 수령 혹은 선적한 것으로 보고 선하증권에 기재된 바에 따라 운송인으로서 책임을 진다.\n제854조(선하증권 기재의 효력)","kind":"L"},{"id":"L:855","label":"법 제855조","title":"용선계약과 선하증권","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①용선자의 청구가 있는 경우 선박소유자는 운송물을 수령한 후에 제852조 및 제853조에 따라 선하증권을 발행한다.\n②제1항에 따라 선하증권이 발행된 경우 선박소유자는 선하증권에 기재된 대로 운송물을 수령 또는 선적한 것으로 추정한다.\n③제3자가 선의로 제1항의 선하증권을 취득한 경우 선박소유자는 제854조제2항에 따라 운송인으로서 권리와 의무가 있다. 용선자의 청구에 따라 선박소유자가 제3자에게 선하증권을 발행한 경우에도 또한 같다.\n④제3항의 경우에 그 제3자는 제833조부터 제835조까지 및 제837조에 따른 송하인으로 본다.\n⑤제3항의 경우 제799조를 위반하여 운송인으로서의 의무와 책임을 감경 또는 면제하는 특약을 하지 못한다.\n제855조(용선계약과 선하증권)","kind":"L"},{"id":"L:856","label":"법 제856조","title":"등본의 교부","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"제856조(등본의 교부) 선하증권의 교부를 받은 용선자 또는 송하인은 발행자의 청구가 있는 때에는 선하증권의 등본에 기명날인 또는 서명하여 교부하여야 한다.","kind":"L"},{"id":"L:857","label":"법 제857조","title":"수통의 선하증권과 양륙항에 있어서의 운송물의 인도","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①양륙항에서 수통의 선하증권 중 1통을 소지한 자가 운송물의 인도를 청구하는 경우에도 선장은 그 인도를 거부하지 못한다.\n②제1항에 따라 수통의 선하증권 중 1통의 소지인이 운송물의 인도를 받은 때에는 다른 선하증권은 그 효력을 잃는다.\n제857조(수통의 선하증권과 양륙항에 있어서의 운송물의 인도)","kind":"L"},{"id":"L:858","label":"법 제858조","title":"수통의 선하증권과 양륙항 외에서의 운송물의 인도","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"제858조(수통의 선하증권과 양륙항 외에서의 운송물의 인도) 양륙항 외에서는 선장은 선하증권의 각 통의 반환을 받지 아니하면 운송물을 인도하지 못한다.","kind":"L"},{"id":"L:859","label":"법 제859조","title":"2인 이상 소지인의 운송물인도청구와 공탁","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①2인 이상의 선하증권소지인이 운송물의 인도를 청구한 때에는 선장은 지체 없이 운송물을 공탁하고 각 청구자에게 그 통지를 발송하여야 한다.\n②선장이 제857조제1항에 따라 운송물의 일부를 인도한 후 다른 소지인이 운송물의 인도를 청구한 경우에도 그 인도하지 아니한 운송물에 대하여는 제1항과 같다.\n제859조(2인 이상 소지인의 운송물인도청구와 공탁)","kind":"L"},{"id":"L:860","label":"법 제860조","title":"수인의 선하증권소지인의 순위","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①제859조에 따라 공탁한 운송물에 대하여는 수인의 선하증권소지인에게 공통되는 전 소지인으로부터 먼저 교부를 받은 증권소지인의 권리가 다른 소지인의 권리에 우선한다.\n②격지자에 대하여 발송한 선하증권은 그 발송한 때를 교부받은 때로 본다.\n제860조(수인의 선하증권소지인의 순위)","kind":"L"},{"id":"L:861","label":"법 제861조","title":"준용규정","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"제861조(준용규정) 제129조ㆍ제130조ㆍ제132조 및 제133조는 제852조 및 제855조의 선하증권에 준용한다.","kind":"L"},{"id":"L:862","label":"법 제862조","title":"전자선하증권","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①운송인은 제852조 또는 제855조의 선하증권을 발행하는 대신에 송하인 또는 용선자의 동의를 받아 법무부장관이 지정하는 등록기관에 등록을 하는 방식으로 전자선하증권을 발행할 수 있다. 이 경우 전자선하증권은 제852조 및 제855조의 선하증권과 동일한 법적 효력을 갖는다.\n②전자선하증권에는 제853조제1항 각 호의 정보가 포함되어야 하며, 운송인이 전자서명을 하여 송신하고 용선자 또는 송하인이 이를 수신하여야 그 효력이 생긴다.\n③전자선하증권의 권리자는 배서의 뜻을 기재한 전자문서를 작성한 다음 전자선하증권을 첨부하여 지정된 등록기관을 통하여 상대방에게 송신하는 방식으로 그 권리를 양도할 수 있다.\n④제3항에서 정한 방식에 따라 배서의 뜻을 기재한 전자문서를 상대방이 수신하면 제852조 및 제855조의 선하증권을 배서하여 교부한 것과 동일한 효력이 있고, 제2항 및 제3항의 전자문서를 수신한 권리자는 제852조 및 제855조의 선하증권을 교부받은 소지인과 동일한 권리를 취득한다.\n⑤전자선하증권의 등록기관의 지정요건, 발행 및 배서의 전자적인 방식, 운송물의 구체적인 수령절차와 그 밖에 필요한 사항은 대통령령으로 정한다.\n제862조(전자선하증권)","kind":"L"},{"id":"L:863","label":"법 제863조","title":"해상화물운송장의 발행","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①운송인은 용선자 또는 송하인의 청구가 있으면 제852조 또는 제855조의 선하증권을 발행하는 대신 해상화물운송장을 발행할 수 있다. 해상화물운송장은 당사자 사이의 합의에 따라 전자식으로도 발행할 수 있다.\n②해상화물운송장에는 해상화물운송장임을 표시하는 외에 제853조제1항 각 호 사항을 기재하고 운송인이 기명날인 또는 서명하여야 한다.\n③제853조제2항 및 제4항은 해상화물운송장에 준용한다.\n제863조(해상화물운송장의 발행)","kind":"L"},{"id":"L:864","label":"법 제864조","title":"해상화물운송장의 효력","chapter":"제5편 해상 제2장 운송과 용선","deleted":false,"text":"①제863조제1항의 규정에 따라 해상화물운송장이 발행된 경우 운송인이 그 운송장에 기재된 대로 운송물을 수령 또는 선적한 것으로 추정한다.\n②운송인이 운송물을 인도함에 있어서 수령인이 해상화물운송장에 기재된 수하인 또는 그 대리인이라고 믿을만한 정당한 사유가 있는 때에는 수령인이 권리자가 아니라고 하더라도 운송인은 그 책임을 면한다.\n제864조(해상화물운송장의 효력)","kind":"L"},{"id":"L:865","label":"법 제865조","title":"공동해손의 요건","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"제865조(공동해손의 요건) 선박과 적하의 공동위험을 면하기 위한 선장의 선박 또는 적하에 대한 처분으로 인하여 생긴 손해 또는 비용은 공동해손으로 한다.","kind":"L"},{"id":"L:866","label":"법 제866조","title":"공동해손의 분담","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"제866조(공동해손의 분담) 공동해손은 그 위험을 면한 선박 또는 적하의 가액과 운임의 반액과 공동해손의 액과의 비율에 따라 각 이해관계인이 이를 분담한다.","kind":"L"},{"id":"L:867","label":"법 제867조","title":"공동해손분담액의 산정","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"제867조(공동해손분담액의 산정) 공동해손의 분담액을 정함에 있어서는 선박의 가액은 도달의 때와 곳의 가액으로 하고, 적하의 가액은 양륙의 때와 곳의 가액으로 한다. 다만, 적하에 관하여는 그 가액 중에서 멸실로 인하여 지급을 면하게 된 운임과 그 밖의 비용을 공제하여야 한다.","kind":"L"},{"id":"L:868","label":"법 제868조","title":"공동해손분담자의 유한책임","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"제868조(공동해손분담자의 유한책임) 제866조 및 제867조에 따라 공동해손의 분담책임이 있는 자는 선박이 도달하거나 적하를 인도한 때에 현존하는 가액의 한도에서 책임을 진다.","kind":"L"},{"id":"L:869","label":"법 제869조","title":"공동해손의 손해액산정","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"제869조(공동해손의 손해액산정) 공동해손의 액을 정함에 있어서는 선박의 가액은 도달의 때와 곳의 가액으로 하고, 적하의 가액은 양륙의 때와 곳의 가액으로 한다. 다만, 적하에 관하여는 그 손실로 인하여 지급을 면하게 된 모든 비용을 공제하여야 한다.","kind":"L"},{"id":"L:870","label":"법 제870조","title":"책임있는 자에 대한 구상권","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"제870조(책임있는 자에 대한 구상권) 선박과 적하의 공동위험이 선박 또는 적하의 하자나 그 밖의 과실 있는 행위로 인하여 생긴 경우에는 공동해손의 분담자는 그 책임이 있는 자에 대하여 구상권을 행사할 수 있다.","kind":"L"},{"id":"L:871","label":"법 제871조","title":"공동해손분담제외","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"제871조(공동해손분담제외) 선박에 비치한 무기, 선원의 급료, 선원과 여객의 식량ㆍ의류는 보존된 경우에는 그 가액을 공동해손의 분담에 산입하지 아니하고, 손실된 경우에는 그 가액을 공동해손의 액에 산입한다.","kind":"L"},{"id":"L:872","label":"법 제872조","title":"공동해손분담청구에서의 제외","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"①속구목록에 기재하지 아니한 속구, 선하증권이나 그 밖에 적하의 가격을 정할 수 있는 서류 없이 선적한 하물 또는 종류와 가액을 명시하지 아니한 화폐나 유가증권과 그 밖의 고가물은 보존된 경우에는 그 가액을 공동해손의 분담에 산입하고, 손실된 경우에는 그 가액을 공동해손의 액에 산입하지 아니한다.\n②갑판에 적재한 하물에 대하여도 제1항과 같다. 다만, 갑판에 선적하는 것이 관습상 허용되는 경우와 그 항해가 연안항행에 해당되는 경우에는 그러하지 아니하다.\n제872조(공동해손분담청구에서의 제외)","kind":"L"},{"id":"L:873","label":"법 제873조","title":"적하가격의 부실기재와 공동해손","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"①선하증권이나 그 밖에 적하의 가격을 정할 수 있는 서류에 적하의 실가보다 고액을 기재한 경우에 그 하물이 보존된 때에는 그 기재액에 의하여 공동해손의 분담액을 정하고, 적하의 실가보다 저액을 기재한 경우에 그 하물이 손실된 때에는 그 기재액을 공동해손의 액으로 한다.\n②제1항은 적하의 가격에 영향을 미칠 사항에 관하여 거짓 기재를 한 경우에 준용한다.\n제873조(적하가격의 부실기재와 공동해손)","kind":"L"},{"id":"L:874","label":"법 제874조","title":"공동해손인 손해의 회복","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"제874조(공동해손인 손해의 회복) 선박소유자ㆍ용선자ㆍ송하인, 그 밖의 이해관계인이 공동해손의 액을 분담한 후 선박ㆍ속구 또는 적하의 전부나 일부가 소유자에게 복귀된 때에는 그 소유자는 공동해손의 상금으로 받은 금액에서 구조료와 일부손실로 인한 손해액을 공제하고 그 잔액을 반환하여야 한다.","kind":"L"},{"id":"L:875","label":"법 제875조","title":"공동해손 채권의 소멸","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"제875조(공동해손 채권의 소멸) 공동해손으로 인하여 생긴 채권 및 제870조에 따른 구상채권은 그 계산이 종료한 날부터 1년 이내에 재판상 청구가 없으면 소멸한다. 이 경우 제814조제1항 단서를 준용한다.","kind":"L"},{"id":"L:876","label":"법 제876조","title":"선박충돌에의 적용법규","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"①항해선 상호 간 또는 항해선과 내수항행선 간의 충돌이 있은 경우에 선박 또는 선박 내에 있는 물건이나 사람에 관하여 생긴 손해의 배상에 대하여는 어떠한 수면에서 충돌한 때라도 이 절의 규정을 적용한다.\n②이 절에서 \"선박의 충돌\"이란 2척 이상의 선박이 그 운용상 작위 또는 부작위로 선박 상호 간에 다른 선박 또는 선박 내에 있는 사람 또는 물건에 손해를 생기게 하는 것을 말하며, 직접적인 접촉의 유무를 묻지 아니한다.\n제876조(선박충돌에의 적용법규)","kind":"L"},{"id":"L:877","label":"법 제877조","title":"불가항력으로 인한 충돌","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"제877조(불가항력으로 인한 충돌) 선박의 충돌이 불가항력으로 인하여 발생하거나 충돌의 원인이 명백하지 아니한 때에는 피해자는 충돌로 인한 손해의 배상을 청구하지 못한다.","kind":"L"},{"id":"L:878","label":"법 제878조","title":"일방의 과실로 인한 충돌","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"제878조(일방의 과실로 인한 충돌) 선박의 충돌이 일방의 선원의 과실로 인하여 발생한 때에는 그 일방의 선박소유자는 피해자에 대하여 충돌로 인한 손해를 배상할 책임이 있다.","kind":"L"},{"id":"L:879","label":"법 제879조","title":"쌍방의 과실로 인한 충돌","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"①선박의 충돌이 쌍방의 선원의 과실로 인하여 발생한 때에는 쌍방의 과실의 경중에 따라 각 선박소유자가 손해배상의 책임을 분담한다. 이 경우 그 과실의 경중을 판정할 수 없는 때에는 손해배상의 책임을 균분하여 부담한다.\n②제1항의 경우에 제3자의 사상에 대한 손해배상은 쌍방의 선박소유자가 연대하여 그 책임을 진다.\n제879조(쌍방의 과실로 인한 충돌)","kind":"L"},{"id":"L:880","label":"법 제880조","title":"도선사의 과실로 인한 충돌","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"제880조(도선사의 과실로 인한 충돌) 선박의 충돌이 도선사의 과실로 인하여 발생한 경우에도 선박소유자는 제878조 및 제879조를 준용하여 손해를 배상할 책임이 있다.","kind":"L"},{"id":"L:881","label":"법 제881조","title":"선박충돌채권의 소멸","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"제881조(선박충돌채권의 소멸) 선박의 충돌로 인하여 생긴 손해배상의 청구권은 그 충돌이 있은 날부터 2년 이내에 재판상 청구가 없으면 소멸한다. 이 경우 제814조제1항 단서를 준용한다.","kind":"L"},{"id":"L:882","label":"법 제882조","title":"해난구조의 요건","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"제882조(해난구조의 요건) 항해선 또는 그 적하 그 밖의 물건이 어떠한 수면에서 위난에 조우한 경우에 의무 없이 이를 구조한 자는 그 결과에 대하여 상당한 보수를 청구할 수 있다. 항해선과 내수항행선 간의 구조의 경우에도 또한 같다.","kind":"L"},{"id":"L:883","label":"법 제883조","title":"보수의 결정","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"제883조(보수의 결정) 구조의 보수에 관한 약정이 없는 경우에 그 액에 대하여 당사자 사이에 합의가 성립하지 아니한 때에는 법원은 당사자의 청구에 의하여 구조된 선박ㆍ재산의 가액, 위난의 정도, 구조자의 노력과 비용, 구조자나 그 장비가 조우했던 위험의 정도, 구조의 효과, 환경손해방지를 위한 노력, 그 밖의 제반사정을 참작하여 그 액을 정한다.","kind":"L"},{"id":"L:884","label":"법 제884조","title":"보수의 한도","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"①구조의 보수액은 다른 약정이 없으면 구조된 목적물의 가액을 초과하지 못한다.\n②선순위의 우선특권이 있는 때에는 구조의 보수액은 그 우선특권자의 채권액을 공제한 잔액을 초과하지 못한다.\n제884조(보수의 한도)","kind":"L"},{"id":"L:885","label":"법 제885조","title":"환경손해방지작업에 대한 특별보상","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"①선박 또는 그 적하로 인하여 환경손해가 발생할 우려가 있는 경우에 손해의 경감 또는 방지의 효과를 수반하는 구조작업에 종사한 구조자는 구조의 성공 여부 및 제884조와 상관없이 구조에 소요된 비용을 특별보상으로 청구할 수 있다.\n②제1항에서 \"비용\"이란 구조작업에 실제로 지출한 합리적인 비용 및 사용된 장비와 인원에 대한 정당한 보수를 말한다.\n③구조자는 발생할 환경손해가 구조작업으로 인하여 실제로 감경 또는 방지된 때에는 보상의 증액을 청구할 수 있고, 법원은 제883조의 사정을 참작하여 증액 여부 및 그 금액을 정한다. 이 경우 증액된다 하더라도 구조료는 제1항의 비용의 배액을 초과할 수 없다.\n④구조자의 고의 또는 과실로 인하여 손해의 감경 또는 방지에 지장을 가져 온 경우 법원은 제1항 및 제3항에서 정한 금액을 감액 혹은 부인할 수 있다.\n⑤하나의 구조작업을 시행한 구조자가 제1항부터 제4항까지의 규정에서 정한 특별보상을 청구하는 것 외에 제882조에서 정한 보수도 청구할 수 있는 경우 그 중 큰 금액을 구조료로 청구할 수 있다.\n제885조(환경손해방지작업에 대한 특별보상)","kind":"L"},{"id":"L:886","label":"법 제886조","title":"구조료의 지급의무","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"제886조(구조료의 지급의무) 선박소유자와 그 밖에 구조된 재산의 권리자는 그 구조된 선박 또는 재산의 가액에 비례하여 구조에 대한 보수를 지급하고 특별보상을 하는 등 구조료를 지급할 의무가 있다.","kind":"L"},{"id":"L:887","label":"법 제887조","title":"구조에 관한 약정","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"①당사자가 미리 구조계약을 하고 그 계약에 따라 구조가 이루어진 경우에도 그 성질에 반하지 아니하는 한 구조계약에서 정하지 아니한 사항은 이 절에서 정한 바에 따른다.\n②해난 당시에 구조료의 금액에 대하여 약정을 한 경우에도 그 금액이 현저하게 부당한 때에는 법원은 제883조의 사정을 참작하여 그 금액을 증감할 수 있다.\n제887조(구조에 관한 약정)","kind":"L"},{"id":"L:888","label":"법 제888조","title":"공동구조자 간의 구조료 분배","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"①수인이 공동으로 구조에 종사한 경우에 그 구조료의 분배비율에 관하여는 제883조를 준용한다.\n②인명의 구조에 종사한 자도 제1항에 따라 구조료의 분배를 받을 수 있다.\n제888조(공동구조자 간의 구조료 분배)","kind":"L"},{"id":"L:889","label":"법 제889조","title":"1선박 내부의 구조료 분배","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"①선박이 구조에 종사하여 그 구조료를 받은 경우에는 먼저 선박의 손해액과 구조에 들어간 비용을 선박소유자에게 지급하고 잔액을 절반하여 선장과 해원에게 지급하여야 한다.\n②제1항에 따라 해원에게 지급할 구조료의 분배는 선장이 각 해원의 노력, 그 효과와 사정을 참작하여 그 항해의 종료 전에 분배안을 작성하여 해원에게 고시하여야 한다.\n제889조(1선박 내부의 구조료 분배)","kind":"L"},{"id":"L:890","label":"법 제890조","title":"예선의 구조의 경우","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"제890조(예선의 구조의 경우) 예선의 본선 또는 그 적하에 대한 구조에 관하여는 예선계약의 이행으로 볼 수 없는 특수한 노력을 제공한 경우가 아니면 구조료를 청구하지 못한다.","kind":"L"},{"id":"L:891","label":"법 제891조","title":"동일소유자에 속한 선박 간의 보수","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"제891조(동일소유자에 속한 선박 간의 보수) 동일소유자에 속한 선박의 상호 간에 있어서도 구조에 종사한 자는 상당한 구조료를 청구할 수 있다.","kind":"L"},{"id":"L:892","label":"법 제892조","title":"구조료청구권 없는 자","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"1. 구조받은 선박에 종사하는 자\n2. 고의 또는 과실로 인하여 해난사고를 야기한 자\n3. 정당한 거부에도 불구하고 구조를 강행한 자\n4. 구조된 물건을 은닉하거나 정당한 사유 없이 처분한 자\n제892조(구조료청구권 없는 자) 다음 각 호에 해당하는 자는 구조료를 청구하지 못한다.","kind":"L"},{"id":"L:893","label":"법 제893조","title":"구조자의 우선특권","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"①구조에 종사한 자의 구조료채권은 구조된 적하에 대하여 우선특권이 있다. 다만, 채무자가 그 적하를 제3취득자에게 인도한 후에는 그 적하에 대하여 이 권리를 행사하지 못한다.\n②제1항의 우선특권에는 그 성질에 반하지 아니하는 한 제777조의 우선특권에 관한 규정을 준용한다.\n제893조(구조자의 우선특권)","kind":"L"},{"id":"L:894","label":"법 제894조","title":"구조료지급에 관한 선장의 권한","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"①선장은 구조료를 지급할 채무자에 갈음하여 그 지급에 관한 재판상 또는 재판 외의 모든 행위를 할 권한이 있다.\n②선장은 그 구조료에 관한 소송의 당사자가 될 수 있고, 그 확정판결은 구조료의 채무자에 대하여도 효력이 있다.\n제894조(구조료지급에 관한 선장의 권한)","kind":"L"},{"id":"L:895","label":"법 제895조","title":"구조료청구권의 소멸","chapter":"제5편 해상 제3장 해상위험","deleted":false,"text":"제895조(구조료청구권의 소멸) 구조료청구권은 구조가 완료된 날부터 2년 이내에 재판상 청구가 없으면 소멸한다. 이 경우 제814조제1항 단서를 준용한다.","kind":"L"},{"id":"L:896","label":"법 제896조","title":"항공기의 의의","chapter":"제6편 항공운송 제1장 통칙","deleted":false,"text":"제896조(항공기의 의의) 이 법에서 \"항공기\"란 상행위나 그 밖의 영리를 목적으로 운항에 사용하는 항공기를 말한다. 다만, 대통령령으로 정하는 초경량 비행장치(超輕量 飛行裝置)는 제외한다.","kind":"L"},{"id":"L:897","label":"법 제897조","title":"적용범위","chapter":"제6편 항공운송 제1장 통칙","deleted":false,"text":"제897조(적용범위) 운항용 항공기에 대하여는 상행위나 그 밖의 영리를 목적으로 하지 아니하더라도 이 편의 규정을 준용한다. 다만, 국유(國有) 또는 공유(公有) 항공기에 대하여는 운항의 목적ㆍ성질 등을 고려하여 이 편의 규정을 준용하는 것이 적합하지 아니한 경우로서 대통령령으로 정하는 경우에는 그러하지 아니하다.","kind":"L"},{"id":"L:898","label":"법 제898조","title":"운송인 등의 책임감면","chapter":"제6편 항공운송 제1장 통칙","deleted":false,"text":"제898조(운송인 등의 책임감면) 제905조제1항을 포함하여 이 편에서 정한 운송인이나 항공기 운항자의 손해배상책임과 관련하여 운송인이나 항공기 운항자가 손해배상청구권자의 과실 또는 그 밖의 불법한 작위나 부작위가 손해를 발생시켰거나 손해에 기여하였다는 것을 증명한 경우에는, 그 과실 또는 그 밖의 불법한 작위나 부작위가 손해를 발생시켰거나 손해에 기여한 정도에 따라 운송인이나 항공기 운항자의 책임을 감경하거나 면제할 수 있다.","kind":"L"},{"id":"L:899","label":"법 제899조","title":"비계약적 청구에 대한 적용 등","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"① 이 장의 운송인의 책임에 관한 규정은 운송인의 불법행위로 인한 손해배상의 책임에도 적용한다.\n② 여객, 수하물 또는 운송물에 관한 손해배상청구가 운송인의 사용인이나 대리인에 대하여 제기된 경우에 그 손해가 그 사용인이나 대리인의 직무집행에 관하여 생겼을 때에는 그 사용인이나 대리인은 운송인이 주장할 수 있는 항변과 책임제한을 원용할 수 있다.\n③ 제2항에도 불구하고 여객 또는 수하물의 손해가 운송인의 사용인이나 대리인의 고의로 인하여 발생하였거나 또는 여객의 사망ㆍ상해ㆍ연착(수하물의 경우 멸실ㆍ훼손ㆍ연착)이 생길 염려가 있음을 인식하면서 무모하게 한 작위 또는 부작위로 인하여 발생하였을 때에는 그 사용인이나 대리인은 운송인이 주장할 수 있는 항변과 책임제한을 원용할 수 없다.\n④ 제2항의 경우에 운송인과 그 사용인이나 대리인의 여객, 수하물 또는 운송물에 대한 책임제한금액의 총액은 각각 제905조ㆍ제907조ㆍ제910조 및 제915조에 따른 한도를 초과하지 못한다.\n제899조(비계약적 청구에 대한 적용 등)","kind":"L"},{"id":"L:900","label":"법 제900조","title":"실제운송인에 대한 청구","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"① 운송계약을 체결한 운송인(이하 \"계약운송인\"이라 한다)의 위임을 받아 운송의 전부 또는 일부를 수행한 운송인(이하 \"실제운송인\"이라 한다)이 있을 경우 실제운송인이 수행한 운송에 관하여는 실제운송인에 대하여도 이 장의 운송인의 책임에 관한 규정을 적용한다. 다만, 제901조의 순차운송에 해당하는 경우는 그러하지 아니하다.\n② 실제운송인이 여객ㆍ수하물 또는 운송물에 대한 손해배상책임을 지는 경우 계약운송인과 실제운송인은 연대하여 그 책임을 진다.\n③ 제1항의 경우 제899조제2항부터 제4항까지를 준용한다. 이 경우 제899조제2항ㆍ제3항 중 \"운송인\"은 \"실제운송인\"으로, 같은 조 제4항 중 \"운송인\"은 \"계약운송인과 실제운송인\"으로 본다.\n④ 이 장에서 정한 운송인의 책임과 의무 외에 운송인이 책임과 의무를 부담하기로 하는 특약 또는 이 장에서 정한 운송인의 권리나 항변의 포기는 실제운송인이 동의하지 아니하는 한 실제운송인에게 영향을 미치지 아니한다.\n제900조(실제운송인에 대한 청구)","kind":"L"},{"id":"L:901","label":"법 제901조","title":"순차운송","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"① 둘 이상이 순차(順次)로 운송할 경우에는 각 운송인의 운송구간에 관하여 그 운송인도 운송계약의 당사자로 본다.\n② 순차운송에서 여객의 사망, 상해 또는 연착으로 인한 손해배상은 그 사실이 발생한 구간의 운송인에게만 청구할 수 있다. 다만, 최초 운송인이 명시적으로 전 구간에 대한 책임을 인수하기로 약정한 경우에는 최초 운송인과 그 사실이 발생한 구간의 운송인이 연대하여 그 손해를 배상할 책임이 있다.\n③ 순차운송에서 수하물의 멸실, 훼손 또는 연착으로 인한 손해배상은 최초 운송인, 최종 운송인 및 그 사실이 발생한 구간의 운송인에게 각각 청구할 수 있다.\n④ 순차운송에서 운송물의 멸실, 훼손 또는 연착으로 인한 손해배상은 송하인이 최초 운송인 및 그 사실이 발생한 구간의 운송인에게 각각 청구할 수 있다. 다만, 제918조제1항에 따라 수하인이 운송물의 인도를 청구할 권리를 가지는 경우에는 수하인이 최종 운송인 및 그 사실이 발생한 구간의 운송인에게 그 손해배상을 각각 청구할 수 있다.\n⑤ 제3항과 제4항의 경우 각 운송인은 연대하여 그 손해를 배상할 책임이 있다.\n⑥ 최초 운송인 또는 최종 운송인이 제2항부터 제5항까지의 규정에 따라 손해를 배상한 경우에는 여객의 사망, 상해 또는 연착이나 수하물ㆍ운송물의 멸실, 훼손 또는 연착이 발생한 구간의 운송인에 대하여 구상권을 가진다.\n제901조(순차운송)","kind":"L"},{"id":"L:902","label":"법 제902조","title":"운송인 책임의 소멸","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"제902조(운송인 책임의 소멸) 운송인의 여객, 송하인 또는 수하인에 대한 책임은 그 청구원인에 관계없이 여객 또는 운송물이 도착지에 도착한 날, 항공기가 도착할 날 또는 운송이 중지된 날 가운데 가장 늦게 도래한 날부터 2년 이내에 재판상 청구가 없으면 소멸한다.","kind":"L"},{"id":"L:903","label":"법 제903조","title":"계약조항의 무효","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"제903조(계약조항의 무효) 이 장의 규정에 반하여 운송인의 책임을 감면하거나 책임한도액을 낮게 정하는 특약은 효력이 없다.","kind":"L"},{"id":"L:904","label":"법 제904조","title":"운송인의 책임","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"제904조(운송인의 책임) 운송인은 여객의 사망 또는 신체의 상해로 인한 손해에 관하여는 그 손해의 원인이 된 사고가 항공기상에서 또는 승강(乘降)을 위한 작업 중에 발생한 경우에만 책임을 진다.","kind":"L"},{"id":"L:905","label":"법 제905조","title":"운송인의 책임한도액","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"① 제904조의 손해 중 여객 1명당 11만3천100 계산단위의 금액까지는 운송인의 배상책임을 면제하거나 제한할 수 없다. <개정 2014.5.20>\n② 운송인은 제904조의 손해 중 여객 1명당 11만3천100 계산단위의 금액을 초과하는 부분에 대하여는 다음 각 호의 어느 하나를 증명하면 배상책임을 지지 아니한다. <개정 2014.5.20>\n1. 그 손해가 운송인 또는 그 사용인이나 대리인의 과실 또는 그 밖의 불법한 작위나 부작위에 의하여 발생하지 아니하였다는 것\n2. 그 손해가 오로지 제3자의 과실 또는 그 밖의 불법한 작위나 부작위에 의하여만 발생하였다는 것\n제905조(운송인의 책임한도액)","kind":"L"},{"id":"L:906","label":"법 제906조","title":"선급금의 지급","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"① 여객의 사망 또는 신체의 상해가 발생한 항공기사고의 경우에 운송인은 손해배상청구권자가 청구하면 지체 없이 선급금(先給金)을 지급하여야 한다. 이 경우 선급금의 지급만으로 운송인의 책임이 있는 것으로 보지 아니한다.\n② 지급한 선급금은 운송인이 손해배상으로 지급하여야 할 금액에 충당할 수 있다.\n③ 선급금의 지급액, 지급 절차 및 방법 등에 관하여는 대통령령으로 정한다.\n제906조(선급금의 지급)","kind":"L"},{"id":"L:907","label":"법 제907조","title":"연착에 대한 책임","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"① 운송인은 여객의 연착으로 인한 손해에 대하여 책임을 진다. 다만, 운송인이 자신과 그 사용인 및 대리인이 손해를 방지하기 위하여 합리적으로 요구되는 모든 조치를 하였다는 것 또는 그 조치를 하는 것이 불가능하였다는 것을 증명한 경우에는 그 책임을 면한다.\n② 제1항에 따른 운송인의 책임은 여객 1명당 4천694 계산단위의 금액을 한도로 한다. 다만, 여객과의 운송계약상 그 출발지, 도착지 및 중간 착륙지가 대한민국 영토 내에 있는 운송의 경우에는 여객 1명당 1천 계산단위의 금액을 한도로 한다. <개정 2014.5.20>\n③ 제2항은 운송인 또는 그 사용인이나 대리인의 고의로 또는 연착이 생길 염려가 있음을 인식하면서 무모하게 한 작위 또는 부작위에 의하여 손해가 발생한 것이 증명된 경우에는 적용하지 아니한다.\n제907조(연착에 대한 책임)","kind":"L"},{"id":"L:908","label":"법 제908조","title":"수하물의 멸실ㆍ훼손에 대한 책임","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"① 운송인은 위탁수하물의 멸실 또는 훼손으로 인한 손해에 대하여는 그 손해의 원인이 된 사실이 항공기상에서 또는 위탁수하물이 운송인의 관리하에 있는 기간 중에 발생한 경우에만 책임을 진다. 다만, 그 손해가 위탁수하물의 고유한 결함, 특수한 성질 또는 숨은 하자로 인하여 발생한 경우에는 그 범위에서 책임을 지지 아니한다.\n② 운송인은 휴대수하물의 멸실 또는 훼손으로 인한 손해에 대하여는 그 손해가 자신 또는 그 사용인이나 대리인의 고의 또는 과실에 의하여 발생한 경우에만 책임을 진다.\n제908조(수하물의 멸실ㆍ훼손에 대한 책임)","kind":"L"},{"id":"L:909","label":"법 제909조","title":"수하물의 연착에 대한 책임","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"제909조(수하물의 연착에 대한 책임) 운송인은 수하물의 연착으로 인한 손해에 대하여 책임을 진다. 다만, 운송인이 자신과 그 사용인 및 대리인이 손해를 방지하기 위하여 합리적으로 요구되는 모든 조치를 하였다는 것 또는 그 조치를 하는 것이 불가능하였다는 것을 증명한 경우에는 그 책임을 면한다.","kind":"L"},{"id":"L:910","label":"법 제910조","title":"수하물에 대한 책임한도액","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"① 제908조와 제909조에 따른 운송인의 손해배상책임은 여객 1명당 1천131 계산단위의 금액을 한도로 한다. 다만, 여객이 운송인에게 위탁수하물을 인도할 때에 도착지에서 인도받을 때의 예정가액을 미리 신고한 경우에는 운송인은 신고 가액이 위탁수하물을 도착지에서 인도할 때의 실제가액을 초과한다는 것을 증명하지 아니하는 한 신고 가액을 한도로 책임을 진다. <개정 2014.5.20>\n② 제1항은 운송인 또는 그 사용인이나 대리인의 고의로 또는 수하물의 멸실, 훼손 또는 연착이 생길 염려가 있음을 인식하면서 무모하게 한 작위 또는 부작위에 의하여 손해가 발생한 것이 증명된 경우에는 적용하지 아니한다.\n제910조(수하물에 대한 책임한도액)","kind":"L"},{"id":"L:911","label":"법 제911조","title":"위탁수하물의 일부 멸실ㆍ훼손 등에 관한 통지","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"① 여객이 위탁수하물의 일부 멸실 또는 훼손을 발견하였을 때에는 위탁수하물을 수령한 후 지체 없이 그 개요에 관하여 운송인에게 서면 또는 전자문서로 통지를 발송하여야 한다. 다만, 그 멸실 또는 훼손이 즉시 발견할 수 없는 것일 경우에는 위탁수하물을 수령한 날부터 7일 이내에 그 통지를 발송하여야 한다.\n② 위탁수하물이 연착된 경우 여객은 위탁수하물을 처분할 수 있는 날부터 21일 이내에 이의를 제기하여야 한다.\n③ 위탁수하물이 일부 멸실, 훼손 또는 연착된 경우에는 제916조제3항부터 제6항까지를 준용한다.\n제911조(위탁수하물의 일부 멸실ㆍ훼손 등에 관한 통지)","kind":"L"},{"id":"L:912","label":"법 제912조","title":"휴대수하물의 무임운송의무","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"제912조(휴대수하물의 무임운송의무) 운송인은 휴대수하물에 대하여는 다른 약정이 없으면 별도로 운임을 청구하지 못한다.","kind":"L"},{"id":"L:913","label":"법 제913조","title":"운송물의 멸실ㆍ훼손에 대한 책임","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"① 운송인은 운송물의 멸실 또는 훼손으로 인한 손해에 대하여 그 손해가 항공운송 중(운송인이 운송물을 관리하고 있는 기간을 포함한다. 이하 이 조에서 같다)에 발생한 경우에만 책임을 진다. 다만, 운송인이 운송물의 멸실 또는 훼손이 다음 각 호의 사유로 인하여 발생하였음을 증명하였을 경우에는 그 책임을 면한다.\n1. 운송물의 고유한 결함, 특수한 성질 또는 숨은 하자\n2. 운송인 또는 그 사용인이나 대리인 외의 자가 수행한 운송물의 부적절한 포장 또는 불완전한 기호 표시\n3. 전쟁, 폭동, 내란 또는 무력충돌\n4. 운송물의 출입국, 검역 또는 통관과 관련된 공공기관의 행위\n5. 불가항력\n② 제1항에 따른 항공운송 중에는 공항 외부에서 한 육상, 해상 운송 또는 내륙 수로운송은 포함되지 아니한다. 다만, 그러한 운송이 운송계약을 이행하면서 운송물의 적재(積載), 인도 또는 환적(換積)할 목적으로 이루어졌을 경우에는 항공운송 중인 것으로 추정한다.\n③ 운송인이 송하인과의 합의에 따라 항공운송하기로 예정된 운송의 전부 또는 일부를 송하인의 동의 없이 다른 운송수단에 의한 운송으로 대체하였을 경우에는 그 다른 운송수단에 의한 운송은 항공운송으로 본다.\n제913조(운송물의 멸실ㆍ훼손에 대한 책임)","kind":"L"},{"id":"L:914","label":"법 제914조","title":"운송물 연착에 대한 책임","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"제914조(운송물 연착에 대한 책임) 운송인은 운송물의 연착으로 인한 손해에 대하여 책임을 진다. 다만, 운송인이 자신과 그 사용인 및 대리인이 손해를 방지하기 위하여 합리적으로 요구되는 모든 조치를 하였다는 것 또는 그 조치를 하는 것이 불가능하였다는 것을 증명한 경우에는 그 책임을 면한다.","kind":"L"},{"id":"L:915","label":"법 제915조","title":"운송물에 대한 책임한도액","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"① 제913조와 제914조에 따른 운송인의 손해배상책임은 손해가 발생한 해당 운송물의 1킬로그램당 19 계산단위의 금액을 한도로 하되, 송하인과의 운송계약상 그 출발지, 도착지 및 중간 착륙지가 대한민국 영토 내에 있는 운송의 경우에는 손해가 발생한 해당 운송물의 1킬로그램당 15 계산단위의 금액을 한도로 한다. 다만, 송하인이 운송물을 운송인에게 인도할 때에 도착지에서 인도받을 때의 예정가액을 미리 신고한 경우에는 운송인은 신고 가액이 도착지에서 인도할 때의 실제가액을 초과한다는 것을 증명하지 아니하는 한 신고 가액을 한도로 책임을 진다. <개정 2014.5.20>\n② 제1항의 항공운송인의 책임한도를 결정할 때 고려하여야 할 중량은 해당 손해가 발생된 운송물의 중량을 말한다. 다만, 운송물의 일부 또는 운송물에 포함된 물건의 멸실, 훼손 또는 연착이 동일한 항공화물운송장(제924조에 따라 항공화물운송장의 교부에 대체되는 경우를 포함한다) 또는 화물수령증에 적힌 다른 운송물의 가치에 영향을 미칠 때에는 운송인의 책임한도를 결정할 때 그 다른 운송물의 중량도 고려하여야 한다.\n제915조(운송물에 대한 책임한도액)","kind":"L"},{"id":"L:916","label":"법 제916조","title":"운송물의 일부 멸실ㆍ훼손 등에 관한 통지","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"① 수하인은 운송물의 일부 멸실 또는 훼손을 발견하면 운송물을 수령한 후 지체 없이 그 개요에 관하여 운송인에게 서면 또는 전자문서로 통지를 발송하여야 한다. 다만, 그 멸실 또는 훼손이 즉시 발견할 수 없는 것일 경우에는 수령일부터 14일 이내에 그 통지를 발송하여야 한다.\n② 운송물이 연착된 경우 수하인은 운송물을 처분할 수 있는 날부터 21일 이내에 이의를 제기하여야 한다.\n③ 제1항의 통지가 없는 경우에는 운송물이 멸실 또는 훼손 없이 수하인에게 인도된 것으로 추정한다.\n④ 운송물에 멸실 또는 훼손이 발생하였거나 그런 것으로 의심되는 경우에는 운송인과 수하인은 서로 운송물의 검사를 위하여 필요한 편의를 제공하여야 한다.\n⑤ 제1항과 제2항의 기간 내에 통지나 이의제기가 없을 경우에는 수하인은 운송인에 대하여 제소할 수 없다. 다만, 운송인 또는 그 사용인이나 대리인이 악의인 경우에는 그러하지 아니하다.\n⑥ 제1항부터 제5항까지의 규정에 반하여 수하인에게 불리한 당사자 사이의 특약은 효력이 없다.\n제916조(운송물의 일부 멸실ㆍ훼손 등에 관한 통지)","kind":"L"},{"id":"L:917","label":"법 제917조","title":"운송물의 처분청구권","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"① 송하인은 운송인에게 운송의 중지, 운송물의 반환, 그 밖의 처분을 청구(이하 이 조에서 \"처분청구권\"이라 한다)할 수 있다. 이 경우에 운송인은 운송계약에서 정한 바에 따라 운임, 체당금과 처분으로 인한 비용의 지급을 청구할 수 있다.\n② 송하인은 운송인 또는 다른 송하인의 권리를 침해하는 방법으로 처분청구권을 행사하여서는 아니 되며, 운송인이 송하인의 청구에 따르지 못할 경우에는 지체 없이 그 뜻을 송하인에게 통지하여야 한다.\n③ 운송인이 송하인에게 교부한 항공화물운송장 또는 화물수령증을 확인하지 아니하고 송하인의 처분청구에 따른 경우, 운송인은 그로 인하여 항공화물운송장 또는 화물수령증의 소지인이 입은 손해를 배상할 책임을 진다.\n④ 제918조제1항에 따라 수하인이 운송물의 인도를 청구할 권리를 취득하였을 때에는 송하인의 처분청구권은 소멸한다. 다만, 수하인이 운송물의 수령을 거부하거나 수하인을 알 수 없을 경우에는 그러하지 아니하다.\n제917조(운송물의 처분청구권)","kind":"L"},{"id":"L:918","label":"법 제918조","title":"운송물의 인도","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"① 운송물이 도착지에 도착한 때에는 수하인은 운송인에게 운송물의 인도를 청구할 수 있다. 다만, 송하인이 제917조제1항에 따라 처분청구권을 행사한 경우에는 그러하지 아니하다.\n② 운송물이 도착지에 도착하면 다른 약정이 없는 한 운송인은 지체 없이 수하인에게 통지하여야 한다.\n제918조(운송물의 인도)","kind":"L"},{"id":"L:919","label":"법 제919조","title":"운송인의 채권의 시효","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"제919조(운송인의 채권의 시효) 운송인의 송하인 또는 수하인에 대한 채권은 2년간 행사하지 아니하면 소멸시효가 완성한다.","kind":"L"},{"id":"L:920","label":"법 제920조","title":"준용규정","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"제920조(준용규정) 항공화물 운송에 관하여는 제120조, 제134조, 제141조부터 제143조까지, 제792조, 제793조, 제801조, 제802조, 제811조 및 제812조를 준용한다. 이 경우 \"선적항\"은 \"출발지 공항\"으로, \"선장\"은 \"운송인\"으로, \"양륙항\"은 \"도착지 공항\"으로 본다.","kind":"L"},{"id":"L:921","label":"법 제921조","title":"여객항공권","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"① 운송인이 여객운송을 인수하면 여객에게 다음 각 호의 사항을 적은 개인용 또는 단체용 여객항공권을 교부하여야 한다.\n1. 여객의 성명 또는 단체의 명칭\n2. 출발지와 도착지\n3. 출발일시\n4. 운항할 항공편\n5. 발행지와 발행연월일\n6. 운송인의 성명 또는 상호\n② 운송인은 제1항 각 호의 정보를 전산정보처리조직에 의하여 전자적 형태로 저장하거나 그 밖의 다른 방식으로 보존함으로써 제1항의 여객항공권 교부를 갈음할 수 있다. 이 경우 운송인은 여객이 청구하면 제1항 각 호의 정보를 적은 서면을 교부하여야 한다.\n제921조(여객항공권)","kind":"L"},{"id":"L:922","label":"법 제922조","title":"수하물표","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"제922조(수하물표) 운송인은 여객에게 개개의 위탁수하물마다 수하물표를 교부하여야 한다.","kind":"L"},{"id":"L:923","label":"법 제923조","title":"항공화물운송장의 발행","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"① 송하인은 운송인의 청구를 받아 다음 각 호의 사항을 적은 항공화물운송장 3부를 작성하여 운송인에게 교부하여야 한다.\n1. 송하인의 성명 또는 상호\n2. 수하인의 성명 또는 상호\n3. 출발지와 도착지\n4. 운송물의 종류, 중량, 포장의 종별ㆍ개수와 기호\n5. 출발일시\n6. 운송할 항공편\n7. 발행지와 발행연월일\n8. 운송인의 성명 또는 상호\n② 운송인이 송하인의 청구에 따라 항공화물운송장을 작성한 경우에는 송하인을 대신하여 작성한 것으로 추정한다.\n③ 제1항의 항공화물운송장 중 제1원본에는 \"운송인용\"이라고 적고 송하인이 기명날인 또는 서명하여야 하고, 제2원본에는 \"수하인용\"이라고 적고 송하인과 운송인이 기명날인 또는 서명하여야 하며, 제3원본에는 \"송하인용\"이라고 적고 운송인이 기명날인 또는 서명하여야 한다.\n④ 제3항의 서명은 인쇄 또는 그 밖의 다른 적절한 방법으로 할 수 있다.\n⑤ 운송인은 송하인으로부터 운송물을 수령한 후 송하인에게 항공화물운송장 제3원본을 교부하여야 한다.\n제923조(항공화물운송장의 발행)","kind":"L"},{"id":"L:924","label":"법 제924조","title":"항공화물운송장의 대체","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"① 운송인은 제923조제1항 각 호의 정보를 전산정보처리조직에 의하여 전자적 형태로 저장하거나 그 밖의 다른 방식으로 보존함으로써 항공화물운송장의 교부에 대체할 수 있다.\n② 제1항의 경우 운송인은 송하인의 청구에 따라 송하인에게 제923조제1항 각 호의 정보를 적은 화물수령증을 교부하여야 한다.\n제924조(항공화물운송장의 대체)","kind":"L"},{"id":"L:925","label":"법 제925조","title":"복수의 운송물","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"① 2개 이상의 운송물이 있는 경우에는 운송인은 송하인에 대하여 각 운송물마다 항공화물운송장의 교부를 청구할 수 있다.\n② 항공화물운송장의 교부가 제924조제1항에 따른 저장ㆍ보존으로 대체되는 경우에는 송하인은 운송인에게 각 운송물마다 화물수령증의 교부를 청구할 수 있다.\n제925조(복수의 운송물)","kind":"L"},{"id":"L:926","label":"법 제926조","title":"운송물의 성질에 관한 서류","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"① 송하인은 세관, 경찰 등 행정기관이나 그 밖의 공공기관의 절차를 이행하기 위하여 필요한 경우 운송인의 요청을 받아 운송물의 성질을 명시한 서류를 운송인에게 교부하여야 한다.\n② 운송인은 제1항과 관련하여 어떠한 의무나 책임을 부담하지 아니한다.\n제926조(운송물의 성질에 관한 서류)","kind":"L"},{"id":"L:927","label":"법 제927조","title":"항공운송증서에 관한 규정 위반의 효과","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"제927조(항공운송증서에 관한 규정 위반의 효과) 운송인 또는 송하인이 제921조부터 제926조까지를 위반하는 경우에도 운송계약의 효력 및 이 법의 다른 규정의 적용에 영향을 미치지 아니한다.","kind":"L"},{"id":"L:928","label":"법 제928조","title":"항공운송증서 등의 기재사항에 관한 책임","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"① 송하인은 항공화물운송장에 적었거나 운송인에게 통지한 운송물의 명세 또는 운송물에 관한 진술이 정확하고 충분함을 운송인에게 담보한 것으로 본다.\n② 송하인은 제1항의 운송물의 명세 또는 운송물에 관한 진술이 정확하지 아니하거나 불충분하여 운송인이 손해를 입은 경우에는 운송인에게 배상할 책임이 있다.\n③ 운송인은 제924조제1항에 따라 저장ㆍ보존되는 운송에 관한 기록이나 화물수령증에 적은 운송물의 명세 또는 운송물에 관한 진술이 정확하지 아니하거나 불충분하여 송하인이 손해를 입은 경우 송하인에게 배상할 책임이 있다. 다만, 제1항에 따라 송하인이 그 정확하고 충분함을 담보한 것으로 보는 경우에는 그러하지 아니하다.\n제928조(항공운송증서 등의 기재사항에 관한 책임)","kind":"L"},{"id":"L:929","label":"법 제929조","title":"항공운송증서 기재의 효력","chapter":"제6편 항공운송 제2장 운송","deleted":false,"text":"① 항공화물운송장 또는 화물수령증이 교부된 경우 그 운송증서에 적힌 대로 운송계약이 체결된 것으로 추정한다.\n② 운송인은 항공화물운송장 또는 화물수령증에 적힌 운송물의 중량, 크기, 포장의 종별ㆍ개수ㆍ기호 및 외관상태대로 운송물을 수령한 것으로 추정한다.\n③ 운송물의 종류, 외관상태 외의 상태, 포장 내부의 수량 및 부피에 관한 항공화물운송장 또는 화물수령증의 기재 내용은 송하인이 참여한 가운데 운송인이 그 기재 내용의 정확함을 확인하고 그 사실을 항공화물운송장이나 화물수령증에 적은 경우에만 그 기재 내용대로 운송물을 수령한 것으로 추정한다.\n제929조(항공운송증서 기재의 효력)","kind":"L"},{"id":"L:930","label":"법 제930조","title":"항공기 운항자의 배상책임","chapter":"제6편 항공운송 제3장 지상 제3자의 손해에 대한 책임","deleted":false,"text":"① 항공기 운항자는 비행 중인 항공기 또는 항공기로부터 떨어진 사람이나 물건으로 인하여 사망하거나 상해 또는 재산상 손해를 입은 지상(지하, 수면 또는 수중을 포함한다)의 제3자에 대하여 손해배상책임을 진다.\n② 이 편에서 \"항공기 운항자\"란 사고 발생 당시 항공기를 사용하는 자를 말한다. 다만, 항공기의 운항을 지배하는 자(이하 \"운항지배자\"라 한다)가 타인에게 항공기를 사용하게 한 경우에는 운항지배자를 항공기 운항자로 본다.\n③ 이 편을 적용할 때에 항공기등록원부에 기재된 항공기 소유자는 항공기 운항자로 추정한다.\n④ 제1항에서 \"비행 중\"이란 이륙을 목적으로 항공기에 동력이 켜지는 때부터 착륙이 끝나는 때까지를 말한다.\n⑤ 2대 이상의 항공기가 관여하여 제1항의 사고가 발생한 경우 각 항공기 운항자는 연대하여 제1항의 책임을 진다.\n⑥ 운항지배자의 승낙 없이 항공기가 사용된 경우 운항지배자는 이를 막기 위하여 상당한 주의를 하였음을 증명하지 못하는 한 승낙 없이 항공기를 사용한 자와 연대하여 제932조에서 정한 한도 내의 책임을 진다.\n제930조(항공기 운항자의 배상책임)","kind":"L"},{"id":"L:931","label":"법 제931조","title":"면책사유","chapter":"제6편 항공운송 제3장 지상 제3자의 손해에 대한 책임","deleted":false,"text":"1. 전쟁, 폭동, 내란 또는 무력충돌의 직접적인 결과로 발생하였다는 것\n2. 항공기 운항자가 공권력에 의하여 항공기 사용권을 박탈당한 중에 발생하였다는 것\n3. 오로지 피해자 또는 피해자의 사용인이나 대리인의 과실 또는 그 밖의 불법한 작위나 부작위에 의하여서만 발생하였다는 것\n4. 불가항력\n제931조(면책사유) 항공기 운항자는 제930조제1항에 따른 사망, 상해 또는 재산상 손해의 발생이 다음 각 호의 어느 하나에 해당함을 증명하면 책임을 지지 아니한다.","kind":"L"},{"id":"L:932","label":"법 제932조","title":"항공기 운항자의 유한책임","chapter":"제6편 항공운송 제3장 지상 제3자의 손해에 대한 책임","deleted":false,"text":"① 항공기 운항자의 제930조에 따른 책임은 하나의 항공기가 관련된 하나의 사고에 대하여 항공기의 이륙을 위하여 법으로 허용된 최대중량(이하 이 조에서 \"최대중량\"이라 한다)에 따라 다음 각 호에서 정한 금액을 한도로 한다.\n1. 최대중량이 2천킬로그램 이하의 항공기의 경우 30만 계산단위의 금액\n2. 최대중량이 2천킬로그램을 초과하는 항공기의 경우 2천킬로그램까지는 30만 계산단위, 2천킬로그램 초과 6천킬로그램까지는 매 킬로그램당 175 계산단위, 6천킬로그램 초과 3만킬로그램까지는 매 킬로그램당 62.5 계산단위, 3만킬로그램을 초과하는 부분에는 매 킬로그램당 65 계산단위를 각각 곱하여 얻은 금액을 순차로 더한 금액\n② 하나의 항공기가 관련된 하나의 사고로 인하여 사망 또는 상해가 발생한 경우 항공기 운항자의 제930조에 따른 책임은 제1항의 금액의 범위에서 사망하거나 상해를 입은 사람 1명당 12만5천 계산단위의 금액을 한도로 한다.\n③ 하나의 항공기가 관련된 하나의 사고로 인하여 여러 사람에게 생긴 손해의 합계가 제1항의 한도액을 초과하는 경우, 각각의 손해는 제1항의 한도액에 대한 비율에 따라 배상한다.\n④ 하나의 항공기가 관련된 하나의 사고로 인하여 사망, 상해 또는 재산상의 손해가 발생한 경우 제1항에서 정한 금액의 한도에서 사망 또는 상해로 인한 손해를 먼저 배상하고, 남는 금액이 있으면 재산상의 손해를 배상한다.\n제932조(항공기 운항자의 유한책임)","kind":"L"},{"id":"L:933","label":"법 제933조","title":"유한책임의 배제","chapter":"제6편 항공운송 제3장 지상 제3자의 손해에 대한 책임","deleted":false,"text":"① 항공기 운항자 또는 그 사용인이나 대리인이 손해를 발생시킬 의도로 제930조제1항의 사고를 발생시킨 경우에는 제932조를 적용하지 아니한다. 이 경우 항공기 운항자의 사용인이나 대리인의 행위로 인하여 사고가 발생한 경우에는 그가 권한 범위에서 행위하고 있었다는 사실이 증명되어야 한다.\n② 항공기를 사용할 권한을 가진 자의 동의 없이 불법으로 항공기를 탈취(奪取)하여 사용하는 중 제930조제1항의 사고를 발생시킨 자에 대하여는 제932조를 적용하지 아니한다.\n제933조(유한책임의 배제)","kind":"L"},{"id":"L:934","label":"법 제934조","title":"항공기 운항자의 책임의 소멸","chapter":"제6편 항공운송 제3장 지상 제3자의 손해에 대한 책임","deleted":false,"text":"제934조(항공기 운항자의 책임의 소멸) 항공기 운항자의 제930조의 책임은 사고가 발생한 날부터 3년 이내에 재판상 청구가 없으면 소멸한다.","kind":"L"},{"id":"L:935","label":"법 제935조","title":"책임제한의 절차","chapter":"제6편 항공운송 제3장 지상 제3자의 손해에 대한 책임","deleted":false,"text":"① 이 장의 규정에 따라 책임을 제한하려는 자는 채권자로부터 책임한도액을 초과하는 청구금액을 명시한 서면에 의한 청구를 받은 날부터 1년 이내에 법원에 책임제한절차 개시의 신청을 하여야 한다.\n② 책임제한절차 개시의 신청, 책임제한 기금의 형성ㆍ공고ㆍ참가ㆍ배당, 그 밖에 필요한 사항에 관하여는 성질에 반하지 아니하는 범위에서 「선박소유자 등의 책임제한절차에 관한 법률」의 예를 따른다.\n제935조(책임제한의 절차)","kind":"L"},{"id":"D:1","label":"영 제1조","title":"목적","chapter":"제1편 총칙","deleted":false,"text":"제1조(목적) 이 영은 「상법」에서 위임된 사항과 그 시행에 필요한 사항을 정함을 목적으로 한다.","kind":"D"},{"id":"D:2","label":"영 제2조","title":"소상인의 범위","chapter":"제1편 총칙","deleted":false,"text":"제2조(소상인의 범위) 「상법」(이하 \"법\"이라 한다) 제9조에 따른 소상인은 자본금액이 1천만원에 미치지 못하는 상인으로서 회사가 아닌 자로 한다.","kind":"D"},{"id":"D:3","label":"영 제3조","title":"전산정보처리조직에 의한 보존","chapter":"제1편 총칙","deleted":false,"text":"1. 「전자문서 및 전자거래 기본법」 제5조제2항에 따라 전자화문서로 보존하는 방법\n2. 제1호 외의 경우에는 다음 각 목의 기준에 따라 보존하는 방법\n가. 전산정보처리조직에 장부와 서류를 보존하기 위한 프로그램의 개발ㆍ변경 및 운영에 관한 기록을 보관하여야 하며, 보존의 경위 및 절차를 알 수 있도록 할 것\n나. 법 및 일반적으로 공정ㆍ타당한 회계관행에 따라 그 내용을 파악할 수 있도록 보존할 것\n다. 필요한 경우 그 보존 내용을 영상 또는 출력된 문서로 열람할 수 있도록 할 것\n라. 전산정보처리조직에 보존된 자료의 멸실ㆍ훼손 등에 대비하는 조치를 마련할 것\n제3조(전산정보처리조직에 의한 보존) 법 제33조제1항에 따른 상업장부와 영업에 관한 중요서류(이하 이 조에서 \"장부와 서류\"라 한다)를 같은 조 제3항에 따라 마이크로필름이나 그 밖의 전산정보처리조직(이하 이 조에서 \"전산정보처리조직\"이라 한다)에 의하여 보존하는 경우에는 다음 각 호의 어느 하나에 해당하는 방법으로 보존하여야 한다. 다만, 법에 따라 작성자가 기명날인 또는 서명하여야 하는 장부와 서류는 그 기명날인 또는 서명이 되어있는 원본을 보존하여야 한다. <개정 2012.8.31>","kind":"D"},{"id":"D:4","label":"영 제4조","title":"호천ㆍ항만의 범위","chapter":"제2편 상행위","deleted":false,"text":"제4조(호천ㆍ항만의 범위) 법 제125조에 따른 호천(湖川), 항만의 범위는 「선박안전법 시행령」 제2조제1항제3호가목에 따른 평수(平水)구역으로 한다.","kind":"D"},{"id":"D:5","label":"영 제5조","title":"유한책임회사 재무제표의 범위","chapter":"제3편 회사","deleted":false,"text":"1. 자본변동표\n2. 이익잉여금 처분계산서 또는 결손금 처리계산서\n제5조(유한책임회사 재무제표의 범위) 법 제287조의33에서 \"대통령령으로 정하는 서류\"란 다음 각 호의 어느 하나에 해당하는 서류를 말한다.","kind":"D"},{"id":"D:6","label":"영 제6조","title":"전자적 방법을 통한 회사의 공고","chapter":"제3편 회사","deleted":false,"text":"① 법 제289조제3항 단서에 따라 회사가 전자적 방법으로 공고하려는 경우에는 회사의 인터넷 홈페이지에 게재하는 방법으로 하여야 한다.\n② 법 제289조제3항 단서에 따라 회사가 정관에서 전자적 방법으로 공고할 것을 정한 경우에는 회사의 인터넷 홈페이지 주소를 등기하여야 한다.\n③ 법 제289조제3항 단서에 따라 회사가 전자적 방법으로 공고하려는 경우에는 그 정보를 회사의 인터넷 홈페이지 초기화면에서 쉽게 찾을 수 있도록 하는 등 이용자의 편의를 위한 조치를 하여야 한다.\n④ 법 제289조제3항 단서에 따라 회사가 정관에서 전자적 방법으로 공고할 것을 정한 경우라도 전산장애 또는 그 밖의 부득이한 사유로 전자적 방법으로 공고할 수 없는 경우에는 법 제289조제3항 본문에 따라 미리 정관에서 정하여 둔 관보 또는 시사에 관한 사항을 게재하는 일간신문에 공고하여야 한다.\n⑤ 법 제289조제4항 본문에서 \"대통령령으로 정하는 기간\"이란 다음 각 호에서 정하는 날까지의 기간(이하 이 조에서 \"공고기간\"이라 한다)을 말한다.\n1. 법에서 특정한 날부터 일정한 기간 전에 공고하도록 한 경우: 그 특정한 날\n2. 법에서 공고에서 정하는 기간 내에 이의를 제출하거나 일정한 행위를 할 수 있도록 한 경우: 그 기간이 지난 날\n3. 제1호와 제2호 외의 경우: 해당 공고를 한 날부터 3개월이 지난 날\n⑥ 제5항에 따른 공고기간에 공고가 중단(불특정 다수가 공고된 정보를 제공받을 수 없게 되거나 그 공고된 정보가 변경 또는 훼손된 경우를 말한다)되더라도, 그 중단된 기간의 합계가 공고기간의 5분의 1을 초과하지 않으면 공고의 중단은 해당 공고의 효력에 영향을 미치지 아니한다. 다만, 회사가 공고의 중단에 대하여 고의 또는 중대한 과실이 있는 경우에는 그러하지 아니하다.\n제6조(전자적 방법을 통한 회사의 공고)","kind":"D"},{"id":"D:7","label":"영 제7조","title":"검사인의 조사, 보고의 면제","chapter":"제3편 회사","deleted":false,"text":"① 법 제299조제2항제1호에서 \"대통령령으로 정한 금액\"이란 5천만원을 말한다.\n② 법 제299조제2항제2호에서 \"대통령령으로 정한 방법으로 산정된 시세\"란 다음 각 호의 금액 중 낮은 금액을 말한다.\n1. 법 제292조에 따른 정관의 효력발생일(이하 이 항에서 \"효력발생일\"이라 한다)부터 소급하여 1개월간의 거래소에서의 평균 종가(終價), 효력발생일부터 소급하여 1주일간의 거래소에서의 평균 종가 및 효력발생일의 직전 거래일의 거래소에서의 종가를 산술평균하여 산정한 금액\n2. 효력발생일 직전 거래일의 거래소에서의 종가\n③ 제2항은 법 제290조제2호 및 제3호의 재산에 그 사용, 수익, 담보제공, 소유권 이전 등에 대한 물권적 또는 채권적 제한이나 부담이 설정된 경우에는 적용하지 아니한다.\n제7조(검사인의 조사, 보고의 면제)","kind":"D"},{"id":"D:8","label":"영 제8조","title":"명의개서대리인의 자격","chapter":"제3편 회사","deleted":false,"text":"제8조(명의개서대리인의 자격) 법 제337조제2항에 따른 명의개서대리인의 자격은 「자본시장과 금융투자업에 관한 법률」 제294조제1항에 따라 설립된 한국예탁결제원(이하 \"한국예탁결제원\"이라 한다) 및 같은 법 제365조제1항에 따라 금융위원회에 등록한 주식회사로 한다.","kind":"D"},{"id":"D:9","label":"영 제9조","title":"자기주식 취득 방법의 종류 등","chapter":"제3편 회사","deleted":false,"text":"① 법 제341조제1항제2호에서 \"대통령령으로 정하는 방법\"이란 다음 각 호의 어느 하나에 해당하는 방법을 말한다.\n1. 회사가 모든 주주에게 자기주식 취득의 통지 또는 공고를 하여 주식을 취득하는 방법\n2. 「자본시장과 금융투자업에 관한 법률」 제133조부터 제146조까지의 규정에 따른 공개매수의 방법\n② 자기주식을 취득한 회사는 지체 없이 취득 내용을 적은 자기주식 취득내역서를 본점에 6개월간 갖추어 두어야 한다. 이 경우 주주와 회사채권자는 영업시간 내에 언제든지 자기주식 취득내역서를 열람할 수 있으며, 회사가 정한 비용을 지급하고 그 서류의 등본이나 사본의 교부를 청구할 수 있다.\n제9조(자기주식 취득 방법의 종류 등)","kind":"D"},{"id":"D:10","label":"영 제10조","title":"자기주식 취득의 방법","chapter":"제3편 회사","deleted":false,"text":"1. 법 제341조제2항에 따른 결정을 한 회사가 자기주식을 취득하려는 경우에는 이사회의 결의로써 다음 각 목의 사항을 정할 것. 이 경우 주식 취득의 조건은 이사회가 결의할 때마다 균등하게 정하여야 한다.\n가. 자기주식 취득의 목적\n나. 취득할 주식의 종류 및 수\n다. 주식 1주를 취득하는 대가로 교부할 금전이나 그 밖의 재산(해당 회사의 주식은 제외한다. 이하 이 조에서 \"금전등\"이라 한다)의 내용 및 그 산정 방법\n라. 주식 취득의 대가로 교부할 금전등의 총액\n마. 20일 이상 60일 내의 범위에서 주식양도를 신청할 수 있는 기간(이하 이 조에서 \"양도신청기간\"이라 한다)\n바. 양도신청기간이 끝나는 날부터 1개월의 범위에서 양도의 대가로 금전등을 교부하는 시기와 그 밖에 주식 취득의 조건\n2. 회사는 양도신청기간이 시작하는 날의 2주 전까지 각 주주에게 회사의 재무 현황, 자기주식 보유 현황 및 제1호 각 목의 사항을 서면으로 또는 각 주주의 동의를 받아 전자문서로 통지할 것. 다만, 회사가 무기명식의 주권을 발행한 경우에는 양도신청기간이 시작하는 날의 3주 전에 공고하여야 한다.\n3. 회사에 주식을 양도하려는 주주는 양도신청기간이 끝나는 날까지 양도하려는 주식의 종류와 수를 적은 서면으로 주식양도를 신청할 것\n4. 주주가 제3호에 따라 회사에 대하여 주식 양도를 신청한 경우 회사와 그 주주 사이의 주식 취득을 위한 계약 성립의 시기는 양도신청기간이 끝나는 날로 정하고, 주주가 신청한 주식의 총수가 제1호나목의 취득할 주식의 총수를 초과하는 경우 계약 성립의 범위는 취득할 주식의 총수를 신청한 주식의 총수로 나눈 수에 제3호에 따라 주주가 신청한 주식의 수를 곱한 수(이 경우 끝수는 버린다)로 정할 것\n제10조(자기주식 취득의 방법) 회사가 제9조제1호에 따라 자기주식을 취득하는 경우에는 다음 각 호의 기준에 따라야 한다.","kind":"D"},{"id":"D:11","label":"영 제11조","title":"전자주주명부","chapter":"제3편 회사","deleted":false,"text":"① 법 제352조의2에 따라 회사가 전자주주명부를 작성하는 경우에 회사의 본점 또는 명의개서대리인의 영업소에서 전자주주명부의 내용을 서면으로 인쇄할 수 있으면 법 제396조제1항에 따라 주주명부를 갖추어 둔 것으로 본다.\n② 주주와 회사채권자는 영업시간 내에 언제든지 서면 또는 파일의 형태로 전자주주명부에 기록된 사항의 열람 또는 복사를 청구할 수 있다. 이 경우 회사는 법 제352조의2제2항에 따라 기재된 다른 주주의 전자우편주소를 열람 또는 복사의 대상에서 제외하는 조치를 하여야 한다.\n제11조(전자주주명부)","kind":"D"},{"id":"D:12","label":"영 제12조","title":"주주제안의 거부","chapter":"제3편 회사","deleted":false,"text":"1. 주주총회에서 의결권의 100분의 10 미만의 찬성밖에 얻지 못하여 부결된 내용과 같은 내용의 의안을 부결된 날부터 3년 내에 다시 제안하는 경우\n2. 주주 개인의 고충에 관한 사항인 경우\n3. 주주가 권리를 행사하기 위하여 일정 비율을 초과하는 주식을 보유해야 하는 소수주주권에 관한 사항인 경우\n4. 임기 중에 있는 임원의 해임에 관한 사항[법 제542조의2제1항에 따른 상장회사(이하 \"상장회사\"라 한다)만 해당한다]인 경우\n5. 회사가 실현할 수 없는 사항 또는 제안 이유가 명백히 거짓이거나 특정인의 명예를 훼손하는 사항인 경우\n제12조(주주제안의 거부) 법 제363조의2제3항 전단에서 \"대통령령으로 정하는 경우\"란 주주제안의 내용이 다음 각 호의 어느 하나에 해당하는 경우를 말한다.","kind":"D"},{"id":"D:13","label":"영 제13조","title":"전자적 방법에 의한 의결권의 행사","chapter":"제3편 회사","deleted":false,"text":"① 법 제368조의4에 따라 주주가 의결권을 전자적 방법으로 행사(이하 이 조에서 \"전자투표\"라 한다)하는 경우 주주는 다음 각 호의 어느 하나에 해당하는 방법으로 주주 본인임을 확인하고, 「전자서명법」 제2조제2호에 따른 전자서명을 통하여 전자투표를 하여야 한다. <개정 2020.1.29, 2020.12.8>\n1. 「전자서명법」 제8조제2항에 따른 운영기준 준수사실의 인정을 받은 전자서명인증사업자가 제공하는 본인확인의 방법\n2. 「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 제23조의3에 따른 본인확인기관에서 제공하는 본인확인의 방법\n② 법 제368조의4에 따라 전자적 방법으로 의결권을 행사할 수 있음을 정한 회사는 주주총회 소집의 통지나 공고에 다음 각 호의 사항을 포함하여야 한다.\n1. 전자투표를 할 인터넷 주소\n2. 전자투표를 할 기간(전자투표의 종료일은 주주총회 전날까지로 하여야 한다)\n3. 그 밖에 주주의 전자투표에 필요한 기술적인 사항\n③ 삭제 <2020.1.29>\n④ 회사는 전자투표의 효율성 및 공정성을 확보하기 위하여 전자투표를 관리하는 기관을 지정하여 주주 확인절차 등 의결권 행사절차의 운영을 위탁할 수 있다.\n⑤ 회사, 제4항에 따라 지정된 전자투표를 관리하는 기관 및 전자투표의 운영을 담당하는 자는 주주총회에서 개표가 있을 때까지 전자투표의 결과를 누설하거나 직무상 목적 외로 사용해서는 아니 된다.\n⑥ 회사 또는 제4항에 따라 지정된 전자투표를 관리하는 기관은 전자투표의 종료일 3일 전까지 주주에게 전자문서로 제2항 각 호의 사항을 한 번 더 통지할 수 있다. 이 경우 주주의 동의가 있으면 전화번호 등을 이용하여 통지할 수 있다. <신설 2020.1.29>\n제13조(전자적 방법에 의한 의결권의 행사)","kind":"D"},{"id":"D:14","label":"영 제14조","title":"현물출자 검사의 면제","chapter":"제3편 회사","deleted":false,"text":"① 법 제422조제2항제1호에서 \"대통령령으로 정한 금액\"이란 5천만원을 말한다.\n② 법 제422조제2항제2호에서 \"대통령령으로 정한 방법으로 산정된 시세\"란 다음 각 호의 금액 중 낮은 금액을 말한다.\n1. 법 제416조에 따른 이사회 또는 주주총회의 결의가 있은 날(이하 이 조에서 \"결의일\"이라 한다)부터 소급하여 1개월간의 거래소에서의 평균 종가, 결의일부터 소급하여 1주일간의 거래소에서의 평균 종가 및 결의일 직전 거래일의 거래소에서의 종가를 산술평균하여 산정한 금액\n2. 결의일 직전 거래일의 거래소에서의 종가\n③ 제2항은 현물출자의 목적인 재산에 그 사용, 수익, 담보제공, 소유권 이전 등에 대한 물권적 또는 채권적 제한이나 부담이 설정된 경우에는 적용하지 아니한다.\n제14조(현물출자 검사의 면제)","kind":"D"},{"id":"D:15","label":"영 제15조","title":"회계 원칙","chapter":"제3편 회사","deleted":false,"text":"1. 「주식회사 등의 외부감사에 관한 법률」 제4조에 따른 외부감사 대상 회사: 같은 법 제5조제1항에 따른 회계처리기준\n2. 「공공기관의 운영에 관한 법률」 제2조에 따른 공공기관: 같은 법에 따른 공기업ㆍ준정부기관의 회계 원칙\n3. 제1호 및 제2호에 해당하는 회사 외의 회사 등: 회사의 종류 및 규모 등을 고려하여 법무부장관이 중소벤처기업부장관 및 금융위원회와 협의하여 고시한 회계기준\n제15조(회계 원칙) 법 제446조의2에서 \"대통령령으로 규정한 것\"이란 다음 각 호의 구분에 따른 회계기준을 말한다. <개정 2017.7.26, 2018.10.30>","kind":"D"},{"id":"D:16","label":"영 제16조","title":"주식회사 재무제표의 범위 등","chapter":"제3편 회사","deleted":false,"text":"① 법 제447조제1항제3호에서 \"대통령령으로 정하는 서류\"란 다음 각 호의 어느 하나에 해당하는 서류를 말한다. 다만, 「주식회사 등의 외부감사에 관한 법률」 제4조에 따른 외부감사 대상 회사의 경우에는 다음 각 호의 모든 서류, 현금흐름표 및 주석(註釋)을 말한다. <개정 2018.10.30>\n1. 자본변동표\n2. 이익잉여금 처분계산서 또는 결손금 처리계산서\n② 법 제447조제2항에서 \"대통령령으로 정하는 회사\"란 「주식회사 등의 외부감사에 관한 법률」 제4조에 따른 외부감사의 대상이 되는 회사 중 같은 법 제2조제3호에 규정된 지배회사를 말한다. <개정 2018.10.30>\n제16조(주식회사 재무제표의 범위 등)","kind":"D"},{"id":"D:17","label":"영 제17조","title":"영업보고서의 기재사항","chapter":"제3편 회사","deleted":false,"text":"1. 회사의 목적 및 중요한 사업 내용, 영업소ㆍ공장 및 종업원의 상황과 주식ㆍ사채의 상황\n2. 해당 영업연도의 영업의 경과 및 성과(자금조달 및 설비투자의 상황을 포함한다)\n3. 모회사와의 관계, 자회사의 상황, 그 밖에 중요한 기업결합의 상황\n4. 과거 3년간의 영업성적 및 재산상태의 변동상황\n5. 회사가 대처할 과제\n6. 해당 영업연도의 이사ㆍ감사의 성명, 회사에서의 지위 및 담당 업무 또는 주된 직업과 회사와의 거래관계\n7. 상위 5인 이상의 대주주(주주가 회사인 경우에는 그 회사의 자회사가 보유하는 주식을 합산한다), 그 보유주식 수 및 회사와의 거래관계, 해당 대주주에 대한 회사의 출자 상황\n8. 회사, 회사와 그 자회사 또는 회사의 자회사가 다른 회사의 발행주식총수의 10분의 1을 초과하는 주식을 가지고 있는 경우에는 그 주식 수, 그 다른 회사의 명칭 및 그 다른 회사가 가지고 있는 회사의 주식 수\n9. 중요한 채권자 및 채권액, 해당 채권자가 가지고 있는 회사의 주식 수\n10. 결산기 후에 생긴 중요한 사실\n11. 그 밖에 영업에 관한 사항으로서 중요하다고 인정되는 사항\n제17조(영업보고서의 기재사항) 법 제447조의2제2항에 따라 영업보고서에 기재할 사항은 다음 각 호와 같다.","kind":"D"},{"id":"D:18","label":"영 제18조","title":"적립할 자본준비금의 범위","chapter":"제3편 회사","deleted":false,"text":"제18조(적립할 자본준비금의 범위) 법 제459조제1항에 따라 회사는 제15조에서 정한 회계기준에 따라 자본잉여금을 자본준비금으로 적립하여야 한다.","kind":"D"},{"id":"D:19","label":"영 제19조","title":"미실현이익의 범위","chapter":"제3편 회사","deleted":false,"text":"①법 제462조제1항제4호에서 \"대통령령으로 정하는 미실현이익\"이란 법 제446조의2의 회계 원칙에 따른 자산 및 부채에 대한 평가로 인하여 증가한 대차대조표상의 순자산액으로서, 미실현손실과 상계(相計)하지 아니한 금액을 말한다. <개정 2014.2.24>\n② 제1항에도 불구하고 다음 각 호의 어느 하나에 해당하는 경우에는 각각의 미실현이익과 미실현손실을 상계할 수 있다. <신설 2014.2.24, 2023.12.19>\n1. 「자본시장과 금융투자업에 관한 법률」 제4조제2항제5호에 따른 파생결합증권의 거래를 하고, 그 거래의 위험을 회피하기 위하여 해당 거래와 연계된 거래를 한 경우로서 각 거래로 미실현이익과 미실현손실이 발생한 경우\n2. 「자본시장과 금융투자업에 관한 법률」 제5조에 따른 파생상품의 거래가 그 거래와 연계된 거래의 위험을 회피하기 위하여 한 경우로서 각 거래로 미실현이익과 미실현손실이 발생한 경우\n3. 「보험업법」 제2조제1호에 따른 보험상품의 거래를 하고, 그 거래와 연계된 다음 각 목의 어느 하나에 해당하는 거래를 한 경우로서 각 거래로 미실현이익과 미실현손실이 발생한 경우\n가. 보험계약 관련 부채의 금리변동 위험을 회피하기 위한 「자본시장과 금융투자업에 관한 법률」 제4조제3항에 따른 채무증권 또는 같은 법 제5조에 따른 파생상품의 거래\n나. 보험계약 관련 위험을 이전하기 위한 「상법」 제661조에 따른 재보험의 거래\n다. 「보험업법」 제108조제1항제2호에 따른 보험계약 중 보험금이 자산운용의 성과에 따라 변동하는 보험계약 또는 같은 항 제3호에 따른 변액보험계약에서 발생하는 거래\n제19조(미실현이익의 범위)","kind":"D"},{"id":"D:20","label":"영 제20조","title":"사채의 발행","chapter":"제3편 회사","deleted":false,"text":"제20조(사채의 발행) 법 제469조제2항제3호에서 \"대통령령으로 정하는 자산이나 지표\"란 「자본시장과 금융투자업에 관한 법률」 제4조제10항에 따른 기초자산의 가격ㆍ이자율ㆍ지표ㆍ단위 또는 이를 기초로 하는 지수를 말한다.","kind":"D"},{"id":"D:21","label":"영 제21조","title":"이익참가부사채의 발행","chapter":"제3편 회사","deleted":false,"text":"① 법 제469조제2항제1호에 따라 사채권자가 그 사채발행회사의 이익배당에 참가할 수 있는 사채(이하 \"이익참가부사채\"라 한다)를 발행하는 경우에 다음 각 호의 사항으로서 정관에 규정이 없는 사항은 이사회가 결정한다. 다만, 정관에서 주주총회에서 이를 결정하도록 정한 경우에는 그러하지 아니하다.\n1. 이익참가부사채의 총액\n2. 이익배당 참가의 조건 및 내용\n3. 주주에게 이익참가부사채의 인수권을 준다는 뜻과 인수권의 목적인 이익참가부사채의 금액\n② 주주 외의 자에게 이익참가부사채를 발행하는 경우에 그 발행할 수 있는 이익참가부사채의 가액(價額)과 이익배당 참가의 내용에 관하여 정관에 규정이 없으면 법 제434조에 따른 주주총회의 특별결의로 정하여야 한다.\n③ 제2항에 따른 결의를 할 때 이익참가부사채 발행에 관한 의안의 요령은 법 제363조에 따른 통지와 공고에 적어야 한다.\n④ 이익참가부사채의 인수권을 가진 주주는 그가 가진 주식의 수에 따라 이익참가부사채의 배정을 받을 권리가 있다. 다만, 각 이익참가부사채의 금액 중 최저액에 미달하는 끝수에 대해서는 그러하지 아니하다.\n⑤ 회사는 일정한 날을 정하여
