, 그 날에 주주명부에 기재된 주주가 이익참가부사채의 배정을 받을 권리를 가진다는 뜻을 그 날의 2주일 전에 공고하여야 한다. 다만, 그 날이 법 제354조제1항의 기간 중일 때에는 그 기간의 초일의 2주일 전에 이를 공고하여야 한다.\n⑥ 주주가 이익참가부사채의 인수권을 가진 경우에는 각 주주에게 그 인수권을 가진 이익참가부사채의 액, 발행가액, 이익참가의 조건과 일정한 기일까지 이익참가부사채 인수의 청약을 하지 아니하면 그 권리를 잃는다는 뜻을 통지하여야 한다.\n⑦ 회사가 무기명식의 주권을 발행하였을 때에는 제6항의 사항을 공고하여야 한다.\n⑧ 제6항에 따른 통지 또는 제7항에 따른 공고는 제5항에 따른 기일의 2주일 전까지 하여야 한다.\n⑨ 제6항에 따른 통지 또는 제7항에 따른 공고에도 불구하고 그 기일까지 이익참가부사채 인수의 청약을 하지 아니한 경우에는 이익참가부사채의 인수권을 가진 자는 그 권리를 잃는다.\n⑩ 회사가 이익참가부사채를 발행하였을 때에는 법 제476조에 따른 납입이 완료된 날부터 2주일 내에 본점 소재지에서 다음 각 호의 사항을 등기하여야 한다.\n1. 이익참가부사채의 총액\n2. 각 이익참가부사채의 금액\n3. 각 이익참가부사채의 납입금액\n4. 이익배당에 참가할 수 있다는 뜻과 이익배당 참가의 조건 및 내용\n⑪ 회사는 제10항 각 호의 등기사항이 변경된 경우에는 변경 후 2주일 이내에 본점의 소재지에서 변경사항을 등기해야 한다. <개정 2025.1.21>\n⑫ 외국에서 이익참가부사채를 모집한 경우에 등기할 사항이 외국에서 생겼을 때에는 그 등기기간은 그 통지가 도달한 날부터 기산(起算)한다.\n제21조(이익참가부사채의 발행)","kind":"D"},{"id":"D:22","label":"영 제22조","title":"교환사채의 발행","chapter":"제3편 회사","deleted":false,"text":"① 법 제469조제2항제2호에 따라 사채권자가 회사 소유의 주식(회사의 자기주식은 제외한다)이나 그 밖의 다른 유가증권으로 교환할 수 있는 사채(이하 \"교환사채\"라 한다)를 발행하는 경우에는 이사회가 다음 각 호의 사항을 결정한다. <개정 2026.7.21>\n1. 교환할 주식이나 유가증권의 종류 및 내용\n2. 교환의 조건\n3. 교환을 청구할 수 있는 기간\n② 삭제 <2026.7.21>\n③ 교환사채를 발행하는 회사는 사채권자가 교환청구를 하는 때 또는 그 사채의 교환청구기간이 끝나는 때까지 교환에 필요한 주식 또는 유가증권을 한국예탁결제원에 예탁하거나 「주식ㆍ사채 등의 전자등록에 관한 법률」 제2조제6호에 따른 전자등록기관(이하 \"전자등록기관\"이라 한다)에 전자등록해야 한다. 이 경우 한국예탁결제원 또는 전자등록기관은 그 주식 또는 유가증권을 신탁재산임을 표시하여 관리하여야 한다. <개정 2019.6.25>\n④ 사채의 교환을 청구하는 자는 청구서 2통에 사채권을 첨부하여 회사에 제출하여야 한다.\n⑤ 제4항의 청구서에는 교환하려는 주식이나 유가증권의 종류 및 내용, 수와 청구 연월일을 적고 기명날인 또는 서명하여야 한다.\n제22조(교환사채의 발행)","kind":"D"},{"id":"D:23","label":"영 제23조","title":"상환사채의 발행","chapter":"제3편 회사","deleted":false,"text":"① 법 제469조제2항제2호에 따라 회사가 그 소유의 주식(회사의 자기주식은 제외한다)이나 그 밖의 다른 유가증권으로 상환할 수 있는 사채(이하 \"상환사채\"라 한다)를 발행하는 경우에는 이사회가 다음 각 호의 사항을 결정한다. <개정 2026.7.21>\n1. 상환할 주식이나 유가증권의 종류 및 내용\n2. 상환의 조건\n3. 회사의 선택 또는 일정한 조건의 성취나 기한의 도래에 따라 주식이나 그 밖의 다른 유가증권으로 상환한다는 뜻\n② 삭제 <2026.7.21>\n③ 일정한 조건의 성취나 기한의 도래에 따라 상환할 수 있는 경우에는 상환사채를 발행하는 회사는 조건이 성취되는 때 또는 기한이 도래하는 때까지 상환에 필요한 주식 또는 유가증권을 한국예탁결제원에 예탁하거나 전자등록기관에 전자등록해야 한다. 이 경우 한국예탁결제원 또는 전자등록기관은 그 주식 또는 유가증권을 신탁재산임을 표시하여 관리하여야 한다. <개정 2019.6.25>\n제23조(상환사채의 발행)","kind":"D"},{"id":"D:24","label":"영 제24조","title":"파생결합사채의 발행","chapter":"제3편 회사","deleted":false,"text":"1. 상환 또는 지급 금액을 결정하는 데 연계할 유가증권이나 통화 또는 그 밖의 자산이나 지표\n2. 제1호의 자산이나 지표와 연계하여 상환 또는 지급 금액을 결정하는 방법\n제24조(파생결합사채의 발행) 법 제469조제2항제3호에 따라 유가증권이나 통화 또는 그 밖에 제20조에 따른 자산이나 지표 등의 변동과 연계하여 미리 정하여진 방법에 따라 상환 또는 지급금액이 결정되는 사채(이하 \"파생결합사채\"라 한다)를 발행하는 경우에는 이사회가 다음 각 호의 사항을 결정한다.","kind":"D"},{"id":"D:25","label":"영 제25조","title":"사채청약서 등의 기재사항","chapter":"제3편 회사","deleted":false,"text":"1. 이익참가부사채를 발행하는 경우: 제21조제1항제1호부터 제3호까지의 사항\n2. 교환사채를 발행하는 경우: 제22조제1항제1호부터 제3호까지의 사항\n3. 상환사채를 발행하는 경우: 제23조제1항제1호부터 제3호까지의 사항\n4. 파생결합사채를 발행하는 경우: 제24조제1호 및 제2호의 사항\n제25조(사채청약서 등의 기재사항) 법 제469조제2항 각 호의 사채를 발행하는 경우 사채청약서, 채권 및 사채 원부에는 다음 각 호의 구분에 따른 사항이 포함되어야 한다.","kind":"D"},{"id":"D:26","label":"영 제26조","title":"사채관리회사의 자격","chapter":"제3편 회사","deleted":false,"text":"1. 「은행법」에 따른 은행\n2. 「한국산업은행법」에 따른 한국산업은행\n3. 「중소기업은행법」에 따른 중소기업은행\n4. 「농업협동조합법」에 따른 농협은행\n5. 「수산업협동조합법」에 따른 수협은행\n6. 「자본시장과 금융투자업에 관한 법률」에 따라 신탁업 인가를 받은 자로서 일반투자자로부터 금전을 위탁받을 수 있는 자\n7. 「자본시장과 금융투자업에 관한 법률」에 따라 투자매매업 인가를 받은 자로서 일반투자자를 상대로 증권의 인수업무를 할 수 있는 자\n8. 한국예탁결제원\n9. 「자본시장과 금융투자업에 관한 법률」에 따른 증권금융회사\n제26조(사채관리회사의 자격) 법 제480조의3제1항에서 \"은행, 신탁회사, 그 밖에 대통령령으로 정하는 자\"란 다음 각 호의 어느 하나에 해당하는 자를 말한다. <개정 2016.10.25>","kind":"D"},{"id":"D:27","label":"영 제27조","title":"사채발행회사와의 특수한 이해관계","chapter":"제3편 회사","deleted":false,"text":"1. 사채관리회사가 사채발행회사에 대하여 법 제542조의8제2항제5호에 따른 최대주주 또는 같은 항 제6호에 따른 주요주주인 경우\n2. 사채발행회사가 사채관리회사에 대하여 다음 각 목의 어느 하나에 해당하는 경우\n가. 사채관리회사가 제26조제1호의 은행인 경우: 「은행법」 제2조제1항제10호에 따른 대주주\n나. 사채관리회사가 제26조제6호 및 제7호의 자인 경우: 「자본시장과 금융투자업에 관한 법률」 제9조제1항에 따른 대주주\n3. 사채발행회사와 사채관리회사가 「독점규제 및 공정거래에 관한 법률」 제2조제12호에 따른 계열회사(이하 \"계열회사\"라 한다)인 경우\n4. 사채발행회사의 주식을 보유하거나 사채발행회사의 임원을 겸임하는 등으로 인하여 사채권자의 이익과 충돌하는 특수한 이해관계가 있어 공정한 사채관리를 하기 어려운 경우로서 법무부장관이 정하여 고시하는 기준에 해당하는 회사\n제27조(사채발행회사와의 특수한 이해관계) 법 제480조의3제3항에서 \"대통령령으로 정하는 자\"란 사채관리회사가 되려는 자가 다음 각 호의 어느 하나에 해당하는 경우 그 회사(사채관리회사가 된 후에 해당하게 된 자를 포함한다)를 말한다. <개정 2021.12.28>","kind":"D"},{"id":"D:28","label":"영 제28조","title":"휴면회사의 신고","chapter":"제3편 회사","deleted":false,"text":"① 법 제520조의2제1항에 따른 영업을 폐지하지 아니하였다는 뜻의 신고는 서면 또는 전자적 방법으로 한다. <개정 2026.7.21>\n② 서면으로 제1항의 신고를 할 때에는 다음 각 호의 사항을 적고, 회사의 대표자 또는 그 대리인이 기명날인하여야 한다. <개정 2026.7.21>\n1. 회사의 상호, 본점의 소재지, 대표자의 성명 및 주소\n2. 대리인이 제1항의 신고를 할 때에는 대리인의 성명 및 주소\n3. 아직 영업을 폐지하지 아니하였다는 뜻\n4. 법원의 표시\n5. 신고 연월일\n③ 대리인이 제1항의 신고를 하는 경우에는 그 권한을 증명하는 서면 또는 전자문서를 첨부해야 한다. <개정 2026.7.21>\n④ 제2항 또는 제3항의 서면에 찍을 회사 대표자의 인감은 「상업등기법」 제24조제1항에 따라 등기소에 제출된 것이어야 한다. 다만, 법 제520조의2제2항에 따라 법원으로부터 통지서를 받고 이를 첨부하여 신고하는 경우에는 그러하지 아니하다. <개정 2026.7.21>\n⑤ 전자적 방법으로 제1항의 신고를 할 때에는 제2항 각 호의 사항과 법 제520조의2제2항에 따라 법원으로부터 받은 통지서에 기재된 통지번호를 입력하고 회사의 대표자 또는 그 대리인이 전자서명을 해야 한다. <신설 2026.7.21>\n제28조(휴면회사의 신고)","kind":"D"},{"id":"D:29","label":"영 제29조","title":"상장회사 특례의 적용범위","chapter":"제3편 회사","deleted":false,"text":"① 법 제542조의2제1항 본문에서 \"대통령령으로 정하는 증권시장\"이란 「자본시장과 금융투자업에 관한 법률」 제8조의2제4항제1호에 따른 증권시장을 말한다. <개정 2013.8.27>\n② 법 제542조의2제1항 단서에서 \"대통령령으로 정하는 주식회사\"란 「자본시장과 금융투자업에 관한 법률」 제6조제5항에 따른 집합투자를 수행하기 위한 기구인 주식회사를 말한다.\n제29조(상장회사 특례의 적용범위)","kind":"D"},{"id":"D:30","label":"영 제30조","title":"주식매수선택권","chapter":"제3편 회사","deleted":false,"text":"① 법 제542조의3제1항 본문에서 \"대통령령으로 정하는 관계 회사\"란 다음 각 호의 어느 하나에 해당하는 법인을 말한다. 다만, 제1호 및 제2호의 법인은 주식매수선택권을 부여하는 회사의 수출실적에 영향을 미치는 생산 또는 판매 업무를 영위하거나 그 회사의 기술혁신을 위한 연구개발활동을 수행하는 경우로 한정한다.\n1. 해당 회사가 총출자액의 100분의 30 이상을 출자하고 최대출자자로 있는 외국법인\n2. 제1호의 외국법인이 총출자액의 100분의 30 이상을 출자하고 최대출자자로 있는 외국법인과 그 법인이 총출자액의 100분의 30 이상을 출자하고 최대출자자로 있는 외국법인\n3. 해당 회사가 「금융지주회사법」에서 정하는 금융지주회사인 경우 그 자회사 또는 손자회사 가운데 상장회사가 아닌 법인\n② 법 제542조의3제1항 단서에서 \"제542조의8제2항제5호의 최대주주 등 대통령령으로 정하는 자\"란 다음 각 호의 어느 하나에 해당하는 자를 말한다. 다만, 해당 회사 또는 제1항의 관계 회사의 임원이 됨으로써 특수관계인에 해당하게 된 자[그 임원이 계열회사의 상무(常務)에 종사하지 아니하는 이사ㆍ감사인 경우를 포함한다]는 제외한다.\n1. 법 제542조의8제2항제5호에 따른 최대주주 및 그 특수관계인\n2. 법 제542조의8제2항제6호에 따른 주요주주 및 그 특수관계인\n③ 법 제542조의3제2항에서 \"대통령령으로 정하는 한도\"란 발행주식총수의 100분의 15에 해당하는 주식 수를 말한다. 이 경우 이를 산정할 때에는 법 제542조의3제3항에 따라 부여한 주식매수선택권을 포함하여 계산한다.\n④ 법 제542조의3제3항 전단에서 \"대통령령으로 정하는 한도\"란 다음 각 호의 구분에 따른 주식 수를 말한다.\n1. 최근 사업연도 말 현재의 자본금이 3천억원 이상인 법인: 발행주식총수의 100분의 1에 해당하는 주식 수\n2. 최근 사업연도 말 현재의 자본금이 3천억원 미만인 법인: 발행주식총수의 100분의 3에 해당하는 주식 수\n⑤ 법 제542조의3제4항에서 \"대통령령으로 정하는 경우\"란 주식매수선택권을 부여받은 자가 사망하거나 그 밖에 본인의 책임이 아닌 사유로 퇴임하거나 퇴직한 경우를 말한다. 이 경우 정년에 따른 퇴임이나 퇴직은 본인의 책임이 아닌 사유에 포함되지 아니한다.\n⑥ 상장회사는 다음 각 호의 어느 하나에 해당하는 경우에는 정관에서 정하는 바에 따라 이사회 결의에 의하여 주식매수선택권의 부여를 취소할 수 있다.\n1. 주식매수선택권을 부여받은 자가 본인의 의사에 따라 사임하거나 사직한 경우\n2. 주식매수선택권을 부여받은 자가 고의 또는 과실로 회사에 중대한 손해를 입힌 경우\n3. 해당 회사의 파산 등으로 주식매수선택권 행사에 응할 수 없는 경우\n4. 그 밖에 주식매수선택권을 부여받은 자와 체결한 주식매수선택권 부여계약에서 정한 취소사유가 발생한 경우\n⑦ 주식매수선택권의 행사기한을 해당 이사ㆍ감사 또는 피용자의 퇴임일 또는 퇴직일로 정하는 경우 이들이 본인의 책임이 아닌 사유로 퇴임하거나 퇴직하였을 때에는 그 날부터 3개월 이상의 행사기간을 추가로 부여하여야 한다.\n제30조(주식매수선택권)","kind":"D"},{"id":"D:31","label":"영 제31조","title":"주주총회의 소집공고","chapter":"제3편 회사","deleted":false,"text":"① 법 제542조의4제1항에서 \"대통령령으로 정하는 수 이하의 주식\"이란 의결권 있는 발행주식총수의 100분의 1 이하의 주식을 말한다.\n② 상장회사는 「금융위원회의 설치 등에 관한 법률」 제24조에 따라 설립된 금융감독원 또는 「자본시장과 금융투자업에 관한 법률」 제373조의2에 따라 허가를 받은 거래소(이하 \"거래소\"라 한다)가 운용하는 전자공시시스템을 통하여 법 제542조의4제1항의 공고를 할 수 있다. <개정 2013.8.27>\n③ 법 제542조의4제2항에서 \"대통령령으로 정하는 후보자에 관한 사항\"이란 다음 각 호의 사항을 말한다. <개정 2020.1.29>\n1. 후보자와 최대주주와의 관계\n2. 후보자와 해당 회사와의 최근 3년간의 거래 내역\n3. 주주총회 개최일 기준 최근 5년 이내에 후보자가 「국세징수법」 또는 「지방세징수법」에 따른 체납처분을 받은 사실이 있는지 여부\n4. 주주총회 개최일 기준 최근 5년 이내에 후보자가 임원으로 재직한 기업이 「채무자 회생 및 파산에 관한 법률」에 따른 회생절차 또는 파산절차를 진행한 사실이 있는지 여부\n5. 법령에서 정한 취업제한 사유 등 이사ㆍ감사 결격 사유의 유무\n④ 법 제542조의4제3항 본문에서 \"독립이사 등의 활동내역과 보수에 관한 사항, 사업개요 등 대통령령으로 정하는 사항\"이란 다음 각 호의 사항을 말한다. <개정 2020.1.29, 2026.7.21>\n1. 법 제542조의8제1항의 독립이사(이하 \"독립이사\"라 한다), 그 밖에 해당 회사의 상무에 종사하지 아니하는 이사의 이사회 출석률, 이사회 의안에 대한 찬반 여부 등 활동내역과 보수에 관한 사항\n2. 법 제542조의9제3항 각 호에 따른 거래의 내역\n3. 영업 현황 등 사업개요와 주주총회의 목적사항별로 금융위원회가 정하는 방법에 따라 작성한 참고서류\n4. 「자본시장과 금융투자업에 관한 법률」 제159조에 따른 사업보고서 및 「주식회사 등의 외부감사에 관한 법률」 제23조제1항 본문에 따른 감사보고서. 이 경우 해당 보고서는 주주총회 개최 1주 전까지 전자문서로 발송하거나 회사의 홈페이지에 게재하는 것으로 갈음할 수 있다.\n⑤ 법 제542조의4제3항 단서에서 \"대통령령으로 정하는 방법\"이란 상장회사가 제4항 각 호에 따른 서류를 회사의 인터넷 홈페이지에 게재하고 다음 각 호의 장소에 갖추어 두어 일반인이 열람할 수 있도록 하는 방법을 말한다. <개정 2013.8.27>\n1. 상장회사의 본점 및 지점\n2. 명의개서대행회사\n3. 금융위원회\n4. 거래소\n제31조(주주총회의 소집공고)","kind":"D"},{"id":"D:32","label":"영 제32조","title":"소수주주권 행사요건 완화대상 회사","chapter":"제3편 회사","deleted":false,"text":"제32조(소수주주권 행사요건 완화대상 회사) 법 제542조의6제2항부터 제5항까지의 규정에서 \"대통령령으로 정하는 상장회사\"란 최근 사업연도 말 현재의 자본금이 1천억원 이상인 상장회사를 말한다.","kind":"D"},{"id":"D:33","label":"영 제33조","title":"집중투표에 관한 특례의 대상 회사","chapter":"제3편 회사","deleted":false,"text":"제33조(집중투표에 관한 특례의 대상 회사) 법 제542조의7제2항에서 \"대통령령으로 정하는 상장회사\"란 최근 사업연도 말 현재의 자산총액이 2조원 이상인 상장회사를 말한다.","kind":"D"},{"id":"D:34","label":"영 제34조","title":"상장회사의 독립이사 등","chapter":"제3편 회사","deleted":false,"text":"① 법 제542조의8제1항 본문에서 \"대통령령으로 정하는 경우\"란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2013.8.27, 2024.7.2, 2026.7.21>\n1. 「벤처기업육성에 관한 특별법」에 따른 벤처기업 중 최근 사업연도 말 현재의 자산총액이 1천억원 미만으로서 코스닥시장(대통령령 제24697호 자본시장과 금융투자업에 관한 법률 시행령 일부개정령 부칙 제8조에 따른 코스닥시장을 말한다. 이하 같다) 또는 코넥스시장(「자본시장과 금융투자업에 관한 법률 시행령」 제11조제2항에 따른 코넥스시장을 말한다. 이하 같다)에 상장된 주권을 발행한 벤처기업인 경우\n2. 「채무자 회생 및 파산에 관한 법률」에 따른 회생절차가 개시되었거나 파산선고를 받은 상장회사인 경우\n3. 유가증권시장(「자본시장과 금융투자업에 관한 법률 시행령」 제176조의9제1항에 따른 유가증권시장을 말한다. 이하 같다), 코스닥시장 또는 코넥스시장에 주권을 신규로 상장한 상장회사(신규상장 후 최초로 소집되는 정기주주총회 전날까지만 해당한다)인 경우. 다만, 유가증권시장에 상장된 주권을 발행한 회사로서 독립이사를 선임하여야 하는 회사가 코스닥시장 또는 코넥스시장에 상장된 주권을 발행한 회사로 되는 경우 또는 코스닥시장 또는 코넥스시장에 상장된 주권을 발행한 회사로서 독립이사를 선임하여야 하는 회사가 유가증권시장에 상장된 주권을 발행한 회사로 되는 경우에는 그러하지 아니하다.\n4. 「부동산투자회사법」에 따른 기업구조조정 부동산투자회사인 경우\n5. 해산을 결의한 상장회사인 경우\n② 법 제542조의8제1항 단서에서 \"대통령령으로 정하는 상장회사\"란 최근 사업연도 말 현재의 자산총액이 2조원 이상인 상장회사를 말한다.\n③ 법 제542조의8제2항제4호에서 \"대통령령으로 별도로 정하는 법률\"이란 다음 각 호의 금융 관련 법령(이에 상응하는 외국의 금융 관련 법령을 포함한다)을 말한다. <개정 2016.5.31, 2021.2.1, 2022.8.23>\n1. 「한국은행법」\n2. 「은행법」\n3. 「보험업법」\n4. 「자본시장과 금융투자업에 관한 법률」\n5. 「상호저축은행법」\n6. 「금융실명거래 및 비밀보장에 관한 법률」\n7. 「금융위원회의 설치 등에 관한 법률」\n8. 「예금자보호법」\n9. 「한국자산관리공사 설립 등에 관한 법률」\n10. 「여신전문금융업법」\n11. 「한국산업은행법」\n12. 「중소기업은행법」\n13. 「한국수출입은행법」\n14. 「신용협동조합법」\n15. 「신용보증기금법」\n16. 「기술보증기금법」\n17. 「새마을금고법」\n18. 「벤처투자 촉진에 관한 법률」\n19. 「신용정보의 이용 및 보호에 관한 법률」\n20. 「외국환거래법」\n21. 「외국인투자 촉진법」\n22. 「자산유동화에 관한 법률」\n23. 삭제<2021.2.1>\n24. 「금융산업의 구조개선에 관한 법률」\n25. 「담보부사채신탁법」\n26. 「금융지주회사법」\n27. 「기업구조조정투자회사법」\n28. 「한국주택금융공사법」\n④ 법 제542조의8제2항제5호에서 \"대통령령으로 정하는 특수한 관계에 있는 자\"란 다음 각 호의 어느 하나에 해당하는 자(이하 \"특수관계인\"이라 한다)를 말한다.\n1. 본인이 개인인 경우에는 다음 각 목의 어느 하나에 해당하는 사람\n가. 배우자(사실상의 혼인관계에 있는 사람을 포함한다)\n나. 6촌 이내의 혈족\n다. 4촌 이내의 인척\n라. 본인이 단독으로 또는 본인과 가목부터 다목까지의 관계에 있는 사람과 합하여 100분의 30 이상을 출자하거나 그 밖에 이사ㆍ집행임원ㆍ감사의 임면 등 법인 또는 단체의 주요 경영사항에 대하여 사실상 영향력을 행사하고 있는 경우에는 해당 법인 또는 단체와 그 이사ㆍ집행임원ㆍ감사\n마. 본인이 단독으로 또는 본인과 가목부터 라목까지의 관계에 있는 자와 합하여 100분의 30 이상을 출자하거나 그 밖에 이사ㆍ집행임원ㆍ감사의 임면 등 법인 또는 단체의 주요 경영사항에 대하여 사실상 영향력을 행사하고 있는 경우에는 해당 법인 또는 단체와 그 이사ㆍ집행임원ㆍ감사\n2. 본인이 법인 또는 단체인 경우에는 다음 각 목의 어느 하나에 해당하는 자\n가. 이사ㆍ집행임원ㆍ감사\n나. 계열회사 및 그 이사ㆍ집행임원ㆍ감사\n다. 단독으로 또는 제1호 각 목의 관계에 있는 자와 합하여 본인에게 100분의 30 이상을 출자하거나 그 밖에 이사ㆍ집행임원ㆍ감사의 임면 등 본인의 주요 경영사항에 대하여 사실상 영향력을 행사하고 있는 개인 및 그와 제1호 각 목의 관계에 있는 자 또는 단체(계열회사는 제외한다. 이하 이 호에서 같다)와 그 이사ㆍ집행임원ㆍ감사\n라. 본인이 단독으로 또는 본인과 가목부터 다목까지의 관계에 있는 자와 합하여 100분의 30 이상을 출자하거나 그 밖에 이사ㆍ집행임원ㆍ감사의 임면 등 단체의 주요 경영사항에 대하여 사실상 영향력을 행사하고 있는 경우 해당 단체와 그 이사ㆍ집행임원ㆍ감사\n⑤ 법 제542조의8제2항제7호에서 \"대통령령으로 정하는 자\"란 다음 각 호의 어느 하나에 해당하는 자를 말한다. <개정 2016.6.28, 2020.1.29, 2026.7.21>\n1. 해당 상장회사의 계열회사의 상무에 종사하는 이사ㆍ집행임원ㆍ감사 및 피용자이거나 최근 3년 이내에 계열회사의 상무에 종사하는 이사ㆍ집행임원ㆍ감사 및 피용자였던 자\n2. 다음 각 목의 법인 등의 이사ㆍ집행임원ㆍ감사 및 피용자[사목에 따른 법무법인, 법무법인(유한), 법무조합, 변호사 2명 이상이 사건의 수임ㆍ처리나 그 밖의 변호사 업무수행 시 통일된 형태를 갖추고 수익을 분배하거나 비용을 분담하는 형태로 운영되는 법률사무소, 합작법무법인, 외국법자문법률사무소의 경우에는 해당 법무법인 등에 소속된 변호사, 외국법자문사를 말한다]이거나 최근 2년 이내에 이사ㆍ집행임원ㆍ감사 및 피용자였던 자\n가. 최근 3개 사업연도 중 해당 상장회사와의 거래실적의 합계액이 자산총액(해당 상장회사의 최근 사업연도 말 현재의 대차대조표상의 자산총액을 말한다) 또는 매출총액(해당 상장회사의 최근 사업연도 말 현재의 손익계산서상의 매출총액을 말한다. 이하 이 조에서 같다)의 100분의 10 이상인 법인\n나. 최근 사업연도 중에 해당 상장회사와 매출총액의 100분의 10 이상의 금액에 상당하는 단일의 거래계약을 체결한 법인\n다. 최근 사업연도 중에 해당 상장회사가 금전, 유가증권, 그 밖의 증권 또는 증서를 대여하거나 차입한 금액과 담보제공 등 채무보증을 한 금액의 합계액이 자본금(해당 상장회사의 최근 사업연도 말 현재의 대차대조표상의 자본금을 말한다)의 100분의 10 이상인 법인\n라. 해당 상장회사의 정기주주총회일 현재 그 회사가 자본금(해당 상장회사가 출자한 법인의 자본금을 말한다)의 100분의 5 이상을 출자한 법인\n마. 해당 상장회사와 기술제휴계약을 체결하고 있는 법인\n바. 해당 상장회사의 감사인으로 선임된 회계법인\n사. 해당 상장회사와 주된 법률자문ㆍ경영자문 등의 자문계약을 체결하고 있는 법무법인, 법무법인(유한), 법무조합, 변호사 2명 이상이 사건의 수임ㆍ처리나 그 밖의 변호사 업무수행 시 통일된 형태를 갖추고 수익을 분배하거나 비용을 분담하는 형태로 운영되는 법률사무소, 합작법무법인, 외국법자문법률사무소, 회계법인, 세무법인, 그 밖에 자문용역을 제공하고 있는 법인\n3. 해당 상장회사 외의 2개 이상의 다른 회사의 이사ㆍ집행임원ㆍ감사로 재임 중인 자\n4. 해당 상장회사에 대한 회계감사 또는 세무대리를 하거나 그 상장회사와 법률자문ㆍ경영자문 등의 자문계약을 체결하고 있는 변호사(소속 외국법자문사를 포함한다), 공인회계사, 세무사, 그 밖에 자문용역을 제공하고 있는 자\n5. 해당 상장회사의 발행주식총수의 100분의 1 이상에 해당하는 주식을 보유(「자본시장과 금융투자업에 관한 법률」 제133조제3항에 따른 보유를 말한다)하고 있는 자\n6. 해당 상장회사와의 거래(「약관의 규제에 관한 법률」 제2조제1호의 약관에 따라 이루어지는 해당 상장회사와의 정형화된 거래는 제외한다) 잔액이 1억원 이상인 자\n7. 해당 상장회사에서 사외이사 또는 독립이사로 각각 재직한 기간을 더하면 6년을 초과하거나, 해당 상장회사에서 사외이사 또는 독립이사로 각각 재직한 기간과 해당 상장회사의 계열회사에서 사외이사 또는 독립이사로 각각 재직한 기간을 더하면 9년을 초과하는 자\n⑥ 제5항제2호에도 불구하고 다음 각 호의 어느 하나에 해당하는 법인인 기관투자자 및 이에 상당하는 외국금융회사는 제5항에 해당하는 자에서 제외한다. <개정 2016.5.31>\n1. 「은행법」에 따른 은행\n2. 「한국산업은행법」에 따른 한국산업은행\n3. 「중소기업은행법」에 따른 중소기업은행\n4. 「한국수출입은행법」에 따른 한국수출입은행\n5. 「농업협동조합법」에 따른 농업협동조합중앙회 및 농협은행\n6. 「수산업협동조합법」에 따른 수산업협동조합중앙회\n7. 「상호저축은행법」에 따른 상호저축은행중앙회 및 상호저축은행\n8. 「보험업법」에 따른 보험회사\n9. 「여신전문금융업법」에 따른 여신전문금융회사\n10. 「신용협동조합법」에 따른 신용협동조합중앙회\n11. 「산림조합법」에 따른 산림조합중앙회\n12. 「새마을금고법」에 따른 새마을금고중앙회\n13. 「한국주택금융공사법」에 따른 한국주택금융공사\n14. 「자본시장과 금융투자업에 관한 법률」에 따른 투자매매업자 및 투자중개업자\n15. 「자본시장과 금융투자업에 관한 법률」에 따른 종합금융회사\n16. 「자본시장과 금융투자업에 관한 법률」에 따른 집합투자업자\n17. 「자본시장과 금융투자업에 관한 법률」에 따른 증권금융회사\n18. 법률에 따라 설립된 기금을 관리ㆍ운용하는 법인으로서 다음 각 목의 법인\n가. 「공무원연금법」에 따른 공무원연금공단\n나. 「사립학교교직원 연금법」에 따른 사립학교교직원연금공단\n다. 「국민체육진흥법」에 따른 서울올림픽기념국민체육진흥공단\n라. 「신용보증기금법」에 따른 신용보증기금\n마. 「기술보증기금법」에 따른 기술보증기금\n바. 「무역보험법」에 따른 한국무역보험공사\n사. 「중소기업협동조합법」에 따른 중소기업중앙회\n아. 「문화예술진흥법」에 따른 한국문화예술위원회\n19. 법률에 따라 공제사업을 영위하는 법인으로서 다음 각 목의 법인\n가. 「한국교직원공제회법」에 따른 한국교직원공제회\n나. 「군인공제회법」에 따른 군인공제회\n다. 「건설산업기본법」에 따라 설립된 건설공제조합 및 전문건설공제조합\n라. 「전기공사공제조합법」에 따른 전기공사공제조합\n마. 「정보통신공사업법」에 따른 정보통신공제조합\n바. 「대한지방행정공제회법」에 따른 대한지방행정공제회\n사. 「과학기술인공제회법」에 따른 과학기술인공제회\n제34조(상장회사의 독립이사 등)","kind":"D"},{"id":"D:34-2","label":"영 제34조의2","title":"상장회사의 독립이사에 관한 등기","chapter":"제3편 회사","deleted":false,"text":"제34조의2(상장회사의 독립이사에 관한 등기) 상장회사가 법 제542조의8에 따라 독립이사를 선임하여 법 제317조제2항제8호의 사항을 등기하는 경우에는 그 명칭을 독립이사로 하여 등기한다.","kind":"D"},{"id":"D:35","label":"영 제35조","title":"주요주주 등 이해관계자와의 거래","chapter":"제3편 회사","deleted":false,"text":"① 법 제542조의9제1항 각 호 외의 부분에서 \"대통령령으로 정하는 거래\"란 다음 각 호의 어느 하나에 해당하는 거래를 말한다.\n1. 담보를 제공하는 거래\n2. 어음(「전자어음의 발행 및 유통에 관한 법률」에 따른 전자어음을 포함한다)을 배서(「어음법」 제15조제1항에 따른 담보적 효력이 없는 배서는 제외한다)하는 거래\n3. 출자의 이행을 약정하는 거래\n4. 법 제542조의9제1항 각 호의 자에 대한 신용공여의 제한(금전ㆍ증권 등 경제적 가치가 있는 재산의 대여, 채무이행의 보증, 자금 지원적 성격의 증권 매입, 제1호부터 제3호까지의 어느 하나에 해당하는 거래의 제한을 말한다)을 회피할 목적으로 하는 거래로서 「자본시장과 금융투자업에 관한 법률 시행령」 제38조제1항제4호 각 목의 어느 하나에 해당하는 거래\n5. 「자본시장과 금융투자업에 관한 법률 시행령」 제38조제1항제5호에 따른 거래\n② 법 제542조의9제2항제1호에서 \"대통령령으로 정하는 신용공여\"란 학자금, 주택자금 또는 의료비 등 복리후생을 위하여 회사가 정하는 바에 따라 3억원의 범위에서 금전을 대여하는 행위를 말한다.\n③ 법 제542조의9제2항제3호에서 \"대통령령으로 정하는 신용공여\"란 회사의 경영상 목적을 달성하기 위하여 필요한 경우로서 다음 각 호의 자를 상대로 하거나 그를 위하여 적법한 절차에 따라 이행하는 신용공여를 말한다.\n1. 법인인 주요주주\n2. 법인인 주요주주의 특수관계인 중 회사(자회사를 포함한다)의 출자지분과 해당 법인인 주요주주의 출자지분을 합한 것이 개인인 주요주주의 출자지분과 그의 특수관계인(해당 회사 및 자회사는 제외한다)의 출자지분을 합한 것보다 큰 법인\n3. 개인인 주요주주의 특수관계인 중 회사(자회사를 포함한다)의 출자지분과 제1호 및 제2호에 따른 법인의 출자지분을 합한 것이 개인인 주요주주의 출자지분과 그의 특수관계인(해당 회사 및 자회사는 제외한다)의 출자지분을 합한 것보다 큰 법인\n④ 법 제542조의9제3항 각 호 외의 부분에서 \"대통령령으로 정하는 상장회사\"란 최근 사업연도 말 현재의 자산총액이 2조원 이상인 상장회사를 말한다.\n⑤ 법 제542조의9제3항 각 호 외의 부분에서 \"대통령령으로 정하는 자\"란 제34조제4항의 특수관계인을 말한다.\n⑥ 법 제542조의9제3항제1호에서 \"대통령령으로 정하는 규모\"란 자산총액 또는 매출총액을 기준으로 다음 각 호의 구분에 따른 규모를 말한다.\n1. 제4항의 회사가 「금융위원회의 설치 등에 관한 법률」 제38조에 따른 검사 대상 기관인 경우: 해당 회사의 최근 사업연도 말 현재의 자산총액의 100분의 1\n2. 제4항의 회사가 「금융위원회의 설치 등에 관한 법률」 제38조에 따른 검사 대상 기관이 아닌 경우: 해당 회사의 최근 사업연도 말 현재의 자산총액 또는 매출총액의 100분의 1\n⑦ 법 제542조의9제3항제2호에서 \"대통령령으로 정하는 규모\"란 다음 각 호의 구분에 따른 규모를 말한다.\n1. 제4항의 회사가 「금융위원회의 설치 등에 관한 법률」 제38조에 따른 검사 대상 기관인 경우: 해당 회사의 최근 사업연도 말 현재의 자산총액의 100분의 5\n2. 제4항의 회사가 「금융위원회의 설치 등에 관한 법률」 제38조에 따른 검사 대상 기관이 아닌 경우: 해당 회사의 최근 사업연도 말 현재의 자산총액 또는 매출총액의 100분의 5\n⑧ 법 제542조의9제4항에서 \"대통령령으로 정하는 사항\"이란 다음 각 호의 사항을 말한다.\n1. 거래의 내용, 날짜, 기간 및 조건\n2. 해당 사업연도 중 거래상대방과의 거래유형별 총거래금액 및 거래잔액\n⑨ 법 제542조의9제5항제1호에서 \"대통령령으로 정하는 거래\"란 「약관의 규제에 관한 법률」 제2조제1호의 약관에 따라 이루어지는 거래를 말한다.\n제35조(주요주주 등 이해관계자와의 거래)","kind":"D"},{"id":"D:36","label":"영 제36조","title":"상근감사","chapter":"제3편 회사","deleted":false,"text":"① 법 제542조의10제1항 본문에서 \"대통령령으로 정하는 상장회사\"란 최근 사업연도 말 현재의 자산총액이 1천억원 이상인 상장회사를 말한다.\n② 법 제542조의10제2항제3호에서 \"대통령령으로 정하는 자\"란 다음 각 호의 어느 하나에 해당하는 자를 말한다.\n1. 해당 회사의 상무에 종사하는 이사ㆍ집행임원의 배우자 및 직계존속ㆍ비속\n2. 계열회사의 상무에 종사하는 이사ㆍ집행임원 및 피용자이거나 최근 2년 이내에 상무에 종사한 이사ㆍ집행임원 및 피용자\n제36조(상근감사)","kind":"D"},{"id":"D:37","label":"영 제37조","title":"감사위원회","chapter":"제3편 회사","deleted":false,"text":"① 법 제542조의11제1항에서 \"대통령령으로 정하는 상장회사\"란 최근 사업연도 말 현재의 자산총액이 2조원 이상인 상장회사를 말한다. 다만, 다음 각 호의 어느 하나에 해당하는 상장회사는 제외한다.\n1. 「부동산투자회사법」에 따른 부동산투자회사인 상장회사\n2. 「공공기관의 운영에 관한 법률」 및 「공기업의 경영구조 개선 및 민영화에 관한 법률」을 적용받는 상장회사\n3. 「채무자 회생 및 파산에 관한 법률」에 따른 회생절차가 개시된 상장회사\n4. 유가증권시장 또는 코스닥시장에 주권을 신규로 상장한 상장회사(신규상장 후 최초로 소집되는 정기주주총회 전날까지만 해당한다). 다만, 유가증권시장에 상장된 주권을 발행한 회사로서 감사위원회를 설치하여야 하는 회사가 코스닥시장에 상장된 주권을 발행한 회사로 되는 경우 또는 코스닥시장에 상장된 주권을 발행한 회사로서 감사위원회를 설치하여야 하는 회사가 유가증권시장에 상장된 주권을 발행한 회사로 되는 경우는 제외한다.\n② 법 제542조의11제2항제1호에서 \"대통령령으로 정하는 회계 또는 재무 전문가\"란 다음 각 호의 어느 하나에 해당하는 사람을 말한다. <개정 2012.2.29, 2020.4.14, 2022.8.9>\n1. 공인회계사의 자격을 가진 사람으로서 그 자격과 관련된 업무에 5년 이상 종사한 경력이 있는 사람\n2. 회계 또는 재무 분야에서 석사 이상의 학위를 취득한 사람으로서 연구기관 또는 대학에서 회계 또는 재무 관련 분야의 연구원이나 조교수 이상으로 근무한 경력(학위 취득 전의 경력을 포함한다)이 합산하여 5년 이상인 사람\n3. 상장회사에서 회계 또는 재무 관련 업무에 합산하여 임원으로 근무한 경력이 5년 이상 또는 임직원으로 근무한 경력이 10년 이상인 사람\n4. 「금융회사의 지배구조에 관한 법률 시행령」 제16조제1항제4호ㆍ제5호의 기관 또는 「한국은행법」에 따른 한국은행에서 회계 또는 재무 관련 업무나 이에 대한 감독 업무에 근무한 경력이 합산하여 5년 이상인 사람\n5. 「금융회사의 지배구조에 관한 법률 시행령」 제16조제1항제6호에 따라 금융위원회가 정하여 고시하는 자격을 갖춘 사람\n제37조(감사위원회)","kind":"D"},{"id":"D:38","label":"영 제38조","title":"감사 등 선임ㆍ해임 시의 의결권 제한","chapter":"제3편 회사","deleted":false,"text":"① 법 제542조의12제4항에서 \"대통령령으로 정하는 자\"란 다음 각 호의 어느 하나에 해당하는 자를 말한다. <개정 2021.2.1>\n1. 최대주주 또는 그 특수관계인의 계산으로 주식을 보유하는 자\n2. 최대주주 또는 그 특수관계인에게 의결권(의결권의 행사를 지시할 수 있는 권한을 포함한다)을 위임한 자(해당 위임분만 해당한다)\n② 삭제 <2026.7.21>\n제38조(감사 등 선임ㆍ해임 시의 의결권 제한)","kind":"D"},{"id":"D:39","label":"영 제39조","title":"준법통제기준 및 준법지원인 제도의 적용범위","chapter":"제3편 회사","deleted":false,"text":"제39조(준법통제기준 및 준법지원인 제도의 적용범위) 법 제542조의13제1항에서 \"대통령령으로 정하는 상장회사\"란 최근 사업연도 말 현재의 자산총액이 5천억원 이상인 회사를 말한다. 다만, 다른 법률에 따라 내부통제기준 및 준법감시인을 두어야 하는 상장회사는 제외한다.","kind":"D"},{"id":"D:40","label":"영 제40조","title":"준법통제기준 등","chapter":"제3편 회사","deleted":false,"text":"① 법 제542조의13제1항에 따른 준법통제기준(이하 \"준법통제기준\"이라 한다)에는 다음 각 호의 사항이 포함되어야 한다.\n1. 준법통제기준의 제정 및 변경의 절차에 관한 사항\n2. 법 제542조의13제2항에 따른 준법지원인(이하 \"준법지원인\"이라 한다)의 임면절차에 관한 사항\n3. 준법지원인의 독립적 직무수행의 보장에 관한 사항\n4. 임직원이 업무수행과정에서 준수해야 할 법규 및 법적 절차에 관한 사항\n5. 임직원에 대한 준법통제기준 교육에 관한 사항\n6. 임직원의 준법통제기준 준수 여부를 확인할 수 있는 절차 및 방법에 관한 사항\n7. 준법통제기준을 위반하여 업무를 집행한 임직원의 처리에 관한 사항\n8. 준법통제에 필요한 정보가 준법지원인에게 전달될 수 있도록 하는 방법에 관한 사항\n9. 준법통제기준의 유효성 평가에 관한 사항\n② 준법통제기준을 정하거나 변경하는 경우에는 이사회의 결의를 거쳐야 한다.\n제40조(준법통제기준 등)","kind":"D"},{"id":"D:41","label":"영 제41조","title":"준법지원인 자격요건 등","chapter":"제3편 회사","deleted":false,"text":"1. 상장회사에서 감사ㆍ감사위원ㆍ준법감시인 또는 이와 관련된 법무부서에서 근무한 경력이 합산하여 10년 이상인 사람\n2. 법률학 석사 이상의 학위를 취득한 사람으로서 상장회사에서 감사ㆍ감사위원ㆍ준법감시인 또는 이와 관련된 법무부서에서 근무한 경력(학위 취득 전의 경력을 포함한다)이 합산하여 5년 이상인 사람\n제41조(준법지원인 자격요건 등) 법 제542조의13제5항제3호에서 \"대통령령으로 정하는 사람\"이란 다음 각 호의 어느 하나에 해당하는 사람을 말한다. <개정 2022.8.9>","kind":"D"},{"id":"D:42","label":"영 제42조","title":"준법지원인의 영업 업무 제한","chapter":"제3편 회사","deleted":false,"text":"제42조(준법지원인의 영업 업무 제한) 준법지원인은 자신의 업무수행에 영향을 줄 수 있는 영업 관련 업무를 담당해서는 아니 된다.","kind":"D"},{"id":"D:42-2","label":"영 제42조의2","title":"전자주주총회를 개최해야 하는 상장회사","chapter":"제3편 회사","deleted":false,"text":"제42조의2(전자주주총회를 개최해야 하는 상장회사) 법 제542조의14제2항에서 \"대통령령으로 정하는 상장회사\"란 최근 사업연도 말 현재의 자산총액이 2조원 이상인 상장회사를 말한다.","kind":"D"},{"id":"D:42-3","label":"영 제42조의3","title":"전자주주총회의 개최요건","chapter":"제3편 회사","deleted":false,"text":"① 상장회사가 법 제542조의14제1항에 따른 전자주주총회(이하 \"전자주주총회\"라 한다)를 개최하려면 다음 각 호의 요건을 모두 갖추어야 한다. 다만, 법 제542조의15제2항에 따라 전자주주총회를 관리하는 기관을 지정하여 전자주주총회의 의사진행 및 결의에 참가하는 절차의 운영을 위탁한 경우에는 제2호 및 제3호의 요건을 갖추지 않아도 된다.\n1. 해당 상장회사가 전자주주총회의 소집 및 운영에 관한 직무를 수행할 때 따라야 하는 기준 및 절차\n2. 전자주주총회의 개최 및 운영에 필요한 인력\n3. 전산설비, 개인정보 보호 체계 등 전자주주총회의 개최 및 운영에 필요한 물적 설비\n② 제1항제1호의 기준 및 절차에 포함되어야 하는 사항 등 전자주주총회의 개최에 필요한 세부사항은 법무부장관이 정하여 고시한다.\n제42조의3(전자주주총회의 개최요건)","kind":"D"},{"id":"D:42-4","label":"영 제42조의4","title":"전자통신수단의 요건","chapter":"제3편 회사","deleted":false,"text":"제42조의4(전자통신수단의 요건) 법 제542조의14제3항에 따른 출석 방식에 사용되는 전자통신수단은 전자적 방식으로 상호 의사를 즉시 전달할 수 있어야 한다.","kind":"D"},{"id":"D:42-5","label":"영 제42조의5","title":"전자주주총회의 소집통지","chapter":"제3편 회사","deleted":false,"text":"1. 전자주주총회의 의사에 참여하는 방법\n2. 제42조의7제1항에 따른 전자주주총회 출석 신청의 방법과 절차\n3. 소집지에 직접 출석하는 경우 전자주주총회의 출석이 제한된다는 사실\n4. 대리인이 전자주주총회에 출석하거나 의사에 참여하려는 경우 대리권의 증명 등의 방법\n5. 상장회사가 제42조의7제2항에 따라 전자주주총회에 출석하거나 전자주주총회의 의사에 참여하려는 주주의 질의 및 발언의 횟수와 시간을 미리 정해 두는 방식으로 전자주주총회를 운영하려는 경우에는 주주의 질의 및 발언의 횟수와 시간을 정하는 구체적 기준과 내용\n6. 전자주주총회 출석과 전자주주총회의 의사 참여 등에 필요한 기술적인 사항\n제42조의5(전자주주총회의 소집통지) 법 제542조의14제5항에서 \"대통령령으로 정하는 사항\"이란 다음 각 호의 사항을 말한다.","kind":"D"},{"id":"D:42-6","label":"영 제42조의6","title":"전자주주총회를 관리하는 기관","chapter":"제3편 회사","deleted":false,"text":"1. 전자주주총회의 관리 업무 수행에 필요한 인력\n2. 전산설비, 개인정보 보호 체계 등 전자주주총회의 개최 및 운영에 필요한 물적 설비\n3. 정전ㆍ화재 등의 사고가 발생하는 경우 업무의 연속성을 유지하기 위하여 필요한 보완설비\n제42조의6(전자주주총회를 관리하는 기관) 법 제542조의15제2항에 따라 전자주주총회를 위탁받아 관리하는 기관이 갖추어야 하는 요건은 다음 각 호와 같다.","kind":"D"},{"id":"D:42-7","label":"영 제42조의7","title":"전자주주총회의 운영","chapter":"제3편 회사","deleted":false,"text":"① 상장회사는 해당 상장회사가 정한 방법으로 주주총회일 전날까지 전자주주총회의 출석을 신청한 주주에 대하여 전자주주총회 출석을 허용할 수 있다.\n② 상장회사는 전자주주총회를 적정하게 운영하기 위하여 전자주주총회에 출석하거나 전자주주총회의 의사에 참여하려는 주주의 질의 및 발언의 횟수와 시간을 미리 정할 수 있다.\n③ 상장회사가 전자주주총회를 개최하는 경우에는 법 제373조에 따른 의사록에 총회의 개최방식도 기재해야 한다.\n④ 전자주주총회의 출석 신청 방법, 상장회사가 주주의 질의ㆍ발언의 횟수ㆍ시간을 정하는 기준 등 전자주주총회의 운영에 필요한 세부사항은 법무부장관이 정하여 고시한다.\n제42조의7(전자주주총회의 운영)","kind":"D"},{"id":"D:42-8","label":"영 제42조의8","title":"전자주주총회 출석 방법","chapter":"제3편 회사","deleted":false,"text":"① 전자주주총회에 출석하려는 주주는 다음 각 호의 어느 하나에 해당하는 방법으로 주주 본인임을 확인해야 한다.\n1. 「전자서명법」 제8조제2항에 따른 운영기준 준수사실의 인정을 받은 전자서명인증사업자가 제공하는 본인확인의 방법\n2. 「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 제23조의3에 따른 본인확인기관에서 제공하는 본인확인의 방법\n② 제1항에도 불구하고 전자주주총회에 출석하려는 주주가 같은 항 각 호의 방법으로 주주 본인임을 확인하기 불가능한 경우에는 해당 주주는 사전에 상장회사로부터 제공받은 주주식별번호 및 암호를 입력하는 등 해당 상장회사가 주주의 본인 확인을 위하여 마련한 방법으로 주주 본인임을 확인할 수 있다.\n제42조의8(전자주주총회 출석 방법)","kind":"D"},{"id":"D:42-9","label":"영 제42조의9","title":"전자주주총회의 개최에 관한 기록의 보존","chapter":"제3편 회사","deleted":false,"text":"제42조의9(전자주주총회의 개최에 관한 기록의 보존) 상장회사는 법 제542조의15제4항에 따라 전자주주총회에서 주주에게 교부한 주주총회 관련 서류를 열람 가능한 형태로 보존해야 한다.","kind":"D"},{"id":"D:43","label":"영 제43조","title":"대차대조표에 상당하는 것의 범위","chapter":"제3편 회사","deleted":false,"text":"제43조(대차대조표에 상당하는 것의 범위) 법 제616조의2제1항에서 \"대통령령으로 정하는 것\"이란 복식부기의 원리에 의하여 해당 회사의 재무상태를 명확히 하기 위하여 회계연도 말 현재의 모든 자산ㆍ부채 및 자본의 현황을 표시한 서류로서 대차대조표에 상당하는 형식을 갖춘 것을 말한다.","kind":"D"},{"id":"D:44","label":"영 제44조","title":"과태료의 부과ㆍ징수 절차","chapter":"제3편 회사","deleted":false,"text":"① 법무부장관은 법 제637조의2에 따라 과태료를 부과할 때에는 해당 위반행위를 조사ㆍ확인한 후 위반사실, 과태료 금액, 이의제기방법, 이의제기기간 등을 구체적으로 밝혀 과태료를 낼 것을 과태료 처분 대상자에게 서면으로 통지하여야 한다.\n② 법무부장관은 제1항에 따라 과태료를 부과하려는 경우에는 10일 이상의 기간을 정하여 과태료 처분 대상자에게 말 또는 서면(전자문서를 포함한다)으로 의견을 진술할 기회를 주어야 한다. 이 경우 지정된 기일까지 의견을 진술하지 아니하면 의견이 없는 것으로 본다.\n③ 법무부장관은 과태료 금액을 정하는 경우 해당 위반행위의 동기와 그 결과, 위반기간 및 위반 정도 등을 고려하여야 한다.\n④ 과태료는 국고금 관리법령의 수입금 징수에 관한 절차에 따라 징수한다. 이 경우 납입고지서에는 이의제기방법 및 이의제기기간 등을 함께 적어야 한다.\n제44조(과태료의 부과ㆍ징수 절차)","kind":"D"},{"id":"D:44-2","label":"영 제44조의2","title":"타인의 생명보험","chapter":"제3편의2 보험","deleted":false,"text":"1. 전자문서에 보험금 지급사유, 보험금액, 보험계약자와 보험수익자의 신원, 보험기간이 적혀 있을 것\n2. 전자문서에 법 제731조제1항에 따른 전자서명(이하 \"전자서명\"이라 한다)을 하기 전에 전자서명을 할 사람을 직접 만나서 전자서명을 하는 사람이 보험계약에 동의하는 본인임을 확인하는 절차를 거쳐 작성될 것\n3. 전자문서에 전자서명을 한 후에 그 전자서명을 한 사람이 보험계약에 동의한 본인임을 확인할 수 있도록 지문정보를 이용하는 등 법무부장관이 고시하는 요건을 갖추어 작성될 것\n4. 전자문서 및 전자서명의 위조ㆍ변조 여부를 확인할 수 있을 것\n제44조의2(타인의 생명보험) 법 제731조제1항에 따른 본인 확인 및 위조ㆍ변조 방지에 대한 신뢰성을 갖춘 전자문서는 다음 각 호의 요건을 모두 갖춘 전자문서로 한다.","kind":"D"},{"id":"D:45","label":"영 제45조","title":"해상편 규정의 적용이 제외되는 선박의 범위","chapter":"제4편 해상","deleted":false,"text":"1. 군함, 경찰용 선박\n2. 어업지도선, 밀수감시선\n3. 그 밖에 영리행위에 사용되지 아니하는 선박으로서 비상용ㆍ인명구조용 선박 등 사실상 공용(公用)으로 사용되는 선박\n제45조(해상편 규정의 적용이 제외되는 선박의 범위) 법 제741조제1항 단서에서 \"대통령령으로 정하는 경우\"란 다음 각 호의 어느 하나에 해당하는 국유 또는 공유의 선박인 경우를 말한다.","kind":"D"},{"id":"D:46","label":"영 제46조","title":"연안항행구역의 범위","chapter":"제4편 해상","deleted":false,"text":"제46조(연안항행구역의 범위) 법 제872조제2항 단서에 따라 공동해손의 경우 분담 등에 특례가 인정되는 연안항행구역의 범위는 전남광주통합특별시 영광군 불갑천구 북안에서 같은 군 가음도, 신안군 재원도ㆍ비금도ㆍ신도, 진도군 가사도ㆍ진도, 완도군 보길도ㆍ자지도ㆍ청산도, 여수시 초도ㆍ소리도와 경상남도 거제시 거제도 및 부산광역시 영도를 거쳐 같은 광역시 승두말에 이르는 선 안의 해면으로 한다. <개정 2026.6.23>","kind":"D"},{"id":"D:47","label":"영 제47조","title":"초경량 비행장치의 범위","chapter":"제5편 항공운송","deleted":false,"text":"제47조(초경량 비행장치의 범위) 법 제896조 단서에서 \"대통령령으로 정하는 초경량 비행장치\"란 「항공안전법」 제2조제3호에 따른 초경량비행장치를 말한다. <개정 2017.3.29>","kind":"D"},{"id":"D:48","label":"영 제48조","title":"항공운송편 규정의 준용이 제외되는 항공기의 범위","chapter":"제5편 항공운송","deleted":false,"text":"1. 군용ㆍ경찰용ㆍ세관용 항공기\n2. 「항공안전법」 제2조제1호 각 목의 용도로 사용되는 항공기\n3. 그 밖에 영리행위에 사용되지 아니하는 항공기로서 비상용ㆍ인명구조용 항공기 등 사실상 공용(公用)으로 사용되는 항공기\n제48조(항공운송편 규정의 준용이 제외되는 항공기의 범위) 법 제897조 단서에서 \"대통령령으로 정하는 경우\"란 다음 각 호의 어느 하나에 해당하는 국유 또는 공유의 항공기인 경우를 말한다. <개정 2017.3.29>","kind":"D"},{"id":"D:49","label":"영 제49조","title":"항공기사고로 인한 선급금의 지급액 등","chapter":"제5편 항공운송","deleted":false,"text":"① 법 제906조제1항 전단에 따라 운송인이 지급하여야 하는 선급금은 다음 각 호의 구분에 따른 금액으로 한다.\n1. 여객이 사망한 경우: 1인당 1만6천계산단위의 금액\n2. 여객이 신체에 상해를 입은 경우: 1인당 8천계산단위의 금액 범위에서 진찰ㆍ검사, 약제ㆍ치료재료의 지급, 처치ㆍ수술 및 그 밖의 치료, 예방ㆍ재활, 입원, 간호, 이송 등 명칭에 상관없이 그 상해의 치료에 드는 비용 중 법 제906조제1항에 따른 손해배상청구권자(이하 이 조에서 \"손해배상청구권자\"라 한다) 또는 「민법」에 따라 부양할 의무가 있는 사람이 실제 부담한 금액\n② 법 제906조제1항 전단에 따라 손해배상청구권자가 선급금을 청구할 때에는 운송인에 대하여 선급금을 청구한다는 취지와 청구금액을 분명히 밝힌 서면 또는 전자문서에 다음 각 호의 서류를 첨부하여 청구하여야 한다.\n1. 가족관계등록부 또는 그 밖에 법률에 따른 권한이 있는 청구권자임을 증명할 수 있는 서류\n2. 여객이 신체에 상해를 입은 경우에는 그 상해의 치료에 드는 비용을 실제 부담하였음을 증명할 수 있는 서류\n제49조(항공기사고로 인한 선급금의 지급액 등)","kind":"D"},{"id":"X:민법","kind":"X","label":"민법","title":"","chapter":"","text":""},{"id":"X:어음법","kind":"X","label":"어음법","title":"","chapter":"","text":""},{"id":"X:고등교육법","kind":"X","label":"고등교육법","title":"","chapter":"","text":""},{"id":"X:선박법","kind":"X","label":"선박법","title":"","chapter":"","text":""},{"id":"X:전자문서 및 전자거래 기본법","kind":"X","label":"전자문서 및 전자거래 기본법","title":"","chapter":"","text":""},{"id":"X:선박안전법 시행령","kind":"X","label":"선박안전법 시행령","title":"","chapter":"","text":""},{"id":"X:자본시장과 금융투자업에 관한 법률","kind":"X","label":"자본시장과 금융투자업에 관한 법률","title":"","chapter":"","text":""},{"id":"X:전자서명법","kind":"X","label":"전자서명법","title":"","chapter":"","text":""},{"id":"X:정보통신망 이용촉진 및 정보보호 등에 관한 법률","kind":"X","label":"정보통신망 이용촉진 및 정보보호 등에 관한 법률","title":"","chapter":"","text":""},{"id":"X:주식회사 등의 외부감사에 관한 법률","kind":"X","label":"주식회사 등의 외부감사에 관한 법률","title":"","chapter":"","text":""},{"id":"X:공공기관의 운영에 관한 법률","kind":"X","label":"공공기관의 운영에 관한 법률","title":"","chapter":"","text":""},{"id":"X:보험업법","kind":"X","label":"보험업법","title":"","chapter":"","text":""},{"id":"X:주식ㆍ사채 등의 전자등록에 관한 법률","kind":"X","label":"주식ㆍ사채 등의 전자등록에 관한 법률","title":"","chapter":"","text":""},{"id":"X:은행법","kind":"X","label":"은행법","title":"","chapter":"","text":""},{"id":"X:독점규제 및 공정거래에 관한 법률","kind":"X","label":"독점규제 및 공정거래에 관한 법률","title":"","chapter":"","text":""},{"id":"X:상업등기법","kind":"X","label":"상업등기법","title":"","chapter":"","text":""},{"id":"X:금융위원회의 설치 등에 관한 법률","kind":"X","label":"금융위원회의 설치 등에 관한 법률","title":"","chapter":"","text":""},{"id":"X:자본시장과 금융투자업에 관한 법률 시행령","kind":"X","label":"자본시장과 금융투자업에 관한 법률 시행령","title":"","chapter":"","text":""},{"id":"X:약관의 규제에 관한 법률","kind":"X","label":"약관의 규제에 관한 법률","title":"","chapter":"","text":""},{"id":"X:금융회사의 지배구조에 관한 법률 시행령","kind":"X","label":"금융회사의 지배구조에 관한 법률 시행령","title":"","chapter":"","text":""},{"id":"X:항공안전법","kind":"X","label":"항공안전법","title":"","chapter":"","text":""},{"id":"P:624907","kind":"P","label":"2024다208865","title":"임대료청구의소","court":"대법원","date":"2026.08.13","caseType":"민사","basis":"참조조문","text":"[1] 상법 제724조 제2항에 따라 피해자가 보험자에 대하여 갖는 직접청구권의 법적 성질 및 법원이 보험자가 피해자에게 보상하여야 할 손해액을 산정할 때 자동차종합보험약관의 지급기준에 구속되는지 여부 [2] 교통사고 피해자가 사고로 인한 손괴로 수리 등에 필요한 일정한 기간 동안 자동차를 사용하지 못하게 되었다는 이유로 그 기간 동안 동종ㆍ동급의 다른 자동차를 대차한 비용을 가해자나 보험사업자에 대하여 손해배상금이나 보험금으로 청구하는 경우, 그 청구를 인용하기 위한 요건 및 이때 대차비용을 산정하는 방법 / 대차의 필요성과 대차비용 액수의 상당성에 관한 주장ㆍ증명책임의 소재 [3] 자동차대여업을 영업으로 하는 甲 주식회사가 교통사고의 피해차량 소유자들에게 자동차를 대여해 주었고, 교통사고 피해차량은 1건을 제외하면 모두 수입자동차이고 대여자동차는 모두 수입자동차였는데, 가해차량에 관하여 자동차보험계약을 체결한 乙 보험회사 등이 금융감독원의 구 보험업감독업무시행세칙에서 정한 자동차보험 표준약관에 따라 피해차량과 배기량, 연식이 유사한 대여자동차 중 최저요금의 국산자동차를 빌리는 데 소요되는 통상의 요금을 산정하여 甲 회사에 지급하자, 甲 회사가 乙 회사 등을 상대로 피해차량의 소유자들로부터 양수한 乙 회사 등에 대한 대차료 관련 손해배상청구권의 금액에서 乙 회사 등으로부터 실제로 지급받은 금액을 공제한 차액의 지급을 구한 사안에서,","url":"https://www.law.go.kr/precInfoP.do?precSeq=624907"},{"id":"P:624501","kind":"P","label":"2026다200535","title":"보험금","court":"대법원","date":"2026.08.12","caseType":"민사","basis":"참조조문","text":"[1] 보험계약의 주계약 또는 특약에 기한 보험금 중 어느 하나만을 재판상 청구한 경우, 이로써 그와 동일한 기본적 법률관계를 기초로 발생한 다른 보험금 청구권에 대하여도 권리 위에 잠자는 것이 아님을 표명한 것으로 볼 수 있다면 다른 보험금 청구권의 소멸시효 역시 중단되는지 여부 및 이때 주계약 또는 특약에 기한 보험금의 재판상 청구에 따른 시효중단 효력이 다른 보험금 청구권에까지 미치는지 판단하는 기준 [2] 甲 보험회사와 중증자동차사고부상담보를 주계약으로 하고 자동차사고부상담보를 특약으로 하는 운전자보험계약을 체결한 乙이 甲 회사에 대하여 교통사고로 1급의 상해를 입었다고 주장하며 주계약에 따른 중증자동차사고부상담보 보험금의 지급을 구하는 소를 제기하였는데, 사고 발생일로부터 상법 제662조의 소멸시효기간 3년이 경과한 후 원심법원에 특약에 따른 자동차사고부상담보 보험금의 지급을 추가로 구하는 청구취지 및 청구원인 변경신청서를 제출한 사안에서, 제반 사정에 비추어 중증자동차사고부상담보 보험금을 청구하는 乙의 소제기는 특약에 따른 자동차사고부상담보 보험금 청구권에 대한 소멸시효를 중단시키는 재판상 청구에 해당하고, 이로써 자동차사고부상담보 보험금 청구권의 소멸시효는 중단되었다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=624501"},{"id":"P:624503","kind":"P","label":"2023다282927","title":"보험금","court":"대법원","date":"2026.08.12","caseType":"민사","basis":"참조조문","text":"[1] 약관을 공정하고 합리적으로 해석하기 위해 고려해야 할 사항 [2] 甲 보험회사가 乙 지방자치단체와 실손의료비 특별약관이 포함된 공무원단체상해보험계약을 체결한 후, 乙 지방자치단체 소속 공무원인 丙이 교통사고를 당하여 가해차량의 보험자인 丁 보험회사로부터 향후치료비 등이 포함된 보험금을 합의금으로 지급받았는데, 위 사고와 관련하여 丙에게 공무상요양비를 지급하던 공무원연금공단이 위 보험금의 지급을 이유로 丙에게 공무상요양비 중 향후치료비 상당액의 반환을 청구하자, 丙이 공무원연금공단에 이를 반환한 후 甲 회사를 상대로 위 반환액에 관하여 실손의료보험금의 지급을 구한 사안에서, 丙이 丁 회사로부터 향후치료비가 포함된 보험금을 지급받았다는 이유로 그 향후치료비 상당의 공무상요양비를 공무원연금공단에 반환하였다고 하더라도 이를 피보험자인 丙이 실제로 부담하는 부분이라거나 위 보험계약에서 보상하기로 한 손해라고 볼 수 없는데도, 이와 달리 보아 甲 회사에 보험금 지급의무가 있다고 한 원심판단에 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=624503"},{"id":"P:624239","kind":"P","label":"2026다202091","title":"이사말소회복등기청구","court":"대법원","date":"2026.07.16","caseType":"민사","basis":"참조조문","text":"상법 제394조 제1항에서 이사와 주식회사 사이의 소에 관하여 감사로 하여금 회사를 대표하도록 규정한 취지 및 상법 제386조 제1항에 따른 퇴임이사가 회사에 대하여 또는 회사가 위와 같은 퇴임이사에 대하여 소를 제기하는 경우에도 상법 제394조 제1항에 따라 감사가 회사를 대표하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=624239"},{"id":"P:622977","kind":"P","label":"2025두35727","title":"양도소득세부과처분취소","court":"대법원","date":"2026.06.24","caseType":"세무","basis":"판례내용","text":"[1] 법해석의 방법과 한계 [2] 구 조세특례제한법 시행령 제28조 제1항 제2호 중 괄호 부분의 ‘충당금을 포함한 부채의 합계액’은 중소기업 간의 통합으로 소멸되는 사업장의 사업과 직접 관련된 부채로 한정되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=622977"},{"id":"P:622929","kind":"P","label":"2024두34641","title":"법인세부과처분및소득금액변동통지처분취소","court":"대법원","date":"2026.06.24","caseType":"세무","basis":"참조조문","text":"[1] 상법 제342조의2 제1항을 위반하여 자회사가 모회사의 주식을 취득하는 것이 당연히 무효인지 여부 및 위 규정은 이미 모자회사 관계가 형성되어 있는 회사들 사이에서만 적용되는지 여부 / 특정 회사의 모회사로 될 다른 회사 주식의 취득과 다른 회사의 특정 회사 주식 취득에 의한 모자회사 관계 형성이 동시에 이루어진 경우, 위 규정이 적용되는지 여부 [2] 부당행위계산의 유형을 정하고 있는 구 법인세법 시행령 제88조 제1항 제2호의 ‘무수익 자산’의 의미","url":"https://www.law.go.kr/precInfoP.do?precSeq=622929"},{"id":"P:621899","kind":"P","label":"2025다220815","title":"구상금[화재손해보험 중복보험자의 보험자대위에 의한 청구권 범위가 문제 된 사건]","court":"대법원","date":"2026.05.14","caseType":"민사","basis":"참조조문","text":"건물 등을 보험목적으로 하는 복수의 보험이 중복보험의 관계에 있는 경우, 건물에 화재가 발생하여 어느 한 화재보험의 보험자가 피보험자에게 보험금을 지급하였다면, 위 보험자가 다른 화재보험의 보험자로부터 중복보험 분담금을 지급받았다고 하더라도 가해자에 대하여 보험자대위에 의한 청구권을 행사할 수 있는지 여부 및 그 범위 / 위와 같은 법리는 처음부터 보험자와 중복보험자가 각 중복보험 비율에 따른 보험금만을 지급한 경우에도 마찬가지로 적용될 수 있는지 여부 및 이 경우 보험자대위에 의한 청구권 범위 / 이는 위 보험자가 가해자의 손해배상책임을 보상하는 책임보험자에 대하여 상법 제724조 제2항에 따른 책임보험 직접청구권을 대위행사할 때에도 마찬가지인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=621899"},{"id":"P:621989","kind":"P","label":"2024다321829","title":"주주총회결의무효부존재확인등의소[해임된 이사들이 해임된 이사 내지 주주로서 자신들을 해임한 주주총회결의의 부존재 내지 무효 확인을 구하는 사건]","court":"대법원","date":"2026.05.08","caseType":"민사","basis":"참조조문","text":"[1] 주주총회결의 부존재 확인의 소의 원고적격 / 확인의 소에서 ‘확인의 이익’이 인정되기 위한 요건 및 확인의 이익 유무가 직권조사사항인지 여부 [2] 회사성립 후 또는 신주의 납입기간 후 6월이 지나도록 주권이 발행되지 않아 주권 없이 채권담보를 목적으로 주식양도계약이 체결된 경우, 양도담보권자가 대외적으로 주식을 보유하게 되는지 여부 / 주식을 취득한 자가 주주명부에 명의개서를 하지 아니한 경우, 회사에 대하여 주주의 권리를 행사할 수 있는지 여부 및 이는 채무담보 목적으로 주식을 양수한 경우에도 마찬가지인지 여부 [3] 명의개서에 따른 주주명부의 기재가 적법하다고 볼 수 없는 경우, 명의개서 직전에 적법하게 작성된 주주명부가 존재한다면 그 주주명부상 주주가 회사에 대한 관계에서 주주권을 행사할 수 있는지 여부 [4] 甲 주식회사의 주권 미발행 주식을 1/2씩 보유하고 있던 乙과 丙 주식회사가 甲 회사의 채무를 담보하기 위하여 보유하고 있던 주식 전부를 丁에게 양도하는 내용의 주식양수도계약을 체결한 후 甲 회사의 유일한 이사인 乙이 사망하였고, 乙의 사망 전에 작성된 甲 회사의 주주명부에는 乙과 丙 회사가 주주로 기재되어 있었는데, 그 후 丁 등이 새로운 이사를 선임하는 내용의 주주전원 서면결의를 하였고, 곧이어 丙 회사 및 乙의 자녀인 戊 등이 己 등을 이사로 선임한 후 己에게 신주를 발행하는 내용의 주주전원 서면결의 등을 ","url":"https://www.law.go.kr/precInfoP.do?precSeq=621989"},{"id":"P:619461","kind":"P","label":"2025다220126","title":"보험금","court":"대법원","date":"2026.04.16","caseType":"민사","basis":"참조조문","text":"[1] 보험계약자인 가압류 신청인 등의 부당신청으로 인하여 피보험자인 피신청인 등이 손해배상청구권에 관한 집행권원을 받은 경우 그 변제를 보험자가 보증하는 보증보험계약에서, 피보험자가 보증보험계약의 보험약관에서 정한 집행권원을 갖추지 못하였다고 하더라도 보증보험자의 책임에 관한 상법 제726조의5의 규정을 근거로 보험자가 피보험자에게 보증보험계약상 보험금을 지급할 책임이 있는지 여부 및 위와 같은 법리는 보험계약자가 파산절차에서 면책결정을 받았다는 이유로 피보험자의 보험계약자를 상대로 한 손해배상채무의 이행을 구하는 소가 권리보호의 이익이 없어 부적법한 경우에도 마찬가지인지 여부 [2] 보증보험계약의 보험계약자 면책에도 불구하고 보험자를 상대로 보증보험금을 청구할 권리를 가진 피보험자가 보험계약자를 상대로 구체적인 금액의 손해배상채권의 존재를 확인하는 확정판결 또는 그와 동일한 효력이 있는 집행권원을 취득할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=619461"},{"id":"P:619429","kind":"P","label":"2025다211106","title":"구상금","court":"대법원","date":"2026.04.09","caseType":"민사","basis":"참조조문","text":"[1] 공동불법행위로 인한 구상금청구사건에서 공동불법행위자 사이의 과실비율을 정하는 것이 사실심의 전권사항인지 여부 [2] 공동불법행위자 중 1인과 보험계약을 체결한 보험자가 피해자에게 손해배상금을 보험금으로 모두 지급하여 공동불법행위자들의 보험자들이 공동면책된 경우, 손해배상금을 지급한 보험자가 다른 공동불법행위자들의 보험자들이 부담하여야 할 부분에 대하여 직접 구상권을 행사할 수 있는지 여부 [3] 구 자동차손해배상 보장법 제29조 제1항 각 호에서 정한 사유로 사고를 일으킨 피보험자가 자신의 보험자인 보험회사에 지급해야 하는 ‘사고부담금’과 관련하여, 다른 공동불법행위자의 보험자가 피보험자의 보험회사에 어떠한 권리를 주장하거나 정산을 요구할 수 있는지 여부 [4] 甲이 술에 취한 상태에서 차량을 운전하다가 5차로에서 2차로로 진로를 변경하던 乙의 차량을 충돌한 후 丙이 운전하던 이륜차량을 충돌하여 丙이 사망하였고, 甲의 보험자인 丁 보험회사가 丙의 상속인들에게 손해배상금을 보험금으로 지급한 후 乙의 보험자인 戊 보험회사를 상대로 乙의 과실비율에 따른 구상금의 지급을 구한 사안에서, 丁 회사는 戊 회사에 대하여 손해배상금 중 乙의 과실비율에 해당하는 부분을 구상할 수 있고, 戊 회사가 丁 회사에 지급할 구상금에서 丁 회사가 甲으로부터 지급받았거나 지급받을 사고부담금 상당액을 공제할 것은 아니라고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=619429"},{"id":"P:618669","kind":"P","label":"2025마6793","title":"의결권행사허용가처분[상법 제369조 제3항에 따른 상호주 의결권 제한이 문제 된 사건]","court":"대법원","date":"2026.04.02","caseType":"민사","basis":"참조조문","text":"[1] 상법 제369조 제3항에서 정한 ‘회사, 모회사 및 자회사 또는 자회사가 다른 회사의 발행주식총수의 10분의 1을 초과하는 주식을 가지고 있는 경우’에 해당하는지 판단하는 기준 시점 및 이때 회사 또는 모회사의 주주로서 의결권을 행사할 자가 확정되는 시점 [2] 상법 제369조 제3항의 ‘자회사’가 국내회사에 한정되는지 여부 및 외국회사가 상법 제369조 제3항의 ‘자회사’에 해당하기 위해서는 우리 상법의 주식회사와 동종 또는 가장 유사한 회사일 것을 요하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=618669"},{"id":"P:618705","kind":"P","label":"2025다219931","title":"회사에관한소송[이사 보수에 관한 주주총회 결의 시에 주주 겸 이사인 자가 상법 제368조 제3항의 특별이해관계인으로서 의결권이 제한되는지 여부가 문제 된 사건]","court":"대법원","date":"2026.04.02","caseType":"민사","basis":"참조조문","text":"상법 제388조에 따라 주주총회에서 이사의 보수에 관하여 결의하는 경우, 주주인 동시에 이사인 자가 의결권을 행사할 수 있는지 여부 및 이때 특별이해관계 있는 주주가 가진 주식의 의결권 수가 상법 제368조 제1항의 정족수 계산의 기초가 되는 ‘발행주식의 총수’에 산입되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=618705"},{"id":"P:616249","kind":"P","label":"2022다287284","title":"손해배상(기)","court":"대법원","date":"2026.01.29","caseType":"민사","basis":"참조조문","text":"[1] 상법 제682조 제1항에서 정한 보험자대위권의 규정 취지 / 이는 자기부담금 약정이 있는 자기차량손해보험 보험자의 보험자대위 범위 및 피보험자의 손해배상청구권의 범위를 확정할 때에도 고려되어야 하는지 여부 [2] 상법 제682조 제1항에 따라 보험자가 대위할 수 있는 피보험자의 제3자에 대한 권리의 범위는 보험약관 등에서 정함에 따라야 하는지 여부 및 보험약관 등에 정함이 없으면 고객에게 유리하게 해석하여야 하는지 여부 [3] 보험약관의 해석에서 객관적ㆍ획일적 해석의 원칙 [4] 자기차량손해보험 피보험자와 제3자의 과실이 경합한 교통사고로 자기차량손해가 발생하여 피보험자에게 손해액에서 자기부담금을 공제한 자기차량손해보험금을 ‘선처리 방식’으로 전부 지급한 보험자가 피보험자의 제3자에 대한 손해배상청구권을 대위하는 경우, 대위의 범위 및 이때 피보험자가 자기부담금 중 제3자의 책임비율에 상응하는 금액을 제3자에게 별도로 청구할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=616249"},{"id":"P:616497","kind":"P","label":"2024다203655","title":"구상금","court":"대법원","date":"2026.01.29","caseType":"민사","basis":"참조조문","text":"[1] 학교안전공제회가 수급권자에게 공제급여를 지급한 경우, 그 한도 내에서 수급권자가 학교안전사고를 일으킨 자 등에 대하여 가지는 손해배상청구권을 대위취득하는지 여부 및 이때 학교안전공제회가 취득하는 수급권자의 학교안전사고를 일으킨 자 등에 대한 손해배상청구권의 소멸시효 기산점과 기간은 그 손해배상청구권 자체를 기준으로 판단하여야 하는지 여부 [2] 고등학생인 甲이 교실에서 손가락으로 돌리던 책이 왼쪽 앞자리에 앉아 있던 乙을 향하여 날아갔고 그 책에 乙이 맞아 상해를 입는 사고가 발생하였는데, 乙이 甲과 丙 학교안전공제회를 상대로 손해배상청구의 소를 제기하여 甲의 불법행위로 인한 손해배상책임과 丙 공제회의 공제급여지급책임을 인정하는 판결이 선고ㆍ확정되었고, 이에 丙 공제회가 乙에게 위 판결에 따른 공제급여와 소송비용액확정결정에 따른 소송비용을 지급한 후 甲을 피보험자로 하는 책임보험의 보험자인 丁 보험회사를 상대로 乙에게 지급한 공제급여와 소송비용액의 지급을 구한 사안에서, 丙 공제회는 학교안전사고 예방 및 보상에 관한 법률 제44조 제1항에 따라 乙이 丁 회사에 대하여 가지는 상법 제724조 제2항의 보험금직접청구권을 대위취득하고, 그 청구권은 민법 제766조 제1항에 따라 乙 또는 그의 법정대리인이 손해 및 가해자를 안 날로부터 3년간 이를 행사하지 않으면 시효로 인하여 소멸하며, 또한 丁 회사는 乙의 보험금직접청구권을 대위취","url":"https://www.law.go.kr/precInfoP.do?precSeq=616497"},{"id":"P:624559","kind":"P","label":"2025나5766","title":"이사말소회복등기청구","court":"부산고등법원","date":"2026.01.28","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=624559"},{"id":"P:616499","kind":"P","label":"2022다214040","title":"구상금","court":"대법원","date":"2026.01.22","caseType":"민사","basis":"참조조문","text":"산업재해보상보험법 제87조 제1항 본문에서 정한 ‘제3자’에 해당하는지 판단하는 기준 및 건설공사의 원수급인 등이 건설기계를 임차함과 아울러 임대인 또는 그 근로자로부터 건설기계의 운전노무까지 제공받기로 하는 계약을 체결하고, 그에 따라 건설기계 임대인 등이 건설현장에서 건설기계를 운행하던 중 원수급인 등의 근로자에게 업무상 재해를 입힌 경우, 건설기계 임대인 등이 산업재해보상보험법 제87조 제1항 본문의 ‘제3자’에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=616499"},{"id":"P:615951","kind":"P","label":"2025다210092","title":"근저당권말소·손해배상청구의소","court":"대법원","date":"2026.01.08","caseType":"민사","basis":"참조조문","text":"[1] 신의성실의 원칙의 의미 및 이에 위배된다는 이유로 권리의 행사를 부정하기 위한 요건 / 강행법규를 위반한 자가 스스로 약정의 무효를 주장하는 것이 권리남용에 해당되거나 신의성실의 원칙에 반하는지 여부 [2] 주주총회의 특별결의 없이 이루어진 영업양도의 약정은 상대방의 선의나 악의 여부를 불문하고 무효인지 여부 및 주식회사가 영업의 전부 또는 중요한 일부를 양도한 후 주주총회의 특별결의가 없었다는 이유를 들어 스스로 약정의 무효를 주장하는 것이 신의성실의 원칙에 반하는지 여부 [3] 甲 주식회사가 주주인 乙, 丙과 甲 회사 소유의 부동산 매매계약을 체결한 후 위 부동산의 1/2 지분에 관해서만 乙 명의의 지분소유권이전등기가 마쳐졌고, 그 후 위 부동산에 관하여 채무자를 乙로 하는 丁 은행 등 명의의 근저당권설정등기가 마쳐졌는데, 甲 회사가 위 매매계약은 영업의 중요한 일부 양도로서 주주총회의 특별결의가 없었으므로 무효라고 주장하며 丁 은행 등을 상대로 근저당권설정등기의 말소를 구한 사안에서, 위 매매계약은 강행법규인 상법 제374조 제1항 제1호에 위반되어 무효이고 이는 매매계약 상대방인 乙, 丙의 선의나 악의 여부를 불문하고 마찬가지이며, 甲 회사가 丁 은행 등을 상대로 원인무효인 지분소유권이전등기에 터 잡아 마쳐진 근저당권설정등기의 말소를 구하는 것이 신의성실의 원칙에 반한다고 단정할 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=615951"},{"id":"P:624935","kind":"P","label":"2025나301710","title":"보험금","court":"대구지방법원","date":"2025.12.18","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=624935"},{"id":"P:614387","kind":"P","label":"2025다214605","title":"퇴직금등청구의소","court":"대법원","date":"2025.12.11","caseType":"민사","basis":"참조조문","text":"[1] 상법 제388조가 강행규정인지 여부 및 주식회사의 정관에서 이사의 보수에 관하여 주주총회의 결의로 정한다고 규정한 경우, 주주총회의 결의 없이 이사가 보수청구권을 행사할 수 있는지 여부 [2] 정관 또는 주주총회에서 이사의 보수에 관한 사항을 이사회에 포괄적으로 위임하는 것이 허용되는지 여부 및 개별 이사의 보수 분배에 관하여 대표이사가 결정하도록 정관에서 규정하거나 위와 같은 내용을 주주총회에서 대표이사에게 직접 위임하는 것이 허용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=614387"},{"id":"P:614049","kind":"P","label":"2025다216025","title":"손해배상(기)","court":"대법원","date":"2025.12.11","caseType":"민사","basis":"참조조문","text":"[1] 상법 제401조의2 제1항의 규정 취지 [2] 상법 제401조의2 제1항에서 정한 업무집행지시자 등의 손해배상책임에 민법 제766조 제1항의 단기소멸시효가 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=614049"},{"id":"P:622953","kind":"P","label":"2024나2034109","title":"배당이의","court":"서울고등법원","date":"2025.12.03","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=622953"},{"id":"P:622291","kind":"P","label":"2025나7043","title":"구상금","court":"서울중앙지방법원","date":"2025.12.03","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=622291"},{"id":"P:613151","kind":"P","label":"2025구합54763","title":"징계결정취소·징계결정취소·징계결정취소·징계결정취소·징계결정취소·징계결정취소·징계결정취소","court":"서울행정법원","date":"2025.11.27","caseType":"일반행정","basis":"참조조문","text":"甲 법무법인이 ‘전관 출신, 전관 변호사단, 전관예우 변호사’ 등의 표현을 사용하고 무료법률상담이 가능하다는 내용과 함께 형량예측이 가능하다는 취지로 광고하여 구 변호사 광고에 관한 규정을 위반하였다는 이유로 법무부 변호사징계위원회가 대표변호사 乙 등 7명에게 과태료 내지 견책에 처한다는 결정을 한 사안에서, 乙 등은 甲 법무법인의 대표변호사로서 위 광고에 직접 관여하지 않았다거나 구체적인 고의·과실이 증명되지 않았더라도 해당 광고에 대한 법령상 책임을 부담하므로 행정상 제재로서 징계를 받을 수 있고, 乙 등에게 의무 위반을 탓할 수 없을 만한 정당한 사유가 존재한다고 볼 수 없으며, 위 결정이 재량권을 일탈·남용한 것으로 볼 수도 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=613151"},{"id":"P:619551","kind":"P","label":"2025나5209","title":"보험금","court":"서울중앙지방법원","date":"2025.11.26","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619551"},{"id":"P:613177","kind":"P","label":"2023다209984","title":"구상금","court":"대법원","date":"2025.11.20","caseType":"민사","basis":"참조조문","text":"[1] 손해보험에서 보험의 목적물과 위험의 종류만이 정해져 있고 피보험자와 피보험이익이 명확하지 않은 경우, 피보험자를 결정하는 기준 [2] 甲 보험회사와 乙 주식회사 사이에 乙 회사가 상품 보관창고로 사용하고 있는 丙 소유 건물 및 이에 보관된 상품 일체를 보험목적물로 하는 보험계약이 체결된 후에 丙이 丁 주식회사와 위 건물 지붕에 태양광 발전소를 건립하는 건설도급계약을 체결하여 그중 태양광 모듈 장착을 위한 구조물 공사가 戊 주식회사 등을 거쳐 己에게 순차로 하도급되었는데, 己가 고용한 용접공이 위 건물의 창고 지붕에 올라가 용접작업을 하고 있던 중 창고 내에서 화재가 발생하여 보관창고와 그 안에 보관되어 있던 상품들이 소훼되는 사고가 발생하자, 甲 회사가 건물 손해에 관하여 丙에게 보험금을 지급한 다음 丁 회사를 상대로 상법 제682조 제1항에 따라 丙의 丁 회사에 대한 채무불이행에 따른 손해배상청구권 등을 대위 행사한 사안에서, 제반 사정에 비추어 위 보험계약 중 건물 부분은 타인인 건물 소유자 丙을 위한 보험계약으로 볼 여지가 큰데도, 이에 관한 심리를 제대로 하지 않은 채 위 건물 부분의 피보험자를 乙 회사로 보아 甲 회사는 피보험자가 아닌 丙의 丁 회사에 대한 채무불이행에 따른 손해배상청구권을 대위 취득할 수 없다고 본 원심판단에 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=613177"},{"id":"P:613181","kind":"P","label":"2024다324200","title":"구상금","court":"대법원","date":"2025.11.20","caseType":"민사","basis":"참조조문","text":"[1] 상법 제682조 제1항에서 정한 ‘제3자에 대한 보험대위’가 보험계약자 또는 피보험자 등의 제3자에 대한 손해배상청구권이 있음을 전제로 하는지 여부 [2] 상법 제724조 제2항에 의하여 피해자에게 인정되는 직접청구권의 법적 성질 및 이때 보험자의 손해배상채무와 피보험자의 손해배상채무의 관계 [3] 甲 보험회사가 乙과는 乙 소유의 건물 및 시설을 보험목적물로 하는 보험계약을, 위 건물을 임차하여 식자재 유통마트를 운영하는 丙 주식회사와는 위 건물 및 丙 회사 소유 시설 등을 보험목적물로 하는 보험계약을 체결하였는데, 이후 丙 회사 유통마트의 수산물코너에서 화재가 발생하여 위 건물의 구조재 및 마감재 일체가 소손되는 사고가 발생하자, 甲 회사가 乙에게 임차인 보험계약에 따른 보험금과 소유자 보험계약에 따른 보험금을 지급한 다음 丙 회사를 상대로 소유자 보험금 지급을 이유로 상법 제682조에 따라 보험자대위권을 행사한 사안에서, 제반 사정에 비추어 甲 회사와 丙 회사 사이에 체결된 임차인 보험계약에 丙 회사의 손해배상책임을 보상하는 책임보험계약이 포함되어 있다면 甲 회사가 소유자 보험금 지급을 이유로 丙 회사에 대하여 보험자대위권을 행사할 수 있다고 보기 어려운데도, 임차인 보험계약이 책임보험계약을 포함하고 있는지, 만약 그렇다면 책임보험계약에 따라 丙 회사가 화재사고로 부담하는 배상책임도 甲 회사에 의하여 보상되는지 등에 관하여","url":"https://www.law.go.kr/precInfoP.do?precSeq=613181"},{"id":"P:613051","kind":"P","label":"2025다211111","title":"구상금","court":"대법원","date":"2025.11.13","caseType":"민사","basis":"참조조문","text":"[1] 해상운송에 관한 상법 제797조의 책임제한 규정이 육상운송에도 적용되는지 여부 [2] 甲 주식회사가 수출화물의 운송을 乙 주식회사에 의뢰하자, 乙 회사가 인천항에서 부산항까지의 육상운송을 丙 주식회사에, 부산항부터의 해상운송을 丁 주식회사에 각각 하도급하였고, 이후 丙 회사가 육상운송을 戊 주식회사에 다시 위탁하였는데, 온도 조절기가 부착된 컨테이너를 이용하여 영상 18도로 수출화물을 운송하라는 甲 회사의 요청을 전달받고도 丁 회사의 직원이 컨테이너 보관회사 직원에게 컨테이너 온도를 영하 18도로 설정할 것을 요청하고 戊 회사의 직원은 컨테이너 온도를 확인하지 않은 채 육상운송을 하여 수출화물이 부산항 소재 丁 회사의 컨테이너 터미널로 운송될 때까지 냉동상태에서 손상을 입는 사고가 발생하자, 수출화물 운송에 관하여 甲 회사와 해상적하보험계약을 체결한 己 보험회사가 甲 회사에 보험금을 지급하고 丁 회사 등을 상대로 손해배상을 구한 사안에서, 위 사고로 인한 丁 회사의 손해배상책임에 해상운송인의 책임제한에 관한 상법 제797조가 적용된다고 할 수 없는데도, 이와 달리 본 원심판단에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=613051"},{"id":"P:619477","kind":"P","label":"2025나206327","title":"회사에 관한 소송","court":"서울고등법원","date":"2025.10.30","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619477"},{"id":"P:612981","kind":"P","label":"2025두33647","title":"법인세부과처분및소득금액변동통지취소청구","court":"대법원","date":"2025.10.30","caseType":"세무","basis":"참조조문","text":"처분을 전제로 발행회사가 일시적으로 보유하고 있는 자기주식의 경우 양도성과 자산성 측면에서 다른 주식회사가 발행한 주식과 본질적인 차이가 있는지 여부 및 이러한 자기주식의 취득과 처분은 법인세 과세대상인 자산의 손익거래에 해당하는지 여부 / 조세법규의 해석 원칙 및 조세법규에 관하여 합목적적 해석이 허용되는 경우 / 자산성과 양도성을 지닌 자기주식에 대하여 비상장주식의 보충적 평가방법을 적용할 때 상속세 및 증여세법 시행령 제54조 제1항 단서가 적용되는 경우, 자기주식을 포함한 비상장주식의 1주당 가액을 산출하는 방법","url":"https://www.law.go.kr/precInfoP.do?precSeq=612981"},{"id":"P:612853","kind":"P","label":"2019다236385","title":"손해배상","court":"대법원","date":"2025.10.16","caseType":"민사","basis":"참조조문","text":"[1] 주주총회의 특별결의가 있어야 하는 상법 제374조 제1항 제1호의 ‘영업의 전부 또는 중요한 일부의 양도’의 의미 / 영업용 재산의 처분이 회사 영업의 전부 또는 일부를 양도하거나 폐지하는 것과 같은 결과를 가져오는 경우, 상법 제374조 제1항 제1호의 양도로서 주주총회의 특별결의가 필요한지 여부 및 위와 같은 영업용 재산의 처분에 관한 결의사항에 반대하는 주주도 상법 제374조의2에 따른 주식매수청구권을 행사할 수 있는지 여부 [2] 주주가 상법 제363조의2 제1항에 따라 일정한 사항을 주주총회의 목적사항으로 할 것을 제안한 경우, 주주제안 내용이 법령 또는 정관을 위반하는 경우와 대통령령으로 정한 경우를 제외하고는 이를 주주총회의 목적사항으로 하여야 하는지 여부 [3] 주식회사의 대표이사가 업무집행을 하면서 고의 또는 과실에 의한 위법행위로 타인에게 손해를 가한 경우, 주식회사가 제3자에게 손해배상책임을 부담하는지 여부 및 이때 대표이사도 주식회사와 공동불법행위책임을 부담하는지 여부 [4] 민법 제393조에서 정한 ‘통상손해’와 ‘특별한 사정으로 인한 손해’의 의미 및 이는 불법행위로 인한 손해배상의 범위를 판단할 때에도 마찬가지로 적용되는지 여부 [5] 신발류 및 신발부품류의 제조 등을 영위하여 온 甲 주식회사가 중국 등지에서 자전거용 신발을 제조하던 乙 외국회사 등의 주식을 丙 주식회사에 양도하면서 주주총회 특별결의","url":"https://www.law.go.kr/precInfoP.do?precSeq=612853"},{"id":"P:612883","kind":"P","label":"2020도17272","title":"특정경제범죄가중처벌등에관한법률위반(배임)·특정경제범죄가중처벌등에관한법률위반(횡령)·업무상횡령·업무상배임","court":"대법원","date":"2025.10.16","caseType":"형사","basis":"참조조문","text":"[1] 업무상배임죄의 구성요건 중 ‘임무에 위배하는 행위’의 의미 / 업무상배임죄에서 ‘재산상의 손해’의 의미 및 재산상 손해의 유무를 판단하는 기준 [2] 상법상 주식회사 자본금 감소의 방법과 절차 / 주주평등의 원칙을 비롯하여 상법에서 정한 관련 절차를 모두 준수하여 유상감자가 이루어진 경우, 유상감자에 따른 1주당 환급금의 액수가 시가보다 높다거나 대주주에게 투하 자본을 환급한다는 등의 목적으로 유상감자가 실행되었다는 사정만으로 회사가 손해를 입었다고 단정할 수 있는지 여부 / 자본금을 감소시킬 합리적 이유가 없음에도 회사의 기왕의 재무상태에 비추어 과다한 규모의 자산이 유출되고 이로 인해 통상적인 기업활동을 위한 채무변제가 어려워지는 등 회사의 경영과 자금 운영에 구체적이고 현실적인 위험이 초래된 경우, 이사는 회사의 재산을 보호할 의무를 위배한 것인지 여부 및 이로 인해 회사가 손해를 입었다고 볼 여지가 큰지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=612883"},{"id":"P:622981","kind":"P","label":"2024누52016","title":"양도소득세부과처분취소","court":"서울고등법원","date":"2025.10.02","caseType":"세무","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=622981"},{"id":"P:618087","kind":"P","label":"2025다211931","title":"구상금","court":"대법원","date":"2025.09.26","caseType":"민사","basis":"참조조문","text":"[1] 상법 제682조 제1항에 따른 보험자대위권의 행사 범위 [2] 화재보험이 책임보험으로서의 성격을 갖는지 여부 및 손해보험에서 보험의 목적물과 위험의 종류만이 정해져 있고 피보험자와 피보험이익이 명확하지 아니한 경우, 피보험자를 결정하는 방법 [3] 甲 보험회사가 乙과 체결한 보험계약의 보험목적물은 乙이 임차한 丙 소유의 건물 및 乙 소유의 시설, 집기 비품, 동산인데, 위 건물과 같은 동에 소재한 丁의 사무실 건물에서 발생한 화재가 확산하여 보험목적물이 소훼되자, 甲 회사가 丙에게는 ‘건물’ 손해에 관한 보험금을 지급하고 乙에게는 ‘시설, 집기 비품, 동산’ 손해에 관한 보험금을 지급한 다음 丁을 상대로 보험자대위권을 행사한 사안에서, 위 보험계약 중 화재손해에 관한 보장 부분은 손해보험에 해당한다고 한 다음, 보험목적물 중 ‘시설, 집기 비품, 동산’의 경우에는 보험계약자 겸 소유자인 乙을 피보험자로 하여 하나의 보험계약이 체결되었다고 볼 수 있고, 丁의 책임 비율에 따른 손해배상책임액이 乙의 남은 손해액에 미치지 못하므로, 甲 회사가 이 부분 손해의 보험금에 관하여 보험자대위권을 행사할 수 없다고 본 원심판단은 받아들일 수 있으나, ‘건물’의 경우에는 임차인 乙이 소유자 丙을 위하여 체결한 타인을 위한 보험계약에 해당한다고 볼 여지가 커서 甲 회사가 丙에게 건물 손해에 관한 보험금을 지급하고 피보험자인 丙의 丁에 대한 손해","url":"https://www.law.go.kr/precInfoP.do?precSeq=618087"},{"id":"P:609567","kind":"P","label":"2025두33121","title":"2차납세의무자지정및납세고지처분취소","court":"대법원","date":"2025.09.25","caseType":"세무","basis":"참조조문","text":"[1] 과점주주의 제2차 납세의무를 규정한 구 국세기본법 제39조의 취지 및 해석 방법 [2] 법원으로부터 회생절차개시결정을 받아 채무자에 대한 회생절차가 진행되는 동안 회생절차 개시 전까지 과점주주 지위에 있던 채무자는 제2차 납세의무를 부담하는 과점주주 지위에 있는지 여부 / 제2차 납세의무를 부담하는 과점주주인지의 판단 시점인 본래 납세의무자의 납세의무 성립일을 기준으로 채무자에 대해 이미 개시된 회생절차가 폐지된 경우, 소급하여 채무자가 제2차 납세의무자인 과점주주 지위에 있게 되는지 여부 및 이때 채무자가 제2차 납세의무자인 과점주주 지위에 있는지 판단하는 시점","url":"https://www.law.go.kr/precInfoP.do?precSeq=609567"},{"id":"P:618171","kind":"P","label":"2025다213347","title":"구상금","court":"대법원","date":"2025.09.25","caseType":"민사","basis":"참조조문","text":"피해자 보험회사가 피해자인 피보험자에게 자기차량 손해담보특약에 따른 보험금을 지급한 경우, 상법 제682조 제1항의 보험자대위에 따른 권리 취득 이외에 가해자 내지 가해자의 보험회사에 대하여 별도의 구상금채권을 취득하는지 여부 및 이때 보험회사가 취득하는 채권의 소멸시효 기간과 그 기산점은 피보험자의 가해자에 대한 채권 자체를 기준으로 판단하여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=618171"},{"id":"P:609517","kind":"P","label":"2025다211120","title":"주주지위확인의소[주식을 공동상속받은 자가 단독으로 회사에 명의개서절차이행 내지 주주권 확인을 청구하는 사건]","court":"대법원","date":"2025.09.11","caseType":"민사","basis":"참조조문","text":"[1] 공동으로 주식을 상속한 수인은 상속이 개시된 때에 주식을 공유하게 되는지 여부 및 이는 상속인들 명의로의 명의개서가 이루어지지 않았다거나 주식에 관하여 상속재산분할심판청구가 확정되지 않았더라도 마찬가지인지 여부 [2] 공유주식에 관하여 공유상태 명의개서를 청구하는 행위가 상법 제333조 제2항에서 정한 ‘주주의 권리 행사’에 해당하는지 여부 및 그 청구를 위해 반드시 1인의 권리행사자가 정해져야 하는지 여부 [3] 주식을 공유하는 자들 중 일부가 명의개서를 희망하지 않는 등의 경우, 명의개서를 희망하는 일부 공유자들의 의사만으로 회사에 대하여 공유상태 명의개서를 청구할 수 있는지 여부 [4] 주식을 공유하는 자들 중 일부가 명의개서를 원하지 않는 등으로 공유상태 명의개서를 청구할 수 없는 경우, 주식을 공유하는 수인 중 일부가 단독으로 회사를 상대로 주주권 확인을 구할 수 있는지 여부 및 이때 자신이 취득한 공유지분에 한하여 주주권 확인을 구할 이익이 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=609517"},{"id":"P:615645","kind":"P","label":"2023다207834","title":"손해배상(기)","court":"대법원","date":"2025.08.28","caseType":"민사","basis":"판례내용","text":"[1] 사업보고서의 허위 기재나 기재 누락으로 인한 손해배상책임의 제척기간 기산점으로 구 자본시장과 금융투자업에 관한 법률 제162조 제5항에서 정한 ‘해당 사실을 안 날’의 의미 및 청구권자가 허위 기재나 기재 누락이 있는 사업보고서가 어떤 것인지를 인식하였거나 일반인이 이를 인식할 수 있는 정도에 이른 경우 해당 사실을 현실적으로 인식하였다고 볼 수 있는지 여부 [2] 구 자본시장과 금융투자업에 관한 법률 제162조 제1항에서 정한 ‘중요사항’의 의미 [3] 구 자본시장과 금융투자업에 관한 법률 제162조 제1항에 근거한 사업보고서의 거짓 기재로 인한 손해배상책임의 경우, 사업보고서의 제출인은 손해의 전부 또는 일부와 사업보고서 등의 거짓 기재 사이에 인과관계가 없다는 점을 증명하여 책임의 전부 또는 일부를 면할 수 있는지 여부 및 이러한 인과관계 부존재 사실을 증명하는 방법 [4] 거짓 기재가 포함된 사업보고서가 공시된 이후의 주가 형성이나 사업보고서의 거짓 기재가 밝혀져 시장에 알려진 이후의 주가 하락이 사업보고서의 거짓 기재 때문인지 불분명하다는 정도의 증명만으로 구 자본시장과 금융투자업에 관한 법률 제162조 제3항에 따른 손해액의 추정이 깨지는지 여부 [5] 사업보고서의 거짓 기재 사실이 밝혀져 다시 정상주가가 형성된 이후에 주식을 매도하였거나 변론종결일까지 계속 보유 중인 경우, 구 자본시장과 금융투자업에 관한 법률 제","url":"https://www.law.go.kr/precInfoP.do?precSeq=615645"},{"id":"P:608481","kind":"P","label":"2024다270860","title":"손해배상(기)[도착지 운송주선인이 마스터 화물인도지시서를 수입업자에 교부한 후 보세창고업자가 선하증권과의 상환 없이 물품을 수입업자에 반출한 사건]","court":"대법원","date":"2025.08.14","caseType":"민사","basis":"참조조문","text":"[1] 운송주선인이 상품의 통관절차, 운송물의 검수, 보관, 부보, 운송물의 수령인도 등 운송목적의 실현에 도움을 주는 부수적 업무를 담당할 수 있는지 여부 / 운송주선인이 위와 같은 역할을 수행하기 위하여 도착지 현지 운송주선인을 둔 경우, 도착지 운송주선인의 의무 및 도착지 운송주선인이 운송물을 선하증권 소지인이 아닌 자에게 인도하여 선하증권 소지인에게 운송물을 인도하지 못하게 된 경우, 불법행위가 성립하는지 여부 [2] 甲 외국법인이 국내 수입업자에게 물품을 수출하는 매매계약을 체결하고 운송을 乙 외국법인에 의뢰하자, 乙 외국법인이 해상운송인인 丙 주식회사를 대리하여 甲 외국법인에 송하인을 甲 외국법인, 수하인 및 통지처를 수입업자로 하는 하우스 선하증권을 발행하였고, 丙 회사는 乙 외국법인에 송하인을 乙 외국법인, 수하인 및 통지처를 乙 외국법인의 위임을 받은 丁 주식회사로 하는 해상화물운송장을 발행하고 물품을 부산항으로 운송하여 그 물품이 컨테이너 터미널에 반입되었다가 보세창고로 반출되었는데, 丁 회사의 자가운송 신청에 따라 丙 회사가 丁 회사에 수하인 및 통지처를 丁 회사로 하여 발행한 마스터 화물인도지시서의 사본을 수입업자가 丁 회사의 직원으로부터 전달받아 이를 보세창고업자에게 제시하고, 보세창고업자는 위 사본만을 확인하고 물품대금이 지급되었는지는 확인하지 않은 채 수입업자에게 물품을 반출하자, 甲 법인이 丁 회사와 그 ","url":"https://www.law.go.kr/precInfoP.do?precSeq=608481"},{"id":"P:612113","kind":"P","label":"2023추5023","title":"조례안재의결무효확인","court":"대법원","date":"2025.08.14","caseType":"일반행정","basis":"판례내용","text":"[1] 조례안재의결 무효소송에서 심리 대상은 지방자치단체장의 재의요구 당시 이의사항으로 지적하여 재의결에서 심의의 대상이 된 것에 국한되는지 여부 [2] 지방자치법 제120조 제3항에 따라 조례안이 법령에 위반되는지가 문제 된 소송에서 심사 기준이 되는 법령 [3] 지방자치단체 출자·출연 기관의 운영에 관한 법률 제8조 제1항, 제15조를 ‘임직원에 관한 사항’과 ‘조직과 정원에 관한 사항’을 오로지 해당 기관의 정관 또는 내부규정으로만 정해야 한다고 해석할 수 있는지 여부 [4] 세종특별자치시 출자·출연 기관에 임원추천위원회를 설치하도록 하고 시장으로 하여금 임원추천위원회의 추천을 거친 임원을 임명하도록 정하는 내용의 ‘세종특별자치시 출자·출연 기관의 운영에 관한 조례 일부개정조례안’에 대하여 시장이 지방자치단체 출자·출연 기관의 운영에 관한 법률에 위반될 소지가 있다는 등의 이유로 재의를 요구하였으나 의회가 이를 재의결함으로써 확정한 사안에서, 위 조례안 규정이 출자·출연 기관에 관하여 조례 또는 정관으로 정할 사항을 규정한 지방자치단체 출자·출연 기관의 운영에 관한 법률 제4조 제5항, 제8조 제1항 제7호 및 제37조, 출자·출연 기관의 자율성을 보장하고 있는 같은 법 제3조 제2항 등에 위반되지 않는다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=612113"},{"id":"P:615639","kind":"P","label":"2024다301832","title":"보험금","court":"대법원","date":"2025.08.14","caseType":"민사","basis":"참조조문","text":"[1] 보험계약을 체결할 때 보험자가 부담하는 보험약관에 관한 명시·설명의무의 내용 및 보험자가 보험약관에 관한 명시·설명의무를 위반한 경우, 그 약관의 내용을 보험계약의 내용으로 주장할 수 있는지 여부 / 여기서 명시·설명의무의 대상이 되는 ‘중요한 내용’의 의미 및 약관조항에 관한 명시·설명의무가 제대로 이행되었더라도 그러한 사정이 보험계약의 체결 여부에 영향을 미치지 않는 경우, 그 약관조항이 명시·설명의무의 대상이 되는 보험계약의 ‘중요한 내용’이라고 할 수 있는지 여부 / 보험계약의 중요한 내용에 해당하는 사항이나 보험자의 명시·설명의무가 면제되는 경우 [2] 甲이 乙 보험회사와 자신이 운영하는 카센터의 설치기계 등에 관한 화재보험계약을 체결하면서 보험의 목적에 손해가 발생한 경우 보험의 목적과 동형, 동질의 신품을 재조달하는 데 소요되는 금액을 보상하는 재조달가액 특약에 가입하였고, 위 특약이 적용되는 보험약관 조항은 전문에서 ‘보험의 목적이 손해를 입은 장소에서 실제로 수리 또는 복구되지 않은 때에는 재조달가액에 의한 보상을 하지 않고 시가만 보상한다.’는 취지로, 후문에서 ‘계약자 또는 피보험자는 손해 발생 후 늦어도 180일 이내에 수리 또는 복구 의사를 회사에 서면으로 통지하여야 하며, 이 기간을 경과하면 재조달가액에 의한 피보험자의 추가 보험금 청구권은 상실된다.’는 취지로 정하고 있는데, 이후 위 카센터에서 화재","url":"https://www.law.go.kr/precInfoP.do?precSeq=615639"},{"id":"P:608447","kind":"P","label":"2024다289680","title":"보험금[상법 제652조 제1항의 통지의무 위반을 이유로 보험계약을 해지할 수 있는지 문제된 사건]","court":"대법원","date":"2025.08.14","caseType":"민사","basis":"참조조문","text":"보험약관에서 상법 제652조 제1항의 통지의무를 구체화하여 ‘보험기간 중에 이륜자동차 또는 원동기장치자전거를 계속적으로 사용하게 된 경우에 지체 없이 회사에 알려야 하고, 이를 이행하지 않았을 때에는 회사가 계약을 해지할 수 있다.’고 정한 경우, 위 약관조항에 대한 보험자 등의 명시·설명의무가 면제되는지 여부 및 보험자가 보험약관의 명시·설명의무를 위반하여 보험계약을 체결한 경우, 상법 제652조 제1항의 적용까지 배제되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=608447"},{"id":"P:618483","kind":"P","label":"2024나74413","title":"대여금","court":"인천지방법원","date":"2025.07.09","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=618483"},{"id":"P:615843","kind":"P","label":"2024나2034079","title":"손해배상(기)","court":"서울고등법원","date":"2025.07.09","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=615843"},{"id":"L:402-2","kind":"L","label":"법 제402조의2","title":"현행 조문에 없음(구법 조문 번호)","chapter":"","deleted":true,"ghost":true,"text":""},{"id":"P:607779","kind":"P","label":"2024가합52067","title":"신주발행무효의소","court":"서울중앙지방법원","date":"2025.06.27","caseType":"민사","basis":"참조조문","text":"비철금속 제련사업을 영위하는 甲 주식회사는 정관에서 제3자 배정 방식의 신주발행이 가능한 경우의 하나로 ‘회사가 경영상 필요로 외국의 합작법인에 신주를 발행하는 경우’를 정하고 있는데, 甲 회사가 미합중국 델라웨어주 법률에 의하여 설립된 乙 외국법인에 제3자 배정 방식의 신주발행을 하자, 甲 회사의 최대주주로 甲 회사 경영진 측과 경영권 분쟁 중인 丙 주식회사가 위 신주발행에 상법 및 정관에서 제3자 배정이 가능한 경우로 정한 ‘경영상 필요’가 인정되지 않을 뿐만 아니라 乙 외국법인은 정관에서 제3자 배정의 대상으로 정한 ‘외국의 합작법인’에 해당하지도 않는다며 신주발행의 무효를 구한 사안에서, 제반 사정에 비추어 위 신주발행은 甲 회사의 ‘경영상 필요’에 따른 것임이 인정되나, 乙 외국법인은 甲 회사가 출자에 참여한 합작법인이 아니어서 甲 회사 정관에서 제3자 배정의 대상으로 정한 ‘외국의 합작법인’에 해당한다고 볼 수 없으므로, 위 신주발행은 정관을 중대하게 위반하여 기존 주주의 신주인수권을 침해하는 것으로서 무효라고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=607779"},{"id":"P:614653","kind":"P","label":"2024가합52067","title":"신주발행무효의소","court":"서울중앙지방법원","date":"2025.06.27","caseType":"민사","basis":"참조조문","text":"비철금속 제련사업을 영위하는 甲 주식회사는 정관에서 제3자 배정 방식의 신주발행이 가능한 경우의 하나로 ‘회사가 경영상 필요로 외국의 합작법인에 신주를 발행하는 경우’를 정하고 있는데, 甲 회사가 미합중국 델라웨어주 법률에 의하여 설립된 乙 외국법인에 제3자 배정 방식의 신주발행을 하자, 甲 회사의 최대주주로 甲 회사 경영진 측과 경영권 분쟁 중인 丙 주식회사가 위 신주발행에 상법 및 정관에서 제3자 배정이 가능한 경우로 정한 ‘경영상 필요’가 인정되지 않을 뿐만 아니라 乙 외국법인은 정관에서 제3자 배정의 대상으로 정한 ‘외국의 합작법인’에 해당하지도 않는다며 신주발행의 무효를 구한 사안에서, 제반 사정에 비추어 위 신주발행은 甲 회사의 ‘경영상 필요’에 따른 것임이 인정되나, 乙 외국법인은 甲 회사가 출자에 참여한 합작법인이 아니어서 甲 회사 정관에서 제3자 배정의 대상으로 정한 ‘외국의 합작법인’에 해당한다고 볼 수 없으므로, 위 신주발행은 정관을 중대하게 위반하여 기존 주주의 신주인수권을 침해하는 것으로서 무효라고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=614653"},{"id":"P:615877","kind":"P","label":"2024나11385","title":"퇴직금등청구의소","court":"부산고등법원창원재판부","date":"2025.06.26","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=615877"},{"id":"P:607297","kind":"P","label":"2025다209673","title":"청구이의·부당이득금[택시협동조합의 조합원이 조합 탈퇴 시 반환받을 수 있는 출자금의 범위가 문제된 사건]","court":"대법원","date":"2025.06.26","caseType":"민사","basis":"참조조문","text":"협동조합 기본법에 따라 설립된 협동조합의 탈퇴 조합원이 탈퇴한 회계연도 말의 협동조합의 자산과 부채를 반영하여 계산한 순자산에서 해당 조합원이 납입한 출자금이 차지하는 비율을 한도로 지분을 환급받을 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=607297"},{"id":"P:613263","kind":"P","label":"2024다316391","title":"회사에관한소송","court":"대법원","date":"2025.06.26","caseType":"민사","basis":"참조조문","text":"[1] 대표이사가 부담하는 다른 대표이사나 업무담당이사의 업무집행에 관한 감시의무의 내용 / 대규모 회사에서 대표이사나 일부 이사들만이 내부적인 사무분장에 따라 각자의 전문 분야를 전담하여 처리하는 것이 불가피한 경우, 구축하여야 할 내부통제시스템의 형태 및 내부통제시스템이 합리적으로 구축되고 정상적으로 운영되었는지 판단하는 기준 [2] 손해배상액 산정에서 손익상계가 허용되기 위한 요건 / 이사가 회사의 업무를 집행하면서 고의·과실로 법령을 위반한 경우, 법령 위반 행위로 인하여 회사에 발생한 이득을 손익상계의 대상으로 삼을 수 있는지 여부 및 이는 회사의 이사가 다른 이사들의 업무집행을 감시할 의무를 위반함으로써 회사의 범죄를 조장하는 결과를 가져온 경우에도 마찬가지인지 여부 [3] 이사가 법령을 위반한 행위를 하여 회사에 대하여 손해를 배상할 책임이 있는 경우, 제반 사정을 참작하여 손해배상액을 제한할 수 있는지 여부 및 이때 손해배상액 제한의 참작 사유에 관한 사실인정이나 제한 비율의 결정이 사실심의 전권사항인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=613263"},{"id":"P:619497","kind":"P","label":"2025라2309","title":"의결권행사허용가처분","court":"서울고등법원","date":"2025.06.24","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619497"},{"id":"P:614481","kind":"P","label":"2024나11642","title":"공사대금","court":"대구고등법원","date":"2025.06.19","caseType":"민사","basis":"판례내용","text":"甲 주식회사가 乙 주식회사 등으로 구성된 공동수급체로부터 그 공동수급체가 丙 광역시로부터 도급받은 공사 중 일부 공사를 하도급받아 공사를 마친 다음 발주자인 丙 광역시를 상대로 하도급대금 직접지급 합의 및 하도급대금 지급보증서 미발급을 이유로 하도급대금 직접지급을 구한 사안에서, 甲 회사와 乙 회사 등 공동수급체 및 丙 광역시가 하도급대금 직접지급 합의를 한 이래 3차례 변경합의까지 한 사실이 인정되나, 늦어도 丙 광역시가 乙 회사 등 공동수급체에 지급보증 조치의 이행을 촉구하는 통지를 할 즈음에는 위 합의가 명시적, 묵시적으로 합의해지되었고, 甲 회사의 하수급 부분에 대한 하도급대금 지급보증서 미발급은 건설산업기본법 제2항 제5호에서 정한 정당한 사유가 있는 경우에 해당한다는 이유로, 甲 회사의 丙 광역시에 대한 하도급대금 직접지급 청구를 기각한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=614481"},{"id":"P:606939","kind":"P","label":"2024나11642","title":"공사대금","court":"대구고등법원","date":"2025.06.19","caseType":"민사","basis":"판례내용","text":"甲 주식회사가 乙 주식회사 등으로 구성된 공동수급체로부터 그 공동수급체가 丙 광역시로부터 도급받은 공사 중 일부 공사를 하도급받아 공사를 마친 다음 발주자인 丙 광역시를 상대로 하도급대금 직접지급 합의 및 하도급대금 지급보증서 미발급을 이유로 하도급대금 직접지급을 구한 사안에서, 甲 회사와 乙 회사 등 공동수급체 및 丙 광역시가 하도급대금 직접지급 합의를 한 이래 3차례 변경합의까지 한 사실이 인정되나, 늦어도 丙 광역시가 乙 회사 등 공동수급체에 지급보증 조치의 이행을 촉구하는 통지를 할 즈음에는 위 합의가 명시적, 묵시적으로 합의해지되었고, 甲 회사의 하수급 부분에 대한 하도급대금 지급보증서 미발급은 건설산업기본법 제2항 제5호에서 정한 정당한 사유가 있는 경우에 해당한다는 이유로, 甲 회사의 丙 광역시에 대한 하도급대금 직접지급 청구를 기각한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=606939"},{"id":"P:624523","kind":"P","label":"2025가합40229","title":"이사말소회복등기청구","court":"부산지방법원","date":"2025.06.18","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=624523"},{"id":"P:612695","kind":"P","label":"2024누12659","title":"취득세 등 부과 처분 취소","court":"대구고등법원","date":"2025.06.13","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=612695"},{"id":"P:613255","kind":"P","label":"2025다209711","title":"청구이의","court":"대법원","date":"2025.06.12","caseType":"민사","basis":"참조조문","text":"[1] 주권발행 전 주식양도의 방법 및 효력 [2] 쌍무계약에서 상대방의 부수적 사항에 관한 의무위반만을 이유로 자기의 채무이행을 거절할 수 있는 동시이행의 항변권을 갖는지 여부 [3] 주식등변동상황명세서 제출의무를 정한 법인세법 제119조, 법인세법 시행령 제161조 제6항의 입법 취지 및 주식이 양도되는 경우 기존 주주들의 인감증명을 첨부한 주식등변동상황명세서가 제출되어야만 주식양도의 효력이 발생하거나 주주의 지위가 확정되는지 여부 [4] 甲 주식회사의 주주 겸 대표이사인 乙이 甲 회사의 경영권을 양도하기 위해 모든 주주로부터 주식 양도에 관한 권한을 위임받아 丙 등과 경영권양도계약 및 주식양도계약을 체결하였다가, 丙 등이 양도대금을 지급하지 않자 丙 등과 경영권양도계약을 다시 체결하면서 양도대금 지급을 위하여 丙 등이 작성한 ‘乙로부터 양도대금을 차용하고 이를 5회에 걸쳐 분할 변제하기로 하되, 이를 이행하지 아니할 때에는 즉시 강제집행을 당하여도 이의가 없음을 인낙한다.’는 내용의 금전소비대차공정증서를 교부받았는데, 이후 위 공정증서에 기한 강제집행이 진행되자, 丙이 기존 주주들이 주식변동신고를 위한 인감증명을 교부하지 않아 주식 전부의 양도의무가 이행되지 않았으므로 양도대금의 지급을 거절할 수 있는 동시이행의 항변권이 있다며 청구이의의 소를 제기한 사안에서, 제2양도계약 이전에 이미 乙의 주식양도의무가 모두 이행되었다고 볼 ","url":"https://www.law.go.kr/precInfoP.do?precSeq=613255"},{"id":"P:606821","kind":"P","label":"2021다256696","title":"주주대표소송·주주대표소송[법령 위반 행위로 인한 이득에 대하여 손익상계를 할 수 있는지 문제된 사건]","court":"대법원","date":"2025.06.12","caseType":"민사","basis":"참조조문","text":"[1] 어떤 회사가 이사가 속한 회사의 영업부류에 속한 거래를 하고 있는 경우, 영업지역을 달리하고 있다는 사정만으로 두 회사가 경업관계에 있지 않다고 볼 수 있는지 여부 및 경업 대상 여부가 문제 되는 회사가 실질적으로 이사가 속한 회사의 지점 내지 영업부문으로 운영되고 공동의 이익을 추구하는 관계에 있는 경우, 두 회사 사이에 이익충돌의 여지가 있다고 볼 수 있는지 여부 [2] 손해배상액 산정에서 손익상계가 허용되기 위한 요건 및 이사가 회사의 업무를 집행하면서 고의·과실로 법령을 위반한 경우, 법령 위반 행위로 인하여 회사에 발생한 이득을 손익상계의 대상으로 삼을 수 있는지 여부 [3] 이사가 법령을 위반한 행위를 하여 회사에 대하여 손해를 배상할 책임이 있는 경우, 제반 사정을 참작하여 손해배상액을 제한할 수 있는지 여부 및 이때 손해배상액 제한의 참작 사유에 관한 사실인정이나 제한 비율의 결정이 사실심의 전권사항인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=606821"},{"id":"P:606819","kind":"P","label":"2024다216743","title":"주주대표소송[주주가 제소요건을 갖추지 못한 상태에서 대표소송을 제기한 사건]","court":"대법원","date":"2025.06.12","caseType":"민사","basis":"참조조문","text":"주주가 제기한 대표소송에 상법 제403조에서 정한 제소요건을 갖추지 못한 하자가 있으나 회사가 주주의 제소청구에 응하지 않으리라는 특별한 사정이 인정되는 경우, 위 하자가 치유되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=606819"},{"id":"P:606823","kind":"P","label":"2024다202652","title":"주주지위확인등[주주명부상 주주가 주주의 지위를 다투는 회사 등을 상대로 주주권 확인을 구하는 사건]","court":"대법원","date":"2025.06.05","caseType":"민사","basis":"참조조문","text":"[1] 주주명부상 주주가 회사에 대하여 주주권 확인을 구한 경우, 주주명부상 주주라는 이유만을 들어 확인의 이익이 없다고 할 수 있는지 여부 및 이 경우 확인의 이익이 인정되는지 판단하는 방법 [2] 甲 주식회사가 발행한 일부 주식에 관하여 주주명부상 주주로 기재되어 있는 乙이 甲 회사를 상대로 회계장부 등 열람·등사 가처분을 신청하였다가 甲 회사가 그 대표이사인 丙이 乙에게 위 주식을 명의신탁한 것이라고 주장하며 다투어 위 신청이 기각되자 甲 회사와 丙을 상대로 위 주식에 관한 주주권의 확인을 구하는 소를 제기한 사안에서, 甲 회사와 丙이 위 주식에 관한 주주권 귀속을 다투는 이상 乙이 甲 회사와 丙을 상대로 위 주식에 관한 주주권이 乙에게 있다는 확인을 구할 이익이 있다고 봄이 타당한데도, 이와 달리 본 원심판단에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=606823"},{"id":"P:613081","kind":"P","label":"2025다200233","title":"구상금","court":"대법원","date":"2025.05.15","caseType":"민사","basis":"참조조문","text":"[1] 피보험자의 동거가족이 구 상법 제682조에서 정한 제3자에 포함되는지 여부 [2] 甲 보험회사가 乙 오피스텔관리단과 오피스텔 건물 및 부속설비, 집기비품 등에 관한 종합보험계약을 체결하였는데, 오피스텔 3층 전체의 소유자인 丙의 딸인 丁이 丙과 같은 주소지에서 거주하면서 丙으로부터 308호를 임차하여 사업자등록을 마치고 스크린골프장을 운영하던 중 308호에서 화재가 발생하여 오피스텔 2, 3층의 건물 및 집기비품 등에 재산상 손해가 발생하였고, 甲 회사가 乙 관리단에 보험금을 지급한 후 丁 등을 상대로 구상금 지급을 구한 사안에서, 甲 회사의 보험계약의 피보험자는 오피스텔의 각 구분소유자 또는 각 오피스텔 내 집기비품 등의 소유자이고, 오피스텔 3층의 건물 및 집기비품에 대하여는 그 소유자인 丙이 피보험자가 되는데, 丙과 동거가족인 丁이 丙과 별도의 사업장을 운영하고 있다는 사정만으로 丙과 ‘생계를 같이하는 가족’에 해당하지 않는다고 보기 어려운데도, 甲 회사가 丙 소유의 오피스텔 3층 건물 및 집기비품의 손해와 관련하여 지급한 보험금에 관하여 보험자대위권을 행사할 수 있다고 본 원심판결에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=613081"},{"id":"P:624545","kind":"P","label":"2023가단328543","title":"보험금","court":"서울서부지방법원","date":"2025.04.25","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=624545"},{"id":"P:605979","kind":"P","label":"2022두42228","title":"증여세부과처분취소[구 「상속세 및 증여세법」(2016. 12. 20. 법률 제14388호로 개정되기 전의 것, 이하 ‘구 상증세법’) 제39조 제1항 제1호 (다)목 및 같은 법 제4조 제4항 전단의 적용이 문제된 사건]","court":"대법원","date":"2025.04.24","caseType":"세무","basis":"참조조문","text":"[1] 구 상속세 및 증여세법 제39조 제1항 제1호 목에서 규정한 증여세 과세대상 [2] 구 상속세 및 증여세법 제39조 제1항 제1호 목이 증여세 과세대상으로 삼은 ‘기존 주주로부터 무상으로 이전받은 증자에 따른 이익’이 같은 법 제4조 제4항 전단에서 정한 요건을 충족하여 증여자인 기존 주주에게 반환된 경우, 비과세조항을 적용할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=605979"},{"id":"P:612087","kind":"P","label":"2024다313941","title":"보험금","court":"대법원","date":"2025.04.24","caseType":"민사","basis":"참조조문","text":"[1] 생명보험계약에서 피보험자의 직업이나 직종에 관한 사항에 대하여 고지의무 위반이 있어 보험회사가 보험금을 피보험자의 실제 직업이나 직종에 따른 보험금 가입한도나 보상비율 이내로 제한하여 지급하는 경우, 실질적으로 약정된 보험금 가입한도나 보상비율 중에서 제한한 부분에 관하여 보험계약을 해지하는 것인지 여부 및 그 해지에 관하여 상법 제651조에서 규정하고 있는 해지기간 등에 관한 규정이 적용되는지 여부 [2] 생명보험계약에서 고지의무 위반을 이유로 한 해지의 경우, 해지의 의사표시의 상대방 및 타인을 위한 보험에서 보험수익자에 대한 해지의 의사표시가 효력이 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=612087"},{"id":"P:612075","kind":"P","label":"2022다214750","title":"구상금","court":"대법원","date":"2025.04.24","caseType":"민사","basis":"참조조문","text":"[1] 산업재해가 보험가입자와 제3자의 공동불법행위로 인하여 발생한 경우, 산재근로자에게 재해보상을 한 근로복지공단이 제3자에 대하여 구상권을 행사할 수 있는 범위 및 이는 산업재해가 보험가입자 소속 근로자와 제3자의 공동불법행위로 인하여 발생하였고 그 손해에 대하여 보험가입자가 사용자책임을 부담하는 경우에도 마찬가지인지 여부 [2] 자동차종합보험약관 중 대인배상 Ⅱ의 면책사유로 ‘피보험자동차가 피보험자동차의 사용자의 업무에 사용되는 경우 그 사용자의 업무에 종사 중인 다른 피용자로서, 산업재해보상보험법에 의한 재해보상을 받을 수 있는 사람이 죽거나 다친 경우’를 정한 면책조항의 취지 및 자동차 보험사고가 산재사고에도 해당하여 피해자가 ‘산업재해보상보험법에 의한 재해보상을 받을 수 있는 사람’인 경우, 보험자가 자동차보험계약에 의하여 보상할 손해 중 산재보험급여로 전보될 수 있는 부분은 위 면책조항에 따라 보상책임이 면제되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=612075"},{"id":"P:624897","kind":"P","label":"2023나94479","title":"구상금","court":"수원지방법원","date":"2025.04.09","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=624897"},{"id":"P:605853","kind":"P","label":"2025카합20431","title":"의결권행사허용가처분","court":"서울중앙지방법원","date":"2025.03.27","caseType":"민사","basis":"참조조문","text":"甲 주식회사의 정기주주총회 기준일 당시 甲 회사의 발행주식총수의 25%가 넘는 보통주식을 보유하고 있던 乙 주식회사가 이후 자회사를 설립하면서 이를 모두 현물출자하였는데, 甲 회사가 자신의 자회사인 丙 외국회사가 丙 회사의 자회사인 丁 외국회사로부터 丁 회사가 위 주주총회 기준일 이후에 乙 회사의 주주들로부터 취득한 乙 회사의 발행주식총수의 10%를 초과하는 보통주식을 현물배당받아 甲 회사 → 丙 회사 → 乙 회사 → 甲 회사 순으로 순환지분출자 구조가 형성되었다며 주주총회에서 상법 제369조 제3항에 따라 乙 회사가 보유하던 주식의 의결권 행사를 제한할 예정이라는 입장을 밝히자, 乙 회사가 주주총회 기준일은 물론 주주총회일을 기준으로 할 때에도 甲 회사와 주식상호보유 관계에 있지 않다며 甲 회사를 상대로 의결권 행사의 허용을 구하는 가처분신청을 한 사안에서, 乙 회사가 주주총회 기준일 당시 주식의 보유자였고 주주총회에서 위 주식에 대한 의결권을 행사할 예정이므로 상법 제369조 제3항에 따라 의결권 행사를 제한할 수 있는지는 乙 회사를 기준으로 판단하여야 하고, 丙 회사가 외국법에 의하여 설립된 외국회사라고 하더라도 상법 제369조 제3항이 적용될 수 있으므로, 甲 회사의 자회사인 丙 회사가 주주총회일을 기준으로 乙 회사의 발행주식총수의 10%를 초과하는 주식을 가지고 있는 이상 甲 회사는 상법 제369조 제3항에 따라 주주총회 기","url":"https://www.law.go.kr/precInfoP.do?precSeq=605853"},{"id":"P:609321","kind":"P","label":"2024누57653","title":"등록면허세등취소의소","court":"서울고등법원","date":"2025.03.19","caseType":"세무","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=609321"},{"id":"P:609547","kind":"P","label":"2023다264462","title":"부당이득금","court":"대법원","date":"2025.03.13","caseType":"민사","basis":"참조조문","text":"[1] 저작권자 허락 없이 저작물을 이용한 경우, 저작권자에게 저작물에 관하여 이용허락을 받았더라면 이용대가로서 지급하였을 객관적으로 상당한 금액을 부당이득으로 반환할 책임이 있는지 여부 및 위와 같은 이익은 현존하는 것으로 볼 수 있는지 여부 [2] 부당이득반환청구권에 5년의 소멸시효를 정한 상법 제64조가 적용되는 경우 [3] 부당이득반환청구권이 성립하는 경우 및 그 소멸시효의 기산점","url":"https://www.law.go.kr/precInfoP.do?precSeq=609547"},{"id":"P:604343","kind":"P","label":"2022다282746","title":"신주발행무효의소[주주명부상 주주가 자신을 배제시킨 채로 신주발행 절차가 진행되었다고 주장하면서 회사를 상대로 신주발행무효의 소를 제기한 사건]","court":"대법원","date":"2025.02.20","caseType":"민사","basis":"참조조문","text":"[1] 자본시장과 금융투자업에 관한 법률에 따라 한국예탁결제원에 예탁된 주식에 대한 주주권 행사의 주체 및 위와 같이 예탁된 주식의 경우, 회사가 상법 제418조에 따라 신주를 발행하면서 주주에 대한 통지 내지 공고 절차를 이행하였는지, 신주발행이 주주의 신주인수권을 침해하였는지는 실질주주명부상 주주를 기준으로 판단하여야 하는지 여부 [2] 甲이 乙 주식회사의 대표이사 겸 주주인 丙으로부터 乙 회사 발행 주식을 매수하는 내용의 매매예약을 체결하면서 ‘丙은 甲에게 매매예약의 담보로 매매예정 주식수 상당의 주권을 예치한다. 甲은 예치받은 주식에 대한 의결권 등 권리가 매매예약이 완결되기 전까지는 丙에게 있음을 확인한다.’고 약정하였고, 이후 위 매매예약에 따라 丙으로부터 매매예정 주식수 상당의 주식을 이전받아 신주발행 무렵 乙 회사의 명의개서대리인이 작성·비치한 실질주주명부에 주주로 기재되었는데, 乙 회사가 자신이 직접 작성·관리하는 주주명부상 주주인 丙 등에게만 동의를 받아 신주를 발행하자, 甲이 신주인수권을 침해당하였다며 신주발행무효의 소를 제기한 사안에서, 乙 회사가 甲을 포함한 실질주주명부상 주주 대부분을 신주발행 절차에서 배제시킨 것으로 보이는데도, 甲과 丙 사이에 甲 명의로 된 주식에 관한 권리가 丙에게 귀속된다는 약정이 있다는 이유를 들어 甲의 신주인수권이 침해되지 않았다고 본 원심판단에 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=604343"},{"id":"P:604041","kind":"P","label":"2022다306048","title":"보험금·보험금·보험금[생명보험에서 지정 보험수익자가 먼저 사망하고 재지정권이 행사되지 아니한 경우에 보험금청구권 귀속에 관하여 상법 제733조 제3항, 제4항의 해석이 문제된 사건]","court":"대법원","date":"2025.02.20","caseType":"민사","basis":"참조조문","text":"[1] 생명보험에서 지정 보험수익자 사망 후 보험계약자가 재지정권을 행사하기 전에 보험계약자가 사망하거나 보험사고가 발생하고, 보험계약자 사망 또는 보험사고 발생 당시 지정 보험수익자의 상속인이 생존하고 있지 아니한 경우의 보험수익자 및 보험수익자가 되는 상속인이 여럿인 경우, 상속인들이 법정상속분 비율로 보험금청구권을 취득하는지 여부 [2] 甲이 乙 보험회사와 피보험자를 甲, 사망 시 보험수익자를 甲과 丙 사이에 출생한 丁으로 정하여 보험계약을 체결하였는데, 甲이 丙과 이혼한 후 丁과 생활하던 중 범죄사고로 丁이 먼저 사망하였고 이어서 甲도 사망하였으며, 丙과 甲의 부모인 戊 등이 각각 乙 회사를 상대로 보험금 지급을 구한 사안에서, 위 보험계약의 보험수익자는 丁의 상속인인 丙과 순차 상속인인 戊 등으로 확정되고, 법정상속분 비율에 따라 丙에게 보험금청구권 중 1/2 지분, 戊 등에게 보험금청구권 중 각 1/4 지분이 귀속된다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=604041"},{"id":"P:608341","kind":"P","label":"2023나209517","title":"구상금","court":"대전지방법원","date":"2025.02.18","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=608341"},{"id":"P:619535","kind":"P","label":"2024나34568","title":"구상금","court":"서울중앙지방법원","date":"2025.02.14","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619535"},{"id":"P:613291","kind":"P","label":"2024나2023710","title":"구상금","court":"서울고등법원","date":"2025.02.12","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=613291"},{"id":"P:619419","kind":"P","label":"2024가합70522","title":"회사에 관한 소송","court":"서울중앙지방법원","date":"2025.02.07","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619419"},{"id":"P:619553","kind":"P","label":"2023가단5490134","title":"보험금","court":"서울중앙지방법원","date":"2025.01.16","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619553"},{"id":"P:600295","kind":"P","label":"2024다272941","title":"보험금[보험계약자가 고지의무를 위반한 사실과 보험사고 발생 사이에 인과관계가 있는지 여부가 문제된 사건]","court":"대법원","date":"2025.01.09","caseType":"민사","basis":"참조조문","text":"[1] 보험계약을 체결할 때 고지의무를 위반한 사실과 보험사고 발생 사이에 인과관계가 존재하지 않는다는 점에 관한 증명책임의 소재 및 인과관계의 존재를 조금이라도 인정할 여지가 있는 경우, 상법 제655조 단서가 적용될 수 있는지 여부 [2] 甲이 乙 보험회사와 피보험자를 甲의 약혼자인 丙으로, 보험수익자를 甲으로 하는 보험계약을 체결하면서 丙이 보험계약 체결 직전 입원치료를 받은 사실과 보험계약 체결 당일 진료의뢰서를 발급받은 사실이 있는데도 보험계약 청약서의 ‘계약 전 알릴 의무’ 중 ‘최근 3개월 이내에 의사로부터 진찰 또는 검사를 통하여 의료행위를 받은 사실이 있습니까?’라는 질문에 대해 \"아니오.\"라고 답변하였는데, 그 후 丙이 ‘만성기 만성 골수성 백혈병’ 진단을 받는 보험사고가 발생하여 甲이 보험금을 청구하자, 乙 회사가 고지의무 위반을 이유로 보험계약을 해지한다는 통지를 하고 보험금 지급을 거절한 사안에서, 제반 사정에 비추어 위 입원치료 사실 및 진료의뢰서 발급 사실과 보험사고 발생 사이에 인과관계가 존재한다고 인정할 여지가 있어 甲의 고지의무 위반 사실이 보험사고 발생에 영향을 미치지 아니하였다는 점이 증명되었다고 보기 어려운데도, 甲의 보험금 청구에 상법 제655조 단서가 적용된다고 판단하여 乙 회사의 보험금 지급책임을 인정한 원심판단에 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=600295"},{"id":"P:599671","kind":"P","label":"2024다250286","title":"구상금[아파트 입주자대표회의와 종합보험계약(화재보험계약)을 체결한 보험회사가 같은 입주자대표회의와 재난배상책임보험계약을 체결한 보험회사에 대하여 상법 제682조 제1항에 따라 피해세대 입주자들의 피고에 대한 직접청구권을 대위 행사할 수 있는지 여부가 문제된 사건]","court":"대법원","date":"2024.12.26","caseType":"민사","basis":"참조조문","text":"[1] 상법 제682조의 보험자대위에 의하여 보험자가 취득하는 권리에 상법 제724조 제2항에서 정한 피해자의 직접청구권이 포함되는지 여부 및 보험계약의 해석상 보험사고를 일으킨 자가 상법 제682조에서 정한 ‘제3자’가 아닌 ‘피보험자’에 해당하는 경우, 보험자가 보험사고자에게 보험자대위권을 행사할 수 있는지 여부 [2] 손해보험에서 보험의 목적물과 위험의 종류만 정해져 있고 피보험자와 피보험이익이 명확하지 않은 경우, 보험계약이 보험계약자 자신을 위한 것인지 타인을 위한 것인지 결정하는 방법 [3] 甲 아파트의 입주자대표회의가 乙 보험회사와 아파트 동 건물 및 부속건물, 부대설비, 아파트 세대 내 가재도구 등에 관하여 아파트종합보험계약을 체결하고, 丙 보험회사와 아파트 동 건물 및 부속건물에 대하여 재난배상책임보험계약을 체결하였는데, 甲 아파트에서 화재가 발생하여 발화세대의 건물 내부와 가재도구뿐 아니라 공용부분, 인근 세대의 건물 내부와 가재도구가 손상되자, 乙 회사가 공용부분과 피해세대에 대한 보험금을 지급한 다음, 丙 회사를 상대로 보험자대위권을 행사한 사안에서, 乙 회사 보험계약에서 발화세대 입주자는 피해세대의 전유부분과 공용부분, 가재도구 등에 대해서는 아무런 피보험이익을 가지지 않아 피보험자에 해당한다고 볼 수 없으므로, 피해세대 입주자들과의 관계에서 상법 제682조에서 정한 제3자에 해당하고, 丙 회사 보험계약에서 甲","url":"https://www.law.go.kr/precInfoP.do?precSeq=599671"},{"id":"P:609379","kind":"P","label":"2024다284289","title":"구상금","court":"대법원","date":"2024.12.24","caseType":"민사","basis":"참조조문","text":"[1] 채권양도에서 양도채권의 특정 정도 및 장래 발생할 채권이 양도의 대상이 되려면 양도 당시 특정이 가능하여야 하는지 여부 [2] 甲 아파트의 입주자대표회의가 구분소유자들로부터 채권양도에 의해 하자보수를 갈음하는 손해배상채권을 양수받았다며 甲 아파트를 신축, 분양한 乙 공사를 상대로 손해배상을 구하는 소를 제기하여 일부 승소판결을 선고받고 판결이 확정되었는데, 위 소송 진행 중 다수 세대의 스프링클러에서 소방수가 누수되어 천장 및 벽체의 마감재가 침수되는 사고가 발생하자, 丙 보험회사가 입주자대표회의와 체결한 보험계약에 따라 피해 세대 구분소유자들에게 보험금을 지급한 다음 乙 공사를 상대로 상법 제682조에 따라 피해 세대 구분소유자들의 위 사고에 대한 손해배상채권을 취득하였다며 손해배상금의 지급을 구한 사안에서, 위 사고가 발생하기 전에 채권양도가 이루어진 점 등 제반 사정에 비추어 피해 세대 구분소유자들의 위 사고에 대한 손해배상채권은 채권양도 당시 양도대상 채권으로 특정되었다거나 그 권리의 특정이 가능한 정도에 이른다고 보기 어려운데도, 위 손해배상채권이 입주자대표회의에 양도되었다고 보아 丙 회사의 청구를 기각한 원심판단에 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=609379"},{"id":"P:609413","kind":"P","label":"2024다271931","title":"부당이득반환등청구의소","court":"대법원","date":"2024.12.24","caseType":"민사","basis":"참조조문","text":"[1] 상법 제388조에서 정한 ‘이사의 보수’의 범위 및 위 조항이 강행규정인지 여부 [2] 주식의 소유가 실질적으로 분산되어 있는 주식회사에서 총 주식 대다수를 소유하고 있는 지배주주 1인이 실제의 소집절차와 결의절차를 거치지 아니한 채 주주총회의 결의가 있었던 것처럼 의사록을 허위로 작성한 경우, 그 주주총회의 결의가 존재하는 것으로 볼 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=609413"},{"id":"P:619205","kind":"P","label":"2023나71300","title":"구상금","court":"서울중앙지방법원","date":"2024.12.13","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619205"},{"id":"P:600567","kind":"P","label":"2022다200317","title":"채무부존재확인·보험금","court":"대법원","date":"2024.12.12","caseType":"민사","basis":"참조조문","text":"[1] 항소심에서 반소를 제기할 수 있는 경우로서 민사소송법 제412조 제1항에서 규정하고 있는 ‘상대방의 심급의 이익을 해할 우려가 없는 경우’의 의미 [2] 구 보험업법 제102조에 의한 손해배상책임에서 보험계약자에게 손해의 발생 또는 확대에 관하여 과실이 있거나 보험회사의 책임을 제한할 사유가 있는 경우, 배상책임의 범위를 정할 때 이를 참작하여야 하는지 여부 / 이때 과실상계 또는 책임제한 사유에 관한 사실인정이나 비율을 정하는 것이 사실심의 전권사항인지 여부 [3] 구 보험업법 제102조 제1항의 규정 취지 / 보험계약자와 보험수익자가 다른 타인을 위한 생명보험에서 보험설계사의 위법행위로 보험계약이 무효가 되거나 일정한 사고를 담보하지 못하여 보험계약자가 지정한 보험수익자에게 보험금이 지급되지 않은 경우, 구 보험업법 제102조 제1항에 따른 손해배상책임의 범위 [4] 甲이 乙 보험회사 소속 보험설계사인 丙의 권유에 따라 남편인 丁을 피보험자로, 丁의 법정상속인을 사망보험금의 수익자로 하는 보험계약을 체결하였고, 위 보험계약에는 이륜자동차 운전 중 상해 부담보특약이 포함되어 있었는데, 보험계약 체결 당시 乙 회사의 계열사의 협력사 직원으로 근무하던 丁이 이륜자동차를 운전하여 출근하던 중 발생한 교통사고에 의한 상해로 사망한 사안에서, 특약의 적용 범위 및 보험금 지급 여부를 결정짓는 중요사항인 보험금 지급요건 사실을 구체적으","url":"https://www.law.go.kr/precInfoP.do?precSeq=600567"},{"id":"P:609537","kind":"P","label":"2024나10738","title":"경업금지및손해배상","court":"대전고등법원","date":"2024.12.11","caseType":"민사","basis":"참조조문","text":"의사인 甲이 자신이 소유하는 건물 4층에서 정형외과 병원을 운영하다가 건강상의 이유로 병원을 운영하는 데 어려움이 있자 의사인 乙과 위 병원의 사업에 관한 일체의 권리와 의무를 포괄적으로 양도·양수하기로 하는 양도양수계약을 체결하였고, 동시에 건물 4층 등에 관하여는 임대차계약을 체결하였는데, 몇 년 후 甲이 건물 2층에 乙의 병원과 동종의 정형외과 의원을 개원하자 乙이 甲을 상대로 경업금지 및 손해배상을 구한 사안에서, 위 양도양수계약에 상법 제41조가 유추적용되거나 양도양수계약 과정에서 묵시적 경업금지약정이 이루어졌다고 보이므로, 甲은 영업양도일로부터 10년 동안 동일한 시에서 정형외과 의원 영업을 하거나 제3자로 하여금 하게 하여서는 아니 되고, 이를 위반하여 개설한 정형외과 의원의 영업을 폐지할 의무가 있으며, 경업금지 의무 위반 등에 따른 손해배상으로 乙의 병원 매출감소액 상당액과 임대차계약 종료 당시의 권리금 상당액을 지급할 의무가 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=609537"},{"id":"P:614479","kind":"P","label":"2024나10738","title":"경업금지및손해배상","court":"대전고등법원","date":"2024.12.11","caseType":"민사","basis":"참조조문","text":"의사인 甲이 자신이 소유하는 건물 4층에서 정형외과 병원을 운영하다가 건강상의 이유로 병원을 운영하는 데 어려움이 있자 의사인 乙과 위 병원의 사업에 관한 일체의 권리와 의무를 포괄적으로 양도·양수하기로 하는 양도양수계약을 체결하였고, 동시에 건물 4층 등에 관하여는 임대차계약을 체결하였는데, 몇 년 후 甲이 건물 2층에 乙의 병원과 동종의 정형외과 의원을 개원하자 乙이 甲을 상대로 경업금지 및 손해배상을 구한 사안에서, 위 양도양수계약에 상법 제41조가 유추적용되거나 양도양수계약 과정에서 묵시적 경업금지약정이 이루어졌다고 보이므로, 甲은 영업양도일로부터 10년 동안 동일한 시에서 정형외과 의원 영업을 하거나 제3자로 하여금 하게 하여서는 아니 되고, 이를 위반하여 개설한 정형외과 의원의 영업을 폐지할 의무가 있으며, 경업금지 의무 위반 등에 따른 손해배상으로 乙의 병원 매출감소액 상당액과 임대차계약 종료 당시의 권리금 상당액을 지급할 의무가 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=614479"},{"id":"P:421058","kind":"P","label":"2024누45971","title":"이 사건 카페를 별도의 영업장으로 보아 중과세한 이 사건 처분이 적법한 지 여부","court":"서울고등법원","date":"2024.11.29","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=421058"},{"id":"P:242125","kind":"P","label":"2022다238633","title":"보험금","court":"대법원","date":"2024.11.28","caseType":"민사","basis":"참조조문","text":"[1] 하나의 보험회사에 대하여 피보험자가 동일한 여러 개의 보험계약이 체결되어 있는 경우, 여러 개의 보험계약에 관하여 보험계약자 또는 피보험자가 위험변경증가 통지의무를 이행하였는지 판단하는 기준 및 이는 피보험자의 직업이나 직무에 따라 적용해야 할 보험요율에 차이가 있는 상해보험계약 약관에서 피보험자가 보험계약 체결 후 직업 또는 직무를 변경하는 경우 보험계약자나 피보험자가 보험자에게 그 사실을 알리도록 규정하고 있는 때에도 마찬가지인지 여부 [2] 甲이 乙 보험회사와 피보험자를 丙, 피보험자의 직업을 일반 경찰관으로 하는 상해보험계약을 체결한 상태에서 丙이 보험요율에 차이가 있는 화물차 운전기사로 직업을 변경하였고, 이후 甲이 乙 회사와 피보험자를 丙으로 하는 운전자 보험계약을 체결하면서 신규 발급된 운전자 보험증권에 丙의 직업이 일반 경찰관으로 기재되어 있음을 확인하자 운전자 보험계약 체결 관련 업무를 담당하는 보험설계사에게 丙의 직업 변경 사실을 통지하였는데, 그 후 丙이 교통사고로 상해를 입게 되어 甲이 乙 회사를 상대로 상해보험계약에 따른 보험금을 청구하자, 乙 회사가 보험약관에서 정한 계약 후 알릴 의무 위반을 이유로 보험금을 감액하여 지급한다고 통지한 사안에서, 甲이 보험설계사에게 丙의 직업 변경을 통지할 무렵 상해보험계약에 관하여도 乙 회사에 상법 제652조 또는 상해보험약관에서 정한 ‘위험의 변경 또는 증가’와 관","url":"https://www.law.go.kr/precInfoP.do?precSeq=242125"},{"id":"P:614369","kind":"P","label":"2024나7306","title":"구상금","court":"서울중앙지방법원","date":"2024.11.26","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=614369"},{"id":"P:241997","kind":"P","label":"2024다238392","title":"보험금","court":"대법원","date":"2024.11.14","caseType":"민사","basis":"참조조문","text":"[1] 보험계약자가 상법 제731조 제1항을 위반하여 타인의 신체 상해를 보험사고로 하는 보험계약을 체결하면서 보험계약 체결 시에 그 타인의 서면 동의를 얻지 않은 경우, 보험계약의 효력 및 피보험자의 서면 동의 없이 타인의 신체 상해를 보험사고로 하는 보험계약을 체결한 사람 스스로 보험계약의 무효를 주장하는 것이 신의성실의 원칙 또는 금반언의 원칙에 반하는지 여부 [2] 법원이 당사자의 변론재개신청을 받아들여 변론을 재개할 의무가 있는 예외적인 경우","url":"https://www.law.go.kr/precInfoP.do?precSeq=241997"},{"id":"P:605041","kind":"P","label":"2024다240784","title":"구상금","court":"대법원","date":"2024.10.31","caseType":"민사","basis":"참조조문","text":"책임보험계약 피보험자의 과실로 발생한 화재에 의하여 다수 피해자가 손해를 입었으나 책임보험 한도액이 다수 피해자의 손해 합계액에 미치지 못하는 경우, 피해자들이 책임보험자에 대하여 직접청구권을 행사하여 책임보험 한도액의 범위 내에서 각자 전보받지 못하고 남은 손해의 배상을 청구할 수 있는지 여부 및 피해자와 체결한 화재보험계약에 따라 보험금으로 그 피해자의 손해를 전부 보상한 화재보험자가 책임보험자에게 보험자대위로 직접청구를 하는 경우, 화재보험자는 직접청구권을 행사하는 다른 피해자들에 대한 책임보험금 지급이 이루어진 다음 책임보험 한도액에 남은 금액에 한하여 지급받을 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=605041"},{"id":"P:612693","kind":"P","label":"2023구합25536","title":"취득세 등 부과 처분 취소","court":"대구지방법원","date":"2024.10.31","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=612693"},{"id":"P:605893","kind":"P","label":"2023나18356","title":"손해배상(기)","court":"대구고등법원","date":"2024.10.30","caseType":"민사","basis":"판례내용","text":"약사인 甲이 약국 운영을 목적으로 상가건물 일부를 분양받으면서 ‘위 상가건물에 최소 내과 전문의 2명이 진료하는 연합내과가 입점한다.’는 설명을 듣고, 위 상가건물을 분양·임대하는 사업자 乙 주식회사와 분양계약을 체결하였으나, 실제로는 산부인과·내과 전문의 2인이 약 한 달간 병원을 운영하다가 폐업했고, 이에 약국 영업이 불가능해진 甲이 乙 회사 등을 상대로 기망 또는 착오를 이유로 분양계약 취소 및 분양대금 반환 등을 구한 사안에서, 甲이 분양계약 체결 과정에서 위 상가건물에 개원하는 의원의 규모나 전문의 구성, 운영기간 등을 오인함으로써 동기의 착오를 일으켰다고 인정되고, 나아가 甲의 위와 같은 동기는 위 분양계약 당시 乙 회사를 대리한 대표에게 표시되어 계약의 내용에 포섭되었으며, 만일 이러한 착오가 없었더라면 甲이나 일반인의 입장에서 위와 같은 내용으로 분양계약을 체결하지 않았을 것이라고 충분히 인정되므로, 민법 제109조 제1항에 따라 위 분양계약을 취소할 수 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=605893"},{"id":"P:618537","kind":"P","label":"2023나11283","title":"상표권침해금지등","court":"특허법원","date":"2024.10.28","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=618537"},{"id":"P:605213","kind":"P","label":"2023다258658","title":"손해배상","court":"대법원","date":"2024.10.25","caseType":"민사","basis":"참조조문","text":"[1] 계약교섭의 부당한 중도파기 또는 절차위반이 불법행위를 구성하는지 여부 및 이러한 불법행위로 인한 손해배상책임의 범위 / 계약교섭의 부당한 중도파기 또는 절차위반으로 인격적 법익이 침해된 경우, 이로 인한 정신적 고통에 대하여 별도의 손해배상을 구할 수 있는지 여부 [2] 甲 주식회사에 근무하던 중 대표이사 乙과 주식매수선택권 부여계약을 체결한 丙 등이 乙을 상대로 乙이 임시주주총회에서 주식매수선택권 조항을 정관에 추가하는 안건을 누락하고 丙 등에게 주식매수선택권을 부여하는 안건을 가결하는 내용의 임시주주총회 의사록을 위조하는 등 위 계약이 효력을 발생하기 위하여 필요한 절차를 게을리하였다며 정신적 고통에 따른 위자료를 청구한 사안에서, 丙 등과 乙의 관계, 주식매수선택권 제도의 성격, 배정된 주식 수, 위 계약의 체결 경위 등을 종합적으로 고려하면, 乙의 위와 같은 불법행위로 丙 등의 위 계약을 통한 주식 취득이라는 합리적인 기대 내지 丙 등 스스로 근로 여부를 선택할 자기결정권이 침해되었다고 볼 여지가 있고, 이러한 이익은 인격적 이익으로서 보호할 가치가 있으므로, 乙은 이로 인한 정신적 고통에 대하여 위자료를 지급할 의무가 있는데도, 이와 달리 보아 丙 등의 위자료 청구를 배척한 원심판단에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=605213"},{"id":"P:241885","kind":"P","label":"2024다233212","title":"분양대금반환","court":"대법원","date":"2024.10.25","caseType":"민사","basis":"판례내용","text":"가분채권의 일부분만을 청구채권으로 주장하여 가압류한 경우, 청구채권에 포함되지 않은 나머지 채권에 대하여도 시효중단의 효력이 발생하는지 여부 / 가압류 청구금액으로 채권의 원금만이 기재되어 있는 경우, 청구금액에 포함되지 않은 이자나 지연손해금 등 부대채권에 대하여 시효중단의 효력이 발생하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=241885"},{"id":"P:623945","kind":"P","label":"2023구합85123","title":"양도소득세부과처분취소","court":"서울행정법원","date":"2024.10.25","caseType":"세무","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=623945"},{"id":"P:613031","kind":"P","label":"2023구합22864","title":"법인세부과처분및소득금액변동통지취소청구","court":"부산지방법원","date":"2024.10.10","caseType":"세무","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=613031"},{"id":"P:605181","kind":"P","label":"2020다285697","title":"손해배상(기)","court":"대법원","date":"2024.10.08","caseType":"민사","basis":"참조조문","text":"[1] 임기를 정한 이사를 정당한 이유 없이 임기만료 전에 해임한 때에는 이사가 회사에 대하여 해임으로 인한 손해의 배상을 청구할 수 있다고 규정하고 있는 상법 제385조 제1항에서 정한 ‘이사의 임기를 정한 경우’의 의미 및 임기를 정하지 않은 경우, 이사의 임기의 최장기인 3년을 경과하지 않는 동안에 해임되었다면 그로 인한 손해의 배상을 청구할 수 있는지 여부 / 상법 제385조 제1항이 이사회가 대표이사를 해임하는 경우에 유추적용되는지 여부 [2] 甲이 乙 주식회사의 상임이사 및 대표이사로 선임된 후 대표이사의 임기만료 전에 주주총회의 결의를 통하여 상임이사 및 대표이사직에서 해임되자 乙 회사를 상대로 상법 제385조 제1항의 손해배상을 구한 사안에서, 대표이사 해임에 관하여는 상법 제385조 제1항이 적용되거나 유추적용될 수 없으므로 상임이사 해임에 관하여만 위 조항이 적용될 수 있는데, 乙 회사는 정관 또는 주주총회의 결의를 통해 상임이사의 임기를 정한 바가 없으므로 임기를 정하지 않은 상임이사의 지위에 있었던 甲이 그 지위에서 해임되었더라도 상법 제385조 제1항 단서에 따른 손해배상을 청구할 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=605181"},{"id":"P:241627","kind":"P","label":"2024다249729","title":"구상금[공동불법행위자 중 1인의 보험자가 보험자대위에 따라 취득한 구상금채권을 행사하는 경우 소멸시효기간이 문제된 사건]","court":"대법원","date":"2024.09.27","caseType":"민사","basis":"참조조문","text":"[1] 공동불법행위자 중 1인의 보험자가 피해자에게 손해배상금을 보험금으로 모두 지급하여 공동불법행위자들의 보험자들이 공동면책된 경우, 손해배상금을 지급한 보험자가 다른 공동불법행위자들의 보험자들이 부담하여야 할 부분에 대하여 직접 구상권을 행사할 수 있는지 여부 및 이 경우 구상금채권의 소멸시효기간 [2] 공동불법행위자 중 1인의 보험자가 피해자에게 손해배상금을 보험금으로 모두 지급함으로써 공동면책된 경우, 피보험자인 공동불법행위자가 다른 공동불법행위자들에 대하여 갖는 구상권을 상법 제724조 제2항에 따라 그들의 보험자들에게 직접 행사할 수 있는지 여부 및 손해배상금을 지급한 보험자가 상법 제682조의 보험자대위의 법리에 따라 자신의 피보험자가 다른 공동불법행위자들의 보험자들에 대하여 갖는 직접적인 구상권을 취득하여 그 보험자들에게 행사할 수 있는지 여부 / 이같이 보험자대위의 법리에 따라 취득한 구상권의 소멸시효기간 및 그 기산점 [3] 공동불법행위자 중 1인의 보험자가 피해자에게 손해배상금을 보험금으로 모두 지급한 경우, 위 보험자가 갖는 다른 공동불법행위자들의 보험자들에 대한 ‘구상권’과 상법 제682조에 따라 피보험자의 다른 공동불법행위
