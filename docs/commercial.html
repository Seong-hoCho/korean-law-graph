<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>상법 참조 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
/* Layout: 법 조문을 장(章) 순서대로 둥글게 놓은 '조문 바퀴' — 안쪽 원이 법, 그 바깥이 시행령, 가장 바깥이 판례·다른 법령. 넓은 화면은 오른쪽 패널, 좁은 화면은 아래 패널(선택 중에는 바닥 시트)에 선택한 조문의 연결 관계를 보여 준다. */
:root {
  --bg: #f2eee4;
  --surface: #fffdf7;
  --fg: #231f19;
  --muted: #675e51;
  --line: #dbd2c2;
  --law: #1f4b89;
  --decree: #b26b12;
  --prec: #8a3a6c;
  --rule: #2c8577;
  --ext: #7d7264;
  --cite: #3d7cb5;
  --sel: var(--fg); /* 선택·초점 표시는 따로 강조색을 두지 않고 먹색 */
  --font-display: "Nanum Myeongjo", "Noto Serif KR", "Batang", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16140f; --surface: #1f1c16; --fg: #ece6da; --muted: #a59c8c; --line: #353026;
    --law: #76a0db; --decree: #e3a14a; --prec: #d27fb2; --rule: #5cc2b1; --ext: #b3a898; --cite: #7fb2e3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16140f; --surface: #1f1c16; --fg: #ece6da; --muted: #a59c8c; --line: #353026;
  --law: #76a0db; --decree: #e3a14a; --prec: #d27fb2; --rule: #5cc2b1; --ext: #b3a898; --cite: #7fb2e3;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.55;
  word-break: keep-all; overflow-wrap: break-word;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 40px;
}
.wrap { max-width: 1440px; margin: 0 auto; display: grid; gap: 24px; }
header { display: grid; gap: 6px; }
.eyebrow { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(33px, 3.4vw, 46px); line-height: 1.2; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 70ch; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.stats b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

/* 넓은 화면은 패널을 그래프 왼쪽에, 좁은 화면은 문서 순서대로 그래프 아래에 */
.main { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 24px; align-items: start; }
.main > .panel { order: -1; }
@media (max-width: 960px) { .main { grid-template-columns: minmax(0, 1fr); } .main > .panel { order: 0; } }

.stage { background: var(--surface); border-radius: 2px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
/* 초점 표시: 바깥선 대신 상자 면 색 틈 + 먹색 반투명 고리 */
:root { --ring: 0 0 0 2px var(--surface), 0 0 0 4px color-mix(in srgb, var(--sel) 55%, transparent); --ease: 160ms cubic-bezier(.2, .7, .3, 1); }
:where(button, a, input, [tabindex]):focus-visible { outline: none; box-shadow: var(--ring); }

.search { position: relative; flex: 1 1 220px; min-width: 0; }
.search input { width: 100%; font: inherit; font-size: 13px; height: 36px; padding: 0 34px 0 34px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg);
  transition: border-color var(--ease), background-color var(--ease), box-shadow var(--ease); }
.search input::placeholder { color: var(--muted); }
.search input:hover { border-color: color-mix(in srgb, var(--muted) 55%, var(--line)); }
.search input:focus { background: var(--surface); border-color: var(--muted); }
.search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }
.search-icon { position: absolute; left: 11px; top: 18px; translate: 0 -50%; width: 15px; height: 15px; color: var(--muted); pointer-events: none; }
.search-clear { position: absolute; right: 5px; top: 18px; translate: 0 -50%; width: 26px; height: 26px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer;
  transition: background-color var(--ease), color var(--ease); }
.search-clear:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); color: var(--fg); }
.search-clear svg { width: 14px; height: 14px; }
/* 검색어가 없으면(placeholder가 보이면) 지우기 버튼을 숨긴다 */
.search input:placeholder-shown ~ .search-clear { display: none; }
.results { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 2px; max-height: 300px; overflow-y: auto; box-shadow: 0 8px 24px rgb(0 0 0 / .12); }
/* 연결 종류 칩: 켜지면 종류 색이 은은하게 깔리고, 꺼지면 테두리만 남는다 (--c는 HTML에서 종류마다 지정) */
.toggles { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; }
label.tog { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 10px; border: 1px solid var(--line); border-radius: 999px;
  color: var(--muted); background: transparent; cursor: pointer; user-select: none;
  transition: background-color var(--ease), border-color var(--ease), color var(--ease), box-shadow var(--ease); }
label.tog:hover { border-color: color-mix(in srgb, var(--c) 45%, var(--line)); color: var(--fg); }
label.tog input { position: absolute; inset: 0; margin: 0; opacity: 0; appearance: none; -webkit-appearance: none; cursor: pointer; border-radius: inherit; }
label.tog:has(input:checked) { color: var(--fg); background: color-mix(in srgb, var(--c) 13%, var(--surface)); border-color: color-mix(in srgb, var(--c) 50%, var(--line)); }
label.tog:has(input:checked):hover { background: color-mix(in srgb, var(--c) 20%, var(--surface)); }
label.tog:has(input:focus-visible) { box-shadow: var(--ring); }
label.tog input:focus-visible { box-shadow: none; }
.swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; background: var(--c); opacity: .35; transition: opacity var(--ease); }
label.tog:has(input:checked) .swatch { opacity: 1; }
/* :has를 모르는 브라우저는 체크박스를 그대로 보여 준다 */
@supports not selector(:has(*)) {
  label.tog input { position: static; opacity: 1; appearance: auto; -webkit-appearance: checkbox; accent-color: var(--fg); }
  .swatch { opacity: 1; }
}
.btn { font: inherit; font-size: 12.5px; padding: 6px 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 6px; cursor: pointer;
  transition: background-color var(--ease), border-color var(--ease), color var(--ease), box-shadow var(--ease); }
.btn:hover { border-color: var(--muted); background: color-mix(in srgb, var(--fg) 5%, var(--bg)); }
.btn:active { background: color-mix(in srgb, var(--fg) 9%, var(--bg)); }
.canvas { position: relative; }
.canvas .btn { position: absolute; top: 10px; right: 10px; z-index: 2; background: var(--surface); }
#cy { width: 100%; height: min(78vh, 820px); min-height: 440px; }
@media (max-width: 600px) {
  body { padding-block: 20px 32px; }
  .wrap, .main { gap: 16px; }
  h1 { font-size: 33px; }
  header { gap: 4px; }
  .lede { font-size: 13px; }
  .stats { font-size: 12.5px; gap: 2px 12px; }
  .toolbar { padding: 8px 10px; gap: 8px; }
  .toggles { gap: 4px 10px; }
  .swatch { width: 10px; }
  #cy { height: 70svh; min-height: 360px; }
  aside.panel { padding: 16px; }
}

aside.panel { background: var(--surface); border-radius: 2px; padding: 22px; display: grid; gap: 16px; min-width: 0; max-height: calc(min(78vh, 820px) + 63px); overflow-y: auto; }
@media (max-width: 960px) {
  aside.panel { max-height: none; }
  /* 선택 중에는 패널을 바닥 시트로 띄워, 그래프와 원문을 한 화면에서 본다 */
  aside.panel.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-height: 45svh; border-radius: 2px 2px 0 0; border-top: 1px solid var(--line);
    box-shadow: 0 -6px 24px rgb(0 0 0 / .16); padding: 14px max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  body.sheet-open { padding-bottom: calc(45svh + 32px); }
}
.panel h2 { font-family: var(--font-display); font-size: 22px; margin: 0; line-height: 1.25; text-wrap: balance; }
.panel h3 { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; margin: 0 0 6px; }
.kindtag { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
/* 종류 색(주황·청록 등)은 글자 대비가 모자라므로 테두리에만 쓰고 글자는 본문색 */
.chip { display: inline-flex; align-items: center; font-size: 11px; padding: 1px 7px; border-radius: 1px; border: 1px solid var(--k, currentColor); color: var(--fg); }
.lawtext { white-space: pre-wrap; font-size: 13px; line-height: 1.65; background: var(--bg); border-radius: 1px; padding: 10px 12px; max-height: 260px; overflow-y: auto; }
.list { display: grid; gap: 2px; }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: baseline; text-align: left; font: inherit; font-size: 13px; padding: 8px 6px; border: 0; background: none; color: var(--fg); border-radius: 1px; cursor: pointer; width: 100%; }
.item { transition: background-color var(--ease); }
.item:hover { background: var(--bg); }
.item:active { background: color-mix(in srgb, var(--fg) 7%, var(--bg)); }
/* 패널 빈 상태: 아무것도 선택하지 않았을 때 맨 위 안내 */
.empty { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 18px 12px 20px; border: 1px dashed var(--line); border-radius: 2px; color: var(--muted); }
.empty svg { width: 30px; height: 30px; color: var(--law); }
.empty p { margin: 0; font-size: 13px; max-width: 22em; text-wrap: balance; }
.item .no { font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.item .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 4px; border-radius: 1px; margin-top: 3px; grid-column: 2 / 4; }
.more { font-size: 12px; color: var(--muted); padding: 2px 6px; }
.note { font-size: 12.5px; color: var(--muted); }
a { color: var(--law); }
footer { font-size: 12.5px; color: var(--muted); display: grid; gap: 6px; max-width: 90ch; }
footer p { margin: 0; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1>상법 참조 지도</h1>
    <p class="lede">상법 조문을 장 순서대로 둥글게 놓고, 하위 법령 위임·조문 인용·판례 연결을 한 그림에 모았습니다. 조문이나 판례를 누르면 연결된 것만 남고 원문과 연결 목록이 나옵니다.</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="main">
    <section class="stage" aria-label="참조 그래프">
      <div class="toolbar">
        <div class="search">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="조문 번호·제목·사건번호 검색 (예: 17, 영 3, 국외 이전, 2023도)" autocomplete="off" aria-label="검색">
          <button class="search-clear" id="q-clear" type="button" aria-label="검색어 지우기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
          <div class="results" id="results" hidden></div>
        </div>
        <div class="toggles" role="group" aria-label="연결 종류">
          <label class="tog" style="--c:var(--decree)"><input type="checkbox" id="t-delegates" checked><span class="swatch"></span>위임</label>
          <label class="tog" style="--c:var(--cite)"><input type="checkbox" id="t-cites" checked><span class="swatch"></span>조문 인용</label>
          <label class="tog" style="--c:var(--prec)"><input type="checkbox" id="t-precedent" checked><span class="swatch"></span>판례</label>
          <label class="tog" style="--c:var(--ext)"><input type="checkbox" id="t-external"><span class="swatch"></span>다른 법령</label>
        </div>
      </div>
      <div class="canvas">
        <div id="cy"></div>
        <button class="btn" id="reset" type="button">전체 보기</button>
      </div>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>

  <footer id="foot"></footer>
</div>

<script>
const G = {"meta":{"main":"상법","tiers":{"L":{"name":"상법","efYd":"20260910","promul":"20250909"},"D":{"name":"상법 시행령","efYd":"20260723","promul":"20260721"}},"precedentsListed":1000,"precedentsTotal":5219,"precedentsUnavailable":314,"precedentsFrom":"2019.08.21","precedentBasis":{"참조조문":247,"판결요지":3,"판례내용":206,"없음":230},"source":"법제처 국가법령정보 공동활용 Open API (DRF)"},"nodes":[{"id":"L:1","label":"법 제1조","title":"상사적용법규","chapter":"제1편 총칙 제1장 통칙","deleted":false,"text":"제1조(상사적용법규) 상사에 관하여 본법에 규정이 없으면 상관습법에 의하고 상관습법이 없으면 민법의 규정에 의한다.","kind":"L"},{"id":"L:2","label":"법 제2조","title":"공법인의 상행위","chapter":"제1편 총칙 제1장 통칙","deleted":false,"text":"제2조(공법인의 상행위) 공법인의 상행위에 대하여는 법령에 다른 규정이 없는 경우에 한하여 본법을 적용한다.","kind":"L"},{"id":"L:3","label":"법 제3조","title":"일방적 상행위","chapter":"제1편 총칙 제1장 통칙","deleted":false,"text":"제3조(일방적 상행위) 당사자중 그 1인의 행위가 상행위인 때에는 전원에 대하여 본법을 적용한다.","kind":"L"},{"id":"L:4","label":"법 제4조","title":"상인-당연상인","chapter":"제1편 총칙 제2장 상인","deleted":false,"text":"제4조(상인-당연상인) 자기명의로 상행위를 하는 자를 상인이라 한다.","kind":"L"},{"id":"L:5","label":"법 제5조","title":"동전-의제상인","chapter":"제1편 총칙 제2장 상인","deleted":false,"text":"①점포 기타 유사한 설비에 의하여 상인적 방법으로 영업을 하는 자는 상행위를 하지 아니하더라도 상인으로 본다.\n②회사는 상행위를 하지 아니하더라도 전항과 같다.\n제5조(동전-의제상인)","kind":"L"},{"id":"L:6","label":"법 제6조","title":"미성년자의 영업과 등기","chapter":"제1편 총칙 제2장 상인","deleted":false,"text":"제6조(미성년자의 영업과 등기) 미성년자가 법정대리인의 허락을 얻어 영업을 하는 때에는 등기를 하여야 한다.","kind":"L"},{"id":"L:7","label":"법 제7조","title":"미성년자와 무한책임사원","chapter":"제1편 총칙 제2장 상인","deleted":false,"text":"제7조(미성년자와 무한책임사원) 미성년자가 법정대리인의 허락을 얻어 회사의 무한책임사원이 된 때에는 그 사원자격으로 인한 행위에는 능력자로 본다.","kind":"L"},{"id":"L:8","label":"법 제8조","title":"법정대리인에 의한 영업의 대리","chapter":"제1편 총칙 제2장 상인","deleted":false,"text":"① 법정대리인이 미성년자, 피한정후견인 또는 피성년후견인을 위하여 영업을 하는 때에는 등기를 하여야 한다. <개정 2018.9.18>\n②법정대리인의 대리권에 대한 제한은 선의의 제3자에게 대항하지 못한다.\n제8조(법정대리인에 의한 영업의 대리)","kind":"L"},{"id":"L:9","label":"법 제9조","title":"소상인","chapter":"제1편 총칙 제2장 상인","deleted":false,"text":"제9조(소상인) 지배인, 상호, 상업장부와 상업등기에 관한 규정은 소상인에게 적용하지 아니한다.","kind":"L"},{"id":"L:10","label":"법 제10조","title":"지배인의 선임","chapter":"제1편 총칙 제3장 상업사용인","deleted":false,"text":"제10조(지배인의 선임) 상인은 지배인을 선임하여 본점 또는 지점에서 영업을 하게 할 수 있다.","kind":"L"},{"id":"L:11","label":"법 제11조","title":"지배인의 대리권","chapter":"제1편 총칙 제3장 상업사용인","deleted":false,"text":"①지배인은 영업주에 갈음하여 그 영업에 관한 재판상 또는 재판외의 모든 행위를 할 수 있다.\n②지배인은 지배인이 아닌 점원 기타 사용인을 선임 또는 해임할 수 있다.\n③지배인의 대리권에 대한 제한은 선의의 제3자에게 대항하지 못한다.\n제11조(지배인의 대리권)","kind":"L"},{"id":"L:12","label":"법 제12조","title":"공동지배인","chapter":"제1편 총칙 제3장 상업사용인","deleted":false,"text":"①상인은 수인의 지배인에게 공동으로 대리권을 행사하게 할 수 있다.\n②전항의 경우에 지배인 1인에 대한 의사표시는 영업주에 대하여 그 효력이 있다.\n제12조(공동지배인)","kind":"L"},{"id":"L:13","label":"법 제13조","title":"지배인의 등기","chapter":"제1편 총칙 제3장 상업사용인","deleted":false,"text":"제13조(지배인의 등기) 상인은 지배인의 선임과 그 대리권의 소멸에 관하여 영업소(회사의 경우 본점을 말한다)의 소재지에서 등기하여야 한다. 제12조제1항에서 규정한 사항을 등기하는 경우와 그 사항을 변경하는 경우에도 같다.","kind":"L"},{"id":"L:14","label":"법 제14조","title":"표현지배인","chapter":"제1편 총칙 제3장 상업사용인","deleted":false,"text":"① 본점 또는 지점의 본부장, 지점장, 그 밖에 지배인으로 인정될 만한 명칭을 사용하는 자는 본점 또는 지점의 지배인과 동일한 권한이 있는 것으로 본다. 다만, 재판상 행위에 관하여는 그러하지 아니하다.\n② 제1항은 상대방이 악의인 경우에는 적용하지 아니한다.\n제14조(표현지배인)","kind":"L"},{"id":"L:15","label":"법 제15조","title":"부분적 포괄대리권을 가진 사용인","chapter":"제1편 총칙 제3장 상업사용인","deleted":false,"text":"①영업의 특정한 종류 또는 특정한 사항에 대한 위임을 받은 사용인은 이에 관한 재판외의 모든 행위를 할 수 있다.\n②제11조제3항의 규정은 전항의 경우에 준용한다.\n제15조(부분적 포괄대리권을 가진 사용인)","kind":"L"},{"id":"L:16","label":"법 제16조","title":"물건판매점포의 사용인","chapter":"제1편 총칙 제3장 상업사용인","deleted":false,"text":"①물건을 판매하는 점포의 사용인은 그 판매에 관한 모든 권한이 있는 것으로 본다.\n②제14조제2항의 규정은 전항의 경우에 준용한다.\n제16조(물건판매점포의 사용인)","kind":"L"},{"id":"L:17","label":"법 제17조","title":"상업사용인의 의무","chapter":"제1편 총칙 제3장 상업사용인","deleted":false,"text":"①상업사용인은 영업주의 허락없이 자기 또는 제3자의 계산으로 영업주의 영업부류에 속한 거래를 하거나 회사의 무한책임사원, 이사 또는 다른 상인의 사용인이 되지 못한다.\n②상업사용인이 전항의 규정에 위반하여 거래를 한 경우에 그 거래가 자기의 계산으로 한 것인 때에는 영업주는 이를 영업주의 계산으로 한 것으로 볼 수 있고 제3자의 계산으로 한 것인 때에는 영업주는 사용인에 대하여 이로 인한 이득의 양도를 청구할 수 있다. <개정 1962.12.12>\n③전항의 규정은 영업주로부터 사용인에 대한 계약의 해지 또는 손해배상의 청구에 영향을 미치지 아니한다.\n④제2항에 규정한 권리는 영업주가 그 거래를 안 날로부터 2주간을 경과하거나 그 거래가 있은 날로부터 1년을 경과하면 소멸한다.\n제17조(상업사용인의 의무)","kind":"L"},{"id":"L:18","label":"법 제18조","title":"상호선정의 자유","chapter":"제1편 총칙 제4장 상호","deleted":false,"text":"제18조(상호선정의 자유) 상인은 그 성명 기타의 명칭으로 상호를 정할 수 있다.","kind":"L"},{"id":"L:19","label":"법 제19조","title":"회사의 상호","chapter":"제1편 총칙 제4장 상호","deleted":false,"text":"제19조(회사의 상호) 회사의 상호에는 그 종류에 따라 합명회사, 합자회사, 유한책임회사, 주식회사 또는 유한회사의 문자를 사용하여야 한다.","kind":"L"},{"id":"L:20","label":"법 제20조","title":"회사상호의 부당사용의 금지","chapter":"제1편 총칙 제4장 상호","deleted":false,"text":"제20조(회사상호의 부당사용의 금지) 회사가 아니면 상호에 회사임을 표시하는 문자를 사용하지 못한다. 회사의 영업을 양수한 경우에도 같다.","kind":"L"},{"id":"L:21","label":"법 제21조","title":"상호의 단일성","chapter":"제1편 총칙 제4장 상호","deleted":false,"text":"①동일한 영업에는 단일상호를 사용하여야 한다.\n②지점의 상호에는 본점과의 종속관계를 표시하여야 한다.\n제21조(상호의 단일성)","kind":"L"},{"id":"L:22","label":"법 제22조","title":"상호등기의 효력","chapter":"제1편 총칙 제4장 상호","deleted":false,"text":"제22조(상호등기의 효력) 타인이 등기한 상호는 동일한 특별시ㆍ광역시ㆍ시ㆍ군에서 동종영업의 상호로 등기하지 못한다. <개정 1984.4.10, 1994.12.22, 1995.12.29>","kind":"L"},{"id":"L:22-2","label":"법 제22조의2","title":"상호의 가등기","chapter":"제1편 총칙 제4장 상호","deleted":false,"text":"①유한책임회사, 주식회사 또는 유한회사를 설립하고자 할 때에는 본점의 소재지를 관할하는 등기소에 상호의 가등기를 신청할 수 있다. <개정 2020.6.9>\n②회사는 상호나 목적 또는 상호와 목적을 변경하고자 할 때에는 본점의 소재지를 관할하는 등기소에 상호의 가등기를 신청할 수 있다.\n③회사는 본점을 이전하고자 할 때에는 이전할 곳을 관할하는 등기소에 상호의 가등기를 신청할 수 있다.\n④상호의 가등기는 제22조의 적용에 있어서는 상호의 등기로 본다.\n⑤ 삭제 <2007.8.3>\n제22조의2(상호의 가등기)","kind":"L"},{"id":"L:23","label":"법 제23조","title":"주체를 오인시킬 상호의 사용금지","chapter":"제1편 총칙 제4장 상호","deleted":false,"text":"①누구든지 부정한 목적으로 타인의 영업으로 오인할 수 있는 상호를 사용하지 못한다.\n②제1항의 규정에 위반하여 상호를 사용하는 자가 있는 경우에 이로 인하여 손해를 받을 염려가 있는 자 또는 상호를 등기한 자는 그 폐지를 청구할 수 있다. <개정 1984.4.10>\n③제2항의 규정은 손해배상의 청구에 영향을 미치지 아니한다. <개정 1984.4.10>\n④동일한 특별시ㆍ광역시ㆍ시ㆍ군에서 동종영업으로 타인이 등기한 상호를 사용하는 자는 부정한 목적으로 사용하는 것으로 추정한다. <개정 1984.4.10, 1994.12.22, 1995.12.29>\n제23조(주체를 오인시킬 상호의 사용금지)","kind":"L"},{"id":"L:24","label":"법 제24조","title":"명의대여자의 책임","chapter":"제1편 총칙 제4장 상호","deleted":false,"text":"제24조(명의대여자의 책임) 타인에게 자기의 성명 또는 상호를 사용하여 영업을 할 것을 허락한 자는 자기를 영업주로 오인하여 거래한 제3자에 대하여 그 타인과 연대하여 변제할 책임이 있다.","kind":"L"},{"id":"L:25","label":"법 제25조","title":"상호의 양도","chapter":"제1편 총칙 제4장 상호","deleted":false,"text":"①상호는 영업을 폐지하거나 영업과 함께 하는 경우에 한하여 이를 양도할 수 있다.\n②상호의 양도는 등기하지 아니하면 제3자에게 대항하지 못한다.\n제25조(상호의 양도)","kind":"L"},{"id":"L:26","label":"법 제26조","title":"상호불사용의 효과","chapter":"제1편 총칙 제4장 상호","deleted":false,"text":"제26조(상호불사용의 효과) 상호를 등기한 자가 정당한 사유없이 2년간 상호를 사용하지 아니하는 때에는 이를 폐지한 것으로 본다.","kind":"L"},{"id":"L:27","label":"법 제27조","title":"상호등기의 말소청구","chapter":"제1편 총칙 제4장 상호","deleted":false,"text":"제27조(상호등기의 말소청구) 상호를 변경 또는 폐지한 경우에 2주간내에 그 상호를 등기한 자가 변경 또는 폐지의 등기를 하지 아니하는 때에는 이해관계인은 그 등기의 말소를 청구할 수 있다.","kind":"L"},{"id":"L:28","label":"법 제28조","title":"상호 부정사용에 대한 제재","chapter":"제1편 총칙 제4장 상호","deleted":false,"text":"제28조(상호 부정사용에 대한 제재) 제20조와 제23조제1항에 위반한 자는 200만원 이하의 과태료에 처한다. <개정 1984.4.10, 1995.12.29>","kind":"L"},{"id":"L:29","label":"법 제29조","title":"상업장부의 종류ㆍ작성원칙","chapter":"제1편 총칙 제5장 상업장부","deleted":false,"text":"①상인은 영업상의 재산 및 손익의 상황을 명백히 하기 위하여 회계장부 및 대차대조표를 작성하여야 한다.\n②상업장부의 작성에 관하여 이 법에 규정한 것을 제외하고는 일반적으로 공정ㆍ타당한 회계관행에 의한다.\n제29조(상업장부의 종류ㆍ작성원칙)","kind":"L"},{"id":"L:30","label":"법 제30조","title":"상업장부의 작성방법","chapter":"제1편 총칙 제5장 상업장부","deleted":false,"text":"①회계장부에는 거래와 기타 영업상의 재산에 영향이 있는 사항을 기재하여야 한다.\n②상인은 영업을 개시한 때와 매년 1회 이상 일정시기에, 회사는 성립한 때와 매 결산기에 회계장부에 의하여 대차대조표를 작성하고, 작성자가 이에 기명날인 또는 서명하여야 한다. <개정 1995.12.29>\n제30조(상업장부의 작성방법)","kind":"L"},{"id":"L:31","label":"법 제31조","title":"","chapter":"제1편 총칙 제5장 상업장부","deleted":true,"text":"제31조 삭제 <2010.5.14>","kind":"L"},{"id":"L:32","label":"법 제32조","title":"상업장부의 제출","chapter":"제1편 총칙 제5장 상업장부","deleted":false,"text":"제32조(상업장부의 제출) 법원은 신청에 의하여 또는 직권으로 소송당사자에게 상업장부 또는 그 일부분의 제출을 명할 수 있다.","kind":"L"},{"id":"L:33","label":"법 제33조","title":"상업장부등의 보존","chapter":"제1편 총칙 제5장 상업장부","deleted":false,"text":"①상인은 10년간 상업장부와 영업에 관한 중요서류를 보존하여야 한다. 다만, 전표 또는 이와 유사한 서류는 5년간 이를 보존하여야 한다. <개정 1995.12.29>\n②전항의 기간은 상업장부에 있어서는 그 폐쇄한 날로부터 기산한다.\n③제1항의 장부와 서류는 마이크로필름 기타의 전산정보처리조직에 의하여 이를 보존할 수 있다. <신설 1995.12.29>\n④제3항의 규정에 의하여 장부와 서류를 보존하는 경우 그 보존방법 기타 필요한 사항은 대통령령으로 정한다. <신설 1995.12.29>\n제33조(상업장부등의 보존)","kind":"L"},{"id":"L:34","label":"법 제34조","title":"통칙","chapter":"제1편 총칙 제6장 상업등기","deleted":false,"text":"제34조(통칙) 이 법에 따라 등기할 사항은 당사자의 신청에 의하여 영업소(회사의 경우 본점을 말한다)의 소재지를 관할하는 법원의 상업등기부에 등기한다. <개정 2024.9.20>","kind":"L"},{"id":"L:34-2","label":"법 제34조의2","title":"","chapter":"제1편 총칙 제6장 상업등기","deleted":true,"text":"제34조의2 삭제 <2007.8.3>","kind":"L"},{"id":"L:35","label":"법 제35조","title":"","chapter":"제1편 총칙 제6장 상업등기","deleted":true,"text":"제35조 삭제 <2024.9.20>","kind":"L"},{"id":"L:36","label":"법 제36조","title":"","chapter":"제1편 총칙 제6장 상업등기","deleted":true,"text":"제36조 삭제 <1995.12.29>","kind":"L"},{"id":"L:37","label":"법 제37조","title":"등기의 효력","chapter":"제1편 총칙 제6장 상업등기","deleted":false,"text":"①등기할 사항은 이를 등기하지 아니하면 선의의 제3자에게 대항하지 못한다.\n②등기한 후라도 제3자가 정당한 사유로 인하여 이를 알지 못한 때에는 제1항과 같다.\n제37조(등기의 효력)","kind":"L"},{"id":"L:38","label":"법 제38조","title":"","chapter":"제1편 총칙 제6장 상업등기","deleted":true,"text":"제38조 삭제 <2024.9.20>","kind":"L"},{"id":"L:39","label":"법 제39조","title":"부실의 등기","chapter":"제1편 총칙 제6장 상업등기","deleted":false,"text":"제39조(부실의 등기) 고의 또는 과실로 인하여 사실과 상위한 사항을 등기한 자는 그 상위를 선의의 제3자에게 대항하지 못한다.","kind":"L"},{"id":"L:40","label":"법 제40조","title":"변경, 소멸의 등기","chapter":"제1편 총칙 제6장 상업등기","deleted":false,"text":"제40조(변경, 소멸의 등기) 등기한 사항에 변경이 있거나 그 사항이 소멸한 때에는 당사자는 지체없이 변경 또는 소멸의 등기를 하여야 한다.","kind":"L"},{"id":"L:41","label":"법 제41조","title":"영업양도인의 경업금지","chapter":"제1편 총칙 제7장 영업양도","deleted":false,"text":"①영업을 양도한 경우에 다른 약정이 없으면 양도인은 10년간 동일한 특별시ㆍ광역시ㆍ시ㆍ군과 인접 특별시ㆍ광역시ㆍ시ㆍ군에서 동종영업을 하지 못한다. <개정 1984.4.10, 1994.12.22, 1995.12.29>\n②양도인이 동종영업을 하지 아니할 것을 약정한 때에는 동일한 특별시ㆍ광역시ㆍ시ㆍ군과 인접 특별시ㆍ광역시ㆍ시ㆍ군에 한하여 20년을 초과하지 아니한 범위내에서 그 효력이 있다. <개정 1984.4.10, 1994.12.22, 1995.12.29>\n제41조(영업양도인의 경업금지)","kind":"L"},{"id":"L:42","label":"법 제42조","title":"상호를 속용하는 양수인의 책임","chapter":"제1편 총칙 제7장 영업양도","deleted":false,"text":"①영업양수인이 양도인의 상호를 계속사용하는 경우에는 양도인의 영업으로 인한 제3자의 채권에 대하여 양수인도 변제할 책임이 있다.\n②전항의 규정은 양수인이 영업양도를 받은 후 지체없이 양도인의 채무에 대한 책임이 없음을 등기한 때에는 적용하지 아니한다. 양도인과 양수인이 지체없이 제3자에 대하여 그 뜻을 통지한 경우에 그 통지를 받은 제3자에 대하여도 같다.\n제42조(상호를 속용하는 양수인의 책임)","kind":"L"},{"id":"L:43","label":"법 제43조","title":"영업양수인에 대한 변제","chapter":"제1편 총칙 제7장 영업양도","deleted":false,"text":"제43조(영업양수인에 대한 변제) 전조제1항의 경우에 양도인의 영업으로 인한 채권에 대하여 채무자가 선의이며 중대한 과실없이 양수인에게 변제한 때에는 그 효력이 있다.","kind":"L"},{"id":"L:44","label":"법 제44조","title":"채무인수를 광고한 양수인의 책임","chapter":"제1편 총칙 제7장 영업양도","deleted":false,"text":"제44조(채무인수를 광고한 양수인의 책임) 영업양수인이 양도인의 상호를 계속사용하지 아니하는 경우에 양도인의 영업으로 인한 채무를 인수한 것을 광고한 때에는 양수인도 변제할 책임이 있다.","kind":"L"},{"id":"L:45","label":"법 제45조","title":"영업양도인의 책임의 존속기간","chapter":"제1편 총칙 제7장 영업양도","deleted":false,"text":"제45조(영업양도인의 책임의 존속기간) 영업양수인이 제42조제1항 또는 전조의 규정에 의하여 변제의 책임이 있는 경우에는 양도인의 제3자에 대한 채무는 영업양도 또는 광고후 2년이 경과하면 소멸한다.","kind":"L"},{"id":"L:46","label":"법 제46조","title":"기본적 상행위","chapter":"제2편 상행위 제1장 통칙","deleted":false,"text":"1. 동산, 부동산, 유가증권 기타의 재산의 매매\n2. 동산, 부동산, 유가증권 기타의 재산의 임대차\n3. 제조, 가공 또는 수선에 관한 행위\n4. 전기, 전파, 가스 또는 물의 공급에 관한 행위\n5. 작업 또는 노무의 도급의 인수\n6. 출판, 인쇄 또는 촬영에 관한 행위\n7. 광고, 통신 또는 정보에 관한 행위\n8. 수신ㆍ여신ㆍ환 기타의 금융거래\n9. 공중(公衆)이 이용하는 시설에 의한 거래\n10. 상행위의 대리의 인수\n11. 중개에 관한 행위\n12. 위탁매매 기타의 주선에 관한 행위\n13. 운송의 인수\n14. 임치의 인수\n15. 신탁의 인수\n16. 상호부금 기타 이와 유사한 행위\n17. 보험\n18. 광물 또는 토석의 채취에 관한 행위\n19. 기계, 시설, 그 밖의 재산의 금융리스에 관한 행위\n20. 상호ㆍ상표 등의 사용허락에 의한 영업에 관한 행위\n21. 영업상 채권의 매입ㆍ회수 등에 관한 행위\n22. 신용카드, 전자화폐 등을 이용한 지급결제 업무의 인수\n제46조(기본적 상행위) 영업으로 하는 다음의 행위를 상행위라 한다. 그러나 오로지 임금을 받을 목적으로 물건을 제조하거나 노무에 종사하는 자의 행위는 그러하지 아니하다. <개정 1995.12.29, 2010.5.14>","kind":"L"},{"id":"L:47","label":"법 제47조","title":"보조적 상행위","chapter":"제2편 상행위 제1장 통칙","deleted":false,"text":"①상인이 영업을 위하여 하는 행위는 상행위로 본다.\n②상인의 행위는 영업을 위하여 하는 것으로 추정한다.\n제47조(보조적 상행위)","kind":"L"},{"id":"L:48","label":"법 제48조","title":"대리의 방식","chapter":"제2편 상행위 제1장 통칙","deleted":false,"text":"제48조(대리의 방식) 상행위의 대리인이 본인을 위한 것임을 표시하지 아니하여도 그 행위는 본인에 대하여 효력이 있다. 그러나 상대방이 본인을 위한 것임을 알지 못한 때에는 대리인에 대하여도 이행의 청구를 할 수 있다.","kind":"L"},{"id":"L:49","label":"법 제49조","title":"위임","chapter":"제2편 상행위 제1장 통칙","deleted":false,"text":"제49조(위임) 상행위의 위임을 받은 자는 위임의 본지에 반하지 아니한 범위내에서 위임을 받지 아니한 행위를 할 수 있다.","kind":"L"},{"id":"L:50","label":"법 제50조","title":"대리권의 존속","chapter":"제2편 상행위 제1장 통칙","deleted":false,"text":"제50조(대리권의 존속) 상인이 그 영업에 관하여 수여한 대리권은 본인의 사망으로 인하여 소멸하지 아니한다.","kind":"L"},{"id":"L:51","label":"법 제51조","title":"대화자간의 청약의 구속력","chapter":"제2편 상행위 제1장 통칙","deleted":false,"text":"제51조(대화자간의 청약의 구속력) 대화자간의 계약의 청약은 상대방이 즉시 승낙하지 아니한 때에는 그 효력을 잃는다.","kind":"L"},{"id":"L:52","label":"법 제52조","title":"","chapter":"제2편 상행위 제1장 통칙","deleted":true,"text":"제52조 삭제 <2010.5.14>","kind":"L"},{"id":"L:53","label":"법 제53조","title":"청약에 대한 낙부통지의무","chapter":"제2편 상행위 제1장 통칙","deleted":false,"text":"제53조(청약에 대한 낙부통지의무) 상인이 상시 거래관계에 있는 자로부터 그 영업부류에 속한 계약의 청약을 받은 때에는 지체없이 낙부의 통지를 발송하여야 한다. 이를 해태한 때에는 승낙한 것으로 본다.","kind":"L"},{"id":"L:54","label":"법 제54조","title":"상사법정이율","chapter":"제2편 상행위 제1장 통칙","deleted":false,"text":"제54조(상사법정이율) 상행위로 인한 채무의 법정이율은 연 6분으로 한다. <개정 1962.12.12>","kind":"L"},{"id":"L:55","label":"법 제55조","title":"법정이자청구권","chapter":"제2편 상행위 제1장 통칙","deleted":false,"text":"① 상인이 그 영업에 관하여 금전을 대여한 경우에는 법정이자를 청구할 수 있다.\n② 상인이 그 영업범위 내에서 타인을 위하여 금전을 체당(替當)하였을 때에는 체당한 날 이후의 법정이자를 청구할 수 있다.\n제55조(법정이자청구권)","kind":"L"},{"id":"L:56","label":"법 제56조","title":"지점거래의 채무이행장소","chapter":"제2편 상행위 제1장 통칙","deleted":false,"text":"제56조(지점거래의 채무이행장소) 채권자의 지점에서의 거래로 인한 채무이행의 장소가 그 행위의 성질 또는 당사자의 의사표시에 의하여 특정되지 아니한 경우 특정물 인도 외의 채무이행은 그 지점을 이행장소로 본다.","kind":"L"},{"id":"L:57","label":"법 제57조","title":"다수채무자간 또는 채무자와 보증인의 연대","chapter":"제2편 상행위 제1장 통칙","deleted":false,"text":"①수인이 그 1인 또는 전원에게 상행위가 되는 행위로 인하여 채무를 부담한 때에는 연대하여 변제할 책임이 있다.\n②보증인이 있는 경우에 그 보증이 상행위이거나 주채무가 상행위로 인한 것인 때에는 주채무자와 보증인은 연대하여 변제할 책임이 있다.\n제57조(다수채무자간 또는 채무자와 보증인의 연대)","kind":"L"},{"id":"L:58","label":"법 제58조","title":"상사유치권","chapter":"제2편 상행위 제1장 통칙","deleted":false,"text":"제58조(상사유치권) 상인간의 상행위로 인한 채권이 변제기에 있는 때에는 채권자는 변제를 받을 때까지 그 채무자에 대한 상행위로 인하여 자기가 점유하고 있는 채무자소유의 물건 또는 유가증권을 유치할 수 있다. 그러나 당사자간에 다른 약정이 있으면 그러하지 아니하다.","kind":"L"},{"id":"L:59","label":"법 제59조","title":"유질계약의 허용","chapter":"제2편 상행위 제1장 통칙","deleted":false,"text":"제59조(유질계약의 허용) 민법 제339조의 규정은 상행위로 인하여 생긴 채권을 담보하기 위하여 설정한 질권에는 적용하지 아니한다.","kind":"L"},{"id":"L:60","label":"법 제60조","title":"물건보관의무","chapter":"제2편 상행위 제1장 통칙","deleted":false,"text":"제60조(물건보관의무) 상인이 그 영업부류에 속한 계약의 청약을 받은 경우에 견품 기타의 물건을 받은 때에는 그 청약을 거절한 때에도 청약자의 비용으로 그 물건을 보관하여야 한다. 그러나 그 물건의 가액이 보관의 비용을 상환하기에 부족하거나 보관으로 인하여 손해를 받을 염려가 있는 때에는 그러하지 아니하다.","kind":"L"},{"id":"L:61","label":"법 제61조","title":"상인의 보수청구권","chapter":"제2편 상행위 제1장 통칙","deleted":false,"text":"제61조(상인의 보수청구권) 상인이 그 영업범위내에서 타인을 위하여 행위를 한 때에는 이에 대하여 상당한 보수를 청구할 수 있다.","kind":"L"},{"id":"L:62","label":"법 제62조","title":"임치를 받은 상인의 책임","chapter":"제2편 상행위 제1장 통칙","deleted":false,"text":"제62조(임치를 받은 상인의 책임) 상인이 그 영업범위내에서 물건의 임치를 받은 경우에는 보수를 받지 아니하는 때에도 선량한 관리자의 주의를 하여야 한다.","kind":"L"},{"id":"L:63","label":"법 제63조","title":"거래시간과 이행 또는 그 청구","chapter":"제2편 상행위 제1장 통칙","deleted":false,"text":"제63조(거래시간과 이행 또는 그 청구) 법령 또는 관습에 의하여 영업시간이 정하여져 있는 때에는 채무의 이행 또는 이행의 청구는 그 시간내에 하여야 한다.","kind":"L"},{"id":"L:64","label":"법 제64조","title":"상사시효","chapter":"제2편 상행위 제1장 통칙","deleted":false,"text":"제64조(상사시효) 상행위로 인한 채권은 본법에 다른 규정이 없는 때에는 5년간 행사하지 아니하면 소멸시효가 완성한다. 그러나 다른 법령에 이보다 단기의 시효의 규정이 있는 때에는 그 규정에 의한다.","kind":"L"},{"id":"L:65","label":"법 제65조","title":"유가증권과 준용규정","chapter":"제2편 상행위 제1장 통칙","deleted":false,"text":"① 금전의 지급청구권, 물건 또는 유가증권의 인도청구권이나 사원의 지위를 표시하는 유가증권에 대하여는 다른 법률에 특별한 규정이 없으면 「민법」 제508조부터 제525조까지의 규정을 적용하는 외에 「어음법」 제12조제1항 및 제2항을 준용한다.\n② 제1항의 유가증권으로서 그 권리의 발생ㆍ변경ㆍ소멸을 전자등록하는 데에 적합한 유가증권은 제356조의2제1항의 전자등록기관의 전자등록부에 등록하여 발행할 수 있다. 이 경우 제356조의2제2항부터 제4항까지의 규정을 준용한다. <개정 2016.3.22>\n제65조(유가증권과 준용규정)","kind":"L"},{"id":"L:66","label":"법 제66조","title":"준상행위","chapter":"제2편 상행위 제1장 통칙","deleted":false,"text":"제66조(준상행위) 본장의 규정은 제5조의 규정에 의한 상인의 행위에 준용한다.","kind":"L"},{"id":"L:67","label":"법 제67조","title":"매도인의 목적물의 공탁, 경매권","chapter":"제2편 상행위 제2장 매매","deleted":false,"text":"①상인간의 매매에 있어서 매수인이 목적물의 수령을 거부하거나 이를 수령할 수 없는 때에는 매도인은 그 물건을 공탁하거나 상당한 기간을 정하여 최고한 후 경매할 수 있다. 이 경우에는 지체없이 매수인에 대하여 그 통지를 발송하여야 한다.\n②전항의 경우에 매수인에 대하여 최고를 할 수 없거나 목적물이 멸실 또는 훼손될 염려가 있는 때에는 최고없이 경매할 수 있다.\n③전2항의 규정에 의하여 매도인이 그 목적물을 경매한 때에는 그 대금에서 경매비용을 공제한 잔액을 공탁하여야 한다. 그러나 그 전부나 일부를 매매대금에 충당할 수 있다.\n제67조(매도인의 목적물의 공탁, 경매권)","kind":"L"},{"id":"L:68","label":"법 제68조","title":"확정기매매의 해제","chapter":"제2편 상행위 제2장 매매","deleted":false,"text":"제68조(확정기매매의 해제) 상인간의 매매에 있어서 매매의 성질 또는 당사자의 의사표시에 의하여 일정한 일시 또는 일정한 기간내에 이행하지 아니하면 계약의 목적을 달성할 수 없는 경우에 당사자의 일방이 이행시기를 경과한 때에는 상대방은 즉시 그 이행을 청구하지 아니하면 계약을 해제한 것으로 본다.","kind":"L"},{"id":"L:69","label":"법 제69조","title":"매수인의 목적물의 검사와 하자통지의무","chapter":"제2편 상행위 제2장 매매","deleted":false,"text":"①상인간의 매매에 있어서 매수인이 목적물을 수령한 때에는 지체없이 이를 검사하여야 하며 하자 또는 수량의 부족을 발견한 경우에는 즉시 매도인에게 그 통지를 발송하지 아니하면 이로 인한 계약해제, 대금감액 또는 손해배상을 청구하지 못한다. 매매의 목적물에 즉시 발견할 수 없는 하자가 있는 경우에 매수인이 6월내에 이를 발견한 때에도 같다.\n②전항의 규정은 매도인이 악의인 경우에는 적용하지 아니한다.\n제69조(매수인의 목적물의 검사와 하자통지의무)","kind":"L"},{"id":"L:70","label":"법 제70조","title":"매수인의 목적물보관, 공탁의무","chapter":"제2편 상행위 제2장 매매","deleted":false,"text":"①제69조의 경우에 매수인이 계약을 해제한 때에도 매도인의 비용으로 매매의 목적물을 보관 또는 공탁하여야 한다. 그러나 그 목적물이 멸실 또는 훼손될 염려가 있는 때에는 법원의 허가를 얻어 경매하여 그 대가를 보관 또는 공탁하여야 한다. <개정 1984.4.10>\n②제1항의 규정에 의하여 매수인이 경매한 때에는 지체없이 매도인에게 그 통지를 발송하여야 한다. <개정 1984.4.10>\n③제1항 및 제2항의 규정은 목적물의 인도장소가 매도인의 영업소 또는 주소와 동일한 특별시ㆍ광역시ㆍ시ㆍ군에 있는 때에는 이를 적용하지 아니한다. <개정 1995.12.29>\n제70조(매수인의 목적물보관, 공탁의무)","kind":"L"},{"id":"L:71","label":"법 제71조","title":"동전-수량초과 등의 경우","chapter":"제2편 상행위 제2장 매매","deleted":false,"text":"제71조(동전-수량초과 등의 경우) 전조의 규정은 매도인으로부터 매수인에게 인도한 물건이 매매의 목적물과 상위하거나 수량이 초과한 경우에 그 상위 또는 초과한 부분에 대하여 준용한다.","kind":"L"},{"id":"L:72","label":"법 제72조","title":"의의","chapter":"제2편 상행위 제3장 상호계산","deleted":false,"text":"제72조(의의) 상호계산은 상인간 또는 상인과 비상인간에 상시 거래관계가 있는 경우에 일정한 기간의 거래로 인한 채권채무의 총액에 관하여 상계하고 그 잔액을 지급할 것을 약정함으로써 그 효력이 생긴다.","kind":"L"},{"id":"L:73","label":"법 제73조","title":"상업증권상의 채권채무에 관한 특칙","chapter":"제2편 상행위 제3장 상호계산","deleted":false,"text":"제73조(상업증권상의 채권채무에 관한 특칙) 어음 기타의 상업증권으로 인한 채권채무를 상호계산에 계입한 경우에 그 증권채무자가 변제하지 아니한 때에는 당사자는 그 채무의 항목을 상호계산에서 제거할 수 있다.","kind":"L"},{"id":"L:74","label":"법 제74조","title":"상호계산기간","chapter":"제2편 상행위 제3장 상호계산","deleted":false,"text":"제74조(상호계산기간) 당사자가 상계할 기간을 정하지 아니한 때에는 그 기간은 6월로 한다.","kind":"L"},{"id":"L:75","label":"법 제75조","title":"계산서의 승인과 이의","chapter":"제2편 상행위 제3장 상호계산","deleted":false,"text":"제75조(계산서의 승인과 이의) 당사자가 채권채무의 각 항목을 기재한 계산서를 승인한 때에는 그 각 항목에 대하여 이의를 하지 못한다. 그러나 착오나 탈루가 있는 때에는 그러하지 아니하다.","kind":"L"},{"id":"L:76","label":"법 제76조","title":"잔액채권의 법정이자","chapter":"제2편 상행위 제3장 상호계산","deleted":false,"text":"①상계로 인한 잔액에 대하여는 채권자는 계산폐쇄일 이후의 법정이자를 청구할 수 있다.\n②전항의 규정에 불구하고 당사자는 각 항목을 상호계산에 계입한 날로부터 이자를 붙일 것을 약정할 수 있다.\n제76조(잔액채권의 법정이자)","kind":"L"},{"id":"L:77","label":"법 제77조","title":"해지","chapter":"제2편 상행위 제3장 상호계산","deleted":false,"text":"제77조(해지) 각 당사자는 언제든지 상호계산을 해지할 수 있다. 이 경우에는 즉시 계산을 폐쇄하고 잔액의 지급을 청구할 수 있다.","kind":"L"},{"id":"L:78","label":"법 제78조","title":"의의","chapter":"제2편 상행위 제4장 익명조합","deleted":false,"text":"제78조(의의) 익명조합은 당사자의 일방이 상대방의 영업을 위하여 출자하고 상대방은 그 영업으로 인한 이익을 분배할 것을 약정함으로써 그 효력이 생긴다.","kind":"L"},{"id":"L:79","label":"법 제79조","title":"익명조합원의 출자","chapter":"제2편 상행위 제4장 익명조합","deleted":false,"text":"제79조(익명조합원의 출자) 익명조합원이 출자한 금전 기타의 재산은 영업자의 재산으로 본다.","kind":"L"},{"id":"L:80","label":"법 제80조","title":"익명조합원의 대외관계","chapter":"제2편 상행위 제4장 익명조합","deleted":false,"text":"제80조(익명조합원의 대외관계) 익명조합원은 영업자의 행위에 관하여서는 제3자에 대하여 권리나 의무가 없다.","kind":"L"},{"id":"L:81","label":"법 제81조","title":"성명, 상호의 사용허락으로 인한 책임","chapter":"제2편 상행위 제4장 익명조합","deleted":false,"text":"제81조(성명, 상호의 사용허락으로 인한 책임) 익명조합원이 자기의 성명을 영업자의 상호 중에 사용하게 하거나 자기의 상호를 영업자의 상호로 사용할 것을 허락한 때에는 그 사용 이후의 채무에 대하여 영업자와 연대하여 변제할 책임이 있다.","kind":"L"},{"id":"L:82","label":"법 제82조","title":"이익배당과 손실분담","chapter":"제2편 상행위 제4장 익명조합","deleted":false,"text":"①익명조합원의 출자가 손실로 인하여 감소된 때에는 그 손실을 전보한 후가 아니면 이익배당을 청구하지 못한다.\n②손실이 출자액을 초과한 경우에도 익명조합원은 이미 받은 이익의 반환 또는 증자할 의무가 없다.\n③전2항의 규정은 당사자간에 다른 약정이 있으면 적용하지 아니한다.\n제82조(이익배당과 손실분담)","kind":"L"},{"id":"L:83","label":"법 제83조","title":"계약의 해지","chapter":"제2편 상행위 제4장 익명조합","deleted":false,"text":"①조합계약으로 조합의 존속기간을 정하지 아니하거나 어느 당사자의 종신까지 존속할 것을 약정한 때에는 각 당사자는 영업연도말에 계약을 해지할 수 있다. 그러나 이 해지는 6월전에 상대방에게 예고하여야 한다.\n②조합의 존속기간의 약정의 유무에 불구하고 부득이한 사정이 있는 때에는 각 당사자는 언제든지 계약을 해지할 수 있다.\n제83조(계약의 해지)","kind":"L"},{"id":"L:84","label":"법 제84조","title":"계약의 종료","chapter":"제2편 상행위 제4장 익명조합","deleted":false,"text":"1. 영업의 폐지 또는 양도\n2. 영업자의 사망 또는 성년후견개시\n3. 영업자 또는 익명조합원의 파산\n제84조(계약의 종료) 조합계약은 다음의 사유로 인하여 종료한다.","kind":"L"},{"id":"L:85","label":"법 제85조","title":"계약종료의 효과","chapter":"제2편 상행위 제4장 익명조합","deleted":false,"text":"제85조(계약종료의 효과) 조합계약이 종료한 때에는 영업자는 익명조합원에게 그 출자의 가액을 반환하여야 한다. 그러나 출자가 손실로 인하여 감소된 때에는 그 잔액을 반환하면 된다.","kind":"L"},{"id":"L:86","label":"법 제86조","title":"준용규정","chapter":"제2편 상행위 제4장 익명조합","deleted":false,"text":"제86조(준용규정) 제272조, 제277조와 제278조의 규정은 익명조합원에 준용한다.","kind":"L"},{"id":"L:86-2","label":"법 제86조의2","title":"의의","chapter":"제2편 상행위 제4장의2 합자조합","deleted":false,"text":"제86조의2(의의) 합자조합은 조합의 업무집행자로서 조합의 채무에 대하여 무한책임을 지는 조합원과 출자가액을 한도로 하여 유한책임을 지는 조합원이 상호출자하여 공동사업을 경영할 것을 약정함으로써 그 효력이 생긴다.","kind":"L"},{"id":"L:86-3","label":"법 제86조의3","title":"조합계약","chapter":"제2편 상행위 제4장의2 합자조합","deleted":false,"text":"1. 목적\n2. 명칭\n3. 업무집행조합원의 성명 또는 상호, 주소 및 주민등록번호\n4. 유한책임조합원의 성명 또는 상호, 주소 및 주민등록번호\n5. 주된 영업소의 소재지\n6. 조합원의 출자(出資)에 관한 사항\n7. 조합원에 대한 손익분배에 관한 사항\n8. 유한책임조합원의 지분(持分)의 양도에 관한 사항\n9. 둘 이상의 업무집행조합원이 공동으로 합자조합의 업무를 집행하거나 대리할 것을 정한 경우에는 그 규정\n10. 업무집행조합원 중 일부 업무집행조합원만 합자조합의 업무를 집행하거나 대리할 것을 정한 경우에는 그 규정\n11. 조합의 해산 시 잔여재산 분배에 관한 사항\n12. 조합의 존속기간이나 그 밖의 해산사유에 관한 사항\n13. 조합계약의 효력 발생일\n제86조의3(조합계약) 합자조합의 설립을 위한 조합계약에는 다음 사항을 적고 총조합원이 기명날인하거나 서명하여야 한다.","kind":"L"},{"id":"L:86-4","label":"법 제86조의4","title":"등기","chapter":"제2편 상행위 제4장의2 합자조합","deleted":false,"text":"① 업무집행조합원은 합자조합 설립 후 2주 내에 조합의 주된 영업소의 소재지에서 다음의 사항을 등기하여야 한다.\n1. 제86조의3제1호부터 제5호까지(제4호의 경우에는 유한책임조합원이 업무를 집행하는 경우에 한정한다), 제9호, 제10호, 제12호 및 제13호의 사항\n2. 조합원의 출자의 목적, 재산출자의 경우에는 그 가액과 이행한 부분\n② 제1항 각 호의 사항이 변경된 경우에는 2주 내에 변경등기를 하여야 한다.\n제86조의4(등기)","kind":"L"},{"id":"L:86-5","label":"법 제86조의5","title":"업무집행조합원","chapter":"제2편 상행위 제4장의2 합자조합","deleted":false,"text":"① 업무집행조합원은 조합계약에 다른 규정이 없으면 각자가 합자조합의 업무를 집행하고 대리할 권리와 의무가 있다.\n② 업무집행조합원은 선량한 관리자의 주의로써 제1항에 따른 업무를 집행하여야 한다.\n③ 둘 이상의 업무집행조합원이 있는 경우에 조합계약에 다른 정함이 없으면 그 각 업무집행조합원의 업무집행에 관한 행위에 대하여 다른 업무집행조합원의 이의가 있는 경우에는 그 행위를 중지하고 업무집행조합원 과반수의 결의에 따라야 한다.\n제86조의5(업무집행조합원)","kind":"L"},{"id":"L:86-6","label":"법 제86조의6","title":"유한책임조합원의 책임","chapter":"제2편 상행위 제4장의2 합자조합","deleted":false,"text":"① 유한책임조합원은 조합계약에서 정한 출자가액에서 이미 이행한 부분을 뺀 가액을 한도로 하여 조합채무를 변제할 책임이 있다.\n② 제1항의 경우 합자조합에 이익이 없음에도 불구하고 배당을 받은 금액은 변제책임을 정할 때에 변제책임의 한도액에 더한다.\n제86조의6(유한책임조합원의 책임)","kind":"L"},{"id":"L:86-7","label":"법 제86조의7","title":"조합원의 지분의 양도","chapter":"제2편 상행위 제4장의2 합자조합","deleted":false,"text":"① 업무집행조합원은 다른 조합원 전원의 동의를 받지 아니하면 그 지분의 전부 또는 일부를 타인에게 양도(讓渡)하지 못한다.\n② 유한책임조합원의 지분은 조합계약에서 정하는 바에 따라 양도할 수 있다.\n③ 유한책임조합원의 지분을 양수(讓受)한 자는 양도인의 조합에 대한 권리ㆍ의무를 승계한다.\n제86조의7(조합원의 지분의 양도)","kind":"L"},{"id":"L:86-8","label":"법 제86조의8","title":"준용규정","chapter":"제2편 상행위 제4장의2 합자조합","deleted":false,"text":"① 합자조합에 대하여는 제182조제1항, 제228조, 제253조, 제264조 및 제285조를 준용한다.\n② 업무집행조합원에 대하여는 제183조의2, 제198조, 제199조, 제200조의2, 제208조제2항, 제209조, 제212조 및 제287조를 준용한다. 다만, 제198조와 제199조는 조합계약에 다른 규정이 있으면 그러하지 아니하다.\n③ 조합계약에 다른 규정이 없으면 유한책임조합원에 대하여는 제199조, 제272조, 제275조, 제277조, 제278조, 제283조 및 제284조를 준용한다.\n④ 합자조합에 관하여는 이 법 또는 조합계약에 다른 규정이 없으면 「민법」 중 조합에 관한 규정을 준용한다. 다만, 유한책임조합원에 대하여는 「민법」 제712조 및 제713조는 준용하지 아니한다.\n제86조의8(준용규정)","kind":"L"},{"id":"L:86-9","label":"법 제86조의9","title":"과태료","chapter":"제2편 상행위 제4장의2 합자조합","deleted":false,"text":"제86조의9(과태료) 합자조합의 업무집행조합원, 제86조의8에 따라 준용되는 제183조의2 또는 제253조에 따른 직무대행자 또는 청산인이 이 장(章)에서 정한 등기를 게을리한 경우에는 500만원 이하의 과태료를 부과한다.","kind":"L"},{"id":"L:87","label":"법 제87조","title":"의의","chapter":"제2편 상행위 제5장 대리상","deleted":false,"text":"제87조(의의) 일정한 상인을 위하여 상업사용인이 아니면서 상시 그 영업부류에 속하는 거래의 대리 또는 중개를 영업으로 하는 자를 대리상이라 한다.","kind":"L"},{"id":"L:88","label":"법 제88조","title":"통지의무","chapter":"제2편 상행위 제5장 대리상","deleted":false,"text":"제88조(통지의무) 대리상이 거래의 대리 또는 중개를 한 때에는 지체없이 본인에게 그 통지를 발송하여야 한다.","kind":"L"},{"id":"L:89","label":"법 제89조","title":"경업금지","chapter":"제2편 상행위 제5장 대리상","deleted":false,"text":"①대리상은 본인의 허락없이 자기나 제3자의 계산으로 본인의 영업부류에 속한 거래를 하거나 동종영업을 목적으로 하는 회사의 무한책임사원 또는 이사가 되지 못한다.\n②제17조제2항 내지 제4항의 규정은 대리상이 전항의 규정에 위반한 경우에 준용한다.\n제89조(경업금지)","kind":"L"},{"id":"L:90","label":"법 제90조","title":"통지를 받을 권한","chapter":"제2편 상행위 제5장 대리상","deleted":false,"text":"제90조(통지를 받을 권한) 물건의 판매나 그 중개의 위탁을 받은 대리상은 매매의 목적물의 하자 또는 수량부족 기타 매매의 이행에 관한 통지를 받을 권한이 있다.","kind":"L"},{"id":"L:91","label":"법 제91조","title":"대리상의 유치권","chapter":"제2편 상행위 제5장 대리상","deleted":false,"text":"제91조(대리상의 유치권) 대리상은 거래의 대리 또는 중개로 인한 채권이 변제기에 있는 때에는 그 변제를 받을 때까지 본인을 위하여 점유하는 물건 또는 유가증권을 유치할 수 있다. 그러나 당사자간에 다른 약정이 있으면 그러하지 아니하다.","kind":"L"},{"id":"L:92","label":"법 제92조","title":"계약의 해지","chapter":"제2편 상행위 제5장 대리상","deleted":false,"text":"①당사자가 계약의 존속기간을 약정하지 아니한 때에는 각 당사자는 2월전에 예고하고 계약을 해지할 수 있다.\n②제83조제2항의 규정은 대리상에 준용한다.\n제92조(계약의 해지)","kind":"L"},{"id":"L:92-2","label":"법 제92조의2","title":"대리상의 보상청구권","chapter":"제2편 상행위 제5장 대리상","deleted":false,"text":"①대리상의 활동으로 본인이 새로운 고객을 획득하거나 영업상의 거래가 현저하게 증가하고 이로 인하여 계약의 종료후에도 본인이 이익을 얻고 있는 경우에는 대리상은 본인에 대하여 상당한 보상을 청구할 수 있다. 다만, 계약의 종료가 대리상의 책임있는 사유로 인한 경우에는 그러하지 아니하다.\n②제1항의 규정에 의한 보상금액은 계약의 종료전 5년간의 평균연보수액을 초과할 수 없다. 계약의 존속기간이 5년 미만인 경우에는 그 기간의 평균연보수액을 기준으로 한다.\n③제1항의 규정에 의한 보상청구권은 계약이 종료한 날부터 6월을 경과하면 소멸한다.\n제92조의2(대리상의 보상청구권)","kind":"L"},{"id":"L:92-3","label":"법 제92조의3","title":"대리상의 영업비밀준수의무","chapter":"제2편 상행위 제5장 대리상","deleted":false,"text":"제92조의3(대리상의 영업비밀준수의무) 대리상은 계약의 종료후에도 계약과 관련하여 알게 된 본인의 영업상의 비밀을 준수하여야 한다.","kind":"L"},{"id":"L:93","label":"법 제93조","title":"의의","chapter":"제2편 상행위 제6장 중개업","deleted":false,"text":"제93조(의의) 타인간의 상행위의 중개를 영업으로 하는 자를 중개인이라 한다.","kind":"L"},{"id":"L:94","label":"법 제94조","title":"중개인의 급여수령대리권","chapter":"제2편 상행위 제6장 중개업","deleted":false,"text":"제94조(중개인의 급여수령대리권) 중개인은 그 중개한 행위에 관하여 당사자를 위하여 지급 기타의 이행을 받지 못한다. 그러나 다른 약정이나 관습이 있으면 그러하지 아니하다.","kind":"L"},{"id":"L:95","label":"법 제95조","title":"견품보관의무","chapter":"제2편 상행위 제6장 중개업","deleted":false,"text":"제95조(견품보관의무) 중개인이 그 중개한 행위에 관하여 견품을 받은 때에는 그 행위가 완료될 때까지 이를 보관하여야 한다.","kind":"L"},{"id":"L:96","label":"법 제96조","title":"결약서교부의무","chapter":"제2편 상행위 제6장 중개업","deleted":false,"text":"①당사자간에 계약이 성립된 때에는 중개인은 지체없이 각 당사자의 성명 또는 상호, 계약년월일과 그 요령을 기재한 서면을 작성하여 기명날인 또는 서명한 후 각 당사자에게 교부하여야 한다. <개정 1995.12.29>\n②당사자가 즉시 이행을 하여야 하는 경우를 제외하고 중개인은 각 당사자로 하여금 제1항의 서면에 기명날인 또는 서명하게 한 후 그 상대방에게 교부하여야 한다. <개정 1995.12.29>\n③제1항 및 제2항의 경우에 당사자의 일방이 서면의 수령을 거부하거나 기명날인 또는 서명하지 아니한 때에는 중개인은 지체없이 상대방에게 그 통지를 발송하여야 한다. <개정 1995.12.29>\n제96조(결약서교부의무)","kind":"L"},{"id":"L:97","label":"법 제97조","title":"중개인의 장부작성의무","chapter":"제2편 상행위 제6장 중개업","deleted":false,"text":"①중개인은 전조에 규정한 사항을 장부에 기재하여야 한다.\n②당사자는 언제든지 자기를 위하여 중개한 행위에 관한 장부의 등본의 교부를 청구할 수 있다.\n제97조(중개인의 장부작성의무)","kind":"L"},{"id":"L:98","label":"법 제98조","title":"성명, 상호 묵비의 의무","chapter":"제2편 상행위 제6장 중개업","deleted":false,"text":"제98조(성명, 상호 묵비의 의무) 당사자가 그 성명 또는 상호를 상대방에게 표시하지 아니할 것을 중개인에게 요구한 때에는 중개인은 그 상대방에게 교부할 제96조제1항의 서면과 전조 제2항의 등본에 이를 기재하지 못한다.","kind":"L"},{"id":"L:99","label":"법 제99조","title":"중개인의 이행책임","chapter":"제2편 상행위 제6장 중개업","deleted":false,"text":"제99조(중개인의 이행책임) 중개인이 임의로 또는 전조의 규정에 의하여 당사자의 일방의 성명 또는 상호를 상대방에게 표시하지 아니한 때에는 상대방은 중개인에 대하여 이행을 청구할 수 있다.","kind":"L"},{"id":"L:100","label":"법 제100조","title":"보수청구권","chapter":"제2편 상행위 제6장 중개업","deleted":false,"text":"①중개인은 제96조의 절차를 종료하지 아니하면 보수를 청구하지 못한다.\n②중개인의 보수는 당사자쌍방이 균분하여 부담한다.\n제100조(보수청구권)","kind":"L"},{"id":"L:101","label":"법 제101조","title":"의의","chapter":"제2편 상행위 제7장 위탁매매업","deleted":false,"text":"제101조(의의) 자기명의로써 타인의 계산으로 물건 또는 유가증권의 매매를 영업으로 하는 자를 위탁매매인이라 한다.","kind":"L"},{"id":"L:102","label":"법 제102조","title":"위탁매매인의 지위","chapter":"제2편 상행위 제7장 위탁매매업","deleted":false,"text":"제102조(위탁매매인의 지위) 위탁매매인은 위탁자를 위한 매매로 인하여 상대방에 대하여 직접 권리를 취득하고 의무를 부담한다.","kind":"L"},{"id":"L:103","label":"법 제103조","title":"위탁물의 귀속","chapter":"제2편 상행위 제7장 위탁매매업","deleted":false,"text":"제103조(위탁물의 귀속) 위탁매매인이 위탁자로부터 받은 물건 또는 유가증권이나 위탁매매로 인하여 취득한 물건, 유가증권 또는 채권은 위탁자와 위탁매매인 또는 위탁매매인의 채권자간의 관계에서는 이를 위탁자의 소유 또는 채권으로 본다.","kind":"L"},{"id":"L:104","label":"법 제104조","title":"통지의무, 계산서제출의무","chapter":"제2편 상행위 제7장 위탁매매업","deleted":false,"text":"제104조(통지의무, 계산서제출의무) 위탁매매인이 위탁받은 매매를 한 때에는 지체없이 위탁자에 대하여 그 계약의 요령과 상대방의 주소, 성명의 통지를 발송하여야 하며 계산서를 제출하여야 한다.","kind":"L"},{"id":"L:105","label":"법 제105조","title":"위탁매매인의 이행담보책임","chapter":"제2편 상행위 제7장 위탁매매업","deleted":false,"text":"제105조(위탁매매인의 이행담보책임) 위탁매매인은 위탁자를 위한 매매에 관하여 상대방이 채무를 이행하지 아니하는 경우에는 위탁자에 대하여 이를 이행할 책임이 있다. 그러나 다른 약정이나 관습이 있으면 그러하지 아니하다.","kind":"L"},{"id":"L:106","label":"법 제106조","title":"지정가액준수의무","chapter":"제2편 상행위 제7장 위탁매매업","deleted":false,"text":"①위탁자가 지정한 가액보다 염가로 매도하거나 고가로 매수한 경우에도 위탁매매인이 그 차액을 부담한 때에는 그 매매는 위탁자에 대하여 효력이 있다.\n②위탁자가 지정한 가액보다 고가로 매도하거나 염가로 매수한 경우에는 그 차액은 다른 약정이 없으면 위탁자의 이익으로 한다.\n제106조(지정가액준수의무)","kind":"L"},{"id":"L:107","label":"법 제107조","title":"위탁매매인의 개입권","chapter":"제2편 상행위 제7장 위탁매매업","deleted":false,"text":"① 위탁매매인이 거래소의 시세가 있는 물건 또는 유가증권의 매매를 위탁받은 경우에는 직접 그 매도인이나 매수인이 될 수 있다. 이 경우의 매매대가는 위탁매매인이 매매의 통지를 발송할 때의 거래소의 시세에 따른다.\n② 제1항의 경우에 위탁매매인은 위탁자에게 보수를 청구할 수 있다.\n제107조(위탁매매인의 개입권)","kind":"L"},{"id":"L:108","label":"법 제108조","title":"위탁물의 훼손, 하자 등의 효과","chapter":"제2편 상행위 제7장 위탁매매업","deleted":false,"text":"①위탁매매인이 위탁매매의 목적물을 인도받은 후에 그 물건의 훼손 또는 하자를 발견하거나 그 물건이 부패할 염려가 있는 때 또는 가격저락의 상황을 안 때에는 지체없이 위탁자에게 그 통지를 발송하여야 한다.\n②전항의 경우에 위탁자의 지시를 받을 수 없거나 그 지시가 지연되는 때에는 위탁매매인은 위탁자의 이익을 위하여 적당한 처분을 할 수 있다.\n제108조(위탁물의 훼손, 하자 등의 효과)","kind":"L"},{"id":"L:109","label":"법 제109조","title":"매수물의 공탁, 경매권","chapter":"제2편 상행위 제7장 위탁매매업","deleted":false,"text":"제109조(매수물의 공탁, 경매권) 제67조의 규정은 위탁매매인이 매수의 위탁을 받은 경우에 위탁자가 매수한 물건의 수령을 거부하거나 이를 수령할 수 없는 때에 준용한다.","kind":"L"},{"id":"L:110","label":"법 제110조","title":"매수위탁자가 상인인 경우","chapter":"제2편 상행위 제7장 위탁매매업","deleted":false,"text":"제110조(매수위탁자가 상인인 경우) 상인인 위탁자가 그 영업에 관하여 물건의 매수를 위탁한 경우에는 위탁자와 위탁매매인간의 관계에는 제68조 내지 제71조의 규정을 준용한다.","kind":"L"},{"id":"L:111","label":"법 제111조","title":"준용규정","chapter":"제2편 상행위 제7장 위탁매매업","deleted":false,"text":"제111조(준용규정) 제91조의 규정은 위탁매매인에 준용한다.","kind":"L"},{"id":"L:112","label":"법 제112조","title":"위임에 관한 규정의 적용","chapter":"제2편 상행위 제7장 위탁매매업","deleted":false,"text":"제112조(위임에 관한 규정의 적용) 위탁자와 위탁매매인간의 관계에는 본장의 규정외에 위임에 관한 규정을 적용한다.","kind":"L"},{"id":"L:113","label":"법 제113조","title":"준위탁매매인","chapter":"제2편 상행위 제7장 위탁매매업","deleted":false,"text":"제113조(준위탁매매인) 본장의 규정은 자기명의로써 타인의 계산으로 매매아닌 행위를 영업으로 하는 자에 준용한다.","kind":"L"},{"id":"L:114","label":"법 제114조","title":"의의","chapter":"제2편 상행위 제8장 운송주선업","deleted":false,"text":"제114조(의의) 자기의 명의로 물건운송의 주선을 영업으로 하는 자를 운송주선인이라 한다.","kind":"L"},{"id":"L:115","label":"법 제115조","title":"손해배상책임","chapter":"제2편 상행위 제8장 운송주선업","deleted":false,"text":"제115조(손해배상책임) 운송주선인은 자기나 그 사용인이 운송물의 수령, 인도, 보관, 운송인이나 다른 운송주선인의 선택 기타 운송에 관하여 주의를 해태하지 아니하였음을 증명하지 아니하면 운송물의 멸실, 훼손 또는 연착으로 인한 손해를 배상할 책임을 면하지 못한다.","kind":"L"},{"id":"L:116","label":"법 제116조","title":"개입권","chapter":"제2편 상행위 제8장 운송주선업","deleted":false,"text":"①운송주선인은 다른 약정이 없으면 직접운송할 수 있다. 이 경우에는 운송주선인은 운송인과 동일한 권리의무가 있다.\n②운송주선인이 위탁자의 청구에 의하여 화물상환증을 작성한 때에는 직접운송하는 것으로 본다.\n제116조(개입권)","kind":"L"},{"id":"L:117","label":"법 제117조","title":"중간운송주선인의 대위","chapter":"제2편 상행위 제8장 운송주선업","deleted":false,"text":"①수인이 순차로 운송주선을 하는 경우에는 후자는 전자에 갈음하여 그 권리를 행사할 의무를 부담한다.\n②전항의 경우에 후자가 전자에게 변제한 때에는 전자의 권리를 취득한다.\n제117조(중간운송주선인의 대위)","kind":"L"},{"id":"L:118","label":"법 제118조","title":"운송인의 권리의 취득","chapter":"제2편 상행위 제8장 운송주선업","deleted":false,"text":"제118조(운송인의 권리의 취득) 전조의 경우에 운송주선인이 운송인에게 변제한 때에는 운송인의 권리를 취득한다.","kind":"L"},{"id":"L:119","label":"법 제119조","title":"보수청구권","chapter":"제2편 상행위 제8장 운송주선업","deleted":false,"text":"①운송주선인은 운송물을 운송인에게 인도한 때에는 즉시 보수를 청구할 수 있다.\n②운송주선계약으로 운임의 액을 정한 경우에는 다른 약정이 없으면 따로 보수를 청구하지 못한다.\n제119조(보수청구권)","kind":"L"},{"id":"L:120","label":"법 제120조","title":"유치권","chapter":"제2편 상행위 제8장 운송주선업","deleted":false,"text":"제120조(유치권) 운송주선인은 운송물에 관하여 받을 보수, 운임, 기타 위탁자를 위한 체당금이나 선대금에 관하여서만 그 운송물을 유치할 수 있다.","kind":"L"},{"id":"L:121","label":"법 제121조","title":"운송주선인의 책임의 시효","chapter":"제2편 상행위 제8장 운송주선업","deleted":false,"text":"①운송주선인의 책임은 수하인이 운송물을 수령한 날로부터 1년을 경과하면 소멸시효가 완성한다.\n②전항의 기간은 운송물이 전부멸실한 경우에는 그 운송물을 인도할 날로부터 기산한다. <개정 1962.12.12>\n③전2항의 규정은 운송주선인이나 그 사용인이 악의인 경우에는 적용하지 아니한다.\n제121조(운송주선인의 책임의 시효)","kind":"L"},{"id":"L:122","label":"법 제122조","title":"운송주선인의 채권의 시효","chapter":"제2편 상행위 제8장 운송주선업","deleted":false,"text":"제122조(운송주선인의 채권의 시효) 운송주선인의 위탁자 또는 수하인에 대한 채권은 1 년간 행사하지 아니하면 소멸시효가 완성한다.","kind":"L"},{"id":"L:123","label":"법 제123조","title":"준용규정","chapter":"제2편 상행위 제8장 운송주선업","deleted":false,"text":"제123조(준용규정) 운송주선인에 관하여는 본장의 규정외에 위탁매매인에 관한 규정을 준용한다.","kind":"L"},{"id":"L:124","label":"법 제124조","title":"동전","chapter":"제2편 상행위 제8장 운송주선업","deleted":false,"text":"제124조(동전) 제136조, 제140조와 제141조의 규정은 운송주선업에 준용한다.","kind":"L"},{"id":"L:125","label":"법 제125조","title":"의의","chapter":"제2편 상행위 제9장 운송업","deleted":false,"text":"제125조(의의) 육상 또는 호천, 항만에서 물건 또는 여객의 운송을 영업으로 하는 자를 운송인이라 한다.","kind":"L"},{"id":"L:126","label":"법 제126조","title":"화물명세서","chapter":"제2편 상행위 제9장 운송업","deleted":false,"text":"①송하인은 운송인의 청구에 의하여 화물명세서를 교부하여야 한다. <개정 2007.8.3>\n②화물명세서에는 다음의 사항을 기재하고 송하인이 기명날인 또는 서명하여야 한다. <개정 1995.12.29, 2007.8.3>\n1. 운송물의 종류, 중량 또는 용적, 포장의 종별, 개수와 기호\n2. 도착지\n3. 수하인과 운송인의 성명 또는 상호, 영업소 또는 주소\n4. 운임과 그 선급 또는 착급의 구별\n5. 화물명세서의 작성지와 작성년월일\n제126조(화물명세서)","kind":"L"},{"id":"L:127","label":"법 제127조","title":"화물명세서의 허위기재에 대한 책임","chapter":"제2편 상행위 제9장 운송업","deleted":false,"text":"①송하인이 화물명세서에 허위 또는 부정확한 기재를 한 때에는 운송인에 대하여 이로 인한 손해를 배상할 책임이 있다. <개정 2007.8.3>\n②전항의 규정은 운송인이 악의인 경우에는 적용하지 아니한다.\n제127조(화물명세서의 허위기재에 대한 책임)","kind":"L"},{"id":"L:128","label":"법 제128조","title":"화물상환증의 발행","chapter":"제2편 상행위 제9장 운송업","deleted":false,"text":"①운송인은 송하인의 청구에 의하여 화물상환증을 교부하여야 한다.\n②화물상환증에는 다음의 사항을 기재하고 운송인이 기명날인 또는 서명하여야 한다. <개정 1995.12.29>\n1. 제126조제2항제1호 내지 제3호의 사항\n2. 송하인의 성명 또는 상호, 영업소 또는 주소\n3. 운임 기타 운송물에 관한 비용과 그 선급 또는 착급의 구별\n4. 화물상환증의 작성지와 작성년월일\n제128조(화물상환증의 발행)","kind":"L"},{"id":"L:129","label":"법 제129조","title":"화물상환증의 상환증권성","chapter":"제2편 상행위 제9장 운송업","deleted":false,"text":"제129조(화물상환증의 상환증권성) 화물상환증을 작성한 경우에는 이와 상환하지 아니하면 운송물의 인도를 청구할 수 없다.","kind":"L"},{"id":"L:130","label":"법 제130조","title":"화물상환증의 당연한 지시증권성","chapter":"제2편 상행위 제9장 운송업","deleted":false,"text":"제130조(화물상환증의 당연한 지시증권성) 화물상환증은 기명식인 경우에도 배서에 의하여 양도할 수 있다. 그러나 화물상환증에 배서를 금지하는 뜻을 기재한 때에는 그러하지 아니하다.","kind":"L"},{"id":"L:131","label":"법 제131조","title":"화물상환증 기재의 효력","chapter":"제2편 상행위 제9장 운송업","deleted":false,"text":"① 제128조에 따라 화물상환증이 발행된 경우에는 운송인과 송하인 사이에 화물상환증에 적힌 대로 운송계약이 체결되고 운송물을 수령한 것으로 추정한다.\n② 화물상환증을 선의로 취득한 소지인에 대하여 운송인은 화물상환증에 적힌 대로 운송물을 수령한 것으로 보고 화물상환증에 적힌 바에 따라 운송인으로서 책임을 진다.\n제131조(화물상환증 기재의 효력)","kind":"L"},{"id":"L:132","label":"법 제132조","title":"화물상환증의 처분증권성","chapter":"제2편 상행위 제9장 운송업","deleted":false,"text":"제132조(화물상환증의 처분증권성) 화물상환증을 작성한 경우에는 운송물에 관한 처분은 화물상환증으로써 하여야 한다.","kind":"L"},{"id":"L:133","label":"법 제133조","title":"화물상환증교부의 물권적 효력","chapter":"제2편 상행위 제9장 운송업","deleted":false,"text":"제133조(화물상환증교부의 물권적 효력) 화물상환증에 의하여 운송물을 받을 수 있는 자에게 화물상환증을 교부한 때에는 운송물 위에 행사하는 권리의 취득에 관하여 운송물을 인도한 것과 동일한 효력이 있다.","kind":"L"},{"id":"L:134","label":"법 제134조","title":"운송물멸실과 운임","chapter":"제2편 상행위 제9장 운송업","deleted":false,"text":"①운송물의 전부 또는 일부가 송하인의 책임없는 사유로 인하여 멸실한 때에는 운송인은 그 운임을 청구하지 못한다. 운송인이 이미 그 운임의 전부 또는 일부를 받은 때에는 이를 반환하여야 한다.\n②운송물의 전부 또는 일부가 그 성질이나 하자 또는 송하인의 과실로 인하여 멸실한 때에는 운송인은 운임의 전액을 청구할 수 있다.\n제134조(운송물멸실과 운임)","kind":"L"},{"id":"L:135","label":"법 제135조","title":"손해배상책임","chapter":"제2편 상행위 제9장 운송업","deleted":false,"text":"제135조(손해배상책임) 운송인은 자기 또는 운송주선인이나 사용인, 그 밖에 운송을 위하여 사용한 자가 운송물의 수령, 인도, 보관 및 운송에 관하여 주의를 게을리하지 아니하였음을 증명하지 아니하면 운송물의 멸실, 훼손 또는 연착으로 인한 손해를 배상할 책임이 있다.","kind":"L"},{"id":"L:136","label":"법 제136조","title":"고가물에 대한 책임","chapter":"제2편 상행위 제9장 운송업","deleted":false,"text":"제136조(고가물에 대한 책임) 화폐, 유가증권 기타의 고가물에 대하여는 송하인이 운송을 위탁할 때에 그 종류와 가액을 명시한 경우에 한하여 운송인이 손해를 배상할 책임이 있다.","kind":"L"},{"id":"L:137","label":"법 제137조","title":"손해배상의 액","chapter":"제2편 상행위 제9장 운송업","deleted":false,"text":"① 운송물이 전부멸실 또는 연착된 경우의 손해배상액은 인도할 날의 도착지의 가격에 따른다. <개정 2011.4.14>\n②운송물이 일부 멸실 또는 훼손된 경우의 손해배상액은 인도한 날의 도착지의 가격에 의한다.\n③운송물의 멸실, 훼손 또는 연착이 운송인의 고의나 중대한 과실로 인한 때에는 운송인은 모든 손해를 배상하여야 한다.\n④운송물의 멸실 또는 훼손으로 인하여 지급을 요하지 아니하는 운임 기타 비용은 전3항의 배상액에서 공제하여야 한다.\n제137조(손해배상의 액)","kind":"L"},{"id":"L:138","label":"법 제138조","title":"순차운송인의 연대책임, 구상권","chapter":"제2편 상행위 제9장 운송업","deleted":false,"text":"①수인이 순차로 운송할 경우에는 각 운송인은 운송물의 멸실, 훼손 또는 연착으로 인한 손해를 연대하여 배상할 책임이 있다.\n②운송인중 1인이 전항의 규정에 의하여 손해를 배상한 때에는 그 손해의 원인이 된 행위를 한 운송인에 대하여 구상권이 있다.\n③전항의 경우에 그 손해의 원인이 된 행위를 한 운송인을 알 수 없는 때에는 각 운송인은 그 운임액의 비율로 손해를 분담한다. 그러나 그 손해가 자기의 운송구간내에서 발생하지 아니하였음을 증명한 때에는 손해분담의 책임이 없다.\n제138조(순차운송인의 연대책임, 구상권)","kind":"L"},{"id":"L:139","label":"법 제139조","title":"운송물의 처분청구권","chapter":"제2편 상행위 제9장 운송업","deleted":false,"text":"①송하인 또는 화물상환증이 발행된 때에는 그 소지인이 운송인에 대하여 운송의 중지, 운송물의 반환 기타의 처분을 청구할 수 있다. 이 경우에 운송인은 이미 운송한 비율에 따른 운임, 체당금과 처분으로 인한 비용의 지급을 청구할 수 있다.\n② 삭제 <1995.12.29>\n제139조(운송물의 처분청구권)","kind":"L"},{"id":"L:140","label":"법 제140조","title":"수하인의 지위","chapter":"제2편 상행위 제9장 운송업","deleted":false,"text":"①운송물이 도착지에 도착한 때에는 수하인은 송하인과 동일한 권리를 취득한다.\n②운송물이 도착지에 도착한 후 수하인이 그 인도를 청구한 때에는 수하인의 권리가 송하인의 권리에 우선한다. <신설 1995.12.29>\n제140조(수하인의 지위)","kind":"L"},{"id":"L:141","label":"법 제141조","title":"수하인의 의무","chapter":"제2편 상행위 제9장 운송업","deleted":false,"text":"제141조(수하인의 의무) 수하인이 운송물을 수령한 때에는 운송인에 대하여 운임 기타 운송에 관한 비용과 체당금을 지급할 의무를 부담한다.","kind":"L"},{"id":"L:142","label":"법 제142조","title":"수하인불명의 경우의 공탁, 경매권","chapter":"제2편 상행위 제9장 운송업","deleted":false,"text":"①수하인을 알 수 없는 때에는 운송인은 운송물을 공탁할 수 있다.\n②제1항의 경우에 운송인은 송하인에 대하여 상당한 기간을 정하여 운송물의 처분에 대한 지시를 최고하여도 그 기간내에 지시를 하지 아니한 때에는 운송물을 경매할 수 있다. <개정 1995.12.29>\n③운송인이 제1항 및 제2항의 규정에 의하여 운송물의 공탁 또는 경매를 한 때에는 지체없이 송하인에게 그 통지를 발송하여야 한다. <개정 1995.12.29>\n제142조(수하인불명의 경우의 공탁, 경매권)","kind":"L"},{"id":"L:143","label":"법 제143조","title":"운송물의 수령거부, 수령불능의 경우","chapter":"제2편 상행위 제9장 운송업","deleted":false,"text":"①전조의 규정은 수하인이 운송물의 수령을 거부하거나 수령할 수 없는 경우에 준용한다.\n②운송인이 경매를 함에는 송하인에 대한 최고를 하기 전에 수하인에 대하여 상당한 기간을 정하여 운송물의 수령을 최고하여야 한다. <개정 1995.12.29>\n제143조(운송물의 수령거부, 수령불능의 경우)","kind":"L"},{"id":"L:144","label":"법 제144조","title":"공시최고","chapter":"제2편 상행위 제9장 운송업","deleted":false,"text":"①송하인, 화물상환증소지인과 수하인을 알 수 없는 때에는 운송인은 권리자에 대하여 6월 이상의 기간을 정하여 그 기간 내에 권리를 주장할 것을 공고하여야 한다.\n②제1항의 공고는 관보나 일간신문에 2회 이상 하여야 한다. <개정 1984.4.10>\n③운송인이 제1항 및 제2항의 규정에 의한 공고를 하여도 그 기간내에 권리를 주장하는 자가 없는 때에는 운송물을 경매할 수 있다. <개정 1984.4.10>\n제144조(공시최고)","kind":"L"},{"id":"L:145","label":"법 제145조","title":"준용규정","chapter":"제2편 상행위 제9장 운송업","deleted":false,"text":"제145조(준용규정) 제67조제2항과 제3항의 규정은 전3조의 경매에 준용한다.","kind":"L"},{"id":"L:146","label":"법 제146조","title":"운송인의 책임소멸","chapter":"제2편 상행위 제9장 운송업","deleted":false,"text":"①운송인의 책임은 수하인 또는 화물상환증소지인이 유보없이 운송물을 수령하고 운임 기타의 비용을 지급한 때에는 소멸한다. 그러나 운송물에 즉시 발견할 수 없는 훼손 또는 일부 멸실이 있는 경우에 운송물을 수령한 날로부터 2주간내에 운송인에게 그 통지를 발송한 때에는 그러하지 아니하다.\n②전항의 규정은 운송인 또는 그 사용인이 악의인 경우에는 적용하지 아니한다.\n제146조(운송인의 책임소멸)","kind":"L"},{"id":"L:147","label":"법 제147조","title":"준용규정","chapter":"제2편 상행위 제9장 운송업","deleted":false,"text":"제147조(준용규정) 제117조, 제120조 내지 제122조의 규정은 운송인에 준용한다.","kind":"L"},{"id":"L:148","label":"법 제148조","title":"여객이 받은 손해의 배상책임","chapter":"제2편 상행위 제9장 운송업","deleted":false,"text":"①운송인은 자기 또는 사용인이 운송에 관한 주의를 해태하지 아니하였음을 증명하지 아니하면 여객이 운송으로 인하여 받은 손해를 배상할 책임을 면하지 못한다.\n②손해배상의 액을 정함에는 법원은 피해자와 그 가족의 정상을 참작하여야 한다.\n제148조(여객이 받은 손해의 배상책임)","kind":"L"},{"id":"L:149","label":"법 제149조","title":"인도를 받은 수하물에 대한 책임","chapter":"제2편 상행위 제9장 운송업","deleted":false,"text":"①운송인은 여객으로부터 인도를 받은 수하물에 관하여는 운임을 받지 아니한 경우에도 물건운송인과 동일한 책임이 있다.\n②수하물이 도착지에 도착한 날로부터 10일내에 여객이 그 인도를 청구하지 아니한 때에는 제67조의 규정을 준용한다. 그러나 주소 또는 거소를 알지 못하는 여객에 대하여는 최고와 통지를 요하지 아니한다.\n제149조(인도를 받은 수하물에 대한 책임)","kind":"L"},{"id":"L:150","label":"법 제150조","title":"인도를 받지 아니한 수하물에 대한 책임","chapter":"제2편 상행위 제9장 운송업","deleted":false,"text":"제150조(인도를 받지 아니한 수하물에 대한 책임) 운송인은 여객으로부터 인도를 받지 아니한 수하물의 멸실 또는 훼손에 대하여는 자기 또는 사용인의 과실이 없으면 손해를 배상할 책임이 없다.","kind":"L"},{"id":"L:151","label":"법 제151조","title":"의의","chapter":"제2편 상행위 제10장 공중접객업","deleted":false,"text":"제151조(의의) 극장, 여관, 음식점, 그 밖의 공중이 이용하는 시설에 의한 거래를 영업으로 하는 자를 공중접객업자(公衆接客業者)라 한다.","kind":"L"},{"id":"L:152","label":"법 제152조","title":"공중접객업자의 책임","chapter":"제2편 상행위 제10장 공중접객업","deleted":false,"text":"① 공중접객업자는 자기 또는 그 사용인이 고객으로부터 임치(任置)받은 물건의 보관에 관하여 주의를 게을리하지 아니하였음을 증명하지 아니하면 그 물건의 멸실 또는 훼손으로 인한 손해를 배상할 책임이 있다.\n② 공중접객업자는 고객으로부터 임치받지 아니한 경우에도 그 시설 내에 휴대한 물건이 자기 또는 그 사용인의 과실로 인하여 멸실 또는 훼손되었을 때에는 그 손해를 배상할 책임이 있다.\n③ 고객의 휴대물에 대하여 책임이 없음을 알린 경우에도 공중접객업자는 제1항과 제2항의 책임을 면하지 못한다.\n제152조(공중접객업자의 책임)","kind":"L"},{"id":"L:153","label":"법 제153조","title":"고가물에 대한 책임","chapter":"제2편 상행위 제10장 공중접객업","deleted":false,"text":"제153조(고가물에 대한 책임) 화폐, 유가증권, 그 밖의 고가물(高價物)에 대하여는 고객이 그 종류와 가액(價額)을 명시하여 임치하지 아니하면 공중접객업자는 그 물건의 멸실 또는 훼손으로 인한 손해를 배상할 책임이 없다.","kind":"L"},{"id":"L:154","label":"법 제154조","title":"공중접객업자의 책임의 시효","chapter":"제2편 상행위 제10장 공중접객업","deleted":false,"text":"① 제152조와 제153조의 책임은 공중접객업자가 임치물을 반환하거나 고객이 휴대물을 가져간 후 6개월이 지나면 소멸시효가 완성된다.\n② 물건이 전부 멸실된 경우에는 제1항의 기간은 고객이 그 시설에서 퇴거한 날부터 기산한다.\n③ 제1항과 제2항은 공중접객업자나 그 사용인이 악의인 경우에는 적용하지 아니한다.\n제154조(공중접객업자의 책임의 시효)","kind":"L"},{"id":"L:155","label":"법 제155조","title":"의의","chapter":"제2편 상행위 제11장 창고업","deleted":false,"text":"제155조(의의) 타인을 위하여 창고에 물건을 보관함을 영업으로 하는 자를 창고업자라 한다.","kind":"L"},{"id":"L:156","label":"법 제156조","title":"창고증권의 발행","chapter":"제2편 상행위 제11장 창고업","deleted":false,"text":"①창고업자는 임치인의 청구에 의하여 창고증권을 교부하여야 한다.\n②창고증권에는 다음의 사항을 기재하고 창고업자가 기명날인 또는 서명하여야 한다. <개정 1995.12.29>\n1. 임치물의 종류, 품질, 수량, 포장의 종별, 개수와 기호\n2. 임치인의 성명 또는 상호, 영업소 또는 주소\n3. 보관장소\n4. 보관료\n5. 보관기간을 정한 때에는 그 기간\n6. 임치물을 보험에 붙인 때에는 보험금액, 보험기간과 보험자의 성명 또는 상호, 영업소 또는 주소\n7. 창고증권의 작성지와 작성년월일\n제156조(창고증권의 발행)","kind":"L"},{"id":"L:157","label":"법 제157조","title":"준용규정","chapter":"제2편 상행위 제11장 창고업","deleted":false,"text":"제157조(준용규정) 제129조 내지 제133조의 규정은 창고증권에 준용한다.","kind":"L"},{"id":"L:158","label":"법 제158조","title":"분할부분에 대한 창고증권의 청구","chapter":"제2편 상행위 제11장 창고업","deleted":false,"text":"①창고증권소지인은 창고업자에 대하여 그 증권을 반환하고 임치물을 분할하여 각부분에 대한 창고증권의 교부를 청구할 수 있다.\n②전항의 규정에 의한 임치물의 분할과 증권교부의 비용은 증권소지인이 부담한다.\n제158조(분할부분에 대한 창고증권의 청구)","kind":"L"},{"id":"L:159","label":"법 제159조","title":"창고증권에 의한 입질과 일부출고","chapter":"제2편 상행위 제11장 창고업","deleted":false,"text":"제159조(창고증권에 의한 입질과 일부출고) 창고증권으로 임치물을 입질한 경우에도 질권자의 승낙이 있으면 임치인은 채권의 변제기전이라도 임치물의 일부반환을 청구할 수 있다. 이 경우에는 창고업자는 반환한 임치물의 종류, 품질과 수량을 창고증권에 기재하여야 한다.","kind":"L"},{"id":"L:160","label":"법 제160조","title":"손해배상책임","chapter":"제2편 상행위 제11장 창고업","deleted":false,"text":"제160조(손해배상책임) 창고업자는 자기 또는 사용인이 임치물의 보관에 관하여 주의를 해태하지 아니하였음을 증명하지 아니하면 임치물의 멸실 또는 훼손에 대하여 손해를 배상할 책임을 면하지 못한다.","kind":"L"},{"id":"L:161","label":"법 제161조","title":"임치물의 검사, 견품적취, 보존처분권","chapter":"제2편 상행위 제11장 창고업","deleted":false,"text":"제161조(임치물의 검사, 견품적취, 보존처분권) 임치인 또는 창고증권소지인은 영업시간 내에 언제든지 창고업자에 대하여 임치물의 검사 또는 견품의 적취를 요구하거나 그 보존에 필요한 처분을 할 수 있다.","kind":"L"},{"id":"L:162","label":"법 제162조","title":"보관료청구권","chapter":"제2편 상행위 제11장 창고업","deleted":false,"text":"①창고업자는 임치물을 출고할 때가 아니면 보관료 기타의 비용과 체당금의 지급을 청구하지 못한다. 그러나 보관기간 경과후에는 출고전이라도 이를 청구할 수 있다.\n②임치물의 일부출고의 경우에는 창고업자는 그 비율에 따른 보관료 기타의 비용과 체당금의 지급을 청구할 수 있다.\n제162조(보관료청구권)","kind":"L"},{"id":"L:163","label":"법 제163조","title":"임치기간","chapter":"제2편 상행위 제11장 창고업","deleted":false,"text":"①당사자가 임치기간을 정하지 아니한 때에는 창고업자는 임치물을 받은 날로부터 6월을 경과한 후에는 언제든지 이를 반환할 수 있다.\n②전항의 경우에 임치물을 반환함에는 2주간전에 예고하여야 한다.\n제163조(임치기간)","kind":"L"},{"id":"L:164","label":"법 제164조","title":"동전-부득이한 사유가 있는 경우","chapter":"제2편 상행위 제11장 창고업","deleted":false,"text":"제164조(동전-부득이한 사유가 있는 경우) 부득이한 사유가 있는 경우에는 창고업자는 전조의 규정에 불구하고 언제든지 임치물을 반환할 수 있다.","kind":"L"},{"id":"L:165","label":"법 제165조","title":"준용규정","chapter":"제2편 상행위 제11장 창고업","deleted":false,"text":"제165조(준용규정) 제67조제1항과 제2항의 규정은 임치인 또는 창고증권소지인이 임치물의 수령을 거부하거나 이를 수령할 수 없는 경우에 준용한다.","kind":"L"},{"id":"L:166","label":"법 제166조","title":"창고업자의 책임의 시효","chapter":"제2편 상행위 제11장 창고업","deleted":false,"text":"①임치물의 멸실 또는 훼손으로 인하여 생긴 창고업자의 책임은 그 물건을 출고한 날로부터 1년이 경과하면 소멸시효가 완성한다.\n②전항의 기간은 임치물이 전부 멸실한 경우에는 임치인과 알고 있는 창고증권소지인에게 그 멸실의 통지를 발송한 날로부터 기산한다.\n③전2항의 규정은 창고업자 또는 그 사용인이 악의인 경우에는 적용하지 아니한다.\n제166조(창고업자의 책임의 시효)","kind":"L"},{"id":"L:167","label":"법 제167조","title":"창고업자의 채권의 시효","chapter":"제2편 상행위 제11장 창고업","deleted":false,"text":"제167조(창고업자의 채권의 시효) 창고업자의 임치인 또는 창고증권소지인에 대한 채권은 그 물건을 출고한 날로부터 1년간 행사하지 아니하면 소멸시효가 완성한다.","kind":"L"},{"id":"L:168","label":"법 제168조","title":"준용규정","chapter":"제2편 상행위 제11장 창고업","deleted":false,"text":"제168조(준용규정) 제108조와 제146조의 규정은 창고업자에 준용한다. <개정 1962.12.12>","kind":"L"},{"id":"L:168-2","label":"법 제168조의2","title":"의의","chapter":"제2편 상행위 제12장 금융리스업","deleted":false,"text":"제168조의2(의의) 금융리스이용자가 선정한 기계, 시설, 그 밖의 재산(이하 이 장에서 \"금융리스물건\"이라 한다)을 제3자(이하 이 장에서 \"공급자\"라 한다)로부터 취득하거나 대여받아 금융리스이용자에게 이용하게 하는 것을 영업으로 하는 자를 금융리스업자라 한다.","kind":"L"},{"id":"L:168-3","label":"법 제168조의3","title":"금융리스업자와 금융리스이용자의 의무","chapter":"제2편 상행위 제12장 금융리스업","deleted":false,"text":"① 금융리스업자는 금융리스이용자가 금융리스계약에서 정한 시기에 금융리스계약에 적합한 금융리스물건을 수령할 수 있도록 하여야 한다.\n② 금융리스이용자는 제1항에 따라 금융리스물건을 수령함과 동시에 금융리스료를 지급하여야 한다.\n③ 금융리스물건수령증을 발급한 경우에는 제1항의 금융리스계약 당사자 사이에 적합한 금융리스물건이 수령된 것으로 추정한다.\n④ 금융리스이용자는 금융리스물건을 수령한 이후에는 선량한 관리자의 주의로 금융리스물건을 유지 및 관리하여야 한다.\n제168조의3(금융리스업자와 금융리스이용자의 의무)","kind":"L"},{"id":"L:168-4","label":"법 제168조의4","title":"공급자의 의무","chapter":"제2편 상행위 제12장 금융리스업","deleted":false,"text":"① 금융리스물건의 공급자는 공급계약에서 정한 시기에 그 물건을 금융리스이용자에게 인도하여야 한다.\n② 금융리스물건이 공급계약에서 정한 시기와 내용에 따라 공급되지 아니한 경우 금융리스이용자는 공급자에게 직접 손해배상을 청구하거나 공급계약의 내용에 적합한 금융리스물건의 인도를 청구할 수 있다.\n③ 금융리스업자는 금융리스이용자가 제2항의 권리를 행사하는 데 필요한 협력을 하여야 한다.\n제168조의4(공급자의 의무)","kind":"L"},{"id":"L:168-5","label":"법 제168조의5","title":"금융리스계약의 해지","chapter":"제2편 상행위 제12장 금융리스업","deleted":false,"text":"① 금융리스이용자의 책임 있는 사유로 금융리스계약을 해지하는 경우에는 금융리스업자는 잔존 금융리스료 상당액의 일시 지급 또는 금융리스물건의 반환을 청구할 수 있다.\n② 제1항에 따른 금융리스업자의 청구는 금융리스업자의 금융리스이용자에 대한 손해배상청구에 영향을 미치지 아니한다.\n③ 금융리스이용자는 중대한 사정변경으로 인하여 금융리스물건을 계속 사용할 수 없는 경우에는 3개월 전에 예고하고 금융리스계약을 해지할 수 있다. 이 경우 금융리스이용자는 계약의 해지로 인하여 금융리스업자에게 발생한 손해를 배상하여야 한다.\n제168조의5(금융리스계약의 해지)","kind":"L"},{"id":"L:168-6","label":"법 제168조의6","title":"의의","chapter":"제2편 상행위 제13장 가맹업","deleted":false,"text":"제168조의6(의의) 자신의 상호ㆍ상표 등(이하 이 장에서 \"상호등\"이라 한다)을 제공하는 것을 영업으로 하는 자[이하 \"가맹업자\"(加盟業者)라 한다]로부터 그의 상호등을 사용할 것을 허락받아 가맹업자가 지정하는 품질기준이나 영업방식에 따라 영업을 하는 자를 가맹상(加盟商)이라 한다.","kind":"L"},{"id":"L:168-7","label":"법 제168조의7","title":"가맹업자의 의무","chapter":"제2편 상행위 제13장 가맹업","deleted":false,"text":"① 가맹업자는 가맹상의 영업을 위하여 필요한 지원을 하여야 한다.\n② 가맹업자는 다른 약정이 없으면 가맹상의 영업지역 내에서 동일 또는 유사한 업종의 영업을 하거나, 동일 또는 유사한 업종의 가맹계약을 체결할 수 없다.\n제168조의7(가맹업자의 의무)","kind":"L"},{"id":"L:168-8","label":"법 제168조의8","title":"가맹상의 의무","chapter":"제2편 상행위 제13장 가맹업","deleted":false,"text":"① 가맹상은 가맹업자의 영업에 관한 권리가 침해되지 아니하도록 하여야 한다.\n② 가맹상은 계약이 종료한 후에도 가맹계약과 관련하여 알게 된 가맹업자의 영업상의 비밀을 준수하여야 한다.\n제168조의8(가맹상의 의무)","kind":"L"},{"id":"L:168-9","label":"법 제168조의9","title":"가맹상의 영업양도","chapter":"제2편 상행위 제13장 가맹업","deleted":false,"text":"① 가맹상은 가맹업자의 동의를 받아 그 영업을 양도할 수 있다.\n② 가맹업자는 특별한 사유가 없으면 제1항의 영업양도에 동의하여야 한다.\n제168조의9(가맹상의 영업양도)","kind":"L"},{"id":"L:168-10","label":"법 제168조의10","title":"계약의 해지","chapter":"제2편 상행위 제13장 가맹업","deleted":false,"text":"제168조의10(계약의 해지) 가맹계약상 존속기간에 대한 약정의 유무와 관계없이 부득이한 사정이 있으면 각 당사자는 상당한 기간을 정하여 예고한 후 가맹계약을 해지할 수 있다.","kind":"L"},{"id":"L:168-11","label":"법 제168조의11","title":"의의","chapter":"제2편 상행위 제14장 채권매입업","deleted":false,"text":"제168조의11(의의) 타인이 물건ㆍ유가증권의 판매, 용역의 제공 등에 의하여 취득하였거나 취득할 영업상의 채권(이하 이 장에서 \"영업채권\"이라 한다)을 매입하여 회수하는 것을 영업으로 하는 자를 채권매입업자라 한다.","kind":"L"},{"id":"L:168-12","label":"법 제168조의12","title":"채권매입업자의 상환청구","chapter":"제2편 상행위 제14장 채권매입업","deleted":false,"text":"제168조의12(채권매입업자의 상환청구) 영업채권의 채무자가 그 채무를 이행하지 아니하는 경우 채권매입업자는 채권매입계약의 채무자에게 그 영업채권액의 상환을 청구할 수 있다. 다만, 채권매입계약에서 다르게 정한 경우에는 그러하지 아니하다.","kind":"L"},{"id":"L:169","label":"법 제169조","title":"회사의 의의","chapter":"제3편 회사 제1장 통칙","deleted":false,"text":"제169조(회사의 의의) 이 법에서 \"회사\"란 상행위나 그 밖의 영리를 목적으로 하여 설립한 법인을 말한다.","kind":"L"},{"id":"L:170","label":"법 제170조","title":"회사의 종류","chapter":"제3편 회사 제1장 통칙","deleted":false,"text":"제170조(회사의 종류) 회사는 합명회사, 합자회사, 유한책임회사, 주식회사와 유한회사의 5종으로 한다.","kind":"L"},{"id":"L:171","label":"법 제171조","title":"회사의 주소","chapter":"제3편 회사 제1장 통칙","deleted":false,"text":"제171조(회사의 주소) 회사의 주소는 본점소재지에 있는 것으로 한다.","kind":"L"},{"id":"L:172","label":"법 제172조","title":"회사의 성립","chapter":"제3편 회사 제1장 통칙","deleted":false,"text":"제172조(회사의 성립) 회사는 본점소재지에서 설립등기를 함으로써 성립한다.","kind":"L"},{"id":"L:173","label":"법 제173조","title":"권리능력의 제한","chapter":"제3편 회사 제1장 통칙","deleted":false,"text":"제173조(권리능력의 제한) 회사는 다른 회사의 무한책임사원이 되지 못한다.","kind":"L"},{"id":"L:174","label":"법 제174조","title":"회사의 합병","chapter":"제3편 회사 제1장 통칙","deleted":false,"text":"①회사는 합병을 할 수 있다.\n② 합병을 하는 회사의 일방 또는 쌍방이 주식회사, 유한회사 또는 유한책임회사인 경우에는 합병 후 존속하는 회사나 합병으로 설립되는 회사는 주식회사, 유한회사 또는 유한책임회사이어야 한다. <개정 2011.4.14>\n③해산후의 회사는 존립 중의 회사를 존속하는 회사로 하는 경우에 한하여 합병을 할 수 있다.\n제174조(회사의 합병)","kind":"L"},{"id":"L:175","label":"법 제175조","title":"동전-설립위원","chapter":"제3편 회사 제1장 통칙","deleted":false,"text":"①회사의 합병으로 인하여 신회사를 설립하는 경우에는 정관의 작성 기타 설립에 관한 행위는 각 회사에서 선임한 설립위원이 공동으로 하여야 한다.\n②제230조, 제434조와 제585조의 규정은 전항의 선임에 준용한다.\n제175조(동전-설립위원)","kind":"L"},{"id":"L:176","label":"법 제176조","title":"회사의 해산명령","chapter":"제3편 회사 제1장 통칙","deleted":false,"text":"①법원은 다음의 사유가 있는 경우에는 이해관계인이나 검사의 청구에 의하여 또는 직권으로 회사의 해산을 명할 수 있다.\n1. 회사의 설립목적이 불법한 것인 때\n2. 회사가 정당한 사유없이 설립후 1년내에 영업을 개시하지 아니하거나 1년 이상 영업을 휴지하는 때\n3. 이사 또는 회사의 업무를 집행하는 사원이 법령 또는 정관에 위반하여 회사의 존속을 허용할 수 없는 행위를 한 때\n②전항의 청구가 있는 때에는 법원은 해산을 명하기 전일지라도 이해관계인이나 검사의 청구에 의하여 또는 직권으로 관리인의 선임 기타 회사재산의 보전에 필요한 처분을 할 수 있다.\n③이해관계인이 제1항의 청구를 한 때에는 법원은 회사의 청구에 의하여 상당한 담보를 제공할 것을 명할 수 있다.\n④회사가 전항의 청구를 함에는 이해관계인의 청구가 악의임을 소명하여야 한다.\n제176조(회사의 해산명령)","kind":"L"},{"id":"L:177","label":"법 제177조","title":"등기기간의 기산점","chapter":"제3편 회사 제1장 통칙","deleted":false,"text":"제177조(등기기간의 기산점) 본편의 규정에 의하여 등기할 사항으로서 관청의 허가 또는 인가를 요하는 것에 관하여는 그 서류가 도달한 날로부터 등기기간을 기산한다.","kind":"L"},{"id":"L:178","label":"법 제178조","title":"정관의 작성","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제178조(정관의 작성) 합명회사의 설립에는 2인 이상의 사원이 공동으로 정관을 작성하여야 한다.","kind":"L"},{"id":"L:179","label":"법 제179조","title":"정관의 절대적 기재사항","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"1. 목적\n2. 상호\n3. 사원의 성명ㆍ주민등록번호 및 주소\n4. 사원의 출자의 목적과 그 가격 또는 평가의 표준\n5. 본점의 소재지\n6. 정관의 작성년월일\n제179조(정관의 절대적 기재사항) 정관에는 다음의 사항을 기재하고 총사원이 기명날인 또는 서명하여야 한다. <개정 1995.12.29>","kind":"L"},{"id":"L:180","label":"법 제180조","title":"설립의 등기","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"1. 제179조제1호 내지 제3호 및 제5호의 사항과 지점을 둔 때에는 그 소재지. 다만, 회사를 대표할 사원을 정한 때에는 그 외의 사원의 주소를 제외한다.\n2. 사원의 출자의 목적, 재산출자에는 그 가격과 이행한 부분\n3. 존립기간 기타 해산사유를 정한 때에는 그 기간 또는 사유\n4. 회사를 대표할 사원을 정한 경우에는 그 성명ㆍ주소 및 주민등록번호\n5. 수인의 사원이 공동으로 회사를 대표할 것을 정한 때에는 그 규정\n제180조(설립의 등기) 합명회사의 설립등기에 있어서는 다음의 사항을 등기하여야 한다. <개정 1995.12.29, 2011.4.14>","kind":"L"},{"id":"L:181","label":"법 제181조","title":"지점 설치의 등기","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제181조(지점 설치의 등기) 회사가 지점을 설치한 경우에는 본점의 소재지에서 2주일 내에 그 지점의 소재지와 설치 연월일을 등기하여야 한다.","kind":"L"},{"id":"L:182","label":"법 제182조","title":"본점, 지점의 이전등기","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"① 회사가 본점을 이전한 경우에는 종전 소재지 또는 새 소재지에서 2주일 내에 새 소재지와 이전 연월일을 등기하여야 한다.\n② 회사가 지점을 이전한 경우에는 본점의 소재지에서 2주일 내에 새 소재지와 이전 연월일을 등기하여야 한다.\n제182조(본점, 지점의 이전등기)","kind":"L"},{"id":"L:183","label":"법 제183조","title":"변경등기","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제183조(변경등기) 제180조 각 호의 사항이 변경되었을 때에는 본점의 소재지에서 2주일 내에 변경등기를 하여야 한다.","kind":"L"},{"id":"L:183-2","label":"법 제183조의2","title":"업무집행정지가처분 등의 등기","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제183조의2(업무집행정지가처분 등의 등기) 사원의 업무집행을 정지하거나 직무대행자를 선임하는 가처분을 하거나 그 가처분을 변경ㆍ취소하는 경우에는 본점이 있는 곳의 등기소에서 이를 등기하여야 한다. <개정 2024.9.20>","kind":"L"},{"id":"L:184","label":"법 제184조","title":"설립무효, 취소의 소","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①회사의 설립의 무효는 그 사원에 한하여, 설립의 취소는 그 취소권있는 자에 한하여 회사성립의 날로부터 2년내에 소만으로 이를 주장할 수 있다.\n②민법 제140조의 규정은 전항의 설립의 취소에 준용한다.\n제184조(설립무효, 취소의 소)","kind":"L"},{"id":"L:185","label":"법 제185조","title":"채권자에 의한 설립취소의 소","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제185조(채권자에 의한 설립취소의 소) 사원이 그 채권자를 해할 것을 알고 회사를 설립한 때에는 채권자는 그 사원과 회사에 대한 소로 회사의 설립취소를 청구할 수 있다.","kind":"L"},{"id":"L:186","label":"법 제186조","title":"전속관할","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제186조(전속관할) 전2조의 소는 본점소재지의 지방법원의 관할에 전속한다.","kind":"L"},{"id":"L:187","label":"법 제187조","title":"소제기의 공고","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제187조(소제기의 공고) 설립무효의 소 또는 설립취소의 소가 제기된 때에는 회사는 지체없이 공고하여야 한다.","kind":"L"},{"id":"L:188","label":"법 제188조","title":"소의 병합심리","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제188조(소의 병합심리) 수개의 설립무효의 소 또는 설립취소의 소가 제기된 때에는 법원은 이를 병합심리하여야 한다.","kind":"L"},{"id":"L:189","label":"법 제189조","title":"하자의 보완 등과 청구의 기각","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제189조(하자의 보완 등과 청구의 기각) 설립무효의 소 또는 설립취소의 소가 그 심리중에 원인이 된 하자가 보완되고 회사의 현황과 제반사정을 참작하여 설립을 무효 또는 취소하는 것이 부적당하다고 인정한 때에는 법원은 그 청구를 기각할 수 있다.","kind":"L"},{"id":"L:190","label":"법 제190조","title":"판결의 효력","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제190조(판결의 효력) 설립무효의 판결 또는 설립취소의 판결은 제3자에 대하여도 그 효력이 있다. 그러나 판결확정전에 생긴 회사와 사원 및 제3자간의 권리의무에 영향을 미치지 아니한다.","kind":"L"},{"id":"L:191","label":"법 제191조","title":"패소원고의 책임","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제191조(패소원고의 책임) 설립무효의 소 또는 설립취소의 소를 제기한 자가 패소한 경우에 악의 또는 중대한 과실이 있는 때에는 회사에 대하여 연대하여 손해를 배상할 책임이 있다.","kind":"L"},{"id":"L:192","label":"법 제192조","title":"설립무효, 취소의 등기","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제192조(설립무효, 취소의 등기) 설립무효의 판결 또는 설립취소의 판결이 확정된 때에는 본점의 소재지에서 등기하여야 한다.","kind":"L"},{"id":"L:193","label":"법 제193조","title":"설립무효, 취소판결의 효과","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①설립무효의 판결 또는 설립취소의 판결이 확정된 때에는 해산의 경우에 준하여 청산하여야 한다.\n②전항의 경우에는 법원은 사원 기타의 이해관계인의 청구에 의하여 청산인을 선임할 수 있다.\n제193조(설립무효, 취소판결의 효과)","kind":"L"},{"id":"L:194","label":"법 제194조","title":"설립무효, 취소와 회사계속","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①설립무효의 판결 또는 설립취소의 판결이 확정된 경우에 그 무효나 취소의 원인이 특정한 사원에 한한 것인 때에는 다른 사원 전원의 동의로써 회사를 계속할 수 있다.\n②전항의 경우에는 그 무효 또는 취소의 원인이 있는 사원은 퇴사한 것으로 본다.\n③제229조제2항과 제3항의 규정은 전2항의 경우에 준용한다.\n제194조(설립무효, 취소와 회사계속)","kind":"L"},{"id":"L:195","label":"법 제195조","title":"준용법규","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제195조(준용법규) 합명회사의 내부관계에 관하여는 정관 또는 본법에 다른 규정이 없으면 조합에 관한 민법의 규정을 준용한다.","kind":"L"},{"id":"L:196","label":"법 제196조","title":"채권출자","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제196조(채권출자) 채권을 출자의 목적으로 한 사원은 그 채권이 변제기에 변제되지 아니한 때에는 그 채권액을 변제할 책임을 진다. 이 경우에는 이자를 지급하는 외에 이로 인하여 생긴 손해를 배상하여야 한다.","kind":"L"},{"id":"L:197","label":"법 제197조","title":"지분의 양도","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제197조(지분의 양도) 사원은 다른 사원의 동의를 얻지 아니하면 그 지분의 전부 또는 일부를 타인에게 양도하지 못한다.","kind":"L"},{"id":"L:198","label":"법 제198조","title":"사원의 경업의 금지","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①사원은 다른 사원의 동의가 없으면 자기 또는 제3자의 계산으로 회사의 영업부류에 속하는 거래를 하지 못하며 동종영업을 목적으로 하는 다른 회사의 무한책임사원 또는 이사가 되지 못한다.\n②사원이 전항의 규정에 위반하여 거래를 한 경우에 그 거래가 자기의 계산으로 한 것인 때에는 회사는 이를 회사의 계산으로 한 것으로 볼 수 있고 제3자의 계산으로 한것인 때에는 그 사원에 대하여 회사는 이로 인한 이득의 양도를 청구할 수 있다. <개정 1962.12.12>\n③전항의 규정은 회사의 그 사원에 대한 손해배상의 청구에 영향을 미치지 아니한다.\n④제2항의 권리는 다른 사원 과반수의 결의에 의하여 행사하여야 하며 다른 사원의 1인이 그 거래를 안 날로부터 2주간을 경과하거나 그 거래가 있은 날로부터 1년을 경과하면 소멸한다.\n제198조(사원의 경업의 금지)","kind":"L"},{"id":"L:199","label":"법 제199조","title":"사원의 자기거래","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제199조(사원의 자기거래) 사원은 다른 사원 과반수의 결의가 있는 때에 한하여 자기 또는 제3자의 계산으로 회사와 거래를 할 수 있다. 이 경우에는 민법 제124조의 규정을 적용하지 아니한다.","kind":"L"},{"id":"L:200","label":"법 제200조","title":"업무집행의 권리의무","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①각 사원은 정관에 다른 규정이 없는 때에는 회사의 업무를 집행할 권리와 의무가 있다.\n②각 사원의 업무집행에 관한 행위에 대하여 다른 사원의 이의가 있는 때에는 곧 행위를 중지하고 총사원과반수의 결의에 의하여야 한다.\n제200조(업무집행의 권리의무)","kind":"L"},{"id":"L:200-2","label":"법 제200조의2","title":"직무대행자의 권한","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①제183조의2의 직무대행자는 가처분명령에 다른 정함이 있는 경우 외에는 법인의 통상업무에 속하지 아니한 행위를 하지 못한다. 다만, 법원의 허가를 얻은 경우에는 그러하지 아니하다.\n②직무대행자가 제1항의 규정에 위반한 행위를 한 경우에도 회사는 선의의 제3자에 대하여 책임을 진다.\n제200조의2(직무대행자의 권한)","kind":"L"},{"id":"L:201","label":"법 제201조","title":"업무집행사원","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①정관으로 사원의 1인 또는 수인을 업무집행사원으로 정한 때에는 그 사원이 회사의 업무를 집행할 권리와 의무가 있다.\n②수인의 업무집행사원이 있는 경우에 그 각 사원의 업무집행에 관한 행위에 대하여 다른 업무집행사원의 이의가 있는 때에는 곧 그 행위를 중지하고 업무집행사원 과반수의 결의에 의하여야 한다.\n제201조(업무집행사원)","kind":"L"},{"id":"L:202","label":"법 제202조","title":"공동업무집행사원","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제202조(공동업무집행사원) 정관으로 수인의 사원을 공동업무집행사원으로 정한 때에 그 전원의 동의가 없으면 업무집행에 관한 행위를 하지 못한다. 그러나 지체할 염려가 있는 때에는 그러하지 아니하다.","kind":"L"},{"id":"L:203","label":"법 제203조","title":"지배인의 선임과 해임","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제203조(지배인의 선임과 해임) 지배인의 선임과 해임은 정관에 다른 정함이 없으면 업무집행사원이 있는 경우에도 총사원 과반수의 결의에 의하여야 한다.","kind":"L"},{"id":"L:204","label":"법 제204조","title":"정관의 변경","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제204조(정관의 변경) 정관을 변경함에는 총사원의 동의가 있어야 한다.","kind":"L"},{"id":"L:205","label":"법 제205조","title":"업무집행사원의 권한상실선고","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①사원이 업무를 집행함에 현저하게 부적임하거나 중대한 의무에 위반한 행위가 있는 때에는 법원은 사원의 청구에 의하여 업무집행권한의 상실을 선고할 수 있다.\n② 제1항의 판결이 확정된 때에는 본점의 소재지에서 등기하여야 한다. <개정 2024.9.20>\n제205조(업무집행사원의 권한상실선고)","kind":"L"},{"id":"L:206","label":"법 제206조","title":"준용규정","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제206조(준용규정) 제186조의 규정은 전조의 소에 준용한다.","kind":"L"},{"id":"L:207","label":"법 제207조","title":"회사대표","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제207조(회사대표) 정관으로 업무집행사원을 정하지 아니한 때에는 각 사원은 회사를 대표한다. 수인의 업무집행사원을 정한 경우에 각 업무집행사원은 회사를 대표한다. 그러나 정관 또는 총사원의 동의로 업무집행사원중 특히 회사를 대표할 자를 정할 수 있다.","kind":"L"},{"id":"L:208","label":"법 제208조","title":"공동대표","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①회사는 정관 또는 총사원의 동의로 수인의 사원이 공동으로 회사를 대표할 것을 정할 수 있다.\n②전항의 경우에도 제3자의 회사에 대한 의사표시는 공동대표의 권한있는 사원 1인에 대하여 이를 함으로써 그 효력이 생긴다.\n제208조(공동대표)","kind":"L"},{"id":"L:209","label":"법 제209조","title":"대표사원의 권한","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①회사를 대표하는 사원은 회사의 영업에 관하여 재판상 또는 재판외의 모든 행위를 할 권한이 있다.\n②전항의 권한에 대한 제한은 선의의 제3자에게 대항하지 못한다.\n제209조(대표사원의 권한)","kind":"L"},{"id":"L:210","label":"법 제210조","title":"손해배상책임","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제210조(손해배상책임) 회사를 대표하는 사원이 그 업무집행으로 인하여 타인에게 손해를 가한 때에는 회사는 그 사원과 연대하여 배상할 책임이 있다.","kind":"L"},{"id":"L:211","label":"법 제211조","title":"회사와 사원간의 소에 관한 대표권","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제211조(회사와 사원간의 소에 관한 대표권) 회사가 사원에 대하여 또는 사원이 회사에 대하여 소를 제기하는 경우에 회사를 대표할 사원이 없을 때에는 다른 사원 과반수의 결의로 선정하여야 한다.","kind":"L"},{"id":"L:212","label":"법 제212조","title":"사원의 책임","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①회사의 재산으로 회사의 채무를 완제할 수 없는 때에는 각 사원은 연대하여 변제할 책임이 있다.\n②회사재산에 대한 강제집행이 주효하지 못한 때에도 전항과 같다.\n③전항의 규정은 사원이 회사에 변제의 자력이 있으며 집행이 용이한 것을 증명한 때에는 적용하지 아니한다.\n제212조(사원의 책임)","kind":"L"},{"id":"L:213","label":"법 제213조","title":"신입사원의 책임","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제213조(신입사원의 책임) 회사성립후에 가입한 사원은 그 가입전에 생긴 회사채무에 대하여 다른 사원과 동일한 책임을 진다.","kind":"L"},{"id":"L:214","label":"법 제214조","title":"사원의 항변","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①사원이 회사채무에 관하여 변제의 청구를 받은 때에는 회사가 주장할 수 있는 항변으로 그 채권자에게 대항할 수 있다.\n②회사가 그 채권자에 대하여 상계, 취소 또는 해제할 권리가 있는 경우에는 사원은 전항의 청구에 대하여 변제를 거부할 수 있다.\n제214조(사원의 항변)","kind":"L"},{"id":"L:215","label":"법 제215조","title":"자칭사원의 책임","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제215조(자칭사원의 책임) 사원이 아닌 자가 타인에게 자기를 사원이라고 오인시키는 행위를 하였을 때에는 오인으로 인하여 회사와 거래한 자에 대하여 사원과 동일한 책임을 진다.","kind":"L"},{"id":"L:216","label":"법 제216조","title":"준용규정","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제216조(준용규정) 제205조와 제206조의 규정은 회사의 대표사원에 준용한다.","kind":"L"},{"id":"L:217","label":"법 제217조","title":"사원의 퇴사권","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①정관으로 회사의 존립기간을 정하지 아니하거나 어느 사원의 종신까지 존속할 것을 정한 때에는 사원은 영업년도말에 한하여 퇴사할 수 있다. 그러나 6월전에 이를 예고하여야 한다.\n②사원이 부득이한 사유가 있을 때에는 언제든지 퇴사할 수 있다.\n제217조(사원의 퇴사권)","kind":"L"},{"id":"L:218","label":"법 제218조","title":"퇴사원인","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"1. 정관에 정한 사유의 발생\n2. 총사원의 동의\n3. 사망\n4. 성년후견개시\n5. 파산\n6. 제명\n제218조(퇴사원인) 사원은 전조의 경우 외에 다음의 사유로 인하여 퇴사한다.","kind":"L"},{"id":"L:219","label":"법 제219조","title":"사원사망 시 권리승계의 통지","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①정관으로 사원이 사망한 경우에 그 상속인이 회사에 대한 피상속인의 권리의무를 승계하여 사원이 될 수 있음을 정한 때에는 상속인은 상속의 개시를 안 날로부터 3월내에 회사에 대하여 승계 또는 포기의 통지를 발송하여야 한다.\n②상속인이 전항의 통지 없이 3월을 경과한 때에는 사원이 될 권리를 포기한 것으로 본다.\n제219조(사원사망 시 권리승계의 통지)","kind":"L"},{"id":"L:220","label":"법 제220조","title":"제명의 선고","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①사원에게 다음의 사유가 있는 때에는 회사는 다른 사원 과반수의 결의에 의하여 그 사원의 제명의 선고를 법원에 청구할 수 있다.\n1. 출자의 의무를 이행하지 아니한 때\n2. 제198조제1항의 규정에 위반한 행위가 있는 때\n3. 회사의 업무집행 또는 대표에 관하여 부정한 행위가 있는 때, 권한없이 업무를 집행하거나 회사를 대표한 때\n4. 기타 중요한 사유가 있는 때\n②제205조제2항과 제206조의 규정은 전항의 경우에 준용한다.\n제220조(제명의 선고)","kind":"L"},{"id":"L:221","label":"법 제221조","title":"제명사원과 회사간의 계산","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제221조(제명사원과 회사간의 계산) 제명된 사원과 회사와의 계산은 제명의 소를 제기한 때의 회사재산의 상태에 따라서 하며 그 때부터 법정이자를 붙여야 한다.","kind":"L"},{"id":"L:222","label":"법 제222조","title":"지분의 환급","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제222조(지분의 환급) 퇴사한 사원은 노무 또는 신용으로 출자의 목적으로 한 경우에도 그 지분의 환급을 받을 수 있다. 그러나 정관에 다른 규정이 있는 때에는 그러하지 아니하다.","kind":"L"},{"id":"L:223","label":"법 제223조","title":"지분의 압류","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제223조(지분의 압류) 사원의 지분의 압류는 사원이 장래이익의 배당과 지분의 환급을 청구하는 권리에 대하여도 그 효력이 있다.","kind":"L"},{"id":"L:224","label":"법 제224조","title":"지분 압류채권자에 의한 퇴사청구","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①사원의 지분을 압류한 채권자는 영업년도말에 그 사원을 퇴사시킬 수 있다. 그러나 회사와 그 사원에 대하여 6월전에 그 예고를 하여야 한다.\n②전항 단서의 예고는 사원이 변제를 하거나 상당한 담보를 제공한 때에는 그 효력을 잃는다.\n제224조(지분 압류채권자에 의한 퇴사청구)","kind":"L"},{"id":"L:225","label":"법 제225조","title":"퇴사원의 책임","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①퇴사한 사원은 본점소재지에서 퇴사등기를 하기 전에 생긴 회사채무에 대하여는 등기후 2년내에는 다른 사원과 동일한 책임이 있다.\n②전항의 규정은 지분을 양도한 사원에 준용한다.\n제225조(퇴사원의 책임)","kind":"L"},{"id":"L:226","label":"법 제226조","title":"퇴사원의 상호변경청구권","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제226조(퇴사원의 상호변경청구권) 퇴사한 사원의 성명이 회사의 상호 중에 사용된 경우에는 그 사원은 회사에 대하여 그 사용의 폐지를 청구할 수 있다.","kind":"L"},{"id":"L:227","label":"법 제227조","title":"해산원인","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"1. 존립기간의 만료 기타 정관으로 정한 사유의 발생\n2. 총사원의 동의\n3. 사원이 1인으로 된 때\n4. 합병\n5. 파산\n6. 법원의 명령 또는 판결\n제227조(해산원인) 회사는 다음의 사유로 인하여 해산한다.","kind":"L"},{"id":"L:228","label":"법 제228조","title":"해산등기","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제228조(해산등기) 회사가 해산된 때에는 합병과 파산의 경우 외에는 그 해산사유가 있은 날부터 2주일 내에 본점의 소재지에서 해산등기를 하여야 한다.","kind":"L"},{"id":"L:229","label":"법 제229조","title":"회사의 계속","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①제227조제1호와 제2호의 경우에는 사원의 전부 또는 일부의 동의로 회사를 계속할 수 있다. 그러나 동의를 하지 아니한 사원은 퇴사한 것으로 본다.\n②제227조제3호의 경우에는 새로 사원을 가입시켜서 회사를 계속할 수 있다.\n③ 제1항과 제2항의 경우에 이미 회사의 해산등기를 하였을 때에는 본점의 소재지에서 2주일 내에 회사의 계속등기를 하여야 한다. <개정 2024.9.20>\n④제213조의 규정은 제2항의 신입사원의 책임에 준용한다.\n제229조(회사의 계속)","kind":"L"},{"id":"L:230","label":"법 제230조","title":"합병의 결의","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제230조(합병의 결의) 회사가 합병을 함에는 총사원의 동의가 있어야 한다.","kind":"L"},{"id":"L:231","label":"법 제231조","title":"","chapter":"제3편 회사 제2장 합명회사","deleted":true,"text":"제231조 삭제 <1984.4.10>","kind":"L"},{"id":"L:232","label":"법 제232조","title":"채권자의 이의","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①회사는 합병의 결의가 있은 날부터 2주내에 회사채권자에 대하여 합병에 이의가 있으면 일정한 기간내에 이를 제출할 것을 공고하고 알고 있는 채권자에 대하여는 따로따로 이를 최고하여야 한다. 이 경우 그 기간은 1월 이상이어야 한다. <개정 1984.4.10, 1998.12.28>\n②채권자가 제1항의 기간내에 이의를 제출하지 아니한 때에는 합병을 승인한 것으로 본다. <개정 1984.4.10>\n③이의를 제출한 채권자가 있는 때에는 회사는 그 채권자에 대하여 변제 또는 상당한 담보를 제공하거나 이를 목적으로 하여 상당한 재산을 신탁회사에 신탁하여야 한다.\n제232조(채권자의 이의)","kind":"L"},{"id":"L:233","label":"법 제233조","title":"합병의 등기","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제233조(합병의 등기) 회사가 합병을 한 때에는 본점의 소재지에서 2주일 내에 합병 후 존속하는 회사의 변경등기, 합병으로 인하여 소멸하는 회사의 해산등기, 합병으로 인하여 설립되는 회사의 설립등기를 하여야 한다.","kind":"L"},{"id":"L:234","label":"법 제234조","title":"합병의 효력발생","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제234조(합병의 효력발생) 회사의 합병은 합병후 존속하는 회사 또는 합병으로 인하여 설립되는 회사가 그 본점소재지에서 전조의 등기를 함으로써 그 효력이 생긴다.","kind":"L"},{"id":"L:235","label":"법 제235조","title":"합병의 효과","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제235조(합병의 효과) 합병후 존속한 회사 또는 합병으로 인하여 설립된 회사는 합병으로 인하여 소멸된 회사의 권리의무를 승계한다.","kind":"L"},{"id":"L:236","label":"법 제236조","title":"합병무효의 소의 제기","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①회사의 합병의 무효는 각 회사의 사원, 청산인, 파산관재인 또는 합병을 승인하지 아니한 회사채권자에 한하여 소만으로 이를 주장할 수 있다.\n②전항의 소는 제233조의 등기가 있은 날로부터 6월내에 제기하여야 한다.\n제236조(합병무효의 소의 제기)","kind":"L"},{"id":"L:237","label":"법 제237조","title":"준용규정","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제237조(준용규정) 제176조제3항과 제4항의 규정은 회사채권자가 전조의 소를 제기한 때에 준용한다.","kind":"L"},{"id":"L:238","label":"법 제238조","title":"합병무효의 등기","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제238조(합병무효의 등기) 합병을 무효로 한 판결이 확정된 때에는 본점의 소재지에서 합병 후 존속하는 회사의 변경등기, 합병으로 인하여 소멸한 회사의 회복등기, 합병으로 인하여 설립된 회사의 해산등기를 하여야 한다.","kind":"L"},{"id":"L:239","label":"법 제239조","title":"무효판결확정과 회사의 권리의무의 귀속","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①합병을 무효로 한 판결이 확정된 때에는 합병을 한 회사는 합병후 존속한 회사 또는 합병으로 인하여 설립된 회사의 합병후 부담한 채무에 대하여 연대하여 변제할 책임이 있다.\n②합병후 존속한 회사 또는 합병으로 인하여 설립한 회사의 합병후 취득한 재산은 합병을 한 회사의 공유로 한다.\n③전2항의 경우에 각 회사의 협의로 그 부담부분 또는 지분을 정하지 못한 때에는 법원은 그 청구에 의하여 합병당시의 각 회사의 재산상태 기타의 사정을 참작하여 이를 정한다.\n제239조(무효판결확정과 회사의 권리의무의 귀속)","kind":"L"},{"id":"L:240","label":"법 제240조","title":"준용규정","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제240조(준용규정) 제186조 내지 제191조의 규정은 합병무효의 소에 준용한다.","kind":"L"},{"id":"L
