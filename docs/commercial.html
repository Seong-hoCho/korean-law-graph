상금","court":"서울중앙지방법원","date":"2022.02.17","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=236073"},{"id":"P:617203","kind":"P","label":"2021가합7525","title":"손해배상(기)","court":"수원지방법원안산지원","date":"2022.01.27","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=617203"},{"id":"P:619343","kind":"P","label":"2017가합526119","title":"손해배상(기)","court":"서울중앙지방법원","date":"2022.01.27","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619343"},{"id":"P:231487","kind":"P","label":"2021다271947","title":"채무부존재확인","court":"대법원","date":"2022.01.27","caseType":"민사","basis":"참조조문","text":"[1] 채무이행을 최고받은 채무자가 이행의무의 존부 등에 대하여 조사를 해 볼 필요가 있다는 이유로 채권자에게 이행의 유예를 구한 경우, 민법 제174조에서 정한 ‘6월’의 기간의 기산점 및 위와 같은 이행의 유예를 구한 경우가 아니라면 위 6월의 기간은 최고가 있은 때로부터 기산되는지 여부 / 이때 채무자가 이행의 유예를 구하였는지에 관한 증명책임의 소재 [2] 甲 보험회사와 乙이 체결한 보험계약의 보험수익자인 丙이 乙이 사망한 보험사고와 관련하여 甲 회사에 사망보험금 청구를 하였으나 甲 회사가 질병사망 보험금만을 지급하였고, 그 후 丙이 일반상해사망 보험금이 지급되었어야 한다고 주장하면서 다시 보험금 청구를 하자 甲 회사가 소멸시효 완성을 이유로 보험금 지급채무 부존재 확인을 구한 사안에서, 甲 회사가 丙의 제1차 보험금 청구에 대하여 이행의 유예를 구하였거나 丙이 6월 내에 민법 제174조에서 정한 시효중단 조치를 취하였다고 볼 수 없는데도, 丙이 제1차 보험금 청구를 하였다는 사정만으로 甲 회사의 소멸시효 완성 주장을 배척한 원심판결에 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=231487"},{"id":"P:223453","kind":"P","label":"2022비합1002","title":"청산인의선임","court":"서울서부지방법원","date":"2022.01.25","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=223453"},{"id":"P:231493","kind":"P","label":"2021다264819","title":"구상금","court":"대법원","date":"2022.01.14","caseType":"민사","basis":"참조조문","text":"[1] 보험자가 상법 제682조 제1항에서 정한 보험자대위권을 행사할 수 있는 범위 [2] 불법행위로 인하여 건물이 훼손된 경우, 통상의 손해를 산정하는 방법 [3] 甲 보험회사가 乙과 건물 및 건물 내 가재도구를 보험목적물로 하는 화재보험계약을 체결하면서 건물에 대하여 감가상각이 적용된 수리비와 재조달가액의 차액을 보상하여 주는 주택복구비용지원특약을 하였는데, 丙 주식회사가 생산·판매한 전기밥솥의 제조상의 결함으로 건물에 화재가 발생하자 甲 회사가 乙에게 감가상각을 고려한 수리비 및 위 특약에 기한 복구비용지원금을 보험금으로 지급한 후 丙 회사와 그 보험자인 丁 보험회사를 상대로 구상금 지급을 구한 사안에서, 甲 회사는 보험자대위에 기하여 자신이 보험금으로 지급한 감가상각을 고려한 수리비에 대해 청구할 수 있을 뿐이고, 복구비용지원금은 별도의 특약에 따라 추가로 지급한 금원일 뿐이므로 이를 보험자대위에 기하여 청구할 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=231493"},{"id":"P:231499","kind":"P","label":"2021다269722","title":"손해배상(기)","court":"대법원","date":"2022.01.13","caseType":"민사","basis":"참조조문","text":"[1] 대리인이 본인을 위하여 상행위를 한 경우, 대리행위임을 현명하지 않았더라도 상법 제48조에 따라 유효한 대리행위로서 그 효과가 본인에게 귀속되는지 여부 [2] 甲 주식회사가 자신이 소유한 토지 위에 오피스텔 등을 신축·분양하기 위하여 乙 신탁회사와 관리형 토지신탁계약을 체결하여 이에 따라 오피스텔이 신축되었는데, 乙 회사와 분양계약을 체결하거나 수분양권자의 지위를 양수한 丙 등이 오피스텔에 관한 소유권이전등기의무의 이행불능으로 분양계약이 해제되었다며 乙 회사의 분양계약상 지위를 승계한 甲 회사를 상대로 원상회복 등을 구하자, 甲 회사가 자신이 ‘乙 회사를 대리하여 2차례에 걸쳐 잔금 지급을 최고하였는데도 丙 등이 잔금을 지급하지 않아 분양계약이 이행지체를 사유로 한 乙 회사의 해제 표시로 丙 등의 해제 표시 전에 이미 적법하게 해제되었다.’며 다투었고, 이에 대해 丙 등은 甲 회사로부터 최고를 받았음을 인정하면서도 ‘분양계약의 당사자가 아닌 甲 회사가 乙 회사를 위한 것임을 표시하지 않고 한 위 최고는 이행최고로서 효력이 없다.’고 주장한 사안에서, 오피스텔 분양계약의 체결·이행·해제 등에 관한 행위는 분양자인 乙 회사에 대하여 상행위가 되므로, 오피스텔 분양계약 해제를 위한 위 최고에는 甲 회사의 주장과 같이 상법 제48조에 따라 비현명주의가 적용된다고 볼 여지가 충분한데도, 이에 관한 심리·판단 없이 위 최고의 효력을 부인","url":"https://www.law.go.kr/precInfoP.do?precSeq=231499"},{"id":"P:231641","kind":"P","label":"2021나12240","title":"소유권이전등기","court":"부산고등법원창원재판부","date":"2022.01.13","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=231641"},{"id":"P:231535","kind":"P","label":"2017다294202","title":"보험금","court":"대법원","date":"2021.12.30","caseType":"민사","basis":"참조조문","text":"甲 회계법인과 乙 보험회사가 ‘공인회계사 전문인 배상책임보험계약’을 체결하면서 약관에 ‘乙 회사는 甲 법인이 타인에게 공인회계사의 서비스를 제공하는 과정에서 발생한 행위, 오류 또는 탈루에 기인하여 법률적 손해배상으로서 지급할 의무가 있는 모든 금액을 지급해야 한다.’는 내용의 보상책임 조항과 ‘각각의 클레임에 적용되는 보상한도는 손해배상청구·요구·소송·법적 절차 또는 청구권자의 수와 관계없이 동일하거나 관련된 행위, 오류 또는 탈루로부터 발생하는 모든 손해배상금 및 손해사고처리비용에 대한 보험자의 배상책임한도액이고, 자기부담금도 각각의 클레임에 적용된다.’는 내용의 보상한도 및 자기부담금 조항을 두었는데, 甲 법인이 丙 주식회사의 연이은 2개 사업연도에 관하여 수행한 각 회계감사에서 현금 및 현금성 자산이 허위 계상된 점을 발견하지 못하는 오류를 범하였다는 이유로 丙 회사의 주주들에게 손해배상을 하게 되자, 乙 회사가 甲 법인에 보험금을 지급하면서 자기부담금을 2회 공제한 사안에서, 甲 법인이 범한 각 회계감사상 오류가 ‘동일하거나 관련된 오류’라고 볼 수 없고, 이는 주주들이 각 회계감사상 오류를 묶어 하나의 손해배상소송으로 제기하였다고 달리 볼 수 없다는 이유 등을 들어, 위 보험계약에서 자기부담금 공제와 관련하여 클레임은 사업연도마다 별개로 보아야 한다고 한 다음, 乙 회사가 보험금을 산정할 때 2개의 클레임이 있음을 전제로 ","url":"https://www.law.go.kr/precInfoP.do?precSeq=231535"},{"id":"P:223435","kind":"P","label":"2021나2023191","title":"회사에관한소송","court":"서울고등법원","date":"2021.12.23","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=223435"},{"id":"P:421258","kind":"P","label":"2021구합5172","title":"농협경제지주 회사 물류센터 신축 부지의 정당한 사유","court":"제주지방법원","date":"2021.12.21","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=421258"},{"id":"P:239129","kind":"P","label":"2020나64837","title":"손해배상(기)","court":"서울중앙지방법원","date":"2021.12.16","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=239129"},{"id":"P:424192","kind":"P","label":"2020구합85887","title":"취득세 등 부과처분 취소(○○경제지주회사 분리·설립시점이 사업시행인가 후 환지 전인 경우 감면대상 아님)","court":"서울행정법원","date":"2021.12.10","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=424192"},{"id":"P:230705","kind":"P","label":"2020다295359","title":"대여금","court":"대법원","date":"2021.12.10","caseType":"민사","basis":"참조조문","text":"[1] 일방적 상행위 또는 보조적 상행위로 인한 채권이 상법 제64조의 소멸시효기간이 적용되는 상사채권에 해당하는지 여부 및 상인이 기본적 영업활동을 종료하거나 폐업신고를 한 후에 한 청산사무나 잔무처리 행위가 보조적 상행위인지 여부 [2] 부부인 甲과 乙이 마트를 운영하는 동안 丙으로부터 돈을 융통하면서 당좌수표와 약속어음을 발행 또는 배서하여 교부하였는데, 다른 채권자 丁의 신청으로 마트 내 유체동산에 대한 가압류집행을 당하자, 폐업신고를 하고 해방공탁을 통해 가압류집행 취소결정을 받은 다음, 丙에게 ‘6일 후까지 금전채무를 이행하지 않을 때에는 즉시 강제집행을 당하여도 이의가 없음을 인낙한다.’는 내용의 금전소비대차계약 공정증서를 작성하여 준 사안에서, 위 공정증서 작성 행위가 보조적 상행위에 해당한다고 볼 수 있는데도 공정증서상 채권에 대하여 민법상 10년의 소멸시효기간이 적용된다고 본 원심판단에 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=230705"},{"id":"P:221873","kind":"P","label":"2020누62299","title":"시정명령등취소","court":"서울고등법원","date":"2021.12.09","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=221873"},{"id":"P:221815","kind":"P","label":"2021비합10000","title":"주주총회소집허가","court":"춘천지방법원속초지원","date":"2021.12.06","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=221815"},{"id":"P:220269","kind":"P","label":"2021나2016551","title":"주식명의개서","court":"서울고등법원","date":"2021.11.26","caseType":"민사","basis":"참조조문","text":"甲 주식회사가 乙 주식회사의 대표이사이자 대주주인 丙으로부터 그가 보유하던 乙 회사의 주권미발행 주식 중 일부를 매수하고서도 명의개서를 못 하고 있다가 丙이 사망하자 乙 회사를 상대로 명의개서를 구하는 소를 제기하였고, 그 후 개시된 乙 회사에 대한 회생절차에서 위 주식을 포함하여 주주명부상 丙이 보유하던 주식 전부를 무상 소각하는 내용의 회생계획을 인가하는 결정이 내려졌다가, 甲 회사의 즉시항고에 따른 항고심에서 ‘회생계획 인가결정 이후에 甲 회사가 회생절차개시결정일 당시 위 주식의 주주였다는 점이 밝혀지면 乙 회사는 甲 회사에 일정액의 금전을 지급한다.’는 내용의 권리보호조항이 추가된 회생계획 인가결정이 내려지자, 위 소의 청구취지를 주주 지위의 확인을 구하는 것으로 교환적으로 변경하였는데, 乙 회사가 위 청구는 과거 법률관계의 확인을 구하는 것이어서 확인의 이익이 없다고 본안전항변을 한 사안에서, 甲 회사의 청구가 과거의 법률관계에 관한 것이기는 하나 예외적으로 확인의 이익이 인정된다는 이유로 본안전항변을 배척한 다음 甲 회사는 乙 회사에 대한 회생절차개시결정일 당시 위 주식의 주주였다고 판단한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=220269"},{"id":"P:219837","kind":"P","label":"2018다304007","title":"신주발행무효청구","court":"대법원","date":"2021.11.25","caseType":"민사","basis":"참조조문","text":"[1] 상행위로 인하여 생긴 채권을 담보하기 위하여 유질약정이 포함된 질권설정계약이 체결된 경우, 질권의 실행 방법이나 절차는 질권설정계약에서 정한 바에 따라야 하는지 여부 [2] 유질약정이 포함된 질권설정계약을 체결하면서 질물인 비상장주식의 가격이나 그 산정방식에 관하여 정하지 않았고 객관적으로 형성된 시장가격이 없거나 이를 확인하기 어려운 형편이어서, 채권자가 처분정산의 방식으로 질권을 실행하면서 일반적으로 허용된 비상장주식의 가격 산정방식 중 하나를 채택하여 처분가액을 산정하였는데 나중에 그 가격이 합리적인 가격이 아니었다고 인정되는 경우, 채권자의 처분행위가 무효로 되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=219837"},{"id":"P:219895","kind":"P","label":"2016가합550030","title":"보험금","court":"서울중앙지방법원","date":"2021.11.17","caseType":"민사","basis":"참조조문","text":"甲이 캄보디아 국적의 乙과 혼인한 후, 丙 보험회사와 피보험자를 乙로 하고 사망보험금 수익자를 甲으로 하는 생명보험계약을 체결하였는데, 甲이 고속도로를 주행하던 중 화물차를 추돌하는 사고가 발생하여 조수석에 타고 있던 乙이 사망하였고, 이에 甲이 丙 회사를 상대로 보험금 지급을 구한 사안에서, 제반 사정에 비추어 乙이 보험계약의 내용을 이해한 후 진정한 의사로 동의하였다고 볼 수 없으므로 보험계약이 무효라고 본 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=219895"},{"id":"P:223421","kind":"P","label":"2021다220642","title":"구상금","court":"대법원","date":"2021.11.11","caseType":"민사","basis":"참조조문","text":"[1] 민법 제766조 제2항에서 불법행위로 인한 손해배상청구권의 소멸시효 기산점으로 정한 ‘불법행위를 한 날’의 의미 [2] 불법행위가 계속적으로 이루어지고 각개의 불법행위를 개별적으로 특정할 수 있는 경우, 이로 인해 발생한 각 손해마다 별개의 손해배상채권이 성립하는지 여부 및 이 경우 손해배상채권의 소멸시효는 각 손해가 발생한 때부터 개별적으로 진행하는지 여부 [3] 상법 제64조에서 정한 일반 상사시효가 불법행위로 인한 손해배상채권에 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=223421"},{"id":"P:219783","kind":"P","label":"2017다222368","title":"회사에관한소송","court":"대법원","date":"2021.11.11","caseType":"민사","basis":"참조조문","text":"[1] 대표이사가 다른 이사의 업무집행이 위법하다고 의심할 만한 사유가 있는데도 고의 또는 과실로 감시의무를 위반하여 이를 방치한 경우, 이로 인해 회사가 입은 손해에 대하여 배상책임을 지는지 여부 [2] 대규모 회사에서 대표이사와 업무담당이사들이 내부적인 사무분장에 따라 각자의 전문 분야를 전담하여 처리하는 것이 불가피하다는 사정만으로 다른 이사들의 업무집행에 관한 감시의무를 면하는지 여부 및 이러한 경우 구축하여야 할 내부통제시스템의 형태 / 대표이사가 회사의 목적이나 규모, 영업의 성격, 법령의 규제 등에 비추어 높은 법적 위험이 예상되는데도 이와 관련된 내부통제시스템을 구축하고 그것이 제대로 작동되도록 하기 위한 노력을 전혀 하지 않거나 위 시스템을 통한 감시·감독의무의 이행을 의도적으로 외면하여 다른 이사 등의 위법한 업무집행을 방지하지 못한 경우, 대표이사로서 회사 업무 전반에 대한 감시의무를 게을리한 것인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=219783"},{"id":"P:221823","kind":"P","label":"2020나10895","title":"손해배상(기)","court":"광주고등법원제주재판부","date":"2021.11.10","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=221823"},{"id":"P:219911","kind":"P","label":"2020나2049059","title":"상환금청구의소","court":"서울고등법원","date":"2021.10.28","caseType":"민사","basis":"참조조문","text":"甲 주식회사가 乙 주식회사와, 甲 회사가 乙 회사의 상환주식을 인수하는 내용의 신주인수계약을 체결하면서 ‘乙 회사는 위 주식 발행 이후 신주 또는 주식 관련 사채를 발행하는 경우 甲 회사에 사전 서면동의를 받아야 하고, 이를 위반한 때에는 甲 회사가 위 주식의 조기상환 및 위약벌을 청구할 수 있다.’는 취지의 약정을 하였는데, 위 주식 발행 이후 乙 회사가 甲 회사의 사전 서면동의 없이 신주를 발행하자, 甲 회사가 乙 회사를 상대로 위 주식의 조기상환 및 위약벌을 청구한 사안에서, 위 사전 서면동의 약정과 그 위반 시 제재로서의 조기상환 및 위약벌 약정은 주주평등의 원칙에 반하여 무효라고 본 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=219911"},{"id":"P:614367","kind":"P","label":"2020가단5024659","title":"구상금","court":"서울중앙지방법원","date":"2021.10.28","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=614367"},{"id":"P:218433","kind":"P","label":"2020다208058","title":"부당이득금","court":"대법원","date":"2021.10.28","caseType":"민사","basis":"참조조문","text":"회사가 특정 주주와 사이에 특정한 금액으로 주식을 매수하기로 약정함으로써 사실상 매수청구를 할 수 있는 권리를 부여하여 주주가 그 권리를 행사하는 경우, 상법 제341조의2 제4호가 적용되는지 여부 / 이 경우 상법 제341조에서 정한 요건하에서만 회사의 자기주식취득이 허용되는지 여부 및 위 규정에서 정한 요건과 절차에 의하지 않은 자기주식취득 약정의 효력","url":"https://www.law.go.kr/precInfoP.do?precSeq=218433"},{"id":"P:236035","kind":"P","label":"2020나2036343","title":"손해배상(기)","court":"서울고등법원","date":"2021.10.14","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=236035"},{"id":"P:218201","kind":"P","label":"2021나2015992","title":"공사대금","court":"서울고등법원","date":"2021.09.17","caseType":"민사","basis":"참조조문","text":"甲 주식회사 등 5개 회사로 구성된 공동수급체의 구성원인 乙 주식회사가 丙 주식회사와 하도급계약을 체결하였고, 그 후 乙 회사에 대한 회생절차가 개시되자 丙 회사가 공사대금채권을 회생채권으로 신고하였으나, 乙 회사의 관리인이 그중 일부는 丁 은행이 丙 회사로부터 양수하여 회생채권으로 신고하였다는 이유 등으로 부인하였고, 나머지는 시인하였는데, 丙 회사가 甲 회사를 상대로 미지급 공사대금채무의 지급을 구한 사안에서, 甲 회사는 상법 제57조 제1항에 따라 하도급계약에 따른 공사대금의 지급에 관하여 연대책임을 지고, 丙 회사와 丁 은행이 乙 회사에 대한 회생절차에 참가하여 회생채권을 신고함에 따른 소멸시효 중단의 효력은 연대채무자인 甲 회사에도 미친다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=218201"},{"id":"P:221903","kind":"P","label":"2020나53071","title":"배당이의","court":"부산지방법원","date":"2021.09.10","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=221903"},{"id":"P:226975","kind":"P","label":"2020다299122","title":"대여금","court":"대법원","date":"2021.09.09","caseType":"민사","basis":"참조조문","text":"[1] 일방적 상행위 또는 보조적 상행위로 인한 채권도 상법 제64조의 상사시효가 적용되는 상사채권에 해당하는지 여부 및 상행위인 계약의 해제로 인한 원상회복청구권이 상법 제64조의 상사시효의 대상이 되는지 여부 [2] 상행위인 계약의 무효로 인한 부당이득반환청구권이 상행위인 계약에 기초하여 이루어진 급부 자체의 반환을 구하는 것으로서 법률관계를 상거래 관계와 같은 정도로 신속하게 해결할 필요성이 있는 경우, 상법 제64조의 상사시효가 적용되거나 유추적용되는지 여부 및 이러한 법리는 상행위인 계약의 불성립으로 인한 부당이득반환청구권에도 그대로 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=226975"},{"id":"P:219343","kind":"P","label":"2020나1957","title":"상호말소등","court":"특허법원","date":"2021.09.09","caseType":"민사","basis":"판례내용","text":"등록상표 “”, “”, “”, “”을 사용하여 학원을 운영하는 甲 주식회사가 “청담수학”, “청담 e-math” 등의 표장을 사용하여 수학학원경영업 등을 영위하는 乙 주식회사를 상대로 위 표장의 사용금지 등을 구한 사안에서, 乙 회사가 위 표장을 사용하는 행위가 甲 회사의 등록상표권을 침해한다거나 부정경쟁방지 및 영업비밀보호에 관한 법률 제2조 제1호 목 또는 목의 부정경쟁행위에 해당하지 않는다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=219343"},{"id":"P:420838","kind":"P","label":"2020누48972, 2020누48989(병합), 2020누48996(병합), 2020누49005(병합), 2020누49012(병합)","title":"주주 1명과 그의 특수관계인들이 비상장법인인 ▣▣▣렌탈의 주식을 취득함으로써 그들 소유주식의 합계가 해당 법인의 발행주식총수의 100분의 50분을 초과하면서 그에 관한 권리를 실질적으로 행사하는 자가 되는 것에 관하여 실질과 괴리되는 비합리적인 형식이나 외관을 취한 것이라고 볼 수 있는지 여부 및 이 사건 각 거래를 유효한 것으로 인정하는 것이 실질과세 원칙이나 조세공평 원칙상 심히 부당하다고 볼 수 있는지 여부","court":"서울고등법원","date":"2021.09.08","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=420838"},{"id":"P:221871","kind":"P","label":"2020나2034989","title":"주주대표소송(손해배상)","court":"서울고등법원","date":"2021.09.03","caseType":"민사","basis":"참조조문","text":"甲 주식회사가 ‘4대강 살리기 사업’, ‘영주다목적댐 건설공사’, ‘인천도시철도 2호선 건설공사’와 관련하여 乙 주식회사 등 다른 업체들과 입찰담합을 하였다는 이유로 공정거래위원회로부터 과징금을 부과받는 손해를 입자, 甲 회사 발행주식총수의 1만분의 1 이상의 주식을 소유한 주주인 丙 등이 위 담합행위 당시 甲 회사의 대표이사 겸 이사인 丁과 이사인 戊 등을 상대로 손해배상을 구하는 대표소송을 제기한 사안에서, 丁은 甲 회사의 대표이사로서 그 임직원이 ‘4대강 살리기 사업’ 관련 입찰담합을 하여 독점규제 및 공정거래에 관한 법률 등을 위반하는 행위를 한다고 의심할 만한 충분한 사유가 있었는데도 만연히 이를 방치하여 임무를 게을리하였으므로 그로 인해 甲 회사가 입은 손해를 배상할 책임이 있고, 丁과 戊 등은 甲 회사의 이사로서 위 입찰담합 등 임직원의 위법행위에 관하여 합리적인 정보 및 보고시스템과 내부통제시스템을 구축하고 그것이 제대로 작동하도록 배려할 의무를 이행하지 않아 이사의 감시의무를 위반하였으므로 그로 인해 甲 회사가 입은 손해를 배상할 책임이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=221871"},{"id":"P:602003","kind":"P","label":"2020누57686","title":"종합소득세부과처분취소등","court":"서울고등법원","date":"2021.08.27","caseType":"세무","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=602003"},{"id":"P:217453","kind":"P","label":"2020마5520","title":"파산선고","court":"대법원","date":"2021.08.26","caseType":"민사","basis":"참조조문","text":"주식회사의 대표이사가 회사를 대표하여 파산신청을 할 경우, 이사회 결의가 필요한지 여부 및 상법 제383조 제1항 단서에서 정한 소규모 주식회사의 경우 대표이사가 이사회 결의 없이 파산신청을 할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=217453"},{"id":"P:226953","kind":"P","label":"2020다291449","title":"보험금","court":"대법원","date":"2021.08.26","caseType":"민사","basis":"참조조문","text":"[1] 보험자에게 보험약관의 명시·설명의무가 면제되는 경우 및 보험자가 보험약관의 명시·설명의무를 위반하여 보험계약을 체결한 경우, 그 약관의 내용을 보험계약의 내용으로 주장할 수 있는지 여부 [2] 甲과 乙 보험회사가 체결한 보험계약의 약관에서 ‘이륜자동차를 계속적으로 사용하게 된 경우’를 보험계약 후 알릴 의무의 대상으로 규정하는 조항을 두고 있는데, 위 약관 조항에 대한 乙 회사의 명시·설명의무가 면제되는지 문제 된 사안에서, 甲이 ‘이륜자동차를 계속적으로 사용하게 된 경우는 사고발생의 위험이 현저하게 변경 또는 증가된 경우에 해당하여 乙 회사에 통지하여야 하고, 이를 이행하지 않을 경우 계약이 해지될 수 있다.’는 사정까지 예상할 수는 없었고, 위 약관 조항의 내용이 단순히 법령에 의하여 정하여진 것을 되풀이하거나 부연하는 정도에 불과하다고 보기도 어려우므로, 위 약관 조항에 대한 乙 회사의 명시·설명의무는 면제되지 않는다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=226953"},{"id":"P:217299","kind":"P","label":"2018다270876","title":"손해배상(산)","court":"대법원","date":"2021.08.19","caseType":"민사","basis":"참조조문","text":"[1] 사용자가 근로계약에 수반되는 신의칙상의 부수적 의무로서 근로자의 안전에 대한 보호의무를 부담하는지 여부 및 이를 위반하여 근로자가 손해를 입은 경우 손해배상책임을 지는지 여부 [2] 근로계약상 보호의무 위반에 따른 근로자의 손해배상청구권에 대하여 10년의 민사 소멸시효기간이 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=217299"},{"id":"P:420858","kind":"P","label":"2020누45454, 2020누45492(병합), 2020누45485(병합), 2020누45461(병합), 2020누45478(병합)","title":"주주 1명과 그의 특수관계인들이 비상장법인인 ▣▣▣렌탈의 주식을 취득함으로써 그들 소유주식의 합계가 해당 법인의 발행주식총수의 100분의 50분을 초과하면서 그에 관한 권리를 실질적으로 행사하는 자가 되는 것에 관하여 실질과 괴리되는 비합리적인 형식이나 외관을 취한 것이라고 볼 수 있는지 여부 및 이 사건 각 거래를 유효한 것으로 인정하는 것이 실질과세 원칙이나 조세공평 원칙상 심히 부당하다고 볼 수 있는지 여부","court":"서울고등법원","date":"2021.08.19","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=420858"},{"id":"P:217295","kind":"P","label":"2018다258074","title":"수수료반환","court":"대법원","date":"2021.08.19","caseType":"민사","basis":"참조조문","text":"상행위인 계약의 무효로 인한 부당이득반환청구권의 소멸시효기간 / 부당이득반환청구권이 상행위인 계약에 기초하여 이루어진 급부 자체의 반환을 구하는 것으로서 법률관계를 상거래 관계와 같은 정도로 신속하게 해결할 필요성이 있는 경우, 5년의 상사 소멸시효기간이 적용되는지 여부 / 이러한 법리는 실제로 발생하지 않은 보험사고의 발생을 가장하여 청구ㆍ수령된 보험금 상당 부당이득반환청구권의 경우에도 마찬가지로 적용할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=217295"},{"id":"P:217305","kind":"P","label":"2020다285406","title":"주주총회결의무효확인등","court":"대법원","date":"2021.08.19","caseType":"민사","basis":"참조조문","text":"상법 제385조 제1항에서 해임대상으로 정하고 있는 ‘이사’에 ‘임기만료 후 이사로서의 권리의무를 행사하고 있는 퇴임이사’가 포함되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=217305"},{"id":"P:231649","kind":"P","label":"2021비합50013","title":"주주총회소집허가","court":"대전지방법원","date":"2021.08.18","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=231649"},{"id":"P:217335","kind":"P","label":"2021다210195","title":"손해배상(기)","court":"대법원","date":"2021.08.12","caseType":"민사","basis":"참조조문","text":"[1] 불법행위로 피해자 소유의 물건이 손괴되어 피해자가 수리에 소요되는 부가가치세까지 부담하여야 하는 경우, 피해자가 가해자에게 위 부가가치세를 포함한 수리비만큼의 손해배상을 구할 수 있는지 여부 및 위 부가가치세가 부가가치세법 제38조 제1항 제1호의 매입세액에 해당하여 이를 매출세액에서 공제하거나 환급받을 수 있는 경우, 피해자가 가해자에게 위 부가가치세 상당의 손해배상을 구할 수 있는지 여부 / 위 법리는 도급인이 수급인을 상대로 하자보수를 갈음하는 손해배상청구를 하는 경우에도 마찬가지인지 여부 [2] 도급공사의 하자보수에 소요되는 부가가치세가 부가가치세법 제39조 제1항 제7호에서 정한 ‘면세사업과 관련된 매입세액’ 등에 해당하여 부가가치세 면세사업자인 도급인이 이를 자기의 매출세액에서 공제하거나 환급받을 수 없는 경우, 도급인이 수급인에게 위 부가가치세 상당의 손해배상을 청구할 수 있는지 여부 및 도급인에게 책임지울 수 없는 사유로 부가가치세액의 공제나 환급이 사실상 불가능하게 된 경우, 하자보수를 갈음하는 손해배상액에서 위 부가가치세액을 공제할 수 있는지 여부 [3] 건설공사에 관한 도급계약이 상행위에 해당하는 경우, 수급인의 하자담보책임의 소멸시효기간 및 그 기산점","url":"https://www.law.go.kr/precInfoP.do?precSeq=217335"},{"id":"P:217391","kind":"P","label":"2017두63337","title":"법인세부과처분취소","court":"대법원","date":"2021.07.29","caseType":"세무","basis":"참조조문","text":"상법 제341조 제1항 단서의 의미 및 주식회사가 차입금으로 자기주식을 취득하는 것이 상법 제341조 제1항 단서에 따라 허용되지 않는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=217391"},{"id":"P:234557","kind":"P","label":"2019나108778","title":"임대차보증금","court":"대전지방법원","date":"2021.07.23","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=234557"},{"id":"P:232061","kind":"P","label":"2020가단56283","title":"구상금·보험금","court":"전주지방법원군산지원","date":"2021.07.22","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=232061"},{"id":"P:217339","kind":"P","label":"2019다277812","title":"보험계약무효확인등청구의소","court":"대법원","date":"2021.07.22","caseType":"민사","basis":"참조조문","text":"보험계약자가 다수의 계약을 통하여 보험금을 부정 취득할 목적으로 체결한 보험계약이 민법 제103조에 따라 무효인 경우, 보험금에 대한 부당이득반환청구권에 상법 제64조를 유추적용하여 5년의 상사 소멸시효기간이 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=217339"},{"id":"P:217343","kind":"P","label":"2020다284977","title":"임시주주총회결의무효확인등","court":"대법원","date":"2021.07.22","caseType":"민사","basis":"참조조문","text":"주주총회결의의 부존재 또는 무효 확인을 구하는 소를 여러 사람이 공동으로 제기한 경우, 민사소송법 제67조가 적용되는 필수적 공동소송에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=217343"},{"id":"P:220113","kind":"P","label":"2021노24","title":"특정경제범죄가중처벌등에관한법률위반(배임)(피고인들에대하여일부인정된죄명:업무상배임)·업무상횡령·주택법위반·사전자기록등변작·변작사전자기록등행사","court":"대전고등법원청주재판부","date":"2021.07.22","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=220113"},{"id":"P:216937","kind":"P","label":"2016다25393","title":"상표및상호사용금지","court":"대법원","date":"2021.07.15","caseType":"민사","basis":"참조조문","text":"[1] 인터넷주소자원에 관한 법률 제12조에 따라 도메인이름의 등록말소 또는 등록이전을 청구하는 자에게 ‘정당한 권원’이 있다고 인정하기 위한 요건 / 위 규정에서 정한 ‘부정한 목적이 있는 행위’에 정당한 권원이 있는 자의 도메인이름의 등록을 방해하는 행위 등과 같이 부당한 이득과 직접 관련되지 않는 행위도 포함되는지 여부 및 부정한 목적이 있는지 판단하는 기준 [2] 도메인이름에 관하여 정당한 권원이 있는 자가 도메인이름에 관한 권리를 침해하고 있거나 침해할 우려가 있는 자를 상대로 침해의 우려가 있는 행위의 금지 또는 예방을 청구할 수 있는지 여부 및 이를 판단하는 기준 [3] 상법 제23조 제1항에서 정한 ‘타인의 영업으로 오인할 수 있는 상호’에 해당하는지 판단하는 기준 / 위 규정에서 정한 ‘부정한 목적’의 의미 및 이를 판단하는 기준 [4] 甲 주식회사의 대표이사와 乙이 체결한 자산매매계약 등에 따라 甲 회사가 사용하는 상호 ‘굿옥션’과 같은 명칭의 丙 주식회사가 설립되어 甲 회사의 유ㆍ무형 자산 일체를 인수받아 영업을 시작하였고, 甲 회사가 丙 회사에 이전한 도메인이름은 丁 앞으로 등록이전되어 丙 회사가 사용하고 있는데, 그 후 주주총회 특별결의 없이 체결한 위 계약이 무효라는 취지의 판결이 선고ㆍ확정되었으나, 丙 회사가 위 상호와 도메인이름을 계속 사용하고 있는 사안에서, 甲 회사의 丁에 대한 도메인이름 등록이전 청구","url":"https://www.law.go.kr/precInfoP.do?precSeq=216937"},{"id":"P:216945","kind":"P","label":"2018다298744","title":"주주대표소송","court":"대법원","date":"2021.07.15","caseType":"민사","basis":"참조조문","text":"[1] 자본금 감소를 위한 주식소각 절차에 하자가 있고 이사가 주식소각 과정에서 법령을 위반하여 회사에 손해를 끼친 사실이 인정되는 경우, 감자무효 판결의 확정 여부와 관계없이 상법 제399조 제1항에 따라 회사에 대하여 손해배상책임을 부담하는지 여부 [2] 상법 제403조 제2항에 따른 서면에 기재되어야 하는 ‘이유’에 책임추궁 대상 이사, 책임발생 원인사실에 관한 내용이 포함되어야 하는지 여부 및 서면에 책임추궁 대상 이사의 성명이 기재되어 있지 않거나 책임발생 원인사실이 다소 개략적으로 기재되어 있더라도, 회사가 서면에 기재된 내용, 회사 보유 자료 등을 종합하여 이를 구체적으로 특정할 수 있는 경우, 그 서면은 상법 제403조 제2항에서 정한 요건을 충족하였다고 보아야 하는지 여부 [3] 주주가 대표소송에서 주장한 이사의 손해배상책임이 상법 제403조 제2항에 따른 서면에 적시된 것과 차이가 있으나 위 서면의 책임발생 원인사실을 기초로 하면서 법적 평가만을 달리한 것인 경우, 그 대표소송이 적법한지 여부 / 주주가 대표소송 계속 중에 위와 같은 청구를 추가할 수 있는지 여부 [4] 항소심에서 수 개의 청구가 선택적으로 병합된 경우의 심리방법과 항소심 판결의 주문 [5] 상법 제399조 제1항에 따른 이사의 회사에 대한 손해배상채무에 관하여 이사가 지체책임을 지는 시기","url":"https://www.law.go.kr/precInfoP.do?precSeq=216945"},{"id":"P:226913","kind":"P","label":"2020나60108","title":"구상금","court":"광주지방법원","date":"2021.07.14","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=226913"},{"id":"P:216975","kind":"P","label":"2018다225289","title":"업무집행사원및대표사원지위확인","court":"대법원","date":"2021.07.08","caseType":"민사","basis":"참조조문","text":"[1] 합자회사의 무한책임사원이 업무집행권한의 상실을 선고하는 판결로 업무집행권 및 대표권을 상실한 이후 어떠한 사유 등으로 합자회사의 유일한 무한책임사원이 된 경우, 업무집행권 및 대표권이 부활하는지 여부 [2] 합자회사에서 무한책임사원들만으로 업무집행사원이나 대표사원을 선임하도록 정한 정관 규정의 효력 / 업무집행권한의 상실을 선고하는 판결로 업무집행권 및 대표권을 상실한 무한책임사원이 이후 다른 무한책임사원의 사망 등으로 유일한 무한책임사원이 된 경우, 위 정관을 근거로 단독으로 의결권을 행사하여 자신을 업무집행사원이나 대표사원으로 선임할 수 있는지 여부 및 이 경우 해당 무한책임사원이 업무집행사원 등에 선임될 수 있는 방법","url":"https://www.law.go.kr/precInfoP.do?precSeq=216975"},{"id":"P:238623","kind":"P","label":"2020가합574934","title":"위약벌청구의소","court":"서울중앙지방법원","date":"2021.07.08","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238623"},{"id":"P:219475","kind":"P","label":"2018다288723","title":"손해배상(기)","court":"대법원","date":"2021.06.30","caseType":"민사","basis":"참조조문","text":"[1] 손해보험의 보험사고에 관하여 동시에 불법행위나 채무불이행에 기한 손해배상책임을 지는 제3자가 있어 피보험자가 그를 상대로 손해배상청구를 하는 경우, 피보험자가 손해보험계약에 따라 보험자로부터 수령한 보험금을 제3자의 손해배상책임액에서 공제하여야 하는지 여부 [2] 甲 주식회사가 乙 주식회사 소유의 건물에서 발생한 불이 甲 회사 소유의 건물로 옮겨붙은 사고로 발생한 전체 손해액 중 丙 보험회사로부터 받은 보험금을 공제한 잔액을 손해배상으로 구한 사안에서, 甲 회사의 전체 손해액에서 보험금을 공제하고 남은 손해액이 실화책임에 관한 법률 제3조 제2항에 따라 경감된 乙 회사의 손해배상책임액보다 적으므로 乙 회사는 甲 회사에 남은 손해액 전부를 지급할 의무가 있는데도, 乙 회사의 손해배상책임액에서 보험금을 공제한 잔액이 乙 회사가 최종적으로 지급하여야 할 손해배상액이라고 본 원심판결에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=219475"},{"id":"P:218837","kind":"P","label":"2020가합533643","title":"채무부존재확인","court":"서울중앙지방법원","date":"2021.06.25","caseType":"민사","basis":"참조조문","text":"디지털 비디오 스트리밍 서비스를 제공하는 甲 미국회사와 그 한국 계열사가 인터넷접속역무를 제공하는 기간통신사업자인 乙 주식회사를 상대로 ‘乙 회사가 제공하는 인터넷접속역무를 통하여 인터넷에 접속하는 이용자들에 대한 甲 회사 등의 서비스 제공으로 인하여 유발되는 인터넷 트래픽과 관련하여, 乙 회사의 국내망 및 국제망을 통한 전송, 이러한 망의 운영, 증설 또는 이용에 대하여 협상하거나 대가를 지급할 채무’의 부존재 확인을 구한 사안에서, ‘협상의무’ 부존재 확인 청구는 확인의 이익이 인정되지 않아 부적법하고, 甲 회사 등은 적어도 乙 회사로부터 乙 회사의 인터넷망에 대한 연결 및 연결 상태의 유지라는 유상의 역무를 제공받는 것에 대한 대가를 지급할 의무를 부담한다고 봄이 타당하므로, ‘대가 지급채무’ 부존재 확인 청구는 전부 이유 없다고 본 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=218837"},{"id":"P:607291","kind":"P","label":"2020나11597","title":"주주대표소송·주주대표소송","court":"대전고등법원","date":"2021.06.24","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=607291"},{"id":"P:216831","kind":"P","label":"2020다208621","title":"부당이득금","court":"대법원","date":"2021.06.24","caseType":"민사","basis":"참조조문","text":"[1] 부당이득반환청구권에 5년의 소멸시효를 정한 상법 제64조가 적용되는 경우 [2] 위법배당에 따른 부당이득반환청구권의 소멸시효기간","url":"https://www.law.go.kr/precInfoP.do?precSeq=216831"},{"id":"P:241325","kind":"P","label":"2020가단5237271","title":"구상금","court":"서울중앙지방법원","date":"2021.06.17","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=241325"},{"id":"P:231655","kind":"P","label":"2020가합12038","title":"소유권이전등기","court":"창원지방법원진주지원","date":"2021.06.15","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=231655"},{"id":"P:219509","kind":"P","label":"2020다298389","title":"구상금","court":"대법원","date":"2021.06.10","caseType":"민사","basis":"참조조문","text":"상법이 제3자에 대한 보험자대위의 규정을 둔 이유 / 상법 제682조에서 정한 ‘제3자의 행위’의 의미 및 이에 해당하려면 고의 또는 과실에 의한 행위여야만 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=219509"},{"id":"P:236897","kind":"P","label":"2020나205494","title":"부당이득금","court":"의정부지방법원","date":"2021.06.03","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=236897"},{"id":"P:231657","kind":"P","label":"2020가합11770","title":"배당금청구","court":"수원지방법원안산지원","date":"2021.05.27","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=231657"},{"id":"P:223469","kind":"P","label":"2019가합582069","title":"회사에관한소송","court":"서울중앙지방법원","date":"2021.05.27","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=223469"},{"id":"P:216657","kind":"P","label":"2019다291399","title":"손해배상(기)","court":"대법원","date":"2021.05.13","caseType":"민사","basis":"참조조문","text":"상법 제403조 제2항에 따른 서면에 기재되어야 하는 ‘이유’에 책임추궁 대상 이사, 책임발생 원인사실에 관한 내용이 포함되어야 하는지 여부 및 서면에 책임추궁 대상 이사의 성명이 기재되어 있지 않거나 책임발생 원인사실이 다소 개략적으로 기재되어 있으나 회사가 서면에 기재된 내용, 회사 보유 자료 등을 종합하여 이를 구체적으로 특정할 수 있는 경우, 그 서면이 상법 제403조 제2항에서 정한 요건을 충족하였다고 보아야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=216657"},{"id":"P:216667","kind":"P","label":"2018다275888","title":"손해배상(기)","court":"대법원","date":"2021.05.07","caseType":"민사","basis":"참조조문","text":"[1] 금융기관의 임원이 대출과 관련하여 선량한 관리자의 주의의무를 위반하였는지 판단하는 기준 [2] 금융기관의 이사가 이른바 프로젝트 파이낸스 대출을 하면서 단순히 회사의 영업에 이익이 될 것이라고 기대하고 일방적으로 임무를 수행하여 회사에 손해를 입힌 경우, 이러한 이사의 행위가 허용되는 경영판단의 재량범위에 있다고 할 수 있는지 여부 [3] 주식회사의 이사가 회사에 대하여 상법 제399조 제1항에 따라 손해배상채무를 부담하는 경우 이행청구를 받은 때부터 지체책임을 지는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=216667"},{"id":"P:218213","kind":"P","label":"2017두57431","title":"분담금부과처분무효확인","court":"대법원","date":"2021.04.29","caseType":"일반행정","basis":"판례내용","text":"[1] 법인이 해당 지방자치단체에서 인적ㆍ물적 설비를 갖추고 계속적으로 사업을 영위하면서 해당 지방자치단체의 재산 또는 공공시설의 설치로 특히 이익을 받는 경우, 지방자치법 제138조에 따른 분담금 납부의무자가 될 수 있는지 여부 [2] 수도법 제71조 제1항에 따른 원인자부담금을 부담하였음에도 이와 별도로 지방자치법 제138조 및 제139조 제1항의 위임에 근거한 조례에 따라 시설분담금을 추가로 부과하는 경우, 부담금관리 기본법 제5조 제1항이 금지하는 부담금 이중부과에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=218213"},{"id":"P:226855","kind":"P","label":"2016두45240","title":"시설분담금(상수도원인자부담금)부과처분무효확인","court":"대법원","date":"2021.04.29","caseType":"일반행정","basis":"판결요지","text":"법인이 해당 지방자치단체에서 인적ㆍ물적 설비를 갖추고 계속적으로 사업을 영위하면서 해당 지방자치단체의 재산 또는 공공시설의 설치로 특히 이익을 받는 경우, 지방자치법 제138조에 따른 분담금 납부의무자가 될 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=226855"},{"id":"P:218227","kind":"P","label":"2016두57359","title":"상수도시설분담금부과처분취소청구의소","court":"대법원","date":"2021.04.29","caseType":"일반행정","basis":"판례내용","text":"[1] 법인이 해당 지방자치단체에서 인적ㆍ물적 설비를 갖추고 계속적으로 사업을 영위하면서 해당 지방자치단체의 재산 또는 공공시설의 설치로 특히 이익을 받는 경우, 지방자치법 제138조에 따른 분담금 납부의무자가 될 수 있는지 여부 [2] 수도법 제71조 제1항에 따른 원인자부담금을 부담하였음에도 이와 별도로 지방자치법 제138조 및 제139조 제1항의 위임에 근거한 조례에 따라 시설분담금을 추가로 부과하는 경우, 부담금관리 기본법 제5조 제1항이 금지하는 부담금 이중부과에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=218227"},{"id":"P:226861","kind":"P","label":"2017다261943","title":"배당이의","court":"대법원","date":"2021.04.29","caseType":"민사","basis":"참조조문","text":"[1] 사법상의 계약 기타 법률행위가 일정한 행위를 금지하는 구체적 법규정을 위반하여 행하여진 경우, 법률행위가 무효인지 또는 법원이 법률행위 내용의 실현에 대한 조력을 거부하거나 기타 다른 내용으로 효력이 제한되는지 판단하는 기준 [2] 상법 제542조의9 제1항을 위반하여 이루어진 신용공여가 사법상 무효인지 여부 및 이는 이사회의 사전 승인이나 사후 추인이 있어도 마찬가지인지 여부 / 제3자가 상법 제542조의9 제1항을 위반한 신용공여인지 알지 못하였고 알지 못한 데에 중대한 과실이 없는 경우, 제3자에게 무효를 주장할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=226861"},{"id":"P:232685","kind":"P","label":"2020가합13546","title":"임시주주총회결의무효확인의소","court":"제주지방법원","date":"2021.04.15","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=232685"},{"id":"P:218975","kind":"P","label":"2017다253829","title":"소유권이전등기말소","court":"대법원","date":"2021.04.15","caseType":"민사","basis":"참조조문","text":"대표이사가 대표권 제한을 위반하여 한 거래행위가 상법 제209조 제2항에 의해 유효한 경우에 해당하더라도 그 거래행위가 대표권을 남용한 행위로서 상대방이 대표이사의 진의를 알았거나 알 수 있었다면 회사에 대하여 무효가 되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=218975"},{"id":"P:234895","kind":"P","label":"2020나1108","title":"근로에관한소송","court":"서울고등법원춘천재판부","date":"2021.04.09","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=234895"},{"id":"P:233309","kind":"P","label":"2020나2030352","title":"경업금지","court":"서울고등법원","date":"2021.04.08","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233309"},{"id":"P:215149","kind":"P","label":"2016도14165","title":"자본시장과금융투자업에관한법률위반","court":"대법원","date":"2021.03.25","caseType":"형사","basis":"참조조문","text":"구 자본시장과 금융투자업에 관한 법률 제9조 제1항 제2호 목, 같은 법 시행령 제9조 제2호, 구 금융투자업규정 제1-6조에서 규정한 ‘주요주주’의 의미 / 투자자가 기존 지배주주 등과의 투자계약이나 주주 간 계약 등을 통하여 1차적으로 발행주식총수의 100분의 1 이상의 주식을 인수한 다음 지배적인 영향력을 행사하는 데 필요한 추가 투자의 기반을 마련하기 위한 회사 내 여건 조성 등을 기존 지배주주 등에게 요구하였으나, 기존 지배주주 등이 경영전략 등 주요 의사결정이나 업무집행에 관하여 그 요구나 지시를 따르지 않으면 안 될 사실상 구속력을 인정하기 어렵거나, 오히려 기존 지배주주 등이 지배적인 영향력을 계속 보유ㆍ행사하면서 투자자와 대립하거나 투자자의 추가 투자 등을 통한 지배 근거 확보를 견제하고 있는 상황인 경우, 그 투자자가 위 주요주주에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=215149"},{"id":"P:215165","kind":"P","label":"2018다287935","title":"보험금등청구의소","court":"대법원","date":"2021.03.18","caseType":"민사","basis":"판례내용","text":"국민건강보험공단이 불법행위의 피해자에게 보험급여를 한 다음 국민건강보험법 제58조 제1항에 따라 피해자의 가해자에 대한 기왕치료비 손해배상채권을 대위하는 경우, 대위의 범위 / 국민건강보험법에 따라 보험급여를 받은 피해자가 가해자를 상대로 손해배상청구를 할 때 그 손해 발생에 피해자의 과실이 경합된 경우, 기왕치료비 손해배상채권액을 산정하는 방식 / 제3자의 손해배상 후 피해자가 보험급여를 받은 경우, 국민건강보험공단이 국민건강보험법 제57조에 따라 피해자에게 부당이득으로 징수할 수 있는 범위","url":"https://www.law.go.kr/precInfoP.do?precSeq=215165"},{"id":"P:213713","kind":"P","label":"2015다45451","title":"보증채무금","court":"대법원","date":"2021.02.18","caseType":"민사","basis":"참조조문","text":"주식회사의 정관이나 이사회 규정 등에서 이사회 결의를 거치도록 대표이사의 대표권을 제한한 경우, 거래행위의 상대방인 제3자가 상법 제209조 제2항에 따라 보호받기 위하여 선의 이외에 무과실까지 필요한지 여부 및 이때 제3자에게 중대한 과실이 있는 경우에는 거래행위가 무효인지 여부 / 이는 주식회사의 대표이사가 상법 제393조 제1항에서 정한 ‘중요한 자산의 처분 및 양도, 대규모 재산의 차입 등의 행위’에 관하여 이사회의 결의를 거치지 않고 거래행위를 한 경우에도 마찬가지인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=213713"},{"id":"P:218679","kind":"P","label":"2019나51126","title":"손해배상(기)","court":"인천지방법원","date":"2021.02.10","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=218679"},{"id":"P:226781","kind":"P","label":"2017다281367","title":"보험금","court":"대법원","date":"2021.02.04","caseType":"민사","basis":"참조조문","text":"[1] 사망을 보험사고로 하는 보험계약에서 자살을 보험자의 면책사유로 규정하고 있더라도 피보험자가 정신질환 등으로 자유로운 의사결정을 할 수 없는 상태에서 사망의 결과를 발생케 한 직접적인 원인행위가 외래의 요인에 의한 경우, 보험사고인 사망에 해당하는지 여부 및 이때 정신질환 등으로 자유로운 의사결정을 할 수 없는 상태에서의 사망이었는지 여부의 판단 기준 [2] 甲의 딸 乙이 초등학교 교사로 근무하던 중 우울증으로 자살에 이르자, 甲이 丙 보험회사 등을 상대로 재해사망보험금을 청구한 사안에서, 乙이 우울증으로 자유로운 의사결정을 할 수 없는 상태에서 자살하였다고 보기 어렵다고 본 원심판단에 법리오해 등의 잘못이 있다고 한 사례 [3] 보험금청구권의 소멸시효 기산점","url":"https://www.law.go.kr/precInfoP.do?precSeq=226781"},{"id":"P:232647","kind":"P","label":"2018누52497","title":"과징금부과처분등취소청구의소","court":"서울고등법원","date":"2021.01.28","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=232647"},{"id":"P:228419","kind":"P","label":"2020나2030130","title":"매매대금","court":"서울고등법원","date":"2021.01.20","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=228419"},{"id":"P:226725","kind":"P","label":"2019마5031","title":"가압류취소","court":"대법원","date":"2021.01.14","caseType":"민사","basis":"판례내용","text":"[1] 집합건물의 소유 및 관리에 관한 법률 제42조의2에서 정한 결의취소의 소의 대상이 되는 하자의 정도 및 위 규정에서 정한 취소사유로 인해 취소할 수 있는 결의는 제척기간 내에 제기된 결의취소의 소에 의하여 취소되지 않는 한 유효한지 여부 [2] 집합건물의 소유 및 관리에 관한 법률 제23조에 의하여 설립된 관리단의 관리단집회에서 임원선임결의가 있은 후 다시 개최된 관리단집회에서 종전 결의를 그대로 인준하거나 재차 임원선임결의를 한 경우, 새로운 관리단집회가 무권리자에 의하여 소집된 관리단집회라는 사유를 독립된 무효사유로 볼 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=226725"},{"id":"P:213083","kind":"P","label":"2018다273981","title":"관리비","court":"대법원","date":"2021.01.14","caseType":"민사","basis":"판례내용","text":"[1] 집합건물의 소유 및 관리에 관한 법률 제42조의2에서 정한 결의취소의 소의 대상이 되는 하자의 정도 및 위 규정에서 정한 취소사유로 인해 취소할 수 있는 결의가 제척기간 내에 제기된 결의취소의 소에 의하여 취소되지 않는 한 유효한지 여부 / 이때 제척기간을 도과하였는지는 법원의 직권조사사항인지 여부 [2] 집합건물의 소유 및 관리에 관한 법률 제23조에 의하여 설립된 관리단의 관리단집회에서 임원선임결의가 있은 후 다시 개최된 관리단집회에서 종전 결의를 그대로 인준하거나 재차 임원선임결의를 한 경우, 새로운 관리단집회가 무권리자에 의하여 소집된 관리단집회라는 사유를 독립된 무효사유로 볼 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=213083"},{"id":"P:217655","kind":"P","label":"2018나2034290","title":"손해배상(기)","court":"서울고등법원","date":"2020.12.17","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=217655"},{"id":"P:233387","kind":"P","label":"2020가단219217","title":"손해배상(자)","court":"인천지방법원","date":"2020.12.15","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233387"},{"id":"P:218251","kind":"P","label":"2020다251229","title":"손해배상(기)","court":"대법원","date":"2020.12.10","caseType":"민사","basis":"참조조문","text":"[1] 제3자의 행위로 발생한 사고로 인해 피보험자에게 보험목적물과 보험목적물이 아닌 재산 모두에 손해가 발생하여 보험자가 피보험자에게 보험목적물에 관한 손해에 대하여 보험금을 지급한 경우, 보험자대위의 효과 발생의 범위를 판단하는 방법 및 이때 피보험자가 제3자에게 보험목적물이 아닌 재산에 관한 손해 전부의 배상을 구할 수 있는지 여부 [2] 甲이 乙 보험회사와 甲의 점포 중 사무동 건물 등을 보험목적물로 한 손해보험계약을 체결한 후 丙 측의 과실로 발생한 화재로 인해 위 보험목적물과 보험목적물이 아닌 창고동 내 비품 등이 소훼되는 손해가 발생하였는데, 甲이 乙 회사로부터 보험목적물에 관하여 발생한 손해에 대하여 일부 보험금을 지급받은 후 丙 등을 상대로 손해배상을 구한 사안에서, 甲은 丙 등에게 보험목적물에 관한 잔존 손해액 및 보험목적물이 아닌 재산 등에 관한 손해 전액의 배상을 청구할 수 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=218251"},{"id":"P:226621","kind":"P","label":"2020나51535","title":"채무부존재확인·보험금","court":"부산고등법원","date":"2020.12.09","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=226621"},{"id":"P:222879","kind":"P","label":"2020나30391","title":"구상금","court":"서울중앙지방법원","date":"2020.11.27","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=222879"},{"id":"P:218267","kind":"P","label":"2020다247268","title":"보험금","court":"대법원","date":"2020.11.26","caseType":"민사","basis":"참조조문","text":"甲 보험회사가 보험계약 체결 당시 보험계약자 乙이 고지의무를 위반하였고 자신은 그 사실을 알게 된 때로부터 1개월이 지나기 전 해지의 의사를 표시하였으므로 보험계약이 해지되었다고 주장한 사안에서, 손해사정회사가 종국보고서를 제출한 때가 아니라 2차 중간보고서를 제출한 때에 이미 甲 회사는 乙이 고의 또는 중대한 과실로 중요한 사항에 관하여 부실 고지를 한 사실을 알게 되었다고 봄이 타당하므로, 그로부터 1개월이 지난 시점에 이루어진 甲 회사의 해지 의사표시는 제척기간 도과 후의 해지권 행사로서 효력이 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=218267"},{"id":"P:214355","kind":"P","label":"2018다283315","title":"자본감소무효확인의소","court":"대법원","date":"2020.11.26","caseType":"민사","basis":"참조조문","text":"[1] 상법 제445조에서 정한 자본금감소 무효의 소를 제기할 수 있는 경우 [2] 소수주식의 강제매수제도를 통한 소수주주 축출제도를 회피하기 위하여 탈법적으로 동일한 효과를 갖는 다른 방식을 활용하는 것이 위법한지 여부 및 주식병합으로 소수주주가 주주의 지위를 상실한 경우, 그 자체로 위법하다고 볼 수 있는지 여부 [3] 甲 주식회사가 임시주주총회를 개최하여 1주당 액면가를 5,000원에서 50,000,000원으로 인상하는 10,000:1의 주식병합을 하고, 10,000주에 미치지 못하는 주식을 보유한 주주에게 1주당 액면가 5,000원을 지급하기로 하는 내용의 ‘주식병합 및 자본금감소’를 결의하였고, 이에 따라 乙을 포함하여 10,000주 미만의 주식을 보유한 주주들이 주주의 지위를 상실한 사안에서, 위 주식병합 및 자본금감소가 주주총회의 특별결의 등 상법에서 정한 절차를 거쳤음에도 주주평등의 원칙, 신의성실의 원칙 및 권리남용금지의 원칙에 위배된다고 본 원심판단에 법리오해 등의 위법이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=214355"},{"id":"P:220957","kind":"P","label":"2020누21159","title":"상수도시설분담금부과처분무효확인","court":"부산고등법원","date":"2020.11.25","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=220957"},{"id":"P:214507","kind":"P","label":"2014가합525054","title":"손해배상청구","court":"서울중앙지방법원","date":"2020.11.20","caseType":"민사","basis":"판례내용","text":"甲 주식회사 등이 수입ㆍ제조ㆍ판매한 담배를 20갑년 이상 흡연한 乙 등이 폐암 및 후두암 등의 진단을 받게 되자, 乙 등에게 보험급여 비용을 지출한 국민건강보험공단이 甲 회사 등을 상대로 그 지출 비용 상당의 손해배상을 구한 사안에서, 위 비용 지출로 인한 재산의 감소 또는 재산상의 불이익은 불법행위에 따른 손해배상책임에서 말하는 손해라 할 수 없고, 甲 회사 등의 행위와 보험급여 비용 지출 사이에 상당인과관계가 인정된다고 보기도 어려우므로 국민건강보험공단이 甲 회사 등을 상대로 손해배상을 구할 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=214507"},{"id":"P:220135","kind":"P","label":"2019나73126","title":"손해배상(기)","court":"인천지방법원","date":"2020.11.17","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=220135"},{"id":"P:423596","kind":"P","label":"2019구합78814","title":"주식 액면미달 발행에 따른 법인등기부상 자본금 변경등기시의 등록면허세 과세표준","court":"서울행정법원","date":"2020.10.30","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=423596"},{"id":"P:227871","kind":"P","label":"2019다301678","title":"보험에관한소송","court":"대법원","date":"2020.10.29","caseType":"민사","basis":"참조조문","text":"[1] 보험계약 존속 중 당사자 일방의 부당한 행위 등으로 신뢰관계가 파괴되어 계약의 존속을 기대할 수 없는 중대한 사유가 있는 경우, 상대방이 보험계약을 해지할 수 있는지 여부 [2] 보험계약자 측이 입원치료를 지급사유로 보험금을 청구하거나 이를 지급받았으나 입원치료의 전부 또는 일부가 필요하지 않은 것으로 밝혀진 경우, 보험자가 보험계약을 해지할 수 있는지 여부 / 보험자에게 위 해지권에 관한 사전 설명의무가 있는지 여부 및 보험자의 위 해지권 행사를 상법 제663조나 약관의 규제에 관한 법률 제9조 제2호 위반으로 볼 수 있는지 여부 / 보험자가 보험금 지급심사 단계에서 지급 요건을 충족하지 못한 것을 밝히지 못하고 보험금을 지급했다는 이유만으로 위 해지권 행사를 보험계약상 신의성실의 원칙 위반으로 볼 수 있는지 여부 / 구체적 사안에서 보험자가 위 해지권을 행사할 수 있는지 판단하는 방법","url":"https://www.law.go.kr/precInfoP.do?precSeq=227871"},{"id":"P:230471","kind":"P","label":"2017가합2297","title":"주주총회결의무효확인","court":"전주지방법원","date":"2020.10.29","caseType":"민사","basis":"참조조문","text":"甲 주식회사의 주주총회가 ‘총회의 안건이 적대적 인수합병을 위한 안건임을 총회 소집 전 이사회가 결의로 확인한 경우 총회의 결의요건을 출석한 주주의 의결권의 100분의 90 이상과 발행주식총수의 100분의 70 이상으로 한다.’는 조항과 ‘위 가중조항을 개정하고자 하는 경우에도 위와 같은 방법에 의한다.’는 조항을 신설하는 내용의 정관변경결의를 하자, 甲 회사의 주주 乙이 위 결의가 상법 제434조 등을 위반하였다며 주주총회결의의 무효확인을 구한 사안에서, 위 가중조항과 같은 이른바 초다수결의제는 관련 상법 규정의 문언과 의미 및 입법 취지 등에 비추어 현행 상법하에서 원칙적으로 허용될 수 없고, 설령 예외적으로 허용된다고 하더라도 그 가중비율이 지나치게 과도한 점 등 제반 사정에 비추어, 위 가중조항은 상법에 반하는 것으로서 허용될 수 없으므로 주주총회결의가 무효라고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=230471"},{"id":"P:227869","kind":"P","label":"2019다267020","title":"보험계약존재확인의소","court":"대법원","date":"2020.10.29","caseType":"민사","basis":"참조조문","text":"[1] 보험계약 존속 중 당사자 일방의 부당한 행위 등으로 신뢰관계가 파괴되어 계약의 존속을 기대할 수 없는 중대한 사유가 있는 경우, 상대방이 보험계약을 해지할 수 있는지 여부 [2] 보험계약자 측이 입원치료를 지급사유로 보험금을 청구하거나 이를 지급받았으나 입원치료의 전부 또는 일부가 필요하지 않은 것으로 밝혀진 경우, 보험자가 보험계약을 해지할 수 있는지 여부 / 보험자에게 위 해지권에 관한 사전 설명의무가 있는지 여부 및 보험자의 위 해지권 행사를 상법 제663조나 약관의 규제에 관한 법률 제9조 제2호 위반으로 볼 수 있는지 여부 / 보험자가 보험금 지급심사 단계에서 지급요건을 충족하지 못한 것을 밝히지 못하고 보험금을 지급했다는 이유만으로 위 해지권 행사를 보험계약상 신의성실의 원칙 위반으로 볼 수 있는지 여부 / 구체적 사안에서 보험자가 위 해지권을 행사할 수 있는지 판단하는 방법 [3] 보험계약의 기초가 되는 신뢰관계를 파괴하는 당사자 일방의 부당한 행위가 해당 보험계약의 특약에 관한 것이더라도 그 행위가 중대하여 계약 자체의 유지를 기대할 수 없는 경우, 이로 인한 해지의 효력이 보험계약 전부에 미치는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=227869"},{"id":"P:230337","kind":"P","label":"2017가합2297","title":"주주총회결의무효확인","court":"전주지방법원","date":"2020.10.29","caseType":"민사","basis":"참조조문","text":"甲 주식회사의 주주총회가 ‘총회의 안건이 적대적 인수합병을 위한 안건임을 총회 소집 전 이사회가 결의로 확인한 경우 총회의 결의요건을 출석한 주주의 의결권의 100분의 90 이상과 발행주식총수의 100분의 70 이상으로 한다.’는 조항과 ‘위 가중조항을 개정하고자 하는 경우에도 위와 같은 방법에 의한다.’는 조항을 신설하는 내용의 정관변경결의를 하자, 甲 회사의 주주 乙이 위 결의가 상법 제434조 등을 위반하였다며 주주총회결의의 무효확인을 구한 사안에서, 위 가중조항과 같은 이른바 초다수결의제는 관련 상법 규정의 문언과 의미 및 입법 취지 등에 비추어 현행 상법하에서 원칙적으로 허용될 수 없고, 설령 예외적으로 허용된다고 하더라도 그 가중비율이 지나치게 과도한 점 등 제반 사정에 비추어, 위 가중조항은 상법에 반하는 것으로서 허용될 수 없으므로 주주총회결의가 무효라고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=230337"},{"id":"P:217573","kind":"P","label":"2018나22252","title":"임시주주총회결의무효확인등","court":"대구고등법원","date":"2020.10.23","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=217573"},{"id":"P:233393","kind":"P","label":"2020허2024","title":"거절결정(상)","court":"특허법원","date":"2020.10.23","caseType":"특허","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233393"},{"id":"P:212847","kind":"P","label":"2020마6195","title":"장부등열람허용가처분","court":"대법원","date":"2020.10.20","caseType":"민사","basis":"참조조문","text":"회사에 대하여 채무자 회생 및 파산에 관한 법률에 따른 회생절차가 개시된 경우, 소수주주의 회계장부 등에 대한 열람·등사청구권을 규정한 상법 제466조 제1항의 적용이 배제되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=212847"},{"id":"P:226575","kind":"P","label":"2018다222921","title":"구상금","court":"대법원","date":"2020.10.15","caseType":"민사","basis":"참조조문","text":"[1] 제3자의 행위로 발생한 사고로 인해 피보험자에게 보험목적물과 보험목적물이 아닌 재산 모두에 손해가 발생하여 보험자가 피보험자에게 보험목적물에 관한 손해에 대하여 보험금을 지급한 경우, 보험자대위의 효과 발생의 범위를 판단하는 방법 [2] 甲 보험회사와 乙이 乙의 매장 내 물품을 보험목적물로 하는 보험계약을 체결한 후 丙이 소유한 건물의 지붕 보강 공사 중 발생한 화재로 인하여 乙의 매장 내 물품뿐만 아니라 가설창고 내 물품 등이 소훼되는 손해가 발생하였는데, 甲 회사가 乙에게 보험목적물에 관하여 발생한 손해 전액에 대해서 보험금을 지급한 후 丙 등을 상대로 구상금 지급을 구한 사안에서, 甲 회사가 보험목적물에 관하여 乙이 입은 손해에 대하여는 손해배상액의 지급을 구할 수 있으나, 보험목적물이 아닌 재산 등에 관하여 乙이 입은 손해에 대해서는 손해배상액의 지급을 구할 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=226575"},{"id":"P:233311","kind":"P","label":"2020나50624","title":"손해배상(기)","court":"부산고등법원","date":"2020.10.15","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233311"},{"id":"P:619167","kind":"P","label":"2020나10223","title":"손해배상(기)","court":"부산고등법원창원재판부","date":"2020.10.15","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619167"},{"id":"P:212679","kind":"P","label":"2018다213811","title":"손해배상(기)","court":"대법원","date":"2020.10.15","caseType":"민사","basis":"참조조문","text":"[1] 제3자의 행위로 발생한 사고로 인하여 피보험자에게 보험목적물과 보험목적물이 아닌 재산에 모두 손해가 발생하여 피보험자가 보험목적물에 관하여 보험금을 수령한 경우, 피보험자가 제3자에게 청구할 수 있는 손해배상액을 판단하는 방법 [2] 甲이 乙 보험회사와 매장 내 물품을 보험목적물로 하는 보험계약을 체결한 후 丙이 소유한 건물의 지붕 보강 공사 중 발생한 화재로 인하여 甲의 매장 내 물품뿐만 아니라 가설창고 내 물품 등이 소훼되는 손해가 발생하였는데, 甲이 乙 회사로부터 보험목적물에서 발생한 손해 전액에 대해서 보험금을 지급받은 후 丙을 상대로 손해배상을 구한 사안에서, 甲은 보험목적물인 매장 내 물품에서 발생한 손해에 대해서는 丙에게 배상을 청구할 수 없고, 보험목적물이 아닌 재산 등에서 발생한 손해액 중 丙의 손해배상책임액만큼 丙에게 배상을 청구할 수 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=212679"},{"id":"P:236099","kind":"P","label":"2018가합566251","title":"손해배상(기)","court":"서울중앙지방법원","date":"2020.09.17","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=236099"},{"id":"P:214527","kind":"P","label":"2014가합535259","title":"주주대표소송(손해배상)","court":"서울중앙지방법원","date":"2020.09.17","caseType":"민사","basis":"참조조문","text":"甲 주식회사가 ‘4대강 살리기 사업’과 관련된 건설공사의 입찰에 참여하면서 乙 주식회사 등과 사전에 위 사업의 지분을 서로 협의하여 배분하는 등 담합행위를 하였다는 이유로 공정거래위원회로부터 과징금을 부과받는 등 손해를 입자, 甲 회사 발행주식 총수의 100분의 1 이상의 주식을 소유한 주주들인 丙 등이 위 담합행위 당시 甲 회사의 대표이사였던 丁과 이사였던 戊 등을 상대로 손해배상을 구하는 대표소송을 제기한 사안에서, 丁은 甲 회사의 대표이사로서 담합을 미연에 방지할 의무가 있는데도 이를 해태하여 위 담합에 이르게 한 것으로 보이므로 상법 제399조 제1항에 따라 위 담합행위로 甲 회사가 입은 손해를 배상할 책임이 있으나, 戊 등의 경우는 丙 등이 주장하는 내부통제시스템 구축 및 운영 등의 감시의무를 해태하였다고 인정할 수 없으므로 손해배상책임이 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=214527"},{"id":"P:242043","kind":"P","label":"2018나2033686","title":"손해배상(기)","court":"서울고등법원","date":"2020.09.10","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=242043"},{"id":"P:212883","kind":"P","label":"2017다245804","title":"보험금","court":"대법원","date":"2020.09.03","caseType":"민사","basis":"참조조문","text":"[1] 약관의 규제에 관한 법률에서 정한 불공정 약관조항에 해당하는지 판단하는 방법 [2] 전문직업 배상책임보험이 손해배상청구 기준으로 보험사고를 규정하는 취지 / 손해배상청구 기준에 따라 보험사고를 확정하는 전문직업 배상책임보험의 약관에서 정한 피보험자의 서면통지 조항이 추가 손해 발생에 따른 보상책임의 확대 문제가 아니라 보험금 지급의무의 전제조건으로 기능하는지 여부 [3] 甲 회계법인과 乙 보험회사가 체결한 회계사 전문직업 배상책임 보험계약의 약관에서 보험금 지급조건으로 정한 ‘피보험자인 甲 법인에 대한 제3자의 손해배상청구는 보험기간 중 행해져야 한다’는 내용의 손해배상청구 조항과 ‘이러한 손해배상청구는 보험기간 중 보험자인 乙 회사에 서면으로 통지되어야 한다’는 내용의 서면통지 조항이 약관의 규제에 관한 법률 제7조 제2호에 따라 무효인지 문제 된 사안에서, 위 보험금 지급조건은 모두 상당한 이유 없이 보험자의 손해배상 범위를 제한한 것으로 볼 수 없으므로, 약관의 규제에 관한 법률 제7조 제2호에 따라 무효라고 볼 수 없다고 한 사례 [4] 보험계약을 체결할 때 보험자가 부담하는 명시ㆍ설명의무의 내용 및 보험자가 보험약관의 명시ㆍ설명의무를 위반하여 보험계약을 체결한 경우, 그 약관의 내용을 보험계약의 내용으로 주장할 수 있는지 여부 [5] 甲 회계법인과 乙 보험회사가 체결한 회계사 전문직업 배상책임 보험계약의 약관에서 보험","url":"https://www.law.go.kr/precInfoP.do?precSeq=212883"},{"id":"P:221799","kind":"P","label":"2020나21137","title":"예탁금지급청구의소","court":"광주고등법원","date":"2020.09.02","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=221799"},{"id":"P:214417","kind":"P","label":"2016다26198","title":"부당이득금","court":"대법원","date":"2020.08.27","caseType":"민사","basis":"참조조문","text":"[1] 구 임대주택법 시행규칙 제9조 제1항 [별표 1]에서 분양전환가격의 상한가격 산정 기초로 정한 ‘분양전환 당시 건축비’의 의미 및 위 상한가격 산정 시 산정가격에서 공제할 ‘임대기간 중 감가상각비’는 최초 입주자 모집공고 당시 주택가격을 기준으로 산정하여야 하는지 여부 [2] 상법 제54조의 상사법정이율이 적용되는 ‘상행위로 인한 채무’의 범위 [3] 분양전환가격 산정기준에 관한 구 임대주택법 등 관련 법령의 규정이 강행법규인지 여부 및 위 산정기준에 따른 금액을 초과하는 분양전환가격으로 체결된 분양계약의 효력 / 이러한 일부 무효의 법리는 민간 임대사업자가 시장 등의 분양전환승인을 거쳐 분양전환을 한 경우에도 마찬가지로 적용되는지 여부 [4] 강행법규를 위반한 자가 스스로 그 약정의 무효를 주장하는 것이 신의칙에 반하는지 여부 및 신의성실의 원칙에 위배된다는 이유로 권리의 행사를 부정하기 위한 요건 [5] 구 임대주택법 시행규칙 제9조 제1항 [별표 1]에서 분양전환가격 산정 기초로 정한 건축비의 의미 [6] 甲 주식회사가 스스로 건설하여 乙 등에게 임대하였다가 분양전환하는 임대아파트의 분양전환가격을 산정하면서 그 산정의 기초가 되는 ‘실제 건축비’를 위 아파트의 취득세 과세표준과 건축비 감정 결과 중 어느 것을 토대로 인정하여야 하는지 문제 된 사안에서, 甲 회사가 위 아파트의 취득세 과세표준으로 신고한 금액을 토대로 실제","url":"https://www.law.go.kr/precInfoP.do?precSeq=214417"},{"id":"P:233401","kind":"P","label":"2019가합77388","title":"경업금지","court":"의정부지방법원고양지원","date":"2020.08.21","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233401"},{"id":"P:211789","kind":"P","label":"2018다249148","title":"이사및감사지위확인","court":"대법원","date":"2020.08.20","caseType":"민사","basis":"참조조문","text":"[1] 주식회사 이사나 감사의 직무집행을 정지하고 직무대행자를 선임하는 가처분결정이 있는 경우, 이사 등의 임기가 당연히 정지되거나 가처분결정이 존속하는 기간만큼 연장되는지 여부 [2] 과거의 법률관계가 확인의 소의 대상이 될 수 있는 경우 [3] 甲 주식회사의 주주들이 법원의 허가를 받아 개최한 주주총회에서 乙이 감사로 선임되었는데도 甲 회사가 감사 임용계약의 체결을 거부하자, 乙이 甲 회사를 상대로 감사 지위의 확인을 구하는 소를 제기하여, 소를 제기할 당시는 물론 대법원이 乙의 청구를 받아들이는 취지의 환송판결을 할 당시에도 乙의 감사로서 임기가 남아 있었는데, 환송 후 원심의 심리 도중 乙의 임기가 만료되어 후임 감사가 선임된 사안에서, 종전의 감사 지위 확인 청구가 과거의 법률관계에 대한 확인을 구하는 것이 되었다는 등의 이유만으로 확인의 이익이 없다고 보아 乙의 청구를 부적법 각하한 원심판결에는 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=211789"},{"id":"P:239135","kind":"P","label":"2018가단5276464","title":"손해배상(기)","court":"서울중앙지방법원","date":"2020.08.19","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=239135"},{"id":"P:211823","kind":"P","label":"2018다236241","title":"주금반환등청구의소","court":"대법원","date":"2020.08.13","caseType":"민사","basis":"참조조문","text":"[1] 주주평등의 원칙의 의미 및 이를 위반한 약정의 효력 / 회사가 신주를 인수하는 자에게 인수대금으로 납입한 돈을 전액 보전해 주기로 약정하거나 상법 제462조 등 법률의 규정에 의한 배당 외에 다른 주주들에게는 지급되지 않는 별도의 수익을 지급하기로 약정한 경우, 그 효력 및 이는 약정이 주주의 자격을 취득하기 이전에 체결되거나 신주인수계약과 별도의 계약으로 체결된 경우에도 마찬가지인지 여부 [2] 甲 주식회사가 제3자 배정 방식의 유상증자를 실시하면서 이에 참여한 乙 등과 그 투자금을 유상증자 청약대금으로 사용하되 투자원금을 반환하고 소정의 수익금을 지급하기로 하는 내용의 투자계약을 체결하고 이를 이행하였는데, 이후 甲 회사가 위 투자계약이 주주평등의 원칙에 반하여 무효라며 乙 등을 상대로 그들이 지급받은 수익금 상당의 부당이득반환을 구한 사안에서, 위 투자계약은 乙 등의 주주 지위에서 발생하는 손실의 보상을 주된 목적으로 하는 것이므로 주주평등의 원칙에 위배되어 무효라고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=211823"},{"id":"P:226447","kind":"P","label":"2019나22912","title":"손해배상(기)","court":"광주고등법원","date":"2020.07.22","caseType":"민사","basis":"참조조문","text":"甲 유한회사는 그 소유 명의의 위·수탁화물자동차에 관하여 위·수탁차주와 사이에 지입차주로부터 화물자동차를 현물출자받되 지입차주에게 화물운송사업의 운영관리권을 위탁하는 내용의 위·수탁계약을 체결하여 乙 광역시로부터 유가보조금을 받으면서 화물차동차를 운행하도록 한 위·수탁회사이고, 丙은 甲 회사를 실질적으로 운영·관리하는 사람이며, 丁과 戊는 甲 회사의 대표이사로 등재되었던 사람인데, 丙이 자동차등록증을 변조하는 등 부정한 방법으로 화물자동차 운수사업법상 ‘신규 공급이 허용되는 특수용도형 화물자동차’를 ‘신규 공급이 제한되는 일반형 또는 특수용도형 화물자동차’로 바꾸는 내용의 대폐차 신고 및 등록을 하여 유가보조금이 부정수급되도록 하는 불법행위를 하자, 乙 광역시가 丁과 戊를 상대로 상법 제567조, 제401조에 따른 손해배상을 구한 사안에서, 丁과 戊는 대표이사의 임무를 고의 또는 중대한 과실로 게을리하였으므로 상법 제567조, 제401조 제1항에 따라 甲 회사와 연대하여 乙 광역시에 대해 부정수급된 유가보조금 상당의 손해를 배상할 책임이 있다고 판단한 다음, 乙 광역시가 지방경찰청 등으로부터 수사결과 등을 통보받은 후에도 상당 기간 유가보조금이 지급되게 한 잘못이 있는 점 등을 참작하여 위 책임을 70%로 제한한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=226447"},{"id":"P:230343","kind":"P","label":"2019고단2073","title":"강제집행면탈","court":"전주지방법원","date":"2020.07.21","caseType":"형사","basis":"참조조문","text":"甲 주식회사는 피고인이 대표이사인 乙 주식회사를 상대로 한 물품대금 소송에서 승소 판결을 받아 乙 회사에 대해 물품대금 채권을 가지고 있고, 丙 주식회사는 甲 회사로부터 위 물품대금 채권을 양도받은 다음 위 판결의 항소심에 독립당사자참가하여 乙 회사를 상대로 승소 판결과 이에 대한 가집행 판결을 받고 이에 따라 강제집행 절차를 진행하였는데, 피고인이 관련 제1심판결이 선고된 다음 날 乙 회사에서 영업을 일부 분할하여 丁 주식회사를 새롭게 분할 설립한 후 乙 회사의 유체동산을 丁 회사로 옮겨 영업을 하는 방법으로 은닉하여 강제집행을 면탈하였다는 내용으로 기소된 사안에서, 피고인의 행위는 재산을 은닉한 것에 해당하지 않고, 채권자를 해할 위험성조차 없다는 이유로 무죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=230343"},{"id":"P:230453","kind":"P","label":"2019고단2073","title":"강제집행면탈","court":"전주지방법원","date":"2020.07.21","caseType":"형사","basis":"참조조문","text":"甲 주식회사는 피고인이 대표이사인 乙 주식회사를 상대로 한 물품대금 소송에서 승소 판결을 받아 乙 회사에 대해 물품대금 채권을 가지고 있고, 丙 주식회사는 甲 회사로부터 위 물품대금 채권을 양도받은 다음 위 판결의 항소심에 독립당사자참가하여 乙 회사를 상대로 승소 판결과 이에 대한 가집행 판결을 받고 이에 따라 강제집행 절차를 진행하였는데, 피고인이 관련 제1심판결이 선고된 다음 날 乙 회사에서 영업을 일부 분할하여 丁 주식회사를 새롭게 분할 설립한 후 乙 회사의 유체동산을 丁 회사로 옮겨 영업을 하는 방법으로 은닉하여 강제집행을 면탈하였다는 내용으로 기소된 사안에서, 피고인의 행위는 재산을 은닉한 것에 해당하지 않고, 채권자를 해할 위험성조차 없다는 이유로 무죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=230453"},{"id":"P:232067","kind":"P","label":"2019가합582601","title":"신주발행무효확인","court":"서울중앙지방법원","date":"2020.07.16","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=232067"},{"id":"P:211721","kind":"P","label":"2019다205398","title":"주권인도청구","court":"대법원","date":"2020.07.09","caseType":"민사","basis":"참조조문","text":"[1] 자본금 총액이 10억 원 미만으로 이사가 1명 또는 2명인 주식회사의 이사가 자기 또는 제3자의 계산으로 회사와 거래를 하기 전에 주주총회에서 해당 거래에 관한 중요사실을 밝히고 주주총회의 승인을 받지 않은 경우, 그 거래의 효력 [2] 甲 주식회사의 이사 2인 중 1인인 乙이 주주총회 결의 없이 甲 회사와 주식양수도계약을 체결한 사안에서, 주식양수도계약 체결 당시 乙이 대표이사로 있던 丙 주식회사가 甲 회사의 주식 65%를 보유하고 있었고, 甲 회사가 乙로부터 주식양수도대금을 지급받아 이를 丙 회사에 대여하였다는 사실만으로는 주주총회 결의가 없는데도 주식양수도계약을 유효로 볼 만한 특별한 사정이 있다고 인정하기 부족하다는 이유로 위 주식양수도계약이 무효라고 본 원심판단이 정당하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=211721"},{"id":"P:212983","kind":"P","label":"2020다215469","title":"부당이득금반환등청구의소","court":"대법원","date":"2020.06.25","caseType":"민사","basis":"참조조문","text":"[1] 상품에 대한 허위 또는 과장의 선전ㆍ광고가 기망행위에 해당하는 경우 [2] 법인의 대표자가 직무에 관하여 타인에게 손해를 가함으로써 법인에 손해배상책임이 인정되는 경우, 대표자도 제3자에 대하여 민법 제750조에 기한 불법행위책임을 진다고 보기 위한 요건","url":"https://www.law.go.kr/precInfoP.do?precSeq=212983"},{"id":"P:212987","kind":"P","label":"2020다215940","title":"대여금및구상금등ㆍ대여금","court":"대법원","date":"2020.06.25","caseType":"민사","basis":"참조조문","text":"회사가 회사운영 자금을 빌리면서 지급을 약속한 차용금 채무가 상행위로 인한 채무에 해당하는지 여부 및 주채무가 상행위로 인한 채무인 경우, 그 채무에 대한 공동보증인 중 1인이 민법 제439조, 제408조에 따른 분별의 이익을 갖는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=212987"},{"id":"P:601985","kind":"P","label":"2019나21148","title":"손해배상(기)","court":"광주고등법원","date":"2020.06.17","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=601985"},{"id":"P:212997","kind":"P","label":"2018다249018","title":"구상금","court":"대법원","date":"2020.06.11","caseType":"민사","basis":"참조조문","text":"[1] 운송물을 수령 또는 선적하지 않고 발행한 선하증권의 효력 [2] ‘스위치 선하증권’의 의미와 이를 발행하는 이유 / 스위치 선하증권을 발행할 권한을 갖는 자 / 권한 없는 자가 발행한 스위치 선하증권의 효력 / 제3자가 아무런 원인관계 없이 운송인이 최초 발행한 원선하증권을 교부받은 것만으로 제3자에게 운송물의 점유가 이전되는 효과가 발생하거나 제3자가 새롭게 운송을 인수하여 원선하증권을 대체하는 스위치 선하증권을 발행할 수 있게 되는지 여부 / 운송인이 아닌 제3자가 발행요건을 갖추지 못하여 무효인 스위치 선하증권을 발행한 경우, 위 증권을 선의로 취득한 자에게 발행인으로서 책임을 지는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=212997"},{"id":"P:226411","kind":"P","label":"2020마5263","title":"주주총회소집허가","court":"대법원","date":"2020.06.11","caseType":"민사","basis":"참조조문","text":"[1] 채무자가 채무담보 목적으로 주식을 채권자에게 양도하여 채권자가 주주명부상 주주로 기재된 경우, 주주로서 주주권을 행사할 수 있는 사람 및 이 경우 회사가 양수인의 주주권 행사를 부인할 수 있는지 여부 [2] 甲 주식회사의 주주명부상 발행주식총수의 2/3 이상을 소유한 주주인 乙이 상법 제366조 제2항에 따라 법원에 임시주주총회의 소집허가를 신청한 사안에서, 甲 회사는 乙이 주식의 양도담보권자인데 피담보채무가 변제로 소멸하여 더 이상 주주가 아니라고 주장하나 주식의 반환을 청구하는 등의 조치가 없는 이상 乙은 여전히 주주라는 등의 이유로 위 신청을 인용한 원심결정이 정당하다고 한 사례 [3] 항고법원이 변론을 열거나 이해관계인을 심문하지 않은 채 서면심리만으로 결정에 이른 경우, 이를 위법하다고 할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=226411"},{"id":"P:226393","kind":"P","label":"2017다278385","title":"소유권확인·부당이득금","court":"대법원","date":"2020.06.11","caseType":"민사","basis":"참조조문","text":"주주명부상 주주만이 회사에 대한 관계에서 주주권을 행사할 수 있는지 여부 및 회사가 주주명부상 주주 외에 실제 주식을 인수하거나 양수하고자 하였던 자가 따로 존재한다는 사실을 알고 있는 경우, 주주명부상 주주의 주주권 행사를 부인하거나 주주명부에 기재를 마치지 아니한 자의 주주권 행사를 인정할 수 있는지 여부 / 명의개서가 이루어졌다고 하여 무권리자가 주주가 되거나 명의개서가 이루어지지 않았다고 하여 주주가 그 권리를 상실하는 것인지 여부 및 이는 회사와 주주 사이에서 주식의 소유권 귀속이 다투어지는 경우에도 마찬가지인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=226393"},{"id":"P:226399","kind":"P","label":"2018다224699","title":"회사에관한소송","court":"대법원","date":"2020.06.11","caseType":"민사","basis":"참조조문","text":"[1] 지배주주가 상법 제360조의24 제1항에 따라 매도청구권을 행사하는 경우, 반드시 소수주주가 보유하는 주식 전부에 대하여 권리를 행사하여야 하는지 여부 [2] 상법 제360조의26 제1항, 제2항에서 말하는 ‘매매가액’의 의미","url":"https://www.law.go.kr/precInfoP.do?precSeq=226399"},{"id":"P:601485","kind":"P","label":"2019가단36369","title":"보험금","court":"창원지방법원진주지원","date":"2020.06.05","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=601485"},{"id":"P:226375","kind":"P","label":"2016다241515","title":"손해배상등·퇴직금","court":"대법원","date":"2020.06.04","caseType":"민사","basis":"참조조문","text":"[1] 상법 제388조에서 정한 ‘이사의 보수’의 범위 및 위 조항이 강행규정인지 여부 [2] 정관 또는 주주총회에서 이사의 보수에 관한 사항을 이사회에 포괄적으로 위임하는 것이 허용되는지 여부 및 주주총회에서 이사의 보수에 관한 구체적 사항을 이사회에 위임한 경우, 이를 주주총회에서 직접 정하는 것이 가능한지 여부 [3] 이른바 1인회사인 주식회사의 경우, 주주총회 소집절차에 하자가 있거나 주주총회의사록이 작성되지 않았더라도 1인주주의 의사가 주주총회의 결의내용과 일치한다면 증거에 의하여 그러한 내용의 결의가 있었던 것으로 볼 수 있는지 여부 및 1인회사가 아닌 주식회사의 경우, 주주총회의 의결정족수를 충족하는 주식을 가진 주주들이 동의하거나 승인하였다는 사정만으로 주주총회에서 그러한 내용의 결의가 이루어질 것이 명백하다거나 그러한 내용의 결의가 있었던 것과 마찬가지라고 볼 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=226375"},{"id":"P:226339","kind":"P","label":"2017다265389","title":"손해배상(기)","court":"대법원","date":"2020.05.28","caseType":"민사","basis":"참조조문","text":"[1] 한국토지공사가 공익사업을 위한 토지 등의 취득 및 보상에 관한 법률에 따라 택지개발사업 지구 내 토지에 관하여 토지소유자와 매매계약을 체결한 행위가 상행위인지 여부 [2] 공익사업을 위한 토지 등의 취득 및 보상에 관한 법률에 따라 공공사업의 시행자가 토지를 협의취득하는 경우, 일방 당사자의 채무불이행에 대하여 민법에 따른 손해배상 또는 하자담보책임을 물을 수 있는지 여부 및 이 경우 매도인의 하자담보책임에 따른 손해배상청구권에 적용되는 소멸시효기간과 기산점 [3] 甲 공사가 택지개발사업을 시행하면서 乙 등이 소유한 토지를 공공용지로 협의취득하였고, 甲 공사를 합병한 丙 공사가 위 택지개발사업을 준공한 다음 위 토지 중 일부를 丁에게 매도하여 소유권이전등기를 마쳐주었는데, 丁이 건물을 신축하기 위해 터파기공사를 하던 중 위 토지 지하에 폐기물이 매립되어 있는 것을 발견하여 丙 공사에 통보하자, 丙 공사가 乙 등을 상대로 매도인의 하자담보책임에 기한 손해배상을 구한 사안에서, 甲 공사가 乙 등 소유의 토지를 매수한 행위는 상행위에 해당하지 않아 상법 제64조가 적용되지 않고, 丙 공사가 乙 등에게 매도인의 담보책임을 구하고 있으므로, 甲 공사가 위 토지에 관하여 소유권이전등기를 마친 때부터 민법 제162조 제1항에 따른 10년의 소멸시효가 진행되고, 그로부터 10년이 지나기 전에 소가 제기되어 丙 공사의 손해배상청구권은 소멸시효","url":"https://www.law.go.kr/precInfoP.do?precSeq=226339"},{"id":"P:238083","kind":"P","label":"2019나56565","title":"손해배상(기)","court":"부산고등법원","date":"2020.05.28","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238083"},{"id":"P:226333","kind":"P","label":"2016다243399","title":"손해배상청구의소","court":"대법원","date":"2020.05.28","caseType":"민사","basis":"참조조문","text":"[1] 주식회사 감사위원회의 위원이 고의 또는 과실로 선량한 관리자로서의 주의의무를 위반하여 임무를 해태한 경우, 그로 인하여 회사가 입은 손해를 배상할 책임이 있는지 여부 [2] 금융기관 감사위원이 선량한 관리자의 주의의무를 위반하여 자신의 임무를 게을리하였는지 판단하는 기준 [3] 甲 저축은행의 파산관재인인 乙 공사가 甲 은행에서 상근 감사위원으로 재직하였던 丙 등을 상대로 재직 당시 발생한 위법·부당한 대출 때문에 甲 은행이 입은 손해의 배상을 구한 사안에서, 丙 등은 자신이 서명한 대출신청서류를 선량한 관리자의 주의의무로 검토하였더라면 대출이 형식적인 신용조사만을 거쳐 충분한 채권보전조치 없이 이루어지는 것을 쉽게 알 수 있었으므로, 관계 서류의 제출 요구 등을 통해 대출이 위법·부당한 것인지 추가로 조사하거나 감사위원회를 통해 이사회에 위와 같은 사실을 보고하여 위법·부당한 행위의 시정 등을 요구할 의무가 있었음에도 그 의무를 다하지 않았다고 볼 여지가 충분한데도, 丙 등이 대출이 위법·부당하다는 사정을 알았거나 알 수 있었다고 인정할 증거가 없다는 이유만으로 위 손해배상청구를 배척한 원심판단에는 법리오해 등 위법이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=226333"},{"id":"P:211643","kind":"P","label":"2019라21331","title":"회생","court":"서울고등법원","date":"2020.05.26","caseType":"민사","basis":"참조조문","text":"甲 주식회사가 정관에 회생절차개시신청을 주주총회 특별결의 사항으로 규정하고 있는데도 주주총회 특별결의 없이 회생절차개시신청을 하여 회생법원이 회생절차개시결정을 하자, 甲 회사의 주주로서 대표이사에서 퇴임한 후 甲 회사를 상대로 퇴직금청구 소송을 제기하여 소송 계속 중인 乙이 즉시항고를 제기한 사안에서, 甲 회사의 위와 같은 회생절차개시신청은 흠결 있는 대표권 행사에 의한 것으로서 부적법하다고 보아 회생절차개시결정을 취소하고 사건을 원심법원에 환송한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=211643"},{"id":"P:226317","kind":"P","label":"2019다299614","title":"회사설립무효","court":"대법원","date":"2020.05.14","caseType":"민사","basis":"참조조문","text":"주식회사의 설립무효사유 및 회사 설립과 관련된 주주 개인의 의사무능력이나 의사표시의 하자가 설립무효사유가 되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=226317"},{"id":"P:213181","kind":"P","label":"2019라21185","title":"장부등열람허용가처분","court":"서울고등법원","date":"2020.05.12","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=213181"},{"id":"P:423612","kind":"P","label":"2019구합6554","title":"상수도 시설분담금 부과처분 무효확인","court":"울산지방법원","date":"2020.05.07","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=423612"},{"id":"P:211403","kind":"P","label":"2014두2331","title":"증여세부과처분취소","court":"대법원","date":"2020.04.29","caseType":"세무","basis":"판례내용","text":"[1] 상장법인인 甲 주식회사의 대표이사 乙이 丙 증권회사에 丁 명의의 차명계좌를 개설하고 투자금을 입금한 다음 위 증권계좌를 이용하여 甲 회사의 유상증자 과정에서 甲 회사의 주식을 인수하여 丁 명의로 명의개서를 마쳤는데, 그 후 乙이 1차 주식을 전부 매도하여 매도금액이 위 증권계좌에 입금되었다가 丁 명의의 다른 계좌로 송금되어 예수금 잔액이 0원이 되었고, 이후 일정 금액이 위 증권계좌에 입금되어 乙이 甲 회사의 주식을 매수한 후 일부를 매도하고 남은 주식에 관하여 다시 丁 명의로 명의개서를 마쳤으며, 한편 乙은 1차 주식을 매도하기 전 戊 증권회사에도 丁 명의의 차명계좌를 개설하고 투자금을 입금한 다음 위 증권계좌를 이용하여 甲 회사의 주식을 각 매수하여 丁 명의로 명의개서를 마쳤는데, 관할 세무서장이 丁 명의의 1차 내지 4차 주식의 명의신탁에 대하여 구 상속세 및 증여세법 제41조의2 제1항 본문을 적용하여 丁에게 각 증여세 및 가산세를 부과한 사안에서, 丁 명의의 3, 4차 주식은 최초로 명의신탁된 1차 주식과는 별개의 새로운 명의신탁 주식이므로, 3, 4차 주식에 대한 위 처분이 적법하다고 본 원심판단은 정당하나, 丁 명의의 2차 주식이 위 법률조항에 따른 과세대상인지 여부에 관한 심리를 다하지 아니한 채 2차 주식에 대한 위 처분도 적법하다고 본 원심판단에 법리오해 등의 잘못이 있다고 한 사례 [2] 유상증자에 따른 신","url":"https://www.law.go.kr/precInfoP.do?precSeq=211403"},{"id":"P:233545","kind":"P","label":"2019비합30195","title":"중재인선임","court":"서울중앙지방법원","date":"2020.04.28","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233545"},{"id":"P:213183","kind":"P","label":"2019나54552","title":"부당이득금","court":"부산고등법원","date":"2020.04.23","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=213183"},{"id":"P:211285","kind":"P","label":"2017다251564","title":"이사회결의무효확인등","court":"대법원","date":"2020.04.09","caseType":"민사","basis":"참조조문","text":"상법 제345조 제3항에서 정한 종류주식의 주주가 회사에 대하여 상환권을 행사한 이후에도 상환금을 지급받을 때까지는 여전히 주주의 지위에 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=211285"},{"id":"P:623411","kind":"P","label":"2019구합6486","title":"상수도원인자부담금 등 부과처분취소","court":"울산지방법원","date":"2020.04.09","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=623411"},{"id":"P:211293","kind":"P","label":"2018다290436","title":"부당이득금반환청구의소","court":"대법원","date":"2020.04.09","caseType":"민사","basis":"참조조문","text":"[1] 주식회사의 정관에서 이사의 보수에 관하여 주주총회의 결의로 정한다고 규정한 경우, 주주총회의 결의 없이 이사가 보수청구권을 행사할 수 있는지 여부 / 이때 ‘이사의 보수’에 이사의 직무수행에 대한 보상으로 지급되는 대가가 모두 포함되는지 여부 및 회사가 성과급, 특별성과급 등의 명칭으로 경영성과에 따라 지급하는 금원이나 성과 달성을 위한 동기를 부여할 목적으로 지급하는 금원도 마찬가지인지 여부 [2] 甲 주식회사의 정관에 이사의 보수에 관하여 주주총회의 결의로 정하도록 규정하고 있는데, 甲 회사의 대표이사인 乙이 주주총회의 결의 없이 甲 회사로부터 ‘특별성과급’이라는 명목으로 금원을 지급받은 사안에서, 乙이 ‘특별성과급’이라는 명목으로 지급받은 금원은 직무수행에 대한 보상으로 지급된 보수로서 법률상 원인 없이 이루어진 부당이득에 해당한다고 본 원심판단을 수긍한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=211293"},{"id":"P:211435","kind":"P","label":"2019구합6486","title":"상수도원인자부담금등부과처분취소","court":"울산지방법원","date":"2020.04.09","caseType":"일반행정","basis":"참조조문","text":"한국토지주택공사가 주택단지를 건설하는 택지개발사업 시행자로 지정되어 택지개발사업을 완료한 사업지구에서 이를 분양받은 甲 부동산투자회사가 아파트와 상가를 신축한 후 관할 상수도사업본부 乙 사업소장에게 위 아파트와 상가에 대한 급수공사를 신청하였는데, 乙 사업소장이 급수공사신청을 승인하면서 甲 회사에 수도법 제71조 등에 따라 위 아파트에 대한 상수도원인자부담금과 ‘울산광역시 수도급수 조례’ 제15조 제1항 본문에 따라 위 상가에 대한 시설분담금을 각 부과한 사안에서, 한국토지주택공사가 아닌 甲 회사에 대하여 상수도원인자부담금을 부과한 처분은 상대방을 잘못 지정한 위법이 있고, 울산광역시 주민이 아닌 甲 회사에 상가에 대한 시설분담금을 부과한 처분은 지방자치법 제138조에 위배되는 위법이 있으므로 취소되어야 한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=211435"},{"id":"P:211339","kind":"P","label":"2019도7729","title":"사기방조·공전자기록등불실기재·불실기재공전자기록등행사·업무방해·전자금융거래법위반[범죄에 이용할 목적으로 유한회사 설립등기를 한 것으로 인한 공전자기록 등 불실기재죄와 그 행사죄가 문제되는 사건]","court":"대법원","date":"2020.03.26","caseType":"형사","basis":"참조조문","text":"[1] 유한회사의 사원이 상법 등 법령에 정한 회사설립의 요건과 절차에 따라 회사설립등기를 함으로써 회사가 성립하였다고 볼 수 있는 경우, 회사설립등기와 그 기재 내용이 공정증서원본 불실기재죄나 공전자기록 등 불실기재죄에서 말하는 ‘불실의 사실’에 해당하는지 여부 / 이때 유한회사의 사원 등 회사설립에 관여하는 사람이 회사를 설립할 당시 회사를 실제로 운영할 의사 없이 회사를 이용한 범죄 의도나 목적이 있었다거나, 회사로서의 인적·물적 조직 등 영업의 실질을 갖추지 않았다는 이유만으로 불실의 사실을 법인등기부에 기록하게 한 것으로 볼 수 있는지 여부 [2] 피고인이 甲 유한회사를 설립한 후 회사 명의로 통장을 개설하여 이른바 대포통장을 유통시킬 목적이었을 뿐 회사를 설립한 사실이 없는데도 허위의 회사설립등기 신청서를 법원 등기관에게 제출하여 등기관으로 하여금 상업등기 전산정보처리시스템의 법인등기부에 위 신청서의 기재 내용을 입력하고 이를 비치하게 하였다고 하여 공전자기록 등 불실기재와 불실기재 공전자기록 등 행사의 공소사실로 기소된 사안에서, 피고인이 실제 유한회사를 설립하려는 의사를 가지고 상법이 정하는 유한회사 설립에 필요한 정관 작성, 출자 이행, 임원 선임 등의 절차를 이행함으로써 甲 회사는 상법상 유한회사로 성립하였다는 등의 이유로, 甲 회사 설립등기는 공전자기록 등 불실기재죄에서 말하는 ‘불실의 사실’에 해당하지 않는다고 ","url":"https://www.law.go.kr/precInfoP.do?precSeq=211339"},{"id":"P:242103","kind":"P","label":"2018가단5037423","title":"구상금","court":"서울중앙지방법원","date":"2020.03.24","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=242103"},{"id":"P:238383","kind":"P","label":"2019나40477","title":"대여금청구의소","court":"서울중앙지방법원","date":"2020.03.18","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238383"},{"id":"P:226191","kind":"P","label":"2019다283794","title":"약정금","court":"대법원","date":"2020.03.12","caseType":"민사","basis":"참조조문","text":"[1] 다른 상인의 영업을 위한 준비행위를 보조적 상행위로 볼 수 있는지 여부 / 회사의 대표이사 개인의 행위가 상행위로서 상법의 적용을 받기 위해서는 그 행위가 영업으로 상행위를 하는 경우에 해당되어 상인자격을 취득할 것을 전제로 하는지 여부 및 여기서 ‘영업으로 한다’는 의미 [2] 택시운송사업을 운영하는 甲 주식회사의 주주인 乙 등이 丙 등에게 甲 회사의 주식을 양도하는 내용의 계약을 체결하면서 ‘도급 문제로 감차 예정인 차량 1대분은 추후 소송 여하에 따라 승소 시 해당 시세의 50%를 乙 등에게 지급한다’는 취지로 정하였고, 그 후 丙 등이 甲 회사의 대표이사 등으로 취임하였는데, 위 약정금채권에 상사소멸시효가 적용되는지 문제 된 사안에서, 丙 등이 택시운송사업을 운영하기 위해 甲 회사를 양수한 행위가 영업을 위한 보조적 상행위에 해당한다는 이유 등으로 위 약정금채권에 5년의 소멸시효가 적용된다고 본 원심판결에 대법원 판례에 상반되는 판단을 한 위법이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=226191"},{"id":"P:226155","kind":"P","label":"2019도9293","title":"공전자기록등불실기재·불실기재공전자기록등행사","court":"대법원","date":"2020.02.27","caseType":"형사","basis":"참조조문","text":"[1] 공정증서원본 불실기재죄나 공전자기록 등 불실기재죄의 보호법익과 성립요건 및 위 죄에서 말하는 ‘불실의 사실’의 의미 [2] 주식회사의 발기인 등이 상법 등 법령에 정한 회사설립의 요건과 절차에 따라 회사설립등기를 함으로써 회사가 성립하였다고 볼 수 있는 경우, 회사설립등기와 그 기재 내용이 공정증서원본 불실기재죄나 공전자기록 등 불실기재죄에서 말하는 ‘불실의 사실’에 해당하는지 여부 / 이때 발기인 등이 회사를 설립할 당시 회사를 실제로 운영할 의사 없이 회사를 이용한 범죄 의도나 목적이 있었다거나, 회사로서의 인적·물적 조직 등 영업의 실질을 갖추지 않았다는 이유만으로 불실의 사실을 법인등기부에 기록하게 한 것으로 볼 수 있는지 여부 [3] 피고인 등이 공모하여, 甲 주식회사를 설립한 후 회사 명의로 통장을 개설하여 이른바 대포통장을 유통시킬 목적이었을 뿐 자본금을 납입하거나 회사를 설립한 사실이 없는데도 허위의 회사설립등기 신청서를 법원 등기관에게 제출하여 등기관으로 하여금 상업등기 전산정보처리시스템의 법인등기부에 위 신청서의 기재 내용을 입력하고 이를 비치하게 하여 행사하였다고 하여 공전자기록 등 불실기재와 불실기재 공전자기록 등 행사의 공소사실로 기소된 사안에서, 피고인 등이 실제 회사를 설립하려는 의사를 가지고 상법이 정하는 회사설립에 필요한 정관 작성, 주식 발행·인수, 임원 선임 등의 절차를 이행함으로써 甲 회사는","url":"https://www.law.go.kr/precInfoP.do?precSeq=226155"},{"id":"P:226143","kind":"P","label":"2019다204869","title":"부당이득금","court":"대법원","date":"2020.02.27","caseType":"민사","basis":"참조조문","text":"상법 제733조 제1항에 따른 보험수익자 변경의 법적 성질 및 보험수익자 변경의 의사표시가 객관적으로 확인된 경우, 그 의사표시가 보험자나 보험수익자에게 도달되지 않더라도 보험수익자 변경의 효과가 발생하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=226143"},{"id":"P:226095","kind":"P","label":"2019가합103590","title":"채무부존재확인·보험금","court":"부산지방법원동부지원","date":"2020.02.13","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=226095"},{"id":"P:221847","kind":"P","label":"2018가합52957","title":"예탁금지급청구의소","court":"광주지방법원","date":"2020.02.07","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=221847"},{"id":"P:210793","kind":"P","label":"2017다215728","title":"보험금등","court":"대법원","date":"2020.02.06","caseType":"민사","basis":"참조조문","text":"[1] 단체의 규약으로 피보험자 또는 그 상속인이 아닌 자를 보험수익자로 지정한다는 명시적인 정함이 없는데도 피보험자의 서면 동의 없이 단체보험계약에서 피보험자 또는 그 상속인이 아닌 자를 보험수익자로 지정한 경우, 그 지정의 효력 및 이후 적법한 보험수익자 지정 전에 보험사고가 발생한 경우, 보험수익자 [2] 보험계약자가 피보험자의 상속인을 보험수익자로 하여 맺은 생명보험계약이나 상해보험계약에서 피보험자의 사망이라는 보험사고 발생 시 위 상속인이 갖는 보험금청구권이 상속재산인지 여부 및 이때 보험수익자로 지정된 상속인 중 1인이 자신에게 귀속된 보험금청구권을 포기하는 경우, 포기한 부분이 당연히 다른 상속인에게 귀속되는지 여부 / 이러한 법리는 단체보험에서 피보험자의 상속인이 보험수익자로 인정된 경우에도 동일하게 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=210793"},{"id":"P:210797","kind":"P","label":"2019다270217","title":"구상금","court":"대법원","date":"2020.02.06","caseType":"민사","basis":"참조조문","text":"[1] 상법 제42조 제1항이 영업양수인으로 하여금 양도인의 영업자금과 관련한 피보증인의 지위까지 승계하도록 한 규정인지 여부 / 영업양수인이 위 규정에 따라 책임지는 제3자의 채권은 영업양도 당시까지 발생한 것이어야 하는지 여부 및 영업양도 당시로 보아 가까운 장래에 발생될 것이 확실한 채권도 영업양수인이 책임져야 하는지 여부 [2] 민법 제481조, 제482조에서 정한 변제자대위에 의하여 원채권 및 담보권을 행사할 수 있는 범위","url":"https://www.law.go.kr/precInfoP.do?precSeq=210797"},{"id":"P:420316","kind":"P","label":"2019누3705","title":"법인 설립일로부터 6월이 경과하기 전 당사자들 사이 의사표시만으로 이루어진 주식 이전을 원인으로 과점주주에 대한 간주취득세 납세의무가 성립하는지 여부","court":"대구고등법원","date":"2020.01.31","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=420316"},{"id":"P:226007","kind":"P","label":"2019라5186","title":"주주총회소집허가","court":"부산고등법원","date":"2020.01.17","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=226007"},{"id":"P:226005","kind":"P","label":"2015가합579799","title":"구상금·구상금","court":"서울중앙지방법원","date":"2020.01.17","caseType":"민사","basis":"참조조문","text":"국가가 ‘4·16세월호참사 피해구제 및 지원 등을 위한 특별법’ 등에 따라 세월호 침몰사고와 관련하여 지출한 비용에 대하여 세월호를 운항한 甲 주식회사의 회장인 乙의 상속인들인 丙 등을 상대로 같은 법 제42조 제2항에 따라 구상권을 행사한 사안에서, 乙은 상법 제401조의2의 업무집행지시자, 민법 제760조, 제750조의 공동불법행위자로서 임직원들과 공동하여 세월호 침몰사고로 인한 피해자들의 손해를 배상할 의무를 부담하고, 乙의 상속인들인 丙 등은 위 손해배상의무를 상속하였으므로, 丙 등은 ‘세월호 침몰사고에 원인을 제공한 자’로서 ‘4·16세월호참사 피해구제 및 지원 등을 위한 특별법’ 제42조 제2항에 따른 구상의무를 부담한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=226005"},{"id":"P:607253","kind":"P","label":"2019가합101086","title":"주주대표소송·주주대표소송","court":"대전지방법원천안지원","date":"2020.01.10","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=607253"},{"id":"L:397-28","kind":"L","label":"법 제397조의28","title":"현행 조문에 없음(구법 조문 번호)","chapter":"","deleted":true,"ghost":true,"text":""},{"id":"P:233415","kind":"P","label":"2019가합42484","title":"손해배상(기)","court":"부산지방법원","date":"2020.01.08","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233415"},{"id":"P:217067","kind":"P","label":"2019나21803","title":"부당이득금","court":"광주고등법원","date":"2020.01.08","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=217067"},{"id":"P:220075","kind":"P","label":"2019나2017100","title":"부당이득금","court":"서울고등법원","date":"2020.01.08","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=220075"},{"id":"P:619241","kind":"P","label":"2018가합10237","title":"손해배상(기)","court":"창원지방법원진주지원","date":"2019.12.18","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619241"},{"id":"P:217677","kind":"P","label":"2019가합10234","title":"주주총회결의무효확인등","court":"창원지방법원진주지원","date":"2019.12.18","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=217677"},{"id":"P:225837","kind":"P","label":"2018다287010","title":"구상금","court":"대법원","date":"2019.12.13","caseType":"민사","basis":"참조조문","text":"[1] 소액사건에 관하여 상고이유로 할 수 있는 ‘대법원의 판례에 상반되는 판단을 한 때’라는 요건이 갖추어지지 않았더라도 대법원이 실체법 해석·적용의 잘못에 관하여 직권으로 판단할 수 있는 경우 [2] 피공제자가 경과실로 학교안전사고를 일으킨 경우, 학교안전공제회가 수급권자에게 공제급여를 지급한 후 피공제자를 상대로 구상권을 행사할 수 있는지 여부 및 이처럼 학교안전공제회가 손해배상책임 있는 피공제자에게 제한적으로만 구상권을 행사하도록 한 취지 [3] 경과실로 학교안전사고를 일으킨 피공제자가 먼저 피해자에게 손해배상을 한 경우, 학교안전공제회를 상대로 구상권을 행사할 수 있는지 여부 [4] 학교안전공제회가 학교안전사고로 피해를 입은 수급권자에게 공제급여를 지급한 경우, 손해배상책임 있는 피공제자의 책임보험자에게 수급권자의 보험금직접청구권을 대위행사할 수 있는지 여부 및 이는 책임보험의 피보험자인 피공제자가 경과실로 학교안전사고를 일으킨 경우에도 마찬가지인지 여부 / 피공제자가 경과실로 학교안전사고를 일으켜 피공제자의 책임보험자가 먼저 피해자에게 손해배상금을 지급한 경우, 학교안전공제회를 상대로 구상권을 행사할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=225837"},{"id":"P:225805","kind":"P","label":"2018다224897","title":"구상금","court":"대법원","date":"2019.12.12","caseType":"민사","basis":"참조조문","text":"甲 보험회사가 乙, 丙의 아들 丁과의 사이에 乙, 丙 등 피보험자가 무보험자동차에 의하여 생긴 사고로 죽거나 다쳤을 때 생긴 손해를 약관이 정한 바에 따라 보상하는 ‘무보험자동차에 의한 상해담보특약’을 부가한 자동차보험계약을 체결하였는데, 위 보험계약의 약관에서는 ‘대인배상Ⅰ, 책임공제, 정부보장사업에 의하여 지급될 수 있는 금액’을 보험금 산정 과정 중 공제액의 하나로 규정하고 있는 사안에서, 위 규정은 대인배상Ⅰ, 책임공제, 정부보장사업에 의하여 지급될 수 있는 금액이 있으면 이를 보험자가 지급할 보험금에서 공제하고 그 나머지만 지급한다는 취지이지 위 금액이 전혀 없는 경우까지 대인배상Ⅰ, 책임공제, 정부보장사업이 적용될 경우를 가상하여 산정한 금액을 넘는 부분만을 보험금으로 지급한다는 취지는 아니라고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=225805"},{"id":"P:225751","kind":"P","label":"2017다244115","title":"손해배상(기)","court":"대법원","date":"2019.11.28","caseType":"민사","basis":"참조조문","text":"[1] 주식회사의 이사가 부담하는 대표이사와 다른 이사들의 업무집행을 감시·감독할 의무의 내용 및 이러한 의무는 사외이사와 비상근이사도 마찬가지로 부담하는지 여부 [2] 주식회사 감사의 권한과 의무 및 책임 [3] 코스닥 시장 상장회사였던 甲 주식회사가 추진한 유상증자 이후, 차명 지분 등을 통해 甲 회사를 포함한 그룹을 지배하며 실질적으로 운영하던 乙 및 그의 지휘 아래 그룹 업무를 총괄하던 丙 등이 유상증자대금의 일부를 횡령하자, 甲 회사가 횡령행위 기간 중 甲 회사의 이사 또는 대표이사 및 감사로 재직하였던 丁 등을 상대로 상법 제399조, 제414조 등에 따른 손해배상을 구한 사안에서, 丁 등은 甲 회사의 이사 및 감사로서 이사회에 출석하고 상법의 규정에 따른 감사활동을 하는 등 기본적인 직무조차 이행하지 않았고, 乙 등의 전횡과 위법한 직무수행에 관한 감시·감독의무를 지속적으로 소홀히 하였으며, 이러한 丁 등의 임무 해태와 乙 등이 유상증자대금을 횡령함으로써 甲 회사가 입은 손해 사이에 상당인과관계가 충분히 인정되는데도, 이와 달리 보아 丁 등의 책임을 부정한 원심판단에는 상법상 이사 및 감사의 주의의무에 관한 법리오해의 잘못이 있다고 한 사례 [4] 법원이 당사자의 변론재개신청을 받아들여 변론을 재개할 의무가 있는 예외적인 경우","url":"https://www.law.go.kr/precInfoP.do?precSeq=225751"},{"id":"P:225735","kind":"P","label":"2018가단249746","title":"부동산중개수수료청구","court":"서울남부지방법원","date":"2019.11.27","caseType":"민사","basis":"판례내용","text":"甲, 乙 등이 공동으로 소유하는 부동산에 관하여 임대차 중개행위를 하던 공인중개사 丙이 당시 미국에 머물고 있던 甲에게 위 부동산을 매물로 내놓자는 요청을 하여 승낙을 얻은 다음, 위 부동산의 일부를 임차하여 교수연구실로 사용하고 있는 丁 대학병원 측에 매도의사를 알리는 등 중개행위를 하고 있었는데, 甲과 乙이 귀국하여 丁 병원 측에 직접 매도의사를 전달하고, 그 후 甲, 乙 등이 丁 병원을 운영하는 戊 학교법인과 戊 법인이 예전부터 자주 중개의뢰를 해오던 공인중개사의 중개에 따라 위 부동산에 관한 매매계약을 체결하자, 丙이 甲, 乙 등을 상대로 공인중개사법 제32조 및 신의성실의 원칙에 따른 중개수수료의 지급을 구한 사안에서, 丙과 甲, 乙 등 사이에 위 부동산에 관한 중개계약이 체결되었다거나 丙이 위 매매계약 체결에 결정적인 기여를 하였다고 인정하기 부족하므로, 丙은 甲, 乙 등에게 공인중개사법 제32조 등에 따른 중개수수료의 지급을 구할 수 없다고 본 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=225735"},{"id":"P:210819","kind":"P","label":"2019다240629","title":"구상금","court":"대법원","date":"2019.11.15","caseType":"민사","basis":"참조조문","text":"[1] 손해보험의 피보험자가 보험자로부터 수령한 보험금으로 전보되지 않고 남은 손해에 관하여 배상의무자인 제3자를 상대로 배상책임을 이행할 것을 청구할 수 있는지 여부 및 이때 전체 손해액에서 보험금으로 전보되지 않고 남은 손해액이 제3자의 손해배상책임액보다 적을 경우, 보험자가 보험자대위권을 행사할 수 있는 범위 / 이는 보험목적물의 보험금액이 보험가액에 미치지 못하는 일부보험의 경우에도 마찬가지인지 여부 [2] 보험자대위에 관한 상법 제682조의 규정 취지 및 하나의 사고로 보험목적물과 보험목적물이 아닌 재산에 대하여 한꺼번에 손해가 발생한 경우, 보험자가 보험자대위에 의하여 제3자에게 청구할 수 있는 권리의 범위는 보험목적물에 대한 부분으로 한정하여 결정하여야 하는지 여부 [3] 甲 보험회사가 乙 주식회사와 그 소유의 공장건물에 관하여 일부보험계약을 체결하였는데, 丙 등이 점유·사용하고 있는 컨테이너 주택에서 발생한 화재로 위 공장건물 및 乙 회사 소유의 차량 등 동산과 자재 등이 모두 소훼되는 손해가 발생하였고, 甲 회사가 乙 회사에 보험금을 지급한 후 丙 등을 상대로 구상금 지급을 구한 사안에서, 보험목적물인 공장건물에 발생한 손해 중 보험금으로 전보되지 않은 손해액이 丙 등의 공장건물에 대한 손해배상책임액보다 적으므로 甲 회사는 보험자대위에 의하여 그 차액을 丙 등에게 청구할 수 있는데도, 乙 회사가 입은 전체 손해액을 기","url":"https://www.law.go.kr/precInfoP.do?precSeq=210819"},{"id":"P:210565","kind":"P","label":"2019다216589","title":"구상금","court":"대법원","date":"2019.11.14","caseType":"민사","basis":"참조조문","text":"[1] 상법 제682조 제1항에서 정한 보험자대위권을 행사할 수 있는 범위는 보험목적물을 대상으로 산정하여야 하는지 여부 [2] 일부보험의 피보험자가 보험자로부터 수령한 보험금으로 전보되지 않고 남은 손해에 관하여 배상의무자인 제3자를 상대로 배상책임을 이행할 것을 청구할 수 있는지 여부 및 이때 전체 손해액에서 보험금으로 전보되지 않고 남은 손해액이 제3자의 손해배상책임액보다 적을 경우, 보험자가 보험자대위권을 행사할 수 있는 범위 [3] 甲 보험회사가 乙 주식회사와 피보험자를 乙 회사로 하여 그 소유의 건물과 동산을 보험목적물로 하는 보험계약을 체결하였고, 위 보험계약은 보험목적물의 보험금액이 사고발생 시의 가액으로 산정한 총보험가액에 미치지 못하는 일부보험에 해당하였는데, 丙이 운영하던 정비공장에 화재가 발생하여 乙 회사의 건물 등으로 불길이 옮겨붙는 화재사고가 발생하여 위 보험목적물뿐만 아니라 보험에 가입하지 아니한 별도 가건물 내 보관된 재고자산 등이 소실되는 손해가 발생하였고, 甲 회사가 乙 회사에 위 화재로 보험목적물에 발생한 손해에 대하여 보험금을 지급한 후 丙과 그 보험자인 丁 보험회사를 상대로 구상금 지급을 구한 사안에서, 甲 회사는 보험목적물에 관한 丙과 丁 회사의 손해배상책임액과 乙 회사의 남은 손해액의 차액 상당액에 대하여 보험자대위권을 행사할 수 있는데도, 이와 달리 甲 회사가 보험자대위를 행사할 수 있는 범","url":"https://www.law.go.kr/precInfoP.do?precSeq=210565"},{"id":"P:210833","kind":"P","label":"2019다215432","title":"구상금","court":"대법원","date":"2019.11.14","caseType":"민사","basis":"참조조문","text":"[1] 상법 제682조 제1항에서 정한 보험자대위권을 행사할 수 있는 범위는 보험목적물을 대상으로 산정하여야 하는지 여부 [2] 甲 보험회사가 乙과 공장 기계를 보험목적물로 하는 보험계약을 체결하였는데, 丙이 운영하던 공장에서 발생한 화재로 乙이 기계뿐만 아니라 재고자산 등이 소훼되는 손해를 입었고, 이에 甲 회사가 피보험자인 乙에게 보험계약에 따라 보험금을 전액 지급한 후 丙을 상대로 구상금 지급을 구한 사안에서, 甲 회사는 보험목적물인 기계에 발생한 손해에 관하여 피보험자인 乙에게 보험금을 전부 지급하였으므로, 상법 제682조 제1항 본문에 따라 乙에게 지급한 보험금의 한도에서 丙에 대한 乙의 기계에 관한 손해배상채권을 취득하는데도, 화재로 乙이 입은 전체 손해에 대한 丙의 손해배상책임액에서 보험금으로 전보되지 않고 남은 손해액을 빼면 甲 회사가 보험자대위를 할 수 있는 돈이 남아 있지 않다고 보아 甲 회사의 청구를 기각한 원심판단에 법리오해의 위법이 있다고 한 사례 [3] 실화로 인한 손해의 배상의무자가 실화책임에 관한 법률 제3조 제1항에 의하여 손해배상액의 경감을 청구한 경우, 손해배상액의 경감 여부 및 그 비율을 정하는 것이 사실심의 전권사항인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=210833"},{"id":"P:213339","kind":"P","label":"2019카합10372","title":"장부등열람허용가처분","court":"서울동부지방법원","date":"2019.11.01","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=213339"},{"id":"P:599865","kind":"P","label":"2015나2000630","title":"손해배상(기)","court":"서울고등법원","date":"2019.10.31","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=599865"},{"id":"P:210427","kind":"P","label":"2019다247651","title":"대여금","court":"대법원","date":"2019.10.31","caseType":"민사","basis":"판례내용","text":"당사자 쌍방의 채무가 동시이행관계에 있는 경우, 상대방 채무의 이행제공이 있을 때까지 이행지체의 책임을 지지 않는지 여부 / 금전채권의 채무자가 채권자에게 담보를 제공한 경우, 채무자의 변제의무와 채권자의 담보 반환의무가 동시이행관계에 있는지 여부 및 이때 채권자가 담보를 반환하기 전에도 채무자가 이행지체 책임을 지는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=210427"},{"id":"P:217069","kind":"P","label":"2015나2056305","title":"손해배상(기)","court":"서울고등법원","date":"2019.10.30","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=217069"},{"id":"P:210413","kind":"P","label":"2012다46170","title":"정산금등","court":"대법원","date":"2019.10.23","caseType":"민사","basis":"참조조문","text":"[1] 소송 계속 중 제3자가 민사소송법 제81조에 따라 소송에 참가한 후 원고가 제3자인 원고 승계참가인의 승계 여부에 대해 다투지 않으면서도 소송탈퇴, 소 취하 등을 하지 않거나 이에 대하여 피고가 부동의하여 원고가 소송에 남아 있는 경우, 승계로 인해 중첩된 원고와 원고 승계참가인의 청구 사이에 필수적 공동소송에 관한 민사소송법 제67조가 적용되는지 여부 [2] 상법 제520조의2에 따라 주식회사가 해산되고 청산이 종결된 것으로 보게 되더라도 회사에 어떤 권리관계가 남아 있어 현실적으로 정리할 필요가 있는 경우, 회사가 그 범위에서 소멸하지 않는지 여부 및 이때 회사를 대표하는 청산인이 되는 자 [3] 민법 제500조에서 정한 ‘경개’의 의미 및 기존채무와 관련하여 새로이 체결한 약정이 경개에 해당하는지 아니면 단순히 기존채무의 변제기나 변제방법 등을 변경한 것인지에 관하여 당사자 의사가 명백하지 않은 경우, 당사자의 의사를 해석하는 방법","url":"https://www.law.go.kr/precInfoP.do?precSeq=210413"},{"id":"P:225643","kind":"P","label":"2018다239110","title":"퇴직금등청구의소","court":"대법원","date":"2019.10.18","caseType":"민사","basis":"참조조문","text":"[1] 근로기준법상 근로자에 해당하는지 판단하는 기준 [2] 취업규칙 등에서 연차휴가수당의 산정 기준을 정하지 않은 경우, 연차휴가수당 산정의 기초가 되는 임금 [3] 甲 등이 乙 주식회사를 상대로 미지급 임금 등과 이에 대한 지연손해금의 지급을 구하였는데, 제1심은 甲의 청구만 일부 인용하고 나머지 사람들의 청구를 모두 기각하였으나, 원심은 甲 등의 청구를 일부 인용한 사안에서, 원심판결 선고일까지는 미지급 임금 등의 존부를 다투는 것이 적절하였다고 보이므로, 위 기간에 대하여 근로기준법에서 정한 이율을 적용하는 것이 부당하다고 한 사례 [4] 휴일을 대체휴가일로 정할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=225643"},{"id":"P:210895","kind":"P","label":"2019다14998","title":"손해배상","court":"대법원","date":"2019.10.17","caseType":"민사","basis":"참조조문","text":"甲이 해외국제운송업자인 乙에게 중고품이 포함된 휴대전화 액정들을 중국으로 운송하여 달라고 의뢰를 하여 乙이 丙 주식회사를 통해 항공편으로 위 액정들을 중국으로 발송하였는데, 중국 세관이 휴대전화 액정들이 중고물품으로 보인다며 사용 용도를 알고자 통관을 보류하고 丙 회사 측에 관련 자료를 요구하였음에도 자료가 제출되지 않아 위 액정들이 폐기되자, 甲이 乙을 상대로 위 액정들의 폐기에 따른 손해배상을 구한 사안에서, 위 액정들은 중국 세관에 의하여 통관 보류 후 폐기된 것으로 상법 제913조 제1항 제4호에 따른 항공운송인의 면책사유에 해당한다고 볼 여지가 있는데도, 이러한 면책사유가 있는지에 관하여 살펴보지 않은 채 乙에게는 해외운송을 의뢰받은 운송인으로서 상법 제135조에 따라 위 액정들의 폐기에 따른 손해를 배상할 의무가 있다고 본 원심판단에는 항공운송물의 멸실·훼손에 대한 운송인의 책임에 관한 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=210895"},{"id":"P:238335","kind":"P","label":"2019누33509","title":"법인세경정거부처분취소","court":"서울고등법원","date":"2019.10.16","caseType":"세무","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238335"},{"id":"P:213599","kind":"P","label":"2019가합77","title":"장부열람 등","court":"청주지방법원제천지원","date":"2019.09.26","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=213599"},{"id":"P:234547","kind":"P","label":"2016나2063874","title":"손해배상(기)","court":"서울고등법원","date":"2019.09.26","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=234547"},{"id":"P:210647","kind":"P","label":"2018가합52986","title":"손해배상(기)","court":"창원지방법원","date":"2019.09.19","caseType":"민사","basis":"참조조문","text":"지상파 방송사 甲 주식회사 계열의 지역 방송사인 乙 주식회사가 대표이사 丙이 장기간의 방송파행 사태를 불러오는 등 조직통할 능력이 부족하고, 乙 회사의 경영상황을 악화시키는 등 경영능력이 없으며, 乙 회사의 명예와 신뢰를 실추시켰다는 이유로 정기주주총회 결의에 따라 丙을 사내이사 및 대표이사에서 해임하자, 丙이 임기 전 해임에 정당한 이유가 없다며 乙 회사를 상대로 상법 제385조 제1항에 따른 손해의 배상을 구한 사안에서, 제반 사정에 비추어 乙 회사가 丙에 대하여 해임 사유로 든 것들은 모두 임기 전 이사 해임의 정당한 이유가 될 수 없고, 그 외에 다른 정당한 이유가 있다고 볼 수도 없으므로, 乙 회사는 상법 제385조 제1항에 따라 丙에게 손해를 배상할 책임이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=210647"},{"id":"P:225547","kind":"P","label":"2019나2006063","title":"주식양도절차이행","court":"서울고등법원","date":"2019.09.19","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=225547"},{"id":"P:225535","kind":"P","label":"2016다271257","title":"부당이득금","court":"대법원","date":"2019.09.10","caseType":"민사","basis":"참조조문","text":"[1] 부당이득반환청구권에 5년의 소멸시효를 정한 상법 제64조가 적용되는 경우 [2] 甲 주식회사가 대출금 채무자의 재산에 관한 경매사건 배당절차에서 가지는 권리를 乙 등이 침해하였다고 주장하며 乙 등이 수령한 배당금에 대하여 부당이득반환을 구한 사안에서, 甲 회사가 주장하는 부당이득반환청구권은 상행위에 해당하는 계약에 기초하여 이루어진 급부 자체의 반환을 구하는 것이 아니고, 甲 회사와 乙 등의 법률관계를 상거래 관계와 같은 정도로 신속하게 해결할 필요성이 없으므로 상법 제64조가 적용되지 아니하고 10년의 민사소멸시효기간이 적용되어야 하는데도, 이와 달리 본 원심판단에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=225535"},{"id":"P:209595","kind":"P","label":"2016두1165","title":"증여세부과처분취소","court":"대법원","date":"2019.09.10","caseType":"세무","basis":"참조조문","text":"[1] 기명식 전환사채가 구 상속세 및 증여세법 제45조의2 제1항 본문에서 정한 ‘권리의 이전이나 그 행사에 등기 등을 요하는 재산’에 해당하는지 여부 [2] 최초로 증여의제 대상이 되어 과세되었거나 과세될 수 있는 기명식 전환사채의 명의수탁자에게 전환권 행사에 따라 배정된 주식에 대하여 다시 구 상속세 및 증여세법 제45조의2 제1항 본문을 적용하여 증여세를 과세할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=209595"},{"id":"P:229011","kind":"P","label":"2019나54934","title":"구상금","court":"인천지방법원","date":"2019.09.05","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=229011"},{"id":"P:228427","kind":"P","label":"2018나2028332","title":"손해배상","court":"서울고등법원","date":"2019.09.05","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=228427"},{"id":"P:214763","kind":"P","label":"2019나11404","title":"보험계약 존재확인의 소","court":"부산고등법원창원재판부","date":"2019.08.29","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=214763"},{"id":"P:221803","kind":"P","label":"2018나2057132","title":"소유권이전등기","court":"서울고등법원","date":"2019.08.28","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=221803"},{"id":"P:221883","kind":"P","label":"2019나2010079","title":"회계장부와서류의열람및등사청구의소","court":"서울고등법원","date":"2019.08.23","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=221883"},{"id":"P:237633","kind":"P","label":"2018가합504192","title":"조정결정변경등청구","court":"서울중앙지방법원","date":"2019.08.22","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=237633"},{"id":"P:209310","kind":"P","label":"2018나26030","title":"손해배상(기)","court":"광주고등법원","date":"2019.08.21","caseType":"민사","basis":"참조조문","text":"연안복합어선의 소유자 겸 선장인 甲이 잠수부 乙을 승선시킨 후 출항하였다가 선착장 인근에 방치된 바지선을 발견하지 못하고 충격하여 乙과 함께 사망하는 사고가 발생하자, 乙의 유족인 丙 등이 위 사고는 어선을 운항하던 甲이 전방주시를 제대로 하지 않은 과실과 바지선을 방치해 둔 바지선 소유자의 과실이 경합하여 발생한 것이므로 어선 소유자인 甲은 상법 제879조 제2항에 따라 丙 등에게 乙의 사망으로 인한 손해를 배상할 책임이 있다며 甲의 유일한 상속인인 丁을 상대로 손해배상을 구하였고, 丁은 乙이 甲과 위 어선을 이용하여 해산물 채취를 동업하던 어선의 공동운행자이므로 자동차손해배상 보장법 제3조에서 정한 ‘다른 사람’에 해당하지 않아 손해배상책임이 없다고 주장한 사안에서, 甲은 乙과 동업을 하였다 하더라도 내부관계에서 어선의 운항을 전담하였던 것으로 보이는 점과 乙이 사고 당시 甲에게 어선 운항에 관하여 지시하는 등으로 이에 관여하였다고 볼 아무런 증거가 없는 점에 비추어 乙은 상법 제879조 제2항에서 정한 ‘제3자’에 해당하므로 위 사고로 인한 丁의 손해배상책임을 부정할 수는 없고, 설령 丁의 주장과 같은 법리를 따르더라도 위 사고는 자동차가 아닌 선박의 충돌로 인한 사고이므로 자동차손해배상 보장법이 적용될 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=209310"}],"edges":[{"source":"L:542-9","target":"D:35","kind":"delegates","weight":1},{"source":"L:542-6","target":"D:32","kind":"delegates","weight":1},{"source":"L:542-13","target":"D:41","kind":"delegates","weight":1},{"source":"L:341","target":"D:9","kind":"delegates","weight":1},{"source":"L:469","target":"D:22","kind":"delegates","weight":1},{"source":"L:462","target":"D:19","kind":"delegates","weight":1},{"source":"L:469","target":"D:24","kind":"delegates","weight":1},{"source":"L:352-2","target":"D:11","kind":"delegates","weight":1},{"source":"L:446-2","target":"D:15","kind":"delegates","weight":1},{"source":"L:447-2","target":"D:17","kind":"delegates","weight":1},{"source":"L:459","target":"D:18","kind":"delegates","weight":1},{"source":"L:480-3","target":"D:26","kind":"delegates","weight":1},{"source":"L:469","target":"D:20","kind":"delegates","weight":1},{"source":"L:731","target":"D:44-2","kind":"delegates","weight":1},{"source":"L:542-13","target":"D:39"
