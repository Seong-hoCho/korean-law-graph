<개정 1984.4.10>\n④ 제1항 단서의 경우에는 제302조제2항제5호의2, 제317조제2항제3호의2, 제335조제1항 단서 및 제2항, 제335조의2제1항ㆍ제3항, 제335조의3제1항ㆍ제2항, 제335조의7제1항, 제340조의3제1항제5호, 제356조제6호의2, 제397조제1항ㆍ제2항, 제397조의2제1항, 제398조, 제416조 본문, 제451조제2항, 제461조제1항 본문 및 제3항, 제462조의3제1항, 제464조의2제1항, 제469조, 제513조제2항 본문 및 제516조의2제2항 본문(준용되는 경우를 포함한다) 중 \"이사회\"는 각각 \"주주총회\"로 보며, 제360조의5제1항 및 제522조의3제1항 중 \"이사회의 결의가 있는 때\"는 \"제363조제1항에 따른 주주총회의 소집통지가 있는 때\"로 본다. <개정 2009.5.28, 2011.4.14>\n⑤ 제1항 단서의 경우에는 제341조제2항 단서, 제390조, 제391조, 제391조의2, 제391조의3, 제392조, 제393조제2항부터 제4항까지, 제399조제2항, 제408조의2제3항ㆍ제4항, 제408조의3제2항, 제408조의4제2호, 제408조의5제1항, 제408조의6, 제408조의7, 제412조의4, 제449조의2, 제462조제2항 단서, 제526조제3항, 제527조제4항, 제527조의2, 제527조의3제1항 및 제527조의5제2항은 적용하지 아니한다. <개정 2009.5.28, 2011.4.14>\n⑥ 제1항 단서의 경우에는 각 이사(정관에 따라 대표이사를 정한 경우에는 그 대표이사를 말한다)가 회사를 대표하며 제343조제1항 단서, 제346조제3항, 제362조, 제363조의2제3항, 제366조제1항, 제368조의4제1항, 제393조제1항, 제412조의3제1항 및 제462조의3제1항에 따른 이사회의 기능을 담당한다. <개정 2009.5.28, 2011.4.14>\n제383조(원수, 임기)","kind":"L"},{"id":"L:384","label":"법 제384조","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제384조 삭제 <1995.12.29>","kind":"L"},{"id":"L:385","label":"법 제385조","title":"해임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①이사는 언제든지 제434조의 규정에 의한 주주총회의 결의로 이를 해임할 수 있다. 그러나 이사의 임기를 정한 경우에 정당한 이유없이 그 임기만료전에 이를 해임한 때에는 그 이사는 회사에 대하여 해임으로 인한 손해의 배상을 청구할 수 있다.\n②이사가 그 직무에 관하여 부정행위 또는 법령이나 정관에 위반한 중대한 사실이 있음에도 불구하고 주주총회에서 그 해임을 부결한 때에는 발행주식의 총수의 100분의 3 이상에 해당하는 주식을 가진 주주는 총회의 결의가 있은 날부터 1월내에 그 이사의 해임을 법원에 청구할 수 있다. <개정 1998.12.28>\n③제186조의 규정은 전항의 경우에 준용한다.\n제385조(해임)","kind":"L"},{"id":"L:386","label":"법 제386조","title":"결원의 경우","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①법률 또는 정관에 정한 이사의 원수를 결한 경우에는 임기의 만료 또는 사임으로 인하여 퇴임한 이사는 새로 선임된 이사가 취임할 때까지 이사의 권리의무가 있다.\n②제1항의 경우에 필요하다고 인정할 때에는 법원은 이사, 감사 기타의 이해관계인의 청구에 의하여 일시 이사의 직무를 행할 자를 선임할 수 있다. 이 경우에는 본점의 소재지에서 그 등기를 하여야 한다. <개정 1995.12.29>\n제386조(결원의 경우)","kind":"L"},{"id":"L:387","label":"법 제387조","title":"자격주","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제387조(자격주) 정관으로 이사가 가질 주식의 수를 정한 경우에 다른 규정이 없는 때에는 이사는 그 수의 주권을 감사에게 공탁하여야 한다.","kind":"L"},{"id":"L:388","label":"법 제388조","title":"이사의 보수","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제388조(이사의 보수) 이사의 보수는 정관에 그 액을 정하지 아니한 때에는 주주총회의 결의로 이를 정한다.","kind":"L"},{"id":"L:389","label":"법 제389조","title":"대표이사","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사는 이사회의 결의로 회사를 대표할 이사를 선정하여야 한다. 그러나 정관으로 주주총회에서 이를 선정할 것을 정할 수 있다.\n②전항의 경우에는 수인의 대표이사가 공동으로 회사를 대표할 것을 정할 수 있다.\n③제208조제2항, 제209조, 제210조와 제386조의 규정은 대표이사에 준용한다. <개정 1962.12.12>\n제389조(대표이사)","kind":"L"},{"id":"L:390","label":"법 제390조","title":"이사회의 소집","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①이사회는 각 이사가 소집한다. 그러나 이사회의 결의로 소집할 이사를 정한 때에는 그러하지 아니하다.\n②제1항 단서의 규정에 의하여 소집권자로 지정되지 않은 다른 이사는 소집권자인 이사에게 이사회 소집을 요구할 수 있다. 소집권자인 이사가 정당한 이유없이 이사회 소집을 거절하는 경우에는 다른 이사가 이사회를 소집할 수 있다. <신설 2001.7.24>\n③이사회를 소집함에는 회일을 정하고 그 1주간전에 각 이사 및 감사에 대하여 통지를 발송하여야 한다. 그러나 그 기간은 정관으로 단축할 수 있다. <개정 1984.4.10>\n④이사회는 이사 및 감사 전원의 동의가 있는 때에는 제3항의 절차없이 언제든지 회의할 수 있다. <개정 1984.4.10, 2001.7.24>\n제390조(이사회의 소집)","kind":"L"},{"id":"L:391","label":"법 제391조","title":"이사회의 결의방법","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①이사회의 결의는 이사과반수의 출석과 출석이사의 과반수로 하여야 한다. 그러나 정관으로 그 비율을 높게 정할 수 있다.\n②정관에서 달리 정하는 경우를 제외하고 이사회는 이사의 전부 또는 일부가 직접 회의에 출석하지 아니하고 모든 이사가 음성을 동시에 송수신하는 원격통신수단에 의하여 결의에 참가하는 것을 허용할 수 있다. 이 경우 당해 이사는 이사회에 직접 출석한 것으로 본다. <신설 1999.12.31, 2011.4.14>\n③제368조제3항 및 제371조제2항의 규정은 제1항의 경우에 이를 준용한다. <개정 2014.5.20>\n제391조(이사회의 결의방법)","kind":"L"},{"id":"L:391-2","label":"법 제391조의2","title":"감사의 이사회출석ㆍ의견진술권","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①감사는 이사회에 출석하여 의견을 진술할 수 있다.\n②감사는 이사가 법령 또는 정관에 위반한 행위를 하거나 그 행위를 할 염려가 있다고 인정한 때에는 이사회에 이를 보고하여야 한다.\n제391조의2(감사의 이사회출석ㆍ의견진술권)","kind":"L"},{"id":"L:391-3","label":"법 제391조의3","title":"이사회의 의사록","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①이사회의 의사에 관하여는 의사록을 작성하여야 한다.\n②의사록에는 의사의 안건, 경과요령, 그 결과, 반대하는 자와 그 반대이유를 기재하고 출석한 이사 및 감사가 기명날인 또는 서명하여야 한다. <개정 1995.12.29, 1999.12.31>\n③주주는 영업시간내에 이사회의사록의 열람 또는 등사를 청구할 수 있다. <신설 1999.12.31>\n④회사는 제3항의 청구에 대하여 이유를 붙여 이를 거절할 수 있다. 이 경우 주주는 법원의 허가를 얻어 이사회의사록을 열람 또는 등사할 수 있다. <신설 1999.12.31>\n제391조의3(이사회의 의사록)","kind":"L"},{"id":"L:392","label":"법 제392조","title":"이사회의 연기ㆍ속행","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제392조(이사회의 연기ㆍ속행) 제372조의 규정은 이사회에 관하여 이를 준용한다.","kind":"L"},{"id":"L:393","label":"법 제393조","title":"이사회의 권한","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①중요한 자산의 처분 및 양도, 대규모 재산의 차입, 지배인의 선임 또는 해임과 지점의 설치ㆍ이전 또는 폐지 등 회사의 업무집행은 이사회의 결의로 한다. <개정 2001.7.24>\n②이사회는 이사의 직무의 집행을 감독한다.\n③이사는 대표이사로 하여금 다른 이사 또는 피용자의 업무에 관하여 이사회에 보고할 것을 요구할 수 있다. <신설 2001.7.24>\n④이사는 3월에 1회 이상 업무의 집행상황을 이사회에 보고하여야 한다. <신설 2001.7.24>\n제393조(이사회의 권한)","kind":"L"},{"id":"L:393-2","label":"법 제393조의2","title":"이사회내 위원회","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①이사회는 정관이 정한 바에 따라 위원회를 설치할 수 있다.\n②이사회는 다음 각호의 사항을 제외하고는 그 권한을 위원회에 위임할 수 있다.\n1. 주주총회의 승인을 요하는 사항의 제안\n2. 대표이사의 선임 및 해임\n3. 위원회의 설치와 그 위원의 선임 및 해임\n4. 정관에서 정하는 사항\n③위원회는 2인 이상의 이사로 구성한다.\n④위원회는 결의된 사항을 각 이사에게 통지하여야 한다. 이 경우 이를 통지받은 각 이사는 이사회의 소집을 요구할 수 있으며, 이사회는 위원회가 결의한 사항에 대하여 다시 결의할 수 있다.\n⑤제386조제1항ㆍ제390조ㆍ제391조ㆍ제391조의3 및 제392조의 규정은 위원회에 관하여 이를 준용한다.\n제393조의2(이사회내 위원회)","kind":"L"},{"id":"L:394","label":"법 제394조","title":"이사와 회사간의 소에 관한 대표","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사가 이사에 대하여 또는 이사가 회사에 대하여 소를 제기하는 경우에 감사는 그 소에 관하여 회사를 대표한다. 회사가 제403조제1항 또는 제406조의2제1항의 청구를 받은 경우에도 또한 같다. <개정 2020.12.29>\n②제415조의2의 규정에 의한 감사위원회의 위원이 소의 당사자인 경우에는 감사위원회 또는 이사는 법원에 회사를 대표할 자를 선임하여 줄 것을 신청하여야 한다. <신설 1999.12.31>\n제394조(이사와 회사간의 소에 관한 대표)","kind":"L"},{"id":"L:395","label":"법 제395조","title":"표현대표이사의 행위와 회사의 책임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제395조(표현대표이사의 행위와 회사의 책임) 사장, 부사장, 전무, 상무 기타 회사를 대표할 권한이 있는 것으로 인정될 만한 명칭을 사용한 이사의 행위에 대하여는 그 이사가 회사를 대표할 권한이 없는 경우에도 회사는 선의의 제3자에 대하여 그 책임을 진다.","kind":"L"},{"id":"L:396","label":"법 제396조","title":"정관 등의 비치, 공시의무","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①이사는 회사의 정관, 주주총회의 의사록을 본점과 지점에, 주주명부, 사채원부를 본점에 비치하여야 한다. 이 경우 명의개서대리인을 둔 때에는 주주명부나 사채원부 또는 그 복본을 명의개서대리인의 영업소에 비치할 수 있다. <개정 1984.4.10, 1999.12.31>\n②주주와 회사채권자는 영업시간 내에 언제든지 제1항의 서류의 열람 또는 등사를 청구할 수 있다. <개정 1984.4.10>\n제396조(정관 등의 비치, 공시의무)","kind":"L"},{"id":"L:397","label":"법 제397조","title":"경업금지","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①이사는 이사회의 승인이 없으면 자기 또는 제3자의 계산으로 회사의 영업부류에 속한 거래를 하거나 동종영업을 목적으로 하는 다른 회사의 무한책임사원이나 이사가 되지 못한다. <개정 1995.12.29>\n②이사가 제1항의 규정에 위반하여 거래를 한 경우에 회사는 이사회의 결의로 그 이사의 거래가 자기의 계산으로 한 것인 때에는 이를 회사의 계산으로 한 것으로 볼 수 있고 제3자의 계산으로 한 것인 때에는 그 이사에 대하여 이로 인한 이득의 양도를 청구할 수 있다. <개정 1962.12.12, 1995.12.29>\n③제2항의 권리는 거래가 있은 날로부터 1년을 경과하면 소멸한다. <개정 1995.12.29>\n제397조(경업금지)","kind":"L"},{"id":"L:397-2","label":"법 제397조의2","title":"회사의 기회 및 자산의 유용 금지","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 이사는 이사회의 승인 없이 현재 또는 장래에 회사의 이익이 될 수 있는 다음 각 호의 어느 하나에 해당하는 회사의 사업기회를 자기 또는 제3자의 이익을 위하여 이용하여서는 아니 된다. 이 경우 이사회의 승인은 이사 3분의 2 이상의 수로써 하여야 한다.\n1. 직무를 수행하는 과정에서 알게 되거나 회사의 정보를 이용한 사업기회\n2. 회사가 수행하고 있거나 수행할 사업과 밀접한 관계가 있는 사업기회\n② 제1항을 위반하여 회사에 손해를 발생시킨 이사 및 승인한 이사는 연대하여 손해를 배상할 책임이 있으며 이로 인하여 이사 또는 제3자가 얻은 이익은 손해로 추정한다.\n제397조의2(회사의 기회 및 자산의 유용 금지)","kind":"L"},{"id":"L:398","label":"법 제398조","title":"이사 등과 회사 간의 거래","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"1. 이사 또는 제542조의8제2항제6호에 따른 주요주주\n2. 제1호의 자의 배우자 및 직계존비속\n3. 제1호의 자의 배우자의 직계존비속\n4. 제1호부터 제3호까지의 자가 단독 또는 공동으로 의결권 있는 발행주식 총수의 100분의 50 이상을 가진 회사 및 그 자회사\n5. 제1호부터 제3호까지의 자가 제4호의 회사와 합하여 의결권 있는 발행주식총수의 100분의 50 이상을 가진 회사\n제398조(이사 등과 회사 간의 거래) 다음 각 호의 어느 하나에 해당하는 자가 자기 또는 제3자의 계산으로 회사와 거래를 하기 위하여는 미리 이사회에서 해당 거래에 관한 중요사실을 밝히고 이사회의 승인을 받아야 한다. 이 경우 이사회의 승인은 이사 3분의 2 이상의 수로써 하여야 하고, 그 거래의 내용과 절차는 공정하여야 한다.","kind":"L"},{"id":"L:399","label":"법 제399조","title":"회사에 대한 책임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 이사가 고의 또는 과실로 법령 또는 정관에 위반한 행위를 하거나 그 임무를 게을리한 경우에는 그 이사는 회사에 대하여 연대하여 손해를 배상할 책임이 있다. <개정 2011.4.14>\n②전항의 행위가 이사회의 결의에 의한 것인 때에는 그 결의에 찬성한 이사도 전항의 책임이 있다.\n③전항의 결의에 참가한 이사로서 이의를 한 기재가 의사록에 없는 자는 그 결의에 찬성한 것으로 추정한다.\n제399조(회사에 대한 책임)","kind":"L"},{"id":"L:400","label":"법 제400조","title":"회사에 대한 책임의 감면","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 제399조에 따른 이사의 책임은 주주 전원의 동의로 면제할 수 있다.\n② 회사는 정관으로 정하는 바에 따라 제399조에 따른 이사의 책임을 이사가 그 행위를 한 날 이전 최근 1년간의 보수액(상여금과 주식매수선택권의 행사로 인한 이익 등을 포함한다)의 6배(사외이사 및 제542조의8제1항의 독립이사의 경우는 3배)를 초과하는 금액에 대하여 면제할 수 있다. 다만, 이사가 고의 또는 중대한 과실로 손해를 발생시킨 경우와 제397조 제397조의2 및 제398조에 해당하는 경우에는 그러하지 아니하다. <개정 2025.7.22>\n제400조(회사에 대한 책임의 감면)","kind":"L"},{"id":"L:401","label":"법 제401조","title":"제3자에 대한 책임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 이사가 고의 또는 중대한 과실로 그 임무를 게을리한 때에는 그 이사는 제3자에 대하여 연대하여 손해를 배상할 책임이 있다. <개정 2011.4.14>\n②제399조제2항, 제3항의 규정은 전항의 경우에 준용한다.\n제401조(제3자에 대한 책임)","kind":"L"},{"id":"L:401-2","label":"법 제401조의2","title":"업무집행지시자 등의 책임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①다음 각 호의 어느 하나에 해당하는 자가 그 지시하거나 집행한 업무에 관하여 제399조, 제401조, 제403조 및 제406조의2를 적용하는 경우에는 그 자를 \"이사\"로 본다. <개정 2020.12.29>\n1. 회사에 대한 자신의 영향력을 이용하여 이사에게 업무집행을 지시한 자\n2. 이사의 이름으로 직접 업무를 집행한 자\n3. 이사가 아니면서 명예회장ㆍ회장ㆍ사장ㆍ부사장ㆍ전무ㆍ상무ㆍ이사 기타 회사의 업무를 집행할 권한이 있는 것으로 인정될 만한 명칭을 사용하여 회사의 업무를 집행한 자\n②제1항의 경우에 회사 또는 제3자에 대하여 손해를 배상할 책임이 있는 이사는 제1항에 규정된 자와 연대하여 그 책임을 진다.\n제401조의2(업무집행지시자 등의 책임)","kind":"L"},{"id":"L:402","label":"법 제402조","title":"유지청구권","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제402조(유지청구권) 이사가 법령 또는 정관에 위반한 행위를 하여 이로 인하여 회사에 회복할 수 없는 손해가 생길 염려가 있는 경우에는 감사 또는 발행주식의 총수의 100분의 1 이상에 해당하는 주식을 가진 주주는 회사를 위하여 이사에 대하여 그 행위를 유지할 것을 청구할 수 있다. <개정 1984.4.10, 1998.12.28>","kind":"L"},{"id":"L:403","label":"법 제403조","title":"주주의 대표소송","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①발행주식의 총수의 100분의 1 이상에 해당하는 주식을 가진 주주는 회사에 대하여 이사의 책임을 추궁할 소의 제기를 청구할 수 있다. <개정 1998.12.28>\n②제1항의 청구는 그 이유를 기재한 서면으로 하여야 한다. <개정 1998.12.28>\n③회사가 전항의 청구를 받은 날로부터 30일내에 소를 제기하지 아니한 때에는 제1항의  주주는 즉시 회사를 위하여 소를 제기할 수 있다.\n④제3항의 기간의 경과로 인하여 회사에 회복할 수 없는 손해가 생길 염려가 있는 경우에는 전항의 규정에 불구하고 제1항의 주주는 즉시 소를 제기할 수 있다. <개정 1998.12.28>\n⑤제3항과 제4항의 소를 제기한 주주의 보유주식이 제소후 발행주식총수의 100분의 1 미만으로 감소한 경우(發行株式을 보유하지 아니하게 된 경우를 제외한다)에도 제소의 효력에는 영향이 없다. <신설 1998.12.28>\n⑥회사가 제1항의 청구에 따라 소를 제기하거나 주주가 제3항과 제4항의 소를 제기한 경우 당사자는 법원의 허가를 얻지 아니하고는 소의 취하, 청구의 포기ㆍ인락ㆍ화해를 할 수 없다. <신설 1998.12.28, 2011.4.14>\n⑦제176조제3항, 제4항과 제186조의 규정은 본조의 소에 준용한다.\n제403조(주주의 대표소송)","kind":"L"},{"id":"L:404","label":"법 제404조","title":"대표소송과 소송참가, 소송고지","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사는 전조제3항과 제4항의 소송에 참가할 수 있다.\n②전조제3항과 제4항의 소를 제기한 주주는 소를 제기한 후 지체없이 회사에 대하여 그 소송의 고지를 하여야 한다.\n제404조(대표소송과 소송참가, 소송고지)","kind":"L"},{"id":"L:405","label":"법 제405조","title":"제소주주의 권리의무","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①제403조제3항과 제4항의 규정에 의하여 소를 제기한 주주가 승소한 때에는 그 주주는 회사에 대하여 소송비용 및 그 밖에 소송으로 인하여 지출한 비용중 상당한 금액의 지급을 청구할 수 있다. 이 경우 소송비용을 지급한 회사는 이사 또는 감사에 대하여 구상권이 있다. <개정 1962.12.12, 2001.7.24>\n②제403조제3항과 제4항의 규정에 의하여 소를 제기한 주주가 패소한 때에는 악의인 경우 외에는 회사에 대하여 손해를 배상할 책임이 없다.\n제405조(제소주주의 권리의무)","kind":"L"},{"id":"L:406","label":"법 제406조","title":"대표소송과 재심의 소","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①제403조의 소가 제기된 경우에 원고와 피고의 공모로 인하여 소송의 목적인 회사의 권리를 사해할 목적으로써 판결을 하게 한 때에는 회사 또는 주주는 확정한 종국판결에 대하여 재심의 소를 제기할 수 있다.\n②전조의 규정은 전항의 소에 준용한다.\n제406조(대표소송과 재심의 소)","kind":"L"},{"id":"L:406-2","label":"법 제406조의2","title":"다중대표소송","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 모회사 발행주식총수의 100분의 1 이상에 해당하는 주식을 가진 주주는 자회사에 대하여 자회사 이사의 책임을 추궁할 소의 제기를 청구할 수 있다.\n② 제1항의 주주는 자회사가 제1항의 청구를 받은 날부터 30일 내에 소를 제기하지 아니한 때에는 즉시 자회사를 위하여 소를 제기할 수 있다.\n③ 제1항 및 제2항의 소에 관하여는 제176조제3항ㆍ제4항, 제403조제2항, 같은 조 제4항부터 제6항까지 및 제404조부터 제406조까지의 규정을 준용한다.\n④ 제1항의 청구를 한 후 모회사가 보유한 자회사의 주식이 자회사 발행주식총수의 100분의 50 이하로 감소한 경우(발행주식을 보유하지 아니하게 된 경우를 제외한다)에도 제1항 및 제2항에 따른 제소의 효력에는 영향이 없다.\n⑤ 제1항 및 제2항의 소는 자회사의 본점소재지의 지방법원의 관할에 전속한다.\n제406조의2(다중대표소송)","kind":"L"},{"id":"L:407","label":"법 제407조","title":"직무집행정지, 직무대행자선임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①이사선임결의의 무효나 취소 또는 이사해임의 소가 제기된 경우에는 법원은 당사자의 신청에 의하여 가처분으로써 이사의 직무집행을 정지할 수 있고 또는 직무대행자를 선임할 수 있다. 급박한 사정이 있는 때에는 본안소송의 제기전에도 그 처분을 할 수 있다.\n②법원은 당사자의 신청에 의하여 전항의 가처분을 변경 또는 취소할 수 있다.\n③ 제1항과 제2항의 처분이 있는 때에는 본점의 소재지에서 그 등기를 하여야 한다. <개정 2024.9.20>\n제407조(직무집행정지, 직무대행자선임)","kind":"L"},{"id":"L:408","label":"법 제408조","title":"직무대행자의 권한","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①전조의 직무대행자는 가처분명령에 다른 정함이 있는 경우 외에는 회사의 상무에 속하지 아니한 행위를 하지 못한다. 그러나 법원의 허가를 얻은 경우에는 그러하지 아니하다.\n②직무대행자가 전항의 규정에 위반한 행위를 한 경우에도 회사는 선의의 제3자에 대하여 책임을 진다.\n제408조(직무대행자의 권한)","kind":"L"},{"id":"L:408-2","label":"법 제408조의2","title":"집행임원 설치회사, 집행임원과 회사의 관계","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 회사는 집행임원을 둘 수 있다. 이 경우 집행임원을 둔 회사(이하 \"집행임원 설치회사\"라 한다)는 대표이사를 두지 못한다.\n② 집행임원 설치회사와 집행임원의 관계는 「민법」 중 위임에 관한 규정을 준용한다.\n③ 집행임원 설치회사의 이사회는 다음의 권한을 갖는다.\n1. 집행임원과 대표집행임원의 선임ㆍ해임\n2. 집행임원의 업무집행 감독\n3. 집행임원과 집행임원 설치회사의 소송에서 집행임원 설치회사를 대표할 자의 선임\n4. 집행임원에게 업무집행에 관한 의사결정의 위임(이 법에서 이사회 권한사항으로 정한 경우는 제외한다)\n5. 집행임원이 여러 명인 경우 집행임원의 직무 분담 및 지휘ㆍ명령관계, 그 밖에 집행임원의 상호관계에 관한 사항의 결정\n6. 정관에 규정이 없거나 주주총회의 승인이 없는 경우 집행임원의 보수 결정\n④ 집행임원 설치회사는 이사회의 회의를 주관하기 위하여 이사회 의장을 두어야 한다. 이 경우 이사회 의장은 정관의 규정이 없으면 이사회 결의로 선임한다.\n제408조의2(집행임원 설치회사, 집행임원과 회사의 관계)","kind":"L"},{"id":"L:408-3","label":"법 제408조의3","title":"집행임원의 임기","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 집행임원의 임기는 정관에 다른 규정이 없으면 2년을 초과하지 못한다.\n② 제1항의 임기는 정관에 그 임기 중의 최종 결산기에 관한 정기주주총회가 종결한 후 가장 먼저 소집하는 이사회의 종결 시까지로 정할 수 있다.\n제408조의3(집행임원의 임기)","kind":"L"},{"id":"L:408-4","label":"법 제408조의4","title":"집행임원의 권한","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"1. 집행임원 설치회사의 업무집행\n2. 정관이나 이사회의 결의에 의하여 위임받은 업무집행에 관한 의사결정\n제408조의4(집행임원의 권한) 집행임원의 권한은 다음 각 호의 사항으로 한다.","kind":"L"},{"id":"L:408-5","label":"법 제408조의5","title":"대표집행임원","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 2명 이상의 집행임원이 선임된 경우에는 이사회 결의로 집행임원 설치회사를 대표할 대표집행임원을 선임하여야 한다. 다만, 집행임원이 1명인 경우에는 그 집행임원이 대표집행임원이 된다.\n② 대표집행임원에 관하여는 이 법에 다른 규정이 없으면 주식회사의 대표이사에 관한 규정을 준용한다.\n③ 집행임원 설치회사에 대하여는 제395조를 준용한다.\n제408조의5(대표집행임원)","kind":"L"},{"id":"L:408-6","label":"법 제408조의6","title":"집행임원의 이사회에 대한 보고","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 집행임원은 3개월에 1회 이상 업무의 집행상황을 이사회에 보고하여야 한다.\n② 집행임원은 제1항의 경우 외에도 이사회의 요구가 있으면 언제든지 이사회에 출석하여 요구한 사항을 보고하여야 한다.\n③ 이사는 대표집행임원으로 하여금 다른 집행임원 또는 피용자의 업무에 관하여 이사회에 보고할 것을 요구할 수 있다.\n제408조의6(집행임원의 이사회에 대한 보고)","kind":"L"},{"id":"L:408-7","label":"법 제408조의7","title":"집행임원의 이사회 소집 청구","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 집행임원은 필요하면 회의의 목적사항과 소집이유를 적은 서면을 이사(소집권자가 있는 경우에는 소집권자를 말한다. 이하 이 조에서 같다)에게 제출하여 이사회 소집을 청구할 수 있다.\n② 제1항의 청구를 한 후 이사가 지체 없이 이사회 소집의 절차를 밟지 아니하면 소집을 청구한 집행임원은 법원의 허가를 받아 이사회를 소집할 수 있다. 이 경우 이사회 의장은 법원이 이해관계자의 청구에 의하여 또는 직권으로 선임할 수 있다.\n제408조의7(집행임원의 이사회 소집 청구)","kind":"L"},{"id":"L:408-8","label":"법 제408조의8","title":"집행임원의 책임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 집행임원이 고의 또는 과실로 법령이나 정관을 위반한 행위를 하거나 그 임무를 게을리한 경우에는 그 집행임원은 집행임원 설치회사에 손해를 배상할 책임이 있다.\n② 집행임원이 고의 또는 중대한 과실로 그 임무를 게을리한 경우에는 그 집행임원은 제3자에게 손해를 배상할 책임이 있다.\n③ 집행임원이 집행임원 설치회사 또는 제3자에게 손해를 배상할 책임이 있는 경우에 다른 집행임원ㆍ이사 또는 감사도 그 책임이 있으면 다른 집행임원ㆍ이사 또는 감사와 연대하여 배상할 책임이 있다.\n제408조의8(집행임원의 책임)","kind":"L"},{"id":"L:408-9","label":"법 제408조의9","title":"준용규정","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제408조의9(준용규정) 집행임원에 대해서는 제382조의3, 제382조의4, 제396조, 제397조, 제397조의2, 제398조, 제400조, 제401조의2, 제402조부터 제406조까지, 제406조의2, 제407조, 제408조, 제412조 및 제412조의2를 준용한다. <개정 2020.12.29>","kind":"L"},{"id":"L:409","label":"법 제409조","title":"선임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①감사는 주주총회에서 선임한다.\n②의결권없는 주식을 제외한 발행주식의 총수의 100분의 3(정관에서 더 낮은 주식 보유비율을 정할 수 있으며, 정관에서 더 낮은 주식 보유비율을 정한 경우에는 그 비율로 한다)을 초과하는 수의 주식을 가진 주주는 그 초과하는 주식에 관하여 제1항의 감사의 선임에 있어서는 의결권을 행사하지 못한다. <개정 1984.4.10, 2020.12.29>\n③ 회사가 제368조의4제1항에 따라 전자적 방법으로 의결권을 행사할 수 있도록 한 경우에는 제368조제1항에도 불구하고 출석한 주주의 의결권의 과반수로써 제1항에 따른 감사의 선임을 결의할 수 있다. <개정 2020.12.29>\n④ 제1항, 제296조제1항 및 제312조에도 불구하고 자본금의 총액이 10억원 미만인 회사의 경우에는 감사를 선임하지 아니할 수 있다. <신설 2009.5.28>\n⑤ 제4항에 따라 감사를 선임하지 아니한 회사가 이사에 대하여 또는 이사가 그 회사에 대하여 소를 제기하는 경우에 회사, 이사 또는 이해관계인은 법원에 회사를 대표할 자를 선임하여 줄 것을 신청하여야 한다. <신설 2009.5.28>\n⑥ 제4항에 따라 감사를 선임하지 아니한 경우에는 제412조, 제412조의2 및 제412조의5제1항ㆍ제2항 중 \"감사\"는 각각 \"주주총회\"로 본다. <신설 2009.5.28, 2011.4.14>\n제409조(선임)","kind":"L"},{"id":"L:409-2","label":"법 제409조의2","title":"감사의 해임에 관한 의견진술의 권리","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제409조의2(감사의 해임에 관한 의견진술의 권리) 감사는 주주총회에서 감사의 해임에 관하여 의견을 진술할 수 있다.","kind":"L"},{"id":"L:410","label":"법 제410조","title":"임기","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제410조(임기) 감사의 임기는 취임후 3년내의 최종의 결산기에 관한 정기총회의 종결시까지로 한다. <개정 1995.12.29>","kind":"L"},{"id":"L:411","label":"법 제411조","title":"겸임금지","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제411조(겸임금지) 감사는 회사 및 자회사의 이사 또는 지배인 기타의 사용인의 직무를 겸하지 못한다. <개정 1995.12.29>","kind":"L"},{"id":"L:412","label":"법 제412조","title":"감사의 직무와 보고요구, 조사의 권한","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①감사는 이사의 직무의 집행을 감사한다.\n②감사는 언제든지 이사에 대하여 영업에 관한 보고를 요구하거나 회사의 업무와 재산상태를 조사할 수 있다.\n③ 감사는 회사의 비용으로 전문가의 도움을 구할 수 있다. <신설 2011.4.14>\n제412조(감사의 직무와 보고요구, 조사의 권한)","kind":"L"},{"id":"L:412-2","label":"법 제412조의2","title":"이사의 보고의무","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제412조의2(이사의 보고의무) 이사는 회사에 현저하게 손해를 미칠 염려가 있는 사실을 발견한 때에는 즉시 감사에게 이를 보고하여야 한다.","kind":"L"},{"id":"L:412-3","label":"법 제412조의3","title":"총회의 소집청구","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①감사는 회의의 목적사항과 소집의 이유를 기재한 서면을 이사회에 제출하여 임시총회의 소집을 청구할 수 있다.\n②제366조제2항의 규정은 감사가 총회를 소집하는 경우에 이를 준용한다.\n제412조의3(총회의 소집청구)","kind":"L"},{"id":"L:412-4","label":"법 제412조의4","title":"감사의 이사회 소집 청구","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 감사는 필요하면 회의의 목적사항과 소집이유를 서면에 적어 이사(소집권자가 있는 경우에는 소집권자를 말한다. 이하 이 조에서 같다)에게 제출하여 이사회 소집을 청구할 수 있다.\n② 제1항의 청구를 하였는데도 이사가 지체 없이 이사회를 소집하지 아니하면 그 청구한 감사가 이사회를 소집할 수 있다.\n제412조의4(감사의 이사회 소집 청구)","kind":"L"},{"id":"L:412-5","label":"법 제412조의5","title":"자회사의 조사권","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①모회사의 감사는 그 직무를 수행하기 위하여 필요한 때에는 자회사에 대하여 영업의 보고를 요구할 수 있다.\n②모회사의 감사는 제1항의 경우에 자회사가 지체없이 보고를 하지 아니할 때 또는 그 보고의 내용을 확인할 필요가 있는 때에는 자회사의 업무와 재산상태를 조사할 수 있다.\n③자회사는 정당한 이유가 없는 한 제1항의 규정에 의한 보고 또는 제2항의 규정에 의한 조사를 거부하지 못한다.\n제412조의5(자회사의 조사권)","kind":"L"},{"id":"L:413","label":"법 제413조","title":"조사ㆍ보고의 의무","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제413조(조사ㆍ보고의 의무) 감사는 이사가 주주총회에 제출할 의안 및 서류를 조사하여 법령 또는 정관에 위반하거나 현저하게 부당한 사항이 있는지의 여부에 관하여 주주총회에 그 의견을 진술하여야 한다.","kind":"L"},{"id":"L:413-2","label":"법 제413조의2","title":"감사록의 작성","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①감사는 감사에 관하여 감사록을 작성하여야 한다.\n②감사록에는 감사의 실시요령과 그 결과를 기재하고 감사를 실시한 감사가 기명날인 또는 서명하여야 한다. <개정 1995.12.29>\n제413조의2(감사록의 작성)","kind":"L"},{"id":"L:414","label":"법 제414조","title":"감사의 책임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①감사가 그 임무를 해태한 때에는 그 감사는 회사에 대하여 연대하여 손해를 배상할 책임이 있다.\n②감사가 악의 또는 중대한 과실로 인하여 그 임무를 해태한 때에는 그 감사는 제3자에 대하여 연대하여 손해를 배상할 책임이 있다.\n③감사가 회사 또는 제3자에 대하여 손해를 배상할 책임이 있는 경우에 이사도 그 책임이 있는 때에는 그 감사와 이사는 연대하여 배상할 책임이 있다.\n제414조(감사의 책임)","kind":"L"},{"id":"L:415","label":"법 제415조","title":"준용규정","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제415조(준용규정) 제382조제2항, 제382조의4, 제385조, 제386조, 제388조, 제400조, 제401조, 제403조부터 제406조까지, 제406조의2 및 제407조는 감사에 준용한다. <개정 1984.4.10, 2001.7.24, 2020.12.29>","kind":"L"},{"id":"L:415-2","label":"법 제415조의2","title":"감사위원회","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사는 정관이 정한 바에 따라 감사에 갈음하여 제393조의2의 규정에 의한 위원회로서 감사위원회를 설치할 수 있다. 감사위원회를 설치한 경우에는 감사를 둘 수 없다.\n② 감사위원회는 제393조의2제3항에도 불구하고 3명 이상의 이사로 구성한다. 다만, 사외이사가 위원의 3분의 2 이상이어야 한다. <개정 2009.1.30>\n③감사위원회의 위원의 해임에 관한 이사회의 결의는 이사 총수의 3분의 2 이상의 결의로 하여야 한다.\n④감사위원회는 그 결의로 위원회를 대표할 자를 선정하여야 한다. 이 경우 수인의 위원이 공동으로 위원회를 대표할 것을 정할 수 있다.\n⑤감사위원회는 회사의 비용으로 전문가의 조력을 구할 수 있다.\n⑥ 감사위원회에 대하여는 제393조의2제4항 후단을 적용하지 아니 한다. <신설 2009.1.30>\n⑦제296조ㆍ제312조ㆍ제367조ㆍ제387조ㆍ제391조의2제2항ㆍ제394조제1항ㆍ제400조ㆍ제402조 내지 제407조ㆍ제412조 내지 제414조ㆍ제447조의3ㆍ제447조의4ㆍ제450조ㆍ제527조의4ㆍ제530조의5제1항제9호ㆍ제530조의6제1항제10호 및 제534조의 규정은 감사위원회에 관하여 이를 준용한다. 이 경우 제530조의5제1항제9호 및 제530조의6제1항제10호중 \"감사\"는 \"감사위원회 위원\"으로 본다. <개정 2009.1.30>\n제415조의2(감사위원회)","kind":"L"},{"id":"L:416","label":"법 제416조","title":"발행사항의 결정","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"1. 신주의 종류와 수\n2. 신주의 발행가액과 납입기일\n2의2. 무액면주식의 경우에는 신주의 발행가액 중 자본금으로 계상하는 금액\n3. 신주의 인수방법\n4. 현물출자를 하는 자의 성명과 그 목적인 재산의 종류, 수량, 가액과 이에 대하여 부여할 주식의 종류와 수\n5. 주주가 가지는 신주인수권을 양도할 수 있는 것에 관한 사항\n6. 주주의 청구가 있는 때에만 신주인수권증서를 발행한다는 것과 그 청구기간\n제416조(발행사항의 결정) 회사가 그 성립 후에 주식을 발행하는 경우에는 다음의 사항으로서 정관에 규정이 없는 것은 이사회가 결정한다. 다만, 이 법에 다른 규정이 있거나 정관으로 주주총회에서 결정하기로 정한 경우에는 그러하지 아니하다. <개정 1984.4.10, 2011.4.14>","kind":"L"},{"id":"L:417","label":"법 제417조","title":"액면미달의 발행","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사가 성립한 날로부터 2년을 경과한 후에 주식을 발행하는 경우에는 회사는 제434조의 규정에 의한 주주총회의 결의와 법원의 인가를 얻어서 주식을 액면미달의 가액으로 발행할 수 있다. <개정 1962.12.12>\n②전항의 주주총회의 결의에서는 주식의 최저발행가액을 정하여야 한다.\n③법원은 회사의 현황과 제반사정을 참작하여 최저발행가액을 변경하여 인가할 수 있다. 이 경우에 법원은 회사의 재산상태 기타 필요한 사항을 조사하게 하기 위하여 검사인을 선임할 수 있다.\n④제1항의 주식은 법원의 인가를 얻은 날로부터 1월내에 발행하여야 한다. 법원은 이 기간을 연장하여 인가할 수 있다.\n제417조(액면미달의 발행)","kind":"L"},{"id":"L:418","label":"법 제418조","title":"신주인수권의 내용 및 배정일의 지정ㆍ공고","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주주는 그가 가진 주식 수에 따라서 신주의 배정을 받을 권리가 있다. <개정 2001.7.24>\n②회사는 제1항의 규정에 불구하고 정관에 정하는 바에 따라 주주 외의 자에게 신주를 배정할 수 있다. 다만, 이 경우에는 신기술의 도입, 재무구조의 개선 등 회사의 경영상 목적을 달성하기 위하여 필요한 경우에 한한다. <신설 2001.7.24>\n③회사는 일정한 날을 정하여 그 날에 주주명부에 기재된 주주가 제1항의 권리를 가진다는 뜻과 신주인수권을 양도할 수 있을 경우에는 그 뜻을 그 날의 2주간전에 공고하여야 한다. 그러나 그 날이 제354조제1항의 기간 중인 때에는 그 기간의 초일의 2주간전에 이를 공고하여야 한다. <신설 1984.4.10>\n④ 제2항에 따라 주주 외의 자에게 신주를 배정하는 경우 회사는 제416조제1호, 제2호, 제2호의2, 제3호 및 제4호에서 정하는 사항을 그 납입기일의 2주 전까지 주주에게 통지하거나 공고하여야 한다. <신설 2011.4.14>\n제418조(신주인수권의 내용 및 배정일의 지정ㆍ공고)","kind":"L"},{"id":"L:419","label":"법 제419조","title":"신주인수권자에 대한 최고","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사는 신주의 인수권을 가진 자에 대하여 그 인수권을 가지는 주식의 종류 및 수와 일정한 기일까지 주식인수의 청약을 하지 아니하면 그 권리를 잃는다는 뜻을 통지하여야 한다. 이 경우 제416조제5호 및 제6호에 규정한 사항의 정함이 있는 때에는 그 내용도 통지하여야 한다.\n②제1항의 통지는 제1항의 기일의 2주간전에 이를 하여야 한다. <개정 2014.5.20>\n③제1항의 통지에도 불구하고 그 기일까지 주식인수의 청약을 하지 아니한 때에는 신주의 인수권을 가진 자는 그 권리를 잃는다. <개정 2014.5.20>\n제419조(신주인수권자에 대한 최고)","kind":"L"},{"id":"L:420","label":"법 제420조","title":"주식청약서","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"1. 제289조제1항제2호 내지 제4호에 게기한 사항\n2. 제302조제2항제7호ㆍ제9호 및 제10호에 게기한 사항\n3. 제416조제1호 내지 제4호에 게기한 사항\n4. 제417조에 따른 주식을 발행한 경우에는 그 발행조건과 미상각액(未償却額)\n5. 주주에 대한 신주인수권의 제한에 관한 사항 또는 특정한 제3자에게 이를 부여할 것을 정한 때에는 그 사항\n6. 주식발행의 결의연월일\n제420조(주식청약서) 이사는 주식청약서를 작성하여 다음의 사항을 적어야 한다. <개정 1984.4.10, 2011.4.14>","kind":"L"},{"id":"L:420-2","label":"법 제420조의2","title":"신주인수권증서의 발행","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①제416조제5호에 규정한 사항을 정한 경우에 회사는 동조제6호의 정함이 있는 때에는 그 정함에 따라, 그 정함이 없는 때에는 제419조제1항의 기일의 2주간전에 신주인수권증서를 발행하여야 한다.\n②신주인수권증서에는 다음 사항과 번호를 기재하고 이사가 기명날인 또는 서명하여야 한다. <개정 1995.12.29>\n1. 신주인수권증서라는 뜻의 표시\n2. 제420조에 규정한 사항\n3. 신주인수권의 목적인 주식의 종류와 수\n4. 일정기일까지 주식의 청약을 하지 아니할 때에는 그 권리를 잃는다는 뜻\n제420조의2(신주인수권증서의 발행)","kind":"L"},{"id":"L:420-3","label":"법 제420조의3","title":"신주인수권의 양도","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①신주인수권의 양도는 신주인수권증서의 교부에 의하여서만 이를 행한다.\n②제336조제2항 및 수표법 제21조의 규정은 신주인수권증서에 관하여 이를 준용한다.\n제420조의3(신주인수권의 양도)","kind":"L"},{"id":"L:420-4","label":"법 제420조의4","title":"신주인수권의 전자등록","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제420조의4(신주인수권의 전자등록) 회사는 신주인수권증서를 발행하는 대신 정관으로 정하는 바에 따라 전자등록기관의 전자등록부에 신주인수권을 등록할 수 있다. 이 경우 제356조의2제2항부터 제4항까지의 규정을 준용한다.","kind":"L"},{"id":"L:420-5","label":"법 제420조의5","title":"신주인수권증서에 의한 청약","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①신주인수권증서를 발행한 경우에는 신주인수권증서에 의하여 주식의 청약을 한다. 이 경우에는 제302조제1항의 규정을 준용한다.\n②신주인수권증서를 상실한 자는 주식청약서에 의하여 주식의 청약을 할 수 있다. 그러나 그 청약은 신주인수권증서에 의한 청약이 있는 때에는 그 효력을 잃는다.\n제420조의5(신주인수권증서에 의한 청약)","kind":"L"},{"id":"L:421","label":"법 제421조","title":"주식에 대한 납입","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 이사는 신주의 인수인으로 하여금 그 배정한 주수(株數)에 따라 납입기일에 그 인수한 주식에 대한 인수가액의 전액을 납입시켜야 한다.\n② 신주의 인수인은 회사의 동의 없이 제1항의 납입채무와 주식회사에 대한 채권을 상계할 수 없다.\n제421조(주식에 대한 납입)","kind":"L"},{"id":"L:422","label":"법 제422조","title":"현물출자의 검사","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①현물출자를 하는 자가 있는 경우에는 이사는 제416조제4호의 사항을 조사하게 하기 위하여 검사인의 선임을 법원에 청구하여야 한다. 이 경우 공인된 감정인의 감정으로 검사인의 조사에 갈음할 수 있다. <개정 1998.12.28>\n② 다음 각 호의 어느 하나에 해당할 경우에는 제1항을 적용하지 아니한다. <신설 2011.4.14>\n1. 제416조제4호의 현물출자의 목적인 재산의 가액이 자본금의 5분의 1을 초과하지 아니하고 대통령령으로 정한 금액을 초과하지 아니하는 경우\n2. 제416조제4호의 현물출자의 목적인 재산이 거래소의 시세 있는 유가증권인 경우 제416조 본문에 따라 결정된 가격이 대통령령으로 정한 방법으로 산정된 시세를 초과하지 아니하는 경우\n3. 변제기가 돌아온 회사에 대한 금전채권을 출자의 목적으로 하는 경우로서 그 가액이 회사장부에 적혀 있는 가액을 초과하지 아니하는 경우\n4. 그 밖에 제1호부터 제3호까지의 규정에 준하는 경우로서 대통령령으로 정하는 경우\n③법원은 검사인의 조사보고서 또는 감정인 감정결과를 심사하여 제1항의 사항을 부당하다고 인정한 때에는 이를 변경하여 이사와 현물출자를 한 자에게 통고할 수 있다. <개정 1998.12.28, 2011.4.14>\n④전항의 변경에 불복하는 현물출자를 한 자는 그 주식의 인수를 취소할 수 있다. <개정 2011.4.14>\n⑤법원의 통고가 있은 후 2주내에 주식의 인수를 취소한 현물출자를 한 자가 없는 때에는 제1항의 사항은 통고에 따라 변경된 것으로 본다. <개정 1998.12.28, 2011.4.14>\n제422조(현물출자의 검사)","kind":"L"},{"id":"L:423","label":"법 제423조","title":"주주가 되는 시기, 납입해태의 효과","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①신주의 인수인은 납입 또는 현물출자의 이행을 한 때에는 납입기일의 다음 날로부터 주주의 권리의무가 있다. <개정 1984.4.10, 1995.12.29, 2020.12.29>\n②신주의 인수인이 납입기일에 납입 또는 현물출자의 이행을 하지 아니한 때에는 그 권리를 잃는다.\n③제2항의 규정은 신주의 인수인에 대한 손해배상의 청구에 영향을 미치지 아니한다. <개정 1984.4.10>\n제423조(주주가 되는 시기, 납입해태의 효과)","kind":"L"},{"id":"L:424","label":"법 제424조","title":"유지청구권","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제424조(유지청구권) 회사가 법령 또는 정관에 위반하거나 현저하게 불공정한 방법에 의하여 주식을 발행함으로써 주주가 불이익을 받을 염려가 있는 경우에는 그 주주는 회사에 대하여 그 발행을 유지할 것을 청구할 수 있다.","kind":"L"},{"id":"L:424-2","label":"법 제424조의2","title":"불공정한 가액으로 주식을 인수한 자의 책임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①이사와 통모하여 현저하게 불공정한 발행가액으로 주식을 인수한 자는 회사에 대하여 공정한 발행가액과의 차액에 상당한 금액을 지급할 의무가 있다.\n②제403조 내지 제406조의 규정은 제1항의 지급을 청구하는 소에 관하여 이를 준용한다.\n③제1항 및 제2항의 규정은 이사의 회사 또는 주주에 대한 손해배상의 책임에 영향을 미치지 아니한다.\n제424조의2(불공정한 가액으로 주식을 인수한 자의 책임)","kind":"L"},{"id":"L:425","label":"법 제425조","title":"준용규정","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①제302조제1항, 제3항, 제303조, 제305조제2항, 제3항, 제306조, 제318조와 제319조의 규정은 신주의 발행에 준용한다.\n②제305조제2항의 규정은 신주인수권증서를 발행하는 경우에 이를 준용한다. <신설 1984.4.10>\n제425조(준용규정)","kind":"L"},{"id":"L:426","label":"법 제426조","title":"미상각액의 등기","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제426조(미상각액의 등기) 제417조에 따른 주식을 발행한 경우에 주식의 발행에 따른 변경등기에는 미상각액을 등기하여야 한다.","kind":"L"},{"id":"L:427","label":"법 제427조","title":"인수의 무효주장, 취소의 제한","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제427조(인수의 무효주장, 취소의 제한) 신주의 발행으로 인한 변경등기를 한 날로부터 1년을 경과한 후에는 신주를 인수한 자는 주식청약서 또는 신주인수권증서의 요건의 흠결을 이유로 하여 그 인수의 무효를 주장하거나 사기, 강박 또는 착오를 이유로 하여 그 인수를 취소하지 못한다. 그 주식에 대하여 주주의 권리를 행사한 때에도 같다. <개정 1962.12.12, 1984.4.10>","kind":"L"},{"id":"L:428","label":"법 제428조","title":"이사의 인수담보책임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①신주의 발행으로 인한 변경등기가 있은 후에 아직 인수하지 아니한 주식이 있거나 주식인수의 청약이 취소된 때에는 이사가 이를 공동으로 인수한 것으로 본다.\n②전항의 규정은 이사에 대한 손해배상의 청구에 영향을 미치지 아니한다.\n제428조(이사의 인수담보책임)","kind":"L"},{"id":"L:429","label":"법 제429조","title":"신주발행무효의 소","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제429조(신주발행무효의 소) 신주발행의 무효는 주주ㆍ이사 또는 감사에 한하여 신주를 발행한 날로부터 6월내에 소만으로 이를 주장할 수 있다. <개정 1984.4.10>","kind":"L"},{"id":"L:430","label":"법 제430조","title":"준용규정","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제430조(준용규정) 제186조 내지 제189조ㆍ제190조 본문ㆍ제191조ㆍ제192조 및 제377조의 규정은 제429조의 소에 관하여 이를 준용한다.","kind":"L"},{"id":"L:431","label":"법 제431조","title":"신주발행무효판결의 효력","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①신주발행무효의 판결이 확정된 때에는 신주는 장래에 대하여 그 효력을 잃는다.\n②전항의 경우에는 회사는 지체없이 그 뜻과 일정한 기간내에 신주의 주권을 회사에 제출할 것을 공고하고 주주명부에 기재된 주주와 질권자에 대하여는 각별로 그 통지를 하여야 한다. 그러나 그 기간은 3월 이상으로 하여야 한다.\n제431조(신주발행무효판결의 효력)","kind":"L"},{"id":"L:432","label":"법 제432조","title":"무효판결과 주주에의 환급","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①신주발행무효의 판결이 확정된 때에는 회사는 신주의 주주에 대하여 그 납입한 금액을 반환하여야 한다.\n②전항의 금액이 전조제1항의 판결확정시의 회사의 재산상태에 비추어 현저하게 부당한 때에는 법원은 회사 또는 전항의 주주의 청구에 의하여 그 금액의 증감을 명할 수 있다.\n③제339조와 제340조제1항, 제2항의 규정은 제1항의 경우에 준용한다.\n제432조(무효판결과 주주에의 환급)","kind":"L"},{"id":"L:433","label":"법 제433조","title":"정관변경의 방법","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①정관의 변경은 주주총회의 결의에 의하여야 한다.\n②정관의 변경에 관한 의안의 요령은 제363조에 따른 통지에 기재하여야 한다. <개정 2014.5.20>\n제433조(정관변경의 방법)","kind":"L"},{"id":"L:434","label":"법 제434조","title":"정관변경의 특별결의","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제434조(정관변경의 특별결의) 제433조제1항의 결의는 출석한 주주의 의결권의 3분의 2 이상의 수와 발행주식총수의 3분의 1 이상의 수로써 하여야 한다.","kind":"L"},{"id":"L:435","label":"법 제435조","title":"종류주주총회","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 회사가 종류주식을 발행한 경우에 정관을 변경함으로써 어느 종류주식의 주주에게 손해를 미치게 될 때에는 주주총회의 결의 외에 그 종류주식의 주주의 총회의 결의가 있어야 한다. <개정 2011.4.14>\n②제1항의 결의는 출석한 주주의 의결권의 3분의 2 이상의 수와 그 종류의 발행주식총수의 3분의 1 이상의 수로써 하여야 한다. <개정 1995.12.29>\n③주주총회에 관한 규정은 의결권없는 종류의 주식에 관한 것을 제외하고 제1항의 총회에 준용한다.\n제435조(종류주주총회)","kind":"L"},{"id":"L:436","label":"법 제436조","title":"준용규정","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제436조(준용규정) 제344조제3항에 따라 주식의 종류에 따라 특수하게 정하는 경우와 회사의 분할 또는 분할합병, 주식교환, 주식이전 및 회사의 합병으로 인하여 어느 종류의 주주에게 손해를 미치게 될 경우에는 제435조를 준용한다.","kind":"L"},{"id":"L:437","label":"법 제437조","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제437조 삭제 <1995.12.29>","kind":"L"},{"id":"L:438","label":"법 제438조","title":"자본금 감소의 결의","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 자본금의 감소에는 제434조에 따른 결의가 있어야 한다.\n② 제1항에도 불구하고 결손의 보전(補塡)을 위한 자본금의 감소는 제368조제1항의 결의에 의한다.\n③ 자본금의 감소에 관한 의안의 주요내용은 제363조에 따른 통지에 적어야 한다. <개정 2014.5.20>\n제438조(자본금 감소의 결의)","kind":"L"},{"id":"L:439","label":"법 제439조","title":"자본금 감소의 방법, 절차","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 자본금 감소의 결의에서는 그 감소의 방법을 정하여야 한다.\n② 자본금 감소의 경우에는 제232조를 준용한다. 다만, 결손의 보전을 위하여 자본금을 감소하는 경우에는 그러하지 아니하다.\n③ 사채권자가 이의를 제기하려면 사채권자집회의 결의가 있어야 한다. 이 경우에는 법원은 이해관계인의 청구에 의하여 사채권자를 위하여 이의 제기 기간을 연장할 수 있다.\n제439조(자본금 감소의 방법, 절차)","kind":"L"},{"id":"L:440","label":"법 제440조","title":"주식병합의 절차","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제440조(주식병합의 절차) 주식을 병합할 경우에는 회사는 1월 이상의 기간을 정하여 그 뜻과 그 기간 내에 주권을 회사에 제출할 것을 공고하고 주주명부에 기재된 주주와 질권자에 대하여는 각별로 그 통지를 하여야 한다. <개정 1995.12.29>","kind":"L"},{"id":"L:441","label":"법 제441조","title":"동전","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제441조(동전) 주식의 병합은 전조의 기간이 만료한 때에 그 효력이 생긴다. 그러나 제232조의 규정에 의한 절차가 종료하지 아니한 때에는 그 종료한 때에 효력이 생긴다.","kind":"L"},{"id":"L:442","label":"법 제442조","title":"신주권의 교부","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주식을 병합하는 경우에 구주권을 회사에 제출할 수 없는 자가 있는 때에는 회사는 그 자의 청구에 의하여 3월 이상의 기간을 정하고 이해관계인에 대하여 그 주권에 대한 이의가 있으면 그 기간 내에 제출할 뜻을 공고하고 그 기간이 경과한 후에 신주권을 청구자에게 교부할 수 있다.\n②전항의 공고의 비용은 청구자의 부담으로 한다.\n제442조(신주권의 교부)","kind":"L"},{"id":"L:443","label":"법 제443조","title":"단주의 처리","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①병합에 적당하지 아니한 수의 주식이 있는 때에는 그 병합에 적당하지 아니한 부분에 대하여 발행한 신주를 경매하여 각 주수에 따라 그 대금을 종전의 주주에게 지급하여야 한다. 그러나 거래소의 시세있는 주식은 거래소를 통하여 매각하고, 거래소의 시세없는 주식은 법원의 허가를 받아 경매외의 방법으로 매각할 수 있다. <개정 1984.4.10>\n②제442조의 규정은 제1항의 경우에 준용한다. <개정 1984.4.10>\n제443조(단주의 처리)","kind":"L"},{"id":"L:444","label":"법 제444조","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제444조 삭제 <2014.5.20>","kind":"L"},{"id":"L:445","label":"법 제445조","title":"감자무효의 소","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제445조(감자무효의 소) 자본금 감소의 무효는 주주ㆍ이사ㆍ감사ㆍ청산인ㆍ파산관재인 또는 자본금의 감소를 승인하지 아니한 채권자만이 자본금 감소로 인한 변경등기가 된 날부터 6개월 내에 소(訴)만으로 주장할 수 있다.","kind":"L"},{"id":"L:446","label":"법 제446조","title":"준용규정","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제446조(준용규정) 제186조 내지 제189조ㆍ제190조 본문ㆍ제191조ㆍ제192조 및 제377조의 규정은 제445조의 소에 관하여 이를 준용한다.","kind":"L"},{"id":"L:446-2","label":"법 제446조의2","title":"회계의 원칙","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제446조의2(회계의 원칙) 회사의 회계는 이 법과 대통령령으로 규정한 것을 제외하고는 일반적으로 공정하고 타당한 회계관행에 따른다.","kind":"L"},{"id":"L:447","label":"법 제447조","title":"재무제표의 작성","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 이사는 결산기마다 다음 각 호의 서류와 그 부속명세서를 작성하여 이사회의 승인을 받아야 한다.\n1. 대차대조표\n2. 손익계산서\n3. 그 밖에 회사의 재무상태와 경영성과를 표시하는 것으로서 대통령령으로 정하는 서류\n② 대통령령으로 정하는 회사의 이사는 연결재무제표(聯結財務諸表)를 작성하여 이사회의 승인을 받아야 한다.\n제447조(재무제표의 작성)","kind":"L"},{"id":"L:447-2","label":"법 제447조의2","title":"영업보고서의 작성","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①이사는 매결산기에 영업보고서를 작성하여 이사회의 승인을 얻어야 한다.\n②영업보고서에는 대통령령이 정하는 바에 의하여 영업에 관한 중요한 사항을 기재하여야 한다.\n제447조의2(영업보고서의 작성)","kind":"L"},{"id":"L:447-3","label":"법 제447조의3","title":"재무제표등의 제출","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제447조의3(재무제표등의 제출) 이사는 정기총회회일의 6주간전에 제447조 및 제447조의2의 서류를 감사에게 제출하여야 한다.","kind":"L"},{"id":"L:447-4","label":"법 제447조의4","title":"감사보고서","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 감사는 제447조의3의 서류를 받은 날부터 4주 내에 감사보고서를 이사에게 제출하여야 한다.\n② 제1항의 감사보고서에는 다음 각 호의 사항을 적어야 한다.\n1. 감사방법의 개요\n2. 회계장부에 기재될 사항이 기재되지 아니하거나 부실기재된 경우 또는 대차대조표나 손익계산서의 기재 내용이 회계장부와 맞지 아니하는 경우에는 그 뜻\n3. 대차대조표 및 손익계산서가 법령과 정관에 따라 회사의 재무상태와 경영성과를 적정하게 표시하고 있는 경우에는 그 뜻\n4. 대차대조표 또는 손익계산서가 법령이나 정관을 위반하여 회사의 재무상태와 경영성과를 적정하게 표시하지 아니하는 경우에는 그 뜻과 이유\n5. 대차대조표 또는 손익계산서의 작성에 관한 회계방침의 변경이 타당한지 여부와 그 이유\n6. 영업보고서가 법령과 정관에 따라 회사의 상황을 적정하게 표시하고 있는지 여부\n7. 이익잉여금의 처분 또는 결손금의 처리가 법령 또는 정관에 맞는지 여부\n8. 이익잉여금의 처분 또는 결손금의 처리가 회사의 재무상태나 그 밖의 사정에 비추어 현저하게 부당한 경우에는 그 뜻\n9. 제447조의 부속명세서에 기재할 사항이 기재되지 아니하거나 부실기재된 경우 또는 회계장부ㆍ대차대조표ㆍ손익계산서나 영업보고서의 기재 내용과 맞지 아니하게 기재된 경우에는 그 뜻\n10. 이사의 직무수행에 관하여 부정한 행위 또는 법령이나 정관의 규정을 위반하는 중대한 사실이 있는 경우에는 그 사실\n③ 감사가 감사를 하기 위하여 필요한 조사를 할 수 없었던 경우에는 감사보고서에 그 뜻과 이유를 적어야 한다.\n제447조의4(감사보고서)","kind":"L"},{"id":"L:448","label":"법 제448조","title":"재무제표 등의 비치ㆍ공시","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①이사는 정기총회회일의 1주간전부터 제447조 및 제447조의2의 서류와 감사보고서를 본점에 5년간, 그 등본을 지점에 3년간 비치하여야 한다. <개정 1962.12.12, 1984.4.10>\n②주주와 회사채권자는 영업시간내에 언제든지 제1항의 비치서류를 열람할 수 있으며 회사가 정한 비용을 지급하고 그 서류의 등본이나 초본의 교부를 청구할 수 있다. <개정 1984.4.10>\n제448조(재무제표 등의 비치ㆍ공시)","kind":"L"},{"id":"L:449","label":"법 제449조","title":"재무제표 등의 승인ㆍ공고","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 이사는 제447조의 각 서류를 정기총회에 제출하여 그 승인을 요구하여야 한다. <개정 2011.4.14>\n②이사는 제447조의2의 서류를 정기총회에 제출하여 그 내용을 보고하여야 한다. <신설 1984.4.10>\n③이사는 제1항의 서류에 대한 총회의 승인을 얻은 때에는 지체없이 대차대조표를 공고하여야 한다. <개정 1984.4.10>\n제449조(재무제표 등의 승인ㆍ공고)","kind":"L"},{"id":"L:449-2","label":"법 제449조의2","title":"재무제표 등의 승인에 대한 특칙","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 제449조에도 불구하고 회사는 정관으로 정하는 바에 따라 제447조의 각 서류를 이사회의 결의로 승인할 수 있다. 다만, 이 경우에는 다음 각 호의 요건을 모두 충족하여야 한다.\n1. 제447조의 각 서류가 법령 및 정관에 따라 회사의 재무상태 및 경영성과를 적정하게 표시하고 있다는 외부감사인의 의견이 있을 것\n2. 감사(감사위원회 설치회사의 경우에는 감사위원을 말한다) 전원의 동의가 있을 것\n② 제1항에 따라 이사회가 승인한 경우에는 이사는 제447조의 각 서류의 내용을 주주총회에 보고하여야 한다.\n제449조의2(재무제표 등의 승인에 대한 특칙)","kind":"L"},{"id":"L:450","label":"법 제450조","title":"이사, 감사의 책임해제","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제450조(이사, 감사의 책임해제) 정기총회에서 전조제1항의 승인을 한 후 2년내에 다른 결의가 없으면 회사는 이사와 감사의 책임을 해제한 것으로 본다. 그러나 이사 또는 감사의 부정행위에 대하여는 그러하지 아니하다.","kind":"L"},{"id":"L:451","label":"법 제451조","title":"자본금","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 회사의 자본금은 이 법에서 달리 규정한 경우 외에는 발행주식의 액면총액으로 한다.\n② 회사가 무액면주식을 발행하는 경우 회사의 자본금은 주식 발행가액의 2분의 1 이상의 금액으로서 이사회(제416조 단서에서 정한 주식발행의 경우에는 주주총회를 말한다)에서 자본금으로 계상하기로 한 금액의 총액으로 한다. 이 경우 주식의 발행가액 중 자본금으로 계상하지 아니하는 금액은 자본준비금으로 계상하여야 한다.\n③ 회사의 자본금은 액면주식을 무액면주식으로 전환하거나 무액면주식을 액면주식으로 전환함으로써 변경할 수 없다.\n제451조(자본금)","kind":"L"},{"id":"L:452","label":"법 제452조","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제452조 삭제 <2011.4.14>","kind":"L"},{"id":"L:453","label":"법 제453조","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제453조 삭제 <2011.4.14>","kind":"L"},{"id":"L:453-2","label":"법 제453조의2","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제453조의2 삭제 <2011.4.14>","kind":"L"},{"id":"L:454","label":"법 제454조","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제454조 삭제 <2011.4.14>","kind":"L"},{"id":"L:455","label":"법 제455조","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제455조 삭제 <2011.4.14>","kind":"L"},{"id":"L:456","label":"법 제456조","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제456조 삭제 <2011.4.14>","kind":"L"},{"id":"L:457","label":"법 제457조","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제457조 삭제 <2011.4.14>","kind":"L"},{"id":"L:457-2","label":"법 제457조의2","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제457조의2 삭제 <2011.4.14>","kind":"L"},{"id":"L:458","label":"법 제458조","title":"이익준비금","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제458조(이익준비금) 회사는 그 자본금의 2분의 1이 될 때까지 매 결산기 이익배당액의 10분의 1 이상을 이익준비금으로 적립하여야 한다. 다만, 주식배당의 경우에는 그러하지 아니하다.","kind":"L"},{"id":"L:459","label":"법 제459조","title":"자본준비금","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 회사는 자본거래에서 발생한 잉여금을 대통령령으로 정하는 바에 따라 자본준비금으로 적립하여야 한다.\n② 합병이나 제530조의2에 따른 분할 또는 분할합병의 경우 소멸 또는 분할되는 회사의 이익준비금이나 그 밖의 법정준비금은 합병ㆍ분할ㆍ분할합병 후 존속되거나 새로 설립되는 회사가 승계할 수 있다.\n제459조(자본준비금)","kind":"L"},{"id":"L:460","label":"법 제460조","title":"법정준비금의 사용","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제460조(법정준비금의 사용) 제458조 및 제459조의 준비금은 자본금의 결손 보전에 충당하는 경우 외에는 처분하지 못한다.","kind":"L"},{"id":"L:461","label":"법 제461조","title":"준비금의 자본금 전입","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사는 이사회의 결의에 의하여 준비금의 전부 또는 일부를 자본금에 전입할 수 있다. 그러나 정관으로 주주총회에서 결정하기로 정한 경우에는 그러하지 아니하다. <개정 2011.4.14>\n②제1항의 경우에는 주주에 대하여 그가 가진 주식의 수에 따라 주식을 발행하여야 한다. 이 경우 1주에 미달하는 단수에 대하여는 제443조제1항의 규정을 준용한다.\n③제1항의 이사회의 결의가 있은 때에는 회사는 일정한 날을 정하여 그 날에 주주명부에 기재된 주주가 제2항의 신주의 주주가 된다는 뜻을 그 날의 2주간전에 공고하여야 한다. 그러나 그 날이 제354조제1항의 기간 중인 때에는 그 기간의 초일의 2주간전에 이를 공고하여야 한다.\n④제1항 단서의 경우에 주주는 주주총회의 결의가 있은 때로부터 제2항의 신주의 주주가 된다.\n⑤제3항 또는 제4항의 규정에 의하여 신주의 주주가 된 때에는 이사는 지체없이 신주를 받은 주주와 주주명부에 기재된 질권자에 대하여 그 주주가 받은 주식의 종류와 수를 통지하여야 한다. <개정 2014.5.20>\n⑥제339조의 규정은 제2항의 규정에 의하여 주식의 발행이 있는 경우에 이를 준용한다. <개정2020.12.29>\n제461조(준비금의 자본금 전입)","kind":"L"},{"id":"L:461-2","label":"법 제461조의2","title":"준비금의 감소","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제461조의2(준비금의 감소) 회사는 적립된 자본준비금 및 이익준비금의 총액이 자본금의 1.5배를 초과하는 경우에 주주총회의 결의에 따라 그 초과한 금액 범위에서 자본준비금과 이익준비금을 감액할 수 있다.","kind":"L"},{"id":"L:462","label":"법 제462조","title":"이익의 배당","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 회사는 대차대조표의 순자산액으로부터 다음의 금액을 공제한 액을 한도로 하여 이익배당을 할 수 있다.\n1. 자본금의 액\n2. 그 결산기까지 적립된 자본준비금과 이익준비금의 합계액\n3. 그 결산기에 적립하여야 할 이익준비금의 액\n4. 대통령령으로 정하는 미실현이익\n② 이익배당은 주주총회의 결의로 정한다. 다만, 제449조의2제1항에 따라 재무제표를 이사회가 승인하는 경우에는 이사회의 결의로 정한다.\n③ 제1항을 위반하여 이익을 배당한 경우에 회사채권자는 배당한 이익을 회사에 반환할 것을 청구할 수 있다.\n④ 제3항의 청구에 관한 소에 대하여는 제186조를 준용한다.\n제462조(이익의 배당)","kind":"L"},{"id":"L:462-2","label":"법 제462조의2","title":"주식배당","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사는 주주총회의 결의에 의하여 이익의 배당을 새로이 발행하는 주식으로써 할 수 있다. 그러나 주식에 의한 배당은 이익배당총액의 2분의 1에 상당하는 금액을 초과하지 못한다.\n②제1항의 배당은 주식의 권면액으로 하며, 회사가 종류주식을 발행한 때에는 각각 그와 같은 종류의 주식으로 할 수 있다. <개정 1995.12.29, 2011.4.14>\n③주식으로 배당할 이익의 금액중 주식의 권면액에 미달하는 단수가 있는 때에는 그 부분에 대하여는 제443조제1항의 규정을 준용한다. <개정 1995.12.29>\n④주식으로 배당을 받은 주주는 제1항의 결의가 있는 주주총회가 종결한 때부터 신주의 주주가 된다. <개정 1995.12.29, 2020.12.29>\n⑤이사는 제1항의 결의가 있는 때에는 지체없이 배당을 받을 주주와 주주명부에 기재된 질권자에게 그 주주가 받을 주식의 종류와 수를 통지하여야 한다. <개정 2014.5.20>\n⑥제340조제1항의 질권자의 권리는 제1항의 규정에 의한 주주가 받을 주식에 미친다. 이 경우 제340조제3항의 규정을 준용한다.\n제462조의2(주식배당)","kind":"L"},{"id":"L:462-3","label":"법 제462조의3","title":"중간배당","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①년 1회의 결산기를 정한 회사는 영업년도중 1회에 한하여 이사회의 결의로 일정한 날을 정하여 그 날의 주주에 대하여 이익을 배당(이하 이 條에서 \"中間配當\"이라 한다)할 수 있음을 정관으로 정할 수 있다. <개정 2011.4.14>\n②중간배당은 직전 결산기의 대차대조표상의 순자산액에서 다음 각호의 금액을 공제한 액을 한도로 한다. <개정 2001.7.24, 2011.4.14>\n1. 직전 결산기의 자본금의 액\n2. 직전 결산기까지 적립된 자본준비금과 이익준비금의 합계액\n3. 직전 결산기의 정기총회에서 이익으로 배당하거나 또는 지급하기로 정한 금액\n4. 중간배당에 따라 당해 결산기에 적립하여야 할 이익준비금\n③회사는 당해 결산기의 대차대조표상의 순자산액이 제462조제1항 각호의 금액의 합계액에 미치지 못할 우려가 있는 때에는 중간배당을 하여서는 아니된다. <개정 2001.7.24>\n④당해 결산기 대차대조표상의 순자산액이 제462조제1항 각호의 금액의 합계액에 미치지 못함에도 불구하고 중간배당을 한 경우 이사는 회사에 대하여 연대하여 그 차액(配當額이 그 差額보다 적을 경우에는 配當額)을 배상할 책임이 있다. 다만, 이사가 제3항의 우려가 없다고 판단함에 있어 주의를 게을리하지 아니하였음을 증명한 때에는 그러하지 아니하다. <개정 2001.7.24>\n⑤제340조제1항, 제344조제1항, 제354조제1항, 제458조, 제464조 및 제625조제3호의 규정의 적용에 관하여는 중간배당을 제462조제1항의 규정에 의한 이익의 배당으로 본다. <개정 2011.4.14, 2020.12.29>\n⑥제399조제2항ㆍ제3항 및 제400조의 규정은 제4항의 이사의 책임에 관하여, 제462조제3항 및 제4항은 제3항의 규정에 위반하여 중간배당을 한 경우에 이를 준용한다. <개정 2011.4.14>\n제462조의3(중간배당)","kind":"L"},{"id":"L:462-4","label":"법 제462조의4","title":"현물배당","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 회사는 정관으로 금전 외의 재산으로 배당을 할 수 있음을 정할 수 있다.\n② 제1항에 따라 배당을 결정한 회사는 다음 사항을 정할 수 있다.\n1. 주주가 배당되는 금전 외의 재산 대신 금전의 지급을 회사에 청구할 수 있도록 한 경우에는 그 금액 및 청구할 수 있는 기간\n2. 일정 수 미만의 주식을 보유한 주주에게 금전 외의 재산 대신 금전을 지급하기로 한 경우에는 그 일정 수 및 금액\n제462조의4(현물배당)","kind":"L"},{"id":"L:463","label":"법 제463조","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제463조 삭제 <2011.4.14>","kind":"L"},{"id":"L:464","label":"법 제464조","title":"이익배당의 기준","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제464조(이익배당의 기준) 이익배당은 각 주주가 가진 주식의 수에 따라 한다. 다만, 제344조제1항을 적용하는 경우에는 그러하지 아니하다.","kind":"L"},{"id":"L:464-2","label":"법 제464조의2","title":"이익배당의 지급시기","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 회사는 제464조에 따른 이익배당을 제462조제2항의 주주총회나 이사회의 결의 또는 제462조의3제1항의 결의를 한 날부터 1개월 내에 하여야 한다. 다만, 주주총회 또는 이사회에서 배당금의 지급시기를 따로 정한 경우에는 그러하지 아니하다. <개정 2011.4.14>\n②제1항의 배당금의 지급청구권은 5년간 이를 행사하지 아니하면 소멸시효가 완성한다.\n제464조의2(이익배당의 지급시기)","kind":"L"},{"id":"L:465","label":"법 제465조","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제465조 삭제 <1984.4.10>","kind":"L"},{"id":"L:466","label":"법 제466조","title":"주주의 회계장부열람권","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①발행주식의 총수의 100분의 3 이상에 해당하는 주식을 가진 주주는 이유를 붙인 서면으로 회계의 장부와 서류의 열람 또는 등사를 청구할 수 있다. <개정 1998.12.28>\n②회사는 제1항의 주주의 청구가 부당함을 증명하지 아니하면 이를 거부하지 못한다. <개정 1998.12.28>\n제466조(주주의 회계장부열람권)","kind":"L"},{"id":"L:467","label":"법 제467조","title":"회사의 업무, 재산상태의 검사","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사의 업무집행에 관하여 부정행위 또는 법령이나 정관에 위반한 중대한 사실이 있음을 의심할 사유가 있는 때에는 발행주식의 총수의 100분의 3 이상에 해당하는 주식을 가진 주주는 회사의 업무와 재산상태를 조사하게 하기 위하여 법원에 검사인의 선임을 청구할 수 있다. <개정 1998.12.28>\n②검사인은 그 조사의 결과를 법원에 보고하여야 한다.\n③법원은 제2항의 보고에 의하여 필요하다고 인정한 때에는 대표이사에게 주주총회의 소집을 명할 수 있다. 제310조제2항의 규정은 이 경우에 준용한다. <개정 1962.12.12, 1995.12.29>\n④이사와 감사는 지체없이 제3항의 규정에 의한 검사인의 보고서의 정확여부를 조사하여 이를 주주총회에 보고하여야 한다. <신설 1995.12.29>\n제467조(회사의 업무, 재산상태의 검사)","kind":"L"},{"id":"L:467-2","label":"법 제467조의2","title":"이익공여의 금지","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사는 누구에게든지 주주의 권리행사와 관련하여 재산상의 이익을 공여할 수 없다.\n②회사가 특정의 주주에 대하여 무상으로 재산상의 이익을 공여한 경우에는 주주의 권리행사와 관련하여 이를 공여한 것으로 추정한다. 회사가 특정의 주주에 대하여 유상으로 재산상의 이익을 공여한 경우에 있어서 회사가 얻은 이익이 공여한 이익에 비하여 현저하게 적은 때에도 또한 같다.\n③회사가 제1항의 규정에 위반하여 재산상의 이익을 공여한 때에는 그 이익을 공여받은 자는 이를 회사에 반환하여야 한다. 이 경우 회사에 대하여 대가를 지급한 것이 있는 때에는 그 반환을 받을 수 있다.\n④제403조 내지 제406조의 규정은 제3항의 이익의 반환을 청구하는 소에 대하여 이를 준용한다.\n제467조의2(이익공여의 금지)","kind":"L"},{"id":"L:468","label":"법 제468조","title":"사용인의 우선변제권","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제468조(사용인의 우선변제권) 신원보증금의 반환을 받을 채권 기타 회사와 사용인간의 고용관계로 인한 채권이 있는 자는 회사의 총재산에 대하여 우선변제를 받을 권리가 있다. 그러나 질권ㆍ저당권이나 「동산ㆍ채권 등의 담보에 관한 법률」에 따른 담보권에 우선하지 못한다. <개정 2010.6.10>","kind":"L"},{"id":"L:469","label":"법 제469조","title":"사채의 발행","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 회사는 이사회의 결의에 의하여 사채(社債)를 발행할 수 있다.\n② 제1항의 사채에는 다음 각 호의 사채를 포함한다.\n1. 이익배당에 참가할 수 있는 사채\n2. 주식이나 그 밖의 다른 유가증권으로 교환 또는 상환할 수 있는 사채\n3. 유가증권이나 통화 또는 그 밖에 대통령령으로 정하는 자산이나 지표 등의 변동과 연계하여 미리 정하여진 방법에 따라 상환 또는 지급금액이 결정되는 사채\n③ 제2항에 따라 발행하는 사채의 내용 및 발행 방법 등 발행에 필요한 구체적인 사항은 대통령령으로 정한다.\n④ 제1항에도 불구하고 정관으로 정하는 바에 따라 이사회는 대표이사에게 사채의 금액 및 종류를 정하여 1년을 초과하지 아니하는 기간 내에 사채를 발행할 것을 위임할 수 있다.\n제469조(사채의 발행)","kind":"L"},{"id":"L:470","label":"법 제470조","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제470조 삭제 <2011.4.14>","kind":"L"},{"id":"L:471","label":"법 제471조","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제471조 삭제 <2011.4.14>","kind":"L"},{"id":"L:472","label":"법 제472조","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제472조 삭제 <2011.4.14>","kind":"L"},{"id":"L:473","label":"법 제473조","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제473조 삭제 <2011.4.14>","kind":"L"},{"id":"L:474","label":"법 제474조","title":"공모발행, 사채청약서","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①사채의 모집에 응하고자 하는 자는 사채청약서 2통에 그 인수할 사채의 수와 주소를 기재하고 기명날인 또는 서명하여야 한다. <개정 1995.12.29>\n②사채청약서는 이사가 작성하고 다음의 사항을 적어야 한다. <개정 1984.4.10, 1995.12.29, 2011.4.14>\n1. 회사의 상호\n2. 자본금과 준비금의 총액\n3. 최종의 대차대조표에 의하여 회사에 현존하는 순재산액\n4. 사채의 총액\n5. 각 사채의 금액\n6. 사채발행의 가액 또는 그 최저가액\n7. 사채의 이율\n8. 사채의 상환과 이자지급의 방법과 기한\n9. 사채를 수회에 분납할 것을 정한 때에는 그 분납금액과 시기\n10. 채권을 기명식 또는 무기명식에 한한 때에는 그 뜻\n10의2. 채권을 발행하는 대신 전자등록기관의 전자등록부에 사채권자의 권리를 등록하는 때에는 그 뜻\n11. 전에 모집한 사채가 있는 때에는 그 상환하지 아니한 금액\n12. 삭제<2011.4.14>\n13. 사채모집의 위탁을 받은 회사가 있는 때에는 그 상호와 주소\n13의2. 사채관리회사가 있는 때에는 그 상호와 주소\n13의3. 사채관리회사가 사채권자집회결의에 의하지 아니하고 제484조제4항제2호의 행위를 할 수 있도록 정한 때에는 그 뜻\n14. 제13호의 위탁을 받은 회사가 그 모집액이 총액에 달하지 못한 경우에 그 잔액을 인수할 것을 약정한 때에는 그 뜻\n15. 명의개서대리인을 둔 때에는 그 성명ㆍ주소 및 영업소\n③사채발행의 최저가액을 정한 경우에는 응모자는 사채청약서에 응모가액을 기재하여야 한다.\n제474조(공모발행, 사채청약서)","kind":"L"},{"id":"L:475","label":"법 제475조","title":"총액인수의 방법","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제475조(총액인수의 방법) 전조의 규정은 계약에 의하여 사채의 총액을 인수하는 경우에는 이를 적용하지 아니한다. 사채모집의 위탁을 받은 회사가 사채의 일부를 인수하는 경우에는 그 일부에 대하여도 같다.","kind":"L"},{"id":"L:476","label":"법 제476조","title":"납입","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①사채의 모집이 완료한 때에는 이사는 지체없이 인수인에 대하여 각 사채의 전액 또는 제1회의 납입을 시켜야 한다.\n②사채모집의 위탁을 받은 회사는 그 명의로 위탁회사를 위하여 제474조제2항과 전항의 행위를 할 수 있다.\n제476조(납입)","kind":"L"},{"id":"L:477","label":"법 제477조","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제477조 삭제 <1984.4.10>","kind":"L"},{"id":"L:478","label":"법 제478조","title":"채권의 발행","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①채권은 사채전액의 납입이 완료한 후가 아니면 이를 발행하지 못한다.\n② 채권에는 다음의 사항을 적고 대표이사가 기명날인 또는 서명하여야 한다. <개정 2011.4.14>\n1. 채권의 번호\n2. 제474조제2항제1호ㆍ제4호ㆍ제5호ㆍ제7호ㆍ제8호ㆍ제10호ㆍ제13호ㆍ제13호의2 및 제13호의3에 규정된 사항\n③ 회사는 제1항의 채권(債券)을 발행하는 대신 정관으로 정하는 바에 따라 전자등록기관의 전자등록부에 채권(債權)을 등록할 수 있다. 이 경우 제356조의2제2항부터 제4항까지의 규정을 준용한다. <신설 2011.4.14>\n제478조(채권의 발행)","kind":"L"},{"id":"L:479","label":"법 제479조","title":"기명사채의 이전","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①기명사채의 이전은 취득자의 성명과 주소를 사채원부에 기재하고 그 성명을 채권에 기재하지 아니하면 회사 기타의 제3자에게 대항하지 못한다.\n②제337조제2항의 규정은 기명사채의 이전에 대하여 이를 준용한다. <신설 1984.4.10>\n제479조(기명사채의 이전)","kind":"L"},{"id":"L:480","label":"법 제480조","title":"기명식, 무기명식간의 전환","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제480조(기명식, 무기명식간의 전환) 사채권자는 언제든지 기명식의 채권을 무기명식으로, 무기명식의 채권을 기명식으로 할 것을 회사에 청구할 수 있다. 그러나 채권을 기명식 또는 무기명식에 한할 것으로 정한 때에는 그러하지 아니하다.","kind":"L"},{"id":"L:480-2","label":"법 제480조의2","title":"사채관리회사의 지정ㆍ위탁","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제480조의2(사채관리회사의 지정ㆍ위탁) 회사는 사채를 발행하는 경우에 사채관리회사를 정하여 변제의 수령, 채권의 보전, 그 밖에 사채의 관리를 위탁할 수 있다.","kind":"L"},{"id":"L:480-3","label":"법 제480조의3","title":"사채관리회사의 자격","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 은행, 신탁회사, 그 밖에 대통령령으로 정하는 자가 아니면 사채관리회사가 될 수 없다.\n② 사채의 인수인은 그 사채의 사채관리회사가 될 수 없다.\n③ 사채를 발행한 회사와 특수한 이해관계가 있는 자로서 대통령령으로 정하는 자는 사채관리회사가 될 수 없다.\n제480조의3(사채관리회사의 자격)","kind":"L"},{"id":"L:481","label":"법 제481조","title":"사채관리회사의 사임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제481조(사채관리회사의 사임) 사채관리회사는 사채를 발행한 회사와 사채권자집회의 동의를 받아 사임할 수 있다. 부득이한 사유가 있어 법원의 허가를 받은 경우에도 같다.","kind":"L"},{"id":"L:482","label":"법 제482조","title":"사채관리회사의 해임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제482조(사채관리회사의 해임) 사채관리회사가 그 사무를 처리하기에 적임이 아니거나 그 밖에 정당한 사유가 있을 때에는 법원은 사채를 발행하는 회사 또는 사채권자집회의 청구에 의하여 사채관리회사를 해임할 수 있다.","kind":"L"},{"id":"L:483","label":"법 제483조","title":"사채관리회사의 사무승계자","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 사채관리회사의 사임 또는 해임으로 인하여 사채관리회사가 없게 된 경우에는 사채를 발행한 회사는 그 사무를 승계할 사채관리회사를 정하여 사채권자를 위하여 사채 관리를 위탁하여야 한다. 이 경우 회사는 지체 없이 사채권자집회를 소집하여 동의를 받아야 한다. <개정 2011.4.14>\n②부득이한 사유가 있는 때에는 이해관계인은 사무승계자의 선임을 법원에 청구할 수 있다.\n제483조(사채관리회사의 사무승계자)","kind":"L"},{"id":"L:484","label":"법 제484조","title":"사채관리회사의 권한","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 사채관리회사는 사채권자를 위하여 사채에 관한 채권을 변제받거나 채권의 실현을 보전하기 위하여 필요한 재판상 또는 재판 외의 모든 행위를 할 수 있다.\n② 사채관리회사는 제1항의 변제를 받으면 지체 없이 그 뜻을 공고하고, 알고 있는 사채권자에게 통지하여야 한다.\n③ 제2항의 경우에 사채권자는 사채관리회사에 사채 상환액 및 이자 지급을 청구할 수 있다. 이 경우 사채권이 발행된 때에는 사채권과 상환하여 상환액지급청구를 하고, 이권(利券)과 상환하여 이자지급청구를 하여야 한다.\n④ 사채관리회사가 다음 각 호의 어느 하나에 해당하는 행위(사채에 관한 채권을 변제받거나 채권의 실현을 보전하기 위한 행위는 제외한다)를 하는 경우에는 사채권자집회의 결의에 의하여야 한다. 다만, 사채를 발행하는 회사는 제2호의 행위를 사채관리회사가 사채권자집회결의에 의하지 아니하고 할 수 있음을 정할 수 있다.\n1. 해당 사채 전부에 대한 지급의 유예, 그 채무의 불이행으로 발생한 책임의 면제 또는 화해\n2. 해당 사채 전부에 관한 소송행위 또는 채무자회생 및 파산에 관한 절차에 속하는 행위\n⑤ 사채관리회사가 제4항 단서에 따라 사채권자집회의 결의에 의하지 아니하고 제4항제2호의 행위를 한 때에는 지체 없이 그 뜻을 공고하고, 알고 있는 사채권자에게는 따로 통지하여야 한다.\n⑥ 제2항과 제5항의 공고는 사채를 발행한 회사가 하는 공고와 같은 방법으로 하여야 한다.\n⑦ 사채관리회사는 그 관리를 위탁받은 사채에 관하여 제1항 또는 제4항 각 호에서 정한 행위를 위하여 필요하면 법원의 허가를 받아 사채를 발행한 회사의 업무와 재산상태를 조사할 수 있다.\n제484조(사채관리회사의 권한)","kind":"L"},{"id":"L:484-2","label":"법 제484조의2","title":"사채관리회사의 의무 및 책임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 사채관리회사는 사채권자를 위하여 공평하고 성실하게 사채를 관리하여야 한다.\n② 사채관리회사는 사채권자에 대하여 선량한 관리자의 주의로 사채를 관리하여야 한다.\n③ 사채관리회사가 이 법이나 사채권자집회결의를 위반한 행위를 한 때에는 사채권자에 대하여 연대하여 이로 인하여 발생한 손해를 배상할 책임이 있다.\n제484조의2(사채관리회사의 의무 및 책임)","kind":"L"},{"id":"L:485","label":"법 제485조","title":"둘 이상의 사채관리회사가 있는 경우의 권한과 의무","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 사채관리회사가 둘 이상 있을 때에는 그 권한에 속하는 행위는 공동으로 하여야 한다.\n② 제1항의 경우에 사채관리회사가 제484조제1항의 변제를 받은 때에는 사채관리회사는 사채권자에 대하여 연대하여 변제액을 지급할 의무가 있다.\n제485조(둘 이상의 사채관리회사가 있는 경우의 권한과 의무)","kind":"L"},{"id":"L:486","label":"법 제486조","title":"이권흠결의 경우","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①이권있는 무기명식의 사채를 상환하는 경우에 이권이 흠결된 때에는 그 이권에 상당한 금액을 상환액으로부터 공제한다.\n②전항의 이권소지인은 언제든지 그 이권과 상환하여 공제액의 지급을 청구할 수 있다.\n제486조(이권흠결의 경우)","kind":"L"},{"id":"L:487","label":"법 제487조","title":"원리청구권의 시효","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①사채의 상환청구권은 10년간 행사하지 아니하면 소멸시효가 완성한다.\n②제484조제3항의 청구권도 전항과 같다.\n③사채의 이자와 전조제2항의 청구권은 5년간 행사하지 아니하면 소멸시효가 완성한다.\n제487조(원리청구권의 시효)","kind":"L"},{"id":"L:488","label":"법 제488조","title":"사채원부","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"1. 사채권자(무기명식 채권이 발행되어 있는 사채의 사채권자는 제외한다)의 성명과 주소\n2. 채권의 번호\n3. 제474조제2항제4호, 제5호, 제7호부터 제9호까지, 제13호, 제13호의2 및 제13호의3에 규정된 사항\n4. 각 사채의 납입금액과 납입연월일\n5. 채권의 발행연월일 또는 채권을 발행하는 대신 전자등록기관의 전자등록부에 사채권자의 권리를 등록하는 때에는 그 뜻\n6. 각 사채의 취득연월일\n7. 무기명식 채권을 발행한 때에는 그 종류, 수, 번호와 발행연월일\n제488조(사채원부) 회사는 사채원부를 작성하고 다음 각 호의 사항을 적어야 한다.","kind":"L"},{"id":"L:489","label":"법 제489조","title":"준용규정","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①제353조의 규정은 사채응모자 또는 사채권자에 대한 통지와 최고에 준용한다.\n②제333조의 규정은 사채가 수인의 공유에 속하는 경우에 준용한다.\n제489조(준용규정)","kind":"L"},{"id":"L:490","label":"법 제490조","title":"결의사항","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제490조(결의사항) 사채권자집회는 이 법에서 규정하고 있는 사항 및 사채권자의 이해관계가 있는 사항에 관하여 결의를 할 수 있다.","kind":"L"},{"id":"L:491","label":"법 제491조","title":"소집권자","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 사채권자집회는 사채를 발행한 회사 또는 사채관리회사가 소집한다. <개정 2011.4.14>\n② 사채의 종류별로 해당 종류의 사채 총액(상환받은 액은 제외한다)의 10분의 1 이상에 해당하는 사채를 가진 사채권자는 회의 목적인 사항과 소집 이유를 적은 서면 또는 전자문서를 사채를 발행한 회사 또는 사채관리회사에 제출하여 사채권자집회의 소집을 청구할 수 있다. <개정 2011.4.14>\n③제366조제2항의 규정은 전항의 경우에 준용한다.\n④무기명식의 채권을 가진 자는 그 채권을 공탁하지 아니하면 전2항의 권리를 행사하지 못한다.\n제491조(소집권자)","kind":"L"},{"id":"L:491-2","label":"법 제491조의2","title":"소집의 통지, 공고","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 제363조제1항 및 제2항은 사채권자집회를 소집할 경우에 이를 준용한다.\n② 제1항에도 불구하고 회사가 무기명식의 채권을 발행한 경우에는 주주총회일의 3주(자본금 총액이 10억원 미만인 회사는 2주) 전에 사채권자집회를 소집하는 뜻과 회의의 목적사항을 공고하여야 한다.\n제491조의2(소집의 통지, 공고)","kind":"L"},{"id":"L:492","label":"법 제492조","title":"의결권","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 각 사채권자는 그가 가지는 해당 종류의 사채 금액의 합계액(상환받은 액은 제외한다)에 따라 의결권을 가진다. <개정 2011.4.14>\n②무기명식의 채권을 가진 자는 회일로부터 1주간전에 채권을 공탁하지 아니하면 그 의결권을 행사하지 못한다.\n제492조(의결권)","kind":"L"},{"id":"L:493","label":"법 제493조","title":"사채발행회사 또는 사채관리회사 대표자의 출석 등","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 사채를 발행한 회사 또는 사채관리회사는 그 대표자를 사채권자집회에 출석하게 하거나 서면으로 의견을 제출할 수 있다. <개정 2011.4.14>\n②사채권자집회의 소집은 전항의 회사에 통지하여야 한다.\n③제363조제1항과 제2항의 규정은 전항의 통지에 준용한다.\n제493조(사채발행회사 또는 사채관리회사 대표자의 출석 등)","kind":"L"},{"id":"L:494","label":"법 제494조","title":"사채발행회사의 대표자의 출석청구","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제494조(사채발행회사의 대표자의 출석청구) 사채권자집회 또는 그 소집자는 필요있다고 인정하는 때에는 사채를 발행한 회사에 대하여 그 대표자의 출석을 청구할 수 있다.","kind":"L"},{"id":"L:495","label":"법 제495조","title":"결의의 방법","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①제434조의 규정은 사채권자집회의 결의에 준용한다.\n② 제481조부터 제483조까지 및 제494조의 동의 또는 청구는 제1항에도 불구하고 출석한 사채권자 의결권의 과반수로 결정할 수 있다. <개정 2011.4.14>\n③ 사채권자집회에 출석하지 아니한 사채권자는 서면에 의하여 의결권을 행사할 수 있다. <신설 2011.4.14>\n④ 서면에 의한 의결권행사는 의결권행사서면에 필요한 사항을 적어 사채권자집회 전일까지 의결권행사서면을 소집자에게 제출하여야 한다. <신설 2011.4.14>\n⑤ 제4항에 따라 서면에 의하여 행사한 의결권의 수는 출석한 의결권자의 의결권 수에 포함한다. <신설 2011.4.14>\n⑥ 사채권자집회에 대하여는 제368조의4를 준용한다. <신설 2011.4.14>\n제495조(결의의 방법)","kind":"L"},{"id":"L:496","label":"법 제496조","title":"결의의 인가의 청구","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제496조(결의의 인가의 청구) 사채권자집회의 소집자는 결의한 날로부터 1주간내에 결의의 인가를 법원에 청구하여야 한다.","kind":"L"},{"id":"L:497","label":"법 제497조","title":"결의의 불인가의 사유","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①법원은 다음의 경우에는 사채권자집회의 결의를 인가하지 못한다.\n1. 사채권자집회소집의 절차 또는 그 결의방법이 법령이나 사채모집의 계획서의 기재에 위반한 때\n2. 결의가 부당한 방법에 의하여 성립하게 된 때\n3. 결의가 현저하게 불공정한 때\n4. 결의가 사채권자의 일반의 이익에 반하는 때\n②전항제1호와 제2호의 경우에는 법원은 결의의 내용 기타 모든 사정을 참작하여 결의를 인가할 수 있다.\n제497조(결의의 불인가의 사유)","kind":"L"},{"id":"L:498","label":"법 제498조","title":"결의의 효력","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 사채권자집회의 결의는 법원의 인가를 받음으로써 그 효력이 생긴다. 다만, 그 종류의 사채권자 전원이 동의한 결의는 법원의 인가가 필요하지 아니하다.\n② 사채권자집회의 결의는 그 종류의 사채를 가진 모든 사채권자에게 그 효력이 있다.\n제498조(결의의 효력)","kind":"L"},{"id":"L:499","label":"법 제499조","title":"결의의 인가, 불인가의 공고","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제499조(결의의 인가, 불인가의 공고) 사채권자집회의 결의에 대하여 인가 또는 불인가의 결정이 있은 때에는 사채를 발행한 회사는 지체없이 그 뜻을 공고하여야 한다.","kind":"L"},{"id":"L:500","label":"법 제500조","title":"사채권자집회의 대표자","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 사채권자집회는 해당 종류의 사채 총액(상환받은 금액은 제외한다)의 500분의 1 이상을 가진 사채권자 중에서 1명 또는 여러 명의 대표자를 선임하여 그 결의할 사항의 결정을 위임할 수 있다. <개정 2011.4.14>\n②대표자가 수인인 때에는 전항의 결정은 그 과반수로 한다.\n제500조(사채권자집회의 대표자)","kind":"L"},{"id":"L:501","label":"법 제501조","title":"결의의 집행","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제501조(결의의 집행) 사채권자집회의 결의는 사채관리회사가 집행하고, 사채관리회사가 없는 때에는 제500조의 대표자가 집행한다. 다만, 사채권자집회의 결의로써 따로 집행자를 정한 때에는 그러하지 아니하다.","kind":"L"},{"id":"L:502","label":"법 제502조","title":"수인의 대표자, 집행자가 있는 경우","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제502조(수인의 대표자, 집행자가 있는 경우) 제485조제1항의 규정은 대표자나 집행자가 수인인 경우에 준용한다.","kind":"L"},{"id":"L:503","label":"법 제503조","title":"사채상환에 관한 결의의 집행","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제503조(사채상환에 관한 결의의 집행) 제484조, 제485조제2항과 제487조제2항의 규정은 대표자나 집행자가 사채의 상환에 관한 결의를 집행하는 경우에 준용한다.","kind":"L"},{"id":"L:504","label":"법 제504조","title":"대표자, 집행자의 해임 등","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제504조(대표자, 집행자의 해임 등) 사채권자집회는 언제든지 대표자나 집행자를 해임하거나 위임한 사항을 변경할 수 있다.","kind":"L"},{"id":"L:505","label":"법 제505조","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제505조 삭제 <2011.4.14>","kind":"L"},{"id":"L:506","label":"법 제506조","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제506조 삭제 <2011.4.14>","kind":"L"},{"id":"L:507","label":"법 제507조","title":"사채관리회사 등의 보수, 비용","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 사채관리회사, 대표자 또는 집행자에게 줄 보수와 그 사무 처리에 필요한 비용은 사채를 발행한 회사와의 계약에 약정된 경우 외에는 법원의 허가를 받아 사채를 발행한 회사로 하여금 부담하게 할 수 있다.\n② 사채관리회사, 대표자 또는 집행자는 사채에 관한 채권을 변제받은 금액에서 사채권자보다 우선하여 제1항의 보수와 비용을 변제받을 수 있다.\n제507조(사채관리회사 등의 보수, 비용)","kind":"L"},{"id":"L:508","label":"법 제508조","title":"사채권자집회의 비용","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①사채권자집회에 관한 비용은 사채를 발행한 회사가 부담한다.\n②제496조의 청구에 관한 비용은 회사가 부담한다. 그러나 법원은 이해관계인의 신청에 의하여 또는 직권으로 그 전부 또는 일부에 관하여 따로 부담자를 정할 수 있다.\n제508조(사채권자집회의 비용)","kind":"L"},{"id":"L:509","label":"법 제509조","title":"수종의 사채있는 경우의 사채권자집회","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제509조(수종의 사채있는 경우의 사채권자집회) 수종의 사채를 발행한 경우에는 사채권자집회는 각종의 사채에 관하여 이를 소집하여야 한다.","kind":"L"},{"id":"L:510","label":"법 제510조","title":"준용규정","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①제368조제2항ㆍ제3항, 제369조제2항 및 제371조부터 제373조까지의 규정은 사채권자집회에 준용한다. <개정 2014.5.20>\n②사채권자집회의 의사록은 사채를 발행한 회사가 그 본점에 비치하여야 한다.\n③ 사채관리회사와 사채권자는 영업시간 내에 언제든지 제2항의 의사록 열람을 청구할 수 있다. <개정 2011.4.14>\n제510조(준용규정)","kind":"L"},{"id":"L:511","label":"법 제511조","title":"사채관리회사에 의한 취소의 소","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 회사가 어느 사채권자에게 한 변제, 화해, 그 밖의 행위가 현저하게 불공정한 때에는 사채관리회사는 소(訴)만으로 그 행위의 취소를 청구할 수 있다. <개정 2011.4.14>\n② 제1항의 소는 사채관리회사가 취소의 원인인 사실을 안 때부터 6개월, 행위가 있은 때부터 1년 내에 제기하여야 한다. <개정 2011.4.14>\n③제186조와 민법 제406조제1항 단서 및 제407조의 규정은 제1항의 소에 준용한다.\n제511조(사채관리회사에 의한 취소의 소)","kind":"L"},{"id":"L:512","label":"법 제512조","title":"대표자등에 의한 취소의 소","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제512조(대표자등에 의한 취소의 소) 사채권자집회의 결의가 있는 때에는 대표자 또는 집행자도 전조제1항의 소를 제기할 수 있다. 그러나 행위가 있은 때로부터 1년내에 한한다.","kind":"L"},{"id":"L:513","label":"법 제513조","title":"전환사채의 발행","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사는 전환사채를 발행할 수 있다.\n②제1항의 경우에 다음의 사항으로서 정관에 규정이 없는 것은 이사회가 이를 결정한다. 그러나 정관으로 주주총회에서 이를 결정하기로 정한 경우에는 그러하지 아니하다.\n1. 전환사채의 총액\n2. 전환의 조건\n3. 전환으로 인하여 발행할 주식의 내용\n4. 전환을 청구할 수 있는 기간\n5. 주주에게 전환사채의 인수권을 준다는 뜻과 인수권의 목적인 전환사채의 액\n6. 주주외의 자에게 전환사채를 발행하는 것과 이에 대하여 발행할 전환사채의 액\n③주주외의 자에 대하여 전환사채를 발행하는 경우에 그 발행할 수 있는 전환사채의 액, 전환의 조건, 전환으로 인하여 발행할 주식의 내용과 전환을 청구할 수 있는 기간에 관하여 정관에 규정이 없으면 제434조의 결의로써 이를 정하여야 한다. 이 경우 제418조제2항 단서의 규정을 준용한다. <개정 2001.7.24>\n④제3항의 결의에 있어서 전환사채의 발행에 관한 의안의 요령은 제363조의 규정에 의한 통지에 기재하여야 한다. <개정 2014.5.20>\n제513조(전환사채의 발행)","kind":"L"},{"id":"L:513-2","label":"법 제513조의2","title":"전환사채의 인수권을 가진 주주의 권리","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①전환사채의 인수권을 가진 주주는 그가 가진 주식의 수에 따라서 전환사채의 배정을 받을 권리가 있다. 그러나 각 전환사채의 금액중 최저액에 미달하는 단수에 대하여는 그러하지 아니하다.\n②제418조제3항은 주주가 전환사채의 인수권을 가진 경우에 이를 준용한다. <개정 2011.4.14>\n제513조의2(전환사채의 인수권을 가진 주주의 권리)","kind":"L"},{"id":"L:513-3","label":"법 제513조의3","title":"전환사채의 인수권을 가진 주주에 대한 최고","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주주가 전환사채의 인수권을 가진 경우에는 각 주주에 대하여 그 인수권을 가지는 전환사채의 액, 발행가액, 전환의 조건, 전환으로 인하여 발행할 주식의 내용, 전환을 청구할 수 있는 기간과 일정한 기일까지 전환사채의 청약을 하지 아니하면 그 권리를 잃는다는 뜻을 통지하여야 한다.\n②제419조제2항 및 제3항의 규정은 제1항의 경우에 이를 준용한다. <개정 2014.5.20>\n제513조의3(전환사채의 인수권을 가진 주주에 대한 최고)","kind":"L"},{"id":"L:514","label":"법 제514조","title":"전환사채발행의 절차","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①전환사채에 관하여는 사채청약서, 채권과 사채원부에 다음의 사항을 기재하여야 한다. <개정 1995.12.29>\n1. 사채를 주식으로 전환할 수 있다는 뜻\n2. 전환의 조건\n3. 전환으로 인하여 발행할 주식의 내용\n4. 전환을 청구할 수 있는 기간\n5. 주식의 양도에 관하여 이사회의 승인을 얻도록 정한 때에는 그 규정\n② 삭제 <1984.4.10>\n제514조(전환사채발행의 절차)","kind":"L"},{"id":"L:514-2","label":"법 제514조의2","title":"전환사채의 등기","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사가 전환사채를 발행한 때에는 제476조의 규정에 의한 납입이 완료된 날로부터 2주간내에 본점의 소재지에서 전환사채의 등기를 하여야 한다. <개정 1995.12.29>\n②제1항의 규정에 의하여 등기할 사항은 다음 각호와 같다.\n1. 전환사채의 총액\n2. 각 전환사채의 금액\n3. 각 전환사채의 납입금액\n4. 제514조제1호 내지 제4호에 정한 사항\n③제183조의 규정은 제2항의 등기에 대하여 이를 준용한다.\n④외국에서 전환사채를 모집한 경우에 등기할 사항이 외국에서 생긴 때에는 등기기간은 그 통지가 도달한 날로부터 기산한다.\n제514조의2(전환사채의 등기)","kind":"L"},{"id":"L:515","label":"법 제515조","title":"전환의 청구","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①전환을 청구하는 자는 청구서 2통에 채권을 첨부하여 회사에 제출하여야 한다. 다만, 제478조제3항에 따라 채권(債券)을 발행하는 대신 전자등록기관의 전자등록부에 채권(債權)을 등록한 경우에는 그 채권을 증명할 수 있는 자료를 첨부하여 회사에 제출하여야 한다. <개정 2011.4.14>\n②제1항의 청구서에는 전환하고자 하는 사채와 청구의 연월일을 기재하고 기명날인 또는 서명하여야 한다. <개정 1995.12.29>\n제515조(전환의 청구)","kind":"L"},{"id":"L:516","label":"법 제516조","title":"준용규정","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①제346조제4항, 제424조 및 제424조의2의 규정은 전환사채의 발행의 경우에 이를 준용한다. <개정 2011.4.14>\n②제339조, 제348조, 제350조 및 제351조의 규정은 사채의 전환의 경우에 이를 준용한다. <개정 1995.12.29>\n제516조(준용규정)","kind":"L"},{"id":"L:516-2","label":"법 제516조의2","title":"신주인수권부사채의 발행","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사는 신주인수권부사채를 발행할 수 있다.\n②제1항의 경우에 다음의 사항으로서 정관에 규정이 없는 것은 이사회가 이를 결정한다. 그러나 정관으로 주주총회에서 이를 결정하도록 정한 경우에는 그러하지 아니하다. <개정 2011.4.14>\n1. 신주인수권부사채의 총액\n2. 각 신주인수권부사채에 부여된 신주인수권의 내용\n3. 신주인수권을 행사할 수 있는 기간\n4. 신주인수권만을 양도할 수 있는 것에 관한 사항\n5. 신주인수권을 행사하려는 자의 청구가 있는 때에는 신주인수권부사채의 상환에 갈음하여 그 발행가액으로 제516조의9제1항의 납입이 있는 것으로 본다는 뜻\n6. 삭제<1995.12.29>\n7. 주주에게 신주인수권부사채의 인수권을 준다는 뜻과 인수권의 목적인 신주인수권부사채의 액\n8. 주주외의 자에게 신주인수권부사채를 발행하는 것과 이에 대하여 발행할 신주인수권부사채의 액\n③각 신주인수권부사채에 부여된 신주인수권의 행사로 인하여 발행할 주식의 발행가액의 합계액은 각 신주인수권부사채의 금액을 초과할 수 없다.\n④주주외의 자에 대하여 신주인수권부사채를 발행하는 경우에 그 발행할 수 있는 신주인수권부사채의 액, 신주인수권의 내용과 신주인수권을 행사할 수 있는 기간에 관하여 정관에 규정이 없으면 제434조의 결의로써 이를 정하여야 한다. 이 경우 제418조제2항 단서의 규정을 준용한다. <개정 2001.7.24>\n⑤제513조제4항의 규정은 제4항의 경우에 이를 준용한다.\n제516조의2(신주인수권부사채의 발행)","kind":"L"},{"id":"L:516-3","label":"법 제516조의3","title":"신주인수권부사채의 인수권을 가진 주주에 대한 최고","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주주가 신주인수권부사채의 인수권을 가진 경우에는 각 주주에 대하여 인수권을 가지는 신주인수권부사채의 액, 발행가액, 신주인수권의 내용, 신주인수권을 행사할 수 있는 기간과 일정한 기일까지 신주인수권부사채의 청약을 하지 아니하면 그 권리를 잃는다는 뜻을 통지하여야 한다. 이 경우 제516조의2제2항제4호 또는 제5호에 규정한 사항의 정함이 있는 때에는 그 내용도 통지하여야 한다.\n②제419조제2항 및 제3항의 규정은 제1항의 경우에 이를 준용한다. <개정 2014.5.20>\n제516조의3(신주인수권부사채의 인수권을 가진 주주에 대한 최고)","kind":"L"},{"id":"L:516-4","label":"법 제516조의4","title":"사채청약서ㆍ채권ㆍ사채원부의 기재사항","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"1. 신주인수권부사채라는 뜻\n2. 제516조의2제2항제2호 내지 제5호에 정한 사항\n3. 제516조의9에 따라 납입을 맡을 은행이나 그 밖의 금융기관 및 납입장소\n4. 주식의 양도에 관하여 이사회의 승인을 얻도록 정한 때에는 그 규정\n제516조의4(사채청약서ㆍ채권ㆍ사채원부의 기재사항) 신주인수권부사채에 있어서는 사채청약서ㆍ채권 및 사채원부에 다음의 사항을 기재하여야 한다. 그러나 제516조의5제1항의 신주인수권증권을 발행할 때에는 채권에는 이를 기재하지 아니한다. <개정 1995.12.29, 2011.4.14>","kind":"L"},{"id":"L:516-5","label":"법 제516조의5","title":"신주인수권증권의 발행","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①제516조의2제2항제4호에 규정한 사항을 정한 경우에는 회사는 채권과 함께 신주인수권증권을 발행하여야 한다.\n②신주인수권증권에는 다음의 사항과 번호를 기재하고 이사가 기명날인 또는 서명하여야 한다. <개정 1995.12.29>\n1. 신주인수권증권이라는 뜻의 표시\n2. 회사의 상호\n3. 제516조의2제2항제2호ㆍ제3호 및 제5호에 정한 사항\n4. 제516조의4제3호에 정한 사항\n5. 주식의 양도에 관하여 이사회의 승인을 얻도록 정한 때에는 그 규정\n제516조의5(신주인수권증권의 발행)","kind":"L"},{"id":"L:516-6","label":"법 제516조의6","title":"신주인수권의 양도","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①신주인수권증권이 발행된 경우에 신주인수권의 양도는 신주인수권증권의 교부에 의하여서만 이를 행한다.\n②제336조제2항, 제360조 및 수표법 제21조의 규정은 신주인수권증권에 관하여 이를 준용한다.\n제516조의6(신주인수권의 양도)","kind":"L"},{"id":"L:516-7","label":"법 제516조의7","title":"신주인수권의 전자등록","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제516조의7(신주인수권의 전자등록) 회사는 신주인수권증권을 발행하는 대신 정관으로 정하는 바에 따라 전자등록기관의 전자등록부에 신주인수권을 등록할 수 있다. 이 경우 제356조의2제2항부터 제4항까지의 규정을 준용한다.","kind":"L"},{"id":"L:516-8","label":"법 제516조의8","title":"신주인수권부사채의 등기","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사가 신주인수권부사채를 발행한 때에는 다음의 사항을 등기하여야 한다.\n1. 신주인수권부사채라는 뜻\n2. 신주인수권의 행사로 인하여 발행할 주식의 발행가액의 총액\n3. 각 신주인수권부사채의 금액\n4. 각 신주인수권부사채의 납입금액\n5. 제516조의2제2항제1호 내지 제3호에 정한 사항\n②제514조의2제1항ㆍ제3항 및 제4항의 규정은 제1항의 등기에 관하여 이를 준용한다.\n제516조의8(신주인수권부사채의 등기)","kind":"L"},{"id":"L:516-9","label":"법 제516조의9","title":"신주인수권의 행사","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①신주인수권을 행사하려는 자는 청구서 2통을 회사에 제출하고, 신주의 발행가액의 전액을 납입하여야 한다.\n②제1항의 규정에 의하여 청구서를 제출하는 경우에 신주인수권증권이 발행된 때에는 신주인수권증권을 첨부하고, 이를 발행하지 아니한 때에는 채권을 제시하여야 한다. 다만, 제478조제3항 또는 제516조의7에 따라 채권(債券)이나 신주인수권증권을 발행하는 대신 전자등록기관의 전자등록부에 채권(債權)이나 신주인수권을 등록한 경우에는 그 채권이나 신주인수권을 증명할 수 있는 자료를 첨부하여 회사에 제출하여야 한다. <개정 2011.4.14>\n③제1항의 납입은 채권 또는 신주인수권증권에 기재한 은행 기타 금융기관의 납입장소에서 하여야 한다.\n④제302조제1항의 규정은 제1항의 청구서에, 제306조 및 제318조의 규정은 제3항의 납입을 맡은 은행 기타 금융기관에 이를 준용한다.\n제516조의9(신주인수권의 행사)","kind":"L"},{"id":"L:516-10","label":"법 제516조의10","title":"주주가 되는 시기","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제516조의10(주주가 되는 시기) 제516조의9제1항에 따라 신주인수권을 행사한 자는 동항의 납입을 한 때에 주주가 된다. 이 경우 제350조제2항을 준용한다. <개정 1995.12.29, 2011.4.14, 2020.12.29>","kind":"L"},{"id":"L:516-11","label":"법 제516조의11","title":"준용규정","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제516조의11(준용규정) 제351조의 규정은 신주인수권의 행사가 있는 경우에, 제513조의2 및 제516조제1항의 규정은 신주인수권부사채에 관하여 이를 준용한다. <개정 1995.12.29>","kind":"L"},{"id":"L:517","label":"법 제517조","title":"해산사유","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"1. 제227조제1호, 제4호 내지 제6호에 정한 사유\n1의2. 제530조의2의 규정에 의한 회사의 분할 또는 분할합병\n2. 주주총회의 결의\n제517조(해산사유) 주식회사는 다음의 사유로 인하여 해산한다. <개정 1998.12.28>","kind":"L"},{"id":"L:518","label":"법 제518조","title":"해산의 결의","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제518조(해산의 결의) 해산의 결의는 제434조의 규정에 의하여야 한다.","kind":"L"},{"id":"L:519","label":"법 제519조","title":"회사의 계속","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제519조(회사의 계속) 회사가 존립기간의 만료 기타 정관에 정한 사유의 발생 또는 주주총회의 결의에 의하여 해산한 경우에는 제434조의 규정에 의한 결의로 회사를 계속할 수 있다.","kind":"L"},{"id":"L:520","label":"법 제520조","title":"해산판결","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①다음의 경우에 부득이한 사유가 있는 때에는 발행주식의 총수의 100분의 10 이상에 해당하는 주식을 가진 주주는 회사의 해산을 법원에 청구할 수 있다.\n1. 회사의 업무가 현저한 정돈상태를 계속하여 회복할 수 없는 손해가 생긴 때 또는 생길 염려가 있는 때\n2. 회사재산의 관리 또는 처분의 현저한 실당으로 인하여 회사의 존립을 위태롭게 한 때\n②제186조와 제191조의 규정은 전항의 청구에 준용한다.\n제520조(해산판결)","kind":"L"},{"id":"L:520-2","label":"법 제520조의2","title":"휴면회사의 해산","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①법원행정처장이 최후의 등기후 5년을 경과한 회사는 본점의 소재지를 관할하는 법원에 아직 영업을 폐지하지 아니하였다는 뜻의 신고를 할 것을 관보로써 공고한 경우에, 그 공고한 날에 이미 최후의 등기후 5년을 경과한 회사로써 공고한 날로부터 2월 이내에 대통령령이 정하는 바에 의하여 신고를 하지 아니한 때에는 그 회사는 그 신고기간이 만료된 때에 해산한 것으로 본다. 그러나 그 기간내에 등기를 한 회사에 대하여는 그러하지 아니하다.\n②제1항의 공고가 있는 때에는 법원은 해당 회사에 대하여 그 공고가 있었다는 뜻의 통지를 발송하여야 한다.\n③제1항의 규정에 의하여 해산한 것으로 본 회사는 그 후 3년 이내에는 제434조의 결의에 의하여 회사를 계속할 수 있다.\n④제1항의 규정에 의하여 해산한 것으로 본 회사가 제3항의 규정에 의하여 회사를 계속하지 아니한 경우에는 그 회사는 그 3년이 경과한 때에 청산이 종결된 것으로 본다.\n제520조의2(휴면회사의 해산)","kind":"L"},{"id":"L:521","label":"법 제521조","title":"해산의 통지, 공고","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제521조(해산의 통지, 공고) 회사가 해산한 때에는 파산의 경우 외에는 이사는 지체없이 주주에 대하여 그 통지를 하여야 한다. <개정 2014.5.20>","kind":"L"},{"id":"L:521-2","label":"법 제521조의2","title":"준용규정","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제521조의2(준용규정) 제228조와 제229조제3항의 규정은 주식회사의 해산에 관하여 이를 준용한다.","kind":"L"},{"id":"L:522","label":"법 제522조","title":"합병계약서와 그 승인결의","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사가 합병을 함에는 합병계약서를 작성하여 주주총회의 승인을 얻어야 한다. <개정 1995.12.29, 1998ㆍ12ㆍ28>\n②합병계약의 요령은 제363조에 정한 통지에 기재하여야 한다. <개정 2014.5.20>\n③제1항의 승인결의는 제434조의 규정에 의하여야 한다. <개정 1998.12.28>\n제522조(합병계약서와 그 승인결의)","kind":"L"},{"id":"L:522-2","label":"법 제522조의2","title":"합병계약서 등의 공시","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①이사는 제522조제1항의 주주총회 회일의 2주 전부터 합병을 한 날 이후 6개월이 경과하는 날까지 다음 각 호의 서류를 본점에 비치하여야 한다. <개정 1998.12.28, 2015.12.1>\n1. 합병계약서\n2. 합병을 위하여 신주를 발행하거나 자기주식을 이전하는 경우에는 합병으로 인하여 소멸하는 회사의 주주에 대한 신주의 배정 또는 자기주식의 이전에 관하여 그 이유를 기재한 서면\n3.각 회사의 최종의 대차대조표와 손익계산서\n②주주 및 회사채권자는 영업시간내에는 언제든지 제1항 각호의 서류의 열람을 청구하거나, 회사가 정한 비용을 지급하고 그 등본 또는 초본의 교부를 청구할 수 있다. <개정 1998.12.28>\n제522조의2(합병계약서 등의 공시)","kind":"L"},{"id":"L:522-3","label":"법 제522조의3","title":"합병반대주주의 주식매수청구권","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 제522조제1항에 따른 결의사항에 관하여 이사회의 결의가 있는 때에 그 결의에 반대하는 주주(의결권이 없거나 제한되는 주주를 포함한다. 이하 이 조에서 같다)는 주주총회 전에 회사에 대하여 서면으로 그 결의에 반대하는 의사를 통지한 경우에는 그 총회의 결의일부터 20일 이내에 주식의 종류와 수를 기재한 서면으로 회사에 대하여 자기가 소유하고 있는 주식의 매수를 청구할 수 있다. <개정 2015.12.1>\n②제527조의2제2항의 공고 또는 통지를 한 날부터 2주내에 회사에 대하여 서면으로 합병에 반대하는 의사를 통지한 주주는 그 기간이 경과한 날부터 20일 이내에 주식의 종류와 수를 기재한 서면으로 회사에 대하여 자기가 소유하고 있는 주식의 매수를 청구할 수 있다. <신설 1998.12.28>\n제522조의3(합병반대주주의 주식매수청구권)","kind":"L"},{"id":"L:523","label":"법 제523조","title":"흡수합병의 합병계약서","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"1. 존속하는 회사가 합병으로 인하여 그 발행할 주식의 총수를 증가하는 때에는 그 증가할 주식의 총수, 종류와 수\n2. 존속하는 회사의 자본금 또는 준비금이 증가하는 경우에는 증가할 자본금 또는 준비금에 관한 사항\n3. 존속하는 회사가 합병을 하면서 신주를 발행하거나 자기주식을 이전하는 경우에는 발행하는 신주 또는 이전하는 자기주식의 총수, 종류와 수 및 합병으로 인하여 소멸하는 회사의 주주에 대한 신주의 배정 또는 자기주식의 이전에 관한 사항\n4. 존속하는 회사가 합병으로 소멸하는 회사의 주주에게 제3호에도 불구하고 그 대가의 전부 또는 일부로서 금전이나 그 밖의 재산을 제공하는 경우에는 그 내용 및 배정에 관한 사항\n5. 각 회사에서 합병의 승인결의를 할 사원 또는 주주의 총회의 기일\n6. 합병을 할 날\n7. 존속하는 회사가 합병으로 인하여 정관을 변경하기로 정한 때에는 그 규정\n8. 각 회사가 합병으로 이익배당을 할 때에는 그 한도액\n9. 합병으로 인하여 존속하는 회사에 취임할 이사와 감사 또는 감사위원회의 위원을 정한 때에는 그 성명 및 주민등록번호\n제523조(흡수합병의 합병계약서) 합병할 회사의 일방이 합병 후 존속하는 경우에는 합병계약서에 다음의 사항을 적어야 한다. <개정 1998.12.28, 2001.7.24, 2011.4.14, 2015.12.1>","kind":"L"},{"id":"L:523-2","label":"법 제523조의2","title":"합병대가가 모회사주식인 경우의 특칙","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①제342조의2에도 불구하고 제523조제4호에 따라 소멸하는 회사의 주주에게 제공하는 재산이 존속하는 회사의 모회사주식을 포함하는 경우에는 존속하는 회사는 그 지급을 위하여 모회사주식을 취득할 수 있다. <개정 2015.12.1>\n② 존속하는 회사는 제1항에 따라 취득한 모회사의 주식을 합병 후에도 계속 보유하고 있는 경우 합병의 효력이 발생하는 날부터 6개월 이내에 그 주식을 처분하여야 한다. <신설 2015.12.1>\n제523조의2(합병대가가 모회사주식인 경우의 특칙)","kind":"L"},{"id":"L:524","label":"법 제524조","title":"신설합병의 합병계약서","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"1. 설립되는 회사에 대하여 제289조제1항제1호부터 제4호까지에 규정된 사항과 종류주식을 발행할 때에는 그 종류, 수와 본점소재지\n2. 설립되는 회사가 합병당시에 발행하는 주식의 총수와 종류, 수 및 각 회사의 주주에 대한 주식의 배정에 관한 사항\n3. 설립되는 회사의 자본금과 준비금의 총액\n4. 각 회사의 주주에게 제2호에도 불구하고 금전이나 그 밖의 재산을 제공하는 경우에는 그 내용 및 배정에 관한 사항\n5. 제523조제5호 및 제6호에 규정된 사항\n6. 합병으로 인하여 설립되는 회사의 이사와 감사 또는 감사위원회의 위원을 정한 때에는 그 성명 및 주민등록번호\n제524조(신설합병의 합병계약서) 합병으로 회사를 설립하는 경우에는 합병계약서에 다음의 사항을 적어야 한다. <개정 2001.7.24, 2011.4.14, 2015.12.1>","kind":"L"},{"id":"L:525","label":"법 제525조","title":"합명회사, 합자회사의 합병계약서","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①합병후 존속하는 회사 또는 합병으로 인하여 설립되는 회사가 주식회사인 경우에 합병할 회사의 일방 또는 쌍방이 합명회사 또는 합자회사인 때에는 총사원의 동의를 얻어 합병계약서를 작성하여야 한다.\n②전2조의 규정은 전항의 합병계약서에 준용한다.\n제525조(합명회사, 합자회사의 합병계약서)","kind":"L"},{"id":"L:526","label":"법 제526조","title":"흡수합병의 보고총회","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①합병을 하는 회사의 일방이 합병후 존속하는 경우에는 그 이사는 제527조의5의 절차의 종료후, 합병으로 인한 주식의 병합이 있을 때에는 그 효력이 생긴 후, 병합에 적당하지 아니한 주식이 있을 때에는 합병후, 존속하는 회사에 있어서는 제443조의 처분을 한 후, 소규모합병의 경우에는 제527조의3제3항 및 제4항의 절차를 종료한 후 지체없이 주주총회를 소집하고 합병에 관한 사항을 보고하여야 한다. <개정 1998.12.28>\n②합병당시에 발행하는 신주의 인수인은 제1항의 주주총회에서 주주와 동일한 권리가 있다. <개정 1998.12.28>\n③제1항의 경우에 이사회는 공고로써 주주총회에 대한 보고에 갈음할 수 있다. <신설 1995.12.29>\n제526조(흡수합병의 보고총회)","kind":"L"},{"id":"L:527","label":"법 제527조","title":"신설합병의 창립총회","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①합병으로 인하여 회사를 설립하는 경우에는 설립위원은 제527조의5의 절차의 종료후, 합병으로 인한 주식의 병합이 있을 때에는 그 효력이 생긴 후, 병합에 적당하지 아니한 주식이 있을 때에는 제443조의 처분을 한 후 지체없이 창립총회를 소집하여야 한다. <개정 1998.12.28>\n②창립총회에서는 정관변경의 결의를 할 수 있다. 그러나 합병계약의 취지에 위반하는 결의는 하지 못한다.\n③제308조제2항, 제309조, 제311조, 제312조와 제316조제2항의 규정은 제1항의 창립총회에 준용한다.\n④제1항의 경우에 이사회는 공고로써 주주총회에 대한 보고에 갈음할 수 있다. <신설 1998.12.28>\n제527조(신설합병의 창립총회)","kind":"L"},{"id":"L:527-2","label":"법 제527조의2","title":"간이합병","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①합병할 회사의 일방이 합병후 존속하는 경우에 합병으로 인하여 소멸하는 회사의 총주주의 동의가 있거나 그 회사의 발행주식총수의 100분의 90이상을 합병후 존속하는 회사가 소유하고 있는 때에는 합병으로 인하여 소멸하는 회사의 주주총회의 승인은 이를 이사회의 승인으로 갈음할 수 있다.\n②제1항의 경우에 합병으로 인하여 소멸하는 회사는 합병계약서를 작성한 날부터 2주내에 주주총회의 승인을 얻지 아니하고 합병을 한다는 뜻을 공고하거나 주주에게 통지하여야 한다. 다만, 총주주의 동의가 있는 때에는 그러하지 아니하다.\n제527조의2(간이합병)","kind":"L"},{"id":"L:527-3","label":"법 제527조의3","title":"소규모합병","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 합병 후 존속하는 회사가 합병으로 인하여 발행하는 신주 및 이전하는 자기주식의 총수가 그 회사의 발행주식총수의 100분의 10을 초과하지 아니하는 경우에는 그 존속하는 회사의 주주총회의 승인은 이를 이사회의 승인으로 갈음할 수 있다. 다만, 합병으로 인하여 소멸하는 회사의 주주에게 제공할 금전이나 그 밖의 재산을 정한 경우에 그 금액 및 그 밖의 재산의 가액이 존속하는 회사의 최종 대차대조표상으로 현존하는 순자산액의 100분의 5를 초과하는 경우에는 그러하지 아니하다. <개정 2015.12.1>\n②제1항의 경우에 존속하는 회사의 합병계약서에는 주주총회의 승인을 얻지 아니하고 합병을 한다는 뜻을 기재하여야 한다.\n③제1항의 경우에 존속하는 회사는 합병계약서를 작성한 날부터 2주내에 소멸하는 회사의 상호 및 본점의 소재지, 합병을 할 날, 주주총회의 승인을 얻지 아니하고 합병을 한다는 뜻을 공고하거나 주주에게 통지하여야 한다.\n④합병후 존속하는 회사의 발행주식총수의 100분의 20 이상에 해당하는 주식을 소유한 주주가 제3항의 규정에 의한 공고 또는 통지를 한 날부터 2주내에 회사에 대하여 서면으로 제1항의 합병에 반대하는 의사를 통지한 때에는 제1항 본문의 규정에 의한 합병을 할 수 없다.\n⑤제1항 본문의 경우에는 제522조의3의 규정은 이를 적용하지 아니한다.\n제527조의3(소규모합병)","kind":"L"},{"id":"L:527-4","label":"법 제527조의4","title":"이사ㆍ감사의 임기","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①합병을 하는 회사의 일방이 합병후 존속하는 경우에 존속하는 회사의 이사 및 감사로서 합병전에 취임한 자는 합병계약서에 다른 정함이 있는 경우를 제외하고는 합병후 최초로 도래하는 결산기의 정기총회가 종료하는 때에 퇴임한다.\n② 삭제 <2001.7.24>\n제527조의4(이사ㆍ감사의 임기)","kind":"L"},{"id":"L:527-5","label":"법 제527조의5","title":"채권자보호절차","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사는 제522조의 주주총회의 승인결의가 있은 날부터 2주내에 채권자에 대하여 합병에 이의가 있으면 1월이상의 기간내에 이를 제출할 것을 공고하고 알고 있는 채권자에 대하여는 따로따로 이를 최고하여야 한다.\n②제1항의 규정을 적용함에 있어서 제527조의2 및 제527조의3의 경우에는 이사회의 승인결의를 주주총회의 승인결의로 본다.\n③제232조제2항 및 제3항의 규정은 제1항 및 제2항의 경우에 이를 준용한다.\n제527조의5(채권자보호절차)","kind":"L"},{"id":"L:527-6","label":"법 제527조의6","title":"합병에 관한 서류의 사후공시","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①이사는 제527조의5에 규정한 절차의 경과, 합병을 한  날, 합병으로 인하여 소멸하는 회사로부터 승계한 재산의 가액과 채무액 기타 합병에 관한 사항을 기재한 서면을 합병을 한 날부터 6월간 본점에 비치하여야 한다.\n②제522조의2제2항의 규정은 제1항의 서면에 관하여 이를 준용한다.\n제527조의6(합병에 관한 서류의 사후공시)","kind":"L"},{"id":"L:528","label":"법 제528조","title":"합병의 등기","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 회사가 합병을 한 때에는 제526조의 주주총회가 종결된 날 또는 보고를 갈음하는 공고일, 제527조의 창립총회가 종결된 날 또는 보고를 갈음하는 공고일부터 2주일 내에 본점의 소재지에서 합병 후 존속하는 회사의 변경등기, 합병으로 인하여 소멸하는 회사의 해산등기, 합병으로 인하여 설립되는 회사의 설립등기를 하여야 한다. <개정 2024.9.20>\n②합병후 존속하는 회사 또는 합병으로 인하여 설립된 회사가 합병으로 인하여 전환사채 또는 신주인수권부사채를 승계한 때에는 제1항의 등기와 동시에 사채의 등기를 하여야 한다. <개정 1984.4.10>\n제528조(합병의 등기)","kind":"L"},{"id":"L:529","label":"법 제529조","title":"합병무효의 소","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①합병무효는 각 회사의 주주ㆍ이사ㆍ감사ㆍ청산인ㆍ파산관재인 또는 합병을 승인하지 아니한 채권자에 한하여 소만으로 이를 주장할 수 있다. <개정 1984.4.10>\n②제1항의 소는 제528조의 등기가 있은 날로부터 6월내에 제기하여야 한다. <개정 1984.4.10>\n제529조(합병무효의 소)","kind":"L"},{"id":"L:530","label":"법 제530조","title":"준용규정","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 삭제 <1998.12.28>\n②제234조, 제235조, 제237조 내지 제240조, 제329조의2, 제374조제2항, 제374조의2제2항 내지 제5항 및 제439조제3항의 규정은 주식회사의 합병에 관하여 이를 준용한다. <개정 1995.12.29, 1998.12.28, 2001.7.24>\n③제440조부터 제443조까지의 규정은 회사의 합병으로 인한 주식병합 또는 주식분할의 경우에 준용한다. <개정 1998.12.28, 2014.5.20>\n④제339조와 제340조제3항의 규정은 주식을 병합하지 아니하는 경우에 합병으로 인하여 소멸하는 회사의 주식을 목적으로 하는 질권에 준용한다.\n제530조(준용규정)","kind":"L"},{"id":"L:530-2","label":"법 제530조의2","title":"회사의 분할ㆍ분할합병","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사는 분할에 의하여 1개 또는 수개의 회사를 설립할 수 있다.\n②회사는 분할에 의하여 1개 또는 수개의 존립 중의 회사와 합병(이하 \"分割合倂\"이라 한다)할 수 있다.\n③회사는 분할에 의하여 1개 또는 수개의 회사를 설립함과 동시에 분할합병할 수 있다.\n④해산후의 회사는 존립중의 회사를 존속하는 회사로 하거나 새로 회사를 설립하는 경우에 한하여 분할 또는 분할합병할 수 있다.\n제530조의2(회사의 분할ㆍ분할합병)","kind":"L"},{"id":"L:530-3","label":"법 제530조의3","title":"분할계획서ㆍ분할합병계약서의 승인","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사가 분할 또는 분할합병을 하는 때에는 분할계획서 또는 분할합병계약서를 작성하여 주주총회의 승인을 얻어야 한다.\n②제1항의 승인결의는 제434조의 규정에 의하여야 한다.\n③ 제2항의 결의에 관하여는 제344조의3제1항에 따라 의결권이 배제되는 주주도 의결권이 있다. <개정 2011.4.14>\n④분할계획 또는 분할합병계약의 요령은 제363조에 정한 통지에 기재하여야 한다. <개정 2014.5.20>\n⑤ 삭제 <2011.4.14>\n⑥회사의 분할 또는 분할합병으로 인하여 분할 또는 분할합병에 관련되는 각 회사의 주주의 부담이 가중되는 경우에는 제1항 및 제436조의 결의외에 그 주주 전원의 동의가 있어야 한다. <개정 2011.4.14>\n제530조의3(분할계획서ㆍ분할합병계약서의 승인)","kind":"L"},{"id":"L:530-4","label":"법 제530조의4","title":"분할에 의한 회사의 설립","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제530조의4(분할에 의한 회사의 설립) 제530조의2에 따른 회사의 설립에 관하여는 이 장 제1절의 회사설립에 관한 규정을 준용한다. 다만, 분할되는 회사(이하 \"분할회사\"라 한다)의 출자만으로 회사가 설립되는 경우에는 제299조를 적용하지 아니한다.","kind":"L"},{"id":"L:530-5","label":"법 제530조의5","title":"분할계획서의 기재사항","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①분할에 의하여 회사를 설립하는 경우에는 분할계획서에 다음 각 호의 사항을 기재하여야 한다. <개정 2011.4.14, 2015.12.1>\n1. 분할에 의하여 설립되는 회사(이하 \"단순분할신설회사\"라 한다)의 상호, 목적, 본점의 소재지 및 공고의 방법\n2. 단순분할신설회사가 발행할 주식의 총수 및 액면주식ㆍ무액면주식의 구분\n3. 단순분할신설회사가 분할 당시에 발행하는 주식의 총수, 종류 및 종류주식의 수, 액면주식ㆍ무액면주식의 구분\n4. 분할회사의 주주에 대한 단순분할신설회사의 주식의 배정에 관한 사항 및 배정에 따른 주식의 병합 또는 분할을 하는 경우에는 그에 관한 사항\n5. 분할회사의 주주에게 제4호에도 불구하고 금전이나 그 밖의 재산을 제공하는 경우에는 그 내용 및 배정에 관한 사항\n6. 단순분할신설회사의 자본금과 준비금에 관한 사항\n7. 단순분할신설회사에 이전될 재산과 그 가액\n8. 제530조의9제2항의 정함이 있는 경우에는 그 내용\n8의2. 분할을 할 날\n9. 단순분할신설회사의 이사와 감사를 정한 경우에는 그 성명과 주민등록번호\n10. 단순분할신설회사의 정관에 기재할 그 밖의 사항\n②분할후 회사가 존속하는 경우에는 존속하는 회사에 관하여 분할계획서에 다음 각호의 사항을 기재하여야 한다. <개정 2011.4.14>\n1. 감소할 자본금과 준비금의 액\n2. 자본감소의 방법\n3. 분할로 인하여 이전할 재산과 그 가액\n4. 분할후의 발행주식의 총수\n5. 회사가 발행할 주식의 총수를 감소하는 경우에는 그 감소할 주식의 총수, 종류 및 종류별 주식의 수\n6. 정관변경을 가져오게 하는 그 밖의 사항\n제530조의5(분할계획서의 기재사항)","kind":"L"},{"id":"L:530-6","label":"법 제530조의6","title":"분할합병계약서의 기재사항 및 분할합병대가가 모회사주식인 경우의 특칙","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①분할회사의 일부가 다른 회사와 합병하여 그 다른 회사(이하 \"분할합병의 상대방 회사\"라 한다)가 존속하는 경우에는 분할합병계약서에 다음 각 호의 사항을 기재하여야 한다. <개정 2015.12.1>\n1. 분할합병의 상대방 회사로서 존속하는 회사(이하 \"분할승계회사\"라 한다)가 분할합병으로 인하여 발행할 주식의 총수를 증가하는 경우에는 증가할 주식의 총수, 종류 및 종류별 주식의 수\n2. 분할승계회사가 분할합병을 하면서 신주를 발행하거나 자기주식을 이전하는 경우에는 그 발행하는 신주 또는 이전하는 자기주식의 총수, 종류 및 종류별 주식의 수\n3. 분할승계회사가 분할합병을 하면서 신주를 발행하거나 자기주식을 이전하는 경우에는 분할회사의 주주에 대한 분할승계회사의 신주의 배정 또는 자기주식의 이전에 관한 사항 및 주식의 병합 또는 분할을 하는 경우에는 그에 관한 사항\n4. 분할승계회사가 분할회사의 주주에게 제3호에도 불구하고 그 대가의 전부 또는 일부로서 금전이나 그 밖의 재산을 제공하는 경우에는 그 내용 및 배정에 관한 사항\n5. 분할승계회사의 자본금 또는 준비금이 증가하는 경우에는 증가할 자본금 또는 준비금에 관한 사항\n6. 분할회사가 분할승계회사에 이전할 재산과 그 가액\n7. 제530조의9제3항의 정함이 있는 경우에는 그 내용\n8. 각 회사에서 제530조의3제2항의 결의를 할 주주총회의 기일\n9. 분할합병을 할 날\n10. 분할승계회사의 이사와 감사를 정한 경우에는 그 성명과 주민등록번호\n11. 분할승계회사의 정관변경을 가져오게 하는 그 밖의 사항\n②분할회사의 일부가 다른 분할회사의 일부 또는 다른 회사와 분할합병을 하여 회사를 설립하는 경우에는 분할합병계약서에 다음 각 호의 사항을 기재하여야 한다. <개정 2015.12.1>\n1. 제530조의5제1항제1호ㆍ제2호ㆍ제6호ㆍ제7호ㆍ제8호ㆍ제8호의2ㆍ제9호ㆍ제10호에 규정된 사항\n2. 분할합병을 하여 설립되는 회사(이하 \"분할합병신설회사\"라 한다)가 분할합병을 하면서 발행하는 주식의 총수, 종류 및 종류별 주식의 수\n3. 각 회사의 주주에 대한 주식의 배정에 관한 사항과 배정에 따른 주식의 병합 또는 분할을 하는 경우에는 그 규정\n4. 각 회사가 분할합병신설회사에 이전할 재산과 그 가액\n5. 각 회사의 주주에게 지급할 금액을 정한 때에는 그 규정\n6. 각 회사에서 제530조의3제2항의 결의를 할 주주총회의 기일\n7. 분할합병을 할 날\n③제530조의5의 규정은 제1항 및 제2항의 경우에 각 회사의 분할합병을 하지 아니하는 부분의 기재에 관하여 이를 준용한다.\n④ 제342조의2제1항에도 불구하고 제1항제4호에 따라 분할회사의 주주에게 제공하는 재산이 분할승계회사의 모회사 주식을 포함하는 경우에는 분할승계회사는 그 지급을 위하여 모회사 주식을 취득할 수 있다. <신설 2015.12.1>\n⑤ 분할승계회사는 제4항에 따라 취득한 모회사의 주식을 분할합병 후에도 계속 보유하고 있는 경우 분할합병의 효력이 발생하는 날부터 6개월 이내에 그 주식을 처분하여야 한다. <신설 2015.12.1>\n제530조의6(분할합병계약서의 기재사항 및 분할합병대가가 모회사주식인 경우의 특칙)","kind":"L"},{"id":"L:530-7","label":"법 제530조의7","title":"분할대차대조표 등의 공시","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①분할회사의 이사는 제530조의3제1항에 따른 주주총회 회일의 2주 전부터 분할의 등기를 한 날 또는 분할합병을 한 날 이후 6개월 간 다음 각 호의 서류를 본점에 비치하여야 한다. <개정 2015.12.1>\n1. 분할계획서 또는 분할합병계약서\n2. 분할되는 부분의 대차대조표\n3. 분할합병의 경우 분할합병의 상대방 회사의 대차대조표\n4. 분할 또는 분할합병을 하면서 신주가 발행되거나 자기주식이 이전되는 경우에는 분할회사의 주주에 대한 신주의 배정 또는 자기주식의 이전에 관하여 그 이유를 기재한 서면\n②제530조의6제1항의 분할승계회사의 이사는 분할합병을 승인하는 주주총회 회일의 2주 전부터 분할합병의 등기를 한 후 6개월 간 다음 각 호의 서류를 본점에 비치하여야 한다. <개정 2015.12.1>\n1. 분할합병계약서\n2. 분할회사의 분할되는 부분의 대차대조표\n3. 분할합병을 하면서 신주를 발행하거나 자기주식을 이전하는 경우에는 분할회사의 주주에 대한 신주의 배정 또는 자기주식의 이전에 관하여 그 이유를 기재한 서면\n③제522조의2제2항의 규정은 제1항 및 제2항의 서류에 관하여 이를 준용한다.\n제530조의7(분할대차대조표 등의 공시)","kind":"L"},{"id":"L:530-8","label":"법 제530조의8","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제530조의8 삭제 <2015.12.1>","kind":"L"},{"id":"L:530-9","label":"법 제530조의9","title":"분할 및 분할합병 후의 회사의 책임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 분할회사, 단순분할신설회사, 분할승계회사 또는 분할합병신설회사는 분할 또는 분할합병 전의 분할회사 채무에 관하여 연대하여 변제할 책임이 있다.\n② 제1항에도 불구하고 분할회사가 제530조의3제2항에 따른 결의로 분할에 의하여 회사를 설립하는 경우에는 단순분할신설회사는 분할회사의 채무 중에서 분할계획서에 승계하기로 정한 채무에 대한 책임만을 부담하는 것으로 정할 수 있다. 이 경우 분할회사가 분할 후에 존속하는 경우에는 단순분할신설회사가 부담하지 아니하는 채무에 대한 책임만을 부담한다.\n③ 분할합병의 경우에 분할회사는 제530조의3제2항에 따른 결의로 분할합병에 따른 출자를 받는 분할승계회사 또는 분할합병신설회사가 분할회사의 채무 중에서 분할합병계약서에 승계하기로 정한 채무에 대한 책임만을 부담하는 것으로 정할 수 있다. 이 경우 제2항 후단을 준용한다.\n④ 제2항의 경우에는 제439조제3항 및 제527조의5를 준용한다.\n제530조의9(분할 및 분할합병 후의 회사의 책임)","kind":"L"},{"id":"L:530-10","label":"법 제530조의10","title":"분할 또는 분할합병의 효과","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제530조의10(분할 또는 분할합병의 효과) 단순분할신설회사, 분할승계회사 또는 분할합병신설회사는 분할회사의 권리와 의무를 분할계획서 또는 분할합병계약서에서 정하는 바에 따라 승계한다.","kind":"L"},{"id":"L:530-11","label":"법 제530조의11","title":"준용규정","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 분할 또는 분할합병의 경우에는 제234조, 제237조부터 제240조까지, 제329조의2, 제440조부터 제443조까지, 제526조, 제527조, 제527조의6, 제528조 및 제529조를 준용한다. 다만, 제527조의 설립위원은 대표이사로 한다. <개정 2011.4.14, 2014.5.20>\n②제374조제2항, 제439조제3항, 제522조의3, 제527조의2, 제527조의3 및 제527조의5의 규정은 분할합병의 경우에 이를 준용한다. <개정 1999.12.31>\n제530조의11(준용규정)","kind":"L"},{"id":"L:530-12","label":"법 제530조의12","title":"물적 분할","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제530조의12(물적 분할) 이 절의 규정은 분할되는 회사가 분할 또는 분할합병으로 인하여 설립되는 회사의 주식의 총수를 취득하는 경우에 이를 준용한다.","kind":"L"},{"id":"L:531","label":"법 제531조","title":"청산인의 결정","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사가 해산한 때에는 합병ㆍ분할ㆍ분할합병 또는 파산의 경우 외에는 이사가 청산인이 된다. 다만, 정관에 다른 정함이 있거나 주주총회에서 타인을 선임한 때에는 그러하지 아니하다. <개정 1998.12.28>\n②전항의 규정에 의한 청산인이 없는 때에는 법원은 이해관계인의 청구에 의하여 청산인을 선임한다.\n제531조(청산인의 결정)","kind":"L"},{"id":"L:532","label":"법 제532조","title":"청산인의 신고","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"1. 해산의 사유와 그 연월일\n2. 청산인의 성명ㆍ주민등록번호 및 주소\n제532조(청산인의 신고) 청산인은 취임한 날로부터 2주간내에 다음의 사항을 법원에 신고하여야 한다. <개정 1995.12.29>","kind":"L"},{"id":"L:533","label":"법 제533조","title":"회사재산조사보고의무","chapter":"제3편 회사 제4장 주식회사","d
