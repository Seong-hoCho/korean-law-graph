:241","label":"법 제241조","title":"사원에 의한 해산청구","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①부득이한 사유가 있는 때에는 각 사원은 회사의 해산을 법원에 청구할 수 있다.\n②제186조와 제191조의 규정은 전항의 경우에 준용한다.\n제241조(사원에 의한 해산청구)","kind":"L"},{"id":"L:242","label":"법 제242조","title":"조직변경","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①합명회사는 총사원의 동의로 일부사원을 유한책임사원으로 하거나 유한책임사원을 새로 가입시켜서 합자회사로 변경할 수 있다.\n②전항의 규정은 제229조제2항의 규정에 의하여 회사를 계속하는 경우에 준용한다.\n제242조(조직변경)","kind":"L"},{"id":"L:243","label":"법 제243조","title":"조직변경의 등기","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제243조(조직변경의 등기) 합명회사를 합자회사로 변경한 때에는 본점의 소재지에서 2주일 내에 합명회사의 해산등기, 합자회사의 설립등기를 하여야 한다.","kind":"L"},{"id":"L:244","label":"법 제244조","title":"조직변경에 의하여 유한책임사원이 된 자의 책임","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제244조(조직변경에 의하여 유한책임사원이 된 자의 책임) 합명회사사원으로서 제242조제1항의 규정에 의하여 유한책임사원이 된 자는 전조의 규정에 의한 본점등기를 하기 전에 생긴 회사채무에 대하여는 등기 후 2년내에는 무한책임사원의 책임을 면하지 못한다.","kind":"L"},{"id":"L:245","label":"법 제245조","title":"청산 중의 회사","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제245조(청산 중의 회사) 회사는 해산된 후에도 청산의 목적범위내에서 존속하는 것으로 본다.","kind":"L"},{"id":"L:246","label":"법 제246조","title":"수인의 지분상속인이 있는 경우","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제246조(수인의 지분상속인이 있는 경우) 회사의 해산후 사원이 사망한 경우에 그 상속인이 수인인 때에는 청산에 관한 사원의 권리를 행사할 자 1인을 정하여야 한다. 이를 정하지 아니한 때에는 회사의 통지 또는 최고는 그 중의 1인에 대하여 하면 전원에 대하여 그 효력이 있다.","kind":"L"},{"id":"L:247","label":"법 제247조","title":"임의청산","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①해산된 회사의 재산처분방법은 정관 또는 총사원의 동의로 이를 정할 수 있다. 이 경우에는 해산사유가 있는 날로부터 2주간내에 재산목록과 대차대조표를 작성하여야 한다.\n②전항의 규정은 회사가 제227조제3호 또는 제6호의 사유로 인하여 해산한 경우에는 이를 적용하지 아니한다.\n③제232조의 규정은 제1항의 경우에 준용한다.\n④제1항의 경우에 사원의 지분을 압류한 자가 있는 때에는 그 동의를 얻어야 한다.\n⑤ 제1항의 회사는 그 재산의 처분을 완료한 날부터 2주일 내에 본점의 소재지에서 청산종결의 등기를 하여야 한다. <개정 2024.9.20>\n제247조(임의청산)","kind":"L"},{"id":"L:248","label":"법 제248조","title":"임의청산과 채권자보호","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①회사가 전조제3항의 규정에 위반하여 그 재산을 처분함으로써 회사채권자를 해한 때에는 회사채권자는 그 처분의 취소를 법원에 청구할 수 있다.\n②제186조와 민법제406조제1항 단서, 제2항 및 제407조의 규정은 전항의 취소의 청구에 준용한다.\n제248조(임의청산과 채권자보호)","kind":"L"},{"id":"L:249","label":"법 제249조","title":"지분압류채권자의 보호","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제249조(지분압류채권자의 보호) 회사가 제247조제4항의 규정에 위반하여 그 재산을 처분한 때에는 사원의 지분을 압류한 자는 회사에 대하여 그 지분에 상당하는 금액의 지급을 청구할 수 있다. 이 경우에는 전조의 규정을 준용한다.","kind":"L"},{"id":"L:250","label":"법 제250조","title":"법정청산","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제250조(법정청산) 제247조제1항의 규정에 의하여 회사재산의 처분방법을 정하지 아니한 때에는 합병과 파산의 경우를 제외하고 제251조 내지 제265조의 규정에 따라서 청산을 하여야 한다.","kind":"L"},{"id":"L:251","label":"법 제251조","title":"청산인","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①회사가 해산된 때에는 총사원 과반수의 결의로 청산인을 선임한다.\n②청산인의 선임이 없는 때에는 업무집행사원이 청산인이 된다.\n제251조(청산인)","kind":"L"},{"id":"L:252","label":"법 제252조","title":"법원선임에 의한 청산인","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제252조(법원선임에 의한 청산인) 회사가 제227조제3호 또는 제6호의 사유로 인하여 해산된 때에는 법원은 사원 기타의 이해관계인이나 검사의 청구에 의하여 또는 직권으로 청산인을 선임한다.","kind":"L"},{"id":"L:253","label":"법 제253조","title":"청산인의 등기","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①청산인이 선임된 때에는 그 선임된 날부터, 업무집행사원이 청산인이 된 때에는 해산된 날부터 2주일 내에 본점의 소재지에서 다음 각 호의 사항을 등기하여야 한다. <개정 1995.12.29, 2024.9.20>\n1. 청산인의 성명ㆍ주민등록번호 및 주소. 다만, 회사를 대표할 청산인을 정한 때에는 그 외의 청산인의 주소를 제외한다.\n2. 회사를 대표할 청산인을 정한 때에는 그 성명\n3. 수인의 청산인이 공동으로 회사를 대표할 것을 정한 때에는 그 규정\n②제183조의 규정은 제1항의 등기에 준용한다. <개정 1995.12.29>\n제253조(청산인의 등기)","kind":"L"},{"id":"L:254","label":"법 제254조","title":"청산인의 직무권한","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①청산인의 직무는 다음과 같다.\n1. 현존사무의 종결\n2. 채권의 추심과 채무의 변제\n3. 재산의 환가처분\n4. 잔여재산의 분배\n②청산인이 수인인 때에는 청산의 직무에 관한 행위는 그 과반수의 결의로 정한다.\n③회사를 대표할 청산인은 제1항의 직무에 관하여 재판상 또는 재판외의 모든 행위를 할 권한이 있다.\n④민법 제93조의 규정은 합명회사에 준용한다.\n제254조(청산인의 직무권한)","kind":"L"},{"id":"L:255","label":"법 제255조","title":"청산인의 회사대표","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①업무집행사원이 청산인으로 된 경우에는 종전의 정함에 따라 회사를 대표한다.\n②법원이 수인의 청산인을 선임하는 경우에는 회사를 대표할 자를 정하거나 수인이 공동하여 회사를 대표할 것을 정할 수 있다.\n제255조(청산인의 회사대표)","kind":"L"},{"id":"L:256","label":"법 제256조","title":"청산인의 의무","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①청산인은 취임한 후 지체없이 회사의 재산상태를 조사하고 재산목록과 대차대조표를 작성하여 각 사원에게 교부하여야 한다.\n②청산인은 사원의 청구가 있는 때에는 언제든지 청산의 상황을 보고하여야 한다.\n제256조(청산인의 의무)","kind":"L"},{"id":"L:257","label":"법 제257조","title":"영업의 양도","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제257조(영업의 양도) 청산인이 회사의 영업의 전부 또는 일부를 양도함에는 총사원 과반수의 결의가 있어야 한다.","kind":"L"},{"id":"L:258","label":"법 제258조","title":"채무완제불능과 출자청구","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①회사의 현존재산이 그 채무를 변제함에 부족한 때에는 청산인은 변제기에 불구하고 각 사원에 대하여 출자를 청구할 수 있다.\n②전항의 출자액은 각 사원의 출자의 비율로 이를 정한다.\n제258조(채무완제불능과 출자청구)","kind":"L"},{"id":"L:259","label":"법 제259조","title":"채무의 변제","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①청산인은 변제기에 이르지 아니한 회사채무에 대하여도 이를 변제할 수 있다.\n②전항의 경우에 이자없는 채권에 관하여는 변제기에 이르기까지의 법정이자를 가산하여 그 채권액에 달할 금액을 변제하여야 한다.\n③전항의 규정은 이자있는 채권으로서 그 이율이 법정이율에 달하지 못하는 것에 이를 준용한다.\n④제1항의 경우에는 조건부채권, 존속기간이 불확정한 채권 기타 가액이 불확정한 채권에 대하여는 법원이 선임한 감정인의 평가에 의하여 변제하여야 한다.\n제259조(채무의 변제)","kind":"L"},{"id":"L:260","label":"법 제260조","title":"잔여재산의 분배","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제260조(잔여재산의 분배) 청산인은 회사의 채무를 완제한 후가 아니면 회사재산을 사원에게 분배하지 못한다. 그러나 다툼이 있는 채무에 대하여는 그 변제에 필요한 재산을 보류하고 잔여재산을 분배할 수 있다.","kind":"L"},{"id":"L:261","label":"법 제261조","title":"청산인의 해임","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제261조(청산인의 해임) 사원이 선임한 청산인은 총사원 과반수의 결의로 해임할 수 있다.","kind":"L"},{"id":"L:262","label":"법 제262조","title":"동전","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제262조(동전) 청산인이 그 직무를 집행함에 현저하게 부적임하거나 중대한 임무에 위반한 행위가 있는 때에는 법원은 사원 기타의 이해관계인의 청구에 의하여 청산인을 해임할 수 있다.","kind":"L"},{"id":"L:263","label":"법 제263조","title":"청산인의 임무종료","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①청산인은 그 임무가 종료한 때에는 지체없이 계산서를 작성하여 각 사원에게 교부하고 그 승인을 얻어야 한다.\n②전항의 계산서를 받은 사원이 1월내에 이의를 하지 아니한 때에는 그 계산을 승인한 것으로 본다. 그러나 청산인에게 부정행위가 있는 경우에는 그러하지 아니하다.\n제263조(청산인의 임무종료)","kind":"L"},{"id":"L:264","label":"법 제264조","title":"청산종결의 등기","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제264조(청산종결의 등기) 청산이 종결된 때에는 청산인은 제263조에 따른 총사원의 승인이 있은 날부터 2주일 내에 본점의 소재지에서 청산종결의 등기를 하여야 한다.","kind":"L"},{"id":"L:265","label":"법 제265조","title":"준용규정","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"제265조(준용규정) 제183조의2ㆍ제199조ㆍ제200조의2ㆍ제207조ㆍ제208조ㆍ제209조제2항ㆍ제210조ㆍ제382조제2항ㆍ제399조 및 제401조의 규정은 청산인에 준용한다.","kind":"L"},{"id":"L:266","label":"법 제266조","title":"장부, 서류의 보존","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①회사의 장부와 영업 및 청산에 관한 중요서류는 본점소재지에서 청산종결의 등기를 한 후 10년간 이를 보존하여야 한다. 다만, 전표 또는 이와 유사한 서류는 5년간 이를 보존하여야 한다. <개정 1995.12.29>\n②제1항의 경우에는 총사원 과반수의 결의로 보존인과 보존방법을 정하여야 한다. <개정 1995.12.29>\n제266조(장부, 서류의 보존)","kind":"L"},{"id":"L:267","label":"법 제267조","title":"사원의 책임의 소멸시기","chapter":"제3편 회사 제2장 합명회사","deleted":false,"text":"①제212조의 규정에 의한 사원의 책임은 본점소재지에서 해산등기를 한 후 5년을 경과하면 소멸한다.\n②전항의 기간경과후에도 분배하지 아니한 잔여재산이 있는 때에는 회사채권자는 이에 대하여 변제를 청구할 수 있다.\n제267조(사원의 책임의 소멸시기)","kind":"L"},{"id":"L:268","label":"법 제268조","title":"회사의 조직","chapter":"제3편 회사 제3장 합자회사","deleted":false,"text":"제268조(회사의 조직) 합자회사는 무한책임사원과 유한책임사원으로 조직한다.","kind":"L"},{"id":"L:269","label":"법 제269조","title":"준용규정","chapter":"제3편 회사 제3장 합자회사","deleted":false,"text":"제269조(준용규정) 합자회사에는 본장에 다른 규정이 없는 사항은 합명회사에 관한 규정을 준용한다.","kind":"L"},{"id":"L:270","label":"법 제270조","title":"정관의 절대적 기재사항","chapter":"제3편 회사 제3장 합자회사","deleted":false,"text":"제270조(정관의 절대적 기재사항) 합자회사의 정관에는 제179조에 게기한 사항외에 각 사원의 무한책임 또는 유한책임인 것을 기재하여야 한다.","kind":"L"},{"id":"L:271","label":"법 제271조","title":"등기사항","chapter":"제3편 회사 제3장 합자회사","deleted":false,"text":"제271조(등기사항) 합자회사의 설립등기를 할 때에는 제180조 각 호의 사항 외에 각 사원의 책임이 무한책임인지 유한책임인지를 등기하여야 한다.","kind":"L"},{"id":"L:272","label":"법 제272조","title":"유한책임사원의 출자","chapter":"제3편 회사 제3장 합자회사","deleted":false,"text":"제272조(유한책임사원의 출자) 유한책임사원은 신용 또는 노무를 출자의 목적으로 하지 못한다.","kind":"L"},{"id":"L:273","label":"법 제273조","title":"업무집행의 권리의무","chapter":"제3편 회사 제3장 합자회사","deleted":false,"text":"제273조(업무집행의 권리의무) 무한책임사원은 정관에 다른 규정이 없는 때에는 각자가 회사의 업무를 집행할 권리와 의무가 있다.","kind":"L"},{"id":"L:274","label":"법 제274조","title":"지배인의 선임, 해임","chapter":"제3편 회사 제3장 합자회사","deleted":false,"text":"제274조(지배인의 선임, 해임) 지배인의 선임과 해임은 업무집행사원이 있는 경우에도 무한책임사원 과반수의 결의에 의하여야 한다.","kind":"L"},{"id":"L:275","label":"법 제275조","title":"유한책임사원의 경업의 자유","chapter":"제3편 회사 제3장 합자회사","deleted":false,"text":"제275조(유한책임사원의 경업의 자유) 유한책임사원은 다른 사원의 동의없이 자기 또는 제3자의 계산으로 회사의 영업부류에 속하는 거래를 할 수 있고 동종영업을 목적으로 하는 다른 회사의 무한책임사원 또는 이사가 될 수 있다.","kind":"L"},{"id":"L:276","label":"법 제276조","title":"유한책임사원의 지분양도","chapter":"제3편 회사 제3장 합자회사","deleted":false,"text":"제276조(유한책임사원의 지분양도) 유한책임사원은 무한책임사원 전원의 동의가 있으면 그 지분의 전부 또는 일부를 타인에게 양도할 수 있다. 지분의 양도에 따라 정관을 변경하여야 할 경우에도 같다.","kind":"L"},{"id":"L:277","label":"법 제277조","title":"유한책임사원의 감시권","chapter":"제3편 회사 제3장 합자회사","deleted":false,"text":"①유한책임사원은 영업년도말에 있어서 영업시간 내에 한하여 회사의 회계장부ㆍ대차대조표 기타의 서류를 열람할 수 있고 회사의 업무와 재산상태를 검사할 수 있다. <개정 1984.4.10>\n②중요한 사유가 있는 때에는 유한책임사원은 언제든지 법원의 허가를 얻어 제1항의 열람과 검사를 할 수 있다. <개정 1984.4.10>\n제277조(유한책임사원의 감시권)","kind":"L"},{"id":"L:278","label":"법 제278조","title":"유한책임사원의 업무집행, 회사대표의 금지","chapter":"제3편 회사 제3장 합자회사","deleted":false,"text":"제278조(유한책임사원의 업무집행, 회사대표의 금지) 유한책임사원은 회사의 업무집행이나 대표행위를 하지 못한다.","kind":"L"},{"id":"L:279","label":"법 제279조","title":"유한책임사원의 책임","chapter":"제3편 회사 제3장 합자회사","deleted":false,"text":"①유한책임사원은 그 출자가액에서 이미 이행한 부분을 공제한 가액을 한도로 하여 회사채무를 변제할 책임이 있다.\n②회사에 이익이 없음에도 불구하고 배당을 받은 금액은 변제책임을 정함에 있어서 이를 가산한다.\n제279조(유한책임사원의 책임)","kind":"L"},{"id":"L:280","label":"법 제280조","title":"출자감소의 경우의 책임","chapter":"제3편 회사 제3장 합자회사","deleted":false,"text":"제280조(출자감소의 경우의 책임) 유한책임사원은 그 출자를 감소한 후에도 본점소재지에서 등기를 하기 전에 생긴 회사채무에 대하여는 등기후 2년내에는 전조의 책임을 면하지 못한다.","kind":"L"},{"id":"L:281","label":"법 제281조","title":"자칭 무한책임사원의 책임","chapter":"제3편 회사 제3장 합자회사","deleted":false,"text":"①유한책임사원이 타인에게 자기를 무한책임사원이라고 오인시키는 행위를 한 때에는 오인으로 인하여 회사와 거래를 한 자에 대하여 무한책임사원과 동일한 책임이 있다.\n②전항의 규정은 유한책임사원이 그 책임의 한도를 오인시키는 행위를 한 경우에 준용한다.\n제281조(자칭 무한책임사원의 책임)","kind":"L"},{"id":"L:282","label":"법 제282조","title":"책임을 변경한 사원의 책임","chapter":"제3편 회사 제3장 합자회사","deleted":false,"text":"제282조(책임을 변경한 사원의 책임) 제213조의 규정은 유한책임사원이 무한책임사원으로 된 경우에, 제225조의 규정은 무한책임사원이 유한책임사원으로 된 경우에 준용한다.","kind":"L"},{"id":"L:283","label":"법 제283조","title":"유한책임사원의 사망","chapter":"제3편 회사 제3장 합자회사","deleted":false,"text":"①유한책임사원이 사망한 때에는 그 상속인이 그 지분을 승계하여 사원이 된다.\n②전항의 경우에 상속인이 수인인 때에는 사원의 권리를 행사할 자 1인을 정하여야 한다. 이를 정하지 아니한 때에는 회사의 통지 또는 최고는 그 중의 1인에 대하여 하면 전원에 대하여 그 효력이 있다.\n제283조(유한책임사원의 사망)","kind":"L"},{"id":"L:284","label":"법 제284조","title":"유한책임사원의 성년후견개시","chapter":"제3편 회사 제3장 합자회사","deleted":false,"text":"제284조(유한책임사원의 성년후견개시) 유한책임사원은 성년후견개시 심판을 받은 경우에도 퇴사되지 아니한다.","kind":"L"},{"id":"L:285","label":"법 제285조","title":"해산, 계속","chapter":"제3편 회사 제3장 합자회사","deleted":false,"text":"①합자회사는 무한책임사원 또는 유한책임사원의 전원이 퇴사한 때에는 해산된다.\n②전항의 경우에 잔존한 무한책임사원 또는 유한책임사원은 전원의 동의로 새로 유한책임사원 또는 무한책임사원을 가입시켜서 회사를 계속할 수 있다.\n③제213조와 제229조제3항의 규정은 전항의 경우에 준용한다.\n제285조(해산, 계속)","kind":"L"},{"id":"L:286","label":"법 제286조","title":"조직변경","chapter":"제3편 회사 제3장 합자회사","deleted":false,"text":"①합자회사는 사원전원의 동의로 그 조직을 합명회사로 변경하여 계속할 수 있다.\n②유한책임사원전원이 퇴사한 경우에도 무한책임사원은 그 전원의 동의로 합명회사로 변경하여 계속할 수 있다.\n③ 제1항과 제2항의 경우에는 본점의 소재지에서 2주일 내에 합자회사의 해산등기, 합명회사의 설립등기를 하여야 한다. <개정 2024.9.20>\n제286조(조직변경)","kind":"L"},{"id":"L:287","label":"법 제287조","title":"청산인","chapter":"제3편 회사 제3장 합자회사","deleted":false,"text":"제287조(청산인) 합자회사의 청산인은 무한책임사원 과반수의 의결로 선임한다. 이를 선임하지 아니한 때에는 업무집행사원이 청산인이 된다.","kind":"L"},{"id":"L:287-2","label":"법 제287조의2","title":"정관의 작성","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"제287조의2(정관의 작성) 유한책임회사를 설립할 때에는 사원은 정관을 작성하여야 한다.","kind":"L"},{"id":"L:287-3","label":"법 제287조의3","title":"정관의 기재사항","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"1. 제179조제1호부터 제3호까지, 제5호 및 제6호에서 정한 사항\n2. 사원의 출자의 목적 및 가액\n3. 자본금의 액\n4. 업무집행자의 성명(법인인 경우에는 명칭) 및 주소\n제287조의3(정관의 기재사항) 정관에는 다음 각 호의 사항을 적고 각 사원이 기명날인하거나 서명하여야 한다.","kind":"L"},{"id":"L:287-4","label":"법 제287조의4","title":"설립 시의 출자의 이행","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"① 사원은 신용이나 노무를 출자의 목적으로 하지 못한다.\n② 사원은 정관의 작성 후 설립등기를 하는 때까지 금전이나 그 밖의 재산의 출자를 전부 이행하여야 한다.\n③ 현물출자를 하는 사원은 납입기일에 지체 없이 유한책임회사에 출자의 목적인 재산을 인도하고, 등기, 등록, 그 밖의 권리의 설정 또는 이전이 필요한 경우에는 이에 관한 서류를 모두 갖추어 교부하여야 한다.\n제287조의4(설립 시의 출자의 이행)","kind":"L"},{"id":"L:287-5","label":"법 제287조의5","title":"설립의 등기 등","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"① 유한책임회사는 본점의 소재지에서 다음 각 호의 사항을 등기함으로써 성립한다.\n1. 제179조제1호ㆍ제2호 및 제5호에서 정한 사항과 지점을 둔 경우에는 그 소재지\n2. 제180조제3호에서 정한 사항\n3. 자본금의 액\n4. 업무집행자의 성명, 주소 및 주민등록번호(법인인 경우에는 명칭, 주소 및 법인등록번호). 다만, 유한책임회사를 대표할 업무집행자를 정한 경우에는 그 외의 업무집행자의 주소는 제외한다.\n5. 유한책임회사를 대표할 자를 정한 경우에는 그 성명 또는 명칭과 주소\n6. 정관으로 공고방법을 정한 경우에는 그 공고방법\n7. 둘 이상의 업무집행자가 공동으로 회사를 대표할 것을 정한 경우에는 그 규정\n② 유한책임회사가 지점을 설치하는 경우에는 제181조를 준용한다.\n③ 유한책임회사가 본점이나 지점을 이전하는 경우에는 제182조를 준용한다.\n④ 제1항 각 호의 사항이 변경된 경우에는 본점의 소재지에서 2주일 내에 변경등기를 하여야 한다. <개정 2024.9.20>\n⑤ 유한책임회사의 업무집행자의 업무집행을 정지하거나 직무대행자를 선임하는 가처분을 하거나 그 가처분을 변경 또는 취소하는 경우에는 본점이 있는 곳의 등기소에서 등기하여야 한다. <개정 2024.9.20>\n제287조의5(설립의 등기 등)","kind":"L"},{"id":"L:287-6","label":"법 제287조의6","title":"준용규정","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"제287조의6(준용규정) 유한책임회사의 설립의 무효와 취소에 관하여는 제184조부터 제194조까지의 규정을 준용한다. 이 경우 제184조 중 \"사원\"은 \"사원 및 업무집행자\"로 본다.","kind":"L"},{"id":"L:287-7","label":"법 제287조의7","title":"사원의 책임","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"제287조의7(사원의 책임) 사원의 책임은 이 법에 다른 규정이 있는 경우 외에는 그 출자금액을 한도로 한다.","kind":"L"},{"id":"L:287-8","label":"법 제287조의8","title":"지분의 양도","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"① 사원은 다른 사원의 동의를 받지 아니하면 그 지분의 전부 또는 일부를 타인에게 양도하지 못한다.\n② 제1항에도 불구하고 업무를 집행하지 아니한 사원은 업무를 집행하는 사원 전원의 동의가 있으면 지분의 전부 또는 일부를 타인에게 양도할 수 있다. 다만, 업무를 집행하는 사원이 없는 경우에는 사원 전원의 동의를 받아야 한다.\n③ 제1항과 제2항에도 불구하고 정관으로 그에 관한 사항을 달리 정할 수 있다.\n제287조의8(지분의 양도)","kind":"L"},{"id":"L:287-9","label":"법 제287조의9","title":"유한책임회사에 의한 지분양수의 금지","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"① 유한책임회사는 그 지분의 전부 또는 일부를 양수할 수 없다.\n② 유한책임회사가 지분을 취득하는 경우에 그 지분은 취득한 때에 소멸한다.\n제287조의9(유한책임회사에 의한 지분양수의 금지)","kind":"L"},{"id":"L:287-10","label":"법 제287조의10","title":"업무집행자의 경업 금지","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"① 업무집행자는 사원 전원의 동의를 받지 아니하고는 자기 또는 제3자의 계산으로 회사의 영업부류(營業部類)에 속한 거래를 하지 못하며, 같은 종류의 영업을 목적으로 하는 다른 회사의 업무집행자ㆍ이사 또는 집행임원이 되지 못한다.\n② 업무집행자가 제1항을 위반하여 거래를 한 경우에는 제198조제2항부터 제4항까지의 규정을 준용한다.\n제287조의10(업무집행자의 경업 금지)","kind":"L"},{"id":"L:287-11","label":"법 제287조의11","title":"업무집행자와 유한책임회사 간의 거래","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"제287조의11(업무집행자와 유한책임회사 간의 거래) 업무집행자는 다른 사원 과반수의 결의가 있는 경우에만 자기 또는 제3자의 계산으로 회사와 거래를 할 수 있다. 이 경우에는 「민법」 제124조를 적용하지 아니한다.","kind":"L"},{"id":"L:287-12","label":"법 제287조의12","title":"업무의 집행","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"① 유한책임회사는 정관으로 사원 또는 사원이 아닌 자를 업무집행자로 정하여야 한다.\n② 1명 또는 둘 이상의 업무집행자를 정한 경우에는 업무집행자 각자가 회사의 업무를 집행할 권리와 의무가 있다. 이 경우에는 제201조제2항을 준용한다.\n③ 정관으로 둘 이상을 공동업무집행자로 정한 경우에는 그 전원의 동의가 없으면 업무집행에 관한 행위를 하지 못한다.\n제287조의12(업무의 집행)","kind":"L"},{"id":"L:287-13","label":"법 제287조의13","title":"직무대행자의 권한 등","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"제287조의13(직무대행자의 권한 등) 제287조의5제5항에 따라 선임된 직무대행자의 권한에 대하여는 제200조의2를 준용한다.","kind":"L"},{"id":"L:287-14","label":"법 제287조의14","title":"사원의 감시권","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"제287조의14(사원의 감시권) 업무집행자가 아닌 사원의 감시권에 대하여는 제277조를 준용한다.","kind":"L"},{"id":"L:287-15","label":"법 제287조의15","title":"법인이 업무집행자인 경우의 특칙","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"① 법인이 업무집행자인 경우에는 그 법인은 해당 업무집행자의 직무를 행할 자를 선임하고, 그 자의 성명과 주소를 다른 사원에게 통지하여야 한다.\n② 제1항에 따라 선임된 직무수행자에 대하여는 제287조의11과 제287조의12를 준용한다.\n제287조의15(법인이 업무집행자인 경우의 특칙)","kind":"L"},{"id":"L:287-16","label":"법 제287조의16","title":"정관의 변경","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"제287조의16(정관의 변경) 정관에 다른 규정이 없는 경우 정관을 변경하려면 총사원의 동의가 있어야 한다.","kind":"L"},{"id":"L:287-17","label":"법 제287조의17","title":"업무집행자 등의 권한상실 선고","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"① 업무집행자의 업무집행권한의 상실에 관하여는 제205조를 준용한다.\n② 제1항의 소(訴)는 본점소재지의 지방법원의 관할에 전속한다.\n제287조의17(업무집행자 등의 권한상실 선고)","kind":"L"},{"id":"L:287-18","label":"법 제287조의18","title":"준용규정","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"제287조의18(준용규정) 유한책임회사의 내부관계에 관하여는 정관이나 이 법에 다른 규정이 없으면 합명회사에 관한 규정을 준용한다.","kind":"L"},{"id":"L:287-19","label":"법 제287조의19","title":"유한책임회사의 대표","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"① 업무집행자는 유한책임회사를 대표한다.\n② 업무집행자가 둘 이상인 경우 정관 또는 총사원의 동의로 유한책임회사를 대표할 업무집행자를 정할 수 있다.\n③ 유한책임회사는 정관 또는 총사원의 동의로 둘 이상의 업무집행자가 공동으로 회사를 대표할 것을 정할 수 있다.\n④ 제3항의 경우에 제3자의 유한책임회사에 대한 의사표시는 공동대표의 권한이 있는 자 1인에 대하여 함으로써 그 효력이 생긴다.\n⑤ 유한책임회사를 대표하는 업무집행자에 대하여는 제209조를 준용한다.\n제287조의19(유한책임회사의 대표)","kind":"L"},{"id":"L:287-20","label":"법 제287조의20","title":"손해배상책임","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"제287조의20(손해배상책임) 유한책임회사를 대표하는 업무집행자가 그 업무집행으로 타인에게 손해를 입힌 경우에는 회사는 그 업무집행자와 연대하여 배상할 책임이 있다.","kind":"L"},{"id":"L:287-21","label":"법 제287조의21","title":"유한책임회사와 사원 간의 소","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"제287조의21(유한책임회사와 사원 간의 소) 유한책임회사가 사원(사원이 아닌 업무집행자를 포함한다. 이하 이 조에서 같다)에 대하여 또는 사원이 유한책임회사에 대하여 소를 제기하는 경우에 유한책임회사를 대표할 사원이 없을 때에는 다른 사원 과반수의 결의로 대표할 사원을 선정하여야 한다.","kind":"L"},{"id":"L:287-22","label":"법 제287조의22","title":"대표소송","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"① 사원은 회사에 대하여 업무집행자의 책임을 추궁하는 소의 제기를 청구할 수 있다.\n② 제1항의 소에 관하여는 제403조제2항부터 제4항까지, 제6항, 제7항 및 제404조부터 제406조까지의 규정을 준용한다.\n제287조의22(대표소송)","kind":"L"},{"id":"L:287-23","label":"법 제287조의23","title":"사원의 가입","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"① 유한책임회사는 정관을 변경함으로써 새로운 사원을 가입시킬 수 있다.\n② 제1항에 따른 사원의 가입은 정관을 변경한 때에 효력이 발생한다. 다만, 정관을 변경한 때에 해당 사원이 출자에 관한 납입 또는 재산의 전부 또는 일부의 출자를 이행하지 아니한 경우에는 그 납입 또는 이행을 마친 때에 사원이 된다.\n③ 사원 가입 시 현물출자를 하는 사원에 대하여는 제287조의4제3항을 준용한다.\n제287조의23(사원의 가입)","kind":"L"},{"id":"L:287-24","label":"법 제287조의24","title":"사원의 퇴사권","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"제287조의24(사원의 퇴사권) 사원의 퇴사에 관하여는 정관으로 달리 정하지 아니하는 경우에는 제217조제1항을 준용한다.","kind":"L"},{"id":"L:287-25","label":"법 제287조의25","title":"퇴사 원인","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"제287조의25(퇴사 원인) 사원의 퇴사 원인에 관하여는 제218조를 준용한다.","kind":"L"},{"id":"L:287-26","label":"법 제287조의26","title":"사원사망 시 권리승계의 통지","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"제287조의26(사원사망 시 권리승계의 통지) 사원이 사망한 경우에는 제219조를 준용한다.","kind":"L"},{"id":"L:287-27","label":"법 제287조의27","title":"제명의 선고","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"제287조의27(제명의 선고) 사원의 제명에 관하여는 제220조를 준용한다. 다만, 사원의 제명에 필요한 결의는 정관으로 달리 정할 수 있다.","kind":"L"},{"id":"L:287-28","label":"법 제287조의28","title":"퇴사 사원 지분의 환급","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"① 퇴사 사원은 그 지분의 환급을 금전으로 받을 수 있다.\n② 퇴사 사원에 대한 환급금액은 퇴사 시의 회사의 재산 상황에 따라 정한다.\n③ 퇴사 사원의 지분 환급에 대하여는 정관으로 달리 정할 수 있다.\n제287조의28(퇴사 사원 지분의 환급)","kind":"L"},{"id":"L:287-29","label":"법 제287조의29","title":"지분압류채권자에 의한 퇴사","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"제287조의29(지분압류채권자에 의한 퇴사) 사원의 지분을 압류한 채권자가 그 사원을 퇴사시키는 경우에는 제224조를 준용한다.","kind":"L"},{"id":"L:287-30","label":"법 제287조의30","title":"퇴사 사원의 지분 환급과 채권자의 이의","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"① 유한책임회사의 채권자는 퇴사하는 사원에게 환급하는 금액이 제287조의37에 따른 잉여금을 초과한 경우에는 그 환급에 대하여 회사에 이의를 제기할 수 있다.\n② 제1항의 이의제기에 관하여는 제232조를 준용한다. 다만, 제232조제3항은 지분을 환급하더라도 채권자에게 손해를 끼칠 우려가 없는 경우에는 준용하지 아니한다.\n제287조의30(퇴사 사원의 지분 환급과 채권자의 이의)","kind":"L"},{"id":"L:287-31","label":"법 제287조의31","title":"퇴사 사원의 상호변경 청구권","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"제287조의31(퇴사 사원의 상호변경 청구권) 퇴사한 사원의 성명이 유한책임회사의 상호 중에 사용된 경우에는 그 사원은 유한책임회사에 대하여 그 사용의 폐지를 청구할 수 있다.","kind":"L"},{"id":"L:287-32","label":"법 제287조의32","title":"회계 원칙","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"제287조의32(회계 원칙) 유한책임회사의 회계는 이 법과 대통령령으로 규정한 것 외에는 일반적으로 공정하고 타당한 회계관행에 따른다.","kind":"L"},{"id":"L:287-33","label":"법 제287조의33","title":"재무제표의 작성 및 보존","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"제287조의33(재무제표의 작성 및 보존) 업무집행자는 결산기마다 대차대조표, 손익계산서, 그 밖에 유한책임회사의 재무상태와 경영성과를 표시하는 것으로서 대통령령으로 정하는 서류를 작성하여야 한다.","kind":"L"},{"id":"L:287-34","label":"법 제287조의34","title":"재무제표의 비치ㆍ공시","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"① 업무집행자는 제287조의33에 규정된 서류를 본점에 5년간 갖추어 두어야 하고, 그 등본을 지점에 3년간 갖추어 두어야 한다.\n② 사원과 유한책임회사의 채권자는 회사의 영업시간 내에는 언제든지 제287조의33에 따라 작성된 재무제표(財務諸表)의 열람과 등사를 청구할 수 있다.\n제287조의34(재무제표의 비치ㆍ공시)","kind":"L"},{"id":"L:287-35","label":"법 제287조의35","title":"자본금의 액","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"제287조의35(자본금의 액) 사원이 출자한 금전이나 그 밖의 재산의 가액을 유한책임회사의 자본금으로 한다.","kind":"L"},{"id":"L:287-36","label":"법 제287조의36","title":"자본금의 감소","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"① 유한책임회사는 정관 변경의 방법으로 자본금을 감소할 수 있다.\n② 제1항의 경우에는 제232조를 준용한다. 다만, 감소 후의 자본금의 액이 순자산액 이상인 경우에는 그러하지 아니하다.\n제287조의36(자본금의 감소)","kind":"L"},{"id":"L:287-37","label":"법 제287조의37","title":"잉여금의 분배","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"① 유한책임회사는 대차대조표상의 순자산액으로부터 자본금의 액을 뺀 액(이하 이 조에서 \"잉여금\"이라 한다)을 한도로 하여 잉여금을 분배할 수 있다.\n② 제1항을 위반하여 잉여금을 분배한 경우에는 유한책임회사의 채권자는 그 잉여금을 분배받은 자에 대하여 회사에 반환할 것을 청구할 수 있다.\n③ 제2항의 청구에 관한 소는 본점소재지의 지방법원의 관할에 전속한다.\n④ 잉여금은 정관에 다른 규정이 없으면 각 사원이 출자한 가액에 비례하여 분배한다.\n⑤ 잉여금의 분배를 청구하는 방법이나 그 밖에 잉여금의 분배에 관한 사항은 정관으로 정할 수 있다.\n⑥ 사원의 지분의 압류는 잉여금의 배당을 청구하는 권리에 대하여도 그 효력이 있다.\n제287조의37(잉여금의 분배)","kind":"L"},{"id":"L:287-38","label":"법 제287조의38","title":"해산 원인","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"1. 제227조제1호ㆍ제2호 및 제4호부터 제6호까지에서 규정한 사항에 해당하는 경우\n2. 사원이 없게 된 경우\n제287조의38(해산 원인) 유한책임회사는 다음 각 호의 어느 하나에 해당하는 사유로 해산한다.","kind":"L"},{"id":"L:287-39","label":"법 제287조의39","title":"해산등기","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"제287조의39(해산등기) 유한책임회사가 해산된 경우에는 합병과 파산의 경우 외에는 그 해산사유가 있었던 날부터 2주일 내에 본점의 소재지에서 해산등기를 하여야 한다. <개정 2024.9.20>","kind":"L"},{"id":"L:287-40","label":"법 제287조의40","title":"유한책임회사의 계속","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"제287조의40(유한책임회사의 계속) 제287조의38의 해산 원인 중 제227조제1호 및 제2호의 경우에는 제229조제1항 및 제3항을 준용한다.","kind":"L"},{"id":"L:287-41","label":"법 제287조의41","title":"유한책임회사의 합병","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"제287조의41(유한책임회사의 합병) 유한책임회사의 합병에 관하여는 제230조, 제232조부터 제240조까지의 규정을 준용한다.","kind":"L"},{"id":"L:287-42","label":"법 제287조의42","title":"해산청구","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"제287조의42(해산청구) 유한책임회사의 사원이 해산을 청구하는 경우에는 제241조를 준용한다.","kind":"L"},{"id":"L:287-43","label":"법 제287조의43","title":"조직의 변경","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"① 주식회사는 총회에서 총주주의 동의로 결의한 경우에는 그 조직을 변경하여 이 장에 따른 유한책임회사로 할 수 있다.\n② 유한책임회사는 총사원의 동의에 의하여 주식회사로 변경할 수 있다.\n제287조의43(조직의 변경)","kind":"L"},{"id":"L:287-44","label":"법 제287조의44","title":"준용규정","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"제287조의44(준용규정) 유한책임회사의 조직의 변경에 관하여는 제232조 및 제604조부터 제607조까지의 규정을 준용한다.","kind":"L"},{"id":"L:287-45","label":"법 제287조의45","title":"청산","chapter":"제3편 회사 제3장의2 유한책임회사","deleted":false,"text":"제287조의45(청산) 유한책임회사의 청산(淸算)에 관하여는 제245조, 제246조, 제251조부터 제257조까지 및 제259조부터 제267조까지의 규정을 준용한다.","kind":"L"},{"id":"L:288","label":"법 제288조","title":"발기인","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제288조(발기인) 주식회사를 설립함에는 발기인이 정관을 작성하여야 한다.","kind":"L"},{"id":"L:289","label":"법 제289조","title":"정관의 작성, 절대적 기재사항","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①발기인은 정관을 작성하여 다음의 사항을 적고 각 발기인이 기명날인 또는 서명하여야 한다. <개정 1984.4.10, 1995.12.29, 2001.7.24, 2011.4.14>\n1. 목적\n2. 상호\n3. 회사가 발행할 주식의 총수\n4. 액면주식을 발행하는 경우 1주의 금액\n5. 회사의 설립 시에 발행하는 주식의 총수\n6. 본점의 소재지\n7. 회사가 공고를 하는 방법\n8. 발기인의 성명ㆍ주민등록번호 및 주소\n9. 삭제<1984.4.10>\n② 삭제 <2011.4.14>\n③ 회사의 공고는 관보 또는 시사에 관한 사항을 게재하는 일간신문에 하여야 한다. 다만, 회사는 그 공고를 정관으로 정하는 바에 따라 전자적 방법으로 할 수 있다. <개정 2009.5.28>\n④ 회사는 제3항에 따라 전자적 방법으로 공고할 경우 대통령령으로 정하는 기간까지 계속 공고하고, 재무제표를 전자적 방법으로 공고할 경우에는 제450조에서 정한 기간까지 계속 공고하여야 한다. 다만, 공고기간 이후에도 누구나 그 내용을 열람할 수 있도록 하여야 한다. <신설 2009.5.28>\n⑤ 회사가 전자적 방법으로 공고를 할 경우에는 게시 기간과 게시 내용에 대하여 증명하여야 한다. <신설 2009.5.28>\n⑥ 회사의 전자적 방법으로 하는 공고에 관하여 필요한 사항은 대통령령으로 정한다. <신설 2009.5.28>\n제289조(정관의 작성, 절대적 기재사항)","kind":"L"},{"id":"L:290","label":"법 제290조","title":"변태설립사항","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"1. 발기인이 받을 특별이익과 이를 받을 자의 성명\n2. 현물출자를 하는 자의 성명과 그 목적인 재산의 종류, 수량, 가격과 이에 대하여 부여할 주식의 종류와 수\n3. 회사성립후에 양수할 것을 약정한 재산의 종류, 수량, 가격과 그 양도인의 성명\n4. 회사가 부담할 설립비용과 발기인이 받을 보수액\n제290조(변태설립사항) 다음의 사항은 정관에 기재함으로써 그 효력이 있다.","kind":"L"},{"id":"L:291","label":"법 제291조","title":"설립 당시의 주식발행사항의 결정","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"1. 주식의 종류와 수\n2. 액면주식의 경우에 액면 이상의 주식을 발행할 때에는 그 수와 금액\n3. 무액면주식을 발행하는 경우에는 주식의 발행가액과 주식의 발행가액 중 자본금으로 계상하는 금액\n제291조(설립 당시의 주식발행사항의 결정) 회사설립 시에 발행하는 주식에 관하여 다음의 사항은 정관으로 달리 정하지 아니하면 발기인 전원의 동의로 이를 정한다.","kind":"L"},{"id":"L:292","label":"법 제292조","title":"정관의 효력발생","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제292조(정관의 효력발생) 정관은 공증인의 인증을 받음으로써 효력이 생긴다. 다만, 자본금 총액이 10억원 미만인 회사를 제295조제1항에 따라 발기설립(發起設立)하는 경우에는 제289조제1항에 따라 각 발기인이 정관에 기명날인 또는 서명함으로써 효력이 생긴다.","kind":"L"},{"id":"L:293","label":"법 제293조","title":"발기인의 주식인수","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제293조(발기인의 주식인수) 각 발기인은 서면에 의하여 주식을 인수하여야 한다.","kind":"L"},{"id":"L:294","label":"법 제294조","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제294조 삭제 <1995.12.29>","kind":"L"},{"id":"L:295","label":"법 제295조","title":"발기설립의 경우의 납입과 현물출자의 이행","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①발기인이 회사의 설립 시에 발행하는 주식의 총수를 인수한 때에는 지체없이 각 주식에 대하여 그 인수가액의 전액을 납입하여야 한다. 이 경우 발기인은 납입을 맡을 은행 기타 금융기관과 납입장소를 지정하여야 한다. <개정 1995.12.29>\n②현물출자를 하는 발기인은 납입기일에 지체없이 출자의 목적인 재산을 인도하고 등기, 등록 기타 권리의 설정 또는 이전을 요할 경우에는 이에 관한 서류를 완비하여 교부하여야 한다.\n제295조(발기설립의 경우의 납입과 현물출자의 이행)","kind":"L"},{"id":"L:296","label":"법 제296조","title":"발기설립의 경우의 임원선임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①전조의 규정에 의한 납입과 현물출자의 이행이 완료된 때에는 발기인은 지체없이 의결권의 과반수로 이사와 감사를 선임하여야 한다.\n②발기인의 의결권은 그 인수주식의 1주에 대하여 1개로 한다.\n제296조(발기설립의 경우의 임원선임)","kind":"L"},{"id":"L:297","label":"법 제297조","title":"발기인의 의사록작성","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제297조(발기인의 의사록작성) 발기인은 의사록을 작성하여 의사의 경과와 그 결과를 기재하고 기명날인 또는 서명하여야 한다. <개정 1995.12.29>","kind":"L"},{"id":"L:298","label":"법 제298조","title":"이사ㆍ감사의 조사ㆍ보고와 검사인의 선임청구","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①이사와 감사는 취임후 지체없이 회사의 설립에 관한 모든 사항이 법령 또는 정관의 규정에 위반되지 아니하는지의 여부를 조사하여 발기인에게 보고하여야 한다.\n②이사와 감사중 발기인이었던 자ㆍ현물출자자 또는 회사성립후 양수할 재산의 계약당사자인 자는 제1항의 조사ㆍ보고에 참가하지 못한다.\n③이사와 감사의 전원이 제2항에 해당하는 때에는 이사는 공증인으로 하여금 제1항의 조사ㆍ보고를 하게 하여야 한다.\n④정관으로 제290조 각호의 사항을 정한 때에는 이사는 이에 관한 조사를 하게 하기 위하여 검사인의 선임을 법원에 청구하여야 한다. 다만, 제299조의2의 경우에는 그러하지 아니하다.\n제298조(이사ㆍ감사의 조사ㆍ보고와 검사인의 선임청구)","kind":"L"},{"id":"L:299","label":"법 제299조","title":"검사인의 조사, 보고","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 검사인은 제290조 각 호의 사항과 제295조에 따른 현물출자의 이행을 조사하여 법원에 보고하여야 한다.\n② 제1항은 다음 각 호의 어느 하나에 해당할 경우에는 적용하지 아니한다.\n1. 제290조제2호 및 제3호의 재산총액이 자본금의 5분의 1을 초과하지 아니하고 대통령령으로 정한 금액을 초과하지 아니하는 경우\n2. 제290조제2호 또는 제3호의 재산이 거래소에서 시세가 있는 유가증권인 경우로서 정관에 적힌 가격이 대통령령으로 정한 방법으로 산정된 시세를 초과하지 아니하는 경우\n3. 그 밖에 제1호 및 제2호에 준하는 경우로서 대통령령으로 정하는 경우\n③ 검사인은 제1항의 조사보고서를 작성한 후 지체 없이 그 등본을 각 발기인에게 교부하여야 한다.\n④ 검사인의 조사보고서에 사실과 다른 사항이 있는 경우에는 발기인은 이에 대한 설명서를 법원에 제출할 수 있다.\n제299조(검사인의 조사, 보고)","kind":"L"},{"id":"L:299-2","label":"법 제299조의2","title":"현물출자 등의 증명","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제299조의2(현물출자 등의 증명) 제290조제1호 및 제4호에 기재한 사항에 관하여는 공증인의 조사ㆍ보고로, 제290조제2호 및 제3호의 규정에 의한 사항과 제295조의 규정에 의한 현물출자의 이행에 관하여는 공인된 감정인의 감정으로 제299조제1항의 규정에 의한 검사인의 조사에 갈음할 수 있다. 이 경우 공증인 또는 감정인은 조사 또는 감정결과를 법원에 보고하여야 한다. <개정 1998.12.28>","kind":"L"},{"id":"L:300","label":"법 제300조","title":"법원의 변경처분","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①법원은 검사인 또는 공증인의 조사보고서 또는 감정인의 감정결과와 발기인의 설명서를 심사하여 제290조의 규정에 의한 사항을 부당하다고 인정한 때에는 이를 변경하여 각 발기인에게 통고할 수 있다. <개정 1998.12.28>\n②제1항의 변경에 불복하는 발기인은 그 주식의 인수를 취소할 수 있다. 이 경우에는 정관을 변경하여 설립에 관한 절차를 속행할 수 있다. <개정 1998.12.28>\n③법원의 통고가 있은 후 2주내에 주식의 인수를 취소한 발기인이 없는 때에는 정관은 통고에 따라서 변경된 것으로 본다. <개정 1998.12.28>\n제300조(법원의 변경처분)","kind":"L"},{"id":"L:301","label":"법 제301조","title":"모집설립의 경우의 주주모집","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제301조(모집설립의 경우의 주주모집) 발기인이 회사의 설립시에 발행하는 주식의 총수를 인수하지 아니하는 때에는 주주를 모집하여야 한다.","kind":"L"},{"id":"L:302","label":"법 제302조","title":"주식인수의 청약, 주식청약서의 기재사항","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주식인수의 청약을 하고자 하는 자는 주식청약서 2통에 인수할 주식의 종류 및 수와 주소를 기재하고 기명날인 또는 서명하여야 한다. <개정 1995.12.29>\n②주식청약서는 발기인이 작성하고 다음의 사항을 적어야 한다. <개정 1962.12.12, 1984.4.10, 1995.12.29, 2011.4.14>\n1. 정관의 인증연월일과 공증인의 성명\n2. 제289조제1항과 제290조에 게기한 사항\n3. 회사의 존립기간 또는 해산사유를 정한 때에는 그 규정\n4. 각 발기인이 인수한 주식의 종류와 수\n5. 제291조에 게기한 사항\n5의2. 주식의 양도에 관하여 이사회의 승인을 얻도록 정한 때에는 그 규정\n6. 삭제<2011.4.14>\n7. 주주에게 배당할 이익으로 주식을 소각할 것을 정한 때에는 그 규정\n8. 일정한 시기까지 창립총회를 종결하지 아니한 때에는 주식의 인수를 취소할 수 있다는 뜻\n9. 납입을 맡을 은행 기타 금융기관과 납입장소\n10. 명의개서대리인을 둔 때에는 그 성명ㆍ주소 및 영업소\n③민법 제107조제1항 단서의 규정은 주식인수의 청약에는 적용하지 아니한다. <개정 1962.12.12>\n제302조(주식인수의 청약, 주식청약서의 기재사항)","kind":"L"},{"id":"L:303","label":"법 제303조","title":"주식인수인의 의무","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제303조(주식인수인의 의무) 주식인수를 청약한 자는 발기인이 배정한 주식의 수에 따라서 인수가액을 납입할 의무를 부담한다.","kind":"L"},{"id":"L:304","label":"법 제304조","title":"주식인수인 등에 대한 통지, 최고","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주식인수인 또는 주식청약인에 대한 통지나 최고는 주식인수증 또는 주식청약서에 기재한 주소 또는 그 자로부터 회사에 통지한 주소로 하면 된다.\n②전항의 통지 또는 최고는 보통 그 도달할 시기에 도달한 것으로 본다.\n제304조(주식인수인 등에 대한 통지, 최고)","kind":"L"},{"id":"L:305","label":"법 제305조","title":"주식에 대한 납입","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사설립시에 발행하는 주식의 총수가 인수된 때에는 발기인은 지체없이 주식인수인에 대하여 각 주식에 대한 인수가액의 전액을 납입시켜야 한다.\n②전항의 납입은 주식청약서에 기재한 납입장소에서 하여야 한다.\n③제295조제2항의 규정은 제1항의 경우에 준용한다.\n제305조(주식에 대한 납입)","kind":"L"},{"id":"L:306","label":"법 제306조","title":"납입금의 보관자 등의 변경","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제306조(납입금의 보관자 등의 변경) 납입금의 보관자 또는 납입장소를 변경할 때에는 법원의 허가를 얻어야 한다.","kind":"L"},{"id":"L:307","label":"법 제307조","title":"주식인수인의 실권절차","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주식인수인이 제305조의 규정에 의한 납입을 하지 아니한 때에는 발기인은 일정한 기일을 정하여 그 기일내에 납입을 하지 아니하면 그 권리를 잃는다는 뜻을 기일의 2주간전에 그 주식인수인에게 통지하여야 한다.\n②전항의 통지를 받은 주식인수인이 그 기일내에 납입의 이행을 하지 아니한 때에는 그 권리를 잃는다. 이 경우에는 발기인은 다시 그 주식에 대한 주주를 모집할 수 있다.\n③전2항의 규정은 그 주식인수인에 대한 손해배상의 청구에 영향을 미치지 아니한다.\n제307조(주식인수인의 실권절차)","kind":"L"},{"id":"L:308","label":"법 제308조","title":"창립총회","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①제305조의 규정에 의한 납입과 현물출자의 이행을 완료한 때에는 발기인은 지체없이 창립총회를 소집하여야 한다.\n②제363조제1항ㆍ제2항, 제364조, 제368조제2항ㆍ제3항, 제368조의2, 제369조제1항, 제371조제2항, 제372조, 제373조, 제376조 내지 제381조와 제435조의 규정은 창립총회에 준용한다. <개정 1984.4.10, 2014.5.20>\n제308조(창립총회)","kind":"L"},{"id":"L:309","label":"법 제309조","title":"창립총회의 결의","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제309조(창립총회의 결의) 창립총회의 결의는 출석한 주식인수인의 의결권의 3분의 2 이상이며 인수된 주식의 총수의 과반수에 해당하는 다수로 하여야 한다.","kind":"L"},{"id":"L:310","label":"법 제310조","title":"변태설립의 경우의 조사","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①정관으로 제290조에 게기한 사항을 정한 때에는 발기인은 이에 관한 조사를 하게 하기 위하여 검사인의 선임을 법원에 청구하여야 한다.\n②전항의 검사인의 보고서는 이를 창립총회에 제출하여야 한다.\n③제298조제4항 단서 및 제299조의2의 규정은 제1항의 조사에 관하여 이를 준용한다. <신설 1995.12.29>\n제310조(변태설립의 경우의 조사)","kind":"L"},{"id":"L:311","label":"법 제311조","title":"발기인의 보고","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①발기인은 회사의 창립에 관한 사항을 서면에 의하여 창립총회에 보고하여야 한다.\n②전항의 보고서에는 다음의 사항을 명확히 기재하여야 한다.\n1. 주식인수와 납입에 관한 제반상황\n2. 제290조에 게기한 사항에 관한 실태\n제311조(발기인의 보고)","kind":"L"},{"id":"L:312","label":"법 제312조","title":"임원의 선임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제312조(임원의 선임) 창립총회에서는 이사와 감사를 선임하여야 한다.","kind":"L"},{"id":"L:313","label":"법 제313조","title":"이사, 감사의 조사, 보고","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①이사와 감사는 취임후 지체없이 회사의 설립에 관한 모든 사항이 법령 또는 정관의 규정에 위반되지 아니하는지의 여부를 조사하여 창립총회에 보고하여야 한다. <개정 1962.12.12, 1995.12.29>\n②제298조제2항 및 제3항의 규정은 제1항의 조사와 보고에 관하여 이를 준용한다. <개정 1995.12.29>\n③ 삭제 <1995.12.29>\n제313조(이사, 감사의 조사, 보고)","kind":"L"},{"id":"L:314","label":"법 제314조","title":"변태설립사항의 변경","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①창립총회에서는 제290조에 게기한 사항이 부당하다고 인정한 때에는 이를 변경할 수 있다.\n②제300조제2항과 제3항의 규정은 전항의 경우에 준용한다.\n제314조(변태설립사항의 변경)","kind":"L"},{"id":"L:315","label":"법 제315조","title":"발기인에 대한 손해배상청구","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제315조(발기인에 대한 손해배상청구) 전조의 규정은 발기인에 대한 손해배상의 청구에 영향을 미치지 아니한다.","kind":"L"},{"id":"L:316","label":"법 제316조","title":"정관변경, 설립폐지의 결의","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①창립총회에서는 정관의 변경 또는 설립의 폐지를 결의할 수 있다.\n②전항의 결의는 소집통지서에 그 뜻의 기재가 없는 경우에도 이를 할 수 있다.\n제316조(정관변경, 설립폐지의 결의)","kind":"L"},{"id":"L:317","label":"법 제317조","title":"설립의 등기","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주식회사의 설립등기는 발기인이 회사설립시에 발행한 주식의 총수를 인수한 경우에는 제299조와 제300조의 규정에 의한 절차가 종료한 날로부터, 발기인이 주주를 모집한 경우에는 창립총회가 종결한 날 또는 제314조의 규정에 의한 절차가 종료한 날로부터 2주간내에 이를 하여야 한다.\n②제1항의 설립등기에 있어서는 다음의 사항을 등기하여야 한다. <개정 1962.12.12, 1984.4.10, 1995.12.29, 1999.12.31, 2009.1.30, 2011.4.14>\n1. 제289조제1항제1호 내지 제4호, 제6호와 제7호에 게기한 사항\n2. 자본금의 액\n3. 발행주식의 총수, 그 종류와 각종주식의 내용과 수\n3의2. 주식의 양도에 관하여 이사회의 승인을 얻도록 정한 때에는 그 규정\n3의3. 주식매수선택권을 부여하도록 정한 때에는 그 규정\n3의4. 지점의 소재지\n4. 회사의 존립기간 또는 해산사유를 정한 때에는 그 기간 또는 사유\n5. 삭제<2011.4.14>\n6. 주주에게 배당할 이익으로 주식을 소각할 것을 정한 때에는 그 규정\n7. 전환주식을 발행하는 경우에는 제347조에 게기한 사항\n8. 사내이사, 사외이사, 그 밖에 상무에 종사하지 아니하는 이사, 감사 및 집행임원의 성명과 주민등록번호\n9. 회사를 대표할 이사 또는 집행임원의 성명ㆍ주민등록번호 및 주소\n10. 둘 이상의 대표이사 또는 대표집행임원이 공동으로 회사를 대표할 것을 정한 경우에는 그 규정\n11. 명의개서대리인을 둔 때에는 그 상호 및 본점소재지\n12. 감사위원회를 설치한 때에는 감사위원회 위원의 성명 및 주민등록번호\n③ 삭제 <2024.9.20>\n④제181조 내지 제183조의 규정은 주식회사의 등기에 준용한다.\n제317조(설립의 등기)","kind":"L"},{"id":"L:318","label":"법 제318조","title":"납입금 보관자의 증명과 책임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 납입금을 보관한 은행이나 그 밖의 금융기관은 발기인 또는 이사의 청구를 받으면 그 보관금액에 관하여 증명서를 발급하여야 한다.\n② 제1항의 은행이나 그 밖의 금융기관은 증명한 보관금액에 대하여는 납입이 부실하거나 그 금액의 반환에 제한이 있다는 것을 이유로 회사에 대항하지 못한다.\n③ 자본금 총액이 10억원 미만인 회사를 제295조제1항에 따라 발기설립하는 경우에는 제1항의 증명서를 은행이나 그 밖의 금융기관의 잔고증명서로 대체할 수 있다.\n제318조(납입금 보관자의 증명과 책임)","kind":"L"},{"id":"L:319","label":"법 제319조","title":"권리주의 양도","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제319조(권리주의 양도) 주식의 인수로 인한 권리의 양도는 회사에 대하여 효력이 없다.","kind":"L"},{"id":"L:320","label":"법 제320조","title":"주식인수의 무효 주장, 취소의 제한","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사성립후에는 주식을 인수한 자는 주식청약서의 요건의 흠결을 이유로 하여 그 인수의 무효를 주장하거나 사기, 강박 또는 착오를 이유로 하여 그 인수를 취소하지 못한다.\n②창립총회에 출석하여 그 권리를 행사한 자는 회사의 성립전에도 전항과 같다.\n제320조(주식인수의 무효 주장, 취소의 제한)","kind":"L"},{"id":"L:321","label":"법 제321조","title":"발기인의 인수, 납입담보책임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사설립시에 발행한 주식으로서 회사성립후에 아직 인수되지 아니한 주식이 있거나 주식인수의 청약이 취소된 때에는 발기인이 이를 공동으로 인수한 것으로 본다.\n②회사성립후 제295조제1항 또는 제305조제1항의 규정에 의한 납입을 완료하지 아니한 주식이 있는 때에는 발기인은 연대하여 그 납입을 하여야 한다.\n③제315조의 규정은 전2항의 경우에 준용한다.\n제321조(발기인의 인수, 납입담보책임)","kind":"L"},{"id":"L:322","label":"법 제322조","title":"발기인의 손해배상책임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①발기인이 회사의 설립에 관하여 그 임무를 해태한 때에는 그 발기인은 회사에 대하여 연대하여 손해를 배상할 책임이 있다.\n②발기인이 악의 또는 중대한 과실로 인하여 그 임무를 해태한 때에는 그 발기인은 제3자에 대하여도 연대하여 손해를 배상할 책임이 있다.\n제322조(발기인의 손해배상책임)","kind":"L"},{"id":"L:323","label":"법 제323조","title":"발기인, 임원의 연대책임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제323조(발기인, 임원의 연대책임) 이사 또는 감사가 제313조제1항의 규정에 의한 임무를 해태하여 회사 또는 제3자에 대하여 손해를 배상할 책임을 지는 경우에 발기인도 책임을 질때에는 그 이사, 감사와 발기인은 연대하여 손해를 배상할 책임이 있다.","kind":"L"},{"id":"L:324","label":"법 제324조","title":"발기인의 책임면제, 주주의 대표소송","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제324조(발기인의 책임면제, 주주의 대표소송) 제400조, 제403조부터 제406조까지 및 제406조의2는 발기인에 준용한다. <개정 2020.12.29>","kind":"L"},{"id":"L:325","label":"법 제325조","title":"검사인의 손해배상책임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제325조(검사인의 손해배상책임) 법원이 선임한 검사인이 악의 또는 중대한 과실로 인하여 그 임무를 해태한 때에는 회사 또는 제3자에 대하여 손해를 배상할 책임이 있다.","kind":"L"},{"id":"L:326","label":"법 제326조","title":"회사불성립의 경우의 발기인의 책임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사가 성립하지 못한 경우에는 발기인은 그 설립에 관한 행위에 대하여 연대하여 책임을 진다.\n②전항의 경우에 회사의 설립에 관하여 지급한 비용은 발기인이 부담한다.\n제326조(회사불성립의 경우의 발기인의 책임)","kind":"L"},{"id":"L:327","label":"법 제327조","title":"유사발기인의 책임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제327조(유사발기인의 책임) 주식청약서 기타 주식모집에 관한 서면에 성명과 회사의 설립에 찬조하는 뜻을 기재할 것을 승낙한 자는 발기인과 동일한 책임이 있다.","kind":"L"},{"id":"L:328","label":"법 제328조","title":"설립무효의 소","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사설립의 무효는 주주ㆍ이사 또는 감사에 한하여 회사성립의 날로부터 2년내에 소만으로 이를 주장할 수 있다. <개정 1984.4.10>\n②제186조 내지 제193조의 규정은 제1항의 소에 준용한다. <개정 1984.4.10>\n제328조(설립무효의 소)","kind":"L"},{"id":"L:329","label":"법 제329조","title":"자본금의 구성","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 회사는 정관으로 정한 경우에는 주식의 전부를 무액면주식으로 발행할 수 있다. 다만, 무액면주식을 발행하는 경우에는 액면주식을 발행할 수 없다.\n② 액면주식의 금액은 균일하여야 한다.\n③ 액면주식 1주의 금액은 100원 이상으로 하여야 한다.\n④ 회사는 정관으로 정하는 바에 따라 발행된 액면주식을 무액면주식으로 전환하거나 무액면주식을 액면주식으로 전환할 수 있다.\n⑤ 제4항의 경우에는 제440조, 제441조 본문 및 제442조를 준용한다.\n제329조(자본금의 구성)","kind":"L"},{"id":"L:329-2","label":"법 제329조의2","title":"주식의 분할","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사는 제434조의 규정에 의한 주주총회의 결의로 주식을 분할할 수 있다.\n② 제1항의 경우에 분할 후의 액면주식 1주의 금액은 제329조제3항에 따른 금액 미만으로 하지 못한다. <개정 2011.4.14>\n③제440조부터 제443조까지의 규정은 제1항의 규정에 의한 주식분할의 경우에 이를 준용한다. <개정 2014.5.20>\n제329조의2(주식의 분할)","kind":"L"},{"id":"L:330","label":"법 제330조","title":"액면미달발행의 제한","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제330조(액면미달발행의 제한) 주식은 액면미달의 가액으로 발행하지 못한다. 그러나 제417조의 경우에는 그러하지 아니하다. <개정 1962.12.12>","kind":"L"},{"id":"L:331","label":"법 제331조","title":"주주의 책임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제331조(주주의 책임) 주주의 책임은 그가 가진 주식의 인수가액을 한도로 한다.","kind":"L"},{"id":"L:332","label":"법 제332조","title":"가설인, 타인의 명의에 의한 인수인의 책임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①가설인의 명의로 주식을 인수하거나 타인의 승낙없이 그 명의로 주식을 인수한 자는 주식인수인으로서의 책임이 있다.\n②타인의 승낙을 얻어 그 명의로 주식을 인수한 자는 그 타인과 연대하여 납입할 책임이 있다.\n제332조(가설인, 타인의 명의에 의한 인수인의 책임)","kind":"L"},{"id":"L:333","label":"법 제333조","title":"주식의 공유","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①수인이 공동으로 주식을 인수한 자는 연대하여 납입할 책임이 있다.\n②주식이 수인의 공유에 속하는 때에는 공유자는 주주의 권리를 행사할 자 1인을 정하여야 한다.\n③주주의 권리를 행사할 자가 없는 때에는 공유자에 대한 통지나 최고는 그 1인에 대하여 하면 된다.\n제333조(주식의 공유)","kind":"L"},{"id":"L:334","label":"법 제334조","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제334조 삭제 <2011.4.14>","kind":"L"},{"id":"L:335","label":"법 제335조","title":"주식의 양도성","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 주식은 타인에게 양도할 수 있다. 다만, 회사는 정관으로 정하는 바에 따라 그 발행하는 주식의 양도에 관하여 이사회의 승인을 받도록 할 수 있다. <개정 2011.4.14>\n②제1항 단서의 규정에 위반하여 이사회의 승인을 얻지 아니한 주식의 양도는 회사에 대하여 효력이 없다. <신설 1995.12.29>\n③주권발행전에 한 주식의 양도는 회사에 대하여 효력이 없다. 그러나 회사성립후 또는 신주의 납입기일후 6월이 경과한 때에는 그러하지 아니하다. <개정 1984.4.10>\n제335조(주식의 양도성)","kind":"L"},{"id":"L:335-2","label":"법 제335조의2","title":"양도승인의 청구","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주식의 양도에 관하여 이사회의 승인을 얻어야 하는 경우에는 주식을 양도하고자 하는 주주는 회사에 대하여 양도의 상대방 및 양도하고자 하는 주식의 종류와 수를 기재한 서면으로 양도의 승인을 청구할 수 있다.\n②회사는 제1항의 청구가 있는 날부터 1월 이내에 주주에게 그 승인여부를 서면으로 통지하여야 한다.\n③회사가 제2항의 기간내에 주주에게 거부의 통지를 하지 아니한 때에는 주식의 양도에 관하여 이사회의 승인이 있는 것으로 본다.\n④제2항의 양도승인거부의 통지를 받은 주주는 통지를 받은 날부터 20일내에 회사에 대하여 양도의 상대방의 지정 또는 그 주식의 매수를 청구할 수 있다.\n제335조의2(양도승인의 청구)","kind":"L"},{"id":"L:335-3","label":"법 제335조의3","title":"양도상대방의 지정청구","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주주가 양도의 상대방을 지정하여 줄 것을 청구한 경우에는 이사회는 이를 지정하고, 그 청구가 있은 날부터 2주간내에 주주 및 지정된 상대방에게 서면으로 이를 통지하여야 한다.\n②제1항의 기간내에 주주에게 상대방지정의 통지를 하지 아니한 때에는 주식의 양도에 관하여 이사회의 승인이 있는 것으로 본다.\n제335조의3(양도상대방의 지정청구)","kind":"L"},{"id":"L:335-4","label":"법 제335조의4","title":"지정된 자의 매도청구권","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①제335조의3제1항의 규정에 의하여 상대방으로 지정된 자는 지정통지를 받은 날부터 10일 이내에 지정청구를 한 주주에 대하여 서면으로 그 주식을 자기에게 매도할 것을 청구할 수 있다.\n②제335조의3제2항의 규정은 주식의 양도상대방으로 지정된 자가 제1항의 기간내에 매도의 청구를 하지 아니한 때에 이를 준용한다.\n제335조의4(지정된 자의 매도청구권)","kind":"L"},{"id":"L:335-5","label":"법 제335조의5","title":"매도가액의 결정","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①제335조의4의 경우에 그 주식의 매도가액은 주주와 매도청구인간의 협의로 이를 결정한다. <개정 2001.7.24>\n②제374조의2제4항 및 제5항의 규정은 제335조의4제1항의 규정에 의한 청구를 받은 날부터 30일 이내에 제1항의 규정에 의한 협의가 이루어지지 아니하는 경우에 이를 준용한다. <개정 2001.7.24>\n제335조의5(매도가액의 결정)","kind":"L"},{"id":"L:335-6","label":"법 제335조의6","title":"주식의 매수청구","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제335조의6(주식의 매수청구) 제374조의2제2항 내지 제5항의 규정은 제335조의2제4항의 규정에 의하여 주주가 회사에 대하여 주식의 매수를 청구한 경우에 이를 준용한다. <개정 2001.7.24>","kind":"L"},{"id":"L:335-7","label":"법 제335조의7","title":"주식의 양수인에 의한 승인청구","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주식의 양도에 관하여 이사회의 승인을 얻어야 하는 경우에 주식을 취득한 자는 회사에 대하여 그 주식의 종류와 수를 기재한 서면으로 그 취득의 승인을 청구할 수 있다.\n②제335조의2제2항 내지 제4항, 제335조의3 내지 제335조의6의 규정은 제1항의 경우에 이를 준용한다.\n제335조의7(주식의 양수인에 의한 승인청구)","kind":"L"},{"id":"L:336","label":"법 제336조","title":"주식의 양도방법","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주식의 양도에 있어서는 주권을 교부하여야 한다.\n②주권의 점유자는 이를 적법한 소지인으로 추정한다.\n제336조(주식의 양도방법)","kind":"L"},{"id":"L:337","label":"법 제337조","title":"주식의 이전의 대항요건","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주식의 이전은 취득자의 성명과 주소를 주주명부에 기재하지 아니하면 회사에 대항하지 못한다. <개정 2014.5.20>\n②회사는 정관이 정하는 바에 의하여 명의개서대리인을 둘 수 있다. 이 경우 명의개서대리인이 취득자의 성명과 주소를 주주명부의 복본에 기재한 때에는 제1항의 명의개서가 있는 것으로 본다. <신설 1984.4.10>\n제337조(주식의 이전의 대항요건)","kind":"L"},{"id":"L:338","label":"법 제338조","title":"주식의 입질","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주식을 질권의 목적으로 하는 때에는 주권을 질권자에게 교부하여야 한다. <개정 2014.5.20>\n②질권자는 계속하여 주권을 점유하지 아니하면 그 질권으로써 제3자에게 대항하지 못한다.\n제338조(주식의 입질)","kind":"L"},{"id":"L:339","label":"법 제339조","title":"질권의 물상대위","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제339조(질권의 물상대위) 주식의 소각, 병합, 분할 또는 전환이 있는 때에는 이로 인하여 종전의 주주가 받을 금전이나 주식에 대하여도 종전의 주식을 목적으로한 질권을 행사할 수 있다. <개정 1998.12.28>","kind":"L"},{"id":"L:340","label":"법 제340조","title":"주식의 등록질","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 주식을 질권(質權)의 목적으로 한 경우에 회사가 질권설정자의 청구에 따라 그 성명과 주소를 주주명부에 덧붙여 쓰고 그 성명을 주권(株券)에 적은 경우에는 질권자는 회사로부터 이익배당, 잔여재산의 분배 또는 제339조에 따른 금전의 지급을 받아 다른 채권자에 우선하여 자기채권의 변제에 충당할 수 있다. <개정 2011.4.14, 2014.5.20>\n②민법 제353조제3항의 규정은 전항의 경우에 준용한다.\n③제1항의 질권자는 회사에 대하여 전조의 주식에 대한 주권의 교부를 청구할 수 있다.\n제340조(주식의 등록질)","kind":"L"},{"id":"L:340-2","label":"법 제340조의2","title":"주식매수선택권","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 회사는 정관으로 정하는 바에 따라 제434조의 주주총회의 결의로 회사의 설립ㆍ경영 및 기술혁신 등에 기여하거나 기여할 수 있는 회사의 이사, 집행임원, 감사 또는 피용자(被用者)에게 미리 정한 가액(이하 \"주식매수선택권의 행사가액\"이라 한다)으로 신주를 인수하거나 자기의 주식을 매수할 수 있는 권리(이하 \"주식매수선택권\"이라 한다)를 부여할 수 있다. 다만, 주식매수선택권의 행사가액이 주식의 실질가액보다 낮은 경우에 회사는 그 차액을 금전으로 지급하거나 그 차액에 상당하는 자기의 주식을 양도할 수 있다. 이 경우 주식의 실질가액은 주식매수선택권의 행사일을 기준으로 평가한다.\n② 다음 각 호의 어느 하나에 해당하는 자에게는 제1항의 주식매수선택권을 부여할 수 없다.\n1. 의결권 없는 주식을 제외한 발행주식총수의 100분의 10 이상의 주식을 가진 주주\n2. 이사ㆍ집행임원ㆍ감사의 선임과 해임 등 회사의 주요 경영사항에 대하여 사실상 영향력을 행사하는 자\n3. 제1호와 제2호에 규정된 자의 배우자와 직계존비속\n③ 제1항에 따라 발행할 신주 또는 양도할 자기의 주식은 회사의 발행주식총수의 100분의 10을 초과할 수 없다.\n④ 제1항의 주식매수선택권의 행사가액은 다음 각 호의 가액 이상이어야 한다.\n1. 신주를 발행하는 경우에는 주식매수선택권의 부여일을 기준으로 한 주식의 실질가액과 주식의 권면액(券面額) 중 높은 금액. 다만, 무액면주식을 발행한 경우에는 자본으로 계상되는 금액 중 1주에 해당하는 금액을 권면액으로 본다.\n2. 자기의 주식을 양도하는 경우에는 주식매수선택권의 부여일을 기준으로 한 주식의 실질가액\n제340조의2(주식매수선택권)","kind":"L"},{"id":"L:340-3","label":"법 제340조의3","title":"주식매수선택권의 부여","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①제340조의2제1항의 주식매수선택권에 관한 정관의 규정에는 다음 각호의 사항을 기재하여야 한다.\n1. 일정한 경우 주식매수선택권을 부여할 수 있다는 뜻\n2. 주식매수선택권의 행사로 발행하거나 양도할 주식의 종류와 수\n3. 주식매수선택권을 부여받을 자의 자격요건\n4. 주식매수선택권의 행사기간\n5. 일정한 경우 이사회결의로 주식매수선택권의 부여를 취소할 수 있다는 뜻\n②제340조의2제1항의 주식매수선택권에 관한 주주총회의 결의에 있어서는 다음 각호의 사항을 정하여야 한다.\n1. 주식매수선택권을 부여받을 자의 성명\n2. 주식매수선택권의 부여방법\n3. 주식매수선택권의 행사가액과 그 조정에 관한 사항\n4. 주식매수선택권의 행사기간\n5. 주식매수선택권을 부여받을 자 각각에 대하여 주식매수선택권의 행사로 발행하거나 양도할 주식의 종류와 수\n③회사는 제2항의 주주총회결의에 의하여 주식매수선택권을 부여받은 자와 계약을 체결하고 상당한 기간내에 그에 관한 계약서를 작성하여야 한다.\n④회사는 제3항의 계약서를 주식매수선택권의 행사기간이 종료할 때까지 본점에 비치하고 주주로 하여금 영업시간내에 이를 열람할 수 있도록 하여야 한다.\n제340조의3(주식매수선택권의 부여)","kind":"L"},{"id":"L:340-4","label":"법 제340조의4","title":"주식매수선택권의 행사","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①제340조의2제1항의 주식매수선택권은 제340조의3제2항 각호의 사항을 정하는 주주총회결의일부터 2년 이상 재임 또는 재직하여야 이를 행사할 수 있다.\n②제340조의2제1항의 주식매수선택권은 이를 양도할 수 없다. 다만, 동조제2항의 규정에 의하여 주식매수선택권을 행사할 수 있는 자가 사망한 경우에는 그 상속인이 이를 행사할 수 있다.\n제340조의4(주식매수선택권의 행사)","kind":"L"},{"id":"L:340-5","label":"법 제340조의5","title":"준용규정","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제340조의5(준용규정) 제350조제2항, 제351조, 제516조의9제1항ㆍ제3항ㆍ제4항 및 제516조의10 전단은 주식매수선택권의 행사로 신주를 발행하는 경우에 이를 준용한다. <개정 2011.4.14, 2020.12.29>","kind":"L"},{"id":"L:341","label":"법 제341조","title":"자기주식의 취득","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 회사는 다음의 방법에 따라 자기의 명의와 계산으로 자기의 주식을 취득할 수 있다. 다만, 그 취득가액의 총액은 직전 결산기의 대차대조표상의 순자산액에서 제462조제1항 각 호의 금액을 뺀 금액을 초과하지 못한다.\n1. 거래소에서 시세(時勢)가 있는 주식의 경우에는 거래소에서 취득하는 방법\n2. 제345조제1항의 주식의 상환에 관한 종류주식의 경우 외에 각 주주가 가진 주식 수에 따라 균등한 조건으로 취득하는 것으로서 대통령령으로 정하는 방법\n② 제1항에 따라 자기주식을 취득하려는 회사는 미리 주주총회의 결의로 다음 각 호의 사항을 결정하여야 한다. 다만, 이사회의 결의로 이익배당을 할 수 있다고 정관으로 정하고 있는 경우에는 이사회의 결의로써 주주총회의 결의를 갈음할 수 있다.\n1. 취득할 수 있는 주식의 종류 및 수\n2. 취득가액의 총액의 한도\n3. 1년을 초과하지 아니하는 범위에서 자기주식을 취득할 수 있는 기간\n③ 회사는 해당 영업연도의 결산기에 대차대조표상의 순자산액이 제462조제1항 각 호의 금액의 합계액에 미치지 못할 우려가 있는 경우에는 제1항에 따른 주식의 취득을 하여서는 아니 된다.\n④ 해당 영업연도의 결산기에 대차대조표상의 순자산액이 제462조제1항 각 호의 금액의 합계액에 미치지 못함에도 불구하고 회사가 제1항에 따라 주식을 취득한 경우 이사는 회사에 대하여 연대하여 그 미치지 못한 금액을 배상할 책임이 있다. 다만, 이사가 제3항의 우려가 없다고 판단하는 때에 주의를 게을리하지 아니하였음을 증명한 경우에는 그러하지 아니하다.\n제341조(자기주식의 취득)","kind":"L"},{"id":"L:341-2","label":"법 제341조의2","title":"특정목적에 의한 자기주식의 취득","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"1. 회사의 합병 또는 다른 회사의 영업전부의 양수로 인한 경우\n2. 회사의 권리를 실행함에 있어 그 목적을 달성하기 위하여 필요한 경우\n3. 단주(端株)의 처리를 위하여 필요한 경우\n4. 주주가 주식매수청구권을 행사한 경우\n제341조의2(특정목적에 의한 자기주식의 취득) 회사는 다음 각 호의 어느 하나에 해당하는 경우에는 제341조에도 불구하고 자기의 주식을 취득할 수 있다.","kind":"L"},{"id":"L:341-3","label":"법 제341조의3","title":"자기주식의 질취","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제341조의3(자기주식의 질취) 회사는 발행주식총수의 20분의 1을 초과하여 자기의 주식을 질권의 목적으로 받지 못한다. 다만, 제341조의2제1호 및 제2호의 경우에는 그 한도를 초과하여 질권의 목적으로 할 수 있다.","kind":"L"},{"id":"L:342","label":"법 제342조","title":"자기주식의 처분","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"1. 처분할 주식의 종류와 수\n2. 처분할 주식의 처분가액과 납입기일\n3. 주식을 처분할 상대방 및 처분방법\n제342조(자기주식의 처분) 회사가 보유하는 자기의 주식을 처분하는 경우에 다음 각 호의 사항으로서 정관에 규정이 없는 것은 이사회가 결정한다.","kind":"L"},{"id":"L:342-2","label":"법 제342조의2","title":"자회사에 의한 모회사주식의 취득","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①다른 회사의 발행주식의 총수의 100분의 50을 초과하는 주식을 가진 회사(이하 \"母會社\"라 한다)의 주식은 다음의 경우를 제외하고는 그 다른 회사(이하 \"子會社\"라 한다)가 이를 취득할 수 없다. <개정 2001.7.24>\n1. 주식의 포괄적 교환, 주식의 포괄적 이전, 회사의 합병 또는 다른 회사의 영업전부의 양수로 인한 때\n2. 회사의 권리를 실행함에 있어 그 목적을 달성하기 위하여 필요한 때\n②제1항 각호의 경우 자회사는 그 주식을 취득한 날로부터 6월 이내에 모회사의 주식을 처분하여야 한다.\n③다른 회사의 발행주식의 총수의 100분의 50을 초과하는 주식을 모회사 및 자회사 또는 자회사가 가지고 있는 경우 그 다른 회사는 이 법의 적용에 있어 그 모회사의 자회사로 본다. <개정 2001.7.24>\n제342조의2(자회사에 의한 모회사주식의 취득)","kind":"L"},{"id":"L:342-3","label":"법 제342조의3","title":"다른 회사의 주식취득","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제342조의3(다른 회사의 주식취득) 회사가 다른 회사의 발행주식총수의 10분의 1을 초과하여 취득한 때에는 그 다른 회사에 대하여 지체없이 이를 통지하여야 한다.","kind":"L"},{"id":"L:343","label":"법 제343조","title":"주식의 소각","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 주식은 자본금 감소에 관한 규정에 따라서만 소각(消却)할 수 있다. 다만, 이사회의 결의에 의하여 회사가 보유하는 자기주식을 소각하는 경우에는 그러하지 아니하다.\n② 자본금감소에 관한 규정에 따라 주식을 소각하는 경우에는 제440조 및 제441조를 준용한다.\n제343조(주식의 소각)","kind":"L"},{"id":"L:343-2","label":"법 제343조의2","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제343조의2 삭제 <2011.4.14>","kind":"L"},{"id":"L:344","label":"법 제344조","title":"종류주식","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 회사는 이익의 배당, 잔여재산의 분배, 주주총회에서의 의결권의 행사, 상환 및 전환 등에 관하여 내용이 다른 종류의 주식(이하 \"종류주식\"이라 한다)을 발행할 수 있다.\n② 제1항의 경우에는 정관으로 각 종류주식의 내용과 수를 정하여야 한다.\n③ 회사가 종류주식을 발행하는 때에는 정관에 다른 정함이 없는 경우에도 주식의 종류에 따라 신주의 인수, 주식의 병합ㆍ분할ㆍ소각 또는 회사의 합병ㆍ분할로 인한 주식의 배정에 관하여 특수하게 정할 수 있다.\n④ 종류주식 주주의 종류주주총회의 결의에 관하여는 제435조제2항을 준용한다.\n제344조(종류주식)","kind":"L"},{"id":"L:344-2","label":"법 제344조의2","title":"이익배당, 잔여재산분배에 관한 종류주식","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 회사가 이익의 배당에 관하여 내용이 다른 종류주식을 발행하는 경우에는 정관에 그 종류주식의 주주에게 교부하는 배당재산의 종류, 배당재산의 가액의 결정방법, 이익을 배당하는 조건 등 이익배당에 관한 내용을 정하여야 한다.\n② 회사가 잔여재산의 분배에 관하여 내용이 다른 종류주식을 발행하는 경우에는 정관에 잔여재산의 종류, 잔여재산의 가액의 결정방법, 그 밖에 잔여재산분배에 관한 내용을 정하여야 한다.\n제344조의2(이익배당, 잔여재산분배에 관한 종류주식)","kind":"L"},{"id":"L:344-3","label":"법 제344조의3","title":"의결권의 배제ㆍ제한에 관한 종류주식","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 회사가 의결권이 없는 종류주식이나 의결권이 제한되는 종류주식을 발행하는 경우에는 정관에 의결권을 행사할 수 없는 사항과, 의결권행사 또는 부활의 조건을 정한 경우에는 그 조건 등을 정하여야 한다.\n② 제1항에 따른 종류주식의 총수는 발행주식총수의 4분의 1을 초과하지 못한다. 이 경우 의결권이 없거나 제한되는 종류주식이 발행주식총수의 4분의 1을 초과하여 발행된 경우에는 회사는 지체 없이 그 제한을 초과하지 아니하도록 하기 위하여 필요한 조치를 하여야 한다.\n제344조의3(의결권의 배제ㆍ제한에 관한 종류주식)","kind":"L"},{"id":"L:345","label":"법 제345조","title":"주식의 상환에 관한 종류주식","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 회사는 정관으로 정하는 바에 따라 회사의 이익으로써 소각할 수 있는 종류주식을 발행할 수 있다. 이 경우 회사는 정관에 상환가액, 상환기간, 상환의 방법과 상환할 주식의 수를 정하여야 한다.\n② 제1항의 경우 회사는 상환대상인 주식의 취득일부터 2주 전에 그 사실을 그 주식의 주주 및 주주명부에 적힌 권리자에게 따로 통지하여야 한다. 다만, 통지는 공고로 갈음할 수 있다.\n③ 회사는 정관으로 정하는 바에 따라 주주가 회사에 대하여 상환을 청구할 수 있는 종류주식을 발행할 수 있다. 이 경우 회사는 정관에 주주가 회사에 대하여 상환을 청구할 수 있다는 뜻, 상환가액, 상환청구기간, 상환의 방법을 정하여야 한다.\n④ 제1항 및 제3항의 경우 회사는 주식의 취득의 대가로 현금 외에 유가증권(다른 종류주식은 제외한다)이나 그 밖의 자산을 교부할 수 있다. 다만, 이 경우에는 그 자산의 장부가액이 제462조에 따른 배당가능이익을 초과하여서는 아니 된다.\n⑤ 제1항과 제3항에서 규정한 주식은 종류주식(상환과 전환에 관한 것은 제외한다)에 한정하여 발행할 수 있다.\n제345조(주식의 상환에 관한 종류주식)","kind":"L"},{"id":"L:346","label":"법 제346조","title":"주식의 전환에 관한 종류주식","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 회사가 종류주식을 발행하는 경우에는 정관으로 정하는 바에 따라 주주는 인수한 주식을 다른 종류주식으로 전환할 것을 청구할 수 있다. 이 경우 전환의 조건, 전환의 청구기간, 전환으로 인하여 발행할 주식의 수와 내용을 정하여야 한다.\n② 회사가 종류주식을 발행하는 경우에는 정관에 일정한 사유가 발생할 때 회사가 주주의 인수 주식을 다른 종류주식으로 전환할 수 있음을 정할 수 있다. 이 경우 회사는 전환의 사유, 전환의 조건, 전환의 기간, 전환으로 인하여 발행할 주식의 수와 내용을 정하여야 한다.\n③ 제2항의 경우에 이사회는 다음 각 호의 사항을 그 주식의 주주 및 주주명부에 적힌 권리자에게 따로 통지하여야 한다. 다만, 통지는 공고로 갈음할 수 있다.\n1. 전환할 주식\n2. 2주 이상의 일정한 기간 내에 그 주권을 회사에 제출하여야 한다는 뜻\n3. 그 기간 내에 주권을 제출하지 아니할 때에는 그 주권이 무효로 된다는 뜻\n④ 제344조제2항에 따른 종류주식의 수 중 새로 발행할 주식의 수는 전환청구기간 또는 전환의 기간 내에는 그 발행을 유보(留保)하여야 한다.\n제346조(주식의 전환에 관한 종류주식)","kind":"L"},{"id":"L:347","label":"법 제347조","title":"전환주식발행의 절차","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"1. 주식을 다른 종류의 주식으로 전환할 수 있다는 뜻\n2. 전환의 조건\n3. 전환으로 인하여 발행할 주식의 내용\n4. 전환청구기간 또는 전환의 기간\n제347조(전환주식발행의 절차) 제346조의 경우에는 주식청약서 또는 신주인수권증서에 다음의 사항을 적어야 한다. <개정 1984.4.10, 2011.4.14>","kind":"L"},{"id":"L:348","label":"법 제348조","title":"전환으로 인하여 발행하는 주식의 발행가액","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제348조(전환으로 인하여 발행하는 주식의 발행가액) 전환으로 인하여 신주식을 발행하는 경우에는 전환전의 주식의 발행가액을 신주식의 발행가액으로 한다.","kind":"L"},{"id":"L:349","label":"법 제349조","title":"전환의 청구","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주식의 전환을 청구하는 자는 청구서 2통에 주권을 첨부하여 회사에 제출하여야 한다.\n②제1항의 청구서에는 전환하고자 하는 주식의 종류, 수와 청구연월일을 기재하고 기명날인 또는 서명하여야 한다. <개정 1995.12.29>\n③ 삭제 <1995.12.29>\n제349조(전환의 청구)","kind":"L"},{"id":"L:350","label":"법 제350조","title":"전환의 효력발생","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 주식의 전환은 주주가 전환을 청구한 경우에는 그 청구한 때에, 회사가 전환을 한 경우에는 제346조제3항제2호의 기간이 끝난 때에 그 효력이 발생한다. <개정 2011.4.14>\n②제354조제1항의 기간 중에 전환된 주식의 주주는 그 기간 중의 총회의 결의에 관하여는 의결권을 행사할 수 없다.\n③ 삭제 <2020.12.29>\n제350조(전환의 효력발생)","kind":"L"},{"id":"L:351","label":"법 제351조","title":"전환의 등기","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제351조(전환의 등기) 주식의 전환으로 인한 변경등기는 전환을 청구한 날 또는 제346조제3항제2호의 기간이 끝난 날이 속하는 달의 마지막 날부터 2주 내에 본점소재지에서 하여야 한다.","kind":"L"},{"id":"L:352","label":"법 제352조","title":"주주명부의 기재사항","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주식을 발행한 때에는 주주명부에 다음의 사항을 기재하여야 한다. <개정 1984.4.10, 2014.5.20>\n1. 주주의 성명과 주소\n2. 각 주주가 가진 주식의 종류와 그 수\n2의2. 각 주주가 가진 주식의 주권을 발행한 때에는 그 주권의 번호\n3. 각주식의 취득연월일\n②제1항의 경우에 전환주식을 발행한 때에는 제347조에 게기한 사항도 주주명부에 기재하여야 한다. <개정 1984.4.10, 2014.5.20>\n제352조(주주명부의 기재사항)","kind":"L"},{"id":"L:352-2","label":"법 제352조의2","title":"전자주주명부","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 회사는 정관으로 정하는 바에 따라 전자문서로 주주명부(이하 \"전자주주명부\"라 한다)를 작성할 수 있다.\n② 전자주주명부에는 제352조제1항의 기재사항 외에 전자우편주소를 적어야 한다.\n③ 전자주주명부의 비치ㆍ공시 및 열람의 방법에 관하여 필요한 사항은 대통령령으로 정한다.\n제352조의2(전자주주명부)","kind":"L"},{"id":"L:353","label":"법 제353조","title":"주주명부의 효력","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주주 또는 질권자에 대한 회사의 통지 또는 최고는 주주명부에 기재한 주소 또는 그 자로부터 회사에 통지한 주소로 하면 된다.\n②제304조제2항의 규정은 전항의 통지 또는 최고에 준용한다.\n제353조(주주명부의 효력)","kind":"L"},{"id":"L:354","label":"법 제354조","title":"주주명부의 폐쇄, 기준일","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사는 의결권을 행사하거나 배당을 받을 자 기타 주주 또는 질권자로서 권리를 행사할 자를 정하기 위하여 일정한 기간을 정하여 주주명부의 기재변경을 정지하거나 일정한 날에 주주명부에 기재된 주주 또는 질권자를 그 권리를 행사할 주주 또는 질권자로 볼 수 있다. <개정 1984.4.10>\n②제1항의 기간은 3월을 초과하지 못한다. <개정 1984.4.10>\n③제1항의 날은 주주 또는 질권자로서 권리를 행사할 날에 앞선 3월내의 날로 정하여야 한다. <개정 1984.4.10>\n④회사가 제1항의 기간 또는 날을 정한 때에는 그 기간 또는 날의 2주간전에 이를 공고하여야 한다. 그러나 정관으로 그 기간 또는 날을 지정한 때에는 그러하지 아니하다.\n제354조(주주명부의 폐쇄, 기준일)","kind":"L"},{"id":"L:355","label":"법 제355조","title":"주권발행의 시기","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사는 성립후 또는 신주의 납입기일후 지체없이 주권을 발행하여야 한다.\n②주권은 회사의 성립후 또는 신주의 납입기일후가 아니면 발행하지 못한다.\n③전항의 규정에 위반하여 발행한 주권은 무효로 한다. 그러나 발행한 자에 대한 손해배상의 청구에 영향을 미치지 아니한다.\n제355조(주권발행의 시기)","kind":"L"},{"id":"L:356","label":"법 제356조","title":"주권의 기재사항","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"1. 회사의 상호\n2. 회사의 성립연월일\n3. 회사가 발행할 주식의 총수\n4. 액면주식을 발행하는 경우 1주의 금액\n5. 회사의 성립후 발행된 주식에 관하여는 그 발행 연월일\n6. 종류주식이 있는 경우에는 그 주식의 종류와 내용\n6의2. 주식의 양도에 관하여 이사회의 승인을 얻도록 정한 때에는 그 규정\n7. 삭제<2011.4.14>\n8. 삭제<2011.4.14>\n제356조(주권의 기재사항) 주권에는 다음의 사항과 번호를 기재하고 대표이사가 기명날인 또는 서명하여야 한다. <개정 1995.12.29, 2011.4.14>","kind":"L"},{"id":"L:356-2","label":"법 제356조의2","title":"주식의 전자등록","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 회사는 주권을 발행하는 대신 정관으로 정하는 바에 따라 전자등록기관(유가증권 등의 전자등록 업무를 취급하는 기관을 말한다. 이하 같다)의 전자등록부에 주식을 등록할 수 있다. <개정 2016.3.22>\n② 전자등록부에 등록된 주식의 양도나 입질(入質)은 전자등록부에 등록하여야 효력이 발생한다.\n③ 전자등록부에 주식을 등록한 자는 그 등록된 주식에 대한 권리를 적법하게 보유한 것으로 추정하며, 이러한 전자등록부를 선의(善意)로, 그리고 중대한 과실 없이 신뢰하고 제2항의 등록에 따라 권리를 취득한 자는 그 권리를 적법하게 취득한다.\n④ 전자등록의 절차ㆍ방법 및 효과, 전자등록기관에 대한 감독, 그 밖에 주식의 전자등록 등에 필요한 사항은 따로 법률로 정한다. <개정 2016.3.22>\n제356조의2(주식의 전자등록)","kind":"L"},{"id":"L:357","label":"법 제357조","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제357조 삭제 <2014.5.20>","kind":"L"},{"id":"L:358","label":"법 제358조","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제358조 삭제 <2014.5.20>","kind":"L"},{"id":"L:358-2","label":"법 제358조의2","title":"주권의 불소지","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주주는 정관에 다른 정함이 있는 경우를 제외하고는 그 주식에 대하여 주권의 소지를 하지 아니하겠다는 뜻을 회사에 신고할 수 있다. <개정 2014.5.20>\n②제1항의 신고가 있는 때에는 회사는 지체없이 주권을 발행하지 아니한다는 뜻을 주주명부와 그 복본에 기재하고, 그 사실을 주주에게 통지하여야 한다. 이 경우 회사는 그 주권을 발행할 수 없다.\n③제1항의 경우 이미 발행된 주권이 있는 때에는 이를 회사에 제출하여야 하며, 회사는 제출된 주권을 무효로 하거나 명의개서대리인에게 임치하여야 한다.\n④제1항 내지 제3항의 규정에 불구하고 주주는 언제든지 회사에 대하여 주권의 발행 또는 반환을 청구할 수 있다.\n제358조의2(주권의 불소지)","kind":"L"},{"id":"L:359","label":"법 제359조","title":"주권의 선의취득","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제359조(주권의 선의취득) 수표법 제21조의 규정은 주권에 관하여 이를 준용한다.","kind":"L"},{"id":"L:360","label":"법 제360조","title":"주권의 제권판결, 재발행","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주권은 공시최고의 절차에 의하여 이를 무효로 할 수 있다.\n②주권을 상실한 자는 제권판결을 얻지 아니하면 회사에 대하여 주권의 재발행을 청구하지 못한다.\n제360조(주권의 제권판결, 재발행)","kind":"L"},{"id":"L:360-2","label":"법 제360조의2","title":"주식의 포괄적 교환에 의한 완전모회사의 설립","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사는 이 관의 규정에 의한 주식의 포괄적 교환에 의하여 다른 회사의 발행주식의 총수를 소유하는 회사(이하 \"완전모회사\"라 한다)가 될 수 있다. 이 경우 그 다른 회사를 \"완전자회사\"라 한다.\n②주식의 포괄적 교환(이하 이 관에서 \"주식교환\"이라 한다)에 의하여 완전자회사가 되는 회사의 주주가 가지는 그 회사의 주식은 주식을 교환하는 날에 주식교환에 의하여 완전모회사가 되는 회사에 이전하고, 그 완전자회사가 되는 회사의 주주는 그 완전모회사가 되는 회사가 주식교환을 위하여 발행하는 신주의 배정을 받거나 그 회사 자기주식의 이전을 받음으로써 그 회사의 주주가 된다. <개정 2015.12.1>\n제360조의2(주식의 포괄적 교환에 의한 완전모회사의 설립)","kind":"L"},{"id":"L:360-3","label":"법 제360조의3","title":"주식교환계약서의 작성과 주주총회의 승인 및 주식교환대가가 모회사 주식인 경우의 특칙","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주식교환을 하고자 하는 회사는 주식교환계약서를 작성하여 주주총회의 승인을 얻어야 한다.\n②제1항의 승인결의는 제434조의 규정에 의하여야 한다.\n③주식교환계약서에는 다음 각호의 사항을 적어야 한다. <개정 2011.4.14, 2015.12.1>\n1. 완전모회사가 되는 회사가 주식교환으로 인하여 정관을 변경하는 경우에는 그 규정\n2. 완전모회사가 되는 회사가 주식교환을 위하여 신주를 발행하거나 자기주식을 이전하는 경우에는 발행하는 신주 또는 이전하는 자기주식의 총수ㆍ종류, 종류별 주식의 수 및 완전자회사가 되는 회사의 주주에 대한 신주의 배정 또는 자기주식의 이전에 관한 사항\n3. 완전모회사가 되는 회사의 자본금 또는 준비금이 증가하는 경우에는 증가할 자본금 또는 준비금에 관한 사항\n4. 완전자회사가 되는 회사의 주주에게 제2호에도 불구하고 그 대가의 전부 또는 일부로서 금전이나 그 밖의 재산을 제공하는 경우에는 그 내용 및 배정에 관한 사항\n5. 각 회사가 제1항의 결의를 할 주주총회의 기일\n6. 주식교환을 할 날\n7. 각 회사가 주식교환을 할 날까지 이익배당을 할 때에는 그 한도액\n8. 삭제<2015.12.1>\n9. 완전모회사가 되는 회사에 취임할 이사와 감사 또는 감사위원회의 위원을 정한 때에는 그 성명 및 주민등록번호\n④회사는 제363조의 규정에 의한 통지에 다음 각호의 사항을 기재하여야 한다. <개정 2014.5.20>\n1. 주식교환계약서의 주요내용\n2. 제360조의5제1항의 규정에 의한 주식매수청구권의 내용 및 행사방법\n3. 일방회사의 정관에 주식의 양도에 관하여 이사회의 승인을 요한다는 뜻의 규정이 있고 다른 회사의 정관에 그 규정이 없는 경우 그 뜻\n⑤ 주식교환으로 인하여 주식교환에 관련되는 각 회사의 주주의 부담이 가중되는 경우에는 제1항 및 제436조의 결의 외에 그 주주 전원의 동의가 있어야 한다. <신설 2011.4.14>\n⑥ 제342조의2제1항에도 불구하고 제3항제4호에 따라 완전자회사가 되는 회사의 주주에게 제공하는 재산이 완전모회사가 되는 회사의 모회사 주식을 포함하는 경우에는 완전모회사가 되는 회사는 그 지급을 위하여 그 모회사의 주식을 취득할 수 있다. <신설 2015.12.1>\n⑦ 완전모회사가 되는 회사는 제6항에 따라 취득한 그 회사의 모회사 주식을 주식교환 후에도 계속 보유하고 있는 경우 주식교환의 효력이 발생하는 날부터 6개월 이내에 그 주식을 처분하여야 한다. <신설 2015.12.1>\n제360조의3(주식교환계약서의 작성과 주주총회의 승인 및 주식교환대가가 모회사 주식인 경우의 특칙)","kind":"L"},{"id":"L:360-4","label":"법 제360조의4","title":"주식교환계약서 등의 공시","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①이사는 제360조의3제1항의 주주총회의 회일의 2주전부터 주식교환의 날 이후 6월이 경과하는 날까지 다음 각호의 서류를 본점에 비치하여야 한다. <개정 2015.12.1>\n1. 주식교환계약서\n2. 완전모회사가 되는 회사가 주식교환을 위하여 신주를 발행하거나 자기주식을 이전하는 경우에는 완전자회사가 되는 회사의 주주에 대한 신주의 배정 또는 자기주식의 이전에 관하여 그 이유를 기재한 서면\n3. 제360조의3제1항의 주주총회의 회일(제360조의9의 규정에 의한 간이주식교환의 경우에는 동조제2항의 규정에 의하여 공고 또는 통지를 한 날)전 6월 이내의 날에 작성한 주식교환을 하는 각 회사의 최종 대차대조표 및 손익계산서\n②제1항의 서류에 관하여는 제391조의3제3항의 규정을 준용한다.\n제360조의4(주식교환계약서 등의 공시)","kind":"L"},{"id":"L:360-5","label":"법 제360조의5","title":"반대주주의 주식매수청구권","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①제360조의3제1항의 규정에 의한 승인사항에 관하여 이사회의 결의가 있는 때에 그 결의에 반대하는 주주(의결권이 없거나 제한되는 주주를 포함한다. 이하 이 조에서 같다)는 주주총회전에 회사에 대하여 서면으로 그 결의에 반대하는 의사를 통지한 경우에는 그 총회의 결의일부터 20일 이내에 주식의 종류와 수를 기재한 서면으로 회사에 대하여 자기가 소유하고 있는 주식의 매수를 청구할 수 있다. <개정 2015.12.1>\n②제360조의9제2항의 공고 또는 통지를 한 날부터 2주내에 회사에 대하여 서면으로 주식교환에 반대하는 의사를 통지한 주주는 그 기간이 경과한 날부터 20일 이내에 주식의 종류와 수를 기재한 서면으로 회사에 대하여 자기가 소유하고 있는 주식의 매수를 청구할 수 있다.\n③제1항 및 제2항의 매수청구에 관하여는 제374조의2제2항 내지 제5항의 규정을 준용한다.\n제360조의5(반대주주의 주식매수청구권)","kind":"L"},{"id":"L:360-6","label":"법 제360조의6","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제360조의6 삭제 <2015.12.1>","kind":"L"},{"id":"L:360-7","label":"법 제360조의7","title":"완전모회사의 자본금 증가의 한도액","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①완전모회사가 되는 회사의 자본금은 주식교환의 날에 완전자회사가 되는 회사에 현존하는 순자산액에서 다음 각호의 금액을 뺀 금액을 초과하여 증가시킬 수 없다. <개정 2011.4.14, 2015.12.1>\n1. 완전자회사가 되는 회사의 주주에게 제공할 금전이나 그 밖의 재산의 가액\n2. 제360조의3제3항제2호에 따라 완전자회사가 되는 회사의 주주에게 이전하는 자기주식의 장부가액의 합계액\n②완전모회사가 되는 회사가 주식교환 이전에 완전자회사가 되는 회사의 주식을 이미 소유하고 있는 경우에는 완전모회사가 되는 회사의 자본금은 주식교환의 날에 완전자회사가 되는 회사에 현존하는 순자산액에 그 회사의 발행주식총수에 대한 주식교환으로 인하여 완전모회사가 되는 회사에 이전하는 주식의 수의 비율을 곱한 금액에서 제1항 각호의 금액을 뺀 금액의 한도를 초과하여 이를 증가시킬 수 없다. <개정 2011.4.14>\n제360조의7(완전모회사의 자본금 증가의 한도액)","kind":"L"},{"id":"L:360-8","label":"법 제360조의8","title":"주권의 실효절차","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주식교환에 의하여 완전자회사가 되는 회사는 주주총회에서 제360조의3제1항의 규정에 의한 승인을 한 때에는 다음 각호의 사항을 주식교환의 날 1월전에 공고하고, 주주명부에 기재된 주주와 질권자에 대하여 따로 따로 그 통지를 하여야 한다.\n1. 제360조의3제1항의 규정에 의한 승인을 한 뜻\n2. 주식교환의 날의 전날까지 주권을 회사에 제출하여야 한다는 뜻\n3. 주식교환의 날에 주권이 무효가 된다는 뜻\n②제442조의 규정은 제360조의3제1항의 규정에 의한 승인을 한 경우에 이를 준용한다. <개정 2014.5.20>\n제360조의8(주권의 실효절차)","kind":"L"},{"id":"L:360-9","label":"법 제360조의9","title":"간이주식교환","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①완전자회사가 되는 회사의 총주주의 동의가 있거나 그 회사의 발행주식총수의 100분의 90 이상을 완전모회사가 되는 회사가 소유하고 있는 때에는 완전자회사가 되는 회사의 주주총회의 승인은 이를 이사회의 승인으로 갈음할 수 있다.\n②제1항의 경우에 완전자회사가 되는 회사는 주식교환계약서를 작성한 날부터 2주내에 주주총회의 승인을 얻지 아니하고 주식교환을 한다는 뜻을 공고하거나 주주에게 통지하여야 한다. 다만, 총주주의 동의가 있는 때에는 그러하지 아니하다.\n제360조의9(간이주식교환)","kind":"L"},{"id":"L:360-10","label":"법 제360조의10","title":"소규모 주식교환","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①완전모회사가 되는 회사가 주식교환을 위하여 발행하는 신주 및 이전하는 자기주식의 총수가 그 회사의 발행주식총수의 100분의 10을 초과하지 아니하는 경우에는 그 회사에서의 제360조의3제1항의 규정에 의한 주주총회의 승인은 이를 이사회의 승인으로 갈음할 수 있다. 다만, 완전자회사가 되는 회사의 주주에게 제공할 금전이나 그 밖의 재산을 정한 경우에 그 금액 및 그 밖의 재산의 가액이 제360조의4제1항제3호에서 규정한 최종 대차대조표에 의하여 완전모회사가 되는 회사에 현존하는 순자산액의 100분의 5를 초과하는 때에는 그러하지 아니하다. <개정 2015.12.1>\n② 삭제 <2015.12.1>\n③제1항 본문의 경우에는 주식교환계약서에 완전모회사가 되는 회사에 관하여는 제360조의3제1항의 규정에 의한 주주총회의 승인을 얻지 아니하고 주식교환을 할 수 있는 뜻을 기재하여야 하며, 동조제3항제1호의 사항은 이를 기재하지 못한다.\n④완전모회사가 되는 회사는 주식교환계약서를 작성한 날부터 2주내에 완전자회사가 되는 회사의 상호와 본점, 주식교환을 할 날 및 제360조의3제1항의 승인을 얻지 아니하고 주식교환을 한다는 뜻을 공고하거나 주주에게 통지하여야 한다.\n⑤ 완전모회사가 되는 회사의 발행주식총수의 100분의 20 이상에 해당하는 주식을 가지는 주주가 제4항에 따른 공고 또는 통지를 한 날부터 2주 내에 회사에 대하여 서면으로 제1항 본문에 따른 주식교환에 반대하는 의사를 통지한 경우에는 이 조에 따른 주식교환을 할 수 없다. <개정 2011.4.14>\n⑥제1항 본문의 경우에 완전모회사가 되는 회사에 관하여 제360조의4제1항의 규정을 적용함에 있어서는 동조동항 각호외의 부분중 \"제360조의3제1항의 주주총회의 회일의 2주전\" 및 동조동항제3호중 \"제360조의3제1항의 주주총회의 회일\"은 각각 \"이 조제4항의 규정에 의한 공고 또는 통지의 날\"로 한다.\n⑦제1항 본문의 경우에는 제360조의5의 규정은 이를 적용하지 아니한다.\n제360조의10(소규모 주식교환)","kind":"L"},{"id":"L:360-11","label":"법 제360조의11","title":"단주처리 등에 관한 규정의 준용","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①제443조의 규정은 회사의 주식교환의 경우에 이를 준용한다.\n②제339조 및 제340조제3항의 규정은 주식교환의 경우에 완전자회사가 되는 회사의 주식을 목적으로 하는 질권에 이를 준용한다.\n제360조의11(단주처리 등에 관한 규정의 준용)","kind":"L"},{"id":"L:360-12","label":"법 제360조의12","title":"주식교환사항을 기재한 서면의 사후공시","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①이사는 다음 각호의 사항을 기재한 서면을 주식교환의 날부터 6월간 본점에 비치하여야 한다.\n1. 주식교환의 날\n2. 주식교환의 날에 완전자회사가 되는 회사에 현존하는 순자산액\n3. 주식교환으로 인하여 완전모회사에 이전한 완전자회사의 주식의 수\n4. 그 밖의 주식교환에 관한 사항\n②제1항의 서면에 관하여는 제391조의3제3항의 규정을 준용한다.\n제360조의12(주식교환사항을 기재한 서면의 사후공시)","kind":"L"},{"id":"L:360-13","label":"법 제360조의13","title":"완전모회사의 이사ㆍ감사의 임기","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제360조의13(완전모회사의 이사ㆍ감사의 임기) 주식교환에 의하여 완전모회사가 되는 회사의 이사 및 감사로서 주식교환전에 취임한 자는 주식교환계약서에 다른 정함이 있는 경우를 제외하고는 주식교환후 최초로 도래하는 결산기에 관한 정기총회가 종료하는 때에 퇴임한다.","kind":"L"},{"id":"L:360-14","label":"법 제360조의14","title":"주식교환무효의 소","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주식교환의 무효는 각 회사의 주주ㆍ이사ㆍ감사ㆍ감사위원회의 위원 또는 청산인에 한하여 주식교환의 날부터 6월내에 소만으로 이를 주장할 수 있다.\n②제1항의 소는 완전모회사가 되는 회사의 본점소재지의 지방법원의 관할에 전속한다.\n③주식교환을 무효로 하는 판결이 확정된 때에는 완전모회사가 된 회사는 주식교환을 위하여 발행한 신주 또는 이전한 자기주식의 주주에 대하여 그가 소유하였던 완전자회사가 된 회사의 주식을 이전하여야 한다. <개정 2015.12.1>\n④제187조 내지 제189조, 제190조 본문, 제191조, 제192조, 제377조 및 제431조의 규정은 제1항의 소에, 제339조 및 제340조제3항의 규정은 제3항의 경우에 각각 이를 준용한다.\n제360조의14(주식교환무효의 소)","kind":"L"},{"id":"L:360-15","label":"법 제360조의15","title":"주식의 포괄적 이전에 의한 완전모회사의 설립","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①회사는 이 관의 규정에 의한 주식의 포괄적 이전(이하 이 관에서 \"주식이전\"이라 한다)에 의하여 완전모회사를 설립하고 완전자회사가 될 수 있다.\n②주식이전에 의하여 완전자회사가 되는 회사의 주주가 소유하는 그 회사의 주식은 주식이전에 의하여 설립하는 완전모회사에 이전하고, 그 완전자회사가 되는 회사의 주주는 그 완전모회사가 주식이전을 위하여 발행하는 주식의 배정을 받음으로써 그 완전모회사의 주주가 된다.\n제360조의15(주식의 포괄적 이전에 의한 완전모회사의 설립)","kind":"L"},{"id":"L:360-16","label":"법 제360조의16","title":"주주총회에 의한 주식이전의 승인","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주식이전을 하고자 하는 회사는 다음 각호의 사항을 적은 주식이전계획서를 작성하여 주주총회의 승인을 받아야 한다. <개정 2011.4.14, 2015.12.1>\n1. 설립하는 완전모회사의 정관의 규정\n2. 설립하는 완전모회사가 주식이전에 있어서 발행하는 주식의 종류와 수 및 완전자회사가 되는 회사의 주주에 대한 주식의 배정에 관한 사항\n3. 설립하는 완전모회사의 자본금 및 자본준비금에 관한 사항\n4. 완전자회사가 되는 회사의 주주에게 제2호에도 불구하고 금전이나 그 밖의 재산을 제공하는 경우에는 그 내용 및 배정에 관한 사항\n5. 주식이전을 할 시기\n6. 완전자회사가 되는 회사가 주식이전의 날까지 이익배당을 할 때에는 그 한도액\n7. 설립하는 완전모회사의 이사와 감사 또는 감사위원회의 위원의 성명 및 주민등록번호\n8. 회사가 공동으로 주식이전에 의하여 완전모회사를 설립하는 때에는 그 뜻\n②제1항의 승인결의는 제434조의 규정에 의하여야 한다.\n③제360조의3제4항의 규정은 제1항의 경우의 주주총회의 승인에 이를 준용한다.\n④ 주식이전으로 인하여 주식이전에 관련되는 각 회사의 주주의 부담이 가중되는 경우에는 제1항 및 제436조의 결의 외에 그 주주 전원의 동의가 있어야 한다. <신설 2011.4.14>\n제360조의16(주주총회에 의한 주식이전의 승인)","kind":"L"},{"id":"L:360-17","label":"법 제360조의17","title":"주식이전계획서 등의 서류의 공시","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①이사는 제360조의16제1항의 규정에 의한 주주총회의 회일의 2주전부터 주식이전의 날 이후 6월을 경과하는 날까지 다음 각호의 서류를 본점에 비치하여야 한다.\n1. 제360조의16제1항의 규정에 의한 주식이전계획서\n2. 완전자회사가 되는 회사의 주주에 대한 주식의 배정에 관하여 그 이유를 기재한 서면\n3. 제360조의16제1항의 주주총회의 회일전 6월 이내의 날에 작성한 완전자회사가 되는 회사의 최종 대차대조표 및 손익계산서\n②제1항의 서류에 관하여는 제391조의3제3항의 규정을 준용한다.\n제360조의17(주식이전계획서 등의 서류의 공시)","kind":"L"},{"id":"L:360-18","label":"법 제360조의18","title":"완전모회사의 자본금의 한도액","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제360조의18(완전모회사의 자본금의 한도액) 설립하는 완전모회사의 자본금은 주식이전의 날에 완전자회사가 되는 회사에 현존하는 순자산액에서 그 회사의 주주에게 제공할 금전 및 그 밖의 재산의 가액을 뺀 액을 초과하지 못한다. <개정 2011.4.14, 2015.12.1>","kind":"L"},{"id":"L:360-19","label":"법 제360조의19","title":"주권의 실효절차","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주식이전에 의하여 완전자회사가 되는 회사는 제360조의16제1항의 규정에 의한 결의를 한 때에는 다음 각호의 사항을 공고하고, 주주명부에 기재된 주주와 질권자에 대하여 따로 따로 그 통지를 하여야 한다.\n1. 제360조의16제1항의 규정에 의한 결의를 한 뜻\n2. 1월을 초과하여 정한 기간내에 주권을 회사에 제출하여야 한다는 뜻\n3. 주식이전의 날에 주권이 무효가 된다는 뜻\n②제442조의 규정은 제360조의16제1항의 규정에 의한 결의를 한 경우에 이를 준용한다. <개정 2014.5.20>\n제360조의19(주권의 실효절차)","kind":"L"},{"id":"L:360-20","label":"법 제360조의20","title":"주식이전에 의한 등기","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제360조의20(주식이전에 의한 등기) 주식이전을 한 때에는 설립한 완전모회사의 본점의 소재지에서 2주일 내에 제317조제2항에서 정하는 사항을 등기하여야 한다. <개정 2024.9.20>","kind":"L"},{"id":"L:360-21","label":"법 제360조의21","title":"주식이전의 효력발생시기","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제360조의21(주식이전의 효력발생시기) 주식이전은 이로 인하여 설립한 완전모회사가 그 본점소재지에서 제360조의20의 규정에 의한 등기를 함으로써 그 효력이 발생한다.","kind":"L"},{"id":"L:360-22","label":"법 제360조의22","title":"주식교환 규정의 준용","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제360조의22(주식교환 규정의 준용) 제360조의5, 제360조의11 및 제360조의12의 규정은 주식이전의 경우에 이를 준용한다.","kind":"L"},{"id":"L:360-23","label":"법 제360조의23","title":"주식이전무효의 소","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주식이전의 무효는 각 회사의 주주ㆍ이사ㆍ감사ㆍ감사위원회의 위원 또는 청산인에 한하여 주식이전의 날부터 6월내에 소만으로 이를 주장할 수 있다.\n②제1항의 소는 완전모회사가 되는 회사의 본점소재지의 지방법원의 관할에 전속한다.\n③주식이전을 무효로 하는 판결이 확정된 때에는 완전모회사가 된 회사는 주식이전을 위하여 발행한 주식의 주주에 대하여 그가 소유하였던 완전자회사가 된 회사의 주식을 이전하여야 한다.\n④제187조 내지 제193조 및 제377조의 규정은 제1항의 소에, 제339조 및 제340조제3항의 규정은 제3항의 경우에 각각 이를 준용한다.\n제360조의23(주식이전무효의 소)","kind":"L"},{"id":"L:360-24","label":"법 제360조의24","title":"지배주주의 매도청구권","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 회사의 발행주식총수의 100분의 95 이상을 자기의 계산으로 보유하고 있는 주주(이하 이 관에서 \"지배주주\"라 한다)는 회사의 경영상 목적을 달성하기 위하여 필요한 경우에는 회사의 다른 주주(이하 이 관에서 \"소수주주\"라 한다)에게 그 보유하는 주식의 매도를 청구할 수 있다.\n② 제1항의 보유주식의 수를 산정할 때에는 모회사와 자회사가 보유한 주식을 합산한다. 이 경우 회사가 아닌 주주가 발행주식총수의 100분의 50을 초과하는 주식을 가진 회사가 보유하는 주식도 그 주주가 보유하는 주식과 합산한다.\n③ 제1항의 매도청구를 할 때에는 미리 주주총회의 승인을 받아야 한다.\n④ 제3항의 주주총회의 소집을 통지할 때에는 다음 각 호에 관한 사항을 적어야 하고, 매도를 청구하는 지배주주는 주주총회에서 그 내용을 설명하여야 한다.\n1. 지배주주의 회사 주식의 보유 현황\n2. 매도청구의 목적\n3. 매매가액의 산정 근거와 적정성에 관한 공인된 감정인의 평가\n4. 매매가액의 지급보증\n⑤ 지배주주는 매도청구의 날 1개월 전까지 다음 각 호의 사실을 공고하고, 주주명부에 적힌 주주와 질권자에게 따로 그 통지를 하여야 한다.\n1. 소수주주는 매매가액의 수령과 동시에 주권을 지배주주에게 교부하여야 한다는 뜻\n2. 교부하지 아니할 경우 매매가액을 수령하거나 지배주주가 매매가액을 공탁(供託)한 날에 주권은 무효가 된다는 뜻\n⑥ 제1항의 매도청구를 받은 소수주주는 매도청구를 받은 날부터 2개월 내에 지배주주에게 그 주식을 매도하여야 한다.\n⑦ 제6항의 경우 그 매매가액은 매도청구를 받은 소수주주와 매도를 청구한 지배주주 간의 협의로 결정한다.\n⑧ 제1항의 매도청구를 받은 날부터 30일 내에 제7항의 매매가액에 대한 협의가 이루어지지 아니한 경우에는 매도청구를 받은 소수주주 또는 매도청구를 한 지배주주는 법원에 매매가액의 결정을 청구할 수 있다.\n⑨ 법원이 제8항에 따라 주식의 매매가액을 결정하는 경우에는 회사의 재산상태와 그 밖의 사정을 고려하여 공정한 가액으로 산정하여야 한다.\n제360조의24(지배주주의 매도청구권)","kind":"L"},{"id":"L:360-25","label":"법 제360조의25","title":"소수주주의 매수청구권","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 지배주주가 있는 회사의 소수주주는 언제든지 지배주주에게 그 보유주식의 매수를 청구할 수 있다.\n② 제1항의 매수청구를 받은 지배주주는 매수를 청구한 날을 기준으로 2개월 내에 매수를 청구한 주주로부터 그 주식을 매수하여야 한다.\n③ 제2항의 경우 그 매매가액은 매수를 청구한 주주와 매수청구를 받은 지배주주 간의 협의로 결정한다.\n④ 제2항의 매수청구를 받은 날부터 30일 내에 제3항의 매매가액에 대한 협의가 이루어지지 아니한 경우에는 매수청구를 받은 지배주주 또는 매수청구를 한 소수주주는 법원에 대하여 매매가액의 결정을 청구할 수 있다.\n⑤ 법원이 제4항에 따라 주식의 매매가액을 결정하는 경우에는 회사의 재산상태와 그 밖의 사정을 고려하여 공정한 가액으로 산정하여야 한다.\n제360조의25(소수주주의 매수청구권)","kind":"L"},{"id":"L:360-26","label":"법 제360조의26","title":"주식의 이전 등","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 제360조의24와 제360조의25에 따라 주식을 취득하는 지배주주가 매매가액을 소수주주에게 지급한 때에 주식이 이전된 것으로 본다.\n② 제1항의 매매가액을 지급할 소수주주를 알 수 없거나 소수주주가 수령을 거부할 경우에는 지배주주는 그 가액을 공탁할 수 있다. 이 경우 주식은 공탁한 날에 지배주주에게 이전된 것으로 본다.\n제360조의26(주식의 이전 등)","kind":"L"},{"id":"L:361","label":"법 제361조","title":"총회의 권한","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제361조(총회의 권한) 주주총회는 본법 또는 정관에 정하는 사항에 한하여 결의할 수 있다.","kind":"L"},{"id":"L:362","label":"법 제362조","title":"소집의 결정","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제362조(소집의 결정) 총회의 소집은 본법에 다른 규정이 있는 경우 외에는 이사회가 이를 결정한다.","kind":"L"},{"id":"L:363","label":"법 제363조","title":"소집의 통지","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 주주총회를 소집할 때에는 주주총회일의 2주 전에 각 주주에게 서면으로 통지를 발송하거나 각 주주의 동의를 받아 전자문서로 통지를 발송하여야 한다. 다만, 그 통지가 주주명부상 주주의 주소에 계속 3년간 도달하지 아니한 경우에는 회사는 해당 주주에게 총회의 소집을 통지하지 아니할 수 있다.\n② 제1항의 통지서에는 회의의 목적사항을 적어야 한다.\n③ 제1항에도 불구하고 자본금 총액이 10억원 미만인 회사가 주주총회를 소집하는 경우에는 주주총회일의 10일 전에 각 주주에게 서면으로 통지를 발송하거나 각 주주의 동의를 받아 전자문서로 통지를 발송할 수 있다. <개정 2014.5.20>\n④ 자본금 총액이 10억원 미만인 회사는 주주 전원의 동의가 있을 경우에는 소집절차 없이 주주총회를 개최할 수 있고, 서면에 의한 결의로써 주주총회의 결의를 갈음할 수 있다. 결의의 목적사항에 대하여 주주 전원이 서면으로 동의를 한 때에는 서면에 의한 결의가 있는 것으로 본다. <개정 2014.5.20>\n⑤ 제4항의 서면에 의한 결의는 주주총회의 결의와 같은 효력이 있다. <개정 2014.5.20>\n⑥ 서면에 의한 결의에 대하여는 주주총회에 관한 규정을 준용한다. <개정 2014.5.20>\n⑦ 제1항부터 제4항까지의 규정은 의결권 없는 주주에게는 적용하지 아니한다. 다만, 제1항의 통지서에 적은 회의의 목적사항에 제360조의5, 제360조의22, 제374조의2, 제522조의3 또는 제530조의11에 따라 반대주주의 주식매수청구권이 인정되는 사항이 포함된 경우에는 그러하지 아니하다. <개정 2014.5.20, 2015.12.1>\n제363조(소집의 통지)","kind":"L"},{"id":"L:363-2","label":"법 제363조의2","title":"주주제안권","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①의결권없는 주식을 제외한 발행주식총수의 100분의 3 이상에 해당하는 주식을 가진 주주는 이사에게 주주총회일(정기주주총회의 경우 직전 연도의 정기주주총회일에 해당하는 그 해의 해당일. 이하 이 조에서 같다)의 6주 전에 서면 또는 전자문서로 일정한 사항을 주주총회의 목적사항으로 할 것을 제안(이하 '株主提案'이라 한다)할 수 있다. <개정 2009.1.30>\n②제1항의 주주는 이사에게 주주총회일의 6주 전에 서면 또는 전자문서로 회의의 목적으로 할 사항에 추가하여 당해 주주가 제출하는 의안의 요령을 제363조에서 정하는 통지에 기재할 것을 청구할 수 있다. <개정 2009.1.30, 2014.5.20>\n③이사는 제1항에 의한 주주제안이 있는 경우에는 이를 이사회에 보고하고, 이사회는 주주제안의 내용이 법령 또는 정관을 위반하는 경우와 그 밖에 대통령령으로 정하는 경우를 제외하고는 이를 주주총회의 목적사항으로 하여야 한다. 이 경우 주주제안을 한 자의 청구가 있는 때에는 주주총회에서 당해 의안을 설명할 기회를 주어야 한다. <개정 2009.1.30>\n제363조의2(주주제안권)","kind":"L"},{"id":"L:364","label":"법 제364조","title":"소집지와 개최방식","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 총회는 정관에서 달리 정한 바가 없으면 본점소재지나 인접한 곳에 소집하여야 한다.\n② 회사는 총회일에 주주가 소집지에 직접 출석하는 방식으로 총회를 개최한다.\n제364조(소집지와 개최방식)","kind":"L"},{"id":"L:365","label":"법 제365조","title":"총회의 소집","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①정기총회는 매년 1회 일정한 시기에 이를 소집하여야 한다.\n②연 2회 이상의 결산기를 정한 회사는 매기에 총회를 소집하여야 한다.\n③임시총회는 필요있는 경우에 수시 이를 소집한다.\n제365조(총회의 소집)","kind":"L"},{"id":"L:366","label":"법 제366조","title":"소수주주에 의한 소집청구","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 발행주식총수의 100분의 3 이상에 해당하는 주식을 가진 주주는 회의의 목적사항과 소집의 이유를 적은 서면 또는 전자문서를 이사회에 제출하여 임시총회의 소집을 청구할 수 있다. <개정 2009.5.28>\n② 제1항의 청구가 있은 후 지체 없이 총회소집의 절차를 밟지 아니한 때에는 청구한 주주는 법원의 허가를 받아 총회를 소집할 수 있다. 이 경우 주주총회의 의장은 법원이 이해관계인의 청구나 직권으로 선임할 수 있다. <개정 2011.4.14>\n③제1항 및 제2항의 규정에 의한 총회는 회사의 업무와 재산상태를 조사하게 하기 위하여 검사인을 선임할 수 있다. <개정 1998.12.28>\n제366조(소수주주에 의한 소집청구)","kind":"L"},{"id":"L:366-2","label":"법 제366조의2","title":"총회의 질서유지","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①총회의 의장은 정관에서 정함이 없는 때에는 총회에서 선임한다.\n②총회의 의장은 총회의 질서를 유지하고 의사를 정리한다.\n③총회의 의장은 고의로 의사진행을 방해하기 위한 발언ㆍ행동을 하는 등 현저히 질서를 문란하게 하는 자에 대하여 그 발언의 정지 또는 퇴장을 명할 수 있다.\n제366조의2(총회의 질서유지)","kind":"L"},{"id":"L:367","label":"법 제367조","title":"검사인의 선임","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 총회는 이사가 제출한 서류와 감사의 보고서를 조사하게 하기 위하여 검사인(檢査人)을 선임할 수 있다.\n② 회사 또는 발행주식총수의 100분의 1 이상에 해당하는 주식을 가진 주주는 총회의 소집절차나 결의방법의 적법성을 조사하기 위하여 총회 전에 법원에 검사인의 선임을 청구할 수 있다.\n제367조(검사인의 선임)","kind":"L"},{"id":"L:368","label":"법 제368조","title":"총회의 결의방법과 의결권 행사","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①총회의 결의는 이 법 또는 정관에 다른 정함이 있는 경우를 제외하고는 출석한 주주의 의결권의 과반수와 발행주식총수의 4분의 1 이상의 수로써 하여야 한다. <개정 1995.12.29>\n②주주는 대리인으로 하여금 그 의결권을 행사하게 할 수 있다. 이 경우에는 그 대리인은 대리권을 증명하는 서면 또는 전자문서를 총회에 제출하여야 한다. <개정 2014.5.20, 2025.7.22>\n③총회의 결의에 관하여 특별한 이해관계가 있는 자는 의결권을 행사하지 못한다. <개정 2014.5.20>\n제368조(총회의 결의방법과 의결권 행사)","kind":"L"},{"id":"L:368-2","label":"법 제368조의2","title":"의결권의 불통일행사","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주주가 2 이상의 의결권을 가지고 있는 때에는 이를 통일하지 아니하고 행사할 수 있다. 이 경우 주주총회일의 3일전에 회사에 대하여 서면 또는 전자문서로 그 뜻과 이유를 통지하여야 한다. <개정 2009.5.28>\n②주주가 주식의 신탁을 인수하였거나 기타 타인을 위하여 주식을 가지고 있는 경우외에는 회사는 주주의 의결권의 불통일행사를 거부할 수 있다.\n제368조의2(의결권의 불통일행사)","kind":"L"},{"id":"L:368-3","label":"법 제368조의3","title":"서면에 의한 의결권의 행사","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주주는 정관이 정한 바에 따라 총회에 출석하지 아니하고 서면에 의하여 의결권을 행사할 수 있다.\n②회사는 총회의 소집통지서에 주주가 제1항의 규정에 의한 의결권을 행사하는데 필요한 서면과 참고자료를 첨부하여야 한다.\n제368조의3(서면에 의한 의결권의 행사)","kind":"L"},{"id":"L:368-4","label":"법 제368조의4","title":"전자적 방법에 의한 의결권의 행사","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 회사는 이사회의 결의로 주주가 총회에 출석하지 아니하고 전자적 방법으로 의결권을 행사할 수 있음을 정할 수 있다.\n② 회사는 제363조에 따라 소집통지를 할 때에는 주주가 제1항에 따른 방법으로 의결권을 행사할 수 있다는 내용을 통지하여야 한다. <개정 2014.5.20>\n③ 회사가 제1항에 따라 전자적 방법에 의한 의결권행사를 정한 경우에 주주는 주주 확인절차 등 대통령령으로 정하는 바에 따라 의결권을 행사하여야 한다. 이 경우 회사는 의결권행사에 필요한 양식과 참고자료를 주주에게 전자적 방법으로 제공하여야 한다.\n④ 동일한 주식에 관하여 제1항 또는 제368조의3제1항에 따라 의결권을 행사하는 경우 전자적 방법 또는 서면 중 어느 하나의 방법을 선택하여야 한다.\n⑤ 회사는 의결권행사에 관한 전자적 기록을 총회가 끝난 날부터 3개월간 본점에 갖추어 두어 열람하게 하고 총회가 끝난 날부터 5년간 보존하여야 한다.\n⑥ 주주 확인절차 등 전자적 방법에 의한 의결권행사의 절차와 그 밖에 필요한 사항은 대통령령으로 정한다.\n제368조의4(전자적 방법에 의한 의결권의 행사)","kind":"L"},{"id":"L:369","label":"법 제369조","title":"의결권","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①의결권은 1주마다 1개로 한다.\n②회사가 가진 자기주식은 의결권이 없다.\n③회사, 모회사 및 자회사 또는 자회사가 다른 회사의 발행주식의 총수의 10분의 1을 초과하는 주식을 가지고 있는 경우 그 다른 회사가 가지고 있는 회사 또는 모회사의 주식은 의결권이 없다. <신설 1984.4.10>\n제369조(의결권)","kind":"L"},{"id":"L:370","label":"법 제370조","title":"","chapter":"제3편 회사 제4장 주식회사","deleted":true,"text":"제370조 삭제 <2011.4.14>","kind":"L"},{"id":"L:371","label":"법 제371조","title":"정족수, 의결권수의 계산","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 총회의 결의에 관하여는 제344조의3제1항과 제369조제2항 및 제3항의 의결권 없는 주식의 수는 발행주식총수에 산입하지 아니한다.\n② 총회의 결의에 관하여는 제368조제3항에 따라 행사할 수 없는 주식의 의결권 수와 제409조제2항 및 제542조의12제4항에 따라 그 비율을 초과하는 주식으로서 행사할 수 없는 주식의 의결권 수는 출석한 주주의 의결권의 수에 산입하지 아니한다. <개정 2014.5.20, 2020.12.29>\n제371조(정족수, 의결권수의 계산)","kind":"L"},{"id":"L:372","label":"법 제372조","title":"총회의 연기, 속행의 결의","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①총회에서는 회의의 속행 또는 연기의 결의를 할 수 있다.\n②전항의 경우에는 제363조의 규정을 적용하지 아니한다.\n제372조(총회의 연기, 속행의 결의)","kind":"L"},{"id":"L:373","label":"법 제373조","title":"총회의 의사록","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①총회의 의사에는 의사록을 작성하여야 한다.\n②의사록에는 의사의 경과요령과 그 결과를 기재하고 의장과 출석한 이사가 기명날인 또는 서명하여야 한다. <개정 1995.12.29>\n제373조(총회의 의사록)","kind":"L"},{"id":"L:374","label":"법 제374조","title":"영업양도, 양수, 임대등","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 회사가 다음 각 호의 어느 하나에 해당하는 행위를 할 때에는 제434조에 따른 결의가 있어야 한다. <개정 2011.4.14>\n1. 영업의 전부 또는 중요한 일부의 양도\n2. 영업 전부의 임대 또는 경영위임, 타인과 영업의 손익 전부를 같이 하는 계약, 그 밖에 이에 준하는 계약의 체결ㆍ변경 또는 해약\n3. 회사의 영업에 중대한 영향을 미치는 다른 회사의 영업 전부 또는 일부의 양수\n②제1항의 행위에 관한 주주총회의 소집의 통지를 하는 때에는 제374조의2제1항 및 제2항의 규정에 의한 주식매수청구권의 내용 및 행사방법을 명시하여야 한다. <신설 1995.12.29, 2014.5.20>\n제374조(영업양도, 양수, 임대등)","kind":"L"},{"id":"L:374-2","label":"법 제374조의2","title":"반대주주의 주식매수청구권","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 제374조에 따른 결의사항에 반대하는 주주(의결권이 없거나 제한되는 주주를 포함한다. 이하 이 조에서 같다)는 주주총회 전에 회사에 대하여 서면으로 그 결의에 반대하는 의사를 통지한 경우에는 그 총회의 결의일부터 20일 이내에 주식의 종류와 수를 기재한 서면으로 회사에 대하여 자기가 소유하고 있는 주식의 매수를 청구할 수 있다. <개정 2015.12.1>\n② 제1항의 청구를 받으면 해당 회사는 같은 항의 매수 청구 기간(이하 이 조에서 \"매수청구기간\"이라 한다)이 종료하는 날부터 2개월 이내에 그 주식을 매수하여야 한다. <개정 2015.12.1>\n③제2항의 규정에 의한 주식의 매수가액은 주주와 회사간의 협의에 의하여 결정한다. <개정 2001.7.24>\n④매수청구기간이 종료하는 날부터 30일 이내에 제3항의 규정에 의한 협의가 이루어지지 아니한 경우에는 회사 또는 주식의 매수를 청구한 주주는 법원에 대하여 매수가액의 결정을 청구할 수 있다. <개정 2001.7.24, 2015.12.1>\n⑤법원이 제4항의 규정에 의하여 주식의 매수가액을 결정하는 경우에는 회사의 재산상태 그 밖의 사정을 참작하여 공정한 가액으로 이를 산정하여야 한다. <신설 2001.7.24>\n제374조의2(반대주주의 주식매수청구권)","kind":"L"},{"id":"L:374-3","label":"법 제374조의3","title":"간이영업양도, 양수, 임대 등","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 제374조제1항 각 호의 어느 하나에 해당하는 행위를 하는 회사의 총주주의 동의가 있거나 그 회사의 발행주식총수의 100분의 90 이상을 해당 행위의 상대방이 소유하고 있는 경우에는 그 회사의 주주총회의 승인은 이를 이사회의 승인으로 갈음할 수 있다.\n② 제1항의 경우에 회사는 영업양도, 양수, 임대 등의 계약서 작성일부터 2주 이내에 주주총회의 승인을 받지 아니하고 영업양도, 양수, 임대 등을 한다는 뜻을 공고하거나 주주에게 통지하여야 한다. 다만, 총주주의 동의가 있는 경우에는 그러하지 아니하다.\n③ 제2항의 공고 또는 통지를 한 날부터 2주 이내에 회사에 대하여 서면으로 영업양도, 양수, 임대 등에 반대하는 의사를 통지한 주주는 그 기간이 경과한 날부터 20일 이내에 주식의 종류와 수를 기재한 서면으로 회사에 대하여 자기가 소유하고 있는 주식의 매수를 청구할 수 있다. 이 경우 제374조의2제2항부터 제5항까지의 규정을 준용한다.\n제374조의3(간이영업양도, 양수, 임대 등)","kind":"L"},{"id":"L:375","label":"법 제375조","title":"사후설립","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제375조(사후설립) 회사가 그 성립 후 2년 내에 그 성립 전부터 존재하는 재산으로서 영업을 위하여 계속하여 사용하여야 할 것을 자본금의 100분의 5 이상에 해당하는 대가로 취득하는 계약을 하는 경우에는 제374조를 준용한다.","kind":"L"},{"id":"L:376","label":"법 제376조","title":"결의취소의 소","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①총회의 소집절차 또는 결의방법이 법령 또는 정관에 위반하거나 현저하게 불공정한 때 또는 그 결의의 내용이 정관에 위반한 때에는 주주ㆍ이사 또는 감사는 결의의 날로부터 2월내에 결의취소의 소를 제기할 수 있다. <개정 1984.4.10, 1995.12.29>\n②제186조 내지 제188조, 제190조 본문과 제191조의 규정은 제1항의 소에 준용한다. <개정 1984.4.10, 1995.12.29>\n제376조(결의취소의 소)","kind":"L"},{"id":"L:377","label":"법 제377조","title":"제소주주의 담보제공의무","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주주가 결의취소의 소를 제기한 때에는 법원은 회사의 청구에 의하여 상당한 담보를 제공할 것을 명할 수 있다. 그러나 그 주주가 이사 또는 감사인 때에는 그러하지 아니하다. <개정 1984.4.10>\n②제176조제4항의 규정은 제1항의 청구에 준용한다. <개정 1984.4.10>\n제377조(제소주주의 담보제공의무)","kind":"L"},{"id":"L:378","label":"법 제378조","title":"결의취소의 등기","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제378조(결의취소의 등기) 결의한 사항이 등기된 경우에 결의취소의 판결이 확정된 때에는 본점의 소재지에서 등기하여야 한다.","kind":"L"},{"id":"L:379","label":"법 제379조","title":"법원의 재량에 의한 청구기각","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제379조(법원의 재량에 의한 청구기각) 결의취소의 소가 제기된 경우에 결의의 내용, 회사의 현황과 제반사정을 참작하여 그 취소가 부적당하다고 인정한 때에는 법원은 그 청구를 기각할 수 있다.","kind":"L"},{"id":"L:380","label":"법 제380조","title":"결의무효 및 부존재확인의 소","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제380조(결의무효 및 부존재확인의 소) 제186조 내지 제188조, 제190조 본문, 제191조, 제377조와 제378조의 규정은 총회의 결의의 내용이 법령에 위반한 것을 이유로 하여 결의무효의 확인을 청구하는 소와 총회의 소집절차 또는 결의방법에 총회결의가 존재한다고 볼 수 없을 정도의 중대한 하자가 있는 것을 이유로 하여 결의부존재의 확인을 청구하는 소에 이를 준용한다. <개정 1984.4.10, 1995.12.29>","kind":"L"},{"id":"L:381","label":"법 제381조","title":"부당결의의 취소, 변경의 소","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①주주가 제368조제3항의 규정에 의하여 의결권을 행사할 수 없었던 경우에 결의가 현저하게 부당하고 그 주주가 의결권을 행사하였더라면 이를 저지할 수 있었을 때에는 그 주주는 그 결의의 날로부터 2월내에 결의의 취소의 소 또는 변경의 소를 제기할 수 있다. <개정 2014.5.20>\n②제186조 내지 제188조, 제190조 본문, 제191조, 제377조와 제378조의 규정은 제1항의 소에 준용한다. <개정 1998.12.28>\n제381조(부당결의의 취소, 변경의 소)","kind":"L"},{"id":"L:382","label":"법 제382조","title":"이사의 선임, 회사와의 관계 및 사외이사","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 이사는 주주총회에서 선임한다.\n② 회사와 이사의 관계는 「민법」의 위임에 관한 규정을 준용한다.\n③ 사외이사(社外理事)는 해당 회사의 상무(常務)에 종사하지 아니하는 이사로서 다음 각 호의 어느 하나에 해당하지 아니하는 자를 말한다. 사외이사가 다음 각 호의 어느 하나에 해당하는 경우에는 그 직을 상실한다. <개정 2011.4.14>\n1. 회사의 상무에 종사하는 이사ㆍ집행임원 및 피용자 또는 최근 2년 이내에 회사의 상무에 종사한 이사ㆍ감사ㆍ집행임원 및 피용자\n2. 최대주주가 자연인인 경우 본인과 그 배우자 및 직계 존속ㆍ비속\n3. 최대주주가 법인인 경우 그 법인의 이사ㆍ감사ㆍ집행임원 및 피용자\n4. 이사ㆍ감사ㆍ집행임원의 배우자 및 직계 존속ㆍ비속\n5. 회사의 모회사 또는 자회사의 이사ㆍ감사ㆍ집행임원 및 피용자\n6. 회사와 거래관계 등 중요한 이해관계에 있는 법인의 이사ㆍ감사ㆍ집행임원 및 피용자\n7. 회사의 이사ㆍ집행임원 및 피용자가 이사ㆍ집행임원으로 있는 다른 회사의 이사ㆍ감사ㆍ집행임원 및 피용자\n제382조(이사의 선임, 회사와의 관계 및 사외이사)","kind":"L"},{"id":"L:382-2","label":"법 제382조의2","title":"집중투표","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"①2인 이상의 이사의 선임을 목적으로 하는 총회의 소집이 있는 때에는 의결권없는 주식을 제외한 발행주식총수의 100분의 3 이상에 해당하는 주식을 가진 주주는 정관에서 달리 정하는 경우를 제외하고는 회사에 대하여 집중투표의 방법으로 이사를 선임할 것을 청구할 수 있다.\n②제1항의 청구는 주주총회일의 7일 전까지 서면 또는 전자문서로 하여야 한다. <개정 2009.5.28>\n③제1항의 청구가 있는 경우에 이사의 선임결의에 관하여 각 주주는 1주마다 선임할 이사의 수와 동일한 수의 의결권을 가지며, 그 의결권은 이사 후보자 1인 또는 수인에게 집중하여 투표하는 방법으로 행사할 수 있다.\n④제3항의 규정에 의한 투표의 방법으로 이사를 선임하는 경우에는 투표의 최다수를 얻은 자부터 순차적으로 이사에 선임되는 것으로 한다.\n⑤제1항의 청구가 있는 경우에는 의장은 의결에 앞서 그러한 청구가 있다는 취지를 알려야 한다.\n⑥제2항의 서면은 총회가 종결될 때까지 이를 본점에 비치하고 주주로 하여금 영업시간내에 열람할 수 있게 하여야 한다.\n제382조의2(집중투표)","kind":"L"},{"id":"L:382-3","label":"법 제382조의3","title":"이사의 충실의무 등","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 이사는 법령과 정관의 규정에 따라 회사 및 주주를 위하여 그 직무를 충실하게 수행하여야 한다.\n② 이사는 그 직무를 수행함에 있어 총주주의 이익을 보호하여야 하고, 전체 주주의 이익을 공평하게 대우하여야 한다.\n제382조의3(이사의 충실의무 등)","kind":"L"},{"id":"L:382-4","label":"법 제382조의4","title":"이사의 비밀유지의무","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"제382조의4(이사의 비밀유지의무) 이사는 재임중 뿐만 아니라 퇴임후에도 직무상 알게된 회사의 영업상 비밀을 누설하여서는 아니된다.","kind":"L"},{"id":"L:383","label":"법 제383조","title":"원수, 임기","chapter":"제3편 회사 제4장 주식회사","deleted":false,"text":"① 이사는 3명 이상이어야 한다. 다만, 자본금 총액이 10억원 미만인 회사는 1명 또는 2명으로 할 수 있다. <개정 2009.5.28>\n②이사의 임기는 3년을 초과하지 못한다. <개정 1984.4.10>\n③제2항의 임기는 정관으로 그 임기 중의 최종의 결산기에 관한 정기주주총회의 종결에 이르기까지 연장할 수 있다.
