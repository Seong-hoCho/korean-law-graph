자들의 보험자들에 대한 구상권을 대위 취득하는 ‘보험자대위권’이 별개의 권리인지 여부 [4] 甲이 소유 차량을 운전하여 편도 2차로 도로의 1차로를 따라 주행하던 중 2차로에 주차된 乙 소유","url":"https://www.law.go.kr/precInfoP.do?precSeq=241627"},{"id":"P:241571","kind":"P","label":"2020다245552","title":"손해배상(기)[대표이사 해임을 이유로 손해배상을 구하는 사건]","court":"대법원","date":"2024.09.13","caseType":"민사","basis":"참조조문","text":"임기를 정한 이사를 정당한 사유 없이 주주총회 특별결의로 해임하는 경우 이사가 회사에 대하여 해임으로 인한 손해배상을 청구할 수 있다고 정한 상법 제385조 제1항 단서를 이사회가 대표이사를 해임하는 경우에 유추적용할 수 있는지 여부 및 이는 상법 제389조 제1항 단서에 따라 정관으로 주주총회에서 대표이사를 선정할 것을 정하여 주주총회가 대표이사를 해임하는 경우에도 마찬가지인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=241571"},{"id":"P:241589","kind":"P","label":"2021두51881","title":"종합소득세부과처분취소등[홍콩에 설립된 외국법인의 주식 등이 정관에 의하여 양도가 제한된 경우로서 구 국세기본법 제40조 제1항 제2호에서 정한 법인의 제2차 납세의무 요건을 충족하는지 여부가 문제된 사건]","court":"대법원","date":"2024.09.12","caseType":"세무","basis":"판례내용","text":"[1] 구 국세기본법 제40조 제1항 제2호에서 법인의 제2차 납세의무 성립요건 중 하나로 정한 ‘법인의 정관에 의하여 출자자의 주식 등의 양도가 제한된 경우’에 해당하는지 판단하는 방법 및 이때 출자자의 주식 등이 외국법인이 발행한 것으로서 외국적 요소가 있는 법률관계에 해당하는 경우, 구 국제사법의 규정에 따라 정하여지는 준거법을 1차적인 기준으로 하는지 여부 / 법인 정관의 해석 및 효력 문제에 관하여 해당 법인의 설립 준거법에 따라야 하는지 여부 / 외국적 요소가 있는 법률관계에 관하여 적용될 외국 법규의 의미와 내용을 확정하는 방법 [2] 관할 세무서장이 甲에게 종합소득세 등을 부과·고지하였는데, 甲의 재산으로 체납 국세를 징수하기에 부족하자, 甲이 실제로는 중화인민공화국 홍콩특별행정구의 법령에 따라 홍콩특별행정구에서 설립된 우리나라 법인세법상 외국법인에 해당하는 乙 법인의 지분 100%를 가진 과점주주임을 전제로 구 국세기본법 제40조에 따라 乙 법인을 甲의 제2차 납세의무자로 지정하고, 乙 법인의 순자산가액을 한도로 乙 법인에 종합소득세 등 부과처분을 하며 乙 법인 소유의 부동산과 채권들을 압류한 사안에서, 乙 법인의 주식은 ‘정관에 의하여 양도가 제한된 경우’로서 구 국세기본법 제40조 제1항 제2호의 요건을 모두 충족한다는 이유로, 이와 달리 본 원심판단에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=241589"},{"id":"P:606363","kind":"P","label":"2024노514","title":"특정경제범죄가중처벌등에관한법률위반(횡령)·특정경제범죄가중처벌등에관한법률위반(배임)(인정된죄명업무상배임)·주식회사의외부감사에관한법률위반·특정경제범죄가중처벌등에관한법률위반(횡령)방조·대부업의등록및금융이용자보호에관한법률위반","court":"서울고등법원","date":"2024.09.12","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606363"},{"id":"P:616615","kind":"P","label":"2022나2024467","title":"부당이득금반환청구의소","court":"서울고등법원","date":"2024.09.11","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=616615"},{"id":"P:618485","kind":"P","label":"2023가단109994","title":"대여금","court":"인천지방법원부천지원","date":"2024.09.11","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=618485"},{"id":"P:624491","kind":"P","label":"2020가합571614","title":"공사대금등청구의소·건물철거등청구","court":"서울중앙지방법원","date":"2024.09.10","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=624491"},{"id":"P:614457","kind":"P","label":"2023구합81466","title":"증여세부과처분취소","court":"서울행정법원","date":"2024.08.23","caseType":"세무","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=614457"},{"id":"P:600379","kind":"P","label":"2023다214818","title":"구상금","court":"대법원","date":"2024.08.23","caseType":"민사","basis":"참조조문","text":"[1] 상법 제814조 제1항에서 정한 제척기간이 지난 뒤에 그 기간 경과의 이익을 받는 당사자가 기간이 지난 사실을 알면서도 기간 경과로 인한 법적 이익을 받지 않겠다는 의사를 명확히 표시한 경우, 민법 제184조 제1항을 유추적용하여 제척기간 경과로 인한 권리소멸의 이익을 포기하였다고 인정할 수 있는지 여부 [2] 甲 주식회사가 해상운송인인 乙 주식회사와 체결한 운송계약에 따라 수하인으로서 인도받은 화물이 인도 당시 이미 손상된 상태였고, 甲 회사가 화물을 인도받은 때부터 상법 제814조 제1항에서 정한 제척기간 1년이 지난 뒤에 乙 회사에 화물의 손상에 대하여 ‘보험처리가 완결되지 않아서 Time bar 연장이 필요하다.’는 요청을 하자, 乙 회사가 연장에 동의하는 회신을 하였다가 제척기간의 문제를 인식하고 甲 회사에 자신의 연장 동의가 무효임을 알렸는데, 이후 甲 회사에 보험금을 지급한 丙 보험회사가 甲 회사의 손해배상채권을 대위취득하였다며 乙 회사를 상대로 구상금을 청구하는 소를 제기한 사안에서, 위 소가 제척기간이 지난 후 제기되어 부적법하다고 보면서, 乙 회사가 제척기간이 지난 사실을 알면서도 기간 경과로 인한 법적 이익을 받지 않겠다는 의사를 명확히 표시하였다고 보기 어렵다고 본 원심판단에 법리오해 등의 잘못이 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=600379"},{"id":"P:600465","kind":"P","label":"2024다222793","title":"청구이의","court":"대법원","date":"2024.08.01","caseType":"민사","basis":"참조조문","text":"甲 사회복지법인의 근로자가 甲 법인에 대하여 갖는 임금 채권이 상사채권에 해당하는지 문제 된 사안에서, 사회복지사업법의 여러 규정에 비추어 보면 甲 법인의 활동은 상인의 영업활동과는 본질적으로 차이가 있고, 甲 법인의 업무수행 과정에 형성된 법률관계에 대하여 상법을 적용하여야 할 특별한 사회경제적 필요 내지 요청이 있다고 볼 수도 없으므로, 甲 법인을 상법 제4조 또는 제5조 제1항이 규정하는 상인이라고 볼 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=600465"},{"id":"P:599779","kind":"P","label":"2020다289743","title":"보험금","court":"대법원","date":"2024.07.25","caseType":"민사","basis":"참조조문","text":"[1] 보험약관에서 ‘피보험자 등의 고의에 의한 사고’를 면책사유로 규정하고 있는 경우, 여기서 말하는 ‘고의’의 의미 / 고의를 인정할 직접적인 증거가 없는 경우, 상당한 관련성이 있는 간접사실을 증명하는 방법에 따라 고의를 인정할 수 있는지 여부 및 상당한 관련성이 있는 간접사실에 해당하는지 판단하는 방법 [2] 보험자에게 보험약관의 명시·설명의무가 면제되는 경우 및 보험자가 보험약관의 명시·설명의무를 위반하여 보험계약을 체결한 경우, 약관의 내용을 보험계약의 내용으로 주장할 수 있는지 여부 / 명시·설명의무의 이행에 관한 증명책임의 소재","url":"https://www.law.go.kr/precInfoP.do?precSeq=599779"},{"id":"P:624947","kind":"P","label":"2023가합3210","title":"손해배상(기)","court":"광주지방법원해남지원","date":"2024.07.24","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=624947"},{"id":"P:616555","kind":"P","label":"2022가합546698","title":"근저당권말소·손해배상청구의소","court":"서울중앙지방법원","date":"2024.07.24","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=616555"},{"id":"P:616645","kind":"P","label":"2021나2006424","title":"조합원지분환급의소","court":"서울고등법원","date":"2024.07.18","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=616645"},{"id":"P:599705","kind":"P","label":"2023다213556","title":"금품청산금지급청구의소","court":"대법원","date":"2024.07.11","caseType":"민사","basis":"참조조문","text":"한국의료분쟁조정중재원의 근로자가 한국의료분쟁조정중재원에 대하여 갖는 급여, 퇴직금 등 채권이 상사채권에 해당하는지 문제 된 사안에서, 의료사고 피해구제 및 의료분쟁 조정 등에 관한 법률의 관련 규정에 비추어 보면 한국의료분쟁조정중재원의 활동은 상인의 영업활동과는 본질적으로 차이가 있고, 한국의료분쟁조정중재원의 업무수행 과정에 형성된 법률관계에 대하여 상법을 적용하여야 할 특별한 사회경제적 필요 내지 요청이 있다고 볼 수도 없으므로, 한국의료분쟁조정중재원을 상법 제4조 또는 제5조 제1항이 규정하는 상인이라고 볼 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=599705"},{"id":"P:241029","kind":"P","label":"2022다252936","title":"구상금[재난배상책임보험의 보험금 지급책임 발생 여부가 문제된 사건]","court":"대법원","date":"2024.07.11","caseType":"민사","basis":"참조조문","text":"[1] 구 재난 및 안전관리 기본법 제76조 제2항에 따라 가입되는 개별 보험계약의 내용이 책임보험만을 정하고 있는 경우, 보험자는 피보험자가 법률상 손해배상책임을 부담하는 경우에만 보험금 지급의무를 부담하는지 여부 [2] 甲 보험회사가 아파트 건물에 관하여 체결한 재난배상책임보험계약의 약관에서 ‘피보험자가 소유·관리 또는 점유하는 시설에서 화재 등으로 발생한 손해에 대하여 피보험자의 과실 여부를 불문하고 피보험자가 피해자에 대하여 법률상의 손해배상책임을 부담하는 경우에 이를 보상한다.’는 취지로 정하고 있는데, 乙 소유 세대에서 화재가 발생하여 아파트 공용부분 및 다른 세대에 피해가 발생하자 아파트종합보험의 보험자인 丙 보험회사가 피해자들에게 보험금을 지급한 후 甲 회사를 상대로 구상금 지급을 구한 사안에서, 위 보험계약은 상법 제719조의 책임보험에 해당하므로 피보험자가 피해자에게 과실 또는 무과실의 법률상 손해배상책임을 부담하는 경우에만 甲 회사에 보험금 지급의무가 발생한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=241029"},{"id":"P:600499","kind":"P","label":"2022다307379","title":"손해배상(기)","court":"대법원","date":"2024.07.11","caseType":"민사","basis":"참조조문","text":"당사자들이 자금을 출자하여 공동으로 주식회사를 설립하여 운영하고 이에 따른 비용 부담과 이익 분배를 지분 비율에 따라 할 것을 내용으로 하는 동업약정이 공동사업을 위하여 민법상 조합을 결성할 것을 목적으로 하는지 여부 및 위 동업약정에 따른 당자사들의 출자 기타 재산이 조합원의 합유로 되는지 여부 / 위와 같은 동업약정에서 일방 당사자가 주식회사의 청산에 관한 상법 규정에 따른 청산절차를 거치지 않고 잔여재산의 분배를 받을 수 있는지 여부 및 이러한 법리는 동업약정에 따라 주식회사가 설립된 후 당사자 일방이 동업관계에서의 탈퇴를 주장하며 정산을 구하는 경우에도 그대로 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=600499"},{"id":"P:615745","kind":"P","label":"2022가합544685","title":"손해배상(기)","court":"서울중앙지방법원","date":"2024.07.11","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=615745"},{"id":"P:599665","kind":"P","label":"2020다246913","title":"구상금","court":"대법원","date":"2024.07.11","caseType":"민사","basis":"참조조문","text":"[1] 상법 제724조 제2항에서 정한 피해자의 직접청구권이 보험자대위의 목적이 될 수 있는지 여부 [2] 상법 제724조 제2항 단서의 규정 취지 및 여기서 말하는 ‘피보험자가 그 사고에 관하여 가지는 항변’의 의미","url":"https://www.law.go.kr/precInfoP.do?precSeq=599665"},{"id":"P:612047","kind":"P","label":"2023가합93375","title":"청구이의","court":"서울중앙지방법원","date":"2024.07.05","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=612047"},{"id":"P:241189","kind":"P","label":"2023노878","title":"보험사기방지특별법위반","court":"제주지방법원","date":"2024.07.04","caseType":"형사","basis":"참조조문","text":"甲이 자신의 아들인 乙을 피보험자로 하여 화재보험회사인 피해자 회사의 실손 의료비보험 등에 가입하였는데, 乙이 전동킥보드를 구입하여 타다가 넘어져 상해를 입고 병원 치료를 받게 되자, 피고인이 甲, 보험설계사인 丙과 공모하여, 전동킥보드를 운행하다가 상해를 입은 사고는 피해자 회사에서 보험금 지급이 제한되는 사실을 알면서도 ‘넘어져서 다침’으로 상해 발생원인을 허위로 기재하고 응급초진차트를 누락시켜 보험금을 청구하는 방법으로 피해자 회사를 기망하여 피해자 회사로부터 상해입원의료비 등을 교부받음으로써 보험사기행위로 보험금을 취득했다는 공소사실로 기소된 사안에서, 검사가 제출한 증거만으로는 피고인이 공소사실 기재와 같이 피해자 회사를 기망했다는 점이 합리적 의심의 여지가 없을 정도로 증명되었다고 보기 부족하고, 달리 이를 인정할 증거가 없어 무죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=241189"},{"id":"P:614539","kind":"P","label":"2023노878","title":"보험사기방지특별법위반","court":"제주지방법원","date":"2024.07.04","caseType":"형사","basis":"참조조문","text":"甲이 자신의 아들인 乙을 피보험자로 하여 화재보험회사인 피해자 회사의 실손 의료비보험 등에 가입하였는데, 乙이 전동킥보드를 구입하여 타다가 넘어져 상해를 입고 병원 치료를 받게 되자, 피고인이 甲, 보험설계사인 丙과 공모하여, 전동킥보드를 운행하다가 상해를 입은 사고는 피해자 회사에서 보험금 지급이 제한되는 사실을 알면서도 ‘넘어져서 다침’으로 상해 발생원인을 허위로 기재하고 응급초진차트를 누락시켜 보험금을 청구하는 방법으로 피해자 회사를 기망하여 피해자 회사로부터 상해입원의료비 등을 교부받음으로써 보험사기행위로 보험금을 취득했다는 공소사실로 기소된 사안에서, 검사가 제출한 증거만으로는 피고인이 공소사실 기재와 같이 피해자 회사를 기망했다는 점이 합리적 의심의 여지가 없을 정도로 증명되었다고 보기 부족하고, 달리 이를 인정할 증거가 없어 무죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=614539"},{"id":"P:619349","kind":"P","label":"2022나2021376","title":"손해배상(기)","court":"서울고등법원","date":"2024.07.03","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619349"},{"id":"P:618563","kind":"P","label":"2023노2003","title":"특정범죄가중처벌등에관한법률위반(허위세금계산서교부등)·특정범죄가중처벌등에관한법률위반(조세)(인정된죄명조세범처벌법위반)·조세범처벌법위반·특정경제범죄가중처벌등에관한법률위반(횡령)·특정경제범죄가중처벌등에관한법률위반(사기)·특정범죄가중처벌등에관한법률위반(조세)방조(인정된죄명조세범처벌법위반방조)·조세범처벌법위반방조·특정범죄가중처벌등에관한법률위반(허위세금계산서교부등)방조","court":"서울고등법원","date":"2024.06.28","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=618563"},{"id":"P:240957","kind":"P","label":"2022다302022","title":"명의개서절차이행등청구[동업으로 주식회사를 설립한 경우 민법상 조합에 해당하는지 여부와 그 정산 방법 및 동업약정 당사자들의 공동사업이 주식회사 명의로 운영되고 주식회사 법리에 따르기 위한 요건 등이 문제된 사건]","court":"대법원","date":"2024.06.27","caseType":"민사","basis":"참조조문","text":"[1] 당사자들이 자금을 출자하여 공동으로 주식회사를 설립하여 운영하고 이에 따른 비용 부담과 이익 분배를 지분 비율에 따라 할 것을 내용으로 하는 동업약정이 공동사업을 위하여 민법상 조합을 결성할 것을 목적으로 하는지 여부 / 위와 같은 동업약정에 따라 주식회사가 설립된 후 일방 당사자가 주식회사의 청산에 관한 상법 규정에 따른 청산절차를 거치지 않고 잔여재산의 분배를 받을 수 있는지 여부 및 이러한 법리는 동업약정에 따라 주식회사가 설립된 후 당사자 일방이 동업관계에서의 탈퇴를 주장하며 정산을 구하는 경우에도 그대로 적용되는지 여부 [2] 동업약정 당사자들의 공동사업이 주식회사 명의로 운영되고 대내관계 및 대외관계에서 주식회사의 법리에 따르기 위한 요건 / 당사자 일부가 주주가 되지 않은 동업약정의 경우, 그 당사자 일부의 출자 자금이 주식회사에 투자되었다고 하여 동업약정의 당사자들이 공동으로 주식회사를 설립하거나 운영한다고 할 수 있는지 여부 및 이 경우 주식회사 주식이나 주식회사 소유의 재산이 동업약정의 재산이 될 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=240957"},{"id":"P:240965","kind":"P","label":"2024다219766","title":"보험금[보험계약상 통지의무 위반이 문제된 사건]","court":"대법원","date":"2024.06.27","caseType":"민사","basis":"참조조문","text":"[1] 보험계약자 또는 피보험자가 고지의무를 위반함으로써 보험계약 성립 시 고지된 위험과 보험기간 중 객관적으로 존재하게 된 위험에 차이가 생긴 경우, 보험자가 상법 제652조의 통지의무 위반을 이유로 계약을 해지할 수 있는지 여부 및 이는 고지의무 위반에 따른 해지권 행사의 제척기간이 경과하여 보험자가 고지의무 위반을 이유로 계약을 해지할 수 없게 된 경우에도 마찬가지인지 여부 [2] 甲 등이 乙 보험회사와 피보험자를 甲으로 하여 상해사망 등 사고 발생 시 乙 회사가 보험금을 지급하는 내용의 보험계약을 체결하였는데, 甲은 보험계약 체결 이전부터 사망할 때까지 건설현장의 일용직 근로자로 근무하였으나 甲 등은 보험계약 체결 당시 乙 회사에 甲의 직업을 위 실제 직업보다 보험사고 발생의 위험이 낮은 사무원 등으로 고지하였고, 보험계약 체결 이후에도 乙 회사에 고지된 직업과 실제 직업이 다르다는 것을 통지하지 아니한 사안에서, 보험기간 중에 甲의 실제 직업이 변경되지 않았으므로 그 직업이 보험계약 체결 당시 乙 회사에 고지된 것과 다르더라도 상법 제652조 제1항의 통지의무를 위반하였다고 볼 수 없다고 한 원심판단이 정당하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=240965"},{"id":"P:622951","kind":"P","label":"2021가합523292","title":"배당이의","court":"서울중앙지방법원","date":"2024.06.21","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=622951"},{"id":"P:241953","kind":"P","label":"2024다207053","title":"손해배상(기)","court":"대법원","date":"2024.06.17","caseType":"민사","basis":"참조조문","text":"소규모 주식회사의 경우, 대표이사가 이사회 결의를 거치지 않고 중요한 자산의 처분 및 양도, 지점의 설치·이전 또는 폐지 등 회사의 업무집행을 할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=241953"},{"id":"P:240907","kind":"P","label":"2018다261322","title":"주주지위부존재확인등","court":"대법원","date":"2024.06.13","caseType":"민사","basis":"참조조문","text":"[1] 주주총회 결의 부존재확인의 소에서 확인의 이익이 인정될 수 있는 경우 / 확인의 소에서 확인의 이익 유무가 직권조사사항인지 여부 [2] 주주명부상 주주만이 회사에 대한 관계에서 의결권 등 주주권을 행사할 수 있는지 여부 및 회사가 주주명부상 주주의 주주권 행사를 부인하거나 주주명부에 기재를 마치지 아니한 자의 주주권 행사를 인정할 수 있는지 여부 / 주주명부에 기재를 마치지 않은 자가 회사에 대한 관계에서 주주권을 행사할 수 있는 경우 [3] 주식이 발행되는 경우, 회사가 인수인의 청약에 상응하는 주식의 배정이 이루어졌는지, 인수인의 법률상 의무가 이행되었는지 등을 확인한 후 인수인을 주주로 기재하였다면 그 주주명부의 기재는 적법한 것으로 보아야 하는지 여부 [4] 주식이 양도되는 경우, 주식을 양수한 자가 취득 사실을 증명하는 방법으로 명의개서를 청구하고 회사가 형식적 심사의무를 다하여 명의개서를 하였다면 그 명의개서에 따른 주주명부의 기재는 적법한 것으로 보아야 하는지 여부 [5] 명의개서에 따른 주주명부의 기재가 적법하다고 볼 수 없는 경우, 명의개서 직전에 적법하게 작성된 주주명부가 존재한다면 그 주주명부상 주주가 회사에 대한 관계에서 주주권을 행사할 수 있는지 여부 [6] 대부분의 주주에게 소집통지를 발송하지 아니하고 개최된 주주총회의 성립이 인정되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=240907"},{"id":"P:619537","kind":"P","label":"2022가단5090124","title":"구상금","court":"서울중앙지방법원","date":"2024.05.30","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619537"},{"id":"P:612911","kind":"P","label":"2022나14934","title":"대여금등청구의소","court":"서울고등법원인천재판부","date":"2024.05.23","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=612911"},{"id":"P:600315","kind":"P","label":"2023나63989","title":"구상금","court":"서울중앙지방법원","date":"2024.05.21","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=600315"},{"id":"P:240825","kind":"P","label":"2022다290648","title":"구상금[보험자가 피보험자인 사용자에 대하여 그의 피용자에 대한 사용자책임을 근거로 보험자 대위를 할 수 있는지 여부가 문제된 사건]","court":"대법원","date":"2024.05.09","caseType":"민사","basis":"참조조문","text":"[1] 자동차책임보험약관에서 기명피보험자의 승낙을 얻어 자동차를 사용 또는 관리 중인 자 등도 피보험자로 정하고 있는데, 이러한 승낙피보험자 등의 행위로 인하여 보험사고가 발생한 경우, 보험자가 상법 제682조에서 정한 보험자 대위를 할 수 있는지 여부 [2] 전국전세버스운송사업조합연합회가 甲 주식회사와 통학차량에 관하여 기명조합원을 甲 회사로 하여 자동차공제계약을 체결하였고, 乙은 甲 회사로부터 통학차량을 임차하여 자신이 운영하는 유치원 원생들의 통학 등에 사용하였는데, 운전기사 丙과 유치원 교사 丁 등이 유치원생 戊의 하차 여부를 확인하지 않은 채 차량 문을 잠그고 운행을 종료하여 차량에 방치된 戊가 열사병, 무산소성 뇌손상 등의 상해를 입게 되었고, 이에 연합회가 戊에게 치료비 등을 지급한 후 乙을 상대로 구상금 지급을 구한 사안에서, 乙은 통학차량을 사용·관리하는 사람으로서 공제계약에서 정한 승낙조합원에 포함된다고 볼 여지가 있어 상법 제682조에서 정한 보험자 대위를 할 수 있는 제3자에 해당하지 않을 수 있는데도, 이에 관한 심리 없이 연합회의 乙에 대한 보험자 대위를 인정한 원심판단에 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=240825"},{"id":"P:241675","kind":"P","label":"2024다200533","title":"구상금","court":"대법원","date":"2024.05.09","caseType":"민사","basis":"참조조문","text":"[1] 보험자가 상법 제682조 제1항에서 정한 보험자대위권을 행사할 수 있는 범위 [2] 불법행위 등으로 인하여 물건이 훼손된 경우, 통상의 손해를 산정하는 방법 및 훼손된 물건이 이미 내용연수가 상당히 경과된 낡은 것인 경우, 이를 신품으로 원상회복시키는 데 소요되는 복구비를 토대로 교환가치를 산정할 때 감가상각비용을 공제하여야 하는지 여부 [3] 甲 보험회사가 乙과 공장 건물, 기계설비 등을 보험목적물로 하는 화재보험계약을 체결하면서 손해 발생 시 보험의 목적과 동형·동질의 신품을 조달하는 데 소요되는 금액을 보상해 주는 재조달가액 특약을 맺었고, 그 후 丙 주식회사의 과실로 발생한 화재로 乙이 입은 손해에 관하여 보험금을 지급하면서 공장 내 기계설비에 관한 손해액은 재조달가액 특약이 있음을 이유로 그 복구비에서 감가상각비용을 공제하지 않고 산정하였는데, 甲 회사가 상법 제682조 제1항에 따라 보험자대위권을 행사할 수 있는 범위가 문제 된 사안에서, 甲 회사는 훼손 직전의 건물 및 기계설비로 원상회복시키는 데 소요되는 수리비 또는 신품 조달비에서 감가상각비용을 공제한 금액에 대해서만 구상을 할 수 있는데도, 감가상각을 고려하지 않은 수리비 전액을 구상할 수 있다고 본 원심판단에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=241675"},{"id":"P:421174","kind":"P","label":"2023구합23249","title":"이 사건 계약이 적법하게 취소되어 그에 기한 취득세 과세처분이 위법하다고 볼 수 있는지 여부","court":"부산지방법원","date":"2024.05.02","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=421174"},{"id":"P:614515","kind":"P","label":"2023가단207547","title":"대여금(잔부판결)","court":"서울서부지방법원","date":"2024.04.30","caseType":"민사","basis":"참조조문","text":"노인복지센터를 운영하던 甲이 乙 은행으로부터 대출을 받았고, 그 후 甲이 위 센터의 영업권 및 시설을 丙에게 양도하여 丙이 기존과 동일한 명칭을 사용하여 센터를 운영하고 있는데, 乙 은행이 丙을 상대로 상법 제42조의 상호속용 책임을 주장하며 甲이 乙 은행에 대하여 부담하는 대출원리금 채무의 변제를 구한 사안에서, 위 센터와 같은 재가노인복지시설은 노인복지법이 정하고 있는 노인복지시설의 한 종류이고, 직무의 공공성이 요구되어 여러 가지 규제를 받고 있는 재가노인복지시설의 운영은 상인의 영업활동과는 본질적인 차이가 있으므로, 甲이 상인임을 전제로 하는 乙 은행의 청구는 이유 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=614515"},{"id":"P:241425","kind":"P","label":"2023가단207547","title":"대여금(잔부판결)","court":"서울서부지방법원","date":"2024.04.30","caseType":"민사","basis":"참조조문","text":"노인복지센터를 운영하던 甲이 乙 은행으로부터 대출을 받았고, 그 후 甲이 위 센터의 영업권 및 시설을 丙에게 양도하여 丙이 기존과 동일한 명칭을 사용하여 센터를 운영하고 있는데, 乙 은행이 丙을 상대로 상법 제42조의 상호속용 책임을 주장하며 甲이 乙 은행에 대하여 부담하는 대출원리금 채무의 변제를 구한 사안에서, 위 센터와 같은 재가노인복지시설은 노인복지법이 정하고 있는 노인복지시설의 한 종류이고, 직무의 공공성이 요구되어 여러 가지 규제를 받고 있는 재가노인복지시설의 운영은 상인의 영업활동과는 본질적인 차이가 있으므로, 甲이 상인임을 전제로 하는 乙 은행의 청구는 이유 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=241425"},{"id":"P:615879","kind":"P","label":"2022가합50697","title":"퇴직금등청구의소","court":"창원지방법원","date":"2024.04.25","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=615879"},{"id":"P:240855","kind":"P","label":"2022가합519467","title":"손해배상(기)","court":"서울중앙지방법원","date":"2024.04.18","caseType":"민사","basis":"판례내용","text":"가상자산 거래소 웹사이트를 운영하는 甲 주식회사가 乙 외국회사가 발행한 가상자산 ‘픽셀’에 대한 거래지원을 요청받아 심사를 거쳐 상장을 결정하였으나, 계획유통량 공시와 달리 픽셀의 발행물량 전부가 유통되고 있음을 확인한 후 픽셀을 거래 유의종목으로 지정한 다음 거래지원을 종료하는 상장폐지를 하였는데, 위 웹사이트에 회원으로 가입하여 가상자산 거래를 한 丙 등이 계획유통량 공시를 위반한 픽셀의 유통량 증가로 투자 손실을 입었다고 주장하며 甲 회사를 상대로 손해배상을 구한 사안에서, 제반 사정에 비추어 픽셀의 상장, 상장 이후의 관리 및 상장폐지 과정에서 투자자 보호의무를 위반하였다고 보기 어려우므로 甲 회사의 채무불이행 또는 불법행위를 인정할 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=240855"},{"id":"P:614609","kind":"P","label":"2022가합519467","title":"손해배상(기)","court":"서울중앙지방법원","date":"2024.04.18","caseType":"민사","basis":"판례내용","text":"가상자산 거래소 웹사이트를 운영하는 甲 주식회사가 乙 외국회사가 발행한 가상자산 ‘픽셀’에 대한 거래지원을 요청받아 심사를 거쳐 상장을 결정하였으나, 계획유통량 공시와 달리 픽셀의 발행물량 전부가 유통되고 있음을 확인한 후 픽셀을 거래 유의종목으로 지정한 다음 거래지원을 종료하는 상장폐지를 하였는데, 위 웹사이트에 회원으로 가입하여 가상자산 거래를 한 丙 등이 계획유통량 공시를 위반한 픽셀의 유통량 증가로 투자 손실을 입었다고 주장하며 甲 회사를 상대로 손해배상을 구한 사안에서, 제반 사정에 비추어 픽셀의 상장, 상장 이후의 관리 및 상장폐지 과정에서 투자자 보호의무를 위반하였다고 보기 어려우므로 甲 회사의 채무불이행 또는 불법행위를 인정할 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=614609"},{"id":"P:599781","kind":"P","label":"2023나15677","title":"보험금","court":"울산지방법원","date":"2024.04.18","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=599781"},{"id":"P:241519","kind":"P","label":"2023다293620","title":"채무부존재확인","court":"대법원","date":"2024.04.16","caseType":"민사","basis":"참조조문","text":"[1] 보험자에게 보험약관의 명시·설명의무가 면제되는 경우 및 보험자가 보험약관의 명시·설명의무를 위반하여 보험계약을 체결한 경우, 약관의 내용을 보험계약의 내용으로 주장할 수 있는지 여부 / 명시·설명의무의 이행에 관한 증명책임의 소재 [2] 甲 보험회사가 乙 주식회사와 乙 회사 임직원의 상해사망사고를 담보하는 보험계약을 체결할 당시 작성된 ‘계약 전 알릴 의무사항’에 기재된 ‘피보험자가 운전하는 차량의 종류와 용도’에 대한 답변으로 ‘승용차’에만 체크 표시가 되어 있었는데, 피보험자인 丙이 차종과 용도를 ‘자가용 화물차’로 등록한 乙 회사 소유의 차량을 운전하던 중 교통사고로 사망하였고, 이에 乙 회사가 보험금 지급을 청구하였으나 甲 회사가 고지의무 위반을 이유로 보험계약의 해지를 통보하고 보험금 지급을 거절한 사안에서, 甲 회사나 甲 회사의 보험모집인으로서는 ‘丙이 운전하는 차량의 종류 및 용도’와 관련하여 운전 가능한 모든 차량을 빠짐없이 기재하여야 한다는 점이 보험계약의 인수조건 등에 영향을 미치는 중요한 사항으로서 甲 회사에 고지되어야 하고, 이를 고지하지 않을 경우 보험계약이 해지되어 보험금을 지급받지 못할 수도 있다는 점 등을 구체적이고 상세하게 설명할 의무가 있는데도, 이와 달리 본 원심판단에 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=241519"},{"id":"P:614453","kind":"P","label":"2023누58413","title":"업무정지등취소의소","court":"서울고등법원","date":"2024.03.27","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=614453"},{"id":"P:239907","kind":"P","label":"2021다309927","title":"근저당권말소","court":"대법원","date":"2024.03.12","caseType":"민사","basis":"참조조문","text":"[1] 일방적 상행위 또는 보조적 상행위로 인한 채권도 상법 제64조에 정한 상사 소멸시효가 적용되는 상사채권에 해당하는지 여부 / 회사의 행위는 영업을 위하여 한 것으로 추정되는지 여부 및 이러한 추정을 번복하기 위한 증명책임의 소재 [2] 甲 주식회사가 도시개발사업의 사업시행대행자 및 시공사로 선정된 乙 주식회사로부터 사업권 일부를 얻을 목적으로 乙 회사의 대표이사 丙에게 위 사업의 사업비로 사용할 금전을 대여하였다가 乙 회사가 부도로 사업에서 배제된 후 파산선고를 받자, 丙 및 乙 회사의 공동대표이사 丁과 위 대여금 채권의 정산에 관한 내용이 포함된 금전소비대차계약을 체결하고, 丙, 丁이 戊 신탁회사에 신탁한 부동산에 관하여 甲 회사 명의의 근저당권설정등기를 마친 사안에서, 甲 회사의 금전소비대차계약 체결행위는 영업을 위하여 한 것으로 추정되고 이를 번복할만한 사정이 없으므로 위 근저당권의 피담보채권인 금전소비대차계약에 기한 정산금 채권에는 5년의 상사 소멸시효기간이 적용된다고 보아야 하는데도, 이와 달리 본 원심판단에 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=239907"},{"id":"P:239455","kind":"P","label":"2023다272883","title":"구상금","court":"대법원","date":"2024.02.15","caseType":"민사","basis":"참조조문","text":"[1] 무보험자동차에 의한 상해 담보특약의 법적 성질 및 하나의 사고에 관하여 여러 개의 무보험자동차에 의한 상해 담보특약 보험계약이 체결되고 보험금액의 총액이 피보험자가 입은 손해액을 초과하는 경우, 상법 제672조 제1항이 준용되는지 여부 / 상법 제672조 제1항이 준용됨에 따라 여러 보험자가 각자의 보험금액의 한도에서 연대책임을 지는 경우, 각 보험자가 보험금 지급채무에 대하여 부진정연대관계에 있는지 여부 및 이때 피보험자의 보험금 지급 청구 방법과 보험금을 지급한 보험자의 구상권 행사 방법 / 각 보험계약의 당사자가 중복보험에서 보험자의 보상책임 방식이나 보험자들 사이의 책임 분담 방식을 상법 제672조 제1항과 달리 정할 수 있는지 여부 [2] 자동차보험 구상금분쟁심의에 관한 상호협정과 그 시행규약에 따른 중복보험 선처리사의 후처리사에 대한 구상이 부진정연대관계에 있는 중복보험자 간에 이루어지는 구상의 성격을 갖는지 여부 [3] 채무자가 자신의 채무에 관하여 스스로 또는 이행보조자를 사용하여 법률상 원인 없는 변제를 한 경우 또는 제3자가 타인의 채무에 관하여 법률상 원인 없는 변제를 한 경우, 그 변제로 이루어진 급부에 대하여 부당이득반환을 구할 수 있는 사람 및 이러한 변제 주체에 대한 증명책임의 소재","url":"https://www.law.go.kr/precInfoP.do?precSeq=239455"},{"id":"P:605565","kind":"P","label":"2023나2008554","title":"손해배상(기)등·손해배상(기)","court":"서울고등법원","date":"2024.01.26","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=605565"},{"id":"P:606361","kind":"P","label":"2023고합197","title":"특정경제범죄가중처벌등에관한법률위반(횡령)·특정경제범죄가중처벌등에관한법률위반(배임)(인정된죄명업무상배임)·주식회사의외부감사에관한법률위반·특정경제범죄가중처벌등에관한법률위반(횡령)방조·대부업의등록및금융이용자보호에관한법률위반","court":"서울중앙지방법원","date":"2024.01.26","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606361"},{"id":"P:238465","kind":"P","label":"2020다206472","title":"설계보상비반환","court":"대법원","date":"2024.01.25","caseType":"민사","basis":"참조조문","text":"甲 공사가, 공동수급체를 구성하여 ‘4대강 살리기 사업’ 관련 각 공구 공사의 입찰에 참여하였다가 낙찰자로 선정되지 못하여 설계보상비를 지급받은 회사들을 상대로 담합 등으로 인한 입찰 무효 사유가 있다며 설계보상비 반환을 구한 사안에서, 甲 공사가 입찰을 공고한 공구의 공사에 관하여는 甲 공사와 낙찰자로 결정되지 못한 공동수급체의 구성원 회사들 사이에 설계보상비 지급에 관한 약정이 성립하였고, 甲 공사가 설계보상비 지급에 관한 계약당사자의 지위를 이전받은 공구의 공사에 관하여도 계약당사자 지위의 이전으로 甲 공사와 낙찰자로 결정되지 못한 공동수급체의 구성원 회사들 사이에 설계보상비 지급에 관한 계약이 성립하였으므로, 위 각 공동수급체에 ‘시공사’로 참여한 乙 주식회사 등은 그들이 직접 담합행위에 관여하였는지 여부와 상관없이 설계보상비 지급에 관한 계약에 기해 연대하여 甲 공사에 설계보상비를 반환할 의무를 진다고 보아야 하나, 위 각 공동수급체에 ‘설계사’로 참여한 丙 주식회사 등은 ‘시공사’로 참여한 乙 회사 등과 달리 설계 분야의 의무 이행에 관한 책임만을 부담할 뿐인 점 등 제반 사정에 비추어 그들이 공동수급체의 구성원이라 하더라도 ‘시공사’로 참여한 乙 회사 등과 연대하여 설계보상비를 반환할 책임을 진다고 보기는 어렵다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=238465"},{"id":"P:624549","kind":"P","label":"2021가합541740","title":"부당이득금반환등청구의소","court":"서울중앙지방법원","date":"2024.01.18","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=624549"},{"id":"P:623939","kind":"P","label":"2023누42456","title":"법인세부과처분 및 소득금액변동통지처분 취소","court":"서울고등법원","date":"2024.01.16","caseType":"세무","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=623939"},{"id":"P:607249","kind":"P","label":"2023나10418","title":"주주대표소송","court":"수원고등법원","date":"2024.01.10","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=607249"},{"id":"P:240869","kind":"P","label":"2023다269818","title":"부당이득금","court":"대법원","date":"2023.12.28","caseType":"민사","basis":"참조조문","text":"[1] 상법 제388조에서 정한 ‘이사의 보수’의 범위 및 위 조항이 강행규정인지 여부 [2] 이른바 1인회사인 주식회사의 경우, 주주총회 소집절차에 하자가 있거나 주주총회의사록이 작성되지 않았더라도 1인주주의 의사가 주주총회의 결의내용과 일치한다면 증거에 의하여 그러한 내용의 결의가 있었던 것으로 볼 수 있는지 여부 및 1인회사가 아닌 주식회사의 경우, 주주총회의 의결정족수를 충족하는 주식을 가진 주주들이 동의하거나 승인하였다는 사정만으로 주주총회에서 그러한 내용의 결의가 이루어질 것이 명백하다거나 그러한 내용의 결의가 있었던 것과 마찬가지라고 볼 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=240869"},{"id":"P:238785","kind":"P","label":"2020다225138","title":"대여금청구의소","court":"대법원","date":"2023.12.07","caseType":"민사","basis":"참조조문","text":"영업양도인의 영업으로 인한 채무와 상호를 속용하는 영업양수인의 상법 제42조 제1항에 따른 채무의 관계 및 채권자가 영업양도가 이루어진 뒤 영업양도인을 상대로 소를 제기하여 확정판결을 받은 경우, 소멸시효 중단이나 소멸시효 연장의 효과가 상호를 속용하는 영업양수인에게도 미치는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=238785"},{"id":"P:238797","kind":"P","label":"2019두58445","title":"법인세경정거부처분취소","court":"대법원","date":"2023.11.30","caseType":"세무","basis":"참조조문","text":"[1] 법인세법 제15조 제1항의 “자본 또는 출자의 납입”은 상법상 회사 설립 또는 설립 후 신주 발행 시 이루어지는 납입행위만을 가리키는지 여부 [2] 과세소득은 그 소득을 얻게 된 원인관계의 법률적 평가가 반드시 적법·유효하여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=238797"},{"id":"P:614447","kind":"P","label":"2023나76142","title":"양수금","court":"광주지방법원","date":"2023.11.08","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=614447"},{"id":"P:237921","kind":"P","label":"2023다238029","title":"부당이득금","court":"대법원","date":"2023.11.02","caseType":"민사","basis":"참조조문","text":"[1] 국세기본법 시행령 제43조의3 제2항 단서에 따라 판결이 확정된 날부터 40일 이후에 국세환급금을 지급하는 경우에 적용되는 가산이자율이 판결이 확정된 날까지의 기간에도 소급 적용되는지 여부 [2] 납세자가 조세환급금에 대하여 이행청구를 한 이후에는 환급가산금청구권과 지연손해금청구권이 경합적으로 발생하는지 여부 [3] 회생계획에 따른 회생회사의 분할로 설립되는 신설회사가 회생계획이 정하는 바에 따라 포괄승계하는 회생회사의 권리와 의무에 사법상 관계와 공법상 관계가 모두 포함되는지 여부 / 회생회사의 조세채무가 아직 성립하지 않은 경우라도 가까운 장래에 성립할 가능성이 있는 때에는 회생계획에서 신설회사가 그 지위나 법률효과를 승계할 것인지를 정할 수 있는지 여부 / 회생계획에 따른 회사분할로 어떠한 권리와 의무가 신설회사에 승계되는지 해석하는 방법 [4] 국세환급금에 관한 권리의 양도와 충당에 관하여 정한 구 국세기본법 제53조와 구 국세기본법 시행령 제43조의4에서의 ‘양도’가 민법상 채권양도와 같은 의미인지 여부 / 권리 이전 및 귀속의 법적 근거와 성질을 달리하는 경우에도 위 ‘양도’에 관한 법령상 규정이 적용 또는 유추적용되는지 여부 [5] 과세처분이 당연무효라고 하기 위한 요건 및 과세처분의 하자가 중대하고 명백한지 판별하는 방법 / 어느 법률관계나 사실관계에 대하여 어느 법령의 규정을 적용할 수 없다는 법리가 명백히 밝","url":"https://www.law.go.kr/precInfoP.do?precSeq=237921"},{"id":"P:239495","kind":"P","label":"2023다263025","title":"보험금","court":"대법원","date":"2023.11.02","caseType":"민사","basis":"판례내용","text":"소송촉진 등에 관한 특례법 제3조 제2항에서 정한 ‘채무자가 그 이행의무의 존부나 범위에 관하여 항쟁함이 타당하다고 인정되는 때’의 의미 및 채무자가 이행의무의 존부와 범위를 다투어 제1심에서 주장이 받아들여졌으나 항소심에서 배척된 경우, 항소심판결 선고 시까지 소송촉진 등에 관한 특례법 제3조 제1항에서 정한 지연손해금 이율을 적용할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=239495"},{"id":"P:238439","kind":"P","label":"2023가단132791","title":"기타(금전)","court":"서울북부지방법원","date":"2023.10.26","caseType":"민사","basis":"참조조문","text":"甲이 乙의 공인중개사사무소의 시설을 포함한 영업권 일체를 乙이 ‘길음뉴타운 관할 내에 개업하지 않는 조건’으로 인수하기로 하는 권리 양수·양도 계약을 체결하였는데, 乙이 약 2.4km 떨어져 있는 장위뉴타운 관할 내에서 공인중개사사무소를 개업하자 甲이 경업금지의무 위반을 이유로 계약해제 등을 구한 사안에서, ‘길음뉴타운 관할 내’는 ‘길음 재정비촉진지구’를 의미하는 것으로 해석함이 타당하므로, 乙이 위 계약에서 정한 ‘길음뉴타운 관할 내에 개업하지 않는 조건’을 위반하였다거나 상법 제41조 제1항을 위반하였다고 볼 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=238439"},{"id":"P:619139","kind":"P","label":"2021가단5064487","title":"구상금","court":"서울중앙지방법원","date":"2023.10.26","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619139"},{"id":"P:237947","kind":"P","label":"2020다236848","title":"손해배상(기)","court":"대법원","date":"2023.10.26","caseType":"민사","basis":"참조조문","text":"[1] 상법 제399조 제1항, 제414조 제1항에서 규정하고 있는 주식회사의 이사 또는 감사의 회사에 대한 임무 해태로 인한 손해배상책임에 따른 손해배상채권에 민법 제766조 제1항의 단기소멸시효가 적용되는지 여부 [2] 상법 제401조의2 제1항에서 정한 업무집행지시자 등의 손해배상책임에 따른 손해배상채권에 일반 불법행위책임의 단기소멸시효를 규정한 민법 제766조 제1항이 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=237947"},{"id":"P:240309","kind":"P","label":"2023다249876","title":"소유권이전등기","court":"대법원","date":"2023.09.21","caseType":"민사","basis":"판례내용","text":"[1] 부동산의 매수인이 매매목적물을 인도 받아 사용·수익하고 있는 경우, 매수인의 이전등기청구권에 관한 소멸시효가 진행하는지 여부 / 부동산의 매수인이 부동산을 인도받아 사용·수익하다가 다른 사람에게 부동산을 처분하고 점유를 승계하여 준 경우, 이전등기청구권의 소멸시효가 진행되는지 여부 [2] 건물의 소유자가 현실적으로 건물이나 그 대지를 점유하지 않더라도 대지인 토지를 점유하고 있다고 볼 수 있는지 여부 및 건물의 소유권을 상실한 경우, 대지에 대한 점유도 함께 상실하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=240309"},{"id":"P:241153","kind":"P","label":"2022가합50361","title":"보험금","court":"광주지방법원","date":"2023.09.14","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=241153"},{"id":"P:238663","kind":"P","label":"2023다220639","title":"손해배상(기)","court":"대법원","date":"2023.08.31","caseType":"민사","basis":"참조조문","text":"[1] 임기만료 전의 이사의 해임으로 인한 손해배상책임을 규정하고 있는 상법 제385조 제1항에서 정한 ‘정당한 이유’의 의미 및 정당한 이유가 있는지는 주주총회에서 해임사유로 삼거나 해임결의 시 참작한 사유에 한정하여 판단하여야 하는지 여부 [2] 甲 등이 乙 주식회사의 이사로 재직 중 이사회 승인 없이 乙 회사의 영업과 동종 영업을 목적으로 한 주식회사를 설립한 후 대표이사 등으로 취임하였고, 그 후 乙 회사는 임시주주총회를 개최하여 甲 등을 이사에서 해임하였는데, 해임결의 당시 乙 회사는 甲 등의 경업금지의무 위반사실을 인지하지 못하여 이를 해임사유로 삼지 않았고, 甲 등은 임기만료 전 해임에 정당한 이유가 없다고 주장하며 乙 회사를 상대로 상법 제385조 제1항에 따른 손해배상을 구한 사안에서, 해임결의 당시 이미 발생한 甲 등의 경업금지의무 위반행위는 해임사유에 해당하는데도, 주주총회에서 해임사유로 삼지 않았다는 이유로 이를 甲 등에 대한 해임에 정당한 이유가 있었는지를 판단하는 데에 참작할 수 없다고 본 원심판단에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=238663"},{"id":"P:238633","kind":"P","label":"2019다295278","title":"건물인도등","court":"대법원","date":"2023.08.31","caseType":"민사","basis":"참조조문","text":"유치권자가 민법 제324조 제2항을 위반하여 유치물 소유자의 승낙 없이 유치물을 임대한 경우, 유치물의 소유자는 유치권의 소멸을 청구할 수 있는지 여부 / 유치권자의 민법 제324조 제2항을 위반한 임대행위가 있은 뒤에 유치물의 소유권을 취득한 제3자가 유치권소멸청구를 할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=238633"},{"id":"P:237901","kind":"P","label":"2022가단5295059","title":"구상금","court":"서울중앙지방법원","date":"2023.08.18","caseType":"민사","basis":"참조조문","text":"보험회사인 甲 주식회사가 乙과 건물에 대한 화재손해위험 담보 등을 내용으로 하는 보험계약을 체결하였고, 위 건물 일부에 화재가 발생하여 甲 회사가 乙에게 보험금을 지급하였는데, 화재의 원인이 위 건물에서 사용하던 저온냉장고의 압축기 내부전선의 미확인 단락으로 추정되어, 甲 회사가 저온냉장고를 이전·설치한 설치업자 丙을 상대로 제조물 책임법 제3조 제1항 또는 민법 제750조에 따른 손해배상책임을 부담한다고 주장하며, 乙에게 지급한 보험금에 대한 구상금을 구한 사안에서, 丙이 저온냉장고를 위 건물로 이전·설치하면서 냉매압축기를 포함하여 저온냉장고의 구성 부분들이 가진 속성이나 가치에 새로운 속성이나 가치를 덧붙였다고 평가할 수 있을 정도로 인위적인 작업을 하였다고 인정하기 부족하므로, 丙이 저온냉장고를 이전·설치한 행위는 제조물의 제조·가공에 해당한다고 볼 수 없어 제조물 책임법상 손해배상청구는 받아들일 수 없고, 丙이 고의·과실에 기하여 저온냉장고를 안전하지 못하게 이전·설치하였다고 보기 어려워 민법상 손해배상청구도 받아들일 수 없으므로, 甲 회사의 丙에 대한 청구는 이유 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=237901"},{"id":"P:238059","kind":"P","label":"2022다290778","title":"투자금반환","court":"대법원","date":"2023.07.27","caseType":"민사","basis":"참조조문","text":"[1] 주주평등 원칙의 의미 및 이를 위반하여 회사가 일부 주주에게만 우월한 권리나 이익을 부여하기로 하는 약정의 효력 / 회사가 일부 주주에게 우월한 권리나 이익을 부여하여 다른 주주들과 다르게 대우하는 것이 허용되는 경우 및 이에 해당하는지 판단하는 기준 [2] 회사가 신주를 인수하여 주주의 지위를 갖게 되는 사람에게 한 금전지급약정이 실질적으로는 신주인수대금으로 납입한 돈을 전액 보전해 주기로 한 것이거나 상법 제462조 등 법률의 규정에 의한 배당 외에 다른 주주들에게는 지급되지 않는 별도의 수익을 지급하기로 한 것인 경우, 주주평등의 원칙에 위배되어 무효인지 여부 [3] 주주 전원의 동의에 따라 이루어진 주주에 대한 차등적 취급 약정이 상법 등 강행법규에 위배되지 않고 법질서가 허용하는 범위 내의 것인 경우, 사안에 따라 그 효력을 인정할 여지가 있는지 여부 및 주주에게 투하자본의 회수를 절대적으로 보장하는 취지의 금전지급약정은 주주 전원의 동의를 받았더라도 무효인지 여부 [4] 주주평등의 원칙이 주주와 회사의 다른 주주 내지 이사 개인의 법률관계에 직접 적용되는지 여부 / 주주가 회사와 계약을 체결하면서 다른 주주 내지 이사 개인과도 회사와 관련한 계약을 체결한 경우, 그 계약의 효력은 주주와 회사가 체결한 계약의 효력과 별개로 보아야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=238059"},{"id":"P:236343","kind":"P","label":"2023다227418","title":"추심금[변호사의 소속 법무법인에 대한 급여채권의 지연손해금에 적용되는 법정이율이 문제된 사건]","court":"대법원","date":"2023.07.27","caseType":"민사","basis":"참조조문","text":"변호사와 법무법인이 상법상 ‘상인’인지 여부 및 변호사가 소속 법무법인에 대하여 갖는 급여채권이 상사채권에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=236343"},{"id":"P:599931","kind":"P","label":"2022노162","title":"업무상배임·사문서위조·위조사문서행사·상표법위반","court":"서울서부지방법원","date":"2023.07.25","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=599931"},{"id":"P:238061","kind":"P","label":"2023다210670","title":"회생채권조사확정재판에대한이의의소","court":"대법원","date":"2023.07.13","caseType":"민사","basis":"참조조문","text":"[1] 주주평등 원칙의 의미 및 이를 위반하여 회사가 일부 주주에게만 우월한 권리나 이익을 부여하기로 하는 약정의 효력 / 회사가 일부 주주에게 우월한 권리나 이익을 부여하여 다른 주주들과 다르게 대우하는 것이 허용되는 경우 및 이에 해당하는지 판단하는 기준 [2] 회사가 자금조달을 위해 신주인수계약을 체결하면서 주주의 지위를 갖게 되는 자에게 회사의 의사결정에 대한 사전 동의를 받기로 약정하는 것이 허용되는지 여부 [3] 회사가 주주의 지위를 갖게 되는 자와 주식인수대금으로 납입한 돈을 전액 보전해 주기로 약정하거나 상법 제462조 등 법률의 규정에 의한 배당 외에 다른 주주들에게는 지급되지 않는 별도의 수익을 지급하기로 약정한 경우, 주주평등의 원칙에 위배되어 무효인지 여부 [4] 회사와 주주가 동의권 부여 약정을 체결하면서 약정 위반으로 인한 손해배상 명목의 금원을 지급하는 약정을 함께 체결한 경우, 그 약정의 효력 / 손해배상액 예정 약정은 유효하나 그 금액이 부당히 과다한 경우, 민법 제398조 제2항에 따라 법원이 이를 감액할 수 있는지 여부 및 동의권 부여 약정 위반에 따른 손해배상 예정액이 부당한지 판단할 때 유의할 점","url":"https://www.law.go.kr/precInfoP.do?precSeq=238061"},{"id":"P:235933","kind":"P","label":"2022다224986","title":"위약벌청구의소","court":"대법원","date":"2023.07.13","caseType":"민사","basis":"참조조문","text":"[1] 주주평등의 원칙의 의미 및 이를 위반하여 회사가 일부 주주에게만 우월한 권리나 이익을 부여하기로 하는 약정의 효력 / 회사가 일부 주주에게 우월한 권리나 이익을 부여하여 다른 주주들과 다르게 대우하는 것이 허용되는 경우 및 이에 해당하는지 판단하는 기준 [2] 회사가 신주를 인수하여 주주의 지위를 갖게 되는 사람에게 한 금전 지급 약정이 실질적으로는 위 사람에게 주식인수대금으로 납입한 돈을 전액 보전해 주기로 약정하거나 상법 제462조 등 법률의 규정에 의한 배당 외에 다른 주주들에게는 지급되지 않는 별도의 수익을 지급하기로 약정한 것인 경우, 주주평등의 원칙에 위배되어 무효인지 여부 및 이는 회사의 다른 주주 전원이 동의하였더라도 마찬가지인지 여부 [3] 주주평등의 원칙이 주주와 회사의 다른 주주 내지 이사 개인의 법률관계에 직접 적용되는지 여부 / 주주가 회사와 계약을 체결하면서 다른 주주 내지 이사 개인과도 회사와 관련한 계약을 체결한 경우, 그 계약의 효력은 주주와 회사가 체결한 계약의 효력과 별개로 보아야 하는지 여부 / 주주가 회사의 다른 주주 내지 이사 개인과 체결한 계약의 내용을 해석하는 경우, 계약 해석에 관한 일반 원칙을 적용할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=235933"},{"id":"P:240281","kind":"P","label":"2017다237988","title":"보험금","court":"대법원","date":"2023.07.13","caseType":"민사","basis":"판례내용","text":"보험약관 해석에 있어 작성자 불이익의 원칙","url":"https://www.law.go.kr/precInfoP.do?precSeq=240281"},{"id":"P:240283","kind":"P","label":"2019다214248","title":"채무부존재확인·보험금","court":"대법원","date":"2023.07.13","caseType":"민사","basis":"참조조문","text":"[1] 보험금청구권의 소멸시효 기산점 [2] 보험약관에 피보험자가 피해일로부터 180일이 지나도록 계속 치료하여야 할 상태에 있을 때에는 그 기간이 끝나는 전일의 의사 진단에 따라 후유장해의 정도를 결정하여 보험금을 지급한다고 규정되어 있는 경우, 보험금청구권의 소멸시효 기산점이 보험사고 발생일로부터 180일이 경과한 날 또는 그 후 실제로 의사의 진단을 받은 날이 되는지 여부 / 약관의 규정에 따라 보험사고가 발생하여 그 당시의 장해상태에 따라 산정한 보험금을 지급받은 후 당초의 장해상태가 악화된 경우, 추가로 지급받을 수 있는 보험금청구권의 소멸시효 기산점","url":"https://www.law.go.kr/precInfoP.do?precSeq=240283"},{"id":"P:235971","kind":"P","label":"2021다293213","title":"상환금청구의소","court":"대법원","date":"2023.07.13","caseType":"민사","basis":"참조조문","text":"[1] 주주평등 원칙의 의미 및 이를 위반하여 회사가 일부 주주에게만 우월한 권리나 이익을 부여하기로 하는 약정의 효력 / 회사가 일부 주주에게 우월한 권리나 이익을 부여하여 다른 주주들과 다르게 대우하는 것이 허용되는 경우 및 이에 해당하는지 판단하는 기준 [2] 회사가 자금조달을 위해 신주인수계약을 체결하면서 주주의 지위를 갖게 되는 자에게 회사의 의사결정에 대한 사전동의를 받기로 약정하는 것이 허용되는지 여부 [3] 회사가 주주의 지위를 갖게 되는 자와 주식인수대금으로 납입한 돈을 전액 보전해 주기로 약정하거나 상법 제462조 등 법률의 규정에 의한 배당 외에 다른 주주들에게는 지급되지 않는 별도의 수익을 지급하기로 약정한 경우, 주주평등의 원칙에 위배되어 무효인지 여부 [4] 회사와 주주가 동의권 부여 약정을 체결하면서 약정 위반으로 인한 손해배상 명목의 금원을 지급하는 약정을 함께 체결한 경우, 그 약정의 효력 / 손해배상액 예정 약정은 유효하나 그 금액이 부당히 과다한 경우, 민법 제398조 제2항에 따라 법원이 이를 감액할 수 있는지 여부 및 동의권 부여 약정 위반에 따른 손해배상 예정액이 부당한지 판단할 때 유의할 점","url":"https://www.law.go.kr/precInfoP.do?precSeq=235971"},{"id":"P:235513","kind":"P","label":"2021다291712","title":"손해배상(기)","court":"대법원","date":"2023.06.29","caseType":"민사","basis":"참조조문","text":"이사 등이 자기 또는 제3자의 계산으로 회사와 거래를 하면서 사전에 상법 제398조에서 정한 이사회 승인을 받지 않은 경우, 거래의 효력 및 사후에 거래행위에 대하여 이사회 승인을 받은 경우, 무효인 거래행위가 유효로 되는지 여부 / 이사 등이 회사와의 거래에 관한 중요사실을 밝히지 아니한 채 통상의 거래로서 이를 허용하는 이사회의 결의가 이루어진 경우, 상법 제398조에서 정한 이사회 승인이 있다고 할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=235513"},{"id":"P:240597","kind":"P","label":"2021다285090","title":"회생계획상미이전자산액청구","court":"대법원","date":"2023.06.29","caseType":"민사","basis":"참조조문","text":"[1] 회생회사의 분할로 인하여 설립되는 신설회사는 회생계획이 정하는 바에 따라 회생회사의 권리와 의무를 승계하는지 여부 [2] 채무를 면하는 경우와 같이 어떠한 사실의 발생으로 당연히 발생하였을 손실을 보지 않는 것이 부당이득이 성립하기 위한 요건인 ‘이익’에 해당하는지 여부 및 채권의 취득도 ‘이익’에 해당하는지 여부 [3] 회생계획에 따른 회사분할에서 회생계획의 문언에 의하여 객관적인 의미가 명확하게 드러나지 아니하여 해석을 둘러싸고 이견이 있는 경우, 어떠한 권리와 의무가 신설회사에 승계되는지 해석하는 방법 [4] 甲 주식회사의 회생절차에서 乙 주식회사 등을 분할신설하고 자산을 이전하기로 하였으나 회생계획의 인가 및 乙 회사의 설립등기 전에 乙 회사에 이전하기로 한 자산 중 일부가 인출되거나 상계되었고, 乙 회사의 설립 후에는 甲 회사의 분할 전까지 미변제된 공익채권에 해당하는 丙의 임금채권이 추심되었는데, 乙 회사가 분할존속회사인 丁 주식회사를 상대로 위 금원 상당의 부당이득반환을 구한 사안에서, 乙 회사는 이전받을 것으로 예정되었던 예금 등을 수익하지 못하는 손해를 입었고 丁 회사는 甲 회사 명의 예금 채권을 취득하거나 존속할 것으로 예상되었던 甲 회사 명의 채무를 면하는 등의 이익을 보유하게 되었다고 볼 여지가 있으며, 회생계획의 해석상 丙의 별개의 임금채권에 대하여 乙 회사 등이 채무를 부담한다고 단정하기 어려운데도, ","url":"https://www.law.go.kr/precInfoP.do?precSeq=240597"},{"id":"P:240579","kind":"P","label":"2023다210953","title":"소유권말소등기","court":"대법원","date":"2023.06.29","caseType":"민사","basis":"참조조문","text":"[1] 법인이 당사자인 사건에서 이미 제출된 자료들에 의하여 대표권의 적법성에 의심이 갈 만한 사정이 있는 경우, 법원이 이에 관하여 심리·조사할 의무가 있는지 여부 [2] 자본금의 총액이 10억 원 미만으로 감사를 선임하지 아니한 주식회사가 이사에 대하여 소를 제기하는 경우, 대표이사가 그 소송에 관하여 회사를 대표할 권한이 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=240579"},{"id":"P:235567","kind":"P","label":"2019다300934","title":"대여금","court":"대법원","date":"2023.06.29","caseType":"민사","basis":"참조조문","text":"[1] 생명보험의 보험계약자가 스스로를 피보험자로 하면서 자신이 생존할 때의 보험수익자로 자기 자신을, 자신이 사망할 때의 보험수익자로 상속인을 지정한 후 피보험자가 사망하여 보험사고가 발생한 경우, 이에 따른 보험금청구권이 상속인들의 고유재산인지 여부 및 보험계약이 피보험자의 사망, 생존, 사망과 생존을 보험사고로 하는 이상 보험계약에서 다액인 보험료를 일시에 납입하여야 한다거나 사망보험금이 일시 납입한 보험료와 유사한 금액으로 산출되도록 설계되어 있더라도 생명보험에 해당하는지 여부 [2] 甲이 乙 보험회사와 자신을 피보험자로 하는 상속연금형 즉시연금보험계약을 체결하고 보험료 1억 원을 일시에 납입하였는데, 위 보험계약은 보험수익자가 매월 생존연금을 지급받다가 만기가 도래하면 납입 보험료와 동일한 액수의 만기보험금을 지급받지만, 만기가 도래하기 전 피보험자가 사망하면 만기보험금 지급을 위해 적립된 금액과 일정 금액을 합산한 액수의 사망보험금을 받는 내용의 보험으로, 甲은 자신이 생존할 경우의 보험수익자를 자기 자신으로, 사망할 경우의 보험수익자를 상속인으로 지정하였고, 그 후 甲이 생존연금을 지급받다가 만기가 도래하기 전 사망하여 공동상속인인 丙 등이 보험수익자로서 보험계약에 따른 사망보험금을 수령한 사안에서, 위 보험계약은 사람의 사망과 생존 모두를 보험사고로 하는 생명보험계약으로서, 丙 등이 보험계약에 따라 사망보험금을 수령한 ","url":"https://www.law.go.kr/precInfoP.do?precSeq=235567"},{"id":"P:241299","kind":"P","label":"2022가합10881","title":"회사에관한소송","court":"광주지방법원순천지원","date":"2023.06.28","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=241299"},{"id":"P:235119","kind":"P","label":"2023마5434","title":"농업회사법인해산명령청구소송","court":"대법원","date":"2023.06.15","caseType":"민사","basis":"판례내용","text":"농업법인 해산명령 청구 사유로서 농어업경영체 육성 및 지원에 관한 법률 제20조의3 제2항 제3호에서 정한 “제19조의4 제1항에 따른 사업범위에서 벗어난 사업을 하는 농업법인”의 의미 및 이에 해당한다는 이유로 농업법인을 해산하기 위한 요건","url":"https://www.law.go.kr/precInfoP.do?precSeq=235119"},{"id":"P:239717","kind":"P","label":"2023다220882","title":"손해배상청구의소","court":"대법원","date":"2023.06.15","caseType":"민사","basis":"참조조문","text":"[1] 건설산업기본법 제32조 제1항에 따라 하수급인이 발주자에 대하여 수급인과 같은 의무를 부담하는 것이 법률에 의하여 특별히 인정되는 책임인지 여부 [2] 채무자가 이행의무의 존부와 범위를 다투어 제1심에서 주장이 받아들여졌으나 항소심에서 배척된 경우, 항소심판결 선고 시까지는 소송촉진 등에 관한 특례법 제3조 제1항의 지연손해금 이율을 적용할 수 없는지 여부 [3] 공사 도급계약이 상행위에 해당하는 경우, 도급계약에 기한 수급인의 하자담보책임과 건설산업기본법 제32조 제1항에 의한 하수급인의 책임이 상행위로 인한 채무나 이와 동일성을 가진 채무에 해당하여 상사법정이율이 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=239717"},{"id":"P:241133","kind":"P","label":"2022나2030356","title":"임시대의원총회결의무효확인","court":"서울고등법원","date":"2023.06.14","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=241133"},{"id":"P:237201","kind":"P","label":"2019다237586","title":"구상금","court":"대법원","date":"2023.06.01","caseType":"민사","basis":"참조조문","text":"[1] 무보험자동차에 의한 상해담보특약을 맺은 보험자가 피보험자에게 보험금을 지급한 경우, 상법 제729조 단서에 따라 피보험자의 배상의무자에 대한 손해배상청구권을 대위행사할 수 있는지 여부 및 그 범위 [2] 하나의 사고에 관하여 여러 개의 무보험자동차에 의한 상해담보특약이 체결되고 보험금액의 총액이 피보험자가 입은 손해액을 초과하는 경우, 손해보험에 관한 상법 제672조 제1항이 준용되어 중복보험자 중 1인이 피보험자에게 보험약관에서 정한 기준에 따라 보험금을 지급하였다면 다른 중복보험자를 상대로 각자의 보험금액의 비율에 따른 분담금의 지급을 청구할 수 있는지 여부 / 보험금을 단독으로 지급한 중복보험자가 다른 중복보험자로부터 분담금 전부 또는 일부를 지급받아 만족을 얻은 경우, 상법 제729조 단서에 따라 피보험자에 대한 배상의무자를 상대로 보험자대위에 의한 청구권을 행사할 수 있는지 여부 및 그 범위","url":"https://www.law.go.kr/precInfoP.do?precSeq=237201"},{"id":"P:235005","kind":"P","label":"2022마6500","title":"주주명부열람등사가처분","court":"대법원","date":"2023.05.23","caseType":"민사","basis":"참조조문","text":"[1] 주주가 명의개서대리인에게 직접 주주명부 열람·등사를 청구할 수 있는지 여부 [2] 주주가 직접 명의개서대리인을 채무자로 하여 주주명부의 열람·등사 가처분을 신청할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=235005"},{"id":"P:236947","kind":"P","label":"2023누30910","title":"종합소득세경정거부처분취소","court":"서울고등법원","date":"2023.05.16","caseType":"세무","basis":"참조조문","text":"甲이 벤처기업육성에 관한 특별조치법의 규율 대상인 소속 주식회사로부터 받은 상법상 주식매수선택권을 행사하여 얻은 행사이익을 소득에 포함하여 종합소득세를 신고·납부한 후, ‘납입 행사가액 및 주식매수선택권 행사에 따른 행사이익의 합계 전액’이 과세특례조항인 구 조세특례제한법 제16조 제1항 본문, 제4호에서 규정하는 ‘벤처기업 등에 대한 출자 또는 투자금’으로서 종합소득금액의 비과세 특례 적용 대상이라고 주장하며 관할 세무서장을 상대로 행사이익 전부에 대하여 기존에 신고·납부한 종합소득세의 환급을 구하는 경정청구를 하였으나, 관할 세무서장이 납입 행사가액은 그 전액을 종합소득금액에서 공제할 것이지만 행사이익까지 공제할 수는 없다는 이유로, 甲의 경정청구를 일부만 받아들이고 나머지는 거부한 사안에서, 위 과세특례조항에서 ‘투자한 금액’이란 주식매수선택권을 행사하면서 직접 투입한 납입 행사가액을 가리킨다고 해석함이 자연스럽다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=236947"},{"id":"P:238323","kind":"P","label":"2022나2003484","title":"손해배상(기)","court":"서울고등법원","date":"2023.05.10","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238323"},{"id":"P:238069","kind":"P","label":"2022나2027589","title":"부당이득금","court":"서울고등법원","date":"2023.04.28","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238069"},{"id":"P:608441","kind":"P","label":"2021나64385","title":"배당이의의소","court":"인천지방법원","date":"2023.04.28","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=608441"},{"id":"P:239791","kind":"P","label":"2021다309576","title":"구상금","court":"대법원","date":"2023.04.27","caseType":"민사","basis":"참조조문","text":"책임보험계약 피보험자의 과실로 발생한 화재에 의하여 다수 피해자가 손해를 입었으나 책임보험 한도액이 다수 피해자의 손해 합계액에 미치지 못하는 경우, 피해자들이 책임보험자에 대하여 직접청구권을 행사하여 책임보험 한도액의 범위 내에서 각자 전보받지 못하고 남은 손해의 배상을 청구할 수 있는지 여부 및 피해자와 체결한 화재보험계약에 따라 보험금으로 그 피해자의 손해를 전부 보상한 화재보험자가 책임보험자에게 보험자대위로 직접청구를 하는 경우, 화재보험자는 직접청구권을 행사하는 다른 피해자들에 대한 책임보험금 지급이 이루어진 다음 책임보험 한도액에 남은 금액에 한하여 지급받을 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=239791"},{"id":"P:234649","kind":"P","label":"2017다239014","title":"손해배상(기)","court":"대법원","date":"2023.04.27","caseType":"민사","basis":"참조조문","text":"책임보험계약 피보험자의 과실로 발생한 화재에 의하여 다수 피해자가 손해를 입었으나 책임보험 한도액이 다수 피해자의 손해 합계액에 미치지 못하는 경우, 피해자들이 책임보험자에 대하여 직접청구권을 행사하여 책임보험 한도액의 범위 내에서 각자 전보받지 못하고 남은 손해의 배상을 청구할 수 있는지 여부 및 피해자와 체결한 화재보험계약에 따라 보험금으로 그 피해자의 손해를 전부 보상한 화재보험자가 책임보험자에게 보험자대위로 직접청구를 하는 경우, 화재보험자는 직접청구권을 행사하는 다른 피해자들에 대한 책임보험금 지급이 이루어진 다음 책임보험 한도액에 남은 금액에 한하여 지급받을 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=234649"},{"id":"P:234629","kind":"P","label":"2020두47892","title":"입찰참가자격제한및영업정지요청결정취소청구의소","court":"대법원","date":"2023.04.27","caseType":"일반행정","basis":"참조조문","text":"[1] 구 하도급거래 공정화에 관한 법률 제26조 제2항에 따른 공정거래위원회의 입찰참가자격제한 등 요청 결정이 항고소송의 대상이 되는 처분에 해당하는지 여부 [2] 하도급거래 공정화에 관한 법률 위반을 이유로 시정명령 등과 그에 따른 벌점을 부과받은 甲 주식회사가 乙 주식회사와 丙 주식회사로 분할되었고, 丁 주식회사가 甲 회사의 사업 부문 대부분이 이전된 乙 회사를 흡수합병하자, 공정거래위원회가 丁 회사에 대하여 甲 회사에 부과된 벌점이 丁 회사에 승계되었음을 이유로 관계 행정기관의 장에게 입찰참가자격제한 및 영업정지를 요청하기로 결정한 사안에서, 위 처분이 위법하다고 본 원심판단에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=234629"},{"id":"P:623941","kind":"P","label":"2021구합76378","title":"법인세부과처분 및 소득금액변동통지처분 취소","court":"서울행정법원","date":"2023.04.20","caseType":"세무","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=623941"},{"id":"P:239555","kind":"P","label":"2022다297649","title":"물품대금","court":"대법원","date":"2023.03.30","caseType":"민사","basis":"판례내용","text":"소송촉진 등에 관한 특례법 제3조 제2항에서 정한 ‘채무자가 이행의무의 존부나 범위에 관하여 항쟁함이 타당하다고 인정되는 때’의 의미 및 채무자가 이행의무의 존부와 범위를 다툰 주장이 제1심에서 받아들여졌으나 항소심에서 배척된 경우, 항소심판결 선고 시까지 같은 조 제1항에서 정한 지연손해금 이율을 적용할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=239555"},{"id":"P:234447","kind":"P","label":"2019다280481","title":"손해배상(기)","court":"대법원","date":"2023.03.30","caseType":"민사","basis":"참조조문","text":"[1] 이사의 행위에 대하여 경영판단의 원칙을 적용하기 위한 요건 / 이사가 임무를 수행하면서 검토할 사항은 사안마다 개별적으로 판단되어야 하는지 여부 및 이사의 경영판단을 정당화할 수 있는 이익은 원칙적으로 회사가 실제로 얻을 가능성이 있는 구체적인 것이어야 하는지 여부 [2] 기업집단을 구성하는 개별 계열회사의 이사는 기업집단이나 다른 계열회사와 관련된 직무를 수행할 때에도 선관주의의무와 충실의무를 부담하는지 여부 / 소속 회사가 법령에 위반됨이 없이 동일한 기업집단에 속한 계열회사 주식을 취득하거나 제3자가 계열회사 주식을 취득하게 하는 계약을 체결하는 경우, 이사가 주식 취득의 목적이나 계약 내용에 따라 검토하거나 조치하여야 할 사항 [3] 이사가 부담하는 대표이사나 다른 이사의 업무집행에 대한 감시·감독의무의 내용 / 이사는 대표이사나 다른 이사의 업무집행으로 자신이 이익을 얻게 될 가능성이 있는 경우에도 감시·감독의무를 부담하는지 여부 / 이사가 대표이사나 다른 이사의 업무집행이 위법하거나 선관주의의무나 충실의무를 위반하였다고 의심할 만한 사유가 있는데도 감시의무를 위반하여 이를 방치한 경우, 이로 말미암아 회사가 입은 손해에 대하여 배상책임을 지는지 여부 [4] 이사가 법령 또는 정관에 위반한 행위를 하거나 임무를 게을리함으로써 회사에 대하여 손해를 배상할 책임이 있는 경우, 제반 사정을 참작하여 손해배상액을 제한할 수 ","url":"https://www.law.go.kr/precInfoP.do?precSeq=234447"},{"id":"P:239551","kind":"P","label":"2022다299669","title":"기타(금전)","court":"대법원","date":"2023.03.30","caseType":"민사","basis":"참조조문","text":"[1] 처분문서에 나타난 당사자의 의사를 해석하는 방법 / 당사자 일방이 주장하는 계약의 내용이 상대방에게 중대한 책임 내지 불이익을 부과하거나 계약서의 기재와 달리 구속력 있는 의사표시의 존재와 내용을 인정하는 경우, 문언의 내용을 더욱 엄격하게 해석하여야 하는지 여부 [2] 甲 주식회사는 乙과 시설대여계약을 체결하면서, 계약 제20조 제3항에서 계약이 해지된 경우에 乙이 甲 회사에 리스물건을 반환함과 동시에 계약 제21조에서 정한 ‘규정손해금’을 지급하기로 정하였고, 계약 제21조에서 ‘규정손해금’을 ‘산정기준일 현재의 미회수원금에 별표 기재를 승한 금액에 양도가액을 가산한 금액, 산정기준일까지의 경과이자, 산정기준일 현재의 연체리스료 등 당해 리스거래에 관련된 기타 채권액 및 이에 대한 지연손해금의 합계액을 더한 금액’으로 정하였으며, 계약서 별표 에 ‘규정손해금: 없음’, 별표 에 ‘양도가액: 0원’이라고 기재하였는데, 甲 회사가 乙의 리스료 연체를 이유로 계약을 해지하고 乙을 상대로 규정손해금의 지급을 구한 사안에서, 제반 사정에 비추어 계약서 별표 및 계약 제21조에서 정한 문언의 객관적 의미와 취지는 ‘규정손해금’에 관하여 ‘없음’ 또는 ‘0원’으로 정하였다고 봄이 타당한데도, 이와 달리 본 원심판단에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=239551"},{"id":"P:233973","kind":"P","label":"2019두56418","title":"증여세부과처분취소","court":"대법원","date":"2023.02.23","caseType":"세무","basis":"판결요지","text":"다수의 공익법인 등이 같은 날 동일한 주식을 출연받았더라도 그 출연이 시간적으로 선후관계에 있는 경우, 해당 출연으로 구 상속세 및 증여세법 제48조 제1항에 따른 증여세 과세가액 불산입 한도를 초과하는 부분이 있는지는 각 출연 시점을 기준으로 관련 법령에서 정한 주식을 합하여 개별적으로 판단하여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=233973"},{"id":"P:233867","kind":"P","label":"2022다276703","title":"대여금","court":"대법원","date":"2023.02.02","caseType":"민사","basis":"참조조문","text":"[1] 회사의 법인격을 부인하여 그 배후에 있는 개인에게 책임을 물을 수 있는 경우 [2] 회사에 대하여 회사 설립 전 개인이 부담한 채무의 이행을 청구할 수 있는 경우 [3] 회사에 대하여 개인이 부담한 채무의 이행을 청구하는 법리가 채무면탈을 목적으로 회사가 새로 설립된 경우뿐 아니라 기존 회사의 법인격이 이용되는 경우에도 적용되는지 여부 및 이 경우 법인격 형해화 또는 법인격 남용을 판단하는 기준 시점","url":"https://www.law.go.kr/precInfoP.do?precSeq=233867"},{"id":"P:239599","kind":"P","label":"2022다272374","title":"손해배상(기)","court":"대법원","date":"2023.01.12","caseType":"민사","basis":"참조조문","text":"[1] 타인의 위법행위로 피해자가 불필요하게 제3자에게 공사대금을 지급하거나 피해자에게 발생한 결과를 원상회복하기 위해 제3자에게 공사를 도급하여 그 공사대금이 손해액이 되는 경우, 피해자가 부가가치세를 포함한 공사대금 상당액을 손해배상으로 청구할 수 있는지 여부 및 피해자가 부가가치세법 제38조 제1항 제1호에 따라 매출세액에서 위 부가가치세를 공제하거나 환급받을 수 있는 경우, 가해자에게 위 부가가치세 상당의 손해배상을 구할 수 있는지 여부 [2] 이사 또는 감사의 법령·정관 위반행위 혹은 임무위반행위와 그 결과로 발생한 손해 사이에 상당인과관계가 인정되지 아니하는 경우, 상법 제399조 또는 제414조에 정한 손해배상책임이 성립하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=239599"},{"id":"P:233585","kind":"P","label":"2017도14104","title":"특정경제범죄가중처벌등에관한법률위반(사기)·특정경제범죄가중처벌등에관한법률위반(횡령)·상법위반·공전자기록등불실기재·불실기재공전자기록등행사·국가기술자격법위반·건설산업기본법위반·위계공무집행방해·범죄수익은닉의규제및처벌등에관한법률위반·뇌물공여·사기·부정처사후수뢰·공전자기록등위작·위작공전자기록등행사·허위공문서작성·허위작성공문서행사·뇌물수수·제3자뇌물수수·특정범죄가중처벌등에관한법률위반(알선수재)·직권남용권리행사방해·부패방지및국민권익위원회의설치와운영에관한법률위반·공무상비밀누설·제3자뇌물취득","court":"대법원","date":"2023.01.12","caseType":"형사","basis":"참조조문","text":"[1] 사기죄의 성립 요건 / 사기죄의 주관적 구성요건인 불법영득의 의사 내지 편취의 범의 유무를 판단하는 기준 / 도급계약에 따른 일의 대가 등 편취에 의한 사기죄에서 편취의 고의가 있었는지 판단하는 방법 및 기준 시점 / 기망행위에 의하여 국가적 또는 공공적 법익이 침해되었다는 사정만으로 사기죄가 성립하는지 여부 / 도급계약이나 물품구매 조달계약 체결 당시 관련 영업 또는 업무를 규제하는 행정법규나 입찰 참가자격, 계약절차 등에 관한 규정을 위반한 사정만으로 도급계약을 체결한 행위가 기망행위에 해당한다고 단정할 수 있는지 여부 및 이때 심리·판단하여야 할 사항 [2] 피고인이 설립한 甲 주식회사는 설립 자본금을 가장납입하고, 자격증 대여자를 보유 건설기술자로 등록하는 등 자본금 요건과 기술자 보유 요건을 가장하여 전문건설업을 부정 등록한 무자격 건설업자로 전문공사를 하도급받을 수 없었음에도, 이를 바탕으로 공사 발주기관을 기망하여 특허 사용협약을 체결하고, 해당 공사를 낙찰받은 건설회사 담당자를 기망하여 하도급 계약을 체결한 후, 각 계약들에 따른 공사대금을 지급받아 편취하였다는 이유로 특정경제범죄 가중처벌 등에 관한 법률 위반 및 사기죄로 기소된 사안에서, 피고인이 발주기관 또는 건설회사들로부터 공사대금을 지급받은 행위가 사기죄에서의 기망행위로 인한 재물의 편취에 해당한다고 보기 어려우므로, 이와 달리 공소사실을 유죄로 본 원심","url":"https://www.law.go.kr/precInfoP.do?precSeq=233585"},{"id":"P:614365","kind":"P","label":"2021나68607","title":"구상금","court":"서울중앙지방법원","date":"2023.01.10","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=614365"},{"id":"P:232867","kind":"P","label":"2019다210697","title":"구상금","court":"대법원","date":"2022.12.29","caseType":"민사","basis":"참조조문","text":"[1] 신원보증보험계약 중 피보험자가 법률상의 손해배상책임을 부담함으로써 입은 손해에 대하여 보험자가 보상하기로 약정한 부분의 법적 성격 및 이러한 신원보증보험에서 피보증인의 행위로 인하여 제3자가 입은 손해를 배상한 피보험자가 피보증인을 상대로 이행을 청구할 수 있는 구상책임의 범위 [2] 사용자가 피용자의 업무수행과 관련한 불법행위로 직접 손해를 입었거나 피해자인 제3자에게 사용자책임을 부담하여 손해를 입은 경우, 피용자에 대하여 손해배상을 청구하거나 구상권을 행사할 수 있는 범위 / 책임제한 사유에 관한 사실인정이나 그 비율을 정하는 것이 사실심의 전권사항인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=232867"},{"id":"P:234061","kind":"P","label":"2019두19","title":"증여세과세처분취소","court":"대법원","date":"2022.12.29","caseType":"세무","basis":"판결요지","text":"[1] 甲 주식회사가 乙 주식회사와 乙 회사 주식을 전부 인수하면서 乙 회사의 주주들에게 乙 회사 주식 1주당 甲 회사 신주 일정량을 발행해 주기로 하는 ‘주식의 포괄적 교환계약’을 체결하여, 乙 회사의 주주인 丙은 위 계약에 따라 乙 회사 주식 교환대가로 甲 회사 신주를 배정받았는데, 관할 세무서장이 위 주식교환 과정에서 乙 회사 주식의 1주당 가치가 시가보다 과대평가된 결과 丙이 일정한 이익을 증여받았다는 이유로, 구 상속세 및 증여세법 제42조 제1항 제3호에 따라 丙에게 증여세를 부과한 사안에서, 위 주식교환에 따른 丙의 증여재산가액 산정의 기초가 되는 변동 전후 재산의 평가차액을 구 상속세 및 증여세법 시행령 제31조의9 제2항 제5호 목을 적용하여 ‘변동후 가액’인 ‘丙이 위 주식교환으로 교부받은 甲 회사 주식의 가액’에서 ‘변동전 가액’인 ‘丙이 당초 보유하고 있던 乙 회사 주식의 가액’을 차감하여 계산하여야 한다고 본 원심판단이 정당하다고 한 사례 [2] 주식의 포괄적 교환이 있는 경우 구 상속세 및 증여세법 시행령 제31조의9 제2항 제5호 목에 따른 변동 전후의 ‘가액’은 합병에 따른 이익의 계산방법 등에 관한 같은 법 시행령 제28조 제3항 내지 제6항을 준용하여 산정해야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=234061"},{"id":"P:233063","kind":"P","label":"2022그734","title":"주주총회소집허가[주주총회 소집청구의 적법성에 대한 사안]","court":"대법원","date":"2022.12.16","caseType":"민사","basis":"참조조문","text":"[1] 상법 제366조 제1항에 따른 소수주주의 주주총회 소집청구에서 ‘이사회’와 ‘전자문서’의 의미 [2] 甲 주식회사의 소수주주인 乙이 대표이사 丙에게 2회에 걸쳐 발송한 임시주주총회 소집청구서가 폐문부재로 배달되지 않아 폐기 처리된 후, 乙의 소송대리인이 같은 내용의 임시주주총회 소집청구서를 카카오톡 메시지로 발송하여 그 무렵 丙이 이를 수신하였는데도 甲 회사가 임시주주총회 소집절차를 밟지 않자, 乙이 법원에 주주총회 소집허가를 구한 사안에서, 대표이사인 丙이 카카오톡 메시지를 통하여 임시주주총회 소집요구서를 제출받아 이를 확인한 이상, 乙의 상법 제366조 제1항에 따른 임시주주총회의 소집청구는 적법하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=233063"},{"id":"P:232767","kind":"P","label":"2019다269156","title":"채무부존재확인","court":"대법원","date":"2022.12.15","caseType":"민사","basis":"참조조문","text":"[1] 확인의 소에서 ‘확인의 이익’이 인정되기 위한 요건 및 원고의 권리 또는 법률관계를 다툼으로써 원고의 법률상 지위에 불안·위험을 초래할 염려가 있는 경우, 확인의 이익이 있는지 여부 [2] 보증보험계약이 체결된 후 보험금이 아직 지급되지 않은 상태에서 주계약의 당사자인 보험계약자와 피보험자 사이에 주계약에 따른 채무의 존부와 범위에 관하여 다툼이 있는 경우, 보험계약자가 피보험자를 상대로 주계약에 따른 채무 부존재 확인을 구할 이익이 있는지 여부 [3] 甲이 乙 주식회사로부터 공사를 하도급받고 乙 회사에 丙 보험회사와의 이행보증보험계약에 따라 발급된 보증보험증권을 제출하였는데, 그 후 공사가 지연되던 중 甲이 공사를 포기하였고, 乙 회사가 丙 회사에 甲의 공사포기를 청구사유로 하여 보증보험계약에 따른 보험금을 청구하자, 甲이 丙 회사에 보험금 지급 보류를 요청한 후 乙 회사를 상대로 하도급 약정에 따른 채무의 부존재 확인을 구한 사안에서, 확인의 이익을 부정한 원심판결에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=232767"},{"id":"P:236909","kind":"P","label":"2022나9926","title":"구상금","court":"서울중앙지방법원","date":"2022.12.13","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=236909"},{"id":"P:618505","kind":"P","label":"2015가합22446","title":"손해배상(기)","court":"서울중앙지방법원","date":"2022.12.09","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=618505"},{"id":"P:421266","kind":"P","label":"2022누1106","title":"농협경제지주 회사 물류센터 신축 부지의 정당한 사유","court":"광주고등법원","date":"2022.12.07","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=421266"},{"id":"P:239631","kind":"P","label":"2022다258248","title":"채권양수금청구","court":"대법원","date":"2022.12.01","caseType":"민사","basis":"참조조문","text":"상행위로 인한 원본채권 및 그에 대한 지연손해금 지급을 명하는 이행판결이 확정된 후 지연손해금에 대한 채권자의 이행청구에 의해 채무자가 지체책임을 지는 경우, 그 지연손해금에 대하여 상사법정이율을 적용하여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=239631"},{"id":"P:232563","kind":"P","label":"2020다280685","title":"손해배상(기)","court":"대법원","date":"2022.12.01","caseType":"민사","basis":"참조조문","text":"[1] 상법 제814조 제1항에서 정한 해상운송인의 송하인이나 수하인에 대한 권리·의무의 소멸기간이 제척기간인지 여부 / 위 제척기간의 기산점 및 여기서 ‘운송물을 인도할 날’의 의미 / 해상운송인의 송하인 또는 수하인에 대한 채권·채무의 청구원인이 불법행위인 경우에도 위 제척기간이 적용되는지 여부 [2] 제척기간의 제도적 취지 / 아직 발생하지 않은 권리에 대하여 제척기간에 관한 규정을 적용할 수 있는지 여부 [3] 복합운송주선인인 甲 주식회사가 운송계약에 따라 해상운송인인 乙 외국회사에 운송을 의뢰한 화물은 폐기물처리업자가 수출 화물인 것처럼 가장하여 반출하려 한 폐기물이었는데, 이를 甲 회사 및 甲 회사가 지정한 수하인이 수령하지 않아 컨테이너 초과사용료, 터미널 보관료 등 손해가 계속 발생하자, 乙 회사가 화물 도착 후 약 2년이 지난 시점에 甲 회사를 상대로 손해배상을 구한 사안에서, 컨테이너 초과사용료 및 터미널 보관료에 관한 손해배상채권 중 ‘화물의 인도가 행하여져야 했던 날’을 지나서 발생하는 손해배상채권의 제척기간 기산일은 그 채권의 발생일이라고 해석함이 타당한데도, 위 손해배상청구 중 소제기 1년 안에 발생한 부분까지도 상법 제814조 제1항에서 정한 1년의 제척기간을 도과하여 부적법하다고 본 원심판단에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=232563"},{"id":"P:232573","kind":"P","label":"2021다227629","title":"경업금지","court":"대법원","date":"2022.11.30","caseType":"민사","basis":"참조조문","text":"영업양도계약에서 경업금지에 관하여 정함이 없는 경우, 영업양수인이 영업양도인에게 상법 제41조 제1항에 따라 경업금지청구권을 행사할 수 있는지 여부 및 위와 같이 양도된 영업이 다시 동일성을 유지한 채 전전양도되는 경우, 영업양수인의 경업금지청구권과 이에 관한 양도통지의 권한이 그 뒤의 영업양수인에게 전전양도되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=232573"},{"id":"P:607251","kind":"P","label":"2020가합105185","title":"주주대표소송","court":"수원지방법원안양지원","date":"2022.11.25","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=607251"},{"id":"P:619331","kind":"P","label":"2021가단5181795","title":"보험금","court":"서울중앙지방법원","date":"2022.11.25","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619331"},{"id":"P:605167","kind":"P","label":"2021나32245","title":"보험금·보험금·보험금","court":"춘천지방법원","date":"2022.11.24","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=605167"},{"id":"P:239643","kind":"P","label":"2021다205650","title":"신주발행무효확인","court":"대법원","date":"2022.11.17","caseType":"민사","basis":"참조조문","text":"[1] 전환사채 발행의 경우에도 신주발행무효의 소에 관한 상법 제429조가 유추적용되는지 여부 / 전환사채 발행일로부터 6월 내에 전환사채발행무효의 소가 제기되지 않거나 6월 내에 제기된 소가 적극적 당사자의 패소로 확정된 경우, 이후 전환사채 발행의 무효를 주장할 수 있는지 여부 / 이 경우에도 전환권의 행사로 인한 신주 발행에 대해서는 상법 제429조를 적용하여 신주발행무효의 소로써 다툴 수 있는지 여부 및 이때 전환사채 발행의 무효나 이를 전제로 한 주장을 제기할 수 있는지 여부 [2] 주식회사가 정관이 정한 사유가 없는데도 대주주 등의 경영권이나 지배권을 방어할 목적으로 제3자에게 신주를 배정하여 회사의 지배구조에 심대한 변화가 초래되고, 기존 주주들의 회사에 대한 지배권이 현저하게 악화되는 중대한 결과가 발생하는 경우, 신주 발행이 무효인지 여부 / 이러한 법리는 전환사채를 제3자에게 발행하는 경우에도 마찬가지로 적용되는지 여부 및 이 경우 전환사채의 특수성에 따른 고려가 필요한지 여부 [3] 주식회사가 대주주 등의 경영권이나 지배권 방어 목적으로 제3자에게 전환사채를 발행한 경우, 발행일로부터 6월 내에 전환사채발행무효의 소로써 다툴 수 있는지 여부 / 대주주 등이 위와 같은 경위로 발행된 전환사채를 양수한 다음 전환사채 발행일부터 6월이 지난 후 전환권을 행사하여 신주를 취득한 경우, 신주발행무효의 소로 신주 발행의 무효","url":"https://www.law.go.kr/precInfoP.do?precSeq=239643"},{"id":"P:231985","kind":"P","label":"2021다271282","title":"임시주주총회결의무효확인의소","court":"대법원","date":"2022.11.10","caseType":"민사","basis":"참조조문","text":"[1] 임기 만료 당시 이사 정원에 결원이 생기거나 후임 대표이사가 선임되지 아니하여 퇴임이사 또는 퇴임대표이사의 지위에 있던 사람이 특정경제범죄 가중처벌 등에 관한 법률 제3조 제1항에 따라 가중처벌되는 특정재산범죄로 유죄판결을 받아 판결이 확정된 경우, 유죄판결된 범죄행위와 밀접한 관련이 있는 기업체의 퇴임이사 또는 퇴임대표이사로서의 권리의무를 상실하는지 여부 [2] 소집권한이 없는 자가 이사회 소집결정도 없이 소집하여 이루어진 주주총회결의의 효력","url":"https://www.law.go.kr/precInfoP.do?precSeq=231985"},{"id":"P:239657","kind":"P","label":"2022마6618","title":"소송비용액확정","court":"대법원","date":"2022.11.08","caseType":"민사","basis":"참조조문","text":"[1] 소송당사자가 약정에 따라 부가가치세를 포함하여 변호사보수를 지출하였고 그 금액이 변호사보수의 소송비용 산입에 관한 규칙에서 정한 금액 범위 안에 있는 경우, 부가가치세를 포함한 위 금액 전부가 상대방에게 상환을 구할 수 있는 소송비용에 포함되는 변호사보수에 해당하는지 여부 [2] 甲이 교통사고 가해 자동차의 보험자인 乙 보험회사를 상대로 치료비 등의 지급을 구하는 손해배상청구의 소를 제기하여 판결 확정 후 소송비용부담의 재판에 따라 1심 소송비용 일부와 2심 소송비용 전부를 부담하게 되었는데, 乙 회사가 각 심급마다 소송위임을 한 법무법인에 부가가치세를 포함한 변호사보수를 지급한 사안에서, 위 부가가치세는 乙 회사가 영위하는 사업 중 부가가치세가 면제되는 ‘보험업법에 따른 보험업 용역의 공급’에 관련된 매입세액에 해당하고 이를 매출세액에서 공제하거나 환급받을 수 없으므로, 乙 회사는 자신이 지출한 심급별 부가가치세 포함 변호사보수 금액이 변호사보수의 소송비용 산입에 관한 규칙에서 정한 금액 범위 내에 있다면 그 전부를 소송비용에 포함되는 변호사보수로 보아 甲에게 상환을 구할 수 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=239657"},{"id":"P:241135","kind":"P","label":"2020나2000160","title":"명의개서절차이행등청구","court":"서울고등법원","date":"2022.11.04","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=241135"},{"id":"P:240635","kind":"P","label":"2022가합101604","title":"이사회결의부존재및무효확인·이사회결의부존재및무효확인의소","court":"대전지방법원천안지원","date":"2022.10.28","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=240635"},{"id":"P:231779","kind":"P","label":"2021다201054","title":"신주발행무효확인","court":"대법원","date":"2022.10.27","caseType":"민사","basis":"참조조문","text":"[1] 신주인수권부사채 발행의 경우에도 신주발행무효의 소에 관한 상법 제429조가 유추적용되는지 여부 / 신주인수권부사채 발행일로부터 6월 내에 신주인수권부사채발행무효의 소가 제기되지 않거나 6월 내에 제기된 소가 적극적 당사자의 패소로 확정된 경우, 이후 신주인수권부사채 발행의 무효를 주장할 수 있는지 여부 / 이 경우에도 신주인수권부사채에 부여된 신주인수권의 행사나 그로 인한 신주 발행에 대해서는 상법 제429조를 유추적용하여 신주발행무효의 소로써 다툴 수 있는지 여부 및 이때 신주인수권부사채 발행의 무효나 이를 전제로 한 주장을 할 수 있는지 여부 [2] 주식회사가 정관이 정한 사유가 없는데도 대주주 등의 경영권이나 지배권을 방어할 목적으로 제3자에게 신주를 배정하여 회사의 지배구조에 심대한 변화가 초래된 경우, 신주 발행이 무효인지 여부 및 이러한 법리는 신주인수권부사채를 제3자에게 발행하는 경우에도 마찬가지로 적용되는지 여부 [3] 주식회사가 대주주 등의 경영권이나 지배권을 방어할 목적으로 제3자에게 신주인수권부사채를 발행한 경우, 발행일로부터 6월 이내에 신주인수권부사채발행무효의 소로써 다툴 수 있는지 여부 / 대주주 등이 위와 같은 경위로 발행된 신주인수권부사채나 그에 부여된 신주인수권을 양수한 다음 신주인수권부사채 발행일부터 6월이 지난 후 신주인수권을 행사하여 신주를 취득한 경우, 신주발행무효의 소로 신주 발행의 무효","url":"https://www.law.go.kr/precInfoP.do?precSeq=231779"},{"id":"P:239285","kind":"P","label":"2018다273530","title":"증권","court":"대법원","date":"2022.10.27","caseType":"민사","basis":"참조조문","text":"당사자들이 자금을 출자하여 공동으로 주식회사를 설립하여 운영하고 이에 따른 비용 부담과 이익 분배를 지분 비율에 따라 할 것을 내용으로 하는 동업약정이 공동사업을 위하여 민법상 조합을 결성할 것을 목적으로 하는지 여부 및 위 동업약정에 따른 당사자들의 출자 기타 재산이 조합원의 합유로 되는지 여부 / 위와 같은 동업약정에서 일방 당사자가 주식회사의 청산에 관한 상법 규정에 따른 청산절차를 거치지 않고 잔여재산의 분배를 받을 수 있는지 여부 및 이러한 법리는 동업약정에 따라 주식회사가 설립된 후 당사자 일방이 동업관계에서의 탈퇴를 주장하며 정산을 구하는 경우에도 그대로 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=239285"},{"id":"P:601977","kind":"P","label":"2021나15534","title":"부인의소송","court":"서울고등법원인천재판부","date":"2022.10.20","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=601977"},{"id":"P:237023","kind":"P","label":"2022다238657","title":"구상금","court":"대법원","date":"2022.09.29","caseType":"민사","basis":"판례내용","text":"[1] 일반적으로 사용자가 피용자의 업무수행과 관련하여 행하여진 불법행위로 인하여 피해자인 제3자에게 사용자로서 손해배상책임을 부담한 결과로 손해를 입게 된 경우, 피용자에 대하여 행사할 수 있는 손해배상청구권 또는 구상권의 범위 / 이러한 구상권 제한의 법리는 사용자의 보험자가 피용자에 대하여 구상권을 행사하는 경우에도 마찬가지인지 여부 [2] 동일한 가해자를 지휘·감독하는 복수의 사용자가 각각 손해배상책임을 부담하는 경우, 사용자 사이의 구상이 인정되는지 여부 및 구상의 전제가 되는 각 사용자의 책임비율을 정할 때 고려하여야 할 사항 / 사용자의 일방이 가해자의 과실비율에 따라 정해진 부담부분을 넘어 손해를 배상한 경우, 구상의 범위 [3] 건설기계의 임대인이 그 운전자와 함께 이를 임차인에게 임대하여 임차인의 현장감독 하에 작업을 하다가 운전자의 과실로 사고가 발생한 경우로서, 그 사고가 임차인의 현장 지휘감독을 벗어난 상태에서 운전자의 전적인 과실로 발생하였음을 인정할 만한 특별한 사정이 없는 경우, 임차인과 임대인의 손해배상책임은 부진정연대관계에 있는지 여부 및 이때 어느 한 쪽이 피해자에 대한 손해를 배상하여 공동면책이 된 경우, 구상권의 범위는 손해발생에 기여한 과실의 정도에 의하여 결정되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=237023"},{"id":"P:423896","kind":"P","label":"2021구합51797","title":"회생절차 중 신설회사(물적분할)의 주식취득시 간주취득세 여부","court":"창원지방법원","date":"2022.09.22","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=423896"},{"id":"L:530-104","kind":"L","label":"법 제530조의104","title":"현행 조문에 없음(구법 조문 번호)","chapter":"","deleted":true,"ghost":true,"text":""},{"id":"P:605185","kind":"P","label":"2021나16092","title":"신주발행무효의소","court":"수원고등법원","date":"2022.09.22","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=605185"},{"id":"P:230961","kind":"P","label":"2022마5372","title":"주주총회소집허가","court":"대법원","date":"2022.09.07","caseType":"민사","basis":"참조조문","text":"소수주주가 상법 제366조에 따라 임시총회 소집에 관한 법원의 허가를 신청할 때 주주총회의 권한에 속하는 결의사항이 아닌 것을 회의 목적사항으로 할 수 있는지 여부 / 소수주주가 제출한 임시총회소집청구서에 회의의 목적사항이 ‘대표이사 해임 및 선임’으로 기재되었으나 소집의 이유가 현 대표이사의 ‘이사직 해임’과 ‘후임 이사 선임’을 구하는 취지로 기재되어 있고, 회사의 정관에 ‘대표이사의 해임’이 주주총회 결의사항으로 정해져 있지 않은 경우, 법원이 취하여야 할 조치","url":"https://www.law.go.kr/precInfoP.do?precSeq=230961"},{"id":"P:230969","kind":"P","label":"2022다223778","title":"배당금청구","court":"대법원","date":"2022.09.07","caseType":"민사","basis":"참조조문","text":"상법 제462조의3이 정하는 중간배당에 관한 이사회 결의가 있는 경우, 같은 영업연도 중 다시 중간배당에 관한 이사회 결의를 하는 것이 허용되는지 여부 및 이사회 결의에 따라 구체적으로 확정된 주주의 중간배당금 지급청구권의 내용을 수정 내지 변경하는 이사회 결의가 허용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=230969"},{"id":"P:612909","kind":"P","label":"2020가합58426","title":"대여금등청구의소","court":"인천지방법원","date":"2022.09.06","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=612909"},{"id":"P:234019","kind":"P","label":"2021나301570","title":"대여금","court":"대구지방법원","date":"2022.09.02","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=234019"},{"id":"P:235619","kind":"P","label":"2022다217124","title":"용역비","court":"대법원","date":"2022.08.31","caseType":"민사","basis":"참조조문","text":"[1] 변호사, 변리사, 공증인, 공인회계사 및 법무사의 직무에 관한 채권의 소멸시효기간을 3년으로 정한 민법 제163조 제5호가 유사한 직무를 수행하는 세무사 등 다른 자격사의 직무에 관한 채권에 대하여 유추적용되는지 여부 [2] 세무사의 직무에 관한 채권의 소멸시효기간","url":"https://www.law.go.kr/precInfoP.do?precSeq=235619"},{"id":"P:230869","kind":"P","label":"2018다212740","title":"구상금","court":"대법원","date":"2022.08.31","caseType":"민사","basis":"참조조문","text":"[1] 자동차상해보험계약에 따른 보험금을 지급한 보험자가 보험자대위를 할 수 있는 경우와 그 범위 [2] 甲이 乙 보험회사와 자동차보험계약을 체결하면서 자동차상해 특약을 가입하였는데, 甲이 운전하던 피보험차량이 丙 지방자치단체가 설치·관리하는 도로에서 중앙선을 침범하여 다른 차량과 충돌하는 바람에 甲이 사망하고 동승자인 그의 처 丁이 상해를 입자, 乙 회사가 위 특약의 피보험자인 甲과 丁에게 자동차상해보험금을 지급한 다음 사고지점 도로가 설치·관리상 하자로 통상 갖추어야 할 안전성을 갖추지 못하였다며 丙 지방자치단체를 상대로 甲과 丁의 손해에 관하여 보험자대위청구를 한 사안에서, 위 보험계약의 보통약관 조항에서 보험자대위를 배제하는 ‘자기신체사고’에 자동차상해 특약으로 담보되는 사고가 포함되어 있다고 보기 어렵다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=230869"},{"id":"P:230885","kind":"P","label":"2021다311111","title":"청구이의","court":"대법원","date":"2022.08.25","caseType":"민사","basis":"참조조문","text":"[1] 변호사, 변리사, 공증인, 공인회계사 및 법무사의 직무에 관한 채권의 소멸시효기간을 3년으로 정한 민법 제163조 제5호가 세무사 등 유사한 직무를 수행하는 다른 자격사의 직무에 관한 채권에 대하여 유추적용되는지 여부 [2] 세무사를 상법 제4조 또는 제5조 제1항이 규정하는 상인이라고 볼 수 있는지 여부 및 세무사의 직무에 관한 채권의 소멸시효기간","url":"https://www.law.go.kr/precInfoP.do?precSeq=230885"},{"id":"P:235329","kind":"P","label":"2017다245620","title":"보험금","court":"대법원","date":"2022.08.19","caseType":"민사","basis":"참조조문","text":"甲이 乙 보험회사와 동생인 丙을 피보험자로 하여 기본계약과 상해사망담보 특약을 포함한 다수의 선택계약으로 구성된 종합보험계약을 체결하면서 상해사망담보 특약 부분은 丙의 법정상속인을 보험수익자로, 나머지 부분은 모두 丙을 보험수익자로 정하였는데, 丙이 보험기간 중 교통사고로 사망하여 丙의 법정상속인인 丁, 戊가 상해사망담보 특약에 따른 보험금을 청구하자, 乙 회사가 위 보험계약 중 상해사망담보 특약 부분이 甲의 보험료 미납으로 보험사고 발생 전 해지되었다고 주장한 사안에서, 보험계약의 해지를 위해서는 상법 제650조 제3항에 따라 丙에 대한 납입 최고절차가 필요한데도 이를 거치지 않았다고 판단하여 乙 회사의 주장을 배척한 원심판결에 법리오해의 잘못이 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=235329"},{"id":"P:228545","kind":"P","label":"2020다263574","title":"손해배상등청구의소","court":"대법원","date":"2022.08.19","caseType":"민사","basis":"참조조문","text":"주식회사의 정관에서 회사에 배당의무를 부과하면서 배당금의 지급조건이나 배당금액의 산정 방식 등을 구체적으로 정하고 있어 개별 주주에게 배당할 금액이 일의적으로 산정되고, 대표이사나 이사회가 배당금 지급 여부 등을 달리 정할 수 있도록 하는 규정이 없는 경우, 정관에서 정한 지급조건이 갖추어지는 때에 주주에게 구체적이고 확정적인 배당금지급청구권이 인정될 수 있는지 여부 및 이 경우 회사가 주주총회에서 이익배당 결의를 하지 않았다거나 이익배당을 거부하는 결의를 하였다는 사정을 들어 이익배당금 지급을 거절할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=228545"},{"id":"P:235371","kind":"P","label":"2022다223273","title":"퇴직금등청구의소","court":"대법원","date":"2022.07.28","caseType":"민사","basis":"참조조문","text":"주식회사의 정관에서 이사의 퇴직금 지급에 관하여 주주총회의 결의를 거친 임원퇴직금 지급규정에 의한다고 규정하면서 그와 함께 퇴직하는 이사에 대한 퇴직금액의 하한을 구체적으로 정하고 있는 경우, 주주총회에서 이사의 퇴직금 지급에 관한 규정을 만들지 않거나 퇴직금에 관한 결의를 하지 않았다는 이유로 퇴직한 이사에 대하여 정관에 구체적으로 정한 하한의 범위 안에서의 퇴직금의 지급을 거절할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=235371"},{"id":"P:227709","kind":"P","label":"2019다202146","title":"손해배상","court":"대법원","date":"2022.07.28","caseType":"민사","basis":"참조조문","text":"[1] 증권 취득자가 사업보고서 제출 당시의 주식회사 대표이사에게 사업보고서의 허위기재 등으로 입은 손해의 배상을 청구하는 경우, 배상의무자의 면책요건으로 구 자본시장과 금융투자업에 관한 법률 제162조 제1항 단서에서 정한 ‘상당한 주의를 하였음에도 불구하고 이를 알 수 없었음’의 의미 [2] 대표이사가 부담하는 다른 대표이사나 업무담당이사의 업무집행에 관한 감시의무의 내용 / 대규모 회사에서 대표이사와 업무담당이사가 내부적인 사무분장에 따라 각자의 전문 분야를 전담하여 처리하는 것이 불가피하다는 사정만으로 대표이사가 다른 대표이사나 이사들의 업무집행에 관한 감시의무를 면하는지 여부 및 이러한 경우 구축하여야 할 내부통제시스템의 형태 / 대표이사가 회계부정이나 오류를 사전적으로 예방하고 사후적으로 적발·시정할 수 있는 내부통제시스템을 구축하고 그것이 제대로 작동하도록 하는 노력을 전혀 하지 않거나 위와 같은 시스템을 통한 감시·감독의무의 이행을 의도적으로 외면하여 다른 이사 등의 회계업무에 관한 위법한 업무집행을 방지하지 못한 경우, 감시의무를 게을리한 것인지 여부 / 내부통제시스템이 합리적으로 구축되고 정상적으로 운영되었는지 판단하는 기준과 이에 관한 증명책임의 소재 및 이는 회계업무와 관련하여 구 주식회사의 외부감사에 관한 법률에 따른 내부회계관리제도가 도입되거나 재무담당임원이 임명되어 있는 경우에도 마찬가지인지 여부 [3] 민","url":"https://www.law.go.kr/precInfoP.do?precSeq=227709"},{"id":"P:233333","kind":"P","label":"2022비합200004","title":"주주총회소집허가","court":"부산지방법원","date":"2022.07.28","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233333"},{"id":"P:237077","kind":"P","label":"2019다202153","title":"손해배상(기)","court":"대법원","date":"2022.07.28","caseType":"민사","basis":"참조조문","text":"[1] 증권 취득자가 사업보고서 제출 당시의 주식회사 대표이사에게 사업보고서의 허위기재 등으로 입은 손해의 배상을 청구하는 경우, 배상의무자의 면책요건으로 구 자본시장과 금융투자업에 관한 법률 제162조 제1항 단서에서 정한 ‘상당한 주의를 하였음에도 불구하고 이를 알 수 없었음’의 의미 [2] 대표이사가 부담하는 다른 대표이사나 업무담당이사의 업무집행에 관한 감시의무의 내용 / 대규모 회사에서 대표이사와 업무담당이사가 내부적인 사무분장에 따라 각자의 전문 분야를 전담하여 처리하는 것이 불가피하다는 사정만으로 대표이사가 다른 대표이사나 이사들의 업무집행에 관한 감시의무를 면하는지 여부 및 이러한 경우 구축하여야 할 내부통제시스템의 형태 / 대표이사가 회계부정이나 오류를 사전적으로 예방하고 사후적으로 적발·시정할 수 있는 내부통제시스템을 구축하고 그것이 제대로 작동하도록 하는 노력을 전혀 하지 않거나 위와 같은 시스템을 통한 감시·감독의무의 이행을 의도적으로 외면하여 다른 이사 등의 회계업무에 관한 위법한 업무집행을 방지하지 못한 경우, 감시의무를 게을리한 것인지 여부 / 내부통제시스템이 합리적으로 구축되고 정상적으로 운영되었는지 판단하는 기준과 이에 관한 증명책임의 소재 및 이는 회계업무와 관련하여 구 주식회사의 외부감사에 관한 법률에 따른 내부회계관리제도가 도입되거나 재무담당임원이 임명되어 있는 경우에도 마찬가지인지 여부 [3] 민","url":"https://www.law.go.kr/precInfoP.do?precSeq=237077"},{"id":"P:237269","kind":"P","label":"2021가합11925","title":"손해배상(기)","court":"수원지방법원평택지원","date":"2022.07.21","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=237269"},{"id":"P:223839","kind":"P","label":"2017다242232","title":"손해배상(기)","court":"대법원","date":"2022.07.14","caseType":"민사","basis":"참조조문","text":"공익사업을 위한 토지 등의 취득 및 보상에 관한 법률에 따른 협의취득으로 체결된 부동산 매매계약에서 당사자 일방이 상인인 경우, 매도인의 채무불이행책임이나 하자담보책임에 따른 매수인의 손해배상채권에 대하여 상사소멸시효가 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=223839"},{"id":"P:223845","kind":"P","label":"2019다271661","title":"손해배상","court":"대법원","date":"2022.07.14","caseType":"민사","basis":"참조조문","text":"[1] 투자 관련 계약에서 당사자 일방이 상대방에게 자신이 보유한 주식의 매수를 청구하면 주식에 관한 매매계약이 체결되는 것으로 정한 경우, 이러한 주식매수청구권의 법적 성질 / 이와 같은 주식매수청구권의 행사기간이 제척기간인지 여부 및 행사기간에 관한 약정이 없는 경우, 주식매수청구권의 행사기간을 정하는 기준 [2] 상행위인 투자 관련 계약에서 투자자가 약정에 따라 투자를 실행하여 주식을 취득한 후 투자대상회사 등의 의무불이행이 있는 때에 투자자에게 다른 주주 등을 상대로 한 주식매수청구권을 부여하는 경우, 이러한 주식매수청구권은 5년의 제척기간이 지나면 소멸하는지 여부 및 그 행사기간은 투자대상회사 등의 의무불이행이 있는 때부터 기산하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=223845"},{"id":"P:235407","kind":"P","label":"2022다217513","title":"부당이득금","court":"대법원","date":"2022.07.14","caseType":"민사","basis":"참조조문","text":"[1] 상법 제388조에서 정한 ‘이사의 보수’의 범위 및 위 조항이 강행규정인지 여부 [2] 이른바 1인회사인 주식회사의 경우, 주주총회 소집절차에 하자가 있거나 주주총회의사록이 작성되지 않았더라도 1인주주의 의사가 주주총회의 결의내용과 일치한다면 증거에 의하여 그러한 내용의 결의가 있었던 것으로 볼 수 있는지 여부 및 1인회사가 아닌 주식회사의 경우, 주주총회의 의결정족수를 충족하는 주식을 가진 주주들이 동의하거나 승인하였다는 사정만으로 주주총회에서 그러한 내용의 결의가 이루어질 것이 명백하다거나 그러한 내용의 결의가 있었던 것과 마찬가지라고 볼 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=235407"},{"id":"P:223809","kind":"P","label":"2021다216773","title":"매매대금","court":"대법원","date":"2022.07.14","caseType":"민사","basis":"판례내용","text":"[1] 계약 체결을 위한 교섭 과정에서 어느 일방이 보호가치 있는 기대나 신뢰를 가지게 된 경우, 상대방이 상당한 이유 없이 이를 침해하여 손해를 입혔다면 불법행위를 구성할 수 있는지 여부 [2] 당사자 중 일방이 계약의 성립을 기대하고 이행을 위하여 지출하였거나 지출할 것이 확실한 비용이 계약 교섭의 부당파기로 인한 손해배상의 범위에 해당할 수 있는 경우 [3] 甲 증권회사의 직원이 乙 증권회사의 직원에게 丙 증권회사가 甲 회사로부터 매수하여 보관하고 있던 丁 주식회사 발행의 기업어음을 乙 회사가 매수하여 보관해 달라고 요청하자, 乙 회사의 직원이 乙 회사는 위 어음을 매수하여 5영업일간 보관할 수 있다고 답변하였고, 그 직후 乙 회사가 위 어음을 매수하였는데, 그로부터 약 6개월 후 위 어음이 부도처리되자, 乙 회사가 甲 회사를 상대로 주위적으로는 매매대금 등의 지급을 구하고, 예비적으로는 불법행위를 이유로 손해배상을 구한 사안에서, 甲 회사가 乙 회사로부터 위 어음을 매수하는 내용의 매매계약 등이 체결되었다고 볼 수는 없으나, 甲 회사가 위 어음에 관한 매매계약 체결을 거부한 것은 계약 교섭의 부당파기에 해당하므로, 乙 회사가 위 어음을 매수하는 데 지출한 매매비용 등을 배상할 의무가 있다고 본 원심판단에 법리오해 등의 잘못이 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=223809"},{"id":"P:235153","kind":"P","label":"2022카합5105","title":"주주명부열람등사가처분","court":"대구지방법원서부지원","date":"2022.07.14","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=235153"},{"id":"P:231749","kind":"P","label":"2021노414","title":"업무상배임[변경된죄명:특정경제범죄가중처벌등에관한법률위반(배임)]·횡령","court":"대구고등법원","date":"2022.07.07","caseType":"형사","basis":"참조조문","text":"공동주택사업을 시행하는 甲 주식회사의 이사 및 직원으로 재직 중 乙 지구 사업 관련 자료들을 작성하였던 피고인들이, 甲 회사와 동종영업을 목적으로 하는 丙 주식회사의 임원으로 취임한 후 위 자료들을 이용하여 丁 지구 사업을 추진함으로써 丙 회사로 하여금 재산상 이익을 취득하게 하고 甲 회사에 丁 지구 사업에 관한 사업기회를 상실하는 손해를 가하였다고 하여 특정경제범죄 가중처벌 등에 관한 법률 위반으로 기소된 사안에서, 검사가 제출한 증거만으로는 피고인들이 업무상배임죄에서 말하는 업무상 임무를 위배하였다거나 그로 인하여 甲 회사에 손해가 발생하였다는 점이 증명되었다고 보기 어렵다는 이유로 공소사실을 무죄로 판단한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=231749"},{"id":"P:223365","kind":"P","label":"2018두54323","title":"법인세경정청구거부처분취소","court":"대법원","date":"2022.06.30","caseType":"세무","basis":"판례내용","text":"[1] 甲 주식회사가 乙 주식회사를 흡수합병하였는데 乙 회사가 보유하던 甲 회사의 발행 주식의 일부를 양도한 후 위 주식 양도금액을 익금에 산입하고 양도 당시의 그 장부가액을 손금에 산입하여 법인세를 신고하였다가, 이후 甲 회사가 ‘위 주식의 양도는 자본의 증감에 관련된 거래로서 자본거래로 봄이 상당하고 위 주식의 양도차익은 자본거래에 따른 이익으로서 익금산입 대상에서 제외된다.’는 취지로 주장하며 법인세 경정청구를 하였으나 관할 세무서장이 이를 거부한 사안에서, 피합병법인이 보유하던 합병법인 주식의 처분이익은 구 법인세법 제15조 제1항이 익금에서 제외되는 것으로 정한 대상이나 구 법인세법 제17조 제1항 제5호가 정한 합병차익에 해당한다고 볼 수 없다고 본 원심판단을 수긍한 사례 [2] 합병법인이 구 법인세법 제44조 제2항의 요건을 갖춘 합병으로 취득한 자기주식을 양도한 경우 양도차익을 계산하는 방법","url":"https://www.law.go.kr/precInfoP.do?precSeq=223365"},{"id":"P:232053","kind":"P","label":"2021나8470","title":"구상금·보험금","court":"전주지방법원","date":"2022.06.22","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=232053"},{"id":"P:242091","kind":"P","label":"2021가합24725","title":"채무부존재확인","court":"서울북부지방법원","date":"2022.06.16","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=242091"},{"id":"P:222691","kind":"P","label":"2018다301350","title":"토지인도","court":"대법원","date":"2022.06.16","caseType":"민사","basis":"참조조문","text":"[1] 민법 제321조에서 정한 유치권의 불가분성은 목적물이 분할 가능하거나 수 개의 물건인 경우에도 적용되는지 여부 및 이는 상법 제58조의 상사유치권에도 적용되는지 여부 [2] 하나의 채권을 피담보채권으로 하여 여러 필지의 토지에 대하여 유치권을 취득한 유치권자가 그중 일부 필지의 토지에 대하여 선량한 관리자의 주의의무를 위반한 경우, 위반행위가 있었던 필지의 토지에 대하여만 유치권 소멸청구가 가능한지 여부 [3] 소송계속 중 제3자가 민사소송법 제81조에 따라 소송에 참가한 후 원고가 승계참가인의 승계 여부에 대해 다투지 않으면서도 소송탈퇴, 소 취하 등을 하지 않거나 이에 대하여 피고가 부동의하여 원고가 소송에 남아 있는 경우, 승계로 인해 중첩된 원고와 승계참가인의 청구 사이에 필수적 공동소송에 관한 민사소송법 제67조가 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=222691"},{"id":"P:235437","kind":"P","label":"2018다301510","title":"사업권이전무효확인","court":"대법원","date":"2022.06.16","caseType":"민사","basis":"참조조문","text":"주식회사의 주주가 직접 회사와 제3자의 거래관계에 개입하여 회사가 체결한 계약의 무효 확인을 구할 이익이 있는지 여부 및 이러한 법리는 회사가 영업의 전부 또는 중요한 일부를 양도하는 계약을 체결하는 경우에도 마찬가지인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=235437"},{"id":"P:241311","kind":"P","label":"2021나41725","title":"구상금","court":"서울중앙지방법원","date":"2022.06.16","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=241311"},{"id":"P:222719","kind":"P","label":"2022그538","title":"청산인의선임","court":"대법원","date":"2022.06.09","caseType":"민사","basis":"판례내용","text":"비송사건절차법 제119조에서 불복신청을 금지하는 ‘청산인의 선임의 재판’에 청산인 선임신청 기각결정이 포함되는지 여부 및 신청인이 비송사건절차법 제20조 제1항에 따라 청산인 선임신청 기각결정에 대하여 항고할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=222719"},{"id":"P:222715","kind":"P","label":"2018다228462","title":"영업양도무효확인·사해행위취소[주주가 영업양도의 무효확인을 구하는 사건]","court":"대법원","date":"2022.06.09","caseType":"민사","basis":"참조조문","text":"[1] 주식회사의 주주가 직접 회사와 제3자의 거래관계에 개입하여 회사가 체결한 계약의 무효 확인을 구할 이익이 있는지 여부 및 이러한 법리는 회사가 영업의 전부 또는 중요한 일부를 양도하는 계약을 체결하는 경우에도 마찬가지인지 여부 [2] 주식회사가 제3자와 체결한 계약으로 인하여 회사의 변제 자력이 감소되어 채권의 전부나 일부가 만족될 수 없게 된 경우, 회사의 채권자가 직접 그 계약의 무효 확인을 구할 이익이 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=222715"},{"id":"P:222711","kind":"P","label":"2017다247848","title":"구상금","court":"대법원","date":"2022.06.09","caseType":"민사","basis":"참조조문","text":"[1] 상법 제814조 제1항에서 정한 해상운송인의 송하인이나 수하인에 대한 권리·의무의 소멸기간이 제척기간인지 여부 [2] 상법 제814조 제1항에서 정한 제척기간이 지난 뒤에 그 기간 경과의 이익을 받는 당사자가 기간이 지난 사실을 알면서도 기간 경과로 인한 법적 이익을 받지 않겠다는 의사를 명확히 표시한 경우, 민법 제184조 제1항을 유추적용하여 제척기간 경과로 인한 권리소멸의 이익을 포기한 것으로 인정할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=222711"},{"id":"P:221955","kind":"P","label":"2017다238141","title":"손해배상및부당이득금반환","court":"대법원","date":"2022.05.26","caseType":"민사","basis":"참조조문","text":"법무법인이 소송의 당사자인 경우, 등기된 법무법인의 대표자만이 법무법인을 대표하여 소송행위 등 업무를 수행할 수 있는지 여부 및 이러한 법리는 법무법인의 경우에도 마찬가지인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=221955"},{"id":"P:221991","kind":"P","label":"2020다301186","title":"구상금","court":"대법원","date":"2022.05.26","caseType":"민사","basis":"참조조문","text":"[1] 학교안전공제중앙회가 학교배상책임공제에 따라 피해자에게 공제금을 지급한 경우, 가해자인 피공제자의 책임보험자에게 피해자의 보험금 직접청구권을 대위행사할 수 있는지 여부 / 학교안전공제중앙회가 피공제자의 책임보험자에게 구상권을 행사할 수 있는 경우와 그 범위 [2] 학교배상책임공제계약의 피공제자인 중학생 甲이 축구 동아리 활동을 위해 학교 밖 축구장으로 이동하던 중 인도를 지나가던 피해자 乙을 제대로 보지 못하고 부딪히는 사고가 발생하여 乙이 뒤로 넘어지면서 중증 뇌손상 등을 입고 치료 중 사망하자, 학교안전공제중앙회가 乙 측에 공제금을 지급한 다음 乙을 대위하여 피공제자 甲의 책임보험자인 丙 보험회사 등을 상대로 보험금 지급을 구한 사안에서, 학교안전공제중앙회가 공제금 전액에 대하여 피해자 乙을 대위하여 피공제자 甲의 책임보험자인 丙 회사 등을 상대로 보험금 직접청구권을 행사할 수 있다고 본 원심판단에는 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=221991"},{"id":"P:221999","kind":"P","label":"2022다200249","title":"임금","court":"대법원","date":"2022.05.26","caseType":"민사","basis":"참조조문","text":"의사가 의료기관에 대하여 갖는 급여, 수당, 퇴직금 등 채권이 상사채권에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=221999"},{"id":"P:599771","kind":"P","label":"2021나49224","title":"보험금","court":"서울중앙지방법원","date":"2022.05.17","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=599771"},{"id":"P:221741","kind":"P","label":"2019다270163","title":"회계장부와서류의열람및등사청구의소","court":"대법원","date":"2022.05.13","caseType":"민사","basis":"참조조문","text":"상법 제466조 제1항에서 정한 소수주주의 회계장부 등에 대한 열람·등사청구권을 행사할 때 요구되는 이유 기재의 정도 / 열람·등사청구의 부당성에 관한 주장·증명책임의 소재","url":"https://www.law.go.kr/precInfoP.do?precSeq=221741"},{"id":"P:221751","kind":"P","label":"2021다279347","title":"주주대표소송(손해배상)","court":"대법원","date":"2022.05.12","caseType":"민사","basis":"참조조문","text":"[1] 주식회사의 이사는 대표이사나 업무담당이사가 법령을 준수하여 업무를 수행하도록 감시·감독할 의무를 부담하는지 여부 및 이는 사외이사 등 회사의 상무에 종사하지 않는 이사도 마찬가지인지 여부 / 주식회사의 이사가 대표이사나 업무담당이사의 업무집행이 위법하다고 의심할 만한 사유가 있는데도 고의 또는 과실로 감시의무를 위반하여 이를 방치한 경우, 이로 인해 회사가 입은 손해에 대하여 상법 제399조 제1항에 따른 배상책임을 지는지 여부 [2] 대규모 회사에서 대표이사나 일부 이사들만이 내부적인 사무분장에 따라 각자의 전문 분야를 전담하여 처리하는 것이 불가피한 경우, 이사가 부담하는 감시의무의 내용 / 업무집행을 담당하지 않는 사외이사 등이 감시의무를 위반한 것으로 인정될 수 있는 경우 [3] 이사가 법령 등을 위반한 행위를 하거나 임무를 게을리하여 회사에 손해배상책임을 지는 경우, 임무위반의 경위 등 제반 사정을 참작하여 손해배상액을 제한할 수 있는지 여부 및 이때 손해배상액 제한의 참작 사유에 관한 사실인정이나 제한 비율의 결정이 사실심의 전권사항인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=221751"},{"id":"P:235497","kind":"P","label":"2020다255375","title":"손해배상(기)·손해배상(기)","court":"대법원","date":"2022.05.12","caseType":"민사","basis":"참조조문","text":"[1] 불법행위로 인한 손해배상청구권의 단기소멸시효 기산점이 되는 민법 제766조 제2항에서 정한 ‘손해 및 가해자를 안 날’의 의미 및 피해자가 언제 불법행위의 요건사실을 현실적·구체적으로 인식하였는지 판단하는 방법 / 상법 제389조 제3항, 제210조에 따른 주식회사의 손해배상책임의 경우, ‘피해자가 가해자를 안다’는 것의 의미 [2] 대표이사의 불법행위로 인하여 주식회사가 손해배상책임을 지기 위한 요건인 ‘업무집행으로 인하여’에 대표이사의 업무에 속하지는 않지만 외형상 그 범위에 속하는 것으로 보이는 경우가 포함되는지 여부 및 이때 대표이사의 행위가 업무 또는 직무권한에 속하지 않음을 상대방이 알았거나 중대한 과실로 알지 못한 경우, 주식회사가 손해배상책임을 부담하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=235497"},{"id":"P:242095","kind":"P","label":"2020나26422","title":"구상금","court":"서울중앙지방법원","date":"2022.05.11","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=242095"},{"id":"P:221783","kind":"P","label":"2021마6868","title":"구상금","court":"대법원","date":"2022.05.03","caseType":"민사","basis":"판례내용","text":"영업에 관한 채무의 이행을 구하는 소를 제소 당시 채권 추심 관련 업무를 실제로 담당하는 채권자의 영업소 소재지 법원에 제기할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=221783"},{"id":"P:222651","kind":"P","label":"2019다272053","title":"소유권이전등기","court":"대법원","date":"2022.04.28","caseType":"민사","basis":"참조조문","text":"[1] 기부채납의 법적 성질 및 지방자치단체와 상인인 기부자 사이에 체결된 기부채납 약정에 근거한 채권에 5년의 상사 소멸시효기간이 적용되는지 여부 [2] 물건에 대한 점유의 의미 및 판단 기준 [3] 甲 주식회사가 乙 지방자치단체와 체결한 주차장에 관한 기부채납 약정을 이행하기 위해 주차장을 설치하였고 이후 주민들이 무상으로 주차장을 사용하고 있는데, 乙 지방자치단체가 甲 회사를 상대로 주차장에 대한 소유권이전등기절차의 이행을 구하자, 甲 회사가 乙 지방자치단체의 소유권이전등기청구권이 시효로 소멸하였다고 항변한 사안에서, 乙 지방자치단체의 소유권이전등기청구권에는 5년의 상사 소멸시효기간이 적용되는데, 乙 지방자치단체가 직접 또는 관리 위탁을 통해 주차장을 유지·관리함으로써 주차장을 지속적으로 점유해 온 것이라고 평가할 수 있는데도, 乙 지방자치단체의 소유권이전등기청구권이 시효로 소멸하였다고 본 원심판결에 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=222651"},{"id":"P:222821","kind":"P","label":"2021가합209861","title":"손해배상(자)","court":"대구지방법원","date":"2022.04.28","caseType":"민사","basis":"참조조문","text":"甲이 운전하던 甲 소유 피해차량의 뒷부분을 가해차량이 충격하여 피해차량의 트렁크리드, 쿼터패널, 트렁크플로어, 리어패널 등이 손괴되는 사고가 발생하자, 甲이 피해차량을 수리하면서 수리기간 51일 중 29일은 국산차량을, 나머지 22일은 외제차량을 대차하였는데, 가해차량의 보험자인 乙 보험회사가 수리비용과 국산차량 대차료만 보험금으로 지급하자, 甲이 피해차량의 교환가치 하락에 따른 손해, 외제차량 대차료 손해 등에 대한 보험금의 지급을 구한 사안에서, 乙 회사는 甲에게 피해차량의 교환가치 하락으로 인한 손해로 감정인이 평가한 손해액의 70%와 외제차량 대차료 상당 손해로 甲이 청구하는 금액 전부를 배상할 의무가 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=222821"},{"id":"P:220851","kind":"P","label":"2019다200843","title":"구상금","court":"대법원","date":"2022.04.28","caseType":"민사","basis":"참조조문","text":"[1] 법률상 사항에 관한 법원의 석명 또는 지적의무 [2] 채무를 변제할 이익이 있는 자가 채무를 대위변제한 경우에 갖게 되는 ‘구상권’과 ‘변제자대위권’이 내용이 전혀 다른 별개의 권리인지 여부 및 이는 상법 제682조의 ‘보험자대위권’에서도 마찬가지인지 여부 [3] 甲 보험회사가 신원보증보험계약에 따라 乙의 불법행위로 丙 주식회사가 입은 재산상 손해에 대하여 보험금과 지연손해금을 지급한 다음 乙을 상대로 구상금을 구하는 소를 제기하였고, 이때 제출한 소장 및 준비서면에 따르면 청구원인의 법적 근거는 상법 제682조에 따른 보험자대위권임이 분명한데, 청구취지 및 청구원인변경신청서 제출 시부터 제1심 변론종결일까지 별도의 법적 근거를 명시하지 않은 채 ‘구상금’이라는 표현을 사용하였고, 그 후 항소이유서에서 구상금 청구의 내용으로 ‘민법 제425조 제2항의 보증인의 피보증인에 대한 구상권’을 언급한 사안에서, 법원으로서는 적극적으로 석명권을 행사하여 당사자에게 의견 진술의 기회를 줌으로써 청구원인의 법적 근거에 관한 현저한 불분명·모순을 바로 잡은 후 이를 기초로 판단하였어야 하는데도, 상법 제682조의 보험자대위권과 민법 제425조 제2항의 구상권을 혼용하여 이를 근거로 乙에게 금전지급을 명한 원심판결에는 법리오해, 석명권 불행사 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=220851"},{"id":"P:220859","kind":"P","label":"2021다305659","title":"손해배상(기)[영업양도인의 채권자가 영업소 명칭을 속용하는 영업양수인에 대하여 변제책임을 구하는 사건]","court":"대법원","date":"2022.04.28","caseType":"민사","basis":"참조조문","text":"[1] 상호를 속용하는 영업양수인의 책임을 정한 상법 제42조 제1항의 규정 취지 / 영업양수인이 상호 자체가 아닌 옥호 또는 영업표지를 속용하는 경우에도 상법 제42조 제1항이 유추적용되는지 여부 [2] 채권자가 영업양도 무렵 채무인수 사실이 없음을 알지 못한 경우, 상법 제42조 제1항에 따른 영업양수인의 변제책임이 발생하는지 여부 및 이후 채권자가 채무인수 사실이 없음을 알게 된 경우, 이미 발생한 영업양수인의 변제책임이 소멸하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=220859"},{"id":"P:220881","kind":"P","label":"2022그501","title":"주주총회소집허가","court":"대법원","date":"2022.04.19","caseType":"민사","basis":"참조조문","text":"소수주주가 상법 제366조에 따라 주주총회소집허가 신청을 하는 경우, 정관에서 주주총회 결의사항으로 규정하지 않은 ‘대표이사의 선임 및 해임’을 회의목적사항으로 할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=220881"},{"id":"P:616593","kind":"P","label":"2021나19896","title":"구상금","court":"서울중앙지방법원","date":"2022.04.14","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=616593"},{"id":"P:227247","kind":"P","label":"2019다274639","title":"주식양도절차이행","court":"대법원","date":"2022.03.31","caseType":"민사","basis":"참조조문","text":"[1] 주주 사이에서 주식의 양도를 일부 제한하는 약정을 한 경우, 그 효력 [2] 甲 주식회사의 출자자 전원이 체결한 주주 간 협약에는 ‘출자자는 주식을 계속하여 보유하는 것이 위법하게 되는 경우와 나머지 출자자 전원이 동의하는 경우에만 주식양도를 할 수 있고, 이 경우 다른 주주들은 우선매수할 권리가 있다.’는 내용의 조항을 두고 있는데, 乙 주식회사가 甲 회사의 출자자인 丙 주식회사로부터 甲 회사의 주식을 양수하는 계약을 체결하면서 출자자 전원의 동의를 얻지 못할 경우에는 계약을 무효로 한다고 약정하였다가 丙 회사로부터 출자자 전원의 동의를 얻지 못하여 계약이 무효가 되었다는 통보를 받자, 우선매수권 행사가 없는 경우 출자자 전원의 동의는 필요하지 않다는 주장과 주식양도를 위해 출자자 전원의 동의를 요하는 위 협약 조항은 무효라는 주장을 하면서 계약의 유효를 전제로 주식양도절차의 이행을 구한 사안에서, 乙 회사의 주장을 모두 배척한 원심판단에 법리오해 등의 잘못이 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=227247"},{"id":"P:230905","kind":"P","label":"2020두55060","title":"상수도원인자부담금등부과처분취소","court":"대법원","date":"2022.03.31","caseType":"일반행정","basis":"판례내용","text":"[1] 택지개발사업으로 조성된 토지를 취득하여 개발계획에서 정해진 규모 및 용도에 따라 건축물의 건축행위를 한 자가 수도법령에 따른 상수도원인자부담금 납부의무를 부담하는지 여부 [2] 법인이 해당 지방자치단체의 구역 안에 주된 사무소 또는 본점을 두고 있지 않지만 ‘사업소’를 두고 있는 경우, 구 지방자치법 제138조에 따른 분담금 납부의무자인 ‘주민’에 해당하는지 여부 [3] 법인이 해당 지방자치단체에서 인적·물적 설비를 갖추고 계속적으로 사업을 영위하면서 해당 지방자치단체의 재산 또는 공공시설의 설치로 특히 이익을 받는 경우, 구 지방자치법 제138조에 따른 분담금 납부의무자가 될 수 있는지 여부 및 위 조항에 근거하여 분담금 제도를 구체화한 조례에서 정한 부과 요건을 충족하는 경우, 분담금을 납부할 의무가 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=230905"},{"id":"P:227257","kind":"P","label":"2021다201085","title":"채무부존재확인·보험금","court":"대법원","date":"2022.03.31","caseType":"민사","basis":"참조조문","text":"상법 제680조 제1항에서 정한 ‘손해방지비용’의 의미 및 책임보험에서 건축물 등에 발생한 누수와 관련하여 실시된 방수공사의 비용이 손해방지비용에 해당하는지 판단하는 방법","url":"https://www.law.go.kr/precInfoP.do?precSeq=227257"},{"id":"P:238673","kind":"P","label":"2021나18883","title":"위약금","court":"수원고등법원","date":"2022.03.17","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238673"},{"id":"P:232011","kind":"P","label":"2017다48959","title":"손해배상(기)등","court":"대법원","date":"2022.03.11","caseType":"민사","basis":"참조조문","text":"[1] ‘계약자 또는 피보험자가 손해의 통지 또는 보험금청구에 관한 서류에 고의로 사실과 다른 것을 기재하였거나 그 서류 또는 증거를 위조 또는 변조한 경우에는 보험금청구권을 상실한다.’고 정한 화재보험 약관조항의 취지 및 위 약관조항에 따라 보험금청구권을 상실하는지 결정할 때 비교·형량하여야 할 사항 / 정상적으로 보험계약을 체결하고 유지하여 오다가 발생한 보험사고와 관련하여 보험사고의 발생에 원인을 제공한 바 없는 보험금청구권자가 실제 손해보다 과다하게 보험금을 청구한 경우, 위 약관조항에 따라 보험금청구권 전부를 상실하는지 판단하는 기준 / 독립한 여러 물건을 보험목적물로 하는 화재보험계약의 피보험자가 그중 일부 보험목적물에 관하여 허위의 보험금청구를 한 경우, 위 약관에 따라 상실하는 보험금청구권의 범위 [2] 甲 주식회사가 화재로 보험목적물인 윤전기 2대가 일부 훼손 또는 전손되는 손해를 입고 보험자인 乙 보험회사로부터 손해사정을 거쳐 보험금을 지급받았는데, 이후 형사사건에서 甲 회사의 대표이사가 보험금을 청구하면서 매수가격이 부풀려진 허위의 손해사정자료를 제출하였음이 밝혀지자, 乙 회사가 甲 회사 등을 상대로 불법행위에 따른 손해배상 또는 부당이득반환으로 보험금 전부 또는 일부의 반환을 구하는 소를 제기하였다가 이후 부당이득반환의 청구취지를 확장하여 甲 회사가 ‘보험계약자 또는 피보험자가 손해의 통지 또는 보험금청구에 관한","url":"https://www.law.go.kr/precInfoP.do?precSeq=232011"},{"id":"P:231615","kind":"P","label":"2021나2011495","title":"손해배상(기)","court":"서울고등법원","date":"2022.02.18","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=231615"},{"id":"P:231617","kind":"P","label":"2021나17774","title":"배당금청구","court":"수원고등법원","date":"2022.02.17","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=231617"},{"id":"P:236073","kind":"P","label":"2021가단5051818","title":"구
