2항에 따라 제출받거나 수집한 서류ㆍ자료 등을 이 법에 따른 경우를 제외하고는 제3자에게 제공하거나 일반에 공개해서는 아니 된다. <신설 2020.2.4, 2023.3.14>\n⑦ 보호위원회는 정보통신망을 통하여 자료의 제출 등을 받은 경우나 수집한 자료 등을 전자화한 경우에는 개인정보ㆍ영업비밀 등이 유출되지 아니하도록 제도적ㆍ기술적 보완조치를 하여야 한다. <신설 2020.2.4, 2023.3.14>\n제63조(자료제출 요구 및 검사)","kind":"L"},{"id":"L:63-2","label":"법 제63조의2","title":"사전 실태점검","chapter":"제9장 보칙","deleted":false,"text":"① 보호위원회는 제63조제1항 각 호에 해당하지 아니하는 경우로서 개인정보 침해사고 발생의 위험성이 높고 개인정보 보호의 취약점을 사전에 점검할 필요성이 인정되는 개인정보처리자에 대하여 개인정보 보호실태를 점검할 수 있다.\n② 보호위원회는 제1항에 따른 실태점검을 실시하여 이 법을 위반하는 사항을 발견한 경우 해당 개인정보처리자에 대하여 시정방안을 정하여 이에 따를 것을 권고할 수 있다.\n③ 제2항에 따른 시정권고를 받은 개인정보처리자는 이를 통보받은 날부터 10일 이내에 해당 권고를 수락하는지 여부에 관하여 보호위원회에 통지하여야 하며, 그 이행 결과를 보호위원회가 고시로 정하는 바에 따라 보호위원회에 알려야 한다.\n④ 제2항에 따른 시정권고를 받은 자가 해당 권고를 수락한 때에는 제64조제1항에 따른 시정조치 명령(중앙행정기관, 지방자치단체, 국회, 법원, 헌법재판소, 중앙선거관리위원회의 경우에는 제64조제3항에 따른 권고를 말한다)을 받은 것으로 본다.\n⑤ 보호위원회는 제2항에 따른 시정권고를 받은 자가 해당 권고를 수락하지 아니하거나 이행하지 아니한 경우 제63조제2항에 따른 검사를 할 수 있다.\n⑥ 보호위원회는 관계 중앙행정기관의 장과 합동으로 제1항에 따른 개인정보 보호실태를 점검할 수 있다.\n제63조의2(사전 실태점검)","kind":"L"},{"id":"L:64","label":"법 제64조","title":"시정조치 등","chapter":"제9장 보칙","deleted":false,"text":"① 보호위원회는 이 법을 위반한 자(중앙행정기관, 지방자치단체, 국회, 법원, 헌법재판소, 중앙선거관리위원회는 제외한다)에 대하여 다음 각 호에 해당하는 조치를 명할 수 있다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.2.4, 2023.3.14>\n1. 개인정보 침해행위의 중지\n2. 개인정보 처리의 일시적인 정지\n3. 그 밖에 개인정보의 보호 및 침해 방지를 위하여 필요한 조치\n② 지방자치단체, 국회, 법원, 헌법재판소, 중앙선거관리위원회는 그 소속 기관 및 소관 공공기관이 이 법을 위반하였을 때에는 제1항 각 호에 해당하는 조치를 명할 수 있다. <개정 2023.3.14>\n③ 보호위원회는 중앙행정기관, 지방자치단체, 국회, 법원, 헌법재판소, 중앙선거관리위원회가 이 법을 위반하였을 때에는 해당 기관의 장에게 제1항 각 호에 해당하는 조치를 하도록 권고할 수 있다. 이 경우 권고를 받은 기관은 특별한 사유가 없으면 이를 존중하여야 한다. <개정 2023.3.14>\n제64조(시정조치 등)","kind":"L"},{"id":"L:64-2","label":"법 제64조의2","title":"과징금의 부과","chapter":"제9장 보칙","deleted":false,"text":"① 보호위원회는 다음 각 호의 어느 하나에 해당하는 경우에는 해당 개인정보처리자에게 전체 매출액의 100분의 3을 초과하지 아니하는 범위에서 과징금을 부과할 수 있다. 다만, 매출액이 없거나 매출액의 산정이 곤란한 경우로서 대통령령으로 정하는 경우에는 20억원을 초과하지 아니하는 범위에서 과징금을 부과할 수 있다. <개정 2026.3.10>\n1. 제15조제1항, 제17조제1항, 제18조제1항ㆍ제2항(제26조제8항에 따라 준용되는 경우를 포함한다) 또는 제19조를 위반하여 개인정보를 처리한 경우\n2. 제22조의2제1항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 법정대리인의 동의를 받지 아니하고 만 14세 미만인 아동의 개인정보를 처리한 경우\n3. 제23조제1항제1호(제26조제8항에 따라 준용되는 경우를 포함한다)를 위반하여 정보주체의 동의를 받지 아니하고 민감정보를 처리한 경우\n4. 제24조제1항ㆍ제24조의2제1항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 고유식별정보 또는 주민등록번호를 처리한 경우\n5. 제26조제4항에 따른 관리ㆍ감독 또는 교육을 소홀히 하여 수탁자가 이 법의 규정을 위반한 경우\n6. 제28조의5제1항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 특정 개인을 알아보기 위한 목적으로 정보를 처리한 경우\n7. 제28조의8제1항(제26조제8항 및 제28조의11에 따라 준용되는 경우를 포함한다)을 위반하여 개인정보를 국외로 이전한 경우\n8. 제28조의9제1항(제26조제8항 및 제28조의11에 따라 준용되는 경우를 포함한다)을 위반하여 국외 이전 중지 명령을 따르지 아니한 경우\n9. 개인정보처리자가 처리하는 개인정보가 유출등이 된 경우. 다만, 개인정보가 유출등이 되지 아니하도록 개인정보처리자가 제29조(제26조제8항에 따라 준용되는 경우를 포함한다)에 따른 안전성 확보에 필요한 조치를 다한 경우에는 그러하지 아니하다.\n② 제1항에도 불구하고 보호위원회는 다음 각 호의 어느 하나에 해당하는 경우에는 해당 개인정보처리자에게 전체 매출액의 100분의 10을 초과하지 아니하는 범위에서 과징금을 부과할 수 있다. 다만, 매출액이 없거나 매출액의 산정이 곤란한 경우로서 대통령령으로 정하는 경우에는 50억원을 초과하지 아니하는 범위에서 과징금을 부과할 수 있다. <신설 2026.3.10>\n1. 이 조에 따른 과징금 부과처분을 받은 날부터 3년이 경과하기 전에 제1항 같은 호에 해당하는 위반행위를 한 경우(각각 고의 또는 중대한 과실이 있는 경우로 한정한다)\n2. 고의 또는 중대한 과실로 제1항 각 호의 어느 하나에 해당하는 위반행위를 하고 정보주체의 피해 규모가 1천만명 이상인 경우\n3. 제64조제1항에 따른 시정조치 명령에 따르지 아니하여 개인정보처리자가 제1항제9호의 위반행위를 한 경우\n③ 보호위원회는 제1항 및 제2항에 따른 과징금을 부과하려는 경우 전체 매출액에서 위반행위와 관련이 없는 매출액을 제외한 매출액을 기준으로 과징금을 산정한다. <개정 2026.3.10>\n④ 보호위원회는 제1항 및 제2항에 따른 과징금을 부과하려는 경우 개인정보처리자가 정당한 사유 없이 매출액 산정자료의 제출을 거부하거나 거짓의 자료를 제출한 경우에는 해당 개인정보처리자의 전체 매출액을 기준으로 산정하되 해당 개인정보처리자 및 비슷한 규모의 개인정보처리자의 개인정보 보유 규모, 재무제표 등 회계자료, 상품ㆍ용역의 가격 등 영업현황 자료에 근거하여 매출액을 추정할 수 있다. <개정 2026.3.10>\n⑤ 보호위원회는 제1항 및 제2항에 따른 과징금을 부과하는 경우에는 위반행위에 상응하는 비례성과 침해 예방에 대한 효과성이 확보될 수 있도록 다음 각 호의 사항을 고려하여야 한다. <개정 2026.3.10>\n1. 위반행위의 내용 및 정도\n2. 위반행위의 기간 및 횟수\n3. 위반행위로 인하여 취득한 이익의 규모\n4. 암호화 등 안전성 확보 조치 이행 노력\n5. 개인정보가 유출등이 된 경우 위반행위와의 관련성 및 유출등의 규모\n6. 위반행위로 인한 피해의 회복 및 피해 확산 방지 조치의 이행 여부\n7. 개인정보처리자의 업무 형태 및 규모\n8. 개인정보처리자가 처리하는 개인정보의 유형과 정보주체에게 미치는 영향\n9. 위반행위로 인한 정보주체의 피해 규모\n10. 개인정보 보호 인증, 자율적인 보호 활동 등 개인정보 보호를 위한 노력\n11. 보호위원회와의 협조 등 위반행위를 시정하기 위한 조치 여부\n⑥ 보호위원회는 개인정보 보호를 위하여 예산ㆍ인력ㆍ설비ㆍ장치 등을 투자하고 운영하는 등 대통령령으로 정하는 사유가 있는 경우에는 제1항 및 제2항에 따른 과징금을 감경한다. 다만, 개인정보처리자의 고의 또는 중대한 과실로 위반행위를 한 경우는 제외한다. <신설 2026.3.10>\n⑦ 보호위원회는 다음 각 호의 어느 하나에 해당하는 사유가 있는 경우에는 과징금을 부과하지 아니할 수 있다. <개정 2026.3.10>\n1. 지급불능ㆍ지급정지 또는 자본잠식 등의 사유로 객관적으로 과징금을 낼 능력이 없다고 인정되는 경우\n2. 본인의 행위가 위법하지 아니한 것으로 잘못 인식할 만한 정당한 사유가 있는 경우\n3. 위반행위의 내용ㆍ정도가 경미하거나 산정된 과징금이 소액인 경우\n4. 그 밖에 정보주체에게 피해가 발생하지 아니하였거나 경미한 경우로서 대통령령으로 정하는 사유가 있는 경우\n⑧ 제1항 및 제2항에 따른 과징금은 제3항부터 제7항까지를 고려하여 산정하되, 구체적인 산정기준과 산정절차는 대통령령으로 정한다. <개정 2026.3.10>\n⑨ 보호위원회는 제1항 및 제2항에 따른 과징금을 내야 할 자가 납부기한까지 이를 내지 아니하면 납부기한의 다음 날부터 내지 아니한 과징금의 연 100분의 6에 해당하는 가산금을 징수한다. 이 경우 가산금을 징수하는 기간은 60개월을 초과하지 못한다. <개정 2026.3.10>\n⑩ 보호위원회는 제1항 및 제2항에 따른 과징금을 내야 할 자가 납부기한까지 내지 아니한 경우에는 기간을 정하여 독촉하고, 독촉으로 지정한 기간 내에 과징금과 제9항에 따른 가산금을 내지 아니하면 국세강제징수의 예에 따라 징수한다. <개정 2026.3.10>\n⑪ 보호위원회는 법원의 판결 등의 사유로 제1항 및 제2항에 따라 부과된 과징금을 환급하는 경우에는 과징금을 낸 날부터 환급하는 날까지의 기간에 대하여 금융회사 등의 예금이자율 등을 고려하여 대통령령으로 정하는 이자율을 적용하여 계산한 환급가산금을 지급하여야 한다. <개정 2026.3.10>\n⑫ 보호위원회는 제11항에도 불구하고 법원의 판결에 따라 과징금 부과처분이 취소되어 그 판결이유에 따라 새로운 과징금을 부과하는 경우에는 당초 납부한 과징금에서 새로 부과하기로 결정한 과징금을 공제한 나머지 금액에 대해서만 환급가산금을 계산하여 지급한다. <개정 2026.3.10>\n제64조의2(과징금의 부과)","kind":"L"},{"id":"L:65","label":"법 제65조","title":"고발 및 징계권고","chapter":"제9장 보칙","deleted":false,"text":"① 보호위원회는 개인정보처리자에게 이 법 등 개인정보 보호와 관련된 법규의 위반에 따른 범죄혐의가 있다고 인정될 만한 상당한 이유가 있을 때에는 관할 수사기관에 그 내용을 고발할 수 있다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.2.4>\n② 보호위원회는 이 법 등 개인정보 보호와 관련된 법규의 위반행위가 있다고 인정될 만한 상당한 이유가 있을 때에는 책임이 있는 자(대표자 및 책임있는 임원을 포함한다)를 징계할 것을 해당 개인정보처리자에게 권고할 수 있다. 이 경우 권고를 받은 사람은 이를 존중하여야 하며 그 결과를 보호위원회에 통보하여야 한다. <개정 2013.3.23, 2013.8.6, 2014.11.19, 2017.7.26, 2020.2.4>\n③ 관계 중앙행정기관의 장은 소관 법률에 따라 개인정보처리자에 대하여 제1항에 따른 고발을 하거나 소속 기관ㆍ단체 등의 장에게 제2항에 따른 징계권고를 할 수 있다. 이 경우 제2항에 따른 권고를 받은 사람은 이를 존중하여야 하며 그 결과를 관계 중앙행정기관의 장에게 통보하여야 한다.\n제65조(고발 및 징계권고)","kind":"L"},{"id":"L:66","label":"법 제66조","title":"결과의 공표","chapter":"제9장 보칙","deleted":false,"text":"① 보호위원회는 제61조에 따른 개선권고, 제64조에 따른 시정조치 명령, 제64조의2에 따른 과징금의 부과, 제65조에 따른 고발 또는 징계권고 및 제75조에 따른 과태료 부과의 내용 및 결과에 대하여 공표할 수 있다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.2.4, 2023.3.14>\n② 보호위원회는 제61조에 따른 개선권고, 제64조에 따른 시정조치 명령, 제64조의2에 따른 과징금의 부과, 제65조에 따른 고발 또는 징계권고 및 제75조에 따른 과태료 부과처분 등을 한 경우에는 처분 등을 받은 자에게 해당 처분 등을 받았다는 사실을 공표할 것을 명할 수 있다. <개정 2023.3.14>\n③ 제1항 및 제2항에 따른 개선권고 사실 등의 공표 및 공표명령의 방법, 기준 및 절차 등은 대통령령으로 정한다. <개정 2023.3.14>\n제66조(결과의 공표)","kind":"L"},{"id":"L:67","label":"법 제67조","title":"연차보고","chapter":"제9장 보칙","deleted":false,"text":"① 보호위원회는 관계 기관 등으로부터 필요한 자료를 제출받아 매년 개인정보 보호시책의 수립 및 시행에 관한 보고서를 작성하여 정기국회 개회 전까지 국회에 제출(정보통신망에 의한 제출을 포함한다)하여야 한다.\n② 제1항에 따른 보고서에는 다음 각 호의 내용이 포함되어야 한다. <개정 2016.3.29, 2023.3.14>\n1. 정보주체의 권리침해 및 그 구제현황\n2. 개인정보 처리에 관한 실태조사 및 개인정보 보호수준 평가 등의 결과\n3. 개인정보 보호시책의 추진현황 및 실적\n4. 개인정보 관련 해외의 입법 및 정책 동향\n5. 주민등록번호 처리와 관련된 법률ㆍ대통령령ㆍ국회규칙ㆍ대법원규칙ㆍ헌법재판소규칙ㆍ중앙선거관리위원회규칙 및 감사원규칙의 제정ㆍ개정 현황\n6. 그 밖에 개인정보 보호시책에 관하여 공개 또는 보고하여야 할 사항\n제67조(연차보고)","kind":"L"},{"id":"L:68","label":"법 제68조","title":"권한의 위임ㆍ위탁","chapter":"제9장 보칙","deleted":false,"text":"① 이 법에 따른 보호위원회 또는 관계 중앙행정기관의 장의 권한은 그 일부를 대통령령으로 정하는 바에 따라 특별시장, 광역시장, 도지사, 특별자치도지사 또는 대통령령으로 정하는 전문기관에 위임하거나 위탁할 수 있다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.2.4>\n② 제1항에 따라 보호위원회 또는 관계 중앙행정기관의 장의 권한을 위임 또는 위탁받은 기관은 위임 또는 위탁받은 업무의 처리 결과를 보호위원회 또는 관계 중앙행정기관의 장에게 통보하여야 한다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.2.4>\n③ 보호위원회는 제1항에 따른 전문기관에 권한의 일부를 위임하거나 위탁하는 경우 해당 전문기관의 업무 수행을 위하여 필요한 경비를 출연할 수 있다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.2.4>\n제68조(권한의 위임ㆍ위탁)","kind":"L"},{"id":"L:69","label":"법 제69조","title":"벌칙 적용 시의 공무원 의제","chapter":"제9장 보칙","deleted":false,"text":"① 보호위원회의 위원 중 공무원이 아닌 위원 및 공무원이 아닌 직원은 「형법」이나 그 밖의 법률에 따른 벌칙을 적용할 때에는 공무원으로 본다. <신설 2020.2.4>\n② 보호위원회 또는 관계 중앙행정기관의 장의 권한을 위탁한 업무에 종사하는 관계 기관의 임직원은 「형법」 제129조부터 제132조까지의 규정을 적용할 때에는 공무원으로 본다. <신설 2020.2.4>\n제69조(벌칙 적용 시의 공무원 의제)","kind":"L"},{"id":"L:70","label":"법 제70조","title":"벌칙","chapter":"제10장 벌칙","deleted":false,"text":"1. 공공기관의 개인정보 처리업무를 방해할 목적으로 공공기관에서 처리하고 있는 개인정보를 변경하거나 말소하여 공공기관의 업무 수행의 중단ㆍ마비 등 심각한 지장을 초래한 자\n2. 거짓이나 그 밖의 부정한 수단이나 방법으로 다른 사람이 처리하고 있는 개인정보를 취득한 후 이를 영리 또는 부정한 목적으로 제3자에게 제공한 자와 이를 교사ㆍ알선한 자\n제70조(벌칙) 다음 각 호의 어느 하나에 해당하는 자는 10년 이하의 징역 또는 1억원 이하의 벌금에 처한다. <개정 2015.7.24>","kind":"L"},{"id":"L:71","label":"법 제71조","title":"벌칙","chapter":"제10장 벌칙","deleted":false,"text":"1. 제17조제1항제2호에 해당하지 아니함에도 같은 항 제1호(제26조제8항에 따라 준용되는 경우를 포함한다)를 위반하여 정보주체의 동의를 받지 아니하고 개인정보를 제3자에게 제공한 자 및 그 사정을 알면서도 개인정보를 제공받은 자\n2. 제18조제1항ㆍ제2항, 제27조제3항 또는 제28조의2(제26조제8항에 따라 준용되는 경우를 포함한다), 제19조 또는 제26조제5항을 위반하여 개인정보를 이용하거나 제3자에게 제공한 자 및 그 사정을 알면서도 영리 또는 부정한 목적으로 개인정보를 제공받은 자\n3. 제22조의2제1항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 법정대리인의 동의를 받지 아니하고 만 14세 미만인 아동의 개인정보를 처리한 자\n4. 제23조제1항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 민감정보를 처리한 자\n5. 제24조제1항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 고유식별정보를 처리한 자\n6. 제28조의3제1항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 보호위원회 또는 관계 중앙행정기관의 장으로부터 전문기관으로 지정받지 아니하고 가명정보를 결합한 자\n7. 제28조의3제2항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 전문기관의 장의 승인을 받지 아니하고 결합을 수행한 기관 외부로 결합된 정보를 반출하거나 이를 제3자에게 제공한 자 및 그 사정을 알면서도 영리 또는 부정한 목적으로 결합된 정보를 제공받은 자\n8. 제28조의5제1항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 특정 개인을 알아보기 위한 목적으로 가명정보를 처리한 자\n9. 제59조제2호를 위반하여 업무상 알게 된 개인정보를 누설하거나 권한 없이 다른 사람이 이용하도록 제공한 자 및 그 사정을 알면서도 영리 또는 부정한 목적으로 개인정보를 제공받은 자\n10. 제59조제3호를 위반하여 다른 사람의 개인정보를 이용, 훼손, 멸실, 변경, 위조 또는 유출한 자\n제71조(벌칙) 다음 각 호의 어느 하나에 해당하는 자는 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다. <개정 2016.3.29, 2020.2.4, 2023.3.14>","kind":"L"},{"id":"L:72","label":"법 제72조","title":"벌칙","chapter":"제10장 벌칙","deleted":false,"text":"1. 제25조제5항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 고정형 영상정보처리기기의 설치 목적과 다른 목적으로 고정형 영상정보처리기기를 임의로 조작하거나 다른 곳을 비추는 자 또는 녹음기능을 사용한 자\n2. 제59조제1호를 위반하여 거짓이나 그 밖의 부정한 수단이나 방법으로 개인정보를 취득하거나 개인정보 처리에 관한 동의를 받는 행위를 한 자 및 그 사정을 알면서도 영리 또는 부정한 목적으로 개인정보를 제공받은 자\n3. 제60조를 위반하여 직무상 알게 된 비밀을 누설하거나 직무상 목적 외에 이용한 자\n제72조(벌칙) 다음 각 호의 어느 하나에 해당하는 자는 3년 이하의 징역 또는 3천만원 이하의 벌금에 처한다. <개정 2023.3.14>","kind":"L"},{"id":"L:73","label":"법 제73조","title":"벌칙","chapter":"제10장 벌칙","deleted":false,"text":"① 다음 각 호의 어느 하나에 해당하는 자는 2년 이하의 징역 또는 2천만원 이하의 벌금에 처한다.\n1. 제36조제2항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 정정ㆍ삭제 등 필요한 조치를 하지 아니하고 개인정보를 계속 이용하거나 이를 제3자에게 제공한 자\n2. 제37조제2항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 개인정보의 처리를 정지하지 아니하고 개인정보를 계속 이용하거나 제3자에게 제공한 자\n3. 국내외에서 정당한 이유 없이 제39조의4에 따른 비밀유지명령을 위반한 자\n4. 제63조제1항(제26조제8항에 따라 준용되는 경우를 포함한다)에 따른 자료제출 요구에 대하여 법 위반사항을 은폐 또는 축소할 목적으로 자료제출을 거부하거나 거짓의 자료를 제출한 자\n5. 제63조제2항(제26조제8항에 따라 준용되는 경우를 포함한다)에 따른 출입ㆍ검사 시 자료의 은닉ㆍ폐기, 접근 거부 또는 위조ㆍ변조 등을 통하여 조사를 거부ㆍ방해 또는 기피한 자\n② 제1항제3호의 죄는 비밀유지명령을 신청한 자의 고소가 없으면 공소를 제기할 수 없다.\n제73조(벌칙)","kind":"L"},{"id":"L:74","label":"법 제74조","title":"양벌규정","chapter":"제10장 벌칙","deleted":false,"text":"① 법인의 대표자나 법인 또는 개인의 대리인, 사용인, 그 밖의 종업원이 그 법인 또는 개인의 업무에 관하여 제70조에 해당하는 위반행위를 하면 그 행위자를 벌하는 외에 그 법인 또는 개인을 7천만원 이하의 벌금에 처한다. 다만, 법인 또는 개인이 그 위반행위를 방지하기 위하여 해당 업무에 관하여 상당한 주의와 감독을 게을리하지 아니한 경우에는 그러하지 아니하다.\n② 법인의 대표자나 법인 또는 개인의 대리인, 사용인, 그 밖의 종업원이 그 법인 또는 개인의 업무에 관하여 제71조부터 제73조까지의 어느 하나에 해당하는 위반행위를 하면 그 행위자를 벌하는 외에 그 법인 또는 개인에게도 해당 조문의 벌금형을 과(科)한다. 다만, 법인 또는 개인이 그 위반행위를 방지하기 위하여 해당 업무에 관하여 상당한 주의와 감독을 게을리하지 아니한 경우에는 그러하지 아니하다.\n제74조(양벌규정)","kind":"L"},{"id":"L:74-2","label":"법 제74조의2","title":"몰수ㆍ추징 등","chapter":"제10장 벌칙","deleted":false,"text":"제74조의2(몰수ㆍ추징 등) 제70조부터 제73조까지의 어느 하나에 해당하는 죄를 지은 자가 해당 위반행위와 관련하여 취득한 금품이나 그 밖의 이익은 몰수할 수 있으며, 이를 몰수할 수 없을 때에는 그 가액을 추징할 수 있다. 이 경우 몰수 또는 추징은 다른 벌칙에 부가하여 과할 수 있다.","kind":"L"},{"id":"L:75","label":"법 제75조","title":"과태료","chapter":"제10장 벌칙","deleted":false,"text":"① 다음 각 호의 어느 하나에 해당하는 자에게는 5천만원 이하의 과태료를 부과한다.\n1. 제25조제2항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 고정형 영상정보처리기기를 설치ㆍ운영한 자\n2. 제25조의2제2항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 이동형 영상정보처리기기로 사람 또는 그 사람과 관련된 사물의 영상을 촬영한 자\n② 다음 각 호의 어느 하나에 해당하는 자에게는 3천만원 이하의 과태료를 부과한다. <개정 2026.3.10>\n1. 제16조제3항ㆍ제22조제5항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 재화 또는 서비스의 제공을 거부한 자\n2. 제20조제1항ㆍ제2항을 위반하여 정보주체에게 같은 조 제1항 각 호의 사실을 알리지 아니한 자\n3. 제20조의2제1항을 위반하여 개인정보의 이용ㆍ제공 내역이나 이용ㆍ제공 내역을 확인할 수 있는 정보시스템에 접속하는 방법을 통지하지 아니한 자\n4. 제21조제1항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 개인정보의 파기 등 필요한 조치를 하지 아니한 자\n5. 제23조제2항ㆍ제24조제3항ㆍ제25조제6항(제25조의2제4항에 따라 준용되는 경우를 포함한다)ㆍ제28조의4제1항ㆍ제29조(제26조제8항에 따라 준용되는 경우를 포함한다)를 위반하여 안전성 확보에 필요한 조치를 하지 아니한 자\n6. 제23조제3항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 민감정보의 공개 가능성 및 비공개를 선택하는 방법을 알리지 아니한 자\n7. 제24조의2제1항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 주민등록번호를 처리한 자\n8. 제24조의2제2항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 암호화 조치를 하지 아니한 자\n9. 제24조의2제3항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 정보주체가 주민등록번호를 사용하지 아니할 수 있는 방법을 제공하지 아니한 자\n10. 제25조제1항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 고정형 영상정보처리기기를 설치ㆍ운영한 자\n11. 제25조의2제1항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 사람 또는 그 사람과 관련된 사물의 영상을 촬영한 자\n12. 제26조제3항을 위반하여 정보주체에게 알려야 할 사항을 알리지 아니한 자\n13. 제28조의5제2항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 개인을 알아볼 수 있는 정보가 생성되었음에도 이용을 중지하지 아니하거나 이를 회수ㆍ파기하지 아니한 자\n14. 제28조의8제4항(제26조제8항 및 제28조의11에 따라 준용되는 경우를 포함한다)을 위반하여 보호조치를 하지 아니한 자\n14의2. 제31조제1항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 개인정보 보호책임자를 지정하지 아니하거나 제31조제10항(제26조제8항에 따라 준용되는 경우를 포함한다)에 따른 개인정보 보호책임자의 자격요건을 갖추지 아니한 자를 개인정보 보호책임자로 지정한 자\n14의3. 제31조제3항제1호(제26조제8항에 따라 준용되는 경우를 포함한다)를 위반하여 개인정보 보호책임자를 지정하거나 그 지정을 변경 또는 해제할 때에 이사회의 의결을 거치지 아니한 자\n14의4. 제31조제3항제2호(제26조제8항에 따라 준용되는 경우를 포함한다)를 위반하여 개인정보 보호책임자의 지정ㆍ변경 또는 해제에 관한 사항을 신고하지 아니한 자\n15. 제32조의2제1항 단서를 위반하여 인증을 받지 아니한 자\n15의2. 제32조의2제6항을 위반하여 인증을 받지 아니하였음에도 거짓으로 인증의 내용을 표시하거나 홍보한 자\n16. 제33조제1항을 위반하여 영향평가를 하지 아니하거나 그 결과를 보호위원회에 제출하지 아니한 자\n17. 제34조제1항 또는 같은 조 제2항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 정보주체에게 제34조제1항 각 호의 사항 또는 같은 조 제2항의 피해를 최소화하기 위한 정보 등의 사항을 알리지 아니한 자\n18. 제34조제4항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 보호위원회 또는 대통령령으로 정하는 전문기관에 신고하지 아니한 자\n19. 제35조제3항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 열람을 제한하거나 거절한 자\n20. 제35조의3제1항에 따른 지정을 받지 아니하고 같은 항 제2호의 업무를 수행한 자\n21. 제35조의3제3항을 위반한 자\n22. 제36조제2항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 정정ㆍ삭제 등 필요한 조치를 하지 아니한 자\n23. 제37조제3항 또는 제5항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 파기 등 필요한 조치를 하지 아니한 자\n24. 제37조의2제3항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 정당한 사유 없이 정보주체의 요구에 따르지 아니한 자\n25. 제63조제1항(제26조제8항에 따라 준용되는 경우를 포함한다)에 따른 관계 물품ㆍ서류 등 자료를 제출하지 아니하거나 거짓으로 제출한 자\n26. 제63조제2항(제26조제8항에 따라 준용되는 경우를 포함한다)에 따른 출입ㆍ검사를 거부ㆍ방해 또는 기피한 자\n27. 제64조제1항에 따른 시정조치 명령에 따르지 아니한 자\n③ 다음 각 호의 어느 하나에 해당하는 자에게는 2천만원 이하의 과태료를 부과한다. <개정 2025.4.1>\n1. 제26조제6항을 위반하여 위탁자의 동의를 받지 아니하고 제3자에게 다시 위탁한 자\n2. 제31조의2제1항을 위반하여 국내대리인을 지정하지 아니한 자\n3. 제31조의2제2항을 위반하여 국내대리인을 지정한 자\n4. 제31조의2제3항을 위반하여 국내대리인을 관리ㆍ감독하지 아니한 자\n④ 다음 각 호의 어느 하나에 해당하는 자에게는 1천만원 이하의 과태료를 부과한다. <개정 2025.4.1>\n1. 제11조의2제2항을 위반하여 정당한 사유 없이 자료를 제출하지 아니하거나 거짓으로 제출한 자\n2. 제21조제3항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 개인정보를 분리하여 저장ㆍ관리하지 아니한 자\n3. 제22조제1항부터 제3항까지(제26조제8항에 따라 준용되는 경우를 포함한다)를 위반하여 동의를 받은 자\n4. 제26조제1항을 위반하여 업무 위탁 시 같은 항 각 호의 내용이 포함된 문서로 하지 아니한 자\n5. 제26조제2항을 위반하여 위탁하는 업무의 내용과 수탁자를 공개하지 아니한 자\n6. 제27조제1항ㆍ제2항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 정보주체에게 개인정보의 이전 사실을 알리지 아니한 자\n7. 제28조의4제3항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 관련 기록을 작성하여 보관하지 아니한 자\n8. 제30조제1항 또는 제2항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 개인정보 처리방침을 정하지 아니하거나 이를 공개하지 아니한 자\n9. 삭제<2026.3.10>\n9의2. 제31조의2제4항을 위반하여 국내대리인의 성명ㆍ주소ㆍ전화번호 및 전자우편 주소를 개인정보 처리방침에 포함하지 아니한 자\n10. 제35조제3항ㆍ제4항, 제36조제2항ㆍ제4항 또는 제37조제4항(제26조제8항에 따라 준용되는 경우를 포함한다)을 위반하여 정보주체에게 알려야 할 사항을 알리지 아니한 자\n11. 제45조제1항에 따른 자료를 정당한 사유 없이 제출하지 아니하거나 거짓으로 제출한 자\n12. 제45조제2항에 따른 출입ㆍ조사ㆍ열람을 정당한 사유 없이 거부ㆍ방해 또는 기피한 자\n⑤ 제1항부터 제4항까지에 따른 과태료는 대통령령으로 정하는 바에 따라 보호위원회가 부과ㆍ징수한다. 이 경우 보호위원회는 위반행위의 정도ㆍ동기ㆍ결과, 개인정보처리자의 규모 등을 고려하여 과태료를 감경하거나 면제할 수 있다.\n제75조(과태료)","kind":"L"},{"id":"L:76","label":"법 제76조","title":"과태료에 관한 규정 적용의 특례","chapter":"제10장 벌칙","deleted":false,"text":"제76조(과태료에 관한 규정 적용의 특례) 제75조의 과태료에 관한 규정을 적용할 때 제64조의2에 따라 과징금을 부과한 행위에 대하여는 과태료를 부과할 수 없다. <개정 2023.3.14>","kind":"L"},{"id":"D:1","label":"영 제1조","title":"목적","chapter":"제1장 총칙","deleted":false,"text":"제1조(목적) 이 영은 「개인정보 보호법」에서 위임된 사항과 그 시행에 필요한 사항을 규정함을 목적으로 한다.","kind":"D"},{"id":"D:2","label":"영 제2조","title":"공공기관의 범위","chapter":"제1장 총칙","deleted":false,"text":"1. 「국가인권위원회법」 제3조에 따른 국가인권위원회\n1의2. 「고위공직자범죄수사처 설치 및 운영에 관한 법률」 제3조제1항에 따른 고위공직자범죄수사처\n2. 「공공기관의 운영에 관한 법률」 제4조에 따른 공공기관\n3. 「지방공기업법」에 따른 지방공사와 지방공단\n3의2. 「지방자치단체 출자ㆍ출연 기관의 운영에 관한 법률」 제5조에 따라 지정ㆍ고시된 출자기관 또는 출연기관\n4. 특별법에 따라 설립된 특수법인\n5. 「초ㆍ중등교육법」, 「고등교육법」, 그 밖의 다른 법률에 따라 설치된 각급 학교\n제2조(공공기관의 범위) 「개인정보 보호법」(이하 \"법\"이라 한다) 제2조제6호나목에서 \"대통령령으로 정하는 기관\"이란 다음 각 호의 기관을 말한다. <개정 2020.7.14, 2025.9.23>","kind":"D"},{"id":"D:3","label":"영 제3조","title":"영상정보처리기기의 범위","chapter":"제1장 총칙","deleted":false,"text":"① 법 제2조제7호에서 \"대통령령으로 정하는 장치\"란 다음 각 호의 장치를 말한다. <개정 2023.9.12>\n1. 폐쇄회로 텔레비전: 다음 각 목의 어느 하나에 해당하는 장치\n가. 일정한 공간에 설치된 카메라를 통하여 지속적 또는 주기적으로 영상 등을 촬영하거나 촬영한 영상정보를 유무선 폐쇄회로 등의 전송로를 통하여 특정 장소에 전송하는 장치\n나. 가목에 따라 촬영되거나 전송된 영상정보를 녹화ㆍ기록할 수 있도록 하는 장치\n2. 네트워크 카메라: 일정한 공간에 설치된 기기를 통하여 지속적 또는 주기적으로 촬영한 영상정보를 그 기기를 설치ㆍ관리하는 자가 유무선 인터넷을 통하여 어느 곳에서나 수집ㆍ저장 등의 처리를 할 수 있도록 하는 장치\n② 법 제2조제7호의2에서 \"대통령령으로 정하는 장치\"란 다음 각 호의 장치를 말한다. <신설 2023.9.12>\n1. 착용형 장치: 안경 또는 시계 등 사람의 신체 또는 의복에 착용하여 영상 등을 촬영하거나 촬영한 영상정보를 수집ㆍ저장 또는 전송하는 장치\n2. 휴대형 장치: 이동통신단말장치 또는 디지털 카메라 등 사람이 휴대하면서 영상 등을 촬영하거나 촬영한 영상정보를 수집ㆍ저장 또는 전송하는 장치\n3. 부착ㆍ거치형 장치: 차량이나 드론 등 이동 가능한 물체에 부착 또는 거치(据置)하여 영상 등을 촬영하거나 촬영한 영상정보를 수집ㆍ저장 또는 전송하는 장치\n제3조(영상정보처리기기의 범위)","kind":"D"},{"id":"D:4","label":"영 제4조","title":"","chapter":"제2장 개인정보 보호위원회","deleted":true,"text":"제4조 삭제 <2020.8.4>","kind":"D"},{"id":"D:4-2","label":"영 제4조의2","title":"영리업무의 금지","chapter":"제2장 개인정보 보호위원회","deleted":false,"text":"1. 법 제7조의9제1항에 따라 보호위원회가 심의ㆍ의결하는 사항과 관련된 업무\n2. 법 제40조제1항에 따른 개인정보 분쟁조정위원회(이하 \"분쟁조정위원회\"라 한다)가 조정하는 사항과 관련된 업무\n제4조의2(영리업무의 금지) 법 제7조제1항에 따른 개인정보 보호위원회(이하 \"보호위원회\"라 한다)의 위원은 법 제7조의6제1항에 따라 영리를 목적으로 다음 각 호의 어느 하나에 해당하는 업무에 종사해서는 안 된다.","kind":"D"},{"id":"D:5","label":"영 제5조","title":"전문위원회","chapter":"제2장 개인정보 보호위원회","deleted":false,"text":"① 보호위원회는 법 제7조의9제1항에 따른 심의ㆍ의결 사항에 대하여 사전에 전문적으로 검토하기 위하여 보호위원회에 다음 각 호의 분야별 전문위원회(이하 \"전문위원회\"라 한다)를 둔다. <개정 2020.8.4, 2023.9.12>\n1. 개인정보의 국외 이전 분야\n2. 그 밖에 보호위원회가 필요하다고 인정하는 분야\n② 제1항에 따라 전문위원회를 두는 경우 각 전문위원회는 위원장 1명을 포함한 20명 이내의 위원으로 성별을 고려하여 구성하되, 전문위원회 위원은 다음 각 호의 사람 중에서 보호위원회 위원장이 임명하거나 위촉하고, 전문위원회 위원장은 보호위원회 위원장이 전문위원회 위원 중에서 지명한다. <개정 2016.7.22, 2020.8.4, 2023.9.12>\n1. 보호위원회 위원\n2. 개인정보 보호 관련 업무를 담당하는 중앙행정기관의 관계 공무원\n3. 개인정보 보호에 관한 전문지식과 경험이 풍부한 사람\n4. 개인정보 보호와 관련된 단체 또는 사업자단체에 속하거나 그 단체의 추천을 받은 사람\n③ 제1항 및 제2항에서 규정한 사항 외에 전문위원회의 구성 및 운영 등에 필요한 사항은 보호위원회의 의결을 거쳐 보호위원회 위원장이 정한다. <신설 2023.9.12>\n제5조(전문위원회)","kind":"D"},{"id":"D:5-2","label":"영 제5조의2","title":"개인정보 보호 정책협의회","chapter":"제2장 개인정보 보호위원회","deleted":false,"text":"① 개인정보 보호 정책의 일관성 있는 추진과 개인정보 보호 관련 사안에 대한 관계 중앙행정기관 간 협의를 위하여 보호위원회에 개인정보 보호 정책협의회(이하 \"정책협의회\"라 한다)를 둘 수 있다.\n② 정책협의회는 다음 각 호의 사항을 협의한다.\n1. 법 제9조에 따른 개인정보 보호 기본계획 및 법 제10조에 따른 시행계획 등 개인정보 보호와 관련된 주요 정책\n2. 개인정보 보호와 관련된 주요 법령의 제ㆍ개정\n3. 개인정보 보호와 관련된 주요 정책의 협력 및 의견조정\n4. 개인정보 침해사고 예방 및 대응\n5. 개인정보 보호 기술개발 및 전문인력의 양성\n6. 그 밖에 개인정보 보호와 관련하여 관계 중앙행정기관 간 협의가 필요한 사항\n③ 정책협의회는 관계 중앙행정기관의 고위공무원단에 속하는 공무원 또는 그에 상당하는 공무원으로서 개인정보 보호와 관련된 업무를 담당하는 사람 중 소속 기관의 장이 지명하는 사람으로 구성하되, 정책협의회의 의장(이하 이 조에서 \"의장\"이라 한다)은 보호위원회의 부위원장으로 한다.\n④ 정책협의회는 업무를 수행하기 위하여 필요한 경우에는 실무협의회 또는 분야별 협의회를 둘 수 있다.\n⑤ 실무협의회 및 분야별 협의회의 의장은 보호위원회 소속 공무원 중에서 의장이 임명한다.\n⑥ 정책협의회, 실무협의회 및 분야별 협의회는 업무를 수행하기 위하여 필요한 경우에는 관계 기관ㆍ단체 및 전문가 등에게 출석, 자료 또는 의견의 제출 등 필요한 협조를 요청할 수 있다.\n⑦ 제1항부터 제6항까지에서 규정한 사항 외에 정책협의회의 운영 등에 필요한 사항은 정책협의회의 의결을 거쳐 의장이 정한다.\n제5조의2(개인정보 보호 정책협의회)","kind":"D"},{"id":"D:5-3","label":"영 제5조의3","title":"시ㆍ도 개인정보 보호 관계 기관 협의회","chapter":"제2장 개인정보 보호위원회","deleted":false,"text":"① 개인정보 보호 정책의 효율적인 추진과 자율적인 개인정보 보호 강화를 위하여 특별시, 통합특별시, 광역시, 특별자치시, 도 및 특별자치도(이하 \"시ㆍ도\"라 한다)에 시ㆍ도 개인정보 보호 관계 기관 협의회(이하 \"시ㆍ도협의회\"라 한다)를 둘 수 있다. <개정 2026.9.10>\n② 시ㆍ도협의회는 다음 각 호의 사항을 협의한다.\n1. 시ㆍ도 개인정보 보호 정책\n2. 관계 기관ㆍ단체 등의 의견 수렴 및 전달\n3. 개인정보 보호 우수사례 공유\n4. 그 밖에 개인정보 보호와 관련하여 시ㆍ도협의회의 협의가 필요한 사항\n③ 제1항 및 제2항에서 규정한 사항 외에 시ㆍ도협의회의 구성 및 운영 등에 필요한 사항은 시ㆍ도의 조례로 정한다.\n제5조의3(시ㆍ도 개인정보 보호 관계 기관 협의회)","kind":"D"},{"id":"D:6","label":"영 제6조","title":"의사의 공개","chapter":"제2장 개인정보 보호위원회","deleted":false,"text":"제6조(의사의 공개) 보호위원회의 의사(議事)는 공개한다. 다만, 보호위원회 위원장이 필요하다고 인정하는 경우에는 공개하지 아니할 수 있다.","kind":"D"},{"id":"D:7","label":"영 제7조","title":"공무원 등의 파견","chapter":"제2장 개인정보 보호위원회","deleted":false,"text":"제7조(공무원 등의 파견) 보호위원회는 그 업무 수행을 위하여 필요하다고 인정하는 경우에는 공공기관에 그 소속 공무원 또는 임직원의 파견을 요청할 수 있다.","kind":"D"},{"id":"D:8","label":"영 제8조","title":"","chapter":"제2장 개인정보 보호위원회","deleted":true,"text":"제8조 삭제 <2020.8.4>","kind":"D"},{"id":"D:9","label":"영 제9조","title":"출석수당 등","chapter":"제2장 개인정보 보호위원회","deleted":false,"text":"제9조(출석수당 등) 보호위원회, 전문위원회 또는 정책협의회에 출석한 위원, 법 제7조의9제2항에 따라 보호위원회에 출석한 사람, 전문위원회에 출석한 사람 또는 정책협의회에 출석한 사람에게는 예산의 범위에서 수당ㆍ여비, 그 밖에 필요한 경비를 지급할 수 있다. 다만, 공무원이 그 소관 업무와 직접 관련되어 출석하는 경우에는 그렇지 않다. <개정 2020.8.4>","kind":"D"},{"id":"D:9-2","label":"영 제9조의2","title":"정책ㆍ제도ㆍ법령 개선 권고의 절차 등","chapter":"제2장 개인정보 보호위원회","deleted":false,"text":"① 보호위원회는 법 제7조의9제4항에 따라 관계 기관에 정책ㆍ제도 및 법령의 개선을 권고하는 경우에는 그 내용과 사유 등을 함께 통보해야 한다. <개정 2020.8.4>\n② 보호위원회는 법 제7조의9제5항에 따른 권고내용의 이행여부를 점검하기 위하여 관계 기관에 권고사항의 이행결과에 대한 자료 제출을 요청할 수 있다. <개정 2020.8.4>\n제9조의2(정책ㆍ제도ㆍ법령 개선 권고의 절차 등)","kind":"D"},{"id":"D:9-3","label":"영 제9조의3","title":"개인정보 침해요인 평가 절차 등","chapter":"제2장 개인정보 보호위원회","deleted":false,"text":"① 중앙행정기관의 장은 법 제8조의2제1항에 따라 개인정보 침해요인 평가(이하 \"침해요인 평가\"라 한다)를 요청하는 경우 다음 각 호의 사항을 포함하는 개인정보 침해요인 평가 요청서(전자문서를 포함한다)를 보호위원회에 제출하여야 한다.\n1. 법령(법령안을 포함한다)을 통하여 도입되거나 변경되는 개인정보 처리를 수반하는 정책ㆍ제도의 목적과 주요 내용\n2. 개인정보 처리를 수반하는 정책ㆍ제도의 도입ㆍ변경에 따른 제2항 각 호의 사항에 대한 개인정보 침해요인 자체 분석\n3. 개인정보 처리를 수반하는 정책ㆍ제도의 도입ㆍ변경에 따른 개인정보 보호 대책\n② 보호위원회는 제1항에 따른 요청서를 받은 경우에는 다음 각 호의 사항을 고려하여 침해요인 평가를 하고, 그 결과를 해당 중앙행정기관의 장에게 통보하여야 한다.\n1. 개인정보 처리의 필요성\n2. 개인정보 주체의 권리보장의 적정성\n3. 개인정보 관리의 안전성\n4. 그 밖에 침해요인 평가에 필요한 사항\n③ 중앙행정기관의 장은 법 제8조의2제2항에 따른 권고를 받은 경우에는 그 내용을 해당 법령안에 반영하는 등 권고내용을 이행하도록 노력하여야 한다. 다만, 보호위원회의 권고대로 이행하기 곤란한 경우에는 그 사유를 보호위원회에 통보하여야 한다.\n④ 보호위원회는 침해요인 평가를 하는 경우에는 침해요인 평가에 필요한 자료 등을 해당 중앙행정기관의 장에게 요청할 수 있다.\n⑤ 보호위원회는 침해요인 평가의 세부기준 및 방법 등 침해요인 평가에 필요한 지침을 수립하여 중앙행정기관의 장에게 통보할 수 있다.\n⑥ 보호위원회는 침해요인 평가를 실시하기 위하여 필요하면 관계 전문가에게 자문 등을 할 수 있다.\n제9조의3(개인정보 침해요인 평가 절차 등)","kind":"D"},{"id":"D:10","label":"영 제10조","title":"","chapter":"제2장 개인정보 보호위원회","deleted":true,"text":"제10조 삭제 <2020.8.4>","kind":"D"},{"id":"D:11","label":"영 제11조","title":"기본계획의 수립절차 등","chapter":"제3장 기본계획 및 시행계획의 수립절차","deleted":false,"text":"① 보호위원회는 3년마다 법 제9조에 따른 개인정보 보호 기본계획(이하 \"기본계획\"이라 한다)을 그 3년이 시작되는 해의 전년도 6월 30일까지 수립해야 한다. <개정 2013.3.23, 2014.11.19, 2016.7.22, 2020.8.4>\n② 보호위원회는 제1항에 따라 기본계획을 작성하는 경우에는 관계 중앙행정기관의 장으로부터 개인정보 보호 관련 중장기 계획과 시책 등을 반영한 부문별 계획을 제출받아 기본계획에 반영할 수 있다. 이 경우 보호위원회는 기본계획의 목표, 추진방향 및 부문별 계획의 작성 지침 등에 관하여 관계 중앙행정기관의 장과 협의하여야 한다. <개정 2013.3.23, 2014.11.19, 2016.7.22>\n③ 보호위원회는 기본계획이 확정되면 지체 없이 관계 중앙행정기관의 장에게 통보하여야 한다. <개정 2013.3.23, 2014.11.19, 2016.7.22>\n제11조(기본계획의 수립절차 등)","kind":"D"},{"id":"D:12","label":"영 제12조","title":"시행계획의 수립절차 등","chapter":"제3장 기본계획 및 시행계획의 수립절차","deleted":false,"text":"① 보호위원회는 매년 6월 30일까지 다음 해 시행계획의 작성방법 등에 관한 지침을 마련하여 관계 중앙행정기관의 장에게 통보해야 한다. <개정 2013.3.23, 2014.11.19, 2016.7.22, 2020.8.4>\n② 관계 중앙행정기관의 장은 제1항의 지침에 따라 기본계획 중 다음 해에 시행할 소관 분야의 시행계획을 작성하여 매년 9월 30일까지 보호위원회에 제출해야 한다. <개정 2020.8.4>\n③ 보호위원회는 제2항에 따라 제출된 시행계획을 그 해 12월 31일까지 심의ㆍ의결해야 한다. <개정 2020.8.4>\n제12조(시행계획의 수립절차 등)","kind":"D"},{"id":"D:13","label":"영 제13조","title":"자료제출 요구 등의 범위와 방법","chapter":"제3장 기본계획 및 시행계획의 수립절차","deleted":false,"text":"① 보호위원회는 법 제11조제1항에 따라 개인정보처리자에게 다음 각 호의 사항에 관한 자료의 제출이나 의견의 진술 등을 요구할 수 있다. <개정 2013.3.23, 2014.11.19, 2016.7.22, 2023.9.12>\n1. 해당 개인정보처리자가 처리하는 개인정보 및 개인정보파일의 관리와 고정형 영상정보처리기기 또는 이동형 영상정보처리기기의 설치ㆍ운영에 관한 사항\n2. 법 제31조에 따른 개인정보 보호책임자의 지정 여부에 관한 사항\n3. 개인정보의 안전성 확보를 위한 기술적ㆍ관리적ㆍ물리적 조치에 관한 사항\n4. 정보주체의 열람, 개인정보의 정정ㆍ삭제ㆍ처리정지의 요구 및 조치 현황에 관한 사항\n5. 그 밖에 법 및 이 영의 준수에 관한 사항 등 기본계획의 수립ㆍ추진을 위하여 필요한 사항\n② 보호위원회는 제1항에 따라 자료의 제출이나 의견의 진술 등을 요구할 때에는 기본계획을 효율적으로 수립ㆍ추진하기 위하여 필요한 최소한의 범위로 한정하여 요구하여야 한다. <개정 2013.3.23, 2014.11.19, 2016.7.22>\n③ 법 제11조제3항에 따라 중앙행정기관의 장이 소관 분야의 개인정보처리자에게 자료의 제출 등을 요구하는 경우에는 제1항과 제2항을 준용한다. 이 경우 \"보호위원회\"는 \"중앙행정기관의 장\"으로, \"법 제11조제1항\"은 \"법 제11조제3항\"으로 본다. <개정 2013.3.23, 2014.11.19, 2016.7.22>\n제13조(자료제출 요구 등의 범위와 방법)","kind":"D"},{"id":"D:13-2","label":"영 제13조의2","title":"개인정보 보호수준 평가의 대상ㆍ기준ㆍ방법ㆍ절차 등","chapter":"제3장 기본계획 및 시행계획의 수립절차","deleted":false,"text":"① 법 제11조의2제1항에서 \"대통령령으로 정하는 기관\"이란 다음 각 호의 기관을 말한다. <개정 2025.9.23>\n1. 「공공기관의 운영에 관한 법률」 제4조에 따른 공공기관\n2. 「지방공기업법」에 따른 지방공사와 지방공단\n3. 그 밖에 제2조제3호의2, 제4호 및 제5호에 따른 공공기관 중 공공기관의 개인정보 처리 업무의 특성 등을 고려하여 보호위원회가 고시하는 기준에 해당하는 기관\n② 법 제11조의2제1항에 따른 개인정보 보호수준 평가(이하 \"개인정보 보호수준 평가\"라 한다)의 기준은 다음 각 호와 같다.\n1. 개인정보 보호 정책ㆍ업무 수행실적 및 개선 정도\n2. 개인정보 관리체계의 적정성\n3. 정보주체의 권리보장을 위한 조치사항 및 이행 정도\n4. 개인정보 침해방지 조치사항 및 안전성 확보 조치 이행 정도\n5. 그 밖에 개인정보의 처리 및 안전한 관리를 위해 필요한 조치 사항의 준수 여부\n③ 보호위원회는 개인정보 보호수준 평가를 시행하기 전에 평가대상, 평가기준ㆍ방법 및 평가지표 등을 포함한 평가계획을 마련하여 개인정보 보호수준 평가 대상 기관(이하 \"평가대상기관\"이라 한다)의 장에게 통보해야 한다.\n④ 보호위원회는 개인정보 보호수준 평가를 효율적으로 실시하기 위해 개인정보 보호에 관한 전문적인 지식과 경험이 풍부한 전문가를 포함하여 평가단을 구성ㆍ운영할 수 있다.\n⑤ 보호위원회는 법 제11조의2제2항에 따라 다음 각 호의 자료를 제출하게 할 수 있다.\n1. 평가대상기관이 개인정보 보호수준을 자체적으로 점검한 경우 그 결과 및 증명자료\n2. 제1호의 증명자료의 검증에 필요한 자료\n3. 그 밖에 개인정보의 안전한 관리 여부 등 개인정보 보호수준을 평가하기 위해 필요한 자료\n⑥ 보호위원회는 제5항에 따라 평가대상기관의 장이 제출한 자료를 기준으로 평가를 진행하거나 평가대상기관을 방문하여 평가할 수 있다.\n⑦ 보호위원회는 중앙행정기관의 장 또는 지방자치단체의 장에게 소속 기관 등 소관 분야 평가대상기관의 평가준비 또는 평가결과에 따른 개인정보 보호 조치를 위해 필요한 사항을 지원하도록 요청할 수 있다. 이 경우 요청을 받은 중앙행정기관의 장 또는 지방자치단체의 장은 요청에 따른 지원을 하기 위해 노력해야 한다.\n⑧ 제1항부터 제7항까지의 규정에 따른 개인정보 보호수준 평가에 관한 세부 사항은 보호위원회가 정하여 고시한다.\n제13조의2(개인정보 보호수준 평가의 대상ㆍ기준ㆍ방법ㆍ절차 등)","kind":"D"},{"id":"D:14","label":"영 제14조","title":"자율규제의 촉진 및 지원","chapter":"제3장 기본계획 및 시행계획의 수립절차","deleted":false,"text":"제14조(자율규제의 촉진 및 지원) 보호위원회는 법 제13조제2호에 따라 개인정보처리자의 자율적인 개인정보 보호활동을 촉진하기 위하여 예산의 범위에서 개인정보 보호와 관련된 기관 또는 단체에 필요한 지원을 할 수 있다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.8.4>","kind":"D"},{"id":"D:14-2","label":"영 제14조의2","title":"개인정보의 추가적인 이용ㆍ제공의 기준 등","chapter":"제4장 개인정보의 처리","deleted":false,"text":"① 개인정보처리자는 법 제15조제3항 또는 제17조제4항에 따라 정보주체의 동의 없이 개인정보를 이용 또는 제공(이하 \"개인정보의 추가적인 이용 또는 제공\"이라 한다)하려는 경우에는 다음 각 호의 사항을 고려해야 한다.\n1. 당초 수집 목적과 관련성이 있는지 여부\n2. 개인정보를 수집한 정황 또는 처리 관행에 비추어 볼 때 개인정보의 추가적인 이용 또는 제공에 대한 예측 가능성이 있는지 여부\n3. 정보주체의 이익을 부당하게 침해하는지 여부\n4. 가명처리 또는 암호화 등 안전성 확보에 필요한 조치를 하였는지 여부\n② 개인정보처리자는 개인정보의 추가적인 이용 또는 제공이 지속적으로 발생하는 경우에는 제1항 각 호의 고려사항에 대한 판단 기준을 법 제30조제1항에 따른 개인정보 처리방침에 공개하고, 법 제31조제1항에 따른 개인정보 보호책임자가 해당 기준에 따라 개인정보의 추가적인 이용 또는 제공을 하고 있는지 여부를 점검해야 한다. <개정 2023.9.12>\n제14조의2(개인정보의 추가적인 이용ㆍ제공의 기준 등)","kind":"D"},{"id":"D:15","label":"영 제15조","title":"개인정보의 목적 외 이용 또는 제3자 제공의 관리","chapter":"제4장 개인정보의 처리","deleted":false,"text":"1. 이용하거나 제공하는 개인정보 또는 개인정보파일의 명칭\n2. 이용기관 또는 제공받는 기관의 명칭\n3. 이용 목적 또는 제공받는 목적\n4. 이용 또는 제공의 법적 근거\n5. 이용하거나 제공하는 개인정보의 항목\n6. 이용 또는 제공의 날짜, 주기 또는 기간\n7. 이용하거나 제공하는 형태\n8. 법 제18조제5항에 따라 제한을 하거나 필요한 조치를 마련할 것을 요청한 경우에는 그 내용\n제15조(개인정보의 목적 외 이용 또는 제3자 제공의 관리) 공공기관은 법 제18조제2항에 따라 개인정보를 목적 외의 용도로 이용하거나 이를 제3자에게 제공하는 경우에는 다음 각 호의 사항을 보호위원회가 정하여 고시하는 개인정보의 목적 외 이용 및 제3자 제공 대장에 기록하고 관리해야 한다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.8.4>","kind":"D"},{"id":"D:15-2","label":"영 제15조의2","title":"개인정보 수집 출처 등 통지 대상ㆍ방법ㆍ절차","chapter":"제4장 개인정보의 처리","deleted":false,"text":"① 법 제20조제2항 본문에서 \"대통령령으로 정하는 기준에 해당하는 개인정보처리자\"란 다음 각 호의 어느 하나에 해당하는 개인정보처리자를 말한다. 이 경우 다음 각 호에 규정된 정보주체의 수는 전년도 말 기준 직전 3개월 간 일일평균을 기준으로 산정한다. <개정 2023.9.12>\n1. 5만명 이상의 정보주체에 관하여 법 제23조에 따른 민감정보(이하 \"민감정보\"라 한다) 또는 법 제24조제1항에 따른 고유식별정보(이하 \"고유식별정보\"라 한다)를 처리하는 자\n2. 100만명 이상의 정보주체에 관하여 개인정보를 처리하는 자\n② 제1항 각 호의 어느 하나에 해당하는 개인정보처리자는 법 제20조제1항 각 호의 사항을 다음 각 호의 어느 하나에 해당하는 방법으로 개인정보를 제공받은 날부터 3개월 이내에 정보주체에게 알려야 한다. 다만, 법 제17조제2항제1호부터 제4호까지의 사항에 대하여 같은 조 제1항제1호에 따라 정보주체의 동의를 받은 범위에서 연 2회 이상 주기적으로 개인정보를 제공받아 처리하는 경우에는 개인정보를 제공받은 날부터 3개월 이내에 정보주체에게 알리거나 그 동의를 받은 날부터 기산하여 연 1회 이상 정보주체에게 알려야 한다. <개정 2023.9.12>\n1. 서면ㆍ전자우편ㆍ전화ㆍ문자전송 등 정보주체가 통지 내용을 쉽게 확인할 수 있는 방법\n2. 재화 및 서비스를 제공하는 과정에서 정보주체가 쉽게 알 수 있도록 알림창을 통해 알리는 방법\n③ 개인정보처리자는 다음 각 호의 통지를 함께 할 수 있다. <개정 2025.2.25, 2026.2.19>\n1. 법 제20조제2항에 따른 개인정보의 수집 출처 등 통지\n2. 법 제20조의2제1항에 따른 개인정보 이용ㆍ제공 내역의 통지\n3. 제42조의6제12항 본문에 따른 전송요구대상정보 전송 내역의 통지\n④ 제1항 각 호의 어느 하나에 해당하는 개인정보처리자는 제2항에 따라 알린 경우 다음 각 호의 사항을 법 제21조 또는 제37조제5항에 따라 해당 개인정보를 파기할 때까지 보관ㆍ관리하여야 한다. <개정 2023.9.12>\n1. 정보주체에게 알린 사실\n2. 알린 시기\n3. 알린 방법\n제15조의2(개인정보 수집 출처 등 통지 대상ㆍ방법ㆍ절차)","kind":"D"},{"id":"D:15-3","label":"영 제15조의3","title":"개인정보 이용ㆍ제공 내역의 통지","chapter":"제4장 개인정보의 처리","deleted":false,"text":"① 법 제20조의2제1항 본문에서 \"대통령령으로 정하는 기준에 해당하는 개인정보처리자\"란 다음 각 호의 어느 하나에 해당하는 개인정보처리자를 말한다. 이 경우 다음 각 호에 규정된 정보주체의 수는 전년도 말 기준 직전 3개월 간 일일평균을 기준으로 산정한다.\n1. 5만명 이상의 정보주체에 관하여 민감정보 또는 고유식별정보를 처리하는 자\n2. 100만명 이상의 정보주체에 관하여 개인정보를 처리하는 자\n② 법 제20조의2제1항에 따른 통지의 대상이 되는 정보주체는 다음 각 호의 정보주체를 제외한 정보주체로 한다.\n1. 통지에 대한 거부의사를 표시한 정보주체\n2. 개인정보처리자가 업무수행을 위해 그에 소속된 임직원의 개인정보를 처리한 경우 해당 정보주체\n3. 개인정보처리자가 업무수행을 위해 다른 공공기관, 법인, 단체의 임직원 또는 개인의 연락처 등의 개인정보를 처리한 경우 해당 정보주체\n4. 법률에 특별한 규정이 있거나 법령 상 의무를 준수하기 위하여 이용ㆍ제공한 개인정보의 정보주체\n5. 공공기관이 법령 등에서 정하는 소관 업무의 수행을 위하여 이용ㆍ제공한 개인정보의 정보주체\n③ 법 제20조의2제1항에 따라 정보주체에게 통지해야 하는 정보는 다음 각 호와 같다.\n1. 개인정보의 수집ㆍ이용 목적 및 수집한 개인정보의 항목\n2. 개인정보를 제공받은 제3자와 그 제공 목적 및 제공한 개인정보의 항목. 다만, 「통신비밀보호법」 제13조, 제13조의2, 제13조의4 및 「전기통신사업법」 제83조제3항에 따라 제공한 정보는 제외한다.\n④ 법 제20조의2제1항에 따른 통지는 다음 각 호의 어느 하나에 해당하는 방법으로 연 1회 이상 해야 한다.\n1. 서면ㆍ전자우편ㆍ전화ㆍ문자전송 등 정보주체가 통지 내용을 쉽게 확인할 수 있는 방법\n2. 재화 및 서비스를 제공하는 과정에서 정보주체가 쉽게 알 수 있도록 알림창을 통해 알리는 방법(법 제20조의2제1항에 따른 개인정보의 이용ㆍ제공 내역을 확인할 수 있는 정보시스템에 접속하는 방법을 통지하는 경우로 한정한다)\n제15조의3(개인정보 이용ㆍ제공 내역의 통지)","kind":"D"},{"id":"D:16","label":"영 제16조","title":"개인정보의 파기방법","chapter":"제4장 개인정보의 처리","deleted":false,"text":"①개인정보처리자는 법 제21조에 따라 개인정보를 파기할 때에는 다음 각 호의 구분에 따른 방법으로 해야 한다. <개정 2014.8.6, 2022.7.19>\n1. 전자적 파일 형태인 경우: 복원이 불가능한 방법으로 영구 삭제. 다만, 기술적 특성으로 영구 삭제가 현저히 곤란한 경우에는 법 제58조의2에 해당하는 정보로 처리하여 복원이 불가능하도록 조치해야 한다.\n2. 제1호 외의 기록물, 인쇄물, 서면, 그 밖의 기록매체인 경우: 파쇄 또는 소각\n② 제1항에 따른 개인정보의 안전한 파기에 관한 세부 사항은 보호위원회가 정하여 고시한다. <신설 2014.8.6, 2014.11.19, 2017.7.26, 2020.8.4>\n제16조(개인정보의 파기방법)","kind":"D"},{"id":"D:17","label":"영 제17조","title":"동의를 받는 방법","chapter":"제4장 개인정보의 처리","deleted":false,"text":"① 개인정보처리자는 법 제22조에 따라 개인정보의 처리에 대하여 정보주체의 동의를 받을 때에는 다음 각 호의 조건을 모두 충족해야 한다. <신설 2023.9.12>\n1. 정보주체가 자유로운 의사에 따라 동의 여부를 결정할 수 있을 것\n2. 동의를 받으려는 내용이 구체적이고 명확할 것\n3. 그 내용을 쉽게 읽고 이해할 수 있는 문구를 사용할 것\n4. 동의 여부를 명확하게 표시할 수 있는 방법을 정보주체에게 제공할 것\n② 개인정보처리자는 법 제22조에 따라 개인정보의 처리에 대하여 다음 각 호의 어느 하나에 해당하는 방법으로 정보주체의 동의를 받아야 한다. <개정 2023.9.12>\n1. 동의 내용이 적힌 서면을 정보주체에게 직접 발급하거나 우편 또는 팩스 등의 방법으로 전달하고, 정보주체가 서명하거나 날인한 동의서를 받는 방법\n2. 전화를 통하여 동의 내용을 정보주체에게 알리고 동의의 의사표시를 확인하는 방법\n3. 전화를 통하여 동의 내용을 정보주체에게 알리고 정보주체에게 인터넷주소 등을 통하여 동의 사항을 확인하도록 한 후 다시 전화를 통하여 그 동의 사항에 대한 동의의 의사표시를 확인하는 방법\n4. 인터넷 홈페이지 등에 동의 내용을 게재하고 정보주체가 동의 여부를 표시하도록 하는 방법\n5. 동의 내용이 적힌 전자우편을 발송하여 정보주체로부터 동의의 의사표시가 적힌 전자우편을 받는 방법\n6. 그 밖에 제1호부터 제5호까지의 규정에 따른 방법에 준하는 방법으로 동의 내용을 알리고 동의의 의사표시를 확인하는 방법\n③ 법 제22조제2항에서 \"대통령령으로 정하는 중요한 내용\"이란 다음 각 호의 사항을 말한다. <신설 2017.10.17, 2023.9.12>\n1. 개인정보의 수집ㆍ이용 목적 중 재화나 서비스의 홍보 또는 판매 권유 등을 위하여 해당 개인정보를 이용하여 정보주체에게 연락할 수 있다는 사실\n2. 처리하려는 개인정보의 항목 중 다음 각 목의 사항\n가. 민감정보\n나. 제19조제2호부터 제4호까지의 규정에 따른 여권번호, 운전면허의 면허번호 및 외국인등록번호\n3. 개인정보의 보유 및 이용 기간(제공 시에는 제공받는 자의 보유 및 이용 기간을 말한다)\n4. 개인정보를 제공받는 자 및 개인정보를 제공받는 자의 개인정보 이용 목적\n④ 개인정보처리자는 정보주체로부터 법 제22조제1항 각 호에 따른 동의를 받으려는 때에는 정보주체가 동의 여부를 선택할 수 있다는 사실을 명확하게 알 수 있도록 표시해야 한다. <개정 2023.9.12>\n⑤ 법 제22조제3항 전단에서 \"대통령령으로 정하는 방법\"이란 서면, 전자우편, 팩스, 전화, 문자전송 또는 이에 상당하는 방법(이하 \"서면등의 방법\"이라 한다)을 말한다. <개정 2023.9.12>\n⑥ 중앙행정기관의 장은 제2항에 따른 동의방법 중 소관 분야의 개인정보처리자별 업무, 업종의 특성 및 정보주체의 수 등을 고려하여 적절한 동의방법에 관한 기준을 법 제12조제2항에 따른 개인정보 보호지침(이하 \"개인정보 보호지침\"이라 한다)으로 정하여 그 기준에 따라 동의를 받도록 개인정보처리자에게 권장할 수 있다. <개정 2015.12.30, 2017.10.17, 2023.9.12>\n제17조(동의를 받는 방법)","kind":"D"},{"id":"D:17-2","label":"영 제17조의2","title":"아동의 개인정보 보호","chapter":"제4장 개인정보의 처리","deleted":false,"text":"① 개인정보처리자는 법 제22조의2제1항에 따라 법정대리인이 동의했는지를 확인하는 경우에는 다음 각 호의 어느 하나에 해당하는 방법으로 해야 한다.\n1. 동의 내용을 게재한 인터넷 사이트에 법정대리인이 동의 여부를 표시하도록 하고 개인정보처리자가 그 동의 표시를 확인했음을 법정대리인의 휴대전화 문자메시지로 알리는 방법\n2. 동의 내용을 게재한 인터넷 사이트에 법정대리인이 동의 여부를 표시하도록 하고 법정대리인의 신용카드ㆍ직불카드 등의 카드정보를 제공받는 방법\n3. 동의 내용을 게재한 인터넷 사이트에 법정대리인이 동의 여부를 표시하도록 하고 법정대리인의 휴대전화 본인인증 등을 통하여 본인 여부를 확인하는 방법\n4. 동의 내용이 적힌 서면을 법정대리인에게 직접 발급하거나 우편 또는 팩스를 통하여 전달하고, 법정대리인이 동의 내용에 대하여 서명날인 후 제출하도록 하는 방법\n5. 동의 내용이 적힌 전자우편을 발송하고 법정대리인으로부터 동의의 의사표시가 적힌 전자우편을 전송받는 방법\n6. 전화를 통하여 동의 내용을 법정대리인에게 알리고 동의를 받거나 인터넷주소 등 동의 내용을 확인할 수 있는 방법을 안내하고 재차 전화 통화를 통하여 동의를 받는 방법\n7. 그 밖에 제1호부터 제6호까지의 규정에 준하는 방법으로서 법정대리인에게 동의 내용을 알리고 동의의 의사표시를 확인하는 방법\n② 법 제22조의2제2항에서 \"대통령령으로 정하는 정보\"란 법정대리인의 성명 및 연락처에 관한 정보를 말한다.\n③ 개인정보처리자는 개인정보 수집 매체의 특성상 동의 내용을 전부 표시하기 어려운 경우에는 인터넷주소 또는 사업장 전화번호 등 동의 내용을 확인할 수 있는 방법을 법정대리인에게 안내할 수 있다.\n제17조의2(아동의 개인정보 보호)","kind":"D"},{"id":"D:18","label":"영 제18조","title":"민감정보의 범위","chapter":"제4장 개인정보의 처리","deleted":false,"text":"1. 유전자검사 등의 결과로 얻어진 유전정보\n2. 「형의 실효 등에 관한 법률」 제2조제5호에 따른 범죄경력자료에 해당하는 정보\n3. 개인의 신체적, 생리적, 행동적 특징에 관한 정보로서 특정 개인을 알아볼 목적으로 일정한 기술적 수단을 통해 생성한 정보\n4. 인종이나 민족에 관한 정보\n제18조(민감정보의 범위) 법 제23조제1항 각 호 외의 부분 본문에서 \"대통령령으로 정하는 정보\"란 다음 각 호의 어느 하나에 해당하는 정보를 말한다. 다만, 공공기관이 법 제18조제2항제5호부터 제9호까지의 규정에 따라 다음 각 호의 어느 하나에 해당하는 정보를 처리하는 경우의 해당 정보는 제외한다. <개정 2016.9.29, 2020.8.4>","kind":"D"},{"id":"D:19","label":"영 제19조","title":"고유식별정보의 범위","chapter":"제4장 개인정보의 처리","deleted":false,"text":"1. 「주민등록법」 제7조의2제1항에 따른 주민등록번호\n2. 「여권법」 제7조제1항제1호에 따른 여권번호\n3. 「도로교통법」 제80조에 따른 운전면허의 면허번호\n4. 「출입국관리법」 제31조제5항에 따른 외국인등록번호\n제19조(고유식별정보의 범위) 법 제24조제1항 각 호 외의 부분에서 \"대통령령으로 정하는 정보\"란 다음 각 호의 어느 하나에 해당하는 정보를 말한다. 다만, 공공기관이 법 제18조제2항제5호부터 제9호까지의 규정에 따라 다음 각 호의 어느 하나에 해당하는 정보를 처리하는 경우의 해당 정보는 제외한다. <개정 2016.9.29, 2017.6.27, 2020.8.4>","kind":"D"},{"id":"D:20","label":"영 제20조","title":"","chapter":"제4장 개인정보의 처리","deleted":true,"text":"제20조 삭제 <2014.8.6>","kind":"D"},{"id":"D:21","label":"영 제21조","title":"고유식별정보의 안전성 확보 조치","chapter":"제4장 개인정보의 처리","deleted":false,"text":"① 법 제24조제3항에 따른 고유식별정보의 안전성 확보 조치에 관하여는 제30조를 준용한다. 이 경우 \"법 제29조\"는 \"법 제24조제3항\"으로, \"개인정보\"는 \"고유식별정보\"로 본다. <개정 2020.8.4, 2023.9.12>\n② 법 제24조제4항에서 \"대통령령으로 정하는 기준에 해당하는 개인정보처리자\"란 다음 각 호의 어느 하나에 해당하는 개인정보처리자를 말한다. <개정 2024.3.12>\n1. 1만명 이상의 정보주체에 관하여 고유식별정보를 처리하는 공공기관\n2. 보호위원회가 법 위반 이력 및 내용ㆍ정도, 고유식별정보 처리의 위험성 등을 고려하여 법 제24조제4항에 따른 조사가 필요하다고 인정하는 공공기관\n3. 공공기관 외의 자로서 5만명 이상의 정보주체에 관하여 고유식별정보를 처리하는 자\n③ 보호위원회는 제2항 각 호의 어느 하나에 해당하는 개인정보처리자에 대하여 법 제24조제4항에 따라 안전성 확보에 필요한  조치를 하였는지를 3년마다 1회 이상 조사해야 한다. <개정 2017.7.26, 2020.8.4, 2024.3.12>\n④ 다음 각 호의 어느 하나에 해당하는 경우로서 고유식별정보의 안전성 확보 조치에 대한 점검이 이루어진 경우에는 제3항에 따른 조사를 실시한 것으로 본다. <신설 2024.3.12>\n1. 법 제11조의2에 따라 개인정보 보호수준 평가를 받은 경우\n2. 법 제32조의2에 따라 개인정보 보호 인증을 받은 경우\n3. 「신용정보의 이용 및 보호에 관한 법률」 제45조의5에 따른 개인신용정보 활용ㆍ관리 실태에 대한 상시평가 등 다른 법률에 따라 고유식별정보의 안전성 확보 조치 이행 여부에 대한 정기적인 점검이 이루어지는 경우로서 관계 중앙행정기관의 장의 요청에 따라 해당 점검이 제3항에 따른 조사에 준하는 것으로 보호위원회가 인정하는 경우\n⑤ 제3항에 따른 조사는 제2항 각 호의 어느 하나에 해당하는 개인정보처리자에게 온라인 또는 서면을 통하여 필요한 자료를 제출하게 하는 방법으로 한다. <개정 2024.3.12>\n⑥ 법 제24조제5항에서 \"대통령령으로 정하는 전문기관\"이란 다음 각 호의 기관을 말한다. <개정 2017.7.26, 2020.8.4, 2024.3.12>\n1. 「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 제52조에 따른 한국인터넷진흥원(이하 \"한국인터넷진흥원\"이라 한다)\n2. 법 제24조제4항에 따른 조사를 수행할 수 있는 기술적ㆍ재정적 능력과 설비를 보유한 것으로 인정되어 보호위원회가 정하여 고시하는 법인, 단체 또는 기관\n제21조(고유식별정보의 안전성 확보 조치)","kind":"D"},{"id":"D:21-2","label":"영 제21조의2","title":"주민등록번호 암호화 적용 대상 등","chapter":"제4장 개인정보의 처리","deleted":false,"text":"① 법 제24조의2제2항에 따라 암호화 조치를 하여야 하는 암호화 적용 대상은 주민등록번호를 전자적인 방법으로 보관하는 개인정보처리자로 한다.\n② 제1항의 개인정보처리자에 대한 암호화 적용 시기는 다음 각 호와 같다.\n1. 100만명 미만의 정보주체에 관한 주민등록번호를 보관하는 개인정보처리자: 2017년 1월 1일\n2. 100만명 이상의 정보주체에 관한 주민등록번호를 보관하는 개인정보처리자: 2018년 1월 1일\n③ 보호위원회는 기술적ㆍ 경제적 타당성 등을 고려하여 제1항에 따른 암호화 조치의 세부적인 사항을 정하여 고시할 수 있다. <개정 2017.7.26, 2020.8.4>\n제21조의2(주민등록번호 암호화 적용 대상 등)","kind":"D"},{"id":"D:22","label":"영 제22조","title":"고정형 영상정보처리기기 설치ㆍ운영 제한의 예외","chapter":"제4장 개인정보의 처리","deleted":false,"text":"① 법 제25조제1항제6호에서 \"대통령령으로 정하는 경우\"란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <신설 2023.9.12>\n1. 출입자 수, 성별, 연령대 등 통계값 또는 통계적 특성값 산출을 위해 촬영된 영상정보를 일시적으로 처리하는 경우\n2. 그 밖에 제1호에 준하는 경우로서 보호위원회의 심의ㆍ의결을 거친 경우\n② 법 제25조제2항 단서에서 \"대통령령으로 정하는 시설\"이란 다음 각 호의 시설을 말한다. <개정 2017.5.29, 2020.8.4, 2023.9.12>\n1. 「형의 집행 및 수용자의 처우에 관한 법률」 제2조제1호에 따른 교정시설\n2. 「정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률」 제3조제5호부터 제7호까지의 규정에 따른 정신의료기관(수용시설을 갖추고 있는 것만 해당한다), 정신요양시설 및 정신재활시설\n③ 중앙행정기관의 장은 소관 분야의 개인정보처리자가 법 제25조제2항 단서에 따라 제2항 각 호의 시설에 고정형 영상정보처리기기를 설치ㆍ운영하는 경우 정보주체의 사생활 침해를 최소화하기 위하여 필요한 세부 사항을 개인정보 보호지침으로 정하여 그 준수를 권장할 수 있다. <개정 2023.9.12>\n제22조(고정형 영상정보처리기기 설치ㆍ운영 제한의 예외)","kind":"D"},{"id":"D:23","label":"영 제23조","title":"고정형 영상정보처리기기 설치 시 의견 수렴","chapter":"제4장 개인정보의 처리","deleted":false,"text":"① 법 제25조제1항 각 호에 따라 고정형 영상정보처리기기를 설치ㆍ운영하려는 공공기관의 장은 다음 각 호의 어느 하나에 해당하는 절차를 거쳐 관계 전문가 및 이해관계인의 의견을 수렴하여야 한다. <개정 2023.9.12>\n1. 「행정절차법」에 따른 행정예고의 실시 또는 의견청취\n2. 해당 고정형 영상정보처리기기의 설치로 직접 영향을 받는 지역 주민 등을 대상으로 하는 설명회ㆍ설문조사 또는 여론조사\n② 법 제25조제2항 단서에 따른 시설에 고정형 영상정보처리기기를 설치ㆍ운영하려는 자는 다음 각 호의 사람으로부터 의견을 수렴하여야 한다. <개정 2023.9.12>\n1. 관계 전문가\n2. 해당 시설에 종사하는 사람, 해당 시설에 구금되어 있거나 보호받고 있는 사람 또는 그 사람의 보호자 등 이해관계인\n제23조(고정형 영상정보처리기기 설치 시 의견 수렴)","kind":"D"},{"id":"D:24","label":"영 제24조","title":"안내판의 설치 등","chapter":"제4장 개인정보의 처리","deleted":false,"text":"① 법 제25조제1항 각 호에 따라 고정형 영상정보처리기기를 설치ㆍ운영하는 자(이하 \"고정형영상정보처리기기운영자\"라 한다)는 고정형 영상정보처리기기가 설치ㆍ운영되고 있음을 정보주체가 쉽게 알아볼 수 있도록 같은 조 제4항 각 호의 사항이 포함된 안내판을 설치하여야 한다. 다만, 건물 안에 여러 개의 고정형 영상정보처리기기를 설치하는 경우에는 출입구 등 잘 보이는 곳에 해당 시설 또는 장소 전체가 고정형 영상정보처리기기 설치지역임을 표시하는 안내판을 설치할 수 있다. <개정 2016.9.29, 2023.9.12>\n1. 삭제<2016.9.29>\n2. 삭제<2016.9.29>\n3. 삭제<2016.9.29>\n② 제1항에도 불구하고 고정형 영상정보처리기기운영자가 설치ㆍ운영하는 고정형 영상정보처리기기가 다음 각 호의 어느 하나에 해당하는 경우에는 안내판 설치를 갈음하여 고정형영상정보처리기기운영자의 인터넷 홈페이지에 법 제25조제4항 각 호의 사항을 게재할 수 있다. <개정 2016.9.29, 2023.9.12>\n1. 공공기관이 원거리 촬영, 과속ㆍ신호위반 단속 또는 교통흐름조사 등의 목적으로 고정형 영상정보처리기기를 설치하는 경우로서 개인정보 침해의 우려가 적은 경우\n2. 산불감시용 고정형 영상정보처리기기를 설치하는 경우 등 장소적 특성으로 인하여 안내판을 설치하는 것이 불가능하거나 안내판을 설치하더라도 정보주체가 쉽게 알아볼 수 없는 경우\n③ 제2항에 따라 인터넷 홈페이지에 법 제25조제4항 각 호의 사항을 게재할 수 없으면 고정형영상정보처리기기운영자는 다음 각 호의 어느 하나 이상의 방법으로 법 제25조제4항 각 호의 사항을 공개하여야 한다. <개정 2016.9.29, 2020.8.4, 2023.9.12>\n1. 고정형영상정보처리기기운영자의 사업장ㆍ영업소ㆍ사무소ㆍ점포 등(이하 \"사업장등\"이라 한다)의 보기 쉬운 장소에 게시하는 방법\n2. 관보(고정형영상정보처리기기운영자가 공공기관인 경우만 해당한다)나 고정형영상정보처리기기운영자의 사업장등이 있는 시ㆍ도 이상의 지역을 주된 보급지역으로 하는 「신문 등의 진흥에 관한 법률」 제2조제1호가목ㆍ다목 또는 같은 조 제2호에 따른 일반일간신문ㆍ일반주간신문 또는 인터넷신문에 싣는 방법\n④ 법 제25조제4항 각 호 외의 부분 단서에서 \"대통령령으로 정하는 시설\"이란 「보안업무규정」 제32조에 따른 국가보안시설을 말한다. <개정 2016.9.29>\n제24조(안내판의 설치 등)","kind":"D"},{"id":"D:25","label":"영 제25조","title":"고정형 영상정보처리기기 운영ㆍ관리 방침","chapter":"제4장 개인정보의 처리","deleted":false,"text":"① 고정형영상정보처리기기운영자는 법 제25조제7항에 따라 다음 각 호의 사항이 포함된 고정형 영상정보처리기기 운영ㆍ관리 방침을 마련해야 한다. <개정 2023.9.12>\n1. 고정형 영상정보처리기기의 설치 근거 및 설치 목적\n2. 고정형 영상정보처리기기의 설치 대수, 설치 위치 및 촬영 범위\n3. 관리책임자, 담당 부서 및 영상정보에 대한 접근 권한이 있는 사람\n4. 영상정보의 촬영시간, 보관기간, 보관장소 및 처리방법\n5. 고정형영상정보처리기기운영자의 영상정보 확인 방법 및 장소\n6. 정보주체의 영상정보 열람 등 요구에 대한 조치\n7. 영상정보 보호를 위한 기술적ㆍ관리적 및 물리적 조치\n8. 그 밖에 고정형 영상정보처리기기의 설치ㆍ운영 및 관리에 필요한 사항\n② 제1항에 따라 마련한 고정형 영상정보처리기기 운영ㆍ관리 방침의 공개에 관하여는 제31조제2항 및 제3항을 준용한다. 이 경우 \"개인정보처리자\"는 \"고정형영상정보처리기기운영자\"로, \"법 제30조제2항\"은 \"법 제25조제7항\"으로, \"개인정보 처리방침\"은 \"고정형 영상정보처리기기 운영ㆍ관리 방침\"으로 본다. <개정 2023.9.12>\n제25조(고정형 영상정보처리기기 운영ㆍ관리 방침)","kind":"D"},{"id":"D:26","label":"영 제26조","title":"공공기관의 고정형 영상정보처리기기 설치ㆍ운영 사무의 위탁","chapter":"제4장 개인정보의 처리","deleted":false,"text":"① 법 제25조제8항 단서에 따라 공공기관이 고정형 영상정보처리기기의 설치ㆍ운영에 관한 사무를 위탁하는 경우에는 다음 각 호의 내용이 포함된 문서로 하여야 한다. <개정 2023.9.12>\n1. 위탁하는 사무의 목적 및 범위\n2. 재위탁 제한에 관한 사항\n3. 영상정보에 대한 접근 제한 등 안전성 확보 조치에 관한 사항\n4. 영상정보의 관리 현황 점검에 관한 사항\n5. 위탁받는 자가 준수하여야 할 의무를 위반한 경우의 손해배상 등 책임에 관한 사항\n② 제1항에 따라 사무를 위탁한 경우에는 제24조제1항부터 제3항까지의 규정에 따른 안내판 등에 위탁받는 자의 명칭 및 연락처를 포함시켜야 한다.\n제26조(공공기관의 고정형 영상정보처리기기 설치ㆍ운영 사무의 위탁)","kind":"D"},{"id":"D:27","label":"영 제27조","title":"이동형 영상정보처리기기 운영 제한의 예외","chapter":"제4장 개인정보의 처리","deleted":false,"text":"제27조(이동형 영상정보처리기기 운영 제한의 예외) 법 제25조의2제2항 단서에서 \"대통령령으로 정하는 경우\"란 범죄, 화재, 재난 또는 이에 준하는 상황에서 인명의 구조ㆍ구급 등을 위하여 사람 또는 그 사람과 관련된 사물의 영상(개인정보에 해당하는 경우로 한정한다. 이하 같다)의 촬영이 필요한 경우를 말한다.","kind":"D"},{"id":"D:27-2","label":"영 제27조의2","title":"이동형 영상정보처리기기 촬영 사실 표시 등","chapter":"제4장 개인정보의 처리","deleted":false,"text":"제27조의2(이동형 영상정보처리기기 촬영 사실 표시 등) 법 제25조의2제1항 각 호에 해당하여 이동형 영상정보처리기기로 사람 또는 그 사람과 관련된 사물의 영상을 촬영하는 경우에는 불빛, 소리, 안내판, 안내서면, 안내방송 또는 그 밖에 이에 준하는 수단이나 방법으로 정보주체가 촬영 사실을 쉽게 알 수 있도록 표시하고 알려야 한다. 다만, 드론을 이용한 항공촬영 등 촬영 방법의 특성으로 인해 정보주체에게 촬영 사실을 알리기 어려운 경우에는 보호위원회가 구축하는 인터넷 사이트에 공지하는 방법으로 알릴 수 있다.","kind":"D"},{"id":"D:27-3","label":"영 제27조의3","title":"영상정보처리기기 설치ㆍ운영 지침","chapter":"제4장 개인정보의 처리","deleted":false,"text":"제27조의3(영상정보처리기기 설치ㆍ운영 지침) 보호위원회는 법 및 이 영에서 규정한 사항 외에 고정형 영상정보처리기기의 설치ㆍ운영 및 이동형 영상정보처리기기의 운영에 관한 기준, 설치ㆍ운영 사무의 위탁 등에 관하여 법 제12조제1항에 따른 표준 개인정보 보호지침을 정하여 고정형영상정보처리기기운영자와 이동형 영상정보처리기기를 운영하는 자에게 그 준수를 권장할 수 있다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.8.4, 2023.9.12>","kind":"D"},{"id":"D:28","label":"영 제28조","title":"개인정보의 처리 업무 위탁 시 조치","chapter":"제4장 개인정보의 처리","deleted":false,"text":"① 법 제26조제1항제3호에서 \"대통령령으로 정한 사항\"이란 다음 각 호의 사항을 말한다.\n1. 위탁업무의 목적 및 범위\n2. 재위탁 제한에 관한 사항\n3. 개인정보에 대한 접근 제한 등 안전성 확보 조치에 관한 사항\n4. 위탁업무와 관련하여 보유하고 있는 개인정보의 관리 현황 점검 등 감독에 관한 사항\n5. 법 제26조제2항에 따른 수탁자(이하 \"수탁자\"라 한다)가 준수하여야 할 의무를 위반한 경우의 손해배상 등 책임에 관한 사항\n② 법 제26조제2항에서 \"대통령령으로 정하는 방법\"이란 개인정보 처리 업무를 위탁하는 개인정보처리자(이하 \"위탁자\"라 한다)가 위탁자의 인터넷 홈페이지에 위탁하는 업무의 내용과 수탁자를 지속적으로 게재하는 방법을 말한다.\n③ 제2항에 따라 인터넷 홈페이지에 게재할 수 없는 경우에는 다음 각 호의 어느 하나 이상의 방법으로 위탁하는 업무의 내용과 수탁자를 공개하여야 한다. <개정 2023.9.12>\n1. 위탁자의 사업장등의 보기 쉬운 장소에 게시하는 방법\n2. 관보(위탁자가 공공기관인 경우만 해당한다)나 위탁자의 사업장등이 있는 시ㆍ도 이상의 지역을 주된 보급지역으로 하는 「신문 등의 진흥에 관한 법률」 제2조제1호가목ㆍ다목 및 같은 조 제2호에 따른 일반일간신문, 일반주간신문 또는 인터넷신문에 싣는 방법\n3. 같은 제목으로 연 2회 이상 발행하여 정보주체에게 배포하는 간행물ㆍ소식지ㆍ홍보지 또는 청구서 등에 지속적으로 싣는 방법\n4. 재화나 서비스를 제공하기 위하여 위탁자와 정보주체가 작성한 계약서 등에 실어 정보주체에게 발급하는 방법\n④ 법 제26조제3항 전단에서 \"대통령령으로 정하는 방법\"이란 서면등의 방법을 말한다. <개정 2023.9.12>\n⑤ 위탁자가 과실 없이 제4항에 따른 방법으로 위탁하는 업무의 내용과 수탁자를 정보주체에게 알릴 수 없는 경우에는 해당 사항을 인터넷 홈페이지에 30일 이상 게재하여야 한다. 다만, 인터넷 홈페이지를 운영하지 아니하는 위탁자의 경우에는 사업장등의 보기 쉬운 장소에 30일 이상 게시하여야 한다.\n⑥ 위탁자는 수탁자가 개인정보 처리 업무를 수행하는 경우에 법 또는 이 영에 따라 개인정보처리자가 준수하여야 할 사항과 법 제26조제1항 각 호의 사항을 준수하는지를 같은 조 제4항에 따라 감독하여야 한다.\n제28조(개인정보의 처리 업무 위탁 시 조치)","kind":"D"},{"id":"D:29","label":"영 제29조","title":"영업양도 등에 따른 개인정보 이전의 통지","chapter":"제4장 개인정보의 처리","deleted":false,"text":"① 법 제27조제1항 각 호 외의 부분과 같은 조 제2항 본문에서 \"대통령령으로 정하는 방법\"이란 서면등의 방법을 말한다.\n② 법 제27조제1항에 따라 개인정보를 이전하려는 자(이하 이 항에서 \"영업양도자등\"이라 한다)가 과실 없이 제1항에 따른 방법으로 법 제27조제1항 각 호의 사항을 정보주체에게 알릴 수 없는 경우에는 해당 사항을 인터넷 홈페이지에 30일 이상 게재하여야 한다. 다만, 인터넷 홈페이지에 게재할 수 없는 정당한 사유가 있는 경우에는 다음 각 호의 어느 하나의 방법으로 법 제27조제1항 각 호의 사항을 정보주체에게 알릴 수 있다. <개정 2020.8.4>\n1. 영업양도자등의 사업장등의 보기 쉬운 장소에 30일 이상 게시하는 방법\n2. 영업양도자등의 사업장등이 있는 시ㆍ도 이상의 지역을 주된 보급지역으로 하는 「신문 등의 진흥에 관한 법률」 제2조제1호가목ㆍ다목 또는 같은 조 제2호에 따른 일반일간신문ㆍ일반주간신문 또는 인터넷신문에 싣는 방법\n제29조(영업양도 등에 따른 개인정보 이전의 통지)","kind":"D"},{"id":"D:29-2","label":"영 제29조의2","title":"결합전문기관의 지정 및 지정 취소","chapter":"제4장의2 가명정보의 처리에 관한 특례","deleted":false,"text":"① 법 제28조의3제1항에 따른 전문기관(이하 \"결합전문기관\"이라 한다)의 지정 기준은 다음 각 호와 같다. <개정 2025.2.25>\n1. 보호위원회가 정하여 고시하는 바에 따라 가명정보의 결합ㆍ반출 업무를 담당하는 조직을 구성하고, 개인정보 보호와 관련된 자격이나 경력을 갖춘 사람을 3명 이상 상시 고용할 것\n2. 보호위원회가 정하여 고시하는 바에 따라 가명정보를 안전하게 결합하기 위하여 필요한 공간, 시설 및 장비를 구축하고 가명정보의 결합ㆍ반출 관련 정책 및 절차 등을 마련할 것\n3. 보호위원회가 정하여 고시하는 기준에 따른 재정 능력을 갖출 것\n4. 최근 3년 이내에 법 제66조제1항에 따라 공표되거나 같은 조 제2항에 따른 공표명령을 받은 사실이 없을 것\n5. 최근 1년 이내에 제4항에 따른 유효기간 연장 신청을 하였으나 재지정되지 않은 사실 또는 제5항에 따라 지정 취소된 사실이 없을 것\n② 법인, 단체 또는 기관이 법 제28조의3제1항에 따라 결합전문기관으로 지정을 받으려는 경우에는 보호위원회가 정하여 고시하는 결합전문기관 지정신청서에 다음 각 호의 서류(전자문서를 포함한다. 이하 같다)를 첨부하여 보호위원회 또는 관계 중앙행정기관의 장에게 제출해야 한다.\n1. 정관 또는 규약\n2. 제1항에 따른 지정 기준을 갖추었음을 증명할 수 있는 서류로서 보호위원회가 정하여 고시하는 서류\n③ 보호위원회 또는 관계 중앙행정기관의 장은 제2항에 따라 지정신청서를 제출한 법인, 단체 또는 기관이 제1항에 따른 지정 기준에 적합한 경우에는 결합전문기관으로 지정할 수 있다.\n④ 결합전문기관 지정의 유효기간은 지정을 받은 날부터 3년으로 하며, 보호위원회 또는 관계 중앙행정기관의 장은 결합전문기관이 유효기간의 연장을 신청하면 다음 각 호의 사항을 검토하여 결합전문기관으로 재지정할 수 있다. <개정 2025.2.25>\n1. 제1항에 따른 지정 기준에 적합한지 여부\n2. 향후 업무 수행 계획이 지정 목적 달성에 적합한지 여부\n3. 지정 목적에 따라 업무를 제대로 수행했는지 여부\n4. 제29조의3제5항에 따른 비용을 과다하게 청구하는 등 결합을 부당하게 제한했는지 여부\n⑤ 보호위원회 또는 관계 중앙행정기관의 장은 결합전문기관이 다음 각 호의 어느 하나에 해당하는 경우에는 결합전문기관의 지정을 취소할 수 있다. 다만, 제1호 또는 제2호에 해당하는 경우에는 지정을 취소해야 한다.\n1. 거짓이나 부정한 방법으로 결합전문기관으로 지정을 받은 경우\n2. 결합전문기관 스스로 지정 취소를 요청하거나 폐업한 경우\n3. 제1항에 따른 결합전문기관의 지정 기준을 충족하지 못하게 된 경우\n4. 결합 및 반출 등과 관련된 정보의 유출 등 개인정보 침해사고가 발생한 경우\n5. 그 밖에 법 또는 이 영에 따른 의무를 위반한 경우\n⑥ 보호위원회 또는 관계 중앙행정기관의 장은 제5항에 따라 결합전문기관의 지정을 취소하려는 경우에는 청문을 해야 한다.\n⑦ 보호위원회 또는 관계 중앙행정기관의 장은 결합전문기관을 지정, 재지정 또는 지정 취소한 경우에는 이를 관보에 공고하거나 보호위원회 또는 해당 관계 중앙행정기관의 홈페이지에 게시해야 한다. 이 경우 관계 중앙행정기관의 장이 결합전문기관을 지정, 재지정, 또는 지정 취소한 경우에는 보호위원회에 통보해야 한다.\n⑧ 제1항부터 제7항까지에서 규정한 사항 외에 결합전문기관의 지정, 재지정 및 지정 취소 등에 필요한 사항은 보호위원회가 정하여 고시한다.\n제29조의2(결합전문기관의 지정 및 지정 취소)","kind":"D"},{"id":"D:29-3","label":"영 제29조의3","title":"개인정보처리자 간 가명정보의 결합 및 반출 등","chapter":"제4장의2 가명정보의 처리에 관한 특례","deleted":false,"text":"① 결합전문기관에 가명정보의 결합을 신청하려는 개인정보처리자(이하 \"결합신청자\"라 한다)는 보호위원회가 정하여 고시하는 결합신청서에 다음 각 호의 서류를 첨부하여 결합전문기관에 제출해야 한다.\n1. 사업자등록증, 법인등기부등본 등 결합신청자 관련 서류\n2. 결합 대상 가명정보에 관한 서류\n3. 결합 목적을 증명할 수 있는 서류\n4. 그 밖에 가명정보의 결합 및 반출에 필요하다고 보호위원회가 정하여 고시하는 서류\n② 결합전문기관은 법 제28조의3제1항에 따라 가명정보를 결합하는 경우에는 특정 개인을 알아볼 수 없도록 해야 한다. 이 경우 보호위원회는 필요하면 한국인터넷진흥원 또는 보호위원회가 지정하여 고시하는 기관으로 하여금 특정 개인을 알아볼 수 없도록 하는 데에 필요한 업무를 지원하도록 할 수 있다.\n③ 결합신청자는 법 제28조의3제2항에 따라 결합전문기관이 결합한 정보를 결합전문기관 외부로 반출하려는 경우에는 결합전문기관에 설치된 안전성 확보에 필요한 기술적ㆍ관리적ㆍ물리적 조치가 된 공간에서 제2항에 따라 결합된 정보를 가명정보 또는 법 제58조의2에 해당하는 정보로 처리한 뒤 결합전문기관의 승인을 받아야 한다.\n④ 결합전문기관은 다음 각 호의 기준을 충족하는 경우에는 법 제28조의3제2항에 따른 반출을 승인해야 한다. 이 경우 결합전문기관은 결합된 정보의 반출을 승인하기 위하여 반출심사위원회를 구성해야 한다.\n1. 결합 목적과 반출 정보가 관련성이 있을 것\n2. 특정 개인을 알아볼 가능성이 없을 것\n3. 반출 정보에 대한 안전조치 계획이 있을 것\n⑤ 결합전문기관은 결합 및 반출 등에 필요한 비용을 결합신청자에게 청구할 수 있다.\n⑥ 제1항부터 제5항까지에서 규정한 사항 외에 가명정보의 결합 절차와 방법, 반출 및 승인 등에 필요한 사항은 보호위원회가 정하여 고시한다.\n제29조의3(개인정보처리자 간 가명정보의 결합 및 반출 등)","kind":"D"},{"id":"D:29-4","label":"영 제29조의4","title":"결합전문기관의 관리ㆍ감독 등","chapter":"제4장의2 가명정보의 처리에 관한 특례","deleted":false,"text":"① 보호위원회 또는 관계 중앙행정기관의 장은 결합전문기관을 지정한 경우에는 해당 결합전문기관의 업무 수행능력 및 기술ㆍ시설 유지 여부 등을 관리ㆍ감독해야 한다.\n② 결합전문기관은 제1항에 따른 관리ㆍ감독을 위하여 다음 각 호의 서류를 보호위원회가 정하여 고시하는 바에 따라 보호위원회 또는 관계 중앙행정기관의 장에게 제출해야 한다. <개정 2025.2.25>\n1. 가명정보의 결합ㆍ반출 실적보고서\n2. 결합전문기관의 지정 기준을 유지하고 있음을 증명할 수 있는 서류\n3. 가명정보의 안전성 확보에 필요한 조치를 하고 있음을 증명할 수 있는 서류로서 보호위원회가 정하여 고시하는 서류\n③ 보호위원회는 다음 각 호의 사항을 관리ㆍ감독해야 한다.\n1. 결합전문기관의 가명정보의 결합 및 반출 승인 과정에서의 법 위반 여부\n2. 결합신청자의 가명정보 처리 실태\n3. 그 밖에 가명정보의 안전한 처리를 위하여 필요한 사항으로서 보호위원회가 정하여 고시하는 사항\n제29조의4(결합전문기관의 관리ㆍ감독 등)","kind":"D"},{"id":"D:29-5","label":"영 제29조의5","title":"가명정보에 대한 안전성 확보 조치","chapter":"제4장의2 가명정보의 처리에 관한 특례","deleted":false,"text":"① 개인정보처리자는 법 제28조의4제1항에 따라 가명정보 및 가명정보를 원래의 상태로 복원하기 위한 추가 정보(이하 이 조에서 \"추가정보\"라 한다)에 대하여 다음 각 호의 안전성 확보 조치를 해야 한다. <개정 2021.2.2, 2023.9.12>\n1. 제30조에 따른 안전성 확보 조치\n2. 가명정보와 추가정보의 분리 보관. 다만, 추가정보가 불필요한 경우에는 추가정보를 파기해야 한다.\n3. 가명정보와 추가정보에 대한 접근 권한의 분리. 다만, 「소상공인기본법」 제2조에 따른 소상공인으로서 가명정보를 취급할 자를 추가로 둘 여력이 없는 경우 등 접근 권한의 분리가 어려운 정당한 사유가 있는 경우에는 업무 수행에 필요한 최소한의 접근 권한만 부여하고 접근 권한의 보유 현황을 기록으로 보관하는 등 접근 권한을 관리ㆍ통제해야 한다.\n② 법 제28조의4제3항에서 \"대통령령으로 정하는 사항\"이란 다음 각 호의 사항을 말한다. <개정 2023.9.12>\n1. 가명정보 처리의 목적\n2. 가명처리한 개인정보의 항목\n3. 가명정보의 이용내역\n4. 제3자 제공 시 제공받는 자\n5. 가명정보의 처리 기간(법 제28조의4제2항에 따라 가명정보의 처리 기간을 별도로 정한 경우로 한정한다)\n6. 그 밖에 가명정보의 처리 내용을 관리하기 위하여 보호위원회가 필요하다고 인정하여 고시하는 사항\n제29조의5(가명정보에 대한 안전성 확보 조치)","kind":"D"},{"id":"D:29-6","label":"영 제29조의6","title":"","chapter":"제4장의2 가명정보의 처리에 관한 특례","deleted":true,"text":"제29조의6 삭제 <2023.9.12>","kind":"D"},{"id":"D:29-7","label":"영 제29조의7","title":"개인정보의 국외 처리위탁ㆍ보관 시 정보주체에게 알리는 방법","chapter":"제4장의3 개인정보의 국외 이전","deleted":false,"text":"제29조의7(개인정보의 국외 처리위탁ㆍ보관 시 정보주체에게 알리는 방법) 법 제28조의8제1항제3호나목에서 \"전자우편 등 대통령령으로 정하는 방법\"이란 서면등의 방법을 말한다.","kind":"D"},{"id":"D:29-8","label":"영 제29조의8","title":"개인정보의 국외 이전 인증","chapter":"제4장의3 개인정보의 국외 이전","deleted":false,"text":"① 보호위원회는 법 제28조의8제1항제4호 각 목 외의 부분에 따른 인증을 고시하려는 경우에는 다음 각 호의 순서에 따른 절차를 모두 거쳐야 한다.\n1. 제34조의6에 따른 개인정보 보호 인증 전문기관의 평가\n2. 제5조제1항제1호에 따른 개인정보의 국외 이전 분야 전문위원회(이하 \"국외이전전문위원회\"라 한다)의 평가\n3. 정책협의회의 협의\n② 보호위원회는 법 제28조의8제1항제4호 각 목 외의 부분에 따른 인증을 고시할 때에는 5년의 범위에서 유효 기간을 정하여 고시할 수 있다.\n③ 제1항 및 제2항에서 규정한 사항 외에 인증의 고시 절차 등에 관하여 필요한 사항은 보호위원회가 정하여 고시한다.\n제29조의8(개인정보의 국외 이전 인증)","kind":"D"},{"id":"D:29-9","label":"영 제29조의9","title":"국가 등에 대한 개인정보 보호 수준 인정","chapter":"제4장의3 개인정보의 국외 이전","deleted":false,"text":"① 보호위원회는 법 제28조의8제1항제5호에 따라 개인정보가 제공(조회되는 경우를 포함한다)ㆍ처리위탁ㆍ보관(이하 이 장에서 \"이전\"이라 한다)되는 국가 또는 국제기구(이하 \"이전대상국등\"이라 한다)의 개인정보 보호체계, 정보주체 권리보장 범위, 피해구제 절차 등이 법에 따른 개인정보 보호 수준과 실질적으로 동등한 수준을 갖추었다고 인정하려는 경우에는 다음 각 호의 사항을 종합적으로 고려해야 한다.\n1. 이전대상국등의 법령, 규정 또는 규칙 등 개인정보 보호체계가 법 제3조에서 정하는 개인정보 보호 원칙에 부합하고, 법 제4조에서 정하는 정보주체의 권리를 충분히 보장하고 있는지 여부\n2. 이전대상국등에 개인정보 보호체계를 보장하고 집행할 책임이 있는 독립적 감독기관이 존재하는지 여부\n3. 이전대상국등의 공공기관(이와 유사한 사무를 수행하는 기관을 포함한다)이 법률에 따라 개인정보를 처리하는지 여부 및 이에 대한 피해구제 절차 등 정보주체에 대한 보호수단이 존재하고 실질적으로 보장되는지 여부\n4. 이전대상국등에 정보주체가 쉽게 접근할 수 있는 피해구제 절차가 존재하는지 여부 및 피해구제 절차가 정보주체를 효과적으로 보호하고 있는지 여부\n5. 이전대상국등의 감독기관이 보호위원회와 정보주체의 권리 보호에 관하여 원활한 상호 협력이 가능한지 여부\n6. 그 밖에 이전대상국등의 개인정보 보호체계, 정보주체의 권리보장 범위, 피해구제 절차 등의 개인정보 보호 수준을 인정하기 위해 필요한 사항으로서 보호위원회가 정하여 고시하는 사항\n② 보호위원회는 제1항에 따른 인정을 하려는 경우에는 다음 각 호의 절차를 거쳐야 한다.\n1. 국외이전전문위원회의 평가\n2. 정책협의회의 협의\n③ 보호위원회는 제1항에 따른 인정을 할 때에는 정보주체의 권리 보호 등을 위하여 필요한 경우 이전대상국등으로 이전되는 개인정보의 범위, 이전받는 개인정보처리자의 범위, 인정 기간, 국외 이전의 조건 등을 이전대상국등별로 달리 정할 수 있다.\n④ 보호위원회는 제1항에 따른 인정을 한 경우에는 인정 기간 동안 이전대상국등의 개인정보 보호수준이 법에 따른 수준과 실질적으로 동등한 수준을 유지하고 있는지 점검해야 한다.\n⑤ 보호위원회는 제1항에 따른 인정을 받은 이전대상국등의 개인정보 보호체계, 정보주체의 권리보장 범위, 피해구제 절차 등의 수준이 변경된 경우에는 해당 이전대상국등의 의견을 듣고 해당 이전대상국등에 대한 인정을 취소하거나 그 내용을 변경할 수 있다.\n⑥ 보호위원회가 제1항에 따른 인정을 하거나 제5항에 따라 인정을 취소하거나 그 내용을 변경하는 경우에는 그 사실을 관보에 고시하고 보호위원회 인터넷 홈페이지에 게재해야 한다.\n⑦ 제1항부터 제6항까지에서 규정한 사항 외에 이전대상국등에 대한 인정에 필요한 사항은 보호위원회가 정하여 고시한다.\n제29조의9(국가 등에 대한 개인정보 보호 수준 인정)","kind":"D"},{"id":"D:29-10","label":"영 제29조의10","title":"개인정보의 국외 이전 시 보호조치 등","chapter":"제4장의3 개인정보의 국외 이전","deleted":false,"text":"① 개인정보처리자는 법 제28조의8제1항 각 호 외의 부분 단서에 따라 개인정보를 국외로 이전하는 경우에는 같은 조 제4항에 따라 다음 각 호의 보호조치를 해야 한다.\n1. 제30조제1항에 따른 개인정보 보호를 위한 안전성 확보 조치\n2. 개인정보 침해에 대한 고충처리 및 분쟁해결에 관한 조치\n3. 그 밖에 정보주체의 개인정보 보호를 위하여 필요한 조치\n② 개인정보처리자는 법 제28조의8제1항 각 호 외의 부분 단서에 따라 개인정보를 국외로 이전하는 경우에는 제1항 각 호의 사항에 관하여 이전받는 자와 미리 협의하고 이를 계약내용 등에 반영해야 한다.\n제29조의10(개인정보의 국외 이전 시 보호조치 등)","kind":"D"},{"id":"D:29-11","label":"영 제29조의11","title":"국외 이전 중지 명령의 기준 등","chapter":"제4장의3 개인정보의 국외 이전","deleted":false,"text":"① 보호위원회는 법 제28조의9제1항에 따라 개인정보의 국외 이전을 중지할 것을 명하려는 경우에는 다음 각 호의 사항을 종합적으로 고려해야 한다.\n1. 국외로 이전되었거나 추가적인 국외 이전이 예상되는 개인정보의 유형 및 규모\n2. 법 제28조의8제1항, 제4항 또는 제5항 위반의 중대성\n3. 정보주체에게 발생하거나 발생할 우려가 있는 피해가 중대하거나 회복하기 어려운 피해인지 여부\n4. 국외 이전의 중지를 명하는 것이 중지를 명하지 않는 것보다 명백히 정보주체에게 이익이 되는지 여부\n5. 법 제64조제1항 각 호에 해당하는 조치를 통해 개인정보의 보호 및 침해 방지가 가능한지 여부\n6. 개인정보를 이전받는 자나 개인정보가 이전되는 이전대상국등이 정보주체의 피해구제를 위한 실효적인 수단을 갖추고 있는지 여부\n7. 개인정보를 이전받는 자나 개인정보가 이전되는 이전대상국등에서 중대한 개인정보 침해가 발생하는 등 개인정보를 적정하게 보호하기 어렵다고 인정할 만한 사유가 존재하는지 여부\n② 보호위원회는 법 제28조의9제1항에 따라 개인정보의 국외 이전을 중지할 것을 명하려는 경우에는 국외이전전문위원회의 평가를 거쳐야 한다.\n③ 보호위원회는 법 제28조의9제1항에 따라 개인정보의 국외 이전을 중지할 것을 명할 때에는 개인정보처리자에게 중지명령의 내용, 사유, 이의 제기 절차ㆍ방법 및 그 밖에 필요한 사항을 문서로 알려야 한다.\n④ 제1항부터 제3항까지에서 규정한 사항 외에 개인정보의 국외 이전 중지 명령의 기준 등에 관하여 필요한 사항은 보호위원회가 정하여 고시한다.\n제29조의11(국외 이전 중지 명령의 기준 등)","kind":"D"},{"id":"D:29-12","label":"영 제29조의12","title":"국외 이전 중지 명령에 대한 이의 제기","chapter":"제4장의3 개인정보의 국외 이전","deleted":false,"text":"① 법 제28조의9제2항에 따라 이의를 제기하려는 자는 같은 조 제1항에 따른 국외 이전 중지 명령을 받은 날부터 7일 이내에 보호위원회가 정하는 이의신청서에 이의신청 사유를 증명할 수 있는 서류를 첨부하여 보호위원회에 제출해야 한다.\n② 보호위원회는 제1항에 따라 이의신청서를 제출받은 날부터 30일 이내에 그 처리결과를 해당 개인정보처리자에게 문서로 알려야 한다.\n③ 제1항 및 제2항에서 규정한 사항 외에 이의 제기의 절차 등에 관하여 필요한 사항은 보호위원회가 정하여 고시한다.\n제29조의12(국외 이전 중지 명령에 대한 이의 제기)","kind":"D"},{"id":"D:30","label":"영 제30조","title":"개인정보의 안전성 확보 조치","chapter":"제5장 개인정보의 안전한 관리","deleted":false,"text":"① 개인정보처리자는 법 제29조에 따라 다음 각 호의 안전성 확보 조치를 해야 한다. <개정 2023.9.12>\n1. 개인정보의 안전한 처리를 위한 다음 각 목의 내용을 포함하는 내부 관리계획의 수립ㆍ시행 및 점검\n가. 법 제28조제1항에 따른 개인정보취급자(이하 \"개인정보취급자\"라 한다)에 대한 관리ㆍ감독 및 교육에 관한 사항\n나. 법 제31조에 따른 개인정보 보호책임자의 지정 등 개인정보 보호 조직의 구성ㆍ운영에 관한 사항\n다. 제2호부터 제8호까지의 규정에 따른 조치를 이행하기 위하여 필요한 세부 사항\n2. 개인정보에 대한 접근 권한을 제한하기 위한 다음 각 목의 조치\n가. 데이터베이스시스템 등 개인정보를 처리할 수 있도록 체계적으로 구성한 시스템(이하 \"개인정보처리시스템\"이라 한다)에 대한 접근 권한의 부여ㆍ변경ㆍ말소 등에 관한 기준의 수립ㆍ시행\n나. 정당한 권한을 가진 자에 의한 접근인지를 확인하기 위해 필요한 인증수단 적용 기준의 설정 및 운영\n다. 그 밖에 개인정보에 대한 접근 권한을 제한하기 위하여 필요한 조치\n3. 개인정보에 대한 접근을 통제하기 위한 다음 각 목의 조치\n가. 개인정보처리시스템에 대한 침입을 탐지하고 차단하기 위하여 필요한 조치\n나. 개인정보처리시스템에 접속하는 개인정보취급자의 컴퓨터 등으로서 보호위원회가 정하여 고시하는 기준에 해당하는 컴퓨터 등에 대한 인터넷망의 차단. 다만, 전년도 말 기준 직전 3개월 간 그 개인정보가 저장ㆍ관리되고 있는 「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 제2조제1항제4호에 따른 이용자 수가 일일평균 100만명 이상인 개인정보처리자만 해당한다.\n다. 그 밖에 개인정보에 대한 접근을 통제하기 위하여 필요한 조치\n4. 개인정보를 안전하게 저장ㆍ전송하는데 필요한 다음 각 목의 조치\n가. 비밀번호의 일방향 암호화 저장 등 인증정보의 암호화 저장 또는 이에 상응하는 조치\n나. 주민등록번호 등 보호위원회가 정하여 고시하는 정보의 암호화 저장 또는 이에 상응하는 조치\n다. 「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 제2조제1항제1호에 따른 정보통신망을 통하여 정보주체의 개인정보 또는 인증정보를 송신ㆍ수신하는 경우 해당 정보의 암호화 또는 이에 상응하는 조치\n라. 그 밖에 암호화 또는 이에 상응하는 기술을 이용한 보안조치\n5. 개인정보 침해사고 발생에 대응하기 위한 접속기록의 보관 및 위조ㆍ변조 방지를 위한 다음 각 목의 조치\n가. 개인정보처리시스템에 접속한 자의 접속일시, 처리내역 등 접속기록의 저장ㆍ점검 및 이의 확인ㆍ감독\n나. 개인정보처리시스템에 대한 접속기록의 안전한 보관\n다. 그 밖에 접속기록 보관 및 위조ㆍ변조 방지를 위하여 필요한 조치\n6. 개인정보처리시스템 및 개인정보취급자가 개인정보 처리에 이용하는 정보기기에 대해 컴퓨터바이러스, 스파이웨어, 랜섬웨어 등 악성프로그램의 침투 여부를 항시 점검ㆍ치료할 수 있도록 하는 등의 기능이 포함된 프로그램의 설치ㆍ운영과 주기적 갱신ㆍ점검 조치\n7. 개인정보의 안전한 보관을 위한 보관시설의 마련 또는 잠금장치의 설치 등 물리적 조치\n8. 그 밖에 개인정보의 안전성 확보를 위하여 필요한 조치\n② 보호위원회는 개인정보처리자가 제1항에 따른 안전성 확보 조치를 하도록 시스템을 구축하는 등 필요한 지원을 할 수 있다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.8.4>\n③ 제1항에 따른 안전성 확보 조치에 관한 세부 기준은 보호위원회가 정하여 고시한다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.8.4>\n제30조(개인정보의 안전성 확보 조치)","kind":"D"},{"id":"D:30-2","label":"영 제30조의2","title":"공공시스템 운영기관 등의 개인정보 안전성 확보 조치 등","chapter":"제5장 개인정보의 안전한 관리","deleted":false,"text":"① 개인정보의 처리 규모, 접근 권한을 부여받은 개인정보취급자의 수 등 보호위원회가 고시하는 기준에 해당하는 개인정보처리시스템(이하 \"공공시스템\"이라 한다)을 운영하는 공공기관(이하 \"공공시스템운영기관\"이라 한다)은 법 제29조에 따라 이 영 제30조의 안전성 확보 조치 외에 다음 각 호의 조치를 추가로 해야 한다. <개정 2024.3.12>\n1. 제30조제1항제1호에 따른 내부 관리계획에 공공시스템별로 작성한 안전성 확보 조치를 포함할 것\n2. 공공시스템에 접속하여 개인정보를 처리하는 기관(이하 이 조에서 \"공공시스템이용기관\"이라 한다)이 정당한 권한을 가진 개인정보취급자에게 접근 권한을 부여ㆍ변경ㆍ말소 등을 할 수 있도록 하는 등 접근 권한의 안전한 관리를 위해 필요한 조치\n3. 개인정보에 대한 불법적인 접근 및 침해사고 방지를 위한 공공시스템 접속기록의 저장ㆍ분석ㆍ점검ㆍ관리 등의 조치\n② 공공시스템운영기관 및 공공시스템이용기관은 정당한 권한 없이 또는 허용된 권한을 초과하여 개인정보에 접근한 사실이 확인되는 경우에는 지체 없이 정보주체에게 해당 사실과 피해 예방 등을 위해 필요한 사항을 통지해야 한다. 이 경우 다음 각 호의 어느 하나에 해당하는 경우에는 통지를 한 것으로 본다. <개정 2026.9.10>\n1. 법 제34조제1항에 따라 정보주체에게 개인정보의 분실ㆍ도난ㆍ유출ㆍ위조ㆍ변조 또는 훼손(이하 \"유출등\"이라 한다)에 대하여 통지한 경우\n2. 다른 법령에 따라 정보주체에게 개인정보에 접근한 사실과 피해 예방 등을 위해 필요한 사항을 통지한 경우\n③ 공공시스템운영기관(공공시스템을 개발하여 배포하는 공공기관이 따로 있는 경우에는 그 공공기관을 포함한다. 이하 이 조에서 같다)은 해당 공공시스템의 규모와 특성, 해당 공공시스템이용기관의 수 등을 고려하여 개인정보의 안전한 관리에 관련된 업무를 전담하는 부서를 지정하여 운영하거나 전담인력을 배치해야 한다.\n④ 공공시스템운영기관은 공공시스템별로 해당 공공시스템을 총괄하여 관리하는 부서의 장을 관리책임자로 지정해야 한다. 다만, 해당 공공시스템을 총괄하여 관리하는 부서가 없을 때에는 업무 관련성 및 수행능력 등을 고려하여 해당 공공시스템운영기관의 관련 부서의 장 중에서 관리책임자를 지정해야 한다.\n⑤ 공공시스템운영기관은 공공시스템의 안전성 확보 조치 이행상황 점검 및 개선에 관한 사항을 협의하기 위하여 다음 각 호의 기관으로 구성되는 공공시스템운영협의회를 공공시스템별로 설치ㆍ운영해야 한다. 다만, 하나의 공공기관이 2개 이상의 공공시스템을 운영하는 경우에는 공공시스템운영협의회를 통합하여 설치ㆍ운영할 수 있다.\n1. 공공시스템운영기관\n2. 공공시스템의 운영을 위탁하는 경우 해당 수탁자\n3. 공공시스템운영기관이 필요하다고 인정하는 공공시스템이용기관\n⑥ 보호위원회는 공공시스템운영기관이 개인정보의 안전성 확보 조치를 이행하는데 필요한 지원을 할 수 있다.\n⑦ 제1항부터 제6항까지에서 규정한 사항 외에 공공시스템운영기관 등의 개인정보의 안전성 확보 조치에 필요한 사항은 보호위원회가 정하여 고시한다.\n제30조의2(공공시스템 운영기관 등의 개인정보 안전성 확보 조치 등)","kind":"D"},{"id":"D:31","label":"영 제31조","title":"개인정보 처리방침의 내용 및 공개방법 등","chapter":"제5장 개인정보의 안전한 관리","deleted":false,"text":"① 법 제30조제1항제8호에서 \"대통령령으로 정한 사항\"이란 다음 각 호의 사항을 말한다. <개정 2016.9.29, 2020.8.4, 2023.9.12, 2024.3.12>\n1. 처리하는 개인정보의 항목\n2. 법 제28조의8제1항 각 호에 따라 개인정보를 국외로 이전하는 경우 국외 이전의 근거와 같은 조 제2항 각 호의 사항\n3. 제30조에 따른 개인정보의 안전성 확보 조치에 관한 사항\n4. 국외에서 국내 정보주체의 개인정보를 직접 수집하여 처리하는 경우 개인정보를 처리하는 국가명\n② 개인정보처리자는 법 제30조제2항에 따라 수립하거나 변경한 개인정보 처리방침을 개인정보처리자의 인터넷 홈페이지에 지속적으로 게재하여야 한다.\n③ 제2항에 따라 인터넷 홈페이지에 게재할 수 없는 경우에는 다음 각 호의 어느 하나 이상의 방법으로 수립하거나 변경한 개인정보 처리방침을 공개하여야 한다. <개정 2023.9.12>\n1. 개인정보처리자의 사업장등의 보기 쉬운 장소에 게시하는 방법\n2. 관보(개인정보처리자가 공공기관인 경우만 해당한다)나 개인정보처리자의 사업장등이 있는 시ㆍ도 이상의 지역을 주된 보급지역으로 하는 「신문 등의 진흥에 관한 법률」 제2조제1호가목ㆍ다목 및 같은 조 제2호에 따른 일반일간신문, 일반주간신문 또는 인터넷신문에 싣는 방법\n3. 같은 제목으로 연 2회 이상 발행하여 정보주체에게 배포하는 간행물ㆍ소식지ㆍ홍보지 또는 청구서 등에 지속적으로 싣는 방법\n4. 재화나 서비스를 제공하기 위하여 개인정보처리자와 정보주체가 작성한 계약서 등에 실어 정보주체에게 발급하는 방법\n제31조(개인정보 처리방침의 내용 및 공개방법 등)","kind":"D"},{"id":"D:31-2","label":"영 제31조의2","title":"개인정보 처리방침의 평가 대상 및 절차","chapter":"제5장 개인정보의 안전한 관리","deleted":false,"text":"① 보호위원회는 법 제30조의2제1항에 따라 개인정보 처리방침을 평가하는 경우 다음 각 호의 사항을 종합적으로 고려하여 평가 대상을 선정한다. <개정 2024.3.12>\n1. 개인정보처리자의 유형 및 매출액(매출액을 산정하지 않는 경우에는 「법인세법」 제4조제3항제1호에 따른 수익사업에서 생기는 소득을 말하며, 이하 제32조 및 제48조의7에서 \"매출액등\"이라 한다) 규모\n2. 민감정보 및 고유식별정보 등 처리하는 개인정보의 유형 및 규모\n3. 개인정보 처리의 법적 근거 및 방식\n4. 법 위반행위 발생 여부\n5. 아동ㆍ청소년 등 정보주체의 특성\n② 보호위원회는 제1항에 따라 평가 대상 개인정보 처리방침을 선정한 경우에는 평가 개시 10일 전까지 해당 개인정보처리자에게 평가 내용ㆍ일정 및 절차 등이 포함된 평가계획을 통보해야 한다.\n③ 보호위원회는 법 제30조의2에 따른 개인정보 처리방침의 평가에 필요한 경우에는 해당 개인정보처리자에게 의견을 제출하도록 요청할 수 있다.\n④ 보호위원회는 법 제30조의2에 따라 개인정보 처리방침을 평가한 후 그 결과를 지체 없이 해당 개인정보처리자에게 통보해야 한다.\n⑤ 제1항부터 제4항까지에서 규정한 사항 외에 개인정보 처리방침 평가를 위한 세부적인 대상 선정 기준과 절차는 보호위원회가 정하여 고시한다.\n제31조의2(개인정보 처리방침의 평가 대상 및 절차)","kind":"D"},{"id":"D:32","label":"영 제32조","title":"개인정보 보호책임자의 지정 등","chapter":"제5장 개인정보의 안전한 관리","deleted":false,"text":"① 법 제31조제1항 단서에서 \"종업원 수, 매출액 등이 대통령령으로 정하는 기준에 해당하는 개인정보처리자\"란 「소상공인기본법」 제2조제1항에 따른 소상공인에 해당하는 개인정보처리자를 말한다. <신설 2024.3.12>\n② 개인정보처리자는 법 제31조제1항에 따라 개인정보 보호책임자를 지정하려는 경우에는 다음 각 호의 구분에 따라 지정해야 한다. 이 경우 제3항에 따른 개인정보처리자는 다음 각 호의 구분에 따른 사람 중 별표 1에 따른 개인정보 보호책임자의 자격을 갖춘 사람을 개인정보 보호책임자로 지정해야 한다. <개정 2016.7.22, 2024.3.12, 2026.9.10>\n1. 공공기관: 다음 각 목의 구분에 따른 기준에 해당하는 공무원 등\n가. 국회, 법원, 헌법재판소, 중앙선거관리위원회의 행정사무를 처리하는 기관 및 중앙행정기관: 고위공무원단에 속하는 공무원(이하 \"고위공무원\"이라 한다) 또는 그에 상당하는 공무원\n나. 가목 외에 정무직공무원을 장(長)으로 하는 국가기관: 3급 이상 공무원(고위공무원을 포함한다) 또는 그에 상당하는 공무원\n다. 가목 및 나목 외에 고위공무원, 3급 공무원 또는 그에 상당하는 공무원 이상의 공무원을 장으로 하는 국가기관: 4급 이상 공무원 또는 그에 상당하는 공무원\n라. 가목부터 다목까지의 규정에 따른 국가기관 외의 국가기관(소속 기관을 포함한다): 해당 기관의 개인정보 처리 관련 업무를 담당하는 부서의 장\n마. 시ㆍ도 및 시ㆍ도 교육청: 3급 이상 공무원 또는 그에 상당하는 공무원\n바. 시ㆍ군 및 자치구: 4급 이상 공무원 또는 그에 상당하는 공무원\n사. 제2조제5호에 따른 각급 학교: 해당 학교의 행정사무를 총괄하는 사람. 다만, 제3항제2호에 해당하는 경우에는 교직원을 말한다.\n아. 가목부터 사목까지의 규정에 따른 기관 외의 공공기관: 개인정보 처리 관련 업무를 담당하는 부서의 장. 다만, 개인정보 처리 관련 업무를 담당하는 부서의 장이 2명 이상인 경우에는 해당 공공기관의 장이 지명하는 부서의 장이 된다.\n2. 공공기관 외의 개인정보처리자: 다음 각 목의 어느 하나에 해당하는 사람\n가. 사업주 또는 대표자\n나. 임원(「상법」 제401조의2제1항제3호에 따라 회사의 업무를 집행한 자와 같은 법 제408조의2제1항에 따른 집행임원을 포함하며, 임원이 없는 경우에는 개인정보 처리 관련 업무를 담당하는 부서의 장을 말한다)\n③ 법 제31조제3항 각 호 외의 부분에서 \"대통령령으로 정하는 기준에 해당하는 개인정보처리자\"란 다음 각 호의 어느 하나에 해당하는 개인정보처리자(공공기관의 경우에는 제2조제2호, 제3호, 제3호의2, 제4호 및 제5호에 해당하는 경우로 한정한다)를 말한다. <신설 2026.9.10>\n1. 연간 매출액등이 1,800억원을 초과하는 자(제2조제5호에 따른 각급 학교 및 「의료법」 제3조에 따른 의료기관은 제외한다)로서 다음 각 목의 어느 하나에 해당하는 자\n가. 5만명 이상의 정보주체에 관하여 민감정보 또는 고유식별정보를 처리하는 자\n나. 100만명 이상의 정보주체에 관하여 개인정보를 처리하는 자\n2. 전년도 말 기준 재학생 수(대학원 재학생 수를 포함한다)가 2만명 이상인 「고등교육법」 제2조에 따른 학교\n3. 「의료법」 제3조의4에 따른 상급종합병원\n4. 공공시스템운영기관\n④ 제3항에 따른 개인정보처리자는 법 제31조제3항제2호에 따라 개인정보 보호책임자를 지정ㆍ변경 또는 해제하는 경우 그 사유가 발생한 날부터 6개월 이내에 보호위원회 고시로 정하는 개인정보 보호책임자 지정ㆍ변경ㆍ해제 신고서를 보호위원회에 제출해야 한다. 다만, 보호위원회는 경영상의 이유로 이사회가 소집되기 어려운 경우 등 부득이한 사유로 기간 내에 신고서를 제출할 수 없다고 인정하는 경우 개인정보처리자의 요청에 따라 1년의 범위에서 기간을 연장할 수 있다. <개정 2026.9.10>\n⑤ 법 제31조제4항제9호에서 \"대통령령으로 정한 업무\"란 다음 각 호와 같다. <개정 2024.3.12, 2026.9.10>\n1. 법 제30조에 따른 개인정보 처리방침의 수립ㆍ변경 및 시행\n2. 개인정보 처리와 관련된 인적ㆍ물적 자원 및 정보의 관리\n3. 처리 목적이 달성되거나 보유기간이 지난 개인정보의 파기\n⑥ 보호위원회는 개인정보 보호책임자가 법 제31조제4항의 업무를 원활히 수행할 수 있도록 개인정보 보호책임자에 대한 교육과정을 개설ㆍ운영하는 등 지원을 할 수 있다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.8.4, 2024.3.12, 2026.9.10>\n⑦ 개인정보처리자(법 제31조제2항에 따라 사업주 또는 대표자가 개인정보 보호책임자가 되는 경우는 제외한다)는 법 제31조제7항에 따른 개인정보 보호책임자의 독립성 보장을 위해 다음 각 호의 사항을 준수해야 한다. <신설 2024.3.12, 2026.9.10>\n1. 개인정보 처리와 관련된 정보에 대한 개인정보 보호책임자의 접근 보장\n2. 개인정보 보호책임자가 개인정보 보호 계획의 수립ㆍ시행 및 그 결과에 관하여 정기적으로 대표자 또는 이사회에 직접 보고할 수 있는 체계의 구축\n3. 개인정보 보호책임자의 업무 수행에 적합한 조직체계의 마련 및 인적ㆍ물적 자원의 제공\n제32조(개인정보 보호책임자의 지정 등)","kind":"D"},{"id":"D:32-2","label":"영 제32조의2","title":"개인정보 보호책임자 협의회의 사업 범위 등","chapter":"제5장 개인정보의 안전한 관리","deleted":false,"text":"① 법 제31조제8항에서 \"대통령령으로 정하는 공동의 사업\"이란 다음 각 호의 사업을 말한다. <개정 2026.9.10>\n1. 개인정보처리자의 개인정보 보호 강화를 위한 정책의 조사, 연구 및 수립 지원\n2. 개인정보 침해사고 분석 및 대책 연구\n3. 개인정보 보호책임자 지정ㆍ운영, 업무 수행 현황 등 실태 파악 및 제도 개선을 위한 연구\n4. 개인정보 보호책임자 교육 등 개인정보 보호책임자의 개인정보 보호 역량 및 전문성 향상\n5. 개인정보 보호책임자의 업무와 관련된 국내외 주요 동향의 조사, 분석 및 공유\n6. 그 밖에 개인정보처리시스템 등의 안전한 관리를 위해 필요한 사업\n② 보호위원회는 법 제31조제9항에 따라 예산의 범위에서 개인정보 보호책임자 협의회의 운영과 사업에 필요한 행정적ㆍ기술적 지원을 할 수 있다. <개정 2026.9.10>\n제32조의2(개인정보 보호책임자 협의회의 사업 범위 등)","kind":"D"},{"id":"D:32-3","label":"영 제32조의3","title":"국내대리인 지정 대상자의 범위 등","chapter":"제5장 개인정보의 안전한 관리","deleted":false,"text":"① 법 제31조의2제1항 각 호 외의 부분 전단에서 \"대통령령으로 정하는 자\"란 다음 각 호의 어느 하나에 해당하는 자를 말한다.\n1. 전년도(법인인 경우에는 전 사업연도를 말한다) 전체 매출액이 1조원 이상인 자\n2. 전년도 말 기준 직전 3개월 간 그 개인정보가 저장ㆍ관리되고 있는 국내 정보주체의 수가 일일평균 100만명 이상인 자\n3. 법 제63조제1항에 따라 관계 물품ㆍ서류 등 자료의 제출을 요구받은 자로서 국내대리인을 지정할 필요가 있다고 보호위원회가 심의ㆍ의결한 자\n② 제1항제1호에 따른 전체 매출액은 전년도 평균환율을 적용하여 원화로 환산한 금액을 기준으로 한다.\n③ 법 제31조의2제2항제2호에서 \"대통령령으로 정하는 법인\"이란 다음 각 호의 어느 하나에 해당하는 법인을 말한다. <신설 2025.9.23>\n1. 해당 개인정보처리자가 대표이사를 임면하거나 임원의 100분의 50 이상을 선임하거나 선임할 수 있는 법인\n2. 해당 개인정보처리자가 발행주식총수 또는 출자총액의 100분의 30 이상을 출자한 법인\n④ 법 제31조의2제1항에 따라 국내대리인을 지정한 개인정보처리자는 같은 조 제3항에 따라 국내대리인이 업무를 충실히 수행하도록 다음 각 호에 따라 관리ㆍ감독해야 한다. <신설 2025.9.23>\n1. 국내대리인에 대하여 연 1회 이상 국내대리인의 업무에 대한 교육 실시\n2. 다음 각 목의 사항에 대한 점검\n가. 국내대리인이 업무수행에 대한 계획을 수립하였는지 여부\n나. 국내대리인이 업무수행에 대한 계획을 이행하였는지 여부\n다. 나목에 따른 계획 이행 여부 점검 결과 개선이 필요한 사항을 개선하였는지 여부\n제32조의3(국내대리인 지정 대상자의 범위 등)","kind":"D"},{"id":"D:33","label":"영 제33조","title":"개인정보파일의 등록사항 등","chapter":"제5장 개인정보의 안전한 관리","deleted":false,"text":"① 법 제32조제1항제7호에서 \"대통령령으로 정하는 사항\"이란 다음 각 호의 사항을 말한다. <개정 2023.9.12>\n1. 개인정보파일을 운용하는 공공기관의 명칭\n2. 개인정보파일로 보유하고 있는 개인정보의 정보주체 수\n3. 해당 공공기관에서 개인정보 처리 관련 업무를 담당하는 부서\n4. 제41조에 따른 개인정보의 열람 요구를 접수ㆍ처리하는 부서\n5. 개인정보파일의 개인정보 중 법 제35조제4항에 따라 열람을 제한하거나 거절할 수 있는 개인정보의 범위 및 제한 또는 거절 사유\n② 법 제32조제2항제4호에서 \"대통령령으로 정하는 개인정보파일\"이란 다음 각 호의 어느 하나에 해당하는 개인정보파일을 말한다. <신설 2023.9.12>\n1. 회의 참석 수당 지급, 자료ㆍ물품의 송부, 금전의 정산 등 단순 업무 수행을 위해 운영되는 개인정보파일로서 지속적 관리 필요성이 낮은 개인정보파일\n2. 공중위생 등 공공의 안전과 안녕을 위하여 긴급히 필요한 경우로서 일시적으로 처리되는 개인정보파일\n3. 그 밖에 일회적 업무 처리만을 위해 수집된 개인정보파일로서 저장되거나 기록되지 않는 개인정보파일\n제33조(개인정보파일의 등록사항 등)","kind":"D"},{"id":"D:34","label":"영 제34조","title":"개인정보파일의 등록 및 공개 등","chapter":"제5장 개인정보의 안전한 관리","deleted":false,"text":"① 개인정보파일(법 제32조제2항 및 이 영 제33조제2항에 따른 개인정보파일은 제외한다. 이하 이 조에서 같다)을 운용하는 공공기관의 장은 그 운용을 시작한 날부터 60일 이내에 보호위원회가 정하여 고시하는 바에 따라 보호위원회에 법 제32조제1항 및 이 영 제33조제1항에 따른 등록사항(이하 \"등록사항\"이라 한다)의 등록을 신청하여야 한다. 등록 후 등록한 사항이 변경된 경우에도 또한 같다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.8.4, 2023.9.12>\n② 보호위원회는 법 제32조제4항에 따라 개인정보파일의 등록 현황을 공개하는 경우 이를 보호위원회가 구축하는 인터넷 사이트에 게재해야 한다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.8.4, 2023.9.12>\n③ 보호위원회는 제1항에 따른 개인정보파일의 등록사항을 등록하거나 변경하는 업무를 전자적으로 처리할 수 있도록 시스템을 구축ㆍ운영할 수 있다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.8.4>\n제34조(개인정보파일의 등록 및 공개 등)","kind":"D"},{"id":"D:34-2","label":"영 제34조의2","title":"개인정보 보호 인증의 기준ㆍ방법ㆍ절차 등","chapter":"제5장 개인정보의 안전한 관리","deleted":false,"text":"① 보호위원회는 제30조제1항 각 호의 사항을 고려하여 개인정보 보호의 관리적ㆍ기술적ㆍ물리적 보호대책의 수립 등을 포함한 법 제32조의2제1항에 따른 인증의 기준을 정하여 고시한다. <개정 2017.7.26, 2020.8.4, 2023.9.12>\n② 법 제32조의2제1항에 따라 개인정보 보호 인증을 받으려는 자(이하 이 조 및 제34조의3에서 \"신청인\"이라 한다)는 다음 각 호의 사항이 포함된 개인정보 보호 인증신청서(전자문서로 된 신청서를 포함한다)를 제34조의6에 따른 개인정보 보호 인증 전문기관(이하 \"인증기관\"이라 한다)에 제출하여야 한다. <개정 2024.3.12, 2026.9.10>\n1. 인증 대상 개인정보 처리시스템의 목록\n2. 개인정보 관리체계를 수립ㆍ운영하는 방법과 절차\n3. 개인정보 관리체계 및 보호대책 구현과 관련되는 문서 목록\n③ 인증기관은 제2항에 따른 인증신청서를 받은 경우에는 신청인과 인증의 범위 및 일정 등에 관하여 협의하여야 한다.\n④ 법 제32조의2제1항에 따른 개인정보 보호 인증심사는 제34조의8에 따른 개인정보 보호 인증심사원이 서면심사 또는 현장심사의 방법으로 실시한다.\n⑤ 인증기관은 제4항에 따른 인증심사의 결과를 심의하기 위하여 정보보호에 관한 학식과 경험이 풍부한 사람을 위원으로 하는 인증위원회를 설치ㆍ운영하여야 한다.\n⑥ 제1항부터 제5항까지에서 규정한 사항 외에 인증신청, 인증심사, 인증위원회의 설치ㆍ운영 및 인증서의 발급 등 개인정보 보호 인증에 필요한 세부사항은 보호위원회가 정하여 고시한다. <개정 2017.7.26, 2020.8.4>\n제34조의2(개인정보 보호 인증의 기준ㆍ방법ㆍ절차 등)","kind":"D"},{"id":"D:34-3","label":"영 제34조의3","title":"개인정보 보호 인증의 수수료","chapter":"제5장 개인정보의 안전한 관리","deleted":false,"text":"① 신청인은 인증기관에 개인정보 보호 인증 심사에 소요되는 수수료를 납부하여야 한다.\n② 보호위원회는 개인정보 보호 인증 심사에 투입되는 인증 심사원의 수 및 인증심사에 필요한 일수 등을 고려하여 제1항에 따른 수수료 산정을 위한 구체적인 기준을 정하여 고시한다. <개정 2017.7.26, 2020.8.4>\n제34조의3(개인정보 보호 인증의 수수료)","kind":"D"},{"id":"D:34-4","label":"영 제34조의4","title":"인증취소","chapter":"제5장 개인정보의 안전한 관리","deleted":false,"text":"① 인증기관은 법 제32조의2제3항에 따라 개인정보 보호 인증을 취소하려는 경우에는 제34조의2제5항에 따른 인증위원회의 심의ㆍ의결을 거쳐야 한다.\n② 보호위원회 또는 인증기관은 법 제32조의2제3항에 따라 인증을 취소한 경우에는 그 사실을 당사자에게 통보하고, 관보 또는 인증기관의 홈페이지에 공고하거나 게시해야 한다. <개정 2017.7.26, 2020.8.4>\n제34조의4(인증취소)","kind":"D"},{"id":"D:34-5","label":"영 제34조의5","title":"인증의 사후관리","chapter":"제5장 개인정보의 안전한 관리","deleted":false,"text":"① 법 제32조의2제4항에 따른 사후관리 심사는 서면심사 또는 현장심사의 방법으로 실시한다.\n② 인증기관은 제1항에 따른 사후관리를 실시한 결과 법 제32조의2제3항 각 호의 사유를 발견한 경우에는 제34조의2제5항에 따른 인증위원회의 심의를 거쳐 그 결과를 보호위원회에 제출해야 한다. <개정 2017.7.26, 2020.8.4>\n제34조의5(인증의 사후관리)","kind":"D"},{"id":"D:34-6","label":"영 제34조의6","title":"개인정보 보호 인증 전문기관","chapter":"제5장 개인정보의 안전한 관리","deleted":false,"text":"① 법 제32조의2제5항에서 \"대통령령으로 정하는 전문기관\"이란 다음 각 호의 기관을 말한다. <개정 2016.9.29, 2017.7.26, 2020.8.4>\n1. 한국인터넷진흥원\n2. 다음 각 목의 요건을 모두 충족하는 법인, 단체 또는 기관 중에서 보호위원회가 지정ㆍ고시하는 법인, 단체 또는 기관\n가. 제34조의8에 따른 개인정보 보호 인증심사원 5명 이상을 보유할 것\n나. 보호위원회가 실시하는 업무수행 요건ㆍ능력 심사에서 적합하다고 인정받을 것\n② 제1항제2호에 해당하는 법인, 단체 또는 기관의 지정과 그 지정의 취소에 필요한 세부기준 등은 보호위원회가 정하여 고시한다. <개정 2017.7.26, 2020.8.4>\n제34조의6(개인정보 보호 인증 전문기관)","kind":"D"},{"id":"D:34-7","label":"영 제34조의7","title":"인증의 표시 및 홍보","chapter":"제5장 개인정보의 안전한 관리","deleted":false,"text":"제34조의7(인증의 표시 및 홍보) 법 제32조의2제6항에 따라 인증을 받은 자가 인증 받은 내용을 표시하거나 홍보하려는 경우에는 보호위원회가 정하여 고시하는 개인정보 보호 인증표시를 사용할 수 있다. 이 경우 인증의 범위와 유효기간을 함께 표시해야 한다. <개정 2017.7.26, 2020.8.4>","kind":"D"},{"id":"D:34-8","label":"영 제34조의8","title":"개인정보 보호 인증심사원의 자격 및 자격 취소 요건","chapter":"제5장 개인정보의 안전한 관리","deleted":false,"text":"① 인증기관은 법 제32조의2제7항에 따라 개인정보 보호에 관한 전문지식을 갖춘 사람으로서 인증심사에 필요한 전문 교육과정을 이수하고 시험에 합격한 사람에게 개인정보 보호 인증심사원(이하 \"인증심사원\"이라 한다)의 자격을 부여한다.\n② 인증기관은 법 제32조의2제7항에 따라 인증심사원이 다음 각 호의 어느 하나에 해당하는 경우 그 자격을 취소할 수 있다. 다만, 제1호에 해당하는 경우에는 자격을 취소하여야 한다.\n1. 거짓이나 부정한 방법으로 인증심사원 자격을 취득한 경우\n2. 개인정보 보호 인증 심사와 관련하여 금전, 금품, 이익 등을 부당하게 수수한 경우\n3. 개인정보 보호 인증 심사 과정에서 취득한 정보를 누설하거나 정당한 사유 없이 업무상 목적 외의 용도로 사용한 경우\n③ 제1항 및 제2항에 따른 전문 교육과정의 이수, 인증심사원 자격의 부여 및 취소 등에 관한 세부 사항은 보호위원회가 정하여 고시한다. <개정 2017.7.26, 2020.8.4>\n제34조의8(개인정보 보호 인증심사원의 자격 및 자격 취소 요건)","kind":"D"},{"id":"D:35","label":"영 제35조","title":"개인정보 영향평가의 대상","chapter":"제5장 개인정보의 안전한 관리","deleted":false,"text":"1. 구축ㆍ운용 또는 변경하려는 개인정보파일로서 5만명 이상의 정보주체에 관한 민감정보 또는 고유식별정보의 처리가 수반되는 개인정보파일\n2. 구축ㆍ운용하고 있는 개인정보파일을 해당 공공기관 내부 또는 외부에서 구축ㆍ운용하고 있는 다른 개인정보파일과 연계하려는 경우로서 연계 결과 50만명 이상의 정보주체에 관한 개인정보가 포함되는 개인정보파일\n3. 구축ㆍ운용 또는 변경하려는 개인정보파일로서 100만명 이상의 정보주체에 관한 개인정보파일\n4. 법 제33조제1항에 따른 개인정보 영향평가(이하 \"영향평가\"라 한다)를 받은 후에 개인정보 검색체계 등 개인정보파일의 운용체계를 변경하려는 경우 그 개인정보파일. 이 경우 영향평가 대상은 변경된 부분으로 한정한다.\n제35조(개인정보 영향평가의 대상) 법 제33조제1항에서 \"대통령령으로 정하는 기준에 해당하는 개인정보파일\"이란 개인정보를 전자적으로 처리할 수 있는 개인정보파일로서 다음 각 호의 어느 하나에 해당하는 개인정보파일을 말한다. <개정 2016.9.29>","kind":"D"},{"id":"D:36","label":"영 제36조","title":"평가기관의 지정 및 지정취소","chapter":"제5장 개인정보의 안전한 관리","deleted":false,"text":"① 보호위원회는 법 제33조제2항에 따라 다음 각 호의 요건을 모두 갖춘 법인을 개인정보 영향평가기관(이하 \"평가기관\"이라 한다)으로 지정할 수 있다. <개정 2013.3.23, 2014.11.19, 2015.12.22, 2017.7.26, 2020.8.4, 2023.9.12>\n1. 최근 5년간 다음 각 목의 어느 하나에 해당하는 업무 수행의 대가로 받은 금액의 합계액이 2억원 이상인 법인\n가. 영향평가 업무 또는 이와 유사한 업무\n나. 「전자정부법」 제2조제13호에 따른 정보시스템(정보보호시스템을 포함한다)의 구축 업무 중 정보보호컨설팅 업무(전자적 침해행위에 대비하기 위한 정보시스템의 분석ㆍ평가와 이에 기초한 정보 보호 대책의 제시 업무를 말한다. 이하 같다)\n다. 「전자정부법」 제2조제14호에 따른 정보시스템 감리 업무 중 정보보호컨설팅 업무\n라. 「정보보호산업의 진흥에 관한 법률」 제2조제1항제2호에 따른 정보보호산업에 해당하는 업무 중 정보보호컨설팅 업무\n마. 「정보보호산업의 진흥에 관한 법률」 제23조제1항제1호 및 제2호에 따른 업무\n2. 개인정보 영향평가와 관련된 분야에서의 업무 경력 등 보호위원회가 정하여 고시하는 자격을 갖춘 전문인력을 10명 이상 상시 고용하고 있는 법인\n3. 다음 각 목의 사무실 및 설비를 갖춘 법인\n가. 신원 확인 및 출입 통제를 위한 설비를 갖춘 사무실\n나. 기록 및 자료의 안전한 관리를 위한 설비\n② 평가기관으로 지정받으려는 자는 보호위원회가 정하여 고시하는 평가기관 지정신청서에 다음 각 호의 서류를 첨부하여 보호위원회에 제출해야 한다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2017.10.17, 2020.8.4>\n1. 정관\n2. 대표자의 성명\n3. 제1항제2호에 따른 전문인력의 자격을 증명할 수 있는 서류\n4. 그 밖에 보호위원회가 정하여 고시하는 서류\n③ 제2항에 따라 평가기관 지정신청서를 제출받은 보호위원회는 「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 다음 각 호의 서류를 확인해야 한다. 다만, 신청인이 제2호의 확인에 동의하지 않는 경우에는 신청인에게 그 서류를 첨부하게 해야 한다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.8.4>\n1. 법인 등기사항증명서\n2. 「출입국관리법」 제88조제2항에 따른 외국인등록 사실증명(외국인인 경우만 해당한다)\n④ 보호위원회는 제1항에 따라 평가기관을 지정한 경우에는 지체 없이 평가기관 지정서를 발급하고, 다음 각 호의 사항을 관보에 고시해야 한다. 고시된 사항이 변경된 경우에도 또한 같다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.8.4>\n1. 평가기관의 명칭ㆍ주소 및 전화번호와 대표자의 성명\n2. 지정 시 조건을 붙이는 경우 그 조건의 내용\n⑤ 법 제33조제7항제5호에서 \"대통령령으로 정하는 사유에 해당하는 경우\"란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2023.9.12>\n1. 제6항에 따른 신고의무를 이행하지 않은 경우\n2. 평가기관으로 지정된 날부터 2년 이상 계속하여 정당한 사유 없이 영향평가 실적이 없는 경우\n3. 제38조제2항 각 호 외의 부분에 따른 영향평가서 등 영향평가 업무 수행 과정에서 알게 된 정보를 누설한 경우\n4. 그 밖에 법 또는 이 영에 따른 의무를 위반한 경우\n⑥ 제1항에 따라 지정된 평가기관은 지정된 후 다음 각 호의 어느 하나에 해당하는 사유가 발생한 경우에는 보호위원회가 정하여 고시하는 바에 따라 그 사유가 발생한 날부터 14일 이내에 보호위원회에 신고해야 한다. 다만, 제3호에 해당하는 경우에는 그 사유가 발생한 날부터 60일 이내에 신고해야 한다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2017.10.17, 2020.8.4>\n1. 제1항 각 호의 어느 하나에 해당하는 사항이 변경된 경우\n2. 제4항제1호에 해당하는 사항이 변경된 경우\n3. 평가기관을 양도ㆍ양수하거나 합병하는 등의 사유가 발생한 경우\n⑦ 삭제 <2023.9.12>\n제36조(평가기관의 지정 및 지정취소)","kind":"D"},{"id":"D:37","label":"영 제37조","title":"영향평가 시 고려사항","chapter":"제5장 개인정보의 안전한 관리","deleted":false,"text":"1. 민감정보 또는 고유식별정보의 처리 여부\n2. 개인정보 보유기간\n제37조(영향평가 시 고려사항) 법 제33조제3항제4호에서 \"대통령령으로 정한 사항\"이란 다음 각 호의 사항을 말한다. <개정 2023.9.12>","kind":"D"},{"id":"D:38","label":"영 제38조","title":"영향평가의 평가기준 등","chapter":"제5장 개인정보의 안전한 관리","deleted":false,"text":"① 법 제33조제9항에 따른 영향평가의 기준(이하 \"평가기준\"이라 한다)은 다음 각 호와 같다. <개정 2016.7.22, 2023.9.12>\n1. 해당 개인정보파일에 포함되는 개인정보의 종류ㆍ성질, 정보주체의 수 및 그에 따른 개인정보 침해의 가능성\n2. 법 제23조제2항, 제24조제3항, 제24조의2제2항, 제25조제6항(제25조의2제4항에 따라 준용되는 경우를 포함한다) 및 제29조에 따른 안전성 확보 조치의 수준 및 이에 따른 개인정보 침해의 가능성\n3. 개인정보 침해의 위험요인별 조치 여부\n4. 그 밖에 법 및 이 영에 따라 필요한 조치 또는 의무 위반 요소에 관한 사항\n② 법 제33조제2항에 따라 영향평가를 의뢰받은 평가기관은 평가기준에 따라 개인정보파일의 운용으로 인한 개인정보 침해의 위험요인을 분석ㆍ평가한 후 다음 각 호의 사항이 포함된 평가 결과를 영향평가서로 작성하여 해당 공공기관의 장에게 보내야 하며, 공공기관의 장은 제35조 각 호에 해당하는 개인정보파일을 운용 또는 변경하기 전에 그 영향평가서를 보호위원회에 제출해야 한다. <개정 2023.9.12>\n1. 영향평가의 대상 및 범위\n2. 평가 분야 및 항목\n3. 평가기준에 따른 개인정보 침해의 위험요인에 대한 분석ㆍ평가\n4. 제3호의 분석ㆍ평가 결과에 따라 조치한 내용 및 개선계획\n5. 영향평가의 결과\n6. 제1호부터 제5호까지의 사항에 대하여 요약한 내용\n③ 보호위원회 또는 공공기관의 장은 제2항제6호에 따른 영향평가서 요약 내용을 공개할 수 있다. <신설 2023.9.12>\n④ 보호위원회는 법 및 이 영에서 정한 사항 외에 평가기관의 지정 및 영향평가의 절차 등에 관한 세부 기준을 정하여 고시할 수 있다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.8.4, 2023.9.12>\n제38조(영향평가의 평가기준 등)","kind":"D"},{"id":"D:39","label":"영 제39조","title":"개인정보 유출 등의 통지","chapter":"제5장 개인정보의 안전한 관리","deleted":false,"text":"① 개인정보처리자는 개인정보가 유출등이 되었음을 알게 되었을 때에는 서면등의 방법으로 72시간 이내에 법 제34조제1항 각 호의 사항을 정보주체에게 알려야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 해당 사유가 해소된 후 즉시 정보주체에게 알릴 수 있다. <개정 2026.9.10>\n1. 유출등이 된 개인정보의 확산 및 추가 유출등을 방지하기 위하여 접속경로의 차단, 취약점 점검ㆍ보완, 유출등이 된 개인정보의 회수ㆍ삭제 등 긴급한 조치가 필요한 경우\n2. 천재지변이나 그 밖에 부득이한 사유로 인하여 72시간 이내에 통지하기 곤란한 경우\n② 제1항에도 불구하고 개인정보처리자는 같은 항에 따른 통지를 하려는 경우로서 법 제34조제1항제1호 또는 제2호의 사항에 관한 구체적인 내용을 확인하지 못한 경우에는 개인정보가 유출등이 된 사실, 그 때까지 확인된 내용 및 같은 항 제3호부터 제6호까지의 사항을 서면등의 방법으로 우선 통지해야 하며, 추가로 확인되는 내용에 대해서는 확인되는 즉시 통지해야 한다. <개정 2024.3.12, 2026.9.10>\n③ 제1항 및 제2항에도 불구하고 개인정보처리자는 정보주체의 연락처를 알 수 없는 경우 등 정당한 사유가 있는 경우에는 법 제34조제1항 각 호 외의 부분 단서에 따라 같은 항 각 호의 사항을 정보주체가 쉽게 알 수 있도록 자신의 인터넷 홈페이지에 30일 이상 게시하는 것으로 제1항 및 제2항의 통지를 갈음할 수 있다. 다만, 인터넷 홈페이지를 운영하지 아니하는 개인정보처리자의 경우에는 사업장등의 보기 쉬운 장소에 법 제34조제1항 각 호의 사항을 30일 이상 게시하는 것으로 제1항 및 제2항의 통지를 갈음할 수 있다.\n제39조(개인정보 유출 등의 통지)","kind":"D"},{"id":"D:39-2","label":"영 제39조의2","title":"개인정보 유출등의 가능성 통지 대상","chapter":"제5장 개인정보의 안전한 관리","deleted":false,"text":"① 법 제34조제2항에서 \"대통령령으로 정하는 유출등의 가능성이 있음을 알게 되었을 때\"란 다음 각 호의 구분에 따른 때를 말한다.\n1. 개인정보처리시스템 또는 개인정보취급자가 개인정보 처리에 이용하는 정보기기에 대한 불법적인 접근이 발생하여 개인정보 유출등이 의심되는 정황이 있으나 그 개인정보의 정보주체를 특정하기 곤란한 경우: 해당 불법적인 접근을 알게 된 때\n2. 개인정보처리자가 처리하는 개인정보가 법, 이 영 또는 개인정보 보호에 관한 다른 법령을 위반하여 제3자에 의해 거래되는 등 일부 개인정보가 유출등이 된 사실이 확인된 경우로서 다른 정보주체에 관한 개인정보도 유출등이 되었을 수 있다고 인정되는 경우: 해당 사실을 알게 된 때\n② 법 제34조제2항에서 \"피해를 최소화하기 위한 정보 등 대통령령으로 정하는 사항\"이란 다음 각 호의 사항을 말한다.\n1. 유출등의 가능성이 있는 개인정보의 항목\n2. 유출등이 있었을 것으로 의심 또는 인정되는 시점과 그 경위\n3. 법 제34조제1항제3호부터 제5호까지의 사항\n4. 유출등의 여부가 확정될 경우 추가 통지를 하겠다는 사실\n제39조의2(개인정보 유출등의 가능성 통지 대상)","kind":"D"},{"id":"D:39-3","label":"영 제39조의3","title":"개인정보 유출등의 가능성 통지 시기ㆍ방법 등","chapter":"제5장 개인정보의 안전한 관리","deleted":false,"text":"① 개인정보처리자는 법 제34조제2항에 따라 제39조의2제2항 각 호의 사항을 통지하려는 경우 같은 조 제1항 각 호의 구분에 따른 때부터 72시간 이내에 서면등의 방법으로 통지해야 한다. 다만, 천재지변이나 그 밖에 부득이한 사유로 기한 내에 통지하기 곤란한 경우에는 해당 사유가 해소된 후 즉시 통지해야 한다.\n② 개인정보처리자는 제1항에 따른 기한 내에 개인정보가 실제로 유출등이 된 사실을 확인한 경우에는 법 제34조제2항에 따른 통지에 갈음하여 같은 조 제1항에 따른 통지를 해야 한다.\n③ 법 제34조제2항에 따른 통지를 한 개인정보처리자는 개인정보가 실제로 유출등이 되지 않은 사실을 확인한 경우 즉시 정보주체에게 그 사실을 통지해야 한다.\n④ 개인정보처리자는 법 제34조제2항 또는 이 조 제3항에 따른 통지의 대상인 정보주체의 연락처를 알 수 없는 경우 등 정당한 사유가 있는 경우에는 개인정보 유출등의 가능성(제39조의2제2항 각 호의 사항을 포함한다) 또는 개인정보가 실제로 유출등이 되지 않은 사실을 정보주체가 쉽게 알 수 있도록 자신의 인터넷 홈페이지에 30일 이상 게시하는 것으로 법 제34조제2항 및 이 조 제3항의 통지를 갈음할 수 있다. 다만, 인터넷 홈페이지를 운영하지 않는 개인정보처리자의 경우에는 사업장등의 보기 쉬운 장소에 30일 이상 게시하는 것으로 법 제34조제2항 및 이 조 제3항의 통지를 갈음할 수 있다.\n제39조의3(개인정보 유출등의 가능성 통지 시기ㆍ방법 등)","kind":"D"},{"id":"D:40","label":"영 제40조","title":"개인정보 유출 등의 신고","chapter":"제5장 개인정보의 안전한 관리","deleted":false,"text":"① 개인정보처리자는 다음 각 호의 어느 하나에 해당하는 경우로서 개인정보가 유출등이 되었음을 알게 되었을 때에는 72시간 이내에 법 제34조제1항 각 호의 사항을 서면등의 방법으로 보호위원회 또는 같은 조 제4항 전단에 따른 전문기관에 신고해야 한다. 다만, 천재지변이나 그 밖에 부득이한 사유로 인하여 72시간 이내에 신고하기 곤란한 경우에는 해당 사유가 해소된 후 즉시 신고할 수 있으며, 개인정보 유출등의 경로가 확인되어 해당 개인정보를 회수ㆍ삭제하는 등의 조치를 통해 정보주체의 권익 침해 가능성이 현저히 낮아진 경우에는 신고하지 않을 수 있다. <개정 2026.9.10>\n1. 1천명 이상의 정보주체에 관한 개인정보가 유출등이 된 경우\n2. 민감정보 또는 고유식별정보가 유출등이 된 경우\n3. 개인정보처리시스템 또는 개인정보취급자가 개인정보 처리에 이용하는 정보기기에 대한 외부로부터의 불법적인 접근에 의해 개인정보가 유출등이 된 경우\n② 제1항에도 불구하고 개인정보처리자는 제1항에 따른 신고를 하려는 경우로서 법 제34조제1항제1호 또는 제2호의 사항에 관한 구체적인 내용을 확인하지 못한 경우에는 개인정보가 유출등이 된 사실, 그때까지 확인된 내용 및 같은 항 제3호부터 제5호까지의 사항을 서면등의 방법으로 우선 신고해야 하며, 추가로 확인되는 내용에 대해서는 확인되는 즉시 신고해야 한다.\n③ 법 제34조제3항 전단 및 후단에서 \"대통령령으로 정하는 전문기관\"이란 각각 한국인터넷진흥원을 말한다.\n제40조(개인정보 유출 등의 신고)","kind":"D"},{"id":"D:40-2","label":"영 제40조의2","title":"노출된 개인정보의 삭제ㆍ차단 요청 기관","chapter":"제5장 개인정보의 안전한 관리","deleted":false,"text":"제40조의2(노출된 개인정보의 삭제ㆍ차단 요청 기관) 법 제34조의2제2항에서 \"대통령령으로 지정한 전문기관\"이란 한국인터넷진흥원을 말한다.","kind":"D"},{"id":"D:41","label":"영 제41조","title":"개인정보의 열람절차 등","chapter":"제6장 정보주체의 권리 보장","deleted":false,"text":"① 정보주체는 법 제35조제1항에 따라 자신의 개인정보에 대한 열람을 요구하려면 다음 각 호의 사항 중 열람하려는 사항을 개인정보처리자가 마련한 방법과 절차에 따라 요구하여야 한다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2017.10.17>\n1. 개인정보의 항목 및 내용\n2. 개인정보의 수집ㆍ이용의 목적\n3. 개인정보 보유 및 이용 기간\n4. 개인정보의 제3자 제공 현황\n5. 개인정보 처리에 동의한 사실 및 내용\n② 개인정보처리자는 제1항에 따른 열람 요구 방법과 절차를 마련하는 경우 해당 개인정보의 수집 방법과 절차에 비하여 어렵지 아니하도록 다음 각 호의 사항을 준수하여야 한다. <신설 2017.10.17>\n1. 서면, 전화, 전자우편, 인터넷 등 정보주체가 쉽게 활용할 수 있는 방법으로 제공할 것\n2. 개인정보를 수집한 창구의 지속적 운영이 곤란한 경우 등 정당한 사유가 있는 경우를 제외하고는 최소한 개인정보를 수집한 창구 또는 방법과 동일하게 개인정보의 열람을 요구할 수 있도록 할 것\n3. 인터넷 홈페이지를 운영하는 개인정보처리자는 홈페이지에 열람 요구 방법과 절차를 공개할 것\n③ 정보주체가 법 제35조제2항에 따라 보호위원회를 통하여 자신의 개인정보에 대한 열람을 요구하려는 경우에는 보호위원회가 정하여 고시하는 바에 따라 제1항 각 호의 사항 중 열람하려는 사항을 표시한 개인정보 열람요구서를 보호위원회에 제출해야 한다. 이 경우 보호위원회는 지체 없이 그 개인정보 열람요구서를 해당 공공기관에 이송해야 한다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2017.10.17, 2020.8.4>\n④ 법 제35조제3항 전단에서 \"대통령령으로 정하는 기간\"이란 10일을 말한다. <개정 2017.10.17>\n⑤ 개인정보처리자는 제1항 및 제3항에 따른 개인정보 열람 요구를 받은 날부터 10일 이내에 정보주체에게 해당 개인정보를 열람할 수 있도록 하는 경우와 제42조제1항에 따라 열람 요구 사항 중 일부를 열람하게 하는 경우에는 열람할 개인정보와 열람이 가능한 날짜ㆍ시간 및 장소 등(제42조제1항에 따라 열람 요구 사항 중 일부만을 열람하게 하는 경우에는 그 사유와 이의제기방법을 포함한다)을 보호위원회가 정하여 고시하는 열람통지서로 해당 정보주체에게 알려야 한다. 다만, 즉시 열람하게 하는 경우에는 열람통지서 발급을 생략할 수 있다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2017.10.17, 2020.8.4>\n제41조(개인정보의 열람절차 등)","kind":"D"},{"id":"D:42","label":"영 제42조","title":"개인정보 열람의 제한ㆍ연기 및 거절","chapter":"제6장 정보주체의 권리 보장","deleted":false,"text":"① 개인정보처리자는 제41조제1항에 따른 열람 요구 사항 중 일부가 법 제35조제4항 각 호의 어느 하나에 해당하는 경우에는 그 일부에 대하여 열람을 제한할 수 있으며, 열람이 제한되는 사항을 제외한 부분은 열람할 수 있도록 하여야 한다.\n② 개인정보처리자가 법 제35조제3항 후단에 따라 정보주체의 열람을 연기하거나 같은 조 제4항에 따라 열람을 거절하려는 경우에는 열람 요구를 받은 날부터 10일 이내에 연기 또는 거절의 사유 및 이의제기방법을 보호위원회가 정하여 고시하는 열람의 연기ㆍ거절 통지서로 해당 정보주체에게 알려야 한다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.8.4>\n제42조(개인정보 열람의 제한ㆍ연기 및 거절)","kind":"D"},{"id":"D:42-2","label":"영 제42조의2","title":"정보전송자 기준","chapter":"제6장 정보주체의 권리 보장","deleted":false,"text":"① 법 제35조의2제1항 각 호 외의 부분에서 \"대통령령으로 정하는 기준에 해당하는 개인정보처리자\"란 다음 각 호의 어느 하나에 해당하는 개인정보처리자(이하 \"본인대상정보전송자\"라 한다)를 말한다. <신설 2026.2.19>\n1. 「중소기업기본법 시행령」 제7조에 따라 산정한 같은 영 제3조제1항제1호가목에 따른 평균매출액등이 1,800억원을 초과하는 자로서 다음 각 목의 어느 하나에 해당하는 자(제2조제5호에 따른 각급 학교 및 「의료법」 제3조에 따른 의료기관은 제외한다). 이 경우 다음 각 목에 규정된 정보주체의 수는 전년도 말 기준 직전 3개월 간 일일평균을 기준으로 산정한다.\n가. 5만명 이상의 정보주체의 민감정보 또는 고유식별정보를 처리하는 자\n나. 100만명 이상의 정보주체의 개인정보를 처리하는 자\n2. 공공시스템운영기관\n3. 법 제35조의2제2항에 따른 개인정보처리자\n② 법 제35조의2제2항 각 호 외의 부분에서 \"대통령령으로 정하는 기준에 해당하는 개인정보처리자\"란 다음 각 호의 어느 하나에 해당하는 개인정보처리자(이하 \"제3자대상정보전송자\"라 한다)를 말한다. <개정 2025.10.1, 2026.2.19>\n1. 보건의료 관련 기관, 법인 및 단체 중 다음 각 목의 어느 하나에 해당하는 자(이하 \"보건의료정보전송자\"라 한다)\n가. 질병관리청\n나. 「국민건강보험법」 제13조에 따른 국민건강보험공단 및 같은 법 제62조에 따른 건강보험심사평가원\n다. 「의료법」 제3조의4에 따른 상급종합병원\n라. 그 밖에 「보건의료기본법」 제3조제4호에 따른 보건의료기관 중 개인정보를 전송할 수 있는 기술적ㆍ재정적 능력과 그 개인정보가 저장ㆍ관리되고 있는 정보주체의 수 등을 고려하여 보호위원회가 보건복지부장관과 협의하여 고시하는 자\n2. 통신 관련 기관, 법인 및 단체 중 다음 각 목의 어느 하나에 해당하는 자(이하 \"통신정보전송자\"라 한다)\n가. 「전파법」 제10조에 따라 주파수를 할당받아 이동통신서비스를 제공하는 자로서 정보주체와 이동통신서비스의 이용에 관한 계약을 체결한 자\n나. 그 밖에 「전기통신사업법」 제5조제2항에 따른 기간통신사업을 경영하는 자 중 개인정보를 전송할 수 있는 기술적ㆍ재정적 능력과 그 개인정보가 저장ㆍ관리되고 있는 정보주체의 수 등을 고려하여 보호위원회와 과학기술정보통신부장관이 공동으로 정하여 고시하는 자\n3. 에너지 관련 기관, 법인 및 단체 중 다음 각 목의 어느 하나에 해당하는 자(이하 \"에너지정보전송자\"라 한다)\n가. 「전기사업법」 제2조제10호에 따른 전기판매사업자\n나. 다음의 어느 하나에 해당하는 자 중 개인정보를 전송할 수 있는 기술적ㆍ재정적 능력과 그 개인정보가 저장ㆍ관리되고 있는 정보주체의 수 등을 고려하여 보호위원회와 산업통상부장관이 공동으로 정하여 고시하는 자\n1) 「도시가스사업법」 제2조제2호에 따른 도시가스사업자\n2) 그 밖의 「도시가스사업법」 제2조제1호의2에 따른 도시가스사업 관련 기관, 법인 및 단체\n제42조의2(정보전송자 기준)","kind":"D"},{"id":"D:42-3","label":"영 제42조의3","title":"일반수신자 기준","chapter":"제6장 정보주체의 권리 보장","deleted":false,"text":"① 법 제35조의2제2항제2호에서 \"대통령령으로 정하는 시설 및 기술 기준을 충족하는 자\"란 고유의 업무를 수행하는 과정에서 수집한 정보의 진위 여부 등을 확인하기 위하여 개인정보를 전송받는 자로서 다음 각 호의 사항에 관하여 보호위원회가 정하여 고시하는 시설 및 기술을 갖춘 자를 말한다.\n1. 표준 전송 절차, 전송시스템 연계 및 전송 보안 기준 등을 충족하는 전송 요구 관련 시스템\n2. 전송 이력의 기록ㆍ보관 및 전송받은 개인정보의 분리 보관을 위한 시스템\n3. 개인정보에 대한 불법적인 접근 및 침해사고 방지를 위한 탐지 및 차단 시스템\n4. 개인정보에 대한 접근권한 관리 및 접근 통제 시스템\n② 법 제29조에 따른 안전조치의무를 이행하고 제1항에 따른 시설 및 기술을 갖춘 자(이하 \"일반수신자\"라 한다)는 법 제35조의2제2항에 따른 전송 요구(이하 \"제3자전송요구\"라 한다)에 따라 개인정보를 전송받는 업무의 일부 또는 전부를 중지 또는 폐지하려는 경우에는 그 사실을 미리 제42조의9제1항제1호에 따른 중계전문기관(이하 \"중계전문기관\"이라 한다)에 통지하고 법 제35조의4제2항에 따른 개인정보 전송 지원 플랫폼(이하 \"개인정보전송지원플랫폼\"이라 한다)에 등재해야 한다.\n제42조의3(일반수신자 기준)","kind":"D"},{"id":"D:42-4","label":"영 제42조의4","title":"전송 요구 대상 정보의 범위","chapter":"제6장 정보주체의 권리 보장","deleted":false,"text":"① 정보주체는 법 제35조의2제1항에 따라 본인대상정보전송자에 대하여 같은 항 각 호의 요건을 모두 충족하는 개인정보 중 다음 각 호의 어느 하나에 해당하지 않는 개인정보(이하 \"본인전송정보\"라 한다)를 자신에게 전송할 것을 요구할 수 있다. <신설 2026.2.19>\n1. 전송 요구로 인하여 타인의 권리나 정당한 이익을 침해하거나 침해할 우려가 있는 정보\n2. 「부정경쟁방지 및 영업비밀보호에 관한 법률」에 따른 영업비밀 또는 「산업기술의 유출방지 및 보호에 관한 법률」에 따른 산업기술 등 다른 법령에 따라 보호가 필요한 정보\n3. 복호화(複號化)되지 않도록 일방향 암호화하여 저장된 정보\n② 정보주체는 법 제35조의2제2항에 따라 제3자대상정보전송자에 대하여 다음 각 호의 구분에 따른 개인정보(이하 \"제3자전송정보\"라 한다)를 법 제35조의3제1항에 따라 지정을 받은 개인정보관리 전문기관(이하 \"개인정보관리 전문기관\"이라 한다) 또는 일반수신자에게 전송할 것을 요구할 수 있다. <개정 2025.10.1, 2026.2.19>\n1. 보건의료정보전송자: 다음 각 목의 보건의료 관련 정보 중 정보주체의 이익, 전송에 필요한 시간ㆍ비용 및 기술적으로 전송 가능한 합리적인 범위 등을 고려하여 보호위원회가 보건복지부장관과 협의하여 고시하는 정보(이하 \"보건의료전송정보\"라 한다)로서 해당 보건의료정보전송자가 보유하는 정보\n가. 「의료법」 제22조 및 제23조에 따른 진료기록 등 진료와 관련하여 생성된 정보\n나. 「약사법」 제30조에 따른 조제기록 등 조제와 관련하여 생성된 정보\n다. 「의료기기법」 제2조제1항에 따른 의료기기를 통하여 생성ㆍ수집된 정보\n라. 그 밖에 가목부터 다목까지와 유사한 보건의료 관련 정보\n2. 통신정보전송자: 「전기통신사업법」 제2조제11호에 따른 기간통신역무를 제공함에 따라 생성된 이용자의 가입정보, 이용정보, 이용요금의 청구정보 및 납부정보 등의 정보 중 정보주체의 이익, 전송에 필요한 시간ㆍ비용 및 기술적으로 전송 가능한 합리적인 범위 등을 고려하여 보호위원회와 과학기술정보통신부장관이 공동으로 정하여 고시하는 정보(이하 \"통신전송정보\"라 한다)로서 해당 통신정보전송자가 보유하는 정보\n3. 에너지정보전송자: 다음 각 목의 에너지 관련 정보 중 정보주체의 이익, 전송에 필요한 시간ㆍ비용 및 기술적으로 전송 가능한 합리적인 범위 등을 고려하여 보호위원회, 산업통상부장관 및 기후에너지환경부장관이 공동으로 정하여 고시하는 정보(이하 \"에너지전송정보\"라 한다)로서 해당 에너지정보전송자가 보유하는 정보\n가. 「전기사업법」 제14조에 따른 전기 공급에 따라 생성된 에너지 사용량 정보, 전기요금의 청구정보 및 납부정보 등의 정보\n나. 「도시가스사업법」 제19조에 따른 도시가스 공급에 따라 생성된 에너지 사용량 정보, 도시가스 요금의 청구정보 및 납부정보 등의 정보\n다. 그 밖에 가목 및 나목과 유사한 에너지 관련 정보\n③ 정보주체는 본인전송정보 외에 본인대상정보전송자가 보유하는 정보로서 시간, 비용, 기술 등을 고려하여 정보주체에게 전송할 수 있다고 본인대상정보전송자가 자율적으로 정한 정보(이하 \"자율전송정보\"라 한다)를 자신에게 전송할 것을 요구할 수 있다. <개정 2026.2.19>\n④ 정보주체는 법 제35조의2제2항에 따라 제3자대상정보전송자에 대하여 보건의료전송정보, 통신전송정보 및 에너지전송정보를 개인정보관리 전문기관 또는 일반수신자에게 전송할 것을 요구하는 경우 제2항에도 불구하고 전송받는 자에 따라 보호위원회가 정하여 고시하는 정보는 전송을 요구할 수 없다. <개정 2026.2.19>\n⑤ 보호위원회(제2항제2호 및 제3호에 따라 보호위원회와 공동으로 정하여 고시하는 관계 중앙행정기관의 장을 포함한다)는 제2항 각 호의 정보가 「전자정부법」 제43조의2제1항에 따른 행정기관등이 보유하는 본인정보에 해당하는 경우에는 제2항 각 호에 따라 고시하기 전에 전송 요구의 대상이 되는 정보 및 전송방법에 대하여 행정안전부장관과 미리 협의해야 한다. <개정 2026.2.19>\n제42조의4(전송 요구 대상 정보의 범위)","kind":"D"},{"id":"D:42-5","label":"영 제42조의5","title":"전송 요구의 방법 등","chapter":"제6장 정보주체의 권리 보장","deleted":false,"text":"① 정보주체는 법 제35조의2제1항에 따른 전송 요구(이하 \"본인전송요구\"라 한다)를 하는 경우에는 전송 요구 목적 및 전송을 요구하는 개인정보를 특정해야 한다.\n② 본인대상정보전송자는 정보주체가 법 제38조제1항에 따른 대리인을 통해 본인대상정보전송자에게 본인전송요구를 하는 경우로서 대리인이 제42조의6제3항제1호나목에 따라 사전에 협의한 방식으로 개인정보를 전송하도록 본인전송요구를 하는 경우 정당한 사유 없이 거절해서는 안 된다. <신설 2026.2.19>\n③ 정보주체는 제3자전송요구
