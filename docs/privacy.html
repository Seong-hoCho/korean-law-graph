"2023.06.29","caseType":"형사","basis":"참조조문","text":"[1] 형법 제20조에서 정한 ‘사회상규에 위배되지 아니하는 행위’의 의미 및 정당행위를 인정하기 위한 요건 / 어떠한 행위가 정당행위로서 위법성이 조각되는지 판단하는 기준 및 이때 긴급성이나 보충성의 정도는 개별 사안에 따라 다를 수 있는지 여부 [2] 어떠한 행위가 ‘범죄구성요건에 해당하지만 정당행위라는 이유로 위법성이 조각된다는 것’의 의미 [3] 개인정보 보호법 제15조 제1항 제6호의 개인정보처리자의 정당한 이익을 달성하기 위하여 필요한 경우로서 ‘명백하게 정보주체의 권리보다 우선하는 경우’에 해당하는지 판단하는 기준 [4] 근로자참여 및 협력증진에 관한 법률 제20조 제1항 제14호에서 노사협의회가 협의하여야 할 사항으로 규정한 ‘사업장 내 근로자 감시 설비의 설치’ 중 ‘근로자 감시 설비’의 의미 및 설치의 주된 목적이 근로자를 감시하기 위한 것이 아니라도 이에 해당할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=238999"},{"id":"P:616545","kind":"P","label":"2022노622","title":"개인정보보호법위반·금융실명거래및비밀보장에관한법률위반","court":"인천지방법원","date":"2023.06.07","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=616545"},{"id":"P:608235","kind":"P","label":"2020노968","title":"개인정보보호법위반","court":"춘천지방법원","date":"2023.04.07","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=608235"},{"id":"P:605217","kind":"P","label":"2022나48698","title":"손해배상(기)","court":"서울서부지방법원","date":"2023.04.06","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=605217"},{"id":"P:238229","kind":"P","label":"2022추5118","title":"조례안재의결무효확인","court":"대법원","date":"2023.03.09","caseType":"일반행정","basis":"참조조문","text":"[1] 상위 법령에서 지방자치단체의 장에게 부여한 기관구성원 임명·위촉권을 하위 법규인 조례로써 제약할 수 있는지 여부 및 지방의회가 지방자치단체 사무에 대한 비판, 감시, 통제를 위한 행정사무감사 및 조사권 행사의 일환으로 위와 같은 제약을 규정하는 조례를 제정할 수 있는지 여부 [2] 지방자치단체가 법률의 위임 없이 주민의 권리 제한 또는 의무 부과에 관한 사항을 정한 조례의 효력 [3] 개인정보 보호법 제15조 제1항 제3호에서 말하는 ‘법령 등’의 의미 [4] 부산광역시장이 자신이 임명 또는 추천하는 공공기관장에 대한 인사검증을 내용으로 하는 ‘부산광역시 공공기관의 인사검증 운영에 관한 조례안’에 대하여 자신의 임명권을 본질적으로 제약하고 상위 법령에 위반된다는 이유로 재의결을 요구하였으나 부산광역시의회가 원안대로 재의결한 사안에서, 공공기관의 장 등에 대한 사후 인사검증을 규정한 조례안 규정들은 상위 법령의 근거 없이 부산광역시장의 임명·위촉권을 본질적으로 제약하거나 법률의 위임 없이 주민의 의무 부과에 관한 사항을 조례로 정한 것으로 지방자치법 제28조 제1항 단서 등에 위반되므로 위법하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=238229"},{"id":"P:233985","kind":"P","label":"2022다207547","title":"징계무효확인의소[사립고등학교 학생이 코로나19 감염병과 관련하여 정학 2일의 징계를 당한 후 학교법인을 상대로 위 징계의 무효확인을 구하는 소를 제기하였다가 학교를 졸업한 경우 과거 법률관계인 징계에 대한 무효확인을 구할 법률상 이익이 인정되는지 여부가 문제된 사건]","court":"대법원","date":"2023.02.23","caseType":"민사","basis":"참조조문","text":"[1] 과거의 법률관계에 관하여 확인의 소를 구할 확인의 이익이 인정되는 경우 [2] 甲이 乙 주식회사가 운영하는 고등학교에서 재학 중 정학 2일의 징계를 받은 뒤 이에 불복하여 乙 회사를 상대로 징계 무효 확인을 구하는 소를 제기하였다가 소송 중 학교를 졸업한 사안에서, 징계 자체는 과거의 법률관계라고 하더라도 징계 무효 확인을 구할 법률상 이익이 인정된다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=233985"},{"id":"P:608411","kind":"P","label":"2021노2102","title":"개인정보보호법위반","court":"대전지방법원","date":"2023.02.15","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=608411"},{"id":"P:608531","kind":"P","label":"2021가합509722","title":"처리정지","court":"서울중앙지방법원","date":"2023.01.19","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=608531"},{"id":"P:614445","kind":"P","label":"2020가합536628","title":"수수료청구","court":"서울중앙지방법원","date":"2023.01.17","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=614445"},{"id":"P:232561","kind":"P","label":"2022그18","title":"결정(조서)경정","court":"대법원","date":"2022.12.01","caseType":"민사","basis":"참조조문","text":"[1] 판결경정 제도의 취지 및 이러한 법리는 이행권고결정에 오류가 있는 경우에도 마찬가지로 적용되는지 여부 [2] 이행권고결정에 주민등록번호를 기재하지 않은 것이 부적법한 조치인지 여부 및 그로 인해 집행 과정에서 지장을 받을 우려가 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=232561"},{"id":"P:609317","kind":"P","label":"2022노257","title":"금융실명거래및비밀보장에관한법률위반·개인정보보호법위반","court":"서울중앙지방법원","date":"2022.11.25","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=609317"},{"id":"P:241617","kind":"P","label":"2022노1","title":"특정경제범죄가중처벌등에관한법률위반(사기)방조·개인정보보호법위반·정보통신망이용촉진및정보보호등에관한법률위반방조","court":"부산고등법원창원재판부","date":"2022.11.23","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=241617"},{"id":"P:232019","kind":"P","label":"2018도1966","title":"개인정보보호법위반","court":"대법원","date":"2022.11.10","caseType":"형사","basis":"참조조문","text":"[1] 구 공공기관의 개인정보보호에 관한 법률이 2011. 3. 29. 폐지되고 개인정보 보호법이 제정된 취지 [2] 구 공공기관의 개인정보보호에 관한 법률 제23조 제2항, 제11조에서 말하는 ‘누설’의 의미 및 고소·고발장에 다른 정보주체의 개인정보를 첨부하여 경찰서에 제출한 행위가 개인정보의 ‘누설’에 해당하는지 여부 / 구 공공기관의 개인정보보호에 관한 법률에 따른 ‘누설’에 관한 위의 법리가 개인정보 보호법에도 그대로 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=232019"},{"id":"P:232085","kind":"P","label":"2022도9510","title":"공직선거법위반[개인정보 보호법을 위반하여 임의 제출된 증거의 증거능력과 형사소송법 제312조 제5항의 적용범위에 대한 사건]","court":"대법원","date":"2022.10.27","caseType":"형사","basis":"참조조문","text":"[1] 구 개인정보 보호법 제18조 제2항 제7호는 ‘개인정보처리자’가 ‘공공기관’인 경우에 한정되는지 여부 / 구 개인정보 보호법 제18조 제2항 제2호에서 정한 ‘다른 법률에 특별한 규정이 있는 경우’에 형사소송법 제199조 제2항과 같이 수사기관이 공무소 기타 공사단체에 조회하여 필요한 사항의 보고를 요구할 수 있는 포괄적인 규정이 해당되는지 여부 [2] 개인정보 보호법 제59조 제2호의 의무주체인 ‘개인정보를 처리하거나 처리하였던 자’는 업무상 알게 된 개인정보 보호법 제2조 제1호의 ‘개인정보’를 제2조 제2호의 방법으로 ‘처리’하거나 ‘처리’하였던 자를 포함하는지 여부 [3] 검사 또는 사법경찰관이 피고인이 아닌 자의 진술을 기재한 조서의 증거능력이 인정되려면 ‘적법한 절차와 방식에 따라 작성된 것’이어야 한다는 법리는 피고인이 아닌 자가 수사과정에서 작성한 진술서의 증거능력에 관하여도 적용되는지 여부 / 형사소송법 제221조 제1항, 제244조의4 제1항, 제3항의 취지 / 피고인이 아닌 자가 수사과정에서 진술서를 작성하였지만 수사기관이 조사과정의 진행경과를 확인하기 위하여 필요한 사항을 진술서에 기록하거나 별도의 서면에 기록한 후 수사기록에 편철하는 등 적절한 조치를 취하지 아니하여 형사소송법 제244조의4 제1항, 제3항에서 정한 절차를 위반한 경우, ‘적법한 절차와 방식’에 따라 수사과정에서 진술서가 작성되었다고 할","url":"https://www.law.go.kr/precInfoP.do?precSeq=232085"},{"id":"P:232927","kind":"P","label":"2021추5067","title":"조례안재의결무효확인","court":"대법원","date":"2022.07.28","caseType":"일반행정","basis":"판례내용","text":"[1] 구 지방자치법 제22조에서 정한 ‘법령의 범위 안에서’의 의미 및 법령에 위반되는 지방자치단체 조례의 효력 / 조례가 법령에 위반되는지 판단하는 방법 [2] 건축법 제4조 제1항에 따라 구성된 건축위원회가 공공기록물 관리에 관한 법률 제17조 제2항에 따른 회의록 작성 대상인 회의에 해당하는지 여부 및 공공기록물 관리에 관한 법률 시행령 제18조 제2항에서 영구기록물관리기관의 장이 지정하는 일정한 회의에 대하여 회의록과 함께 속기록이나 녹음기록 중 어느 하나를 생산하도록 규정한 취지 [3] 법률의 위임 없이 주민의 권리제한 또는 의무부과에 관한 사항을 정한 조례의 효력 및 법률이 주민의 권리의무에 관한 사항에 관하여 구체적으로 범위를 정하지 않은 채 조례로 정하도록 포괄적으로 위임한 경우나 법률규정이 예정하고 있는 사항을 구체화·명확화한 것인 경우, 지방자치단체가 주민의 권리의무에 관한 사항을 조례로 제정할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=232927"},{"id":"P:222683","kind":"P","label":"2022도1676","title":"개인정보보호법위반","court":"대법원","date":"2022.06.16","caseType":"형사","basis":"참조조문","text":"[1] 개인정보를 제공받은 자의 개인정보 보호법 제71조 제2호 위반죄는 정보제공자가 법령위반으로 개인정보를 제공한다는 사정에 대한 인식 외에 ‘영리 또는 부정한 목적’을 범죄성립요건으로 하는 목적범인지 여부 / 개인정보 보호법 제71조 제2호에서 ‘부정한 목적’의 의미 및 이에 해당하는지 판단하는 방법 [2] 주택재개발정비사업 조합의 조합원인 피고인이 조합 임원 9명에 대한 해임안건이 담긴 해임 총회 개최사실을 알릴 목적으로 甲이 이전에 개최된 주민총회의 적정성을 검토하기 위해 제공받은 토지 등 소유자 명부 등을 바탕으로 작성하여 보관 중이던 조합원 명단을 제공받음으로써 부정한 목적으로 개인정보를 제공받았다는 이유로 개인정보 보호법 위반으로 기소된 사안에서, ‘해임 총회 개최사실을 알릴 목적’이 사회통념상 부정하다고 단정하기 어렵다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=222683"},{"id":"P:241619","kind":"P","label":"2021고합182","title":"특정경제범죄가중처벌등에관한법률위반(사기)방조(일부인정된죄명사기방조)·개인정보보호법위반·정보통신망이용촉진및정보보호등에관한법률위반방조","court":"창원지방법원","date":"2021.12.16","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=241619"},{"id":"P:228533","kind":"P","label":"2015두53770","title":"정보공개거부처분취소","court":"대법원","date":"2021.11.11","caseType":"일반행정","basis":"참조조문","text":"[1] 구 공공기관의 정보공개에 관한 법률 제9조 제1항 제6호가 개인정보 보호법 제6조에서 말하는 ‘개인정보 보호에 관하여 다른 법률에 특별한 규정이 있는 경우’에 해당하는지 여부 및 공공기관이 보유·관리하고 있는 개인정보의 공개에 관하여는 구 공공기관의 정보공개에 관한 법률 제9조 제1항 제6호가 개인정보 보호법에 우선하여 적용되는지 여부 [2] 구 공공기관의 정보공개에 관한 법률 제9조 제1항 제6호 단서 목에서 말하는 ‘공개하는 것이 공익을 위하여 필요하다고 인정되는 정보’에 해당하는지 판단하는 방법","url":"https://www.law.go.kr/precInfoP.do?precSeq=228533"},{"id":"P:218449","kind":"P","label":"2020도1942","title":"개인정보보호법위반부정처사후수뢰·형사사법절차전자화촉진법위반·공무상비밀누설·직무유기·위계공무집행방해·무고·성매매알선등행위의처벌에관한법률위반(성매매)","court":"대법원","date":"2021.10.28","caseType":"형사","basis":"참조조문","text":"구 개인정보 보호법 제74조 제2항 양벌규정의 취지 및 위 양벌규정에 의하여 개인정보처리자 아닌 행위자도 같은 법 제71조 제2호, 제18조 제1항 벌칙규정의 적용대상이 되는지 여부 / ‘법인격 없는 공공기관’을 위 양벌규정에 의하여 처벌할 수 있는지 여부 및 이 경우 행위자를 위 양벌규정으로 처벌할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=218449"},{"id":"P:600371","kind":"P","label":"2020노2688","title":"개인정보보호법위반","court":"부산지방법원","date":"2021.09.10","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=600371"},{"id":"P:608413","kind":"P","label":"2021고정277","title":"개인정보보호법위반","court":"대전지방법원","date":"2021.06.17","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=608413"},{"id":"P:213725","kind":"P","label":"2019도18700","title":"도시및주거환경정비법위반","court":"대법원","date":"2021.02.10","caseType":"형사","basis":"참조조문","text":"[1] 정비사업 시행과 관련한 서류 및 자료를 공개하여야 할 의무 또는 조합원 등의 열람ㆍ복사 요청에 따라야 할 의무를 규정하고 이를 위반하는 행위를 처벌하는 도시 및 주거환경정비법 제124조 제1항, 제4항, 제138조 제1항 제7호의 입법 취지 [2] ‘조합원의 전화번호’가 도시 및 주거환경정비법 제124조 제4항에 따른 열람ㆍ복사의 대상인지 여부 [3] ‘조합원별 신축건물 동호수 배정 결과’가 도시 및 주거환경정비법 제124조 제4항에 따른 열람ㆍ복사의 대상인지 여부 [4] 정비사업조합의 ‘조합원’이자 ‘감사’인 사람이 정비사업 관련 자료의 열람ㆍ복사를 요청한 경우, 조합임원은 도시 및 주거환경정비법 제124조 제4항에 따라 열람ㆍ복사를 허용할 의무를 부담하는지 여부 및 이를 위반하여 열람ㆍ복사를 허용하지 않는 경우에는 같은 법 제138조 제1항 제7호에 따라 형사처벌의 대상이 되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=213725"},{"id":"P:234541","kind":"P","label":"2019고합738","title":"사문서위조·위조사문서행사·허위작성공문서행사·위조공문서행사(인정된죄명허위작성공문서행사)·업무방해·위계공무집행방해·사기·보조금관리에관한법률위반·업무상횡령·자본시장과금융투자업에관한법률위반·범죄수익은닉의규제및처벌등에관한법률위반·금융실명거래및비밀보장에관한법률위반·증거인멸교사·증거위조교사·증거은닉교사","court":"서울중앙지방법원","date":"2020.12.23","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=234541"},{"id":"P:241621","kind":"P","label":"2019노869","title":"개인정보보호법위반","court":"춘천지방법원","date":"2020.12.09","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=241621"},{"id":"P:214497","kind":"P","label":"2019노4259","title":"개인정보보호법위반(예비적 죄명: 같음)","court":"서울중앙지방법원","date":"2020.10.15","caseType":"형사","basis":"참조조문","text":"피고인이 시교육청으로부터 대학수학능력시험 감독관으로 임명되어 고사장 감독업무를 수행하면서 수험생의 개인정보가 포함된 응시원서를 제공받고 이를 각 수험생의 수험표와 대조하는 과정에서 甲의 연락처를 알게 되자 甲을 카카오톡 친구로 추가한 후 甲에게 카카오톡으로 ‘맘에 든다’는 취지의 메시지를 발송함으로써 개인정보처리자로부터 제공받은 개인정보를 제공받은 목적 외 용도로 이용하였다고 하여 구 개인정보 보호법 위반으로 기소된 사안에서, 피고인은 위 시험의 감독업무 수행을 위하여 개인정보처리자인 시교육청으로부터 수험생들의 전화번호 등 개인정보를 받은 것이므로 같은 법 제17조 제1항 제2호, 제15조 제1항 제3호의 ‘공공기관이 법령 등에서 정하는 소관 업무의 수행을 위하여 불가피한 경우’에 해당하여 같은 법 제19조의 ‘개인정보처리자로부터 개인정보를 제공받은 자’에 포섭된다는 이유로 유죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=214497"},{"id":"P:230455","kind":"P","label":"2020고정111","title":"개인정보보호법위반","court":"창원지방법원","date":"2020.10.06","caseType":"형사","basis":"참조조문","text":"경찰공무원인 피고인이, 경찰 내부 통합포털시스템인 ‘폴넷’ 게시판에 甲 등 경찰공무원 22명이 작성한 댓글이 피고인의 명예를 훼손하였다는 이유로 이들을 고소하면서 경찰청 표준인사시스템인 ‘e사람’에 접속한 후 ‘직원조회’ 메뉴에 성명을 입력하여 위 22명의 휴대전화번호를 알아낸 다음 이를 고소장에 기재하여 수사기관에 제출함으로써 개인정보를 처리하거나 처리하였던 자로서 업무상 알게 된 개인정보를 누설하고 권한 없이 개인정보를 유출하였다고 하여 개인정보 보호법 위반으로 기소된 사안에서, 피고인의 행위가 개인정보의 누설이나 유출에 해당하지 않는다는 이유로 무죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=230455"},{"id":"P:230345","kind":"P","label":"2020고정111","title":"개인정보보호법위반","court":"창원지방법원","date":"2020.10.06","caseType":"형사","basis":"참조조문","text":"경찰공무원인 피고인이, 경찰 내부 통합포털시스템인 ‘폴넷’ 게시판에 甲 등 경찰공무원 22명이 작성한 댓글이 피고인의 명예를 훼손하였다는 이유로 이들을 고소하면서 경찰청 표준인사시스템인 ‘e사람’에 접속한 후 ‘직원조회’ 메뉴에 성명을 입력하여 위 22명의 휴대전화번호를 알아낸 다음 이를 고소장에 기재하여 수사기관에 제출함으로써 개인정보를 처리하거나 처리하였던 자로서 업무상 알게 된 개인정보를 누설하고 권한 없이 개인정보를 유출하였다고 하여 개인정보 보호법 위반으로 기소된 사안에서, 피고인의 행위가 개인정보의 누설이나 유출에 해당하지 않는다는 이유로 무죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=230345"},{"id":"P:220073","kind":"P","label":"2019노189","title":"개인정보보호법위반·부정처사후수뢰·형사사법절차전자화촉진법위반·공무상비밀누설·직무유기·위계공무집행방해·무고·성매매알선등행위의처벌에관한법률위반(성매매)·성매매알선등행위의처벌에관한법률위반(성매매알선등)·범인도피교사·범인도피·공기호부정사용·부정사용공기호행사·자동차관리법위반·자동차손해배상보장법위반","court":"대전고등법원","date":"2020.01.17","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=220073"},{"id":"P:214555","kind":"P","label":"2019노4325","title":"도시및주거환경정비법위반","court":"수원지방법원","date":"2019.11.22","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=214555"},{"id":"P:208905","kind":"P","label":"2018노1287","title":"영유아보육법위반(예비적죄명:개인정보보호법위반)","court":"울산지방법원","date":"2019.06.13","caseType":"형사","basis":"판례내용","text":"어린이집 운영자인 피고인이 원아 甲의 부모로부터 ‘담임교사가 甲을 방치한 것 같으니 어린이집에 설치된 폐쇄회로 텔레비전의 녹화영상을 보여 달라’고 요구받게 되자 CCTV 수리업자에게 CCTV 영상정보가 녹화·저장된 저장장치인 컴퓨터 하드디스크를 교체하도록 한 다음 그 저장장치를 버리는 등의 방법으로 은닉함으로써 CCTV의 녹화영상정보가 훼손되게 하였다는 영유아보육법 위반의 주위적 공소사실로 기소된 사안에서, 피고인은 같은 법 제15조의5 제3항에 따른 안전성 확보에 필요한 조치를 하지 아니하였고 이로 인해 영상정보를 훼손당한 점이 인정된다는 이유로 유죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=208905"},{"id":"P:220165","kind":"P","label":"2018고합453","title":"개인정보보호법위반·부정처사후수뢰·형사사법절차전자화촉진법위반·공무상비밀누설·직무유기·위계공무집행방해·무고·성매매알선등행위의처벌에관한법률위반(성매매)·성매매알선등행위의처벌에관한법률위반(성매매알선등)·범인도피교사·범인도피","court":"대전지방법원","date":"2019.05.10","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=220165"},{"id":"P:241341","kind":"P","label":"2018노678","title":"개인정보보호법위반(일부예비적죄명정보통신망이용촉진및정보보호등에관한법률위반)","court":"서울중앙지방법원","date":"2019.02.14","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=241341"},{"id":"P:206347","kind":"P","label":"2018다223214","title":"손해배상(기)","court":"대법원","date":"2018.10.25","caseType":"민사","basis":"판례내용","text":"개인정보를 처리하는 자가 수집한 개인정보가 정보주체의 의사에 반하여 유출된 경우, 그로 인하여 정보주체에게 위자료로 배상할 만한 정신적 손해가 발생하였는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=206347"},{"id":"P:206346","kind":"P","label":"2018다219406","title":"손해배상(기)","court":"대법원","date":"2018.10.25","caseType":"민사","basis":"판례내용","text":"개인정보를 처리하는 자가 수집한 개인정보가 정보주체의 의사에 반하여 유출된 경우, 그로 인하여 정보주체에게 위자료로 배상할 만한 정신적 손해가 발생하였는지 판단하는 기준 및 불법행위로 입은 정신적 고통에 대한 위자료 액수의 산정이 사실심 법원의 재량 사항인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=206346"},{"id":"P:601457","kind":"P","label":"2017나2055054","title":"손해배상(기)","court":"서울고등법원","date":"2018.07.11","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=601457"},{"id":"P:194917","kind":"P","label":"2017고합281","title":"아동·청소년의성보호에관한법률위반(위계등추행)·개인정보보호법위반","court":"수원지방법원","date":"2018.02.20","caseType":"형사","basis":"참조조문","text":"고등학교 교사인 피고인이 담임을 맡고 있는 학급의 여학생 3명의 피해자들에게 ‘남자 친구 대신 사랑을 주면 안 되냐?’, ‘너는 왜 애교를 부리지 않니?’ 등과 같이 말하면서 몸을 밀착시키고, 등을 쓰다듬고, 어깨를 주무르고, 양팔로 끌어안고, 볼을 서로 닿게 하는 등의 행위를 함으로써 위력으로 청소년인 피해자들을 추행하고, 이러한 행위에 대한 수사가 시작되어 담임교사의 업무를 수행하지 않게 되었음에도 학생들의 개인정보를 이용하여 학부모들에게 내용증명서를 발송하거나 발송 의뢰하는 방법으로 개인정보를 제공받은 목적 외의 용도로 이용하였다고 하여 아동·청소년의 성보호에 관한 법률 위반 및 개인정보 보호법 위반으로 기소된 사안에서, 피고인에게 유죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=194917"},{"id":"P:210603","kind":"P","label":"2016나2090012","title":"손해배상(기)","court":"서울고등법원","date":"2018.02.02","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=210603"},{"id":"P:601909","kind":"P","label":"2017고단6249","title":"개인정보보호법위반","court":"서울중앙지방법원","date":"2018.01.25","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=601909"},{"id":"P:193337","kind":"P","label":"2015도16508","title":"개인정보보호법위반","court":"대법원","date":"2018.01.24","caseType":"형사","basis":"참조조문","text":"개인정보를 처리하거나 처리하였던 자가 업무상 알게 된 개인정보를 누설하거나 권한 없이 다른 사람이 이용하도록 제공한 것이라는 사정을 알면서도 영리 또는 부정한 목적으로 개인정보를 제공받은 자라면, 개인정보를 처리하거나 처리하였던 자로부터 직접 개인정보를 제공받지 아니하더라도 개인정보 보호법 제71조 제5호의 ‘개인정보를 제공받은 자’에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=193337"},{"id":"P:186495","kind":"P","label":"2014추644","title":"조례안재의결무효확인","court":"대법원","date":"2017.12.13","caseType":"일반행정","basis":"참조조문","text":"[1] 상위 법령에서 지방자치단체의 장에게 부여한 기관구성원 임명·위촉권을 하위 법규인 조례로써 제약할 수 있는지 여부 및 지방의회가 지방자치단체 사무에 대한 비판, 감시, 통제를 위한 행정사무감사 및 조사권 행사의 일환으로 위와 같은 제약을 규정하는 조례를 제정할 수 있는지 여부 [2] 지방자치단체가 법률의 위임 없이 주민의 권리제한 또는 의무부과에 관한 사항을 정한 조례의 효력 [3] 전라북도지사가 도지사 임명 출연기관장 등에 대한 도의회의 인사검증을 내용으로 하는 ‘전라북도 출연기관 등의 장에 대한 인사검증 조례안’에 대하여 상위 법령에 반하여 자신의 인사권한 행사를 침해한다는 이유를 들어 재의결을 요구하였으나 전라북도의회가 원안대로 재의결한 사안에서, 위 조례안 중 인사검증에 관한 조례 규정 등이 위법하여 조례안에 대한 재의결은 전부의 효력이 부정된다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=186495"},{"id":"P:186222","kind":"P","label":"2015다235841","title":"주주명부열람등사","court":"대법원","date":"2017.11.09","caseType":"민사","basis":"참조조문","text":"[1] 상법 제396조 제2항, 자본시장과 금융투자업에 관한 법률 제315조 제2항에 따라 주주 및 실질주주가 행사할 수 있는 주주명부 열람·등사청구권의 목적과 기능 / 실질주주가 실질주주명부의 열람 또는 등사를 청구하는 경우, 상법 제396조 제2항이 유추적용되는지 여부 및 이 경우 열람 또는 등사청구의 허용 범위가 상법상 ‘주주명부의 기재사항’에 해당하는 것으로 한정되는지 여부 / 위 범위 내에서 행해지는 실질주주명부의 열람 또는 등사가 개인정보 보호법에 위반되는지 여부 [2] 회사가 주주 또는 회사채권자의 주주명부 등 열람·등사청구를 거부할 수 있는지 여부 및 이 경우 청구에 정당한 목적이 없다는 점에 관한 증명책임의 소재 / 이러한 법리는 상법 제396조 제2항을 유추적용하여 실질주주명부의 열람·등사청구권을 인정하는 경우에도 동일하게 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=186222"},{"id":"P:601491","kind":"P","label":"2015가합1847","title":"손해배상(기)","court":"수원지방법원안산지원","date":"2017.08.31","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=601491"},{"id":"P:230449","kind":"P","label":"2015노1998","title":"공직선거법위반·국가정보원법위반","court":"서울고등법원","date":"2017.08.30","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=230449"},{"id":"P:230319","kind":"P","label":"2015노1998","title":"공직선거법위반·국가정보원법위반","court":"서울고등법원","date":"2017.08.30","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=230319"},{"id":"P:197673","kind":"P","label":"2016누5128","title":"정직처분취소","court":"광주고등법원","date":"2017.05.18","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=197673"},{"id":"P:184700","kind":"P","label":"2016도13263","title":"개인정보보호법위반·정보통신망이용촉진및정보보호등에관한법률위반(개인정보누설등)","court":"대법원","date":"2017.04.07","caseType":"형사","basis":"참조조문","text":"[1] 개인정보 보호법 제72조 제2호에 규정된 ‘거짓이나 그 밖의 부정한 수단이나 방법’의 의미 및 거짓이나 그 밖의 부정한 수단이나 방법으로 개인정보를 취득하거나 그 처리에 관한 동의를 받았는지 판단하는 방법 [2] 개인정보 보호법 제17조와 정보통신망 이용촉진 및 정보보호 등에 관한 법률 제24조의2에서 말하는 개인정보의 ‘제3자 제공’의 의미 및 개인정보 보호법 제26조와 정보통신망 이용촉진 및 정보보호 등에 관한 법률 제25조에서 말하는 개인정보의 ‘처리위탁’의 의미 / 개인정보 처리위탁에 있어 수탁자가 개인정보 보호법 제17조와 정보통신망 이용촉진 및 정보보호 등에 관한 법률 제24조의2에 정한 ‘제3자’에 해당하는지 여부 / 어떠한 행위가 개인정보의 제공인지 아니면 처리위탁인지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=184700"},{"id":"P:197767","kind":"P","label":"2016고합203","title":"배상명령신청·사기[피고인1에대하여인정된죄명특정경제범죄가중처벌등에관한법률위반(사기)]·개인정보보호법위반·국민체육진흥법위반·사기미수·범죄단체조직(피고인2에대하여인정된죄명범죄단체가입)·범죄단체활동·범죄수익은닉의규제및처벌등에관한법률위반·전자금융거래법위반·범죄단체가입","court":"수원지방법원안산지원","date":"2016.12.16","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=197767"},{"id":"P:210713","kind":"P","label":"2014가합511956","title":"손해배상(기)","court":"서울중앙지방법원","date":"2016.10.13","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=210713"},{"id":"P:183317","kind":"P","label":"2015고단2235","title":"직권남용권리행사방해","court":"전주지방법원","date":"2016.08.19","caseType":"형사","basis":"참조조문","text":"교육감인 피고인이, 교육과학기술부에서 소속 교육청과 고등학교 등에 대하여 학교생활기록부 작성 실태와 현황을 점검하기 위한 특정감사를 실시하자, 관내 고등학교 등에 학교폭력 사항과 관련된 감사자료 제출을 거부하도록 지시하는 내용의 공문을 발령하여 소속 교육청 공무원들 및 고등학교 학교장들이 교육과학기술부의 자료제출, 답변서·확인서 등 요구에 협력하지 않도록 하였다고 하여 직권남용권리행사방해로 기소된 사안에서, 피고인의 감사자료 제출 거부 지시행위가 직권남용에 해당한다거나 피고인에게 직권을 남용한다는 인식이 있었다고 단정할 수 없다는 이유로 무죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=183317"},{"id":"P:183259","kind":"P","label":"2014다235080","title":"부당이득금반환(공개된 개인정보를 수집하여 제3자에게 제공한 행위에 대하여 개인정보자기결정권의 침해를 이유로 위자료를 구하는 사건)","court":"대법원","date":"2016.08.17","caseType":"민사","basis":"참조조문","text":"[1] 개인정보자기결정권의 보호대상이 되는 ‘개인정보’의 의미 및 공적 생활에서 형성되었거나 이미 공개된 개인정보가 이에 포함되는지 여부 / 개인정보를 대상으로 한 조사·수집·보관·처리·이용 등의 행위가 개인정보자기결정권에 대한 제한에 해당하는지 여부 [2] 개인정보자기결정권을 침해·제한한다고 주장되는 행위의 내용이 이미 정보주체의 의사에 따라 공개된 개인정보를 별도의 동의 없이 영리 목적으로 수집·제공하였다는 것인 경우, 정보처리 행위의 위법성 여부를 판단하는 기준 및 정보처리자에게 영리 목적이 있었다는 사정만으로 곧바로 정보처리 행위를 위법하다고 할 수 있는지 여부 [3] 이미 공개된 개인정보를 정보주체의 동의가 있었다고 객관적으로 인정되는 범위 내에서 수집·이용·제공 등 처리를 할 때 정보주체의 별도의 동의가 필요한지 여부 및 동의를 받지 아니한 경우, 개인정보 보호법 제15조나 제17조를 위반한 것인지 여부 / 정보주체의 동의가 있었다고 인정되는 범위 내인지 판단하는 기준 [4] 법률정보 제공 사이트를 운영하는 甲 주식회사가 공립대학교인 乙 대학교 법과대학 법학과 교수로 재직 중인 丙의 사진, 성명, 성별, 출생연도, 직업, 직장, 학력, 경력 등의 개인정보를 위 법학과 홈페이지 등을 통해 수집하여 위 사이트 내 ‘법조인’ 항목에서 유료로 제공한 사안에서, 甲 회사의 행위를 丙의 개인정보자기결정권을 침해하는 위법한 행위로 평가","url":"https://www.law.go.kr/precInfoP.do?precSeq=183259"},{"id":"P:203797","kind":"P","label":"2016노223","title":"개인정보보호법위반","court":"서울중앙지방법원","date":"2016.08.12","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=203797"},{"id":"P:187808","kind":"P","label":"2014마2239","title":"문서제출명령결정에대한재항고","court":"대법원","date":"2016.07.01","caseType":"민사","basis":"참조조문","text":"[1] 문서의 제출을 거부할 수 있는 예외사유로서 민사소송법 제344조 제2항 제2호에서 정한 ‘오로지 문서를 가진 사람이 이용하기 위한 문서’에 해당하는지 판단하는 기준 및 주관적으로 내부 이용을 주된 목적으로 회사 내부에서 결재를 거쳐 작성된 문서를 자기이용문서라고 단정할 수 없는 경우 / 자기이용문서 등 문서제출 거부사유가 인정되지 아니하는 경우, 법원이 문서제출이 필요한지 및 문서제출신청에 정당한 이유가 있는지 판단할 때 고려할 사항 [2] 제출명령신청의 대상이 된 문서가 서증으로서 필요하지 않거나 대상 문서로 증명하고자 하는 사항이 청구와 직접 관련이 없는 경우, 신청을 받아들이지 않을 수 있는지 여부 [3] 임직원의 급여 및 상여금 내역 등이 개인정보 보호법상 개인정보에 해당한다는 이유로 문서소지인이 문서의 제출을 거부할 수 있는지 여부 [4] 문서의 제출을 거부할 수 있는 예외사유로서 민사소송법 제344조 제2항 제1호, 제1항 제3호 목, 제315조 제1항 제2호에서 정한 ‘직업의 비밀’의 의미 / 문서 소지자가 문서의 제출을 거부할 수 있으려면 직업의 비밀에 해당하는 정보가 보호가치 있는 비밀이어야 하는지 여부 및 보호가치 있는 비밀인지 판단하는 방법","url":"https://www.law.go.kr/precInfoP.do?precSeq=187808"},{"id":"P:182950","kind":"P","label":"2014두2638","title":"시정조치등취소(인터넷 사이트에서 개인정보를 수집하면서 적법한 동의를 받았는지 문제 된 사건)","court":"대법원","date":"2016.06.28","caseType":"일반행정","basis":"판례내용","text":"[1] 정보통신서비스 제공자가 이용자에게서 개인정보 수집·제공에 관하여 구 정보통신망 이용촉진 및 정보보호 등에 관한 법률에 따라 적법한 동의를 받기 위한 요건 [2] 구 정보통신망 이용촉진 및 정보보호 등에 관한 법률에 따른 정보통신서비스 제공자인 甲 주식회사가 오픈마켓 등 웹사이트의 배너 및 이벤트 광고 팝업창을 통하여 개인정보 수집 항목 및 목적, 보유기간에 대한 안내 없이 ‘확인’을 선택하면 동의한 것으로 간주하는 방법으로 명시적인 동의를 받지 않고 이용자 개인정보를 수집하여 보험사 등에 제공하였다는 이유로 방송통신위원회가 甲 회사에 시정조치 등을 한 사안에서, 甲 회사가 이벤트 화면을 통하여 이용자의 개인정보 수집 등을 하면서 위 법률에 따른 개인정보의 수집·제3자 제공에 필요한 이용자의 적법한 동의를 받지 않았다고 본 원심판단이 정당하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=182950"},{"id":"P:182867","kind":"P","label":"2015도8766","title":"개인정보보호법위반","court":"대법원","date":"2016.03.10","caseType":"형사","basis":"참조조문","text":"구 개인정보 보호법 제71조 제5호의 적용대상자로서 제59조 제2호의 의무주체인 ‘개인정보를 처리하거나 처리하였던 자’에 제2조 제5호의 ‘개인정보처리자’ 외에 업무상 알게 된 제2조 제1호의 ‘개인정보’를 제2조 제2호의 방법으로 처리하거나 처리하였던 자가 포함되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=182867"},{"id":"P:181681","kind":"P","label":"2015구합79673","title":"정보공개거부처분취소","court":"서울행정법원","date":"2016.03.04","caseType":"일반행정","basis":"참조조문","text":"甲이 미성년자인 자녀 乙 등이 작성한 국민기초생활 보장법 급여 분할 청구 민원서류에 대하여 정보공개 청구를 하였는데, 관할 행정청이 공공기관의 정보공개에 관한 법률 제9조 제1항 제6호 등에 근거하여 정보비공개결정을 하자 처분의 취소를 구한 사안에서, 위 정보는 乙 등 개인에 관한 사항으로서 공개될 경우 사생활의 비밀 또는 자유를 침해할 우려가 있다고 인정되는 비공개 대상 정보에 해당한다는 이유로 甲의 청구를 기각한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=181681"},{"id":"P:186011","kind":"P","label":"2015고단510","title":"개인정보보호법위반","court":"서울중앙지방법원","date":"2016.01.08","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=186011"},{"id":"P:179935","kind":"P","label":"2015고정1144","title":"개인정보보호법위반","court":"서울서부지방법원","date":"2015.12.18","caseType":"형사","basis":"참조조문","text":"인터넷 신문 기자인 피고인이 뉴스 사이트에 甲에 관한 기사를 게재하면서 취재 활동 중에 알게 된 甲의 성명, 지위, 주소 등의 개인정보를 누설하였다고 하여 개인정보 보호법 제71조 제5호, 제59조 위반으로 기소된 사안에서, 같은 법 제71조 제5호, 제59조의 ‘개인정보를 처리하거나 처리하였던 자’를 같은 법 제2조 제5호의 ‘개인정보처리자’라 할 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=179935"},{"id":"P:179473","kind":"P","label":"2014가합38116","title":"손해배상(기)등","court":"서울중앙지방법원","date":"2015.10.16","caseType":"민사","basis":"판례내용","text":"甲 외국법인이 인터넷을 기반으로 하여 전 세계적으로 제공하는 검색, 이메일 등의 서비스에 가입한 乙 등이 甲 법인을 상대로 정보통신망 이용촉진 및 정보보호 등에 관한 법률 제30조 제2항, 제4항에 따라 甲 법인이 乙 등의 개인정보 및 서비스 이용 내역을 제3자에게 제공한 현황의 공개 등을 구한 사안에서, 乙 등과 甲 법인 사이의 서비스 이용에 관한 법률관계에는 서비스 약관상 준거법 합의가 있더라도 정보통신망 이용촉진 및 정보보호 등에 관한 법률상 이용자의 권리보호에 관한 규정들이 적용되고, 甲 법인은 법령에 의하여 비공개 의무가 부과된 사항을 제외하고 乙 등의 개인정보 및 서비스 이용 내역을 제3자에게 제공하였는지와 그 내용을 공개할 의무가 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=179473"},{"id":"P:198488","kind":"P","label":"2014노3113","title":"개인정보보호법위반","court":"광주지방법원","date":"2015.10.13","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=198488"},{"id":"P:197719","kind":"P","label":"2014나2052443","title":"주주명부열람등사","court":"서울고등법원","date":"2015.08.13","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=197719"},{"id":"P:178872","kind":"P","label":"2015도2625","title":"공직선거법위반·국가정보원법위반","court":"대법원","date":"2015.07.16","caseType":"형사","basis":"판례내용","text":"형사소송법 제315조 제3호에서 정한 ‘기타 특히 신용할 만한 정황에 의하여 작성된 문서’의 의미 / 문서가 형사소송법 제315조 제2호에서 정한 ‘업무상 통상문서’에 해당하는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=178872"},{"id":"P:180194","kind":"P","label":"2013도13070","title":"산업재해보상보험법위반·공공기관의개인정보보호에관한법률위반","court":"대법원","date":"2015.07.09","caseType":"형사","basis":"판례내용","text":"[1] 산업재해보상보험법 제21조, 제127조 제3항의 취지 및 위 규정들에서 ‘직무상 알게 된 비밀’의 범위 [2] 개인정보의 누설이나 권한 없는 처리 또는 타인의 이용에 제공하는 등 부당한 목적으로 사용한 행위를 처벌하도록 규정한 구 공공기관의 개인정보보호에 관한 법률 제23조 제2항, 제11조에서 ‘누설’, ‘처리’의 의미 / 개인정보의 정보주체에게서 개인정보의 취급을 위임받은 대리인이 위 조항에 의하여 처벌되는 누설이나 개인정보 이용 제공의 상대방인 ‘타인’에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=180194"},{"id":"P:179105","kind":"P","label":"2014구합11076","title":"조치명령취소","court":"광주지방법원","date":"2015.07.09","caseType":"일반행정","basis":"참조조문","text":"관할 행정청이 甲 주택재건축 정비사업조합에 토지등소유자인 乙이 정보공개를 청구한 조합원명부와 서면결의서 중 주민등록번호를 제외하고 성명, 주소, 권리내역, 전화번호 등을 공개하라는 조치명령을 한 사안에서, 관련 자료를 공개하는 것이 도시 및 주거환경정비법 제81조 제3항이나 개인정보 보호법의 취지에 어긋나지 않으므로 조치명령이 적법하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=179105"},{"id":"P:182801","kind":"P","label":"2015노166","title":"개인정보보호법위반","court":"서울북부지방법원","date":"2015.05.21","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=182801"},{"id":"P:179916","kind":"P","label":"2014노2820","title":"공직선거법위반·국가정보원법위반","court":"서울고등법원","date":"2015.02.09","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=179916"},{"id":"P:197797","kind":"P","label":"2014고합259","title":"공직선거법위반·개인정보보호법위반","court":"청주지방법원","date":"2015.01.22","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=197797"},{"id":"P:182806","kind":"P","label":"2014고단2134","title":"개인정보보호법위반","court":"서울북부지방법원","date":"2015.01.13","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=182806"},{"id":"P:207622","kind":"P","label":"2014노2680","title":"정보통신망이용촉진및정보보호등에관한법률위반(음란물유포)방조ㆍ청소년보호법위반ㆍ아동ㆍ청소년의성보호에관한법률위반(음란물제작ㆍ배포등)방조{예비적죄명:정보통신망이용촉진및정보보호등에관한법률위반(음란물유포)방조}ㆍ아동ㆍ청소년의성보호에관한법률위반(음란물제작ㆍ배포등){예비적죄명:정보통신망이용촉진및정보보호등에관한법률위반(음란물유포)}","court":"인천지방법원","date":"2014.12.19","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=207622"},{"id":"P:198481","kind":"P","label":"2014고단2754","title":"개인정보보호법위반","court":"광주지방법원","date":"2014.11.20","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=198481"},{"id":"P:177582","kind":"P","label":"2014구합57867","title":"주민등록번호변경거부처분취소","court":"서울행정법원","date":"2014.11.06","caseType":"일반행정","basis":"참조조문","text":"甲 등이 관할 행정청에 주민등록번호 변경을 요구하는 민원을 제기하였으나 변경이 어렵다는 회신을 받은 사안에서, 甲 등에게 주민등록번호 변경에 관한 법규상 또는 조리상 신청권이 있다고 볼 수 없어, 위 회신은 항고소송의 대상이 되는 처분에 해당하지 않는다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=177582"},{"id":"P:176484","kind":"P","label":"2013나49885","title":"부당이득금반환","court":"서울중앙지방법원","date":"2014.11.04","caseType":"민사","basis":"판례내용","text":"국립대학교 교수 甲이, 인물정보 제공 사이트를 운영하면서 甲 등 국내 인물들의 개인정보를 제3자에게 유료로 제공해 온 乙 주식회사 등, 포털사이트를 운영하면서 乙 회사 등과 업무제휴를 맺은 후 甲 등 국내 인물들의 개인정보에 대한 메타정보를 제공받아 제3자에게 무료로 제공하면서 상세한 정보는 제휴사가 유료로 제공한다는 취지의 안내 등을 해 온 丙 주식회사 등, 종합법률정보 제공 사이트를 운영하면서 甲 등 국내 법과대학 교수들의 개인정보를 유료로 제공해 온 丁 주식회사를 상대로 개인정보자기결정권 침해 등을 이유로 불법행위에 따른 손해배상을 구한 사안에서, 乙 회사 등과 丁 회사의 불법행위책임 및 丙 회사 등의 乙 회사 등과 공동불법행위책임을 인정한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=176484"},{"id":"P:179903","kind":"P","label":"2013고합577","title":"공직선거법위반·국가정보원법위반","court":"서울중앙지방법원","date":"2014.09.11","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=179903"},{"id":"P:183233","kind":"P","label":"2013누14476","title":"시정조치등취소","court":"서울고등법원","date":"2014.01.09","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=183233"},{"id":"P:173240","kind":"P","label":"2013노613","title":"특정범죄가중처벌등에관한법률위반(알선수재)·개인정보보호법위반·배임수재·배임증재·변호사법위반방조","court":"서울고등법원","date":"2013.05.30","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=173240"},{"id":"P:173251","kind":"P","label":"2012고합545","title":"특정범죄가중처벌등에관한법률위반(알선수재)·개인정보보호법위반·배임수재·배임증재·변호사법위반방조","court":"수원지방법원","date":"2013.01.02","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=173251"},{"id":"P:164323","kind":"P","label":"2011두2361","title":"정보공개청구거부처분취소","court":"대법원","date":"2012.06.18","caseType":"일반행정","basis":"판례내용","text":"[1] 공공기관의 정보공개에 관한 법률 제9조 제1항 제6호 본문에서 정한 ‘당해 정보에 포함되어 있는 이름·주민등록번호 등 개인에 관한 사항으로서 공개될 경우 개인의 사생활의 비밀 또는 자유를 침해할 우려가 있다고 인정되는 정보’의 의미와 범위 [2] 고소인이, 자신이 고소하였다가 불기소처분된 사건기록의 피의자신문조서, 진술조서 중 피의자 등 개인의 인적사항을 제외한 부분의 정보공개를 청구하였으나 해당 검찰청 검사장이 공공기관의 정보공개에 관한 법률 제9조 제1항 제6호에 해당한다는 이유로 비공개결정을 한 사안에서, 비공개결정한 정보 중 개인에 관한 정보가 포함된 부분이 비공개대상정보에 해당한다고 본 원심판단을 수긍한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=164323"},{"id":"P:215693","kind":"P","label":"2007두9877","title":"정보공개거부처분취소등","court":"대법원","date":"2010.02.25","caseType":"일반행정","basis":"판례내용","text":"[1] 공공기관의 정보공개에 관한 법률 제9조 제1항 제5호에서 정한 ‘공개될 경우 업무의 공정한 수행에 현저한 지장을 초래한다고 인정할 만한 상당한 이유가 있는 경우’의 의미 [2] 학교교육에서의 시험에 관한 정보로서 ‘공개될 경우 업무의 공정한 수행에 현저한 지장을 초래하는지 여부’의 판단 기준 [3] ‘2002년도 및 2003년도 국가 수준 학업성취도평가 자료’는 공공기관의 정보공개에 관한 법률 제9조 제1항 제5호에서 정한 비공개대상정보에 해당하는 부분이 있으나, ‘2002학년도부터 2005학년도까지의 대학수학능력시험 원데이터’는 연구목적으로 그 정보의 공개를 청구하는 경우 위 조항의 비공개대상정보에 해당하지 않는다고 한 사례 [4] 기관이 아닌 개인이 타인에 관한 정보의 공개를 청구하는 경우에는 ‘구 공공기관의 개인정보보호에 관한 법률’이 아닌 ‘공공기관의 정보공개에 관한 법률’ 제9조 제1항 제6호에 따라 개인에 관한 정보의 공개 여부를 판단하여야 한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=215693"},{"id":"P:143327","kind":"P","label":"2006누23588","title":"정보공개거부처분취소등","court":"서울고등법원","date":"2007.04.27","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=143327"},{"id":"P:70524","kind":"P","label":"2005구합20825","title":"정보공개거부처분취소등","court":"서울행정법원","date":"2006.09.06","caseType":"일반행정","basis":"판례내용","text":"[1] 공공기관이 해당 정보를 보유·관리하지 않게 된 경우 정보공개를 구할 수 있는지 여부 및 당해 정보를 공공기관이 관리하고 있다는 점에 관한 증명의 정도 [2] 공공기관이 문서 등 유체물의 형태로 정보를 보유하는 경우와는 달리 전산기기에 개개의 정보를 전산자료로 입력하여 보유·관리하는 경우, 형식적으로 개개의 정보자료를 이용한 결과를 산출하지 아니하여 당해 정보를 보유하지 않고 있다는 이유로 공개대상정보에 대한 정보공개를 거부할 수 있는지 여부 [3] 2002년도부터 2005년도까지의 대학입학수학능력시험 원데이터 정보가공공기관의 정보공개에 관한 법률 제9조 제1항 제5호 및공공기관의 개인정보보호에 관한 법률 제13조 제1호 목에서 정한 비공개대상 내지 열람제한대상의 정보에 해당하는지 여부 [4] 2002년도와 2003년도 국가수준 학업성취도 평가 연구자용 분석자료에 관한 정보가공공기관의 정보공개에 관한 법률 제9조 제1항 제1호,제5호 및공공기관의 개인정보보호에 관한 법률 제13조 제1호 목,목에서 정한 비공개대상 내지 열람제한대상의 정보에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=70524"},{"id":"P:69628","kind":"P","label":"2003카합3433","title":"제작배포금지가처분","court":"서울지방법원","date":"2003.11.27","caseType":"민사","basis":"판례내용","text":"[1] 교육인적자원부 장관이 대학입시 수험생들의 고등학교 생활기록부에 담긴 인적 사항 등을 CD에 수록하여 제작·배포하는 행위의 금지를 구하는 소송이 민사소송의 대상인지 여부 [2] 교육인적자원부 장관에게 대학입시 전형자료인 학교생활기록부 전산자료를 제출받아 이를 각 대학에 배포할 수 있는 권한이 있는지 여부 [3] 대학입시 수험생들의 고등학교 생활기록부에 담긴 인적 사항 등의 내용을 수록한 CD의 제작·배포가 공공기관의개인정보보호에관한법률 제10조 제2항 제2호 소정의 '다른 법률에서 정하는 소관업무를 수행하기 위하여 당해 처리정보를 이용할 상당한 이유가 있는 경우'에 해당하는지 여부 [4] 대학입시 수험생들의 고등학교 생활기록부에 담긴 인적 사항 등의 내용을 수록한 CD의 제작·배포금지를 구하는 가처분신청의 보전의 필요성이 인정된다고 판단한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=69628"},{"id":"P:393918","kind":"P","label":"","title":"정보공개거부처분취소","court":"","date":"0001.01.01","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=393918"},{"id":"P:414130","kind":"P","label":"","title":"정보공개거부처분취소","court":"","date":"0001.01.01","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=414130"},{"id":"P:416138","kind":"P","label":"","title":"정보부분공개처분취소","court":"","date":"0001.01.01","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=416138"},{"id":"P:393920","kind":"P","label":"","title":"정 for (const n of G.nodes) {
  let size = 6;
  if (n.kind === "L") size = 9 + Math.min(5, Math.sqrt(deg(n.id)));
  if (n.kind === "D" || n.kind === "R") size = 5 + Math.min(4, Math.sqrt(deg(n.id)) * 0.8);
  if (n.kind === "P") size = n.court === "대법원" ? 7 : 5;
  if (n.kind === "X") size = 6 + Math.min(5, deg(n.id));
  elements.push({
    group: "nodes",
    data: { id: n.id, kind: n.kind, size, short: isArt(n.kind) ? shortNo(n) : n.label, ghost: n.ghost ? 1 : 0 },
    position: pos[n.id], classes: n.kind + (n.ghost || n.deleted ? " gone" : ""),
  });
}
G.chapters.forEach((c, i) => {
  const r = R_LAW - 48;
  elements.push({ group: "nodes", data: { id: "CH" + i, ch: c.name.replace(/^제/, "") }, position: { x: r * Math.cos(c.a), y: r * Math.sin(c.a) }, classes: "chapter", selectable: false, grabbable: false });
});
G.edges.forEach((e, i) => elements.push({ group: "edges", data: { id: "e" + i, source: e.source, target: e.target, kind: e.kind, w: e.weight }, classes: e.kind }));

function tokens() {
  const s = getComputedStyle(document.documentElement);
  const v = k => s.getPropertyValue(k).trim();
  return { fg: v("--fg"), muted: v("--muted"), bg: v("--surface"), line: v("--line"), law: v("--law"), decree: v("--decree"), rule: v("--rule"), prec: v("--prec"), ext: v("--ext"), cite: v("--cite"), sel: v("--sel"), mono: v("--font-mono") };
}
function style(t) {
  return [
    { selector: "node", style: { width: "data(size)", height: "data(size)", "border-width": 0, label: "", "font-family": t.mono, "font-size": 5, color: t.fg, "min-zoomed-font-size": 7, "text-valign": "center", "text-halign": "center" } },
    { selector: "node.L", style: { "background-color": t.law, label: "data(short)", color: "#fff", "font-size": 4, "text-outline-width": 0 } },
    { selector: "node.D", style: { "background-color": t.decree, shape: "round-rectangle" } },
    { selector: "node.R", style: { "background-color": t.rule, shape: "round-triangle" } },
    { selector: "node.P", style: { "background-color": t.prec, shape: "diamond" } },
    { selector: "node.X", style: { "background-color": t.ext, shape: "hexagon", label: "data(short)", "font-family": "IBM Plex Sans KR, sans-serif", "font-size": 6, color: t.muted, "text-valign": "bottom", "text-margin-y": 2 } },
    { selector: "node.gone", style: { "background-opacity": 0.25, "border-width": 0.6, "border-color": t.muted, "border-style": "dashed", color: t.fg } },
    { selector: "node.chapter", style: { label: "data(ch)", width: 1, height: 1, "background-opacity": 0, "font-family": "Nanum Myeongjo, serif", "font-weight": 700, "font-size": 9, color: t.muted, "text-wrap": "wrap", "text-max-width": 70, "text-background-color": t.bg, "text-background-opacity": 0.8, "text-background-padding": 2, events: "no", "min-zoomed-font-size": 4 } },
    { selector: "edge", style: { "curve-style": "haystack", "haystack-radius": 0, width: 0.5, opacity: 0.22 } },
    { selector: "edge.delegates", style: { "line-color": t.decree, width: 0.8, opacity: 0.45 } },
    { selector: "edge.cites", style: { "line-color": t.cite } },
    { selector: "edge.precedent", style: { "line-color": t.prec, opacity: 0.18 } },
    { selector: "edge.external", style: { "line-color": t.ext, opacity: 0.35 } },
    { selector: ".faded", style: { opacity: 0.07 } },
    { selector: "edge.faded", style: { opacity: 0.02 } },
    { selector: "node.chapter.faded", style: { opacity: 0.25 } },
    { selector: "node.hl", style: { label: "data(short)", "font-size": 5, "text-valign": "bottom", "text-margin-y": 2, color: t.fg, "text-background-color": t.bg, "text-background-opacity": 0.85, "text-background-padding": 1 } },
    { selector: "node.L.hl", style: { "text-valign": "center", "text-margin-y": 0, color: "#fff", "text-background-opacity": 0 } },
    { selector: "edge.hl", style: { "curve-style": "straight", opacity: 0.9, width: 0.9, "target-arrow-shape": "triangle", "arrow-scale": 0.45 } },
    { selector: "edge.hl.delegates", style: { "target-arrow-color": t.decree } },
    { selector: "edge.hl.cites", style: { "target-arrow-color": t.cite } },
    { selector: "edge.hl.precedent", style: { "target-arrow-color": t.prec } },
    { selector: "edge.hl.external", style: { "target-arrow-color": t.ext } },
    { selector: "node.sel", style: { "border-width": 1.5, "border-color": t.sel, "border-style": "solid", "z-index": 10 } },
  ];
}

const cy = cytoscape({
  container: document.getElementById("cy"),
  elements, layout: { name: "preset" }, style: style(tokens()),
  minZoom: 0.05, maxZoom: 8, wheelSensitivity: 0.25, boxSelectionEnabled: false, autoungrabify: true,
});
const fitAll = (animate = false) => animate
  ? cy.animate({ fit: { eles: cy.elements(":visible"), padding: 16 }, duration: 300 })
  : cy.fit(cy.elements(":visible"), 16);
const restyle = () => cy.style(style(tokens()));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", restyle);
new MutationObserver(restyle).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

/* ---------- 필터 ---------- */
const kinds = ["delegates", "cites", "precedent", "external"];
function applyFilters() {
  cy.batch(() => {
    for (const k of kinds) {
      const on = document.getElementById("t-" + k).checked;
      cy.edges("." + k).style("display", on ? "element" : "none");
    }
    const showP = document.getElementById("t-precedent").checked;
    const showX = document.getElementById("t-external").checked;
    cy.nodes(".P").style("display", showP ? "element" : "none");
    cy.nodes(".X").style("display", showX ? "element" : "none");
  });
  if (current) select(current, false);
}
kinds.forEach(k => document.getElementById("t-" + k).addEventListener("change", applyFilters));

/* ---------- 선택과 패널 ---------- */
let current = null;
const panel = document.getElementById("panel");

function select(id, move = true) {
  current = id;
  const n = cy.$id(id);
  cy.batch(() => {
    cy.elements().removeClass("hl sel").addClass("faded");
    const hood = n.closedNeighborhood().filter(el => el.style("display") !== "none");
    hood.removeClass("faded").addClass("hl");
    n.addClass("sel");
  });
  if (move) cy.animate({ fit: { eles: n.closedNeighborhood(":visible"), padding: 60 }, duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 350 });
  renderNode(byId.get(id));
}
function clearSel() {
  current = null;
  cy.elements().removeClass("faded hl sel");
  renderHome();
}
cy.on("tap", "node", e => { if (!e.target.hasClass("chapter")) select(e.target.id()); });
cy.on("tap", e => { if (e.target === cy) clearSel(); });
document.getElementById("reset").addEventListener("click", () => { clearSel(); fitAll(true); });

const lawUrl = n => {
  const name = MAIN.replace(/\s/g, "") + ({ L: "", D: "시행령", R: "시행규칙" }[n.kind]);
  return "https://www.law.go.kr/법령/" + name + "/" + n.label.replace(/^(법|영|규칙) /, "");
};
const color = k => ({ L: "var(--law)", D: "var(--decree)", R: "var(--rule)", P: "var(--prec)", X: "var(--ext)" }[k]);

function itemBtn(n, extra = "") {
  const title = n.kind === "P" ? `${n.court || ""} ${fmtDate(n.date)} ${n.title || ""}` : (n.title || "");
  return `<button class="item" type="button" data-id="${esc(n.id)}"><span class="no"><span class="dot" style="background:${color(n.kind)}"></span>${esc(n.label)}</span><span class="t">${esc(title)}</span><span class="n">${extra}</span></button>`;
}
function group(title, list, limit = 12) {
  if (!list.length) return "";
  const shown = list.slice(0, limit).map(([n, extra]) => itemBtn(n, extra)).join("");
  const rest = list.length > limit ? `<button class="item more" type="button" data-more>외 ${list.length - limit}건 더 보기</button><div class="list" hidden>${list.slice(limit).map(([n, extra]) => itemBtn(n, extra)).join("")}</div>` : "";
  return `<section><h3>${esc(title)} · ${list.length}</h3><div class="list">${shown}${rest}</div></section>`;
}
const neigh = (id, dir, kind) => ((dir === "out" ? outE : inE).get(id) || []).filter(e => e.kind === kind)
  .map(e => [byId.get(dir === "out" ? e.target : e.source), e.weight > 1 ? "×" + e.weight : ""]);
const sortArt = l => l.sort((a, b) => (a[0].kind === b[0].kind ? artKey(a[0].id) - artKey(b[0].id) : a[0].kind.localeCompare(b[0].kind)));
const sortPrec = l => l.sort((a, b) => (b[0].date || "").localeCompare(a[0].date || ""));

function renderNode(n) {
  let html = "";
  if (isArt(n.kind)) {
    html += `<div><div class="kindtag"><span class="chip" style="color:${color(n.kind)}">${KIND[n.kind].long}</span>${esc(n.chapter || "")}</div>
      <h2>${esc(n.label)}${n.title ? " (" + esc(n.title) + ")" : ""}</h2></div>`;
    if (n.ghost) html += `<p class="note">현행 법에는 이 번호의 조문이 없습니다. 판례가 개정 전 조문 번호로 인용한 것입니다.</p>`;
    else if (n.deleted) html += `<p class="note">현행 법에서 삭제된 조문입니다. 이 조문을 다룬 판례는 삭제 전 조문을 인용한 것입니다.</p>`;
    else html += `<div class="lawtext">${esc(n.text.replace(/^제\d+조(의\d+)?\([^)]*\)\s*/, ""))}</div>
      <a class="note" href="${lawUrl(n)}" target="_blank" rel="noopener">국가법령정보센터에서 보기 ↗</a>`;
    html += group(n.kind === "L" ? "하위 법령에 위임" : "위임 근거 (법)", sortArt(neigh(n.id, n.kind === "L" ? "out" : "in", "delegates")));
    html += group("이 조문이 인용하는 조문", sortArt(neigh(n.id, "out", "cites")));
    html += group("이 조문을 인용하는 조문", sortArt(neigh(n.id, "in", "cites")));
    html += group("인용하는 다른 법령", neigh(n.id, "out", "external"));
    html += group("이 조문을 다룬 판례", sortPrec(neigh(n.id, "in", "precedent").map(([p]) => [p, p.court === "대법원" ? "대법원" : ""])), 15);
  } else if (n.kind === "P") {
    html += `<div><div class="kindtag"><span class="chip" style="color:var(--prec)">${esc(n.court || "법원")}</span>${esc(fmtDate(n.date))} 선고 · ${esc(n.caseType || "")}</div>
      <h2>${esc(n.label)}</h2><div class="note">${esc(n.title)}</div></div>`;
    if (n.text) html += `<section><h3>판시사항</h3><div class="lawtext">${esc(n.text)}</div></section>`;
    html += `<p class="note">조문 연결 근거: ${esc(n.basis)}${n.basis === "판례내용" ? " (판결문 본문에서 자동 추출)" : ""}. <a href="${esc(n.url)}" target="_blank" rel="noopener">판결문 보기 ↗</a></p>`;
    html += group("인용한 조문", sortArt(neigh(n.id, "out", "precedent")), 30);
  } else {
    html += `<div><div class="kindtag"><span class="chip" style="color:var(--ext)">다른 법령</span></div><h2>${esc(n.label)}</h2></div>`;
    html += group("이 법령을 인용하는 조문", sortArt(neigh(n.id, "in", "external")));
  }
  html += `<button class="btn" type="button" id="back">← 전체 요약으로</button>`;
  panel.innerHTML = html;
  panel.scrollTop = 0;
}

function rank(title, note, rows, colorVar) {
  const max = Math.max(...rows.map(r => r[1]));
  return `<section><h3>${esc(title)}</h3>${note ? `<p class="note" style="margin:0 0 6px">${note}</p>` : ""}<div class="list">${rows.map(([n, v]) =>
    `<button class="item" type="button" data-id="${esc(n.id)}"><span class="no">${esc(n.label)}</span><span class="t">${esc(n.title)}</span><span class="n">${v}</span><span class="bar" style="background:${colorVar};width:${(v / max * 100).toFixed(1)}%"></span></button>`).join("")}</div></section>`;
}
function renderHome() {
  const lawN = G.nodes.filter(n => n.kind === "L" && !n.ghost);
  const top = (fn, k = 8) => lawN.map(n => [n, fn(n.id)]).filter(r => r[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, k);
  const inCites = id => (inE.get(id) || []).filter(e => e.kind === "cites").reduce((s, e) => s + e.weight, 0);
  const dels = id => (outE.get(id) || []).filter(e => e.kind === "delegates").length;
  panel.innerHTML = `
    <div><div class="kindtag">읽는 법</div>
    <p class="note" style="margin:4px 0 0">파란 원이 법 조문(숫자는 조 번호), 주황 네모가 시행령 조문${hasRule ? ", 청록 세모가 시행규칙 조문" : ""}, 보라 마름모가 판례입니다. 하위 법령과 판례는 자신이 연결된 법 조문 쪽에 놓여 있어, 판례가 몰린 방향이 곧 분쟁이 많은 조문입니다. 큰 마름모는 대법원 판결입니다.</p></div>
    ${rank("판례가 가장 많이 다룬 조문", "", top(precCount), "var(--prec)")}
    ${rank("법 안에서 가장 많이 인용되는 조문", "", top(inCites), "var(--cite)")}
    ${rank(hasRule ? "시행령·시행규칙 위임이 가장 많은 조문" : "시행령 위임이 가장 많은 조문", "", top(dels, 6), "var(--decree)")}`;
}
panel.addEventListener("click", e => {
  const more = e.target.closest("[data-more]");
  if (more) { more.nextElementSibling.hidden = false; more.remove(); return; }
  if (e.target.closest("#back")) { clearSel(); fitAll(true); return; }
  const b = e.target.closest("[data-id]");
  if (b) select(b.dataset.id);
});

/* ---------- 검색 ---------- */
const q = document.getElementById("q"), results = document.getElementById("results");
function search(s) {
  s = s.trim();
  if (!s) return [];
  let kind = null, m;
  if ((m = s.match(/^(법|영|시행령|규칙|시행규칙)\s*(.*)$/))) { kind = m[1] === "법" ? "L" : /규칙/.test(m[1]) ? "R" : "D"; s = m[2]; }
  const num = s.match(/^제?\s*(\d+)\s*(?:조)?\s*(?:의\s*(\d+))?$/);
  const out = [];
  for (const n of G.nodes) {
    if (kind && n.kind !== kind) continue;
    let score = 0;
    if (num && isArt(n.kind)) {
      const id = n.kind + ":" + (+num[1]) + (num[2] ? "-" + (+num[2]) : "");
      if (n.id === id) score = { L: 100, D: 90, R: 85 }[n.kind];
      else if (n.id.startsWith(n.kind + ":" + (+num[1]) + "-") && !num[2]) score = 40;
    }
    if (!score && s.length >= 2) {
      if (n.label.includes(s)) score = 60;
      else if ((n.title || "").includes(s)) score = 50;
      else if (n.kind === "L" && n.text.includes(s)) score = 10;
    }
    if (score) out.push([score, n]);
  }
  return out.sort((a, b) => b[0] - a[0] || artKey(a[1].id.replace(/^P:.*/, "Z:0")) - artKey(b[1].id.replace(/^P:.*/, "Z:0"))).slice(0, 12).map(r => r[1]);
}
q.addEventListener("input", () => {
  const list = search(q.value);
  results.hidden = !list.length;
  results.innerHTML = list.map(n => itemBtn(n)).join("");
});
q.addEventListener("keydown", e => {
  if (e.key === "Enter") { const first = results.querySelector("[data-id]"); if (first) first.click(); }
  if (e.key === "Escape") { results.hidden = true; }
});
results.addEventListener("click", e => {
  const b = e.target.closest("[data-id]");
  if (!b) return;
  const n = byId.get(b.dataset.id);
  if (n.kind === "P" && !document.getElementById("t-precedent").checked) { document.getElementById("t-precedent").checked = true; applyFilters(); }
  if (n.kind === "X" && !document.getElementById("t-external").checked) { document.getElementById("t-external").checked = true; applyFilters(); }
  results.hidden = true;
  select(b.dataset.id);
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) results.hidden = true; });

/* ---------- 머리말·각주 ---------- */
const M = G.meta, cnt = k => G.nodes.filter(n => n.kind === k && !n.ghost).length, ecnt = k => G.edges.filter(e => e.kind === k).length;
const d8 = s => `${s.slice(0, 4)}. ${+s.slice(4, 6)}. ${+s.slice(6)}.`;
const T = M.tiers, tierList = ["L", "D", "R"].filter(k => T[k]);
document.getElementById("eyebrow").textContent = tierList.map(k => `${{ L: "법률", D: "시행령", R: "시행규칙" }[k]} ${d8(T[k].efYd)}`).join(" · ") + " 시행본 기준";
document.getElementById("stats").innerHTML = [
  ["var(--law)", "법 조문", cnt("L")], ["var(--decree)", "시행령 조문", cnt("D")], ...(hasRule ? [["var(--rule)", "시행규칙 조문", cnt("R")]] : []), ["var(--prec)", "판례", cnt("P")], ["var(--ext)", "다른 법령", cnt("X")],
].map(([c, l, v]) => `<span><span class="dot" style="background:${c}"></span>${l} <b>${v}</b></span>`).join("") +
  `<span>위임 <b>${ecnt("delegates")}</b> · 조문 인용 <b>${ecnt("cites")}</b> · 판례 연결 <b>${ecnt("precedent")}</b></span>`;
document.getElementById("foot").innerHTML = `
  <p><b>자료.</b> ${esc(M.source)}에서 ${tierList.map(k => `${esc(T[k].name)}(${d8(T[k].promul)} 공포)`).join(", ")}의 조문, 위임조문 3단비교, 판례를 받아 만들었습니다.</p>
  <p><b>연결 만드는 방법.</b> 위임은 법제처 3단비교 자료를 그대로 썼습니다. 조문 인용은 조문 본문의 「법령명」 제N조, 같은 법, 법 제N조, 영 제N조 같은 표현을 규칙으로 읽어 냈습니다. 판례는 본문에 '${esc(MAIN)}'이 나오는 ${M.precedentsListed}건을 찾은 뒤, 참조조문(${M.precedentBasis["참조조문"]}건)·판시사항과 판결요지(${M.precedentBasis["판결요지"]}건)·판결문 본문(${M.precedentBasis["판례내용"]}건) 순으로 조문을 뽑았습니다. 조문을 찾지 못한 ${M.precedentBasis["없음"]}건은 대부분 다른 법이 쟁점인 사건이라 뺐습니다.</p>
  <p><b>주의.</b> 판례는 판결 당시 법의 조문 번호로 인용하므로, 개정으로 번호가 바뀐 조문은 현행 조문과 내용이 다를 수 있습니다. 자동 추출이라 빠지거나 잘못 잡힌 연결이 있을 수 있으니, 실무에는 원문을 확인해 주세요.</p>`;

applyFilters();
fitAll();
renderHome();
</script>

</body>
</html>
