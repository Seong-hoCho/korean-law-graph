<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>개인정보 보호법 참조 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 법 조문을 장(章) 순서대로 둥글게 놓은 '조문 바퀴' — 안쪽 원이 법, 그 바깥이 시행령, 가장 바깥이 판례·다른 법령. 오른쪽 패널에 선택한 조문의 연결 관계를 보여 준다. */
:root {
  --bg: #f4f5f2;
  --surface: #ffffff;
  --fg: #1c2229;
  --muted: #5f6a72;
  --line: #d9ddd6;
  --law: #1f5a8a;
  --decree: #b26b12;
  --prec: #8a3a6c;
  --rule: #2c8577;
  --ext: #7d7264;
  --cite: #3d7cb5;
  --sel: #d43c2c;
  --font-display: "Nanum Myeongjo", "Noto Serif KR", "Batang", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161a; --surface: #1a2026; --fg: #e6e9e4; --muted: #96a0a6; --line: #2c343b;
    --law: #6aa6da; --decree: #e3a14a; --prec: #d27fb2; --rule: #5cc2b1; --ext: #b3a898; --cite: #7fb2e3; --sel: #ff7a63;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161a; --surface: #1a2026; --fg: #e6e9e4; --muted: #96a0a6; --line: #2c343b;
  --law: #6aa6da; --decree: #e3a14a; --prec: #d27fb2; --rule: #5cc2b1; --ext: #b3a898; --cite: #7fb2e3; --sel: #ff7a63;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 1440px; margin: 0 auto; display: grid; gap: 16px; }
header { display: grid; gap: 6px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: .04em; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 3.4vw, 38px); line-height: 1.2; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 70ch; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.stats b { color: var(--fg); font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
@media (max-width: 960px) { .main { grid-template-columns: minmax(0, 1fr); } }

.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.search { position: relative; flex: 1 1 220px; min-width: 0; }
.search input { width: 100%; font: inherit; font-size: 13px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
.search input:focus-visible, button:focus-visible, label.tog:focus-within { outline: 2px solid var(--sel); outline-offset: 1px; }
.results { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; max-height: 300px; overflow-y: auto; box-shadow: 0 8px 24px rgb(0 0 0 / .12); }
.toggles { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; }
label.tog { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; border-radius: 4px; }
label.tog input { accent-color: var(--fg); margin: 0; }
.swatch { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
.btn { font: inherit; font-size: 12.5px; padding: 6px 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 6px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
#cy { width: 100%; height: min(78vh, 820px); min-height: 440px; }

aside.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 14px; min-width: 0; max-height: calc(min(78vh, 820px) + 52px); overflow-y: auto; }
@media (max-width: 960px) { aside.panel { max-height: none; } }
.panel h2 { font-family: var(--font-display); font-size: 22px; margin: 0; line-height: 1.25; text-wrap: balance; }
.panel h3 { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; margin: 0 0 6px; }
.kindtag { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; }
.lawtext { white-space: pre-wrap; font-size: 13px; line-height: 1.65; background: var(--bg); border-radius: 6px; padding: 10px 12px; max-height: 260px; overflow-y: auto; }
.list { display: grid; gap: 2px; }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: baseline; text-align: left; font: inherit; font-size: 13px; padding: 5px 6px; border: 0; background: none; color: var(--fg); border-radius: 5px; cursor: pointer; width: 100%; }
.item:hover { background: var(--bg); }
.item .no { font-family: var(--font-mono); font-size: 12px; white-space: nowrap; }
.item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.item .n { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 4px; border-radius: 2px; margin-top: 3px; grid-column: 2 / 4; }
.more { font-size: 12px; color: var(--muted); padding: 2px 6px; }
.note { font-size: 12.5px; color: var(--muted); }
a { color: var(--law); }
footer { font-size: 12.5px; color: var(--muted); display: grid; gap: 6px; max-width: 90ch; }
footer p { margin: 0; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1>개인정보 보호법 참조 지도</h1>
    <p class="lede">개인정보 보호법 조문을 장 순서대로 둥글게 놓고, 하위 법령 위임·조문 사이 인용·다른 법령 인용·판례 연결을 한 그림에 모았습니다. 조문이나 판례를 누르면 연결된 것만 남고, 오른쪽에 원문과 연결 목록이 나옵니다.</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="main">
    <section class="stage" aria-label="참조 그래프">
      <div class="toolbar">
        <div class="search">
          <input id="q" type="search" placeholder="조문 번호·제목·사건번호 검색 (예: 17, 영 3, 국외 이전, 2023도)" autocomplete="off" aria-label="검색">
          <div class="results" id="results" hidden></div>
        </div>
        <div class="toggles" role="group" aria-label="연결 종류">
          <label class="tog"><input type="checkbox" id="t-delegates" checked><span class="swatch" style="background:var(--decree)"></span>위임</label>
          <label class="tog"><input type="checkbox" id="t-cites" checked><span class="swatch" style="background:var(--cite)"></span>조문 인용</label>
          <label class="tog"><input type="checkbox" id="t-precedent" checked><span class="swatch" style="background:var(--prec)"></span>판례</label>
          <label class="tog"><input type="checkbox" id="t-external"><span class="swatch" style="background:var(--ext)"></span>다른 법령</label>
        </div>
        <button class="btn" id="reset" type="button">전체 보기</button>
      </div>
      <div id="cy"></div>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>

  <footer id="foot"></footer>
</div>

<script>
const G = {"meta":{"main":"개인정보 보호법","tiers":{"L":{"name":"개인정보 보호법","efYd":"20260911","promul":"20260310"},"D":{"name":"개인정보 보호법 시행령","efYd":"20260911","promul":"20260910"}},"precedentsListed":335,"precedentBasis":{"참조조문":58,"판결요지":1,"판례내용":71,"없음":175},"source":"법제처 국가법령정보 공동활용 Open API (DRF)"},"nodes":[{"id":"L:1","label":"법 제1조","title":"목적","chapter":"제1장 총칙","deleted":false,"text":"제1조(목적) 이 법은 개인정보의 처리 및 보호에 관한 사항을 정함으로써 개인의 자유와 권리를 보호하고, 나아가 개인의 존엄과 가치를 구현함을 목적으로 한다. <개정 2014.3.24>","kind":"L"},{"id":"L:2","label":"법 제2조","title":"정의","chapter":"제1장 총칙","deleted":false,"text":"1. \"개인정보\"란 살아 있는 개인에 관한 정보로서 다음 각 목의 어느 하나에 해당하는 정보를 말한다.\n가. 성명, 주민등록번호 및 영상 등을 통하여 개인을 알아볼 수 있는 정보\n나. 해당 정보만으로는 특정 개인을 알아볼 수 없더라도 다른 정보와 쉽게 결합하여 알아볼 수 있는 정보. 이 경우 쉽게 결합할 수 있는지 여부는 다른 정보의 입수 가능성 등 개인을 알아보는 데 소요되는 시간, 비용, 기술 등을 합리적으로 고려하여야 한다.\n다. 가목 또는 나목을 제1호의2에 따라 가명처리함으로써 원래의 상태로 복원하기 위한 추가 정보의 사용ㆍ결합 없이는 특정 개인을 알아볼 수 없는 정보(이하 \"가명정보\"라 한다)\n1의2. \"가명처리\"란 개인정보의 일부를 삭제하거나 일부 또는 전부를 대체하는 등의 방법으로 추가 정보가 없이는 특정 개인을 알아볼 수 없도록 처리하는 것을 말한다.\n2. \"처리\"란 개인정보의 수집, 생성, 연계, 연동, 기록, 저장, 보유, 가공, 편집, 검색, 출력, 정정(訂正), 복구, 이용, 제공, 공개, 파기(破棄), 그 밖에 이와 유사한 행위를 말한다.\n3. \"정보주체\"란 처리되는 정보에 의하여 알아볼 수 있는 사람으로서 그 정보의 주체가 되는 사람을 말한다.\n4. \"개인정보파일\"이란 개인정보를 쉽게 검색할 수 있도록 일정한 규칙에 따라 체계적으로 배열하거나 구성한 개인정보의 집합물(集合物)을 말한다.\n5. \"개인정보처리자\"란 업무를 목적으로 개인정보파일을 운용하기 위하여 스스로 또는 다른 사람을 통하여 개인정보를 처리하는 공공기관, 법인, 단체 및 개인 등을 말한다.\n6. \"공공기관\"이란 다음 각 목의 기관을 말한다.\n가. 국회, 법원, 헌법재판소, 중앙선거관리위원회의 행정사무를 처리하는 기관, 중앙행정기관(대통령 소속 기관과 국무총리 소속 기관을 포함한다) 및 그 소속 기관, 지방자치단체\n나. 그 밖의 국가기관 및 공공단체 중 대통령령으로 정하는 기관\n7. \"고정형 영상정보처리기기\"란 일정한 공간에 설치되어 지속적 또는 주기적으로 사람 또는 사물의 영상 등을 촬영하거나 이를 유ㆍ무선망을 통하여 전송하는 장치로서 대통령령으로 정하는 장치를 말한다.\n7의2. \"이동형 영상정보처리기기\"란 사람이 신체에 착용 또는 휴대하거나 이동 가능한 물체에 부착 또는 거치(据置)하여 사람 또는 사물의 영상 등을 촬영하거나 이를 유ㆍ무선망을 통하여 전송하는 장치로서 대통령령으로 정하는 장치를 말한다.\n8. \"과학적 연구\"란 기술의 개발과 실증, 기초연구, 응용연구 및 민간 투자 연구 등 과학적 방법을 적용하는 연구를 말한다.\n제2조(정의) 이 법에서 사용하는 용어의 뜻은 다음과 같다. <개정 2014.3.24, 2020.2.4, 2023.3.14>","kind":"L"},{"id":"L:3","label":"법 제3조","title":"개인정보 보호 원칙","chapter":"제1장 총칙","deleted":false,"text":"① 개인정보처리자는 개인정보의 처리 목적을 명확하게 하여야 하고 그 목적에 필요한 범위에서 최소한의 개인정보만을 적법하고 정당하게 수집하여야 한다.\n② 개인정보처리자는 개인정보의 처리 목적에 필요한 범위에서 적합하게 개인정보를 처리하여야 하며, 그 목적 외의 용도로 활용하여서는 아니 된다.\n③ 개인정보처리자는 개인정보의 처리 목적에 필요한 범위에서 개인정보의 정확성, 완전성 및 최신성이 보장되도록 하여야 한다.\n④ 개인정보처리자는 개인정보의 처리 방법 및 종류 등에 따라 정보주체의 권리가 침해받을 가능성과 그 위험 정도를 고려하여 개인정보를 안전하게 관리하여야 한다.\n⑤ 개인정보처리자는 제30조에 따른 개인정보 처리방침 등 개인정보의 처리에 관한 사항을 공개하여야 하며, 열람청구권 등 정보주체의 권리를 보장하여야 한다. <개정 2023.3.14>\n⑥ 개인정보처리자는 정보주체의 사생활 침해를 최소화하는 방법으로 개인정보를 처리하여야 한다.\n⑦ 개인정보처리자는 개인정보를 익명 또는 가명으로 처리하여도 개인정보 수집목적을 달성할 수 있는 경우 익명처리가 가능한 경우에는 익명에 의하여, 익명처리로 목적을 달성할 수 없는 경우에는 가명에 의하여 처리될 수 있도록 하여야 한다. <개정 2020.2.4>\n⑧ 개인정보처리자는 이 법 및 관계 법령에서 규정하고 있는 책임과 의무를 준수하고 실천함으로써 정보주체의 신뢰를 얻기 위하여 노력하여야 한다.\n제3조(개인정보 보호 원칙)","kind":"L"},{"id":"L:4","label":"법 제4조","title":"정보주체의 권리","chapter":"제1장 총칙","deleted":false,"text":"1. 개인정보의 처리에 관한 정보를 제공받을 권리\n2. 개인정보의 처리에 관한 동의 여부, 동의 범위 등을 선택하고 결정할 권리\n3. 개인정보의 처리 여부를 확인하고 개인정보에 대한 열람(사본의 발급을 포함한다. 이하 같다) 및 전송을 요구할 권리\n4. 개인정보의 처리 정지, 정정ㆍ삭제 및 파기를 요구할 권리\n5. 개인정보의 처리로 인하여 발생한 피해를 신속하고 공정한 절차에 따라 구제받을 권리\n6. 완전히 자동화된 개인정보 처리에 따른 결정을 거부하거나 그에 대한 설명 등을 요구할 권리\n제4조(정보주체의 권리) 정보주체는 자신의 개인정보 처리와 관련하여 다음 각 호의 권리를 가진다. <개정 2023.3.14>","kind":"L"},{"id":"L:5","label":"법 제5조","title":"국가 등의 책무","chapter":"제1장 총칙","deleted":false,"text":"① 국가와 지방자치단체는 개인정보의 목적 외 수집, 오용ㆍ남용 및 무분별한 감시ㆍ추적 등에 따른 폐해를 방지하여 인간의 존엄과 개인의 사생활 보호를 도모하기 위한 시책을 강구하여야 한다.\n② 국가와 지방자치단체는 제4조에 따른 정보주체의 권리를 보호하기 위하여 법령의 개선 등 필요한 시책을 마련하여야 한다.\n③ 국가와 지방자치단체는 만 14세 미만 아동이 개인정보 처리가 미치는 영향과 정보주체의 권리 등을 명확하게 알 수 있도록 만 14세 미만 아동의 개인정보 보호에 필요한 시책을 마련하여야 한다. <신설 2023.3.14>\n④ 국가와 지방자치단체는 개인정보의 처리에 관한 불합리한 사회적 관행을 개선하기 위하여 개인정보처리자의 자율적인 개인정보 보호활동을 존중하고 촉진ㆍ지원하여야 한다. <개정 2023.3.14>\n⑤ 국가와 지방자치단체는 개인정보의 처리에 관한 법령 또는 조례를 적용할 때에는 정보주체의 권리가 보장될 수 있도록 개인정보 보호 원칙에 맞게 적용하여야 한다. <개정 2023.3.14>\n제5조(국가 등의 책무)","kind":"L"},{"id":"L:6","label":"법 제6조","title":"다른 법률과의 관계","chapter":"제1장 총칙","deleted":false,"text":"① 개인정보의 처리 및 보호에 관하여 다른 법률에 특별한 규정이 있는 경우를 제외하고는 이 법에서 정하는 바에 따른다. <개정 2014.3.24, 2023.3.14>\n② 개인정보의 처리 및 보호에 관한 다른 법률을 제정하거나 개정하는 경우에는 이 법의 목적과 원칙에 맞도록 하여야 한다. <신설 2023.3.14>\n제6조(다른 법률과의 관계)","kind":"L"},{"id":"L:7","label":"법 제7조","title":"개인정보 보호위원회","chapter":"제2장 개인정보 보호정책의 수립 등","deleted":false,"text":"① 개인정보 보호에 관한 사무를 독립적으로 수행하기 위하여 국무총리 소속으로 개인정보 보호위원회(이하 \"보호위원회\"라 한다)를 둔다. <개정 2020.2.4>\n② 보호위원회는 「정부조직법」 제2조에 따른 중앙행정기관으로 본다. 다만, 다음 각 호의 사항에 대하여는 「정부조직법」 제18조를 적용하지 아니한다. <개정 2020.2.4>\n1. 제7조의8제3호 및 제4호의 사무\n2. 제7조의9제1항의 심의ㆍ의결 사항 중 제1호에 해당하는 사항\n③ 삭제 <2020.2.4>\n④ 삭제 <2020.2.4>\n⑤ 삭제 <2020.2.4>\n⑥ 삭제 <2020.2.4>\n⑦ 삭제 <2020.2.4>\n⑧ 삭제 <2020.2.4>\n⑨ 삭제 <2020.2.4>\n제7조(개인정보 보호위원회)","kind":"L"},{"id":"L:7-2","label":"법 제7조의2","title":"보호위원회의 구성 등","chapter":"제2장 개인정보 보호정책의 수립 등","deleted":false,"text":"① 보호위원회는 상임위원 2명(위원장 1명, 부위원장 1명)을 포함한 9명의 위원으로 구성한다.\n② 보호위원회의 위원은 개인정보 보호에 관한 경력과 전문지식이 풍부한 다음 각 호의 사람 중에서 위원장과 부위원장은 국무총리의 제청으로, 그 외 위원 중 2명은 위원장의 제청으로, 2명은 대통령이 소속되거나 소속되었던 정당의 교섭단체 추천으로, 3명은 그 외의 교섭단체 추천으로 대통령이 임명 또는 위촉한다.\n1. 개인정보 보호 업무를 담당하는 3급 이상 공무원(고위공무원단에 속하는 공무원을 포함한다)의 직에 있거나 있었던 사람\n2. 판사ㆍ검사ㆍ변호사의 직에 10년 이상 있거나 있었던 사람\n3. 공공기관 또는 단체(개인정보처리자로 구성된 단체를 포함한다)에 3년 이상 임원으로 재직하였거나 이들 기관 또는 단체로부터 추천받은 사람으로서 개인정보 보호 업무를 3년 이상 담당하였던 사람\n4. 개인정보 관련 분야에 전문지식이 있고 「고등교육법」 제2조제1호에 따른 학교에서 부교수 이상으로 5년 이상 재직하고 있거나 재직하였던 사람\n③ 위원장과 부위원장은 정무직 공무원으로 임명한다.\n④ 위원장, 부위원장, 제7조의13에 따른 사무처의 장은 「정부조직법」 제10조에도 불구하고 정부위원이 된다.\n제7조의2(보호위원회의 구성 등)","kind":"L"},{"id":"L:7-3","label":"법 제7조의3","title":"위원장","chapter":"제2장 개인정보 보호정책의 수립 등","deleted":false,"text":"① 위원장은 보호위원회를 대표하고, 보호위원회의 회의를 주재하며, 소관 사무를 총괄한다.\n② 위원장이 부득이한 사유로 직무를 수행할 수 없을 때에는 부위원장이 그 직무를 대행하고, 위원장ㆍ부위원장이 모두 부득이한 사유로 직무를 수행할 수 없을 때에는 위원회가 미리 정하는 위원이 위원장의 직무를 대행한다.\n③ 위원장은 국회에 출석하여 보호위원회의 소관 사무에 관하여 의견을 진술할 수 있으며, 국회에서 요구하면 출석하여 보고하거나 답변하여야 한다.\n④ 위원장은 국무회의에 출석하여 발언할 수 있으며, 그 소관 사무에 관하여 국무총리에게 의안 제출을 건의할 수 있다.\n제7조의3(위원장)","kind":"L"},{"id":"L:7-4","label":"법 제7조의4","title":"위원의 임기","chapter":"제2장 개인정보 보호정책의 수립 등","deleted":false,"text":"① 위원의 임기는 3년으로 하되, 한 차례만 연임할 수 있다.\n② 위원이 궐위된 때에는 지체 없이 새로운 위원을 임명 또는 위촉하여야 한다. 이 경우 후임으로 임명 또는 위촉된 위원의 임기는 새로이 개시된다.\n제7조의4(위원의 임기)","kind":"L"},{"id":"L:7-5","label":"법 제7조의5","title":"위원의 신분보장","chapter":"제2장 개인정보 보호정책의 수립 등","deleted":false,"text":"① 위원은 다음 각 호의 어느 하나에 해당하는 경우를 제외하고는 그 의사에 반하여 면직 또는 해촉되지 아니한다.\n1. 장기간 심신장애로 인하여 직무를 수행할 수 없게 된 경우\n2. 제7조의7의 결격사유에 해당하는 경우\n3. 이 법 또는 그 밖의 다른 법률에 따른 직무상의 의무를 위반한 경우\n② 위원은 법률과 양심에 따라 독립적으로 직무를 수행한다.\n제7조의5(위원의 신분보장)","kind":"L"},{"id":"L:7-6","label":"법 제7조의6","title":"겸직금지 등","chapter":"제2장 개인정보 보호정책의 수립 등","deleted":false,"text":"① 위원은 재직 중 다음 각 호의 직(職)을 겸하거나 직무와 관련된 영리업무에 종사하여서는 아니 된다.\n1. 국회의원 또는 지방의회의원\n2. 국가공무원 또는 지방공무원\n3. 그 밖에 대통령령으로 정하는 직\n② 제1항에 따른 영리업무에 관한 사항은 대통령령으로 정한다.\n③ 위원은 정치활동에 관여할 수 없다.\n제7조의6(겸직금지 등)","kind":"L"},{"id":"L:7-7","label":"법 제7조의7","title":"결격사유","chapter":"제2장 개인정보 보호정책의 수립 등","deleted":false,"text":"① 다음 각 호의 어느 하나에 해당하는 사람은 위원이 될 수 없다.\n1. 대한민국 국민이 아닌 사람\n2. 「국가공무원법」 제33조 각 호의 어느 하나에 해당하는 사람\n3. 「정당법」 제22조에 따른 당원\n② 위원이 제1항 각 호의 어느 하나에 해당하게 된 때에는 그 직에서 당연 퇴직한다. 다만, 「국가공무원법」 제33조제2호는 파산선고를 받은 사람으로서 「채무자 회생 및 파산에 관한 법률」에 따라 신청기한 내에 면책신청을 하지 아니하였거나 면책불허가 결정 또는 면책 취소가 확정된 경우만 해당하고, 같은 법 제33조제5호는 「형법」 제129조부터 제132조까지, 「성폭력범죄의 처벌 등에 관한 특례법」 제2조, 「아동ㆍ청소년의 성보호에 관한 법률」 제2조제2호 및 직무와 관련하여 「형법」 제355조 또는 제356조에 규정된 죄를 범한 사람으로서 금고 이상의 형의 선고유예를 받은 경우만 해당한다.\n제7조의7(결격사유)","kind":"L"},{"id":"L:7-8","label":"법 제7조의8","title":"보호위원회의 소관 사무","chapter":"제2장 개인정보 보호정책의 수립 등","deleted":false,"text":"1. 개인정보의 보호와 관련된 법령의 개선에 관한 사항\n2. 개인정보 보호와 관련된 정책ㆍ제도ㆍ계획 수립ㆍ집행에 관한 사항\n3. 정보주체의 권리침해에 대한 조사 및 이에 따른 처분에 관한 사항\n4. 개인정보의 처리와 관련한 고충처리ㆍ권리구제 및 개인정보에 관한 분쟁의 조정\n5. 개인정보 보호를 위한 국제기구 및 외국의 개인정보 보호기구와의 교류ㆍ협력\n6. 개인정보 보호에 관한 법령ㆍ정책ㆍ제도ㆍ실태 등의 조사ㆍ연구, 교육 및 홍보에 관한 사항\n7. 개인정보 보호에 관한 기술개발의 지원ㆍ보급, 기술의 표준화 및 전문인력의 양성에 관한 사항\n8. 이 법 및 다른 법령에 따라 보호위원회의 사무로 규정된 사항\n제7조의8(보호위원회의 소관 사무) 보호위원회는 다음 각 호의 소관 사무를 수행한다. <개정 2023.3.14>","kind":"L"},{"id":"L:7-9","label":"법 제7조의9","title":"보호위원회의 심의ㆍ의결 사항 등","chapter":"제2장 개인정보 보호정책의 수립 등","deleted":false,"text":"① 보호위원회는 다음 각 호의 사항을 심의ㆍ의결한다. <개정 2023.3.14>\n1. 제8조의2에 따른 개인정보 침해요인 평가에 관한 사항\n2. 제9조에 따른 기본계획 및 제10조에 따른 시행계획에 관한 사항\n3. 개인정보 보호와 관련된 정책, 제도 및 법령의 개선에 관한 사항\n4. 개인정보의 처리에 관한 공공기관 간의 의견조정에 관한 사항\n5. 개인정보 보호에 관한 법령의 해석ㆍ운용에 관한 사항\n6. 제18조제2항제5호에 따른 개인정보의 이용ㆍ제공에 관한 사항\n6의2. 제28조의9에 따른 개인정보의 국외 이전 중지 명령에 관한 사항\n7. 제33조제4항에 따른 영향평가 결과에 관한 사항\n8. 제64조의2에 따른 과징금 부과에 관한 사항\n9. 제61조에 따른 의견제시 및 개선권고에 관한 사항\n9의2. 제63조의2제2항에 따른 시정권고에 관한 사항\n10. 제64조에 따른 시정조치 등에 관한 사항\n11. 제65조에 따른 고발 및 징계권고에 관한 사항\n12. 제66조에 따른 처리 결과의 공표 및 공표명령에 관한 사항\n13. 제75조에 따른 과태료 부과에 관한 사항\n14. 소관 법령 및 보호위원회 규칙의 제정ㆍ개정 및 폐지에 관한 사항\n15. 개인정보 보호와 관련하여 보호위원회의 위원장 또는 위원 2명 이상이 회의에 부치는 사항\n16. 그 밖에 이 법 또는 다른 법령에 따라 보호위원회가 심의ㆍ의결하는 사항\n② 보호위원회는 제1항 각 호의 사항을 심의ㆍ의결하기 위하여 필요한 경우 다음 각 호의 조치를 할 수 있다.\n1. 관계 공무원, 개인정보 보호에 관한 전문 지식이 있는 사람이나 시민사회단체 및 관련 사업자로부터의 의견 청취\n2. 관계 기관 등에 대한 자료제출이나 사실조회 요구\n③ 제2항제2호에 따른 요구를 받은 관계 기관 등은 특별한 사정이 없으면 이에 따라야 한다.\n④ 보호위원회는 제1항제3호의 사항을 심의ㆍ의결한 경우에는 관계 기관에 그 개선을 권고할 수 있다.\n⑤ 보호위원회는 제4항에 따른 권고 내용의 이행 여부를 점검할 수 있다.\n제7조의9(보호위원회의 심의ㆍ의결 사항 등)","kind":"L"},{"id":"L:7-10","label":"법 제7조의10","title":"회의","chapter":"제2장 개인정보 보호정책의 수립 등","deleted":false,"text":"① 보호위원회의 회의는 위원장이 필요하다고 인정하거나 재적위원 4분의 1 이상의 요구가 있는 경우에 위원장이 소집한다.\n② 위원장 또는 2명 이상의 위원은 보호위원회에 의안을 제의할 수 있다.\n③ 보호위원회의 회의는 재적위원 과반수의 출석으로 개의하고, 출석위원 과반수의 찬성으로 의결한다.\n제7조의10(회의)","kind":"L"},{"id":"L:7-11","label":"법 제7조의11","title":"위원의 제척ㆍ기피ㆍ회피","chapter":"제2장 개인정보 보호정책의 수립 등","deleted":false,"text":"① 위원은 다음 각 호의 어느 하나에 해당하는 경우에는 심의ㆍ의결에서 제척된다.\n1. 위원 또는 그 배우자나 배우자였던 자가 해당 사안의 당사자가 되거나 그 사건에 관하여 공동의 권리자 또는 의무자의 관계에 있는 경우\n2. 위원이 해당 사안의 당사자와 친족이거나 친족이었던 경우\n3. 위원이 해당 사안에 관하여 증언, 감정, 법률자문을 한 경우\n4. 위원이 해당 사안에 관하여 당사자의 대리인으로서 관여하거나 관여하였던 경우\n5. 위원이나 위원이 속한 공공기관ㆍ법인 또는 단체 등이 조언 등 지원을 하고 있는 자와 이해관계가 있는 경우\n② 위원에게 심의ㆍ의결의 공정을 기대하기 어려운 사정이 있는 경우 당사자는 기피 신청을 할 수 있고, 보호위원회는 의결로 이를 결정한다.\n③ 위원이 제1항 또는 제2항의 사유가 있는 경우에는 해당 사안에 대하여 회피할 수 있다.\n제7조의11(위원의 제척ㆍ기피ㆍ회피)","kind":"L"},{"id":"L:7-12","label":"법 제7조의12","title":"소위원회","chapter":"제2장 개인정보 보호정책의 수립 등","deleted":false,"text":"① 보호위원회는 효율적인 업무 수행을 위하여 개인정보 침해 정도가 경미하거나 유사ㆍ반복되는 사항 등을 심의ㆍ의결할 소위원회를 둘 수 있다.\n② 소위원회는 3명의 위원으로 구성한다.\n③ 소위원회가 제1항에 따라 심의ㆍ의결한 것은 보호위원회가 심의ㆍ의결한 것으로 본다.\n④ 소위원회의 회의는 구성위원 전원의 출석과 출석위원 전원의 찬성으로 의결한다.\n제7조의12(소위원회)","kind":"L"},{"id":"L:7-13","label":"법 제7조의13","title":"사무처","chapter":"제2장 개인정보 보호정책의 수립 등","deleted":false,"text":"제7조의13(사무처) 보호위원회의 사무를 처리하기 위하여 보호위원회에 사무처를 두며, 이 법에 규정된 것 외에 보호위원회의 조직에 관한 사항은 대통령령으로 정한다.","kind":"L"},{"id":"L:7-14","label":"법 제7조의14","title":"운영 등","chapter":"제2장 개인정보 보호정책의 수립 등","deleted":false,"text":"제7조의14(운영 등) 이 법과 다른 법령에 규정된 것 외에 보호위원회의 운영 등에 필요한 사항은 보호위원회의 규칙으로 정한다.","kind":"L"},{"id":"L:8","label":"법 제8조","title":"","chapter":"제2장 개인정보 보호정책의 수립 등","deleted":true,"text":"제8조 삭제 <2020.2.4>","kind":"L"},{"id":"L:8-2","label":"법 제8조의2","title":"개인정보 침해요인 평가","chapter":"제2장 개인정보 보호정책의 수립 등","deleted":false,"text":"① 중앙행정기관의 장은 소관 법령의 제정 또는 개정을 통하여 개인정보 처리를 수반하는 정책이나 제도를 도입ㆍ변경하는 경우에는 보호위원회에 개인정보 침해요인 평가를 요청하여야 한다.\n② 보호위원회가 제1항에 따른 요청을 받은 때에는 해당 법령의 개인정보 침해요인을 분석ㆍ검토하여 그 법령의 소관기관의 장에게 그 개선을 위하여 필요한 사항을 권고할 수 있다.\n③ 제1항에 따른 개인정보 침해요인 평가의 절차와 방법에 관하여 필요한 사항은 대통령령으로 정한다.\n제8조의2(개인정보 침해요인 평가)","kind":"L"},{"id":"L:9","label":"법 제9조","title":"기본계획","chapter":"제2장 개인정보 보호정책의 수립 등","deleted":false,"text":"① 보호위원회는 개인정보의 보호와 정보주체의 권익 보장을 위하여 3년마다 개인정보 보호 기본계획(이하 \"기본계획\"이라 한다)을 관계 중앙행정기관의 장과 협의하여 수립한다. <개정 2013.3.23, 2014.11.19, 2015.7.24>\n② 기본계획에는 다음 각 호의 사항이 포함되어야 한다.\n1. 개인정보 보호의 기본목표와 추진방향\n2. 개인정보 보호와 관련된 제도 및 법령의 개선\n3. 개인정보 침해 방지를 위한 대책\n4. 개인정보 보호 자율규제의 활성화\n5. 개인정보 보호 교육ㆍ홍보의 활성화\n6. 개인정보 보호를 위한 전문인력의 양성\n7. 그 밖에 개인정보 보호를 위하여 필요한 사항\n③ 국회, 법원, 헌법재판소, 중앙선거관리위원회는 해당 기관(그 소속 기관을 포함한다)의 개인정보 보호를 위한 기본계획을 수립ㆍ시행할 수 있다.\n제9조(기본계획)","kind":"L"},{"id":"L:10","label":"법 제10조","title":"시행계획","chapter":"제2장 개인정보 보호정책의 수립 등","deleted":false,"text":"① 중앙행정기관의 장은 기본계획에 따라 매년 개인정보 보호를 위한 시행계획을 작성하여 보호위원회에 제출하고, 보호위원회의 심의ㆍ의결을 거쳐 시행하여야 한다.\n② 시행계획의 수립ㆍ시행에 필요한 사항은 대통령령으로 정한다.\n제10조(시행계획)","kind":"L"},{"id":"L:11","label":"법 제11조","title":"자료제출 요구 등","chapter":"제2장 개인정보 보호정책의 수립 등","deleted":false,"text":"① 보호위원회는 기본계획을 효율적으로 수립하기 위하여 개인정보처리자, 관계 중앙행정기관의 장, 지방자치단체의 장 및 관계 기관ㆍ단체 등에 개인정보처리자의 법규 준수 현황과 개인정보 관리 실태 등에 관한 자료의 제출이나 의견의 진술 등을 요구할 수 있다. <개정 2013.3.23, 2014.11.19, 2015.7.24>\n② 보호위원회는 개인정보 보호 정책 추진, 성과평가 등을 위하여 필요한 경우 개인정보처리자, 관계 중앙행정기관의 장, 지방자치단체의 장 및 관계 기관ㆍ단체 등을 대상으로 개인정보관리 수준 및 실태파악 등을 위한 조사를 실시할 수 있다. <신설 2015.7.24, 2017.7.26, 2020.2.4>\n③ 중앙행정기관의 장은 시행계획을 효율적으로 수립ㆍ추진하기 위하여 소관 분야의 개인정보처리자에게 제1항에 따른 자료제출 등을 요구할 수 있다. <개정 2015.7.24>\n④ 제1항부터 제3항까지에 따른 자료제출 등을 요구받은 자는 특별한 사정이 없으면 이에 따라야 한다. <개정 2015.7.24>\n⑤ 제1항부터 제3항까지에 따른 자료제출 등의 범위와 방법 등 필요한 사항은 대통령령으로 정한다. <개정 2015.7.24>\n제11조(자료제출 요구 등)","kind":"L"},{"id":"L:11-2","label":"법 제11조의2","title":"개인정보 보호수준 평가","chapter":"제2장 개인정보 보호정책의 수립 등","deleted":false,"text":"① 보호위원회는 공공기관 중 중앙행정기관 및 그 소속기관, 지방자치단체, 그 밖에 대통령령으로 정하는 기관을 대상으로 매년 개인정보 보호 정책ㆍ업무의 수행 및 이 법에 따른 의무의 준수 여부 등을 평가(이하 \"개인정보 보호수준 평가\"라 한다)하여야 한다.\n② 보호위원회는 개인정보 보호수준 평가에 필요한 경우 해당 공공기관의 장에게 관련 자료를 제출하게 할 수 있다.\n③ 보호위원회는 개인정보 보호수준 평가의 결과를 인터넷 홈페이지 등을 통하여 공개할 수 있다.\n④ 보호위원회는 개인정보 보호수준 평가의 결과에 따라 우수기관 및 그 소속 직원에 대하여 포상할 수 있고, 개인정보 보호를 위하여 필요하다고 인정하면 해당 공공기관의 장에게 개선을 권고할 수 있다. 이 경우 권고를 받은 공공기관의 장은 이를 이행하기 위하여 성실하게 노력하여야 하며, 그 조치 결과를 보호위원회에 알려야 한다.\n⑤ 그 밖에 개인정보 보호수준 평가의 기준ㆍ방법ㆍ절차 및 제2항에 따른 자료 제출의 범위 등에 필요한 사항은 대통령령으로 정한다.\n제11조의2(개인정보 보호수준 평가)","kind":"L"},{"id":"L:12","label":"법 제12조","title":"개인정보 보호지침","chapter":"제2장 개인정보 보호정책의 수립 등","deleted":false,"text":"① 보호위원회는 개인정보의 처리에 관한 기준, 개인정보 침해의 유형 및 예방조치 등에 관한 표준 개인정보 보호지침(이하 \"표준지침\"이라 한다)을 정하여 개인정보처리자에게 그 준수를 권장할 수 있다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.2.4>\n② 중앙행정기관의 장은 표준지침에 따라 소관 분야의 개인정보 처리와 관련한 개인정보 보호지침을 정하여 개인정보처리자에게 그 준수를 권장할 수 있다.\n③ 국회, 법원, 헌법재판소 및 중앙선거관리위원회는 해당 기관(그 소속 기관을 포함한다)의 개인정보 보호지침을 정하여 시행할 수 있다.\n제12조(개인정보 보호지침)","kind":"L"},{"id":"L:13","label":"법 제13조","title":"자율규제의 촉진 및 지원","chapter":"제2장 개인정보 보호정책의 수립 등","deleted":false,"text":"1. 개인정보 보호에 관한 교육ㆍ홍보\n2. 개인정보 보호와 관련된 기관ㆍ단체의 육성 및 지원\n3. 개인정보 보호 인증마크의 도입ㆍ시행 지원\n4. 개인정보처리자의 자율적인 규약의 제정ㆍ시행 지원\n5. 그 밖에 개인정보처리자의 자율적 개인정보 보호활동을 지원하기 위하여 필요한 사항\n제13조(자율규제의 촉진 및 지원) 보호위원회는 개인정보처리자의 자율적인 개인정보 보호활동을 촉진하고 지원하기 위하여 다음 각 호의 필요한 시책을 마련하여야 한다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.2.4>","kind":"L"},{"id":"L:13-2","label":"법 제13조의2","title":"개인정보 보호의 날","chapter":"제2장 개인정보 보호정책의 수립 등","deleted":false,"text":"① 개인정보의 보호 및 처리의 중요성을 국민에게 알리기 위하여 매년 9월 30일을 개인정보 보호의 날로 지정한다.\n② 국가와 지방자치단체는 개인정보 보호의 날이 포함된 주간에 개인정보 보호 문화 확산을 위한 각종 행사를 실시할 수 있다.\n제13조의2(개인정보 보호의 날)","kind":"L"},{"id":"L:14","label":"법 제14조","title":"국제협력","chapter":"제2장 개인정보 보호정책의 수립 등","deleted":false,"text":"① 정부는 국제적 환경에서의 개인정보 보호 수준을 향상시키기 위하여 필요한 시책을 마련하여야 한다.\n② 정부는 개인정보 국외 이전으로 인하여 정보주체의 권리가 침해되지 아니하도록 관련 시책을 마련하여야 한다.\n제14조(국제협력)","kind":"L"},{"id":"L:15","label":"법 제15조","title":"개인정보의 수집ㆍ이용","chapter":"제3장 개인정보의 처리","deleted":false,"text":"① 개인정보처리자는 다음 각 호의 어느 하나에 해당하는 경우에는 개인정보를 수집할 수 있으며 그 수집 목적의 범위에서 이용할 수 있다. <개정 2023.3.14>\n1. 정보주체의 동의를 받은 경우\n2. 법률에 특별한 규정이 있거나 법령상 의무를 준수하기 위하여 불가피한 경우\n3. 공공기관이 법령 등에서 정하는 소관 업무의 수행을 위하여 불가피한 경우\n4. 정보주체와 체결한 계약을 이행하거나 계약을 체결하는 과정에서 정보주체의 요청에 따른 조치를 이행하기 위하여 필요한 경우\n5. 명백히 정보주체 또는 제3자의 급박한 생명, 신체, 재산의 이익을 위하여 필요하다고 인정되는 경우\n6. 개인정보처리자의 정당한 이익을 달성하기 위하여 필요한 경우로서 명백하게 정보주체의 권리보다 우선하는 경우. 이 경우 개인정보처리자의 정당한 이익과 상당한 관련이 있고 합리적인 범위를 초과하지 아니하는 경우에 한한다.\n7. 공중위생 등 공공의 안전과 안녕을 위하여 긴급히 필요한 경우\n② 개인정보처리자는 제1항제1호에 따른 동의를 받을 때에는 다음 각 호의 사항을 정보주체에게 알려야 한다. 다음 각 호의 어느 하나의 사항을 변경하는 경우에도 이를 알리고 동의를 받아야 한다.\n1. 개인정보의 수집ㆍ이용 목적\n2. 수집하려는 개인정보의 항목\n3. 개인정보의 보유 및 이용 기간\n4. 동의를 거부할 권리가 있다는 사실 및 동의 거부에 따른 불이익이 있는 경우에는 그 불이익의 내용\n③ 개인정보처리자는 당초 수집 목적과 합리적으로 관련된 범위에서 정보주체에게 불이익이 발생하는지 여부, 암호화 등 안전성 확보에 필요한 조치를 하였는지 여부 등을 고려하여 대통령령으로 정하는 바에 따라 정보주체의 동의 없이 개인정보를 이용할 수 있다. <신설 2020.2.4>\n제15조(개인정보의 수집ㆍ이용)","kind":"L"},{"id":"L:16","label":"법 제16조","title":"개인정보의 수집 제한","chapter":"제3장 개인정보의 처리","deleted":false,"text":"① 개인정보처리자는 제15조제1항 각 호의 어느 하나에 해당하여 개인정보를 수집하는 경우에는 그 목적에 필요한 최소한의 개인정보를 수집하여야 한다. 이 경우 최소한의 개인정보 수집이라는 입증책임은 개인정보처리자가 부담한다.\n② 개인정보처리자는 정보주체의 동의를 받아 개인정보를 수집하는 경우 필요한 최소한의 정보 외의 개인정보 수집에는 동의하지 아니할 수 있다는 사실을 구체적으로 알리고 개인정보를 수집하여야 한다. <신설 2013.8.6>\n③ 개인정보처리자는 정보주체가 필요한 최소한의 정보 외의 개인정보 수집에 동의하지 아니한다는 이유로 정보주체에게 재화 또는 서비스의 제공을 거부하여서는 아니 된다. <개정 2013.8.6>\n제16조(개인정보의 수집 제한)","kind":"L"},{"id":"L:17","label":"법 제17조","title":"개인정보의 제공","chapter":"제3장 개인정보의 처리","deleted":false,"text":"① 개인정보처리자는 다음 각 호의 어느 하나에 해당되는 경우에는 정보주체의 개인정보를 제3자에게 제공(공유를 포함한다. 이하 같다)할 수 있다. <개정 2020.2.4, 2023.3.14>\n1. 정보주체의 동의를 받은 경우\n2. 제15조제1항제2호, 제3호 및 제5호부터 제7호까지에 따라 개인정보를 수집한 목적 범위에서 개인정보를 제공하는 경우\n② 개인정보처리자는 제1항제1호에 따른 동의를 받을 때에는 다음 각 호의 사항을 정보주체에게 알려야 한다. 다음 각 호의 어느 하나의 사항을 변경하는 경우에도 이를 알리고 동의를 받아야 한다.\n1. 개인정보를 제공받는 자\n2. 개인정보를 제공받는 자의 개인정보 이용 목적\n3. 제공하는 개인정보의 항목\n4. 개인정보를 제공받는 자의 개인정보 보유 및 이용 기간\n5. 동의를 거부할 권리가 있다는 사실 및 동의 거부에 따른 불이익이 있는 경우에는 그 불이익의 내용\n③ 삭제 <2023.3.14>\n④ 개인정보처리자는 당초 수집 목적과 합리적으로 관련된 범위에서 정보주체에게 불이익이 발생하는지 여부, 암호화 등 안전성 확보에 필요한 조치를 하였는지 여부 등을 고려하여 대통령령으로 정하는 바에 따라 정보주체의 동의 없이 개인정보를 제공할 수 있다. <신설 2020.2.4>\n제17조(개인정보의 제공)","kind":"L"},{"id":"L:18","label":"법 제18조","title":"개인정보의 목적 외 이용ㆍ제공 제한","chapter":"제3장 개인정보의 처리","deleted":false,"text":"① 개인정보처리자는 개인정보를 제15조제1항에 따른 범위를 초과하여 이용하거나 제17조제1항 및 제28조의8제1항에 따른 범위를 초과하여 제3자에게 제공하여서는 아니 된다. <개정 2020.2.4, 2023.3.14>\n② 제1항에도 불구하고 개인정보처리자는 다음 각 호의 어느 하나에 해당하는 경우에는 정보주체 또는 제3자의 이익을 부당하게 침해할 우려가 있을 때를 제외하고는 개인정보를 목적 외의 용도로 이용하거나 이를 제3자에게 제공할 수 있다. 다만, 제5호부터 제9호까지에 따른 경우는 공공기관의 경우로 한정한다. <개정 2020.2.4, 2023.3.14>\n1. 정보주체로부터 별도의 동의를 받은 경우\n2. 다른 법률에 특별한 규정이 있는 경우\n3. 명백히 정보주체 또는 제3자의 급박한 생명, 신체, 재산의 이익을 위하여 필요하다고 인정되는 경우\n4. 삭제<2020.2.4>\n5. 개인정보를 목적 외의 용도로 이용하거나 이를 제3자에게 제공하지 아니하면 다른 법률에서 정하는 소관 업무를 수행할 수 없는 경우로서 보호위원회의 심의ㆍ의결을 거친 경우\n6. 조약, 그 밖의 국제협정의 이행을 위하여 외국정부 또는 국제기구에 제공하기 위하여 필요한 경우\n7. 범죄의 수사와 공소의 제기 및 유지를 위하여 필요한 경우\n8. 법원의 재판업무 수행을 위하여 필요한 경우\n9. 형(刑) 및 감호, 보호처분의 집행을 위하여 필요한 경우\n10. 공중위생 등 공공의 안전과 안녕을 위하여 긴급히 필요한 경우\n③ 개인정보처리자는 제2항제1호에 따른 동의를 받을 때에는 다음 각 호의 사항을 정보주체에게 알려야 한다. 다음 각 호의 어느 하나의 사항을 변경하는 경우에도 이를 알리고 동의를 받아야 한다.\n1. 개인정보를 제공받는 자\n2. 개인정보의 이용 목적(제공 시에는 제공받는 자의 이용 목적을 말한다)\n3. 이용 또는 제공하는 개인정보의 항목\n4. 개인정보의 보유 및 이용 기간(제공 시에는 제공받는 자의 보유 및 이용 기간을 말한다)\n5. 동의를 거부할 권리가 있다는 사실 및 동의 거부에 따른 불이익이 있는 경우에는 그 불이익의 내용\n④ 공공기관은 제2항제2호부터 제6호까지, 제8호부터 제10호까지에 따라 개인정보를 목적 외의 용도로 이용하거나 이를 제3자에게 제공하는 경우에는 그 이용 또는 제공의 법적 근거, 목적 및 범위 등에 관하여 필요한 사항을 보호위원회가 고시로 정하는 바에 따라 관보 또는 인터넷 홈페이지 등에 게재하여야 한다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.2.4, 2023.3.14>\n⑤ 개인정보처리자는 제2항 각 호의 어느 하나의 경우에 해당하여 개인정보를 목적 외의 용도로 제3자에게 제공하는 경우에는 개인정보를 제공받는 자에게 이용 목적, 이용 방법, 그 밖에 필요한 사항에 대하여 제한을 하거나, 개인정보의 안전성 확보를 위하여 필요한 조치를 마련하도록 요청하여야 한다. 이 경우 요청을 받은 자는 개인정보의 안전성 확보를 위하여 필요한 조치를 하여야 한다.\n제18조(개인정보의 목적 외 이용ㆍ제공 제한)","kind":"L"},{"id":"L:19","label":"법 제19조","title":"개인정보를 제공받은 자의 이용ㆍ제공 제한","chapter":"제3장 개인정보의 처리","deleted":false,"text":"1. 정보주체로부터 별도의 동의를 받은 경우\n2. 다른 법률에 특별한 규정이 있는 경우\n제19조(개인정보를 제공받은 자의 이용ㆍ제공 제한) 개인정보처리자로부터 개인정보를 제공받은 자는 다음 각 호의 어느 하나에 해당하는 경우를 제외하고는 개인정보를 제공받은 목적 외의 용도로 이용하거나 이를 제3자에게 제공하여서는 아니 된다.","kind":"L"},{"id":"L:20","label":"법 제20조","title":"정보주체 이외로부터 수집한 개인정보의 수집 출처 등 통지","chapter":"제3장 개인정보의 처리","deleted":false,"text":"① 개인정보처리자가 정보주체 이외로부터 수집한 개인정보를 처리하는 때에는 정보주체의 요구가 있으면 즉시 다음 각 호의 모든 사항을 정보주체에게 알려야 한다. <개정 2023.3.14>\n1. 개인정보의 수집 출처\n2. 개인정보의 처리 목적\n3. 제37조에 따른 개인정보 처리의 정지를 요구하거나 동의를 철회할 권리가 있다는 사실\n② 제1항에도 불구하고 처리하는 개인정보의 종류ㆍ규모, 종업원 수 및 매출액 규모 등을 고려하여 대통령령으로 정하는 기준에 해당하는 개인정보처리자가 제17조제1항제1호에 따라 정보주체 이외로부터 개인정보를 수집하여 처리하는 때에는 제1항 각 호의 모든 사항을 정보주체에게 알려야 한다. 다만, 개인정보처리자가 수집한 정보에 연락처 등 정보주체에게 알릴 수 있는 개인정보가 포함되지 아니한 경우에는 그러하지 아니하다. <신설 2016.3.29>\n③ 제2항 본문에 따라 알리는 경우 정보주체에게 알리는 시기ㆍ방법 및 절차 등 필요한 사항은 대통령령으로 정한다. <신설 2016.3.29>\n④ 제1항과 제2항 본문은 다음 각 호의 어느 하나에 해당하는 경우에는 적용하지 아니한다. 다만, 이 법에 따른 정보주체의 권리보다 명백히 우선하는 경우에 한한다. <개정 2016.3.29, 2023.3.14>\n1. 통지를 요구하는 대상이 되는 개인정보가 제32조제2항 각 호의 어느 하나에 해당하는 개인정보파일에 포함되어 있는 경우\n2. 통지로 인하여 다른 사람의 생명ㆍ신체를 해할 우려가 있거나 다른 사람의 재산과 그 밖의 이익을 부당하게 침해할 우려가 있는 경우\n제20조(정보주체 이외로부터 수집한 개인정보의 수집 출처 등 통지)","kind":"L"},{"id":"L:20-2","label":"법 제20조의2","title":"개인정보 이용ㆍ제공 내역의 통지","chapter":"제3장 개인정보의 처리","deleted":false,"text":"① 대통령령으로 정하는 기준에 해당하는 개인정보처리자는 이 법에 따라 수집한 개인정보의 이용ㆍ제공 내역이나 이용ㆍ제공 내역을 확인할 수 있는 정보시스템에 접속하는 방법을 주기적으로 정보주체에게 통지하여야 한다. 다만, 연락처 등 정보주체에게 통지할 수 있는 개인정보를 수집ㆍ보유하지 아니한 경우에는 통지하지 아니할 수 있다.\n② 제1항에 따른 통지의 대상이 되는 정보주체의 범위, 통지 대상 정보, 통지 주기 및 방법 등에 필요한 사항은 대통령령으로 정한다.\n제20조의2(개인정보 이용ㆍ제공 내역의 통지)","kind":"L"},{"id":"L:21","label":"법 제21조","title":"개인정보의 파기","chapter":"제3장 개인정보의 처리","deleted":false,"text":"① 개인정보처리자는 보유기간의 경과, 개인정보의 처리 목적 달성, 가명정보의 처리 기간 경과 등 그 개인정보가 불필요하게 되었을 때에는 지체 없이 그 개인정보를 파기하여야 한다. 다만, 다른 법령에 따라 보존하여야 하는 경우에는 그러하지 아니하다. <개정 2023.3.14>\n② 개인정보처리자가 제1항에 따라 개인정보를 파기할 때에는 복구 또는 재생되지 아니하도록 조치하여야 한다.\n③ 개인정보처리자가 제1항 단서에 따라 개인정보를 파기하지 아니하고 보존하여야 하는 경우에는 해당 개인정보 또는 개인정보파일을 다른 개인정보와 분리하여서 저장ㆍ관리하여야 한다.\n④ 개인정보의 파기방법 및 절차 등에 필요한 사항은 대통령령으로 정한다.\n제21조(개인정보의 파기)","kind":"L"},{"id":"L:22","label":"법 제22조","title":"동의를 받는 방법","chapter":"제3장 개인정보의 처리","deleted":false,"text":"① 개인정보처리자는 이 법에 따른 개인정보의 처리에 대하여 정보주체(제22조의2제1항에 따른 법정대리인을 포함한다. 이하 이 조에서 같다)의 동의를 받을 때에는 각각의 동의 사항을 구분하여 정보주체가 이를 명확하게 인지할 수 있도록 알리고 동의를 받아야 한다. 이 경우 다음 각 호의 경우에는 동의 사항을 구분하여 각각 동의를 받아야 한다. <개정 2017.4.18, 2023.3.14>\n1. 제15조제1항제1호에 따라 동의를 받는 경우\n2. 제17조제1항제1호에 따라 동의를 받는 경우\n3. 제18조제2항제1호에 따라 동의를 받는 경우\n4. 제19조제1호에 따라 동의를 받는 경우\n5. 제23조제1항제1호에 따라 동의를 받는 경우\n6. 제24조제1항제1호에 따라 동의를 받는 경우\n7. 재화나 서비스를 홍보하거나 판매를 권유하기 위하여 개인정보의 처리에 대한 동의를 받으려는 경우\n8. 그 밖에 정보주체를 보호하기 위하여 동의 사항을 구분하여 동의를 받아야 할 필요가 있는 경우로서 대통령령으로 정하는 경우\n② 개인정보처리자는 제1항의 동의를 서면(「전자문서 및 전자거래 기본법」 제2조제1호에 따른 전자문서를 포함한다)으로 받을 때에는 개인정보의 수집ㆍ이용 목적, 수집ㆍ이용하려는 개인정보의 항목 등 대통령령으로 정하는 중요한 내용을 보호위원회가 고시로 정하는 방법에 따라 명확히 표시하여 알아보기 쉽게 하여야 한다. <신설 2017.4.18, 2017.7.26, 2020.2.4>\n③ 개인정보처리자는 정보주체의 동의 없이 처리할 수 있는 개인정보에 대해서는 그 항목과 처리의 법적 근거를 정보주체의 동의를 받아 처리하는 개인정보와 구분하여 제30조제2항에 따라 공개하거나 전자우편 등 대통령령으로 정하는 방법에 따라 정보주체에게 알려야 한다. 이 경우 동의 없이 처리할 수 있는 개인정보라는 입증책임은 개인정보처리자가 부담한다. <개정 2016.3.29, 2017.4.18, 2023.3.14>\n④ 삭제 <2023.3.14>\n⑤ 개인정보처리자는 정보주체가 선택적으로 동의할 수 있는 사항을 동의하지 아니하거나 제1항제3호 및 제7호에 따른 동의를 하지 아니한다는 이유로 정보주체에게 재화 또는 서비스의 제공을 거부하여서는 아니 된다. <개정 2017.4.18, 2023.3.14>\n⑥ 삭제 <2023.3.14>\n⑦ 제1항부터 제5항까지에서 규정한 사항 외에 정보주체의 동의를 받는 세부적인 방법에 관하여 필요한 사항은 개인정보의 수집매체 등을 고려하여 대통령령으로 정한다. <개정 2017.4.18, 2023.3.14>\n제22조(동의를 받는 방법)","kind":"L"},{"id":"L:22-2","label":"법 제22조의2","title":"아동의 개인정보 보호","chapter":"제3장 개인정보의 처리","deleted":false,"text":"① 개인정보처리자는 만 14세 미만 아동의 개인정보를 처리하기 위하여 이 법에 따른 동의를 받아야 할 때에는 그 법정대리인의 동의를 받아야 하며, 법정대리인이 동의하였는지를 확인하여야 한다.\n② 제1항에도 불구하고 법정대리인의 동의를 받기 위하여 필요한 최소한의 정보로서 대통령령으로 정하는 정보는 법정대리인의 동의 없이 해당 아동으로부터 직접 수집할 수 있다.\n③ 개인정보처리자는 만 14세 미만의 아동에게 개인정보 처리와 관련한 사항의 고지 등을 할 때에는 이해하기 쉬운 양식과 명확하고 알기 쉬운 언어를 사용하여야 한다.\n④ 제1항부터 제3항까지에서 규정한 사항 외에 동의 및 동의 확인 방법 등에 필요한 사항은 대통령령으로 정한다.\n제22조의2(아동의 개인정보 보호)","kind":"L"},{"id":"L:23","label":"법 제23조","title":"민감정보의 처리 제한","chapter":"제3장 개인정보의 처리","deleted":false,"text":"①개인정보처리자는 사상ㆍ신념, 노동조합ㆍ정당의 가입ㆍ탈퇴, 정치적 견해, 건강, 성생활 등에 관한 정보, 그 밖에 정보주체의 사생활을 현저히 침해할 우려가 있는 개인정보로서 대통령령으로 정하는 정보(이하 \"민감정보\"라 한다)를 처리하여서는 아니 된다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는  그러하지 아니하다. <개정 2016.3.29>\n1. 정보주체에게 제15조제2항 각 호 또는 제17조제2항 각 호의 사항을 알리고 다른 개인정보의 처리에 대한 동의와 별도로 동의를 받은 경우\n2. 법령에서 민감정보의 처리를 요구하거나 허용하는 경우\n② 개인정보처리자가 제1항 각 호에 따라 민감정보를 처리하는 경우에는 그 민감정보가 분실ㆍ도난ㆍ유출ㆍ위조ㆍ변조 또는 훼손(이하 \"유출등\"이라 한다)이 되지 아니하도록 제29조에 따른 안전성 확보에 필요한 조치를 하여야 한다. <신설 2016.3.29, 2026.3.10>\n③ 개인정보처리자는 재화 또는 서비스를 제공하는 과정에서 공개되는 정보에 정보주체의 민감정보가 포함됨으로써 사생활 침해의 위험성이 있다고 판단하는 때에는 재화 또는 서비스의 제공 전에 민감정보의 공개 가능성 및 비공개를 선택하는 방법을 정보주체가 알아보기 쉽게 알려야 한다. <신설 2023.3.14>\n제23조(민감정보의 처리 제한)","kind":"L"},{"id":"L:24","label":"법 제24조","title":"고유식별정보의 처리 제한","chapter":"제3장 개인정보의 처리","deleted":false,"text":"① 개인정보처리자는 다음 각 호의 경우를 제외하고는 법령에 따라 개인을 고유하게 구별하기 위하여 부여된 식별정보로서 대통령령으로 정하는 정보(이하 \"고유식별정보\"라 한다)를 처리할 수 없다.\n1. 정보주체에게 제15조제2항 각 호 또는 제17조제2항 각 호의 사항을 알리고 다른 개인정보의 처리에 대한 동의와 별도로 동의를 받은 경우\n2. 법령에서 구체적으로 고유식별정보의 처리를 요구하거나 허용하는 경우\n② 삭제 <2013.8.6>\n③ 개인정보처리자가 제1항 각 호에 따라 고유식별정보를 처리하는 경우에는 그 고유식별정보가 유출등이 되지 아니하도록 대통령령으로 정하는 바에 따라 암호화 등 안전성 확보에 필요한 조치를 하여야 한다. <개정 2015.7.24, 2026.3.10>\n④ 보호위원회는 처리하는 개인정보의 종류ㆍ규모, 종업원 수 및 매출액 규모 등을 고려하여 대통령령으로 정하는 기준에 해당하는 개인정보처리자가 제3항에 따라 안전성 확보에 필요한 조치를 하였는지에 관하여 대통령령으로 정하는 바에 따라 정기적으로 조사하여야 한다. <신설 2016.3.29, 2017.7.26, 2020.2.4>\n⑤ 보호위원회는 대통령령으로 정하는 전문기관으로 하여금 제4항에 따른 조사를 수행하게 할 수 있다. <신설 2016.3.29, 2017.7.26, 2020.2.4>\n제24조(고유식별정보의 처리 제한)","kind":"L"},{"id":"L:24-2","label":"법 제24조의2","title":"주민등록번호 처리의 제한","chapter":"제3장 개인정보의 처리","deleted":false,"text":"① 제24조제1항에도 불구하고 개인정보처리자는 다음 각 호의 어느 하나에 해당하는 경우를 제외하고는 주민등록번호를 처리할 수 없다. <개정 2014.11.19, 2016.3.29, 2017.7.26, 2020.2.4>\n1. 법률ㆍ대통령령ㆍ국회규칙ㆍ대법원규칙ㆍ헌법재판소규칙ㆍ중앙선거관리위원회규칙 및 감사원규칙에서 구체적으로 주민등록번호의 처리를 요구하거나 허용한 경우\n2. 정보주체 또는 제3자의 급박한 생명, 신체, 재산의 이익을 위하여 명백히 필요하다고 인정되는 경우\n3. 제1호 및 제2호에 준하여 주민등록번호 처리가 불가피한 경우로서 보호위원회가 고시로 정하는 경우\n② 개인정보처리자는 제24조제3항에도 불구하고 주민등록번호가 유출등이 되지 아니하도록 암호화 조치를 통하여 안전하게 보관하여야 한다. 이 경우 암호화 적용 대상 및 대상별 적용 시기 등에 관하여 필요한 사항은 개인정보의 처리 규모와 유출 시 영향 등을 고려하여 대통령령으로 정한다. <신설 2014.3.24, 2015.7.24, 2026.3.10>\n③ 개인정보처리자는 제1항 각 호에 따라 주민등록번호를 처리하는 경우에도 정보주체가 인터넷 홈페이지를 통하여 회원으로 가입하는 단계에서는 주민등록번호를 사용하지 아니하고도 회원으로 가입할 수 있는 방법을 제공하여야 한다. <개정 2014.3.24>\n④ 보호위원회는 개인정보처리자가 제3항에 따른 방법을 제공할 수 있도록 관계 법령의 정비, 계획의 수립, 필요한 시설 및 시스템의 구축 등 제반 조치를 마련ㆍ지원할 수 있다. <개정 2014.3.24, 2017.7.26, 2020.2.4>\n제24조의2(주민등록번호 처리의 제한)","kind":"L"},{"id":"L:25","label":"법 제25조","title":"고정형 영상정보처리기기의 설치ㆍ운영 제한","chapter":"제3장 개인정보의 처리","deleted":false,"text":"① 누구든지 다음 각 호의 경우를 제외하고는 공개된 장소에 고정형 영상정보처리기기를 설치ㆍ운영하여서는 아니 된다. <개정 2023.3.14>\n1. 법령에서 구체적으로 허용하고 있는 경우\n2. 범죄의 예방 및 수사를 위하여 필요한 경우\n3. 시설의 안전 및 관리, 화재 예방을 위하여 정당한 권한을 가진 자가 설치ㆍ운영하는 경우\n4. 교통단속을 위하여 정당한 권한을 가진 자가 설치ㆍ운영하는 경우\n5. 교통정보의 수집ㆍ분석 및 제공을 위하여 정당한 권한을 가진 자가 설치ㆍ운영하는 경우\n6. 촬영된 영상정보를 저장하지 아니하는 경우로서 대통령령으로 정하는 경우\n② 누구든지 불특정 다수가 이용하는 목욕실, 화장실, 발한실(發汗室), 탈의실 등 개인의 사생활을 현저히 침해할 우려가 있는 장소의 내부를 볼 수 있도록 고정형 영상정보처리기기를 설치ㆍ운영하여서는 아니 된다. 다만, 교도소, 정신보건 시설 등 법령에 근거하여 사람을 구금하거나 보호하는 시설로서 대통령령으로 정하는 시설에 대하여는 그러하지 아니하다. <개정 2023.3.14>\n③ 제1항 각 호에 따라 고정형 영상정보처리기기를 설치ㆍ운영하려는 공공기관의 장과 제2항 단서에 따라 고정형 영상정보처리기기를 설치ㆍ운영하려는 자는 공청회ㆍ설명회의 개최 등 대통령령으로 정하는 절차를 거쳐 관계 전문가 및 이해관계인의 의견을 수렴하여야 한다. <개정 2023.3.14>\n④ 제1항 각 호에 따라 고정형 영상정보처리기기를 설치ㆍ운영하는 자(이하 \"고정형영상정보처리기기운영자\"라 한다)는 정보주체가 쉽게 인식할 수 있도록 다음 각 호의 사항이 포함된 안내판을 설치하는 등 필요한 조치를 하여야 한다. 다만, 「군사기지 및 군사시설 보호법」 제2조제2호에 따른 군사시설, 「통합방위법」 제2조제13호에 따른 국가중요시설, 그 밖에 대통령령으로 정하는 시설의 경우에는 그러하지 아니하다. <개정 2016.3.29, 2023.3.14>\n1. 설치 목적 및 장소\n2. 촬영 범위 및 시간\n3. 관리책임자의 연락처\n4. 그 밖에 대통령령으로 정하는 사항\n⑤ 고정형영상정보처리기기운영자는 고정형 영상정보처리기기의 설치 목적과 다른 목적으로 고정형 영상정보처리기기를 임의로 조작하거나 다른 곳을 비춰서는 아니 되며, 녹음기능은 사용할 수 없다. <개정 2023.3.14>\n⑥ 고정형영상정보처리기기운영자는 개인정보가 유출등이 되지 아니하도록 제29조에 따라 안전성 확보에 필요한 조치를 하여야 한다. <개정 2015.7.24, 2023.3.14, 2026.3.10>\n⑦ 고정형영상정보처리기기운영자는 대통령령으로 정하는 바에 따라 고정형 영상정보처리기기 운영ㆍ관리 방침을 마련하여야 한다. 다만, 제30조에 따른 개인정보 처리방침을 정할 때 고정형 영상정보처리기기 운영ㆍ관리에 관한 사항을 포함시킨 경우에는 고정형 영상정보처리기기 운영ㆍ관리 방침을 마련하지 아니할 수 있다. <개정 2023.3.14>\n⑧ 고정형영상정보처리기기운영자는 고정형 영상정보처리기기의 설치ㆍ운영에 관한 사무를 위탁할 수 있다. 다만, 공공기관이 고정형 영상정보처리기기 설치ㆍ운영에 관한 사무를 위탁하는 경우에는 대통령령으로 정하는 절차 및 요건에 따라야 한다. <개정 2023.3.14>\n제25조(고정형 영상정보처리기기의 설치ㆍ운영 제한)","kind":"L"},{"id":"L:25-2","label":"법 제25조의2","title":"이동형 영상정보처리기기의 운영 제한","chapter":"제3장 개인정보의 처리","deleted":false,"text":"① 업무를 목적으로 이동형 영상정보처리기기를 운영하려는 자는 다음 각 호의 경우를 제외하고는 공개된 장소에서 이동형 영상정보처리기기로 사람 또는 그 사람과 관련된 사물의 영상(개인정보에 해당하는 경우로 한정한다. 이하 같다)을 촬영하여서는 아니 된다.\n1. 제15조제1항 각 호의 어느 하나에 해당하는 경우\n2. 촬영 사실을 명확히 표시하여 정보주체가 촬영 사실을 알 수 있도록 하였음에도 불구하고 촬영 거부 의사를 밝히지 아니한 경우. 이 경우 정보주체의 권리를 부당하게 침해할 우려가 없고 합리적인 범위를 초과하지 아니하는 경우로 한정한다.\n3. 그 밖에 제1호 및 제2호에 준하는 경우로서 대통령령으로 정하는 경우\n② 누구든지 불특정 다수가 이용하는 목욕실, 화장실, 발한실, 탈의실 등 개인의 사생활을 현저히 침해할 우려가 있는 장소의 내부를 볼 수 있는 곳에서 이동형 영상정보처리기기로 사람 또는 그 사람과 관련된 사물의 영상을 촬영하여서는 아니 된다. 다만, 인명의 구조ㆍ구급 등을 위하여 필요한 경우로서 대통령령으로 정하는 경우에는 그러하지 아니하다.\n③ 제1항 각 호에 해당하여 이동형 영상정보처리기기로 사람 또는 그 사람과 관련된 사물의 영상을 촬영하는 경우에는 불빛, 소리, 안내판 등 대통령령으로 정하는 바에 따라 촬영 사실을 표시하고 알려야 한다.\n④ 제1항부터 제3항까지에서 규정한 사항 외에 이동형 영상정보처리기기의 운영에 관하여는 제25조제6항부터 제8항까지의 규정을 준용한다.\n제25조의2(이동형 영상정보처리기기의 운영 제한)","kind":"L"},{"id":"L:26","label":"법 제26조","title":"업무위탁에 따른 개인정보의 처리 제한","chapter":"제3장 개인정보의 처리","deleted":false,"text":"① 개인정보처리자가 제3자에게 개인정보의 처리 업무를 위탁하는 경우에는 다음 각 호의 내용이 포함된 문서로 하여야 한다. <개정 2023.3.14>\n1. 위탁업무 수행 목적 외 개인정보의 처리 금지에 관한 사항\n2. 개인정보의 기술적ㆍ관리적 보호조치에 관한 사항\n3. 그 밖에 개인정보의 안전한 관리를 위하여 대통령령으로 정한 사항\n② 제1항에 따라 개인정보의 처리 업무를 위탁하는 개인정보처리자(이하 \"위탁자\"라 한다)는 위탁하는 업무의 내용과 개인정보 처리 업무를 위탁받아 처리하는 자(개인정보 처리 업무를 위탁받아 처리하는 자로부터 위탁받은 업무를 다시 위탁받은 제3자를 포함하며, 이하 \"수탁자\"라 한다)를 정보주체가 언제든지 쉽게 확인할 수 있도록 대통령령으로 정하는 방법에 따라  공개하여야 한다. <개정 2023.3.14>\n③ 위탁자가 재화 또는 서비스를 홍보하거나 판매를 권유하는 업무를 위탁하는 경우에는 대통령령으로 정하는 방법에 따라 위탁하는 업무의 내용과 수탁자를 정보주체에게 알려야 한다. 위탁하는 업무의 내용이나 수탁자가 변경된 경우에도 또한 같다.\n④ 위탁자는 업무 위탁으로 인하여 정보주체의 개인정보가 유출등이 되지 아니하도록 수탁자를 교육하고, 처리 현황 점검 등 대통령령으로 정하는 바에 따라 수탁자가 개인정보를 안전하게 처리하는지를 감독하여야 한다. <개정 2015.7.24, 2026.3.10>\n⑤ 수탁자는 개인정보처리자로부터 위탁받은 해당 업무 범위를 초과하여 개인정보를 이용하거나 제3자에게 제공하여서는 아니 된다.\n⑥ 수탁자는 위탁받은 개인정보의 처리 업무를 제3자에게 다시 위탁하려는 경우에는 위탁자의 동의를 받아야 한다. <신설 2023.3.14>\n⑦ 수탁자가 위탁받은 업무와 관련하여 개인정보를 처리하는 과정에서 이 법을 위반하여 발생한 손해배상책임에 대하여는 수탁자를 개인정보처리자의 소속 직원으로 본다. <개정 2023.3.14>\n⑧ 수탁자에 관하여는 제15조부터 제18조까지, 제21조, 제22조, 제22조의2, 제23조, 제24조, 제24조의2, 제25조, 제25조의2, 제27조, 제28조, 제28조의2부터 제28조의5까지, 제28조의7부터 제28조의11까지, 제29조, 제30조, 제30조의2, 제30조의3, 제31조, 제33조, 제34조, 제34조의2, 제35조, 제35조의2, 제36조, 제37조, 제37조의2, 제38조, 제59조, 제63조, 제63조의2 및 제64조의2를 준용한다. 이 경우 \"개인정보처리자\"는 \"수탁자\"로 본다. <개정 2023.3.14, 2026.3.10>\n제26조(업무위탁에 따른 개인정보의 처리 제한)","kind":"L"},{"id":"L:27","label":"법 제27조","title":"영업양도 등에 따른 개인정보의 이전 제한","chapter":"제3장 개인정보의 처리","deleted":false,"text":"① 개인정보처리자는 영업의 전부 또는 일부의 양도ㆍ합병 등으로 개인정보를 다른 사람에게 이전하는 경우에는 미리 다음 각 호의 사항을 대통령령으로 정하는 방법에 따라 해당 정보주체에게 알려야 한다.\n1. 개인정보를 이전하려는 사실\n2. 개인정보를 이전받는 자(이하 \"영업양수자등\"이라 한다)의 성명(법인의 경우에는 법인의 명칭을 말한다), 주소, 전화번호 및 그 밖의 연락처\n3. 정보주체가 개인정보의 이전을 원하지 아니하는 경우 조치할 수 있는 방법 및 절차\n② 영업양수자등은 개인정보를 이전받았을 때에는 지체 없이 그 사실을 대통령령으로 정하는 방법에 따라 정보주체에게 알려야 한다. 다만, 개인정보처리자가 제1항에 따라 그 이전 사실을 이미 알린 경우에는 그러하지 아니하다.\n③ 영업양수자등은 영업의 양도ㆍ합병 등으로 개인정보를 이전받은 경우에는 이전 당시의 본래 목적으로만 개인정보를 이용하거나 제3자에게 제공할 수 있다. 이 경우 영업양수자등은 개인정보처리자로 본다.\n제27조(영업양도 등에 따른 개인정보의 이전 제한)","kind":"L"},{"id":"L:28","label":"법 제28조","title":"개인정보취급자에 대한 감독","chapter":"제3장 개인정보의 처리","deleted":false,"text":"① 개인정보처리자는 개인정보를 처리함에 있어서 개인정보가 안전하게 관리될 수 있도록 임직원, 파견근로자, 시간제근로자 등 개인정보처리자의 지휘ㆍ감독을 받아 개인정보를 처리하는 자(이하 \"개인정보취급자\"라 한다)의 범위를 최소한으로 제한하고, 개인정보취급자에 대하여 적절한 관리ㆍ감독을 하여야 한다. <개정 2023.3.14>\n② 개인정보처리자는 개인정보의 적정한 취급을 보장하기 위하여 개인정보취급자에게 정기적으로 필요한 교육을 실시하여야 한다.\n제28조(개인정보취급자에 대한 감독)","kind":"L"},{"id":"L:28-2","label":"법 제28조의2","title":"가명정보의 처리 등","chapter":"제3장 개인정보의 처리","deleted":false,"text":"① 개인정보처리자는 통계작성, 과학적 연구, 공익적 기록보존 등을 위하여 정보주체의 동의 없이 가명정보를 처리할 수 있다.\n② 개인정보처리자는 제1항에 따라 가명정보를 제3자에게 제공하는 경우에는 특정 개인을 알아보기 위하여 사용될 수 있는 정보를 포함해서는 아니 된다.\n제28조의2(가명정보의 처리 등)","kind":"L"},{"id":"L:28-3","label":"법 제28조의3","title":"가명정보의 결합 제한","chapter":"제3장 개인정보의 처리","deleted":false,"text":"① 제28조의2에도 불구하고 통계작성, 과학적 연구, 공익적 기록보존 등을 위한 서로 다른 개인정보처리자 간의 가명정보의 결합은 보호위원회 또는 관계 중앙행정기관의 장이 지정하는 전문기관이 수행한다.\n② 결합을 수행한 기관 외부로 결합된 정보를 반출하려는 개인정보처리자는 가명정보 또는 제58조의2에 해당하는 정보로 처리한 뒤 전문기관의 장의 승인을 받아야 한다.\n③ 제1항에 따른 결합 절차와 방법, 전문기관의 지정과 지정 취소 기준ㆍ절차, 관리ㆍ감독, 제2항에 따른 반출 및 승인 기준ㆍ절차 등 필요한 사항은 대통령령으로 정한다.\n제28조의3(가명정보의 결합 제한)","kind":"L"},{"id":"L:28-4","label":"법 제28조의4","title":"가명정보에 대한 안전조치의무 등","chapter":"제3장 개인정보의 처리","deleted":false,"text":"① 개인정보처리자는 제28조의2 또는 제28조의3에 따라 가명정보를 처리하는 경우에는 원래의 상태로 복원하기 위한 추가 정보를 별도로 분리하여 보관ㆍ관리하는 등 해당 정보가 유출등이 되지 아니하도록 대통령령으로 정하는 바에 따라 안전성 확보에 필요한 기술적ㆍ관리적 및 물리적 조치를 하여야 한다. <개정 2023.3.14, 2026.3.10>\n② 개인정보처리자는 제28조의2 또는 제28조의3에 따라 가명정보를 처리하는 경우 처리목적 등을 고려하여 가명정보의 처리 기간을 별도로 정할 수 있다. <신설 2023.3.14>\n③ 개인정보처리자는 제28조의2 또는 제28조의3에 따라 가명정보를 처리하고자 하는 경우에는 가명정보의 처리 목적, 제3자 제공 시 제공받는 자, 가명정보의 처리 기간(제2항에 따라 처리 기간을 별도로 정한 경우에 한한다) 등 가명정보의 처리 내용을 관리하기 위하여 대통령령으로 정하는 사항에 대한 관련 기록을 작성하여 보관하여야 하며, 가명정보를 파기한 경우에는 파기한 날부터 3년 이상 보관하여야 한다. <개정 2023.3.14>\n제28조의4(가명정보에 대한 안전조치의무 등)","kind":"L"},{"id":"L:28-5","label":"법 제28조의5","title":"가명정보 처리 시 금지의무 등","chapter":"제3장 개인정보의 처리","deleted":false,"text":"① 제28조의2 또는 제28조의3에 따라 가명정보를 처리하는 자는 특정 개인을 알아보기 위한 목적으로 가명정보를 처리해서는 아니 된다. <개정 2023.3.14>\n② 개인정보처리자는 제28조의2 또는 제28조의3에 따라 가명정보를 처리하는 과정에서 특정 개인을 알아볼 수 있는 정보가 생성된 경우에는 즉시 해당 정보의 처리를 중지하고, 지체 없이 회수ㆍ파기하여야 한다. <개정 2023.3.14>\n제28조의5(가명정보 처리 시 금지의무 등)","kind":"L"},{"id":"L:28-6","label":"법 제28조의6","title":"","chapter":"제3장 개인정보의 처리","deleted":true,"text":"제28조의6 삭제 <2023.3.14>","kind":"L"},{"id":"L:28-7","label":"법 제28조의7","title":"적용범위","chapter":"제3장 개인정보의 처리","deleted":false,"text":"제28조의7(적용범위) 제28조의2 또는 제28조의3에 따라 처리된 가명정보는 제20조, 제20조의2, 제27조, 제34조제1항ㆍ제2항, 제35조, 제35조의2, 제36조 및 제37조를 적용하지 아니한다. <개정 2023.3.14, 2026.3.10>","kind":"L"},{"id":"L:28-8","label":"법 제28조의8","title":"개인정보의 국외 이전","chapter":"제3장 개인정보의 처리","deleted":false,"text":"① 개인정보처리자는 개인정보를 국외로 제공(조회되는 경우를 포함한다)ㆍ처리위탁ㆍ보관(이하 이 절에서 \"이전\"이라 한다)하여서는 아니 된다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 개인정보를 국외로 이전할 수 있다.\n1. 정보주체로부터 국외 이전에 관한 별도의 동의를 받은 경우\n2. 법률, 대한민국을 당사자로 하는 조약 또는 그 밖의 국제협정에 개인정보의 국외 이전에 관한 특별한 규정이 있는 경우\n3. 정보주체와의 계약의 체결 및 이행을 위하여 개인정보의 처리위탁ㆍ보관이 필요한 경우로서 다음 각 목의 어느 하나에 해당하는 경우\n가. 제2항 각 호의 사항을 제30조에 따른 개인정보 처리방침에 공개한 경우\n나. 전자우편 등 대통령령으로 정하는 방법에 따라 제2항 각 호의 사항을 정보주체에게 알린 경우\n4. 개인정보를 이전받는 자가 제32조의2에 따른 개인정보 보호 인증 등 보호위원회가 정하여 고시하는 인증을 받은 경우로서 다음 각 목의 조치를 모두 한 경우\n가. 개인정보 보호에 필요한 안전조치 및 정보주체 권리보장에 필요한 조치\n나. 인증받은 사항을 개인정보가 이전되는 국가에서 이행하기 위하여 필요한 조치\n5. 개인정보가 이전되는 국가 또는 국제기구의 개인정보 보호체계, 정보주체 권리보장 범위, 피해구제 절차 등이 이 법에 따른 개인정보 보호 수준과 실질적으로 동등한 수준을 갖추었다고 보호위원회가 인정하는 경우\n② 개인정보처리자는 제1항제1호에 따른 동의를 받을 때에는 미리 다음 각 호의 사항을 정보주체에게 알려야 한다.\n1. 이전되는 개인정보 항목\n2. 개인정보가 이전되는 국가, 시기 및 방법\n3. 개인정보를 이전받는 자의 성명(법인인 경우에는 그 명칭과 연락처를 말한다)\n4. 개인정보를 이전받는 자의 개인정보 이용목적 및 보유ㆍ이용 기간\n5. 개인정보의 이전을 거부하는 방법, 절차 및 거부의 효과\n③ 개인정보처리자는 제2항 각 호의 어느 하나에 해당하는 사항을 변경하는 경우에는 정보주체에게 알리고 동의를 받아야 한다.\n④ 개인정보처리자는 제1항 각 호 외의 부분 단서에 따라 개인정보를 국외로 이전하는 경우 국외 이전과 관련한 이 법의 다른 규정, 제17조부터 제19조까지의 규정 및 제5장의 규정을 준수하여야 하고, 대통령령으로 정하는 보호조치를 하여야 한다.\n⑤ 개인정보처리자는 이 법을 위반하는 사항을 내용으로 하는 개인정보의 국외 이전에 관한 계약을 체결하여서는 아니 된다.\n⑥ 제1항부터 제5항까지에서 규정한 사항 외에 개인정보 국외 이전의 기준 및 절차 등에 필요한 사항은 대통령령으로 정한다.\n제28조의8(개인정보의 국외 이전)","kind":"L"},{"id":"L:28-9","label":"법 제28조의9","title":"개인정보의 국외 이전 중지 명령","chapter":"제3장 개인정보의 처리","deleted":false,"text":"① 보호위원회는 개인정보의 국외 이전이 계속되고 있거나 추가적인 국외 이전이 예상되는 경우로서 다음 각 호의 어느 하나에 해당하는 경우에는 개인정보처리자에게 개인정보의 국외 이전을 중지할 것을 명할 수 있다.\n1. 제28조의8제1항, 제4항 또는 제5항을 위반한 경우\n2. 개인정보를 이전받는 자나 개인정보가 이전되는 국가 또는 국제기구가 이 법에 따른 개인정보 보호 수준에 비하여 개인정보를 적정하게 보호하지 아니하여 정보주체에게 피해가 발생하거나 발생할 우려가 현저한 경우\n② 개인정보처리자는 제1항에 따른 국외 이전 중지 명령을 받은 경우에는 명령을 받은 날부터 7일 이내에 보호위원회에 이의를 제기할 수 있다.\n③ 제1항에 따른 개인정보 국외 이전 중지 명령의 기준, 제2항에 따른 불복 절차 등에 필요한 사항은 대통령령으로 정한다.\n제28조의9(개인정보의 국외 이전 중지 명령)","kind":"L"},{"id":"L:28-10","label":"법 제28조의10","title":"상호주의","chapter":"제3장 개인정보의 처리","deleted":false,"text":"제28조의10(상호주의) 제28조의8에도 불구하고 개인정보의 국외 이전을 제한하는 국가의 개인정보처리자에 대해서는 해당 국가의 수준에 상응하는 제한을 할 수 있다. 다만, 조약 또는 그 밖의 국제협정의 이행에 필요한 경우에는 그러하지 아니하다.","kind":"L"},{"id":"L:28-11","label":"법 제28조의11","title":"준용규정","chapter":"제3장 개인정보의 처리","deleted":false,"text":"제28조의11(준용규정) 제28조의8제1항 각 호 외의 부분 단서에 따라 개인정보를 이전받은 자가 해당 개인정보를 제3국으로 이전하는 경우에 관하여는 제28조의8 및 제28조의9를 준용한다. 이 경우 \"개인정보처리자\"는 \"개인정보를 이전받은 자\"로, \"개인정보를 이전받는 자\"는 \"제3국에서 개인정보를 이전받는 자\"로 본다.","kind":"L"},{"id":"L:29","label":"법 제29조","title":"안전조치의무","chapter":"제4장 개인정보의 안전한 관리","deleted":false,"text":"제29조(안전조치의무) 개인정보처리자는 개인정보가 유출등이 되지 아니하도록 내부 관리계획 수립, 접속기록 보관 등 대통령령으로 정하는 바에 따라 안전성 확보에 필요한 기술적ㆍ관리적 및 물리적 조치를 하여야 한다. <개정 2015.7.24, 2026.3.10>","kind":"L"},{"id":"L:30","label":"법 제30조","title":"개인정보 처리방침의 수립 및 공개","chapter":"제4장 개인정보의 안전한 관리","deleted":false,"text":"① 개인정보처리자는 다음 각 호의 사항이 포함된 개인정보의 처리 방침(이하 \"개인정보 처리방침\"이라 한다)을 정하여야 한다. 이 경우 공공기관은 제32조에 따라 등록대상이 되는 개인정보파일에 대하여 개인정보 처리방침을 정한다. <개정 2016.3.29, 2020.2.4, 2023.3.14>\n1. 개인정보의 처리 목적\n2. 개인정보의 처리 및 보유 기간\n3. 개인정보의 제3자 제공에 관한 사항(해당되는 경우에만 정한다)\n3의2. 개인정보의 파기절차 및 파기방법(제21조제1항 단서에 따라 개인정보를 보존하여야 하는 경우에는 그 보존근거와 보존하는 개인정보 항목을 포함한다)\n3의3. 제23조제3항에 따른 민감정보의 공개 가능성 및 비공개를 선택하는 방법(해당되는 경우에만 정한다)\n4. 개인정보처리의 위탁에 관한 사항(해당되는 경우에만 정한다)\n4의2. 제28조의2 및 제28조의3에 따른 가명정보의 처리 등에 관한 사항(해당되는 경우에만 정한다)\n5. 정보주체와 법정대리인의 권리ㆍ의무 및 그 행사방법에 관한 사항\n6. 제31조에 따른 개인정보 보호책임자의 성명 또는 개인정보 보호업무 및 관련 고충사항을 처리하는 부서의 명칭과 전화번호 등 연락처\n7. 인터넷 접속정보파일 등 개인정보를 자동으로 수집하는 장치의 설치ㆍ운영 및 그 거부에 관한 사항(해당하는 경우에만 정한다)\n8. 그 밖에 개인정보의 처리에 관하여 대통령령으로 정한 사항\n② 개인정보처리자가 개인정보 처리방침을 수립하거나 변경하는 경우에는 정보주체가 쉽게 확인할 수 있도록 대통령령으로 정하는 방법에 따라 공개하여야 한다.\n③ 개인정보 처리방침의 내용과 개인정보처리자와 정보주체 간에 체결한 계약의 내용이 다른 경우에는 정보주체에게 유리한 것을 적용한다.\n④ 보호위원회는 개인정보 처리방침의 작성지침을 정하여 개인정보처리자에게 그 준수를 권장할 수 있다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.2.4>\n제30조(개인정보 처리방침의 수립 및 공개)","kind":"L"},{"id":"L:30-2","label":"법 제30조의2","title":"개인정보 처리방침의 평가 및 개선권고","chapter":"제4장 개인정보의 안전한 관리","deleted":false,"text":"① 보호위원회는 개인정보 처리방침에 관하여 다음 각 호의 사항을 평가하고, 평가 결과 개선이 필요하다고 인정하는 경우에는 개인정보처리자에게 제61조제2항에 따라 개선을 권고할 수 있다.\n1. 이 법에 따라 개인정보 처리방침에 포함하여야 할 사항을 적정하게 정하고 있는지 여부\n2. 개인정보 처리방침을 알기 쉽게 작성하였는지 여부\n3. 개인정보 처리방침을 정보주체가 쉽게 확인할 수 있는 방법으로 공개하고 있는지 여부\n② 개인정보 처리방침의 평가 대상, 기준 및 절차 등에 필요한 사항은 대통령령으로 정한다.\n제30조의2(개인정보 처리방침의 평가 및 개선권고)","kind":"L"},{"id":"L:30-3","label":"법 제30조의3","title":"사업주 또는 대표자의 책임","chapter":"제4장 개인정보의 안전한 관리","deleted":false,"text":"제30조의3(사업주 또는 대표자의 책임) 개인정보처리자의 사업주 또는 대표자는 개인정보의 안전한 처리 및 정보주체의 권리 보호에 대한 최종적인 책임자로서 개인정보 보호에 필요한 전문 인력과 충분한 예산의 지원 등 총괄적인 관리 조치를 실효성 있게 하여야 한다.","kind":"L"},{"id":"L:31","label":"법 제31조","title":"개인정보 보호책임자의 지정 등","chapter":"제4장 개인정보의 안전한 관리","deleted":false,"text":"① 개인정보처리자는 개인정보의 처리 및 보호에 관한 업무를 총괄해서 담당할 개인정보 보호책임자를 지정하여야 한다. 다만, 종업원 수, 매출액 등이 대통령령으로 정하는 기준에 해당하는 개인정보처리자의 경우에는 지정하지 아니할 수 있다. <개정 2023.3.14, 2026.3.10>\n② 제1항 단서에 따라 개인정보 보호책임자를 지정하지 아니하는 경우에는 개인정보처리자의 사업주 또는 대표자가 개인정보 보호책임자가 된다. <신설 2023.3.14>\n③ 매출액, 개인정보의 보유 규모 등을 고려하여 대통령령으로 정하는 기준에 해당하는 개인정보처리자는 다음 각 호의 사항을 준수하여야 한다. <신설 2026.3.10>\n1. 개인정보 보호책임자를 지정하거나 그 지정을 변경 또는 해제할 때에는 이사회(법인인 경우로 한정한다. 이하 같다)의 의결을 거칠 것\n2. 보호위원회에 대통령령으로 정하는 바에 따라 개인정보 보호책임자 지정ㆍ변경 또는 해제에 관한 사항을 신고할 것\n④ 개인정보 보호책임자는 다음 각 호의 업무를 수행한다. <개정 2023.3.14, 2026.3.10>\n1. 개인정보 보호 계획의 수립 및 시행\n2. 개인정보 보호에 필요한 전문 인력의 관리 및 예산의 확보\n3. 사업주 또는 대표자 및 이사회에 대한 개인정보 보호 현황 및 주요 사항의 보고\n4. 개인정보 처리 및 보호의 실태와 관행에 대한 정기적인 조사 및 개선\n5. 개인정보 처리와 관련한 불만의 처리 및 피해 구제\n6. 개인정보 유출 및 오용ㆍ남용 방지를 위한 내부통제시스템의 구축\n7. 개인정보 보호 교육 계획의 수립 및 시행\n8. 개인정보파일의 보호 및 관리ㆍ감독\n9. 그 밖에 개인정보의 적절한 처리 및 보호를 위하여 대통령령으로 정한 업무\n⑤ 개인정보 보호책임자는 제4항 각 호의 업무를 수행함에 있어서 필요한 경우 개인정보의 처리 현황, 처리 체계 등에 대하여 수시로 조사하거나 관계 당사자로부터 보고를 받을 수 있다. <개정 2023.3.14, 2026.3.10>\n⑥ 개인정보 보호책임자는 개인정보 보호와 관련하여 이 법 및 다른 관계 법령의 위반 사실을 알게 된 경우에는 즉시 개선조치를 하여야 하며, 필요하면 소속 기관 또는 단체의 장에게 개선조치를 보고하여야 한다. <개정 2023.3.14, 2026.3.10>\n⑦ 개인정보처리자는 개인정보 보호책임자가 제4항 각 호의 업무를 수행함에 있어서 정당한 이유 없이 불이익을 주거나 받게 하여서는 아니 되며, 개인정보 보호책임자가 업무를 독립적으로 수행할 수 있도록 보장하여야 한다. <개정 2023.3.14, 2026.3.10>\n⑧ 개인정보처리자는 개인정보의 안전한 처리 및 보호, 정보의 교류, 그 밖에 대통령령으로 정하는 공동의 사업을 수행하기 위하여 제1항에 따른 개인정보 보호책임자를 구성원으로 하는 개인정보 보호책임자 협의회를 구성ㆍ운영할 수 있다. <신설 2023.3.14, 2026.3.10>\n⑨ 보호위원회는 제8항에 따른 개인정보 보호책임자 협의회의 활동에 필요한 지원을 할 수 있다. <신설 2023.3.14, 2026.3.10>\n⑩ 제1항에 따른 개인정보 보호책임자의 자격요건, 제3항제2호에 따른 신고의 방법 및 절차, 제4항에 따른 업무 및 제7항에 따른 독립성 보장 등에 필요한 사항은 매출액, 개인정보의 보유 규모 등을 고려하여 대통령령으로 정한다. <개정 2023.3.14, 2026.3.10>\n제31조(개인정보 보호책임자의 지정 등)","kind":"L"},{"id":"L:31-2","label":"법 제31조의2","title":"국내대리인의 지정","chapter":"제4장 개인정보의 안전한 관리","deleted":false,"text":"① 국내에 주소 또는 영업소가 없는 개인정보처리자로서 매출액, 개인정보의 보유 규모 등을 고려하여 대통령령으로 정하는 자는 다음 각 호의 사항을 대리하는 자(이하 \"국내대리인\"이라 한다)를 지정하여야 한다. 이 경우 국내대리인의 지정은 문서로 하여야 한다. <개정 2023.3.14, 2025.4.1, 2026.3.10>\n1. 제31조제4항제5호에 따른 개인정보 처리와 관련한 불만의 처리 및 피해 구제 업무\n2. 제34조제1항ㆍ제2항에 따른 통지 및 같은 조 제4항에 따른 유출등의 신고\n3. 제63조제1항에 따른 물품ㆍ서류 등 자료의 제출\n② 국내대리인은 국내에 주소 또는 영업소가 있어야 한다. 이 경우 다음 각 호의 어느 하나에 해당하는 법인이 있는 개인정보처리자는 그 법인 중에서 국내대리인을 지정하여야 한다. <개정 2023.3.14, 2025.4.1>\n1. 해당 개인정보처리자가 설립한 국내 법인\n2. 해당 개인정보처리자가 임원 구성, 사업 운영 등에 지배적인 영향력을 행사하는 국내 법인으로서 대통령령으로 정하는 법인\n③ 제1항에 따라 국내대리인을 지정한 개인정보처리자는 국내대리인이 업무를 충실히 수행하도록 대통령령으로 정하는 바에 따라 교육하고 업무현황을 점검하는 등의 관리ㆍ감독을 하여야 한다. <신설 2025.4.1>\n④ 개인정보처리자는 제1항에 따라 국내대리인을 지정하는 경우에는 다음 각 호의 사항을 개인정보 처리방침에 포함하여야 한다. <개정 2023.3.14, 2025.4.1>\n1. 국내대리인의 성명(법인의 경우에는 그 명칭 및 대표자의 성명을 말한다)\n2. 국내대리인의 주소(법인의 경우에는 영업소의 소재지를 말한다), 전화번호 및 전자우편 주소\n⑤ 국내대리인이 제1항 각 호와 관련하여 이 법을 위반한 경우에는 개인정보처리자가 그 행위를 한 것으로 본다. <개정 2023.3.14, 2025.4.1>\n제31조의2(국내대리인의 지정)","kind":"L"},{"id":"L:32","label":"법 제32조","title":"개인정보파일의 등록 및 공개","chapter":"제4장 개인정보의 안전한 관리","deleted":false,"text":"① 공공기관의 장이 개인정보파일을 운용하는 경우에는 다음 각 호의 사항을 보호위원회에 등록하여야 한다. 등록한 사항이 변경된 경우에도 또한 같다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.2.4>\n1. 개인정보파일의 명칭\n2. 개인정보파일의 운영 근거 및 목적\n3. 개인정보파일에 기록되는 개인정보의 항목\n4. 개인정보의 처리방법\n5. 개인정보의 보유기간\n6. 개인정보를 통상적 또는 반복적으로 제공하는 경우에는 그 제공받는 자\n7. 그 밖에 대통령령으로 정하는 사항\n② 다음 각 호의 어느 하나에 해당하는 개인정보파일에 대하여는 제1항을 적용하지 아니한다. <개정 2023.3.14>\n1. 국가 안전, 외교상 비밀, 그 밖에 국가의 중대한 이익에 관한 사항을 기록한 개인정보파일\n2. 범죄의 수사, 공소의 제기 및 유지, 형 및 감호의 집행, 교정처분, 보호처분, 보안관찰처분과 출입국관리에 관한 사항을 기록한 개인정보파일\n3. 「조세범처벌법」에 따른 범칙행위 조사 및 「관세법」에 따른 범칙행위 조사에 관한 사항을 기록한 개인정보파일\n4. 일회적으로 운영되는 파일 등 지속적으로 관리할 필요성이 낮다고 인정되어 대통령령으로 정하는 개인정보파일\n5. 다른 법령에 따라 비밀로 분류된 개인정보파일\n③ 보호위원회는 필요하면 제1항에 따른 개인정보파일의 등록여부와 그 내용을 검토하여 해당 공공기관의 장에게 개선을 권고할 수 있다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.2.4, 2023.3.14>\n④ 보호위원회는 정보주체의 권리 보장 등을 위하여 필요한 경우 제1항에 따른 개인정보파일의 등록 현황을 누구든지 쉽게 열람할 수 있도록 공개할 수 있다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.2.4, 2023.3.14>\n⑤ 제1항에 따른 등록과 제4항에 따른 공개의 방법, 범위 및 절차에 관하여 필요한 사항은 대통령령으로 정한다.\n⑥ 국회, 법원, 헌법재판소, 중앙선거관리위원회(그 소속 기관을 포함한다)의 개인정보파일 등록 및 공개에 관하여는 국회규칙, 대법원규칙, 헌법재판소규칙 및 중앙선거관리위원회규칙으로 정한다.\n제32조(개인정보파일의 등록 및 공개)","kind":"L"},{"id":"L:32-2","label":"법 제32조의2","title":"개인정보 보호 인증","chapter":"제4장 개인정보의 안전한 관리","deleted":false,"text":"① 보호위원회는 개인정보처리자의 개인정보 처리 및 보호와 관련한 일련의 조치가 이 법에 부합하는지 등에 관하여 인증할 수 있다. 다만, 매출액, 개인정보의 처리 규모 등을 고려하여 대통령령으로 정하는 기준에 해당하는 개인정보처리자는 인증을 받아야 한다. <개정 2017.7.26, 2020.2.4, 2026.3.10>\n② 제1항에 따른 인증의 유효기간은 3년으로 한다.\n③ 보호위원회는 다음 각 호의 어느 하나에 해당하는 경우에는 대통령령으로 정하는 바에 따라 제1항에 따른 인증을 취소할 수 있다. 다만, 제1호에 해당하는 경우에는 취소하여야 한다. <개정 2017.7.26, 2020.2.4>\n1. 거짓이나 그 밖의 부정한 방법으로 개인정보 보호 인증을 받은 경우\n2. 제4항에 따른 사후관리를 거부 또는 방해한 경우\n3. 제8항에 따른 인증기준에 미달하게 된 경우\n4. 개인정보 보호 관련 법령을 위반하고 그 위반사유가 중대한 경우\n④ 보호위원회는 개인정보 보호 인증의 실효성 유지를 위하여 연 1회 이상 사후관리를 실시하여야 한다. <개정 2017.7.26, 2020.2.4>\n⑤ 보호위원회는 대통령령으로 정하는 전문기관으로 하여금 제1항에 따른 인증, 제3항에 따른 인증 취소, 제4항에 따른 사후관리 및 제7항에 따른 인증 심사원 관리 업무를 수행하게 할 수 있다. <개정 2017.7.26, 2020.2.4>\n⑥ 제1항에 따른 인증을 받은 자는 대통령령으로 정하는 바에 따라 인증의 내용을 표시하거나 홍보할 수 있다.\n⑦ 제1항에 따른 인증을 위하여 필요한 심사를 수행할 심사원의 자격 및 자격 취소 요건 등에 관하여는 전문성과 경력 및 그 밖에 필요한 사항을 고려하여 대통령령으로 정한다.\n⑧ 그 밖에 개인정보 관리체계, 정보주체 권리보장, 안전성 확보조치가 이 법에 부합하는지 여부 등 제1항에 따른 인증의 기준ㆍ방법ㆍ절차 등 필요한 사항은 대통령령으로 정한다.\n제32조의2(개인정보 보호 인증)","kind":"L"},{"id":"L:33","label":"법 제33조","title":"개인정보 영향평가","chapter":"제4장 개인정보의 안전한 관리","deleted":false,"text":"① 공공기관의 장은 대통령령으로 정하는 기준에 해당하는 개인정보파일의 운용으로 인하여 정보주체의 개인정보 침해가 우려되는 경우에는 그 위험요인의 분석과 개선 사항 도출을 위한 평가(이하 \"영향평가\"라 한다)를 하고 그 결과를 보호위원회에 제출하여야 한다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.2.4, 2023.3.14>\n② 보호위원회는 대통령령으로 정하는 인력ㆍ설비 및 그 밖에 필요한 요건을 갖춘 자를 영향평가를 수행하는 기관(이하 \"평가기관\"이라 한다)으로 지정할 수 있으며, 공공기관의 장은 영향평가를 평가기관에 의뢰하여야 한다. <신설 2023.3.14>\n③ 영향평가를 하는 경우에는 다음 각 호의 사항을 고려하여야 한다. <개정 2023.3.14>\n1. 처리하는 개인정보의 수\n2. 개인정보의 제3자 제공 여부\n3. 정보주체의 권리를 해할 가능성 및 그 위험 정도\n4. 그 밖에 대통령령으로 정한 사항\n④ 보호위원회는 제1항에 따라 제출받은 영향평가 결과에 대하여 의견을 제시할 수 있다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.2.4, 2023.3.14>\n⑤ 공공기관의 장은 제1항에 따라 영향평가를 한 개인정보파일을 제32조제1항에 따라 등록할 때에는 영향평가 결과를 함께 첨부하여야 한다. <개정 2023.3.14>\n⑥ 보호위원회는 영향평가의 활성화를 위하여 관계 전문가의 육성, 영향평가 기준의 개발ㆍ보급 등 필요한 조치를 마련하여야 한다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.2.4, 2023.3.14>\n⑦ 보호위원회는 제2항에 따라 지정된 평가기관이 다음 각 호의 어느 하나에 해당하는 경우에는 평가기관의 지정을 취소할 수 있다. 다만, 제1호 또는 제2호에 해당하는 경우에는 평가기관의 지정을 취소하여야 한다. <신설 2023.3.14>\n1. 거짓이나 그 밖의 부정한 방법으로 지정을 받은 경우\n2. 지정된 평가기관 스스로 지정취소를 원하거나 폐업한 경우\n3. 제2항에 따른 지정요건을 충족하지 못하게 된 경우\n4. 고의 또는 중대한 과실로 영향평가업무를 부실하게 수행하여 그 업무를 적정하게 수행할 수 없다고 인정되는 경우\n5. 그 밖에 대통령령으로 정하는 사유에 해당하는 경우\n⑧ 보호위원회는 제7항에 따라 지정을 취소하는 경우에는 「행정절차법」에 따른 청문을 실시하여야 한다. <신설 2023.3.14>\n⑨ 제1항에 따른 영향평가의 기준ㆍ방법ㆍ절차 등에 관하여 필요한 사항은 대통령령으로 정한다. <개정 2023.3.14>\n⑩ 국회, 법원, 헌법재판소, 중앙선거관리위원회(그 소속 기관을 포함한다)의 영향평가에 관한 사항은 국회규칙, 대법원규칙, 헌법재판소규칙 및 중앙선거관리위원회규칙으로 정하는 바에 따른다. <개정 2023.3.14>\n⑪ 공공기관 외의 개인정보처리자는 개인정보파일 운용으로 인하여 정보주체의 개인정보 침해가 우려되는 경우에는 영향평가를 하기 위하여 적극 노력하여야 한다. <개정 2023.3.14>\n제33조(개인정보 영향평가)","kind":"L"},{"id":"L:34","label":"법 제34조","title":"개인정보 유출등의 통지ㆍ신고","chapter":"제4장 개인정보의 안전한 관리","deleted":false,"text":"① 개인정보처리자는 개인정보가 유출등이 되었음을 알게 되었을 때에는 지체 없이 해당 정보주체에게 다음 각 호의 사항을 알려야 한다. 다만, 정보주체의 연락처를 알 수 없는 경우 등 정당한 사유가 있는 경우에는 대통령령으로 정하는 바에 따라 통지를 갈음하는 조치를 취할 수 있다. <개정 2023.3.14, 2026.3.10>\n1. 유출등이 된 개인정보의 항목\n2. 유출등이 된 시점과 그 경위\n3. 유출등으로 인하여 발생할 수 있는 피해를 최소화하기 위하여 정보주체가 할 수 있는 방법 등에 관한 구체적인 정보\n4. 개인정보처리자의 대응조치 및 피해 구제절차\n5. 정보주체에게 피해가 발생한 경우 신고 등을 접수할 수 있는 담당부서 및 연락처\n6. 개인정보 유출등으로 인한 제39조에 따른 손해배상과 제39조의2에 따른 법정손해배상의 청구 및 제43조에 따른 분쟁조정 등 피해를 입은 정보주체의 법적 권리와 그 행사 방법 등에 관한 정보\n7. 그 밖에 개인정보가 유출등이 된 정보주체의 보호를 위하여 대통령령으로 정하는 사항\n② 제1항에도 불구하고 개인정보의 유형, 정보주체에게 미치는 영향 및 유출등의 위험 정도를 고려하여 대통령령으로 정하는 유출등의 가능성이 있음을 알게 되었을 때에는 지체 없이 유출등의 가능성이 있는 모든 정보주체에게 피해를 최소화하기 위한 정보 등 대통령령으로 정하는 사항을 알려야 한다. <신설 2026.3.10>\n③ 개인정보처리자는 개인정보가 유출등이 된 경우에는 해당 개인정보의 회수ㆍ삭제 등 피해 확산을 방지하기 위한 조치를 포함하여 피해를 최소화하기 위한 대책을 마련하고 필요한 조치를 하여야 한다. <개정 2023.3.14, 2026.3.10>\n④ 개인정보처리자는 개인정보의 유출등이 있음을 알게 되었을 때에는 개인정보의 유형, 유출등의 경로 및 규모 등을 고려하여 대통령령으로 정하는 바에 따라 제1항 각 호의 사항을 지체 없이 보호위원회 또는 대통령령으로 정하는 전문기관에 신고하여야 한다. 이 경우 보호위원회 또는 대통령령으로 정하는 전문기관은 피해 확산방지, 피해 복구 등을 위한 기술을 지원할 수 있다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.2.4, 2023.3.14, 2026.3.10>\n⑤ 제1항ㆍ제2항에 따른 통지 및 제4항에 따른 유출등의 신고의 시기, 방법, 절차 등에 필요한 사항은 대통령령으로 정한다. <개정 2023.3.14, 2026.3.10>\n제34조(개인정보 유출등의 통지ㆍ신고)","kind":"L"},{"id":"L:34-2","label":"법 제34조의2","title":"노출된 개인정보의 삭제ㆍ차단","chapter":"제4장 개인정보의 안전한 관리","deleted":false,"text":"① 개인정보처리자는 고유식별정보, 계좌정보, 신용카드정보 등 개인정보가 정보통신망을 통하여 공중(公衆)에 노출되지 아니하도록 하여야 한다. <개정 2023.3.14>\n② 개인정보처리자는 공중에 노출된 개인정보에 대하여 보호위원회 또는 대통령령으로 지정한 전문기관의 요청이 있는 경우에는 해당 정보를 삭제하거나 차단하는 등 필요한 조치를 하여야 한다. <개정 2023.3.14>\n제34조의2(노출된 개인정보의 삭제ㆍ차단)","kind":"L"},{"id":"L:35","label":"법 제35조","title":"개인정보의 열람","chapter":"제5장 정보주체의 권리 보장","deleted":false,"text":"① 정보주체는 개인정보처리자가 처리하는 자신의 개인정보에 대한 열람을 해당 개인정보처리자에게 요구할 수 있다.\n② 제1항에도 불구하고 정보주체가 자신의 개인정보에 대한 열람을 공공기관에 요구하고자 할 때에는 공공기관에 직접 열람을 요구하거나 대통령령으로 정하는 바에 따라 보호위원회를 통하여 열람을 요구할 수 있다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.2.4>\n③ 개인정보처리자는 제1항 및 제2항에 따른 열람을 요구받았을 때에는 대통령령으로 정하는 기간 내에 정보주체가 해당 개인정보를 열람할 수 있도록 하여야 한다. 이 경우 해당 기간 내에 열람할 수 없는 정당한 사유가 있을 때에는 정보주체에게 그 사유를 알리고 열람을 연기할 수 있으며, 그 사유가 소멸하면 지체 없이 열람하게 하여야 한다.\n④ 개인정보처리자는 다음 각 호의 어느 하나에 해당하는 경우에는 정보주체에게 그 사유를 알리고 열람을 제한하거나 거절할 수 있다.\n1. 법률에 따라 열람이 금지되거나 제한되는 경우\n2. 다른 사람의 생명ㆍ신체를 해할 우려가 있거나 다른 사람의 재산과 그 밖의 이익을 부당하게 침해할 우려가 있는 경우\n3. 공공기관이 다음 각 목의 어느 하나에 해당하는 업무를 수행할 때 중대한 지장을 초래하는 경우\n가. 조세의 부과ㆍ징수 또는 환급에 관한 업무\n나. 「초ㆍ중등교육법」 및 「고등교육법」에 따른 각급 학교, 「평생교육법」에 따른 평생교육시설, 그 밖의 다른 법률에 따라 설치된 고등교육기관에서의 성적 평가 또는 입학자 선발에 관한 업무\n다. 학력ㆍ기능 및 채용에 관한 시험, 자격 심사에 관한 업무\n라. 보상금ㆍ급부금 산정 등에 대하여 진행 중인 평가 또는 판단에 관한 업무\n마. 다른 법률에 따라 진행 중인 감사 및 조사에 관한 업무\n⑤ 제1항부터 제4항까지의 규정에 따른 열람 요구, 열람 제한, 통지 등의 방법 및 절차에 관하여 필요한 사항은 대통령령으로 정한다.\n제35조(개인정보의 열람)","kind":"L"},{"id":"L:35-2","label":"법 제35조의2","title":"개인정보의 전송 요구","chapter":"제5장 정보주체의 권리 보장","deleted":false,"text":"① 정보주체는 개인정보 처리 능력 등을 고려하여 대통령령으로 정하는 기준에 해당하는 개인정보처리자에 대하여 다음 각 호의 요건을 모두 충족하는 개인정보를 자신에게로 전송할 것을 요구할 수 있다.\n1. 정보주체가 전송을 요구하는 개인정보가 정보주체 본인에 관한 개인정보로서 다음 각 목의 어느 하나에 해당하는 정보일 것\n가. 제15조제1항제1호, 제23조제1항제1호 또는 제24조제1항제1호에 따른 동의를 받아 처리되는 개인정보\n나. 제15조제1항제4호에 따라 체결한 계약을 이행하거나 계약을 체결하는 과정에서 정보주체의 요청에 따른 조치를 이행하기 위하여 처리되는 개인정보\n다. 제15조제1항제2호ㆍ제3호, 제23조제1항제2호 또는 제24조제1항제2호에 따라 처리되는 개인정보 중 정보주체의 이익이나 공익적 목적을 위하여 관계 중앙행정기관의 장의 요청에 따라 보호위원회가 심의ㆍ의결하여 전송 요구의 대상으로 지정한 개인정보\n2. 전송을 요구하는 개인정보가 개인정보처리자가 수집한 개인정보를 기초로 분석ㆍ가공하여 별도로 생성한 정보가 아닐 것\n3. 전송을 요구하는 개인정보가 컴퓨터 등 정보처리장치로 처리되는 개인정보일 것\n② 정보주체는 매출액, 개인정보의 보유 규모, 개인정보 처리 능력, 산업별 특성 등을 고려하여 대통령령으로 정하는 기준에 해당하는 개인정보처리자에 대하여 제1항에 따른 전송 요구 대상인 개인정보를 기술적으로 허용되는 합리적인 범위에서 다음 각 호의 자에게 전송할 것을 요구할 수 있다.\n1. 제35조의3제1항에 따른 개인정보관리 전문기관\n2. 제29조에 따른 안전조치의무를 이행하고 대통령령으로 정하는 시설 및 기술 기준을 충족하는 자\n③ 개인정보처리자는 제1항 및 제2항에 따른 전송 요구를 받은 경우에는 시간, 비용, 기술적으로 허용되는 합리적인 범위에서 해당 정보를 컴퓨터 등 정보처리장치로 처리 가능한 형태로 전송하여야 한다.\n④ 제1항 및 제2항에 따른 전송 요구를 받은 개인정보처리자는 다음 각 호의 어느 하나에 해당하는 법률의 관련 규정에도 불구하고 정보주체에 관한 개인정보를 전송하여야 한다.\n1. 「국세기본법」 제81조의13\n2. 「지방세기본법」 제86조\n3. 그 밖에 제1호 및 제2호와 유사한 규정으로서 대통령령으로 정하는 법률의 규정\n⑤ 정보주체는 제1항 및 제2항에 따른 전송 요구를 철회할 수 있다.\n⑥ 개인정보처리자는 정보주체의 본인 여부가 확인되지 아니하는 경우 등 대통령령으로 정하는 경우에는 제1항 및 제2항에 따른 전송 요구를 거절하거나 전송을 중단할 수 있다.\n⑦ 정보주체는 제1항 및 제2항에 따른 전송 요구로 인하여 타인의 권리나 정당한 이익을 침해하여서는 아니 된다.\n⑧ 제1항부터 제7항까지에서 규정한 사항 외에 전송 요구의 대상이 되는 정보의 범위, 전송 요구의 방법, 전송의 기한 및 방법, 전송 요구 철회의 방법, 전송 요구의 거절 및 전송 중단의 방법 등 필요한 사항은 대통령령으로 정한다.\n제35조의2(개인정보의 전송 요구)","kind":"L"},{"id":"L:35-3","label":"법 제35조의3","title":"개인정보관리 전문기관","chapter":"제5장 정보주체의 권리 보장","deleted":false,"text":"① 다음 각 호의 업무를 수행하려는 자는 보호위원회 또는 관계 중앙행정기관의 장으로부터 개인정보관리 전문기관의 지정을 받아야 한다.\n1. 제35조의2에 따른 개인정보의 전송 요구권 행사 지원\n2. 정보주체의 권리행사를 지원하기 위한 개인정보 전송시스템의 구축 및 표준화\n3. 정보주체의 권리행사를 지원하기 위한 개인정보의 관리ㆍ분석\n4. 그 밖에 정보주체의 권리행사를 효과적으로 지원하기 위하여 대통령령으로 정하는 업무\n② 제1항에 따른 개인정보관리 전문기관의 지정요건은 다음 각 호와 같다.\n1. 개인정보를 전송ㆍ관리ㆍ분석할 수 있는 기술수준 및 전문성을 갖추었을 것\n2. 개인정보를 안전하게 관리할 수 있는 안전성 확보조치 수준을 갖추었을 것\n3. 개인정보관리 전문기관의 안정적인 운영에 필요한 재정능력을 갖추었을 것\n③ 개인정보관리 전문기관은 다음 각 호의 어느 하나에 해당하는 행위를 하여서는 아니 된다.\n1. 정보주체에게 개인정보의 전송 요구를 강요하거나 부당하게 유도하는 행위\n2. 그 밖에 개인정보를 침해하거나 정보주체의 권리를 제한할 우려가 있는 행위로서 대통령령으로 정하는 행위\n④ 보호위원회 및 관계 중앙행정기관의 장은 개인정보관리 전문기관이 다음 각 호의 어느 하나에 해당하는 경우에는 개인정보관리 전문기관의 지정을 취소할 수 있다. 다만, 제1호에 해당하는 경우에는 지정을 취소하여야 한다.\n1. 거짓이나 부정한 방법으로 지정을 받은 경우\n2. 제2항에 따른 지정요건을 갖추지 못하게 된 경우\n⑤ 보호위원회 및 관계 중앙행정기관의 장은 제4항에 따라 지정을 취소하는 경우에는 「행정절차법」에 따른 청문을 실시하여야 한다.\n⑥ 보호위원회 및 관계 중앙행정기관의 장은 개인정보관리 전문기관에 대하여 업무 수행에 필요한 지원을 할 수 있다.\n⑦ 개인정보관리 전문기관은 정보주체의 요구에 따라 제1항 각 호의 업무를 수행하는 경우 정보주체로부터 그 업무 수행에 필요한 비용을 받을 수 있다.\n⑧ 제1항에 따른 개인정보관리 전문기관의 지정 절차, 제2항에 따른 지정요건의 세부기준, 제4항에 따른 지정취소의 절차 등에 필요한 사항은 대통령령으로 정한다.\n제35조의3(개인정보관리 전문기관)","kind":"L"},{"id":"L:35-4","label":"법 제35조의4","title":"개인정보 전송 관리 및 지원","chapter":"제5장 정보주체의 권리 보장","deleted":false,"text":"① 보호위원회는 제35조의2제1항 및 제2항에 따른 개인정보처리자 및 제35조의3제1항에 따른 개인정보관리 전문기관 현황, 활용내역 및 관리실태 등을 체계적으로 관리ㆍ감독하여야 한다.\n② 보호위원회는 개인정보가 안전하고 효율적으로 전송될 수 있도록 다음 각 호의 사항을 포함한 개인정보 전송 지원 플랫폼을 구축ㆍ운영할 수 있다.\n1. 개인정보관리 전문기관 현황 및 전송 가능한 개인정보 항목 목록\n2. 정보주체의 개인정보 전송 요구ㆍ철회 내역\n3. 개인정보의 전송 이력 관리 등 지원 기능\n4. 그 밖에 개인정보 전송을 위하여 필요한 사항\n③ 보호위원회는 제2항에 따른 개인정보 전송지원 플랫폼의 효율적 운영을 위하여 개인정보관리 전문기관에서 구축ㆍ운영하고 있는 전송 시스템을 상호 연계하거나 통합할 수 있다. 이 경우 관계 중앙행정기관의 장 및 해당 개인정보관리 전문기관과 사전에 협의하여야 한다.\n④ 제1항부터 제3항까지의 규정에 따른 관리ㆍ감독과 개인정보 전송지원 플랫폼의 구축 및 운영에 필요한 사항은 대통령령으로 정한다.\n제35조의4(개인정보 전송 관리 및 지원)","kind":"L"},{"id":"L:36","label":"법 제36조","title":"개인정보의 정정ㆍ삭제","chapter":"제5장 정보주체의 권리 보장","deleted":false,"text":"① 제35조에 따라 자신의 개인정보를 열람한 정보주체는 개인정보처리자에게 그 개인정보의 정정 또는 삭제를 요구할 수 있다. 다만, 다른 법령에서 그 개인정보가 수집 대상으로 명시되어 있는 경우에는 그 삭제를 요구할 수 없다.\n② 개인정보처리자는 제1항에 따른 정보주체의 요구를 받았을 때에는 개인정보의 정정 또는 삭제에 관하여 다른 법령에 특별한 절차가 규정되어 있는 경우를 제외하고는 지체 없이 그 개인정보를 조사하여 정보주체의 요구에 따라 정정ㆍ삭제 등 필요한 조치를 한 후 그 결과를 정보주체에게 알려야 한다.\n③ 개인정보처리자가 제2항에 따라 개인정보를 삭제할 때에는 복구 또는 재생되지 아니하도록 조치하여야 한다.\n④ 개인정보처리자는 정보주체의 요구가 제1항 단서에 해당될 때에는 지체 없이 그 내용을 정보주체에게 알려야 한다.\n⑤ 개인정보처리자는 제2항에 따른 조사를 할 때 필요하면 해당 정보주체에게 정정ㆍ삭제 요구사항의 확인에 필요한 증거자료를 제출하게 할 수 있다.\n⑥ 제1항ㆍ제2항 및 제4항에 따른 정정 또는 삭제 요구, 통지 방법 및 절차 등에 필요한 사항은 대통령령으로 정한다.\n제36조(개인정보의 정정ㆍ삭제)","kind":"L"},{"id":"L:37","label":"법 제37조","title":"개인정보의 처리정지 등","chapter":"제5장 정보주체의 권리 보장","deleted":false,"text":"① 정보주체는 개인정보처리자에 대하여 자신의 개인정보 처리의 정지를 요구하거나 개인정보 처리에 대한 동의를 철회할 수 있다. 이 경우 공공기관에 대해서는 제32조에 따라 등록 대상이 되는 개인정보파일 중 자신의 개인정보에 대한 처리의 정지를 요구하거나 개인정보 처리에 대한 동의를 철회할 수 있다. <개정 2023.3.14>\n② 개인정보처리자는 제1항에 따른 처리정지 요구를 받았을 때에는 지체 없이 정보주체의 요구에 따라 개인정보 처리의 전부를 정지하거나 일부를 정지하여야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 정보주체의 처리정지 요구를 거절할 수 있다. <개정 2023.3.14>\n1. 법률에 특별한 규정이 있거나 법령상 의무를 준수하기 위하여 불가피한 경우\n2. 다른 사람의 생명ㆍ신체를 해할 우려가 있거나 다른 사람의 재산과 그 밖의 이익을 부당하게 침해할 우려가 있는 경우\n3. 공공기관이 개인정보를 처리하지 아니하면 다른 법률에서 정하는 소관 업무를 수행할 수 없는 경우\n4. 개인정보를 처리하지 아니하면 정보주체와 약정한 서비스를 제공하지 못하는 등 계약의 이행이 곤란한 경우로서 정보주체가 그 계약의 해지 의사를 명확하게 밝히지 아니한 경우\n③ 개인정보처리자는 정보주체가 제1항에 따라 동의를 철회한 때에는 지체 없이 수집된 개인정보를 복구ㆍ재생할 수 없도록 파기하는 등 필요한 조치를 하여야 한다. 다만, 제2항 각 호의 어느 하나에 해당하는 경우에는 동의 철회에 따른 조치를 하지 아니할 수 있다. <신설 2023.3.14>\n④ 개인정보처리자는 제2항 단서에 따라 처리정지 요구를 거절하거나 제3항 단서에 따라 동의 철회에 따른 조치를 하지 아니하였을 때에는 정보주체에게 지체 없이 그 사유를 알려야 한다. <개정 2023.3.14>\n⑤ 개인정보처리자는 정보주체의 요구에 따라 처리가 정지된 개인정보에 대하여 지체 없이 해당 개인정보의 파기 등 필요한 조치를 하여야 한다. <개정 2023.3.14>\n⑥ 제1항부터 제5항까지의 규정에 따른 처리정지의 요구, 동의 철회, 처리정지의 거절, 통지 등의 방법 및 절차에 필요한 사항은 대통령령으로 정한다. <개정 2023.3.14>\n제37조(개인정보의 처리정지 등)","kind":"L"},{"id":"L:37-2","label":"법 제37조의2","title":"자동화된 결정에 대한 정보주체의 권리 등","chapter":"제5장 정보주체의 권리 보장","deleted":false,"text":"① 정보주체는 완전히 자동화된 시스템(인공지능 기술을 적용한 시스템을 포함한다)으로 개인정보를 처리하여 이루어지는 결정(「행정기본법」 제20조에 따른 행정청의 자동적 처분은 제외하며, 이하 이 조에서 \"자동화된 결정\"이라 한다)이 자신의 권리 또는 의무에 중대한 영향을 미치는 경우에는 해당 개인정보처리자에 대하여 해당 결정을 거부할 수 있는 권리를 가진다. 다만, 자동화된 결정이 제15조제1항제1호ㆍ제2호 및 제4호에 따라 이루어지는 경우에는 그러하지 아니하다.\n② 정보주체는 개인정보처리자가 자동화된 결정을 한 경우에는 그 결정에 대하여 설명 등을 요구할 수 있다.\n③ 개인정보처리자는 제1항 또는 제2항에 따라 정보주체가 자동화된 결정을 거부하거나 이에 대한 설명 등을 요구한 경우에는 정당한 사유가 없는 한 자동화된 결정을 적용하지 아니하거나 인적 개입에 의한 재처리ㆍ설명 등 필요한 조치를 하여야 한다.\n④ 개인정보처리자는 자동화된 결정의 기준과 절차, 개인정보가 처리되는 방식 등을 정보주체가 쉽게 확인할 수 있도록 공개하여야 한다.\n⑤ 제1항부터 제4항까지에서 규정한 사항 외에 자동화된 결정의 거부ㆍ설명 등을 요구하는 절차 및 방법, 거부ㆍ설명 등의 요구에 따른 필요한 조치, 자동화된 결정의 기준ㆍ절차 및 개인정보가 처리되는 방식의 공개 등에 필요한 사항은 대통령령으로 정한다.\n제37조의2(자동화된 결정에 대한 정보주체의 권리 등)","kind":"L"},{"id":"L:38","label":"법 제38조","title":"권리행사의 방법 및 절차","chapter":"제5장 정보주체의 권리 보장","deleted":false,"text":"① 정보주체는 제35조에 따른 열람, 제35조의2에 따른 전송, 제36조에 따른 정정ㆍ삭제, 제37조에 따른 처리정지 및 동의 철회, 제37조의2에 따른 거부ㆍ설명 등의 요구(이하 \"열람등요구\"라 한다)를 문서 등 대통령령으로 정하는 방법ㆍ절차에 따라 대리인에게 하게 할 수 있다. <개정 2020.2.4, 2023.3.14>\n② 만 14세 미만 아동의 법정대리인은 개인정보처리자에게 그 아동의 개인정보 열람등요구를 할 수 있다.\n③ 개인정보처리자는 열람등요구를 하는 자에게 대통령령으로 정하는 바에 따라 수수료와 우송료(사본의 우송을 청구하는 경우에 한한다)를 청구할 수 있다. 다만, 제35조의2제2항에 따른 전송 요구의 경우에는 전송을 위해 추가로 필요한 설비 등을 함께 고려하여 수수료를 산정할 수 있다. <개정 2023.3.14>\n④ 개인정보처리자는 정보주체가 열람등요구를 할 수 있는 구체적인 방법과 절차를 마련하고, 이를 정보주체가 알 수 있도록 공개하여야 한다. 이 경우 열람등요구의 방법과 절차는 해당 개인정보의 수집 방법과 절차보다 어렵지 아니하도록 하여야 한다. <개정 2023.3.14>\n⑤ 개인정보처리자는 정보주체가 열람등요구에 대한 거절 등 조치에 대하여 불복이 있는 경우 이의를 제기할 수 있도록 필요한 절차를 마련하고 안내하여야 한다.\n제38조(권리행사의 방법 및 절차)","kind":"L"},{"id":"L:39","label":"법 제39조","title":"손해배상책임","chapter":"제5장 정보주체의 권리 보장","deleted":false,"text":"① 정보주체는 개인정보처리자가 이 법을 위반한 행위로 손해를 입으면 개인정보처리자에게 손해배상을 청구할 수 있다. 이 경우 그 개인정보처리자는 고의 또는 과실이 없음을 입증하지 아니하면 책임을 면할 수 없다.\n② 삭제 <2015.7.24>\n③ 개인정보처리자의 고의 또는 중대한 과실로 인하여 개인정보가 유출등이 된 경우로서 정보주체에게 손해가 발생한 때에는 법원은 그 손해액의 5배를 넘지 아니하는 범위에서 손해배상액을 정할 수 있다. 다만, 개인정보처리자가 고의 또는 중대한 과실이 없음을 증명한 경우에는 그러하지 아니하다. <신설 2015.7.24, 2023.3.14, 2026.3.10>\n④ 법원은 제3항의 배상액을 정할 때에는 다음 각 호의 사항을 고려하여야 한다. <신설 2015.7.24>\n1. 고의 또는 손해 발생의 우려를 인식한 정도\n2. 위반행위로 인하여 입은 피해 규모\n3. 위법행위로 인하여 개인정보처리자가 취득한 경제적 이익\n4. 위반행위에 따른 벌금 및 과징금\n5. 위반행위의 기간ㆍ횟수 등\n6. 개인정보처리자의 재산상태\n7. 개인정보처리자가 정보주체의 개인정보 분실ㆍ도난ㆍ유출 후 해당 개인정보를 회수하기 위하여 노력한 정도\n8. 개인정보처리자가 정보주체의 피해구제를 위하여 노력한 정도\n제39조(손해배상책임)","kind":"L"},{"id":"L:39-2","label":"법 제39조의2","title":"법정손해배상의 청구","chapter":"제5장 정보주체의 권리 보장","deleted":false,"text":"① 제39조제1항에도 불구하고 정보주체는 개인정보처리자의 고의 또는 과실로 인하여 개인정보가 유출등이 된 경우에는 300만원 이하의 범위에서 상당한 금액을 손해액으로 하여 배상을 청구할 수 있다. 이 경우 해당 개인정보처리자는 고의 또는 과실이 없음을 입증하지 아니하면 책임을 면할 수 없다. <개정 2026.3.10>\n② 법원은 제1항에 따른 청구가 있는 경우에 변론 전체의 취지와 증거조사의 결과를 고려하여 제1항의 범위에서 상당한 손해액을 인정할 수 있다.\n③ 제39조에 따라 손해배상을 청구한 정보주체는 사실심(事實審)의 변론이 종결되기 전까지 그 청구를 제1항에 따른 청구로 변경할 수 있다.\n제39조의2(법정손해배상의 청구)","kind":"L"},{"id":"L:39-3","label":"법 제39조의3","title":"자료의 제출","chapter":"제6장 삭제","deleted":false,"text":"① 법원은 이 법을 위반한 행위로 인한 손해배상청구소송에서 당사자의 신청에 따라 상대방 당사자에게 해당 손해의 증명 또는 손해액의 산정에 필요한 자료의 제출을 명할 수 있다. 다만, 제출명령을 받은 자가 그 자료의 제출을 거부할 정당한 이유가 있으면 그러하지 아니하다.\n② 법원은 제1항에 따른 제출명령을 받은 자가 그 자료의 제출을 거부할 정당한 이유가 있다고 주장하는 경우에는 그 주장의 당부(當否)를 판단하기 위하여 자료의 제시를 명할 수 있다. 이 경우 법원은 그 자료를 다른 사람이 보게 하여서는 아니 된다.\n③ 제1항에 따라 제출되어야 할 자료가 「부정경쟁방지 및 영업비밀보호에 관한 법률」 제2조제2호에 따른 영업비밀(이하 \"영업비밀\"이라 한다)에 해당하나 손해의 증명 또는 손해액의 산정에 반드시 필요한 경우에는 제1항 단서에 따른 정당한 이유로 보지 아니한다. 이 경우 법원은 제출명령의 목적 내에서 열람할 수 있는 범위 또는 열람할 수 있는 사람을 지정하여야 한다.\n④ 법원은 제1항에 따른 제출명령을 받은 자가 정당한 이유 없이 그 명령에 따르지 아니한 경우에는 자료의 기재에 대한 신청인의 주장을 진실한 것으로 인정할 수 있다.\n⑤ 법원은 제4항에 해당하는 경우 신청인이 자료의 기재에 관하여 구체적으로 주장하기에 현저히 곤란한 사정이 있고 자료로 증명할 사실을 다른 증거로 증명하는 것을 기대하기도 어려운 경우에는 신청인이 자료의 기재로 증명하려는 사실에 관한 주장을 진실한 것으로 인정할 수 있다.\n제39조의3(자료의 제출)","kind":"L"},{"id":"L:39-4","label":"법 제39조의4","title":"비밀유지명령","chapter":"제6장 삭제","deleted":false,"text":"① 법원은 이 법을 위반한 행위로 인한 손해배상청구소송에서 당사자의 신청에 따른 결정으로 다음 각 호의 자에게 그 당사자가 보유한 영업비밀을 해당 소송의 계속적인 수행 외의 목적으로 사용하거나 그 영업비밀에 관계된 이 항에 따른 명령을 받은 자 외의 자에게 공개하지 아니할 것을 명할 수 있다. 다만, 그 신청 시점까지 다음 각 호의 자가 준비서면의 열람이나 증거조사 외의 방법으로 그 영업비밀을 이미 취득하고 있는 경우에는 그러하지 아니하다.\n1. 다른 당사자(법인인 경우에는 그 대표자를 말한다)\n2. 당사자를 위하여 해당 소송을 대리하는 자\n3. 그 밖에 해당 소송으로 영업비밀을 알게 된 자\n② 제1항에 따른 명령(이하 \"비밀유지명령\"이라 한다)을 신청하는 자는 다음 각 호의 사유를 모두 소명하여야 한다.\n1. 이미 제출하였거나 제출하여야 할 준비서면, 이미 조사하였거나 조사하여야 할 증거 또는 제39조의3제1항에 따라 제출하였거나 제출하여야 할 자료에 영업비밀이 포함되어 있다는 것\n2. 제1호의 영업비밀이 해당 소송 수행 외의 목적으로 사용되거나 공개되면 당사자의 영업에 지장을 줄 우려가 있어 이를 방지하기 위하여 영업비밀의 사용 또는 공개를 제한할 필요가 있다는 것\n③ 비밀유지명령의 신청은 다음 각 호의 사항을 적은 서면으로 하여야 한다.\n1. 비밀유지명령을 받을 자\n2. 비밀유지명령의 대상이 될 영업비밀을 특정하기에 충분한 사실\n3. 제2항 각 호의 사유에 해당하는 사실\n④ 법원은 비밀유지명령이 결정된 경우에는 그 결정서를 비밀유지명령을 받을 자에게 송달하여야 한다.\n⑤ 비밀유지명령은 제4항의 결정서가 비밀유지명령을 받을 자에게 송달된 때부터 효력이 발생한다.\n⑥ 비밀유지명령의 신청을 기각하거나 각하한 재판에 대해서는 즉시항고를 할 수 있다.\n제39조의4(비밀유지명령)","kind":"L"},{"id":"L:39-5","label":"법 제39조의5","title":"비밀유지명령의 취소","chapter":"제6장 삭제","deleted":false,"text":"① 비밀유지명령을 신청한 자 또는 비밀유지명령을 받은 자는 제39조의4제2항 각 호의 사유에 부합하지 아니하는 사실이나 사정이 있는 경우 소송기록을 보관하고 있는 법원(소송기록을 보관하고 있는 법원이 없는 경우에는 비밀유지명령을 내린 법원을 말한다)에 비밀유지명령의 취소를 신청할 수 있다.\n② 법원은 비밀유지명령의 취소신청에 대한 재판이 있는 경우에는 그 결정서를 그 신청을 한 자 및 상대방에게 송달하여야 한다.\n③ 비밀유지명령의 취소신청에 대한 재판에 대해서는 즉시항고를 할 수 있다.\n④ 비밀유지명령을 취소하는 재판은 확정되어야 효력이 발생한다.\n⑤ 비밀유지명령을 취소하는 재판을 한 법원은 비밀유지명령의 취소신청을 한 자 또는 상대방 외에 해당 영업비밀에 관한 비밀유지명령을 받은 자가 있는 경우에는 그 자에게 즉시 비밀유지명령의 취소 재판을 한 사실을 알려야 한다.\n제39조의5(비밀유지명령의 취소)","kind":"L"},{"id":"L:39-6","label":"법 제39조의6","title":"소송기록 열람 등의 청구 통지 등","chapter":"제6장 삭제","deleted":false,"text":"① 비밀유지명령이 내려진 소송(모든 비밀유지명령이 취소된 소송은 제외한다)에 관한 소송기록에 대하여 「민사소송법」 제163조제1항에 따라 열람 등의 신청인을 당사자로 제한하는 결정이 있었던 경우로서 당사자가 같은 항에서 규정하는 비밀 기재부분의 열람 등의 청구를 하였으나 그 청구 절차를 해당 소송에서 비밀유지명령을 받지 아니한 자가 밟은 경우에는 법원서기관, 법원사무관, 법원주사 또는 법원주사보(이하 이 조에서 \"법원사무관등\"이라 한다)는 같은 항의 신청을 한 당사자(그 열람 등의 청구를 한 자는 제외한다. 이하 제3항에서 같다)에게 그 청구 직후에 그 열람 등의 청구가 있었다는 사실을 알려야 한다.\n② 법원사무관등은 제1항의 청구가 있었던 날부터 2주일이 지날 때까지(그 청구 절차를 밟은 자에 대한 비밀유지명령 신청이 그 기간 내에 이루어진 경우에는 그 신청에 대한 재판이 확정되는 시점까지를 말한다) 그 청구 절차를 밟은 자에게 제1항의 비밀 기재부분의 열람 등을 하게 하여서는 아니 된다.\n③ 제2항은 제1항의 열람 등의 청구를 한 자에게 제1항의 비밀 기재부분의 열람 등을 하게 하는 것에 대하여 「민사소송법」 제163조제1항의 신청을 한 당사자 모두가 동의하는 경우에는 적용되지 아니한다.\n제39조의6(소송기록 열람 등의 청구 통지 등)","kind":"L"},{"id":"L:39-7","label":"법 제39조의7","title":"손해배상의 보장","chapter":"제6장 삭제","deleted":false,"text":"① 개인정보처리자로서 매출액, 개인정보의 보유 규모 등을 고려하여 대통령령으로 정하는 기준에 해당하는 자는 제39조 및 제39조의2에 따른 손해배상책임의 이행을 위하여 보험 또는 공제에 가입하거나 준비금을 적립하는 등 필요한 조치를 하여야 한다. <개정 2023.3.14>\n② 제1항에도 불구하고 다음 각 호의 어느 하나에 해당하는 자는 제1항에 따른 조치를 하지 아니할 수 있다. <개정 2023.3.14>\n1. 대통령령으로 정하는 공공기관, 비영리법인 및 단체\n2. 「소상공인기본법」 제2조제1항에 따른 소상공인으로서 대통령령으로 정하는 자에게 개인정보 처리를 위탁한 자\n3. 다른 법률에 따라 제39조 및 제39조의2에 따른 손해배상책임의 이행을 보장하는 보험 또는 공제에 가입하거나 준비금을 적립한 개인정보처리자\n③ 제1항 및 제2항에 따른 개인정보처리자의 손해배상책임 이행 기준 등에 필요한 사항은 대통령령으로 정한다. <신설 2023.3.14>\n제39조의7(손해배상의 보장)","kind":"L"},{"id":"L:40","label":"법 제40조","title":"설치 및 구성","chapter":"제7장 개인정보 분쟁조정위원회","deleted":false,"text":"① 개인정보에 관한 분쟁의 조정(調停)을 위하여 개인정보 분쟁조정위원회(이하 \"분쟁조정위원회\"라 한다)를 둔다.\n② 분쟁조정위원회는 위원장 1명을 포함한 30명 이내의 위원으로 구성하며, 위원은 당연직위원과 위촉위원으로 구성한다. <개정 2015.7.24, 2023.3.14>\n③ 위촉위원은 다음 각 호의 어느 하나에 해당하는 사람 중에서 보호위원회 위원장이 위촉하고, 대통령령으로 정하는 국가기관 소속 공무원은 당연직위원이 된다. <개정 2013.3.23, 2014.11.19, 2015.7.24>\n1. 개인정보 보호업무를 관장하는 중앙행정기관의 고위공무원단에 속하는 공무원으로 재직하였던 사람 또는 이에 상당하는 공공부문 및 관련 단체의 직에 재직하고 있거나 재직하였던 사람으로서 개인정보 보호업무의 경험이 있는 사람\n2. 대학이나 공인된 연구기관에서 부교수 이상 또는 이에 상당하는 직에 재직하고 있거나 재직하였던 사람\n3. 판사ㆍ검사 또는 변호사로 재직하고 있거나 재직하였던 사람\n4. 개인정보 보호와 관련된 시민사회단체 또는 소비자단체로부터 추천을 받은 사람\n5. 개인정보처리자로 구성된 사업자단체의 임원으로 재직하고 있거나 재직하였던 사람\n④ 위원장은 위원 중에서 공무원이 아닌 사람으로 보호위원회 위원장이 위촉한다. <개정 2013.3.23, 2014.11.19, 2015.7.24>\n⑤ 위원장과 위촉위원의 임기는 2년으로 하되, 1차에 한하여 연임할 수 있다. <개정 2015.7.24>\n⑥ 분쟁조정위원회는 분쟁조정 업무를 효율적으로 수행하기 위하여 필요하면 대통령령으로 정하는 바에 따라 조정사건의 분야별로 5명 이내의 위원으로 구성되는 조정부를 둘 수 있다. 이 경우 조정부가 분쟁조정위원회에서 위임받아 의결한 사항은 분쟁조정위원회에서 의결한 것으로 본다.\n⑦ 분쟁조정위원회 또는 조정부는 재적위원 과반수의 출석으로 개의하며 출석위원 과반수의 찬성으로 의결한다.\n⑧ 보호위원회는 분쟁조정 접수, 사실 확인 등 분쟁조정에 필요한 사무를 처리할 수 있다. <개정 2015.7.24>\n⑨ 이 법에서 정한 사항 외에 분쟁조정위원회 운영에 필요한 사항은 대통령령으로 정한다.\n제40조(설치 및 구성)","kind":"L"},{"id":"L:41","label":"법 제41조","title":"위원의 신분보장","chapter":"제7장 개인정보 분쟁조정위원회","deleted":false,"text":"제41조(위원의 신분보장) 위원은 자격정지 이상의 형을 선고받거나 심신상의 장애로 직무를 수행할 수 없는 경우를 제외하고는 그의 의사에 반하여 면직되거나 해촉되지 아니한다.","kind":"L"},{"id":"L:42","label":"법 제42조","title":"위원의 제척ㆍ기피ㆍ회피","chapter":"제7장 개인정보 분쟁조정위원회","deleted":false,"text":"① 분쟁조정위원회의 위원은 다음 각 호의 어느 하나에 해당하는 경우에는 제43조제1항에 따라 분쟁조정위원회에 신청된 분쟁조정사건(이하 이 조에서 \"사건\"이라 한다)의 심의ㆍ의결에서 제척(除斥)된다.\n1. 위원 또는 그 배우자나 배우자였던 자가 그 사건의 당사자가 되거나 그 사건에 관하여 공동의 권리자 또는 의무자의 관계에 있는 경우\n2. 위원이 그 사건의 당사자와 친족이거나 친족이었던 경우\n3. 위원이 그 사건에 관하여 증언, 감정, 법률자문을 한 경우\n4. 위원이 그 사건에 관하여 당사자의 대리인으로서 관여하거나 관여하였던 경우\n② 당사자는 위원에게 공정한 심의ㆍ의결을 기대하기 어려운 사정이 있으면 위원장에게 기피신청을 할 수 있다. 이 경우 위원장은 기피신청에 대하여 분쟁조정위원회의 의결을 거치지 아니하고 결정한다.\n③ 위원이 제1항 또는 제2항의 사유에 해당하는 경우에는 스스로 그 사건의 심의ㆍ의결에서 회피할 수 있다.\n제42조(위원의 제척ㆍ기피ㆍ회피)","kind":"L"},{"id":"L:43","label":"법 제43조","title":"조정의 신청 등","chapter":"제7장 개인정보 분쟁조정위원회","deleted":false,"text":"① 개인정보와 관련한 분쟁의 조정을 원하는 자는 분쟁조정위원회에 분쟁조정을 신청할 수 있다.\n② 분쟁조정위원회는 당사자 일방으로부터 분쟁조정 신청을 받았을 때에는 그 신청내용을 상대방에게 알려야 한다.\n③ 개인정보처리자가 제2항에 따른 분쟁조정의 통지를 받은 경우에는 특별한 사유가 없으면 분쟁조정에 응하여야 한다. <개정 2023.3.14>\n제43조(조정의 신청 등)","kind":"L"},{"id":"L:44","label":"법 제44조","title":"처리기간","chapter":"제7장 개인정보 분쟁조정위원회","deleted":false,"text":"① 분쟁조정위원회는 제43조제1항에 따른 분쟁조정 신청을 받은 날부터 60일 이내에 이를 심사하여 조정안을 작성하여야 한다. 다만, 부득이한 사정이 있는 경우에는 분쟁조정위원회의 의결로 처리기간을 연장할 수 있다.\n② 분쟁조정위원회는 제1항 단서에 따라 처리기간을 연장한 경우에는 기간연장의 사유와 그 밖의 기간연장에 관한 사항을 신청인에게 알려야 한다.\n제44조(처리기간)","kind":"L"},{"id":"L:45","label":"법 제45조","title":"자료의 요청 및 사실조사 등","chapter":"제7장 개인정보 분쟁조정위원회","deleted":false,"text":"① 분쟁조정위원회는 제43조제1항에 따라 분쟁조정 신청을 받았을 때에는 해당 분쟁의 조정을 위하여 필요한 자료를 분쟁당사자에게 요청할 수 있다. 이 경우 분쟁당사자는 정당한 사유가 없으면 요청에 따라야 한다.\n② 분쟁조정위원회는 분쟁의 조정을 위하여 사실 확인이 필요한 경우에는 분쟁조정위원회의 위원 또는 대통령령으로 정하는 사무기구의 소속 공무원으로 하여금 사건과 관련된 장소에 출입하여 관련 자료를 조사하거나 열람하게 할 수 있다. 이 경우 분쟁당사자는 해당 조사ㆍ열람을 거부할 정당한 사유가 있을 때에는 그 사유를 소명하고 조사ㆍ열람에 따르지 아니할 수 있다. <신설 2023.3.14>\n③ 제2항에 따른 조사ㆍ열람을 하는 위원 또는 공무원은 그 권한을 표시하는 증표를 지니고 이를 관계인에게 내보여야 한다. <신설 2023.3.14>\n④ 분쟁조정위원회는 분쟁의 조정을 위하여 필요하다고 인정하면 관계 기관 등에 자료 또는 의견의 제출 등 필요한 협조를 요청할 수 있다. <신설 2023.3.14>\n⑤ 분쟁조정위원회는 필요하다고 인정하면 분쟁당사자나 참고인을 위원회에 출석하도록 하여 그 의견을 들을 수 있다. <개정 2023.3.14>\n제45조(자료의 요청 및 사실조사 등)","kind":"L"},{"id":"L:45-2","label":"법 제45조의2","title":"진술의 원용 제한","chapter":"제7장 개인정보 분쟁조정위원회","deleted":false,"text":"제45조의2(진술의 원용 제한) 조정절차에서의 의견과 진술은 소송(해당 조정에 대한 준재심은 제외한다)에서 원용(援用)하지 못한다.","kind":"L"},{"id":"L:46","label":"법 제46조","title":"조정 전 합의 권고","chapter":"제7장 개인정보 분쟁조정위원회","deleted":false,"text":"제46조(조정 전 합의 권고) 분쟁조정위원회는 제43조제1항에 따라 분쟁조정 신청을 받았을 때에는 당사자에게 그 내용을 제시하고 조정 전 합의를 권고할 수 있다.","kind":"L"},{"id":"L:47","label":"법 제47조","title":"분쟁의 조정","chapter":"제7장 개인정보 분쟁조정위원회","deleted":false,"text":"① 분쟁조정위원회는 다음 각 호의 어느 하나의 사항을 포함하여 조정안을 작성할 수 있다.\n1. 조사 대상 침해행위의 중지\n2. 원상회복, 손해배상, 그 밖에 필요한 구제조치\n3. 같거나 비슷한 침해의 재발을 방지하기 위하여 필요한 조치\n② 분쟁조정위원회는 제1항에 따라 조정안을 작성하면 지체 없이 각 당사자에게 제시하여야 한다.\n③ 제2항에 따라 조정안을 제시받은 당사자가 제시받은 날부터 15일 이내에 수락 여부를 알리지 아니하면 조정을 수락한 것으로 본다. <개정 2023.3.14>\n④ 당사자가 조정내용을 수락한 경우(제3항에 따라 수락한 것으로 보는 경우를 포함한다) 분쟁조정위원회는 조정서를 작성하고, 분쟁조정위원회의 위원장과 각 당사자가 기명날인 또는 서명을 한 후 조정서 정본을 지체 없이 각 당사자 또는 그 대리인에게 송달하여야 한다. 다만, 제3항에 따라 수락한 것으로 보는 경우에는 각 당사자의 기명날인 및 서명을 생략할 수 있다. <개정 2023.3.14>\n⑤ 제4항에 따른 조정의 내용은 재판상 화해와 동일한 효력을 갖는다.\n제47조(분쟁의 조정)","kind":"L"},{"id":"L:48","label":"법 제48조","title":"조정의 거부 및 중지","chapter":"제7장 개인정보 분쟁조정위원회","deleted":false,"text":"① 분쟁조정위원회는 분쟁의 성질상 분쟁조정위원회에서 조정하는 것이 적합하지 아니하다고 인정하거나 부정한 목적으로 조정이 신청되었다고 인정하는 경우에는 그 조정을 거부할 수 있다. 이 경우 조정거부의 사유 등을 신청인에게 알려야 한다.\n② 분쟁조정위원회는 신청된 조정사건에 대한 처리절차를 진행하던 중에 한 쪽 당사자가 소를 제기하면 그 조정의 처리를 중지하고 이를 당사자에게 알려야 한다.\n제48조(조정의 거부 및 중지)","kind":"L"},{"id":"L:49","label":"법 제49조","title":"집단분쟁조정","chapter":"제7장 개인정보 분쟁조정위원회","deleted":false,"text":"① 국가 및 지방자치단체, 개인정보 보호단체 및 기관, 정보주체, 개인정보처리자는 정보주체의 피해 또는 권리침해가 다수의 정보주체에게 같거나 비슷한 유형으로 발생하는 경우로서 대통령령으로 정하는 사건에 대하여는 분쟁조정위원회에 일괄적인 분쟁조정(이하 \"집단분쟁조정\"이라 한다)을 의뢰 또는 신청할 수 있다.\n② 제1항에 따라 집단분쟁조정을 의뢰받거나 신청받은 분쟁조정위원회는 그 의결로써 제3항부터 제7항까지의 규정에 따른 집단분쟁조정의 절차를 개시할 수 있다. 이 경우 분쟁조정위원회는 대통령령으로 정하는 기간 동안 그 절차의 개시를 공고하여야 한다.\n③ 분쟁조정위원회는 집단분쟁조정의 당사자가 아닌 정보주체 또는 개인정보처리자로부터 그 분쟁조정의 당사자에 추가로 포함될 수 있도록 하는 신청을 받을 수 있다.\n④ 분쟁조정위원회는 그 의결로써 제1항 및 제3항에 따른 집단분쟁조정의 당사자 중에서 공동의 이익을 대표하기에 가장 적합한 1인 또는 수인을 대표당사자로 선임할 수 있다.\n⑤ 분쟁조정위원회는 개인정보처리자가 분쟁조정위원회의 집단분쟁조정의 내용을 수락한 경우에는 집단분쟁조정의 당사자가 아닌 자로서 피해를 입은 정보주체에 대한 보상계획서를 작성하여 분쟁조정위원회에 제출하도록 권고할 수 있다.\n⑥ 제48조제2항에도 불구하고 분쟁조정위원회는 집단분쟁조정의 당사자인 다수의 정보주체 중 일부의 정보주체가 법원에 소를 제기한 경우에는 그 절차를 중지하지 아니하고, 소를 제기한 일부의 정보주체를 그 절차에서 제외한다.\n⑦ 집단분쟁조정의 기간은 제2항에 따른 공고가 종료된 날의 다음 날부터 60일 이내로 한다. 다만, 부득이한 사정이 있는 경우에는 분쟁조정위원회의 의결로 처리기간을 연장할 수 있다.\n⑧ 집단분쟁조정의 절차 등에 관하여 필요한 사항은 대통령령으로 정한다.\n제49조(집단분쟁조정)","kind":"L"},{"id":"L:50","label":"법 제50조","title":"조정절차 등","chapter":"제7장 개인정보 분쟁조정위원회","deleted":false,"text":"① 제43조부터 제49조까지의 규정에서 정한 것 외에 분쟁의 조정방법, 조정절차 및 조정업무의 처리 등에 필요한 사항은 대통령령으로 정한다.\n② 분쟁조정위원회의 운영 및 분쟁조정 절차에 관하여 이 법에서 규정하지 아니한 사항에 대하여는 「민사조정법」을 준용한다.\n제50조(조정절차 등)","kind":"L"},{"id":"L:50-2","label":"법 제50조의2","title":"개선의견의 통보","chapter":"제7장 개인정보 분쟁조정위원회","deleted":false,"text":"제50조의2(개선의견의 통보) 분쟁조정위원회는 소관 업무 수행과 관련하여 개인정보 보호 및 정보주체의 권리 보호를 위한 개선의견을 보호위원회 및 관계 중앙행정기관의 장에게 통보할 수 있다.","kind":"L"},{"id":"L:51","label":"법 제51조","title":"단체소송의 대상 등","chapter":"제8장 개인정보 단체소송","deleted":false,"text":"1. 「소비자기본법」 제29조에 따라 공정거래위원회에 등록한 소비자단체로서 다음 각 목의 요건을 모두 갖춘 단체\n가. 정관에 따라 상시적으로 정보주체의 권익증진을 주된 목적으로 하는 단체일 것\n나. 단체의 정회원수가 1천명 이상일 것\n다. 「소비자기본법」 제29조에 따른 등록 후 3년이 경과하였을 것\n2. 「비영리민간단체 지원법」 제2조에 따른 비영리민간단체로서 다음 각 목의 요건을 모두 갖춘 단체\n가. 법률상 또는 사실상 동일한 침해를 입은 100명 이상의 정보주체로부터 단체소송의 제기를 요청받을 것\n나. 정관에 개인정보 보호를 단체의 목적으로 명시한 후 최근 3년 이상 이를 위한 활동실적이 있을 것\n다. 단체의 상시 구성원수가 5천명 이상일 것\n라. 중앙행정기관에 등록되어 있을 것\n제51조(단체소송의 대상 등) 다음 각 호의 어느 하나에 해당하는 단체는 개인정보처리자가 제49조에 따른 집단분쟁조정을 거부하거나 집단분쟁조정의 결과를 수락하지 아니한 경우에는 법원에 권리침해 행위의 금지ㆍ중지를 구하는 소송(이하 \"단체소송\"이라 한다)을 제기할 수 있다.","kind":"L"},{"id":"L:52","label":"법 제52조","title":"전속관할","chapter":"제8장 개인정보 단체소송","deleted":false,"text":"① 단체소송의 소는 피고의 주된 사무소 또는 영업소가 있는 곳, 주된 사무소나 영업소가 없는 경우에는 주된 업무담당자의 주소가 있는 곳의 지방법원 본원 합의부의 관할에 전속한다.\n② 제1항을 외국사업자에 적용하는 경우 대한민국에 있는 이들의 주된 사무소ㆍ영업소 또는 업무담당자의 주소에 따라 정한다.\n제52조(전속관할)","kind":"L"},{"id":"L:53","label":"법 제53조","title":"소송대리인의 선임","chapter":"제8장 개인정보 단체소송","deleted":false,"text":"제53조(소송대리인의 선임) 단체소송의 원고는 변호사를 소송대리인으로 선임하여야 한다.","kind":"L"},{"id":"L:54","label":"법 제54조","title":"소송허가신청","chapter":"제8장 개인정보 단체소송","deleted":false,"text":"① 단체소송을 제기하는 단체는 소장과 함께 다음 각 호의 사항을 기재한 소송허가신청서를 법원에 제출하여야 한다.\n1. 원고 및 그 소송대리인\n2. 피고\n3. 정보주체의 침해된 권리의 내용\n② 제1항에 따른 소송허가신청서에는 다음 각 호의 자료를 첨부하여야 한다.\n1. 소제기단체가 제51조 각 호의 어느 하나에 해당하는 요건을 갖추고 있음을 소명하는 자료\n2. 개인정보처리자가 조정을 거부하였거나 조정결과를 수락하지 아니하였음을 증명하는 서류\n제54조(소송허가신청)","kind":"L"},{"id":"L:55","label":"법 제55조","title":"소송허가요건 등","chapter":"제8장 개인정보 단체소송","deleted":false,"text":"① 법원은 다음 각 호의 요건을 모두 갖춘 경우에 한하여 결정으로 단체소송을 허가한다.\n1. 개인정보처리자가 분쟁조정위원회의 조정을 거부하거나 조정결과를 수락하지 아니하였을 것\n2. 제54조에 따른 소송허가신청서의 기재사항에 흠결이 없을 것\n② 단체소송을 허가하거나 불허가하는 결정에 대하여는 즉시항고할 수 있다.\n제55조(소송허가요건 등)","kind":"L"},{"id":"L:56","label":"법 제56조","title":"확정판결의 효력","chapter":"제8장 개인정보 단체소송","deleted":false,"text":"1. 판결이 확정된 후 그 사안과 관련하여 국가ㆍ지방자치단체 또는 국가ㆍ지방자치단체가 설립한 기관에 의하여 새로운 증거가 나타난 경우\n2. 기각판결이 원고의 고의로 인한 것임이 밝혀진 경우\n제56조(확정판결의 효력) 원고의 청구를 기각하는 판결이 확정된 경우 이와 동일한 사안에 관하여는 제51조에 따른 다른 단체는 단체소송을 제기할 수 없다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 그러하지 아니하다.","kind":"L"},{"id":"L:57","label":"법 제57조","title":"「민사소송법」의 적용 등","chapter":"제8장 개인정보 단체소송","deleted":false,"text":"① 단체소송에 관하여 이 법에 특별한 규정이 없는 경우에는 「민사소송법」을 적용한다.\n② 제55조에 따른 단체소송의 허가결정이 있는 경우에는 「민사집행법」 제4편에 따른 보전처분을 할 수 있다.\n③ 단체소송의 절차에 관하여 필요한 사항은 대법원규칙으로 정한다.\n제57조(「민사소송법」의 적용 등)","kind":"L"},{"id":"L:58","label":"법 제58조","title":"적용의 일부 제외","chapter":"제9장 보칙","deleted":false,"text":"① 다음 각 호의 어느 하나에 해당하는 개인정보에 관하여는 제3장부터 제8장까지를 적용하지 아니한다. <개정 2023.3.14>\n1. 삭제<2023.3.14>\n2. 국가안전보장과 관련된 정보 분석을 목적으로 수집 또는 제공 요청되는 개인정보\n3. 삭제<2023.3.14>\n4. 언론, 종교단체, 정당이 각각 취재ㆍ보도, 선교, 선거 입후보자 추천 등 고유 목적을 달성하기 위하여 수집ㆍ이용하는 개인정보\n② 제25조제1항 각 호에 따라 공개된 장소에 고정형 영상정보처리기기를 설치ㆍ운영하여 처리되는 개인정보에 대해서는 제15조, 제22조, 제22조의2, 제27조제1항ㆍ제2항, 제34조 및 제37조를 적용하지 아니한다. <개정 2023.3.14>\n③ 개인정보처리자가 동창회, 동호회 등 친목 도모를 위한 단체를 운영하기 위하여 개인정보를 처리하는 경우에는 제15조, 제30조, 제30조의3 및 제31조를 적용하지 아니한다. <개정 2026.3.10>\n④ 개인정보처리자는 제1항 각 호에 따라 개인정보를 처리하는 경우에도 그 목적을 위하여 필요한 범위에서 최소한의 기간에 최소한의 개인정보만을 처리하여야 하며, 개인정보의 안전한 관리를 위하여 필요한 기술적ㆍ관리적 및 물리적 보호조치, 개인정보의 처리에 관한 고충처리, 그 밖에 개인정보의 적절한 처리를 위하여 필요한 조치를 마련하여야 한다.\n제58조(적용의 일부 제외)","kind":"L"},{"id":"L:58-2","label":"법 제58조의2","title":"적용제외","chapter":"제9장 보칙","deleted":false,"text":"제58조의2(적용제외) 이 법은 시간ㆍ비용ㆍ기술 등을 합리적으로 고려할 때 다른 정보를 사용하여도 더 이상 개인을 알아볼 수 없는 정보에는 적용하지 아니한다.","kind":"L"},{"id":"L:59","label":"법 제59조","title":"금지행위","chapter":"제9장 보칙","deleted":false,"text":"1. 거짓이나 그 밖의 부정한 수단이나 방법으로 개인정보를 취득하거나 처리에 관한 동의를 받는 행위\n2. 업무상 알게 된 개인정보를 누설하거나 권한 없이 다른 사람이 이용하도록 제공하는 행위\n3. 정당한 권한 없이 또는 허용된 권한을 초과하여 다른 사람의 개인정보를 이용, 훼손, 멸실, 변경, 위조 또는 유출하는 행위\n제59조(금지행위) 개인정보를 처리하거나 처리하였던 자는 다음 각 호의 어느 하나에 해당하는 행위를 하여서는 아니 된다. <개정 2023.3.14>","kind":"L"},{"id":"L:60","label":"법 제60조","title":"비밀유지 등","chapter":"제9장 보칙","deleted":false,"text":"1. 제7조의8 및 제7조의9에 따른 보호위원회의 업무\n2. 제28조의3에 따른 전문기관의 지정 업무 및 전문기관의 업무\n3. 제32조의2에 따른 개인정보 보호 인증 업무\n4. 제33조에 따른 영향평가 업무\n5. 제35조의3에 따른 개인정보관리 전문기관의 지정 업무 및 개인정보관리 전문기관의 업무\n6. 제40조에 따른 분쟁조정위원회의 분쟁조정 업무\n제60조(비밀유지 등) 다음 각 호의 업무에 종사하거나 종사하였던 자는 직무상 알게 된 비밀을 다른 사람에게 누설하거나 직무상 목적 외의 용도로 이용하여서는 아니 된다. 다만, 다른 법률에 특별한 규정이 있는 경우에는 그러하지 아니하다. <개정 2020.2.4, 2023.3.14>","kind":"L"},{"id":"L:61","label":"법 제61조","title":"의견제시 및 개선권고","chapter":"제9장 보칙","deleted":false,"text":"① 보호위원회는 개인정보 보호에 영향을 미치는 내용이 포함된 법령이나 조례에 대하여 필요하다고 인정하면 심의ㆍ의결을 거쳐 관계 기관에 의견을 제시할 수 있다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.2.4>\n② 보호위원회는 개인정보 보호를 위하여 필요하다고 인정하면 개인정보처리자에게 개인정보 처리 실태의 개선을 권고할 수 있다. 이 경우 권고를 받은 개인정보처리자는 이를 이행하기 위하여 성실하게 노력하여야 하며, 그 조치 결과를 보호위원회에 알려야 한다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.2.4>\n③ 관계 중앙행정기관의 장은 개인정보 보호를 위하여 필요하다고 인정하면 소관 법률에 따라 개인정보처리자에게 개인정보 처리 실태의 개선을 권고할 수 있다. 이 경우 권고를 받은 개인정보처리자는 이를 이행하기 위하여 성실하게 노력하여야 하며, 그 조치 결과를 관계 중앙행정기관의 장에게 알려야 한다.\n④ 중앙행정기관, 지방자치단체, 국회, 법원, 헌법재판소, 중앙선거관리위원회는 그 소속 기관 및 소관 공공기관에 대하여 개인정보 보호에 관한 의견을 제시하거나 지도ㆍ점검을 할 수 있다.\n제61조(의견제시 및 개선권고)","kind":"L"},{"id":"L:62","label":"법 제62조","title":"침해 사실의 신고 등","chapter":"제9장 보칙","deleted":false,"text":"① 개인정보처리자가 개인정보를 처리할 때 개인정보에 관한 권리 또는 이익을 침해받은 사람은 보호위원회에 그 침해 사실을 신고할 수 있다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.2.4>\n② 보호위원회는 제1항에 따른 신고의 접수ㆍ처리 등에 관한 업무를 효율적으로 수행하기 위하여 대통령령으로 정하는 바에 따라 전문기관을 지정할 수 있다. 이 경우 전문기관은 개인정보침해 신고센터(이하 \"신고센터\"라 한다)를 설치ㆍ운영하여야 한다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.2.4>\n③ 신고센터는 다음 각 호의 업무를 수행한다.\n1. 개인정보 처리와 관련한 신고의 접수ㆍ상담\n2. 사실의 조사ㆍ확인 및 관계자의 의견 청취\n3. 제1호 및 제2호에 따른 업무에 딸린 업무\n④ 보호위원회는 제3항제2호의 사실 조사ㆍ확인 등의 업무를 효율적으로 하기 위하여 필요하면 「국가공무원법」 제32조의4에 따라 소속 공무원을 제2항에 따른 전문기관에 파견할 수 있다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.2.4>\n제62조(침해 사실의 신고 등)","kind":"L"},{"id":"L:63","label":"법 제63조","title":"자료제출 요구 및 검사","chapter":"제9장 보칙","deleted":false,"text":"① 보호위원회는 다음 각 호의 어느 하나에 해당하는 경우에는 개인정보처리자에게 관계 물품ㆍ서류 등 자료를 제출하게 할 수 있다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.2.4>\n1. 이 법을 위반하는 사항을 발견하거나 혐의가 있음을 알게 된 경우\n2. 이 법 위반에 대한 신고를 받거나 민원이 접수된 경우\n3. 그 밖에 정보주체의 개인정보 보호를 위하여 필요한 경우로서 대통령령으로 정하는 경우\n② 보호위원회는 개인정보처리자가 제1항에 따른 자료를 제출하지 아니하거나 이 법을 위반한 사실이 있다고 인정되면 소속 공무원으로 하여금 개인정보처리자 및 해당 법 위반사실과 관련한 관계인의 사무소나 사업장에 출입하여 업무 상황, 장부 또는 서류 등을 검사하게 할 수 있다. 이 경우 검사를 하는 공무원은 그 권한을 나타내는 증표를 지니고 이를 관계인에게 내보여야 한다. <개정 2013.3.23, 2014.11.19, 2015.7.24, 2017.7.26, 2020.2.4>\n③ 보호위원회는 이 법 등 개인정보 보호와 관련된 법규의 위반행위로 인하여 중대한 개인정보 침해사고가 발생한 경우 신속하고 효과적인 대응을 위하여 다음 각 호의 어느 하나에 해당하는 관계 기관의 장에게 협조를 요청할 수 있다. <개정 2023.3.14>\n1. 중앙행정기관\n2. 지방자치단체\n3. 그 밖에 법령 또는 자치법규에 따라 행정권한을 가지고 있거나 위임 또는 위탁받은 공공기관\n④ 제3항에 따라 협조를 요청받은 관계 기관의 장은 특별한 사정이 없으면 이에 따라야 한다. <개정 2023.3.14>\n⑤ 제1항 및 제2항에 따른 자료제출 요구, 검사 절차 및 방법 등에 관하여 필요한 사항은 보호위원회가 정하여 고시할 수 있다. <개정 2023.3.14>\n⑥ 보호위원회는 제1항 및 제
