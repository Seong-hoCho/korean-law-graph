를 하는 경우에는 다음 각 호의 사항을 특정해야 한다. <개정 2026.2.19>\n1. 전송 요구 목적\n2. 전송 요구를 받는 자\n3. 개인정보를 전송받는 자\n4. 전송을 요구하는 개인정보\n5. 정기적 전송을 요구하는지 여부 및 요구하는 경우 그 주기[제5항에 따라 제3자대상정보전송자에게 제42조의9제1항제2호에 따른 일반전문기관(이하 \"일반전문기관\"이라 한다) 및 같은 항 제3호에 따른 특수전문기관(이하 \"특수전문기관\"이라 한다)에 대한 제3자전송요구를 하는 경우에 한정한다]\n6. 전송 요구의 종료시점\n7. 전송을 요구하는 개인정보의 보유 및 이용기간\n④ 정보주체는 개인정보관리 전문기관 또는 일반수신자를 통하여 제3자대상정보전송자에게 제3자전송요구를 할 수 있다. 이 경우 개인정보관리 전문기관 또는 일반수신자는 제3항 각 호의 사항에 대하여 정보주체가 그 내용을 명확하게 인지하고 제3자전송요구를 할 수 있도록 미리 알려야 한다. <개정 2026.2.19>\n⑤ 정보주체는 제3자대상정보전송자에게 일반전문기관 및 특수전문기관에 대한 제3자전송요구를 하는 경우 같은 내역의 개인정보를 정기적으로 전송할 것을 요구할 수 있다. <개정 2026.2.19>\n⑥ 정보주체는 제1항부터 제5항까지의 규정에 따른 전송 요구를 변경하거나 철회할 수 있다. 이 경우 본인대상정보전송자, 제3자대상정보전송자, 개인정보관리 전문기관 및 일반수신자는 전송 요구 변경 및 철회의 방법ㆍ절차가 전송 요구 당시의 방법ㆍ절차보다 어렵지 않도록 해야 한다. <개정 2026.2.19>\n제42조의5(전송 요구의 방법 등)","kind":"D"},{"id":"D:42-6","label":"영 제42조의6","title":"개인정보 전송의 기한 및 방법 등","chapter":"제6장 정보주체의 권리 보장","deleted":false,"text":"① 법 제35조의2제1항 및 제2항에 따라 전송 요구를 받은 본인대상정보전송자 및 제3자대상정보전송자(이하 \"정보전송자\"라 한다)는 정보시스템 장애 등으로 전송이 지연되거나 불가능한 사유가 없으면 지체 없이 개인정보를 전송해야 한다. 이 경우 정보전송자는 지체 없이 전송할 수 없는 정당한 사유가 있는 경우에는 정보주체에게 그 사유를 알리고 전송을 연기할 수 있으며, 그 사유가 소멸하면 지체 없이 개인정보를 전송해야 한다. <개정 2026.2.19>\n② 정보전송자는 개인정보를 전송하는 경우 개인정보의 정확성, 완전성 및 최신성을 유지해야 한다.\n③ 정보전송자는 전송의 안전성 및 신뢰성이 보장될 수 있도록 다음 각 호의 구분에 따른 방식으로 개인정보를 전송해야 한다. <개정 2026.2.19>\n1. 본인대상정보전송자: 다음 각 목의 요건을 모두 충족하는 방식\n가. 정보 전송 시 안전한 암호 알고리즘으로 암호화하여 전송하는 방식일 것\n나. 정보주체가 법 제38조제1항에 따라 본인전송요구를 하게 한 대리인이 자동화된 도구를 이용하는 경우에는 개인정보의 안전성 확보를 위하여 본인대상정보전송자와 해당 대리인이 사전에 협의한 방식일 것\n2. 제3자대상정보전송자: 다음 각 목의 요건을 모두 충족하는 방식\n가. 제3자대상정보전송자와 개인정보관리 전문기관 및 일반수신자 간에 미리 협의하여 정하는 방식일 것\n나. 제3자대상정보전송자와 개인정보관리 전문기관 및 일반수신자 간 상호 식별ㆍ인증할 수 있는 방식일 것\n다. 제3자대상정보전송자와 개인정보관리 전문기관 및 일반수신자 간 상호 확인할 수 있는 방식일 것\n라. 정보 전송 시 안전한 암호 알고리즘으로 암호화하여 전송하는 방식일 것\n④ 본인대상정보전송자는 자신이 관리하는 인터넷 홈페이지를 통해 정보주체가 즉시 열람ㆍ조회할 수 있는 정보를 안전한 암호 알고리즘으로 암호화하여 정보주체가 직접 내려받게 할 수 있다. <신설 2026.2.19>\n⑤ 법 제38조제1항에 따라 정보주체의 본인전송요구를 대리한 대리인은 개인정보를 저장하지 않고 본인에게 전달해야 한다. <신설 2026.2.19>\n⑥ 본인대상정보전송자는 정보주체가 법 제35조의2제1항에 따라 개인정보 전송을 요구하고 전송 내역 등을 확인할 수 있도록 본인전송요구 방법, 전송 현황 및 내역을 확인할 수 있는 방법을 인터넷 홈페이지 등에 게재해야 한다. 다만, 본인대상정보전송자가 보건의료정보전송자 또는 에너지정보전송자에 해당하는 경우에는 중계전문기관이 대신하여 게재할 수 있다. <개정 2026.2.19>\n⑦ 제3자대상정보전송자는 제3자전송요구에 따라 개인정보를 전송하는 경우에는 중계전문기관을 통하여 전송해야 한다. 이 경우 제3자대상정보전송자는 보건의료전송정보에 대해서는 중계전문기관을 통하여 특수전문기관에만 전송해야 한다. <개정 2026.2.19>\n⑧ 일반수신자는 제3자전송요구에 따라 개인정보를 전송받는 경우 다음 각 호의 어느 하나에 해당하는 행위로 인하여 정보주체의 이익을 침해하거나 전송 처리 체계를 저해하지 않도록 노력해야 한다. <개정 2026.2.19>\n1. 법 제16조제1항을 위반하여 전송 요구 목적과 관련 없는 개인정보를 전송하도록 요구하는 행위\n2. 법 제16조제3항에 따른 서비스 운영을 위하여 필수적인 경우가 아닌데도 전송받은 정보에 대한 제3자 제공 동의를 전송 요구와 동시에 받는 행위\n3. 법 제35조의2제1항ㆍ제2항에 따른 전송 요구 또는 법 제38조제1항에 따른 권리에 대한 대리 행사를 강요하거나 부당하게 유도하는 행위\n4. 법 제35조의3제1항에 따른 개인정보관리 전문기관의 지정을 받지 않고 같은 항 각 호의 업무를 수행하는 행위\n5. 정보주체의 동의 없이 제42조의5제3항에 따른 전송 요구 내용을 변경하여 개인정보를 요구하는 행위\n6. 자기 또는 제3자의 이익을 위하여 특정 정보주체의 이익을 침해하는 행위\n7. 정보주체의 전송 요구를 이유로 개인정보처리자의 전산설비에 지속적ㆍ반복적으로 접근하여 장애를 일으키는 행위\n8. 그 밖에 제1호부터 제7호까지와 유사한 행위로서 정보주체의 이익을 침해하거나 전송 처리 체계를 저해하는 행위\n⑨ 일반전문기관, 특수전문기관 및 일반수신자는 제3자전송요구에 따라 제3자대상정보전송자로부터 개인정보를 전송받는 경우에는 제1호에 따른 정보주체의 접근수단을 제2호의 방식으로 사용ㆍ보관함으로써 보건의료전송정보, 통신전송정보 및 에너지전송정보를 수집해서는 안 된다. <개정 2026.2.19>\n1. 다음 각 목에 따른 정보주체의 접근수단\n가. 「전자서명법」 제2조제3호에 따른 전자서명생성정보 및 같은 조 제6호에 따른 인증서\n나. 제3자대상정보전송자에 등록된 정보주체의 식별자 또는 인증정보\n다. 정보주체의 생체정보\n2. 다음 각 목의 방법을 통하여 정보주체의 이름으로 열람하는 방식\n가. 제1호의 접근수단을 직접 보관하는 방법\n나. 제1호의 접근수단에 접근할 수 있는 권한을 확보하는 방법\n다. 제1호의 접근수단에 대한 지배권, 이용권 또는 접근권 등을 사실상 확보하는 방법\n⑩ 개인정보관리 전문기관 및 일반수신자는 개인정보관리 전문기관 및 일반수신자로서 처리하는 정보와 다른 개인정보처리자로서 처리하는 정보를 분리하여 보관해야 한다. 다만, 특수전문기관(「의료법」 제3조에 따른 의료기관에 한정한다)이 같은 법 제23조의2제1항에 따른 전자의무기록시스템으로 보건의료전송정보를 진료 목적으로 전송받는 경우로서 같은 법 제23조제2항에 따라 전자의무기록을 안전하게 관리ㆍ보존하는 경우에는 분리 보관을 하지 않을 수 있다. <개정 2026.2.19>\n⑪ 정보전송자, 개인정보관리 전문기관 및 일반수신자는 다음 각 호의 본인전송정보, 보건의료전송정보, 통신전송정보, 에너지전송정보 및 자율전송정보(이하 \"전송요구대상정보\"라 한다) 전송 내역을 3년간 보관해야 한다. 다만, 제3자대상정보전송자의 경우 중계전문기관이 대신 보관할 수 있다. <개정 2026.2.19>\n1. 제42조의5제3항 각 호의 사항\n2. 정보주체의 전송 요구에 따른 정보 송수신 기록\n3. 전송 요구의 철회, 거절 및 전송 중단 내역 및 사유\n⑫ 일반전문기관 및 특수전문기관은 제11항에 따른 전송요구대상정보 전송 내역을 제15조의3제4항 각 호의 어느 하나에 해당하는 방법으로 연 1회 이상 정보주체에게 알려야 한다. 다만, 정보주체가 통지에 대한 거부의사를 표시한 경우에는 통지를 생략할 수 있다. <개정 2026.2.19>\n⑬ 보호위원회 및 관계 중앙행정기관의 장은 예산의 범위에서 정보전송자에 대하여 개인정보의 전송에 필요한 시설 및 기술의 구축ㆍ운영 비용 등 전송 요구의 이행에 필요한 비용을 지원할 수 있다. <개정 2026.2.19>\n제42조의6(개인정보 전송의 기한 및 방법 등)","kind":"D"},{"id":"D:42-7","label":"영 제42조의7","title":"전송 요구 시 적용이 배제되는 법률의 규정","chapter":"제6장 정보주체의 권리 보장","deleted":false,"text":"1. 「신용정보의 이용 및 보호에 관한 법률」 제32조\n2. 「금융실명거래 및 비밀보장에 관한 법률」 제4조\n3. 법 제17조 및 제18조\n4. 「여신전문금융업법」 제54조의5\n5. 「온라인투자연계금융업 및 이용자 보호에 관한 법률」 제33조제4항\n6. 「외국환거래법」 제21조\n7. 「의료법」 제21조제2항\n8. 「약사법」 제30조제3항\n9. 「생명윤리 및 안전에 관한 법률」 제52조제2항\n10. 「상속세 및 증여세법」 제85조제2항\n11. 「국제조세조정에 관한 법률」 제57조\n12. 「지능형전력망의 구축 및 이용촉진에 관한 법률」 제23조제3항\n제42조의7(전송 요구 시 적용이 배제되는 법률의 규정) 법 제35조의2제4항제3호에서 \"대통령령으로 정하는 법률의 규정\"이란 다음 각 호의 규정을 말한다.","kind":"D"},{"id":"D:42-8","label":"영 제42조의8","title":"전송 요구의 거절 및 전송 중단 등","chapter":"제6장 정보주체의 권리 보장","deleted":false,"text":"① 법 제35조의2제6항에서 \"정보주체의 본인 여부가 확인되지 아니하는 경우 등 대통령령으로 정하는 경우\"란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2026.2.19>\n1. 법 제22조의2제1항에 따른 법정대리인 동의 여부가 확인되지 않는 경우\n2. 법 제35조제4항에 따른 열람의 제한 또는 거절 사유에 해당하는 경우\n3. 법 제35조의2제1항 및 제2항에 따른 전송요구대상정보의 전송이 제3자의 권리나 정당한 이익을 침해하는 경우\n4. 법 제38조제1항에 따른 대리인 여부가 확인되지 않는 경우\n5. 제42조의5제1항 및 제3항에 따른 전송 요구 사항이 특정되지 않는 경우\n6. 정보주체의 본인 여부가 확인되지 않는 경우\n7. 정보주체의 인증정보를 탈취하는 등 부당한 방법에 의한 전송 요구임을 알게 된 경우\n8. 정보주체 본인, 일반전문기관, 특수전문기관 또는 일반수신자가 아닌 자에게 전송해 줄 것을 요구하는 경우\n9. 개인정보가 범죄에 악용되는 등 부정한 방법으로 사용되어 정보주체의 이익을 명백히 침해하는 경우\n10. 정보주체가 동일한 개인정보에 대하여 정당한 사유 없이 과도하게 반복적으로 전송을 요구하여 업무에 지장을 초래하는 경우\n11. 정보주체가 제3자의 기망이나 협박 때문에 전송 요구를 한 것으로 의심될 만한 정황이 확인되는 등 전송 요구를 거절하거나 전송을 중단할 합리적 사유가 있는 경우\n② 정보전송자는 제1항 각 호의 어느 하나에 해당하는 사유로 정보주체의 전송 요구를 거절하거나 전송을 중단한 경우에는 지체 없이 해당 사실 및 그 사유를 정보주체에게 통지해야 한다. 다만, 정보주체가 개인정보관리 전문기관 또는 일반수신자를 통하여 전송 요구를 하는 경우에는 해당 개인정보관리 전문기관 또는 일반수신자를 통하여 통지할 수 있다.\n제42조의8(전송 요구의 거절 및 전송 중단 등)","kind":"D"},{"id":"D:42-9","label":"영 제42조의9","title":"개인정보관리 전문기관의 업무 등","chapter":"제6장 정보주체의 권리 보장","deleted":false,"text":"① 개인정보관리 전문기관은 다음 각 호와 같이 구분한다.\n1. 중계전문기관: 법 제35조의3제1항제1호 및 제2호에 따른 업무로서 개인정보 전송 중계에 필요한 기능을 제공하고 관련 시스템을 운영하는 업무 및 정보전송자의 전송을 지원하는 업무(이하 \"중계업무\"라 한다)를 수행하는 자\n2. 일반전문기관: 법 제35조의3제1항제3호에 따른 업무로서 통합조회, 맞춤형 서비스, 연구, 교육 등을 위하여 정보전송자로부터 전송받은 개인정보(보건의료전송정보는 제외한다)를 관리ㆍ분석하는 업무를 수행하는 자\n3. 특수전문기관: 법 제35조의3제1항제3호에 따른 업무로서 통합조회, 맞춤형 서비스, 연구, 교육 등을 위하여 정보전송자로부터 전송받은 보건의료전송정보를 관리ㆍ분석하는 업무를 수행하는 자\n② 중계전문기관은 일반전문기관, 특수전문기관 및 일반수신자 업무를 함께 수행해서는 안 된다.\n③ 중계전문기관은 중계업무를 수행하기 위하여 필요한 경우에는 「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 제23조의5제1항에 따른 연계정보를 처리할 수 있다.\n④ 보호위원회 또는 관계 중앙행정기관의 장은 예산의 범위에서 중계전문기관의 운영에 필요한 비용을 지원할 수 있다.\n제42조의9(개인정보관리 전문기관의 업무 등)","kind":"D"},{"id":"D:42-10","label":"영 제42조의10","title":"개인정보관리 전문기관의 지정 신청 등","chapter":"제6장 정보주체의 권리 보장","deleted":false,"text":"① 법 제35조의3제1항에 따라 개인정보관리 전문기관으로 지정받으려는 자는 제2항에 따른 지정권자에게 다음 각 호의 서류를 제출하여 지정을 신청해야 한다. 이 경우 개인정보관리 전문기관으로 지정받으려는 자는 개인정보전송지원플랫폼을 통하여 제출할 수 있다.\n1. 지정신청서\n2. 정관 또는 규약(법 제2조제6호가목에 해당하는 공공기관에 대해서는 적용하지 않는다)\n3. 사업계획서\n4. 개인정보 관리 계획서\n5. 최근 3년간의 재무제표(법 제2조제6호가목에 해당하는 공공기관에 대해서는 적용하지 않는다)\n6. 법 제35조의3제2항에 따른 지정요건을 갖추었음을 증명할 수 있는 서류\n② 법 제35조의3제1항에 따라 개인정보관리 전문기관을 지정할 수 있는 자(이하 \"지정권자\"라 한다)는 다음 각 호와 같다.\n1. 중계전문기관: 보호위원회 또는 중계전문기관이 전송받으려는 정보와 관련된 관계 중앙행정기관의 장. 다만, 보건의료전송정보에 관한 중계전문기관의 경우에는 보건복지부장관으로 한다.\n2. 일반전문기관: 보호위원회 또는 일반전문기관이 전송받으려는 정보와 관련된 관계 중앙행정기관의 장\n3. 특수전문기관: 보건복지부장관\n③ 제1항에 따른 지정 신청을 받은 지정권자는 「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 법인 등기사항증명서(개인정보관리 전문기관으로 지정받으려는 자가 법인인 경우에 한정한다)를 확인해야 한다.\n④ 개인정보관리 전문기관으로 지정받으려는 자는 제1항에 따른 지정 신청을 하기 전에 지정권자에게 제42조의11에 따른 지정요건 세부기준을 갖추었는지에 대한 예비심사를 신청할 수 있다.\n제42조의10(개인정보관리 전문기관의 지정 신청 등)","kind":"D"},{"id":"D:42-11","label":"영 제42조의11","title":"개인정보관리 전문기관의 지정요건 세부기준","chapter":"제6장 정보주체의 권리 보장","deleted":false,"text":"① 법 제35조의3제2항에 따른 개인정보관리 전문기관의 지정요건별 세부기준은 다음 각 호와 같다.\n1. 다음 각 목의 기술수준 및 전문성을 모두 갖출 것\n가. 정보주체의 권리와 이익 등을 증대하고 정보주체와의 이해상충을 방지하기 위한 사업계획이 타당하고 건전할 것\n나. 개인정보관리 전문기관 업무를 위한 개인정보 관리 계획이 적정할 것\n다. 개인정보관리 전문기관 업무를 효과적으로 수행하기 위하여 보호위원회가 정하여 고시하는 설비 및 기술을 갖추고 있을 것\n2. 다음 각 목의 안전성 확보조치 수준을 모두 갖출 것\n가. 법 제29조에 따른 안전조치의무를 이행하기 위한 요건을 갖출 것\n나. 개인정보관리 전문기관을 안전하게 운영하기 위하여 보호위원회가 정하여 고시하는 보호체계를 적정하게 갖출 것\n3. 다음 각 목의 재정능력을 모두 갖출 것(법 제2조제6호가목에 해당하는 공공기관에 대해서는 적용하지 않는다)\n가. 재무구조가 건전하고 안전성이 있을 것\n나. 다음의 구분에 따른 자본금[법인의 경우에는 납입자본금(비영리법인의 경우에는 기본재산)을 말하고, 법인이 아닌 단체의 경우에는 해당 단체가 보유하는 자산의 가액을 말한다. 이하 이 목에서 같다]을 갖출 것\n1) 중계전문기관: 자본금 10억원 이상\n2) 일반전문기관 및 특수전문기관: 자본금 1억원 이상\n다. 손해배상책임의 이행을 위한 보험 또는 공제에 가입하거나 준비금을 적립할 것(법 제39조의7제2항 각 호의 어느 하나에 해당하는 자에 대해서는 적용하지 않는다). 이 경우 보험ㆍ공제의 최저가입금액 또는 준비금의 최소적립금액의 기준은 별표 1의2와 같다.\n② 제1항에도 불구하고 다음 각 호의 어느 하나에 해당하는 기관ㆍ법인 또는 단체가 개인정보관리 전문기관으로 지정받으려는 경우 지정권자는 보호위원회에 요청(보호위원회가 지정권자인 경우는 제외한다)하여 보호위원회의 심의ㆍ의결을 거친 후 제1항 각 호에 따른 지정요건 세부기준 중 일부 또는 전부에 대한 심사 없이 해당 지정요건 세부기준을 갖춘 것으로 처리할 수 있다. 다만, 제1항 각 호에 따른 지정요건 세부기준 전부에 대한 심사를 생략할 수 있는 경우는 제1호 및 제2호의 기관ㆍ법인 또는 단체가 개인정보관리 전문기관으로 지정받으려는 경우에 한정한다.\n1. 「의료법」 제3조에 따른 의료기관(보건의료전송정보를 전송받는 경우에 한정한다)\n2. 중앙행정기관 또는 지방자치단체\n3. 제2호 외의 공공기관\n제42조의11(개인정보관리 전문기관의 지정요건 세부기준)","kind":"D"},{"id":"D:42-12","label":"영 제42조의12","title":"개인정보관리 전문기관의 지정 등","chapter":"제6장 정보주체의 권리 보장","deleted":false,"text":"① 지정권자는 제42조의10제1항에 따라 지정을 신청한 자가 제42조의11에 따른 지정요건 세부기준을 갖추었다고 인정하는 경우에는 그 자를 개인정보관리 전문기관으로 지정할 수 있다. 이 경우 지정권자는 제42조의10제1항에 따라 지정을 신청한 자가 지정요건 세부기준의 일부를 충족하지 못한 경우에는 일정 기간 내에 그 기준을 충족할 것을 조건으로 지정할 수 있고, 지정 후 그 조건의 이행 여부를 확인해야 한다.\n② 개인정보관리 전문기관은 다음 각 호의 사항(보호위원회가 정하여 고시하는 경미한 내용은 제외한다)을 변경하려는 경우 미리 지정권자의 승인을 받아야 한다.\n1. 사업계획서(전송받으려는 정보의 추가 또는 변경을 포함한다)\n2. 개인정보 관리 계획서\n③ 개인정보관리 전문기관 지정의 유효기간은 3년으로 한다.\n④ 지정권자는 개인정보관리 전문기관이 제3항에 따른 지정 유효기간의 연장을 신청하면 제42조의11에 따른 지정요건 세부기준에 적합하다고 인정하는 경우에는 개인정보관리 전문기관으로 재지정할 수 있다.\n⑤ 지정권자(보호위원회는 제외한다)는 다음 각 호의 결정을 하려면 보호위원회와 미리 협의해야 한다.\n1. 제1항에 따른 지정 및 제4항에 따른 재지정(중계전문기관에 한정한다)\n2. 제2항에 따른 변경 승인(일반전문기관 및 특수전문기관의 경우에는 전송요구대상정보와 관련되는 경우에 한정한다)\n⑥ 지정권자(제1호의 경우에는 보호위원회를 제외한다)는 제1항에 따른 지정, 제2항에 따른 변경 승인 및 제4항에 따른 재지정을 한 경우에는 그에 관한 다음 각 호의 조치를 해야 한다.\n1. 보호위원회에 통지\n2. 관보에 공고하거나 지정권자의 홈페이지에 게시(변경 승인의 경우는 제외한다)\n⑦ 중계전문기관은 중계업무의 일부 또는 전부를 중지 또는 폐지하려는 경우에는 중지 또는 폐지 예정일의 6개월 전까지 지정권자에게 통보해야 한다. 이 경우 지정권자는 해당 중계전문기관에게 다음 각 호의 어느 하나에 해당하는 조치를 하도록 명할 수 있다.\n1. 해당 중계전문기관이 보유하고 있는 개인정보의 파기(다른 법령에 따라 보존해야 하는 경우는 제외한다)\n2. 수행 중인 업무의 다른 중계전문기관으로의 이전\n3. 업무 중지ㆍ폐지 예정 사실의 다음 각 목의 자에 대한 통지\n가. 해당 중계전문기관이 보유하고 있는 개인정보의 정보주체\n나. 해당 중계전문기관에 정보를 전송하는 정보전송자\n다. 해당 중계전문기관으로부터 정보를 전송받는 일반전문기관, 특수전문기관 및 일반수신자\n⑧ 일반전문기관 및 특수전문기관은 개인정보 전송 관련 업무의 일부 또는 전부를 중지 또는 폐지하려는 경우에는 그 사실을 미리 중계전문기관에 통지하고 개인정보전송지원플랫폼에 등재해야 한다.\n제42조의12(개인정보관리 전문기관의 지정 등)","kind":"D"},{"id":"D:42-13","label":"영 제42조의13","title":"개인정보관리 전문기관의 금지행위","chapter":"제6장 정보주체의 권리 보장","deleted":false,"text":"제42조의13(개인정보관리 전문기관의 금지행위) 법 제35조의3제3항제2호에서 \"대통령령으로 정하는 행위\"란 별표 1의3에 따른 행위를 말한다.","kind":"D"},{"id":"D:42-14","label":"영 제42조의14","title":"개인정보관리 전문기관의 지정취소 등","chapter":"제6장 정보주체의 권리 보장","deleted":false,"text":"① 지정권자는 법 제35조의3제4항에 따라 개인정보관리 전문기관이 제42조의12제1항 후단에 따른 조건을 이행하지 않은 경우에는 개인정보관리 전문기관의 지정을 취소할 수 있다.\n② 지정권자(보호위원회는 제외한다)는 개인정보관리 전문기관의 지정을 취소하려면 보호위원회와 미리 협의해야 한다.\n③ 지정권자(제1호의 경우에는 보호위원회를 제외한다)는 개인정보관리 전문기관의 지정을 취소한 경우에는 그에 관한 다음 각 호의 조치를 해야 한다.\n1. 보호위원회에 통지\n2. 관보에 공고하거나 지정권자의 홈페이지에 게시\n제42조의14(개인정보관리 전문기관의 지정취소 등)","kind":"D"},{"id":"D:42-15","label":"영 제42조의15","title":"개인정보 전송 요구에 대한 보호위원회의 관리ㆍ감독","chapter":"제6장 정보주체의 권리 보장","deleted":false,"text":"① 보호위원회는 법 제35조의4제1항에 따라 정보전송자 현황을 관리ㆍ감독하기 위하여 개인정보처리자에게 정보전송자 여부 확인에 필요한 자료의 제출을 요구할 수 있다.\n② 보호위원회는 본인전송요구 및 제3자전송요구에 대한 정보전송자의 이행 여부, 개인정보관리 전문기관의 지정요건 충족 여부 및 일반수신자의 시설ㆍ기술 기준 충족 여부 등에 관한 사항을 관리ㆍ감독하기 위하여 정보전송자, 개인정보관리 전문기관 및 일반수신자에게 다음 각 호의 구분에 따른 자료의 제출을 요구할 수 있으며, 자료 제출을 요구받은 자는 특별한 사정이 없으면 그 요구에 따라야 한다. <개정 2026.2.19>\n1. 정보전송자: 제42조의6제11항에 따른 개인정보 전송 내역에 관한 자료\n2. 개인정보관리 전문기관: 다음 각 목의 자료\n가. 제1호의 자료\n나. 개인정보의 처리 및 관리에 관한 자료\n다. 전송 요구 방법에 관한 자료(일반전문기관 및 특수전문기관에 한정한다)\n라. 개인정보관리 전문기관의 지정요건을 충족하고 있음을 증명할 수 있는 자료\n3. 일반수신자: 다음 각 목의 자료\n가. 제1호 및 제2호나목의 자료\n나. 전송 요구 방법에 관한 자료\n다. 제42조의3제1항에 따른 시설 및 기술을 갖추었음을 증명할 수 있는 자료\n제42조의15(개인정보 전송 요구에 대한 보호위원회의 관리ㆍ감독)","kind":"D"},{"id":"D:42-16","label":"영 제42조의16","title":"개인정보전송지원플랫폼의 구축 및 운영 등","chapter":"제6장 정보주체의 권리 보장","deleted":false,"text":"① 보호위원회는 제3자전송요구와 관련하여 개인정보의 안전하고 효율적인 전송을 위하여 필요한 경우에는 제3자대상정보전송자, 개인정보관리 전문기관 및 일반수신자가 개인정보전송지원플랫폼에 등재하게 해야 한다. <개정 2026.2.19>\n② 제1항에 따라 개인정보전송지원플랫폼에 등재된 제3자대상정보전송자, 일반전문기관, 특수전문기관 및 일반수신자는 제3자전송요구에 따라 개인정보를 전송하거나 전송받는 경우 중계전문기관을 통하여 개인정보전송플랫폼에 다음 각 호의 자료를 제출해야 한다. <개정 2026.2.19>\n1. 제42조의6제11항에 따른 개인정보 전송 내역\n2. 전송받은 정보의 제3자 제공 동의 내역(제3자대상정보전송자는 제외한다)\n③ 보호위원회는 개인정보 전송 이력의 효율적 관리를 위하여 필요한 경우에는 다른 법령에 따라 개인정보 전송을 지원하는 정보시스템을 운영하는 자에게 개인정보전송지원플랫폼과 연계하여 정보주체의 전송 요구 내역 등을 제공할 것을 요청할 수 있다.\n제42조의16(개인정보전송지원플랫폼의 구축 및 운영 등)","kind":"D"},{"id":"D:43","label":"영 제43조","title":"개인정보의 정정ㆍ삭제 등","chapter":"제6장 정보주체의 권리 보장","deleted":false,"text":"① 정보주체는 법 제36조제1항에 따라 개인정보처리자에게 그 개인정보의 정정 또는 삭제를 요구하려면 개인정보처리자가 마련한 방법과 절차에 따라 요구하여야 한다. 이 경우 개인정보처리자가 개인정보의 정정 또는 삭제 요구 방법과 절차를 마련할 때에는 제41조제2항을 준용하되, \"열람\"은 \"정정 또는 삭제\"로 본다. <개정 2017.10.17>\n② 다른 개인정보처리자로부터 개인정보를 제공받아 개인정보파일을 처리하는 개인정보처리자는 법 제36조제1항에 따른 개인정보의 정정 또는 삭제 요구를 받으면 그 요구에 따라 해당 개인정보를 정정ㆍ삭제하거나 그 개인정보 정정ㆍ삭제에 관한 요구 사항을 해당 개인정보를 제공한 기관의 장에게 지체 없이 알리고 그 처리 결과에 따라 필요한 조치를 하여야 한다. <개정 2017.10.17>\n③ 개인정보처리자는 제1항과 제2항에 따른 개인정보 정정ㆍ삭제 요구를 받은 날부터 10일 이내에 법 제36조제2항에 따라 해당 개인정보의 정정ㆍ삭제 등의 조치를 한 경우에는 그 조치를 한 사실을, 법 제36조제1항 단서에 해당하여 삭제 요구에 따르지 아니한 경우에는 그 사실 및 이유와 이의제기방법을 보호위원회가 정하여 고시하는 개인정보 정정ㆍ삭제 결과 통지서로 해당 정보주체에게 알려야 한다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2017.10.17, 2020.8.4>\n제43조(개인정보의 정정ㆍ삭제 등)","kind":"D"},{"id":"D:44","label":"영 제44조","title":"개인정보의 처리정지 등","chapter":"제6장 정보주체의 권리 보장","deleted":false,"text":"① 정보주체는 법 제37조제1항에 따라 개인정보처리자에게 자신의 개인정보 처리의 정지를 요구하려면 개인정보처리자가 마련한 방법과 절차에 따라 요구하여야 한다. 이 경우 개인정보처리자가 개인정보의 처리 정지 요구 방법과 절차를 마련할 때에는 제41조제2항을 준용하되, \"열람\"은 \"처리 정지\"로 본다. <개정 2017.10.17>\n② 개인정보처리자는 제1항에 따른 개인정보 처리정지 요구를 받은 날부터 10일 이내에 법 제37조제2항 본문에 따라 해당 개인정보의 처리정지 조치를 한 경우에는 그 조치를 한 사실을, 같은 항 단서에 해당하여 처리정지 요구에 따르지 않은 경우에는 그 사실 및 이유와 이의제기방법을 보호위원회가 정하여 고시하는 개인정보 처리정지 요구에 대한 결과 통지서로 해당 정보주체에게 알려야 한다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2017.10.17, 2020.8.4>\n제44조(개인정보의 처리정지 등)","kind":"D"},{"id":"D:44-2","label":"영 제44조의2","title":"자동화된 결정에 대한 거부 및 설명 등 요구의 방법 및 절차","chapter":"제6장 정보주체의 권리 보장","deleted":false,"text":"① 정보주체는 법 제37조의2제1항에 따른 자동화된 결정(이하 \"자동화된 결정\"이라 한다)에 대해 같은 항 본문에 따라 거부하는 경우에는 개인정보처리자가 마련하여 제44조의4제1항제5호에 따라 공개하는 방법과 절차에 따라야 한다.\n② 정보주체는 법 제37조의2제2항에 따라 자동화된 결정에 대해 개인정보처리자에게 다음 각 호의 설명 또는 검토를 요구할 수 있다. 이 경우 정보주체의 설명 또는 검토 요구는 개인정보처리자가 마련하여 제44조의4제1항제5호에 따라 공개하는 방법과 절차에 따라야 한다.\n1. 해당 자동화된 결정의 기준 및 처리 과정 등에 대한 설명\n2. 정보주체가 개인정보 추가 등의 의견을 제출하여 개인정보처리자가 해당 의견을 자동화된 결정에 반영할 수 있는지에 대한 검토\n③ 제1항 및 제2항에 따른 정보주체의 자동화된 결정에 대한 거부, 설명 및 검토 요구(이하 \"거부ㆍ설명등요구\"라 한다)의 방법과 절차를 개인정보처리자가 마련하는 경우 준수해야 할 사항에 관하여는 제41조제2항을 준용한다. 이 경우 \"열람 요구\"는 \"거부ㆍ설명등요구\"로 본다.\n제44조의2(자동화된 결정에 대한 거부 및 설명 등 요구의 방법 및 절차)","kind":"D"},{"id":"D:44-3","label":"영 제44조의3","title":"거부ㆍ설명등요구에 따른 조치","chapter":"제6장 정보주체의 권리 보장","deleted":false,"text":"① 개인정보처리자는 정보주체가 제44조의2제1항에 따라 자동화된 결정에 대해 거부하는 경우에는 정당한 사유가 없으면 다음 각 호의 어느 하나에 해당하는 조치를 하고 그 결과를 정보주체에게 알려야 한다.\n1. 해당 자동화된 결정을 적용하지 않는 조치\n2. 인적 개입에 의한 재처리\n② 개인정보처리자는 정보주체가 제44조의2제2항에 따라 자동화된 결정에 대해 같은 항 제1호에 따른 설명을 요구하는 경우 정당한 사유가 없으면 다음 각 호의 사항을 포함한 간결하고 의미있는 설명을 정보주체에게 제공해야 한다. 다만, 개인정보처리자는 해당 자동화된 결정이 정보주체의 권리 또는 의무에 중대한 영향을 미치지 않는 경우에는 정보주체에게 제44조의4제1항제2호 및 제3호의 사항을 알릴 수 있다.\n1. 해당 자동화된 결정의 결과\n2. 해당 자동화된 결정에 사용된 주요 개인정보의 유형\n3. 제2호에 따른 개인정보의 유형이 자동화된 결정에 미친 영향 등 자동화된 결정의 주요 기준\n4. 해당 자동화된 결정에 사용된 주요 개인정보의 처리 과정 등 자동화된 결정이 이루어지는 절차\n③ 개인정보처리자는 정보주체가 제44조의2제2항에 따라 같은 항 제2호에 따른 검토를 요구하는 경우에는 정당한 사유가 없으면 정보주체가 제출한 의견의 반영 여부를 검토하고 정보주체에게 반영 여부 및 반영 결과를 알려야 한다.\n④ 개인정보처리자는 다른 사람의 생명ㆍ신체ㆍ재산과 그 밖의 이익을 부당하게 침해할 우려가 있는 등 정당한 사유가 있어 법 제38조제5항에 따라 거부ㆍ설명등요구를 거절하는 경우에는 그 사유를 정보주체에게 지체 없이 서면등의 방법으로 알려야 한다.\n⑤ 개인정보처리자는 제1항부터 제3항까지의 규정에 따라 정보주체의 거부ㆍ설명등요구에 따른 조치를 하는 경우에는 정보주체의 거부ㆍ설명등요구를 받은 날부터 30일 이내에 서면등의 방법으로 해야 한다. 다만, 30일 이내에 처리하기 어려운 정당한 사유가 있는 경우에는 정보주체에게 그 사유를 알리고 2회에 한정하여 각각 30일의 범위에서 그 기간을 연장할 수 있다.\n⑥ 제1항부터 제5항까지의 규정에 따른 정보주체의 거부ㆍ설명등요구에 따른 조치에 관한 세부 사항은 보호위원회가 정하여 고시한다.\n제44조의3(거부ㆍ설명등요구에 따른 조치)","kind":"D"},{"id":"D:44-4","label":"영 제44조의4","title":"자동화된 결정의 기준과 절차 등의 공개","chapter":"제6장 정보주체의 권리 보장","deleted":false,"text":"① 개인정보처리자는 법 제37조의2제4항에 따라 다음 각 호의 사항을 정보주체가 쉽게 확인할 수 있도록 인터넷 홈페이지 등을 통해 공개해야 한다. 다만, 인터넷 홈페이지 등을 운영하지 않거나 지속적으로 알려야 할 필요가 없는 경우에는 미리 서면등의 방법으로 정보주체에게 알릴 수 있다.\n1. 자동화된 결정이 이루어진다는 사실과 그 목적 및 대상이 되는 정보주체의 범위\n2. 자동화된 결정에 사용되는 주요 개인정보의 유형과 자동화된 결정의 관계\n3. 자동화된 결정 과정에서의 고려사항 및 주요 개인정보가 처리되는 절차\n4. 자동화된 결정 과정에서 민감정보 또는 14세 미만 아동의 개인정보를 처리하는 경우 그 목적 및 처리하는 개인정보의 구체적인 항목\n5. 자동화된 결정에 대하여 정보주체가 거부ㆍ설명등요구를 할 수 있다는 사실과 그 방법 및 절차\n② 개인정보처리자는 제1항 각 호의 사항을 공개할 때에는 정보주체가 해당 내용을 쉽게 알 수 있도록 표준화ㆍ체계화된 용어를 사용해야 하며, 정보주체가 쉽게 이해할 수 있도록 동영상ㆍ그림ㆍ도표 등 시각적인 방법 등을 활용할 수 있다.\n제44조의4(자동화된 결정의 기준과 절차 등의 공개)","kind":"D"},{"id":"D:45","label":"영 제45조","title":"대리인의 범위 등","chapter":"제6장 정보주체의 권리 보장","deleted":false,"text":"① 법 제38조에 따라 정보주체를 대리할 수 있는 자는 다음 각 호와 같다.\n1. 정보주체의 법정대리인\n2. 정보주체로부터 위임을 받은 자\n② 제1항에 따른 대리인이 법 제38조에 따라 정보주체를 대리할 때에는 개인정보처리자에게 보호위원회가 정하여 고시하는 정보주체의 위임장을 제출하여야 한다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.8.4>\n제45조(대리인의 범위 등)","kind":"D"},{"id":"D:46","label":"영 제46조","title":"정보주체 또는 대리인의 확인","chapter":"제6장 정보주체의 권리 보장","deleted":false,"text":"① 개인정보처리자는 제41조제1항에 따른 열람, 제43조제1항에 따른 정정ㆍ삭제, 법 제35조의2에 따른 전송, 법 제37조제1항에 따른 처리정지 또는 동의 철회 등의 요구(이하 이 조, 제47조 및 제48조에서 \"열람등요구\"라 한다)를 받았을 때에는 열람등요구를 한 사람이 본인이거나 정당한 대리인인지를 확인하여야 한다. <개정 2020.8.4, 2023.9.12, 2025.2.25>\n② 공공기관인 개인정보처리자가 「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 제1항에 따른 확인을 할 수 있는 경우에는 행정정보의 공동이용을 통하여 확인하여야 한다. 다만, 해당 공공기관이 행정정보의 공동이용을 할 수 없거나 정보주체가 확인에 동의하지 아니하는 경우에는 그러하지 아니하다.\n③ 보호위원회 및 관계 중앙행정기관의 장은 법 제35조의2에 따른 개인정보의 전송 요구와 관련하여 제1항에 따른 개인정보처리자의 본인 또는 대리인 여부 확인을 지원하기 위하여 필요한 경우에는 「주민등록법」 제30조제1항에 따른 주민등록전산정보자료 및 「가족관계의 등록 등에 관한 법률」 제11조제6항에 따른 등록전산정보자료를 관계 기관에 요청할 수 있다. <신설 2025.2.25>\n제46조(정보주체 또는 대리인의 확인)","kind":"D"},{"id":"D:47","label":"영 제47조","title":"수수료 등의 금액 등","chapter":"제6장 정보주체의 권리 보장","deleted":false,"text":"① 법 제38조제3항에 따른 수수료와 우송료의 금액은 열람등요구에 필요한 실비의 범위에서 해당 개인정보처리자가 정하는 바에 따른다. 다만, 개인정보처리자가 지방자치단체인 경우에는 그 지방자치단체의 조례로 정하는 바에 따르고, 법 제38조제3항 단서에 따른 수수료는 전송요구대상정보의 특성 및 필요 설비의 구축ㆍ운영 비용 등을 고려하여 보호위원회가 정하여 고시하는 기준에 따라 산정해야 한다. <개정 2025.2.25>\n② 개인정보처리자는 열람등요구를 하게 된 사유가 그 개인정보처리자에게 있는 경우에는 수수료와 우송료를 청구해서는 아니 된다.\n③ 법 제38조제3항에 따른 수수료 또는 우송료는 다음 각 호의 구분에 따른 방법으로 낸다. 다만, 국회, 법원, 헌법재판소, 중앙선거관리위원회, 중앙행정기관 및 그 소속 기관(이하 이 조에서 \"국가기관\"이라 한다) 또는 지방자치단체인 개인정보처리자는 「전자금융거래법」 제2조제11호에 따른 전자지급수단 또는 「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 제2조제1항제10호에 따른 통신과금서비스를 이용하여 수수료 또는 우송료를 내게 할 수 있다. <개정 2023.9.12>\n1. 국가기관인 개인정보처리자에게 내는 경우: 수입인지\n2. 지방자치단체인 개인정보처리자에게 내는 경우: 수입증지\n3. 국가기관 및 지방자치단체 외의 개인정보처리자에게 내는 경우: 해당 개인정보처리자가 정하는 방법\n④ 제3자대상정보전송자는 일반전문기관, 특수전문기관 및 일반수신자가 제42조의5제4항 전단에 따라 정보주체를 대신하여 제3자전송요구를 하는 경우에는 일반전문기관, 특수전문기관 및 일반수신자에게 법 제38조제3항 단서에 따른 수수료를 청구할 수 있다. <신설 2025.2.25, 2026.2.19>\n제47조(수수료 등의 금액 등)","kind":"D"},{"id":"D:48","label":"영 제48조","title":"열람 요구 지원시스템의 구축 등","chapter":"제6장 정보주체의 권리 보장","deleted":false,"text":"① 개인정보처리자는 열람등요구 및 그에 대한 통지를 갈음하여 해당 업무를 전자적으로 처리할 수 있도록 시스템을 구축ㆍ운영하거나 그 밖의 절차를 정하여 해당 업무를 처리할 수 있다.\n② 보호위원회는 개인정보처리자 중 공공기관이 보유하고 있는 개인정보에 관한 열람등요구 및 그에 대한 통지에 관한 공공기관의 업무 수행을 효율적으로 지원하기 위하여 시스템을 구축ㆍ운영할 수 있다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.8.4>\n제48조(열람 요구 지원시스템의 구축 등)","kind":"D"},{"id":"D:48-2","label":"영 제48조의2","title":"","chapter":"제6장의2 삭제","deleted":true,"text":"제48조의2 삭제 <2023.9.12>","kind":"D"},{"id":"D:48-3","label":"영 제48조의3","title":"","chapter":"제6장의2 삭제","deleted":true,"text":"제48조의3 삭제 <2023.9.12>","kind":"D"},{"id":"D:48-4","label":"영 제48조의4","title":"","chapter":"제6장의2 삭제","deleted":true,"text":"제48조의4 삭제 <2023.9.12>","kind":"D"},{"id":"D:48-5","label":"영 제48조의5","title":"","chapter":"제6장의2 삭제","deleted":true,"text":"제48조의5 삭제 <2023.9.12>","kind":"D"},{"id":"D:48-6","label":"영 제48조의6","title":"","chapter":"제6장의2 삭제","deleted":true,"text":"제48조의6 삭제 <2023.9.12>","kind":"D"},{"id":"D:48-7","label":"영 제48조의7","title":"손해배상책임의 이행을 위한 보험 등 가입 대상자의 범위 및 기준 등","chapter":"제6장의2 삭제","deleted":false,"text":"① 법 제39조의7제1항에서 \"대통령령으로 정하는 기준에 해당하는 자\"란 다음 각 호의 요건을 모두 갖춘 자(이하 \"가입대상개인정보처리자\"라 한다)를 말한다. <개정 2024.3.12>\n1. 전년도(법인의 경우에는 직전 사업연도를 말한다)의 매출액등이 10억원 이상일 것\n2. 전년도 말 기준 직전 3개월간 그 개인정보가 저장ㆍ관리되고 있는 정보주체(제15조의3제2항제2호에 해당하는 정보주체는 제외한다. 이하 이 조에서 같다)의 수가 일일평균 1만명 이상일 것. 다만, 해당 연도에 영업의 전부 또는 일부의 양수, 분할ㆍ합병 등으로 개인정보를 이전받은 경우에는 이전받은 시점을 기준으로 정보주체의 수가 1만명 이상일 것\n② 법 제39조의7제2항제1호에서 \"대통령령으로 정하는 공공기관, 비영리법인 및 단체\"란 다음 각 호의 기관을 말한다. <신설 2024.3.12, 2026.9.10>\n1. 공공기관. 다만, 제2조제2호부터 제5호까지에 해당하는 공공기관으로서 제32조제3항 각 호에 해당하는 공공기관은 제외한다.\n2. 「공익법인의 설립ㆍ운영에 관한 법률」 제2조에 따른 공익법인\n3. 「비영리민간단체 지원법」 제4조에 따라 등록한 단체\n③ 법 제39조의7제2항제2호에서 \"대통령령으로 정하는 자\"란 다음 각 호의 요건을 모두 갖춘 자를 말한다. <개정 2024.3.12, 2026.9.10>\n1. 「소상공인기본법」 제2조제1항에 따른 소상공인으로부터 개인정보가 유출등이 되지 않도록 개인정보의 저장ㆍ관리 업무를 위탁받은 자\n2. 제1호에 따라 위탁받은 업무에 대하여 법 제39조 및 제39조의2에 따른 손해배상책임의 이행을 보장하는 보험 또는 공제에 가입하거나 준비금을 적립하는 등 필요한 조치를 한 자\n④ 가입대상개인정보처리자가 보험 또는 공제에 가입하거나 준비금을 적립할 경우 최저가입금액(준비금을 적립하는 경우 최소적립금액을 말한다. 이하 이 조에서 같다)의 기준은 별표 1의4와 같다. 다만, 가입대상개인정보처리자가 보험 또는 공제 가입과 준비금 적립을 병행하는 경우에는 보험 또는 공제 가입금액과 준비금 적립금액을 합산한 금액이 별표 1의4에서 정한 최저가입금액의 기준 이상이어야 한다. <개정 2023.9.12, 2024.3.12>\n제48조의7(손해배상책임의 이행을 위한 보험 등 가입 대상자의 범위 및 기준 등)","kind":"D"},{"id":"D:48-8","label":"영 제48조의8","title":"","chapter":"제6장의2 삭제","deleted":true,"text":"제48조의8 삭제 <2023.9.12>","kind":"D"},{"id":"D:48-9","label":"영 제48조의9","title":"","chapter":"제6장의2 삭제","deleted":true,"text":"제48조의9 삭제 <2023.9.12>","kind":"D"},{"id":"D:48-10","label":"영 제48조의10","title":"","chapter":"제6장의2 삭제","deleted":true,"text":"제48조의10 삭제 <2023.9.12>","kind":"D"},{"id":"D:48-11","label":"영 제48조의11","title":"","chapter":"제6장의2 삭제","deleted":true,"text":"제48조의11 삭제 <2023.9.12>","kind":"D"},{"id":"D:48-12","label":"영 제48조의12","title":"","chapter":"제6장의2 삭제","deleted":true,"text":"제48조의12 삭제 <2023.9.12>","kind":"D"},{"id":"D:48-13","label":"영 제48조의13","title":"","chapter":"제6장의2 삭제","deleted":true,"text":"제48조의13 삭제 <2023.9.12>","kind":"D"},{"id":"D:48-14","label":"영 제48조의14","title":"당연직위원","chapter":"제7장 개인정보 분쟁조정","deleted":false,"text":"제48조의14(당연직위원) 분쟁조정위원회의 당연직위원은 보호위원회의 고위공무원단에 속하는 일반직공무원으로서 개인정보 보호에 관한 업무를 담당하는 사람 중 보호위원회 위원장이 지명하는 사람으로 한다. <개정 2017.7.26, 2020.8.4>","kind":"D"},{"id":"D:49","label":"영 제49조","title":"조정부의 구성 및 운영","chapter":"제7장 개인정보 분쟁조정","deleted":false,"text":"① 법 제40조제6항에 따른 조정부(이하 \"조정부\"라 한다)는 분쟁조정위원회 위원장이 지명하는 5명 이내의 위원으로 구성하되, 그 중 1명은 변호사 자격이 있는 위원으로 한다. <개정 2016.7.22>\n② 분쟁조정위원회 위원장은 조정부의 회의를 소집한다.\n③ 분쟁조정위원회의 위원장은 조정부의 회의를 소집하려면 회의 날짜ㆍ시간ㆍ장소 및 안건을 정하여 회의 개최 7일 전까지 조정부의 각 위원에게 알려야 한다. 다만, 긴급한 사정이 있는 경우에는 그러하지 아니하다.\n④ 조정부의 장은 조정부 위원 중에서 호선(互選)한다.\n⑤ 제1항부터 제4항까지의 규정에서 정한 사항 외에 조정부의 구성 및 운영 등에 필요한 사항은 분쟁조정위원회의 의결을 거쳐 분쟁조정위원회의 위원장이 정한다.\n제49조(조정부의 구성 및 운영)","kind":"D"},{"id":"D:49-2","label":"영 제49조의2","title":"분쟁조정 전문위원회","chapter":"제7장 개인정보 분쟁조정","deleted":false,"text":"① 분쟁조정위원회는 개인정보에 관한 분쟁의 조정과 관련된 사항의 전문적인 검토를 위하여 분쟁조정위원회에 분야별 전문위원회(이하 \"분쟁조정전문위원회\"라 한다)를 둘 수 있다.\n② 분쟁조정전문위원회는 위원장 1명을 포함한 10명 이내의 위원으로 구성한다.\n③ 분쟁조정전문위원회 위원은 다음 각 호의 사람 중에서 분쟁조정위원회 위원장이 임명하거나 위촉하고, 분쟁조정전문위원회 위원장은 분쟁조정전문위원회 위원 중에서 분쟁조정위원회 위원장이 지명한다.\n1. 분쟁조정위원회 위원\n2. 개인정보 보호 관련 업무를 담당하는 중앙행정기관의 관계 공무원\n3. 대학에서 개인정보 보호 분야의 조교수 이상으로 재직하고 있거나 재직하였던 사람\n4. 공인된 연구기관에서 개인정보 보호 관련 분야의 5년 이상 연구경력이 있는 사람\n5. 변호사 자격을 취득한 후 개인정보 보호 관련 분야에 1년 이상 경력이 있는 사람\n6. 그 밖에 개인정보 보호 및 분쟁의 조정과 관련하여 전문지식과 경험이 풍부한 사람\n④ 제1항부터 제3항까지에서 규정한 사항 외에 분쟁조정전문위원회의 구성 및 운영 등에 필요한 사항은 분쟁조정위원회의 의결을 거쳐 분쟁조정위원회 위원장이 정한다.\n제49조의2(분쟁조정 전문위원회)","kind":"D"},{"id":"D:50","label":"영 제50조","title":"사무기구","chapter":"제7장 개인정보 분쟁조정","deleted":false,"text":"① 법 제40조제8항에 따른 분쟁조정 접수 및 사실 확인 등 분쟁조정에 필요한 사무처리는 보호위원회의 사무기구가 수행한다. <개정 2020.8.4>\n② 사무기구는 분쟁조정 접수ㆍ진행 및 당사자 통지 등 분쟁조정에 필요한 사무를 전자적으로 처리하기 위하여 분쟁조정업무시스템을 구축하여 운영할 수 있다. <신설 2020.8.4>\n제50조(사무기구)","kind":"D"},{"id":"D:51","label":"영 제51조","title":"분쟁조정위원회 등의 운영","chapter":"제7장 개인정보 분쟁조정","deleted":false,"text":"① 분쟁조정위원회 위원장은 분쟁조정위원회의 회의를 소집하며, 그 의장이 된다.\n② 분쟁조정위원회 위원장이 분쟁조정위원회의 회의를 소집하려면 회의 날짜ㆍ시간ㆍ장소 및 안건을 정하여 회의 개최 7일 전까지 각 위원에게 알려야 한다. 다만, 긴급한 사정이 있는 경우에는 그러하지 아니하다.\n③ 분쟁조정위원회 및 조정부의 회의는 공개하지 아니한다. 다만, 필요하다고 인정되는 경우에는 분쟁조정위원회의 의결로 당사자 또는 이해관계인에게 방청을 하게 할 수 있다.\n제51조(분쟁조정위원회 등의 운영)","kind":"D"},{"id":"D:51-2","label":"영 제51조의2","title":"조정 불응 의사의 통지","chapter":"제7장 개인정보 분쟁조정","deleted":false,"text":"제51조의2(조정 불응 의사의 통지) 개인정보처리자는 법 제43조제3항에 따른 특별한 사유가 있어 분쟁조정에 응하지 않으려는 경우에는 법 제43조제2항에 따른 분쟁조정의 통지를 받은 날부터 10일 이내에 그 사유를 명시하여 분쟁조정 불응 의사를 분쟁조정위원회에 알려야 한다.","kind":"D"},{"id":"D:51-3","label":"영 제51조의3","title":"분쟁조정위원회의 사무기구 및 조사ㆍ열람 등","chapter":"제7장 개인정보 분쟁조정","deleted":false,"text":"① 법 제45조제2항 전단에서 \"대통령령으로 정하는 사무기구\"란 제50조제1항에 따라 분쟁조정에 필요한 사무처리를 담당하는 보호위원회의 사무기구를 말한다.\n② 분쟁조정위원회는 법 제45조제2항에 따라 조사ㆍ열람을 하려는 경우에는 그 7일 전까지 조사ㆍ열람 대상자에게 다음 각 호의 사항을 문서로 알려야 한다. 다만, 조사ㆍ열람 목적을 침해할 우려가 있는 경우에는 미리 알리지 않을 수 있다.\n1. 조사ㆍ열람의 목적\n2. 조사ㆍ열람의 기간과 장소\n3. 조사ㆍ열람을 하는 사람의 직위와 성명\n4. 조사ㆍ열람의 범위와 내용\n5. 정당한 사유가 있는 경우 조사ㆍ열람을 거부할 수 있다는 사실\n6. 정당한 사유 없이 조사ㆍ열람을 거부ㆍ방해 또는 기피할 경우 불이익의 내용\n7. 그 밖에 분쟁조정을 위한 조사ㆍ열람에 필요한 사항\n③ 분쟁조정위원회는 법 제45조제2항에 따라 조사ㆍ열람을 할 때에는 분쟁당사자 또는 분쟁당사자가 지명하는 자가 입회하거나 의견을 진술하도록 요청할 수 있다.\n④ 분쟁조정위원회는 법 제45조제5항에 따라 의견을 들으려면 회의 일시 및 장소를 정하여 회의 개최 15일 전까지 분쟁당사자 또는 참고인에게 출석을 통지해야 한다.\n제51조의3(분쟁조정위원회의 사무기구 및 조사ㆍ열람 등)","kind":"D"},{"id":"D:51-4","label":"영 제51조의4","title":"조정안에 대한 거부 의사 통지 등","chapter":"제7장 개인정보 분쟁조정","deleted":false,"text":"① 분쟁조정위원회는 법 제47조제2항에 따라 당사자에게 조정안을 제시할 때에는 같은 조 제3항에 따라 조정안을 제시받은 날부터 15일 이내에 수락 여부를 알리지 않으면 조정을 수락한 것으로 본다는 사실을 알려야 한다.\n② 법 제47조제2항에 따라 조정안을 제시받은 당사자는 조정안을 거부하려는 경우에는 조정안을 제시받은 날부터 15일 이내에 인편, 등기우편 또는 전자우편의 방법으로 그 의사를 분쟁조정위원회에 알려야 한다.\n제51조의4(조정안에 대한 거부 의사 통지 등)","kind":"D"},{"id":"D:52","label":"영 제52조","title":"집단분쟁조정의 신청 대상","chapter":"제7장 개인정보 분쟁조정","deleted":false,"text":"1. 피해 또는 권리침해를 입은 정보주체의 수가 다음 각 목의 정보주체를 제외하고 50명 이상일 것\n가. 개인정보처리자와 분쟁해결이나 피해보상에 관한 합의가 이루어진 정보주체\n나. 같은 사안으로 다른 법령에 따라 설치된 분쟁조정기구에서 분쟁조정 절차가 진행 중인 정보주체\n다. 해당 개인정보 침해로 인한 피해에 대하여 법원에 소(訴)를 제기한 정보주체\n2. 사건의 중요한 쟁점이 사실상 또는 법률상 공통될 것\n제52조(집단분쟁조정의 신청 대상) 법 제49조제1항에서 \"대통령령으로 정하는 사건\"이란 다음 각 호의 요건을 모두 갖춘 사건을 말한다.","kind":"D"},{"id":"D:53","label":"영 제53조","title":"집단분쟁조정 절차의 개시","chapter":"제7장 개인정보 분쟁조정","deleted":false,"text":"① 법 제49조제2항 후단에서 \"대통령령으로 정하는 기간\"이란 14일 이상의 기간을 말한다.\n② 법 제49조제2항 후단에 따른 집단분쟁조정 절차의 개시 공고는 분쟁조정위원회의 인터넷 홈페이지 또는 「신문 등의 진흥에 관한 법률」에 따라 전국을 보급지역으로 하는 일반일간신문에 게재하는 방법으로 한다. <개정 2015.12.30>\n제53조(집단분쟁조정 절차의 개시)","kind":"D"},{"id":"D:54","label":"영 제54조","title":"집단분쟁조정 절차에 대한 참가 신청","chapter":"제7장 개인정보 분쟁조정","deleted":false,"text":"① 법 제49조에 따른 집단분쟁조정(이하 \"집단분쟁조정\"이라 한다)의 당사자가 아닌 정보주체 또는 개인정보처리자가 법 제49조제3항에 따라 추가로 집단분쟁조정의 당사자로 참가하려면 법 제49조제2항 후단의 공고기간에 문서로 참가 신청을 하여야 한다.\n② 분쟁조정위원회는 제1항에 따라 집단분쟁조정 당사자 참가 신청을 받으면 제1항의 신청기간이 끝난 후 10일 이내에 참가 인정 여부를 문서로 알려야 한다.\n제54조(집단분쟁조정 절차에 대한 참가 신청)","kind":"D"},{"id":"D:55","label":"영 제55조","title":"집단분쟁조정 절차의 진행","chapter":"제7장 개인정보 분쟁조정","deleted":false,"text":"① 집단분쟁조정 절차가 개시된 후 제52조제1호가목부터 다목까지의 어느 하나에 해당하게 된 정보주체는 당사자에서 제외된다.\n② 분쟁조정위원회는 제52조 각 호의 요건을 모두 갖춘 사건에 대하여 집단분쟁조정 절차가 개시되고 나면 그 후 집단분쟁조정 당사자 중 일부가 같은 조 제1호가목부터 다목까지의 어느 하나에 해당하게 되어 같은 조 제1호의 요건을 갖추지 못하게 되더라도 집단분쟁조정 절차를 중지하지 아니한다.\n제55조(집단분쟁조정 절차의 진행)","kind":"D"},{"id":"D:56","label":"영 제56조","title":"수당과 여비","chapter":"제7장 개인정보 분쟁조정","deleted":false,"text":"제56조(수당과 여비) 분쟁조정위원회, 조정부 및 분쟁조정전문위원회의 회의에 출석한 위원 등에게는 예산의 범위에서 수당과 여비를 지급할 수 있다. 다만, 공무원인 위원이 그 소관 업무와 직접적으로 관련되어 출석하는 경우에는 그러하지 아니하다. <개정 2023.9.12>","kind":"D"},{"id":"D:57","label":"영 제57조","title":"분쟁조정 세칙","chapter":"제7장 개인정보 분쟁조정","deleted":false,"text":"제57조(분쟁조정 세칙) 법 및 이 영에서 규정한 사항 외에 분쟁의 조정절차 및 조정업무의 처리 등 분쟁조정위원회의 운영 및 집단분쟁조정을 위하여 필요한 사항은 분쟁조정위원회의 의결을 거쳐 분쟁조정위원회의 위원장이 정한다. <개정 2023.9.12>","kind":"D"},{"id":"D:58","label":"영 제58조","title":"개선권고 및 징계권고","chapter":"제8장 보칙 및 벌칙","deleted":false,"text":"① 법 제61조제2항ㆍ제3항에 따른 개선권고 및 법 제65조제2항ㆍ제3항에 따른 징계권고는 권고 사항, 권고 사유 및 조치 결과 회신기간 등을 분명하게 밝힌 문서로 하여야 한다.\n② 제1항에 따른 권고를 받은 자는 권고 내용에 따라 필요한 조치를 하고, 그 결과를 보호위원회 또는 관계 중앙행정기관의 장에게 문서로 통보해야 한다. 다만, 권고 내용대로 조치하기 곤란하다고 판단되는 특별한 사정이 있는 경우에는 그 사유를 통보해야 한다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.8.4>\n제58조(개선권고 및 징계권고)","kind":"D"},{"id":"D:59","label":"영 제59조","title":"침해 사실의 신고 등","chapter":"제8장 보칙 및 벌칙","deleted":false,"text":"제59조(침해 사실의 신고 등) 보호위원회는 법 제62조제2항에 따라 개인정보에 관한 권리 또는 이익 침해 사실 신고의 접수ㆍ처리 등에 관한 업무를 효율적으로 수행하기 위한 전문기관으로 한국인터넷진흥원을 지정한다. <개정 2013.3.23, 2014.11.19, 2017.7.26, 2020.8.4>","kind":"D"},{"id":"D:60","label":"영 제60조","title":"자료제출 요구 및 검사","chapter":"제8장 보칙 및 벌칙","deleted":false,"text":"① 법 제63조제1항제3호에서 \"대통령령으로 정하는 경우\"란 개인정보 유출 등 정보주체의 개인정보에 관한 권리 또는 이익을 침해하는 사건ㆍ사고 등이 발생하였거나 발생할 가능성이 상당히 있는 경우를 말한다.\n② 보호위원회는 법 제63조제1항 및 제2항에 따른 자료의 제출 요구 및 검사 등을 위하여 한국인터넷진흥원의 장에게 기술적인 사항을 자문하는 등 필요한 지원을 요청할 수 있다. <개정 2013.3.23, 2014.11.19, 2015.12.30, 2017.7.26, 2020.8.4>\n③ 삭제 <2023.9.12>\n④ 삭제 <2023.9.12>\n⑤ 삭제 <2023.9.12>\n⑥ 삭제 <2023.9.12>\n⑦ 삭제 <2023.9.12>\n제60조(자료제출 요구 및 검사)","kind":"D"},{"id":"D:60-2","label":"영 제60조의2","title":"과징금의 산정기준 등","chapter":"제8장 보칙 및 벌칙","deleted":false,"text":"① 법 제64조의2제1항 각 호 외의 부분 본문 및 같은 조 제2항 각 호 외의 부분 본문에 따른 전체 매출액은 다음 각 호의 구분에 따른 금액으로 한다. <개정 2026.5.19, 2026.9.10>\n1. 위반행위가 있었던 사업연도(이하 이 항에서 \"해당사업연도\"라 한다)의 첫날 현재 사업을 개시한 지 3년 이상인 경우: 다음 각 목의 금액 중 큰 금액\n가. 해당사업연도의 직전 사업연도(이하 이 항에서 \"직전사업연도\"라 한다)의 매출액\n나. 해당사업연도 직전 3개 사업연도의 연평균 매출액\n2. 해당사업연도의 첫날 현재 사업을 개시한 지 1년 이상 3년 미만인 경우: 다음 각 목의 금액 중 큰 금액\n가. 직전사업연도의 매출액\n나. 사업개시일부터 직전사업연도 말일까지의 매출액을 연평균 매출액으로 환산한 금액\n3. 직전사업연도에 사업을 개시한 경우로서 해당사업연도의 첫날 현재 사업을 개시한 지 1년 미만인 경우: 사업개시일부터 직전사업연도 말일까지의 매출액을 연매출액으로 환산한 금액\n4. 해당사업연도에 사업을 개시한 경우: 사업개시일부터 위반행위일까지의 매출액을 연매출액으로 환산한 금액\n② 법 제64조의2제1항 각 호 외의 부분 단서 및 같은 조 제2항 각 호 외의 부분 단서에서 \"대통령령으로 정하는 경우\"란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2026.9.10>\n1. 다음 각 목의 어느 하나에 해당하는 사유로 영업실적이 없는 경우\n가. 영업을 개시하지 않은 경우\n나. 영업을 중단한 경우\n다. 수익사업을 영위하지 않는 등 가목 및 나목에 준하는 경우\n2. 재해 등으로 인하여 매출액 산정자료가 소멸되거나 훼손되는 등 객관적인 매출액의 산정이 곤란한 경우\n③ 법 제64조의2제3항에 따른 위반행위와 관련이 없는 매출액은 제1항에 따른 전체 매출액 중 다음 각 호의 어느 하나에 해당하는 금액으로 한다. <개정 2026.9.10>\n1. 개인정보의 처리와 관련이 없는 재화 또는 서비스의 매출액\n2. 제4항에 따라 제출받은 자료 등에 근거하여 보호위원회가 위반행위로 인하여 직접 또는 간접적으로 영향을 받는 재화 또는 서비스의 매출액이 아닌 것으로 인정하는 매출액\n④ 보호위원회는 제1항부터 제3항까지의 규정에 따른 매출액 산정 등을 위하여 재무제표 등의 자료가 필요한 경우 20일 이내의 기간을 정하여 해당 개인정보처리자에게 관련 자료의 제출을 요청할 수 있다.\n⑤ 법 제64조의2제6항 본문에서 \"개인정보 보호를 위하여 예산ㆍ인력ㆍ설비ㆍ장치 등을 투자하고 운영하는 등 대통령령으로 정하는 사유가 있는 경우\"란 개인정보 보호를 위하여 예산ㆍ인력ㆍ설비ㆍ장치 등을 투자하고 운영하는 경우로서 다음 각 호의 사항을 고려하여 보호위원회가 정하여 고시하는 기준을 충족하는 경우를 말한다. <신설 2026.9.10>\n1. 개인정보 보호를 위하여 예산ㆍ인력ㆍ설비ㆍ장치 등에 투자한 규모ㆍ비율 및 그 투자의 지속성\n2. 법 제30조의3에 따른 사업주 또는 대표자의 책임 이행 정도\n3. 개인정보 보호책임자의 역할, 조직 및 인력 구성 등 개인정보 보호 체계 운영 내용 및 수준\n4. 그 밖에 개인정보 안전성 확보 조치에 관한 추가적인 노력\n⑥ 법 제64조의2제7항제4호에서 \"대통령령으로 정하는 사유가 있는 경우\"란 해당 개인정보처리자가 위반행위를 시정하고 보호위원회가 정하여 고시하는 기준에 해당되는 경우를 말한다. <개정 2026.9.10>\n⑦ 법 제64조의2제8항에 따른 과징금의 산정기준과 산정절차는 별표 1의5와 같다. <개정 2026.9.10>\n제60조의2(과징금의 산정기준 등)","kind":"D"},{"id":"D:60-3","label":"영 제60조의3","title":"과징금의 부과 및 납부","chapter":"제8장 보칙 및 벌칙","deleted":false,"text":"① 보호위원회는 법 제64조의2제1항 또는 제2항에 따라 과징금을 부과하려는 경우에는 해당 위반행위를 조사ㆍ확인한 후 위반사실ㆍ부과금액ㆍ이의 제기 방법 및 이의 제기 기간 등을 서면으로 명시하여 과징금 부과대상자에게 통지해야 한다. <개정 2026.9.10>\n② 제1항에 따라 통지를 받은 자는 통지를 받은 날부터 30일 이내에 보호위원회가 지정하는 금융기관에 과징금을 납부해야 한다.\n③ 제2항에 따라 과징금의 납부를 받은 금융기관은 과징금을 납부한 자에게 영수증을 발급해야 한다.\n④ 금융기관이 제2항에 따라 과징금을 수납한 때에는 지체 없이 그 사실을 보호위원회에 통보해야 한다.\n제60조의3(과징금의 부과 및 납부)","kind":"D"},{"id":"D:60-4","label":"영 제60조의4","title":"과징금의 납부기한 연기 및 분할 납부","chapter":"제8장 보칙 및 벌칙","deleted":false,"text":"① 보호위원회는 법 제64조의2제1항 또는 제2항에 따른 과징금의 납부기한을 「행정기본법」 제29조 및 같은 법 시행령 제7조에 따라 연기하는 경우에는 원래 납부기한의 다음 날부터 2년을 초과할 수 없다. <개정 2026.9.10>\n② 보호위원회는 법 제64조의2제1항 또는 제2항에 따른 과징금을 「행정기본법」 제29조 및 같은 법 시행령 제7조에 따라 분할 납부하게 하는 경우에는 각 분할된 납부기한 간의 간격은 6개월을 초과할 수 없으며, 분할 횟수는 6회를 초과할 수 없다. <개정 2026.9.10>\n③ 제1항 및 제2항에서 규정한 사항 외에 과징금 납부기한 연기 및 분할 납부 신청 등에 필요한 사항은 보호위원회가 정하여 고시한다.\n제60조의4(과징금의 납부기한 연기 및 분할 납부)","kind":"D"},{"id":"D:60-5","label":"영 제60조의5","title":"환급가산금의 이자율","chapter":"제8장 보칙 및 벌칙","deleted":false,"text":"제60조의5(환급가산금의 이자율) 법 제64조의2제11항에서 \"대통령령으로 정하는 이자율\"이란 「국세기본법 시행령」 제43조의3제2항 본문에 따른 이자율을 말한다. <개정 2026.9.10>","kind":"D"},{"id":"D:61","label":"영 제61조","title":"결과의 공표","chapter":"제8장 보칙 및 벌칙","deleted":false,"text":"① 보호위원회는 법 제66조제1항에 따라 다음 각 호의 사항을 보호위원회 인터넷 홈페이지 등에 게재하여 공표할 수 있다.\n1. 위반행위의 내용\n2. 위반행위를 한 자\n3. 개선권고, 시정조치 명령, 과징금의 부과, 고발, 징계권고, 과태료 부과의 내용 및 결과\n② 보호위원회는 법 제66조제2항에 따라 개선권고, 시정조치 명령, 과징금의 부과, 고발, 징계권고 및 과태료 부과처분 등(이하 이 조에서 \"처분등\"이라 한다)을 받은 자에게 다음 각 호의 사항을 공표할 것을 명할 수 있다. 이 경우 공표의 내용ㆍ횟수, 매체와 지면의 크기 등을 정하여 명해야 하며, 처분등을 받은 자와 공표 문안 등에 관하여 협의할 수 있다.\n1. 위반행위의 내용\n2. 위반행위를 한 자\n3. 처분등을 받았다는 사실\n③ 보호위원회는 제1항에 따라 공표하려는 경우 또는 제2항에 따라 공표할 것을 명하려는 경우에는 위반행위의 내용 및 정도, 위반 기간 및 횟수, 위반행위로 인하여 발생한 피해의 범위 및 결과 등을 고려해야 한다.\n④ 보호위원회는 공표 또는 공표명령에 대한 심의ㆍ의결 전에 처분등을 받은 자에게 소명자료를 제출하거나 의견을 진술할 수 있는 기회를 주어야 한다.\n제61조(결과의 공표)","kind":"D"},{"id":"D:62","label":"영 제62조","title":"업무의 위탁","chapter":"제8장 보칙 및 벌칙","deleted":false,"text":"① 삭제 <2015.12.30>\n② 보호위원회는 법 제68조제1항에 따라 법 제24조의2제4항에 따른 대체가입수단 제공의 지원에 관한 업무를 다음 각 호의 기관에 위탁할 수 있다. <개정 2013.3.23, 2014.11.19, 2015.12.30, 2017.7.26, 2020.8.4, 2022.7.19>\n1. 「전자정부법」 제72조제1항에 따른 한국지역정보개발원\n2. 한국인터넷진흥원\n3. 대체가입수단의 개발ㆍ제공ㆍ관리 업무를 안전하게 수행할 수 있는 기술적ㆍ재정적 능력과 설비를 보유한 것으로 인정되어 보호위원회가 정하여 고시하는 법인ㆍ기관ㆍ단체\n③ 보호위원회(제10호의 경우 보호위원회 외의 지정권자를 포함한다. 이하 제4항 각 호 외의 부분 및 제5항에서 같다)는 법 제68조제1항에 따라 다음 각 호의 사항에 관한 업무를 제4항에 따른 기관에 위탁할 수 있다. <개정 2013.3.23, 2014.11.19, 2015.12.30, 2017.7.26, 2020.8.4, 2022.7.19, 2023.9.12, 2025.2.25, 2025.9.23, 2026.9.10>\n1. 법 제7조의8제5호에 따른 개인정보 보호를 위한 국제기구와 외국의 개인정보 보호기구와의 교류ㆍ협력\n2. 법 제7조의8제6호에 따른 개인정보 보호에 관한 법령ㆍ정책ㆍ제도ㆍ실태 등의 조사ㆍ연구\n3. 법 제7조의8제7호에 따른 개인정보 보호에 관한 기술개발의 지원ㆍ보급\n4. 법 제11조의2제1항에 따른 개인정보 보호수준 평가 및 같은 조 제2항에 따른 평가 자료의 제출 요청\n5. 법 제13조제1호에 따른 개인정보 보호에 관한 교육ㆍ홍보\n6. 법 제13조제2호에 따른 개인정보 보호와 관련된 기관ㆍ단체의 육성 및 지원\n7. 법 제13조제3호에 따른 개인정보 보호 인증마크의 시행 지원\n8. 법 제13조제4호에 따른 개인정보처리자의 자율적인 규약의 시행 지원\n8의2. 법 제31조제3항제2호에 따른 개인정보 보호책임자 지정ㆍ변경 또는 해제에 관한 신고의 접수 및 처리\n9. 법 제33조제6항에 따른 관계 전문가의 육성 및 영향평가 기준의 개발\n10. 법 제35조제2항에 따른 열람 요구의 접수 및 처리\n10의2. 법 제35조의3에 따른 개인정보관리 전문기관의 지정에 관한 다음 각 목의 사항\n가. 제42조의10제1항에 따른 개인정보관리 전문기관 지정 신청의 접수 및 신청 내용의 확인\n나. 제42조의10제4항에 따른 개인정보관리 전문기관 지정에 관한 예비심사\n다. 제42조의12제1항 후단에 따른 지정 조건의 이행 여부 확인\n10의3. 법 제35조의4제2항에 따른 개인정보전송지원플랫폼의 운영\n11. 법 제63조에 따른 자료제출 요구 및 검사 중 다음 각 목의 사항과 관련된 자료제출 요구 및 검사\n가. 법 제34조제3항 전단에 따른 신고에 대한 기술지원\n나. 법 제62조에 따라 개인정보침해 신고센터에 접수된 신고의 접수ㆍ처리 및 상담\n12. 제36조제2항에 따른 평가기관 지정신청서의 접수 및 같은 조 제6항에 따른 신고 사항의 접수\n④ 보호위원회가 제3항 각 호의 사항에 관한 업무를 위탁할 수 있는 기관은 다음 각 호와 같다. <신설 2022.7.19>\n1. 한국인터넷진흥원\n2. 개인정보 보호 분야에 전문성을 갖춘 것으로 인정되어 보호위원회가 정하여 고시하는 법인ㆍ기관 또는 단체\n⑤ 보호위원회가 제2항부터 제4항까지의 규정에 따라 업무를 위탁하는 경우에는 위탁받는 기관과 위탁업무의 내용을 관보나 보호위원회의 인터넷 홈페이지에 공고해야 한다. <개정 2022.7.19>\n제62조(업무의 위탁)","kind":"D"},{"id":"D:62-2","label":"영 제62조의2","title":"민감정보 및 고유식별정보의 처리","chapter":"제8장 보칙 및 벌칙","deleted":false,"text":"① 보호위원회(제62조제3항에 따라 보호위원회의 권한을 위탁받은 자를 포함한다)는 다음 각 호의 사무를 수행하기 위하여 불가피한 경우 민감정보와 제19조에 따른 주민등록번호, 여권번호, 운전면허의 면허번호 또는 외국인등록번호가 포함된 자료를 처리할 수 있다. <개정 2020.8.4, 2023.9.12>\n1. 법 제7조의9제1항제4호부터 제6호까지의 규정에 따른 사항의 심의ㆍ의결에 관한 사무\n2. 법 제24조의2제4항에 따른 주민등록번호 대체 방법 제공을 위한 시스템 구축 등 제반조치 마련 및 지원에 관한 사무\n3. 삭제<2023.9.12>\n4. 법 제62조제3항에 따른 개인정보침해 신고센터의 업무에 관한 사무\n5. 법 제63조제1항 및 제2항에 따른 자료의 제출 및 검사에 관한 사무\n6. 법 제63조의2에 따른 사전 실태점검에 관한 사무\n7. 법 제64조의2에 따른 과징금의 부과 및 징수에 관한 사무\n② 분쟁조정위원회는 법 제45조, 제47조 및 제49조에 따른 개인정보 분쟁 조정에 관한 사무를 수행하기 위하여 불가피한 경우 민감정보와 제19조에 따른 주민등록번호, 여권번호, 운전면허의 면허번호 또는 외국인등록번호가 포함된 자료를 처리할 수 있다. <개정 2020.8.4, 2023.9.12>\n③ 정보전송자 및 중계전문기관은 법 제35조의2에 따른 개인정보의 전송 요구에 관한 사무를 수행하기 위하여 불가피한 경우 제19조에 따른 주민등록번호, 여권번호, 운전면허의 면허번호 또는 외국인등록번호(정보전송자의 경우에는 보유하고 있는 주민등록번호 등으로 한정한다)가 포함된 자료를 처리(본인 여부 확인을 하는 경우로 한정한다)할 수 있다. <신설 2025.2.25>\n제62조의2(민감정보 및 고유식별정보의 처리)","kind":"D"},{"id":"D:62-3","label":"영 제62조의3","title":"규제의 재검토","chapter":"제8장 보칙 및 벌칙","deleted":false,"text":"① 보호위원회는 다음 각 호의 사항에 대하여 다음 각 호의 기준일을 기준으로 3년마다(매 3년이 되는 해의 기준일과 같은 날 전까지를 말한다) 그 타당성을 검토하여 개선 등의 조치를 해야 한다. <신설 2020.8.4, 2022.3.8, 2023.9.12, 2024.3.12, 2025.2.25, 2026.9.10>\n1. 삭제<2025.2.25>\n2. 제15조의3에 따른 개인정보 이용ㆍ제공내역을 통지해야 하는 자의 범위, 통지해야 하는 정보의 종류 및 통지 주기와 방법: 2023년 9월 15일\n3. 제48조의7에 따른 손해배상책임의 이행을 위한 보험 등 가입 대상자의 범위 및 기준: 2020년 8월 5일\n4. 제29조의3에 따른 개인정보처리자 간 가명정보의 결합: 2024년 1월 1일\n5. 제42조의2부터 제42조의4까지의 규정에 따른 정보전송자 및 전송 정보 등에 관한 사항: 2025년 1월 1일\n6. 제42조의5부터 제42조의8까지의 규정에 따른 개인정보 전송 요구 및 전송 방법에 관한 사항: 2025년 1월 1일\n7. 제42조의9부터 제42조의16까지의 규정에 따른 개인정보관리 전문기관 등에 관한 사항 등: 2025년 1월 1일\n8. 제29조의2에 따른 결합전문기관의 지정 등에 관한 사항: 2026년 1월 1일\n9. 제29조의4에 따른 결합전문기관의 관리ㆍ감독 등에 관한 사항: 2025년 1월 1일\n10. 제32조제2항부터 제4항까지 및 별표 1에 따른 개인정보 보호책임자 지정 대상자의 범위, 개인정보 보호책임자의 지정 구분과 자격 및 개인정보 보호책임자 지정ㆍ변경 또는 해제 신고 절차에 관한 사항: 2027년 1월 1일\n② 보호위원회는 다음 각 호의 사항에 대하여 다음 각 호의 기준일을 기준으로 2년마다(매 2년이 되는 해의 1월 1일 전까지를 말한다) 그 타당성을 검토하여 개선 등의 조치를 해야 한다. <개정 2024.3.12, 2025.2.25, 2026.9.10>\n1. 삭제<2025.2.25>\n2. 제32조제7항에 따른 개인정보 보호책임자의 독립성 보장을 위한 개인정보처리자의 준수 사항: 2025년 1월 1일\n3. 제44조의2부터 제44조의4까지의 규정에 따른 자동화된 결정의 거부ㆍ설명등요구의 절차 및 방법, 자동화된 결정의 거부ㆍ설명등요구에 따른 조치, 자동화된 결정의 기준과 절차 등의 공개: 2025년 1월 1일\n③ 삭제 <2022.3.8>\n제62조의3(규제의 재검토)","kind":"D"},{"id":"D:63","label":"영 제63조","title":"과태료의 부과기준","chapter":"제8장 보칙 및 벌칙","deleted":false,"text":"제63조(과태료의 부과기준) 법 제75조에 따른 과태료의 부과기준은 별표 2와 같다. <개정 2020.8.4, 2023.9.12>","kind":"D"},{"id":"X:정부조직법","kind":"X","label":"정부조직법","title":"","chapter":"","text":""},{"id":"X:고등교육법","kind":"X","label":"고등교육법","title":"","chapter":"","text":""},{"id":"X:국가공무원법","kind":"X","label":"국가공무원법","title":"","chapter":"","text":""},{"id":"X:정당법","kind":"X","label":"정당법","title":"","chapter":"","text":""},{"id":"X:형법","kind":"X","label":"형법","title":"","chapter":"","text":""},{"id":"X:성폭력범죄의 처벌 등에 관한 특례법","kind":"X","label":"성폭력범죄의 처벌 등에 관한 특례법","title":"","chapter":"","text":""},{"id":"X:아동ㆍ청소년의 성보호에 관한 법률","kind":"X","label":"아동ㆍ청소년의 성보호에 관한 법률","title":"","chapter":"","text":""},{"id":"X:군사기지 및 군사시설 보호법","kind":"X","label":"군사기지 및 군사시설 보호법","title":"","chapter":"","text":""},{"id":"X:통합방위법","kind":"X","label":"통합방위법","title":"","chapter":"","text":""},{"id":"X:국세기본법","kind":"X","label":"국세기본법","title":"","chapter":"","text":""},{"id":"X:지방세기본법","kind":"X","label":"지방세기본법","title":"","chapter":"","text":""},{"id":"X:부정경쟁방지 및 영업비밀보호에 관한 법률","kind":"X","label":"부정경쟁방지 및 영업비밀보호에 관한 법률","title":"","chapter":"","text":""},{"id":"X:민사소송법","kind":"X","label":"민사소송법","title":"","chapt title":"","chapter":"","text":""},{"id":"X:국세기본법 시행령","kind":"X","label":"국세기본법 시행령","title":"","chapter":"","text":""},{"id":"P:624225","kind":"P","label":"2024도17852","title":"개인정보보호법위반","court":"대법원","date":"2026.07.16","caseType":"형사","basis":"참조조문","text":"[1] 구 개인정보 보호법상 개인정보의 ‘제3자 제공’의 의미 및 개인정보처리자가 개인정보의 지배ㆍ관리권을 그대로 유지하면서 개인정보처리자의 업무처리와 이익을 위하여 내부적으로 개인정보를 이용하는 것과 구별되는지 여부 / 이는 같은 법 제19조의 ‘개인정보처리자로부터 개인정보를 제공받은 자’가 제공받은 개인정보를 다시 제3자에게 제공하는 경우에도 마찬가지인지 여부 [2] 구 개인정보 보호법 제19조의 ‘개인정보를 제공받은 목적’의 의미 [3] 구 개인정보 보호법 제71조 제2호, 제19조 위반죄의 성립에 관하여 개인정보처리자로부터 개인정보를 제공받은 자가 ‘목적 외의 용도’로 개인정보를 이용했는지 판단하는 방법 [4] 주택재개발정비사업조합 조합임원 선거에 조합장 후보로 등록한 피고인이 선거운동을 목적으로 위 조합으로부터 조합원들의 개인정보가 담긴 선거인 명부를 제공받은 다음, 선거사무원에게 전화로 선거운동을 하도록 선거인 명부 중 일부를 제공함으로써 개인정보처리자로부터 제공받은 개인정보를 제공받은 목적 외의 부정한 선거운동을 위한 용도로 제3자에게 제공했다는 공소사실로 기소된 사안에서, 피고인이 선거사무원에게 선거운동을 목적으로 선거인명부를 전달한 행위만으로 제공받은 목적 외의 용도로 이를 이용했다고 보기 어려움에도, 이와 달리 본 원심판결에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=624225"},{"id":"P:623017","kind":"P","label":"2026도2358","title":"개인정보보호법위반","court":"대법원","date":"2026.06.05","caseType":"형사","basis":"참조조문","text":"[1] 불고불리 원칙과 법원의 심판 범위 / 공소장에 기재된 공소사실과 적용법조가 서로 다른 구성요건이나 법률적 평가를 전제로 하는 등 조화롭지 않고 부정합성을 드러내어 유무죄 판단에 영향을 미치거나 피고인의 방어권 행사에 지장을 초래할 정도에 이른 경우, 법원이 취할 조치 [2] 검사가 피고인을 구 개인정보 보호법 위반으로 기소하면서, 공소장에 피고인이 甲의 동의가 없다는 사정을 알면서도 이동통신 가입자에 대한 개인정보 처리 업무를 담당하던 乙에게 ‘통신사 조회시스템을 이용하여 甲의 전화번호를 조회한 뒤 알려달라.’고 요구하여 乙로부터 그 정보를 제공받았다는 공소사실을 기재하고, ‘같은 법 제71조 제1호, 제17조 제1항 제2호 등’을 적용법조로 기재한 사안에서, 공소장 기재 내용에 관한 서로 다른 해석이 가능하여 공소제기의 취지가 명료하지 않고 그로 인해 피고인의 방어권 행사에도 지장이 초래될 수 있는 경우이므로, 원심은 소송관계를 명료하게 하기 위해 검사에게 석명을 구하고, 그에 따라 공소제기의 취지가 명료해지면 거기에 맞추어 범죄구성요건 충족 여부를 심리한 후 유무죄를 판단했어야 한다는 이유로, 이러한 조치를 취하지 않은 채 공소사실을 유죄로 인정한 원심판단에 법리오해 및 심리미진의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=623017"},{"id":"P:619455","kind":"P","label":"2026도477","title":"도박공간개설·개인정보보호법위반","court":"대법원","date":"2026.04.16","caseType":"형사","basis":"참조조문","text":"[1] 개인정보 보호법 제2조 제5호에서 정한 ‘개인정보처리자’의 개념 및 해킹 등 부정한 방법을 통하여 개인정보를 취득하거나 불법적으로 유통되고 있는 개인정보를 취득한 후 이를 기초로 업무상 개인정보파일을 운용하기 위하여 개인정보를 처리한 경우에도 ‘개인정보처리자’에 해당하는지 여부 [2] 개인정보 보호법 제71조 제2호, 제18조 제1항 위반죄와 같은 법 제71조 제10호, 제59조 제3호 위반죄 사이의 죄수관계","url":"https://www.law.go.kr/precInfoP.do?precSeq=619455"},{"id":"P:618473","kind":"P","label":"2025도10321","title":"개인정보보호법위반[소방서 공무직 채용 면접위원이 개인정보처리자인 소방서의 사용인으로서 양벌규정의 행위자에 해당되는지 여부가 문제 된 사건]","court":"대법원","date":"2026.03.12","caseType":"형사","basis":"참조조문","text":"[1] 구 개인정보 보호법 제71조 제2호, 제18조 제1항 벌칙규정의 적용 대상이 개인정보처리자로 한정되는지 여부 및 같은 법 제74조 제2항 양벌규정에 의하여 개인정보처리자 아닌 행위자도 위 벌칙규정의 적용 대상이 되는지 여부 / ‘법인격 없는 공공기관’이 위 양벌규정에 의하여 처벌되는 개인정보처리자에 해당하는지 여부 및 이때 행위자를 위 양벌규정으로 처벌할 수 있는지 여부 [2] 甲 소방서의 공무직 채용 면접위원인 피고인이 면접절차와 관련하여 제공받은 면접응시자 乙의 개인정보를 개인적으로 보관하였다가 乙의 휴대전화번호로 전화를 걸어 사적인 발언을 함으로써 정보주체의 동의 없이 수집 목적 범위를 초과하여 개인정보를 이용하였다는 구 개인정보 보호법 위반으로 기소된 사안에서, 경기도의 직속기관에 불과하여 법인격이 없는 甲 소방서는 같은 법 제74조 제2항 양벌규정에 의하여 처벌되는 개인정보처리자에 포함되지 않고, 따라서 그 행위자 역시 위 양벌규정에 의하여 처벌할 수 없다는 이유로, 이와 달리 보아 피고인에게 유죄를 인정한 원심판단에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=618473"},{"id":"P:618177","kind":"P","label":"2025도13141","title":"금융실명거래및비밀보장에관한법률위반·개인정보보호법위반[갑이 을을 상대로 제기한 민사소송과 병이 을을 상대로 제기한 민사소송에서 을의 소송대리인이 각각의 사건에서 재판부를 통해 확인한 갑과 병의 은행 거래내역 등을 다른 사건에서 증거자료로 제출한 경우, 금융실명거래 및 비밀보장에 관한 법률 및 개인정보 보호법 위반죄에 대하여 형법 제20조에 따라 위법성이 조각되는지 여부]","court":"대법원","date":"2026.02.26","caseType":"형사","basis":"참조조문","text":"[1] 재판과정에서 소송상 필요한 주장의 증명이나 범죄혐의에 대한 방어권 행사를 위하여 금융거래정보 또는 개인정보가 포함된 소송서류나 증거를 법원에 제출하는 경우, 금융실명거래 및 비밀보장에 관한 법률 및 개인정보 보호법 위반죄에 대하여 형법 제20조에 따라 위법성이 조각될 수 있는지 여부 및 이때 정당행위에 해당하는지 판단하는 방법 [2] 甲이 乙을 상대로 제기한 민사소송과 丙이 乙을 상대로 제기한 민사소송의 소송대리를 맡은 피고인이 제2 민사사건에서 재판부를 통해 확인한 甲의 은행 거래내역을 제출하고, 제1 민사사건에서 丙의 소득금액증명, 재판부를 통해 확인한 丙의 은행 거래내역을 증거자료로 제출하여 업무상 알게 된 개인정보를 누설함과 동시에 법원의 제출명령에 따라 알게 된 거래정보 등을 목적 외의 용도로 이용했다는 공소사실로 기소된 사안에서, 피고인이 甲의 거래내역, 丙의 소득금액증명 및 거래내역을 법원에 제출한 것은 비록 구 금융실명거래 및 비밀보장에 관한 법률 제6조 제1항 위반죄 및 구 개인정보 보호법 제71조 제5호 위반죄의 구성요건에 해당하더라도, 형법 제20조에 따라 위법성이 조각될 소지가 충분하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=618177"},{"id":"P:618195","kind":"P","label":"2024도14998","title":"사기·사전자기록등위작·위작사전자기록등행사·개인정보보호법위반[보험가입 및 고객 관리를 위하여 고객의 개인정보를 수집한 보험설계사가 개인정보처리자에 해당하는지 여부가 문제 된 사건][압수된 증거의 증거능력이 문제 된 사건]","court":"대법원","date":"2026.02.26","caseType":"형사","basis":"참조조문","text":"[1] 어떤 주체가 업무를 목적으로 개인정보파일을 운용하기 위하여 개인정보를 수집, 보유, 이용하는 등 개인정보처리에 해당하는 행위를 실제로 하였다는 사정만으로 당연히 구 개인정보 보호법 제18조 제1항의 수범자인 ‘개인정보처리자’에 해당하는지 여부 / 구 개인정보 보호법상 ‘개인정보처리자’에 해당하는지 판단하는 기준 및 이때 고려하여야 할 사항 [2] 피고인은 甲 보험회사 소속 보험설계사로 위촉되어 활동하던 사람이고, 乙은 당시 피고인을 통해 甲 보험회사의 보험상품에 가입한 사람인데, 피고인이 丙과 공모한 다음 丙이 甲 보험회사 상담원에게 전화하여 마치 乙인 것처럼 행세하면서 피고인이 보험설계사로서 보험 가입 및 고객 관리를 위해 수집한 乙의 생년월일, 주소, 연락처 등을 이용하여 乙이 가입한 보험의 특약 해지, 주 계약 보장내용 변경 등을 신청함으로써 乙의 개인정보를 수집 목적의 범위를 초과하여 이용하였다는 구 개인정보 보호법 위반으로 기소된 사안에서, 피고인이 乙의 개인정보를 수집한 적이 있다는 등의 사정만으로 개인정보처리자라는 전제 아래 피고인의 행위가 같은 법 제71조 제2호, 제18조 제1항 위반죄에 해당한다고 본 원심판단에 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=618195"},{"id":"P:615943","kind":"P","label":"2023도8339","title":"개인정보보호법위반·금융실명거래및비밀보장에관한법률위반","court":"대법원","date":"2026.01.08","caseType":"형사","basis":"참조조문","text":"[1] 임직원, 파견근로자, 시간제근로자 등 개인정보처리자의 지휘ㆍ감독을 받아 개인정보를 처리하는 자인 개인정보취급자가 개인정보처리자의 업무 수행을 위하여 개인정보를 이전받는 경우, 구 개인정보 보호법 제19조에서 정한 ‘개인정보처리자로부터 개인정보를 제공받은 자’에 해당하는지 여부 [2] 구 개인정보 보호법 제19조에서 말하는 ‘개인정보처리자로부터 개인정보를 제공받은 자’의 의미 및 ‘제공받은 목적’의 의미 / 개인정보처리자가 구 개인정보 보호법 제17조, 제18조를 위반하여 개인정보를 제공한 경우, 그 개인정보를 제공받은 자를 같은 법 제19조의 ‘개인정보처리자로부터 개인정보를 제공받은 자’에 해당한다고 보아 그 위반을 이유로 같은 법 제71조 제2호로 처벌할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=615943"},{"id":"P:619543","kind":"P","label":"2025노2686","title":"도박공간개설, 개인정보보호법위반","court":"의정부지방법원","date":"2025.12.19","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619543"},{"id":"P:614041","kind":"P","label":"2024도8121","title":"개인정보보호법위반","court":"대법원","date":"2025.12.11","caseType":"형사","basis":"참조조문","text":"[1] 공공기관이 보유ㆍ관리하고 있는 타인에 관한 개인정보의 공공기관의 정보공개에 관한 법률에 따른 공개에 구 개인정보 보호법 제17조 및 그 위반을 전제로 하는 같은 법 제71조 제1호가 적용되는지 여부 [2] 개인정보의 제3자 제공이 구 개인정보 보호법 제17조 제1항, 제3항의 수집한 목적 범위 내의 제공은 아니나 같은 법 제18조 제2항의 요건에 따른 제공에는 해당하는 경우, 같은 법 제71조 제1호 위반죄로 처벌할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=614041"},{"id":"P:615687","kind":"P","label":"2025모45","title":"수사기관의압수에관한처분취소·변경기각결정에대한재항고","court":"대법원","date":"2025.12.11","caseType":"형사","basis":"판결요지","text":"형사소송법 제106조, 제219조에 따른 증거물 또는 몰수할 것으로 사료하는 물건인 압수 대상에 유체물과 전자정보가 모두 포함되는지 여부 / 독립적 관리가능성, 거래가능성, 경제적 가치에 대한 실질적 지배가능성 등을 갖춘 전자적 증표인 비트코인이 법원 또는 수사기관의 압수 대상에 포함되는지 여부 및 법정 요건을 충족하는 경우 몰수 대상이 될 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=615687"},{"id":"P:613235","kind":"P","label":"2023다311184","title":"손해배상(기)","court":"대법원","date":"2025.12.04","caseType":"민사","basis":"참조조문","text":"[1] 소액사건에 관하여 상고이유로 할 수 있는 ‘대법원의 판례에 상반되는 판단을 한 때’의 요건을 갖추지 않았지만 대법원이 실체법 해석과 적용에 관하여 판단할 수 있는 경우 [2] 개인정보 보호법 제39조의2 제1항의 입법 취지 및 정보주체가 위 조항에 따른 법정손해배상을 청구하기 위하여 부담하는 주장ㆍ증명책임의 내용 [3] 개인정보처리자가 정보주체에게 위자료로 배상할 만한 정신적 손해가 발생하지 아니하였음을 주장ㆍ증명하여 개인정보 보호법 제39조의2 제1항에 따른 법정손해배상책임을 면할 수 있는지 여부 / 정보주체가 개인정보처리자를 상대로 개인정보 보호법 제39조의2 제1항에 따른 법정손해배상청구를 하는 사안에서 정보주체에게 위자료로 배상할 만한 정신적 손해가 발생하지 않았다는 개인정보처리자의 주장을 판단하는 방법","url":"https://www.law.go.kr/precInfoP.do?precSeq=613235"},{"id":"P:612977","kind":"P","label":"2024도19539","title":"개인정보보호법위반","court":"대법원","date":"2025.10.30","caseType":"형사","basis":"참조조문","text":"업무상 알게 된 개인정보의 누설행위 등을 금지ㆍ처벌하는 구 개인정보 보호법 제59조 제2호, 제71조 제5호에서 ‘누설’의 의미 / 개인정보 보호법의 보호법익 및 이때 ‘개인정보자기결정권’의 의미 / 구 개인정보 보호법 제59조 제2호에서 금지하는 개인정보의 누설에 관하여 정보주체의 사전 동의가 있는 경우, 개인정보를 누설한 자를 같은 법 제71조 제5호에 의하여 처벌할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=612977"},{"id":"P:612997","kind":"P","label":"2025도6070","title":"개인정보보호법위반","court":"대법원","date":"2025.09.25","caseType":"형사","basis":"참조조문","text":"구 개인정보 보호법상 허용된 권한 초과 개인정보 유출 금지에도 불구하고 재판 과정에서 소송상 필요한 주장의 증명이나 범죄혐의에 대한 방어권 행사를 위하여 개인정보가 포함된 소송서류나 증거를 법원에 제출하는 경우 및 고소·고발 또는 수사절차에서 범죄혐의 소명이나 방어권 행사를 위하여 개인정보가 포함된 증거자료를 수사기관에 제출하는 경우가 사회상규에 위배되지 않는 행위에 해당하여 형법 제20조에 따라 위법성이 조각될 수 있는지 여부 및 이러한 정당행위에 해당하는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=612997"},{"id":"P:609473","kind":"P","label":"2025두30721","title":"기관경고처분등취소","court":"대법원","date":"2025.09.11","caseType":"일반행정","basis":"참조조문","text":"[1] 사립학교 교원의 임용권자가 소속 교원의 구체적인 행위가 징계사유에 해당하는지에 관하여 충분한 조사를 거친 결과 징계사유에 해당하는 것이 명백한 경우, 관할 교원징계위원회 등에 징계의결을 요구할 의무가 있는지 여부 및 사립학교 교원의 구체적인 행위가 징계사유에 해당한다고 의심할 만한 상당한 이유가 있음에도 임용권자가 충분한 조사를 거치지 않은 채 징계의결을 요구하지 않은 경우, 사립학교법상 징계의결 요구 의무를 위반한 것인지 여부 [2] 사립학교법 제27조에 따라 준용되는 민법 제61조에서 정한 ‘선량한 관리자의 주의’의 의미 및 학교법인의 이사장이 소속 교원의 징계혐의에 대하여 충분한 조사를 거친 결과 그 행위가 징계사유에 해당함이 분명해졌음에도 징계의결을 요구하지 않거나, 사립학교 교원의 구체적인 행위가 징계사유에 해당한다고 의심할 만한 상당한 이유가 있음에도 충분한 조사를 거치지 않은 채 징계의결을 요구하지 않은 경우, 선량한 관리자의 주의의무를 위반한 것인지 여부 [3] 甲 학교법인이 설치ㆍ운영하는 고등학교 교감 乙과 사무직원이 관할 검찰청, 경찰서, 감사원에 전 교장 丙과 교사 丁에 관한 ‘비위사실조사 협조 요청’ 공문을 보내 그 결과를 회신받은 사실에 대하여 丁이 문제를 제기하고 서울특별시교육청에 민원을 제기하자, 서울특별시교육청이 ‘위 행위는 개인정보 보호법, 사립학교법 등을 위반한 비위행위에 해당하고 이를 알았음에","url":"https://www.law.go.kr/precInfoP.do?precSeq=609473"},{"id":"P:615679","kind":"P","label":"2025다209756","title":"손해배상(기)","court":"대법원","date":"2025.09.04","caseType":"민사","basis":"참조조문","text":"개인정보 보호법상 개인정보 누설, 제공 금지 규정에도 불구하고 재판과정에서 소송상 필요한 주장의 증명이나 범죄혐의에 대한 방어권 행사를 위하여 개인정보가 포함된 소송서류나 증거를 법원에 제출하는 경우, 사회상규에 위배되지 않는 행위로서 정당행위에 해당하여 위법성이 조각될 수 있는지 여부 및 이에 해당하는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=615679"},{"id":"P:619545","kind":"P","label":"2025고단1185","title":"도박공간개설, 개인정보보호법위반","court":"의정부지방법원남양주지원","date":"2025.08.27","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619545"},{"id":"P:614495","kind":"P","label":"2024구합70753","title":"과징금부과처분등취소청구의소","court":"서울행정법원","date":"2025.08.14","caseType":"일반행정","basis":"참조조문","text":"인터넷강의 웹사이트를 운영하며 113만 건의 개인정보를 수집·보유하고 있던 甲 주식회사가 크로스 사이트 스크립팅 명령어가 포함된 해커의 게시글에 의하여 직원계정의 세션정보를 탈취당한 뒤 직원 및 회원 약 9만 5천 명의 개인정보를 유출당한 사실에 대하여, 甲 회사가 개인정보 보호법 제29조에 따른 안전조치의무를 다하지 않았다는 이유로 개인정보보호위원회가 甲 회사에 과징금 부과처분 등을 한 사안에서, 甲 회사가 개인정보 보호법에서 정한 안전성 확보조치를 제대로 이행하지 않았고, 그 위반기간은 개인정보처리자가 안전조치의무를 위반한 기간이므로 그에 따라 산정한 과징금 부과처분이 적법하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=614495"},{"id":"P:609539","kind":"P","label":"2024구합70753","title":"과징금부과처분등취소청구의소","court":"서울행정법원","date":"2025.08.14","caseType":"일반행정","basis":"참조조문","text":"인터넷강의 웹사이트를 운영하며 113만 건의 개인정보를 수집·보유하고 있던 甲 주식회사가 크로스 사이트 스크립팅 명령어가 포함된 해커의 게시글에 의하여 직원계정의 세션정보를 탈취당한 뒤 직원 및 회원 약 9만 5천 명의 개인정보를 유출당한 사실에 대하여, 甲 회사가 개인정보 보호법 제29조에 따른 안전조치의무를 다하지 않았다는 이유로 개인정보보호위원회가 甲 회사에 과징금 부과처분 등을 한 사안에서, 甲 회사가 개인정보 보호법에서 정한 안전성 확보조치를 제대로 이행하지 않았고, 그 위반기간은 개인정보처리자가 안전조치의무를 위반한 기간이므로 그에 따라 산정한 과징금 부과처분이 적법하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=609539"},{"id":"P:618495","kind":"P","label":"2024노2575","title":"금융실명거래및비밀보장에관한법률위반·개인정보보호법위반","court":"서울중앙지방법원","date":"2025.07.24","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=618495"},{"id":"P:612065","kind":"P","label":"2023도17590","title":"개인정보보호법위반","court":"대법원","date":"2025.07.18","caseType":"형사","basis":"참조조문","text":"[1] 재판과정에서 소송상 필요한 주장의 증명이나 범죄혐의에 대한 방어권 행사를 위하여 개인정보가 포함된 소송서류나 증거를 법원에 제출하는 경우, 고소ㆍ고발 또는 수사절차에서 범죄혐의의 소명이나 방어권의 행사를 위하여 개인정보가 포함된 증거자료를 수사기관에 제출하는 경우가 사회상규에 위배되지 않는 행위에 해당하여 형법 제20조에 따라 위법성이 조각될 수 있는지 여부 및 이에 해당하는지 판단하는 기준 [2] 피고인이 퇴사한 조합의 조합장을 고발하며 수사기관에 CCTV 영상자료 등 개인정보가 담긴 자료들을 고발장에 첨부하여 함께 제출함으로써 개인정보를 처리하거나 처리하였던 자로서 업무상 알게 된 개인정보를 누설하였다는 내용으로 기소된 사안에서, 피고인의 위 행위가 정당행위에 해당하지 않는다고 본 원심판단에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=612065"},{"id":"P:607791","kind":"P","label":"2024다210554","title":"처리정지[정보주체가 개인정보처리자를 상대로 과학적 연구, 통계, 공익적 기록보존 목적을 위한 개인정보의 가명처리를 정지할 것을 구하는 사건]","court":"대법원","date":"2025.07.18","caseType":"민사","basis":"참조조문","text":"개인정보 보호법 제2조 제1호의2에서 정한 \"가명처리\"가 같은 법 제37조 제1항 제1문에서 처리정지 요구의 대상으로 정한 개인정보 \"처리\"에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=607791"},{"id":"P:607821","kind":"P","label":"2023도3673","title":"개인정보보호법위반[가처분 사건의 채무자가 법원에 입주민들의 개인정보가 기재된 입주자카드를 제출한 사건]","court":"대법원","date":"2025.07.18","caseType":"형사","basis":"참조조문","text":"구 개인정보 보호법상 개인정보 누설, 제공 금지 규정에도 불구하고 재판과정에서 소송상 필요한 주장의 증명이나 범죄혐의에 대한 방어권 행사를 위하여 개인정보가 포함된 소송서류나 증거를 법원에 제출하는 경우, 고소·고발 또는 수사절차에서 범죄혐의의 소명이나 방어권의 행사를 위하여 개인정보가 포함된 증거자료를 수사기관에 제출하는 경우가 사회상규에 위배되지 않는 행위에 해당하여 형법 제20조에 따라 위법성이 조각될 수 있는지 여부 및 이에 해당하는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=607821"},{"id":"P:607211","kind":"P","label":"2023도18539","title":"개인정보보호법위반[어린이집 원장이 어린이집 내에 설치된 CCTV 영상을 시청하여 보육교사의 근무시간 중 휴대전화 사용내역을 파악한 후 이를 징계담당자에게 전달한 사건]","court":"대법원","date":"2025.06.26","caseType":"형사","basis":"참조조문","text":"[1] 구 개인정보 보호법 제18조 제1항에 규정된 개인정보의 ‘이용’의 의미 및 이에 해당하는지 판단하는 방법 [2] 어린이집 원장인 피고인 甲이 어린이집 내부에 설치·관리 중인 폐쇄회로 텔레비전 영상을 시청하여 교사 乙이 근무시간 중 휴대전화를 사용한 사실을 파악한 후 이를 어린이집 사무를 수탁한 법인인 피고인 丙의 보육사업 담당자인 丁에게 乙의 업무지시 불이행 사안으로 전달하여, 개인정보처리자인 피고인 甲은 개인정보를 수집 목적의 범위를 초과하여 이용하였다는 내용으로, 피고인 丙은 사용자인 피고인 甲이 업무에 관하여 위와 같은 위반행위를 하였다는 내용으로 기소된 사안에서, 피고인 甲이 乙의 근무 태도에 관한 정보를 丁에게 전달한 행위 부분만을 분리한 뒤 그 정보가 구 개인정보 보호법상 개인정보에 해당하지 않는다고 본 원심판단에 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=607211"},{"id":"P:607191","kind":"P","label":"2025도3153","title":"부정처사후수뢰·개인정보보호법위반·공무상비밀누설·뇌물공여[검찰수사관과 기업에서 이른바 대관업무를 담당하는 사람이 업무상 알게 된 개인정보를 제공하거나 그 사정을 알면서도 영리 또는 부정한 목적으로 제공받았는지 문제된 사안]","court":"대법원","date":"2025.06.26","caseType":"형사","basis":"참조조문","text":"[1] 구 개인정보 보호법 제59조 제2호 및 제71조 제5호에서 규정한 ‘업무상 알게 된 개인정보’는 개인정보의 수집·처리 외의 일반적인 업무를 주된 내용으로 하면서 그 업무와 밀접한 관련이 있는 부수적 업무로서 개인정보의 수집·처리가 이루어지는 업무와 관련하여 알게 된 개인정보를 포함하는지 여부 / 여기서 업무상 알게 되었다는 것의 의미 및 이에 대한 증명책임의 소재 [2] 검찰수사관인 피고인 甲은 乙 그룹에서 대관업무를 담당하는 피고인 丙에게 공정거래조사부 내부 배치표를 휴대전화로 촬영 후 카카오톡 메신저로 촬영사진 파일을 전송하여 개인정보를 처리하는 자로서 업무상 알게 된 개인정보를 누설하거나 권한 없이 다른 사람이 이용하도록 제공하였다는 내용으로, 피고인 丙은 그 사정을 알면서도 영리 또는 부정한 목적으로 위 사진 파일을 제공받았다는 내용으로 기소된 사안에서, 결론적으로 위 배치표 기재 정보가 구 개인정보 보호법 제59조 제2호의 ‘업무상 알게 된 개인정보’에 해당하지 않는다고 본 원심판단이 정당하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=607191"},{"id":"P:619199","kind":"P","label":"2024노737","title":"개인정보보호법위반","court":"서울동부지방법원","date":"2025.06.13","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619199"},{"id":"P:605851","kind":"P","label":"2023구합81091","title":"과징금부과처분취소","court":"서울행정법원","date":"2025.03.28","caseType":"일반행정","basis":"참조조문","text":"국내외 직업정보제공사업을 하는 甲 주식회사가 채용정보를 제공하는 온라인 사이트를 운영하면서 수집·보관하던 이용자의 이력서 등 개인정보를 해커의 공격으로 열람당한 사고에 대하여, 개인정보보호위원회가 법 위반 여부를 조사한 다음 구 개인정보 보호법 등을 위반하였다고 보아 과징금을 부과한 사안에서, 甲 회사는 구 개인정보 보호법 제29조, 구 개인정보 보호법 시행령 제48조의2 제1항 제2호 등에서 정한 개인정보에 대한 불법적인 접근을 차단하기 위한 침입차단시스템 및 침입탐지시스템의 운영 및 기타 접근 통제 조치를 이행하지 않았음이 인정되고, 과징금 산정에서 재량권을 일탈·남용하였다고 보기 어려워 위 처분이 적법하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=605851"},{"id":"L:39-15","kind":"L","label":"법 제39조의15","title":"현행 조문에 없음(구법 조문 번호)","chapter":"","deleted":true,"ghost":true,"text":""},{"id":"P:606757","kind":"P","label":"2025도266","title":"개인정보보호법위반","court":"대법원","date":"2025.03.13","caseType":"형사","basis":"참조조문","text":"개인정보를 제공받은 목적 외의 용도로 이용하거나 제3자에게 제공하는 행위를 금지·처벌하는 구 개인정보 보호법 제71조 제2호, 제19조 위반죄는 ‘개인정보처리자’로부터 개인정보를 제공받은 경우에 성립하는지 여부 / 개개의 사건에 대하여 재판사무를 담당하는 법원이 ‘개인정보처리자’에서 제외되는지 여부 / 재판사무를 담당하는 법원이 피고인의 신청에 따라 재판기록을 열람·복사할 수 있도록 한 경우, ‘개인정보처리자’로서 개인정보를 제공한 것인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=606757"},{"id":"P:603531","kind":"P","label":"2020도14713","title":"개인정보보호법위반[교육청으로부터 대학수학능력시험 감독관으로 위촉되어 시험감독업무 수행을 위하여 수험생의 개인정보가 포함된 응시원서를 제공받은 사람이 구 「개인정보 보호법」(2020. 2. 4. 법률 제16930호로 개정되기 전의 것, 이하 ‘구 「개인정보 보호법」’) 제71조 제2호, 제19조에서 정한 ‘개인정보처리자로부터 개인정보를 제공받은 자’에 해당하는지 여부가 문제된 사건]","court":"대법원","date":"2025.02.13","caseType":"형사","basis":"참조조문","text":"[1] 임직원, 파견근로자, 시간제근로자 등 개인정보처리자의 지휘·감독을 받아 개인정보를 처리하는 자인 개인정보취급자가 개인정보처리자의 업무 수행을 위하여 개인정보를 이전받는 경우, 위와 같은 개인정보취급자가 구 개인정보 보호법 제19조에서 정한 ‘개인정보처리자로부터 개인정보를 제공받은 자’에 해당하는지 여부 [2] 피고인이 대학수학능력시험 고사장 감독업무를 수행하면서 수험생의 개인정보가 포함된 응시원서를 제공받아 이를 각 수험생의 수험표와 대조하는 과정에서 알게 된 甲의 연락처를 이용하여 카카오톡 친구로 추가한 후 甲에게 카카오톡으로 \"사실 ○○씨가 맘에 들어서요.\" 등의 메시지를 발송함으로써 개인정보처리자로부터 제공받은 개인정보를 제공받은 목적 외 용도로 이용하였다는 구 개인정보 보호법 위반의 공소사실로 기소된 사안에서, 공소사실을 유죄로 판단한 원심판결에 같은 법 제19조의 ‘개인정보처리자로부터 개인정보를 제공받은 자’의 의미에 관한 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=603531"},{"id":"P:607545","kind":"P","label":"2024노2332","title":"부정처사후수뢰·개인정보보호법위반·공무상비밀누설·뇌물공여","court":"서울고등법원","date":"2025.02.07","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=607545"},{"id":"P:599615","kind":"P","label":"2021도12868","title":"개인정보보호법위반","court":"대법원","date":"2024.12.12","caseType":"형사","basis":"참조조문","text":"개개의 사건에 대하여 재판사무를 담당하는 수소법원이 ‘개인정보처리자’에서 제외되는지 여부 및 수소법원이 그 재판권에 기하여 법에서 정해진 방식에 따라 행하는 공권적 통지행위로서 여러 소송서류 등을 송달하는 경우, ‘개인정보처리자’로서 개인정보를 제공한 것인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=599615"},{"id":"P:611999","kind":"P","label":"2023누71232","title":"기관경고처분등취소","court":"서울고등법원","date":"2024.12.06","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=611999"},{"id":"P:613025","kind":"P","label":"2024노852","title":"개인정보보호법위반","court":"서울중앙지방법원","date":"2024.11.29","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=613025"},{"id":"P:624245","kind":"P","label":"2024노1561","title":"개인정보보호법위반","court":"부산지방법원","date":"2024.10.22","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=624245"},{"id":"P:241493","kind":"P","label":"2022도16324","title":"개인정보보호법위반[정보주체의 동의 없이 유통되는 개인정보를 매입하는 행위가 「개인정보 보호법」 제70조 제2호의 ‘거짓이나 그 밖의 부정한 수단이나 방법’으로 다른 사람이 처리하고 있는 개인정보를 취득한 것인지 여부가 문제된 사건]","court":"대법원","date":"2024.08.29","caseType":"형사","basis":"참조조문","text":"개인정보 보호법 제70조 제2호에서 정한 ‘거짓이나 그 밖의 부정한 수단이나 방법’의 의미 / 여기에 개인정보 제공에 관한 의사결정에 영향을 미칠 수 있는 적극적 또는 소극적 행위는 물론 해킹과 같이 다른 사람의 의사결정과 무관하게 그 자체로 위계 기타 사회통념상 부정한 방법이라고 인정되는 행위도 포함되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=241493"},{"id":"P:241495","kind":"P","label":"2020도18397","title":"개인정보보호법위반[개인정보를 처리하거나 처리하였던 자가 CCTV 영상을 재생하여 시청할 수 있도록 해준 경우 그 영상을 시청한 행위를 ‘개인정보를 제공받은 행위’로 볼 수 있는지 여부가 문제된 사건]","court":"대법원","date":"2024.08.23","caseType":"형사","basis":"참조조문","text":"구 개인정보 보호법 제71조 제5호 후단의 ‘개인정보를 제공받은 자’에 해당하는지 판단하는 기준 / 영상정보처리기기에 의하여 촬영된 개인의 초상, 신체의 모습과 위치정보 등과 관련한 영상의 형태로 존재하는 개인정보를 시청하는 등의 방식으로 영상에 포함된 특정하고 식별할 수 있는 살아있는 개인에 관한 정보를 지득함으로써 지배·관리권을 이전받은 경우, 구 개인정보 보호법 제71조 제5호 후단의 ‘개인정보를 제공받은 자’에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=241495"},{"id":"P:240901","kind":"P","label":"2019도3402","title":"개인정보보호법위반(일부예비적죄명:정보통신망이용촉진및정보보호등에관한법률위반)[정보주체의 동의 없이 유통되는 개인정보를 매입하는 행위가 「개인정보 보호법」 제72조 제2호 전단의 ‘거짓이나 그 밖의 부정한 수단이나 방법으로 개인정보를 취득한 행위’에 해당하는지 여부가 문제된 사건]","court":"대법원","date":"2024.06.17","caseType":"형사","basis":"참조조문","text":"[1] 구 개인정보 보호법 제72조 제2호 전단에서 규정한 ‘거짓이나 그 밖의 부정한 수단이나 방법’의 의미 / 이때 개인정보 취득 과정에서 사용하는 ‘거짓이나 그 밖의 부정한 수단이나 방법’에는 정보주체나 개인정보 보유자의 의사결정에 영향을 미칠 수 있는 적극적 또는 소극적 행위는 물론 해킹과 같이 정보주체 등의 의사결정과 무관하게 그 자체로 위계 기타 사회통념상 부정한 방법이라고 인정되는 행위도 포함되는지 여부 [2] 개인정보가 정보주체의 동의 등에 기하지 아니한 채 유통되고 있는 사정을 알면서 개인정보를 제공받은 것만으로 구 개인정보 보호법 제72조 제2호 전단의 ‘거짓이나 그 밖의 부정한 수단이나 방법’을 사용하여 개인정보를 취득한 경우에 해당하는지 여부 / 개인정보를 제공받은 사람이 ‘개인정보를 처리하거나 처리하였던 자가 거짓이나 그 밖의 부정한 수단이나 방법을 사용하여 개인정보를 취득하거나 개인정보 처리에 관한 동의를 받았다는 사정’을 알면서도 영리 또는 부정한 목적으로 개인정보를 제공받은 경우, 같은 법 제72조 제2호 후단에 해당할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=240901"},{"id":"P:240813","kind":"P","label":"2018다262103","title":"손해배상(기)[고객들이 대형 유통회사를 상대로 회사가 고객들의 동의 없이 개인정보를 보험회사들에 제공하였다는 이유로 손해배상을 청구한 사건]","court":"대법원","date":"2024.05.17","caseType":"민사","basis":"참조조문","text":"[1] 상고이유서에 원심판결의 법령 위반에 관한 구체적이고 명시적인 이유를 기재하지 않은 경우, 상고이유서를 제출하지 않은 것으로 취급되는지 여부 [2] 당사자 일방이 증명을 방해하는 행위를 한 경우, 증명책임이 전환되거나 상대방의 주장 사실이 증명된 것으로 보아야 하는지 여부 [3] 개인정보 보호법 제39조 제1항에 따라 정보주체가 개인정보처리자의 개인정보 보호법 위반행위로 입은 손해의 배상을 청구하는 경우, 개인정보처리자가 개인정보 보호법을 위반한 행위를 하였다는 사실 자체는 정보주체가 주장·증명하여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=240813"},{"id":"P:241659","kind":"P","label":"2018다302957","title":"손해배상(기)","court":"대법원","date":"2024.05.17","caseType":"민사","basis":"참조조문","text":"[1] 당사자 일방이 증명을 방해하는 행위를 한 경우, 증명책임이 전환되거나 상대방의 주장 사실이 증명된 것으로 보아야 하는지 여부 [2] 개인정보 보호법 제39조 제1항에 따라 정보주체가 개인정보처리자의 개인정보 보호법 위반행위로 입은 손해의 배상을 청구하는 경우, 개인정보처리자가 개인정보 보호법을 위반한 행위를 하였다는 사실 자체는 정보주체가 주장·증명하여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=241659"},{"id":"P:615735","kind":"P","label":"2023노2796","title":"개인정보보호법위반","court":"인천지방법원","date":"2024.05.08","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=615735"},{"id":"P:613027","kind":"P","label":"2023고정1844","title":"개인정보보호법위반","court":"서울중앙지방법원","date":"2024.03.27","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=613027"},{"id":"P:239977","kind":"P","label":"2023나310158","title":"손해배상(기)","court":"대구지방법원","date":"2024.02.28","caseType":"민사","basis":"참조조문","text":"경찰관으로 근무하던 甲이 타인의 개인정보를 사적인 목적으로 조회하고 이용하였다는 이유로 경찰청으로부터 정직 1월의 징계처분을 받은 후 정직처분 취소소송을 제기하여 승소하였는데, 이후 위 취소소송의 경찰청 측 소송수행자로 지정되어 소송업무를 수행한 乙을 상대로 위 취소소송에서 乙이 자신에 대한 허위사실을 적시한 서면을 제출하는 등의 불법행위를 하였다는 이유로 손해배상을 구하는 민사소송을 제기하자, 乙이 소송대리인을 통해 甲의 징계기록 및 위 취소소송 기록 등의 자료를 제출하였고, 위 민사소송에서 甲의 패소판결이 선고·확정되었는데, 甲이 乙 등을 상대로 乙이 경찰청장의 승인을 받지 않고 위 자료를 사본하여 유출하였고, 민사소송의 소송대리인을 통해 법원에 위 자료를 제출하여 누설하는 등 乙의 개인정보 보호법 위반 등을 주장하며 불법행위로 인한 손해배상을 구한 사안에서, 乙이 경찰청에서 위 취소소송의 소송수행자로서 업무상 취득한 자료를 사본하여 보관하였다 하더라도, 이를 개인정보의 유출이라고 할 수는 없고, 위 자료를 소송대리인을 통해 담당 법원에 제출한 것을 개인정보의 누설이라고 보기는 어려우며, 설령 乙이 소송대리인을 통해 법원에 위 자료를 제출한 것이 개인정보의 누설에 해당한다고 하더라도, 乙이 소송수행자로서 수행한 업무의 정당성이 관련 민사소송의 쟁점이 되어 乙이 그 정당성을 증명하기 위한 것으로, 사회상규에 위배되지 않는 정당행위에","url":"https://www.law.go.kr/precInfoP.do?precSeq=239977"},{"id":"P:614617","kind":"P","label":"2023나310158","title":"손해배상(기)","court":"대구지방법원","date":"2024.02.28","caseType":"민사","basis":"참조조문","text":"경찰관으로 근무하던 甲이 타인의 개인정보를 사적인 목적으로 조회하고 이용하였다는 이유로 경찰청으로부터 정직 1월의 징계처분을 받은 후 정직처분 취소소송을 제기하여 승소하였는데, 이후 위 취소소송의 경찰청 측 소송수행자로 지
