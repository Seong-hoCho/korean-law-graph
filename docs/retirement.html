13>","kind":"D"},{"id":"D:18","label":"영 제18조","title":"개인형퇴직연금제도의 급여 종류별 수급요건 및 중도인출","chapter":"","deleted":false,"text":"① 법 제24조제5항에 따른 개인형퇴직연금제도의 급여 종류별 수급요건은 다음 각 호의 구분과 같다.\n1. 연금: 55세 이상인 가입자에게 지급. 이 경우 연금 지급기간은 5년 이상이어야 한다.\n2. 일시금: 55세 이상으로서 일시금 수급을 원하는 가입자에게 지급\n② 가입자가 다음 각 호에 해당하는 경우에는 법 제24조제5항에 따라 개인형퇴직연금제도의 적립금을 중도인출할 수 있다. <개정 2015.12.15, 2020.11.3, 2022.4.13>\n1. 제2조제1항제1호에 해당하는 경우\n2. 제2조제1항제1호의2 전단에 해당하는 경우. 다만, 법 제25조에 따른 개인형퇴직연금제도 가입자의 경우에는 하나의 사업에 근로하는 동안 중도인출 횟수를 1회로 한정한다.\n3. 제2조제1항제2호에 해당하는 경우. 다만, 법 제25조에 따른 개인형퇴직연금제도 가입자의 경우에는 가입자가 본인 연간 임금총액의 1천분의 125를 초과하여 의료비를 부담하는 경우로 한정한다.\n4. 제2조제1항제5호에 해당하는 경우(재난으로 피해를 입은 경우로 한정한다)\n5. 중도인출을 신청한 날부터 거꾸로 계산하여 5년 이내에 가입자가 「채무자 회생 및 파산에 관한 법률」에 따라 파산선고를 받은 경우\n6. 중도인출을 신청한 날부터 거꾸로 계산하여 5년 이내에 가입자가 「채무자 회생 및 파산에 관한 법률」에 따라 개인회생절차개시 결정을 받은 경우\n7. 제14조제1항제4호에 해당하는 경우\n③ 제2항제7호에 해당하는 사유로 적립금을 중도인출하는 경우 중도인출 금액은 대출 원리금의 상환에 필요한 금액 이하로 한다. <신설 2022.4.13>\n제18조(개인형퇴직연금제도의 급여 종류별 수급요건 및 중도인출)","kind":"D"},{"id":"D:19","label":"영 제19조","title":"10명 미만을 사용하는 사업에 대한 특례","chapter":"","deleted":false,"text":"① 법 제25조에 따른 개인형퇴직연금제도의 급여 종류별 수급요건은 법 제17조제1항 각 호와 같다.\n② 법 제25조제2항제2호에 따라 사용자가 납입하는 부담금에 대한 수수료는 사용자가 부담하고, 같은 항 제3호에 따라 가입자가 추가로 납입하는 추가 부담금에 대한 수수료는 가입자가 부담한다.\n③ 법 제25조제3항 본문에서 \"대통령령으로 정하는 사유\"란 가입자가 해당 사업에서 퇴직하는 경우를 말한다.\n제19조(10명 미만을 사용하는 사업에 대한 특례)","kind":"D"},{"id":"D:20","label":"영 제20조","title":"퇴직연금사업자의 등록요건 등","chapter":"","deleted":false,"text":"① 법 제26조 각 호 외의 부분에서 \"재무건전성 및 인적ㆍ물적 요건 등 대통령령으로 정하는 요건\"이란 다음 각 호의 요건을 말한다. <개정 2020.11.3>\n1. 다음 각 호의 구분에 따른 재무건전성의 요건을 갖출 것\n가. 법 제26조제1호부터 제3호까지 또는 제7호에 해당하는 자: 「금융산업의 구조개선에 관한 법률」 제10조제1항에 따른 자기자본비율(이하 이 조에서 \"자기자본비율\"이라 한다)이 같은 조 제2항에 따라 금융위원회가 정하여 고시하는 기준 이상일 것\n나. 법 제26조제4호 또는 제5호에 해당하는 자: 자기자본비율이 법 제26조제1호부터 제3호까지 및 제7호의 어느 하나에 해당하는 자 중 업무 또는 재무구조 등이 가장 유사한 자에게 적용되는 기준 이상일 것\n다. 법 제26조제6호에 해당하는 자: 법률에 따라 설치된 기금으로부터 출연받을 수 있는 법적 근거를 갖출 것\n2. 금융위원회가 정하여 고시하는 바에 따라 운용관리업무 또는 자산관리업무에 관한 전문성이 있는 인력과 업무수행에 필요한 전산요원 등 필요한 인력을 갖출 것. 다만, 법 제28조제2항에 따라 운용관리업무 중 일부 업무를 다른 자에게 위탁하는 경우에는 해당 업무에 관한 인력을 갖춘 것으로 본다.\n3. 금융위원회가 정하여 고시하는 바에 따라 운용관리업무 또는 자산관리업무의 수행에 필요한 전산설비와 사무실을 갖출 것. 이 경우 그 전산설비는 정전ㆍ화재 등의 사고가 발생할 경우 업무의 연속성을 유지할 수 있도록 보완설비를 갖추고, 제도 내용의 변경 등으로 인하여 가입자에게 피해가 발생하지 않도록 전산 시스템을 미리 구축하여야 한다.\n② 제1항제2호 단서에도 불구하고 법 제28조제1항제2호의 업무를 수행하려는 퇴직연금사업자는 금융위원회가 정하여 고시하는 바에 따라 다음 각 호의 요건을 모두 갖춘 연금 회계처리 전문인력을 반드시 갖추어야 한다. <개정 2022.4.13>\n1. 「보험업법」 제182조제1항에 따라 등록된 보험계리사일 것\n2. 퇴직연금, 퇴직일시금 신탁 또는 퇴직보험 업무에 1년 이상 종사한 경력이 있을 것\n3. 금융위원회가 정하는 연금제도의 설계 및 연금 회계처리에 관한 업무교육을 이수할 것\n③ 금융위원회는 제1항제2호ㆍ제3호 및 제2항의 요건에 관한 세부 기준을 정하여 고시하여야 한다. 이 경우 미리 고용노동부장관과 협의하여야 한다.\n④ 법 제26조제7호에서 \"대통령령으로 정하는 자\"란 「자본시장과 금융투자업에 관한 법률」에 따라 신탁업의 인가를 받은 자를 말한다.\n⑤ 고용노동부장관은 법 제26조에 따른 등록 신청이 다음 각 호의 어느 하나에 해당하는 경우를 제외하고는 등록을 해주어야 한다. <개정 2020.11.3>\n1. 등록을 신청한 자가 법 제26조 각 호의 어느 하나에 해당하지 않는 경우\n2. 제1항부터 제3항까지의 규정에 따른 요건을 갖추지 못한 경우\n제20조(퇴직연금사업자의 등록요건 등)","kind":"D"},{"id":"D:21","label":"영 제21조","title":"등록취소 등에 따른 가입자 보호조치","chapter":"","deleted":false,"text":"1. 사용자와 가입자에 대한 등록취소 또는 등록말소 사실과 가입자 보호조치 내용의 통지\n2. 운용관리업무 또는 자산관리업무에 관한 계약의 해지ㆍ변경에 따른 사용자 및 가입자의 금전적 손실의 보상\n3. 법 제27조제5항에 따라 다른 퇴직연금사업자에게 적립금을 이전하고, 해당 사업과 가입자의 퇴직연금제도를 계속 운영하는데 필요한 자료 등의 제공\n4. 그 밖에 사용자 또는 가입자에게 끼칠 수 있는 불합리한 피해를 예방하기 위하여 필요한 조치로서 고용노동부장관이 정하는 조치\n제21조(등록취소 등에 따른 가입자 보호조치) 법 제27조제4항에서 \"대통령령으로 정하는 가입자 보호조치\"란 다음 각 호의 조치를 말한다.","kind":"D"},{"id":"D:22","label":"영 제22조","title":"운용관리업무의 범위","chapter":"","deleted":false,"text":"① 법 제28조제1항제5호에서 \"대통령령으로 정하는 업무\"란 다음 각 호의 업무를 말한다. <개정 2020.11.3, 2023.12.12>\n1. 법 제24조에 따른 개인형퇴직연금제도의 설정 및 운영\n2. 법 제32조제2항 후단에 따라 사용자가 위탁한 교육의 실시\n3. 퇴직연금사업자가 간사기관인 경우에는 다음 각 목의 업무\n가. 법 제16조에 따른 급여 지급능력 확보 여부의 확인 및 그 결과의 통보\n나. 법 제13조제10호의2에 따른 부담금의 산정\n다. 퇴직 등 사유가 발생한 경우 급여를 지급하는 퇴직연금사업자의 선정에 관한 사용자의 지시를 그 퇴직연금사업자에게 전달하는 업무\n라. 그 밖에 신규 가입자의 등재, 적립금액 및 운용현황 통지 등 복수의 퇴직연금사업자와 확정급여형퇴직연금제도의 운용관리업무에 관한 계약을 체결한 경우 제도의 안정적ㆍ통일적 운용을 위하여 필요한 사항\n② 간사기관이 아닌 퇴직연금사업자는 간사기관에 제1항제3호의 업무를 수행하는 데 필요한 자료를 제공하는 등 협조하여야 한다.\n제22조(운용관리업무의 범위)","kind":"D"},{"id":"D:23","label":"영 제23조","title":"운용관리업무의 일부 위탁 등","chapter":"","deleted":false,"text":"① 법 제28조제2항에서 \"대통령령으로 정하는 일부 업무\"란 법 제28조제1항제2호부터 제4호까지의 업무와 제22조제1항제2호의 업무를 말한다.\n② 법 제28조제2항에서 \"인적ㆍ물적 요건 등 대통령령으로 정하는 요건\"이란 제20조제3항에 따라 금융위원회가 세부기준을 정하여 고시한 요건을 말한다.\n제23조(운용관리업무의 일부 위탁 등)","kind":"D"},{"id":"D:24","label":"영 제24조","title":"자산관리업무 수행계약의 형태","chapter":"","deleted":false,"text":"1. 법 제16조제4항에 따라 적립금이 기준책임준비금의 100분의 150을 초과하고 사용자가 반환을 요구하는 경우 퇴직연금사업자는 사용자에게 그 초과분을 반환할 것\n2. 급여는 가입자가 퇴직하는 경우에 지급하는 것일 것\n3. 가입자가 퇴직연금사업자에 대하여 직접 급여를 청구할 수 있을 것. 다만, 계속근로기간이 1년 미만인 가입자는 급여를 청구할 수 없으며, 그 적립금은 사용자에게 귀속되는 것이어야 한다.\n4. 계약이 해지되는 경우 적립금은 가입자에게 지급되는 것일 것. 다만, 계속근로기간이 1년 미만인 가입자에 대한 적립금은 사용자에게 귀속되는 것이어야 한다.\n제24조(자산관리업무 수행계약의 형태) 법 제29조제2항에서 \"대통령령으로 정하는 보험계약 또는 신탁계약\"이란 「보험업법」 제108조에 따른 특별계정으로 운영하는 보험계약 또는 「자본시장과 금융투자업에 관한 법률 시행령」 제103조제1호에 따른 특정금전신탁계약으로서 다음 각 호의 요건을 모두 갖춘 것을 말한다.","kind":"D"},{"id":"D:24-2","label":"영 제24조의2","title":"수수료 부과기준 등","chapter":"","deleted":false,"text":"① 법 제29조의2제2항에서 \"대통령령으로 정하는 부과기준\"이란 다음 각 호의 기준을 말한다.\n1. 법 제28조제1항 각 호 및 제29조제1항 각 호의 업무 구분과 업무 수행 비용을 고려하여 부과할 것\n2. 적립금의 운용 손익과 관련된 업무 수행에 따른 수수료는 적립금의 운용 손익을 고려하여 부과할 것\n3. 다음 각 목에 해당하는 기업의 사용자 또는 가입자에게는 수수료 감면 혜택을 제공할 것\n가. 「중소기업기본법」 제2조에 따른 중소기업\n나. 「사회적기업 육성법」에 따른 사회적기업\n② 제1항 각 호의 기준에 관한 세부적인 내용은 고용노동부장관이 정하여 고시한다.\n③ 법 제29조의2제3항에서 \"수수료 부과기준 등 대통령령으로 정하는 자료\"란 다음 각 호의 자료를 말한다.\n1. 수수료 부과기준\n2. 운용관리업무 및 자산관리업무의 수행에 따른 수수료 부과현황\n3. 운용관리업무 및 자산관리업무의 수행에 따라 발생되는 비용\n4. 적립금의 운용 손익\n제24조의2(수수료 부과기준 등)","kind":"D"},{"id":"D:25","label":"영 제25조","title":"확정기여형퇴직연금제도 및 개인형퇴직연금제도 적립금의 원리금보장 운용방법","chapter":"","deleted":false,"text":"① 법 제30조제2항제4호에서 \"대통령령으로 정하는 원리금보장 운용방법\"이란 다음 각 호의 운용방법을 말한다. <개정 2022.4.13>\n1. 신용등급 등에 관하여 금융위원회가 정하여 고시하는 기준 이상의 금융기관이 제공하는 다음 각 목의 운용방법\n가. 「은행법」 제2조제1항제2호에 따른 은행이 취급하는 예금ㆍ적금\n나. 「보험업법」 제2조제6호에 따른 보험회사가 취급하는 보험계약으로서 적립금의 최저 이자율을 보증하는 등의 형태로 원리금 지급을 보장하는 보험계약\n다. 「자본시장과 금융투자업에 관한 법률」 제8조에 따른 금융투자업자가 원리금 지급을 보장하는 계약으로서 같은 법 시행령 제85조제3호나목에 따른 환매조건부매수 계약\n라. 「자본시장과 금융투자업에 관한 법률」에 따른 증권금융회사가 같은 법 제330조제1항에 따라 취급하는 예탁금\n2. 「우체국예금ㆍ보험에 관한 법률」에 따라 체신관서가 취급하는 예금\n3. 「한국은행법」 제69조제1항에 따른 한국은행통화안정증권, 국채증권 및 정부가 원리금 상환을 보증한 채권\n3의2. 「자산유동화에 관한 법률」에 따른 유동화전문회사가 발행한 유동화증권 중 「사회기반시설에 대한 민간투자법」 제30조에 따른 산업기반신용보증기금이 원리금 상환을 보증하는 사회기반시설채권\n4. 그 밖에 원리금 상환이 보장되는 운용방법으로서 금융위원회가 정하여 고시하는 운용방법\n② 금융위원회는 제1항제1호의 기준 및 제4호의 운용방법을 정하거나 변경하려는 경우에는 고용노동부장관과 협의하여야 한다.\n제25조(확정기여형퇴직연금제도 및 개인형퇴직연금제도 적립금의 원리금보장 운용방법)","kind":"D"},{"id":"D:26","label":"영 제26조","title":"적립금의 안정적 운용을 위한 운용방법 및 기준","chapter":"","deleted":false,"text":"① 법 제30조제2항제5호에서 \"대통령령으로 정하는 운용방법 및 기준\"이란 다음 각 호의 운용방법 및 기준을 말한다. <개정 2015.3.23, 2022.4.13>\n1. 운용방법: 다음 각 목의 어느 하나에 해당하는 운용방법\n가. 「은행법」 제2조제1항제2호에 따른 은행이 취급하는 예금ㆍ적금\n나. 「보험업법」 제2조제6호에 따른 보험회사가 취급하는 보험계약 중 적립금이 반환되는 것으로서 금융위원회가 고시하는 보험계약\n다. 「자본시장과 금융투자업에 관한 법률」 제4조에 따른 증권으로서 금융위원회가 고시하는 증권. 이 경우 증권(「자본시장과 금융투자업에 관한 법률」에 따른 집합투자증권은 제외한다)은 사용자 또는 금융위원회가 정하여 고시하는 이해관계인이 발행한 것이 아니어야 한다.\n라. 「우체국예금ㆍ보험에 관한 법률」에 따라 체신관서가 취급하는 예금\n마. 「자본시장과 금융투자업에 관한 법률」에 따른 증권금융회사 중 신용등급 등이 금융위원회가 정하여 고시하는 기준 이상인 증권금융회사가 같은 법 제330조제1항에 따라 취급하는 예탁금\n바. 「자산유동화에 관한 법률」에 따른 유동화전문회사가 발행한 유동화증권 중 「사회기반시설에 대한 민간투자법」 제30조에 따른 산업기반신용보증기금이 원리금 상환을 보증하는 사회기반시설채권\n사. 그 밖에 적립금의 안정적인 중장기 운용을 위하여 필요한 운용방법으로서 금융위원회가 정하여 고시하는 운용방법\n2. 기준: 다음 각 목의 기준을 따를 것\n가. 제1호 각 목에 따른 운용방법 중 제25조제1항 각 호에 따른 원리금보장 운용방법과 증권에 대한 분산투자 등으로 투자위험을 낮춘 운용방법으로서 금융위원회가 고시하는 운용방법을 제외한 운용방법에 대해서는 고용노동부령으로 정하는 총투자한도 내에서 운용할 것. 이 경우 금융위원회는 고용노동부령으로 정하는 총투자한도 내에서 퇴직연금제도별로 세부적인 투자한도를 달리 정하여 고시할 수 있다.\n나. 확정기여형퇴직연금제도와 개인형퇴직연금제도의 경우 고용노동부령으로 투자위험이 큰 것으로 정한 자산은 「자본시장과 금융투자업에 관한 법률」 제6조제5항에 따른 집합투자의 방법으로만 투자할 것\n② 금융위원회는 제1항제1호나목ㆍ다목ㆍ사목, 제2호가목의 사항을 고시하는 경우에는 고용노동부장관과 미리 협의해야 한다. <개정 2015.3.23, 2022.4.13>\n제26조(적립금의 안정적 운용을 위한 운용방법 및 기준)","kind":"D"},{"id":"D:27","label":"영 제27조","title":"모집업무의 위탁범위","chapter":"","deleted":false,"text":"1. 퇴직연금제도를 설정하거나 가입한 자(설정하거나 가입하려는 자를 포함한다)에게 퇴직연금제도 및 운영에 관한 사항을 설명하는 업무\n2. 사용자 또는 가입 예정자를 퇴직연금사업자에게 소개하거나 중개하는 업무\n3. 사용자 또는 가입자(가입 예정자를 포함한다. 이하 이 조에서 같다)에 대한 적립금 운용방법의 설명 또는 관련 정보의 전달 업무, 사용자 또는 가입자의 적립금 운용방법에 대한 지시를 전달하는 업무\n4. 사용자 또는 가입자의 질의사항, 퇴직연금사업자 등의 답변을 전달하는 업무\n5. 그 밖에 퇴직연금제도를 설정하고 가입하도록 권유하는데 필요한 사항으로서 고용노동부장관이 정하는 업무\n제27조(모집업무의 위탁범위) 법 제31조제1항 각 호 외의 부분에서 \"대통령령으로 정하는 업무\"란 다음 각 호의 업무를 말한다. <개정 2015.12.15, 2019.10.29>","kind":"D"},{"id":"D:28","label":"영 제28조","title":"퇴직연금제도 모집인의 요건","chapter":"","deleted":false,"text":"① 법 제31조제1항제2호에서 \"대통령령으로 정하는 요건\"이란 다음 각 호의 요건을 말한다. <개정 2024.5.28>\n1. 퇴직연금사업자의 임직원이 아닌 자로서 퇴직연금사업자와 서면 계약으로 모집업무를 위탁받은 자일 것\n2. 다음 각 목의 어느 하나에 해당하는 자로서 고용노동부장관이 정하는 교육과정을 이수할 것. 이 경우 교육과정과 이수에 대한 세부사항은 별표 1과 같다.\n가. 「보험업법」 제84조 및 제87조에 따라 금융위원회에 등록된 보험설계사와 개인인 보험대리점\n나. 「자본시장과 금융투자업에 관한 법률」 제51조에 따라 한국금융투자협회에 등록한 투자권유대행인\n다. 그 밖에 고용노동부장관이 퇴직연금제도에 관한 전문성이 있다고 인정하는 자\n② 제1항제2호에 따른 교육은 고용노동부장관이 정하는 인력ㆍ시설 및 장비를 갖춘 기관에 위탁하여 시행하고, 교육과정 이수, 교육비 및 별표 1에 따른 검정시험의 수수료 등에 관하여 필요한 사항은 고용노동부장관이 정한다. <개정 2023.12.12>\n③ 퇴직연금사업자는 법 제31조제2항에 따라 등록한 퇴직연금제도 모집인(이하 \"퇴직연금제도 모집인\"이라 한다)이 등록한 날부터 기산하여 매 2년이 되는 날부터 6개월 이내에 별표 2에 따른 보수교육을 받도록 하여야 한다.\n제28조(퇴직연금제도 모집인의 요건)","kind":"D"},{"id":"D:29","label":"영 제29조","title":"모집인 등록업무의 위탁","chapter":"","deleted":false,"text":"① 고용노동부장관은 법 제31조제2항 후단에 따라 고용노동부장관이 정하는 인력ㆍ시설 및 장비를 갖춘 기관으로서 고용노동부장관이 정하는 절차에 따라 금융위원회가 지정한 기관 중에서 대상 기관을 정하여 퇴직연금제도 모집인의 등록업무를 위탁할 수 있다.\n② 제1항에 따른 모집인 등록업무의 위탁 기간은 3년을 넘지 아니하는 범위에서 고용노동부장관이 정할 수 있다.\n제29조(모집인 등록업무의 위탁)","kind":"D"},{"id":"D:30","label":"영 제30조","title":"퇴직연금제도 모집인의 준수사항","chapter":"","deleted":false,"text":"① 법 제31조제7항제2호에 따라 퇴직연금제도 모집인은 다음 각 호의 어느 하나에 해당하는 행위를 하여서는 아니 된다. <개정 2019.10.29>\n1. 퇴직연금제도 모집인 외의 명칭을 사용하거나 다른 퇴직연금제도 모집인의 명의를 이용하여 모집업무를 수행하는 행위\n2. 허위 사실에 근거하여 모집업무를 수행하거나 그 내용을 사실과 다르게 알리거나 중요한 사항을 알리지 않는 행위\n3. 제27조에 따른 모집업무의 위탁범위를 벗어나서 업무를 수행하는 행위\n4. 둘 이상의 퇴직연금사업자와 모집업무 위탁계약을 체결하는 행위\n5. 모집업무를 수행하면서 알게 된 정보 등을 자기 또는 제3자의 이익을 위하여 이용하는 행위\n6. 모집업무를 위탁한 퇴직연금사업자 또는 가입예정인 사용자 등을 대리하여 계약을 체결하는 행위\n7. 퇴직연금제도를 설정하였거나 설정하려는 사용자 또는 가입자로부터 금전ㆍ증권, 그 밖에 재산상의 가치가 있는 것을 받는 행위\n8. 퇴직연금제도를 설정하였거나 설정하려는 사용자, 가입자 또는 이들의 이해관계인에게 법 제33조제4항제2호에 따른 특별한 이익을 제공하거나 제공할 것을 약속하는 행위\n9. 사용자 또는 가입자의 적립금 운용방법에 대한 지시를 대리하는 행위\n10. 그 밖에 사용자와 가입자를 보호하고 건전한 거래질서를 유지하기 위하여 고용노동부장관이 정하여 고시하는 행위\n② 법 제31조제7항제2호에 따라 퇴직연금제도 모집인은 모집업무를 수행하는 경우 자신이 모집업무를 위탁받은 자라는 사실을 나타내는 표지 또는 증표를 사무실에 게시하거나 상대방에게 내보여야 하고, 모집업무를 위탁한 퇴직연금사업자의 명칭 등 사용자와 가입자를 보호하고 건전한 거래질서를 유지하기 위하여 필요한 사항으로서 고용노동부장관이 정하여 고시하는 사항을 미리 사용자 등에게 알려야 한다.\n③ 금융위원회는 제1항 각 호 및 제2항에 관한 세부 기준을 고용노동부장관과 협의하여 정하고 고시하여야 한다.\n제30조(퇴직연금제도 모집인의 준수사항)","kind":"D"},{"id":"D:31","label":"영 제31조","title":"퇴직급여제도의 안정적 운영을 위한 사용자의 책무","chapter":"","deleted":false,"text":"1. 삭제<2019.10.29>\n2. 운용관리업무와 자산관리업무의 수행, 관련 서비스 제공 등 퇴직연금제도 전반에 대한 능력과 전문성을 종합적으로 판단하여 퇴직연금사업자를 선정할 것. 이 경우 상시 300명 이상의 근로자를 사용하는 사업의 사용자는 법 제13조와 제19조에 따른 퇴직연금규약을 신고하거나 퇴직연금사업자를 선정ㆍ변경하는 경우 고용노동부장관에게 퇴직연금사업자 선정ㆍ변경사유서를 제출하여야 한다.\n3. 단체협약, 취업규칙, 근로계약서, 급여명세서 등 부담금 산정 및 법 제16조에 따른 급여 지급능력 확보 여부 등을 확인하는 데 필요한 자료를 근로복지공단 또는 퇴직연금사업자(제4조제6항에 따라 복수의 퇴직연금사업자와 운용관리업무에 관한 계약을 체결한 경우에는 간사기관을 말한다)에게 제공할 것. 이 경우 법 제16조에 따른 급여 지급능력 확보 여부 등을 확인하는 데 필요한 자료는 매 사업연도 종료 후 3개월 이내에 제공해야 한다.\n4. 법 제32조제2항 후단에 따라 퇴직연금사업자 또는 전문기관에게 가입자에 대한 교육의 실시를 위탁한 경우 집합교육을 실시할 수 있도록 하는 등 협조할 것\n5. 간사기관의 선정 또는 변경 시 그 사실을 그 선정일 또는 변경일부터 7일 이내에 운용관리업무를 수행하는 퇴직연금사업자에게 알릴 것\n제31조(퇴직급여제도의 안정적 운영을 위한 사용자의 책무) 법 제32조제1항에서 \"대통령령으로 정하는 사항\"이란 다음 각 호의 사항을 말한다. <개정 2015.12.15, 2018.6.19, 2019.10.29, 2022.4.13>","kind":"D"},{"id":"D:32","label":"영 제32조","title":"퇴직연금제도 가입자에 대한 교육사항","chapter":"","deleted":false,"text":"① 법 제32조제2항 전단에서 \"해당 사업의 퇴직연금제도 운영 상황 등 대통령령으로 정하는 사항\"이란 다음 각 호의 구분에 따른 사항을 말한다. <개정 2022.4.13, 2023.12.12>\n1. 제도 일반에 관한 내용으로서 다음 각 목의 사항\n가. 급여 종류에 관한 사항, 수급요건, 급여액 등 제도별 특징 및 차이점\n나. 담보대출, 중도인출, 지연이자 등 해당 사업의 퇴직연금제도 운영에 관한 사항\n다. 급여 또는 부담금 산정의 기준이 되는 임금 등에 관한 사항\n라. 퇴직 시 급여 지급절차 및 개인형퇴직연금계정등으로의 적립금 이전에 관한 사항\n마. 연금소득세, 퇴직소득세 등 과세 체계에 관한 사항\n바. 해당 사업의 퇴직연금제도를 중단하거나 폐지하는 경우 그 처리방법\n사. 가입자의 소득, 자산, 부채, 나이 및 근속연수 등을 고려한 자산ㆍ부채관리의 일반적 원칙과 노후 설계의 중요성에 관한 사항\n2. 확정급여형퇴직연금제도를 설정하는 경우에는 다음 각 목의 사항\n가. 최근 3년간의 부담금 납입 현황\n나. 급여종류별 표준적인 급여액 수준\n다. 직전 사업연도 말 기준 최소적립금 대비 적립금 현황\n라. 적립금이 최소적립금보다 적은 경우 그 부족분 납입 이행 상황\n마. 그 밖에 적립금 운용현황, 운용목표 등에 관한 사항\n3. 확정기여형퇴직연금제도를 설정하는 경우에는 다음 각 목의 사항\n가. 사용자의 부담금 수준, 납입시기 및 납입 현황\n나. 법 제23조에 따라 둘 이상의 사용자가 참여하는 확정기여형퇴직연금제도의 경우 표준규약 및 표준계약서에 관한 사항\n다. 분산투자 등 적립금의 안정적 운용을 위하여 행하는 투자원칙에 관한 사항\n라. 퇴직연금사업자가 제시하는 집합투자증권 등 적립금 운용방법별 수익구조, 매도기준가, 투자 위험 및 수수료 등에 관한 사항\n② 사용자(법 제32조제2항 후단에 따라 위탁받은 전문기관을 포함한다)는 제1항제3호다목 및 라목의 사항을 교육하는 경우 퇴직연금사업자와 협조하여 실시해야 한다. <개정 2022.4.13>\n제32조(퇴직연금제도 가입자에 대한 교육사항)","kind":"D"},{"id":"D:32-2","label":"영 제32조의2","title":"확정급여형퇴직연금제도 가입자 등에 대한 교육 방법","chapter":"","deleted":false,"text":"1. 제32조제1항제1호에 따른 공통 교육 사항: 사내 전산망 또는 해당 사업장 등 가입자의 접근이 가능한 곳에 교육 자료 상시 게시. 다만, 퇴직연금제도를 도입한 후 최초로 하는 교육은 다음 각 목의 어느 하나에 해당하는 방법으로 해야 한다.\n가. 서면 또는 전자우편 등을 통한 교육자료의 발송\n나. 연수ㆍ회의ㆍ강의 등의 집합교육\n다. 정보통신망을 활용한 온라인 교육\n2. 제32조제1항제2호에 따른 확정급여형퇴직연금제도 가입자에 대한 교육 사항: 사내 전산망 또는 해당 사업장 등 가입자의 접근이 가능한 곳에 교육 자료 상시 게시하거나 제1호 각 목의 어느 하나에 해당하는 방법\n3. 제32조제1항제3호에 따른 확정기여형퇴직연금제도 가입자에 대한 교육 사항: 제1호 각 목의 어느 하나에 해당하는 방법\n제32조의2(확정급여형퇴직연금제도 가입자 등에 대한 교육 방법) 법 제32조제2항 전단에 따른 가입자에 대한 교육의 방법은 다음 각 호의 구분에 따른다.","kind":"D"},{"id":"D:32-3","label":"영 제32조의3","title":"전문기관의 요건","chapter":"","deleted":false,"text":"1. 퇴직연금제도에 관하여 전문지식이 있는 사람으로서 고용노동부령으로 정하는 강사를 1명 이상 둘 것\n2. 제32조의2에 따라 교육을 실시할 수 있는 교육자료와 그 밖에 교육시설 등 고용노동부령으로 정하는 요건을 갖출 것\n제32조의3(전문기관의 요건) 법 제32조제2항 후단에서 \"대통령령으로 정하는 요건을 갖춘 전문기관\"이란 다음 각 호의 요건을 모두 갖춘 기관을 말한다.","kind":"D"},{"id":"D:33","label":"영 제33조","title":"사용자의 금지행위","chapter":"","deleted":false,"text":"1. 운용관리업무 또는 자산관리업무를 수행하는 데 필요한 다음 각 목의 자료를 고의로 누락(자료를 제공하지 않는 경우를 포함한다)하거나 거짓으로 작성하여 퇴직연금사업자에게 제공하는 행위\n가. 단체협약, 취업규칙, 근로계약서, 급여명세서 등 부담금 산정 및 법 제16조에 따른 급여 지급능력 확보 여부 등을 확인하는 데 필요한 자료\n나. 그 밖에 급여지급 등 운용관리업무 및 자산관리업무의 수행에 필요한 자료\n2. 퇴직연금사업자에게 약관 등에서 정해진 부가서비스 외의 경제적 가치가 있는 서비스의 제공을 요구하거나 제공받는 행위\n3. 퇴직연금사업자에게 계약 체결을 이유로 물품 등의 구매를 요구하거나 판매하는 행위\n4. 퇴직연금사업자에게 확정되지 않은 운용방법의 수익을 확정적으로 제시할 것을 요구하거나 제공받는 행위\n5. 삭제<2023.12.12>\n제33조(사용자의 금지행위) 법 제32조제4항제2호에서 \"대통령령으로 정하는 행위\"란 다음 각 호의 행위를 말한다. <개정 2019.10.29, 2022.4.13>","kind":"D"},{"id":"D:34","label":"영 제34조","title":"퇴직연금사업자의 금지행위","chapter":"","deleted":false,"text":"① 법 제33조제3항제4호에서 \"대통령령으로 정하는 행위\"란 다음 각 호의 행위를 말한다. <개정 2019.10.29, 2022.7.11>\n1. 사용자 또는 가입자의 운용지시 등 업무수행과 관련하여 알게 된 정보를 자기 또는 제3자의 이익을 위하여 이용하는 행위\n2. 기존 대출을 연장하거나 신규 대출을 제공하는 등 사용자, 가입자 또는 이들의 이해관계인에게 금융거래상의 혜택을 주는 조건으로 퇴직연금계약의 체결을 요구하는 행위\n3. 사용자 또는 가입자에게 특정한 운용방법의 선택을 강요하는 행위\n4. 사용자 또는 가입자에게 특정한 운용방법의 가치상승 또는 하락에 대한 단정적이거나 합리적 근거가 없는 판단을 제공하는 행위\n5. 적립금 운용방법 등에 있어 통상적인 조건을 벗어나 현저히 유리한 조건을 제시하는 행위\n6. 원리금 지급을 보장하는 운용방법의 금리 등을 사용자 또는 가입자에 따라 합리적 이유 없이 차등 적용하는 행위\n7. 사용자 또는 가입자에게 확정되지 않은 운용방법의 수익을 확정적으로 제시하는 행위\n8. 사전지정운용방법에 의한 적립금 운용과 관련된 다음 각 목의 행위\n가. 거짓이나 그 밖의 부정한 방법으로 사전지정운용방법의 승인을 받아 운용하는 행위\n나. 특정 가입자를 우대하여 수익률 차이가 크게 나도록 하는 등 가입자를 차별하는 행위\n다. 거짓이나 그 밖의 부정한 방법으로 법 제21조의3제1항에 따른 정보를 제공하거나 이 영 제13조의3제1항 또는 제13조의4제2항에 따른 통지를 하는 행위\n② 제1항 각 호의 구체적 기준은 고용노동부장관과 협의하여 금융위원회가 정하여 고시한다.\n제34조(퇴직연금사업자의 금지행위)","kind":"D"},{"id":"D:35","label":"영 제35조","title":"특별한 이익의 구체적 내용","chapter":"","deleted":false,"text":"① 법 제33조제4항제2호에서 \"대통령령으로 정하는 특별한 이익\"이란 다음 각 호의 이익을 말한다.\n1. 계약 체결을 유도하거나 계약을 유지하기 위한 금품의 제공\n2. 약관에 근거하지 않은 수수료의 할인\n3. 가입자 또는 사용자가 부담해야 할 비용의 일부 또는 전부의 부담\n4. 가입자 또는 사용자가 해당 퇴직연금사업자로부터 받은 대출금에 대한 이자의 대납(代納)\n5. 약관에 근거하지 않은 경제적 가치가 있는 부대서비스의 제공\n6. 그 밖에 제1호부터 제5호까지의 이익에 준하는 것으로서 금융위원회가 정하여 고시하는 경제적 이익\n② 제1항 각 호의 이익의 구체적 기준은 고용노동부장관과 협의하여 금융위원회가 정하여 고시한다.\n제35조(특별한 이익의 구체적 내용)","kind":"D"},{"id":"D:36","label":"영 제36조","title":"개인형퇴직연금제도 가입자에 대한 교육사항","chapter":"","deleted":false,"text":"① 법 제33조제5항에서 \"해당 사업의 퇴직연금제도 운영 상황 등 대통령령으로 정하는 사항\"이란 다음 각 호의 구분에 따른 사항을 말한다. <개정 2022.4.13>\n1. 법 제24조제2항의 개인형퇴직연금제도의 경우: 이 영 제17조의2, 제18조, 제32조제1항제1호마목 및 사목, 같은 항 제3호다목 및 라목의 사항\n2. 법 제25조의 개인형퇴직연금제도의 경우: 이 영 제32조제1항제1호 및 제3호에 관한 사항\n② 제1항에 따른 교육은 제32조의2제1호 각 목의 어느 하나에 해당하는 방법으로 한다. <개정 2022.4.13>\n제36조(개인형퇴직연금제도 가입자에 대한 교육사항)","kind":"D"},{"id":"D:36-2","label":"영 제36조의2","title":"퇴직연금사업자에 대한 평가","chapter":"","deleted":false,"text":"제36조의2(퇴직연금사업자에 대한 평가) 고용노동부장관은 법 제34조제2항제2호에 따른 퇴직연금사업자에 대한 평가를 고용노동부장관이 정하는 바에 따라 매년 실시한다. <개정 2023.12.12>","kind":"D"},{"id":"D:37","label":"영 제37조","title":"퇴직연금사업자에 대한 금융위원회의 감독","chapter":"","deleted":false,"text":"① 법 제36조제3항 각 호 외의 부분에서 \"대통령령으로 정하는 업무\"란 운용관리업무와 자산관리업무를 말한다.\n② 금융위원회는 제1항의 업무에 대한 감독을 수행하는 데 필요한 세부기준을 정하여 고시할 수 있다. 이 경우 고용노동부장관과 미리 협의하여야 한다.\n제37조(퇴직연금사업자에 대한 금융위원회의 감독)","kind":"D"},{"id":"D:38","label":"영 제38조","title":"제도 폐지에 따른 사용자 조치사항","chapter":"","deleted":false,"text":"1. 퇴직연금제도를 폐지한 날부터 1개월 이내에 고용노동부장관에게 다음 각 목의 사항을 포함한 폐지신고서를 제출할 것\n가. 퇴직연금제도 폐지에 대한 법 제4조제3항에 따른 근로자대표의 동의\n나. 퇴직연금제도 폐지 사유 및 폐지일\n다. 퇴직연금제도 폐지일을 기준으로 산정된 해당 사업의 적립금 및 미납 부담금(확정급여형퇴직연금제도의 경우 법 제16조제1항제2호에 따른 금액을 기준으로 한 적립부족액을 말하고, 확정기여형퇴직연금제도의 경우 부담금 납입 지연에 따른 지연이자를 포함한 금액을 말한다)\n라. 미납 부담금의 납입 예정일 등 해소방안(확정기여형퇴직연금제도로 한정한다)\n2. 가입자에게 다음 각 목의 사항을 통지할 것\n가. 제1호다목의 사항\n나. 급여 명세 및 지급절차\n다. 제40조에 따른 중간정산 대상기간\n라. 미납 부담금의 납입 예정일 등 해소 방안(확정기여형퇴직연금제도로 한정한다)\n3. 퇴직연금제도 폐지일부터 14일 이내에 미납 부담금을 납입하고 퇴직연금사업자가 급여를 지급하도록 할 것\n제38조(제도 폐지에 따른 사용자 조치사항) 법 제38조제2항에서 \"대통령령으로 정하는 조치\"란 다음 각 호의 조치를 말한다. <개정 2019.10.29>","kind":"D"},{"id":"D:39","label":"영 제39조","title":"퇴직연금제도 중단 시 유지해야 할 기본적인 업무","chapter":"","deleted":false,"text":"1. 사용자의 경우에는 다음 각 목의 업무\n가. 가입 근로자에게 제도 중단 사유 및 중단일, 재개시(再開始) 일정, 미납 부담금이 있는 경우 그 납입 계획 등 제도 중단기간의 처리방안 등의 공지 개시\n나. 법 제32조제2항 전단에 따른 가입자 교육의 실시\n다. 퇴직연금제도 중단 시에도 급여지급의 요청, 적립금의 운용 등과 관련하여 법령 등에 규정된 업무의 이행을 위해 필요한 조치\n라. 그 밖에 퇴직연금제도의 연속성 유지 및 가입자 보호를 위하여 고용노동부장관이 정하는 업무\n2. 퇴직연금사업자의 경우에는 다음 각 목의 업무\n가. 가입자 퇴직 등에 따른 급여의 지급\n나. 법 제32조제2항 후단에 따라 위탁받은 가입자 교육의 실시\n다. 급여의 지급, 적립금의 운용, 운용현황의 통지 등과 관련하여 법령 및 운용관리업무와 자산관리업무의 계약에서 정해진 업무\n라. 그 밖의 퇴직연금제도의 연속성 유지 및 가입자 보호를 위하여 고용노동부장관이 정하는 업무\n제39조(퇴직연금제도 중단 시 유지해야 할 기본적인 업무) 법 제38조제3항에서 \"대통령령으로 정하는 기본적인 업무\"란 다음 각 호의 구분에 따른 업무를 말한다.","kind":"D"},{"id":"D:40","label":"영 제40조","title":"퇴직연금제도 폐지에 따른 중간정산의 대상기간 등","chapter":"","deleted":false,"text":"1. 확정급여형퇴직연금제도의 경우: 중간정산금은 사업별로 적립된 금액을 가입자별 근속기간ㆍ평균임금과 법 제13조제4호에 따른 급여수준을 고려하여 안분(按分)ㆍ산정하고, 중간정산 대상기간은 중간정산금을 기준으로 환산\n2. 확정기여형퇴직연금제도와 법 제25조제1항에 따른 개인형퇴직연금제도의 경우: 중간정산 대상기간은 가입자별로 퇴직연금에 가입한 날부터 사용자가 납입한 부담금에 대응하는 기간의 마지막 날까지로 환산\n제40조(퇴직연금제도 폐지에 따른 중간정산의 대상기간 등) 법 제38조제4항 및 제5항에 따라 급여가 중간정산되어 지급되는 것으로 보는 경우의 중간정산금(확정급여형퇴직연금제도만 해당한다) 및 중간정산 대상기간은 다음의 각 호의 구분에 따른다.","kind":"D"},{"id":"D:41","label":"영 제41조","title":"권한의 위탁ㆍ위임","chapter":"","deleted":false,"text":"① 고용노동부장관은 법 제42조제1항에 따라 다음 각 호의 권한을 금융위원회에 위탁한다.\n1. 법 제26조에 따른 퇴직연금사업자의 등록\n2. 법 제27조에 따른 퇴직연금사업자에 대한 등록취소 및 업무 이전명령\n3. 법 제31조제6항에 따른 퇴직연금제도 모집인에 대한 등록취소 및 업무정지\n4. 법 제36조제1항 및 제2항에 따른 시정명령, 업무 이전명령(해당 권한을 행사하는 데 필요한 범위에서 법 제40조에 따른 보고, 서류의 제출 요구를 포함한다)\n5. 법 제41조에 따른 청문\n6. 법 제48조에 따른 과태료의 부과ㆍ징수(퇴직연금사업자에 대한 과태료의 부과ㆍ징수로 한정한다)\n② 금융위원회는 제1항제1호부터 제4호까지의 업무를 수행하는 데 필요한 세부 기준을 정하여 고시할 수 있다. 이 경우 미리 고용노동부장관과 협의하여야 한다.\n③ 금융위원회는 제1항제3호에 따라 퇴직연금제도 모집인에 대한 등록취소 및 업무정지를 한 경우 그 내용 및 근거를 고용노동부장관에게 알려야 한다.\n④ 고용노동부장관은 법 제42조제1항에 따라 다음 각 호의 권한을 금융감독원장에게 위탁한다.\n1. 법 제23조제2호에 따른 표준계약서의 승인\n2. 법 제31조제7항에 따라 퇴직연금제도 모집인이 지켜야 할 준수사항의 위반 확인\n⑤ 금융감독원장은 제4항제2호에 따른 확인 결과 퇴직연금제도 모집인이 준수사항을 위반한 사실이 있는 경우 그 내용을 금융위원회에 알려야 한다.\n⑥ 고용노동부장관은 사용자와 가입자를 보호하고 건전한 거래질서를 유지하기 위하여 필요하다고 인정하는 경우에는 금융감독원장에게 제4항제2호에 따른 확인을 요구할 수 있으며, 금융감독원장은 이에 따라 확인을 한 후 그 결과를 고용노동부장관에게 서면으로 제출하여야 한다.\n⑦ 고용노동부장관은 법 제42조제1항에 따라 다음 각 호의 업무를 근로복지공단에 위탁한다. <신설 2022.4.13, 2023.12.12>\n1. 법 제23조의14에 따른 지원 업무\n2. 법 제34조제2항제1호에 따른 노사단체, 퇴직연금업무 유관기관ㆍ단체와의 공동 연구사업 및 행정적ㆍ재정적 지원 업무\n3. 법 제34조제2항제2호에 따른 퇴직연금제도 운영과 관련한 퇴직연금사업자 평가 업무\n⑧ 고용노동부장관은 법 제42조제1항에 따라 다음 각 호의 권한을 지방고용노동관서의 장에게 위임한다. <개정 2022.4.13>\n1. 법 제13조 또는 제19조에 따라 신고하는 퇴직연금규약의 접수\n2. 법 제35조에 따른 시정명령 및 퇴직연금의 운영중단 명령\n3. 법 제40조제1항에 따른 보고ㆍ서류제출 또는 출석 요구, 같은 조 제2항에 따른 질문ㆍ조사\n4. 법 제48조에 따른 과태료의 부과ㆍ징수(사용자에 대한 과태료의 부과ㆍ징수로 한정한다)\n5. 제31조제2호 후단에 따른 퇴직연금사업자 선정ㆍ변경사유서의 접수\n6. 제38조제1호에 따른 퇴직연금제도 폐지의 신고 접수\n⑨ 금융위원회는 법 제42조제2항에 따라 법 제36조제3항제1호에 따른 조치(직원에 대한 면직 요구는 제외한다)에 관한 권한을 금융감독원장에게 위탁한다. <개정 2022.4.13>\n제41조(권한의 위탁ㆍ위임)","kind":"D"},{"id":"D:42","label":"영 제42조","title":"과태료의 부과기준","chapter":"","deleted":false,"text":"제42조(과태료의 부과기준) 법 제48조제1항 및 제2항에 따른 과태료의 부과기준은 별표 3과 같다.","kind":"D"},{"id":"D:43","label":"영 제43조","title":"고유식별정보의 처리","chapter":"","deleted":false,"text":"1. 법 제18조에 따른 운용현황의 통지에 관한 업무(법 제23조의11에서 준용하는 경우를 포함한다)\n2. 법 제23조의6제1항에 따른 중소기업퇴직연금기금제도의 설정을 위한 계약의 체결에 관한 업무\n3. 법 제23조의8에 따른 기금제도가입자부담금계정의 설정에 관한 업무\n4. 법 제23조의14에 따른 국가의 지원 및 지원금 환수에 관한 업무\n5. 법 제23조의16에 따른 근로복지공단에 대한 지도ㆍ감독 등에 관한 업무\n6. 법 제26조에 따른 퇴직연금사업자의 등록에 관한 업무\n7. 법 제27조에 따른 퇴직연금사업자에 대한 등록취소 및 이전명령에 관한 업무\n8. 법 제28조에 따른 운용관리업무에 관한 계약의 체결에 관한 업무\n9. 법 제29조에 따른 자산관리업무에 관한 계약의 체결에 관한 업무\n10. 법 제30조에 따른 운용관리업무의 수행에 필요한 업무\n11. 법 제31조에 따른 모집업무의 위탁, 퇴직연금제도 모집인 등록, 등록 취소 및 모집업무의 정지 등에 관한 업무\n12. 법 제32조제2항 후단에 따라 사용자로부터 위탁받은 교육에 필요한 업무\n13. 법 제33조제6항에 따른 퇴직연금제도의 취급실적 제출에 관한 업무\n14. 법 제35조에 따른 사용자에 대한 감독에 관한 업무\n15. 법 제36조에 따른 퇴직연금사업자에 대한 감독에 관한 업무\n16. 법 제37조에 따른 금융거래정보의 제공 요청에 관한 업무\n17. 법 제39조에 따른 업무의 협조에 관한 업무\n18. 법 제40조에 따른 보고 및 조사에 관한 업무\n제43조(고유식별정보의 처리) 고용노동부장관(제41조에 따라 고용노동부장관의 권한을 위탁ㆍ위임받은 자를 포함한다), 사용자, 퇴직연금사업자, 근로복지공단, 법 제23조의6제3항에 따라 근로복지공단의 중소기업퇴직연금기금제도의 업무를 처리하는 자, 법 제28조제2항에 따라 퇴직연금사업자로부터 운용관리업무를 위탁받은 자, 법 제31조제2항 후단에 따라 퇴직연금제도 모집인 등록업무를 위탁받은 기관, 법 제32조제2항 후단에 따라 교육의 실시를 위탁받은 기관은 다음 각 호의 업무를 수행하기 위하여 불가피한 경우 「개인정보 보호법 시행령」 제19조제1호에 따른 주민등록번호 또는 같은 조 제4호에 따른 외국인등록번호가 포함된 자료를 처리할 수 있다. <개정 2020.11.3, 2022.4.13>","kind":"D"},{"id":"D:44","label":"영 제44조","title":"규제의 재검토","chapter":"","deleted":false,"text":"제44조(규제의 재검토) 고용노동부장관은 제5조에 따른 확정급여형퇴직연금제도의 최소적립금 수준에 대하여 2017년 1월 1일을 기준으로 3년마다(매 3년이 되는 해의 1월 1일 전까지를 말한다) 그 타당성을 검토하여 개선 등의 조치를 해야 한다.","kind":"D"},{"id":"R:1","label":"규칙 제1조","title":"목적","chapter":"","deleted":false,"text":"제1조(목적) 이 규칙은 「근로자퇴직급여 보장법」 및 같은 법 시행령에서 위임된 사항과 그 시행에 필요한 사항을 규정함을 목적으로 한다.","kind":"R"},{"id":"R:2","label":"규칙 제2조","title":"퇴직연금규약의 신고 등","chapter":"","deleted":false,"text":"① 「근로자퇴직급여 보장법」(이하 \"법\"이라 한다) 제13조 또는 제19조에 따라 확정급여형퇴직연금규약이나 확정기여형퇴직연금규약을 신고하려는 사용자(법 제6조에 따라 확정급여형퇴직연금규약 및 확정기여형퇴직연금규약을 함께 설정하는 사용자를 포함한다)는 별지 제1호서식의 확정급여형(확정기여형, 혼합형) 퇴직연금규약 신고서에 다음 각 호의 서류를 첨부하여 지방고용노동관서의 장에게 제출하여야 한다. <개정 2019.7.26>\n1. 퇴직연금규약\n2. 근로자의 과반수가 가입한 노동조합이 있는 경우에는 그 노동조합, 근로자의 과반수가 가입한 노동조합이 없는 경우에는 근로자 과반수(이하 \"근로자대표\"라 한다)의 동의를 받았거나 의견을 들었음을 증명하는 자료\n② 제1항에 따른 사용자는 신고한 퇴직연금제도의 설정 내용을 변경한 경우에는 다음 각 호에 해당하는 서류를 첨부하여 그 사실을 지방고용노동관서의 장에게 통보하여야 한다. <개정 2019.7.26>\n1. 변경 전과 변경 후의 내용을 비교하여 작성한 퇴직연금규약\n2. 근로자대표의 동의를 받았음을 증명하는 자료(근로자에게 불리한 변경의 경우로 한정한다)\n3. 근로자대표의 의견을 들었음을 증명하는 자료(근로자에게 불리한 변경이 아닌 경우로 한정한다)\n제2조(퇴직연금규약의 신고 등)","kind":"R"},{"id":"R:3","label":"규칙 제3조","title":"확정급여형퇴직연금규약의 부담금 산정 및 납입","chapter":"","deleted":false,"text":"① 법 제13조제10호의2에 따른 부담금은 각 호의 구분에 따른다. <개정 2022.5.18>\n1. 표준부담금: 법 제14조제1항에 따라 퇴직연금제도의 설정 이후로서 표준부담금을 산출하는 시점에서 장래 근무기간분에 대하여 발생하는 급여를 충당하기 위한 부담금\n2. 보충부담금: 법 제14조제2항 전단에 따라 퇴직연금제도의 설정 전의 과거 근무기간분에 대하여 발생한 급여를 충당하기 위한 부담금\n3. 특별부담금: 법 제16조에 따라 급여 지급능력 확보 여부 등을 확인한 결과 적립금이 「근로자퇴직급여 보장법 시행령」(이하 \"영\"이라 한다) 제7조제1항의 수준에 미치지 못하는 경우 최소적립금 대비 부족분을 충당하기 위한 부담금\n② 제1항에 따른 부담금은 예상이율, 예상임금상승률, 예상퇴직률, 예상사망률 등(이하 \"기초율\"이라 한다)을 기초로 산정한다.\n③ 기초율은 3년마다 산출하되, 부담금의 기초가 된 기초율이 실제 상황과 현저한 차이가 발생하는 경우 다시 산출하여야 한다.\n④ 예상이율은 산출 직전 사업연도 말을 기준으로 「자본시장과 금융투자업에 관한 법률 시행령」 제307조제2항제3호에 따라 채무증권의 매매거래(증권시장 밖에서의 매매거래만 해당한다)에 대한 정보 관리 및 공시에 관한 업무를 수행하는 법인이 발표하는 10년 만기 국고채의 36개월 평균수익률로 한다.\n⑤ 예상이율을 제외한 기초율은 해당 사업 또는 사업장(이하 \"사업\"이라 한다)의 경험통계를 기초로 하여야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 고용노동부장관 또는 보험개발원장이 발표하는 자료를 활용한 기초율을 이용할 수 있다.\n1. 해당 사업이 성립된 지 3년 미만인 경우. 다만, 합병ㆍ분할로 인하여 설립된 경우는 제외한다.\n2. 화재 등으로 경험통계 자료를 분실한 경우\n3. 경험통계를 장래 예측을 위해 사용하기에 부적합한 경우\n⑥ 제1항제2호의 보충부담금은 10년 이내에 충당될 수 있도록 산정되어야 한다.\n⑦ 퇴직연금사업자는 제1항의 부담금을 산정하는 데 사용한 기초율을 선택하는 등의 경우에 그 합리적 근거를 분명하게 밝혀야 한다.\n제3조(확정급여형퇴직연금규약의 부담금 산정 및 납입)","kind":"R"},{"id":"R:4","label":"규칙 제4조","title":"","chapter":"","deleted":true,"text":"제4조 삭제 <2022.5.18>","kind":"R"},{"id":"R:4-2","label":"규칙 제4조의2","title":"확정급여형퇴직연금제도의 최소적립금 산출","chapter":"","deleted":false,"text":"1. 삭제<2022.5.18>\n2. 2019년 1월 1일부터 2021년 12월 31일까지의 기간: 100분의 90\n3. 2022년 1월 1일 이후: 100분의 100\n제4조의2(확정급여형퇴직연금제도의 최소적립금 산출) 영 제5조제1항에서 \"고용노동부령으로 정하는 비율\"이란 다음 각 호의 구분에 따른 비율을 말한다. <개정 2020.12.29, 2022.5.18>","kind":"R"},{"id":"R:5","label":"규칙 제5조","title":"기준책임준비금의 산정방식","chapter":"","deleted":false,"text":"① 법 제16조제1항제1호에서 \"고용노동부령으로 정하는 방법\"이란 제3조제2항부터 제5항까지의 기초율을 사용하여 예상 퇴직시점의 급여를 산출하고 이를 예상 가입기간 단위로 배분하여 할당하는 방법을 말한다.\n② 법 제16조제1항제2호에서 \"고용노동부령으로 정하는 방법\"이란 해당 가입자의 가입기간에 대하여 법 제15조에 따른 급여수준을 곱하여 예상급여를 산출한 후 가입자별 예상급여를 합하는 방법을 말한다.\n제5조(기준책임준비금의 산정방식)","kind":"R"},{"id":"R:6","label":"규칙 제6조","title":"적립금의 산정","chapter":"","deleted":false,"text":"1. 매 사업연도 말 직전 12개월간의 시가(時價) 평균에 따른 금액으로 산정할 것. 이 경우 산정된 금액이 사업연도 말 현재 시가에 따라 산정된 금액의 100분의 90 이하 또는 100분의 110 이상이 될 때에는 각각 100분의 90 또는 100분의 110으로 산정할 것\n2. 제1호에도 불구하고 손실이 확정되었거나 예금ㆍ적금 등 특정시점까지 시간이 지나면서 자산가치가 일정하게 상승하는 운용방법의 경우에는 사업연도 말 시가를 적용하여 산정할 것\n제6조(적립금의 산정) 법 제16조제2항 본문에 따라 확정급여형퇴직연금제도의 운용관리업무를 수행하는 퇴직연금사업자는 다음 각 호의 방법에 따라 적립금을 산정하여야 한다.","kind":"R"},{"id":"R:6-2","label":"규칙 제6조의2","title":"지원금의 환수","chapter":"","deleted":false,"text":"제6조의2(지원금의 환수) 영 제16조의17제3항제4호에서 \"고용노동부령으로 정하는 사유\"란 폐업을 말한다.","kind":"R"},{"id":"R:7","label":"규칙 제7조","title":"운용현황의 통지","chapter":"","deleted":false,"text":"① 법 제18조에 따라 퇴직연금사업자는 적립금액 및 운용수익률 등을 다음 각 호의 하나에 해당하는 방법으로 가입자에게 알려야 한다.\n1. 우편 발송\n2. 서면 교부\n3. 정보통신망에 의한 전송\n4. 그 밖에 이에 준하는 방식으로서 운용관리업무의 위탁계약을 체결할 때 당사자가 합의한 방법\n② 법 제19조제2항에 따라 확정기여형퇴직연금제도의 퇴직연금사업자는 가입자에게 제1항에서 정한 방법으로 가입자별 적립금의 운용수익 및 운용방법별 구성비율 등의 운용현황을 알려야 한다.\n③ 제2항은 법 제24조제2항 및 법 제25조에 따른 개인형퇴직연금제도의 퇴직연금사업자의 가입자에 대한 운용현황의 통지에 관하여 준용한다.\n④ 퇴직연금사업자(확정급여형퇴직연금제도의 경우는 제외한다)는 다음 각 호의 어느 하나에 해당하는 경우에는 운용현황의 구체적인 내용을 그 사유가 발생한 날부터 10일 이내에 가입자에게 알려야 한다. <개정 2019.7.26>\n1. 부담금이 납입 예정일부터 1개월 이상 미납된 경우\n2. 적립금 운용수익률이 현저히 변동한 경우 등 고용노동부장관이 정하여 고시하는 기준에 해당하는 경우\n제7조(운용현황의 통지)","kind":"R"},{"id":"R:8","label":"규칙 제8조","title":"심의위원회의 구성 등","chapter":"","deleted":false,"text":"① 법 제21조의2제2항에 따른 심의위원회(이하 \"심의위원회\"라 한다)는 위원장 1명을 포함한 10명 이내의 위원으로 구성한다.\n② 심의위원회의 위원장(이하 \"위원장\"이라 한다)은 고용노동부차관으로 하고, 심의위원회의 위원(이하 \"위원\"이라 한다)은 다음 각 호의 어느 하나에 해당하는 사람 중에서 고용노동부장관이 성별을 고려하여 임명하거나 위촉한다.\n1. 고용노동부의 고위공무원단에 속하는 일반직공무원 중 퇴직연금 관련 업무를 담당하는 사람\n2. 금융위원회의 고위공무원단에 속하는 일반직공무원 중 퇴직연금 관련 업무를 담당하는 사람으로서 금융위원회의 위원장이 추천하는 사람\n3. 퇴직연금 및 자산운용 관련 전문가로서 다음 각 목의 어느 하나의 요건을 갖춘 사람\n가. 「고등교육법」 제2조 각 호의 어느 하나에 해당하는 학교에서 노동, 경제, 경영 또는 금융 관련 분야의 조교수 이상의 직에 3년 이상 근무하였을 것\n나. 노동, 경제, 경영 또는 금융 관련 분야의 연구기관 또는 공공기관에 소속되어 3년 이상 근무하였을 것\n다. 노동, 경제, 경영 또는 금융 관련 분야의 특별법에 따라 설립된 특수법인에 소속되어 3년 이상 근무하였을 것\n라. 금융 관련 기관이나 단체에서 퇴직연금, 자산운용, 금융상품 평가 또는 위험관리를 담당하는 직에 3년 이상 근무하였을 것\n③ 제2항제3호에 해당하여 위촉된 위원의 임기는 2년으로 하며, 한 차례만 연임할 수 있다.\n④ 위원장은 심의위원회의 회의를 소집하며, 그 의장이 된다.\n⑤ 위원장이 부득이한 사유로 그 직무를 수행할 수 없거나 회의에 참석하지 못할 때에는 위원장이 미리 지명한 위원이 그 직무를 대행한다.\n⑥ 심의위원회의 회의는 재적위원 과반수의 출석으로 개의하고, 출석위원 과반수의 찬성으로 의결한다.\n⑦ 위원장이 회의를 소집하려면 회의 개최 7일 전까지 회의의 일시, 장소 및 안건을 각 위원에게 알려야 한다. 다만, 긴급한 사정이나 그 밖의 부득이한 사유가 있는 경우에는 회의 개최 전날까지 통보할 수 있다.\n제8조(심의위원회의 구성 등)","kind":"R"},{"id":"R:8-2","label":"규칙 제8조의2","title":"위원의 제척ㆍ기피ㆍ회피","chapter":"","deleted":false,"text":"① 위원이 다음 각 호의 어느 하나에 해당하는 경우에는 심의위원회의 심의ㆍ의결에서 제척(除斥)된다.\n1. 위원 또는 그 배우자나 배우자이었던 사람이 해당 안건의 당사자인 퇴직연금사업자의 임원이거나 최근 3년 이내에 임원이었던 경우\n2. 위원이 다음 각 목의 어느 하나에 해당하는 경우\n가. 해당 안건의 당사자인 퇴직연금사업자의 임원과 4촌 이내의 혈족이거나 혈족이었던 경우\n나. 해당 안건의 당사자인 퇴직연금사업자의 임원과 2촌 이내의 인척이거나 인척이었던 경우\n3. 위원이 해당 안건에 관하여 당사자인 퇴직연금사업자의 요청에 따라 자문, 연구 또는 용역을 한 경우\n4. 위원 또는 위원이 소속된 법인ㆍ단체 등이 해당 안건의 당사자인 퇴직연금사업자의 대리인이거나 대리인이었던 경우\n② 당사자는 제1항에 따른 제척사유가 있거나 위원에게 공정한 심의ㆍ의결을 기대하기 어려운 사정이 있는 경우에는 위원회에 기피 신청을 할 수 있고, 위원회는 의결로 기피 여부를 결정한다. 이 경우 기피 신청의 대상인 위원은 그 의결에 참여하지 못한다.\n③ 위원이 제1항 각 호에 따른 제척 사유에 해당하는 경우에는 스스로 해당 안건의 심의ㆍ의결에서 회피(回避)해야 한다.\n제8조의2(위원의 제척ㆍ기피ㆍ회피)","kind":"R"},{"id":"R:8-3","label":"규칙 제8조의3","title":"위원의 해촉","chapter":"","deleted":false,"text":"1. 심신장애로 인하여 직무를 수행할 수 없게 된 경우\n2. 직무와 관련된 비위사실이 있는 경우\n3. 직무태만, 품위손상이나 그 밖의 사유로 위원으로 적합하지 않다고 인정되는 경우\n4. 위원 스스로 직무를 수행하는 것이 곤란하다고 의사를 밝히는 경우\n5. 제8조의2제1항 각 호의 어느 하나에 해당하는데도 불구하고 스스로 해당 안건의 심의ㆍ의결에서 회피하지 않은 경우\n제8조의3(위원의 해촉) 고용노동부장관은 제8조제2항제3호에 해당하여 위촉한 위원이 다음 각 호의 어느 하나에 해당하는 경우에는 해당 위원을 해촉할 수 있다.","kind":"R"},{"id":"R:8-4","label":"규칙 제8조의4","title":"사용자에 대한 사전지정운용방법 제시방법 등","chapter":"","deleted":false,"text":"① 법 제21조의2제3항에서 \"고용노동부령으로 정하는 방법\"이란 영 제13조의2제3항에 따른 방법을 말한다.\n② 퇴직연금사업자가 법 제21조의2제3항에 따라 사용자에게 사전지정운용방법을 제시할 때에는 해당 사전지정운용방법에 다음 각 호의 사항을 포함하여 제시해야 한다.\n1. 법 제21조의3제1항제1호의 사항\n2. 법 제21조의3제1항제3호 및 영 제13조의2제1항 각 호의 사항\n제8조의4(사용자에 대한 사전지정운용방법 제시방법 등)","kind":"R"},{"id":"R:9","label":"규칙 제9조","title":"퇴직연금사업자 등록취소 등의 기준","chapter":"","deleted":false,"text":"제9조(퇴직연금사업자 등록취소 등의 기준) 법 제27조제1항 각 호 외의 부분 본문에 따라 고용노동부장관은 퇴직연금사업자에게 시정을 명하거나 등록을 취소하는 경우에는 별표의 기준에 따라야 한다.","kind":"R"},{"id":"R:10","label":"규칙 제10조","title":"위험자산의 범위 및 운용기준","chapter":"","deleted":false,"text":"① 영 제26조제1항제2호가목 전단에서 \"고용노동부령으로 정하는 총투자한도\"란 다음 각 호의 구분에 따른 퇴직연금제도별 적립금의 총투자한도를 말한다. <개정 2015.3.23>\n1. 확정급여형퇴직연금제도: 사용자별 전체 적립금의 100분의 70\n2. 확정기여형퇴직연금제도 및 개인형퇴직연금제도: 가입자별 전체 적립금의 100분의 70\n② 영 제26조제1항제2호나목에서 \"고용노동부령으로 투자위험이 큰 것으로 정한 자산\"이란 「자본시장과 금융투자업에 관한 법률」에 따른 지분증권(같은 법에 따른 투자회사의 지분증권, 같은 법에 따른 투자유한회사ㆍ투자합자회사ㆍ투자합자조합ㆍ투자익명조합의 출자지분 및 「부동산투자회사법」에 따른 부동산투자회사의 지분증권은 제외한다)을 말한다. <개정 2015.3.23, 2019.12.18>\n제10조(위험자산의 범위 및 운용기준)","kind":"R"},{"id":"R:11","label":"규칙 제11조","title":"전문기관에 두는 강사의 자격기준","chapter":"","deleted":false,"text":"1. 퇴직연금제도 관련 업무에 3년 이상 종사한 경력이 있는 사람\n2. 고용노동부와 그 소속기관, 「노동위원회법」에 따른 중앙노동위원회 또는 지방노동위원회에서 퇴직연금제도 관련 업무에 1년 이상 공무원으로 근무한 경력이 있는 사람\n3. 퇴직연금 분야에서 1년 이상 「고등교육법」 제14조제2항에 따른 교원이나 같은 법 제17조제1항에 따른 명예교수 또는 겸임교원으로 강의한 경력이 있는 사람\n4. 「공인노무사법」 제5조에 따라 등록한 공인노무사\n5. 제1호부터 제4호까지에서 규정한 사람 외에 퇴직연금제도에 관한 전문적 지식과 경험이 있다고 고용노동부장관이 인정하는 사람\n제11조(전문기관에 두는 강사의 자격기준) 영 제32조의3제1호에서 \"고용노동부령으로 정하는 강사\"란 다음 각 호의 사람을 말한다.","kind":"R"},{"id":"R:12","label":"규칙 제12조","title":"취급실적의 제출","chapter":"","deleted":false,"text":"① 법 제33조제6항에 따라 퇴직연금사업자가 제출하는 취급실적에는 다음 각 호의 사항이 모두 포함되어야 한다.\n1. 해당 퇴직연금사업자 관련 사항. 이 경우 퇴직연금사업자의 명칭ㆍ대표자ㆍ주소ㆍ재무상황 및 경영하는 업무에 관한 사항이 포함되어야 한다.\n2. 운용관리업무와 자산관리업무의 수행에 관한 사항. 이 경우 대상사업, 가입자 및 적립금에 대한 현황이 포함되어야 한다.\n3. 적립금 운용사항. 이 경우 운용방법별 현황이 포함되어야 한다.\n4. 급여 지급사항. 이 경우 급여 종류별 수급요건 및 중도인출 현황이 포함되어야 한다.\n5. 법 제16조제2항에 따른 재정검증평가 결과에 대한 사항\n② 제1항에 따른 취급실적은 분기 또는 연 단위로 다음 각 호의 구분에 따라 사용자, 고용노동부장관 및 금융감독원장에게 취급실적을 제출하여야 한다. <개정 2018.12.19>\n1. 매 분기 종료 후 1개월 이내: 고용노동부장관 및 금융감독원장\n2. 매 사업년도 종료 후 3개월 이내: 사용자, 고용노동부장관 및 금융감독원장\n③ 제1항에 따라 제출하는 취급실적별 제출주기와 제출서식은 고용노동부장관이 정하여 고시한다. <개정 2018.12.19>\n제12조(취급실적의 제출)","kind":"R"},{"id":"R:13","label":"규칙 제13조","title":"퇴직연금제도의 폐지신고","chapter":"","deleted":false,"text":"1. 폐지한 퇴직연금제도의 퇴직연금규약\n2. 퇴직연금제도 폐지에 대하여 근로자대표의 동의를 받았음을 증명하는 자료\n제13조(퇴직연금제도의 폐지신고) 사용자는 영 제38조제1호에 따라 퇴직연금제도를 폐지한 경우에는 별지 제2호서식의 확정급여형(확정기여형, 혼합형) 퇴직연금제도 폐지신고서에 다음 각 호의 서류를 첨부하여 지방고용노동관서의 장에게 제출해야 한다. 이 경우 지방고용노동관서의 장은 「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 폐업사실증명원(퇴직연금제도의 폐지 사유가 폐업인 경우만 해당한다)을 확인해야 하며, 신고인이 폐업사실증명원의 확인에 동의하지 않는 경우에는 해당 서류를 첨부하도록 해야 한다.","kind":"R"},{"id":"R:14","label":"규칙 제14조","title":"규제의 재검토","chapter":"","deleted":false,"text":"제14조(규제의 재검토) 고용노동부장관은 제10조에 따른 위험자산의 범위 및 운용기준에 대하여 2017년 1월 1일을 기준으로 3년마다(매 3년이 되는 해의 1월 1일 전까지를 말한다) 그 타당성을 검토하여 개선 등의 조치를 해야 한다. <개정 2022.7.12>","kind":"R"},{"id":"X:근로기준법","kind":"X","label":"근로기준법","title":"","chapter":"","text":""},{"id":"X:산업재해보상보험법","kind":"X","label":"산업재해보상보험법","title":"","chapter":"","text":""},{"id":"X:자본시장과 금융투자업에 관한 법률","kind":"X","label":"자본시장과 금융투자업에 관한 법률","title":"","chapter":"","text":""},{"id":"X:보험업법","kind":"X","label":"보험업법","title":"","chapter":"","text":""},{"id":"X:은행법","kind":"X","label":"은행법","title":"","chapter":"","text":""},{"id":"X:신용협동조합법","kind":"X","label":"신용협동조합법","title":"","chapter":"","text":""},{"id":"X:새마을금고법","kind":"X","label":"새마을금고법","title":"","chapter":"","text":""},{"id":"X:민법","kind":"X","label":"민법","title":"","chapter":"","text":""},{"id":"X:금융실명거래 및 비밀보장에 관한 법률","kind":"X","label":"금융실명거래 및 비밀보장에 관한 법률","title":"","chapter":"","text":""},{"id":"X:신용정보의 이용 및 보호에 관한 법률","kind":"X","label":"신용정보의 이용 및 보호에 관한 법률","title":"","chapter":"","text":""},{"id":"X:주택임대차보호법","kind":"X","label":"주택임대차보호법","title":"","chapter":"","text":""},{"id":"X:출입국관리법 시행령","kind":"X","label":"출입국관리법 시행령","title":"","chapter":"","text":""},{"id":"X:임금채권보장법 시행령","kind":"X","label":"임금채권보장법 시행령","title":"","chapter":"","text":""},{"id":"X:근로기준법 시행령","kind":"X","label":"근로기준법 시행령","title":"","chapter":"","text":""},{"id":"X:산업발전법","kind":"X","label":"산업발전법","title":"","chapter":"","text":""},{"id":"X:고용보험법","kind":"X","label":"고용보험법","title":"","chapter":"","text":""},{"id":"X:고용보험 및 산업재해보상보험의 보험료징수 등에 관한 법률","kind":"X","label":"고용보험 및 산업재해보상보험의 보험료징수 등에 관한 법률","title":"","chapter":"","text":""},{"id":"X:소득세법 시행령","kind":"X","label":"소득세법 시행령","title":"","chapter":"","text":""},{"id":"X:금융산업의 구조개선에 관한 법률","kind":"X","label":"금융산업의 구조개선에 관한 법률","title":"","chapter":"","text":""},{"id":"X:자본시장과 금융투자업에 관한 법률 시행령","kind":"X","label":"자본시장과 금융투자업에 관한 법률 시행령","title":"","chapter":"","text":""},{"id":"X:중소기업기본법","kind":"X","label":"중소기업기본법","title":"","chapter":"","text":""},{"id":"X:한국은행법","kind":"X","label":"한국은행법","title":"","chapter":"","text":""},{"id":"X:사회기반시설에 대한 민간투자법","kind":"X","label":"사회기반시설에 대한 민간투자법","title":"","chapter":"","text":""},{"id":"X:개인정보 보호법 시행령","kind":"X","label":"개인정보 보호법 시행령","title":"","chapter":"","text":""},{"id":"X:고등교육법","kind":"X","label":"고등교육법","title":"","chapter":"","text":""},{"id":"X:공인노무사법","kind":"X","label":"공인노무사법","title":"","chapter":"","text":""},{"id":"X:전자정부법","kind":"X","label":"전자정부법","title":"","chapter":"","text":""},{"id":"P:621909","kind":"P","label":"2025다202901","title":"임금[택시회사의 소정근로시간 합의가 무효인지 여부가 문제 된 사건]","court":"대법원","date":"2026.05.14","caseType":"민사","basis":"참조조문","text":"[1] 소정근로시간의 정함이 단지 형식에 불과하다고 평가할 수 있는 정도에 이르거나, 노동관계법령 등 강행법규를 잠탈할 의도로 소정근로시간을 정한 경우, 소정근로시간에 관한 합의의 효력 / 정액사납금제하에서 생산고에 따른 임금을 제외한 고정급이 최저임금에 미달하는 것을 회피할 의도로 사용자가 소정근로시간을 기준으로 산정되는 시간당 고정급의 외형상 액수를 증가시키기 위해 택시운전근로자 노동조합과 사이에 실제 근무형태나 운행시간의 변경 없이 소정근로시간만을 단축하기로 한 합의의 효력 [2] 정액사납금제하에서 이루어진 소정근로시간 단축 합의가 탈법행위로서 무효인지 판단하는 기준 및 근로관계 당사자들의 자유로운 의사로 정한 소정근로시간이 최저임금법 제6조 제5항의 적용을 잠탈할 의도로 단지 형식적으로 정해졌다고 평가할 수 있는 경우, 합의의 효력을 인정할 수 있는지 여부 [3] 정액사납금제로 운영되는 택시회사가 2008. 3. 21. 법률 제8964호로 개정된 최저임금법 제6조 제5항이 시행된 이후 기존의 소정근로시간을 단축한 경우뿐 아니라 기존의 소정근로시간을 그대로 유지한 경우에도, 기존의 소정근로시간의 정함이 형식에 불과하다고 평가할 수 있는 정도에 이르거나, 기존의 소정근로시간을 그대로 유지한 근로관계 당사자들의 주된 목적이 최저임금법의 적용을 회피하는 것이었고, 택시운전근로자의 실제 근로시간과 소정근로시간 사이에 상당한 불일치가 있","url":"https://www.law.go.kr/precInfoP.do?precSeq=621909"},{"id":"P:618511","kind":"P","label":"2025다214123","title":"임금[재직 중 중간정산 퇴직금에 구 근로기준법 제37조 제1항에 따른 연 20%의 지연이율을 적용할 수 있는지가 문제 된 사건]","court":"대법원","date":"2026.03.12","caseType":"민사","basis":"참조조문","text":"근로자의 재직 중 지급되는 중간정산 퇴직금에 대한 지연손해금을 계산할 때 구 근로기준법 제37조 제1항, 구 근로기준법 시행령 제17조에서 정한 이율이 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=618511"},{"id":"P:622649","kind":"P","label":"2024도14708","title":"근로자퇴직급여보장법위반","court":"대법원","date":"2026.02.12","caseType":"형사","basis":"참조조문","text":"근로기준법상 ‘근로자’에 해당하는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=622649"},{"id":"P:619303","kind":"P","label":"2023나2058221","title":"임금","court":"서울고등법원","date":"2025.05.30","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619303"},{"id":"P:606507","kind":"P","label":"2024다294705","title":"퇴직금[퇴직금 청구에 대한 소멸시효 항변이 권리남용에 해당하는지 여부가 문제된 사건]","court":"대법원","date":"2025.05.29","caseType":"민사","basis":"참조조문","text":"[1] 채무자가 소멸시효 완성을 주장하는 것이 신의성실의 원칙에 반하여 권리남용으로서 허용될 수 없는 경우 및 소멸시효 완성 주장이 신의성실의 원칙에 반하는지 판단할 때 고려하여야 할 사항 [2] 甲 등 장례지도사들이 장례업 등을 영위하는 乙 주식회사와 의전대행 위탁계약을 체결하고 乙 회사의 지역본부에서 ‘의전팀장’으로 불리면서 장례의전대행 업무를 수행하다가 乙 회사가 장례의전 업무를 丙 주식회사에 위탁하기로 하자 乙 회사와 계약해지를 합의하고 같은 날 丙 회사와 의전대행 위탁계약을 체결하여 계약이 종료될 때까지 丙 회사의 의전팀장으로 장례의전대행 업무를 수행하였는데, 위 계약해지를 합의한 때부터 3년이 지난 후에 甲 등이 乙 회사를 상대로 퇴직금 지급을 구하자, 乙 회사가 甲 등의 퇴직금 청구권은 근로자퇴직급여 보장법 제10조에서 정한 3년의 소멸시효 완성으로 소멸하였다고 항변한 사안에서, 乙 회사의 소멸시효 완성 주장이 권리남용으로서 허용되지 않는다고 본 원심판단에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=606507"},{"id":"P:606703","kind":"P","label":"2022나2049800","title":"퇴직금","court":"서울고등법원","date":"2024.08.28","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606703"},{"id":"P:239473","kind":"P","label":"2018다206899","title":"임금·임금·임금","court":"대법원","date":"2024.02.08","caseType":"민사","basis":"판례내용","text":"[1] 임금채권에 관하여 근로자에게 불리할 수 있는 의사표시는 엄격하게 해석하여야 하는지 여부 [2] 근로기준법 제63조 제3호에 따라 근로기준법에서 정한 근로시간, 휴게와 휴일에 관한 규정의 적용을 배제하기 위한 요건 및 이때 ‘감시적 근로에 종사하는 자’의 의미 [3] 근로자의 근무실적을 평가하여 이를 토대로 지급 여부나 지급액이 정해지는 임금이 고정적 임금으로서 통상임금에 해당하는지 판단하는 기준 [4] 포괄임금제에 관한 약정이 성립하였는지 판단하는 기준 및 이때 묵시적 합의에 의한 포괄임금약정이 성립하였다고 인정하기 위한 요건 [5] 포괄임금제 방식의 임금 지급계약이 유효하기 위한 요건 / 근로시간의 산정이 어려운 경우가 아닌데도 포괄임금제 방식의 임금 지급계약을 체결한 때에 포괄임금에 포함된 법정수당이 근로기준법이 정한 기준에 따라 산정된 법정수당에 미달하는 경우, 그에 해당하는 포괄임금제에 의한 임금 지급계약 부분의 효력 및 이때 사용자가 근로자에게 미달되는 법정수당을 지급할 의무가 있는지 여부 [6] 통상임금 여부는 근로기준법에 따르면서 시간급 통상임금의 산정 기준이 되는 기준시간 수에 관하여는 취업규칙, 단체협약에서 정한 바에 따르는 것이 허용되는지 여부 [7] 휴일근로에 따른 가산임금과 연장근로에 따른 가산임금이 중복하여 지급될 수 있는지 여부 [8] 월급제 근로자가 통상임금의 증액을 이유로 주휴수당의 차액을 청구할 ","url":"https://www.law.go.kr/precInfoP.do?precSeq=239473"},{"id":"P:239241","kind":"P","label":"2022다285097","title":"퇴직연금","court":"대법원","date":"2024.01.04","caseType":"민사","basis":"참조조문","text":"[1] 소액사건에 관하여 상고이유로 할 수 있는 ‘대법원의 판례에 상반되는 판단을 한 때’의 요건을 갖추지 않았더라도 대법원이 실체법 해석적용의 잘못에 관하여 판단할 수 있는 경우 [2] 압류금지재산을 파산재단에서 제외하고 있는 채무자 회생 및 파산에 관한 법률 제383조 제1항이 상속재산파산절차에도 적용되는지 여부 및 근로자퇴직급여 보장법상 피상속인의 퇴직급여채권이 상속재산파산절차에서 파산재단에 속하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=239241"},{"id":"P:237595","kind":"P","label":"2021도11675","title":"근로자퇴직급여보장법위반[의료소비자생활협동조합의 봉직의가 근로기준법상 ‘근로자’에 해당하는지 여부가 문제되는 사건]","court":"대법원","date":"2023.09.21","caseType":"형사","basis":"참조조문","text":"[1] 근로기준법상 ‘근로자’에 해당하는지 판단하는 기준 및 근로자성의 요건 중 ‘종속적인 관계’ 유무를 판단하는 기준 [2] 의료소비자생활협동조합의 대표자로서 甲 의원을 운영하는 피고인이 의사 乙과 ‘乙은 2년 동안 甲 의원에서 진료업무를 수행하고 매월 보수를 받는다.’는 내용의 위탁진료계약을 체결하였음에도 乙의 퇴직금을 퇴직일부터 14일 이내에 지급하지 아니하였다고 하여 근로자퇴직급여 보장법 위반으로 기소된 사안에서, 위 계약의 형식이 위탁진료계약이라고 하더라도 계약 내용의 가장 중요한 부분은 乙이 정해진 시간 동안 甲 의원에서 진료업무를 수행하고 피고인은 乙에게 그 대가를 고정적으로 지급하는 것인 점 등 제반 사정을 종합하면, 乙은 임금을 목적으로 종속적인 관계에서 사용자에게 근로를 제공한 근로기준법상 근로자에 해당한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=237595"},{"id":"P:235959","kind":"P","label":"2023도188","title":"근로자퇴직급여보장법위반","court":"대법원","date":"2023.07.13","caseType":"형사","basis":"참조조문","text":"퇴직금지급의무를 규정한 구 근로자퇴직급여 보장법 제9조 본문 및 단서의 취지 / 사용자가 같은 법 제9조 단서에 따라 퇴직금의 지급사유가 발생한 날부터 14일 이내에 근로자와 지급기일을 연장하는 합의를 한 후 연장한 지급기일까지 퇴직금을 지급하지 아니한 경우, 같은 법 제9조 위반죄가 성립하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=235959"},{"id":"P:238599","kind":"P","label":"2022노326","title":"근로기준법위반·근로자퇴직급여보장법위반","court":"서울동부지방법원","date":"2022.12.16","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238599"},{"id":"P:232735","kind":"P","label":"2018다300586","title":"배당이의","court":"대법원","date":"2022.12.01","caseType":"민사","basis":"참조조문","text":"[1] 파견근로자 보호 등에 관한 법률 제34조 제2항에 따라 사용사업주가 파견근로자에 대하여 임금지급의무를 부담하는 경우, 파견근로자의 사용사업주에 대한 임금채권에 관하여 근로기준법 제38조 제2항이 정하는 최우선변제권이 인정되는지 여부 [2] 사용사업주의 파견근로자에 대한 임금지급책임을 인정하는 파견근로자 보호 등에 관한 법률 제34조 제2항을 적용하기 위하여 당해 근로자파견이 같은 법 제5조의 파견사유가 있고 제7조의 허가를 받은 파견사업주가 행하는 ‘적법한 근로자파견’에 해당하여야 하는지 여부 [3] 근로복지공단이 파산채무자인 사업주를 대신하여 미지급 임금을 지급하고 임금채권보장법 제8조 제2항에 따라 근로자의 권리를 대위하는 경우, 별제권 행사에 따른 경매절차에서 다른 담보물권자보다 우선하여 변제받을 수 있는지 여부 및 이때 근로복지공단이 배당금을 직접 받을 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=232735"},{"id":"P:235597","kind":"P","label":"2021다269364","title":"배당이의","court":"대법원","date":"2022.09.29","caseType":"민사","basis":"참조조문","text":"근로복지공단이 파산채무자인 사업주를 대신하여 미지급 임금을 지급하고 임금채권보장법 제8조 제2항에 따라 근로자의 권리를 대위하는 경우, 별제권 행사에 따른 경매절차에서 다른 담보물권자보다 우선하여 변제받을 수 있는지 여부 및 이때 근로복지공단이 배당금을 직접 받을 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=235597"},{"id":"P:238513","kind":"P","label":"2021나65806","title":"퇴직연금","court":"서울중앙지방법원","date":"2022.09.27","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238513"},{"id":"P:231931","kind":"P","label":"2019다200737","title":"배당이의","court":"대법원","date":"2022.08.31","caseType":"민사","basis":"참조조문","text":"[1] 별제권 행사에 따른 경매절차에서 과세관청이 관련 법령에 따라 다른 담보물권자보다 우선변제권을 가진 조세채권에 관하여 교부청구를 한 경우, 조세채권에 우선 배당하여야 하는지 여부 및 이때 배당금은 파산관재인에게 교부하여야 하는지 여부 / 이러한 법리는 채무자 회생 및 파산에 관한 법률 제415조의2가 신설·시행되기 전에 발생한 최우선임금채권에 관하여 임금채권자가 별제권 행사에 따른 경매절차에서 한 배당요구에 대해서도 그대로 적용되는지 여부 [2] 근로자가 채무자 회생 및 파산에 관한 법률 제415조의2 본문에 따라 별제권 행사에 따른 경매절차에서 최우선임금채권에 대하여 배당요구를 한 경우, 우선변제권을 가지는 배당금을 직접 수령할 수 있는지 여부 및 같은 조 단서 규정이 사업주를 대신하여 최우선임금채권을 지급한 근로복지공단의 임금채권보장법 제8조 제2항에 따른 우선변제권 행사를 제한하는 취지인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=231931"},{"id":"P:220869","kind":"P","label":"2020다299955","title":"배당이의","court":"대법원","date":"2022.04.28","caseType":"민사","basis":"참조조문","text":"근로기준법 및 근로자퇴직급여 보장법에 의하여 우선변제청구권을 갖는 임금 및 퇴직금 채권자가 배당요구를 하는 경우, 배당요구서에 그 자격을 소명하는 서면을 붙여야 하는지 여부 및 우선변제청구권이 있는 임금 및 퇴직금 채권자가 배당요구 종기까지 소명자료를 제출하지 않았으나 배당표가 확정되기 전까지 이를 보완한 경우, 우선배당을 받을 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=220869"},{"id":"P:228349","kind":"P","label":"2021나2025234","title":"임금","court":"서울고등법원","date":"2022.04.06","caseType":"민사","basis":"참조조문","text":"甲 등이 한국수출입은행에 재직 중 확정급여형 퇴직연금제도에 가입하였다가 확정기여형 퇴직연금제도로 전환하였는데, 甲 등의 퇴직연금 부담금지급청구권의 소멸시효의 기산일이 문제 된 사안에서, 확정기여형 퇴직연금제도에 가입한 근로자의 사용자에 대한 부담금지급청구권의 소멸시효는 근로자의 퇴직일부터 진행하고, 근로자가 퇴직금제도 또는 확정급여형 퇴직연금제도에서 확정기여형 퇴직연금제도로 전환한 경우, 소급 가입기간에 대한 부담금지급청구권의 소멸시효 역시 근로자의 퇴직일부터 진행한다고 봄이 타당하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=228349"},{"id":"P:231755","kind":"P","label":"2020나22408","title":"퇴직금등청구의소","court":"대구고등법원","date":"2022.03.23","caseType":"민사","basis":"판례내용","text":"甲 주식회사와 용역계약을 체결하고 지역별 서비스센터에 소속되어 甲 회사가 판매한 정수기 등의 설치·점검·수리 등의 업무를 수행한 乙 등이 甲 회사를 상대로 연차휴가수당 등의 지급을 구한 사안에서, 乙 등은 근로기준법상 근로자에 해당하고, 1년간 출근율이 80%를 초과하므로 甲 회사는 乙 등에게 미지급 연차휴가수당을 지급할 의무가 있는데, 乙 등은 근로기준법 제47조에서 정한 ‘도급 근로자’에 해당하므로, 근로기준법 시행령 제6조 제1항, 제2항 제6호에 따라 연차휴가수당의 산정 기준이 되는 시간급 통상임금을 산정하여야 한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=231755"},{"id":"P:227195","kind":"P","label":"2018다244877","title":"퇴직금","court":"대법원","date":"2022.03.17","caseType":"민사","basis":"참조조문","text":"[1] 사용자와 근로자 사이에 실질적인 퇴직금 분할 약정이 존재하는지 판단하는 기준 [2] 확정기여형 퇴직연금제도가 설정된 사업 또는 사업장에서 사용자가 확정기여형 퇴직연금의 부담금을 납입하면서 동액 상당을 근로자에게 지급하여야 할 임금에서 공제한 경우, 해당 확정기여형 퇴직연금제도의 설정이나 부담금 납입행위 자체가 무효인지 여부 및 이때 근로자가 퇴직금제도에 따라 평균임금의 재산정을 통해 계산하는 방식으로 추가 퇴직금의 지급을 청구할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=227195"},{"id":"P:219907","kind":"P","label":"2020노1052","title":"근로기준법위반·근로자퇴직급여보장법위반","court":"춘천지방법원","date":"2021.12.24","caseType":"형사","basis":"참조조문","text":"甲 교회의 담임목사인 피고인이, 피고인에 의해 甲 교회의 전도사로 임명된 후 5년 8개월여 동안 근무하다가 사직한 乙의 임금 일부와 퇴직금을 퇴직일로부터 14일 이내에 지급하지 아니하였다고 하여 근로기준법 위반 및 근로자퇴직급여 보장법 위반으로 기소된 사안에서, 제반 사정을 종합하면 乙은 근로기준법상 근로자에 해당한다는 이유로 미지급 임금 및 퇴직금에 관한 공소사실을 유죄로 인정한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=219907"},{"id":"P:222831","kind":"P","label":"2018나57479","title":"임금","court":"부산고등법원","date":"2021.12.08","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=222831"},{"id":"P:219765","kind":"P","label":"2016다263355","title":"사해행위취소","court":"대법원","date":"2021.11.25","caseType":"민사","basis":"참조조문","text":"[1] 주채무자 또는 제3자 소유의 부동산에 관하여 채권자 앞으로 근저당권이 설정되어 있고 부동산의 가액 및 채권최고액이 채무액을 초과하는 경우, 채무자의 재산 처분행위가 사해행위인지 여부 / 채무액이 부동산의 가액 및 채권최고액을 초과하는 경우, 채권자취소권이 인정되는 범위 [2] 채권자가 채무자 소유의 부동산에 관하여 근저당권을 설정하였고 사해행위 당시 채무자에 대하여 근로기준법 등에 따라 최우선변제권을 갖는 임금채권이 이미 성립되어 있는 경우, 채권자취소권이 인정되는 범위","url":"https://www.law.go.kr/precInfoP.do?precSeq=219765"},{"id":"P:619363","kind":"P","label":"2019가합12230","title":"임금","court":"창원지방법원진주지원","date":"2021.08.30","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619363"},{"id":"P:608511","kind":"P","label":"2020가합54268","title":"임금등","court":"창원지방법원","date":"2021.08.19","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=608511"},{"id":"P:605709","kind":"P","label":"2017나21269","title":"근로자지위확인등·근로자지위확인등","court":"대구고등법원","date":"2021.05.26","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=605709"},{"id":"P:615849","kind":"P","label":"2018나25602","title":"임금등","court":"대구고등법원","date":"2021.05.26","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=615849"},{"id":"P:217011","kind":"P","label":"2020도17654","title":"근로기준법위반ㆍ근로자퇴직급여보장법위반ㆍ최저임금법위반","court":"대법원","date":"2021.02.25","caseType":"형사","basis":"참조조문","text":"웨딩컨설팅 업체를 운영하는 피고인이 소속된 웨딩플래너들에 대한 임금, 퇴직금, 최저임금 등을 지급하지 않아 기소된 사안에서, 위 업체가 웨딩플래너의 업무를 지휘ㆍ감독한 점, 웨딩플래너들의 근무시간과 장소를 엄격하게 관리한 점, 웨딩플래너에게 업무 성과와 무관하게 고정적인 금액을 지급하였고, 직급을 부여한 뒤 승진심사를 통해 고정급 등을 높여주기도 한 점 등을 종합하면, 웨딩플래너인 피해근로자들은 근로기준법이 정한 근로자에 해당한다고 본 원심판단을 수긍한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=217011"},{"id":"P:213081","kind":"P","label":"2020다207444","title":"임금","court":"대법원","date":"2021.01.14","caseType":"민사","basis":"참조조문","text":"[1] 소액사건에 관하여 상고이유로 할 수 있는 ‘대법원의 판례에 상반되는 판단을 한 때’의 요건을 갖추지 않았더라도 대법원이 실체법 해석적용의 잘못에 관하여 판단할 수 있는 경우 [2] 확정기여형 퇴직연금제도가 설정된 사업 또는 사업장에서 사용자가 퇴직한 가입자에 대하여 가입기간 동안 매년 납입한 부담금이 연간 임금총액의 12분의 1에 미치지 못하는 경우, 가입자인 근로자가 퇴직금제도에 따라 평균임금의 재산정을 통해 계산하는 방식으로 추가 퇴직금의 지급을 청구할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=213081"},{"id":"P:227759","kind":"P","label":"2019노578","title":"특정경제범죄가중처벌등에관한법률위반(사기)·자본시장과금융투자업에관한법률위반·근로기준법위반·근로자퇴직급여보장법위반·위계공무집행방해","court":"서울고등법원","date":"2020.12.17","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=227759"},{"id":"P:600335","kind":"P","label":"2019나2053731","title":"손해배상(기)","court":"서울고등법원","date":"2020.12.02","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=600335"},{"id":"P:213325","kind":"P","label":"2019노7","title":"특정경제범죄가중처벌등에관한법률위반(사기), 사기, 사문서위조, 위조사문서행사, 도로교통법위반, 횡령, 업무상배임, 배임, 근로기준법위반, 근로자퇴직급여보장법위반, 권리행사방해, 조세범처벌법위반","court":"광주고등법원전주재판부","date":"2020.05.06","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=213325"},{"id":"P:226231","kind":"P","label":"2015다20780","title":"임금","court":"대법원","date":"2020.04.09","caseType":"민사","basis":"참조조문","text":"[1] 특정 시점에 재직 중인 근로자에게만 지급하기로 정해져 있는 임금이 통상임금에 해당하는지 여부 [2] 근로기준법이 정한 기준근로시간을 초과하는 약정 근로시간에 대한 임금으로서 월급 또는 일급 형태로 지급되는 고정수당을 시간급 통상임금으로 환산하는 경우, 시간급 통상임금 산정의 기준이 되는 총근로시간 수에 포함되는 약정 근로시간 수를 산정하는 방법 및 이때 가산수당 산정을 위한 ‘가산율’을 고려하여야 하는지 여부 / 이와 같은 법리는 단체협약으로 주휴수당에 가산율을 정한 경우에도 동일하게 적용되는지 여부 [3] 버스여객자동차운송사업을 영위하는 甲 주식회사가 소속 운전기사인 乙 등에게 임금협정에 따라 산정한 기본시급을 시간급 통상임금으로 보고, 기본시급을 기준으로 계산한 기본급, 연장근로수당, 야간근로수당, 주휴수당이 포함된 ‘일당액’을 정한 다음 乙 등이 근무한 일수에 일당액을 곱한 금액을 월 기본급으로 지급하였으며, 乙 등은 근로기준법에서 정한 기준근로시간을 초과하는 약정 근로시간에 대한 대가로서 월 기본급 외에도 월급 또는 일급 형태의 각종 고정수당을 지급받았는데, 일급 및 월급의 형태로 지급받는 고정수당의 시간급 통상임금 산정 방식이 문제 된 사안에서, 위 각 고정수당과 관련하여 시간급 통상임금 산정의 기준이 되는 총근로시간 수를 계산할 때에는 가산율이 반영되지 아니한 상태에서의 연장근로시간 수와 야간근로시간 수 및 주휴근로","url":"https://www.law.go.kr/precInfoP.do?precSeq=226231"},{"id":"P:221845","kind":"P","label":"2019가합64654","title":"배당이의","court":"인천지방법원","date":"2020.02.13","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=221845"},{"id":"P:241473","kind":"P","label":"2017가단105902","title":"임금","court":"대전지방법원천안지원","date":"2020.01.22","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=241473"},{"id":"P:225551","kind":"P","label":"2019노29","title":"근로기준법위반·근로자퇴직급여보장법위반","court":"울산지방법원","date":"2019.09.20","caseType":"형사","basis":"참조조문","text":"피고인은 甲 주식회사라는 상호로 시설관리서비스업을 경영하는 사용자로서, 甲 회사에서 기계시설관리업무를 수행하다 퇴직한 근로자들에 대하여 점심시간 외에 1시간 30분의 휴게시간을 부여하지 않은 데 대한 임금 등을 지급하지 않고, 당직근무에 대해서도 통상의 근로와 동일하게 임금 등을 지급하지 않음으로써 근로자들의 임금, 퇴직금, 수당을 퇴직일로부터 14일 이내에 지급하지 아니하였다고 하여 근로기준법 위반 및 근로자퇴직급여 보장법 위반으로 기소된 사안에서, 공소사실 중 피고인이 근로자들에게 점심시간을 제외하고 1시간 30분의 휴게시간을 추가로 부여하지 않음으로 인하여 휴게시간 근무에 대한 임금을 지급하지 않은 점 및 이로 인한 근무시간 추가발생에 따른 퇴직금 차액을 미지급한 점에 대해서만 유죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=225551"},{"id":"P:207127","kind":"P","label":"2018가합106952","title":"퇴직금","court":"서울남부지방법원","date":"2019.04.19","caseType":"민사","basis":"참조조문","text":"채권추심 및 신용조사업무를 영위하는 甲 주식회사와 채권추심위임업무에 관한 계약을 체결한 후 甲 회사가 채권자들로부터 수임한 채권의 관리 및 추심업무를 담당하다가 퇴사한 乙이 甲 회사를 상대로 퇴직금 지급을 구한 사안에서, 제반 사정에 비추어 乙은 임금을 목적으로 종속적인 관계에서 甲 회사에 채권관리 및 추심이라는 노무를 제공한 근로기준법상의 근로자에 해당하므로, 甲 회사는 乙에게 근로자퇴직급여 보장법에 의한 퇴직금을 지급할 의무가 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=207127"},{"id":"P:234477","kind":"P","label":"2018고단1833","title":"자본시장과금융투자업에관한법률위반·근로기준법위반·근로자퇴직급여보장법위반·위계공무집행방해","court":"서울중앙지방법원","date":"2019.02.18","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=234477"},{"id":"P:618371","kind":"P","label":"2018다260602","title":"퇴직금등","court":"대법원","date":"2019.01.17","caseType":"민사","basis":"참조조문","text":"甲 주식회사가 기숙학원의 형태로 운영한 乙 학원이 정규시간표에 따라 편성된 정규반 강의와 질의응답 시간 외에도 과목별 특강을 개설하여 丙 등을 포함한 강사들에게 배정하여 강의가 이루어졌는데, 丙 등이 甲 회사를 상대로 주휴일수당, 연차휴가근로수당, 퇴직금의 지급을 구한 사안에서, 丙 등이 乙 학원에서 한 특강 시간이 정규반 강의나 질의응답 시간과 마찬가지로 丙 등의 소정근로시간에 포함된다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=618371"},{"id":"P:204346","kind":"P","label":"2018다260602","title":"퇴직금등","court":"대법원","date":"2019.01.17","caseType":"민사","basis":"참조조문","text":"甲 주식회사가 기숙학원의 형태로 운영한 乙 학원이 정규시간표에 따라 편성된 정규반 강의와 질의응답 시간 외에도 과목별 특강을 개설하여 丙 등을 포함한 강사들에게 배정하여 강의가 이루어졌는데, 丙 등이 甲 회사를 상대로 주휴일수당, 연차휴가근로수당, 퇴직금의 지급을 구한 사안에서, 丙 등이 乙 학원에서 한 특강 시간이 정규반 강의나 질의응답 시간과 마찬가지로 丙 등의 소정근로시간에 포함된다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=204346"},{"id":"P:214783","kind":"P","label":"2018고단376","title":"사기, 도로교통법위반, 횡령, 업무상배임, 배임, 사문서위조, 위조사문서행사, 근로기준법위반, 근로자퇴직급여보장법위반, 권리행사방해","court":"전주지방법원","date":"2019.01.11","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=214783"},{"id":"P:207588","kind":"P","label":"2018다245160","title":"임금·손해배상(기)","court":"대법원","date":"2018.12.27","caseType":"민사","basis":"참조조문","text":"[1] 근로자에게 지급된 금품이 평균임금의 산정 대상이 되는 임금인지 판단하는 기준 [2] 甲이 乙 유한회사를 상대로 퇴직금 등의 지급을 구하였는데, 원심이 乙 회사가 甲에게 일정기간 동안 돈을 송금한 사실을 인정할 수 있으나 그 돈 전부가 평균임금 산정의 기초가 되는 통상임금에 해당한다고 볼 수 없고 달리 그 기간 동안의 통상임금을 특정할 증거가 없다는 이유로 甲이 주장하는 퇴직금 액수를 인정하지 않는 대신, 그보다 적은 액수로서 乙 회사가 그 범위를 다투지 않는 통상임금을 기준으로 퇴직금을 산정한 사안에서, 甲이 乙 회사로부터 수령한 돈이 근로의 대가인지 여부 등을 심리하여 평균임금에 해당하는지를 가렸어야 했는데도, 퇴직금 산정의 기준이 되는 임금을 평균임금이 아니라 통상임금으로 혼동하여 甲의 퇴직금 청구를 일부 배척한 원심판단에 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=207588"},{"id":"P:201347","kind":"P","label":"2016다228802","title":"퇴직금청구의소","court":"대법원","date":"2018.08.30","caseType":"민사","basis":"참조조문","text":"[1] 어느 사업장의 급여규정에서 퇴직금 산정의 기초인 임금에 상여금 등이 포함되는지 판단하는 방법 [2] 근로자 퇴직 당시 시행하는 단체협약이나 취업규칙의 퇴직금규정 등에 따라 산정한 퇴직금이 근로자퇴직급여 보장법 제8조 제1항에서 정한 퇴직금액의 하한에 미치지 못하는 경우, 그 하한을 지급해야 하는지 여부 및 위 규정에서 정한 퇴직금액의 하한을 초과하는 경우, 퇴직금규정 등에서 정한 것보다 불리하게 퇴직금을 지급할 수 있는지 여부 [3] 甲 주식회사의 근로자인 乙 등이 甲 회사와 퇴직금 중간정산을 하여 그에 따라 산정된 퇴직금을 받았는데, 甲 회사가 퇴직금을 산정하면서 매월 지급하던 가족수당과 특별상여금 중 연말상여금의 일부를 평균임금에 포함하지 않고 산정한 사안에서, 가족수당과 상여금이 甲 회사의 급여규정에서 퇴직금 산정의 기초로 정한 평균임금에 포함되는데도, 근로자퇴직급여 보장법이 보장한 금액에 미달하지만 않으면 가족수당과 상여금을 평균임금에서 제외하고 산정한 중간정산퇴직금을 지급해도 된다고 본 원심판단에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=201347"},{"id":"P:199858","kind":"P","label":"2018다21821","title":"퇴직금·부당이득금반환","court":"대법원","date":"2018.07.12","caseType":"민사","basis":"참조조문","text":"[1] 퇴직금청구권을 미리 포기하기로 하는 약정의 효력 및 근로자가 퇴직하여 더 이상 근로계약관계에 있지 않은 상황에서 퇴직 시 발생한 퇴직금청구권을 나중에 포기하는 것이 허용되는지 여부 [2] 당사자가 표시한 문언에서 의미가 명확하게 드러나지 않는 경우, 법률행위의 해석 방법 [3] 甲이 乙 주식회사에 고용되어 근무하다가 퇴직한 후 약 10개월에 걸쳐 미지급 급여와 퇴직금 등 명목으로 돈을 지급받으면서 ‘본인은 귀사에 밀린 급료를 모두 정리하였으므로 더 이상의 추가 금액을 요구하지 않을 것을 약속합니다’라는 각서를 작성·교부한 사안에서, 甲이 각서를 통해서 퇴직으로 발생한 퇴직금청구권을 사후에 포기한 것으로 보아야 하므로, 乙 회사가 甲에게 퇴직금을 지급할 의무가 없다고 본 원심판단이 정당하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=199858"},{"id":"P:197614","kind":"P","label":"2015다51968","title":"퇴직연금","court":"대법원","date":"2018.05.30","caseType":"민사","basis":"참조조문","text":"[1] 채권압류·추심명령의 ‘압류할 채권의 표시’에 기재된 문언의 해석 방법 및 문언의 의미가 불명확한 경우 그로 인한 불이익을 부담하여야 하는 사람 / 제3채무자가 통상의 주의력을 가진 사회평균인을 기준으로 문언을 이해할 때 포함 여부에 의문을 가질 수 있는 채권이 압류 등의 대상에 포함되었다고 볼 수 있는지 여부 [2] 민사집행법 제246조 제1항 제4호 본문 및 제5호에서 ‘급료·연금·봉급·상여금·퇴직연금, 그 밖에 이와 비슷한 성질을 가진 급여채권의 2분의 1에 해당하는 금액’과 ‘퇴직금 그 밖에 이와 비슷한 성질을 가진 급여채권의 2분의 1에 해당하는 금액’을 압류금지채권으로 규정한 취지 [3] 상법 제388조에서 말하는 이사의 보수에 퇴직금 또는 퇴직위로금도 포함되는지 여부 및 주식회사 이사 등의 보수청구권이 민사집행법 제246조 제1항 제4호 또는 제5호에서 정한 압류금지채권에 해당하는지 여부 [4] 회사가 설정한 퇴직연금 제도에 따라 퇴직연금사업자가 근로기준법상 근로자에 해당하지 않는 이사 등에게 지급하는 퇴직연금이 이사 등의 재직 중 직무수행에 대한 대가로서 지급되는 급여인 경우, 위 퇴직연금 채권이 민사집행법 제246조 제1항 제4호 본문에서 정한 압류금지채권에 해당하는지 여부 및 위 퇴직연금이 이사 등의 재직 중 직무수행에 대한 대가로서 지급되는 급여에 해당하는지 판단하는 방법 [5] 회사 또는 퇴직연금사업자가 이","url":"https://www.law.go.kr/precInfoP.do?precSeq=197614"},{"id":"P:220417","kind":"P","label":"2017나29469","title":"퇴직금","court":"서울중앙지방법원","date":"2018.05.29","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=220417"},{"id":"P:205749","kind":"P","label":"2015도15317","title":"근로기준법위반·근로자퇴직급여보장법위반","court":"대법원","date":"2018.04.24","caseType":"형사","basis":"참조조문","text":"근로자퇴직급여 보장법 제9조와 근로기준법 제36조에서 말하는 근로자 ‘퇴직’의 의미 / 근로계약이 유효하게 존속하여 사용자의 퇴직금지급의무나 금품청산의무가 발생하지 않은 경우, 근로자퇴직급여 보장법 제44조 제1호, 제9조 위반죄 및 근로기준법 제109조 제1항, 제36조 위반죄가 성립하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=205749"},{"id":"P:194913","kind":"P","label":"2017가단16791","title":"대여금","court":"울산지방법원","date":"2018.03.29","caseType":"가사","basis":"참조조문","text":"甲이 乙 주식회사에 대하여 대여금 반환채무를 부담하고 있던 상태에서 사망하자, 甲의 자녀인 丙 등이 상속포기신고를 하였는데, 그 수리심판이 있기 전에 丙 등이 甲의 퇴직금 등의 1/2에 해당하는 금액 등을 수령한 사안에서, 위 수령 행위는 민법 제1026조 제1호가 상속의 단순승인 간주사유로 정한 ‘상속재산에 대한 처분행위’에 해당하지 않으므로, 丙 등의 상속포기의 효력을 부인할 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=194913"},{"id":"P:239811","kind":"P","label":"2015나56314","title":"임금·임금·임금","court":"부산고등법원","date":"2017.12.13","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=239811"},{"id":"P:206216","kind":"P","label":"2016가합109360","title":"임금","court":"서울남부지방법원","date":"2017.08.18","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=206216"},{"id":"P:206218","kind":"P","label":"2016가단22912","title":"퇴직금등","court":"의정부지방법원","date":"2017.08.11","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=206218"},{"id":"P:185524","kind":"P","label":"2016고단7856","title":"근로자퇴직급여보장법위반","court":"부산지방법원","date":"2017.07.14","caseType":"형사","basis":"참조조문","text":"학교법인 甲 대학교 총장으로서 사용자인 피고인이, 甲 대학교에서 사무조수로 근무하다가 학교법인 정관에서 인정하는 사무직원인 부서기로 임용된 후 명예퇴직한 근로자 乙의 사무조수 근무기간 중 일부 기간만 사립학교교직원 연금 수급대상기간으로 처리하고, 연금 수급대상기간에서 제외된 나머지 사무조수 근무기간에 대한 퇴직금을 지급하지 아니하였다고 하여 근로자퇴직급여 보장법 위반으로 기소된 사안에서, 피고인에게 유죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=185524"},{"id":"P:184825","kind":"P","label":"2012다200486","title":"부당이득금반환","court":"대법원","date":"2017.05.11","caseType":"민사","basis":"참조조문","text":"[1] 임용결격자가 공무원으로 임용되어 사실상 근무하여 온 경우, 공무원연금법이나 근로자퇴직급여 보장법에서 정한 퇴직급여를 청구할 수 있는지 여부 및 이와 같은 법리는 임용행위의 하자로 임용행위가 취소되어 소급적으로 지위를 상실한 경우에도 마찬가지로 적용되는지 여부 [2] 임용행위가 당연무효이거나 취소된 공무원의 임용 시부터 퇴직 시까지의 사실상의 근로에 대하여 국가 또는 지방자치단체가 부당이득반환의무를 지는지 여부 및 이때 국가 또는 지방자치단체의 이득액과 임용결격공무원 등이 입은 손해의 내용 / 임용결격공무원 등이 입은 손해가 국가 또는 지방자치단체의 이득액인 공무원연금법상 퇴직급여 상당액을 넘는 경우, 국가 또는 지방자치단체가 반환하여야 할 부당이득액이 공무원연금법상 퇴직급여 상당액으로 제한되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=184825"},{"id":"P:200510","kind":"P","label":"2015나11398","title":"계약무효에따른원상회복등","court":"대전고등법원청주재판부","date":"2017.04.25","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=200510"},{"id":"P:184542","kind":"P","label":"2016다236285","title":"손해배상(자)","court":"대법원","date":"2016.12.29","caseType":"민사","basis":"참조조문","text":"[1] 계속근로기간이 1년에 미달하는 경우, 근로자퇴직급여 보장법에 의한 퇴직금청구권이 발생하는지 여부 [2] 피해자가 사고가 없었더라면 계속 근무하여 받을 수 있었던 일정액의 퇴직금을 사고로 사망함으로써 받지 못하게 된 경우, 가해자가 퇴직금 상당액을 일실이익으로 배상하여야 하는지 여부 및 피해자의 일실퇴직금을 청구하기 위하여 증명하여야 하는 사항 [3] 고용약사로 근무하던 중 교통사고로 사망한 甲의 일실퇴직금 인정 여부가 문제 된 사안에서, 甲이 근무하는 약국을 자주 옮겼고, 종전 직장에서 근무기간이 채 1년이 되지 않는 임시약사로 근무한 점 등 제반 사정에 비추어, 甲의 일실퇴직금을 청구할 수 있는 요건을 모두 갖추었다고 보기 어려운데도, 甲이 사고가 없었더라면 고용상 연령차별금지 및 고령자고용촉진에 관한 법률 제19조에 따라 정년인 60세까지 종전 직장에서 계속근로가 가능하였음을 전제로 甲의 일실퇴직금을 인정한 원심판결에는 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=184542"},{"id":"P:184418","kind":"P","label":"2015다244333","title":"퇴직연금반환등청구","court":"대법원","date":"2016.12.01","caseType":"민사","basis":"참조조문","text":"근로자퇴직급여 보장법 제7조 제1항이 근로기준법 제2조 제1항 제1호에 따른 근로자에게만 적용되는지 여부 및 주식회사의 대표이사에게 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=184418"},{"id":"P:185919","kind":"P","label":"2016노1691","title":"특정경제범죄가중처벌등에관한법률위반(사기)·사기·의료법위반·소비자생활협동조합법위반·근로기준법위반·근로자퇴직급여보장법위반","court":"서울고등법원","date":"2016.11.17","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=185919"},{"id":"P:187878","kind":"P","label":"2016도1060","title":"근로기준법위반·근로자퇴직급여보장법위반[포괄임금약정에 관한 사건]","court":"대법원","date":"2016.10.13","caseType":"형사","basis":"참조조문","text":"포괄임금제에 관한 약정이 성립하였는지 판단하는 기준 및 묵시적 합의에 의한 포괄임금약정이 성립하였다고 인정하기 위한 요건","url":"https://www.law.go.kr/precInfoP.do?precSeq=187878"},{"id":"P:204533","kind":"P","label":"2016나2007607","title":"퇴직금청구의소","court":"서울고등법원","date":"2016.05.18","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=204533"},{"id":"P:180294","kind":"P","label":"2015노1996","title":"근로기준법위반·근로자퇴직급여보장법위반","court":"창원지방법원","date":"2016.01.27","caseType":"형사","basis":"참조조문","text":"사용자인 피고인이 퇴직근로자인 피해자들에 대한 연장근로수당, 주휴수당, 임금 및 퇴직금을 당사자 사이의 합의 없이 지급사유가 발생한 때부터 14일 이내에 지급하지 않았다고 하여 근로기준법 위반 및 근로자퇴직급여 보장법 위반으로 기소된 사안에서, 피고인에게 유죄를 인정한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=180294"},{"id":"P:183726","kind":"P","label":"2015나42147","title":"임금","court":"서울중앙지방법원","date":"2016.01.21","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=183726"},{"id":"P:217223","kind":"P","label":"2014나20823","title":"약정금","court":"부산고등법원창원재판부","date":"2015.12.17","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=217223"},{"id":"P:209304","kind":"P","label":"2015가합1591","title":"손해배상(기)등","court":"부산지방법원","date":"2015.12.10","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=209304"},{"id":"P:179110","kind":"P","label":"2015다204762","title":"배당이의","court":"대법원","date":"2015.08.19","caseType":"민사","basis":"참조조문","text":"[1] 근로기준법 및 구 근로자퇴직급여 보장법에 따라 우선변제청구권을 갖는 임금채권자가 강제집행절차 등에서 배당요구의 종기까지 적법하게 배당요구를 하여야 우선배당을 받을 수 있는지 여부 / 이 경우 ‘최종 3개월분의 임금’과 ‘최종 3년간의 퇴직금’의 의미 및 ‘최종 3년간의 퇴직금’의 경우 배당요구 종기일 이전에 퇴직금 지급사유가 발생하여야 하는지 여부 [2] 우선변제권이 있는 임금채권자가 현재 및 장래의 임금이나 퇴직금 채권을 피담보채권으로 하여 사용자의 재산에 관한 근저당권을 취득한 경우, 배당표가 확정되기 전까지 피담보채권이 우선변제권이 있는 임금채권임을 소명하면 최종 3개월분의 임금이나 최종 3년간의 퇴직금 등에 관한 채권에 대하여 선순위 근저당권자 등보다 우선배당을 받을 수 있는지 여부 / 이 경우 ‘최종 3개월분의 임금’과 ‘최종 3년간의 퇴직금’의 의미 및 ‘최종 3년간의 퇴직금’의 경우 배당요구 종기일 이전에 퇴직금 지급사유가 발생하여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=179110"},{"id":"P:184059","kind":"P","label":"2015고정504","title":"근로기준법위반·근로자퇴직급여보장법위반","court":"창원지방법원","date":"2015.07.08","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=184059"},{"id":"P:183730","kind":"P","label":"2014가단5299599","title":"임금","court":"서울중앙지방법원","date":"2015.07.03","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=183730"},{"id":"P:177590","kind":"P","label":"2014도12753","title":"근로기준법위반·근로자퇴직급여보장법위반","court":"대법원","date":"2015.02.12","caseType":"형사","basis":"참조조문","text":"[1] 사용자가 근로자에 대한 임금이나 퇴직금을 지급할 수 없었던 불가피한 사정이 인정되는 경우, 근로기준법이나 근로자퇴직급여 보장법에서 정하는 임금 및 퇴직금 등의 기일 내 지급의무 위반죄의 책임조각사유가 되는지 여부 [2] 회생절차에서 관리인이 ‘채무자 회생 및 파산에 관한 법률’ 등에 따라 이해관계인의 법률관계를 조정하여 채무자 또는 사업의 효율적인 회생을 도모하는 업무를 수행하는 과정에서 자금 사정 악화나 관리인의 업무수행에 대한 법률상 제한 등에 따라 불가피하게 근로자의 임금 또는 퇴직금을 지급기일 안에 지급하지 못한 경우, 임금 및 퇴직금 등의 기일 내 지급의무 위반죄의 책임조각사유가 있는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=177590"},{"id":"P:202110","kind":"P","label":"2014가합21538","title":"퇴직연금","court":"서울중앙지방법원","date":"2015.02.06","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=202110"},{"id":"P:177673","kind":"P","label":"2011다77290","title":"임금","court":"대법원","date":"2014.12.11","caseType":"민사","basis":"참조조문","text":"[1] 퇴직금 중간정산의 성립시기 / 퇴직금 중간정산이 성립한 후 중간정산 기준일 이전으로 소급하여 임금을 인상하기로 노사 간 합의한 경우, 소급적인 임금인상의 효력이 이미 성립한 퇴직금 중간정산에 관한 법률관계에 영향을 미치는지 여부 [2] 근로자가 일정 기간 동안의 미지급 법정수당을 청구하는 경우, 사용자가 같은 기간 동안 법정수당의 초과 지급 부분이 있음을 이유로 상계나 충당을 주장할 수 있는지 여부 및 상계의 허용 범위 [3] 여러 개의 자동채권으로 한 상계항변이 이유 있고 수동채권의 원리금이 자동채권의 원리금 합계에 미치지 못하는 경우, 법원이 상계의 기판력 범위를 특정하여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=177673"},{"id":"P:187513","kind":"P","label":"2013다64908","title":"임금","court":"대법원","date":"2014.11.20","caseType":"민사","basis":"참조조문","text":"파산선고 전에 생긴 근로자의 임금·퇴직금 및 재해보상금에 대하여 파산관재인이 파산선고 후 변제할 의무의 이행을 지체함으로써 생긴 지연손해금 채권이 채무자 회생 및 파산에 관한 법률 제473조 제4호 소정의 재단채권에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=187513"},{"id":"P:176265","kind":"P","label":"2012다70388","title":"퇴직금","court":"대법원","date":"2014.10.27","caseType":"민사","basis":"참조조문","text":"[1] 최저임금법 제6조 제5항이 신설·시행된 이후 퇴직한 ‘일반택시운송사업에서 운전업무에 종사하는 근로자’가 위 조항에서 정한 최저임금에 미달하는 임금을 받아온 경우, 퇴직금 산정 방법 [2] 甲이 乙 운수회사에 택시기사로 입사하여 최저임금법 제6조 제5항이 신설·시행된 이후 퇴직한 사안에서, 乙 회사는 甲에게 위 조항에 따른 최저임금을 평균임금으로 하여 산정한 퇴직금을 지급할 의무가 있고, 이를 함부로 감액할 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=176265"},{"id":"P:175551","kind":"P","label":"2014나3113","title":"추심금","court":"대구지방법원","date":"2014.09.26","caseType":"민사","basis":"참조조문","text":"甲 보험회사가 乙과 체결한 보증보험계약에 따라 보험금을 지급하고, 乙을 상대로 제기한 구상금청구소송의 확정판결에 따라 乙이 丙 주식회사에 가지는 임금채권 등에 관하여 채권압류 및 추심명령을 받은 사안에서, 乙의 퇴직금에 대한 甲 회사의 압류 및 추심명령이 근로자퇴직급여 보장법 제7조 제1항에 위배되어 무효라고 볼 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=175551"},{"id":"P:187486","kind":"P","label":"2013므2250","title":"이혼등","court":"대법원","date":"2014.07.16","caseType":"가사","basis":"판례내용","text":"부부 일방이 이혼 당시 아직 퇴직하지 아니한 채 직장에 근무하고 있는 경우, 퇴직급여채권이 재산분할의 대상에 포함되는지 여부 및 그 대상 채권의 범위","url":"https://www.law.go.kr/precInfoP.do?precSeq=187486"},{"id":"P:207509","kind":"P","label":"2013나5617","title":"퇴직금","court":"대전지방법원","date":"2014.03.26","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=207509"},{"id":"P:172533","kind":"P","label":"2013다71180","title":"추심금","court":"대법원","date":"2014.01.23","caseType":"민사","basis":"참조조문","text":"[1] 근로자퇴직급여 보장법상 퇴직연금제도의 급여를 받을 권리에 대한 압류명령의 효력 및 제3채무자가 그 압류채권의 추심금 청구에 대하여 위 무효를 들어 지급을 거절할 수 있는지 여부 [2] 민사집행법 제246조 제1항 제4호에도 불구하고 근로자퇴직급여 보장법상 퇴직연금채권 전액에 관하여 압류가 금지되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=172533"},{"id":"P:172309","kind":"P","label":"2012도5875","title":"근로기준법위반","court":"대법원","date":"2013.12.26","caseType":"형사","basis":"참조조문","text":"[1] 근로자퇴직급여 보장법에 따른 퇴직금 지급의무 유무를 판단하기 위하여 ‘상시 근로자’의 수를 산정할 때 근로기준법 시행령 제7조의2가 적용되는지 여부 [2] 근로자퇴직급여 보장법에 따른 퇴직금 지급의무 유무를 판단하기 위하여 ‘상시 근로자’의 수를 산정할 때 기준이 되는 기간 및 상시 근로자 5인 이상인 사업장에 해당하는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=172309"},{"id":"P:175600","kind":"P","label":"2012도10902","title":"근로기준법위반(인정된죄명:근로자퇴직급여보장법위반)","court":"대법원","date":"2013.12.26","caseType":"형사","basis":"참조조문","text":"[1] 근로자퇴직급여 보장법에 따른 퇴직금 지급의무의 존부를 판단하기 위하여 ‘상시 근로자’의 수를 산정할 때 근로기준법 시행령 제7조의2 규정이 적용되는지 여부 [2] 근로자퇴직급여 보장법에 따른 퇴직금 지급의무의 존부를 판단하기 위하여 ‘상시 근로자’의 수를 산정할 때 기준이 되는 기간 및 ‘상시 근로자 5인 이상인 사업장’에 해당하는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=175600"},{"id":"P:171639","kind":"P","label":"2011다1194","title":"교수지위확인등","court":"대법원","date":"2013.11.14","caseType":"민사","basis":"참조조문","text":"[1] 헌법재판소 2003. 3. 27. 선고 2000헌바26 헌법불합치결정 전에 교원에 대한 재임용거부가 위법함에도 헌법불합치결정 이후 학교법인이 재임용심사절차를 재개하지 아니함을 이유로 손해배상책임을 묻기 위해서는 해당 교원의 재심사신청의사가 객관적으로 확인되어야 하는지 여부 및 그 의사는 재임용이 되면 학교법인에서 교원으로 재직하겠다는 진정한 의사가 객관적으로 확인될 수 있어야 인정되는지 여부 [2] 기간임용제 대학교원의 재임용신청의사가 확인되었음에도 재임용심사절차를 재개하지 않은 학교법인의 조치에 고의나 과실이 인정되는지 판단하는 기준 [3] 적법한 재임용심사를 받았더라면 재임용을 받을 수 있었던 사립대학 교원의 재심사신청의사가 객관적으로 확인됨에도 학교법인이 재임용심사절차를 재개하지 아니함을 이유로 한 불법행위가 성립하는 시점 및 그것이 계속적 불법행위에 해당하는지 여부 [4] 사립학교 교원의 일실 퇴직급여를 계산할 때 적용되는 법률","url":"https://www.law.go.kr/precInfoP.do?precSeq=171639"},{"id":"P:166720","kind":"P","label":"2012다77006","title":"퇴직금","court":"대법원","date":"2012.12.13","caseType":"민사","basis":"참조조문","text":"[1] 법무법인에 근무하는 변호사의 근로자 해당 여부 판단 기준 [2] 사법연수원 수료 직후 甲 법무법인에 취업하여 변호사 업무를 시작한 乙과 丙이, 취업 다음 해부터 구성원 변호사로 등기되어 근무하다 퇴직한 후 자신들이 근로자에 해당한다고 주장하며 퇴직금 지급을 구한 사안에서, 乙과 丙이 근로자 지위에 있었다고 본 원심판단을 수긍한 사례 [3] 퇴직금 분할 약정의 효력과 위 약정에 따라 사용자가 근로자에게 퇴직금 명목의 금원을 지급하였으나 퇴직금 지급의 효력뿐만 아니라 임금 지급의 효력도 인정되지 않는 경우, 근로자가 지급받은 금원을 부당이득으로 반환하여야 하는지 여부 및 위 법리 적용의 전제로서 퇴직금 분할 약정이 존재하는지에 관한 판단 기준 [4] 甲 법무법인에서 변호사로 근무하다 퇴직한 乙과 丙이 甲 법무법인을 상대로 퇴직금 지급을 청구하자 甲 법무법인이 乙과 丙은 퇴직금이 포함된 총액 연봉제 약정에 따라 이미 퇴직금을 수령하였으므로 이중청구에 해당한다고 주장한 사안에서, 甲 법무법인과 乙, 丙 사이에 실질적인 퇴직금 분할 약정이 존재하였다고 인정할 증거가 없다는 이유로 위 주장을 배척한 원심판단을 수긍한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=166720"},{"id":"P:173068","kind":"P","label":"2012노10","title":"근로기준법위반","court":"의정부지방법원","date":"2012.04.27","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=173068"},{"id":"P:163588","kind":"P","label":"2011가합5752","title":"배당이의","court":"창원지방법원","date":"2012.04.05","caseType":"민사","basis":"참조조문","text":"甲, 乙 및 丙 주식회사로 순차적으로 소유 명의가 변경되었던 공장 건물 등에 관하여 丁 주식회사가 소유권이전등기를 마친 후 丙 회사가 그 전에 설정하였던 근저당권의 피담보채무를 인수하여 근저당권변경등기를 마쳤는데, 그 후 근저당권 실행으로 인한 경매절차에서 丁 회사의 근로자였던 戊 등이 임금채권 등의 우선변제를 주장한 사안에서, 근저당권설정등기가 마쳐질 당시 사업체 인적·물적 시설이 동일성을 유지하면서 그대로 丁 회사에 이전되었으므로, 채용시기를 불문하고 戊 등의 최종 3개월분 임금과 최종 3년분 퇴직금 지급청구권은 위 근저당권에 우선한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=163588"},{"id":"P:158790","kind":"P","label":"2011다42324","title":"퇴직금등","court":"대법원","date":"2011.10.27","caseType":"민사","basis":"참조조문","text":"[1] 근로기준법 제27조에서 근로자에 대한 해고는 해고사유와 해고시기를 서면으로 통지하여야 효력이 있다고 정한 취지와 위 서면에 해고사유를 기재하는 방법 및 징계해고 통보서에 징계대상자가 위반한 단체협약이나 취업규칙의 조문만을 나열하는 것으로 해고사유의 기재가 충분히 이루어졌다고 볼 수 있는지 여부 [2] 사용자가 근로자를 징계해고하면서 해고통보서 등에 근로자의 어떠한 행위가 사규 위반에 해당하여 징계사유와 해고사유가 되는지를 전혀 기재하지 않은 사안에서, 위 해고에는 절차상 근로기준법 제27조를 위반한 위법이 있다고 본 원심판단을 정당하다고 한 사례 [3] 甲 주식회사가 감사실장인 임원 乙에 대한 징계해고를 하면서, 회사와 경영진에 대한 비방, 감사결과의 독단적 작성, 회사의 업무상 기밀 및 감사 내용 누설, 법인카드 무단사용, 무단결근 등을 징계사유로 삼은 사안에서, 위 징계사유가 인정되지 않을 뿐만 아니라 설령 인정되더라도 그 사유만으로는 사회통념상 고용관계를 계속할 수 없을 정도로 책임 있는 사유가 乙에게 있다고 할 수 없다고 본 원심판단을 정당하다고 한 사례 [4] 근로자의 재직기간 중 일부를 퇴직금 산정 기초가 되는 근속기간에서 제외하는 것이 허용되는지 여부 [5] 甲 주식회사에 고문으로 위촉되어 입사하였다가 그 후 임원인 전무로 승진하여 입사 이래 계속 감사실장으로 근무하여 온 乙의 퇴직금 산정 기초가 되는 근속기간이 ","url":"https://www.law.go.kr/precInfoP.do?precSeq=158790"},{"id":"P:162431","kind":"P","label":"2009도8248","title":"근로기준법 위반(인정된죄명:근로자퇴직급여보장법 위반)","court":"대법원","date":"2011.10.13","caseType":"형사","basis":"참조조문","text":"[1] 사용자가 근로자에게 매월 지급하는 월급이나 매일 지급하는 일당과 함께 일정 금액의 퇴직금을 미리 지급하기로 한 ‘퇴직금 분할 약정’의 효력 및 위 약정에 따라 사용자가 근로자에게 퇴직금 명목의 금원을 지급한 경우 퇴직금 지급의 효력이 있는지 여부 [2] 퇴직금 지급의무의 존부와 범위에 관하여 다툴 만한 근거가 있는 경우, 사용자에게근로자퇴직급여 보장법 제31조,제9조 위반죄의 고의를 인정할 수 있는지 여부 및 퇴직금 등 지급의무의 존부와 범위에 관하여 다툴 만한 근거가 있는지 판단하는 기준 [3] 사용자인 피고인이 근로자들의 퇴직금을 퇴직일로부터 14일이 경과하도록 지급하지 않았다는 내용으로 기소된 사안에서, 제반 사정을 종합할 때 퇴직금 지급의무의 존부에 관하여 다툴 만한 근거가 있어 피고인에게근로자퇴직급여 보장법 제31조,제9조 위반죄의 고의가 있었다고 단정하기 어렵다는 이유로 이와 달리 보아 유죄를 인정한 원심판결에 법리오해 또는 심리미진의 위법이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=162431"},{"id":"P:161736","kind":"P","label":"2011다22061","title":"임금","court":"대법원","date":"2011.09.08","caseType":"민사","basis":"참조조문","text":"[1] 통상임금의 의의 [2] 지방자치단체가 환경미화원들에게 지급해 온 근속가산금, 급량비, 교통보조비, 위생수당, 위험수당, 기말수당, 정근수당, 체력단련비, 명절휴가비가 통상임금에 포함되는지 문제된 사안에서, 위 금품들이 모두 통상임금에 포함된다고 본 원심판단을 정당하다고 한 사례 [3] 근로자들의 개별적 동의나 수권 없이 단체협약으로 근로자에게 이미 지급한 임금을 반환하도록 할 수 있는지 여부 [4] 사용자가 계산 착오 등으로 초과 지급한 임금의 반환청구권을 자동채권으로 하여 근로자의 임금채권이나 퇴직금채권과 상계할 수 있는지 여부 [5] 퇴직한 환경미화원들이 재직 중 발생한 미지급 수당 등의 지급을 구하자, 지방자치단체가 행정자치부 지침의 오인 등으로 휴일근무수당을 초과 지급하였다는 이유로 초과 지급한 휴일근무수당의 반환채권을 자동채권으로 하여 미지급 휴일근무수당청구권과 상계를 주장한 사안에서, 상계가 허용된다고 본 원심판단을 정당하다고 한 사례 [6] 어느 사업장의 취업규칙이나 단체협약 등에서 퇴직금 산정 기초가 되는 ‘평균임금’이 근로기준법상 평균임금을 의미하는지와 어떤 급여가 거기에 포함되는지에 관한 판단 방법 [7] 단체협약상 퇴직금 산정 기초로 삼은 ‘평균임금’이 근로기준법 또는 근로자퇴직급여 보장법의 평균임금을 의미하는지 문제된 사안에서, 단체협약상 ‘평균임금’은 근로기준법 또는 근로자퇴직급여 보장법의 평균임금이 아","url":"https://www.law.go.kr/precInfoP.do?precSeq=161736"},{"id":"P:161703","kind":"P","label":"2011다27134","title":"임금등","court":"대법원","date":"2011.08.18","caseType":"민사","basis":"참조조문","text":"[1] 어느 사업장의 취업규칙이나 단체협약 등에서 퇴직금 산정 기초가 되는 ‘평균임금’이 근로기준법상 평균임금을 의미하는지 또는 어떤 급여가 거기에 포함되는지 여부에 관한 판단 방법 [2] 단체협약상 퇴직금 산정 기초가 되는 ‘평균임금’ 또는 ‘월평균보수액’이 근로기준법이나 근로자퇴직급여 보장법상 평균임금을 의미하는지가 문제된 사안에서, 단체협약의 ‘평균임금’ 또는 ‘월평균보수액’은 근로기준법이나 근로자퇴직급여 보장법의 평균임금이 아니라 ‘단체협약상 노사간 합의로 제한된 통상임금에 따라 각종 수당을 산정하여 근로자들에게 지급할 임금의 평균액’을 의미한다고 본 원심판단을 정당하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=161703"},{"id":"P:163322","kind":"P","label":"2011노74","title":"근로기준법 위반(인정된죄명:근로자퇴직급여보장법 위반)","court":"대구지방법원","date":"2011.06.14","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=163322"},{"id":"P:153096","kind":"P","label":"2010나3094","title":"퇴직금등","court":"부산고등법원","date":"2011.05.04","caseType":"민사","basis":"참조조문","text":"[1] 근로자의 퇴직금 중간정산 요구만으로 사용자에게 퇴직금 지급의무가 발생하는지 여부 [2] 우체국에서 근무하는 보험관리사가 근로기준법상 근로자에 해당하지 않는다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=153096"},{"id":"P:163298","kind":"P","label":"2010고정334","title":"근로기준법위반","court":"대구지방법원서부지원","date":"2010.12.15","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=163298"},{"id":"P:172768","kind":"P","label":"2009나7244","title":"교수지위확인등","court":"대구고등법원","date":"2010.12.02","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=172768"},{"id":"P:159868","kind":"P","label":"2010노1638","title":"근로 기준법 위반(인정된 죄명:근로자 퇴직급여 보장법 위반)","court":"인천지방법원","date":"2010.10.22","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=159868"},{"id":"P:146821","kind":"P","label":"2009가합18688","title":"퇴직금","court":"서울남부지방법원","date":"2010.09.17","caseType":"민사","basis":"판례내용","text":"甲 회사와 배송용역계약을 체결하고 배송센터에서 배송기사로 근무한 자들이 근로기준법상 ‘근로자’에 해당하는지 여부가 문제된 사안에서, 실질적으로는 甲 회사로부터 업무의 내용 및 업무수행과정 등에 관하여 상당한 지휘·감독을 받으면서 근로를 제공한 근로자의 지위에 있었다고 보아야 한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=146821"},{"id":"P:215641","kind":"P","label":"2009다68774","title":"임금등","court":"대법원","date":"2010.01.14","caseType":"민사","basis":"판례내용","text":"[1] 단체협약에 관하여 노동위원회가 제시한 견해의 객관적 의미가 명확하게 드러나지 않는 경우, 그 해석 방법 [2] \"단체협약에 10년 이상 근속자에 대한 퇴직금누진율 적용에 관한 별도규정이 없으므로 10년 이상 11년 도달 이전까지는 단체협약 규정대로 산정하고, 11년 초과근무 기간에 대해서는 근로기준법에 정해진 지급률로 산정해야 한다\"는 내용의 노동위원회의 제시 견해는, \"단체협약에 정함이 있는 10년부터 11년 미만 ‘근속자’에 대한 지급률은 435일로 산정하고, 그 정함이 없는 11년 이상 ‘근속자’에 대하여는 지급률 중 위 단체협약상 지급률 적용대상이 아닌 부분은 근로기준법에 따라서 지급률을 산정한다\"라고 해석함이 합리적이라고 본 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=215641"},{"id":"P:134214","kind":"P","label":"2008나21324","title":"퇴직금","court":"수원지방법원","date":"2009.04.22","caseType":"민사","basis":"참조조문","text":"[1] 장래의 근로기간에 대한 퇴직금을 미리 정산하여 매월 임금과 함께 지급하기로 한 약정은, 근로자퇴직급여 보장법에 정한 퇴직금 중간정산에 해당하지 않고근로기준법 제34조에 위배되어 퇴직금의 지급으로서의 효력도 없다고 한 사례 [2] 장래의 근로기간에 대한 퇴직금 정산 약정에 따라 사용자가 근로자에게 ‘퇴직금 월정산액’이라는 명목으로 매월 지급한 돈은 그 명칭에도 불구하고 통상임금의 일부에 해당한다고 보아야 하므로, 근로자가 부당이득을 얻었다고 할 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=134214"},{"id":"P:69089","kind":"P","label":"2007도3725","title":"근로기준법위반","court":"대법원","date":"2007.11.16","caseType":"형사","basis":"참조조문","text":"[1] 사용자가 근로자와 매월 임금 속에 퇴직금이란 명목으로 일정한 금원을 지급하기로 약정하고 이를 지급한 경우,근로자퇴직급여 보장법 제8조 제1항에서 정하는 퇴직금 지급으로서의 효력이 있는지 여부 [2] 사용자가 근로자들과 근로계약을 체결하면서 매월 임금에 퇴직적립금을 합산하여 지급하기로 약정하고 그들로부터 ‘매월 급여 수령시 퇴직금을 정산하여 지급받기를 희망하며 퇴직시 회사에 퇴직금에 관한 일체의 이의를 제기하지 않을 것을 확약합니다’라는 내용의 ‘퇴직금 중간정산 신청서’를 받았다 하더라도, 퇴직금 지급 내지 퇴직금 중간정산의 효력을 인정할 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=69089"},{"id":"P:70734","kind":"P","label":"2006나12992","title":"퇴직금","court":"인천지방법원","date":"2007.04.05","caseType":"민사","basis":"참조조문","text":"[1] 사용자가 근로자에게 퇴직금 명목으로 매월 정기적·일률적으로 지급한 돈은 근로의 대가로서 임금의 일부에 해당하므로, 퇴직금 산정을 위한 평균임금의 기초가 되는 퇴직일 이전 3개월간에 지급된 임금 총액에 이를 포함시켜야 한다고 한 사례 [2] 퇴직금을 일당 속에 포함하여 지급하는 약정의 효력 [3]근로자퇴직급여 보장법 제8조 제2항에 의한 중간정산이 적법·유효하기 위하여는 근로자의 명시적 요구가 있어야 하는지 여부 [4] 사용자가 초과지급된 임금의 부당이득반환청구권을 자동채권으로 하여 근로자의 임금채권과 상계할 수 있는 경우","url":"https://www.law.go.kr/precInfoP.do?precSeq=70734"},{"id":"P:398166","kind":"P","label":"","title":"소액체당금지급청구서반려처분취소","court":"","date":"0001.01.01","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=398166"}],"edges":[{"source":"L:24","target":"D:18","kind":"delegates","weight":1},{"source":"L:23-3","target":"D:16-5","kind":"delegates","weight":1},{"source":"L:33","target":"R:12","kind":"delegates","weight":1},{"source":"L:33","target":"D:35","kind":"delegates","weight":1},{"source":"L:23-5","target":"D:16-9","kind":"delegates","weight":1},{"source":"L:21-2","target":"R:8-2","kind":"delegates","weight":1},{"source":"L:18-2","target":"D:9-3","kind":"delegates","weight":1},{"source":"L:24","target":"D:17-2","kind":"delegates","weight":1},{"source":"L:28","target":"D:23","kind":"delegates","weight":1},{"source":"L:21-3","target":"D:13-3","kind":"delegates","weight":1},{"source":"L:32","target":"D:33","kind":"delegates","weight":1},{"source":"L:30","target":"R:10","kind":"delegates","weight":1},{"source":"L:16","target":"D:7","kind":"delegates","weight":1},{"source":"L:25","target":"D:19","kind":"delegates","weight":1},{"source":"L:21-2","target":"R:8-4","kind":"delegates","weight":1},{"source":"L:23-14","target":"D:16-15","kind":"delegates","weight":1},{"source":"L:23","target":"D:15","kind":"delegates","weight":1},{"source":"L:22","target":"D:14","kind":"delegates","weight":1},{"source":"L:23-2","target":"D:16-3","kind":"delegates","weight":1},{"source":"L:38","target":"D:40","kind":"delegates","weight":1},{"source":"L:23-4","target":"D:16-6","kind":"delegates","weight":1},{"source":"L:32","target":"D:32","kind":"delegates","weight":1},{"source":"L:38","target":"D:38","kind":"delegates","weight":1},{"source":"L:16","target":"R:4-2","kind":"delegates","weight":1
