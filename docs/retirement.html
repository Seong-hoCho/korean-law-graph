<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>근로자퇴직급여 보장법 참조 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
/* Layout: 법 조문을 장(章) 순서대로 둥글게 놓은 '조문 바퀴' — 안쪽 원이 법, 그 바깥이 시행령, 가장 바깥이 판례·다른 법령. 넓은 화면은 오른쪽 패널, 좁은 화면은 아래 패널(선택 중에는 바닥 시트)에 선택한 조문의 연결 관계를 보여 준다. */
:root {
  --bg: #f2eee4;
  --surface: #fffdf7;
  --fg: #231f19;
  --muted: #675e51;
  --line: #dbd2c2;
  --law: #1f4b89;
  --decree: #b26b12;
  --prec: #8a3a6c;
  --rule: #2c8577;
  --ext: #7d7264;
  --cite: #3d7cb5;
  --sel: var(--fg); /* 선택·초점 표시는 따로 강조색을 두지 않고 먹색 */
  --font-display: "Nanum Myeongjo", "Noto Serif KR", "Batang", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16140f; --surface: #1f1c16; --fg: #ece6da; --muted: #a59c8c; --line: #353026;
    --law: #76a0db; --decree: #e3a14a; --prec: #d27fb2; --rule: #5cc2b1; --ext: #b3a898; --cite: #7fb2e3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16140f; --surface: #1f1c16; --fg: #ece6da; --muted: #a59c8c; --line: #353026;
  --law: #76a0db; --decree: #e3a14a; --prec: #d27fb2; --rule: #5cc2b1; --ext: #b3a898; --cite: #7fb2e3;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.55;
  word-break: keep-all; overflow-wrap: break-word;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 40px;
}
.wrap { max-width: 1440px; margin: 0 auto; display: grid; gap: 24px; }
header { display: grid; gap: 6px; }
.eyebrow { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(33px, 3.4vw, 46px); line-height: 1.2; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 70ch; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.stats b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

/* 넓은 화면은 패널을 그래프 왼쪽에, 좁은 화면은 문서 순서대로 그래프 아래에 */
.main { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 24px; align-items: start; }
.main > .panel { order: -1; }
@media (max-width: 960px) { .main { grid-template-columns: minmax(0, 1fr); } .main > .panel { order: 0; } }

.stage { background: var(--surface); border-radius: 2px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
/* 초점 표시: 바깥선 대신 상자 면 색 틈 + 먹색 반투명 고리 */
:root { --ring: 0 0 0 2px var(--surface), 0 0 0 4px color-mix(in srgb, var(--sel) 55%, transparent); --ease: 160ms cubic-bezier(.2, .7, .3, 1); }
:where(button, a, input, [tabindex]):focus-visible { outline: none; box-shadow: var(--ring); }

.search { position: relative; flex: 1 1 220px; min-width: 0; }
.search input { width: 100%; font: inherit; font-size: 13px; height: 36px; padding: 0 34px 0 34px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg);
  transition: border-color var(--ease), background-color var(--ease), box-shadow var(--ease); }
.search input::placeholder { color: var(--muted); }
.search input:hover { border-color: color-mix(in srgb, var(--muted) 55%, var(--line)); }
.search input:focus { background: var(--surface); border-color: var(--muted); }
.search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }
.search-icon { position: absolute; left: 11px; top: 18px; translate: 0 -50%; width: 15px; height: 15px; color: var(--muted); pointer-events: none; }
.search-clear { position: absolute; right: 5px; top: 18px; translate: 0 -50%; width: 26px; height: 26px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer;
  transition: background-color var(--ease), color var(--ease); }
.search-clear:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); color: var(--fg); }
.search-clear svg { width: 14px; height: 14px; }
/* 검색어가 없으면(placeholder가 보이면) 지우기 버튼을 숨긴다 */
.search input:placeholder-shown ~ .search-clear { display: none; }
.results { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 2px; max-height: 300px; overflow-y: auto; box-shadow: 0 8px 24px rgb(0 0 0 / .12); }
/* 연결 종류 칩: 켜지면 종류 색이 은은하게 깔리고, 꺼지면 테두리만 남는다 (--c는 HTML에서 종류마다 지정) */
.toggles { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; }
label.tog { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 10px; border: 1px solid var(--line); border-radius: 999px;
  color: var(--muted); background: transparent; cursor: pointer; user-select: none;
  transition: background-color var(--ease), border-color var(--ease), color var(--ease), box-shadow var(--ease); }
label.tog:hover { border-color: color-mix(in srgb, var(--c) 45%, var(--line)); color: var(--fg); }
label.tog input { position: absolute; inset: 0; margin: 0; opacity: 0; appearance: none; -webkit-appearance: none; cursor: pointer; border-radius: inherit; }
label.tog:has(input:checked) { color: var(--fg); background: color-mix(in srgb, var(--c) 13%, var(--surface)); border-color: color-mix(in srgb, var(--c) 50%, var(--line)); }
label.tog:has(input:checked):hover { background: color-mix(in srgb, var(--c) 20%, var(--surface)); }
label.tog:has(input:focus-visible) { box-shadow: var(--ring); }
label.tog input:focus-visible { box-shadow: none; }
.swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; background: var(--c); opacity: .35; transition: opacity var(--ease); }
label.tog:has(input:checked) .swatch { opacity: 1; }
/* :has를 모르는 브라우저는 체크박스를 그대로 보여 준다 */
@supports not selector(:has(*)) {
  label.tog input { position: static; opacity: 1; appearance: auto; -webkit-appearance: checkbox; accent-color: var(--fg); }
  .swatch { opacity: 1; }
}
.btn { font: inherit; font-size: 12.5px; padding: 6px 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 6px; cursor: pointer;
  transition: background-color var(--ease), border-color var(--ease), color var(--ease), box-shadow var(--ease); }
.btn:hover { border-color: var(--muted); background: color-mix(in srgb, var(--fg) 5%, var(--bg)); }
.btn:active { background: color-mix(in srgb, var(--fg) 9%, var(--bg)); }
.canvas { position: relative; }
.canvas .btn { position: absolute; top: 10px; right: 10px; z-index: 2; background: var(--surface); }
#cy { width: 100%; height: min(78vh, 820px); min-height: 440px; }
@media (max-width: 600px) {
  body { padding-block: 20px 32px; }
  .wrap, .main { gap: 16px; }
  h1 { font-size: 33px; }
  header { gap: 4px; }
  .lede { font-size: 13px; }
  .stats { font-size: 12.5px; gap: 2px 12px; }
  .toolbar { padding: 8px 10px; gap: 8px; }
  .toggles { gap: 4px 10px; }
  .swatch { width: 10px; }
  #cy { height: 70svh; min-height: 360px; }
  aside.panel { padding: 16px; }
}

aside.panel { background: var(--surface); border-radius: 2px; padding: 22px; display: grid; gap: 16px; min-width: 0; max-height: calc(min(78vh, 820px) + 63px); overflow-y: auto; }
@media (max-width: 960px) {
  aside.panel { max-height: none; }
  /* 선택 중에는 패널을 바닥 시트로 띄워, 그래프와 원문을 한 화면에서 본다 */
  aside.panel.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-height: 45svh; border-radius: 2px 2px 0 0; border-top: 1px solid var(--line);
    box-shadow: 0 -6px 24px rgb(0 0 0 / .16); padding: 14px max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  body.sheet-open { padding-bottom: calc(45svh + 32px); }
}
.panel h2 { font-family: var(--font-display); font-size: 22px; margin: 0; line-height: 1.25; text-wrap: balance; }
.panel h3 { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; margin: 0 0 6px; }
.kindtag { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
/* 종류 색(주황·청록 등)은 글자 대비가 모자라므로 테두리에만 쓰고 글자는 본문색 */
.chip { display: inline-flex; align-items: center; font-size: 11px; padding: 1px 7px; border-radius: 1px; border: 1px solid var(--k, currentColor); color: var(--fg); }
.lawtext { white-space: pre-wrap; font-size: 13px; line-height: 1.65; background: var(--bg); border-radius: 1px; padding: 10px 12px; max-height: 260px; overflow-y: auto; }
.list { display: grid; gap: 2px; }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: baseline; text-align: left; font: inherit; font-size: 13px; padding: 8px 6px; border: 0; background: none; color: var(--fg); border-radius: 1px; cursor: pointer; width: 100%; }
.item { transition: background-color var(--ease); }
.item:hover { background: var(--bg); }
.item:active { background: color-mix(in srgb, var(--fg) 7%, var(--bg)); }
/* 패널 빈 상태: 아무것도 선택하지 않았을 때 맨 위 안내 */
.empty { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 18px 12px 20px; border: 1px dashed var(--line); border-radius: 2px; color: var(--muted); }
.empty svg { width: 30px; height: 30px; color: var(--law); }
.empty p { margin: 0; font-size: 13px; max-width: 22em; text-wrap: balance; }
.item .no { font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.item .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 4px; border-radius: 1px; margin-top: 3px; grid-column: 2 / 4; }
.more { font-size: 12px; color: var(--muted); padding: 2px 6px; }
.note { font-size: 12.5px; color: var(--muted); }
a { color: var(--law); }
footer { font-size: 12.5px; color: var(--muted); display: grid; gap: 6px; max-width: 90ch; }
footer p { margin: 0; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1>근로자퇴직급여 보장법 참조 지도</h1>
    <p class="lede">근로자퇴직급여 보장법 조문을 장 순서대로 둥글게 놓고, 하위 법령 위임·조문 인용·판례 연결을 한 그림에 모았습니다. 조문이나 판례를 누르면 연결된 것만 남고 원문과 연결 목록이 나옵니다.</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="main">
    <section class="stage" aria-label="참조 그래프">
      <div class="toolbar">
        <div class="search">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="조문 번호·제목·사건번호 검색 (예: 17, 영 3, 국외 이전, 2023도)" autocomplete="off" aria-label="검색">
          <button class="search-clear" id="q-clear" type="button" aria-label="검색어 지우기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
          <div class="results" id="results" hidden></div>
        </div>
        <div class="toggles" role="group" aria-label="연결 종류">
          <label class="tog" style="--c:var(--decree)"><input type="checkbox" id="t-delegates" checked><span class="swatch"></span>위임</label>
          <label class="tog" style="--c:var(--cite)"><input type="checkbox" id="t-cites" checked><span class="swatch"></span>조문 인용</label>
          <label class="tog" style="--c:var(--prec)"><input type="checkbox" id="t-precedent" checked><span class="swatch"></span>판례</label>
          <label class="tog" style="--c:var(--ext)"><input type="checkbox" id="t-external"><span class="swatch"></span>다른 법령</label>
        </div>
      </div>
      <div class="canvas">
        <div id="cy"></div>
        <button class="btn" id="reset" type="button">전체 보기</button>
      </div>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>

  <footer id="foot"></footer>
</div>

<script>
const G = {"meta":{"main":"근로자퇴직급여 보장법","tiers":{"L":{"name":"근로자퇴직급여 보장법","efYd":"20260918","promul":"20260317"},"D":{"name":"근로자퇴직급여 보장법 시행령","efYd":"20260324","promul":"20260324"},"R":{"name":"근로자퇴직급여 보장법 시행규칙","efYd":"20220712","promul":"20220712"}},"precedentsListed":242,"precedentsTotal":242,"precedentsUnavailable":74,"precedentsFrom":"0001.01.01","precedentBasis":{"참조조문":54,"판결요지":0,"판례내용":41,"없음":73},"source":"법제처 국가법령정보 공동활용 Open API (DRF)"},"nodes":[{"id":"L:1","label":"법 제1조","title":"목적","chapter":"제1장 총칙","deleted":false,"text":"제1조(목적) 이 법은 근로자 퇴직급여제도의 설정 및 운영에 필요한 사항을 정함으로써 근로자의 안정적인 노후생활 보장에 이바지함을 목적으로 한다.","kind":"L"},{"id":"L:2","label":"법 제2조","title":"정의","chapter":"제1장 총칙","deleted":false,"text":"1. \"근로자\"란 「근로기준법」 제2조제1항제1호에 따른 근로자를 말한다.\n2. \"사용자\"란 「근로기준법」 제2조제1항제2호에 따른 사용자를 말한다.\n3. \"임금\"이란 「근로기준법」 제2조제1항제5호에 따른 임금을 말한다.\n4. \"평균임금\"이란 「근로기준법」 제2조제1항제6호에 따른 평균임금을 말한다.\n5. \"급여\"란 퇴직급여제도나 제25조에 따른 개인형퇴직연금제도에 의하여 근로자에게 지급되는 연금 또는 일시금을 말한다.\n6. \"퇴직급여제도\"란 확정급여형퇴직연금제도, 확정기여형퇴직연금제도, 중소기업퇴직연금기금제도 및 제8조에 따른 퇴직금제도를 말한다.\n7. \"퇴직연금제도\"란 확정급여형퇴직연금제도, 확정기여형퇴직연금제도 및 개인형퇴직연금제도를 말한다.\n8. \"확정급여형퇴직연금제도\"란 근로자가 받을 급여의 수준이 사전에 결정되어 있는 퇴직연금제도를 말한다.\n9. \"확정기여형퇴직연금제도\"란 급여의 지급을 위하여 사용자가 부담하여야 할 부담금의 수준이 사전에 결정되어 있는 퇴직연금제도를 말한다.\n10. \"개인형퇴직연금제도\"란 가입자의 선택에 따라 가입자가 납입한 일시금이나 사용자 또는 가입자가 납입한 부담금을 적립ㆍ운용하기 위하여 설정한 퇴직연금제도로서 급여의 수준이나 부담금의 수준이 확정되지 아니한 퇴직연금제도를 말한다.\n11. \"가입자\"란 퇴직연금제도 또는 중소기업퇴직연금기금제도에 가입한 사람을 말한다.\n12. \"적립금\"이란 가입자의 퇴직 등 지급사유가 발생할 때에 급여를 지급하기 위하여 사용자 또는 가입자가 납입한 부담금으로 적립된 자금을 말한다.\n13. \"퇴직연금사업자\"란 퇴직연금제도의 운용관리업무 및 자산관리업무를 수행하기 위하여 제26조에 따라 등록한 자를 말한다.\n14. \"중소기업퇴직연금기금제도\"란 중소기업(상시 100명 미만의 근로자를 사용하는 사업에 한정한다. 이하 같다) 근로자의 안정적인 노후생활 보장을 지원하기 위하여 둘 이상의 중소기업 사용자 및 근로자가 납입한 부담금 등으로 공동의 기금을 조성ㆍ운영하여 근로자에게 급여를 지급하는 제도를 말한다.\n15. \"사전지정운용제도\"란 가입자가 적립금의 운용방법을 스스로 선정하지 아니한 경우 사전에 지정한 운용방법으로 적립금을 운용하는 제도를 말한다.\n16. \"사전지정운용방법\"이란 사전지정운용제도에 따라 적립금을 운용하기 위하여 제21조의2제1항에 따라 승인을 받은 운용방법을 말한다.\n제2조(정의) 이 법에서 사용하는 용어의 뜻은 다음과 같다. <개정 2021.4.13, 2022.1.11, 2026.3.17>","kind":"L"},{"id":"L:3","label":"법 제3조","title":"적용범위","chapter":"제1장 총칙","deleted":false,"text":"제3조(적용범위) 이 법은 근로자를 사용하는 모든 사업 또는 사업장(이하 \"사업\"이라 한다)에 적용한다. 다만, 동거하는 친족만을 사용하는 사업 및 가구 내 고용활동에는 적용하지 아니한다.","kind":"L"},{"id":"L:4","label":"법 제4조","title":"퇴직급여제도의 설정","chapter":"제2장 퇴직급여제도의 설정","deleted":false,"text":"① 사용자는 퇴직하는 근로자에게 급여를 지급하기 위하여 퇴직급여제도 중 하나 이상의 제도를 설정하여야 한다. 다만, 계속근로기간이 1년 미만인 근로자, 4주간을 평균하여 1주간의 소정근로시간이 15시간 미만인 근로자에 대하여는 그러하지 아니하다.\n② 제1항에 따라 퇴직급여제도를 설정하는 경우에 하나의 사업에서 급여 및 부담금 산정방법의 적용 등에 관하여 차등을 두어서는 아니 된다.\n③ 사용자가 퇴직급여제도를 설정하거나 설정된 퇴직급여제도를 다른 종류의 퇴직급여제도로 변경하려는 경우에는 근로자의 과반수가 가입한 노동조합이 있는 경우에는 그 노동조합, 근로자의 과반수가 가입한 노동조합이 없는 경우에는 근로자 과반수(이하 \"근로자대표\"라 한다)의 동의를 받아야 한다.\n④ 사용자가 제3항에 따라 설정되거나 변경된 퇴직급여제도의 내용을 변경하려는 경우에는 근로자대표의 의견을 들어야 한다. 다만, 근로자에게 불리하게 변경하려는 경우에는 근로자대표의 동의를 받아야 한다.\n제4조(퇴직급여제도의 설정)","kind":"L"},{"id":"L:5","label":"법 제5조","title":"새로 성립된 사업의 퇴직급여제도","chapter":"제2장 퇴직급여제도의 설정","deleted":false,"text":"제5조(새로 성립된 사업의 퇴직급여제도) 법률 제10967호 근로자퇴직급여 보장법 전부개정법률 시행일 이후 새로 성립(합병ㆍ분할된 경우는 제외한다)된 사업의 사용자는 근로자대표의 의견을 들어 사업의 성립 후 1년 이내에 확정급여형퇴직연금제도나 확정기여형퇴직연금제도를 설정하여야 한다.","kind":"L"},{"id":"L:6","label":"법 제6조","title":"가입자에 대한 둘 이상의 퇴직연금제도 설정","chapter":"제2장 퇴직급여제도의 설정","deleted":false,"text":"① 사용자가 가입자에 대하여 확정급여형퇴직연금제도 및 확정기여형퇴직연금제도를 함께 설정하는 경우 제15조 및 제20조제1항에도 불구하고 확정급여형퇴직연금제도의 급여 및 확정기여형퇴직연금제도의 부담금 수준은 다음 각 호에 따른다.\n1. 확정급여형퇴직연금제도의 급여: 제15조에 따른 급여수준에 확정급여형퇴직연금규약으로 정하는 설정 비율을 곱한 금액\n2. 확정기여형퇴직연금제도의 부담금: 제20조제1항의 부담금의 부담 수준에 확정기여형퇴직연금규약으로 정하는 설정 비율을 곱한 금액\n② 사용자는 제1항제1호 및 제2호에 따른 각각의 설정 비율의 합이 1 이상이 되도록 퇴직연금규약을 정하여 퇴직연금제도를 설정하여야 한다.\n제6조(가입자에 대한 둘 이상의 퇴직연금제도 설정)","kind":"L"},{"id":"L:7","label":"법 제7조","title":"수급권의 보호","chapter":"제2장 퇴직급여제도의 설정","deleted":false,"text":"① 퇴직연금제도(중소기업퇴직연금기금제도를 포함한다. 이하 이 조에서 같다)의 급여를 받을 권리는 양도 또는 압류하거나 담보로 제공할 수 없다. <개정 2021.4.13>\n② 제1항에도 불구하고 가입자는 주택구입 등 대통령령으로 정하는 사유와 요건을 갖춘 경우에는 대통령령으로 정하는 한도에서 퇴직연금제도의 급여를 받을 권리를 담보로 제공할 수 있다. 이 경우 제26조에 따라 등록한 퇴직연금사업자[중소기업퇴직연금기금제도의 경우 「산업재해보상보험법」 제10조에 따른 근로복지공단(이하 \"공단\"이라 한다)을 말한다]는 제공된 급여를 담보로 한 대출이 이루어지도록 협조하여야 한다. <개정 2021.4.13>\n제7조(수급권의 보호)","kind":"L"},{"id":"L:8","label":"법 제8조","title":"퇴직금제도의 설정 등","chapter":"제2장 퇴직급여제도의 설정","deleted":false,"text":"① 퇴직금제도를 설정하려는 사용자는 계속근로기간 1년에 대하여 30일분 이상의 평균임금을 퇴직금으로 퇴직 근로자에게 지급할 수 있는 제도를 설정하여야 한다.\n② 제1항에도 불구하고 사용자는 주택구입 등 대통령령으로 정하는 사유로 근로자가 요구하는 경우에는 근로자가 퇴직하기 전에 해당 근로자의 계속근로기간에 대한 퇴직금을 미리 정산하여 지급할 수 있다. 이 경우 미리 정산하여 지급한 후의 퇴직금 산정을 위한 계속근로기간은 정산시점부터 새로 계산한다.\n제8조(퇴직금제도의 설정 등)","kind":"L"},{"id":"L:9","label":"법 제9조","title":"퇴직금의 지급 등","chapter":"제2장 퇴직급여제도의 설정","deleted":false,"text":"① 사용자는 근로자가 퇴직한 경우에는 그 지급사유가 발생한 날부터 14일 이내에 퇴직금을 지급하여야 한다. 다만, 특별한 사정이 있는 경우에는 당사자 간의 합의에 따라 지급기일을 연장할 수 있다. <개정 2021.4.13>\n② 제1항에 따른 퇴직금은 근로자가 지정한 개인형퇴직연금제도의 계정 또는 제23조의8제1항에 따른 계정(이하 \"개인형퇴직연금제도의 계정등\"이라 한다)으로 이전하는 방법으로 지급하여야 한다. 다만, 근로자가 55세 이후에 퇴직하여 급여를 받는 경우 등 대통령령으로 정하는 사유가 있는 경우에는 그러하지 아니하다. <신설 2021.4.13, 2026.3.17>\n③ 근로자가 제2항에 따라 개인형퇴직연금제도의 계정등을 지정하지 아니한 경우에는 근로자 명의의 개인형퇴직연금제도의 계정으로 이전한다. <신설 2021.4.13>\n제9조(퇴직금의 지급 등)","kind":"L"},{"id":"L:10","label":"법 제10조","title":"퇴직금의 시효","chapter":"제2장 퇴직급여제도의 설정","deleted":false,"text":"제10조(퇴직금의 시효) 이 법에 따른 퇴직금을 받을 권리는 3년간 행사하지 아니하면 시효로 인하여 소멸한다.","kind":"L"},{"id":"L:11","label":"법 제11조","title":"퇴직급여제도의 미설정에 따른 처리","chapter":"제2장 퇴직급여제도의 설정","deleted":false,"text":"제11조(퇴직급여제도의 미설정에 따른 처리) 제4조제1항 본문 및 제5조에도 불구하고 사용자가 퇴직급여제도나 제25조제1항에 따른 개인형퇴직연금제도를 설정하지 아니한 경우에는 제8조제1항에 따른 퇴직금제도를 설정한 것으로 본다.","kind":"L"},{"id":"L:12","label":"법 제12조","title":"퇴직급여등의 우선변제","chapter":"제2장 퇴직급여제도의 설정","deleted":false,"text":"① 사용자에게 지급의무가 있는 퇴직금, 제15조에 따른 확정급여형퇴직연금제도의 급여, 제20조제3항에 따른 확정기여형퇴직연금제도의 부담금 중 미납입 부담금 및 미납입 부담금에 대한 지연이자, 제23조의7제1항에 따른 중소기업퇴직연금기금제도의 부담금 중 미납입 부담금 및 미납입 부담금에 대한 지연이자, 제25조제2항제4호에 따른 개인형퇴직연금제도의 부담금 중 미납입 부담금 및 미납입 부담금에 대한 지연이자(이하 \"퇴직급여등\"이라한다)는 사용자의 총재산에 대하여 질권 또는 저당권에 의하여 담보된 채권을 제외하고는 조세ㆍ공과금 및 다른 채권에 우선하여 변제되어야 한다. 다만, 질권 또는 저당권에 우선하는 조세ㆍ공과금에 대하여는 그러하지 아니하다. <개정 2021.4.13>\n② 제1항에도 불구하고 최종 3년간의 퇴직급여등은 사용자의 총재산에 대하여 질권 또는 저당권에 의하여 담보된 채권, 조세ㆍ공과금 및 다른 채권에 우선하여 변제되어야 한다.\n③ 퇴직급여등 중 퇴직금, 제15조에 따른 확정급여형퇴직연금제도의 급여는 계속근로기간 1년에 대하여 30일분의 평균임금으로 계산한 금액으로 한다.\n④ 퇴직급여등 중 제20조제1항에 따른 확정기여형퇴직연금제도의 부담금, 제23조의7제1항에 따른 중소기업퇴직연금기금제도의 부담금 및 제25조제2항제2호에 따른 개인형퇴직연금제도의 부담금은 가입자의 연간 임금총액의 12분의 1에 해당하는 금액으로 계산한 금액으로 한다. <개정 2021.4.13>\n제12조(퇴직급여등의 우선변제)","kind":"L"},{"id":"L:13","label":"법 제13조","title":"확정급여형퇴직연금제도의 설정","chapter":"제3장 확정급여형퇴직연금제도","deleted":false,"text":"1. 퇴직연금사업자 선정에 관한 사항\n2. 가입자에 관한 사항\n3. 가입기간에 관한 사항\n4. 급여수준에 관한 사항\n5. 급여 지급능력 확보에 관한 사항\n6. 급여의 종류 및 수급요건 등에 관한 사항\n7. 제28조에 따른 운용관리업무 및 제29조에 따른 자산관리업무의 수행을 내용으로 하는 계약의 체결 및 해지와 해지에 따른 계약의 이전(移轉)에 관한 사항\n8. 운용현황의 통지에 관한 사항\n9. 가입자의 퇴직 등 급여 지급사유 발생과 급여의 지급절차에 관한 사항\n10. 퇴직연금제도의 폐지ㆍ중단 사유 및 절차 등에 관한 사항\n10의2. 부담금의 산정 및 납입에 관한 사항\n11. 그 밖에 확정급여형퇴직연금제도의 운영을 위하여 대통령령으로 정하는 사항\n제13조(확정급여형퇴직연금제도의 설정) 확정급여형퇴직연금제도를 설정하려는 사용자는 제4조제3항 또는 제5조에 따라 근로자대표의 동의를 얻거나 의견을 들어 다음 각 호의 사항을 포함한 확정급여형퇴직연금규약을 작성하여 고용노동부장관에게 신고하여야 한다. <개정 2021.4.13>","kind":"L"},{"id":"L:14","label":"법 제14조","title":"가입기간","chapter":"제3장 확정급여형퇴직연금제도","deleted":false,"text":"① 제13조제3호에 따른 가입기간은 퇴직연금제도의 설정 이후 해당 사업에서 근로를 제공하는 기간으로 한다.\n② 해당 퇴직연금제도의 설정 전에 해당 사업에서 제공한 근로기간에 대하여도 가입기간으로 할 수 있다. 이 경우 제8조제2항에 따라 퇴직금을 미리 정산한 기간은 제외한다.\n제14조(가입기간)","kind":"L"},{"id":"L:15","label":"법 제15조","title":"급여수준","chapter":"제3장 확정급여형퇴직연금제도","deleted":false,"text":"제15조(급여수준) 제13조제4호의 급여 수준은 가입자의 퇴직일을 기준으로 산정한 일시금이 계속근로기간 1년에 대하여 30일분 이상의 평균임금이 되도록 하여야 한다. <개정 2021.4.13>","kind":"L"},{"id":"L:16","label":"법 제16조","title":"급여 지급능력 확보 등","chapter":"제3장 확정급여형퇴직연금제도","deleted":false,"text":"① 확정급여형퇴직연금제도를 설정한 사용자는 급여 지급능력을 확보하기 위하여 매 사업연도 말 다음 각 호에 해당하는 금액 중 더 큰 금액(이하 \"기준책임준비금\"이라 한다)에 100분의 60 이상으로 대통령령으로 정하는 비율을 곱하여 산출한 금액(이하 \"최소적립금\"이라 한다) 이상을 적립금으로 적립하여야 한다. 다만, 제14조제2항에 따라 해당 퇴직연금제도 설정 이전에 해당 사업에서 근로한 기간을 가입기간에 포함시키는 경우 대통령령으로 정하는 비율에 따른다.\n1. 매 사업연도 말일 현재를 기준으로 산정한 가입자의 예상 퇴직시점까지의 가입기간에 대한 급여에 드는 비용 예상액의 현재가치에서 장래 근무기간분에 대하여 발생하는 부담금 수입 예상액의 현재가치를 뺀 금액으로서 고용노동부령으로 정하는 방법에 따라 산정한 금액\n2. 가입자와 가입자였던 사람의 해당 사업연도 말일까지의 가입기간에 대한 급여에 드는 비용 예상액을 고용노동부령으로 정하는 방법에 따라 산정한 금액\n② 확정급여형퇴직연금제도의 운용관리업무를 수행하는 퇴직연금사업자는 매 사업연도 종료 후 6개월 이내에 고용노동부령으로 정하는 바에 따라 산정된 적립금이 최소적립금을 넘고 있는지 여부를 확인하여 그 결과를 대통령령으로 정하는 바에 따라 사용자에게 알려야 한다. 다만, 최소적립금보다 적은 경우에는 그 확인 결과를 근로자대표에게도 알려야 한다. <개정 2020.5.26>\n③ 사용자는 제2항에 따른 확인 결과 적립금이 대통령령으로 정하는 수준에 미치지 못하는 경우에는 대통령령으로 정하는 바에 따라 적립금 부족을 해소하여야 한다.\n④ 제2항에 따른 확인 결과 매 사업연도 말 적립금이 기준책임준비금을 초과한 경우 사용자는 그 초과분을 향후 납입할 부담금에서 상계(相計)할 수 있으며, 매 사업연도 말 적립금이 기준책임준비금의 100분의 150을 초과하고 사용자가 반환을 요구하는 경우 퇴직연금사업자는 그 초과분을 사용자에게 반환할 수 있다.\n제16조(급여 지급능력 확보 등)","kind":"L"},{"id":"L:17","label":"법 제17조","title":"급여 종류 및 수급요건 등","chapter":"제3장 확정급여형퇴직연금제도","deleted":false,"text":"① 확정급여형퇴직연금제도의 급여 종류는 연금 또는 일시금으로 하되, 수급요건은 다음 각 호와 같다.\n1. 연금은 55세 이상으로서 가입기간이 10년 이상인 가입자에게 지급할 것. 이 경우 연금의 지급기간은 5년 이상이어야 한다.\n2. 일시금은 연금수급 요건을 갖추지 못하거나 일시금 수급을 원하는 가입자에게 지급할 것\n② 사용자는 가입자의 퇴직 등 제1항에 따른 급여를 지급할 사유가 발생한 날부터 14일 이내에 퇴직연금사업자로 하여금 적립금의 범위에서 지급의무가 있는 급여 전액(사업의 도산 등 대통령령으로 정하는 경우에는 제16조제1항제2호에 따른 금액에 대한 적립금의 비율에 해당하는 금액)을 지급하도록 하여야 한다. 다만, 퇴직연금제도 적립금으로 투자된 운용자산 매각이 단기간에 이루어지지 아니하는 등 특별한 사정이 있는 경우에는 사용자, 가입자 및 퇴직연금사업자 간의 합의에 따라 지급기일을 연장할 수 있다.\n③ 사용자는 제2항에 따라 퇴직연금사업자가 지급한 급여수준이 제15조에 따른 급여수준에 미치지 못할 때에는 급여를 지급할 사유가 발생한 날부터 14일 이내에 그 부족한 금액을 해당 근로자에게 지급하여야 한다. 이 경우 특별한 사정이 있는 경우에는 당사자 간의 합의에 따라 지급기일을 연장할 수 있다.\n④ 제2항 및 제3항에 따른 급여의 지급은 가입자가 지정한 개인형퇴직연금제도의 계정등으로 이전하는 방법으로 한다. 다만, 가입자가 55세 이후에 퇴직하여 급여를 받는 경우 등 대통령령으로 정하는 사유가 있는 경우에는 그러하지 아니하다. <개정 2021.4.13>\n⑤ 가입자가 제4항에 따라 개인형퇴직연금제도의 계정등을 지정하지 아니하는 경우에는 가입자 명의의 개인형퇴직연금제도의 계정으로 이전한다. 이 경우 가입자가 해당 퇴직연금사업자에게 개인형퇴직연금제도를 설정한 것으로 본다. <개정 2021.4.13>\n제17조(급여 종류 및 수급요건 등)","kind":"L"},{"id":"L:18","label":"법 제18조","title":"운용현황의 통지","chapter":"제3장 확정급여형퇴직연금제도","deleted":false,"text":"제18조(운용현황의 통지) 퇴직연금사업자는 매년 1회 이상 적립금액 및 운용수익률 등을 고용노동부령으로 정하는 바에 따라 가입자에게 알려야 한다.","kind":"L"},{"id":"L:18-2","label":"법 제18조의2","title":"적립금운용위원회 구성 등","chapter":"제3장 확정급여형퇴직연금제도","deleted":false,"text":"① 상시 300명 이상의 근로자를 사용하는 사업의 사용자는 퇴직연금제도 적립금의 합리적인 운용을 위하여 대통령령으로 정하는 바에 따라 적립금운용위원회를 구성하여야 한다.\n② 제1항의 사용자는 적립금운용위원회의 심의를 거친 적립금운용계획서에 따라 적립금을 운용하여야 한다. 이 경우 적립금운용계획서는 적립금 운용 목적 및 방법, 목표수익률, 운용성과 평가 등 대통령령으로 정하는 내용을 포함하여 매년 1회 이상 작성하여야 한다.\n제18조의2(적립금운용위원회 구성 등)","kind":"L"},{"id":"L:19","label":"법 제19조","title":"확정기여형퇴직연금제도의 설정","chapter":"제4장 확정기여형퇴직연금제도","deleted":false,"text":"① 확정기여형퇴직연금제도를 설정하려는 사용자는 제4조제3항 또는 제5조에 따라 근로자대표의 동의를 얻거나 의견을 들어 다음 각 호의 사항을 포함한 확정기여형퇴직연금규약을 작성하여 고용노동부장관에게 신고하여야 한다. <개정 2021.4.13, 2022.1.11>\n1. 부담금의 부담에 관한 사항\n2. 부담금의 산정 및 납입에 관한 사항\n3. 적립금의 운용에 관한 사항\n4. 적립금의 운용방법 및 정보의 제공 등에 관한 사항\n4의2. 사전지정운용제도에 관한 사항\n5. 적립금의 중도인출에 관한 사항\n6. 제13조제1호부터 제3호까지 및 제6호부터 제10호까지의 사항\n7. 그 밖에 확정기여형퇴직연금제도의 운영에 필요한 사항으로서 대통령령으로 정하는 사항\n② 제1항에 따라 확정기여형퇴직연금제도를 설정하는 경우 가입기간에 관하여는 제14조를, 급여의 종류, 수급요건과 급여 지급의 절차ㆍ방법에 관하여는 제17조제1항, 제4항 및 제5항을, 운용현황의 통지에 관하여는 제18조를 준용한다. 이 경우 제14조제1항 중 \"제13조제3호\"는 \"제19조제6호\"로, 제17조제1항 중 \"확정급여형퇴직연금제도\"는 \"확정기여형퇴직연금제도\"로 본다.\n제19조(확정기여형퇴직연금제도의 설정)","kind":"L"},{"id":"L:20","label":"법 제20조","title":"부담금의 부담수준 및 납입 등","chapter":"제4장 확정기여형퇴직연금제도","deleted":false,"text":"① 확정기여형퇴직연금제도를 설정한 사용자는 가입자의 연간 임금총액의 12분의 1 이상에 해당하는 부담금을 현금으로 가입자의 확정기여형퇴직연금제도 계정에 납입하여야 한다.\n② 가입자는 제1항에 따라 사용자가 부담하는 부담금 외에 스스로 부담하는 추가 부담금을 가입자의 확정기여형퇴직연금 계정에 납입할 수 있다.\n③ 사용자는 매년 1회 이상 정기적으로 제1항에 따른 부담금을 가입자의 확정기여형퇴직연금제도 계정에 납입하여야 한다. 이 경우 사용자가 정하여진 기일(확정기여형퇴직연금규약에서 납입 기일을 연장할 수 있도록 한 경우에는 그 연장된 기일)까지 부담금을 납입하지 아니한 경우 그 다음 날부터 부담금을 납입한 날까지 지연 일수에 대하여 연 100분의 40 이내의 범위에서 「은행법」에 따른 은행이 적용하는 연체금리, 경제적 여건 등을 고려하여 대통령령으로 정하는 이율에 따른 지연이자를 납입하여야 한다.\n④ 제3항은 사용자가 천재지변, 그 밖에 대통령령으로 정하는 사유에 따라 부담금 납입을 지연하는 경우 그 사유가 존속하는 기간에 대하여는 적용하지 아니한다.\n⑤ 사용자는 확정기여형퇴직연금제도 가입자의 퇴직 등 대통령령으로 정하는 사유가 발생한 때에 그 가입자에 대한 부담금을 미납한 경우에는 그 사유가 발생한 날부터 14일 이내에 제1항에 따른 부담금 및 제3항 후단에 따른 지연이자를 해당 가입자의 확정기여형퇴직연금제도 계정에 납입하여야 한다. 다만, 특별한 사정이 있는 경우에는 당사자 간의 합의에 따라 납입 기일을 연장할 수 있다.\n⑥ 가입자는 퇴직할 때에 받을 급여를 갈음하여 그 운용 중인 자산을 가입자가 설정한 개인형퇴직연금제도의 계정으로 이전해 줄 것을 해당 퇴직연금사업자에게 요청할 수 있다.\n⑦ 제6항에 따른 가입자의 요청이 있는 경우 퇴직연금사업자는 그 운용 중인 자산을 가입자의 개인형퇴직연금제도 계정으로 이전하여야 한다. 이 경우 확정기여형퇴직연금제도 운영에 따른 가입자에 대한 급여는 지급된 것으로 본다.\n제20조(부담금의 부담수준 및 납입 등)","kind":"L"},{"id":"L:21","label":"법 제21조","title":"적립금 운용방법 및 정보제공","chapter":"제4장 확정기여형퇴직연금제도","deleted":false,"text":"① 확정기여형퇴직연금제도의 가입자는 적립금의 운용방법을 스스로 선정할 수 있고, 반기마다 1회 이상 적립금의 운용방법을 변경할 수 있다.\n② 퇴직연금사업자는 반기마다 1회 이상 위험과 수익구조가 서로 다른 세 가지 이상의 적립금 운용방법을 제시하여야 한다.\n③ 퇴직연금사업자는 운용방법별 이익 및 손실의 가능성에 관한 정보 등 가입자가 적립금의 운용방법을 선정하는 데 필요한 정보를 제공하여야 한다.\n제21조(적립금 운용방법 및 정보제공)","kind":"L"},{"id":"L:21-2","label":"법 제21조의2","title":"사전지정운용제도의 설정","chapter":"제4장 확정기여형퇴직연금제도","deleted":false,"text":"① 운용관리업무를 수행하는 퇴직연금사업자는 사전지정운용방법에 다음 각 호 중 하나 이상의 운용유형을 포함하여 고용노동부장관의 승인을 받아야 한다.\n1. 적립금의 원리금이 보장되는 운용유형\n2. 「자본시장과 금융투자업에 관한 법률」 제229조에 따른 집합투자기구의 집합투자증권으로서 투자설명서상 다음 각 목의 어느 하나에 해당하는 운용내용이 운용계획에 명시되는 등 대통령령으로 정하는 요건을 충족하는 운용유형\n가. 투자목표시점이 사전에 결정되고 운용기간이 경과함에 따라 투자위험이 낮은 자산의 비중을 증가시키는 방향으로 자산배분을 변경하거나 위험수준을 조절하는 운용내용\n나. 투자위험이 상이한 다양한 자산에 분산투자하고 금융시장 상황 및 각 집합투자재산의 가치변동 등을 고려하여 주기적으로 자산배분을 조정함으로써 집합투자재산의 위험을 관리하고 장기 가치 상승을 추구하는 운용내용\n다. 단기금융상품 등에 투자하여 집합투자재산의 손실가능성을 최소화하고 단기 안정적인 수익을 추구하는 운용내용\n라. 「사회기반시설에 대한 민간투자법」 등 관련 법령에 따라 국가 및 지방자치단체가 추진하는 공공투자계획, 관련 사업 및 정책에 따른 사회기반시설사업 등에 투자하는 등 고용노동부령으로 정하는 요건을 충족하는 운용내용\n마. 그 밖에 대통령령으로 정하는 운용내용\n② 퇴직연금사업자가 제1항에 따라 고용노동부장관의 승인을 받고자 하는 경우 퇴직연금 관련 전문가로서 퇴직연금 및 자산운용에 관한 학식과 경험이 풍부하다고 인정되는 사람을 포함하는 등 고용노동부령으로 정하는 요건에 따라 구성된 고용노동부장관 소속 심의위원회의 사전심의를 받아야 한다.\n③ 운용관리업무를 수행하는 퇴직연금사업자는 사전지정운용방법을 사용자에게 고용노동부령으로 정하는 방법에 따라 제시하여야 한다.\n④ 제1항제2호에 따른 운용유형은 손실가능성과 예상수익이 중ㆍ장기적으로 합리적 균형을 이루고 수수료 등의 비용이 예상되는 수익에 비해 과다하여서는 아니 된다.\n⑤ 제3항에 따라 사전지정운용방법을 제시받은 사용자는 사업 또는 사업장 단위로 사전지정운용방법을 설정하여 근로자대표의 동의를 받아 확정기여형퇴직연금규약에 반영하여야 한다.\n제21조의2(사전지정운용제도의 설정)","kind":"L"},{"id":"L:21-3","label":"법 제21조의3","title":"사전지정운용제도의 운영","chapter":"제4장 확정기여형퇴직연금제도","deleted":false,"text":"① 운용관리업무를 수행하는 퇴직연금사업자는 사전지정운용제도를 설정한 사업의 가입자에게 다음 각 호의 사항에 관한 정보를 대통령령으로 정하는 바에 따라 제공하여야 한다.\n1. 해당 사전지정운용방법의 자산배분 현황 및 위험ㆍ수익 구조\n2. 제2항부터 제5항까지에 관한 사항\n3. 그 밖에 사전지정운용제도의 운영에 관한 사항으로서 대통령령으로 정하는 사항\n② 가입자는 제1항에 따라 정보를 제공받은 사전지정운용방법 중 하나를 본인이 적용받을 사전지정운용방법으로 선정하여야 한다. 다만, 제21조의2제1항제2호의 운용유형만 사전지정운용방법으로 선정하는 경우에는 같은 호 가목 또는 나목의 운용내용이 포함되어야 한다.\n③ 운용관리업무를 수행하는 퇴직연금사업자는 가입자가 다음 각 호에 해당하는 때에 운용방법을 스스로 선정하지 아니하는 경우 가입자에게 사전지정운용방법에 따라 적립금이 운용됨을 통지하여야 한다.\n1. 가입자가 확정기여형퇴직연금제도에 가입하였을 때\n2. 가입자가 제21조제1항에 따라 스스로 선정한 적립금 운용방법의 기간 만료일부터 4주가 지났을 때\n④ 가입자가 제3항에 따른 통지를 받은 후 2주 이내에 운용방법을 스스로 선정하지 아니할 경우 운용관리업무를 수행하는 퇴직연금사업자는 해당 가입자의 적립금을 사전지정운용방법으로 운용한다. 이 경우 가입자가 스스로 운용방법을 사전지정운용방법으로 선정한 것으로 본다.\n⑤ 사전지정운용방법으로 적립금을 운용하는 가입자는 언제든지 제21조제1항에 따라 적립금의 운용방법을 스스로 선정할 수 있다.\n⑥ 운용관리업무를 수행하는 퇴직연금사업자는 고용노동부장관의 승인을 받아 사전지정운용방법을 변경할 수 있다. 이 경우 해당 사전지정운용방법에 따라 운용되는 가입자의 적립금은 가입자에 대한 통지 등 대통령령으로 정하는 절차를 거쳐 변경된 사전지정운용방법에 따라 운용할 수 있다.\n⑦ 사전지정운용방법의 운용현황 및 수익률의 공시, 해지방법의 고지, 승인취소 및 그에 따른 적립금의 이전, 그 밖에 사전지정운용제도의 운용을 위하여 필요한 사항은 대통령령으로 정한다.\n제21조의3(사전지정운용제도의 운영)","kind":"L"},{"id":"L:21-4","label":"법 제21조의4","title":"가입자의 사전지정운용방법 선정","chapter":"제4장 확정기여형퇴직연금제도","deleted":false,"text":"① 사전지정운용방법으로 적립금을 운용하고 있지 아니하는 확정기여형퇴직연금제도의 가입자는 운용관리업무를 수행하는 퇴직연금사업자의 사전지정운용방법 중 제21조의2제1항 각 호의 어느 하나의 운용유형을 사전지정운용방법으로 선정할 수 있다. 다만, 제21조의2제1항제2호의 운용유형만 사전지정운용방법으로 선정하는 경우에는 같은 호 가목 또는 나목의 운용내용이 포함되어야 한다.\n② 제1항에 따라 가입자가 선정한 사전지정운용방법이 제21조의3제6항 전단에 따라 변경될 경우 운용관리업무를 수행하는 퇴직연금사업자는 가입자에 대한 통지 등 대통령령으로 정하는 절차를 거쳐 가입자의 적립금을 변경된 사전지정운용방법에 따라 운용할 수 있다.\n제21조의4(가입자의 사전지정운용방법 선정)","kind":"L"},{"id":"L:22","label":"법 제22조","title":"적립금의 중도인출","chapter":"제4장 확정기여형퇴직연금제도","deleted":false,"text":"제22조(적립금의 중도인출) 확정기여형퇴직연금제도에 가입한 근로자는 주택구입 등 대통령령으로 정하는 사유가 발생하면 적립금을 중도인출할 수 있다.","kind":"L"},{"id":"L:23","label":"법 제23조","title":"둘 이상의 사용자가 참여하는 확정기여형퇴직연금제도 설정","chapter":"제4장 확정기여형퇴직연금제도","deleted":false,"text":"1. 다음 각 목의 사항이 포함된 확정기여형퇴직연금제도의 표준규약\n가. 제19조제1항 각 호의 사항\n나. 그 밖에 대통령령으로 정하는 사항\n2. 대통령령으로 정하는 사항이 포함된 운용관리업무 및 자산관리업무에 관한 표준계약서\n제23조(둘 이상의 사용자가 참여하는 확정기여형퇴직연금제도 설정) 퇴직연금사업자가 둘 이상의 사용자를 대상으로 하나의 확정기여형퇴직연금제도 설정을 제안하려는 경우에는 다음 각 호의 사항에 대하여 고용노동부장관의 승인을 받아야 한다.","kind":"L"},{"id":"L:23-2","label":"법 제23조의2","title":"중소기업퇴직연금기금제도의 운영","chapter":"제4장의2 중소기업퇴직연금기금제도","deleted":false,"text":"① 중소기업퇴직연금기금제도는 공단에서 운영한다.\n② 중소기업퇴직연금기금제도 운영과 관련한 주요 사항을 심의ㆍ의결하기 위하여 공단에 중소기업퇴직연금기금제도운영위원회(이하 \"운영위원회\"라 한다)를 둔다.\n③ 운영위원회의 위원장은 공단 이사장으로 한다.\n④ 운영위원회는 위원장, 퇴직연금 관계 업무를 담당하는 고용노동부의 고위공무원단에 속하는 일반직공무원 및 위원장이 위촉하는 다음 각 호의 위원으로 구성한다. 이 경우 위원장을 포함한 위원의 수는 10명 이상 15명 이내로 구성하되, 제2호와 제3호에 해당하는 위원의 수는 같아야 한다.\n1. 공단의 상임이사\n2. 근로자를 대표하는 사람\n3. 사용자를 대표하는 사람\n4. 퇴직연금 관련 전문가로서 퇴직연금 및 자산운용에 관한 학식과 경험이 풍부한 사람\n⑤ 제4항제2호부터 제4호까지에 해당하는 사람으로서 위원장이 위촉한 위원의 임기는 3년으로 하되, 연임할 수 있다. 다만, 위원의 사임 등으로 새로 위촉된 위원의 임기는 전임 위원 임기의 남은 기간으로 한다.\n⑥ 운영위원회는 다음 각 호의 사항을 심의ㆍ의결한다.\n1. 중소기업퇴직연금기금 운용계획 및 지침에 관한 사항\n2. 제23조의5에 따른 중소기업퇴직연금기금표준계약서의 작성 및 변경에 관한 사항\n3. 제23조의6제2항에 따른 수수료 수준에 관한 사항\n4. 그 밖에 위원장이 중소기업퇴직연금기금제도 운영과 관련한 주요 사항에 관하여 운영위원회의 회의에 부치는 사항\n⑦ 위원장은 중소기업퇴직연금기금 운용 등과 관련하여 운영위원회를 지원하기 위한 자문위원회를 구성할 수 있다.\n⑧ 그 밖에 운영위원회의 구성 및 운영 등에 필요한 사항은 대통령령으로 정한다.\n제23조의2(중소기업퇴직연금기금제도의 운영)","kind":"L"},{"id":"L:23-3","label":"법 제23조의3","title":"중소기업퇴직연금기금의 관리 및 운용","chapter":"제4장의2 중소기업퇴직연금기금제도","deleted":false,"text":"① 공단은 중소기업퇴직연금기금의 안정적 운용 및 수익성 증대를 위하여 대통령령으로 정하는 방법에 따라 중소기업퇴직연금기금을 관리ㆍ운용하여야 한다.\n② 공단은 중소기업퇴직연금기금을 공단의 다른 회계와 구분하여야 한다.\n제23조의3(중소기업퇴직연금기금의 관리 및 운용)","kind":"L"},{"id":"L:23-4","label":"법 제23조의4","title":"자료의 활용","chapter":"제4장의2 중소기업퇴직연금기금제도","deleted":false,"text":"① 공단은 다음 각 호의 사무를 원활히 수행하기 위하여 대통령령으로 정하는 범위에서 「고용보험법」, 「고용보험 및 산업재해보상보험의 보험료징수 등에 관한 법률」 및 「근로복지기본법」에 따라 수집된 자료를 활용할 수 있다.\n1. 중소기업퇴직연금기금제도 가입 대상 사업장에 대한 가입 안내 업무\n2. 제23조의5제1항 각 호에 따른 업무 중 사용자 및 근로자의 편의를 도모하기 위하여 대통령령으로 정하는 업무\n② 고용노동부장관은 공단이 제23조의14에 따른 업무수행을 위하여 제13조 및 제19조에 따른 퇴직연금규약 신고, 제38조에 따른 퇴직연금규약 폐지 신고 여부에 대한 자료를 요청하는 경우 해당 자료를 제공할 수 있다.\n제23조의4(자료의 활용)","kind":"L"},{"id":"L:23-5","label":"법 제23조의5","title":"중소기업퇴직연금기금표준계약서의 기재사항 등","chapter":"제4장의2 중소기업퇴직연금기금제도","deleted":false,"text":"① 공단은 다음 각 호의 사항을 기재한 계약서(이하 \"중소기업퇴직연금기금표준계약서\"라 한다)를 작성하여 고용노동부장관의 승인을 받아야 한다.\n1. 제13조제2호, 제3호, 제6호 및 제8호부터 제10호까지의 사항\n2. 제19조제1항제1호부터 제3호까지 및 제5호의 사항\n3. 제23조의3에 따른 중소기업퇴직연금기금의 관리ㆍ운용 업무에 관한 사항\n4. 적립금 운용현황의 기록ㆍ보관ㆍ통지 업무에 관한 사항\n5. 계좌의 설정 및 관리, 부담금의 수령, 적립금의 보관 및 관리, 급여의 지급 업무에 관한 사항\n6. 그 밖에 중소기업퇴직연금기금제도의 운영을 위하여 대통령령으로 정하는 사항\n② 공단은 제1항에 따라 승인받은 중소기업퇴직연금기금표준계약서를 변경하는 경우에는 고용노동부장관의 승인을 받아야 한다. 다만, 변경하는 내용이 사용자 및 가입자에게 불리하지 아니한 경우에는 고용노동부장관에게 신고함으로써 중소기업퇴직연금기금표준계약서를 변경할 수 있다.\n③ 제1항 및 제2항에 따른 승인 또는 변경승인의 방법 및 절차 등에 필요한 사항은 대통령령으로 정한다.\n제23조의5(중소기업퇴직연금기금표준계약서의 기재사항 등)","kind":"L"},{"id":"L:23-6","label":"법 제23조의6","title":"중소기업퇴직연금기금제도의 설정","chapter":"제4장의2 중소기업퇴직연금기금제도","deleted":false,"text":"① 중소기업의 사용자는 제23조의5에 따른 중소기업퇴직연금기금표준계약서에서 정하고 있는 사항에 관하여 제4조제3항 또는 제5조에 따라 근로자대표의 동의를 얻거나 의견을 들어 공단과 계약을 체결함으로써 중소기업퇴직연금기금제도를 설정할 수 있다.\n② 공단은 제23조의5제1항제3호부터 제5호까지 및 제23조의15제1항의 업무수행에 따른 수수료를 사용자 및 가입자에게 부과할 수 있다.\n③ 공단은 제23조의5제1항제3호부터 제6호까지의 업무 중 대통령령으로 정하는 업무를 인적ㆍ물적 요건 등 대통령령으로 정하는 요건을 갖춘 자에게 처리하게 할 수 있다.\n제23조의6(중소기업퇴직연금기금제도의 설정)","kind":"L"},{"id":"L:23-7","label":"법 제23조의7","title":"부담금의 부담수준 및 납입 등","chapter":"제4장의2 중소기업퇴직연금기금제도","deleted":false,"text":"① 중소기업퇴직연금기금제도를 설정한 사용자는 매년 1회 이상 정기적으로 가입자의 연간 임금총액의 12분의 1 이상에 해당하는 부담금(이하 \"사용자부담금\"이라 한다)을 현금으로 가입자의 중소기업퇴직연금기금제도 계정(이하 \"기금제도사용자부담금계정\"이라 한다)에 납입하여야 한다. 이 경우 사용자가 정하여진 기일(중소기업퇴직연금기금표준계약서에서 납입 기일을 연장할 수 있도록 한 경우에는 그 연장된 기일을 말한다)까지 부담금을 납입하지 아니한 경우에는 그 다음 날부터 부담금을 납입한 날까지 지연 일수에 대하여 제20조제3항 후단에 따라 대통령령으로 정하는 이율에 따른 지연이자를 납입하여야 한다.\n② 사용자는 중소기업퇴직연금기금제도 가입자의 퇴직 등 대통령령으로 정하는 사유가 발생한 때에 그 가입자에 대한 부담금을 미납한 경우에는 그 사유가 발생한 날부터 14일 이내에 제1항에 따른 부담금과 지연이자를 해당 가입자의 기금제도사용자부담금계정에 납입하여야 한다. 다만, 특별한 사정이 있는 경우에는 당사자 간의 합의에 따라 납입 기일을 연장할 수 있다.\n③ 제1항 및 제2항의 지연이자에 대한 적용제외 사유는 제20조제4항을 준용한다.\n④ 그 밖에 사용자부담금의 납입 방법ㆍ절차 등에 필요한 사항은 대통령령으로 정한다.\n제23조의7(부담금의 부담수준 및 납입 등)","kind":"L"},{"id":"L:23-8","label":"법 제23조의8","title":"중소기업퇴직연금기금제도 가입자부담금 계정의 설정 등","chapter":"제4장의2 중소기업퇴직연금기금제도","deleted":false,"text":"① 제24조제2항 각 호(이 경우 제24조제2항제2호의 \"개인형퇴직연금제도\"는 \"중소기업퇴직연금기금제도\"로 본다)에 해당하는 사람은 가입자 명의의 부담금 계정(이하 \"기금제도가입자부담금계정\"이라 한다)을 설정할 수 있다. 이 경우 공단은 가입자의 기금제도사용자부담금계정과 구분하여 관리하여야 한다. <개정 2026.3.17>\n1. 삭제<2026.3.17>\n2. 삭제<2026.3.17>\n② 기금제도가입자부담금계정을 설정하는 경우 부담금 납입에 관하여는 제24조제3항을 준용한다. 이 경우 \"개인형퇴직연금제도\"는 \"기금제도가입자부담금계정\"으로, \"개인형퇴직연금제도의 부담금\"은 \"기금제도가입자부담금계정의 부담금\"(이하 \"가입자부담금\"이라 한다)으로 본다. <신설 2026.3.17>\n제23조의8(중소기업퇴직연금기금제도 가입자부담금 계정의 설정 등)","kind":"L"},{"id":"L:23-9","label":"법 제23조의9","title":"가입기간","chapter":"제4장의2 중소기업퇴직연금기금제도","deleted":false,"text":"제23조의9(가입기간) 중소기업퇴직연금기금제도를 설정하는 경우 가입기간에 관하여는 제14조를 준용한다. 다만, 기금제도가입자부담금계정은 해당 계정이 설정된 날부터 급여가 전액 지급된 날까지로 한다.","kind":"L"},{"id":"L:23-10","label":"법 제23조의10","title":"기금 운용정보 제공","chapter":"제4장의2 중소기업퇴직연금기금제도","deleted":false,"text":"제23조의10(기금 운용정보 제공) 공단은 중소기업퇴직연금기금 운용에 따라 발생하는 이익 및 손실 가능성 등의 정보를 대통령령으로 정하는 방법에 따라 중소기업퇴직연금기금제도 가입자에게 제공하여야 한다.","kind":"L"},{"id":"L:23-11","label":"법 제23조의11","title":"운용현황의 통지","chapter":"제4장의2 중소기업퇴직연금기금제도","deleted":false,"text":"제23조의11(운용현황의 통지) 중소기업퇴직연금기금제도의 가입자별 운용현황의 통지에 관하여는 제18조를 준용한다. 이 경우 \"퇴직연금사업자\"는 \"공단\"으로 본다.","kind":"L"},{"id":"L:23-12","label":"법 제23조의12","title":"급여의 종류 및 수급요건 등","chapter":"제4장의2 중소기업퇴직연금기금제도","deleted":false,"text":"① 중소기업퇴직연금기금제도의 급여 종류 및 수급요건은 다음 각 호에 따른다.\n1. 기금제도사용자부담금계정에 관하여는 제17조제1항을 준용한다. 이 경우 \"확정급여형퇴직연금제도\"는 \"중소기업퇴직연금기금제도\"로 본다.\n2. 기금제도가입자부담금계정에 관하여는 대통령령으로 정한다.\n② 기금제도사용자부담금계정에서 가입자에 대한 급여의 지급은 가입자가 지정한 개인형퇴직연금제도의 계정등으로 이전하는 방법으로 한다. 다만, 가입자가 개인형퇴직연금제도의 계정등을 지정하지 아니하는 경우에는 가입자 명의의 개인형퇴직연금제도의 계정으로 이전한다.\n③ 그 밖에 급여의 지급 등에 필요한 사항은 대통령령으로 정한다.\n제23조의12(급여의 종류 및 수급요건 등)","kind":"L"},{"id":"L:23-13","label":"법 제23조의13","title":"적립금의 중도인출","chapter":"제4장의2 중소기업퇴직연금기금제도","deleted":false,"text":"1. 기금제도사용자부담금계정에 관하여는 제22조를 준용한다. 이 경우 \"확정기여형퇴직연금제도\"는 \"중소기업퇴직연금기금제도\"로 본다.\n2. 기금제도가입자부담금계정에 관하여는 제24조제5항을 준용한다. 이 경우 \"개인형퇴직연금제도\"는 \"중소기업퇴직연금기금제도\"로 본다.\n제23조의13(적립금의 중도인출) 중소기업퇴직연금기금제도의 적립금 중도인출에 관한 사항은 다음 각 호에 따른다.","kind":"L"},{"id":"L:23-14","label":"법 제23조의14","title":"국가의 지원","chapter":"제4장의2 중소기업퇴직연금기금제도","deleted":false,"text":"① 국가는 중소기업퇴직연금기금제도에 가입하는 사업의 재정적 부담을 경감하고, 근로자 및 「산업재해보상보험법」 제91조의15에 해당하는 노무제공자 등의 중소기업퇴직연금 가입을 촉진하기 위하여 고용노동부장관이 정하는 요건에 해당하는 경우 사용자부담금, 가입자부담금 또는 중소기업퇴직연금기금제도 운영에 따른 비용의 일부 등을 예산의 범위에서 지원할 수 있다. <개정 2026.3.17>\n② 제1항에 따른 지원대상, 지원수준 및 절차 등에 필요한 사항은 대통령령으로 정한다.\n③ 고용노동부장관은 제1항에 따라 국가의 지원을 받은 자가 다음 각 호의 어느 하나에 해당하는 경우에는 지원금의 전부 또는 일부를 대통령령으로 정하는 바에 따라 환수할 수 있다. 다만, 환수할 지원금액(이하 \"환수금\"이라 한다)이 대통령령으로 정하는 금액 미만인 경우에는 환수하지 아니할 수 있다.\n1. 거짓이나 그 밖의 부정한 방법으로 지원금을 받은 경우\n2. 지원금이 잘못 지급된 경우\n3. 사용자가 도산 등 대통령령으로 정하는 정당한 사유 없이 중소기업퇴직연금기금제도를 폐지한 경우\n④ 공단은 제3항에 따른 환수금을 국세강제징수의 예에 따라 징수할 수 있다.\n⑤ 공단은 제3항에 따른 환수금 징수를 위하여 「지방세법」에 따른 재산세 과세자료 등 대통령령으로 정하는 자료의 제공 또는 관련 전산망의 이용을 관계 기관의 장에게 요청할 수 있다. 이 경우 관계 기관의 장은 정당한 사유가 없으면 그 요청에 따라야 한다.\n⑥ 제5항에 따라 공단에 제공되는 자료에 대해서는 수수료 또는 사용료 등을 면제한다.\n제23조의14(국가의 지원)","kind":"L"},{"id":"L:23-15","label":"법 제23조의15","title":"공단의 책무","chapter":"제4장의2 중소기업퇴직연금기금제도","deleted":false,"text":"① 공단은 중소기업퇴직연금기금제도 가입자에 대하여 중소기업퇴직연금기금제도 운영 상황 등 대통령령으로 정하는 사항에 대하여 매년 1회 이상 교육을 실시하여야 한다.\n② 공단은 매년 중소기업퇴직연금기금제도의 취급실적, 운용현황 및 수익률 등을 대통령령으로 정하는 바에 따라 공시하여야 한다.\n③ 공단은 중소기업퇴직연금기금표준계약서 내용이 변경된 때에는 고용노동부장관이 정하는 바에 따라 사용자 및 가입자에게 그 변경 사항을 통보하여야 한다.\n④ 그 밖에 공단의 책무에 관한 사항은 제33조제1항부터 제4항까지를 준용한다. 이 경우 \"퇴직연금사업자\"는 \"공단\"으로, \"제28조제1항 및 제29조제1항에 따른 계약의 내용\"은 \"제23조의5제1항 각 호에 따른 계약의 내용\"으로, \"제28조제1항에 따른 운용관리업무의 수행계약 체결을 거부하는 행위\" 및 \"제29조제1항에 따른 자산관리업무의 수행계약 체결을 거부하는 행위\"는 각각 \"제23조의6에 따른 계약의 체결을 거부하는 행위\"로 본다.\n제23조의15(공단의 책무)","kind":"L"},{"id":"L:23-16","label":"법 제23조의16","title":"지도ㆍ감독 등","chapter":"제4장의2 중소기업퇴직연금기금제도","deleted":false,"text":"1. 공단의 중소기업퇴직연금기금제도 관리 및 운영 실태에 관한 사항\n2. 제23조의3에 따른 중소기업퇴직연금기금의 관리ㆍ운용에 관한 사항\n제23조의16(지도ㆍ감독 등) 고용노동부장관은 중소기업퇴직연금기금제도의 원활한 운영을 위하여 공단이 다음 각 호의 사항을 보고하게 하거나 소속 공무원으로 하여금 그 장부ㆍ서류 또는 그 밖의 물건을 검사하게 할 수 있으며, 필요하다고 인정하는 경우에는 대통령령으로 정하는 바에 따라 그 운영 등에 시정을 명할 수 있다.","kind":"L"},{"id":"L:24","label":"법 제24조","title":"개인형퇴직연금제도의 설정 및 운영 등","chapter":"제5장 개인형퇴직연금제도","deleted":false,"text":"① 퇴직연금사업자는 개인형퇴직연금제도를 운영할 수 있다.\n② 다음 각 호의 어느 하나에 해당하는 사람은 개인형퇴직연금제도를 설정할 수 있다. <개정 2021.4.13>\n1. 퇴직급여제도의 일시금을 수령한 사람\n2. 확정급여형퇴직연금제도, 확정기여형퇴직연금제도 또는 중소기업퇴직연금기금제도의 가입자로서 자기의 부담으로 개인형퇴직연금제도를 추가로 설정하려는 사람\n3. 자영업자 등 안정적인 노후소득 확보가 필요한 사람으로서 대통령령으로 정하는 사람\n③ 제2항에 따라 개인형퇴직연금제도를 설정한 사람은 자기의 부담으로 개인형퇴직연금제도의 부담금을 납입한다. 다만, 대통령령으로 정하는 한도를 초과하여 부담금을 납입할 수 없다.\n④ 개인형퇴직연금제도 적립금의 운용방법 및 운용에 관한 정보제공에 관하여는 제21조 및 제21조의2부터 제21조의4까지를 준용한다. 이 경우 \"확정기여형퇴직연금제도\"는 \"개인형퇴직연금제도\"로 본다. <개정 2022.1.11>\n⑤ 개인형퇴직연금제도의 급여의 종류별 수급요건 및 중도인출에 관하여는 대통령령으로 정한다.\n제24조(개인형퇴직연금제도의 설정 및 운영 등)","kind":"L"},{"id":"L:25","label":"법 제25조","title":"10명 미만을 사용하는 사업에 대한 특례","chapter":"제5장 개인형퇴직연금제도","deleted":false,"text":"① 상시 10명 미만의 근로자를 사용하는 사업의 경우 제4조제1항 및 제5조에도 불구하고 사용자가 개별 근로자의 동의를 받거나 근로자의 요구에 따라 개인형퇴직연금제도를 설정하는 경우에는 해당 근로자에 대하여 퇴직급여제도를 설정한 것으로 본다.\n② 제1항에 따라 개인형퇴직연금제도를 설정하는 경우에는 다음 각 호의 사항은 준수되어야 한다.\n1. 사용자가 퇴직연금사업자를 선정하는 경우에 개별 근로자의 동의를 받을 것. 다만, 근로자가 요구하는 경우에는 스스로 퇴직연금사업자를 선정할 수 있다.\n2. 사용자는 가입자별로 연간 임금총액의 12분의 1 이상에 해당하는 부담금을 현금으로 가입자의 개인형퇴직연금제도 계정에 납입할 것\n3. 사용자가 부담하는 부담금 외에 가입자의 부담으로 추가 부담금을 납입할 수 있을 것\n4. 사용자는 매년 1회 이상 정기적으로 제2호에 따른 부담금을 가입자의 개인형퇴직연금제도 계정에 납입할 것. 이 경우 납입이 지연된 부담금에 대한 지연이자의 납입에 관하여는 제20조제3항 후단 및 제4항을 준용한다.\n5. 그 밖에 근로자의 급여 수급권의 안정적인 보호를 위하여 대통령령으로 정하는 사항\n③ 사용자는 개인형퇴직연금제도 가입자의 퇴직 등 대통령령으로 정하는 사유가 발생한 때에 해당 가입자에 대한 제2항제2호에 따른 부담금을 납입하지 아니한 경우에는 그 사유가 발생한 날부터 14일 이내에 그 부담금과 같은 항 제4호 후단에 따른 지연이자를 해당 가입자의 개인형퇴직연금제도의 계정에 납입하여야 한다. 다만, 특별한 사정이 있는 경우에는 당사자 간의 합의에 따라 납입 기일을 연장할 수 있다.\n제25조(10명 미만을 사용하는 사업에 대한 특례)","kind":"L"},{"id":"L:26","label":"법 제26조","title":"퇴직연금사업자의 등록","chapter":"제6장 퇴직연금사업자 및 업무의 수행","deleted":false,"text":"1. 「자본시장과 금융투자업에 관한 법률」에 따른 투자매매업자, 투자중개업자 또는 집합투자업자\n2. 「보험업법」 제2조제6호에 따른 보험회사\n3. 「은행법」 제2조제1항제2호에 따른 은행\n4. 「신용협동조합법」 제2조제2호에 따른 신용협동조합중앙회\n5. 「새마을금고법」 제2조제3항에 따른 새마을금고중앙회\n6. 공단(공단의 퇴직연금사업 대상은 상시 30명 이하의 근로자를 사용하는 사업에 한정한다)\n7. 그 밖에 제1호부터 제6호까지에 준하는 자로서 대통령령으로 정하는 자\n제26조(퇴직연금사업자의 등록) 다음 각 호의 어느 하나에 해당하는 자로서 퇴직연금사업자가 되려는 자는 재무건전성 및 인적ㆍ물적 요건 등 대통령령으로 정하는 요건을 갖추어 고용노동부장관에게 등록하여야 한다. <개정 2020.5.26, 2021.4.13>","kind":"L"},{"id":"L:27","label":"법 제27조","title":"퇴직연금사업자에 대한 등록취소 및 이전명령","chapter":"제6장 퇴직연금사업자 및 업무의 수행","deleted":false,"text":"① 고용노동부장관은 퇴직연금사업자가 다음 각 호의 어느 하나에 해당되는 경우에는 고용노동부령으로 정하는 바에 따라 시정을 명하거나 등록을 취소할 수 있다. 다만, 제1호 및 제2호에 해당하는 경우에는 등록을 취소하여야 한다.\n1. 해산한 경우\n2. 거짓이나 그 밖의 부정한 방법으로 제26조에 따른 등록을 한 경우\n3. 제26조에 따른 등록요건을 갖추지 못하게 된 경우\n4. 제36조에 따른 고용노동부장관 또는 금융위원회의 명령에 따르지 아니한 경우\n② 제1항에 따라 등록이 취소된 퇴직연금사업자는 등록이 취소된 날부터 3년간 퇴직연금사업자 등록을 할 수 없다.\n③ 퇴직연금제도 관련 업무를 중단하려는 퇴직연금사업자는 고용노동부장관에게 등록의 말소를 신청하여야 한다. 이 경우 등록이 말소된 퇴직연금사업자는 말소된 날부터 2년간 퇴직연금사업자 등록을 할 수 없다.\n④ 제1항 또는 제3항에 따라 등록취소 처분을 받거나 등록말소를 신청한 퇴직연금사업자는 설정된 퇴직연금제도의 이전에 필요한 조치 등 대통령령으로 정하는 가입자 보호조치를 하여야 한다.\n⑤ 고용노동부장관은 제1항 또는 제3항에 따라 등록을 취소하거나 말소하는 경우에 근로자의 퇴직급여등 수급권 보호를 위하여 필요하다고 인정하면 등록이 취소되거나 말소되는 퇴직연금사업자에게 그 업무의 전부 또는 일부를 다른 퇴직연금사업자에게 이전할 것을 명할 수 있다. 이 경우 고용노동부장관은 그 업무의 전부 또는 일부를 이전받는 퇴직연금사업자의 동의를 받아야 한다.\n제27조(퇴직연금사업자에 대한 등록취소 및 이전명령)","kind":"L"},{"id":"L:28","label":"법 제28조","title":"운용관리업무에 관한 계약의 체결","chapter":"제6장 퇴직연금사업자 및 업무의 수행","deleted":false,"text":"① 퇴직연금제도를 설정하려는 사용자 또는 가입자는 퇴직연금사업자와 다음 각 호의 업무(이하 \"운용관리업무\"라 한다)를 하는 것을 내용으로 하는 계약을 체결하여야 한다. 다만, 제1호의2의 업무는 확정기여형퇴직연금제도를 설정할 때에만 해당하고, 제2호의 업무는 확정급여형퇴직연금제도를 설정할 때에만 해당한다. <개정 2021.4.13, 2022.1.11>\n1. 사용자 또는 가입자에 대한 적립금 운용방법 및 운용방법별 정보의 제공\n1의2. 사전지정운용제도의 설정 및 운영에 관한 업무\n2. 연금제도 설계 및 연금 회계처리\n3. 적립금 운용현황의 기록ㆍ보관ㆍ통지\n4. 사용자 또는 가입자가 선정한 운용방법을 제29조제1항에 따른 자산관리업무를 수행하는 퇴직연금사업자에게 전달하는 업무\n5. 그 밖에 운용관리업무의 적절한 수행을 위하여 대통령령으로 정하는 업무\n② 제1항에 따라 운용관리업무를 수행하는 퇴직연금사업자는 대통령령으로 정하는 일부 업무를 인적ㆍ물적 요건 등 대통령령으로 정하는 요건을 갖춘 자에게 처리하게 할 수 있다.\n제28조(운용관리업무에 관한 계약의 체결)","kind":"L"},{"id":"L:29","label":"법 제29조","title":"자산관리업무에 관한 계약의 체결","chapter":"제6장 퇴직연금사업자 및 업무의 수행","deleted":false,"text":"① 퇴직연금제도를 설정한 사용자 또는 가입자는 다음 각 호의 업무(이하 \"자산관리업무\"라 한다)의 수행을 내용으로 하는 계약을 퇴직연금사업자와 체결하여야 한다.\n1. 계좌의 설정 및 관리\n2. 부담금의 수령\n3. 적립금의 보관 및 관리\n4. 운용관리업무를 수행하는 퇴직연금사업자가 전달하는 적립금 운용지시의 이행\n5. 급여의 지급\n6. 그 밖에 자산관리업무의 적절한 수행을 위하여 대통령령으로 정하는 업무\n② 사용자 또는 가입자가 제1항에 따른 계약을 체결하려는 경우에는 근로자 또는 가입자를 피보험자 또는 수익자로 하여 대통령령으로 정하는 보험계약 또는 신탁계약의 방법으로 하여야 한다.\n제29조(자산관리업무에 관한 계약의 체결)","kind":"L"},{"id":"L:29-2","label":"법 제29조의2","title":"수수료","chapter":"제6장 퇴직연금사업자 및 업무의 수행","deleted":false,"text":"① 퇴직연금사업자가 운용관리업무, 자산관리업무 및 그 밖에 대통령령으로 정하는 업무의 수행에 따라 사용자 및 가입자로부터 받는 수수료는 해당 업무의 수행에 따라 발생되는 비용과 적립금의 운용 손익 등을 고려하여 합리적으로 정하여야 한다.\n② 제1항에 따라 사용자 및 가입자로부터 받는 수수료는 대통령령으로 정하는 부과기준 등을 준수하여야 한다.\n③ 고용노동부장관은 가입자의 수급권 보호를 위하여 퇴직연금사업자에게 수수료 부과기준 등 대통령령으로 정하는 자료의 제출을 요구할 수 있다.\n제29조의2(수수료)","kind":"L"},{"id":"L:30","label":"법 제30조","title":"운용관리업무의 수행","chapter":"제6장 퇴직연금사업자 및 업무의 수행","deleted":false,"text":"① 퇴직연금사업자는 선량한 관리자로서의 주의의무를 다하여야 한다.\n② 퇴직연금사업자는 적립금의 운용방법을 제시하는 경우에 다음 각 호의 요건을 갖춘 운용방법을 제시하여야 한다.\n1. 운용방법에 관한 정보의 취득과 이해가 쉬울 것\n2. 운용방법 간의 변경이 쉬울 것\n3. 적립금 운용결과의 평가 방법과 절차가 투명할 것\n4. 확정기여형퇴직연금제도와 개인형퇴직연금제도의 경우에는 대통령령으로 정하는 원리금보장 운용방법이 하나 이상 포함될 것\n5. 적립금의 중장기 안정적 운용을 위하여 분산투자 등 대통령령으로 정하는 운용방법 및 기준 등에 따를 것\n제30조(운용관리업무의 수행)","kind":"L"},{"id":"L:31","label":"법 제31조","title":"모집업무의 위탁","chapter":"제6장 퇴직연금사업자 및 업무의 수행","deleted":false,"text":"① 퇴직연금사업자는 다음 각 호의 요건을 모두 갖춘 자(이하 \" 퇴직연금제도 모집인\")에게 퇴직연금제도를 설정하거나 가입할 자를 모집하는 업무(이하 \"모집업무\")로서 대통령령으로 정하는 업무를 위탁할 수 있다. <개정 2020.5.26>\n1. 제2항에 따라 고용노동부장관에게 등록된 자가 아닐 것\n2. 퇴직연금제도에 대한 전문 지식이 있는 자로서 대통령령으로 정하는 요건을 갖출 것\n3. 제6항에 따라 등록이 취소된 경우 그 등록이 취소된 날부터 3년이 지났을 것\n② 퇴직연금사업자는 제1항에 따라 퇴직연금제도 모집업무를 위탁한 경우에는 위탁받은 자를 고용노동부장관에게 등록하여야 한다. 이 경우 고용노동부장관은 그 등록업무를 대통령령으로 정하는 바에 따라 고용노동부장관이 정하는 기관에 위탁할 수 있다.\n③ 제1항에 따라 퇴직연금제도 모집업무를 위탁받은 자는 제2항에 따른 등록을 하지 아니하고는 퇴직연금제도 모집업무를 수행하여서는 아니 된다.\n④ 퇴직연금사업자는 제2항에 따라 등록한 퇴직연금제도 모집인 이외의 자에게 모집업무를 위탁하여서는 아니 된다.\n⑤ 제2항에 따른 등록 신청, 방법, 절차 및 그 밖에 등록을 위하여 필요한 사항은 고용노동부장관이 정한다.\n⑥ 고용노동부장관은 다음 각 호의 어느 하나에 해당하는 경우 제2항의 퇴직연금제도 모집인에 대한 등록을 취소하거나 6개월 이내에서 모집업무를 정지할 수 있다.\n1. 제1항 각 호의 요건을 갖추지 못한 경우\n2. 제7항 각 호의 위탁받은 자의 준수사항을 위반한 경우\n⑦ 제1항에 따라 업무를 위탁한 경우 위탁받은 자는 다음 각 호의 사항을 지켜야 한다.\n1. 위탁한 업무를 다른 자에게 다시 위탁하지 아니할 것\n2. 허위 정보에 의한 모집행위 금지 등 퇴직연금제도의 적절한 운영을 위하여 필요한 사항으로서 대통령령으로 정하는 사항\n⑧ 퇴직연금사업자는 제1항에 따라 모집업무를 위탁받은 자가 제7항 각 호에 따른 준수사항을 지키지 아니한 경우에는 모집업무의 위탁을 취소하여야 한다.\n⑨ 퇴직연금사업자는 퇴직연금제도 모집인이 퇴직연금제도 모집업무를 수행할 때 법령을 준수하고 건전한 거래질서를 해하는 일이 없도록 성실히 관리하여야 하며, 이를 위한 퇴직연금제도 모집업무수행기준을 정하여야 한다. <개정 2020.5.26>\n⑩ 「민법」 제756조는 퇴직연금제도 모집인이 모집업무를 수행하면서 사용자 또는 가입자에게 손해를 끼친 경우에 준용한다. <개정 2020.5.26>\n제31조(모집업무의 위탁)","kind":"L"},{"id":"L:32","label":"법 제32조","title":"사용자의 책무","chapter":"제7장 책무 및 감독","deleted":false,"text":"① 사용자는 법령, 퇴직연금규약 또는 중소기업퇴직연금기금표준계약서를 준수하고 가입자 등을 위하여 대통령령으로 정하는 사항에 관하여 성실하게 이 법에 따른 의무를 이행하여야 한다. <개정 2021.4.13>\n② 확정급여형퇴직연금제도 또는 확정기여형퇴직연금제도를 설정한 사용자는 매년 1회 이상 가입자에게 해당 사업의 퇴직연금제도 운영 상황 등 대통령령으로 정하는 사항에 관한 교육을 하여야 한다. 이 경우 사용자는 퇴직연금사업자 또는 대통령령으로 정하는 요건을 갖춘 전문기관에 그 교육의 실시를 위탁할 수 있다. <개정 2021.4.13>\n③ 제2항에 따른 교육 내용 및 방법 등에 필요한 사항은 대통령령으로 정한다. <신설 2021.4.13>\n④ 퇴직연금제도를 설정한 사용자는 다음 각 호의 어느 하나에 해당하는 행위를 하여서는 아니 된다. <개정 2021.4.13>\n1. 자기 또는 제3자의 이익을 도모할 목적으로 운용관리업무 및 자산관리업무의 수행계약을 체결하는 행위\n2. 그 밖에 퇴직연금제도의 적절한 운영을 방해하는 행위로서 대통령령으로 정하는 행위\n⑤ 확정급여형퇴직연금제도 또는 퇴직금제도를 설정한 사용자는 다음 각 호의 어느 하나에 해당하는 사유가 있는 경우 근로자에게 퇴직급여가 감소할 수 있음을 미리 알리고 근로자대표와의 협의를 통하여 확정기여형퇴직연금제도나 중소기업퇴직연금기금제도로의 변경, 퇴직급여 산정기준의 개선 등 근로자의 퇴직급여 감소를 예방하기 위하여 필요한 조치를 하여야 한다. <신설 2018.6.12, 2021.4.13>\n1. 사용자가 단체협약 및 취업규칙 등을 통하여 일정한 연령, 근속시점 또는 임금액을 기준으로 근로자의 임금을 조정하고 근로자의 정년을 연장하거나 보장하는 제도를 시행하려는 경우\n2. 사용자가 근로자와 합의하여 소정근로시간을 1일 1시간 이상 또는 1주 5시간 이상 단축함으로써 단축된 소정근로시간에 따라 근로자가 3개월 이상 계속 근로하기로 한 경우\n3. 법률 제15513호 근로기준법 일부개정법률 시행에 따라 근로시간이 단축되어 근로자의 임금이 감소하는 경우\n4. 그 밖에 임금이 감소되는 경우로서 고용노동부령으로 정하는 경우\n제32조(사용자의 책무)","kind":"L"},{"id":"L:33","label":"법 제33조","title":"퇴직연금사업자의 책무","chapter":"제7장 책무 및 감독","deleted":false,"text":"① 퇴직연금사업자는 이 법을 준수하고 가입자를 위하여 성실하게 그 업무를 하여야 한다.\n② 퇴직연금사업자는 제28조제1항 및 제29조제1항에 따른 계약의 내용을 지켜야 한다.\n③ 퇴직연금사업자는 정당한 사유 없이 다음 각 호의 어느 하나에 해당하는 행위를 하여서는 아니 된다.\n1. 제28조제1항에 따른 운용관리업무의 수행계약 체결을 거부하는 행위\n2. 제29조제1항에 따른 자산관리업무의 수행계약 체결을 거부하는 행위\n3. 특정 퇴직연금사업자와 계약을 체결할 것을 강요하는 행위\n4. 그 밖에 사용자 또는 가입자의 이익을 침해할 우려가 있는 행위로서 대통령령으로 정하는 행위\n④ 운용관리업무를 수행하는 퇴직연금사업자는 다음 각 호의 어느 하나에 해당하는 행위를 하여서는 아니 된다.\n1. 계약체결 시 가입자 또는 사용자의 손실의 전부 또는 일부를 부담하거나 부담할 것을 약속하는 행위\n2. 가입자 또는 사용자에게 경제적 가치가 있는 과도한 부가적 서비스를 제공하거나 가입자 또는 사용자가 부담하여야 할 경비를 퇴직연금사업자가 부담하는 등 대통령령으로 정하는 특별한 이익을 제공하거나 제공할 것을 약속하는 행위\n3. 가입자의 성명ㆍ주소 등 개인정보를 퇴직연금제도의 운용과 관련된 업무수행에 필요한 범위를 벗어나서 사용하는 행위\n4. 자기 또는 제3자의 이익을 도모할 목적으로 특정 운용 방법을 가입자 또는 사용자에게 제시하는 행위\n⑤ 제24조제1항에 따라 개인형퇴직연금제도를 운영하는 퇴직연금사업자는 해당 사업의 퇴직연금제도 운영 상황 등 대통령령으로 정하는 사항에 대하여 매년 1회 이상 가입자에게 교육을 하여야 한다.\n⑥ 퇴직연금사업자는 고용노동부령으로 정하는 바에 따라 퇴직연금제도의 취급실적을 사용자(개인형퇴직연금제도의 취급실적은 제외한다), 고용노동부장관 및 금융감독원장에게 제출하여야 한다.\n⑦ 퇴직연금사업자는 제28조제1항 및 제29조제1항에 따른 계약 체결과 관련된 약관 또는 표준계약서(이하 \"약관등\"이라 한다)를 제정하거나 변경하려는 경우에는 미리 금융감독원장에게 보고하여야 한다. 다만, 근로자 또는 사용자의 권익이나 의무에 불리한 영향을 주지 아니하는 경우로서 금융위원회가 정하는 경우에는 약관등의 제정 또는 변경 후 10일 이내에 금융감독원장에게 보고할 수 있다.\n⑧ 퇴직연금사업자는 매년 말 적립금 운용 수익률 및 수수료 등을 금융위원회가 정하는 바에 따라 공시하여야 한다.\n제33조(퇴직연금사업자의 책무)","kind":"L"},{"id":"L:34","label":"법 제34조","title":"정부의 책무 등","chapter":"제7장 책무 및 감독","deleted":false,"text":"① 정부는 퇴직연금제도가 활성화될 수 있도록 지원방안을 마련하여야 한다.\n② 정부는 퇴직연금제도의 건전한 정착 및 발전을 위하여 다음 각 호의 조치를 할 수 있다. <개정 2021.4.13>\n1. 노사단체, 퇴직연금업무 유관기관ㆍ단체와의 공동 연구사업 및 행정적ㆍ재정적 지원\n2. 퇴직연금제도 운영과 관련한 퇴직연금사업자 평가\n3. 건전하고 효율적인 퇴직연금제도 운영을 위한 전문 강사 육성 및 교재의 지원\n4. 그 밖에 근로자의 안정적인 노후생활 보장을 위하여 대통령령으로 정하는 사항\n③ 제2항제2호에 따른 평가는 퇴직연금사업자의 운용성과, 운용역량, 수수료의 적정성 등을 대상으로 하며, 그 밖에 평가절차 및 방법 등에 필요한 사항은 대통령령으로 정한다. <신설 2021.4.13>\n④ 정부는 퇴직연금제도의 급여 지급 보장을 위한 장치 마련 등 근로자의 급여 수급권 보호를 위한 방안을 강구하도록 노력하여야 한다. <개정 2021.4.13>\n제34조(정부의 책무 등)","kind":"L"},{"id":"L:35","label":"법 제35조","title":"사용자에 대한 감독","chapter":"제7장 책무 및 감독","deleted":false,"text":"① 고용노동부장관은 사용자가 퇴직연금제도의 설정 또는 그 운영 등에 관하여 이 법 또는 퇴직연금규약 및 중소기업퇴직연금기금표준계약서에 위반되는 행위를 한 경우에는 기간을 정하여 그 위반의 시정을 명할 수 있다. <개정 2021.4.13>\n② 고용노동부장관은 사용자가 제1항에 따른 기간 이내에 시정명령에 따르지 아니하는 경우에는 퇴직연금제도 운영의 중단을 명할 수 있다.\n제35조(사용자에 대한 감독)","kind":"L"},{"id":"L:36","label":"법 제36조","title":"퇴직연금사업자에 대한 감독","chapter":"제7장 책무 및 감독","deleted":false,"text":"① 고용노동부장관은 퇴직연금사업자가 이 법을 위반하는 행위를 한 경우에는 기간을 정하여 그 위반의 시정을 명할 수 있다.\n② 고용노동부장관은 퇴직연금사업자가 제1항에 따른 시정명령에 따르지 아니하는 경우에는 이 법에 따라 수행하는 업무를 다른 퇴직연금사업자에게 이전할 것을 명할 수 있다.\n③ 금융위원회는 퇴직연금제도의 안정적 운영과 근로자의 수급권 보호를 위하여 대통령령으로 정하는 업무에 관하여 퇴직연금사업자를 감독하고, 퇴직연금사업자가 제33조를 위반하는 경우 다음 각 호의 조치를 할 수 있다.\n1. 퇴직연금사업자에 대한 주의, 그 임원에 대한 주의 또는 그 직원에 대한 주의ㆍ견책ㆍ감봉ㆍ정직ㆍ면직의 요구\n2. 해당 위반행위에 대한 시정명령\n3. 임원의 해임권고 또는 직무정지요구\n4. 6개월 이내의 영업의 일부정지\n④ 금융감독원장은 퇴직연금사업자의 업무 및 재산상황 등을 검사할 수 있고, 제33조제7항에 따라 퇴직연금사업자가 보고한 약관등이 이 법에 위배될 경우에는 변경ㆍ보완을 명할 수 있다.\n제36조(퇴직연금사업자에 대한 감독)","kind":"L"},{"id":"L:37","label":"법 제37조","title":"금융거래정보의 제공 요청 등","chapter":"제7장 책무 및 감독","deleted":false,"text":"① 고용노동부장관은 사용자가 제16조에 따른 급여 지급능력을 확보하였는지 등 퇴직연금제도 운영을 감독하기 위하여 필요한 경우 「금융실명거래 및 비밀보장에 관한 법률」 제4조 및 「신용정보의 이용 및 보호에 관한 법률」 제33조에도 불구하고 자산관리업무 및 운용관리업무 계약을 체결한 사업에 관한 다음 각 호의 금융거래에 관한 정보 또는 자료(이하 \"금융거래정보\"라 한다)의 제공을 퇴직연금사업자에게 요청할 수 있다.\n1. 가입자 현황\n2. 급여 지급 현황\n3. 부담금 납입 현황\n4. 적립금 운용현황에 관한 정보\n② 고용노동부장관이 제1항에 따라 금융거래정보를 요청할 때에는 다음 각 호의 사항을 적은 문서로 요청하여야 한다.\n1. 요청대상 거래기간\n2. 요청의 법적 근거\n3. 사용목적\n4. 요청하는 금융거래정보의 내용\n③ 제1항에 따른 금융거래정보의 요청은 퇴직연금제도 운영의 건전성 감독을 위하여 필요한 최소한도에 그쳐야 한다.\n④ 제2항에 따라 퇴직연금사업자가 고용노동부장관에게 금융거래정보를 제공하는 경우에는 그 퇴직연금사업자는 금융거래정보를 제공한 날부터 10일 이내에 제공한 금융거래정보의 주요 내용, 사용목적, 제공받은 자 및 제공일자 등을 해당 사용자 또는 가입자에게 서면으로 알려야 한다. 이 경우 통지에 드는 비용에 관하여는 「금융실명거래 및 비밀보장에 관한 법률」 제4조의2제4항을 준용한다.\n⑤ 고용노동부장관은 제1항에 따라 퇴직연금사업자에게 금융거래정보를 요구하는 경우에는 그 사실을 기록하여야 하며, 금융거래정보를 요구한 날부터 5년간 그 기록을 보관하여야 한다.\n⑥ 제1항에 따라 금융거래정보를 제공받아 알게 된 자는 그 알게 된 금융거래정보를 타인에게 제공 또는 누설하거나 그 목적 외의 용도로 이용하여서는 아니 된다.\n제37조(금융거래정보의 제공 요청 등)","kind":"L"},{"id":"L:38","label":"법 제38조","title":"퇴직연금제도의 폐지ㆍ중단 시의 처리","chapter":"제8장 보칙","deleted":false,"text":"① 퇴직연금제도가 폐지되거나 운영이 중단된 경우에는 폐지된 이후 또는 중단된 기간에 대하여는 제8조제1항에 따른 퇴직금제도를 적용한다.\n② 사용자는 퇴직연금제도가 폐지된 경우 지체 없이 적립금으로 급여를 지급하는 데에 필요한 조치로서 미납 부담금의 납입 등 대통령령으로 정하는 조치를 하여야 한다.\n③ 사용자와 퇴직연금사업자는 제35조제2항에 따른 사유 등으로 퇴직연금제도가 중단된 경우에 적립금 운용에 필요한 업무 등 대통령령으로 정하는 기본적인 업무를 유지하여야 한다.\n④ 사용자와 퇴직연금사업자는 퇴직연금제도가 폐지되어 가입자에게 급여를 지급하는 경우에 가입자가 지정한 개인형퇴직연금제도의 계정으로 이전하는 방법으로 지급하여야 한다. 다만, 가입자가 개인형퇴직연금제도의 계정을 지정하지 아니한 경우에는 제17조제5항을 준용한다.\n⑤ 가입자가 제4항에 따라 급여를 받은 경우에는 제8조제2항에 따라 중간정산되어 받은 것으로 본다. 이 경우 중간정산 대상기간의 산정 등에 필요한 사항은 대통령령으로 정한다.\n제38조(퇴직연금제도의 폐지ㆍ중단 시의 처리)","kind":"L"},{"id":"L:39","label":"법 제39조","title":"업무의 협조","chapter":"제8장 보칙","deleted":false,"text":"제39조(업무의 협조) 고용노동부장관은 이 법의 시행을 위하여 필요한 경우에 금융위원회 등 관련 기관에 자료의 제출을 요청할 수 있다. 이 경우 자료의 제출을 요청받은 기관은 정당한 사유가 없으면 이를 거부하여서는 아니 된다.","kind":"L"},{"id":"L:40","label":"법 제40조","title":"보고 및 조사","chapter":"제8장 보칙","deleted":false,"text":"① 고용노동부장관은 이 법 시행에 필요한 범위에서 사용자 및 퇴직연금사업자에게 퇴직연금제도의 실시 상황 등에 관한 보고, 관계 서류의 제출 또는 관계인의 출석을 요구할 수 있다.\n② 고용노동부장관은 이 법의 시행을 위하여 필요하다고 인정하는 경우에는 소속 직원으로 하여금 퇴직연금제도를 실시하는 사업장 및 해당 퇴직연금사업자의 사업장에 출입하여 사용자 및 퇴직연금사업자 등 관계인에 대하여 질문하거나 장부 등 서류를 조사하게 할 수 있다.\n③ 제2항에 따라 사업장 및 해당 퇴직연금사업자의 사업장에 출입하여 관계인에 대하여 질문하거나 장부 등 서류를 조사하려는 직원은 그 권한을 나타내는 증표를 지니고 이를 관계인에게 내보여야 한다.\n제40조(보고 및 조사)","kind":"L"},{"id":"L:41","label":"법 제41조","title":"청문","chapter":"제8장 보칙","deleted":false,"text":"제41조(청문) 고용노동부장관은 제27조제1항에 따른 등록취소 또는 제36조제2항에 따른 이전명령을 하려는 경우에는 청문을 하여야 한다.","kind":"L"},{"id":"L:42","label":"법 제42조","title":"권한의 위임ㆍ위탁","chapter":"제8장 보칙","deleted":false,"text":"① 이 법에 따른 고용노동부장관의 권한은 대통령령으로 정하는 바에 따라 그 일부를 금융위원회, 금융감독원장 또는 공단(제23조의14에 따른 지원 및 환수와 환수금 징수업무, 제34조제2항 각 호의 업무로 한정한다)에 위탁하거나 지방고용노동관서의 장에게 위임할 수 있다. <개정 2021.4.13>\n② 이 법에 따른 금융위원회의 권한은 대통령령으로 정하는 바에 따라 그 일부를 금융감독원장에게 위탁할 수 있다.\n제42조(권한의 위임ㆍ위탁)","kind":"L"},{"id":"L:43","label":"법 제43조","title":"벌칙","chapter":"제9장 벌칙","deleted":false,"text":"1. 제9조제1항을 위반하여 퇴직금을 지급하지 아니한 자\n2. 근로자가 퇴직할 때에 제17조제2항ㆍ제3항, 제20조제5항, 제23조의7제2항 또는 제25조제3항을 위반하여 급여를 지급하지 아니하거나 부담금 또는 지연이자를 납입하지 아니한 자\n3. 제37조제6항을 위반한 자\n제43조(벌칙) 다음 각 호의 어느 하나에 해당하는 자는 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다. 다만, 제1호 및 제2호의 경우(「근로기준법」 제43조의2에 따라 명단 공개된 체불사업주가 명단 공개 기간 중에 제1호 또는 제2호에 해당하는 경우는 제외한다) 피해자의 명시적인 의사에 반하여 공소를 제기할 수 없다. <개정 2021.4.13, 2026.3.17>","kind":"L"},{"id":"L:44","label":"법 제44조","title":"벌칙","chapter":"제9장 벌칙","deleted":false,"text":"1. 제27조제4항을 위반하여 가입자 보호조치를 하지 아니한 퇴직연금사업자\n2. 제33조제3항 및 제4항을 위반한 퇴직연금사업자\n제44조(벌칙) 다음 각 호의 어느 하나에 해당하는 자는 3년 이하의 징역 또는 3천만원 이하의 벌금에 처한다. <개정 2021.4.13, 2025.11.11, 2026.3.17>","kind":"L"},{"id":"L:45","label":"법 제45조","title":"벌칙","chapter":"제9장 벌칙","deleted":false,"text":"1. 제4조제2항을 위반하여 하나의 사업 안에 퇴직급여제도를 차등하여 설정한 자\n2. 제31조제3항을 위반하여 고용노동부장관에 등록하지 아니하고 퇴직연금제도 모집업무를 수행한 자\n3. 제31조제4항을 위반하여 퇴직연금제도 모집인 이외의 자에게 모집업무를 위탁한 퇴직연금사업자\n4. 제32조제4항제1호에 따른 책무를 위반한 사용자\n제45조(벌칙) 다음 각 호의 어느 하나에 해당하는 자는 2년 이하의 징역 또는 2천만원 이하의 벌금에 처한다. <개정 2021.4.13>","kind":"L"},{"id":"L:46","label":"법 제46조","title":"벌칙","chapter":"제9장 벌칙","deleted":false,"text":"1. 제4조제3항ㆍ제4항 또는 제25조제1항 및 제2항제1호를 위반하여 근로자대표 또는 개별 근로자의 동의를 받지 아니하거나 의견을 듣지 아니한 사용자\n1의2. 제23조의14제3항제1호에 따라 거짓이나 그 밖의 부정한 방법으로 지원금을 받은 자\n2. 제31조제7항을 위반한 자\n3. 제32조제5항을 위반하여 근로자에게 퇴직급여가 감소할 수 있음을 알리지 아니하거나 퇴직급여의 감소 예방을 위하여 필요한 조치를 하지 아니한 사용자\n제46조(벌칙) 다음 각 호의 어느 하나에 해당하는 자는 500만원 이하의 벌금에 처한다. <개정 2018.6.12, 2021.4.13>","kind":"L"},{"id":"L:47","label":"법 제47조","title":"양벌규정","chapter":"제9장 벌칙","deleted":false,"text":"제47조(양벌규정) 법인의 대표자나 법인 또는 개인의 대리인, 사용인, 그 밖의 종업원이 그 법인 또는 개인의 업무에 관하여 제44조부터 제46조까지의 어느 하나에 해당하는 위반행위를 하면 그 행위자를 벌하는 외에 그 법인 또는 개인에게도 해당 조문의 벌금형을 과(科)한다. 다만, 법인 또는 개인이 그 위반행위를 방지하기 위하여 해당 업무에 관하여 상당한 주의와 감독을 게을리하지 아니한 경우에는 그러하지 아니하다.","kind":"L"},{"id":"L:48","label":"법 제48조","title":"과태료","chapter":"제9장 벌칙","deleted":false,"text":"① 다음 각 호의 어느 하나에 해당하는 자에게는 1천만원 이하의 과태료를 부과한다. <개정 2021.4.13>\n1. 제16조제2항을 위반하여 적립금이 최소적립금을 넘고 있는지 확인하여 그 결과를 사용자에게 알리지 아니하거나, 적립금이 최소적립금보다 적은 경우 그 확인 결과를 근로자대표에게 알리지 아니한 퇴직연금사업자\n2. 제16조제3항에 따른 적립금 부족을 해소하지 아니한 사용자\n3. 제32조제2항에 따라 매년 1회 이상 교육을 하지 아니한 사용자\n4. 제33조제5항에 따라 매년 1회 이상 교육을 하지 아니한 퇴직연금사업자\n② 다음 각 호의 어느 하나에 해당하는 자에게는 500만원 이하의 과태료를 부과한다. <개정 2021.4.13, 2022.1.11>\n1. 제13조에 따른 확정급여형퇴직연금규약 또는 제19조에 따른 확정기여형퇴직연금규약을 신고하지 아니한 사용자\n1의2. 제18조의2제1항에 따른 적립금운용위원회를 구성하지 아니한 사용자\n1의3. 제18조의2제2항에 따른 적립금운용계획서를 작성하지 아니한 사용자\n1의4. 제29조의2제3항에 따른 자료의 제출 요구에 따르지 아니한 퇴직연금사업자\n2. 제32조제4항제2호에 따른 책무를 위반한 사용자\n3. 제33조제2항에 따른 책무를 위반한 퇴직연금사업자\n4. 제33조제6항을 위반하여 퇴직연금제도 취급실적을 제출하지 아니하거나 거짓으로 작성하여 제출한 퇴직연금사업자\n5. 제35조에 따른 시정명령을 이행하지 아니한 사용자\n③ 제1항 및 제2항에 따른 과태료는 대통령령으로 정하는 바에 따라 고용노동부장관이 부과ㆍ징수한다.\n제48조(과태료)","kind":"L"},{"id":"D:1","label":"영 제1조","title":"목적","chapter":"","deleted":false,"text":"제1조(목적) 이 영은 「근로자퇴직급여 보장법」에서 위임된 사항과 그 시행에 필요한 사항을 규정함을 목적으로 한다.","kind":"D"},{"id":"D:2","label":"영 제2조","title":"퇴직연금제도 수급권의 담보제공 사유 등","chapter":"","deleted":false,"text":"① 「근로자퇴직급여 보장법」(이하 \"법\"이라 한다) 제7조제2항 전단에서 \"주택구입 등 대통령령으로 정하는 사유와 요건을 갖춘 경우\"란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2015.12.15, 2019.7.2, 2019.10.29, 2020.11.3>\n1. 무주택자인 가입자가 본인 명의로 주택을 구입하는 경우\n1의2. 무주택자인 가입자가 주거를 목적으로 「민법」 제303조에 따른 전세금 또는 「주택임대차보호법」 제3조의2에 따른 보증금을 부담하는 경우. 이 경우 가입자가 하나의 사업 또는 사업장(이하 \"사업\"이라 한다)에 근로하는 동안 1회로 한정한다.\n2. 가입자가 6개월 이상 요양을 필요로 하는 다음 각 목의 어느 하나에 해당하는 사람의 질병이나 부상에 대한 의료비(「소득세법 시행령」 제118조의5제1항 및 제2항에 따른 의료비를 말한다. 이하 같다)를 부담하는 경우\n가. 가입자 본인\n나. 가입자의 배우자\n다. 가입자 또는 그 배우자의 부양가족(「소득세법」 제50조제1항제3호에 따른 부양가족을 말한다. 이하 같다)\n3. 담보를 제공하는 날부터 거꾸로 계산하여 5년 이내에 가입자가 「채무자 회생 및 파산에 관한 법률」에 따라 파산선고를 받은 경우\n4. 담보를 제공하는 날부터 거꾸로 계산하여 5년 이내에 가입자가 「채무자 회생 및 파산에 관한 법률」에 따라 개인회생절차개시 결정을 받은 경우\n4의2. 다음 각 목의 어느 하나에 해당하는 사람의 대학등록금, 혼례비 또는 장례비를 가입자가 부담하는 경우\n가. 가입자 본인\n나. 가입자의 배우자\n다. 가입자 또는 그 배우자의 부양가족\n5. 사업주의 휴업 실시로 근로자의 임금이 감소하거나 재난(「재난 및 안전관리 기본법」 제3조제1호에 따른 재난을 말한다. 이하 같다)으로 피해를 입은 경우로서 고용노동부장관이 정하여 고시하는 사유와 요건에 해당하는 경우\n② 법 제7조제2항 전단에서 \"대통령령으로 정하는 한도\"란 다음 각 호의 구분에 따른 한도를 말한다. <개정 2015.12.15, 2020.11.3>\n1. 제1항제1호, 제1호의2, 제2호부터 제4호까지 및 제4호의2의 경우: 가입자별 적립금의 100분의 50\n2. 제1항제5호의 경우: 임금 감소 또는 재난으로 입은 가입자의 피해 정도 등을 고려하여 고용노동부장관이 정하여 고시하는 한도\n제2조(퇴직연금제도 수급권의 담보제공 사유 등)","kind":"D"},{"id":"D:3","label":"영 제3조","title":"퇴직금의 중간정산 사유","chapter":"","deleted":false,"text":"① 법 제8조제2항 전단에서 \"주택구입 등 대통령령으로 정하는 사유\"란 다음 각 호의 경우를 말한다. <개정 2013.12.24, 2015.12.15, 2018.6.19, 2019.7.2, 2019.10.29, 2020.11.3, 2022.4.13>\n1. 무주택자인 근로자가 본인 명의로 주택을 구입하는 경우\n2. 무주택자인 근로자가 주거를 목적으로 「민법」 제303조에 따른 전세금 또는 「주택임대차보호법」 제3조의2에 따른 보증금을 부담하는 경우. 이 경우 근로자가 하나의 사업에 근로하는 동안 1회로 한정한다.\n3. 근로자가 6개월 이상 요양을 필요로 하는 다음 각 목의 어느 하나에 해당하는 사람의 질병이나 부상에 대한 의료비를 해당 근로자가 본인 연간 임금총액의 1천분의 125를 초과하여 부담하는 경우\n가. 근로자 본인\n나. 근로자의 배우자\n다. 근로자 또는 그 배우자의 부양가족\n4. 퇴직금 중간정산을 신청하는 날부터 거꾸로 계산하여 5년 이내에 근로자가 「채무자 회생 및 파산에 관한 법률」에 따라 파산선고를 받은 경우\n5. 퇴직금 중간정산을 신청하는 날부터 거꾸로 계산하여 5년 이내에 근로자가 「채무자 회생 및 파산에 관한 법률」에 따라 개인회생절차개시 결정을 받은 경우\n6. 사용자가 기존의 정년을 연장하거나 보장하는 조건으로 단체협약 및 취업규칙 등을 통하여 일정나이, 근속시점 또는 임금액을 기준으로 임금을 줄이는 제도를 시행하는 경우\n6의2. 사용자가 근로자와의 합의에 따라 소정근로시간을 1일 1시간 또는 1주 5시간 이상 단축함으로써 단축된 소정근로시간에 따라 근로자가 3개월 이상 계속 근로하기로 한 경우\n6의3. 법률 제15513호 근로기준법 일부개정법률의 시행에 따른 근로시간의 단축으로 근로자의 퇴직금이 감소되는 경우\n7. 재난으로 피해를 입은 경우로서 고용노동부장관이 정하여 고시하는 사유에 해당하는 경우\n② 사용자는 제1항 각 호의 사유에 따라 퇴직금을 미리 정산하여 지급한 경우 근로자가 퇴직한 후 5년이 되는 날까지 관련 증명 서류를 보존하여야 한다.\n제3조(퇴직금의 중간정산 사유)","kind":"D"},{"id":"D:3-2","label":"영 제3조의2","title":"퇴직금의 개인형퇴직연금제도 계정 등으로의 이전 예외 사유","chapter":"","deleted":false,"text":"① 법 제9조제2항 단서에서 \"근로자가 55세 이후에 퇴직하여 급여를 받는 경우 등 대통령령으로 정하는 사유가 있는 경우\"란 다음 각 호의 경우를 말한다.\n1. 근로자가 55세 이후에 퇴직하여 급여를 받는 경우\n2. 급여가 고용노동부장관이 정하여 고시하는 금액 이하인 경우\n3. 근로자가 사망한 경우\n4. 「출입국관리법 시행령」 제23조제1항에 따라 취업활동을 할 수 있는 체류자격으로 국내에서 근로를 제공하고 퇴직한 근로자가 퇴직 후 국외로 출국한 경우\n5. 다른 법령에서 급여의 전부 또는 일부를 공제하도록 한 경우\n② 제1항제5호의 사유로 급여에서 일부를 공제한 경우 남은 금액은 근로자가 지정한 개인형퇴직연금제도의 계정 또는 법 제23조의8에 따른 계정(이하 \"개인형퇴직연금계정등\"이라 한다)으로 이전해야 한다.\n제3조의2(퇴직금의 개인형퇴직연금제도 계정 등으로의 이전 예외 사유)","kind":"D"},{"id":"D:4","label":"영 제4조","title":"확정급여형퇴직연금규약의 규정 사항","chapter":"","deleted":false,"text":"① 법 제13조제11호에서 \"대통령령으로 정하는 사항\"이란 다음 각 호의 사항을 말한다. <개정 2022.4.13>\n1. 삭제<2022.4.13>\n2. 법 제28조에 따른 운용관리업무(이하 \"운용관리업무\"라 한다)와 법 제29조에 따른 자산관리업무(이하 \"자산관리업무\"라 한다)의 수행에 대한 수수료의 부담에 관한 사항\n3. 가입자에 대한 교육의 방법 및 절차 등에 관한 사항\n4. 복수의 퇴직연금사업자와 운용관리업무에 관한 계약을 체결한 경우 업무의 처리방안에 관한 사항. 이 경우 법 제17조제5항에 따라 가입자가 개인형퇴직연금계정등을 지정하지 않은 경우 급여를 이전(移轉)할 퇴직연금사업자의 지정에 관한 사항을 포함한다.\n② 법 제13조제10호의2에 따른 부담금을 산정하는 퇴직연금사업자는 재정균형을 장기적으로 유지할 수 있도록 장래 급여에 소요되는 비용예상액, 예상운용수입액 등을 고려해야 하며, 그 세부 기준은 고용노동부령으로 정한다. <개정 2022.4.13>\n③ 사용자는 매년 1회 이상 정기적으로 부담금을 납입하여야 한다.\n④ 제1항제2호에 따른 수수료는 사용자가 부담한다.\n⑤ 삭제 <2022.4.13>\n⑥ 복수의 퇴직연금사업자와 운용관리업무에 관한 계약을 체결한 사용자는 그 퇴직연금사업자 중 하나를 대표 퇴직연금사업자(이하 \"간사기관\"이라 한다)로 선정하여 제22조제1항제3호 각 목의 업무를 수행하도록 하여야 한다.\n제4조(확정급여형퇴직연금규약의 규정 사항)","kind":"D"},{"id":"D:5","label":"영 제5조","title":"확정급여형퇴직연금제도의 최소적립금 수준","chapter":"","deleted":false,"text":"① 법 제16조제1항 각 호 외의 부분 본문에서 \"대통령령으로 정하는 비율\"이란 100분의 80 이상으로서 고용노동부령으로 정하는 비율을 말한다. <개정 2022.4.13>\n② 법 제16조제1항 각 호 외의 부분 단서에서 \"대통령령으로 정하는 비율\"이란 법 제14조제2항에 따라 해당 퇴직연금제도의 설정 전에 해당 사업에서 제공한 근로기간(이하 \"과거근로기간\"이라 한다)을 가입기간에 포함시키는 경우 해당 근로기간에 대한 법 제16조제1항 각 호 외의 부분 본문의 기준책임준비금(이하 \"기준책임준비금\"이라 한다) 대비 적립금 비율로서 과거근로기간의 연수(年數)와 가입 후 연차(年次)의 구분에 따라 고용노동부장관이 정하여 고시하는 비율을 말한다. <개정 2022.4.13>\n제5조(확정급여형퇴직연금제도의 최소적립금 수준)","kind":"D"},{"id":"D:6","label":"영 제6조","title":"재정검증 결과의 통보","chapter":"","deleted":false,"text":"① 퇴직연금사업자는 법 제16조제2항에 따라 산정된 적립금과 법 제16조제1항 각 호 외의 부분 본문에 따른 최소적립금(이하 \"최소적립금\"이라 한다)을 비교하여 적립금의 부족 여부, 적립금 및 부담금 납입 현황, 제7조제2항에 따른 적립금 부족 해소 현황 등을 사용자에게 서면으로 알려야 한다. 다만, 적립금이 최소적립금보다 적은 경우에는 근로자의 과반수가 가입한 노동조합이 있는 경우에는 그 노동조합에도 서면으로 알리고, 근로자의 과반수가 가입한 노동조합이 없는 경우에는 전체 근로자에게도 서면 또는 정보통신망에 의한 방법으로 알려야 한다. <개정 2019.10.29, 2022.4.13, 2023.12.12>\n② 퇴직연금사업자는 제1항 단서에 따라 전체 근로자에게 알리기 위하여 사용자에게 다음 각 호의 사항에 대한 협조를 요청할 수 있다. 이 경우 사용자는 특별한 사유가 없는 한 이에 따라야 한다. <신설 2019.10.29>\n1. 사용자가 운영하는 사내 전산망에 대한 이용 제공\n2. 전체 근로자의 주소 또는 전자우편주소의 제공\n3. 전체 근로자에게 제1항 단서에 따른 사항의 통보\n③ 제1항에 따른 통보에 필요한 양식은 고용노동부장관이 정하여 고시한다. <개정 2019.10.29>\n제6조(재정검증 결과의 통보)","kind":"D"},{"id":"D:7","label":"영 제7조","title":"적립금 부족의 판단기준 및 해소방안","chapter":"","deleted":false,"text":"① 법 제16조제3항에서 \"대통령령으로 정하는 수준\"이란 최소적립금의 100분의 95를 말한다.\n② 사용자는 법 제16조제3항에 따라 적립금이 제1항의 수준에 미치지 못하는 경우 부담금 납입 등을 통해 최소적립금 대비 부족분 비율의 3분의 1 이상을 직전 사업연도 종료 후 1년 이내에 해소해야 한다. <개정 2023.12.12>\n제7조(적립금 부족의 판단기준 및 해소방안)","kind":"D"},{"id":"D:8","label":"영 제8조","title":"급여 전액지급 예외 사유","chapter":"","deleted":false,"text":"1. 사업주가 「채무자 회생 및 파산에 관한 법률」에 따른 파산선고를 받은 경우\n2. 사업주가 「채무자 회생 및 파산에 관한 법률」에 따른 회생절차개시 결정을 받은 경우\n3. 사업주가 「임금채권보장법 시행령」 제5조제1항제2호 또는 제3호에 해당하는 경우\n4. 법 제16조제2항에 따른 확인결과 기준책임준비금 중 적립금의 비율이 제5조제1항에 따른 비율보다 낮은 경우. 이 경우 과거근로기간을 가입기간에 포함시키는 경우에도 제5조제1항에 따른 비율을 적용한다.\n5. 다음 값이 고용노동부장관이 정하여 고시한 비율 이상인 경우<img src=\"http://www.law.go.kr/flDownload.do?flSeq=28053464\"  alt=\"img28053464\" >┌─────────────────────────────────────┐│사업연도 개시일 이후 해당 사업의 가입자에게 지급한 퇴직급여의 누계액      │├─────────────────────────────────────┤│ 사업연도 개시일의 적립금 ＋ 사업연도 개시일 이후 납입된 부담금의 합계액  │└─────────────────────────────────────┘<\/img>\n6. 그 밖에 급여를 전액 지급하면 다른 근로자의 수급이 제한되는 경우로서 고용노동부령으로 정하는 경우\n제8조(급여 전액지급 예외 사유) 법 제17조제2항 본문에서 \"사업의 도산 등 대통령령으로 정하는 경우\"란 다음 각 호의 경우를 말한다. <개정 2015.12.15, 2022.4.13>","kind":"D"},{"id":"D:9","label":"영 제9조","title":"급여의 개인형퇴직연금계정등으로 이전 예외 사유","chapter":"","deleted":false,"text":"1. 가입자가 55세 이후에 퇴직하여 급여를 받는 경우\n2. 가입자가 법 제7조제2항에 따라 급여를 담보로 대출받은 금액 등을 상환하기 위한 경우. 이 경우 가입자가 지정한 개인형퇴직연금계정등으로 이전하지 않은 금액은 담보대출 채무상환 금액을 초과할 수 없다.\n3. 급여가 고용노동부장관이 정하는 금액 이하인 경우\n4. 제3조의2제3호부터 제5호까지의 규정에 해당하는 경우\n제9조(급여의 개인형퇴직연금계정등으로 이전 예외 사유) 법 제17조제4항 단서에서 \"가입자가 55세 이후에 퇴직하여 급여를 받는 경우 등 대통령령으로 정하는 사유가 있는 경우\"란 다음 각 호의 경우를 말한다. <개정 2022.4.13>","kind":"D"},{"id":"D:9-2","label":"영 제9조의2","title":"확정급여형퇴직연금제도 적립금운용위원회의 구성 등","chapter":"","deleted":false,"text":"① 법 제18조의2제1항에 따른 적립금운용위원회(이하 이 조에서 \"적립금운용위원회\"라 한다)는 위원장 1명을 포함하여 5명 이상 7명 이하의 위원으로 구성해야 한다.\n② 적립금운용위원회의 위원장은 해당 사업에서 퇴직연금업무를 담당하는 임원으로 한다.\n③ 적립금운용위원회의 위원은 다음 각 호에 해당하는 사람 중에서 위원장이 위촉하는 사람으로 한다.\n1. 근로자 과반수가 가입한 노동조합이 있는 경우에는 그 노동조합에서 선출된 사람이나 근로자 과반수가 가입한 노동조합이 없는 경우에는 근로자 과반수의 동의로 선출된 사람\n2. 자금운용, 재무회계, 인사ㆍ노무 등 퇴직연금제도 관련 업무 부서장\n3. 퇴직연금 및 자산운용에 관한 경험이나 전문지식이 있는 사람\n4. 제1호부터 제3호까지에서 규정한 사람 외에 위원장이 적립금의 합리적인 운용을 위하여 필요하다고 인정하는 사람\n④ 제3항에도 불구하고 적립금이 최소적립금에 미치지 못하는 경우에는 제3항제1호부터 제3호까지의 규정에 해당하는 위원을 각각 1명 이상 포함해야 한다.\n⑤ 적립금운용위원회의 회의는 연 1회 이상 개최해야 한다.\n⑥ 적립금운용위원회의 회의는 재적위원 과반수가 소집을 요구하거나 적립금운용위원회의 위원장이 필요하다고 인정하는 경우 소집하고, 위원장이 그 의장이 된다.\n⑦ 제1항부터 제6항까지에서 규정한 사항 외에 적립금운용위원회의 구성에 필요한 사항은 고용노동부장관이 정하여 고시한다.\n제9조의2(확정급여형퇴직연금제도 적립금운용위원회의 구성 등)","kind":"D"},{"id":"D:9-3","label":"영 제9조의3","title":"적립금운용계획서의 내용","chapter":"","deleted":false,"text":"1. 적립금 운용 목적 및 목표수익률\n2. 적립금 운용 방법(자산배분정책, 투자가능상품 등을 포함한다)\n3. 적립금 운용성과에 대한 평가\n4. 적립금 운용 담당자의 의무 등 적립금 운용관리에 관한 사항\n제9조의3(적립금운용계획서의 내용) 법 제18조의2제2항 후단에서 \"적립금 운용 목적 및 방법, 목표수익률, 운용성과 평가 등 대통령령으로 정하는 내용\"이란 다음 각 호의 사항을 말한다.","kind":"D"},{"id":"D:10","label":"영 제10조","title":"확정기여형퇴직연금규약의 규정 사항","chapter":"","deleted":false,"text":"① 법 제19조제1항제7호에서 \"대통령령으로 정하는 사항\"이란 다음 각 호의 사항을 말한다.\n1. 운용관리업무 및 자산관리업무의 수행에 대한 수수료의 부담에 관한 사항\n2. 가입자에 대한 교육의 방법 및 절차 등에 관한 사항\n② 제1항제1호에 따른 수수료는 사용자가 부담한다. 다만, 법 제20조제2항에 따라 가입자가 스스로 부담하는 추가 부담금에 대한 수수료는 가입자가 부담한다.\n③ 삭제 <2022.4.13>\n제10조(확정기여형퇴직연금규약의 규정 사항)","kind":"D"},{"id":"D:11","label":"영 제11조","title":"미납 부담금에 대한 지연이자 이율","chapter":"","deleted":false,"text":"1. 부담금을 납입하기로 정해진 날짜의 다음 날을 기산일로 하여 가입자의 퇴직 등 급여를 지급할 사유가 발생한 날부터 14일(당사자 간의 합의에 따라 납입 날짜를 연장한 경우 그 연장된 날짜)까지의 기간: 연 100분의 10\n2. 제1호에 따른 기간의 다음 날부터 부담금을 납입하는 날까지의 기간: 연 100분의 20\n제11조(미납 부담금에 대한 지연이자 이율) 법 제20조제3항 후단에서 \"대통령령으로 정하는 이율\"이란 다음 각 호의 구분에 따른 이율을 말한다.","kind":"D"},{"id":"D:12","label":"영 제12조","title":"지연이자의 적용제외 사유","chapter":"","deleted":false,"text":"제12조(지연이자의 적용제외 사유) 법 제20조제4항에서 \"대통령령으로 정하는 사유\"란 「근로기준법 시행령」 제18조 각 호의 어느 하나에 해당하는 경우를 말한다.","kind":"D"},{"id":"D:12-2","label":"영 제12조의2","title":"미납 부담금의 납입 사유","chapter":"","deleted":false,"text":"제12조의2(미납 부담금의 납입 사유) 법 제20조제5항 본문에서 \"대통령령으로 정하는 사유\"란 가입자가 해당 사업에서 퇴직하는 경우를 말한다.","kind":"D"},{"id":"D:13","label":"영 제13조","title":"사전지정운용방법의 승인 요건","chapter":"","deleted":false,"text":"① 법 제21조의2제1항제2호 각 목 외의 부분에서 \"대통령령으로 정하는 요건\"이란 다음 각 호의 요건을 말한다.\n1. 투자설명서상 법 제21조의2제1항제2호 각 목의 어느 하나에 해당하는 운용내용이 주요 운용내용으로 운용계획에 명시되어 있을 것\n2. 자산 배분이 적절하고 투자전략이 단순하며 이해하기 쉬울 것\n3. 물가, 금리 또는 환율의 변동 등 경제의 중ㆍ장기 변동에 따른 손실가능성이 가입자 집단의 속성에 비추어 허용되는 범위일 것\n4. 예상수익이 금리ㆍ환율 등 금융시장의 상황에 비추어 합리적 수준으로 확보될 것\n5. 손실가능성과 예상수익이 중ㆍ장기적으로 합리적 균형을 이룰 것\n6. 수수료 등의 비용이 예상되는 수익에 비해 과다하지 않을 것\n7. 상시 가입이 가능하고 특별한 사정이 없다면 환매를 신청한 날부터 14일 이내에 환매가 가능할 것\n② 제1항 각 호의 요건에 관한 세부기준은 고용노동부장관이 정하여 고시한다.\n제13조(사전지정운용방법의 승인 요건)","kind":"D"},{"id":"D:13-2","label":"영 제13조의2","title":"가입자에 대한 정보 제공","chapter":"","deleted":false,"text":"① 법 제21조의3제1항제3호에서 \"대통령령으로 정하는 사항\"이란 다음 각 호의 사항을 말한다.\n1. 사전지정운용방법에 관한 다음 각 목의 사항\n가. 사전지정운용방법의 위험등급, 손실가능성 및 과거 수익률\n나. 수수료 등 가입자가 부담하는 비용에 관한 사항\n다. 예금자 보호 한도 등 가입자의 보호에 관한 사항\n라. 사전지정운용방법의 적용에 따른 퇴직연금자산의 위험도 변경 가능성\n마. 사전지정운용방법의 승인일자 등 승인에 관한 사항\n2. 법 제21조의3제6항에 따라 사전지정운용방법이 변경될 수 있다는 사실과 그 절차\n② 제1항 각 호의 사항에 관한 세부적인 내용은 고용노동부장관이 정하여 고시한다.\n③ 법 제21조의3제1항에 따른 정보 제공은 다음 각 호의 어느 하나에 해당하는 방법으로 해야 한다.\n1. 우편 발송\n2. 서면 교부\n3. 정보통신망에 의한 전송\n4. 그 밖에 제1호부터 제3호까지의 방법에 준하는 방법으로서 당사자가 합의한 방법\n제13조의2(가입자에 대한 정보 제공)","kind":"D"},{"id":"D:13-3","label":"영 제13조의3","title":"사전지정운용방법에 따른 적립금 운용의 통지","chapter":"","deleted":false,"text":"① 퇴직연금사업자가 법 제21조의3제3항에 따른 통지를 할 때에는 다음 각 호의 사항을 포함해야 한다.\n1. 가입자가 통지를 받은 후 2주 이내에 적립금의 운용방법을 스스로 선정하지 않을 경우 법 제21조의3제4항 전단에 따라 가입자의 적립금이 사전지정운용방법으로 운용된다는 사실\n2. 가입자가 선정한 사전지정운용방법에 관한 정보로서 법 제21조의3제1항제1호 및 이 영 제13조의2제1항 각 호의 사항에 관한 정보\n3. 가입자는 법 제21조제1항 및 제21조의3제5항에 따라 언제든지 적립금의 운용방법을 스스로 선정할 수 있다는 사실\n② 제1항에 따른 통지는 제13조의2제3항 각 호의 어느 하나에 해당하는 방법으로 해야 한다.\n제13조의3(사전지정운용방법에 따른 적립금 운용의 통지)","kind":"D"},{"id":"D:13-4","label":"영 제13조의4","title":"사전지정운용방법의 변경","chapter":"","deleted":false,"text":"① 법 제21조의3제6항에 따라 사전지정운용방법을 변경하려는 퇴직연금사업자는 법 제21조의2제2항에 따른 심의위원회(이하 \"심의위원회\"라 한다)의 사전심의를 거쳐 고용노동부장관에게 변경 승인을 신청해야 한다.\n② 퇴직연금사업자는 제1항의 신청에 따라 사전지정운용방법의 변경 승인을 받았을 때에는 그 사실을 변경 승인을 받은 날부터 7일 이내에 해당 사전지정운용방법을 본인이 적용받을 사전지정운용방법으로 선정하였거나 해당 사전지정운용방법으로 적립금이 운용되고 있는 가입자에게 제13조의2제3항 각 호의 어느 하나에 해당하는 방법으로 통지해야 한다.\n③ 제2항에 따른 통지에는 다음 각 호의 사항이 포함되어야 한다.\n1. 사전지정운용방법의 변경 사유\n2. 변경된 사전지정운용방법에 관한 정보로서 법 제21조의3제1항제1호 및 이 영 제13조의2제1항 각 호의 사항에 관한 정보\n3. 법 제21조의3제6항 후단 및 이 조 제4항에 따라 변경 승인을 받은 후 14일이 지난 날부터 가입자의 적립금이 변경된 사전지정운용방법에 따라 운용될 수 있다는 사실\n4. 가입자가 희망하는 경우 변경된 사전지정운용방법이 아닌 다른 운용방법을 선정할 수 있다는 사실\n5. 적립금이 변경된 사전지정운용방법으로 운용된 이후에도 가입자는 법 제21조제1항 및 제21조의3제5항에 따라 다른 운용방법을 스스로 선정할 수 있다는 사실\n④ 퇴직연금사업자는 제2항 및 제3항에 따른 통지를 받은 가입자가 변경된 사전지정운용방법이 아닌 다른 운용방법을 선정하지 않은 경우에는 제1항에 따른 변경 승인을 받은 후 14일이 지난 날부터 가입자의 적립금을 변경된 사전지정운용방법으로 운용할 수 있다.\n제13조의4(사전지정운용방법의 변경)","kind":"D"},{"id":"D:13-5","label":"영 제13조의5","title":"사전지정운용방법의 공시","chapter":"","deleted":false,"text":"1. 적립금액 및 운용현황\n2. 수익률\n제13조의5(사전지정운용방법의 공시) 고용노동부장관은 사전지정운용방법에 관한 다음 각 호의 사항을 분기별 1회 이상 고용노동부의 인터넷 홈페이지 등에 공시해야 한다.","kind":"D"},{"id":"D:13-6","label":"영 제13조의6","title":"사전지정운용방법의 승인 취소 등","chapter":"","deleted":false,"text":"① 고용노동부장관은 사전지정운용방법이 다음 각 호의 어느 하나에 해당하는 경우에는 심의위원회의 사전심의를 거쳐 사전지정운용방법의 승인을 취소할 수 있다. 다만, 제1호에 해당하는 경우에는 승인을 취소해야 한다.\n1. 거짓이나 그 밖의 부정한 방법으로 사전지정운용방법의 승인을 받은 경우\n2. 제13조제1항 각 호의 승인 요건을 갖추지 못하게 된 경우\n3. 사전지정운용방법으로 인하여 가입자의 적립금에 현저한 손해가 발생하였거나 발생할 우려가 있다고 명백히 인정되는 경우\n② 퇴직연금사업자는 제1항에 따라 사전지정운용방법의 승인이 취소된 경우에는 해당 사전지정운용방법을 본인이 적용받을 사전지정운용방법으로 선정하였거나 해당 사전지정운용방법으로 적립금이 운용되고 있는 가입자에게 다음 각 호의 사항을 통지해야 한다.\n1. 승인 취소 사유\n2. 승인 취소된 사전지정운용방법의 해지 방법ㆍ절차에 관한 사항\n3. 다른 사전지정운용방법을 포함한 3가지 이상의 운용방법에 관한 정보로서 법 제21조의3제1항제1호 및 이 영 제13조의2제1항 각 호의 사항에 관한 정보\n③ 퇴직연금사업자는 제2항에 따른 통지를 받은 가입자가 다른 운용방법을 선정한 경우에는 가입자의 적립금을 가입자가 선정한 다른 운용방법으로 이전하여 운용해야 한다.\n④ 제3항에 따라 적립금을 이전하여 운용하는 퇴직연금사업자는 적립금을 이전한 운용방법에 관한 정보로서 법 제21조의3제1항제1호 및 이 영 제13조의2제1항 각 호의 사항에 관한 정보를 가입자에게 제공해야 한다.\n⑤ 퇴직연금사업자는 제2항에 따른 통지를 받은 가입자가 해당 사전지정운용방법을 해지하지 않거나 다른 운용방법을 선정하지 않은 경우에는 가입자의 적립금을 종전의 사전지정운용방법과 같은 위험등급의 다른 사전지정운용방법으로 이전하여 운용할 수 있다.\n⑥ 제5항에 따라 적립금을 이전하여 운용하는 퇴직연금사업자는 해당 가입자에게 다음 각 호의 사항을 통지해야 한다.\n1. 적립금을 이전하여 운용한다는 사실\n2. 적립금을 이전한 운용방법에 관한 정보로서 법 제21조의3제1항제1호 및 이 영 제13조의2제1항 각 호의 사항에 관한 정보\n⑦ 제3항 또는 제5항에 따라 적립금을 이전하여 운용하는 경우 퇴직연금사업자는 가입자에게 해지 수수료 등 적립금의 이전과 관련된 비용을 요구할 수 없다.\n제13조의6(사전지정운용방법의 승인 취소 등)","kind":"D"},{"id":"D:14","label":"영 제14조","title":"확정기여형퇴직연금제도의 중도인출 사유","chapter":"","deleted":false,"text":"① 법 제22조에서 \"주택구입 등 대통령령으로 정하는 사유\"란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2015.12.15, 2019.7.2, 2019.10.29, 2020.11.3>\n1. 제2조제1항제1호ㆍ제1호의2 또는 제5호(재난으로 피해를 입은 경우로 한정한다)에 해당하는 경우\n1의2. 제2조제1항제2호에 해당하는 경우로서 가입자가 본인 연간 임금총액의 1천분의 125를 초과하여 의료비를 부담하는 경우\n2. 중도인출을 신청한 날부터 거꾸로 계산하여 5년 이내에 가입자가 「채무자 회생 및 파산에 관한 법률」에 따라 파산선고를 받은 경우\n3. 중도인출을 신청한 날부터 거꾸로 계산하여 5년 이내에 가입자가 「채무자 회생 및 파산에 관한 법률」에 따라 개인회생절차개시 결정을 받은 경우\n4. 법 제7조제2항 후단에 따라 퇴직연금제도의 급여를 받을 권리를 담보로 제공하고 대출을 받은 가입자가 그 대출 원리금을 상환하기 위한 경우로서 고용노동부장관이 정하여 고시하는 사유에 해당하는 경우\n② 제1항제4호에 해당하는 사유로 적립금을 중도인출하는 경우 그 중도인출 금액은 대출 원리금의 상환에 필요한 금액 이하로 한다. <신설 2020.11.3>\n제14조(확정기여형퇴직연금제도의 중도인출 사유)","kind":"D"},{"id":"D:15","label":"영 제15조","title":"표준규약에 규정될 사항","chapter":"","deleted":false,"text":"1. 표준규약으로 설정되는 확정기여형퇴직연금제도의 특성과 이를 반영한 명칭\n2. 가입 대상 사업의 범위 또는 특성에 관한 사항\n3. 적립금 운용방법 및 그 선정기준. 이 경우 가입자가 운용지시를 하지 않는 경우의 운용방법 및 그 선정기준을 포함한다.\n4. 탈퇴할 수 있는 사유 및 절차 등에 관한 사항\n5. 수수료에 관한 사항\n6. 그 밖에 둘 이상의 사용자가 참여하는 확정기여형퇴직연금제도의 합리적 운영에 필요한 사항으로서 고용노동부장관이 정하는 사항\n제15조(표준규약에 규정될 사항) 법 제23조제1호나목에서 \"대통령령으로 정하는 사항\"이란 다음 각 호의 사항을 말한다.","kind":"D"},{"id":"D:15-2","label":"영 제15조의2","title":"표준계약서에 규정될 사항","chapter":"","deleted":false,"text":"1. 법 제23조제1호에 따른 표준규약의 이행에 관한 사항\n2. 둘 이상의 사용자가 참여하는 확정기여형퇴직연금제도의 운영과 관련한 비용 산출 및 부담에 관한 사항\n3. 운용관리업무와 자산관리업무의 계약 해지ㆍ변경의 사유 및 절차 등에 관한 사항\n4. 그 밖에 가입자의 수급권 보장에 필요한 사항으로서 고용노동부장관이 정하여 고시하는 사항\n제15조의2(표준계약서에 규정될 사항) 법 제23조제2호에서 \"대통령령으로 정하는 사항\"이란 다음 각 호의 사항을 말한다.","kind":"D"},{"id":"D:16","label":"영 제16조","title":"중소기업퇴직연금기금제도운영위원회의 구성 등","chapter":"","deleted":false,"text":"① 법 제23조의2제2항에 따른 중소기업퇴직연금기금제도운영위원회(이하 \"운영위원회\"라 한다)의 위원 중 같은 조 제4항제2호의 근로자를 대표하는 사람은 총연합단체인 노동조합이 추천하는 사람으로 하고, 같은 항 제3호의 사용자를 대표하는 사람은 전국을 대표하는 사용자단체가 추천하는 사람으로 한다.\n② 운영위원회의 위원장(이하 \"위원장\"이라 한다)은 법 제23조의2제4항 각 호의 위원이 다음 각 호의 어느 하나에 해당하는 경우에는 해당 위원을 해촉(解囑)할 수 있다.\n1. 심신장애로 직무를 수행할 수 없게 된 경우\n2. 직무와 관련된 비위사실이 있는 경우\n3. 직무태만, 품위손상이나 그 밖의 사유로 위원으로 적합하지 않다고 인정되는 경우\n4. 위원 스스로 직무를 수행하기 어렵다는 의사를 밝히는 경우\n제16조(중소기업퇴직연금기금제도운영위원회의 구성 등)","kind":"D"},{"id":"D:16-2","label":"영 제16조의2","title":"위원장의 직무","chapter":"","deleted":false,"text":"① 위원장은 운영위원회를 대표하고, 그 업무를 총괄한다.\n② 위원장이 부득이한 사유로 직무를 수행할 수 없을 때에는 위원장이 미리 지명한 위원이 그 직무를 대행한다.\n제16조의2(위원장의 직무)","kind":"D"},{"id":"D:16-3","label":"영 제16조의3","title":"운영위원회의 운영 등","chapter":"","deleted":false,"text":"① 위원장은 운영위원회의 회의를 소집하고, 그 의장이 된다.\n② 위원장은 회의를 소집하려면 회의 개최 7일 전까지 회의의 일시, 장소 및 안건을 각 위원에게 알려야 한다. 다만, 긴급한 사정이나 그 밖의 부득이한 사유가 있는 경우에는 그 기간을 단축할 수 있다.\n③ 운영위원회의 회의는 재적위원 과반수의 출석으로 개의하고, 출석위원 과반수의 찬성으로 의결한다.\n④ 위원장은 회의의 일시, 장소, 심의ㆍ의결 사항과 각 참석자의 발언내용이 기록된 회의록을 작성하여 보관하고, 회의록의 주요 내용을 공개해야 한다.\n⑤ 운영위원회에 간사 1명을 두며, 간사는 「산업재해보상보험법」 제10조에 따른 근로복지공단(이하 \"근로복지공단\"이라 한다) 직원 중에서 위원장이 지명한다.\n⑥ 운영위원회의 회의에 출석한 위원에게는 예산의 범위에서 수당과 여비를 지급할 수 있다. 다만, 공무원이 그 소관 업무와 직접적으로 관련되어 위원회에 출석하는 경우에는 지급하지 않는다.\n⑦ 제1항부터 제6항까지에서 규정한 사항 외에 운영위원회의 운영에 필요한 사항은 운영위원회의 의결을 거쳐 위원장이 정한다.\n제16조의3(운영위원회의 운영 등)","kind":"D"},{"id":"D:16-4","label":"영 제16조의4","title":"중소기업퇴직연금기금의 관리ㆍ운용 방법","chapter":"","deleted":false,"text":"① 근로복지공단은 법 제23조의3제1항에 따른 중소기업퇴직연금기금(이하 \"중소기업퇴직연금기금\"이라 한다)의 안정적 운용 및 수익성 증대를 위하여 매년 중소기업퇴직연금기금 운용계획 및 지침을 마련해야 한다.\n② 근로복지공단은 중소기업퇴직연금기금을 제1항에 따른 중소기업퇴직연금기금 운용계획 및 지침에 따라 다음 각 호의 어느 하나에 해당하는 방법으로 관리ㆍ운용해야 한다. 이 경우 자산 종류별 시장수익률을 넘는 수익을 낼 수 있도록 신의를 지켜 성실하게 해야 한다.\n1. 다음 각 목의 금융기관에 대한 예입 또는 신탁\n가. 「보험업법」에 따른 보험회사\n나. 「우체국예금ㆍ보험에 관한 법률」에 따른 체신관서\n다. 「은행법」에 따른 은행, 「한국산업은행법」에 따른 한국산업은행, 「중소기업은행법」에 따른 중소기업은행, 「농업협동조합법」에 따른 농협은행 및 「수산업협동조합법」에 따른 수협은행\n라. 「자본시장과 금융투자업에 관한 법률」에 따른 투자매매업자ㆍ투자중개업자ㆍ신탁업자ㆍ집합투자업자 및 종합금융회사\n2. 공공사업을 위한 공공부문에 대한 국채 매입을 통한 투자\n3. 「자본시장과 금융투자업에 관한 법률」에 따른 증권의 매매 및 대여\n4. 「자본시장과 금융투자업에 관한 법률」 제5조제1항제1호부터 제3호까지에서 규정하는 지수 중 금융투자상품지수에 관한 파생상품시장에서의 거래\n5. 「자본시장과 금융투자업에 관한 법률」에 따른 장내파생상품과 장외파생상품의 거래\n6. 「자본시장과 금융투자업에 관한 법률」에 따른 집합투자기구에 대한 투융자\n7. 「산업발전법」 제20조에 따른 기업구조개선 기관전용 사모집합투자기구에 대한 출자\n8. 「외국환거래법」에 따른 자본거래\n9. 「사회기반시설에 대한 민간투자법」에 따른 사회기반시설사업에 대한 투융자\n10. 부동산의 개발ㆍ취득ㆍ관리 등을 목적으로 하는 사업에 대한 투융자\n11. 에너지 및 자원의 개발사업에 대한 투융자\n12. 항공기 및 선박의 취득, 기업의 인수 등을 목적으로 하는 회사 또는 사업에 대한 투융자\n13. 외국의 관계 법령에 따라 적법하게 설치되거나 시행되고 있는 제5호부터 제12호까지의 규정에 해당하는 투융자\n제16조의4(중소기업퇴직연금기금의 관리ㆍ운용 방법)","kind":"D"},{"id":"D:16-5","label":"영 제16조의5","title":"중소기업퇴직연금기금의 회계","chapter":"","deleted":false,"text":"제16조의5(중소기업퇴직연금기금의 회계) 중소기업퇴직연금기금의 회계에 관하여 필요한 세부적인 사항은 고용노동부장관의 승인을 받아 근로복지공단이 정한다.","kind":"D"},{"id":"D:16-6","label":"영 제16조의6","title":"자료의 활용 범위","chapter":"","deleted":false,"text":"1. 「고용보험법」 제15조에 따른 피보험자격에 관한 신고 자료\n2. 「고용보험 및 산업재해보상보험의 보험료징수 등에 관한 법률」 제11조에 따른 보험관계의 신고 자료 및 같은 법 제12조에 따른 보험관계의 변경신고 자료\n3. 「고용보험 및 산업재해보상보험의 보험료징수 등에 관한 법률」 제16조의3에 따른 근로자 개인별 월별보험료의 산정 자료, 같은 법 제16조의9에 따른 보험료의 정산 자료, 같은 법 제16조의10에 따른 보수총액 등의 신고 자료, 같은 법 제16조의11에 따른 수정신고 자료 및 같은 법 제19조에 따른 건설업 등의 확정보험료의 신고ㆍ정산 자료\n4. 「고용보험 및 산업재해보상보험의 보험료징수 등에 관한 법률」 제40조에 따라 근로복지공단이 제공받은 자료 중 다음 각 목의 자료\n가. 「국민건강보험법」에 따른 사업장 신고자료 및 직장가입자의 월별 보험료액 자료\n나. 「국민연금법」에 따른 사업장가입자의 신고자료 및 월별 연금보험료 부과자료\n다. 「부가가치세법」에 따른 사업자등록 자료\n라. 「소득세법」에 따른 원천징수이행상황신고서, 근로소득 지급명세서 및 종합소득세 과세표준 확정신고서의 종합소득자료\n마. 「법인세법」에 따른 표준손익계산서 중 보수ㆍ보수액 자료\n바. 「주민등록법」에 따른 주민등록자료\n제16조의6(자료의 활용 범위) 법 제23조의4제1항 각 호 외의 부분에서 \"대통령령으로 정하는 범위에서 「고용보험법」, 「고용보험 및 산업재해보상보험의 보험료징수 등에 관한 법률」 및 「근로복지기본법」에 따라 수집된 자료\"란 다음 각 호의 자료를 말한다.","kind":"D"},{"id":"D:16-7","label":"영 제16조의7","title":"자료의 활용 업무","chapter":"","deleted":false,"text":"1. 사용자에 관한 다음 각 목의 업무\n가. 부담금의 부담 및 산정\n나. 부담금 납입 방법 등 안내\n다. 법 제23조의6제2항에 따른 수수료의 부과\n라. 법 제23조의14제1항 및 이 영 제16조의15에 따른 사용자부담금 및 중소기업퇴직연금기금제도 운영에 따른 비용에 대한 국가의 지원 요건 확인\n2. 가입자에 관한 다음 각 목의 업무\n가. 가입 안내\n나. 수급요건 확인\n다. 퇴직 등 급여 지급사유 확인\n라. 급여의 지급 절차 안내\n제16조의7(자료의 활용 업무) 법 제23조의4제1항제2호에서 \"대통령령으로 정하는 업무\"란 다음 각 호의 업무를 말한다.","kind":"D"},{"id":"D:16-8","label":"영 제16조의8","title":"중소기업퇴직연금기금표준계약서의 기재사항","chapter":"","deleted":false,"text":"1. 법 제23조의6제2항에 따라 근로복지공단이 사용자 및 가입자에게 부과하는 수수료에 관한 사항\n2. 법 제23조의14제1항 및 이 영 제16조의15에 따른 사용자부담금 및 중소기업퇴직연금기금제도 운영에 따른 비용에 대한 국가의 지원에 관한 사항\n3. 법 제23조의15제1항에 따라 근로복지공단이 실시하는 교육 방법에 관한 사항\n제16조의8(중소기업퇴직연금기금표준계약서의 기재사항) 법 제23조의5제1항제6호에서 \"대통령령으로 정하는 사항\"이란 다음 각 호의 사항을 말한다.","kind":"D"},{"id":"D:16-9","label":"영 제16조의9","title":"중소기업퇴직연금기금표준계약서의 승인 및 변경승인 등","chapter":"","deleted":false,"text":"① 근로복지공단은 법 제23조의5제1항에 따라 중소기업퇴직연금기금표준계약서의 승인을 받으려는 경우에는 그 승인 신청서에 다음 각 호의 서류를 첨부하여 고용노동부장관에게 제출해야 한다.\n1. 중소기업퇴직연금기금표준계약서안\n2. 운영위원회 심의ㆍ의결 결과\n② 근로복지공단은 법 제23조의5제2항 본문에 따라 중소기업퇴직연금기금표준계약서의 변경승인을 받으려는 경우에는 변경 내용 및 사유를 적은 변경승인 신청서에 운영위원회 심의ㆍ의결 결과를 첨부하여 고용노동부장관에게 제출해야 한다.\n③ 근로복지공단은 법 제23조의5제2항 단서에 따라 중소기업퇴직연금기금표준계약서의 변경신고를 하려는 경우에는 그 내용을 변경한 날부터 7일 이내에 변경 내용 및 사유를 적은 변경신고서를 고용노동부장관에게 제출해야 한다.\n④ 근로복지공단은 제1항부터 제3항까지의 규정에 따라 승인 또는 변경승인을 받거나 변경신고를 한 중소기업퇴직연금기금표준계약서를 다음 각 호의 어느 하나에 해당하는 방법으로 사용자에게 통지해야 한다.\n1. 우편 발송\n2. 서면 교부\n3. 정보통신망에 의한 전송\n제16조의9(중소기업퇴직연금기금표준계약서의 승인 및 변경승인 등)","kind":"D"},{"id":"D:16-10","label":"영 제16조의10","title":"근로복지공단 업무의 일부 처리","chapter":"","deleted":false,"text":"① 법 제23조의6제3항에서 \"대통령령으로 정하는 업무\"란 법 제23조의5제1항제3호 및 제5호의 업무를 말한다.\n② 법 제23조의6제3항에서 \"인적ㆍ물적 요건 등 대통령령으로 정하는 요건을 갖춘 자\"란 다음 각 호의 구분에 따른 요건을 갖춘 자를 말한다.\n1. 법 제23조의5제1항제3호의 업무: 다음 각 목의 자\n가. 「자본시장과 금융투자업에 관한 법률」 제12조에 따라 금융투자업인가를 받은 집합투자업자\n나. 「자본시장과 금융투자업에 관한 법률」 제18조에 따라 투자일임업자로 금융투자업등록을 한 자 중 같은 법 제12조에 따라 투자매매업자 또는 투자중개업자로서의 금융투자업인가도 받은 자\n2. 법 제23조의5제1항제5호의 업무: 「우체국예금ㆍ보험에 관한 법률」에 따른 체신관서, 「은행법」에 따른 은행, 「한국산업은행법」에 따른 한국산업은행, 「중소기업은행법」에 따른 중소기업은행, 「농업협동조합법」에 따른 농협은행 및 「수산업협동조합법」에 따른 수협은행\n제16조의10(근로복지공단 업무의 일부 처리)","kind":"D"},{"id":"D:16-11","label":"영 제16조의11","title":"사용자부담금의 납입 방법 등","chapter":"","deleted":false,"text":"① 근로복지공단은 사용자에게 법 제23조의7제1항 전단에 따른 사용자부담금 및 같은 항 후단에 따른 지연이자의 납입 방법을 정보통신망을 이용하여 안내할 수 있다.\n② 법 제23조의7제2항 본문에서 \"중소기업퇴직연금기금제도 가입자의 퇴직 등 대통령령으로 정하는 사유가 발생한 때\"란 중소기업퇴직연금기금제도 가입자가 해당 사업에서 퇴직하는 때를 말한다.\n제16조의11(사용자부담금의 납입 방법 등)","kind":"D"},{"id":"D:16-12","label":"영 제16조의12","title":"가입자부담금의 납입 한도","chapter":"","deleted":false,"text":"제16조의12(가입자부담금의 납입 한도) 법 제23조의8제2호의 가입자부담금의 납입 금액은 「소득세법 시행령」 제40조의2제2항제1호에 따른 금액을 한도로 한다.","kind":"D"},{"id":"D:16-13","label":"영 제16조의13","title":"기금 운용정보 제공 방법","chapter":"","deleted":false,"text":"1. 우편 발송\n2. 서면 교부\n3. 정보통신망에 의한 전송\n제16조의13(기금 운용정보 제공 방법) 법 제23조의10에서 \"대통령령으로 정하는 방법\"이란 다음 각 호의 어느 하나에 해당하는 방법을 말한다.","kind":"D"},{"id":"D:16-14","label":"영 제16조의14","title":"기금제도가입자부담금계정의 수급요건","chapter":"","deleted":false,"text":"제16조의14(기금제도가입자부담금계정의 수급요건) 법 제23조의8 각 호 외의 부분 전단에 따른 기금제도가입자부담금계정(이하 \"기금제도가입자부담금계정\"이라 한다)의 급여 종류 및 수급요건에 관하여는 법 제23조의12제1항제2호에 따라 제18조제1항을 준용한다. 이 경우 \"법 제24조제5항\"은 \"법 제23조의12제1항제2호\"로, \"개인형퇴직연금제도\"는 \"기금제도가입자부담금계정\"으로 본다.","kind":"D"},{"id":"D:16-15","label":"영 제16조의15","title":"지원금의 지원대상 등","chapter":"","deleted":false,"text":"① 법 제23조의14제1항에 따른 지원대상은 사용자부담금, 가입자부담금 및 중소기업퇴직연금기금제도 운영에 따른 비용으로 한다. <개정 2023.12.12>\n② 법 제23조의14제1항에 따른 지원수준은 사용자부담금, 가입자부담금 및 중소기업퇴직연금기금제도 운영에 따른 비용의 범위에서 고용노동부장관이 정하여 고시한다. <개정 2023.12.12>\n제16조의15(지원금의 지원대상 등)","kind":"D"},{"id":"D:16-16","label":"영 제16조의16","title":"지원금 신청절차 및 지급방법","chapter":"","deleted":false,"text":"① 사용자 또는 가입자가 법 제23조의14제1항에 따른 지원을 받으려는 경우에는 지원금 신청서를 작성하여 고용노동부장관에게 제출해야 한다. <개정 2023.12.12>\n② 제1항에 따른 신청을 받은 고용노동부장관은 사용자 또는 가입자가 법 제23조의14제1항에 따른 지원 요건을 갖춘 경우에는 사용자의 계좌 또는 기금제도가입자부담금계정으로 지원금을 입금해야 한다. <개정 2023.12.12>\n제16조의16(지원금 신청절차 및 지급방법)","kind":"D"},{"id":"D:16-17","label":"영 제16조의17","title":"지원금의 환수","chapter":"","deleted":false,"text":"① 법 제23조의14제3항에 따라 고용노동부장관이 환수할 수 있는 지원금액 기준은 환수 사유별로 다음 각 호의 구분에 따른다.\n1. 법 제23조의14제3항제1호에 해당하는 경우: 지원받은 금액 전부\n2. 법 제23조의14제3항제2호에 해당하는 경우: 잘못 지급된 금액 전부\n3. 법 제23조의14제3항제3호에 해당하는 경우: 지원받은 금액 전부\n② 근로복지공단은 법 제23조의14제3항 각 호의 어느 하나에 해당하는 환수 사유가 발생한 경우에는 지원금을 지급받은 사용자 또는 가입자에게 해당 사실을 통보한 후 환수할 금액, 납부 기한 및 방법을 문서로 고지ㆍ징수해야 한다. <개정 2023.12.12>\n③ 법 제23조의14제3항제3호에서 \"도산 등 대통령령으로 정하는 정당한 사유\"란 다음 각 호의 사유를 말한다.\n1. 도산(사업주가 「임금채권보장법 시행령」 제5조제1항에 따라 도산등사실인정을 받은 경우를 말한다)\n2. 파산 또는 회생절차개시(사업주가 「채무자 회생 및 파산에 관한 법률」에 따른 파산선고 또는 회생절차개시 결정을 받은 경우를 말한다)\n3. 다른 퇴직급여제도로의 변경\n4. 그 밖에 폐업 등 중소기업퇴직연금기금제도를 폐지할 수 있는 정당한 사유로서 고용노동부령으로 정하는 사유\n④ 법 제23조의14제3항 각 호 외의 부분 단서에서 \"대통령령으로 정하는 금액\"이란 3천원을 말한다.\n제16조의17(지원금의 환수)","kind":"D"},{"id":"D:16-18","label":"영 제16조의18","title":"요청 대상 자료의 범위","chapter":"","deleted":false,"text":"1. 소득금액증명\n2. 주민등록표 등본ㆍ초본\n3. 가족관계등록전산정보\n4. 지방세세목별과세증명서\n5. 자동차등록원부 및 건설기계등록원부\n6. 건물등기사항증명서 및 토지등기사항증명서\n7. 법인등기사항증명서\n제16조의18(요청 대상 자료의 범위) 법 제23조의14제5항 전단에서 \"「지방세법」에 따른 재산세 과세자료 등 대통령령으로 정하는 자료\"란 다음 각 호의 자료를 말한다.","kind":"D"},{"id":"D:16-19","label":"영 제16조의19","title":"가입자에 대한 교육사항","chapter":"","deleted":false,"text":"1. 중소기업퇴직연금기금제도를 설정한 사업의 가입자인 경우 다음 각 목의 사항\n가. 제32조제1항제1호의 사항. 이 경우 제32조제1항제1호나목 및 바목의 \"퇴직연금제도\"는 \"중소기업퇴직연금기금제도\"로 본다.\n나. 사용자부담금의 수준, 납입 시기 및 납입 현황\n다. 중소기업퇴직연금기금제도 운영 상황\n2. 기금제도가입자부담금계정을 설정한 가입자인 경우 다음 각 목의 사항\n가. 제16조의12에 따른 기금제도가입자부담금계정의 납입 금액 한도\n나. 제16조의14에 따른 기금제도가입자부담금계정의 수급요건\n다. 제32조제1항제1호마목 및 사목의 사항\n라. 중소기업퇴직연금기금제도 운영 상황\n제16조의19(가입자에 대한 교육사항) 법 제23조의15제1항에서 \"중소기업퇴직연금기금제도 운영 상황 등 대통령령으로 정하는 사항\"이란 다음 각 호의 구분에 따른 사항을 말한다.","kind":"D"},{"id":"D:16-20","label":"영 제16조의20","title":"중소기업퇴직연금기금제도의 공시","chapter":"","deleted":false,"text":"① 근로복지공단은 법 제23조의15제2항에 따라 다음 각 호의 사항을 근로복지공단의 인터넷 홈페이지에 공시해야 한다.\n1. 중소기업퇴직연금기금제도의 취급실적에 관한 다음 각 목의 사항\n가. 중소기업퇴직연금기금제도 운영에 관한 사항(대상 사업 또는 사업장의 규모, 가입자 및 적립금에 대한 현황을 포함한다)\n나. 급여 지급사항(급여 종류별 수급요건 및 중도인출 현황을 포함한다)\n2. 중소기업퇴직연금기금의 운용현황 및 수익률\n3. 법 제23조의5제1항에 따른 중소기업퇴직연금기금표준계약서\n4. 그 밖에 가입자를 보호하기 위하여 공시가 필요하다고 인정되는 사항으로서 운영위원회가 정하는 사항\n② 제1항에 따른 공시 기한은 다음 각 호와 같다.\n1. 제1호 및 제2호의 사항: 매 분기 종료 후 1개월 이내\n2. 제3호의 사항: 중소기업퇴직연금기금표준계약서를 승인받거나 변경한 날부터 7일 이내\n3. 제4호의 사항: 운영위원회가 공시가 필요하다고 정한 날부터 7일 이내\n제16조의20(중소기업퇴직연금기금제도의 공시)","kind":"D"},{"id":"D:16-21","label":"영 제16조의21","title":"시정명령","chapter":"","deleted":false,"text":"① 고용노동부장관이 법 제23조의16에 따라 근로복지공단에 시정을 명하는 경우에는 90일 이내의 기간을 정하여 그 위반사항을 시정하도록 명할 수 있다.\n② 고용노동부장관이 제1항에 따라 시정을 명하는 경우에는 다음 각 호의 사항을 적은 문서로 해야 한다.\n1. 시정명령의 사유\n2. 시정명령의 내용\n3. 시정기간\n제16조의21(시정명령)","kind":"D"},{"id":"D:17","label":"영 제17조","title":"개인형퇴직연금제도의 설정 대상","chapter":"","deleted":false,"text":"1. 자영업자\n2. 법 제4조제1항 단서에 따라 퇴직급여제도가 설정되어 있지 아니한 다음 각 목의 어느 하나에 해당하는 근로자\n가. 계속근로기간이 1년 미만인 근로자\n나. 4주간을 평균하여 1주간의 소정근로시간이 15시간 미만인 근로자\n3. 법 제8조제1항에 따른 퇴직금제도를 적용받고 있는 근로자\n4. 「공무원연금법」의 적용을 받는 공무원\n5. 「군인연금법」의 적용을 받는 군인\n6. 「사립학교교직원 연금법」의 적용을 받는 교직원\n7. 「별정우체국법」의 적용을 받는 별정우체국 직원\n제17조(개인형퇴직연금제도의 설정 대상) 법 제24조제2항제3호에서 \"자영업자 등 안정적인 노후소득 확보가 필요한 사람으로서 대통령령으로 정하는 사람\"이란 다음 각 호의 사람을 말한다.","kind":"D"},{"id":"D:17-2","label":"영 제17조의2","title":"개인형퇴직연금제도의 부담금 납입한도","chapter":"","deleted":false,"text":"제17조의2(개인형퇴직연금제도의 부담금 납입한도) 법 제24조제3항 단서에서 \"대통령령으로 정하는 한도\"란 이전 사업에서 받은 퇴직급여제도의 일시금 등을 제외한 금액으로 「소득세법 시행령」 제40조의2제2항제1호에 따른 금액(개인형퇴직연금제도의 계정이 여러 개인 경우에는 부담금의 합계액)을 말한다. <개정 2015.12.15, 2022.4.
