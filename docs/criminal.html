9"},{"id":"P:606235","kind":"P","label":"2023노4678","title":"근로자참여및협력증진에관한법률위반","court":"인천지방법원","date":"2025.01.17","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606235"},{"id":"P:609313","kind":"P","label":"2024고합473","title":"강요·강제추행·유사강간·강요미수·성폭력범죄의처벌등에관한특례법위반(촬영물등이용협박)·성폭력범죄의처벌등에관한특례법위반(촬영물등이용강요)·아동·청소년의성보호에관한법률위반(성착취물제작등)·아동·청소년의성보호에관한법률위반(성착취물제작·배포등)·미성년자의제강제추행·미성년자의제유사강간·아동복지법위반(아동에대한음행강요·매개·성희롱등)·사기·아동·청소년의성보호에관한법률위반(성착취물소지등)·미성년자의제강제추행미수주1)·부착명령·보호관찰명령","court":"부산지방법원","date":"2025.01.17","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=609313"},{"id":"P:600313","kind":"P","label":"2024고합568","title":"교통사고처리특례법위반(치상)","court":"대구지방법원","date":"2025.01.14","caseType":"형사","basis":"참조조문","text":"자동차 운전자인 피고인이 왕복 7차선 도로의 삼거리 교차로로부터 약 31m 떨어진 상시유턴구역에서 유턴을 하던 중 맞은편 반대차로에서 직진 진행하던 甲이 운전하는 원동기장치자전거 앞부분을 피고인 차량의 조수석 문짝 부위로 충격하는 교통사고를 냄으로써 업무상의 과실로 甲에게 상해를 입게 하였다는 교통사고처리 특례법 위반으로 기소된 후 국민참여재판으로 진행된 사안에서, 제반 사정을 종합할 때 피고인이 업무상 주의의무를 위반하였다거나 피고인의 행위와 교통사고의 발생 사이에 상당인과관계가 있다고 보기 어렵다는 이유로, 피고인에게 무죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=600313"},{"id":"P:606109","kind":"P","label":"2024노868","title":"사기","court":"수원지방법원","date":"2025.01.10","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606109"},{"id":"P:619143","kind":"P","label":"2024도12820","title":"마약류관리에관한법률위반(향정)","court":"대법원","date":"2025.01.09","caseType":"형사","basis":"판례내용","text":"헌법과 형사소송법이 정한 절차에 따르지 아니하고 수집된 증거나 이를 기초로 획득된 2차적 증거를 유죄 인정의 증거로 사용할 수 있는 예외적인 경우 및 이에 해당한다고 볼 만한 구체적이고 특별한 사정이 존재한다는 점에 대한 증명책임 소재 / 피고인이 수사기관에서 위법하게 수집된 1차적 증거를 제시받거나 1차적 증거의 내용을 전제로 신문받은 바 있는 경우, 2차적 증거인 피고인의 법정진술을 유죄의 증거로 사용할 수 있는지 여부 및 피고인의 법정진술을 유죄의 증거로 사용할 수 있는 예외적인 경우와 그러한 특별한 사정이 존재한다는 점에 대한 증명책임 소재","url":"https://www.law.go.kr/precInfoP.do?precSeq=619143"},{"id":"P:606559","kind":"P","label":"2023노3777","title":"무고·명예훼손·폭행","court":"대전지방법원","date":"2025.01.09","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606559"},{"id":"P:606659","kind":"P","label":"2024도12820","title":"마약류관리에관한법률위반(향정)","court":"대법원","date":"2025.01.09","caseType":"형사","basis":"판례내용","text":"헌법과 형사소송법이 정한 절차에 따르지 아니하고 수집된 증거나 이를 기초로 획득된 2차적 증거를 유죄 인정의 증거로 사용할 수 있는 예외적인 경우 및 이에 해당한다고 볼 만한 구체적이고 특별한 사정이 존재한다는 점에 대한 증명책임 소재 / 피고인이 수사기관에서 위법하게 수집된 1차적 증거를 제시받거나 1차적 증거의 내용을 전제로 신문받은 바 있는 경우, 2차적 증거인 피고인의 법정진술을 유죄의 증거로 사용할 수 있는지 여부 및 피고인의 법정진술을 유죄의 증거로 사용할 수 있는 예외적인 경우와 그러한 특별한 사정이 존재한다는 점에 대한 증명책임 소재","url":"https://www.law.go.kr/precInfoP.do?precSeq=606659"},{"id":"P:606661","kind":"P","label":"2024도16986","title":"무고","court":"대법원","date":"2025.01.09","caseType":"형사","basis":"참조조문","text":"수사관을 만나 범죄혐의를 인정할 수 있는 허위사실을 말한 뒤에 진술조서를 작성하면서 처벌을 요구하는 진술을 한 경우, 수사기관에 대하여 허위의 사실을 신고한 경우에 해당하는지 여부 및 이때 그 진술이 수사기관 등의 추문에 의한 것인지 판단하는 방법","url":"https://www.law.go.kr/precInfoP.do?precSeq=606661"},{"id":"P:600299","kind":"P","label":"2022도5573","title":"야간주거침입절도·업무방해[야간주거침입절도죄에서 절도의 고의 인정 여부가 문제된 사건]","court":"대법원","date":"2025.01.09","caseType":"형사","basis":"참조조문","text":"야간주거침입절도죄가 성립하기 위해서는 실행의 착수시점인 야간에 주거침입이 이루어질 때 절도의 고의가 있어야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=600299"},{"id":"P:607215","kind":"P","label":"2024노652","title":"교통사고처리특례법위반(치상)","court":"울산지방법원","date":"2025.01.07","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=607215"},{"id":"P:606037","kind":"P","label":"2023노7060","title":"사기","court":"수원지방법원","date":"2024.12.27","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606037"},{"id":"P:600521","kind":"P","label":"2024도1856","title":"업무상과실치사·업무상과실치상","court":"대법원","date":"2024.12.26","caseType":"형사","basis":"참조조문","text":"[1] 과실범의 경우에도 공동정범이 성립할 수 있는지 여부 / 의사의 연락이나 주의의무 위반에 대한 공동의 인식이 없더라도 과실범의 공동정범이 성립하는지 여부 [2] 피고인 甲 등은 CMIT/MIT를 주원료로 하는 乙, 丙 가습기살균제의 제조·판매에, 피고인 丁 등은 그중 丙 살균제의 제조·판매에 관여하면서 주원료에 관한 안전성 검사를 실시하지 아니하였고, 한편 관련사건 피고인들은 PHMG 등을 주원료로 하는 戊 살균제 등의 제조·판매에 관여하면서 주원료에 관한 안전성 검사 등 미실시로 업무상과실치사상죄 등의 유죄판결이 확정되었는데, 피고인 甲 등이 피고인 丁 등과 상호 공모하거나 그에 더하여 관련사건 피고인들과 공모하여 乙 살균제만을 사용한 피해자들 및 乙, 丙 살균제와 戊 살균제 등을 함께 사용한 피해자들을 사망 또는 상해에 이르게 하고, 피고인 丁 등이 피고인 甲 등 및 관련사건 피고인들과 공모하여 복합사용 피해자들 중 丙 살균제를 사용한 피해자들을 사망 또는 상해에 이르게 하였다는 업무상과실치사상의 공소사실로 기소되어 복합사용 피해자들에 관한 공동정범 성립 여부가 문제 된 사안에서, 피고인들과 관련사건 피고인들이 공동정범의 관계에 있다고 본 원심판단에 과실범의 공동정범 성립에 관한 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=600521"},{"id":"P:599717","kind":"P","label":"2024도9537","title":"도로교통법위반(음주운전)·도로교통법위반(무면허운전)·도로교통법위반·도로교통법위반(사고후미조치)·자동차손해배상보장법위반","court":"대법원","date":"2024.12.26","caseType":"형사","basis":"판례내용","text":"치료감호 등에 관한 법률상 치료감호청구 요구 여부가 법관의 재량인지 여부 및 그 내재적 한계 / 공소제기된 사건의 심리 결과 피고인의 재범 가능성과 아울러 일정한 강제력을 수반하는 감호 상태에서 치료받아야 할 필요성에 관한 구체적인 사정이 명백하게 확인되었는데도 그러한 요구 권한을 행사하지 아니한 것이 매우 불합리하다고 인정되는 경우, 그러한 권한의 불행사는 재량의 한계를 현저하게 벗어난 것으로 위법한지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=599717"},{"id":"P:605229","kind":"P","label":"2024노2068","title":"직권남용권리행사방해","court":"서울고등법원","date":"2024.12.20","caseType":"형사","basis":"참조조문","text":"피고인은 사단 군사경찰대대가 수행하는 교통단속 등 질서유지 업무를 지휘·감독하는 대대장인데, 대대 소속 교통단속 요원인 甲 등이 영내 규정속도 30km/h를 초과하여 35km/h로 운행한 장교 乙, 丙의 제한속도 위반행위를 적발하자 乙, 丙은 현장에서 피고인에게 전화로 항의하면서 교통법규위반 단속확인서를 작성하지 않은 채 현장을 이탈하였고, 그 직후 피고인이 甲에게 전화하여 단속과 관련한 추가 조치를 하지 말고 사건을 종료하도록 지시함으로써 지휘·감독권을 남용하여 甲으로 하여금 교통법규 위반자들을 단속 명단에서 제외하도록 의무 없는 일을 하게 하였다는 직권남용권리행사방해의 공소사실로 기소된 사안에서, 피고인에게 무죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=605229"},{"id":"P:606629","kind":"P","label":"2024노851","title":"마약류관리에관한법률위반(향정)","court":"서울남부지방법원","date":"2024.12.19","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606629"},{"id":"P:607233","kind":"P","label":"2024노1485","title":"사기·특정범죄가중처벌등에관한법률위반(위험운전치사상)·도로교통법위반·범죄수익은닉의규제및처벌등에관한법률위반·금융실명거래및비밀보장에관한법률위반","court":"창원지방법원","date":"2024.12.19","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=607233"},{"id":"P:600549","kind":"P","label":"2021모2650","title":"재심기각결정에대한재항고","court":"대법원","date":"2024.12.18","caseType":"형사","basis":"판례내용","text":"[1] 형사재판에서 재심의 의의 / 형사소송법 제420조 제7호에서 ‘원판결 등에 관여한 법관, 공소의 제기 또는 그 공소의 기초된 수사에 관여한 검사나 사법경찰관이 그 직무에 관한 죄를 범한 것이 확정판결에 의하여 증명된 때’를 재심사유로 규정한 취지 [2] 형사소송법 제422조에서 정한 ‘그 사실을 증명하여’의 의미 및 이때의 증명은 ‘확정판결을 대신하는 증명’인지 여부 / ‘확정판결을 대신하는 증명’이 있는지를 판단할 때 유념할 점 및 고려할 사항 [3] 재심청구인이 형사소송법 제420조 제7호에서 규정한 범죄의 피해자로서 하는 진술 자체가 재심이유인 ‘직무에 관한 죄’의 존재를 뒷받침하는 핵심적 증거로 제출되었음에도 그 범죄의 공소시효가 이미 완성하여 확정판결로 증명할 수 없는 상태에서, 재심청구인의 범죄 피해에 관한 진술에 충분한 신빙성이 있고 그 진술만으로 법이 정한 재심사유가 있다고 인정하기에 충분하다는 정도에 이를 경우, 재심청구가 이유 있다고 인정하여 재심의 심판을 받을 기회를 보장하여야 하는지 여부 및 이때 재심청구를 받은 법원이 취할 조치","url":"https://www.law.go.kr/precInfoP.do?precSeq=600549"},{"id":"P:606563","kind":"P","label":"2024노1770","title":"부정경쟁방지및영업비밀보호에관한법률위반(영업비밀국외누설등)·산업기술의유출방지및보호에관한법률위반·부정경쟁방지및영업비밀보호에관한법률위반(영업비밀누설등)·부정경쟁방지및영업비밀보호에관한법률위반","court":"대구지방법원","date":"2024.12.13","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606563"},{"id":"P:619341","kind":"P","label":"2024노2002","title":"성폭력범죄의처벌등에관한특례법위반(통신매체이용음란)","court":"수원지방법원","date":"2024.12.13","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619341"},{"id":"P:608519","kind":"P","label":"2024노811","title":"절도(인정된죄명:재물손괴·횡령)","court":"수원지방법원","date":"2024.12.13","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=608519"},{"id":"P:617197","kind":"P","label":"2020고단4306","title":"사기·도로교통법위반(음주운전)·도로교통법위반(음주운전)·도로교통법위반(무면허운전)·도로교통법위반(무면허운전)·도로교통법위반(음주운전)·도로교통법위반(무면허운전)·도로교통법위반(음주운전)·도로교통법위반(무면허운전)·사기·사기","court":"서울중앙지방법원","date":"2024.12.12","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=617197"},{"id":"P:612061","kind":"P","label":"2022도17089","title":"집회및시위에관한법률위반·감염병의예방및관리에관한법률위반","court":"대법원","date":"2024.12.12","caseType":"형사","basis":"판례내용","text":"[1] 감염병의 예방 및 관리에 관한 법률 제49조 제1항에 따른 예방 조치 행정명령이 위법한 처분으로 인정되는 경우, 이를 위반한 행정명령의 상대방에게 같은 법 제80조 제7호 위반죄가 성립될 수 있는지 여부 / 행정작용이 비례의 원칙을 위반한 경우, 위법한지 여부 [2] 甲 시장이 코로나바이러스감염증-19의 확산을 우려하여 ‘사회적 거리두기 개편 3단계 격상 행정명령’을 통해 10일간 ‘1인 시위 외 집회 금지’를 공고했음에도 피고인들이 ‘생활임금 보장, 고객센터 직영화, 국민건강보험 공공성 강화!’라는 문구가 적힌 팻말을 들고서 시위를 함으로써 위 행정명령에 따른 조치를 위반했다는 공소사실로 기소된 사안에서, 위 행정명령은 침해의 최소성과 법익의 균형성을 갖춘 것으로 보기 어려워 비례의 원칙을 위반하여 위법하다고 볼 여지가 큰데도, 위헌 또는 위법하지 않다고 단정하여 공소사실을 유죄로 인정한 원심판단에 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=612061"},{"id":"P:606373","kind":"P","label":"2024노1247","title":"특정금융거래정보의보고및이용등에관한법률위반·외국환거래법위반","court":"서울남부지방법원","date":"2024.12.05","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606373"},{"id":"P:605673","kind":"P","label":"2024노289","title":"강도치상·특정범죄가중처벌등에관한법률위반(절도)","court":"광주고등법원","date":"2024.12.03","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=605673"},{"id":"P:613025","kind":"P","label":"2024노852","title":"개인정보보호법위반","court":"서울중앙지방법원","date":"2024.11.29","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=613025"},{"id":"P:606043","kind":"P","label":"2024노1964","title":"업무상과실치상","court":"부산지방법원","date":"2024.11.28","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606043"},{"id":"P:242149","kind":"P","label":"2022도10272","title":"폭력행위등처벌에관한법률위반(단체등의구성·활동)·폭력행위등처벌에관한법률위반(공동상해)교사·범인도피","court":"대법원","date":"2024.11.28","caseType":"형사","basis":"참조조문","text":"[1] 범인도피죄의 친족 간 특례를 규정한 형법 제151조 제2항에서 ‘친족’의 의미 / 혼인외 출생자가 벌금 이상의 형에 해당하는 죄를 범한 자신의 생부를 도피하게 하였으나 생부가 혼인외 출생자를 인지하지 않은 경우, 혼인외 출생자의 행위에 대하여 형법 제151조 제2항을 적용할 수 있는지 여부 [2] 생부가 혼인외 출생자를 인지하지 않아 법률상 친자관계가 발생하지 않았으나 생부와 혼인외 출생자 사이의 자연적 혈연관계로 말미암아 도피시키지 않을 것을 기대하기 어려운 경우, 형법 제151조 제2항을 유추적용할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=242149"},{"id":"P:241977","kind":"P","label":"2020도15212","title":"부정청탁및금품등수수의금지에관한법률위반","court":"대법원","date":"2024.11.20","caseType":"형사","basis":"판례내용","text":"[1] 구 부정청탁 및 금품등 수수의 금지에 관한 법률 제5조 제1항의 입법 취지 및 위 조항에서 열거한 부정청탁을 받은 공직자 등이 그에 따라 직무를 수행하는 경우, 대가를 불문하고 구 부정청탁 및 금품등 수수의 금지에 관한 법률 위반죄가 성립하는지 여부 [2] 구 부정청탁 및 금품등 수수의 금지에 관한 법률 제5조 제1항 제1호부터 제8호 등의 ‘법령을 위반하여’에서 말하는 ‘법령’에 법규명령으로서 대통령령, 총리령, 부령 등과 자치법규인 조례, 규칙 및 행정규칙이 포함되는지 여부 / 위 제5조 제1항 제1호부터 제8호 등에서 정한 ‘법령을 위반하는 행위’의 의미 / 같은 항 제15호의 ‘법령에 따라 부여받은 지위·권한을 벗어나 행사하는 행위’의 의미 및 이를 판단하는 방법","url":"https://www.law.go.kr/precInfoP.do?precSeq=241977"},{"id":"P:605581","kind":"P","label":"2024노1940","title":"업무상횡령·사기·컴퓨터등사용사기","court":"창원지방법원","date":"2024.11.19","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=605581"},{"id":"P:606339","kind":"P","label":"2022고합660","title":"공직선거법위반","court":"서울중앙지방법원","date":"2024.11.15","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606339"},{"id":"P:606247","kind":"P","label":"2024노595","title":"준강제추행·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등)·감금·강간·스토킹범죄의처벌등에관한법률위반·협박","court":"수원고등법원","date":"2024.11.14","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606247"},{"id":"P:607627","kind":"P","label":"2024고단3322","title":"절도·도주","court":"서울중앙지방법원","date":"2024.11.14","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=607627"},{"id":"P:241993","kind":"P","label":"2024도11629","title":"무고·위계공무집행방해(인정된죄명:경범죄처벌법위반)[허위로 112신고를 한 행위가 위계공무집행방해죄의 위계에 해당하는지 여부가 문제된 사건]","court":"대법원","date":"2024.11.14","caseType":"형사","basis":"참조조문","text":"[1] 피의자 등이 수사기관에 대하여 허위사실을 진술하거나 피의사실 인정에 필요한 증거를 감추고 허위의 증거를 제출하였는데, 수사기관이 충분한 수사를 하지 아니한 채 이와 같은 허위의 진술과 증거만으로 증거의 수집·조사를 마친 경우, 위계에 의한 공무집행방해죄가 성립하는지 여부 [2] 경범죄 처벌법 제3조 제3항 제2호에서 정한 거짓신고 행위가 원인이 되어 상대방인 공무원이 범죄가 발생한 것으로 오인함으로 인하여 그러한 사정을 알았더라면 하지 않았을 대응조치를 취하기에 이른 경우, 위계에 의한 공무집행방해죄가 성립하는지 여부 [3] 경범죄 처벌법 제3조 제3항 제2호에서 정한 거짓신고를 함에 따라 경찰관이 신고의 거짓 여부를 확인하거나 검토할 여유 없이 국민의 생명·신체 보호 등을 위해서 다른 업무보다 우선하여 긴급하게 현장에 출동하는 등 즉각적인 대응조치를 취하여야 하는 상황에서 실제로 그러한 대응조치가 이루어진 경우, 경찰관의 위와 같은 직무에 관하여 위계에 의한 공무집행방해죄가 성립하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=241993"},{"id":"P:612945","kind":"P","label":"2024고합143","title":"특정경제범죄가중처벌등에관한법률위반(사기)·사기·범죄수익은닉의규제및처벌등에관한법률위반·외국환거래법위반·특정경제범죄가중처벌등에관한법률위반(재산국외도피)·배상명령신청","court":"수원지방법원평택지원","date":"2024.11.13","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=612945"},{"id":"P:618471","kind":"P","label":"2023고단1179","title":"강제추행·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등)","court":"전주지방법원","date":"2024.11.13","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=618471"},{"id":"P:605685","kind":"P","label":"2023노1871","title":"사기","court":"서울남부지방법원","date":"2024.11.07","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=605685"},{"id":"P:242111","kind":"P","label":"2024노1823","title":"아동·청소년의성보호에관한법률위반(성착취물제작·배포등)[인정된죄명:성폭력범죄의처벌등에관한특례법위반(허위영상물편집·반포등)]·성폭력범죄의처벌등에관한특례법위반(허위영상물편집·반포등)·아동·청소년의성보호에관한법률위반(성착취물소지)·성폭력범죄의처벌등에관한특례법위반(통신매체이용음란)","court":"서울고등법원","date":"2024.11.01","caseType":"형사","basis":"판례내용","text":"피고인이 SNS를 통해 성명불상자에게 자신의 후배인 피해자 甲의 얼굴 사진을 불상 여성의 나체사진 또는 성관계 사진 등과 합성한 불법합성물을 제작 의뢰하여 이를 전송받는 방법으로 아동·청소년성착취물을 제작하였다는 아동·청소년의 성보호에 관한 법률 위반의 주위적 공소사실 및 같은 방법으로 甲의 의사에 반하여 성적 욕망 또는 수치심을 유발할 수 있는 형태로 합성한 합성물을 제작하였다는 성폭력범죄의 처벌 등에 관한 특례법 위반의 예비적 공소사실로 기소된 사안에서, 위 합성사진이 아동·청소년의 성보호에 관한 법률 제2조 제5호의 ‘아동·청소년성착취물’에 해당하지 않는다는 등의 이유로, 주위적 공소사실을 무죄로 판단하면서 예비적 공소사실을 유죄로 인정한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=242111"},{"id":"P:606031","kind":"P","label":"2024노1087","title":"마약류관리에관한법률위반(향정)·마약류관리에관한법률위반(대마)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등)","court":"서울고등법원","date":"2024.11.01","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606031"},{"id":"P:612919","kind":"P","label":"2024노800","title":"부동산실권리자명의등기에관한법률위반·전자금융거래법위반·사기·업무방해·범죄수익은닉의규제및처벌등에관한법률위반","court":"울산지방법원","date":"2024.10.31","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=612919"},{"id":"P:604515","kind":"P","label":"2024도10477","title":"주거침입미수·협박·특수재물손괴·성폭력범죄의처벌등에관한특례법위반(촬영물등이용협박)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등)·스토킹범죄의처벌등에관한법률위반·폭행","court":"대법원","date":"2024.10.31","caseType":"형사","basis":"판례내용","text":"성폭력범죄의 처벌 등에 관한 특례법 제14조 제1항에서 규정한 ‘사람의 신체를 촬영한 행위’에 사람의 신체 그 자체를 직접 촬영하는 행위만 해당하는지 여부 및 사람의 신체 이미지가 담긴 영상을 촬영한 행위도 이에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=604515"},{"id":"P:241863","kind":"P","label":"2023도12878","title":"명예훼손·모욕·협박·스토킹범죄의처벌등에관한법률위반","court":"대법원","date":"2024.10.31","caseType":"형사","basis":"참조조문","text":"국가공무원법 제33조의2 및 지방공무원법 제31조의2의 분리 선고 규정의 취지 / 2022. 12. 27. 개정된 국가공무원법 및 지방공무원법의 각 시행일 이전에 스토킹범죄를 범한 것이 국가공무원법 제33조 제6호의3 및 지방공무원법 제31조 제6호의3에서 정한 결격사유에 해당하는지 여부 / 2022. 12. 27. 개정된 국가공무원법 및 지방공무원법 시행일 전에 범한 것이어서 결격대상범죄가 아닌 스토킹범죄와 다른 죄의 경합범에 대하여 벌금형을 선고하는 경우, 분리 선고를 정한 국가공무원법 제33조의2 및 지방공무원법 제31조의2가 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=241863"},{"id":"P:618537","kind":"P","label":"2023나11283","title":"상표권침해금지등","court":"특허법원","date":"2024.10.28","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=618537"},{"id":"P:604397","kind":"P","label":"2021도8948","title":"업무상횡령·문화재수리등에관한법률위반","court":"대법원","date":"2024.10.25","caseType":"형사","basis":"참조조문","text":"[1] 횡령죄에서 말하는 ‘보관’의 의미 / 횡령죄의 성립에 필요한 위탁관계는 횡령죄로 보호할 만한 가치 있는 신임에 의한 것으로 한정되는지 여부 및 위탁관계가 있는지 판단하는 기준 [2] 횡령죄가 성립하기 위해서는 횡령의 대상이 된 재물이 타인의 소유이어야 하는지 여부 / 목적과 용도를 정하여 위탁한 금전을 수탁자가 임의로 소비하는 행위가 횡령죄를 구성하는지 여부 및 이때 피해자가 목적과 용도를 정하여 금전을 위탁한 사실 및 그 목적과 용도가 무엇인지는 엄격한 증명의 대상인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=604397"},{"id":"P:607631","kind":"P","label":"2023노2518","title":"주택법위반","court":"광주지방법원","date":"2024.10.16","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=607631"},{"id":"P:616625","kind":"P","label":"2023고합1098","title":"산업기술의유출방지및보호에관한법률위반·부정경쟁방지및영업비밀보호에관한법률위반(영업비밀국외누설등)·업무상배임","court":"서울중앙지방법원","date":"2024.10.16","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=616625"},{"id":"P:606365","kind":"P","label":"2024노216","title":"특정범죄가중처벌등에관한법률위반(뇌물)·뇌물수수·사전뇌물수수·뇌물공여","court":"부산고등법원","date":"2024.10.16","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606365"},{"id":"P:603393","kind":"P","label":"2023노1855","title":"교통사고처리특례법위반(치사)","court":"대전지방법원","date":"2024.10.10","caseType":"형사","basis":"참조조문","text":"피고인이 자신의 승용차를 운전하여 대학교 구내 지하주차장에서 나와 우회전하는 도중 차량이 갑자기 가속되면서 대학교 내 광장을 가로질러 피해자 甲 쪽으로 비정상적으로 진행하다가 차량 앞부분으로 甲을 충격하여 사망에 이르게 하였다는 교통사고처리 특례법 위반으로 기소되었는데, 피고인은 위 사고가 차량의 결함으로 인한 이른바 ‘급발진 사고’로서 자신에게 과실이 없다고 주장하며 다투는 사안에서, 제반 사정을 종합할 때 위 사고는 피고인이 가속페달을 브레이크페달로 오인하여 밟는 등 차량 운전자에게 요구되는 주의의무를 위반하여 가속장치, 제동장치 등을 정확하게 조작하지 못한 과실로 발생하였다고 봄이 타당하다는 이유로, 피고인에게 유죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=603393"},{"id":"P:606115","kind":"P","label":"2023노3197","title":"업무방해","court":"의정부지방법원","date":"2024.10.10","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606115"},{"id":"P:614501","kind":"P","label":"2023노1855","title":"교통사고처리특례법위반(치사)","court":"대전지방법원","date":"2024.10.10","caseType":"형사","basis":"참조조문","text":"피고인이 자신의 승용차를 운전하여 대학교 구내 지하주차장에서 나와 우회전하는 도중 차량이 갑자기 가속되면서 대학교 내 광장을 가로질러 피해자 甲 쪽으로 비정상적으로 진행하다가 차량 앞부분으로 甲을 충격하여 사망에 이르게 하였다는 교통사고처리 특례법 위반으로 기소되었는데, 피고인은 위 사고가 차량의 결함으로 인한 이른바 ‘급발진 사고’로서 자신에게 과실이 없다고 주장하며 다투는 사안에서, 제반 사정을 종합할 때 위 사고는 피고인이 가속페달을 브레이크페달로 오인하여 밟는 등 차량 운전자에게 요구되는 주의의무를 위반하여 가속장치, 제동장치 등을 정확하게 조작하지 못한 과실로 발생하였다고 봄이 타당하다는 이유로, 피고인에게 유죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=614501"},{"id":"P:241777","kind":"P","label":"2020도11223","title":"마약류관리에관한법률위반(대마)","court":"대법원","date":"2024.10.08","caseType":"형사","basis":"판례내용","text":"[1] 참여권에 관한 규정을 비롯하여 형사소송법이 정한 압수·수색절차에 관한 구체적 규정들은 헌법 원칙인 적법절차와 영장주의를 구현하는 관점에 따라 해석·실현되어야 하는지 여부 [2] 형사소송법 제123조 제2항, 제3항, 제219조가 주거지 등에서 압수·수색영장을 집행할 때 주거주 등이나 이웃 등을 참여하도록 한 취지 / 형사소송법 제123조 제2항, 제3항, 제219조에서 정한 바에 따라 압수·수색영장의 집행에 참여하는 주거주 등 또는 이웃 등은 참여능력을 갖추고 있어야 하는지 여부 [3] 형사소송법 제123조 제2항에서 정한 주거지 등에 대한 압수·수색영장의 집행이 주거주 등이나 이웃 등의 참여 없이 이루어진 경우, 압수·수색영장 집행의 적법 여부 및 주거주 등 또는 이웃 등이 참여하였으나 그 참여자에게 참여능력이 없거나 부족한 경우에도 마찬가지인지 여부 [4] 형사소송법 제123조 제2항, 제3항에 따라 압수·수색영장의 집행에 참여하는 주거주 등이나 이웃 등에게 의사소통이나 의사표현에 어려움을 겪는 장애가 있을 경우, 수사기관은 그러한 장애가 있는 참여자에 대하여 장애인차별금지 및 권리구제 등에 관한 법률 제26조 제6항의 취지에 맞는 적법한 조치를 취하여야 하는지 여부 / 피의자가 주거주 등인 주거지 등에서 압수·수색영장을 집행할 때 피의자에게 참여능력이 없는 경우, 수사기관은 참여능력이 있는 이웃 등을 함께 참여시켜야 하는","url":"https://www.law.go.kr/precInfoP.do?precSeq=241777"},{"id":"P:606635","kind":"P","label":"2024노228","title":"부패방지및국민권익위원회의설치와운영에관한법률위반·농지법위반·공무상비밀누설","court":"서울고등법원","date":"2024.10.08","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606635"},{"id":"P:603981","kind":"P","label":"2022도15971","title":"모욕","court":"대법원","date":"2024.10.08","caseType":"형사","basis":"참조조문","text":"모욕죄의 보호법익 및 ‘모욕’의 의미 / 어떠한 표현이 모욕죄의 모욕에 해당하는지 판단하는 기준 / 상대방을 불쾌하게 할 수 있는 무례하고 예의에 벗어난 정도의 표현이거나 상대방에 대한 부정적·비판적 의견이나 감정을 나타내면서 경미한 수준의 추상적 표현이나 욕설이 사용된 경우, 모욕죄의 구성요건에 해당하는지 여부 / 모욕죄의 구성요건을 해석·적용할 때 고려하여야 할 사항","url":"https://www.law.go.kr/precInfoP.do?precSeq=603981"},{"id":"P:242153","kind":"P","label":"2023도15833","title":"분묘발굴유골손괴·분묘발굴","court":"대법원","date":"2024.10.08","caseType":"형사","basis":"참조조문","text":"형법 제161조에서 규정한 유골손괴죄의 보호법익 및 그 대상인 행위 / 제사주재자 또는 그로부터 정당하게 승낙을 얻은 자의 동의 없이 함부로 유골의 물리적 형상을 변경하는 등으로 훼손하는 행위가 ‘손괴’에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=242153"},{"id":"P:241631","kind":"P","label":"2024도7832","title":"스토킹범죄의처벌등에관한법률위반","court":"대법원","date":"2024.09.27","caseType":"형사","basis":"참조조문","text":"[1] 피고인이 전화를 걸어 피해자 휴대전화에 부재중 전화 문구, 수신차단기호 등이 표시되도록 한 경우, 실제 전화통화가 이루어졌는지와 상관없이 ‘피해자의 휴대전화로 유선·무선·광선 및 기타의 전자적 방식에 의하여 부호·문언을 송신하지 말 것’을 명하는 잠정조치를 위반한 것인지 여부 [2] 피고인이 피해자에게 접근하거나 전화를 건 행위가 스토킹범죄를 구성하는 스토킹행위에 해당하고 구 스토킹범죄의 처벌 등에 관한 법률 제9조 제1항 제2호, 제3호의 잠정조치를 위반한 행위에도 해당하는 경우, ‘스토킹범죄로 인한 같은 법 위반죄’와 ‘잠정조치 불이행으로 인한 같은 법 위반죄’의 죄수관계","url":"https://www.law.go.kr/precInfoP.do?precSeq=241631"},{"id":"P:599735","kind":"P","label":"2023도17996","title":"모욕","court":"대법원","date":"2024.09.27","caseType":"형사","basis":"참조조문","text":"모욕죄의 보호법익 및 ‘모욕’의 의미 / 어떠한 표현이 모욕죄의 모욕에 해당하는지 판단하는 기준 / 상대방을 불쾌하게 할 수 있는 무례하고 예의에 벗어난 정도의 표현이거나 상대방에 대한 부정적·비판적 의견이나 감정을 나타내면서 경미한 수준의 추상적 표현이나 욕설이 사용된 경우, 모욕죄의 구성요건에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=599735"},{"id":"P:241635","kind":"P","label":"2024도7516","title":"전기통신금융사기피해방지및피해금환급에관한특별법위반·컴퓨터등사용사기[구 「전기통신금융사기 피해 방지 및 피해금 환급에 관한 특별법」(2023. 5. 16. 법률 제19418호로 개정되어 2023. 11. 17. 시행되기 전의 것, 이하 ‘구법’) 제15조의2 제1항의 개정이 ‘범죄 후의 법령개폐로 형이 폐지되었을 때’에 해당하는지 여부가 문제된 사건]","court":"대법원","date":"2024.09.27","caseType":"형사","basis":"참조조문","text":"구 전기통신금융사기 피해 방지 및 피해금 환급에 관한 특별법이 2023. 5. 16. 법률 제19418호로 개정됨에 따라, 같은 법 제15조의2 제1항 제1, 2호에서 형사처벌 대상으로 규정한 ‘전기통신금융사기를 목적으로, 타인으로 하여금 컴퓨터 등 정보처리장치에 정보 또는 명령을 입력하게 하는 행위, 취득한 타인의 정보를 이용하여 컴퓨터 등 정보처리장치에 정보 또는 명령을 입력하는 행위’가 범죄를 구성하지 아니하게 되어 그에 관한 형이 폐지된 것인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=241635"},{"id":"P:609369","kind":"P","label":"2023고단4232","title":"특정금융거래정보의보고및이용등에관한법률위반·외국환거래법위반·사기방조·범죄수익은닉의규제및처벌등에관한법률위반·배상명령신청주1)","court":"서울북부지방법원","date":"2024.09.25","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=609369"},{"id":"P:616647","kind":"P","label":"2023노1677","title":"증거인멸교사·증거인멸","court":"서울중앙지방법원","date":"2024.09.25","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=616647"},{"id":"P:606127","kind":"P","label":"2024노697","title":"특정경제범죄가중처벌등에관한법률위반(수재등)·특정경제범죄가중처벌등에관한법률위반(증재등)·특정경제범죄가중처벌등에관한법률위반(수재등)방조","court":"서울고등법원","date":"2024.09.25","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606127"},{"id":"P:616715","kind":"P","label":"2023고단5097","title":"모해위증","court":"대구지방법원","date":"2024.09.25","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=616715"},{"id":"P:241601","kind":"P","label":"2020도14843","title":"사기[법원이 해외에 체류 중인 사람에 대하여 선서 없이 인터넷 화상장치로 진술을 청취한 경우 그 진술 녹음파일과 녹취서의 증거능력이 문제된 사건]","court":"대법원","date":"2024.09.12","caseType":"형사","basis":"판례내용","text":"형사소송법이 증인 등 인증, 증거서류와 증거물 및 그 밖의 증거를 구분한 다음 각각의 증거방법에 대한 증거조사 방식을 개별적·구체적으로 규정하고, 특히 증인에 대한 증거조사를 ‘신문’의 방식으로 하면서 엄격한 절차 규정을 둔 취지 / 형사소송법에서 정한 절차와 방식에 따른 증인신문절차를 거치지 아니한 채 증인에 대하여 선서 없이 법관이 임의의 방법으로 청취한 진술과 그 진술의 형식적 변형에 불과한 증거의 증거능력 유무 및 이는 피고인이나 변호인이 그러한 절차 진행에 동의하였거나 사후에 그와 같은 증거조사 결과에 대하여 이의를 제기하지 아니하고 그 녹음파일 등을 증거로 함에 동의하였더라도 마찬가지인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=241601"},{"id":"P:606363","kind":"P","label":"2024노514","title":"특정경제범죄가중처벌등에관한법률위반(횡령)·특정경제범죄가중처벌등에관한법률위반(배임)(인정된죄명업무상배임)·주식회사의외부감사에관한법률위반·특정경제범죄가중처벌등에관한법률위반(횡령)방조·대부업의등록및금융이용자보호에관한법률위반","court":"서울고등법원","date":"2024.09.12","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606363"},{"id":"P:241599","kind":"P","label":"2020도12920","title":"아동학대범죄의처벌등에관한특례법위반(아동복지시설종사자등의아동학대가중처벌)","court":"대법원","date":"2024.09.12","caseType":"형사","basis":"참조조문","text":"학교 교사가 훈육 또는 지도 목적으로 한 행위라도 정신적 폭력이나 가혹행위로서 아동인 학생의 정신건강 또는 복지를 해치거나 정신건강의 정상적 발달을 저해할 정도 혹은 그러한 결과를 초래할 위험을 발생시킬 정도에 이른 경우, 구 아동복지법 제17조 제5호에서 금지하는 ‘정서적 학대행위’에 해당하는지 여부 / 교사의 위와 같은 행위가 사회상규에 위배되지 아니하는 경우로서 위법성이 조각되는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=241599"},{"id":"P:600519","kind":"P","label":"2023고단3217","title":"업무상과실치사·산업안전보건법위반","court":"서울북부지방법원","date":"2024.09.11","caseType":"형사","basis":"참조조문","text":"피고인 甲 주식회사는 특정 초등학교로부터 ‘학교 교문 환경개선공사’를 발주받아 시공하는 사업주이고, 피고인 乙 주식회사는 그중 ‘정문, 후문 설치공사’를 피고인 甲 회사로부터 도급받아 시공하는 사업주인데, 피고인 甲 회사 소속 현장소장으로 안전보건총괄책임자인 피고인 丙, 피고인 乙 회사 소속 현장소장으로 안전보건관리책임자인 피고인 丁, 위 설치공사의 굴착기 운전기사인 피고인 戊가 공동으로 정문 설치공사 현장에서 화물차 적재함에 적재된 철제 H빔을 피해자가 섬유로프로 묶어 굴착기 고리에 걸면 피고인 戊가 조정을 하여 이를 화물차에서 내리는 작업을 하던 중 섬유로프가 갑자기 풀리면서 H빔이 피해자의 머리 및 얼굴 부위로 떨어져 깔리게 함으로써 업무상의 과실로 피해자를 사망에 이르게 함과 동시에 피고인 丙, 丁이 공모하여 근로자의 산업재해를 예방하기 위한 안전조치의무를 위반하여 피해자를 사망에 이르게 하였다는 내용으로 기소된 사안에서, 피고인들 모두에게 유죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=600519"},{"id":"P:614657","kind":"P","label":"2023고단3217","title":"업무상과실치사·산업안전보건법위반","court":"서울북부지방법원","date":"2024.09.11","caseType":"형사","basis":"참조조문","text":"피고인 甲 주식회사는 특정 초등학교로부터 ‘학교 교문 환경개선공사’를 발주받아 시공하는 사업주이고, 피고인 乙 주식회사는 그중 ‘정문, 후문 설치공사’를 피고인 甲 회사로부터 도급받아 시공하는 사업주인데, 피고인 甲 회사 소속 현장소장으로 안전보건총괄책임자인 피고인 丙, 피고인 乙 회사 소속 현장소장으로 안전보건관리책임자인 피고인 丁, 위 설치공사의 굴착기 운전기사인 피고인 戊가 공동으로 정문 설치공사 현장에서 화물차 적재함에 적재된 철제 H빔을 피해자가 섬유로프로 묶어 굴착기 고리에 걸면 피고인 戊가 조정을 하여 이를 화물차에서 내리는 작업을 하던 중 섬유로프가 갑자기 풀리면서 H빔이 피해자의 머리 및 얼굴 부위로 떨어져 깔리게 함으로써 업무상의 과실로 피해자를 사망에 이르게 함과 동시에 피고인 丙, 丁이 공모하여 근로자의 산업재해를 예방하기 위한 안전조치의무를 위반하여 피해자를 사망에 이르게 하였다는 내용으로 기소된 사안에서, 피고인들 모두에게 유죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=614657"},{"id":"P:606111","kind":"P","label":"2024고단43","title":"사기","court":"수원지방법원여주지원","date":"2024.09.10","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606111"},{"id":"P:608423","kind":"P","label":"2023고단2380","title":"공무집행방해·재물손괴·아동복지법위반(아동에대한음행강요·매개·성희롱등)·성폭력범죄의처벌등에관한특례법위반(통신매체이용음란)","court":"대전지방법원천안지원","date":"2024.08.30","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=608423"},{"id":"P:622123","kind":"P","label":"2020고단3","title":"가. 산업기술의유출방지및보호에관한법률위반","court":"수원지방법원","date":"2024.08.29","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=622123"},{"id":"P:599723","kind":"P","label":"2024도8200","title":"마약류관리에관한법률위반(향정)","court":"대법원","date":"2024.08.29","caseType":"형사","basis":"판례내용","text":"[1] 검사가 작성한 피의자신문조서의 증거능력 제한에 관한 형사소송법 제312조 제1항에서 ‘그 내용을 인정할 때’의 의미 / 위 규정에서 정한 ‘검사가 작성한 피의자신문조서’에 당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대한 것도 포함되는지 여부 및 이때 ‘공범’의 범위 / 피고인이 자신과 공범관계에 있는 다른 피고인이나 피의자에 대하여 검사가 작성한 피의자신문조서의 내용을 부인하는 경우, 그 조서를 유죄의 증거로 쓸 수 있는지 여부 [2] 검사 이외의 수사기관이 작성한 피의자신문조서의 증거능력 제한에 관한 형사소송법 제312조 제3항이 검사 이외의 수사기관이 작성한 당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대한 피의자신문조서를 당해 피고인에 대한 유죄의 증거로 채택할 경우에도 적용되는지 여부 및 이때 ‘공범’의 범위 / 위 규정에서 ‘그 내용을 인정할 때’의 의미","url":"https://www.law.go.kr/precInfoP.do?precSeq=599723"},{"id":"P:607197","kind":"P","label":"2024노291","title":"성폭력범죄의처벌등에관한특례법위반(촬영물등이용협박)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영)·재물손괴·폭행","court":"대구고등법원","date":"2024.08.22","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=607197"},{"id":"P:606737","kind":"P","label":"2023고단2933","title":"마약류관리에관한법률위반(향정)·도로교통법위반(음주운전)·도로교통법위반·도로교통법위반(무면허운전)","court":"서울동부지방법원","date":"2024.08.13","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606737"},{"id":"P:615865","kind":"P","label":"2023고단1106","title":"조세범처벌법위반·사기","court":"청주지방법원","date":"2024.08.13","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=615865"},{"id":"P:241377","kind":"P","label":"2021도2084","title":"업무방해[업무방해죄에서 정당행위에 의한 위법성조각 여부가 문제된 사건]","court":"대법원","date":"2024.08.01","caseType":"형사","basis":"참조조문","text":"[1] 형법 제20조의 ‘사회상규에 위배되지 아니하는 행위’의 규정 취지 및 법적 성격 [2] 사회상규에 위배되지 아니하는 정당행위에 해당하는지 판단하는 기준 / 이때 정당행위로 인정되기 위한 요건들 중 행위의 긴급성과 보충성은 수단의 상당성을 판단할 때 고려요소의 하나로 참작하여야 하는지 여부 및 긴급성이나 보충성의 내용과 정도 [3] 이른바 ‘동물권’을 주장해 온 피고인들이 동물권보호단체 회원들과 공모하여, 甲 주식회사의 공장 정문 앞 도로에서 甲 회사가 농장으로부터 생닭을 공급받아 도계하는 영업을 계속한다는 이유로 피고인들은 자신들의 손을 콘크리트가 들어있는 가방으로 결박한 채 드러누워 몸으로 생닭을 실은 트럭들을 가로막는 등 차량 진행을 방해하고, 위 단체 회원들은 ‘닭을 죽이면 안 된다.’는 플래카드를 걸고 같은 내용의 구호를 외치며 노래를 부르는 등 위력으로써 甲 회사의 생닭 운송 및 도계 업무를 방해하였다는 내용으로 기소된 사안에서, 피고인들의 행위는 업무방해죄의 구성요건에 해당하고, 그 동기나 목적의 정당성이 인정될 여지가 있지만, 수단과 방법의 상당성, 법익 균형성 등이 인정되지 아니하여 정당행위에 해당하지 않는다고 본 원심판단이 정당하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=241377"},{"id":"P:241379","kind":"P","label":"2024도3061","title":"강제추행·도로교통법위반[추행행위 해당 여부와 추행의 고의 인정 여부가 문제된 사건]","court":"대법원","date":"2024.08.01","caseType":"형사","basis":"참조조문","text":"[1] 강제추행죄에서 추행의 의미 및 어떠한 행위가 추행에 해당하는지 판단하는 방법 / 강제추행죄의 죄수 및 강제추행죄가 성립되기 위해서는 문제가 되는 행위마다 폭행 또는 협박 외에 추행행위와 그에 대한 범의가 인정되어야 하는지 여부 / 형사재판에서 유죄의 인정을 위한 증거의 증명력 정도 및 추행의 범의에 대한 증명이 부족한 경우, 강제추행죄의 유죄로 판단할 수 있는지 여부 [2] 피고인이 차량 안에서 운전연수를 받던 甲의 운전이 미숙하다는 이유로 甲의 오른쪽 허벅지를 1회 밀쳐 강제로 추행하였다는 내용으로 기소된 사안에서, 공소사실을 유죄로 인정한 원심판단에 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=241379"},{"id":"P:607195","kind":"P","label":"2023노3708","title":"사기","court":"대구지방법원","date":"2024.07.25","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=607195"},{"id":"P:599647","kind":"P","label":"2022도2607","title":"공연음란","court":"대법원","date":"2024.07.25","caseType":"형사","basis":"참조조문","text":"형법 제10조 제2항의 심신미약이 형의 임의적 감경사유인지 여부 / 형의 임의적 감경사유인 심신미약에 관한 진술을 유죄판결의 이유에서 명시하여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=599647"},{"id":"P:599725","kind":"P","label":"2024도6909","title":"마약류불법거래방지에관한특례법위반·마약류관리에관한법률위반(향정)·마약류관리에관한법률위반(대마)·범죄단체조직·범죄단체가입·범죄단체활동·범죄수익은닉의규제및처벌등에관한법률위반·사기·사기미수·상해","court":"대법원","date":"2024.07.25","caseType":"형사","basis":"참조조문","text":"[1] 형법 제114조에서 정한 ‘범죄집단’의 의미와 요건 / 범죄집단 ‘조직’ 및 ‘가입’의 의미 / 범죄집단 구성원으로서의 ‘활동’의 의미 및 이에 해당하는지 판단하는 기준 [2] 범죄집단 구성원으로서 활동하는 행위로 인한 범죄집단활동죄와 개별 마약류 관리에 관한 법률 위반죄의 죄수관계","url":"https://www.law.go.kr/precInfoP.do?precSeq=599725"},{"id":"P:599651","kind":"P","label":"2021도17722","title":"공인중개사법위반·주택법위반","court":"대법원","date":"2024.07.25","caseType":"형사","basis":"판례내용","text":"[1] 아파트 분양권에 대한 매매를 알선하는 행위가 구 공인중개사법 제33조 제5호에서 정한 ‘관계 법령에서 양도·알선 등이 금지된 부동산의 분양·임대 등과 관련 있는 증서 등의 매매를 중개하는 행위’에 해당하는지 여부 [2] 구 공인중개사법 제3조 제2호에 규정된 중개대상물인 ‘건축물’에 장차 건축될 특정의 건축물도 포함되는지 여부 / 아파트의 특정 동·호수에 대하여 피분양자가 선정되거나 분양계약이 체결된 후 그 특정 아파트가 완성되기 전 이에 대한 매매 등 거래를 중개하는 것이 ‘건축물’의 중개에 해당하는지 여부 / 이를 같은 법 제33조 제5호에 의하여 개업공인중개사 등이 하여서는 안 되는 ‘관계 법령에서 양도·알선 등이 금지된 부동산의 분양·임대 등과 관련 있는 증서 등의 매매 등을 중개하는 행위’를 한 것으로 볼 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=599651"},{"id":"P:241249","kind":"P","label":"2023도16951","title":"공무집행방해[위법성 조각사유의 전제사실에 대한 착오가 문제된 사건]","court":"대법원","date":"2024.07.25","caseType":"형사","basis":"참조조문","text":"[1] 공무집행방해죄의 전제인 ‘공무집행의 적법성’의 요건과 판단 기준 [2] 공무집행방해죄에서 공무집행의 적법성에 관한 피고인의 잘못된 법적 평가로 인하여 자신의 행위가 금지되지 않는다고 오인한 경우, 피고인의 오인에 형법 제16조의 ‘정당한 이유’가 있는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=241249"},{"id":"P:599685","kind":"P","label":"2023노2532","title":"군인등강제추행(변경된죄명:군인등준강제추행미수)","court":"서울고등법원","date":"2024.07.18","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=599685"},{"id":"P:623929","kind":"P","label":"2023노3286","title":"가. 상해 나. 특수협박","court":"인천지방법원","date":"2024.07.18","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=623929"},{"id":"P:616651","kind":"P","label":"2023노530","title":"자본시장과금융투자업에관한법률위반","court":"서울고등법원","date":"2024.07.12","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=616651"},{"id":"P:599815","kind":"P","label":"2024도6203","title":"사기","court":"대법원","date":"2024.07.11","caseType":"형사","basis":"판례내용","text":"[1] 형사소송법 제33조 제1항 제1호에서 정한 필요적 국선변호인 선정사유인 ‘피고인이 구속된 때’가 피고인이 해당 형사사건에서 구속되어 재판을 받고 있는 경우에 한정되는지 여부 및 피고인이 별건으로 구속영장이 발부되어 집행되거나 다른 형사사건에서 유죄판결이 확정되어 그 판결의 집행으로 구금 상태에 있는 경우도 포괄하는지 여부 [2] 필요적 변호사건에서 제1심의 공판절차가 변호인 없이 이루어져 증거조사와 피고인신문 등 심리가 이루어진 경우, 제1심이 행한 소송행위의 효력 및 이때 항소심이 취해야 할 조치","url":"https://www.law.go.kr/precInfoP.do?precSeq=599815"},{"id":"P:241043","kind":"P","label":"2024도2940","title":"아동학대범죄의처벌등에관한특례법위반(아동학대살해)·아동복지법위반(상습아동학대)·아동복지법위반(상습아동유기·방임)","court":"대법원","date":"2024.07.11","caseType":"형사","basis":"참조조문","text":"아동학대범죄의 처벌 등에 관한 특례법상 아동학대살해죄에서 살해의 범의의 인정 기준 및 피고인이 범행 당시 살해의 범의가 없다고 다투는 경우, 살해의 범의가 있었는지 판단하는 기준 / 아동학대살해죄에서 피고인이 범행 당시 살해의 범의는 없고 아동학대의 고의만 있었다고 다투는 경우, 아동학대살해의 범의가 인정되는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=241043"},{"id":"P:241053","kind":"P","label":"2021도6051","title":"국민체육진흥법위반(도박개장등)·도박공간개설[형의 임의적 감면사유인 자수사실에 관한 진술을 유죄판결의 이유에서 명시하여야 하는지가 문제된 사안]","court":"대법원","date":"2024.07.11","caseType":"형사","basis":"참조조문","text":"형법 제52조 제1항의 자수가 형의 임의적 감면사유인지 여부 / 형의 임의적 감면사유인 자수사실에 관한 진술을 유죄판결의 이유에서 명시하여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=241053"},{"id":"P:241189","kind":"P","label":"2023노878","title":"보험사기방지특별법위반","court":"제주지방법원","date":"2024.07.04","caseType":"형사","basis":"판례내용","text":"甲이 자신의 아들인 乙을 피보험자로 하여 화재보험회사인 피해자 회사의 실손 의료비보험 등에 가입하였는데, 乙이 전동킥보드를 구입하여 타다가 넘어져 상해를 입고 병원 치료를 받게 되자, 피고인이 甲, 보험설계사인 丙과 공모하여, 전동킥보드를 운행하다가 상해를 입은 사고는 피해자 회사에서 보험금 지급이 제한되는 사실을 알면서도 ‘넘어져서 다침’으로 상해 발생원인을 허위로 기재하고 응급초진차트를 누락시켜 보험금을 청구하는 방법으로 피해자 회사를 기망하여 피해자 회사로부터 상해입원의료비 등을 교부받음으로써 보험사기행위로 보험금을 취득했다는 공소사실로 기소된 사안에서, 검사가 제출한 증거만으로는 피고인이 공소사실 기재와 같이 피해자 회사를 기망했다는 점이 합리적 의심의 여지가 없을 정도로 증명되었다고 보기 부족하고, 달리 이를 인정할 증거가 없어 무죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=241189"},{"id":"P:599743","kind":"P","label":"2023노5324","title":"무고·위계공무집행방해(인정된죄명:경범죄처벌법위반)","court":"인천지방법원","date":"2024.07.04","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=599743"},{"id":"P:614539","kind":"P","label":"2023노878","title":"보험사기방지특별법위반","court":"제주지방법원","date":"2024.07.04","caseType":"형사","basis":"판례내용","text":"甲이 자신의 아들인 乙을 피보험자로 하여 화재보험회사인 피해자 회사의 실손 의료비보험 등에 가입하였는데, 乙이 전동킥보드를 구입하여 타다가 넘어져 상해를 입고 병원 치료를 받게 되자, 피고인이 甲, 보험설계사인 丙과 공모하여, 전동킥보드를 운행하다가 상해를 입은 사고는 피해자 회사에서 보험금 지급이 제한되는 사실을 알면서도 ‘넘어져서 다침’으로 상해 발생원인을 허위로 기재하고 응급초진차트를 누락시켜 보험금을 청구하는 방법으로 피해자 회사를 기망하여 피해자 회사로부터 상해입원의료비 등을 교부받음으로써 보험사기행위로 보험금을 취득했다는 공소사실로 기소된 사안에서, 검사가 제출한 증거만으로는 피고인이 공소사실 기재와 같이 피해자 회사를 기망했다는 점이 합리적 의심의 여지가 없을 정도로 증명되었다고 보기 부족하고, 달리 이를 인정할 증거가 없어 무죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=614539"},{"id":"P:618563","kind":"P","label":"2023노2003","title":"특정범죄가중처벌등에관한법률위반(허위세금계산서교부등)·특정범죄가중처벌등에관한법률위반(조세)(인정된죄명조세범처벌법위반)·조세범처벌법위반·특정경제범죄가중처벌등에관한법률위반(횡령)·특정경제범죄가중처벌등에관한법률위반(사기)·특정 해자를 협박하고 상해를 가하였는지 여부가 문제된 사건]","court":"대법원","date":"2024.06.13","caseType":"형사","basis":"참조조문","text":"특수상해죄 및 특수협박죄의 구성요건 중 위험한 물건을 ‘휴대하여’의 의미 / 이때 범행 현장에서 위험한 물건을 사용하려는 의도가 있었는지 판단하는 기준 및 위험한 물건을 실제로 범행에 사용하였을 것까지 요구되는지 여부 / 위험한 물건을 휴대하였다고 하기 위하여, 그 물건을 현실적으로 손에 쥐고 있는 등 피고인과 그 물건이 반드시 물리적으로 부착되어 있어야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=240925"},{"id":"P:606117","kind":"P","label":"2023고단3139","title":"업무상과실치상","court":"부산지방법원","date":"2024.06.12","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606117"},{"id":"P:600397","kind":"P","label":"2023노999","title":"사기·사문서위조·위조사문서행사·범죄수익은닉의규제및처벌등에관한법률위반·공문서위조·위조공문서행사·금융실명거래및비밀보장에관한법률위반·주민등록법위반","court":"대전지방법원","date":"2024.06.12","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=600397"},{"id":"P:601885","kind":"P","label":"2024노711","title":"특정범죄가중처벌등에관한법률위반(보복협박등)(인정된죄명:스토킹범죄의처벌등에관한법률위반)·스토킹범죄의처벌등에관한법률위반","court":"서울고등법원","date":"2024.06.05","caseType":"형사","basis":"판례내용","text":"피고인은 교제하던 甲과 헤어진 후 甲에게 스토킹행위, 주거침입 등의 범행을 하여 징역형을 복역한 전력이 있고, 甲과 헤어진 후에도 甲 명의 계좌로 소액의 돈을 반복적으로 송금하였는데, 별개의 스토킹행위로 법원에서 甲에 대한 접근 및 연락 금지를 내용으로 하는 잠정조치결정을 받아 甲에게 연락을 할 수 없자, 甲의 계좌로 송금했던 내역을 빌미로 甲을 상대로 대여금반환청구 소송을 제기한 후 법원이 甲의 주소 불명을 이유로 주소보정명령을 내리자 이를 이용하여 甲의 주소를 알아내 甲에게 소장이 송달되게 하고, 위 소장을 송달받고 주소지가 노출된 사실을 알게 된 甲으로부터 \"통화 한번 할 수 있어?\"라는 문자메시지를 받고는 곧바로 두 차례에 걸쳐 甲에게 그의 주소지로 찾아가 위해를 가할 것 같은 내용의 문자메시지를 전송함으로써, 甲의 의사에 반하여 우편을 이용하여 소장을 도달하게 하고 정보통신망을 이용하여 문자메시지를 도달하게 하였다고 하여 스토킹범죄의 처벌 등에 관한 법률 위반으로 기소된 사안에서, 공소사실을 유죄로 인정한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=601885"},{"id":"P:614703","kind":"P","label":"2024노711","title":"특정범죄가중처벌등에관한법률위반(보복협박등)(인정된죄명:스토킹범죄의처벌등에관한법률위반)·스토킹범죄의처벌등에관한법률위반","court":"서울고등법원","date":"2024.06.05","caseType":"형사","basis":"판례내용","text":"피고인은 교제하던 甲과 헤어진 후 甲에게 스토킹행위, 주거침입 등의 범행을 하여 징역형을 복역한 전력이 있고, 甲과 헤어진 후에도 甲 명의 계좌로 소액의 돈을 반복적으로 송금하였는데, 별개의 스토킹행위로 법원에서 甲에 대한 접근 및 연락 금지를 내용으로 하는 잠정조치결정을 받아 甲에게 연락을 할 수 없자, 甲의 계좌로 송금했던 내역을 빌미로 甲을 상대로 대여금반환청구 소송을 제기한 후 법원이 甲의 주소 불명을 이유로 주소보정명령을 내리자 이를 이용하여 甲의 주소를 알아내 甲에게 소장이 송달되게 하고, 위 소장을 송달받고 주소지가 노출된 사실을 알게 된 甲으로부터 \"통화 한번 할 수 있어?\"라는 문자메시지를 받고는 곧바로 두 차례에 걸쳐 甲에게 그의 주소지로 찾아가 위해를 가할 것 같은 내용의 문자메시지를 전송함으로써, 甲의 의사에 반하여 우편을 이용하여 소장을 도달하게 하고 정보통신망을 이용하여 문자메시지를 도달하게 하였다고 하여 스토킹범죄의 처벌 등에 관한 법률 위반으로 기소된 사안에서, 공소사실을 유죄로 인정한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=614703"},{"id":"P:612917","kind":"P","label":"2023고단3100","title":"부동산실권리자명의등기에관한법률위반·전자금융거래법위반·사기·업무방해·범죄수익은닉의규제및처벌등에관한법률위반","court":"울산지방법원","date":"2024.05.30","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=612917"},{"id":"P:601529","kind":"P","label":"2023도17896","title":"성폭력범죄의처벌등에관한특례법위반(촬영물등이용협박)·협박[「성폭력범죄의 처벌 등에 관한 특례법」제14조의3 제1항의 ‘촬영물 등을 이용하여’의 의미가 문제된 사건]","court":"대법원","date":"2024.05.30","caseType":"형사","basis":"참조조문","text":"성폭력범죄의 처벌 등에 관한 특례법 제14조의3 제1항에서 정한 ‘촬영물 또는 복제물을 이용하여’의 의미 / 협박죄에서 협박의 의미 및 태도나 거동에 의하여 해악을 고지하는 경우도 협박에 해당하는지 여부 / 실제로 촬영, 제작, 복제 등의 방법으로 만들어진 바 있는 촬영물 등을 방편 또는 수단으로 삼아 유포가능성 등 공포심을 일으킬 수 있을 정도의 해악을 고지한 경우, 성폭력범죄의 처벌 등에 관한 특례법 제14조의3 제1항의 죄가 성립하는지 여부 및 이때 반드시 행위자가 촬영물 등을 피해자에게 직접 제시하는 방법으로 협박해야 한다거나 협박 당시 해당 촬영물 등을 소지하고 있거나 유포할 수 있는 상태여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=601529"},{"id":"P:601521","kind":"P","label":"2021도2656","title":"무고[피고인이 피무고자를 상대로 고소한 내용이 무고에 해당하는지 여부가 문제된 사건]","court":"대법원","date":"2024.05.30","caseType":"형사","basis":"참조조문","text":"[1] 무고죄의 성립요건 / 신고사실의 진실성을 인정할 수 없다는 소극적 증명만으로 그 신고사실을 허위의 사실이라 단정하여 무고죄의 성립을 인정할 수 있는지 여부 / 신고내용 중 일부 객관적 진실에 반하는 내용이 포함되어 있으나 단지 신고사실의 정황을 과장하는 데 불과한 경우, 무고죄가 성립하는지 여부 / 객관적 사실관계를 그대로 신고하였으나 그러한 사실관계를 토대로 한 나름대로의 주관적 법률평가를 잘못하고 이를 신고한 경우, 그 사실만 가지고 허위의 사실을 신고한 것에 해당하는지 여부 [2] 성폭행 등의 피해자가 하는 진술의 증명력을 판단할 때 고려할 사항 / 피해자임을 주장하는 사람이 성폭행 등의 피해를 입었다고 신고한 사실에 대하여 증거불충분 등을 이유로 불기소처분되거나 무죄판결이 선고된 경우, 반대로 이러한 신고내용이 객관적 사실에 반하여 무고죄가 성립하는지를 판단할 때 고려할 사항","url":"https://www.law.go.kr/precInfoP.do?precSeq=601521"},{"id":"P:601495","kind":"P","label":"2019도12887","title":"자본시장과금융투자업에관한법률위반[제3자 배정 유상증자와 전환사채 발행에 관한 공시가 이루어지게 한 것이 「자본시장과 금융투자업에 관한 법률」(이하 ‘자본시장법’) 제178조 제1항 제1호 또는 제2호의 부정행위인지 여부가 문제된 사건]","court":"대법원","date":"2024.05.30","caseType":"형사","basis":"판례내용","text":"[1] 자본시장과 금융투자업에 관한 법률 제178조에서 금융투자상품의 매매 그 밖의 거래에 관한 공정성과 신뢰성 및 효율성을 해치는 부정행위를 금지하는 취지 [2] 자본시장과 금융투자업에 관한 법률 제178조 제1항 제1호에서 금지하는 부정행위의 모습인 ‘부정한 수단, 계획 또는 기교’의 의미 및 그 판단 기준 [3] 자본시장과 금융투자업에 관한 법률 제178조 제1항 제2호에서 금지하는 부정행위인 ‘중요사항에 관하여 거짓의 기재를 하는 것 등을 통해 금전, 그 밖의 재산상의 이익을 얻고자 하는 행위’에서 말하는 ‘중요사항’, ‘금전, 그 밖의 재산상의 이익’의 의미 / 이때 거짓 기재 등의 행위로 인하여 실제로 금전, 그 밖의 재산상의 이익을 얻었어야 하는지 여부 및 금전, 그 밖의 재산상의 이익을 얻고자 하였는지 판단하는 기준 [4] 주권상장법인이 유상증자, 신규 사업 추진 등 회사의 중요의사결정에 관하여 이사회에서 결의를 하는 등으로 내부적 절차를 거친 후 이에 대한 공시를 통하여 시장에 정보를 제공한 경우, 그 공시 내용이 거짓의 기재 또는 표시 등에 해당하여 자본시장과 금융투자업에 관한 법률 제178조 제1항 제2호에서 금지하는 부정행위를 하였는지가 문제 되는 사안에서 그 공시가 거짓의 기재 또는 표시 등에 해당하는지 판단하는 기준 / 해당 공시가 이사회 결의 내용 등 공시할 대상을 그대로 반영하여 그 공시 내용 자체를 거짓","url":"https://www.law.go.kr/precInfoP.do?precSeq=601495"},{"id":"P:601503","kind":"P","label":"2021두58202","title":"요양급여및급여비용불인정처분취소청구[의료기관의 공동개설자 중 1명이 의사면허 자격정지 처분을 받은 기간에 해당 의료기관이 국민건강보험법상의 요양기관 내지 의료급여법상 의료급여기관의 자격을 갖는지 여부가 문제된 사건]","court":"대법원","date":"2024.05.30","caseType":"일반행정","basis":"판례내용","text":"의료인인 甲 등과 乙이 의료기관을 공동으로 개설하여 운영하던 중 乙에 대하여 거짓으로 진료비를 청구하였다는 사유로 의료법 제66조 제1항 제7호에 따른 자격정지 처분이 이루어졌음에도 여전히 乙을 공동개설자로 한 상태에서 나머지 공동개설자인 甲 등이 의료행위를 하고 요양급여비용 및 의료급여비용 심사를 청구하였으나 건강보험심사평가원이 乙의 자격정지 기간 동안 위 의료기관은 요양급여비용, 의료급여비용을 청구할 자격이 없다는 이유로 심사청구를 반송처리한 사안에서, 乙의 자격정지 기간 동안 위 의료기관은 의료법 제66조 제3항에 따라 의료업을 할 수 없기 때문에 국민건강보험법 및 의료급여법상 요양급여비용 및 의료급여비용을 청구할 수 있는 요양기관 및 의료급여기관에 해당하지 않는다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=601503"},{"id":"P:601523","kind":"P","label":"2020도16796","title":"성폭력범죄의처벌등에관한특례법위반(성적목적다중이용장소침입)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영)","court":"대법원","date":"2024.05.30","caseType":"형사","basis":"판례내용","text":"[1] 수사기관이 작성한 압수조서에 기재된 피의자였던 피고인의 자백 진술 부분에 대해 피고인 또는 변호인이 그 내용을 부인하는 경우, 구 형사소송법 제312조 제3항에 의한 증거능력 유무 / 위 규정에서 정한 ‘그 내용을 인정할 때’의 의미 / 피고인이 공소사실을 부인하는 경우, 수사기관이 작성한 피의자신문조서 중 공소사실을 인정하는 취지의 진술 부분은 그 내용을 인정하지 않았다고 보아야 하는지 여부 [2] 수사기관에 제출된 변호인의견서에 피의자가 당해사건 수사기관에 한 진술이 인용되어 있는 경우, 그 진술이 수사기관의 수사과정에서 작성된 ‘피의자의 진술이 기재된 신문조서나 진술서 등’으로부터 독립하여 증거능력을 가지는지 여부 / 피고인이 피의자였을 때 수사기관에 한 진술이 기재된 조서나 수사과정에서 작성된 진술서 등의 증거능력을 인정할 수 없는 경우, 수사기관에 제출된 변호인의견서에 기재된 같은 취지의 피의자 진술 부분을 유죄의 증거로 사용할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=601523"},{"id":"P:241685","kind":"P","label":"2023고합514","title":"특정범죄가중처벌등에관한법률위반(운전자폭행등)","court":"서울북부지방법원","date":"2024.05.28","caseType":"형사","basis":"판례내용","text":"버스 운전기사인 피고인이 버스 정류장 앞 도로에서 같은 운수회사에서 함께 근무하던 직장동료인 피해자가 피고인을 보고도 인사를 하지 않았다는 이유로 일시 정차 중인 피해자가 운전하는 버스에 갑자기 탑승한 뒤 운전석으로 다가가 손으로 피해자의 멱살을 수회 잡아 흔들고 피해자의 얼굴을 수회 때림으로써 운행 중인 자동차의 운전자를 폭행하여 상해에 이르게 하였다는 내용으로 기소된 사안에서, 위 버스가 정차한 장소는 공중의 교통안전과 질서를 저해할 우려가 있는 곳이었고, 피해자에게 위 버스를 계속 운행할 의사가 있었다고 보는 것이 타당하므로, 피고인이 운행 중인 자동차의 운전자인 피해자를 폭행하여 상해에 이르게 한 것으로 판단된다는 이유로, 피고인에게 유죄를 인정한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=241685"},{"id":"P:618273","kind":"P","label":"2022노2081","title":"업무상배임·사전자기록등위작·위작사전자기록등행사","court":"서울남부지방법원","date":"2024.05.28","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=618273"},{"id":"P:614681","kind":"P","label":"2023고합514","title":"특정범죄가중처벌등에관한법률위반(운전자폭행등)","court":"서울북부지방법원","date":"2024.05.28","caseType":"형사","basis":"판례내용","text":"버스 운전기사인 피고인이 버스 정류장 앞 도로에서 같은 운수회사에서 함께 근무하던 직장동료인 피해자가 피고인을 보고도 인사를 하지 않았다는 이유로 일시 정차 중인 피해자가 운전하는 버스에 갑자기 탑승한 뒤 운전석으로 다가가 손으로 피해자의 멱살을 수회 잡아 흔들고 피해자의 얼굴을 수회 때림으로써 운행 중인 자동차의 운전자를 폭행하여 상해에 이르게 하였다는 내용으로 기소된 사안에서, 위 버스가 정차한 장소는 공중의 교통안전과 질서를 저해할 우려가 있는 곳이었고, 피해자에게 위 버스를 계속 운행할 의사가 있었다고 보는 것이 타당하므로, 피고인이 운행 중인 자동차의 운전자인 피해자를 폭행하여 상해에 이르게 한 것으로 판단된다는 이유로, 피고인에게 유죄를 인정한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=614681"},{"id":"P:614625","kind":"P","label":"2024고합56","title":"아동학대범죄의처벌등에관한특례법위반(아동학대살해)(예비적죄명:살인)·사체유기","court":"부산지방법원","date":"2024.05.24","caseType":"형사","basis":"참조조문","text":"피고인이 투숙한 모텔 방에서 영아인 甲을 출산한 다음 甲의 생모로서 119에 신고하거나 신생아에 대한 보호조치를 취하지 않고 방치한 채 스스로 아무런 보호능력이 없는 甲을 검은색 비닐봉지에 넣어 유기하는 방법으로 甲을 사망하게 한 후 甲의 사체가 담긴 비닐봉지를 방 안에 남겨둔 채 도망함으로써 그 사체를 유기하였다는 아동학대범죄의 처벌 등에 관한 특례법 위반 및 사체유기의 공소사실과 관련하여, 분만 직후부터 살인의 고의로 아동학대 범행을 저지른 경우에 같은 법 제4조 제1항의 아동학대살해죄가 성립하는지 문제 된 사안에서, 피고인은 아동에 대한 보호자로서 아동학대범죄를 범하고 아동을 살해함으로써 아동학대살해죄를 범한 것이라는 이유로, 공소사실을 유죄로 인정한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=614625"},{"id":"P:241687","kind":"P","label":"2024고합56","title":"아동학대범죄의처벌등에관한특례법위반(아동학대살해)(예비적죄명:살인)·사체유기","court":"부산지방법원","date":"2024.05.24","caseType":"형사","basis":"참조조문","text":"피고인이 투숙한 모텔 방에서 영아인 甲을 출산한 다음 甲의 생모로서 119에 신고하거나 신생아에 대한 보호조치를 취하지 않고 방치한 채 스스로 아무런 보호능력이 없는 甲을 검은색 비닐봉지에 넣어 유기하는 방법으로 甲을 사망하게 한 후 甲의 사체가 담긴 비닐봉지를 방 안에 남겨둔 채 도망함으로써 그 사체를 유기하였다는 아동학대범죄의 처벌 등에 관한 특례법 위반 및 사체유기의 공소사실과 관련하여, 분만 직후부터 살인의 고의로 아동학대 범행을 저지른 경우에 같은 법 제4조 제1항의 아동학대살해죄가 성립하는지 문제 된 사안에서, 피고인은 아동에 대한 보호자로서 아동학대범죄를 범하고 아동을 살해함으로써 아동학대살해죄를 범한 것이라는 이유로, 공소사실을 유죄로 인정한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=241687"},{"id":"P:240809","kind":"P","label":"2021도6357","title":"상해","court":"대법원","date":"2024.05.23","caseType":"형사","basis":"참조조문","text":"형사소송법 제33조 제1항 제1호에서 필요적 국선변호인 선정사유 중 하나로 정한 ‘피고인이 구속된 때’가 피고인이 해당 형사사건에서 구속되어 재판을 받고 있는 경우에 한정되는지 여부 및 피고인이 별건으로 구속영장이 발부되어 집행되거나 다른 형사사건에서 유죄판결이 확정되어 그 판결의 집행으로 구금 상태에 있는 경우도 포괄하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=240809"},{"id":"P:240807","kind":"P","label":"2020므15896","title":"혼인의무효","court":"대법원","date":"2024.05.23","caseType":"가사","basis":"참조조문","text":"혼인관계가 이혼으로 해소된 이후에도 과거 일정기간 존재하였던 혼인관계의 무효 확인을 구할 확인의 이익이 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=240807"},{"id":"P:606353","kind":"P","label":"2024고합24","title":"준강제추행·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등)·감금·강간·스토킹범죄의처벌등에관한법률위반·협박","court":"수원지방법원성남지원","date":"2024.05.23","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606353"},{"id":"P:619355","kind":"P","label":"2024고합93","title":"아동·청소년의성보호에관한법률위반(성착취물제작·배포등)·성폭력범죄의처벌등에관한특례법위반(허위영상물편집·반포등)·아동·청소년의성보호에관한법률위반(성착취물소지)·성폭력범죄의처벌등에관한특례법위반(통신매체이용음란)","court":"서울서부지방법원","date":"2024.05.23","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619355"},{"id":"P:606557","kind":"P","label":"2023고단3720","title":"마약류관리에관한법률위반(향정)","court":"서울남부지방법원","date":"2024.05.22","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606557"},{"id":"P:613335","kind":"P","label":"2023고단993","title":"재물손괴·폭행·상해·스토킹범죄의처벌등관한법률위반·성폭력범죄의처벌등에관한특례법위반(통신매체이용음란)·도로교통법위반(음주운전)·배상명령신청","court":"서울서부지방법원","date":"2024.05.16","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=613335"},{"id":"P:614655","kind":"P","label":"2023고단2672","title":"아동학대범죄의처벌등에관한특례법위반(아동복지시설종사자등의아동학대가중처벌)","court":"울산지방법원","date":"2024.05.10","caseType":"형사","basis":"참조조문","text":"유치원 보육교사인 피고인들이 단독 또는 공동으로 원생인 만 3~4세의 아동들에 대하여, ① 배변 실수를 하였다는 이유로 팬티를 갖다 대며 화를 내 울게 하거나, 울면서 거부함에도 손가락으로 양쪽 볼을 움켜잡거나 하면서 아동들의 우는 모습을 휴대전화로 촬영하고, ② 테이블을 닦다가 아동이 앞에 서 있음에도 아동의 것으로 보이는 식판과 수저통을 바닥으로 던지며, ③ 아동의 얼굴을 양쪽 손가락이나 손바닥으로 눌러 일그러지게 한 후 웃으면서 동영상으로 촬영하고, ④ 아동이 테이블 밑으로 다리를 넣으며 움직이자 문 앞으로 불러내 의자에 앉힌 후 약 40분간 타임아웃을 실행하며, ⑤ 구연동화 수업 중 아동이 친구와 이야기하자 양팔을 잡아 끌어내 선생님 옆 의자에 앉힌 후 약 23분간 타임아웃을 실행하고, ⑥ 아동의 미간 부위를 손가락으로 1회 밀며, ⑦ 아동이 실내화를 벗어 자기 쪽으로 던지자 역시 실내화를 벗어 아동에게 던지거나 야단치고, 아동이 보던 책을 빼앗아 바닥에 3회 내리치며, ⑧ 아동이 약을 먹은 후 구토하자 토사물을 닦은 물티슈를 5초 정도 들이대 보여주고, 옷과 발바닥을 닦은 물티슈로 아동의 얼굴을 닦으며 팔과 얼굴을 각 1회 치고, 이후 13분 정도 혼자 있게 하는 등의 방법으로 정서적 학대행위를 하였다고 하여 아동학대범죄의 처벌 등에 관한 특례법 위반으로 기소된 사안에서, 공소사실 중 ①, ②, ③, ④ 부분에 대해 유죄를 ","url":"https://www.law.go.kr/precInfoP.do?precSeq=614655"},{"id":"P:607235","kind":"P","label":"2023고단1017","title":"사기·특정범죄가중처벌등에관한법률위반(위험운전치사상)·도로교통법위반·범죄수익은닉의규제및처벌등에관한법률위반·금융실명거래및비밀보장에관한법률위반·각배상명령신청","court":"창원지방법원마산지원","date":"2024.05.10","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=6 23","kind":"P","label":"2023고단2401","title":"사기·마약류관리에관한법률위반(향정)·주민등록법위반","court":"서울북부지방법원","date":"2024.05.08","caseType":"형사","basis":"참조조문","text":"피고인이 인터넷에 필로폰, 졸피뎀 등 마약류 판매 광고글을 게시하여 마약류를 매매하는 행위에 관한 정보를 타인에게 널리 알리거나 제시하고, 위 광고글을 보고 연락한 피해자들을 기망하여 마약류 대금 명목의 돈을 피고인 명의 甲 은행 계좌로 송금받아 편취하였으며, 인터넷 게임 이용자들에게 도박에 필요한 정보를 제공한 후 사례금을 피고인 명의 甲 은행 계좌로 무통장 송금받으면서 다른 사람의 주민등록번호를 부정하게 사용하였다는 마약류 관리에 관한 법률 위반, 사기, 주민등록법 위반의 공소사실과 관련하여, 수사기관이 제1, 2, 3 압수·수색·검증영장을 각 집행하여 제출한 증거들의 증거능력이 문제 된 사안에서, 공소사실 중 마약류 관리에 관한 법률 위반 및 주민등록법 위반 부분에 대해 유죄를, 사기 부분에 대해서는 무죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=241423"},{"id":"P:614583","kind":"P","label":"2023고단2401","title":"사기·마약류관리에관한법률위반(향정)·주민등록법위반","court":"서울북부지방법원","date":"2024.05.08","caseType":"형사","basis":"참조조문","text":"피고인이 인터넷에 필로폰, 졸피뎀 등 마약류 판매 광고글을 게시하여 마약류를 매매하는 행위에 관한 정보를 타인에게 널리 알리거나 제시하고, 위 광고글을 보고 연락한 피해자들을 기망하여 마약류 대금 명목의 돈을 피고인 명의 甲 은행 계좌로 송금받아 편취하였으며, 인터넷 게임 이용자들에게 도박에 필요한 정보를 제공한 후 사례금을 피고인 명의 甲 은행 계좌로 무통장 송금받으면서 다른 사람의 주민등록번호를 부정하게 사용하였다는 마약류 관리에 관한 법률 위반, 사기, 주민등록법 위반의 공소사실과 관련하여, 수사기관이 제1, 2, 3 압수·수색·검증영장을 각 집행하여 제출한 증거들의 증거능력이 문제 된 사안에서, 공소사실 중 마약류 관리에 관한 법률 위반 및 주민등록법 위반 부분에 대해 유죄를, 사기 부분에 대해서는 무죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=614583"},{"id":"P:600445","kind":"P","label":"2023노422","title":"지방교육자치에관한법률위반","court":"부산고등법원","date":"2024.05.08","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=600445"},{"id":"P:615735","kind":"P","label":"2023노2796","title":"개인정보보호법위반","court":"인천지방법원","date":"2024.05.08","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=615735"},{"id":"P:616605","kind":"P","label":"2023노4202","title":"사기·횡령·권리행사방해","court":"대전지방법원","date":"2024.05.03","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=616605"},{"id":"P:241719","kind":"P","label":"2023노976","title":"스토킹범죄의처벌등에관한법률위반","court":"창원지방법원","date":"2024.04.30","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=241719"},{"id":"P:241721","kind":"P","label":"2024노180","title":"전기통신금융사기피해방지및피해금환급에관한특별법위반·컴퓨터등사용사기","court":"부산지방법원","date":"2024.04.26","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=241721"},{"id":"P:622851","kind":"P","label":"2023노5007","title":"가. 농수산물의원산지표시등에관한법률위반","court":"인천지방법원","date":"2024.04.26","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=622851"},{"id":"P:240741","kind":"P","label":"2023도18971","title":"특정경제범죄가중처벌등에관한법률위반(사기)","court":"대법원","date":"2024.04.25","caseType":"형사","basis":"참조조문","text":"금원 편취를 내용으로 하는 사기죄에서 대가가 일부 지급된 경우, 그 편취액 및 이는 사기로 인한 특정경제범죄 가중처벌 등에 관한 법률 위반죄에서도 마찬가지인지 여부 / 편취한 재물이나 재산상 이익의 가액을 기준으로 가중 처벌하는 같은 법 제3조의 적용을 전제로 편취한 재물이나 재산상 이익의 가액을 산정할 때 유의하여야 할 사항 / 이때 편취한 재산상 이익의 가액을 구체적으로 산정할 수 없는 경우, 같은 법 제3조를 적용할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=240741"},{"id":"P:242053","kind":"P","label":"2023노2864","title":"전기통신금융사기피해방지및피해금환급에관한특별법위반·사기·자본시장과금융투자업에관한법률위반·배상명령신청·배상명령신청","court":"의정부지방법원","date":"2024.04.18","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=242053"},{"id":"P:240639","kind":"P","label":"2023도13333","title":"상관명예훼손[군형법상 상관명예훼손죄에 대한 위법성조각사유가 문제된 사건]","court":"대법원","date":"2024.04.16","caseType":"형사","basis":"참조조문","text":"군형법 제64조 제3항의 행위에 대해 형법 제307조 제1항의 행위에 대한 위법성조각사유를 규정한 형법 제310조가 유추적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=240639"},{"id":"P:240851","kind":"P","label":"2024노91","title":"특정범죄가중처벌등에관한법률위반(허위세금계산서교부등)","court":"서울고등법원","date":"2024.04.05","caseType":"형사","basis":"참조조문","text":"피고인은 2012. 6. 1. 도로교통법 위반죄 등으로 징역 8개월을 선고받아 2012. 12. 15. 형의 집행을 종료하였는데, 그로부터 5년이 경과할 때까지 벌금형 외에 달리 형사처벌을 받은 전력이 없으나, 위 징역형의 집행을 마친 지 3년 내에 저지른 특정범죄 가중처벌 등에 관한 법률 위반 범행이 제1심 및 당심에서 유죄로 인정됨에 따라 형법 제35조의 누범가중 적용 여부가 문제 된 사안에서, 피고인이 2012. 6. 1. 선고받은 징역 8개월의 형 집행을 종료한 2012. 12. 15. 이후 자격정지 이상의 형을 받지 않고 5년을 경과하여 형의 실효 등에 관한 법률 제7조 제1항 제2호에 의하여 그 형이 실효되었으므로, 그 실효된 전과를 근거로 누범가중을 할 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=240851"},{"id":"P:606097","kind":"P","label":"2022고합398-1","title":"마약류관리에관한법률위반(향정)·마약류관리에관한법률위반(대마)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등)","court":"의정부지방법원","date":"2024.04.05","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606097"},{"id":"P:614705","kind":"P","label":"2024노91","title":"특정범죄가중처벌등에관한법률위반(허위세금계산서교부등)","court":"서울고등법원","date":"2024.04.05","caseType":"형사","basis":"참조조문","text":"피고인은 2012. 6. 1. 도로교통법 위반죄 등으로 징역 8개월을 선고받아 2012. 12. 15. 형의 집행을 종료하였는데, 그로부터 5년이 경과할 때까지 벌금형 외에 달리 형사처벌을 받은 전력이 없으나, 위 징역형의 집행을 마친 지 3년 내에 저지른 특정범죄 가중처벌 등에 관한 법률 위반 범행이 제1심 및 당심에서 유죄로 인정됨에 따라 형법 제35조의 누범가중 적용 여부가 문제 된 사안에서, 피고인이 2012. 6. 1. 선고받은 징역 8개월의 형 집행을 종료한 2012. 12. 15. 이후 자격정지 이상의 형을 받지 않고 5년을 경과하여 형의 실효 등에 관한 법률 제7조 제1항 제2호에 의하여 그 형이 실효되었으므로, 그 실효된 전과를 근거로 누범가중을 할 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=614705"},{"id":"P:623845","kind":"P","label":"2022노2555","title":"가. 산업안전보건법위반","court":"대전지방법원","date":"2024.04.04","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=623845"},{"id":"P:240319","kind":"P","label":"2021도15080","title":"허위진단서작성·업무상과실치사","court":"대법원","date":"2024.04.04","caseType":"형사","basis":"참조조문","text":"허위진단서작성죄의 성립요건 / 미필적 고의의 요건 및 행위자가 범죄사실이 발생할 가능성을 용인하고 있었는지 판단하는 방법 / 의사 등이 사망진단서를 작성할 당시 기재한 사망 원인이나 사망의 종류가 허위인지 또는 의사 등이 그러한 점을 인식하고 있었는지 판단하는 방법","url":"https://www.law.go.kr/precInfoP.do?precSeq=240319"},{"id":"P:614357","kind":"P","label":"2022노3509","title":"공무상표시무효","court":"대전지방법원","date":"2024.04.03","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=614357"},{"id":"P:616619","kind":"P","label":"2023고단1131","title":"사기·국민기초생활보장법위반","court":"전주지방법원군산지원","date":"2024.04.03","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=616619"},{"id":"P:240681","kind":"P","label":"2023노3763","title":"성폭력범죄의처벌등에관한특례법위반(촬영물등이용협박)·스토킹범죄의처벌등에관한법률위반·주거침입·상관모욕","court":"서울고등법원","date":"2024.03.29","caseType":"형사","basis":"판례내용","text":"피고인이 미리 피해자 몰래 촬영한 피해자의 나체 사진을 가지고 있는 것을 기화로 피해자에게 ‘퍼트려 달라는 거제?, 사진이랑 다잇는데.’라는 메시지를 보내어 성적 욕망 또는 수치심을 유발할 수 있는 촬영물을 이용하여 협박하였다는 공소사실로 기소된 사안에서, 피고인이 피해자에게 성적 욕망 또는 수치심을 유발할 수 있는 촬영물의 유포 가능성을 내용으로 하여 공포심을 일으킬 수 있을 정도의 해악을 고지하였다고 봄이 타당하므로, 피고인에게 성폭력범죄의 처벌 등에 관한 특례법 위반죄가 성립한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=240681"},{"id":"P:614593","kind":"P","label":"2023노3763","title":"성폭력범죄의처벌등에관한특례법위반(촬영물등이용협박)·스토킹범죄의처벌등에관한법률위반·주거침입·상관모욕","court":"서울고등법원","date":"2024.03.29","caseType":"형사","basis":"판례내용","text":"피고인이 미리 피해자 몰래 촬영한 피해자의 나체 사진을 가지고 있는 것을 기화로 피해자에게 ‘퍼트려 달라는 거제?, 사진이랑 다잇는데.’라는 메시지를 보내어 성적 욕망 또는 수치심을 유발할 수 있는 촬영물을 이용하여 협박하였다는 공소사실로 기소된 사안에서, 피고인이 피해자에게 성적 욕망 또는 수치심을 유발할 수 있는 촬영물의 유포 가능성을 내용으로 하여 공포심을 일으킬 수 있을 정도의 해악을 고지하였다고 봄이 타당하므로, 피고인에게 성폭력범죄의 처벌 등에 관한 특례법 위반죄가 성립한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=614593"},{"id":"P:613027","kind":"P","label":"2023고정1844","title":"개인정보보호법위반","court":"서울중앙지방법원","date":"2024.03.27","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=613027"},{"id":"P:601955","kind":"P","label":"2023노7348","title":"마약류관리에관한법률위반(향정)·범인도피","court":"수원지방법원","date":"2024.03.22","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=601955"},{"id":"P:622937","kind":"P","label":"2023고단1582","title":"가. 범인도피방조","court":"전주지방법원","date":"2024.03.21","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=622937"},{"id":"P:599837","kind":"P","label":"2023고합61","title":"성폭력범죄의처벌등에관한특례법위반(강간등치상)","court":"대전지방법원논산지원","date":"2024.03.13","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=599837"},{"id":"P:239935","kind":"P","label":"2023도17394","title":"특정범죄가중처벌등에관한법률위반(뇌물)·사기·뇌물공여","court":"대법원","date":"2024.03.12","caseType":"형사","basis":"참조조문","text":"공무원이 수수한 금품에 직무행위에 대한 대가로서의 성질과 직무 외의 행위에 대한 대가로서의 성질이 불가분적으로 결합되어 있는 경우, 수수한 금품 전부가 직무행위에 대한 대가로서의 성질을 가지는지 여부 / 금품의 수수가 수회에 걸쳐 이루어지고 각 수수 행위별로 직무 관련성 유무를 달리 볼 여지가 있는 경우 및 공무원이 아닌 사람과 공무원이 공모하여 금품을 수수하고 각 수수자가 수수한 금품별로 직무 관련성 유무를 달리 볼 수 있는 경우, 직무 관련성을 판단하는 방법","url":"https://www.law.go.kr/precInfoP.do?precSeq=239935"},{"id":"P:600577","kind":"P","label":"2023도17200","title":"특정경제범죄가중처벌등에관한법률위반(사기)·사기·유사수신행위의규제에관한법률위반","court":"대법원","date":"2024.03.12","caseType":"형사","basis":"참조조문","text":"[1] 재물에 대한 사용·수익권이 형법 제347조 사기죄에서 보호하는 재산상의 이익에 포함되는지 여부 [2] 피고인이 피해자에게 자신의 오피스텔을 임대하였다가 임대차계약이 해지된 후 임대차보증금을 제대로 반환할 의사나 능력이 없음에도, 이체 한도 제한으로 임대차보증금 일부만 반환하고 나머지는 추후 반환하겠다고 피해자를 기망하여 이에 속은 피해자로 하여금 공인중개사에게 오피스텔 비밀번호를 알려주게 하여 새로운 임차인이 오피스텔로 이사가게 함으로써 피해자로부터 오피스텔에 관한 점유권을 편취하였다는 공소사실로 기소된 사안에서, 피해자가 피고인으로부터 임차한 오피스텔을 점유하며 이를 사용·수익하다가 피고인의 말에 속아 나머지 임대차보증금을 반환받지 않고 오피스텔의 점유권을 피고인에게 이전했더라도 사기죄에서 재산상의 이익을 처분하였다고 볼 수 없어 사기죄는 성립하지 않는다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=600577"},{"id":"P:239705","kind":"P","label":"2023도16690","title":"사기·자동차관리법위반","court":"대법원","date":"2024.02.29","caseType":"형사","basis":"판례내용","text":"자동차관리법 제34조 제1항에서 정한 절차적 요건이 충족되지 않은 상태에서 자동차 튜닝을 한 사람은 누구라도 같은 법 제81조 제19호에 따라 처벌되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=239705"},{"id":"P:240691","kind":"P","label":"2023고합92","title":"수도불통","court":"수원지방법원","date":"2024.02.14","caseType":"형사","basis":"참조조문","text":"빌라건물에 거주하는 피고인이 빌라 공용배관의 누수로 자신의 주거지에 침수피해가 발생하자, 빌라 입주민들에게 누수로 인한 피해를 주장하였으나 입주민들과 공용배관 공사 방법에 대해 협의에 이르지 못하고 있던 중, 임의로 빌라 외부에 있는 공용계량기함의 밸브를 잠근 후 자물쇠와 쇠사슬을 이용하여 열지 못하게 하거나 배관 공사 업체를 불러 공용배관의 누수 부분을 임의로 절단함으로써 공중의 음용수를 공급하는 수도 시설을 손괴 기타 방법으로 불통하게 하였다는 공소사실로 기소된 사안에서, 공소사실 중 수도불통행위 부분을 유죄로, 수도손괴행위 부분을 무죄로 판단한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=240691"},{"id":"P:606125","kind":"P","label":"2023고합285","title":"특정경제범죄가중처벌등에관한법률위반(수재등)·특정경제범죄가중처벌등에관한법률위반(증재등)·특정경제범죄가중처벌등에관한법률위반(수재등)방조","court":"서울동부지방법원","date":"2024.02.14","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606125"},{"id":"P:614621","kind":"P","label":"2023고합92","title":"수도불통","court":"수원지방법원","date":"2024.02.14","caseType":"형사","basis":"참조조문","text":"빌라건물에 거주하는 피고인이 빌라 공용배관의 누수로 자신의 주거지에 침수피해가 발생하자, 빌라 입주민들에게 누수로 인한 피해를 주장하였으나 입주민들과 공용배관 공사 방법에 대해 협의에 이르지 못하고 있던 중, 임의로 빌라 외부에 있는 공용계량기함의 밸브를 잠근 후 자물쇠와 쇠사슬을 이용하여 열지 못하게 하거나 배관 공사 업체를 불러 공용배관의 누수 부분을 임의로 절단함으로써 공중의 음용수를 공급하는 수도 시설을 손괴 기타 방법으로 불통하게 하였다는 공소사실로 기소된 사안에서, 공소사실 중 수도불통행위 부분을 유죄로, 수도손괴행위 부분을 무죄로 판단한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=614621"},{"id":"P:241141","kind":"P","label":"2021노904","title":"근로기준법위반","court":"서울서부지방법원","date":"2024.02.08","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=241141"},{"id":"P:239467","kind":"P","label":"2023도16595","title":"건조물침입","court":"대법원","date":"2024.02.08","caseType":"형사","basis":"참조조문","text":"[1] 주거침입죄의 구성요건적 행위인 ‘침입’의 의미 및 침입에 해당하는지 판단하는 기준 / 외부인의 출입이 엄격히 통제되는 건조물에 거주자나 관리자의 승낙 없이 몰래 들어간 경우 또는 출입 당시 거주자나 관리자가 출입의 금지나 제한을 하였음에도 이를 무시하고 출입한 경우, 침입행위에 해당할 수 있는지 여부 [2] 피고인이 ‘甲에게 100m 이내로 접근하지 말 것’ 등을 명하는 법원의 접근금지가처분 결정이 있는 등 피고인이 甲을 방문하는 것을 甲이 싫어하는 것을 알고 있음에도 임의로 甲이 근무하는 사무실 안으로 들어감으로써 건조물에 침입하였다는 공소사실로 기소된 사안에서, 피고인이 위 결정에 반하여 甲이 근무하는 사무실에 출입한 것은 甲의 명시적인 의사에 반하는 행위일 뿐만 아니라, 출입의 금지나 제한을 무시하고 출입한 경우로서 출입 당시 객관적·외형적으로 드러난 행위태양을 기준으로 보더라도 사실상 평온상태가 침해된 것으로 볼 수 있으므로 건조물침입죄가 성립한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=239467"},{"id":"P:241287","kind":"P","label":"2023노786","title":"마약류관리에관한법률위반(향정)","court":"대구지방법원","date":"2024.02.07","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=241287"},{"id":"P:241257","kind":"P","label":"2023노2758","title":"아동학대범죄의처벌등에관한특례법위반(아동학대살해)[인정된죄명아동학대범죄의처벌등에관한특례법위반(아동학대치사)]·아동복지법위반(상습아동학대)·아동복지법위반(상습아동유기·방임)","court":"서울고등법원","date":"2024.02.02","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=241257"},{"id":"P:613331","kind":"P","label":"2022노227","title":"보건범죄단속에관한특별조치법위반(부정의료업자)·사기·국민건강보험법위반","court":"광주지방법원","date":"2024.02.01","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=613331"},{"id":"P:606361","kind":"P","label":"2023고합197","title":"특정경제범죄가중처벌등에관한법률위반(횡령)·특정경제범죄가중처벌등에관한법률위반(배임)(인정된죄명업무상배임)·주식회사의외부감사에관한법률위반·특정경제범죄가중처벌등에관한법률위반(횡령)방조·대부업의등록및금융이용자보호에관한법률위반","court":"서울중앙지방법원","date":"2024.01.26","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606361"},{"id":"P:239815","kind":"P","label":"2023고합389","title":"명예훼손","court":"대구지방법원","date":"2024.01.26","caseType":"형사","basis":"참조조문","text":"피고인은 자동차 판매대리점을 운영하는 甲과 판매용역계약을 체결하고 자동차 판매원으로 근무하여 오다가 甲의 재계약 거절로 해고된 후 구제신청을 하여 노동위원회가 ‘甲이 피고인과의 판매용역계약을 해지한 것은 부당노동행위에 해당하며 甲은 즉시 피고인을 복직시켜라.’는 취지의 결정을 하였음에도 甲이 복직명령을 이행하지 않자, 甲이 점주로 있는 대리점의 앞길에서 \"대리점주들은 노동착취로 임금을 착취 갈취하고 부당노동행위 노조탄압을 자행합니다.\"라는 내용의 표현이 기재된 피켓을 들고 1인 시위를 함으로써 甲의 명예를 훼손하였다는 내용으로 기소된 사안에서, 피고인이 피켓에 기재한 표현은 甲의 명예를 훼손할 수 있는 표현에 해당하나, 그 주된 동기와 목적 및 필요성 등을 종합하면 피고인의 행위는 형법 제310조에 의해 위법성이 조각된다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=239815"},{"id":"P:606039","kind":"P","label":"2019고단8179","title":"사기·각배상명령신청","court":"수원지방법원","date":"2024.01.26","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606039"},{"id":"P:241185","kind":"P","label":"2023도14307","title":"특정범죄가중처벌등에관한법률위반(절도)","court":"대법원","date":"2024.01.25","caseType":"형사","basis":"참조조문","text":"특정범죄 가중처벌 등에 관한 법률 제5조의4 제5항의 규정 취지 / 같은 항 제1호 중 ‘다시 이들 죄를 범하여 누범으로 처벌하는 경우’ 부분에서 ‘이들 죄’의 의미 및 이때 누범관계에 있는 앞의 범행이 ‘이들 죄’와 동종의 범죄일 것을 요하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=241185"},{"id":"P:241187","kind":"P","label":"2023도12793","title":"폐기물관리법위반","court":"대법원","date":"2024.01.25","caseType":"형사","basis":"판례내용","text":"[1] 구 폐기물관리법 제48조 제1호에 따라 행정청으로부터 폐기물 처리에 대한 조치명령을 받은 자가 이를 위반한 경우에 같은 법 제65조 제10호에 정한 처벌을 하기 위해서는 조치명령이 적법하여야 하는지 여부 / 위 조치명령이 당연무효는 아니지만 위법하다고 인정되는 경우, 같은 법 제65조 제10호 위반죄가 성립하는지 여부 및 조치명령이 절차적 하자로 인하여 위법한 경우에도 마찬가지인지 여부 [2] 행정청이 침해적 행정처분을 하면서 당사자에게 행정절차법 제21조, 제22조에서 정한 사전통지를 하거나 의견제출의 기회를 주지 아니한 경우, 그 처분이 위법한지 여부 / 행정절차법 제21조 제4항에서 사전통지나 의견청취를 하지 않을 수 있는 예외사유 중 하나로 규정한 ‘의견청취가 현저히 곤란하거나 명백히 불필요하다고 인정될 만한 상당한 이유가 있는 경우’에 해당하는지 판단하는 기준 및 이때 처분상대방이 이미 행정청에 위반사실을 시인하였다거나 처분의 사전통지 이전에 의견을 진술할 기회가 있었다는 사정을 고려하여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=241187"},{"id":"P:603651","kind":"P","label":"2023누52460","title":"불문경고처분취소","court":"서울고등법원","date":"2024.01.24","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=603651"},{"id":"P:612053","kind":"P","label":"2022노3155","title":"특정경제범죄가중처벌등에관한법률위반(사기)(일부변경된죄명사기)·업무방해","court":"서울고등법원","date":"2024.01.19","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=612053"},{"id":"P:605587","kind":"P","label":"2023노209","title":"특정경제범죄가중처벌등에관한법률위반(사기)·사기","court":"서울고등법원","date":"2024.01.18","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=605587"},{"id":"P:614535","kind":"P","label":"2023고단2750","title":"동물보호법위반","court":"서울남부지방법원","date":"2024.01.17","caseType":"형사","basis":"참조조문","text":"피해 말인 甲의 소유자이자 드라마 승마팀장인 피고인 乙이 낙마 장면을 촬영하기 위하여 ‘말의 앞다리에 로프를 묶어 로프 끝을 사람들이 잡고 지탱하고 있는 상태에서 말을 달리게 하여 앞으로 고꾸라지게 하는 촬영 방법’을 제의하였고, 드라마 무술감독인 피고인 丙과 드라마 연출을 총괄한 프로듀서인 피고인 丁이 이를 승낙하여 위 촬영 방법으로 낙마 장면의 촬영을 진행하기로 순차 공모한 후, 위와 같은 방법으로 甲이 넘어지면서 그 하중으로 목이 꺾이게 함으로써, 乙, 丙, 丁은 공모하여 동물의 사육·훈련 등을 위하여 필요한 방식이 아님에도 불구하고 도구를 사용하여 잔인한 방식으로 甲에게 신체적 고통을 주어 학대하였다는 내용으로, 피고인 戊 방송사는 소속 프로듀서인 丁이 방송사의 업무에 관하여 위와 같은 위반행위를 하였다는 내용으로 기소된 사안에서, 乙, 丙, 丁이 위와 같이 낙마 장면을 촬영한 것은 구 동물보호법 제8조 제2항 제4호가 금지하고 있는 행위에 해당하고, 미필적이나마 동물보호법 위반의 고의도 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=614535"},{"id":"P:241427","kind":"P","label":"2023고단2750","title":"동물보호법위반","court":"서울남부지방법원","date":"2024.01.17","caseType":"형사","basis":"참조조문","text":"피해 말인 甲의 소유자이자 드라마 승마팀장인 피고인 乙이 낙마 장면을 촬영하기 위하여 ‘말의 앞다리에 로프를 묶어 로프 끝을 사람들이 잡고 지탱하고 있는 상태에서 말을 달리게 하여 앞으로 고꾸라지게 하는 촬영 방법’을 제의하였고, 드라마 무술감독인 피고인 丙과 드라마 연출을 총괄한 프로듀서인 피고인 丁이 이를 승낙하여 위 촬영 방법으로 낙마 장면의 촬영을 진행하기로 순차 공모한 후, 위와 같은 방법으로 甲이 넘어지면서 그 하중으로 목이 꺾이게 함으로써, 乙, 丙, 丁은 공모하여 동물의 사육·훈련 등을 위하여 필요한 방식이 아님에도 불구하고 도구를 사용하여 잔인한 방식으로 甲에게 신체적 고통을 주어 학대하였다는 내용으로, 피고인 戊 방송사는 소속 프로듀서인 丁이 방송사의 업무에 관하여 위와 같은 위반행위를 하였다는 내용으로 기소된 사안에서, 乙, 丙, 丁이 위와 같이 낙마 장면을 촬영한 것은 구 동물보호법 제8조 제2항 제4호가 금지하고 있는 행위에 해당하고, 미필적이나마 동물보호법 위반의 고의도 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=241427"},{"id":"P:600353","kind":"P","label":"2021노134","title":"업무상과실치사·업무상과실치상","court":"서울고등법원","date":"2024.01.11","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=600353"},{"id":"P:241725","kind":"P","label":"2023고단2958","title":"전기통신금융사기피해방지및피해금환급에관한특별법위반·컴퓨터등사용사기·각배상명령신청","court":"부산지방법원","date":"2024.01.10","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=241725"},{"id":"P:239247","kind":"P","label":"2021도5723","title":"마약류관리에관한법률위반(향정)·마약류관리에관한법률위반(대마)","court":"대법원","date":"2024.01.04","caseType":"형사","basis":"참조조문","text":"구 형법 제48조 제1항 제1호에서 몰수 대상으로 정한 ‘범죄행위에 제공한 물건’의 의미 / 위 조항에 의한 몰수가 임의적이라도 비례의 원칙에 따른 제한을 받는지 여부 및 비례의 원칙 위반 여부를 판단할 때 고려하여야 할 사정 / 휴대전화의 동영상 촬영기능을 이용하여 피해자를 촬영한 행위 자체가 범죄에 해당하는 경우, 휴대전화는 ‘범죄행위에 제공된 물건’, 촬영되어 저장된 동영상은 휴대전화에 저장된 전자기록으로서 ‘범죄행위로 인하여 생긴 물건’에 각각 해당하는지 여부 및 이때 법원이 휴대전화를 몰수하지 않고 동영상만을 몰수하는 것도 가능한지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=239247"},{"id":"P:239231","kind":"P","label":"2023도1178","title":"사문서위조·위조사문서행사","court":"대법원","date":"2024.01.04","caseType":"형사","basis":"참조조문","text":"사문서위조 및 동행사죄의 객체인 사문서 중 ‘권리·의무에 관한 문서’와 ‘사실증명에 관한 문서’의 의미 / ‘거래상 중요한 사실을 증명하는 문서’에 해당하기 위한 요건 및 문서의 주된 취지가 단순히 개인적·집단적 의견의 표현에 불과한 것도 이에 포함되는지 여부 / ‘거래상 중요한 사실을 증명하는 문서’에 해당하는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=239231"},{"id":"P:239237","kind":"P","label":"2022도14571","title":"모욕","court":"대법원","date":"2024.01.04","caseType":"형사","basis":"참조조문","text":"[1] 개별적으로 소수의 사람에게 발언하였더라도 상대방이 불특정 또는 다수인에게 해당 내용을 전파할 가능성이 객관적으로 인정되는 경우, 모욕죄의 구성요건인 ‘공연성’을 인정할 수 있는지 여부 및 이때 전파가능성에 관하여는 검사의 엄격한 증명이 필수적인지 여부 / 구체적인 사안에서 공연성이 인정되는지 판단하는 기준 [2] 전파가능성을 이유로 모욕죄의 공연성이 인정될 수 있는 경우, 주관적 구성요건요소로서 요구되는 고의의 내용 및 고의 유무를 판단하는 방법 / 발언 후 실제로 전파되었는지는 전파가능성 유무를 판단할 때 소극적 사정으로 고려될 수 있는지 여부 / 발언 내용이 전체적으로 피해자의 입장에서 불쾌함을 느낄 정도의 부정적·비판적 의견이나 불편한 감정을 거칠게 나타낸 정도의 표현에 그치는 것으로서, 그와 같은 조악한 표현 자체를 피해자에게 그대로 옮겨 전파하리라는 사정을 쉽게 예상하기 어려운 경우, 전파가능성을 인정할 때 유의할 점","url":"https://www.law.go.kr/precInfoP.do?precSeq=239237"},{"id":"P:241709","kind":"P","label":"2022재노1","title":"존속살해·살인·살인미수·무고","court":"광주고등법원","date":"2024.01.04","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=241709"},{"id":"P:239199","kind":"P","label":"2023도11313","title":"공기호위조·위조공기호행사","court":"대법원","date":"2024.01.04","caseType":"형사","basis":"참조조문","text":"[1] 형법상 인장에 관한 죄에서 인장과 기호의 의미 및 형법 제238조의 공기호에 해당하기 위한 요건 [2] 피고인이 온라인 구매사이트에서 ① 검찰 업무표장 아래 ‘검찰 PROSECUTION SERVICE’라고 기재하고 그 아래 피고인의 전화번호를 기재한 주차표지판 1개, ② 검찰 업무표장 아래 ‘검찰 PROSECUTION OFFICE’라고 기재하고 그 아래 피고인의 차량번호를 표시한 표지판 1개, ③ 검찰 업무표장 아래 ‘검찰 PROSECUTION SERVICE’라고 기재하고 그 아래 ‘공무수행’이라고 표시한 표지판 1개를 주문하여 배송받음으로써 행사할 목적으로 공기호인 검찰청 업무표장을 각각 위조하였다는 등의 공소사실로 기소된 사안에서, 위 각 검찰 업무표장을 공기호라고 볼 수 없음에도, 이와 달리 보아 공소사실을 유죄로 인정한 원심판단에 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=239199"},{"id":"P:239251","kind":"P","label":"2023도2982","title":"장애인차별금지및권리구제등에관한법률위반·사문서위조·위조사문서행사","court":"대법원","date":"2024.01.04","caseType":"형사","basis":"판례내용","text":"장애인차별금지 및 권리구제 등에 관한 법률 제49조 제1항에서 정한 범죄구성요건에 관한 증명책임의 소재 및 그 증명의 내용과 정도 / 어떠한 장애를 가진 사람에 대하여 이루어진 괴롭힘 등 부당한 취급이 해당 장애를 주된 사유로 한 것이 아니라거나 장애가 없는 사람과 차별적으로 이루어진 것이 아닌 경우, 위 조항이 적용될 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=239251"},{"id":"P:238861","kind":"P","label":"2023도12316","title":"산업안전보건법위반·업무상과실치사·중대재해처벌등에관한법률위반(산업재해치사)","court":"대법원","date":"2023.12.28","caseType":"형사","basis":"참조조문","text":"[1] 상상적 경합에서 말하는 ‘1개의 행위’의 의미 [2] 피고인 甲 주식회사의 대표이사로서 경영책임자이자 안전보건총괄책임자인 피고인 乙이, 산업재해 예방에 필요한 주의의무를 게을리하고 안전조치를 하지 아니하여 피고인 甲 회사와 도급계약을 체결한 관계수급인인 丙 사업체 소속 근로자 丁이 피고인 甲 회사의 야외작업장에서 중량물 취급 작업인 철제 방열판 보수 작업을 하던 중 크레인 섬유벨트가 끊어지고 방열판이 낙하하면서 丁을 덮쳐 사망에 이르게 함과 동시에, 재해예방을 위한 안전보건관리체계의 구축 및 그 이행에 관한 조치를 하지 아니하여 사업장의 종사자 丁이 사망하는 중대산업재해에 이르게 하였다는 내용의 업무상과실치사, 산업안전보건법 위반, 중대재해 처벌 등에 관한 법률 위반의 공소사실이 제1심 및 원심에서 모두 유죄로 인정된 사안에서, 위 각 법의 목적, 보호법익, 행위태양 등에 비추어 보면, 중대재해 처벌 등에 관한 법률 위반죄와 근로자 사망으로 인한 산업안전보건법 위반죄 및 업무상과실치사죄는 상호 간 사회관념상 1개의 행위가 수 개의 죄에 해당하는 경우로서 상상적 경합 관계에 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=238861"},{"id":"P:238887","kind":"P","label":"2017도21248","title":"수뢰후부정처사·부정처사후수뢰·특정범죄가중처벌등에관한법률위반(알선수재)·뇌물공여","court":"대법원","date":"2023.12.28","caseType":"형사","basis":"판례내용","text":"[1] 특정범죄 가중처벌 등에 관한 법률 제3조의 알선수재죄에서 ‘알선’의 의미 / 공무원의 직무에 속하는 사항의 알선이 수수한 금품과 ‘대가관계’가 있는지 결정하는 방법 [2] 알선수재죄가 성립하는지 판단하는 방법 [3] 군수 분야의 고위직 간부로 재직한 경력이 있는 피고인이 방위사업체인 甲 주식회사와 경영자문위원 위촉계약을 체결한 후, 甲 회사의 현안과 관련된 군 관계자 상대 로비를 요청받고 그 대가로 자문료 및 활동비 명목으로 금원을 지급받아, 특정범죄 가중처벌 등에 관한 법률 위반으로 기소된 사안에서, 공소사실을 유죄로 인정한 원심판단에 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=238887"},{"id":"P:238881","kind":"P","label":"2023도10718","title":"공문서위조(예비적죄명:허위공문서작성)","court":"대법원","date":"2023.12.28","caseType":"형사","basis":"판례내용","text":"동일한 사실관계에 대하여 서로 양립할 수 없는 적용법조의 적용을 주위적·예비적으로 구하는 사안에서 예비적 공소사실만 유죄로 인정되고 그 부분에 대하여 피고인만 상고한 경우, 주위적 공소사실까지 함께 상고심의 심판대상에 포함되는지 여부 / 이때 상고심이 예비적 공소사실에 대한 원심판결이 잘못되었다는 이유로 원심판결을 전부 파기환송하는 경우, 환송 후 원심은 예비적 공소사실은 물론 주위적 공소사실에 대하여도 심리·판단하여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=238881"},{"id":"P:238867","kind":"P","label":"2020도12586","title":"도주미수","court":"대법원","date":"2023.12.28","caseType":"형사","basis":"참조조문","text":"법원이 선고기일에 피고인에 대하여 실형을 선고하면서 구속영장을 발부하는 경우, 검사가 법정에 재정하여 법원으로부터 구속영장을 전달받아 집행을 지휘하고, 그에 따라 피고인 대기실로 인치된 피고인이 도주죄의 주체인 ‘법률에 의하여 체포 또는 구금된 자’에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=238867"},{"id":"P:240865","kind":"P","label":"2023도12198","title":"성폭력범죄의처벌등에관한특례법위반(성적목적다중이용장소침입)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영)·재물손괴·건조물침입미수·아동·청소년의성보호에관한법률위반(성착취물소지등)·아동·청소년의성보호에관한법률위반(성착취물제작·배포등)","court":"대법원","date":"2023.12.28","caseType":"형사","basis":"판례내용","text":"구 아동·청소년의 성보호에 관한 법률과 아동·청소년의 성보호에 관한 법률의 입법 목적 / 아동·청소년 등이 일상적인 생활을 하면서 신체를 노출한 것을 몰래 촬영하는 방식 등으로 성적 대상화한 경우, 이와 같은 행위를 표현한 영상 등이 아동·청소년성착취물에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=240865"},{"id":"P:239263","kind":"P","label":"2023도13514","title":"사기[일부인정된죄명:특정경제범죄가중처벌등에관한법률위반(사기)]·도로교통법위반(무면허운전)","court":"대법원","date":"2023.12.21","caseType":"형사","basis":"참조조문","text":"[1] 다수의 피해자에 대하여 각각 기망행위를 하여 각 피해자로부터 재물을 편취한 경우, 범의가 단일하고 범행방법이 동일하더라도 피해자별로 독립한 사기죄가 성립하는지 여부 및 이때 피해자들의 피해법익이 동일하다고 볼 수 있는 사정이 있는 경우, 이들에 대한 사기죄를 포괄일죄로 볼 수 있는지 여부 [2] 피고인이 부부인 피해자 甲과 乙에게 ‘토지를 매수하여 분필한 후 이를 분양해서 원금 및 수익금을 지급하겠다.’면서 기망한 후, 이에 속아 피고인에게 투자하기 위해 공동재산인 건물을 매도하여 돈을 마련한 피해자들로부터 피해자 甲 명의 예금계좌에서 1억 원, 피해자 乙 명의 예금계좌에서 4억 7,500만 원, 합계 5억 7,500만 원을 송금받아 이를 편취하였다는 이유로 특정경제범죄 가중처벌 등에 관한 법률 위반죄로 기소된 사안에서, 피해자들에 대한 사기죄의 피해법익이 동일하다고 평가될 수 있어 이들에 대한 사기죄가 포괄일죄를 구성한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=239263"},{"id":"P:238901","kind":"P","label":"2023도8730","title":"식품위생법위반·사기·공무집행방해","court":"대법원","date":"2023.12.21","caseType":"형사","basis":"판례내용","text":"즉석판매제조·가공업자가 식품위생법 시행규칙 제37조 [별표 15] 제1호에 정한 식품을 스스로 제조·가공하여 판매하는 경우, 일부 식품을 즉석판매제조·가공업의 대상 식품에서 제외하는 같은 별표 제2호 단서의 제한을 받는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=238901"},{"id":"P:599599","kind":"P","label":"2018도20415","title":"자본시장과금융투자업에관한법률위반","court":"대법원","date":"2023.12.21","caseType":"형사","basis":"참조조문","text":"형법 제30조의 공동정범이 성립하기 위한 요건 / 주관적 요건으로서 공동가공 의사의 내용 / 공동정범으로 인정하기 위한 증명의 정도","url":"https://www.law.go.kr/precInfoP.do?precSeq=599599"},{"id":"P:238907","kind":"P","label":"2023도12852","title":"특정범죄가중처벌등에관한법률위반(강도)·특정범죄가중처벌등에관한법률위반(절도)·특수주거침입·공문서부정행사·부착명령","court":"대법원","date":"2023.12.21","caseType":"형사","basis":"참조조문","text":"반복적인 강도 범행 등에 대한 누범가중 처벌규정인 특정범죄 가중처벌 등에 관한 법률 제5조의4 제5항의 취지 / 같은 항 제2호 중 ‘이들 죄를 범하여 누범으로 처벌하는 경우’ 부분에서 ‘이들 죄’의 의미","url":"https://www.law.go.kr/precInfoP.do?precSeq=238907"},{"id":"P:599719","kind":"P","label":"2023오1","title":"도로교통법위반(음주운전)등","court":"대법원","date":"2023.12.21","caseType":"형사","basis":"판례내용","text":"비상상고 제도의 의의 / 상급심의 파기판결에 의해 효력을 상실한 재판이 형사소송법 제441조에 따른 비상상고의 대상이 될 수 있는지 여부 / 재심판결의 확정으로 효력을 상실한 재판이 형사소송법 제441조에 따른 비상상고의 대상이 될 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=599719"},{"id":"P:607635","kind":"P","label":"2022노525","title":"항만운송사업법위반","court":"춘천지방법원강릉지원","date":"2023.12.19","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=607635"},{"id":"P:599595","kind":"P","label":"2023도3509","title":"업무상배임·부정경쟁방지및영업비밀보호에관한법률위반(영업비밀누설등)[피고인1에대하여일부인정된죄명또는예비적죄명:부정경쟁방지및영업비밀보호에관한법률위반(영업비밀누설등)미수]·부정경쟁방지및영업비밀보호에관한법률위반","court":"대법원","date":"2023.12.14","caseType":"형사","basis":"판례내용","text":"구 부정경쟁방지 및 영업비밀보호에 관한 법률 제19조 양벌규정은 법인의 사용인 등이 영업비밀의 취득 및 부정사용에 해당하는 같은 법 제18조 제1항부터 제4항까지의 위반행위를 한 경우에 적용되는지 여부 및 법인의 사용인 등이 영업비밀의 부정사용에 대한 미수범을 처벌하는 같은 법 제18조의2에 해당하는 위반행위를 한 경우에도 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=599595"},{"id":"P:599613","kind":"P","label":"2023도13019","title":"건조물침입","court":"대법원","date":"2023.12.14","caseType":"형사","basis":"참조조문","text":"행위자가 거주자의 승낙을 받아 주거에 들어갔으나 범죄나 불법행위 등을 목적으로 한 출입이거나 거주자가 행위자의 실제 출입 목적을 알았더라면 출입을 승낙하지 않았을 것이라는 사정이 인정되는 경우, 행위자의 출입행위가 주거침입죄에서 규정하는 침입행위에 해당하기 위한 요건 및 이때 거주자의 의사도 고려되는지 여부와 그 정도 / 이는 건조물침입죄의 경우에도 마찬가지인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=599613"},{"id":"P:240631","kind":"P","label":"2023노28","title":"공직선거법위반","court":"광주고등법원","date":"2023.12.14","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=240631"},{"id":"P:238931","kind":"P","label":"2020도1669","title":"정보통신망이용촉진및정보보호등에관한법률위반(명예훼손)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영)·음화제조교사[음란합성사진 파일의 음화 해당 여부 및 휴대전화 전자정보의 증거능력이 문제된 사건]","court":"대법원","date":"2023.12.14","caseType":"형사","basis":"참조조문","text":"[1] 컴퓨터 프로그램파일이 형법 제243조에서 규정한 ‘문서, 도화, 필름 기타 물건’에 해당하는지 여부 / 이는 형법 제244조의 ‘음란한 물건’의 해석에도 그대로 적용되는지 여부 [2] 피해자 등 제3자가 피의자의 소유·관리에 속하는 정보저장매체를 임의제출한 경우, 실질적 피압수자인 피의자에게 참여권을 보장하고 압수한 전자정보 목록을 교부하는 등 피의자의 절차적 권리를 보장하기 위한 적절한 조치가 이루어져야 하는지 여부 / 이때 정보저장매체를 임의제출한 피압수자에 더하여 임의제출자 아닌 피의자에게도 참여권이 보장되어야 하는 ‘피의자의 소유·관리에 속하는 정보저장매체’의 의미 및 이에 해당하는지 판단하는 기준 [3] 수사기관이 헌법과 형사소송법에서 정한 절차에 따르지 아니하고 수집한 증거 및 이를 기초로 하여 획득한 2차적 증거의 증거능력 유무 / 법원이 2차적 증거의 증거능력 인정 여부를 최종적으로 판단할 때 고려하여야 할 사정 [4] 임의제출된 정보저장매체에서 압수 대상이 되는 전자정보의 범위를 초과하여 수사기관 임의로 전자정보를 탐색·복제·출력하는 것이 허용되는지 여부 / 전자정보에 대한 압수·수색이 종료되기 전에 범죄혐의사실과 관련된 전자정보를 적법하게 탐색하는 과정에서 별도의 범죄혐의와 관련된 전자정보를 우연히 발견한 경우, 수사기관이 그러한 정보에 대하여 적법하게 압수·수색을 할 수 있는 요건","url":"https://www.law.go.kr/precInfoP.do?precSeq=238931"},{"id":"P:238933","kind":"P","label":"2023도9350","title":"마약류관리에관한법률위반(향정)·퇴거불응[숙박업소에서 개별 객실을 점유하고 있는 고객에게 퇴거불응죄가 성립할 수 있는지에 관한 사건]","court":"대법원","date":"2023.12.14","caseType":"형사","basis":"참조조문","text":"퇴거불응죄의 보호법익 / 퇴거불응죄는 거주자나 관리자·점유자로부터 주거나 건조물·방실 등에서 퇴거요구를 받고도 이에 응하지 아니하면 성립하는지 여부 및 이때 주거 등에 관하여 거주·관리·점유할 법률상 정당한 권한을 가지고 있어야만 거주자나 관리자·점유자가 될 수 있는지 여부 / 이는 숙박계약이 종료됨에 따라 고객이 숙박업소의 관리자 등으로부터 퇴거요구를 받은 경우에도 마찬가지인지 여부 / 숙박업소에서 개별 객실을 점유하고 있는 고객에게 퇴거불응죄가 성립할 수 있는 경우","url":"https://www.law.go.kr/precInfoP.do?precSeq=238933"},{"id":"P:238199","kind":"P","label":"2020도15393","title":"근로기준법위반·근로자퇴직급여보장법위반[1주간 12시간의 연장근로한도 위반 여부가 문제된 사건]","court":"대법원","date":"2023.12.07","caseType":"형사","basis":"판례내용","text":"[1] 구 근로기준법상 ‘1주간의 연장근로가 12시간을 초과하였는지’는 근로시간이 1일 8시간을 초과하였는지를 고려하지 않고 1주간의 근로시간 중 40시간을 초과하는 근로시간을 기준으로 판단하여야 하는지 여부 [2] 구 근로기준법상 사용자가 1일 8시간을 초과하여 4시간의 연장근로를 하게 할 때에는 연장근로시간 도중에 30분 이상의 휴게시간을 부여하여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=238199"},{"id":"P:599741","kind":"P","label":"2023고단1182","title":"무고·위계공무집행방해","court":"인천지방법원","date":"2023.12.07","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=599741"},{"id":"P:601947","kind":"P","label":"2023노1874","title":"폭행·특수상해(인정된죄명상해)·특수협박(인정된죄명협박)·감금","court":"대전지방법원","date":"2023.12.06","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=601947"},{"id":"P:601421","kind":"P","label":"2023노807","title":"특정경제범죄가중처벌등에관한법률위반(사기)","court":"수원고등법원","date":"2023.12.05","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=601421"},{"id":"P:238795","kind":"P","label":"2023도10699","title":"특정범죄가중처벌등에관한법률위반(절도)","court":"대법원","date":"2023.11.30","caseType":"형사","basis":"판례내용","text":"[1] 유죄의 확정판결에 대한 재심개시결정이 확정되어 법원이 그 사건에 대하여 다시 심판을 한 후 재심판결을 선고하여 확정된 경우, 종전 확정판결은 당연히 효력을 상실하는지 여부 및 재심판결 확정의 효력 범위 [2] 형의 실효 등에 관한 법률 제7조 제1항에서 정한 기간의 경과로 형이 실효된 경우, 그 전과가 특정범죄 가중처벌 등에 관한 법률 제5조의4 제5항에서 정한 “징역형을 받은 경우”에 해당하는지 여부 / 2번 이상의 징역형을 받은 자가 자격정지 이상의 형을 받음이 없이 마지막 형의 집행을 종료한 날부터 형의 실효 등에 관한 법률에서 정한 기간을 경과한 경우, 그 마지막 형에 앞서는 형도 모두 실효되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=238795"},{"id":"P:239383","kind":"P","label":"2023노1673","title":"특정범죄가중처벌등에관한법률위반(도주치사)·특정범죄가중처벌등에관한법률위반(어린이보호구역치사)·특정범죄가중처벌등에관한법률위반(위험운전치사)·도로교통법위반(음주운전)","court":"서울고등법원","date":"2023.11.24","caseType":"형사","basis":"참조조문","text":"자동차 운전자인 피고인이 음주의 영향으로 정상적인 운전이 곤란한 상태에서 어린이 보호구역인 초등학교 후문 교차로에서 안전운전의무를 위반한 업무상과실로 어린이인 피해자 甲을 자동차로 충격 후 역과하여 甲을 사망에 이르게 하였다는 내용의 특정범죄 가중처벌 등에 관한 법률 위반 및 같은 법 위반 공소사실이 유죄로 인정된 후 그 죄수관계가 문제 된 사안에서, 피고인의 행위는 1개의 운전행위로 한 번의 교통사고를 내어 1명의 피해자를 사망에 이르게 한 경우로서, 같은 법 위반죄와 같은 법 위반죄가 각각 성립하고, 위 각 죄는 상상적 경합관계에 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=239383"},{"id":"P:622833","kind":"P","label":"2023고단4211","title":"가. 농수산물의원산지표시등에관한법률위반","court":"인천지방법원","date":"2023.11.22","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=622833"},{"id":"P:601945","kind":"P","label":"2023노852","title":"특정경제범죄가중처벌등에관한법률위반(횡령)·특정경제범죄가중처벌등에관한법률위반(배임)·강제집행면탈·예금자보호법위반","court":"서울고등법원","date":"2023.11.17","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=601945"},{"id":"P:617177","kind":"P","label":"2022노2376","title":"공무상비밀누설·외교상기밀누설·외교상기밀탐지·외교상기밀수집","court":"서울중앙지방법원","date":"2023.11.17","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=617177"},{"id":"P:608547","kind":"P","label":"2020노407","title":"특정경제범죄가중처벌등에관한법률위반(횡령)·횡령","court":"광주고등법원","date":"2023.11.16","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=608547"},{"id":"P:238021","kind":"P","label":"2023도12424","title":"특정경제범죄가중처벌등에관한법률위반(사기)·사기","court":"대법원","date":"2023.11.16","caseType":"형사","basis":"참조조문","text":"유사수신행위를 금지·처벌하는 유사수신행위의 규제에 관한 법률 제6조 제1항, 제3조 위반죄가 사기죄와 별개의 범죄인지 여부 / 유사수신행위를 한 자가 출자자에게 별도의 기망행위를 하여 유사수신행위로 조달받은 자금의 전부 또는 일부를 다시 투자받는 행위가 유사수신행위의 규제에 관한 법률 위반죄의 불가벌적 사후행위에 해당하는지 여부 및 별죄인 사기죄를 구성하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=238021"},{"id":"P:240891","kind":"P","label":"2023도12333","title":"공직선거법위반","court":"대법원","date":"2023.11.16","caseType":"형사","basis":"참조조문","text":"[1] 형법 제37조 후단 경합범 중 아직 판결을 받지 아니한 죄가 이미 판결이 확정된 죄와 동시에 판결할 수 없었던 경우, 형법 제39조 제1항에 따라 동시에 판결할 경우와 형평을 고려하여 형을 선고하거나 그 형을 감경 또는 면제할 수 있는지 여부 [2] 공직선거법 제18조 제1항 제3호에 규정된 선거범죄와 다른 죄의 경합범에 대하여는 이를 분리 선고하여야 하는지 여부 / 이때 판결이 확정된 다른 죄와 확정되지 아니한 선거범죄에 대하여 형법 제39조 제1항이 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=240891"},{"id":"P:240079","kind":"P","label":"2023노256","title":"특정범죄가중처벌등에관한법률위반(뇌물)·사기·부패방지및국민권익위원회의설치와운영에관한법률위반·뇌물공여","court":"대구고등법원","date":"2023.11.15","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=240079"},{"id":"P:242063","kind":"P","label":"2023노161","title":"공직선거법위반","court":"광주고등법원전주재판부","date":"2023.11.10","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=242063"},{"id":"P:239819","kind":"P","label":"2022노3418","title":"상해·건조물침입","court":"서울중앙지방법원","date":"2023.11.10","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=239819"},{"id":"P:601959","kind":"P","label":"2022노532","title":"도시및주거환경정비법위반","court":"서울중앙지방법원","date":"2023.11.09","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=601959"},{"id":"P:238431","kind":"P","label":"2023노2655","title":"특정경제범죄가중처벌등에관한법률위반(사기)(인정된죄명:사기·사기미수)·사기","court":"서울고등법원","date":"2023.11.08","caseType":"형사","basis":"참조조문","text":"피고인 甲, 乙이 공모하여, 법원에 채무자를 丙 또는 丁 주식회사로 하여 丙 또는 丁 회사의 제3채무자들에 대한 채권에 관하여 채권압류 및 추심명령을 신청하면서 그 증빙서류로 허위로 작성된 금전소비대차계약 공정증서를 제출하는 방법으로 총 6회에 걸쳐 법원을 기망하여 채권압류 및 추심명령을 받음으로써 그 인용된 청구금액 상당의 재산상 이익을 편취하였다는 이유로 특정경제범죄 가중처벌 등에 관한 법률 위반 등의 공소사실로 기소된 사안에서, 검사가 제출한 증거들만으로는 피고인들이 채권압류 및 추심명령 청구금액 상당의 재산상 이익을 취득하였다고 보기 어렵고, 일부 채권압류 및 추심명령과 관련하여 5억 원 이상의 재산상 이익을 취득하였다고 인정하기 어려워 같은 법 위반죄가 성립하지 않는다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=238431"},{"id":"P:608553","kind":"P","label":"2023노112","title":"특정범죄가중처벌등에관한법률위반(보복협박등)·강요[위가.및나.에대하여인정된죄명특정범죄가중처벌등에관한법률위반(면담강요등)]·특정범죄가중처벌등에관한법률위반(보복협박등)방조·강요방조[위다.및라.에대하여인정된죄명특정범죄가중처벌등에관한법률위반(면담강요등)방조]","court":"서울고등법원","date":"2023.11.08","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=608553"},{"id":"P:237915","kind":"P","label":"2023도10768","title":"상해","court":"대법원","date":"2023.11.02","caseType":"형사","basis":"참조조문","text":"甲은 관장 乙이 운영하는 복싱클럽에 회원등록을 하였던 자로서 등록을 취소하는 문제로 乙로부터 질책을 들은 다음 약 1시간이 지난 후 다시 복싱클럽을 찾아와 乙에게 항의하는 과정에서 乙이 甲의 멱살을 잡아당기거나 바닥에 넘어뜨린 후 목을 조르는 등 乙과 甲이 뒤엉켜 몸싸움을 벌였는데, 코치인 피고인이 이를 지켜보던 중 甲이 왼손을 주머니에 넣어 불상의 물건을 꺼내 움켜쥐자 甲의 왼손 주먹을 강제로 펴게 함으로써 甲에게 손가락 골절상을 입혔다는 상해의 공소사실로 기소된 사안에서, 피고인이 당시 죄가 되지 않는 것으로 오인한 것에 대해 ‘정당한 이유’를 부정하여 공소사실을 유죄로 인정한 원심판결에 위법성조각사유의 전제사실에 관한 착오, 정당한 이유의 존부에 관한 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=237915"},{"id":"P:241693","kind":"P","labe
