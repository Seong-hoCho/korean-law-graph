l":"2023도10700","title":"대부업등의등록및금융이용자보호에관한법률위반·범죄수익은닉의규제및처벌등에관한법률위반·전자금융거래법위반·전기통신사업법위반","court":"대법원","date":"2023.11.02","caseType":"형사","basis":"판례내용","text":"[1] 구 범죄수익은닉의 규제 및 처벌 등에 관한 법률상 몰수·추징의 대상인 ‘범죄행위에 의하여 생긴 재산’의 의미 [2] 구 범죄수익은닉의 규제 및 처벌 등에 관한 법률에 따른 추징의 취지 [3] 주형과 몰수·추징을 선고한 항소심판결 중 몰수·추징 부분에 관해서만 파기사유가 있을 경우, 상고심의 파기 범위 / 몰수나 추징을 선고하지 아니하였음을 이유로 항소심판결을 파기하는 경우, 상고심의 파기 범위","url":"https://www.law.go.kr/precInfoP.do?precSeq=241693"},{"id":"P:606107","kind":"P","label":"2022고단1289","title":"사기","court":"수원지방법원여주지원","date":"2023.10.31","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606107"},{"id":"P:239953","kind":"P","label":"2023노1279","title":"사기·자동차관리법위반","court":"서울북부지방법원","date":"2023.10.31","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=239953"},{"id":"P:237941","kind":"P","label":"2017도18697","title":"명예훼손","court":"대법원","date":"2023.10.26","caseType":"형사","basis":"참조조문","text":"[1] 학문의 자유의 본질 및 학문적 표현의 자유에 대한 제한의 한계 / 학문적 표현행위가 기본적 연구윤리를 위반하거나 해당 학문 분야에서 통상적으로 용인되는 범위를 심각하게 벗어나 학문적 과정이라고 보기 어려운 행위의 결과라거나, 논지나 맥락과 무관한 표현으로 타인의 권리를 침해하는 등의 특별한 사정이 없는 경우, 이를 학문적 연구를 위한 정당한 행위로 보아야 하는지 여부 / 학문 연구자들이 연구 주제의 선택, 연구의 실행뿐만 아니라 연구 결과 발표에 이르기까지 존중하여야 하는 타인의 권리 [2] 객관적으로 피해자의 사회적 평가를 저하시키는 사실에 관한 발언이 보도, 소문이나 제3자의 말을 인용하는 방법으로 단정적인 표현이 아닌 전문 또는 추측의 형태로 표현되었으나 표현 전체의 취지로 보아 사실이 존재할 수 있다는 것을 암시하는 방식으로 이루어진 경우, 명예훼손죄에서의 ‘사실의 적시’로 인정되는지 여부 / 학문적 연구에 따른 의견 표현을 명예훼손죄에서의 사실의 적시로 평가할 때 유의하여야 할 사항 / 학문적 표현을 그 자체로 이해하지 않고, 표현에 숨겨진 배경이나 배후를 섣불리 단정하는 방법으로 암시에 의한 사실 적시를 인정할 수 있는지 여부 [3] 형사재판에서 공소가 제기된 범죄의 구성요건을 이루는 사실에 대한 증명책임 소재 / 학문적 표현이 학문의 자유로서 보호되는 영역에 속하지 않는다는 점에 대한 증명책임 소재","url":"https://www.law.go.kr/precInfoP.do?precSeq=237941"},{"id":"P:241699","kind":"P","label":"2023도9560","title":"범인도피교사","court":"대법원","date":"2023.10.26","caseType":"형사","basis":"참조조문","text":"[1] 범인도피죄에서 ‘도피하게 하는 행위’의 의미 [2] 범인이 도피를 위하여 타인에게 도움을 요청하는 행위가 도피행위의 범주에 속하는 경우 처벌되는지 여부 및 이때 범인의 요청에 응하여 범인을 도운 타인의 행위가 범인도피죄에 해당하더라도 마찬가지인지 여부 / 범인이 타인으로 하여금 허위 자백을 하게 하는 등으로 범인도피죄를 범하게 하는 행위와 같이 방어권의 남용으로 볼 수 있을 경우, 범인도피교사죄에 해당하는지 여부 및 이때 방어권 남용 여부의 판단 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=241699"},{"id":"P:241705","kind":"P","label":"2023도2950","title":"복표발매중개","court":"대법원","date":"2023.10.26","caseType":"형사","basis":"참조조문","text":"형법 제248조 제1항에서 정한 ‘법령에 의하지 아니한 복표’의 의미 및 국내법에 의하여 발행되지 않은 복표의 경우 외국의 법률에 따라 적법하게 발행된 복권이더라도 ‘법령에 의하지 아니한 복표’에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=241705"},{"id":"P:237867","kind":"P","label":"2023도8752","title":"아동·청소년의성보호에관한법률위반(위계등유사성행위)·아동·청소년의성보호에관한법률위반(성매수등)·아동·청소년의성보호에관한법률위반(성착취물제작·배포등)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등)·미성년자의제강간·미성년자의제유사강간·아동복지법위반(아동에대한음행강요·매개·성희롱등)·성매매알선등행위의처벌에관한법률위반(성매매)","court":"대법원","date":"2023.10.18","caseType":"형사","basis":"판례내용","text":"[1] 수사기관이 압수·수색영장을 제시하고 집행에 착수하여 압수·수색을 실시하고 집행을 종료한 후 그 영장의 유효기간 내에 동일한 장소 또는 목적물에 대하여 다시 압수·수색할 필요가 있는 경우, 종전의 압수·수색영장을 제시하고 다시 압수·수색을 할 수 있는지 여부 [2] 수사기관이 하드카피나 이미징 등에 담긴 전자정보를 탐색하여 혐의사실과 관련된 정보를 선별하여 출력하거나 다른 저장매체에 저장하는 등으로 압수를 완료한 경우, 혐의사실과 관련 없는 전자정보를 삭제·폐기하여야 하는지 여부 / 수사기관이 새로운 범죄 혐의의 수사를 위하여 무관정보가 남아 있는 복제본을 탐색, 복제 또는 출력할 수 있는지 여부 및 이때 수사기관이 열람할 수 있는 범위 [3] 헌법과 형사소송법이 정한 압수·수색절차의 내용 및 관련 규정 / 수사기관이 압수·수색영장의 집행기관으로서 준수하여야 할 적법절차의 내용","url":"https://www.law.go.kr/precInfoP.do?precSeq=237867"},{"id":"P:242065","kind":"P","label":"2023고단1159","title":"전기통신금융사기피해방지및피해금환급에관한특별법위반·사기·자본시장과금융투자업에관한법률위반·배상명령신청","court":"의정부지방법원","date":"2023.10.18","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=242065"},{"id":"P:240315","kind":"P","label":"2023도1875","title":"특정경제범죄가중처벌등에관한법률위반(사기)·의료법위반","court":"대법원","date":"2023.10.12","caseType":"형사","basis":"판례내용","text":"[1] 의료법인 명의로 개설된 의료기관을 실질적으로 비의료인이 개설·운영하였다고 판단하기 위한 요건 및 이에 해당하는 것으로 인정할 수 있는 경우 / 비의료인이 의료기관 개설자격을 위반하여 의료법인 명의 의료기관을 개설·운영하였는지 판단하는 기준 [2] 의료인의 자격이 없는 일반인인 피고인이 甲 의료법인의 운영권을 인수하고 자신의 친인척 등을 甲 의료법인의 이사장 및 이사로 선임한 후 甲 의료법인 명의로 개설된 乙 요양병원을 운영함으로써 개설자격을 위반하여 乙 병원을 실질적으로 개설·운영하였다고 하여 의료법 위반으로 기소된 사안에서, 피고인이 乙 병원의 운영에 관한 사항을 주도적 입장에서 처리하였다는 사정만으로 甲 의료법인을 탈법적인 수단으로 악용하여 적법한 의료기관 개설·운영으로 가장하였다고 단정할 수 없다는 등의 이유로, 이와 달리 보아 공소사실을 유죄로 본 원심판단에 법리오해 등의 위법이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=240315"},{"id":"P:241151","kind":"P","label":"2023노1192","title":"주거침입·화학물질관리법위반(환각물질흡입)·절도","court":"서울북부지방법원","date":"2023.10.12","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=241151"},{"id":"P:240625","kind":"P","label":"2023노130","title":"성폭력범죄의처벌등에관한특례법위반(친족관계에의한강간)·아동복지법위반(아동학대)·아동복지법위반(아동에대한음행강요·매개·성희롱등)·성폭력범죄의처벌등에관한특례법위반(13세미만미성년자유사성행위)·부착명령","court":"부산고등법원창원재판부","date":"2023.10.11","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=240625"},{"id":"P:622841","kind":"P","label":"2023노717","title":"모욕","court":"춘천지방법원","date":"2023.10.06","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=622841"},{"id":"P:238937","kind":"P","label":"2021도2020","title":"의료법위반·특정경제범죄가중처벌등에관한법률위반(사기)·강제집행면탈·근로기준법위반·근로자퇴직급여보장법위반","court":"대법원","date":"2023.09.27","caseType":"형사","basis":"판례내용","text":"의료법인 명의로 개설된 의료기관을 실질적으로 비의료인이 개설·운영하였다고 판단하기 위한 요건 및 이에 해당하는 것으로 인정할 수 있는 경우 / 비의료인이 의료기관 개설자격을 위반하여 의료법인 명의 의료기관을 개설·운영하였는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=238937"},{"id":"P:237547","kind":"P","label":"2023도9332","title":"특정경제범죄가중처벌등에관한법률위반(배임)(인정된죄명:업무상배임)·업무방해","court":"대법원","date":"2023.09.27","caseType":"형사","basis":"참조조문","text":"[1] 업무방해죄의 보호대상이 되는 ‘업무’의 의미 [2] 피고인들이 공모하여 이사회에서 ‘급여규정 일부 개정안’에 대하여 허위로 설명 또는 보고하거나 개정안과 관련하여 허위의 자료를 작성하여 제시하였는데, 위와 같은 행위로 위계로써 甲 농협 감사의 甲 농협의 재산과 업무집행상황에 대한 감사, 이사회에 대한 의견 진술 등에 관한 업무를 방해하였다는 내용으로 기소된 사안에서, 피고인들의 행위로 이사회에 출석하여 의견을 진술한 이사회 구성원 아닌 감사의 업무가 방해된 경우에 해당하지 않음에도, 이와 달리 본 원심판단에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=237547"},{"id":"P:599829","kind":"P","label":"2023노2261","title":"산업안전보건법위반·업무상과실치사","court":"인천지방법원","date":"2023.09.22","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=599829"},{"id":"P:237581","kind":"P","label":"2018도13877","title":"성폭력범죄의처벌등에관한특례법위반(친족관계에의한강제추행)[인정된죄명:아동·청소년의성보호에관한법률위반(위계등추행)]","court":"대법원","date":"2023.09.21","caseType":"형사","basis":"참조조문","text":"[1] 강제추행죄의 ‘폭행 또는 협박’의 의미에 관한 종래 대법원의 입장 및 변경 필요성 / 강제추행죄의 ‘폭행 또는 협박’은 상대방의 신체에 대하여 불법한 유형력을 행사하거나 일반적으로 보아 상대방으로 하여금 공포심을 일으킬 수 있는 정도의 해악을 고지하는 것이라고 보아야 하는지 여부 및 어떠한 행위가 이에 해당하는지 판단하는 기준 [2] 피고인이 자신의 주거지 방안에서 4촌 친족관계인 피해자 甲의 학교 과제를 도와주던 중 甲을 양팔로 끌어안은 다음 침대에 쓰러뜨린 후 甲의 가슴을 만지는 등 강제로 추행하였다는 성폭력범죄의 처벌 등에 관한 특례법 위반의 주위적 공소사실로 기소된 사안에서, 당시 피고인의 행위는 甲의 신체에 대하여 불법한 유형력을 행사하여 甲을 강제추행한 것에 해당한다고 볼 여지가 충분하다는 이유로, 이와 달리 피고인의 행위가 甲의 항거를 곤란하게 할 정도의 폭행 또는 협박에 해당하지 않는다고 보아 위 공소사실을 무죄로 판단한 원심의 조치에 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=237581"},{"id":"P:239823","kind":"P","label":"2023노633","title":"주거침입","court":"서울북부지방법원","date":"2023.09.21","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=239823"},{"id":"P:238949","kind":"P","label":"2021도13708","title":"업무방해","court":"대법원","date":"2023.09.14","caseType":"형사","basis":"참조조문","text":"[1] 형사소송에서 범죄사실에 대한 증명책임 소재 및 피고인에게 유죄를 인정하기 위한 증거의 증명력 정도 [2] 위계에 의한 업무방해죄에서 ‘위계’의 의미 / 업무방해죄의 성립에 업무방해의 결과가 실제로 발생할 것을 요하는지 여부 및 업무방해의 결과를 초래할 위험은 발생하여야 하고, 그 위험의 발생이 위계 또는 위력으로 인한 것이어야 하는지 여부 [3] 학위논문을 작성함에 있어 자료를 분석, 정리하여 논문의 내용을 완성하는 일의 대부분을 타인에게 의존한 경우, 그 논문은 타인에 의하여 대작된 것으로 보아야 하는지 여부 / 학위청구논문의 작성계획을 밝히는 예비심사 단계에서 제출된 논문 또는 자료의 경우, 학위논문과 동일하게 볼 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=238949"},{"id":"P:237237","kind":"P","label":"2023도5814","title":"정보통신망이용촉진및정보보호등에관한법률위반·폭행[‘공포심이나 불안감을 유발하는 문언 등을 반복적으로 상대방에게 도달하게 하는 행위’ 해당 여부에 관한 사건]","court":"대법원","date":"2023.09.14","caseType":"형사","basis":"판례내용","text":"[1] 정보통신망 이용촉진 및 정보보호 등에 관한 법률 제74조 제1항 제3호, 제44조의7 제1항 제3호에서 정한 ‘공포심이나 불안감을 유발하는 문언을 반복적으로 상대방에게 도달하게 하는 행위’에 해당하는지 판단하는 방법 / 정보통신망을 이용한 일련의 불안감 조성행위가 정보통신망 이용촉진 및 정보보호 등에 관한 법률 제74조 제1항 제3호 위반죄에 해당하기 위한 요건 [2] 회사의 대표이사인 피고인이 피해자에게 해고를 통보하자 피해자가 반발한 상황에서, 피고인이 휴대전화를 사용하여 피해자에게 메시지를 7회 전송하고 전화를 2회 걸어 정보통신망을 통하여 공포심이나 불안감을 유발하는 문언·음향을 반복적으로 피해자에게 도달하도록 하였다는 내용으로 기소된 사안에서, 피고인의 행위는 전체적으로 일회성 내지 비연속적인 단발성 행위가 수차 이루어진 것으로 볼 여지가 있을 뿐 정보통신망을 이용하여 상대방의 불안감 등을 조성하는 일련의 행위를 반복한 경우에 해당한다고 단정할 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=237237"},{"id":"P:237239","kind":"P","label":"2023도6767","title":"뇌물수수·뇌물공여·직권남용권리행사방해·부정청탁및금품등수수의금지에관한법률위반","court":"대법원","date":"2023.09.14","caseType":"형사","basis":"판례내용","text":"부정청탁 및 금품등 수수의 금지에 관한 법률 제8조 제1항에서 금지하는 금품 등 수수행위의 구성요건 해당 여부를 판단할 때 고려할 사항 및 공직자 등이 영득의사 없이 직무상 소요되는 비용을 지출할 목적으로 금품을 취득한 경우, 위 구성요건에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=237239"},{"id":"P:240759","kind":"P","label":"2023노43","title":"상관명예훼손","court":"서울고등법원","date":"2023.09.13","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=240759"},{"id":"P:600447","kind":"P","label":"2022고합531","title":"지방교육자치에관한법률위반","court":"부산지방법원","date":"2023.09.08","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=600447"},{"id":"P:240761","kind":"P","label":"2022노1982","title":"성폭력범죄의처벌및피해자보호등에관한법률위반(특수준강간)","court":"서울고등법원","date":"2023.09.07","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=240761"},{"id":"P:239097","kind":"P","label":"2023노146","title":"특정범죄가중처벌등에관한법률위반(강도)·특정범죄가중처벌등에관한법률위반(절도)·특수주거침입·공문서부정행사·부착명령","court":"부산고등법원창원재판부","date":"2023.09.06","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=239097"},{"id":"P:239099","kind":"P","label":"2023노53","title":"사기[일부인정된죄명:특정경제범죄가중처벌등에관한법률위반(사기)]·도로교통법위반(무면허운전)","court":"서울고등법원춘천재판부","date":"2023.09.06","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=239099"},{"id":"P:238653","kind":"P","label":"2023도6355","title":"폭력행위등처벌에관한법률위반(공동폭행)·정보통신망이용촉진및정보보호등에관한법률위반(명예훼손)·공갈미수[피고인들 중 1인이 피해자를 폭행하고 나머지는 이를 휴대전화로 촬영하거나 지켜본 것이 공동폭행에 해당하는지 문제된 사건]","court":"대법원","date":"2023.08.31","caseType":"형사","basis":"판례내용","text":"폭력행위 등 처벌에 관한 법률 제2조 제2항 제1호의 ‘2명 이상이 공동하여 폭행의 죄를 범한 때’의 의미 / 폭행 실행범과 공모한 사실은 인정되나 그와 공동하여 범행에 가담하였거나 범행장소에 있었다고 인정되지 않는 경우, 위 조항의 ‘공동하여 죄를 범한 때’에 해당하는지 여부 및 여러 사람이 공동하여 범행을 공모한 경우, 공모자에게도 공모공동정범이 성립하기 위해서는 그중 2인 이상이 범행장소에서 실제 범죄의 실행에 이르러야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=238653"},{"id":"P:238957","kind":"P","label":"2022도11404","title":"의료법위반·특정경제범죄가중처벌등에관한법률위반(사기)·사기","court":"대법원","date":"2023.08.31","caseType":"형사","basis":"판례내용","text":"의료법인 명의로 개설된 의료기관을 실질적으로 비의료인이 개설·운영하였다고 판단하기 위한 요건 및 이에 해당하는 것으로 인정할 수 있는 경우 / 비의료인이 의료기관 개설자격을 위반하여 의료법인 명의 의료기관을 개설·운영하였는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=238957"},{"id":"P:238637","kind":"P","label":"2021도17151","title":"업무방해·전자금융거래법위반","court":"대법원","date":"2023.08.31","caseType":"형사","basis":"참조조문","text":"[1] 계좌개설 신청인이 접근매체를 양도할 의사로 금융기관에 법인 명의 계좌를 개설하면서 예금거래신청서 등에 금융거래의 목적이나 접근매체의 양도의사 유무 등에 관한 사실을 허위로 기재하였으나, 계좌개설 심사업무를 담당하는 금융기관의 업무담당자가 단순히 예금거래신청서 등에 기재된 계좌개설 신청인의 허위 답변만을 그대로 믿고 그 내용의 진실 여부를 확인할 수 있는 증빙자료의 요구 등 추가적인 확인조치 없이 법인 명의의 계좌를 개설해 준 경우, 신청인에게 위계에 의한 업무방해죄가 성립하는지 여부 [2] 전자금융거래법 제6조 제3항 제3호의 ‘범죄에 이용될 것을 알면서’에서 말하는 ‘범죄’의 의미 및 이에 대한 인식 정도 / 범죄에 이용될 것을 알았는지는 접근매체를 대여하는 등의 행위를 할 당시 피고인이 가지고 있던 주관적 인식을 기준으로 판단하여야 하는지 여부 및 이때 거래 상대방이 접근매체를 범죄에 이용할 의사가 있었는지 또는 피고인이 인식한 것과 같은 범죄를 저질렀는지를 고려하여야 하는지 여부 [3] 전자금융거래법 제6조 제3항 제3호에서 정한 ‘범죄’는 공소사실에 특정되어야 하는지 여부 및 특정 정도","url":"https://www.law.go.kr/precInfoP.do?precSeq=238637"},{"id":"P:238961","kind":"P","label":"2023도7045","title":"특정경제범죄가중처벌등에관한법률위반(배임)·특정경제범죄가중처벌등에관한법률위반(사기)","court":"대법원","date":"2023.08.31","caseType":"형사","basis":"참조조문","text":"[1] 타인의 사무를 처리하는 자가 그 임무에 위배하는 행위로써 본인에게 현실적인 재산상 손해를 가한 경우뿐 아니라 재산상 실해 발생의 위험을 초래한 경우도 배임죄가 성립하는지 여부 및 재산상 손해가 있는지 판단하는 방법 [2] 甲 학교법인의 교육용 재산 처분 업무를 담당하였던 피고인이 甲 학교법인 소유 부동산의 소유권이전등기에 필요한 제반 서류를 보관하던 중 매매계약에 따른 매매대금을 모두 지급받지 못하였음에도 乙 회사에 소유권이전에 필요한 서류 일체를 넘겨주어 乙 회사 앞으로 소유권이전등기를 마치게 하는 등으로 乙 회사에 매매잔금 상당의 재산상 이득을 취득하게 하고 甲 학교법인에 같은 액수 상당의 손해를 가하였다는 공소사실로 기소된 사안에서, 위 소유권이전등기에 무효사유가 있더라도 乙 회사 명의로 소유권이전등기가 실제로 경료된 이상 경제적 관점에서는 甲 학교법인에 현실적인 손해가 발생하였거나 재산상 실해 발생의 위험이 초래되었다고 보는 것이 타당하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=238961"},{"id":"P:607193","kind":"P","label":"2022고단1118","title":"사기","court":"대구지방법원김천지원","date":"2023.08.30","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=607193"},{"id":"P:242071","kind":"P","label":"2023노528","title":"명예훼손·모욕·협박·스토킹범죄의처벌등에관한법률위반","court":"서울남부지방법원","date":"2023.08.29","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=242071"},{"id":"P:238809","kind":"P","label":"2023노213","title":"특정경제범죄가중처벌등에관한법률위반(사기)·사기","court":"대전고등법원","date":"2023.08.25","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238809"},{"id":"P:241297","kind":"P","label":"2023고합159","title":"아동학대범죄의처벌등에관한특례법위반(아동학대살해)[인정된죄명아동학대범죄의처벌등에관한특례법위반(아동학대치사)]·아동복지법위반(상습아동학대)·아동복지법위반(상습아동유기·방임)","court":"인천지방법원","date":"2023.08.25","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=241297"},{"id":"P:239413","kind":"P","label":"2023노167","title":"산업안전보건법위반·업무상과실치사·중대재해처벌등에관한법률위반(산업재해치사)","court":"부산고등법원창원재판부","date":"2023.08.23","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=239413"},{"id":"P:236477","kind":"P","label":"2020도6492","title":"의료법위반·특정경제범죄가중처벌등에관한법률위반(사기)[비의료인이 개설자격을 위반하여 의료법인 명의 의료기관을 개설·운영하였는지 여부가 문제된 사건]","court":"대법원","date":"2023.08.18","caseType":"형사","basis":"판례내용","text":"[1] 의료법인 명의로 개설된 의료기관을 실질적으로 비의료인이 개설·운영하였다고 판단하기 위한 요건 및 이에 해당하는 것으로 인정할 수 있는 경우 / 비의료인이 의료기관 개설자격을 위반하여 의료법인 명의 의료기관을 개설·운영하였는지 판단하는 기준 [2] 비의료인에 해당하여 의료기관 개설자격이 없는 피고인이, 형식적으로 甲 의료법인을 인수하여 법인 산하 乙 요양병원의 운영권을 인계받은 다음 실질적으로는 피고인 자신이 乙 병원의 운영을 주도적으로 담당함으로써 의료기관 개설자격을 위반하여 乙 병원을 개설·운영하였다고 하여 의료법 위반으로 기소된 사안에서, 피고인이 乙 병원 직원들의 체불임금 지급을 위한 자금을 출연하면서 甲 법인을 인수한 다음 의료기관 운영에 관한 주요 사항을 주도적으로 처리하였다는 사정만으로 피고인이 탈법적인 수단으로 乙 병원을 개설·운영한 것으로 단정할 수 없다는 등의 이유로, 이와 달리 보아 공소사실을 유죄로 인정한 원심의 판단에 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=236477"},{"id":"P:623847","kind":"P","label":"2023고단3471","title":"가. 상해 나. 특수협박","court":"인천지방법원","date":"2023.08.10","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=623847"},{"id":"P:614417","kind":"P","label":"2022노82","title":"뇌물수수·뇌물공여·사기","court":"부산고등법원울산재판부","date":"2023.08.10","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=614417"},{"id":"P:238181","kind":"P","label":"2022노2699","title":"장애인복지법위반","court":"대구지방법원","date":"2023.08.08","caseType":"형사","basis":"판례내용","text":"피고인 甲, 乙은 부부이고, 피해자 丙은 지적장애 2급 장애인으로 피고인들의 주소지에 동거인으로 등록되어 있으며, 피고인들은 丙과 같은 동네에 거주하면서 丙 앞으로 지급되는 생계비를 관리하고 丙이 지적장애가 중증인 것을 이용하여 상습적으로 丙을 폭행해 왔는데, 2019. 12.경 피고인들의 주거지에서 丙이 자기 집에 가겠다고 말하거나 약을 먹지 않는다는 이유로 丙을 손과 주먹으로 때리거나 발로 차 丙에게 팔과 다리 부분의 타박상을 가하였다는 장애인복지법 위반의 공소사실로 기소되어 그 특정 여부가 문제 된 사안에서, 위 공소사실 중 범행 일시의 기재에 다소 불명확한 부분이 있는 것은 丙의 지적장애로 인하여 부득이하고, 그로 인하여 피고인들의 방어권 행사에 지장을 초래하였다고 할 수 없으므로, 공소사실이 특정되지 않았다고 할 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=238181"},{"id":"P:238979","kind":"P","label":"2023도3477","title":"살인·컴퓨터등사용사기","court":"대법원","date":"2023.07.27","caseType":"형사","basis":"참조조문","text":"[1] 형사재판에서 범죄사실을 인정하기 위한 증거의 증명력 정도 및 증명책임 소재 [2] 살인죄와 같이 법정형이 무거운 범죄의 경우에도 직접증거 없이 간접증거만으로 유죄를 인정할 수 있는지 여부 및 간접증거만으로 유죄를 인정하기 위한 요건","url":"https://www.law.go.kr/precInfoP.do?precSeq=238979"},{"id":"P:240113","kind":"P","label":"2023노17","title":"상해(인정된죄명:강간상해)","court":"광주고등법원제주재판부","date":"2023.07.26","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=240113"},{"id":"P:599931","kind":"P","label":"2022노162","title":"업무상배임·사문서위조·위조사문서행사·상표법위반","court":"서울서부지방법원","date":"2023.07.25","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=599931"},{"id":"P:238487","kind":"P","label":"2021노2821","title":"공기호위조·위조공기호행사","court":"창원지방법원","date":"2023.07.21","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238487"},{"id":"P:239957","kind":"P","label":"2022고단4323","title":"사기·자동차관리법위반","court":"서울북부지방법원","date":"2023.07.20","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=239957"},{"id":"P:236825","kind":"P","label":"2018스34","title":"이혼및친권자지정","court":"대법원","date":"2023.07.17","caseType":"가사","basis":"판례내용","text":"법원의 통신사실확인자료에 대한 문서제출명령에 대하여 전기통신사업자가 통신비밀보호법 제3조 제1항 본문을 이유로 그 자료의 제출을 거부할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=236825"},{"id":"P:236821","kind":"P","label":"2021도11126","title":"교통사고처리특례법위반(치상)","court":"대법원","date":"2023.07.17","caseType":"형사","basis":"참조조문","text":"[1] 반의사불벌죄에서 성년후견인이 명문의 규정 없이 의사무능력자인 피해자를 대리하여 피고인 또는 피의자에 대하여 처벌을 희망하지 않는다는 의사를 결정하거나 처벌을 희망하는 의사표시를 철회하는 행위를 할 수 있는지 여부 / 이는 성년후견인의 법정대리권 범위에 통상적인 소송행위가 포함되어 있거나 성년후견개시심판에서 정하는 바에 따라 성년후견인이 소송행위를 할 때 가정법원의 허가를 얻더라도 마찬가지인지 여부 [2] 피고인이 자전거를 운행하던 중 전방주시의무를 게을리하여 보행자인 피해자 甲을 들이받아 중상해를 입게 하였다는 교통사고처리 특례법 위반의 공소사실로 기소되었고, 위 사고로 의식불명이 된 甲에 대하여 성년후견이 개시되어 성년후견인으로 甲의 법률상 배우자 乙이 선임되었는데, 乙이 피고인 측으로부터 합의금을 수령한 후 제1심 판결선고 전에 甲을 대리하여 처벌불원의사를 표시한 사안에서, 위 특례법 제3조 제2항에서 차의 운전자가 교통사고로 인하여 범한 업무상과실치상죄는 ‘피해자의 명시적인 의사’에 반하여 공소를 제기할 수 없도록 규정하여 문언상 그 처벌 여부가 ‘피해자’의 ‘명시적’인 의사에 달려 있음이 명백하므로, 乙이 甲을 대신하여 처벌불원의사를 형성하거나 결정할 수 있다고 해석하는 것은 법의 문언에 반한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=236821"},{"id":"P:236823","kind":"P","label":"2017도1807","title":"특정경제범죄가중처벌등에관한법률위반(사기)·의료법위반","court":"대법원","date":"2023.07.17","caseType":"형사","basis":"판례내용","text":"[1] 의료인 개인 명의로 개설된 의료기관이 구 의료법 제33조 제2항에서 정한 의료기관 개설자격 위반에 해당하는지 판단하는 기준 [2] 의료인 개인 명의로 개설된 의료기관의 개설자격 위반 여부에 관한 판단 기준을 의료법인 명의로 개설된 의료기관의 개설자격 위반 여부에 관한 판단에 그대로 적용할 수 있는지 여부 및 비의료인이 의료법인 명의로 개설된 의료기관에 관여하는 경우, 구 의료법 제33조 제2항에서 정한 의료기관 개설자격 위반에 해당하는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=236823"},{"id":"P:238347","kind":"P","label":"2023노979","title":"특정범죄가중처벌등에관한법률위반(절도)","court":"수원지방법원","date":"2023.07.14","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238347"},{"id":"P:238175","kind":"P","label":"2023노1373","title":"통신비밀보호법위반","court":"서울고등법원","date":"2023.07.13","caseType":"형사","basis":"판례내용","text":"피고인이 자신이 근무하는 시청 사무실에서 소속 팀장 甲과 방문자 乙의 대화 내용을 피고인의 핸드폰으로 녹음하여 통신비밀보호법 위반으로 기소된 사안에서, 甲과 乙의 대화는 통신비밀보호법 제3조 제1항에서 정하는 ‘공개되지 아니한 타인 간의 대화’에 해당하고, 피고인의 녹음 행위는 형법상 정당행위에 해당한다고 보기 어렵다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=238175"},{"id":"P:238091","kind":"P","label":"2023노59","title":"상해","court":"서울북부지방법원","date":"2023.07.13","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238091"},{"id":"P:238435","kind":"P","label":"2023노221","title":"특정범죄가중처벌등에관한법률위반(운전자폭행등)·사기","court":"대구고등법원","date":"2023.07.13","caseType":"형사","basis":"판례내용","text":"피고인이 마트 주차장 진입로에 있는 버스정류장 부근에서 서 있다가 화물차를 운전하여 위 주차장에 진입하려는 피해자로부터 비켜달라는 얘기를 듣고 말다툼을 하다가 화가 나서, 운전석 창문으로 손을 넣어 피해자의 멱살을 잡아 수회 흔들어 상해를 입게 함으로써 운전 중인 피해자를 폭행하여 상해에 이르게 하였다는 사실로 기소된 사안에서, 피고인이 피해자의 멱살을 잡아 수회 흔들어 상해를 입게 할 당시 피해자가 ‘운행 중’ 상태에 있었음이 인정되므로 위 공소사실을 유죄로 인정한 원심판결이 정당하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=238435"},{"id":"P:236931","kind":"P","label":"2023도2043","title":"살인·성폭력범죄의처벌등에관한특례법위반(특수강제추행)·특수상해·특수폭행·상습폭행·폭행[사형을 선고한 원심판결에 대해 양형부당을 주장한 사건]","court":"대법원","date":"2023.07.13","caseType":"형사","basis":"참조조문","text":"[1] 사형의 선고가 허용되는 경우 및 사형을 선고할 것인지 결정할 때 준수할 사항 / 사형의 선고가 정당화될 수 있는 특별한 사정이 있는지를 심리하는 경우, 양형조건 심사에 고려할 사항 / 구체적인 양형요소가 피고인에게 불리한 정상과 유리한 정상을 모두 포함하는 경우, 법원은 양쪽을 구체적으로 비교 확인한 결과를 종합하여 양형에 나아가야 하는지 여부 [2] 무기징역형 집행 중인 피고인이 다른 재소자들과 공모하여 피해자를 살해하였다고 기소된 사안에서, 사형의 선택기준이나 다른 유사사건과의 일반적 양형의 균형상 피고인에 대하여 사형을 선택한 원심판단에 법리오해 등의 위법이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=236931"},{"id":"P:238991","kind":"P","label":"2023도4371","title":"사기·횡령","court":"대법원","date":"2023.07.13","caseType":"형사","basis":"참조조문","text":"[1] 공판기일의 지정 및 변경에 관한 절차규정을 준수하지 않은 채로 공판기일 진행이 이루어졌으나 피고인의 방어권, 변호인의 변호권이 본질적으로 침해되지 않았다고 볼 만한 특별한 사정이 있는 경우, 판결에 영향을 미친 법령 위반에 해당하는지 여부 [2] 동일한 피해자에 대하여 단일한 범의와 동일한 방법으로 수회에 걸쳐 기망행위를 하여 금원을 편취한 경우, 사기죄의 죄수 [3] 포괄일죄의 중간에 별종의 범죄에 대한 확정판결이 끼어 있는 경우, 포괄적 범죄가 둘로 나뉘는지 여부 및 이때 그 법률적 취급","url":"https://www.law.go.kr/precInfoP.do?precSeq=238991"},{"id":"P:237903","kind":"P","label":"2023노357","title":"사기·사문서위조·위조사문서행사·주민등록법위반·범죄수익은닉의규제및처벌등에관한법률위반","court":"서울북부지방법원","date":"2023.07.13","caseType":"형사","basis":"참조조문","text":"피고인이 성명 불상의 전화금융사기 조직원의 제안을 받고 현금수거책 역할을 담당하기로 하는 등 성명 불상의 전화금융사기 조직원들과 전화금융사기 범행을 하기로 순차 공모하였다고 하여 사기죄 등으로 기소된 사안에서, 피고인은 미필적으로라도 보이스피싱 사기 범행의 위험을 용인한 채 현금수거책 역할을 수행함으로써 공동가공의 의사에 기한 기능적 행위지배를 통하여 범행을 실행하였다고 보는 것이 타당하다는 이유로, 공소사실 전부를 유죄로 인정한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=237903"},{"id":"P:241157","kind":"P","label":"2023고단126","title":"주거침입·화학물질관리법위반(환각물질흡입)·절도","court":"서울북부지방법원","date":"2023.07.12","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=241157"},{"id":"P:239415","kind":"P","label":"2022노3744","title":"공문서위조(예비적죄명:허위공문서작성)","court":"대구지방법원","date":"2023.07.12","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=239415"},{"id":"P:605579","kind":"P","label":"2023노249","title":"성폭력범죄의처벌등에관한특례법위반(강간등치상)·마약류관리에관한법률위반(향정)","court":"서울고등법원","date":"2023.07.11","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=605579"},{"id":"P:237579","kind":"P","label":"2022노4680","title":"주거침입","court":"대구지방법원","date":"2023.07.07","caseType":"형사","basis":"참조조문","text":"피고인이 피해자의 주거지 인근에 집을 신축하기 위하여 피해자에게 주거지와 연결된 진입로 사용에 대해 허락을 구하였으나 거절당하자 피해자의 주거지 마당에 차를 세워두는 방법으로 항의하기로 마음먹고, 피해자 집 앞의 시정되지 않은 진입로 출입문을 열고 승용차를 운전하여 피해자의 집 마당까지 들어온 후 승용차를 마당에 세워놓아 피해자의 주거에 침입하였다는 내용으로 기소된 사안에서, 피고인이 주차한 장소인 위 마당은 피해자 주거의 위요지라고 봄이 상당하고, 피고인은 피해자로부터 명시적·묵시적 승낙을 받지 아니한 채 주거침입의 고의를 가지고 피해자가 점유하는 위 마당에 차량을 진입하여 주차하였으므로, 이는 피해자 주거의 평온을 해하는 주거침입에 해당한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=237579"},{"id":"P:235561","kind":"P","label":"2022도13430","title":"특정범죄가중처벌등에관한법률위반(위험운전치상)·도로교통법위반(음주운전)[전동킥보드와 같은 개인형 이동장치가 구「특정범죄 가중처벌 등에 관한 법률」제5조의11 제1항의 ‘원동기장치자전거’에 해당하는지 여부가 문제된 사건]","court":"대법원","date":"2023.06.29","caseType":"형사","basis":"참조조문","text":"구 특정범죄 가중처벌 등에 관한 법률 제5조의11 제1항에서의 ‘원동기장치자전거’에 전동킥보드와 같은 개인형 이동장치가 포함되는지 여부 및 2020. 6. 9. 법률 제17371호로 개정되어 2020. 12. 10. 시행된 도로교통법이 전동킥보드와 같은 개인형 이동장치에 관한 규정을 신설하면서 이를 ‘자동차 등’이 아닌 ‘자전거 등’으로 분류한 것이 형법 제1조 제2항의 ‘범죄 후 법률이 변경되어 그 행위가 범죄를 구성하지 아니하게 된 경우’에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=235561"},{"id":"P:235563","kind":"P","label":"2023도3351","title":"야간건조물침입절도","court":"대법원","date":"2023.06.29","caseType":"형사","basis":"참조조문","text":"[1] 주거침입죄의 보호법익 / 주거침입죄의 구성요건적 행위인 ‘침입’의 의미 및 침입에 해당하는지 판단하는 기준 / 이는 건조물침입죄의 경우에도 마찬가지인지 여부 [2] 주거침입죄의 성립 요건 / 행위자 자신이 단독으로 또는 다른 사람과 공동으로 거주하거나 관리 또는 점유하는 주거, 건조물 등에 임의로 출입한 행위가 주거침입죄를 구성하는지 여부 및 다른 사람과 공동으로 주거에 거주하거나 건조물을 관리하던 사람에게 주거침입죄가 성립할 수 있는 예외적인 경우","url":"https://www.law.go.kr/precInfoP.do?precSeq=235563"},{"id":"P:235565","kind":"P","label":"2023모1007","title":"집행유예취소인용결정에대한재항고","court":"대법원","date":"2023.06.29","caseType":"형사","basis":"참조조문","text":"집행유예 선고 취소결정이 가능한 시적 한계 / 항고법원은 항고인에게 소송기록접수통지서를 발송하고 그 송달보고서를 통해 송달을 확인한 다음 항고에 관한 결정을 하여야 하는지 여부 / 집행유예의 선고 취소 사건을 심리하는 법원이 유의할 사항","url":"https://www.law.go.kr/precInfoP.do?precSeq=235565"},{"id":"P:239001","kind":"P","label":"2020도11007","title":"도시및주거환경정비법위반","court":"대법원","date":"2023.06.29","caseType":"형사","basis":"판례내용","text":"[1] 정비사업 시행과 관련한 서류 및 자료의 공개와 조합원 또는 토지 등 소유자의 열람·복사 요청에 따른 추진위원장이나 사업시행자의 의무 및 이를 위반한 경우 처벌에 관한 구 도시 및 주거환경정비법 제124조 제1항, 제4항 제2호, 제138조 제1항 제6호의 입법 취지 [2] 정비사업조합 추진위원회 위원 또는 조합 임원의 선출과 관련하여 금품, 향응 등을 제공하는 등의 행위 금지 및 처벌에 관한 구 도시 및 주거환경정비법 제21조 제4항 제1호, 제84조의2 제3호의 도입 취지와 입법 목적 / 위 제21조 제4항 제1호에서 규정하고 있는 ‘조합임원의 선출과 관련하여’의 의미","url":"https://www.law.go.kr/precInfoP.do?precSeq=239001"},{"id":"P:238999","kind":"P","label":"2018도1917","title":"업무방해","court":"대법원","date":"2023.06.29","caseType":"형사","basis":"참조조문","text":"[1] 형법 제20조에서 정한 ‘사회상규에 위배되지 아니하는 행위’의 의미 및 정당행위를 인정하기 위한 요건 / 어떠한 행위가 정당행위로서 위법성이 조각되는지 판단하는 기준 및 이때 긴급성이나 보충성의 정도는 개별 사안에 따라 다를 수 있는지 여부 [2] 어떠한 행위가 ‘범죄구성요건에 해당하지만 정당행위라는 이유로 위법성이 조각된다는 것’의 의미 [3] 개인정보 보호법 제15조 제1항 제6호의 개인정보처리자의 정당한 이익을 달성하기 위하여 필요한 경우로서 ‘명백하게 정보주체의 권리보다 우선하는 경우’에 해당하는지 판단하는 기준 [4] 근로자참여 및 협력증진에 관한 법률 제20조 제1항 제14호에서 노사협의회가 협의하여야 할 사항으로 규정한 ‘사업장 내 근로자 감시 설비의 설치’ 중 ‘근로자 감시 설비’의 의미 및 설치의 주된 목적이 근로자를 감시하기 위한 것이 아니라도 이에 해당할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=238999"},{"id":"P:239003","kind":"P","label":"2022도2070","title":"폭행","court":"대법원","date":"2023.06.29","caseType":"형사","basis":"참조조문","text":"군인 등이 대한민국의 국군이 군사작전을 수행하기 위한 근거지에서 군인 등을 폭행한 경우, 대한민국의 영토 내인지, 외국군의 군사기지인지 등과 관계없이 군형법 제60조의6 제1호에 따라 형법 제260조 제3항의 적용이 배제되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=239003"},{"id":"P:238997","kind":"P","label":"2022도16422","title":"사기·전자금융거래법위반·부동산실권리자명의등기에관한법률위반","court":"대법원","date":"2023.06.29","caseType":"형사","basis":"참조조문","text":"[1] 사기죄의 요건으로서 ‘부작위에 의한 기망’의 의미 및 이때 법률상 고지의무가 인정되는 범위 / 법률상 고지의무의 근거가 되는 거래의 내용이나 거래관행 등 거래실정에 관한 사실을 주장·증명할 책임의 소재 [2] 피고인들이 자신들의 보유 자금은 전혀 없이 오피스텔 등을 인수한 후 매매대금보다 고액인 전세보증금과 매매대금과의 차액 상당의 금원인 전세차익금을 수령하여 분배하고, 인수한 오피스텔 등의 임대차 존재 사실을 숨기고 근저당권을 설정해주는 방법으로 대출을 받아 활용할 계획이었을 뿐, 전세보증금 상당액을 변제할 자력이 없으며, 전세보증금 반환채무의 이행을 정상적으로 인수할 의사나 능력이 없었음에도 불구하고, 매도인인 피해자들에게 이와 같은 사실을 전혀 고지하지 아니한 채 정상적인 계약인 것으로 피해자들을 기망하여 오피스텔 등의 매물과 전세차익금을 편취하였다는 내용으로 기소된 사안에서, 오피스텔 등의 매수 당시 피고인들에게 전세보증금 상당액의 변제자력 등에 관한 고지의무가 있었다거나, 피해자들이 피고인들의 변제자력 등을 착오한 상태에서 임대차 목적물을 매도한 것으로 단정하기 어렵다는 이유로, 이와 달리 보아 공소사실을 유죄로 판단한 원심판단에 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=238997"},{"id":"P:239005","kind":"P","label":"2017도9835","title":"업무방해방조","court":"대법원","date":"2023.06.29","caseType":"형사","basis":"참조조문","text":"[1] 방조범에서 말하는 ‘방조’의 의미 / 방조범 성립에 필요한 인과관계 / 방조범이 성립하려면 방조행위가 정범의 범죄 실현과 밀접한 관련이 있고 정범의 범죄 실현에 현실적인 기여를 하였다고 평가할 수 있어야 하는지 여부 및 정범의 범죄 실현과 밀접한 관련이 없는 행위를 도와준 데 지나지 않는 경우, 방조범이 성립하는지 여부 [2] 쟁의행위가 업무방해죄에 해당하는 사정을 알면서 제3자가 쟁의행위의 실행을 용이하게 한 경우, 업무방해방조죄가 성립할 수 있는지 여부 / 위법한 쟁의행위에 대한 조력행위가 업무방해방조죄에 해당하는지 판단할 때 유의하여야 할 사정","url":"https://www.law.go.kr/precInfoP.do?precSeq=239005"},{"id":"P:239009","kind":"P","label":"2023도4804","title":"업무상횡령·사문서변조·변조사문서행사·사기","court":"대법원","date":"2023.06.29","caseType":"형사","basis":"참조조문","text":"형법상 문서에 관한 죄에 있어서 문서의 의미 / 컴퓨터 모니터 화면에 나타나는 이미지가 형법상 문서에 관한 죄의 ‘문서’에 해당하는지 여부 및 그 출력물이 ‘문서’에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=239009"},{"id":"P:238725","kind":"P","label":"2023노47","title":"특정경제범죄가중처벌등에관한법률위반(배임)(인정된죄명업무상배임)·업무방해","court":"대전고등법원","date":"2023.06.27","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238725"},{"id":"P:239107","kind":"P","label":"2023노376","title":"마약류관리에관한법률위반(향정)·교통사고처리특례법위반(치상)·퇴거불응","court":"서울동부지방법원","date":"2023.06.23","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=239107"},{"id":"P:235103","kind":"P","label":"2023도3038","title":"업무상횡령·근로기준법위반·근로자퇴직급여보장법위반","court":"대법원","date":"2023.06.15","caseType":"형사","basis":"판례내용","text":"[1] 형사소송법 제298조 제1항의 취지 / 공소사실의 동일성을 판단할 때 고려할 사항 [2] 법원이 공소장변경허가신청에 대한 결정을 공판정에서 고지한 경우, 그 사실은 공판조서의 필요적 기재사항인지 여부 / 공소사실 또는 적용법조의 추가·철회 또는 변경의 허가에 관한 결정의 위법이 판결에 영향을 미친 경우 불복 방법 [3] 공판조서의 증명력 / 공판조서에 기재되지 않은 소송절차의 존재가 공판조서에 기재된 다른 내용이나 공판조서 이외의 자료로 증명될 수 있는지 여부 및 이는 자유로운 증명의 대상이 되는지 여부 [4] 검사가 제1심판결에 대하여 양형부당을 이유로 항소한 다음 원심의 제1회 공판기일이 열리기 전에 먼저 기소된 업무상횡령 공소사실과 상상적 경합관계에 있는 업무상횡령 공소사실을 추가하는 취지임을 밝히며 공소장변경허가신청서를 제출하였으나, 원심이 공판정 외에서 공소장변경허가신청에 대한 결정을 하지 않았을 뿐만 아니라 공판조서 등 기록에 원심에서 공소장변경허가 여부를 결정한 소송절차가 진행되었다는 내용이 없이, 제1회 공판기일을 진행하여 변론을 종결하고 검사의 항소를 기각하여 제1심판결을 그대로 유지한 사안에서, 원심은 검사가 서면으로 제출한 공소장변경허가신청에 대하여 허가 여부를 결정해야 하고, 나아가 상상적 경합관계에 있는 수죄 가운데 당초 공소를 제기하지 아니한 공소사실을 추가하는 내용의 공소장변경을 허가하여 추가된 공소","url":"https://www.law.go.kr/precInfoP.do?precSeq=235103"},{"id":"P:235107","kind":"P","label":"2020도927","title":"폭행[주한미군의 기지에서 발생한 군인 사이의 폭행에 대하여 피해자의 처벌불원 의사가 표시된 사건]","court":"대법원","date":"2023.06.15","caseType":"형사","basis":"참조조문","text":"[1] 군인 등이 군사기지 및 군사시설 보호법 제2조 제1호에서 정한 ‘군사기지’에서 군인 등을 폭행한 경우에 폭행죄를 반의사불벌죄로 규정한 형법 제260조 제3항을 적용하지 않도록 정한 군형법 제60조의6 제1호의 취지 [2] 군인 등이 대한민국의 국군이 군사작전을 수행하기 위한 근거지에서 군인 등을 폭행한 경우, 그곳이 대한민국의 영토 내인지, 외국군의 군사기지인지 등과 관계없이 군형법 제60조의6 제1호에 따라 형법 제260조 제3항의 적용이 배제되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=235107"},{"id":"P:239947","kind":"P","label":"2022노605","title":"통신비밀보호법위반·위치정보의보호및이용등에관한법률위반·자동차수색","court":"대구고등법원","date":"2023.06.14","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=239947"},{"id":"P:237973","kind":"P","label":"2022노257","title":"아동·청소년의성보호에관한법률위반(위계등유사성행위)·아동·청소년의성보호에관한법률위반(성매수등)·아동·청소년의성보호에관한법률위반(성착취물제작·배포등)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등)·미성년자의제강간·미성년자의제유사강간·아동복지법위반(아동에대한음행강요·매개·성희롱등)·성매매알선등행위의처벌에관한법률위반(성매매)·부착명령","court":"서울고등법원춘천재판부","date":"2023.06.14","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=237973"},{"id":"P:599827","kind":"P","label":"2022고단1878","title":"산업안전보건법위반·업무상과실치사","court":"인천지방법원","date":"2023.06.07","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=599827"},{"id":"P:236049","kind":"P","label":"2022노1087","title":"과실치상","court":"서울중앙지방법원","date":"2023.06.02","caseType":"형사","basis":"참조조문","text":"피고인이 자신의 양봉원에서 키우던 개 2마리 중 소형견에게 목줄을 하지 않은 채 마음대로 돌아다니도록 방치함으로써 위 소형견이 양봉원을 방문한 손님 甲에게 달려들어 이에 놀라 바닥에 넘어진 甲에게 상해를 입게 하였다는 과실치상의 공소사실로 기소된 사안에서, 피고인에게는 양봉원에서 키우는 개들이 그곳을 방문한 손님을 위협하거나 물지 않도록 목줄을 채우는 등의 방법으로 개들에 대한 관리를 철저히 하여 사고를 미연에 방지하여야 할 주의의무가 있는 점 등 제반 사정을 종합하면, 피고인의 과실로 甲이 상해를 입었음을 인정할 수 있다는 이유로 유죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=236049"},{"id":"P:238405","kind":"P","label":"2023도3258","title":"공직선거법위반·지방공무원법위반","court":"대법원","date":"2023.06.01","caseType":"형사","basis":"참조조문","text":"[1] 지방공무원법 제3조 제2항, 지방공무원 복무규정 제8조 제2호에 따라 지방공무원법 제57조 제2항의 주체인 ‘공무원’으로 보지 않는 ‘선거에 의하여 취임한 지방자치단체의 장’의 경우에도 신분관계가 있는 다른 공무원의 범행에 가공한 경우에는 같은 법 제82조 제1항, 제57조 제2항 위반죄의 주체가 될 수 있는지 여부 [2] 자수가 인정되는 경우, 자수감경을 하지 않거나 자수감경 주장에 관한 판단을 하지 않은 것이 위법한지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=238405"},{"id":"P:237255","kind":"P","label":"2022노1130","title":"특정범죄가중처벌등에관한법률위반(도주치상)·마약류관리에관한법률위반(향정)·도로교통법위반(사고후미조치)·도로교통법위반(무면허운전)","court":"서울북부지방법원","date":"2023.05.26","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=237255"},{"id":"P:238691","kind":"P","label":"2022노2074","title":"특정범죄가중처벌등에관한법률위반(도주치사)","court":"대구지방법원","date":"2023.05.23","caseType":"형사","basis":"참조조문","text":"피고인이 승용차를 운전하다 과실로 편도 2차로 도로의 1차로와 2차로 사이에 누워 있던 피해자를 승용차의 좌측 바퀴로 역과한 후, 즉시 정차하여 피해자를 구호하는 등의 필요한 조치를 취하지 아니하고 그대로 도주함으로써 피해자를 현장에서 머리 부위 손상 등으로 사망에 이르게 하였다는 특정범죄 가중처벌 등에 관한 법률 위반의 공소사실로 기소된 사안에서, 검사가 제출한 증거들만으로는 위 사고에 관하여 피고인에게 업무상과실이 있다거나 설령 과실이 있다고 하더라도 그것과 사고 사이에 상당인과관계가 있다고 인정하기 부족하다는 이유로 피고인에게 무죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=238691"},{"id":"P:234935","kind":"P","label":"2017도2760","title":"업무방해","court":"대법원","date":"2023.05.18","caseType":"형사","basis":"참조조문","text":"[1] 형법 제20조에서 정당행위로 정한 ‘사회상규에 위배되지 아니하는 행위’를 인정하기 위한 요건 및 이러한 요건은 불가분적으로 연관되어 하나의 행위를 이루는 요소들로 종합적으로 평가되어야 하는지 여부 / 사회상규에 의한 정당행위의 요건을 판단하는 기준 및 이때 행위의 긴급성과 보충성은 ‘일체의 법률적인 적법한 수단이 존재하지 않을 것’을 의미하는지 여부 [2] 甲 대학교는 학교법인의 전 이사장 乙이 부정입학과 관련된 금품수수 등의 혐의로 구속되었다가 甲 대학교 총장으로 선임됨에 따라 학내 갈등을 빚던 중, 총학생회 간부인 피고인들이 총장 乙과의 면담을 요구하면서 총장실 입구에서 진입을 시도하거나, 교무위원회 회의실에 들어가 총장의 사퇴를 요구하면서 이를 막는 학교 교직원들과 실랑이를 벌임으로써 위력으로 업무를 방해하였다는 내용으로 기소된 사안에서, 행위의 목적 및 경위 등에 비추어 보면, 피고인들이 분쟁의 중심에 있는 乙을 직접 찾아가 면담하는 이외에는 다른 방도가 없다는 판단 아래 乙과 면담을 추진하는 과정에서 피고인들을 막아서는 사람들과 길지 않은 시간 동안 실랑이를 벌인 것은 사회상규에 위배되지 아니하는 정당행위에 해당한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=234935"},{"id":"P:238413","kind":"P","label":"2023도3023","title":"특수공갈미수","court":"대법원","date":"2023.05.18","caseType":"형사","basis":"참조조문","text":"형법 제37조 후단의 경합범에 해당하는 경우, 형법 제39조 제1항에 의하여 판결을 받지 아니한 죄와 판결이 확정된 죄를 동시에 판결할 경우와 형평을 고려하여 그 죄에 대하여 형을 선고하여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=238413"},{"id":"P:238411","kind":"P","label":"2023도3549","title":"스토킹범죄의처벌등에관한법률위반","court":"대법원","date":"2023.05.18","caseType":"형사","basis":"참조조문","text":"[1] 죄가 되지 않던 행위를 구성요건의 신설로 포괄일죄의 처벌대상으로 삼는 경우, 신설된 포괄일죄의 처벌법규가 시행되기 이전의 행위에 대하여 신설된 법규를 적용하여 처벌할 수 있는지 여부 [2] 피고인이 2018. 12.경부터 2021. 10. 30.경까지 일주일에 1회 가량 피해자 운영 미용실에 찾아가 내부를 관찰하거나 사진을 찍는 등의 방법으로 지속적 또는 반복적으로 스토킹행위를 하여 스토킹범죄의 처벌 등에 관한 법률 위반죄로 기소된 사안에서, 스토킹범죄의 처벌 등에 관한 법률 시행 후인 2021. 10. 21.부터 같은 달 30일경까지 사이에 일주일에 1회 가량 있었던 스토킹행위만이 스토킹범죄의 처벌 등에 관한 법률의 처벌 대상이 될 수 있는데, 스토킹범죄의 처벌 등에 관한 법률 시행 전의 행위를 포함하고 있는 공소사실에 대하여 스토킹범죄의 처벌 등에 관한 법률을 적용하여 유죄로 본 원심판단에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=238411"},{"id":"P:234933","kind":"P","label":"2022도12037","title":"스토킹범죄의처벌등에관한법률위반·정보통신망이용촉진및정보보호등에관한법률위반","court":"대법원","date":"2023.05.18","caseType":"형사","basis":"판례내용","text":"[1] 전화를 걸어 상대방의 휴대전화에 벨소리가 울리게 하거나 부재중 전화 문구 등이 표시되도록 하여 상대방에게 불안감이나 공포심을 일으키는 행위가 실제 전화통화가 이루어졌는지와 상관없이 스토킹범죄의 처벌 등에 관한 법률 제2조 제1호 목에서 정한 스토킹행위에 해당하는지 여부 [2] 상대방의 의사에 반하여 정당한 이유 없이 전화를 걸어 상대방과 전화통화를 하여 말을 도달하게 한 경우, 전화통화 내용이 불안감 또는 공포심을 일으키는 것이었음이 밝혀지지 않더라도 스토킹범죄의 처벌 등에 관한 법률 제2조 제1호 목 스토킹행위에 해당할 수 있는지 여부 / 상대방과 전화통화 당시 아무런 말을 하지 않아 ‘말을 도달하게 하는 행위’에 해당하지 않더라도 위 조항 스토킹행위에 해당할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=234933"},{"id":"P:234803","kind":"P","label":"2022도10961","title":"농수산물의원산지표시등에관한법률위반","court":"대법원","date":"2023.05.18","caseType":"형사","basis":"참조조문","text":"[1] 형벌법규의 해석 방법 / 죄형법정주의에서 파생되는 ‘명확성의 원칙’의 의미 및 법규범이 명확성의 원칙에 위배되는지 판단하는 기준 [2] 구 농수산물의 원산지 표시에 관한 법률 제14조 제2항에서 정한 ‘제1항의 죄로 형을 선고받고 그 형이 확정된 후’의 의미 및 이때 확정된 벌금형에는 공판절차에서 형을 선고받아 확정된 경우뿐만 아니라 약식절차에서 벌금형의 약식명령을 고지받아 확정된 경우까지 포함되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=234803"},{"id":"P:608337","kind":"P","label":"2022노921","title":"교통사고처리특례법위반(치사)","court":"제주지방법원","date":"2023.05.16","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=608337"},{"id":"P:234929","kind":"P","label":"2017다35588","title":"부당이득금반환·부당이득금","court":"대법원","date":"2023.05.11","caseType":"민사","basis":"판례내용","text":"사용자가 취업규칙을 근로자에게 불리하게 변경하면서 근로자의 집단적 의사결정방법에 따른 동의를 받지 못한 경우, 해당 취업규칙의 작성 또는 변경에 사회통념상 합리성이 있다는 이유만으로 유효성을 인정할 수 있는지 여부 / 노동조합이나 근로자들이 집단적 동의권을 남용하였다고 볼 만한 특별한 사정이 있는 경우에는 그 동의가 없더라도 취업규칙의 불이익변경을 유효하다고 볼 수 있는지 여부 및 ‘노동조합이나 근로자들이 집단적 동의권을 남용한 경우’의 의미 / 집단적 동의권 남용에 해당하는지에 대하여 법원이 직권으로 판단할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=234929"},{"id":"P:240117","kind":"P","label":"2022고합104","title":"특정범죄가중처벌등에관한법률위반(뇌물)·사기·부패방지및국민권익위원회의설치와운영에관한법률위반·뇌물공여","court":"대구지방법원포항지원","date":"2023.05.09","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=240117"},{"id":"P:237599","kind":"P","label":"2022노930","title":"뇌물수수·뇌물공여·직권남용권리행사방해·부정청탁및금품등수수의금지에관한법률위반","court":"수원고등법원","date":"2023.05.04","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=237599"},{"id":"P:237257","kind":"P","label":"2022노1073","title":"폭력행위등처벌에관한법률위반(공동폭행)·정보통신망이용촉진및정보보호등에관한법률위반(명예훼손)·공갈미수","court":"제주지방법원","date":"2023.04.27","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=237257"},{"id":"P:234711","kind":"P","label":"2020도16431","title":"노동조합및노동관계조정법위반·근로기준법위반·남녀고용평등과일·가정양립지원에관한법률위반","court":"대법원","date":"2023.04.27","caseType":"형사","basis":"참조조문","text":"[1] 구 근로기준법 제51조 제1항에서 정한 탄력적 근로시간제는 취업규칙에 의하여만 도입이 가능한지 여부 및 근로계약이나 근로자의 개별적 동의를 통하여 도입할 수 없도록 한 취지 [2] 임금 등 지급의무의 존부와 범위에 관하여 다툴 만한 근거가 있는 경우, 사용자에게 구 근로기준법 제109조 제1항, 제36조, 제43조 제2항 위반의 고의를 인정할 수 있는지 여부 / 임금 등 지급의무의 존부와 범위에 관하여 다툴 만한 근거가 있는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=234711"},{"id":"P:234709","kind":"P","label":"2020도6874","title":"폭행[정당방위의 침해의 현재성 판단 기준이 문제된 사건]","court":"대법원","date":"2023.04.27","caseType":"형사","basis":"참조조문","text":"정당방위의 요건 중 ‘침해의 현재성’의 의미 및 일련의 연속되는 행위로 인해 침해상황이 중단되지 아니하거나 일시 중단되더라도 추가 침해가 곧바로 발생할 객관적인 사유가 있는 경우, 그중 일부 행위가 범죄의 기수에 이르렀더라도 침해의 현재성이 인정되는지 여부 / 정당방위의 방어행위에 순수한 수비적 방어뿐 아니라 적극적 반격을 포함하는 반격방어의 형태도 포함되는지 여부 및 방위행위가 상당한 것인지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=234709"},{"id":"P:237897","kind":"P","label":"2022노3253","title":"특정경제범죄가중처벌등에관한법률위반(배임)·특정경제범죄가중처벌등에관한법률위반(사기)·범죄수익은닉의규제및처벌등에관한법률위반·사전자기록등위작·위작사전자기록등행사·사문서위조·위조사문서행사","court":"서울고등법원","date":"2023.04.27","caseType":"형사","basis":"참조조문","text":"피해자 甲 은행의 직원인 피고인이 고객들 명의의 거래신청서 등을 위조하여 甲 은행의 전산시스템에 접속한 다음 허위 대출을 실행하는 방법으로 대출금을 편취하고, 편취금 중 상당 부분을 참가인 乙의 계좌로 송금하여 乙로 하여금 인터넷 도박사이트에서 베팅하도록 요청하는 한편 피고인의 가족 명의 계좌로 이체하여 범죄수익을 은닉하였다는 내용의 공소사실이 제1심에서 유죄로 인정되었는데, 제1심이 부패재산의 몰수 및 회복에 관한 특례법에 따라 추징 대상 범죄피해재산 중 일부를 피고인에게, 나머지 일부를 乙에게 추징을 명하자, 乙이 위 추징 부분에 위법이 있다는 이유로 항소한 사안에서, 乙의 항소를 기각한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=237897"},{"id":"P:615835","kind":"P","label":"2022노1060","title":"사기·사기미수","court":"의정부지방법원","date":"2023.04.27","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=615835"},{"id":"P:238011","kind":"P","label":"2022고합95","title":"산업안전보건법위반·업무상과실치사·중대재해처벌등에관한법률위반(산업재해치사)","court":"창원지방법원마산지원","date":"2023.04.26","caseType":"형사","basis":"참조조문","text":"피고인 甲 주식회사의 대표이사로서 경영책임자이자 안전보건총괄책임자인 피고인 乙이, 산업재해 및 건강장해를 예방하기 위하여 필요한 안전조치와 보건조치를 하지 아니함으로써 피고인 甲 회사와 도급계약을 체결한 관계수급인인 丙 사업체 소속 근로자 丁이 피고인 甲 회사의 야외작업장에서 중량물 취급 작업인 철제 방열판 보수 작업을 하던 중 크레인 섬유벨트가 끊어지고 방열판이 낙하하면서 丁을 덮쳐 사망에 이르게 함과 동시에, 재해예방에 필요한 안전보건관리체계의 구축 및 그 이행에 관한 조치를 하지 아니하여 사업장의 종사자 丁이 사망하는 중대산업재해에 이르게 하였다고 하여 산업안전보건법 위반 및 중대재해 처벌 등에 관한 법률 위반으로 기소된 사안에서, 피고인들에게 유죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=238011"},{"id":"P:237573","kind":"P","label":"2023노150","title":"마약류관리에관한법률위반(마약)·마약류관리에관한법률위반(향정)","court":"서울고등법원","date":"2023.04.21","caseType":"형사","basis":"판례내용","text":"피고인에 대한 마약류 관리에 관한 법률 위반의 공소사실과 관련하여, 피고인은 당초 ‘甲으로부터 마약을 수수·사용하였다.’는 범죄혐의사실로 발부된 압수·수색영장에 의해 자신의 주거지에서 휴대전화가 압수된 후 수사기관에서 경찰관 乙로부터 조사를 받았는데, 당시 같은 사무실에 있던 경찰관 丙이 피고인의 휴대전화를 탐색하여 영장 기재 혐의사실과 관련된 전자정보 외에 ‘피고인이 丁, 戊, 己와 향정신성의약품을 수수하였다.’는 범죄사실과 관련하여 주고받은 메시지도 추출하여 이를 증거로 제출하였고, 피고인은 법정에서 범행을 모두 자백한 사안에서, 공소사실 중 甲, 戊, 己 관련 부분을 유죄로, 丁 관련 부분을 무죄로 판단한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=237573"},{"id":"P:238845","kind":"P","label":"2022고단2451","title":"사기·배상명령신청","court":"대전지방법원천안지원","date":"2023.04.20","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238845"},{"id":"P:238353","kind":"P","label":"2023고단1002","title":"특정범죄가중처벌등에관한법률위반(절도)","court":"수원지방법원","date":"2023.04.20","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238353"},{"id":"P:237609","kind":"P","label":"2022노3228","title":"정보통신망이용촉진및정보보호등에관한법률위반·폭행","court":"대구지방법원","date":"2023.04.20","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=237609"},{"id":"P:241729","kind":"P","label":"2022고단2850","title":"스토킹범죄의처벌등에관한법률위반","court":"창원지방법원","date":"2023.04.19","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=241729"},{"id":"P:234621","kind":"P","label":"2023재고단3","title":"도로교통법위반(음주운전)","court":"대구지방법원포항지원","date":"2023.04.18","caseType":"형사","basis":"판례내용","text":"음주운전 전력이 있는 피고인이 술에 취한 상태로 자동차를 운전하여 음주운전 금지규정을 2회 이상 위반하였다는 공소사실에 대하여 구 도로교통법 제148조의2 제1항, 제44조 제1항을 적용하여 피고인에게 징역 1년과 집행유예 2년을 선고한 원판결이 확정되었는데, 그 후 헌법재판소가 구 도로교통법 제148조의2 제1항 중 ‘제44조 제1항을 2회 이상 위반한 사람’에 관한 부분에 대하여 위헌결정을 선고함에 따라 재심대상판결에 대한 재심이 개시된 사안에서, 재심판결의 효력발생일은 재심대상판결의 확정일로 해석하여야 한다는 이유로, 피고인에게 도로교통법 제148조의2 제3항 제2호, 제44조 제1항을 적용하여 징역 10월을 선고하면서 재심대상판결 확정일부터 2년간 형의 집행을 유예한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=234621"},{"id":"P:238825","kind":"P","label":"2022고합116-1","title":"특정경제범죄가중처벌등에관한법률위반(사기)·사기·배상명령신청","court":"대전지방법원천안지원","date":"2023.04.17","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238825"},{"id":"P:234599","kind":"P","label":"2023도162","title":"성폭력범죄의처벌등에관한특례법위반(주거침입강제추행)","court":"대법원","date":"2023.04.13","caseType":"형사","basis":"참조조문","text":"피고인이 모텔 객실에 침입한 후 불을 끈 상태로 침대에 누워 있던 甲의 가슴 등을 만져 甲을 강제추행하였다는 성폭력범죄의 처벌 등에 관한 특례법 위반의 공소사실에 대하여, 원심이 같은 법 제3조 제1항, 형법 제319조 제1항, 제298조를 적용하여 유죄로 인정하였는데, 원심판결 선고 후 헌법재판소가 성폭력범죄의 처벌 등에 관한 특례법 제3조 제1항 중 ‘형법 제319조 제1항의 죄를 범한 사람이 같은 법 제298조 등의 죄를 범한 경우에는 무기징역 또는 7년 이상의 징역에 처한다.’는 부분에 대하여 위헌결정을 선고한 사안에서, 위 법률조항 부분은 소급하여 효력을 상실하였으므로 원심판결은 그대로 유지될 수 없게 되었다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=234599"},{"id":"P:237209","kind":"P","label":"2022노3389","title":"성폭력범죄의처벌등에관한특례법위반(촬영물등이용협박)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영)·협박·폭행","court":"서울고등법원","date":"2023.04.13","caseType":"형사","basis":"참조조문","text":"피고인이 甲의 휴대전화에서 甲이 이전 남자친구와 주고받은 카카오톡 대화방에 올린 甲의 나체 사진·동영상을 발견하고 카카오톡 전달기능을 이용하여 피고인과 甲의 카카오톡 대화방으로 이를 전송하여 보관함으로써 甲이 자신의 신체를 직접 촬영한 촬영물을 甲의 의사에 반하여 소지하였다고 하여 성폭력범죄의 처벌 등에 관한 특례법 제14조 제4항 위반으로 기소된 사안에서, 위 촬영물은 촬영 및 최초 업로드가 甲의 의사에 반하였다고 보이지 않고, 이후 피고인이 이를 전송한 행위는 ‘반포’나 ‘제공’ 어느 행위에도 해당하지 않으므로, 위 촬영물이 같은 조 제1항 또는 제2항의 행위에 의하여 생성된 것으로 볼 수 없어 같은 조 제4항에서 정한 소지 등의 대상에 해당하지 않는다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=237209"},{"id":"P:619417","kind":"P","label":"2022노329","title":"폭행","court":"의정부지방법원","date":"2023.04.07","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619417"},{"id":"P:608235","kind":"P","label":"2020노968","title":"개인정보보호법위반","court":"춘천지방법원","date":"2023.04.07","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=608235"},{"id":"P:240607","kind":"P","label":"2022고합263","title":"성폭력범죄의처벌등에관한특례법위반(친족관계에의한강간)·아동복지법위반(아동학대)·아동복지법위반(아동에대한음행강요·매개·성희롱등)·성폭력범죄의처벌등에관한특례법위반(13세미만미성년자유사성행위)·부착명령","court":"창원지방법원","date":"2023.04.06","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=240607"},{"id":"P:235923","kind":"P","label":"2022노3129","title":"문화재보호법위반","court":"대구지방법원","date":"2023.03.30","caseType":"형사","basis":"참조조문","text":"피고인이 역사문화환경 보존지역 내 자신의 농작물을 보호할 필요성이 있다는 이유로 문화재청장의 허가를 받지 아니하고 담장을 설치함으로써 역사문화환경 보존지역에서 해당 국가지정문화재의 경관을 저해할 우려가 있는 시설물을 설치하는 등 국가지정문화재의 보존에 영향을 미칠 우려가 있는 행위를 하였다고 하여 문화재보호법 위반으로 기소된 사안에서, 피고인이 축조한 담장과 같은 공작물은 같은 법 시행령 제21조의2 제2항 제1호 목에서 정한 시설물에 해당하여 그 설치를 위하여 문화재청장의 허가가 필요하므로, 피고인이 허가 없이 담장을 설치한 행위는 같은 법 제35조 제1항 제2호를 위반하는 행위로서 정당행위나 긴급피난 또는 자력구제에 해당하지 않는다는 이유로, 공소사실을 유죄로 인정한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=235923"},{"id":"P:234443","kind":"P","label":"2019도7446","title":"업무방해[업무방해의 위력 여부가 문제된 사건]","court":"대법원","date":"2023.03.30","caseType":"형사","basis":"참조조문","text":"[1] 업무방해죄에서 말하는 ‘위력’의 의미 / 어떤 행위의 결과 상대방의 업무에 지장이 초래되었더라도 행위자가 상대방의 의사결정에 관여할 수 있는 권한을 가지고 있거나 업무상의 지시를 할 수 있는 지위에 있는 경우, 위력을 행사한 것인지 여부 / 업무방해죄의 성립에 업무방해의 결과가 실제로 발생할 것을 요하지 아니하지만 업무방해의 결과를 초래할 위험은 발생하여야 하는지 여부 [2] 甲 고등학교의 교장인 피고인이 신입생 입학 사정회의 과정에서 면접위원인 피해자들에게 \"참 선생님들이 말을 안 듣네. 중학교는 이 정도면 교장 선생님한테 권한을 줘서 끝내는데. 왜 그러는 거죠?\" 등 특정 학생을 합격시키라는 취지의 발언을 하여 특정 학생의 면접 점수를 상향시켜 신입생으로 선발되도록 함으로써 위력으로 피해자들의 신입생 면접 업무를 방해하였다는 내용으로 기소된 사안에서, 제반 사정을 종합하면, 피고인은 학교 교장이자 학교입학전형위원회 위원장으로서 위 사정회의에 참석하여 자신의 의견을 밝힌 후 계속하여 논의가 길어지자 발언을 한 것인바, 그 발언에 다소 과도한 표현이 사용되었더라도 위력을 행사하였다고 단정하기 어렵고, 그로 인하여 피해자들의 신입생 면접 업무가 방해될 위험이 발생하였다고 보기도 어렵다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=234443"},{"id":"P:239113","kind":"P","label":"2022고단2436","title":"마약류관리에관한법률위반(향정)·교통사고처리특례법위반(치상)·퇴거불응·교통사고처리특례법위반(치상)·퇴거불응","court":"서울동부지방법원","date":"2023.03.29","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=239113"},{"id":"P:239399","kind":"P","label":"2022고단3782","title":"스토킹범죄의처벌등에관한법률위반","court":"서울중앙지방법원","date":"2023.03.28","caseType":"형사","basis":"판례내용","text":"피해자가 운영하는 스포츠시설의 회원인 피고인이 피해자의 생일을 몰래 축하해 주고 싶다는 이유로 휴대전화 번호를 새로 개설하여 자신의 인적사항을 밝히지 않은 채 새벽에 피해자에게 문자메시지를 보냈고, 며칠 후 새벽에 다시 문자메시지를 보내며 여성 속옷 세트를 위 스포츠시설로 배달함으로써 피해자에게 불안감 또는 공포심을 일으키는 스토킹행위를 지속적 또는 반복적으로 하였다는 공소사실로 기소된 사안에서, 제반 사정을 종합하면 피고인이 피해자의 의사에 반하여 정당한 이유 없이 스토킹행위를 하였음을 인정할 수 있고, 스토킹범죄의 처벌 등에 관한 법률 제2조 제2호에서 정한 반복성 요건을 충족하였으며, 피고인에게 미필적으로나마 고의를 인정할 수 있다는 이유로, 피고인에게 유죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=239399"},{"id":"P:234401","kind":"P","label":"2021도16482","title":"명예훼손·업무방해·폭행","court":"대법원","date":"2023.03.16","caseType":"형사","basis":"참조조문","text":"[1] 업무방해죄의 보호대상이 되는 ‘업무’의 의미와 판단 기준 / 업무의 개시나 수행과정에 실체상 또는 절차상의 하자가 있더라도 그 정도가 반사회성을 띠는 데까지 이르지 아니한 경우, 업무방해죄의 보호대상이 되는지 여부 [2] 의료인이나 의료법인이 아닌 자가 의료기관을 개설하여 운영하는 행위가 업무방해죄의 보호대상이 되는 업무에 해당하는지 여부 / 무자격자에 의해 개설된 의료기관에 고용된 의료인의 진료 업무가 업무방해죄의 보호대상이 되는 업무인지 판단하는 기준 [3] 의료인인 甲의 명의로 의료인이 아닌 乙이 개설하여 운영하는 丙 병원에서, 피고인이 11회에 걸쳐 큰 소리를 지르거나 환자 진료 예약이 있는 甲을 붙잡고 있는 등의 방법으로 위력으로써 甲의 진료 업무를 방해하였다는 내용으로 기소된 사안에서, 피고인이 丙 병원의 일반적인 운영 외에 甲의 진료행위를 방해한 것인지에 대해 더 세밀하게 심리하여 업무방해죄 성립 여부를 판단하였어야 함에도, 원심이 丙 병원의 운영에 관한 업무가 업무방해죄의 보호대상이 되는 업무에 해당하지 않는다는 전제에서 甲의 진료행위도 丙 병원의 운영에 관한 업무에 포함되어 별개의 보호가치 있는 업무로 볼 수 없다고 단정한 것에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=234401"},{"id":"P:234321","kind":"P","label":"2021도3652","title":"위계공무집행방해·출입국관리법위반","court":"대법원","date":"2023.03.13","caseType":"형사","basis":"참조조문","text":"[1] 체약국에 구체적인 요건을 충족한 난민에 대하여 형벌을 과하지 아니할 것을 직접적으로 요구하는 ‘난민의 지위에 관한 협약’ 제31조 제1호가 위 협약에 가입하고 이를 비준한 우리나라 형사재판에서 형 면제의 근거조항이 되는지 여부 / 이때 형 면제 대상이 되는 ‘불법으로 입국하는 것’의 의미 및 출입국관리법에 따른 입국허가·사증 등을 받지 아니한 채 불법적으로 입국하거나 불법적인 방법으로 입국허가·사증 등을 받아 입국함으로써 해당 절차 관련 출입국관리법 위반죄를 구성하는 행위는 물론 이를 구성요건으로 하는 형법상 범죄행위도 이에 포함되는지 여부 [2] 외국인인 피고인이 사실은 대한민국에 입국 후 난민신청을 할 계획이었음에도 사업 목적으로 초청된 것처럼 가장하여 사증을 발급받아 입국함으로써 위계로 대한민국 대사관 소속 사증발급 공무원의 정당한 직무집행을 방해함과 동시에 거짓으로 사증을 신청하여 출입국관리법을 위반하였다는 내용으로 기소된 사안에서, 피고인은 ‘난민의 지위에 관한 협약’ 제31조 제1호의 요건을 갖추었다는 이유로, 피고인에 대하여 구 출입국관리법 제94조 제3호, 제7조의2 제2호 및 형법 제137조에서 정한 형을 면제하는 판결을 선고한 원심의 조치가 정당하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=234321"},{"id":"P:234335","kind":"P","label":"2022도16120","title":"실화[담배꽁초를 버린 공동의 과실이 경합되어 공장에 화재가 발생한 경우 각자 실화죄의 책임을 부담하는지 문제된 사안]","court":"대법원","date":"2023.03.09","caseType":"형사","basis":"참조조문","text":"[1] 형법상 부작위범의 성립 요건 / 실화죄에 있어서 공동의 과실이 경합되어 화재가 발생한 경우, 적어도 각 과실이 화재의 발생에 대하여 하나의 조건이 된 이상 그 공동적 원인을 제공한 사람들은 각자 실화죄의 책임을 지는지 여부 [2] 피고인들이 분리수거장 방향으로 담배꽁초를 던져 버리고 현장을 떠난 후 화재가 발생하여 각각 실화죄로 기소된 사안에서, 피고인들 각자의 실화죄 책임을 인정한 원심판결을 수긍한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=234335"},{"id":"P:233983","kind":"P","label":"2021모3227","title":"재판의집행에관한이의기각결정에대한재항고","court":"대법원","date":"2023.02.23","caseType":"형사","basis":"참조조문","text":"추징형의 집행을 채권에 대한 강제집행의 방법으로 하는 경우, 추징형의 시효중단 효력이 발생하는 시기 / 수형자의 재산이라고 추정되는 채권에 대하여 압류신청을 하였으나 집행불능이 된 경우 또는 채권압류가 집행된 후 해당 채권에 대한 압류가 취소된 경우, 이미 발생한 시효중단 효력이 소멸하는지 여부 / 채권에 대한 압류의 효력이 존속하는 기간 및 채권압류의 집행으로 압류의 효력이 유지되고 있는 동안에는 추징형의 집행이 계속되고 있는지 여부 / 피압류채권이 법률상 압류금지채권에 해당하더라도 즉시항고에 의하여 취소되기 전까지는 추징형의 집행이 계속되고 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=233983"},{"id":"P:233981","kind":"P","label":"2022도4610","title":"변호사법위반[개인파산사건 및 개인회생사건 신청 대리가 법무사의 업무로 추가된 법무사법 개정이 형법 제1조 제2항 및 형사소송법 제326조 제4호가 적용되는 사안에 해당하는지에 관한 사건]","court":"대법원","date":"2023.02.23","caseType":"형사","basis":"참조조문","text":"[1] 범죄의 성립과 처벌에 관하여 규정한 형벌법규 자체 또는 그로부터 수권 내지 위임을 받은 법령의 변경에 따라 범죄를 구성하지 아니하게 되거나 형이 가벼워진 경우, 원칙적으로 형법 제1조 제2항과 형사소송법 제326조 제4호가 적용되는지 여부 / 해당 형벌법규 자체 또는 그로부터 수권 내지 위임을 받은 법령이 아닌 다른 법령이 변경된 경우에 형법 제1조 제2항과 형사소송법 제326조 제4호를 적용하려면, 해당 형벌법규에 따른 범죄의 성립 및 처벌과 직접적으로 관련된 형사법적 관점의 변화를 주된 근거로 하는 법령의 변경에 해당하여야 하는지 여부 및 그러한 법령 변경에 해당하는지 판단하는 기준 [2] 법무사인 피고인이 개인파산·회생사건 관련 법률사무를 위임받아 취급하여 변호사법 제109조 제1호 위반으로 기소되었는데, 범행 이후인 2020. 2. 4. 개정된 법무사법 제2조 제1항 제6호에 의하여 ‘개인의 파산사건 및 개인회생사건 신청의 대리’가 법무사의 업무로 추가된 사안에서, 위 법무사법 개정은 범죄사실의 해당 형벌법규 자체인 변호사법 제109조 제1호 또는 그로부터 수권 내지 위임을 받은 법령이 아닌 별개의 다른 법령의 개정에 불과하고, 변호사법 제109조 제1호 위반죄의 성립 요건과 구조를 살펴보더라도 법무사법 제2조의 규정이 보충규범으로서 기능하고 있다고 보기 어려운 점 등을 종합하면, 위 법무사법 개정은 형사법적 관점의 변","url":"https://www.law.go.kr/precInfoP.do?precSeq=233981"},{"id":"P:601907","kind":"P","label":"2020고합621","title":"특정경제범죄가중처벌등에관한법률위반(횡령)·특정경제범죄가중처벌등에관한법률위반(배임)·강제집행면탈·예금자보호법위반","court":"서울중앙지방법원","date":"2023.02.15","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=601907"},{"id":"P:608411","kind":"P","label":"2021노2102","title":"개인정보보호법위반","court":"대전지방법원","date":"2023.02.15","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=608411"},{"id":"P:624521","kind":"P","label":"2021노2884","title":"업무상과실치상","court":"의정부지방법원","date":"2023.02.14","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=624521"},{"id":"P:238497","kind":"P","label":"2022노848","title":"장애인차별금지및권리구제등에관한법률위반·부동산실권리자명의등기에관한법률위반·사문서위조·위조사문서행사","court":"서울북부지방법원","date":"2023.02.14","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238497"},{"id":"P:236907","kind":"P","label":"2022노354","title":"야간건조물침입절도","court":"서울중앙지방법원","date":"2023.02.09","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=236907"},{"id":"P:238499","kind":"P","label":"2021노373","title":"부정청탁및금품등수수의금지에관한법률위반·물가안정에관한법률위반","court":"부산고등법원창원재판부","date":"2023.02.08","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238499"},{"id":"P:239117","kind":"P","label":"2021고합43","title":"사기[일부인정된죄명:특정경제범죄가중처벌등에관한법률위반(사기)]·도로교통법위반(무면허운전)","court":"춘천지방법원원주지원","date":"2023.02.06","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=239117"},{"id":"P:238235","kind":"P","label":"2022도5940","title":"업무방해·특수건조물침입","court":"대법원","date":"2023.02.02","caseType":"형사","basis":"참조조문","text":"[1] 건조물침입죄의 보호법익 및 관리자가 건조물을 사실상 점유·관리하는 경우, 사법상 권리자라 하더라도 정당한 절차에 의하지 아니하고 건조물에 침입한 때에는 건조물침입죄가 성립하는지 여부 / 침입 당시 관리자가 건조물을 사실상 점유·관리하여 그에 따른 ‘사실상 평온’을 누리고 있었는지 판단하는 방법 [2] 업무방해죄의 보호대상이 되는 ‘업무’의 의미 및 법률상 보호할 가치가 있는 업무인지 판단하는 기준 / 업무의 개시나 수행과정에 실체상 또는 절차상 하자가 있더라도 그 정도가 반사회성을 띠거나 그와 동등한 평가를 받을 수밖에 없는 경우에 이르지 아니한 경우, 업무방해죄의 보호대상이 되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=238235"},{"id":"P:238233","kind":"P","label":"2022도6643","title":"도로교통법위반(음주운전)","court":"대법원","date":"2023.02.02","caseType":"형사","basis":"참조조문","text":"[1] 범죄의 성립과 처벌에 관하여 규정한 형벌법규 자체의 변경에 따라 범죄를 구성하지 아니하게 되거나 형이 가벼워진 경우, 종전 법령이 범죄로 정하여 처벌한 것이 부당하였다거나 과형이 과중하였다는 반성적 고려에 따라 변경된 것인지를 따지지 않고 원칙적으로 형법 제1조 제2항과 형사소송법 제326조 제4호가 적용되는지 여부 [2] 피고인이 술에 취한 상태로 개인형 이동장치인 전동킥보드를 운전하여 도로교통법 위반으로 기소된 사안에서, 피고인에 대하여 행위 당시의 법률인 구 도로교통법 제148조의2 제3항 제2호를 적용하지 아니하고, 그 후 형벌법규 자체의 변경으로 인하여 형이 가벼워진 법률 개정을 반영하여 형법 제1조 제2항에 따라 제156조 제11호을 적용하여 유죄로 인정한 원심판단을 수긍한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=238233"},{"id":"P:240121","kind":"P","label":"2022고합70","title":"상해(인정된죄명:강간상해)","court":"제주지방법원","date":"2023.02.02","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=240121"},{"id":"P:233885","kind":"P","label":"2022어48","title":"불처분결정에대한재항고","court":"대법원","date":"2023.02.02","caseType":"형사","basis":"참조조문","text":"노인에 대한 폭행 또는 상해 금지규정 위반으로 인한 노인복지법 위반죄가 노인에 대한 형법상 폭행죄 및 상해죄를 가중처벌하기 위한 것인지 여부 / 노인에 대한 폭행 또는 상해 금지규정 위반으로 인한 노인복지법 위반죄는 가정폭력범죄의 처벌 등에 관한 특례법 제2조 제3호 목에서 정한 형법 제260조 제1항의 폭행죄 또는 형법 제257조 제1항의 상해죄가 ‘다른 법률에 따라 가중처벌되는 죄’로서 가정폭력범죄의 처벌 등에 관한 특례법 제2조 제3호 목에 해당하여 가정보호사건의 대상이 되는 ‘가정폭력범죄’에 포함되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=233885"},{"id":"P:233887","kind":"P","label":"2022도4719","title":"모욕[시각적 수단을 사용한 표현행위에 의한 모욕죄 성립 여부]","court":"대법원","date":"2023.02.02","caseType":"형사","basis":"참조조문","text":"[1] 모욕죄의 보호법익 및 ‘모욕’의 의미 / 상대방의 인격적 가치에 대한 사회적 평가를 저하시킬 만한 것이 아닌 표현이 다소 무례한 방법으로 표시된 경우, 모욕죄의 구성요건에 해당하는지 여부 [2] 언어적 수단이 아닌 비언어적·시각적 수단만을 사용한 표현이라도 사람의 사회적 평가를 저하시킬 만한 추상적 판단이나 경멸적 감정을 전달하는 것인 경우, 모욕죄가 성립하는지 여부 [3] 피고인이 자신의 유튜브 채널에 甲의 방송 영상을 게시하면서 甲의 얼굴에 ‘개’ 얼굴을 합성하는 방법으로 甲을 모욕하였다는 내용으로 기소된 사안에서, 영상의 전체적인 내용을 살펴볼 때, 피고인이 甲의 얼굴을 가리는 용도로 동물 그림을 사용하면서 甲에 대한 부정적인 감정을 다소 해학적으로 표현하려 한 것에 불과하다고 볼 여지도 상당하므로, 해당 영상이 甲을 불쾌하게 할 수 있는 표현이기는 하지만 객관적으로 甲의 인격적 가치에 대한 사회적 평가를 저하시킬 만한 모욕적 표현을 한 경우에 해당한다고 단정하기 어렵다고 본 원심판단을 수긍한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=233887"},{"id":"P:233889","kind":"P","label":"2022도13425","title":"명예훼손[명예훼손죄에 관한 위법성조각사유의 해석에 대한 사건]","court":"대법원","date":"2023.02.02","caseType":"형사","basis":"참조조문","text":"[1] 형법 제310조에서 정한 위법성조각사유의 요건 중 ‘진실한 사실’ 및 ‘오로지 공공의 이익에 관한 때’의 의미 / 적시된 사실이 ‘공공의 이익’에 관한 것인지 판단하는 기준 / 행위자의 주요한 동기나 목적인 공공의 이익에 부수적으로 다른 사익적 목적이나 동기가 내포되어 있는 경우, 형법 제310조의 적용 여부 [2] 사실적시의 내용이 사회 일반의 일부 이익에만 관련된 사항 또는 개인에 관한 사항이라도 공익성이 인정되는 경우 및 사인의 경우 공공의 이익에 관련되는지 판단하는 기준 [3] 甲 대학교 총학생회장인 피고인이 총학생회 주관의 농활 사전답사 과정에서 乙을 비롯한 학생회 임원진의 음주 및 음주운전 사실이 있었음을 계기로 음주운전 및 이를 묵인하는 관행을 공론화하여 ‘총학생회장으로서 음주운전을 끝까지 막지 못하여 사과드립니다.’라는 제목의 글을 써 페이스북 등에 게시함으로써 음주운전자로 특정된 乙의 명예를 훼손하였다는 내용으로 기소된 사안에서, 게시글의 전체적인 취지·내용에 비추어 중요한 부분이 ‘진실한 사실’에 해당하고, 게시글은 주된 의도·목적의 측면에서 공익성이 충분히 인정되는 점 등을 종합하면, 피고인의 행위는 형법 제310조에 따라 위법성이 조각된다고 봄이 타당하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=233889"},{"id":"P:238237","kind":"P","label":"2022도3035","title":"의료법위반·약사법위반·의료기기법위반·사문서변조교사·변조사문서행사교사","court":"대법원","date":"2023.02.02","caseType":"형사","basis":"판례내용","text":"[1] 공소사실의 특정을 요구하는 취지 및 공소사실의 특정 정도 [2] 의료법 제27조 제3항에서 말하는 ‘소개·알선’, ‘유인’, ‘이를 사주하는 행위’의 의미 및 어떠한 행위가 사주행위에 해당하는지 판단하는 기준 / 의료법 제27조 제3항 위반죄가 성립하기 위해서는 사주행위의 결과 사주받은 자가 실제로 소개·알선·유인행위를 결의하였거나 실제로 소개·알선·유인행위를 행할 것까지 요구되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=238237"},{"id":"P:238355","kind":"P","label":"2022고단5302","title":"특정범죄가중처벌등에관한법률위반(절도)·배상명령신청","court":"수원지방법원","date":"2023.02.02","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238355"},{"id":"P:233899","kind":"P","label":"2021도15681","title":"업무방해·위증·증거위조교사·건설산업기본법위반·위계공무집행방해","court":"대법원","date":"2023.02.02","caseType":"형사","basis":"판례내용","text":"건설산업기본법 제96조 제4호에서 말하는 ‘하도급한 자’의 의미 / 건설사업자가 도급받은 건설공사의 전부 또는 건설산업기본법 시행령으로 정하는 주요 부분의 대부분을 다른 건설사업자에게 일괄하여 하도급하는 내용의 계약을 체결한 경우, 그 계약 체결 시에 건설산업기본법 제96조 제4호 위반죄가 기수에 이르는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=233899"},{"id":"P:237261","kind":"P","label":"2021노2521","title":"공공단체등위탁선거에관한법률위반","court":"광주지방법원","date":"2023.02.01","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=237261"},{"id":"P:238239","kind":"P","label":"2022도14734","title":"사기·야간건조물침입절도·공갈·공갈미수·국민체육진흥법위반(도박등)","court":"대법원","date":"2023.01.31","caseType":"형사","basis":"참조조문","text":"피고인이 제1심에서 6건의 병합 사건 중 甲, 乙 사건의 각 죄에 대하여 징역 8월, 丙, 丁, 戊, 己 사건의 각 죄에 대하여 징역 8월의 유죄판결을 선고받고 항소장을 제출한 후에 ‘丙 사건’이라고만 기재한 항소취하서와 비약적 상고장을 제출하였다가 ‘위 항소취하서와 비약적 상고장은 잘못 제출한 것으로서 무효이므로 기존에 제출된 항소장에 따라 진행되기를 희망한다.’는 내용의 서면을 제출하자, 제1심법원은 ‘피고인의 항소’를 송부사유로 하여 항소심 법원에 소송기록을 송부하였는데, 항소심 법원이 ‘제1심법원에 제출된 항소취하서에 의해 항소가 취하되었고, 비약적 상고장에 대한 판단은 제1심법원이 해야 한다.’고 보아 ‘착오송부에 의한 기록반환’을 송부사유로 하여 제1심법원으로 소송기록을 다시 송부하자, 소송기록을 반환받은 제1심법원이 ‘피고인의 비약적 상고’를 이유로 대법원에 소송기록을 송부한 사안에서, 기록상 피고인이 항소취하서에 기재하지 않은 사건에 대하여 항소를 취하하려는 의사가 있었다고 단정하기 어려운바, 丙, 丁, 戊, 己 사건과 관련하여 피고인은 1개의 형이 선고된 경합범의 죄 중 일부에 대해서만 항소를 취하한 것이어서 丁, 戊, 己 사건들뿐만 아니라 그와 불가분적으로 취급되어야 하는 丙 사건조차도 항소취하의 효력을 인정할 수 없고, 나머지 甲, 乙 사건은 丙 사건과 형법 제37조 후단 경합범 관계에 있어 항소취하의 효력이 위 ","url":"https://www.law.go.kr/precInfoP.do?precSeq=238239"},{"id":"P:616635","kind":"P","label":"2021고합530","title":"자본시장과금융투자업에관한법률위반","court":"서울남부지방법원","date":"2023.01.26","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=616635"},{"id":"P:238357","kind":"P","label":"2022노528","title":"근로자퇴직급여보장법위반","court":"서울남부지방법원","date":"2023.01.19","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238357"},{"id":"P:234851","kind":"P","label":"2022노3872","title":"마약류관리에관한법률위반(향정)","court":"대구지방법원","date":"2023.01.18","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=234851"},{"id":"P:603891","kind":"P","label":"2021노1180","title":"관세법위반·의료기기법위반","court":"의정부지방법원","date":"2023.01.13","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=603891"},{"id":"P:238249","kind":"P","label":"2021도16605","title":"교통사고처리특례법위반(치상)·도로교통법위반(음주운전)","court":"대법원","date":"2023.01.12","caseType":"형사","basis":"참조조문","text":"범죄의 성립과 처벌에 관하여 규정한 형벌법규 자체 또는 그로부터 수권 내지 위임을 받은 법령의 변경에 따라 범죄를 구성하지 아니하게 되거나 형이 가벼워진 경우, 종전 법령이 범죄로 정하여 처벌한 것이 부당하였다거나 과형이 과중하였다는 반성적 고려에 따라 변경된 것인지를 따지지 않고 원칙적으로 형법 제1조 제2항과 형사소송법 제326조 제4호가 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=238249"},{"id":"P:233581","kind":"P","label":"2022도11245","title":"살인·협박·보호관찰명령","court":"대법원","date":"2023.01.12","caseType":"형사","basis":"참조조문","text":"[1] 형사재판에서 유죄를 인정하기 위한 증거의 증명력 정도 [2] 공소사실에 부합하는 진술 중 주요한 부분을 그대로 믿을 수 없는 객관적 사정이 밝혀진 경우, 나머지 진술 부분의 신빙성을 인정하기 위한 요건 [3] 범행 당시 살인의 고의는 없었고 단지 상해 또는 폭행의 고의만 있었을 뿐이라고 다투는 피고인에게 살인의 고의가 있었는지 판단하는 기준 [4] 공동정범의 성립 요건 및 주관적 요건인 ‘공동가공의 의사’의 내용 / 공동정범이 성립한다고 판단하기 위해서는 공동가공의 의사에 기한 상호 이용의 관계가 합리적인 의심을 할 여지가 없을 정도로 증명되어야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=233581"},{"id":"P:238241","kind":"P","label":"2022도7536","title":"도로교통법위반(음주운전)·도로교통법위반(무면허운전)","court":"대법원","date":"2023.01.12","caseType":"형사","basis":"참조조문","text":"범죄의 성립과 처벌에 관하여 규정한 형벌법규 자체 또는 그로부터 수권 내지 위임을 받은 법령의 변경에 따라 범죄를 구성하지 아니하게 되거나 형이 가벼워진 경우, 종전 법령이 범죄로 정하여 처벌한 것이 부당하였다거나 과형이 과중하였다는 반성적 고려에 따라 변경된 것인지를 따지지 않고 원칙적으로 형법 제1조 제2항과 형사소송법 제326조 제4호가 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=238241"},{"id":"P:238743","kind":"P","label":"2021고합353","title":"특정경제범죄가중처벌등에관한법률위반(배임)(인정된죄명업무상배임)·업무방해","court":"대전지방법원","date":"2023.01.12","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238743"},{"id":"P:233585","kind":"P","label":"2017도14104","title":"특정경제범죄가중처벌등에관한법률위반(사기)·특정경제범죄가중처벌등에관한법률위반(횡령)·상법위반·공전자기록등불실기재·불실기재공전자기록등행사·국가기술자격법위반·건설산업기본법위반·위계공무집행방해·범죄수익은닉의규제및처벌등에관한법률위반·뇌물공여·사기·부정처사후수뢰·공전자기록등위작·위작공전자기록등행사·허위공문서작성·허위작성공문서행사·뇌물수수·제3자뇌물수수·특정범죄가중처벌등에관한법률위반(알선수재)·직권남용권리행사방해·부패방지및국민권익위원회의설치와운영에관한법률위반·공무상비밀누설·제3자뇌물취득","court":"대법원","date":"2023.01.12","caseType":"형사","basis":"참조조문","text":"[1] 사기죄의 성립 요건 / 사기죄의 주관적 구성요건인 불법영득의 의사 내지 편취의 범의 유무를 판단하는 기준 / 도급계약에 따른 일의 대가 등 편취에 의한 사기죄에서 편취의 고의가 있었는지 판단하는 방법 및 기준 시점 / 기망행위에 의하여 국가적 또는 공공적 법익이 침해되었다는 사정만으로 사기죄가 성립하는지 여부 / 도급계약이나 물품구매 조달계약 체결 당시 관련 영업 또는 업무를 규제하는 행정법규나 입찰 참가자격, 계약절차 등에 관한 규정을 위반한 사정만으로 도급계약을 체결한 행위가 기망행위에 해당한다고 단정할 수 있는지 여부 및 이때 심리·판단하여야 할 사항 [2] 피고인이 설립한 甲 주식회사는 설립 자본금을 가장납입하고, 자격증 대여자를 보유 건설기술자로 등록하는 등 자본금 요건과 기술자 보유 요건을 가장하여 전문건설업을 부정 등록한 무자격 건설업자로 전문공사를 하도급받을 수 없었음에도, 이를 바탕으로 공사 발주기관을 기망하여 특허 사용협약을 체결하고, 해당 공사를 낙찰받은 건설회사 담당자를 기망하여 하도급 계약을 체결한 후, 각 계약들에 따른 공사대금을 지급받아 편취하였다는 이유로 특정경제범죄 가중처벌 등에 관한 법률 위반 및 사기죄로 기소된 사안에서, 피고인이 발주기관 또는 건설회사들로부터 공사대금을 지급받은 행위가 사기죄에서의 기망행위로 인한 재물의 편취에 해당한다고 보기 어려우므로, 이와 달리 공소사실을 유죄로 본 원심","url":"https://www.law.go.kr/precInfoP.do?precSeq=233585"},{"id":"P:605577","kind":"P","label":"2022고합92","title":"성폭력범죄의처벌등에관한특례법위반(강간등치상)·마약류관리에관한법률위반(향정)","court":"서울중앙지방법원","date":"2023.01.12","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=605577"},{"id":"P:238253","kind":"P","label":"2021도6508","title":"도로교통법위반(음주운전)","court":"대법원","date":"2023.01.12","caseType":"형사","basis":"참조조문","text":"범죄의 성립과 처벌에 관한 형벌법규 자체의 변경에 따라 범죄를 구성하지 아니하게 되거나 형이 가벼워진 경우, 종전 법령이 범죄로 정하여 처벌한 것이 부당하였다거나 과형이 과중하였다는 반성적 고려에 따라 변경된 것인지를 따지지 않고 원칙적으로 형법 제1조 제2항이 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=238253"},{"id":"P:238247","kind":"P","label":"2020도2154","title":"국민체육진흥법위반","court":"대법원","date":"2023.01.12","caseType":"형사","basis":"참조조문","text":"[1] 형법 제48조에서 몰수의 대상으로 규정한 ‘물건’의 의미 [2] 피고인은 자신이 운영하는 인터넷 사이트 등을 이용하여 국민체육진흥법 제26조에서 금지하고 있는 유사행위를 영위하는 도박사이트를 홍보하면서 회원가입 시 자신의 추천인 코드를 입력하게 하고, 이러한 방법으로 모집된 회원들이 베팅을 한 금액 중 일부를 위 도박사이트 운영자로부터 피고인 명의 은행 계좌로 송금 받아 국민체육진흥법 위반으로 기소되었는데, 원심이 위 송금 받은 금액은 범행의 보수로 받은 금품으로서 형법 제48조 제1항 제2호의 범죄행위로 인하여 취득한 물건에 해당하나, 피고인 계좌의 다른 돈과 섞여 몰수할 수 없다는 이유로 공소사실을 유죄로 판단하고 피고인으로부터 해당 금액을 추징한 제1심판결을 그대로 유지한 사안에서, 피고인이 취득한 범행의 보수는 형법 제48조 제1항 제2호, 제2항이 규정한 추징의 대상에 해당하지 않는다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=238247"},{"id":"P:238245","kind":"P","label":"2022도14694","title":"사기·여신전문금융업법위반·절도·폭행·상해·특수협박·도로교통법위반(음주측정거부)","court":"대법원","date":"2023.01.12","caseType":"형사","basis":"판례내용","text":"음주측정거부 전력이 있는 피고인이 음주측정요구에 응하지 않았다는 공소사실에 대하여, 원심이 도로교통법 제148조의2 제1항, 제44조 제2항을 적용하여 유죄로 인정하였는데, 헌법재판소가 2022. 8. 31. 위 도로교통법 제148조의2 제1항 중 ‘제44조 제2항을 2회 이상 위반한 사람’에 관한 부분에 대해 위헌결정을 선고한 사안에서, 위 법률조항 부분은 소급하여 효력을 상실하였고, 위헌결정으로 형벌에 관한 법률 또는 법률조항이 소급하여 효력을 상실한 경우 해당 법조를 적용하여 기소한 피고사건은 죄가 되지 아니하는 경우에 해당하므로, 공소사실을 유죄로 인정한 원심판결은 더 이상 유지될 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=238245"},{"id":"P:238501","kind":"P","label":"2022노293","title":"공직선거법위반·사문서위조·위조사문서행사","court":"부산고등법원창원재판부","date":"2023.01.11","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238501"},{"id":"P:240609","kind":"P","label":"2022고합48","title":"공직선거법위반","court":"광주지방법원해남지원","date":"2023.01.11","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=240609"},{"id":"P:234429","kind":"P","label":"2021노3707","title":"업무상과실치상","court":"대구지방법원","date":"2023.01.11","caseType":"형사","basis":"참조조문","text":"의사인 피고인이 레이저 기기를 이용하여 甲의 종아리 부분에 제모 시술을 하는 과정에서, 사람의 표피에 접촉되는 팁 부분에 손상이 있을 경우 레이저 출력에 문제가 생겨 피시술자에게 화상을 입게 할 수 있음에도, 팁 부분에 손상이 있는지를 제대로 확인하지 아니하고 흠집이 있는 상태로 제모 시술을 진행하여 팁 부분이 甲에게 화상을 입게 할 정도로 고온 상태에 이르게 하고, 이로 인한 고온 접촉으로 甲이 고통을 호소함에도 적절한 조치를 취하지 아니한 채 제모 시술을 계속 진행함으로써 甲의 양쪽 종아리에 화상 등의 상해를 입게 하였다고 하여 업무상과실치상으로 기소된 사안에서, 피고인에게 무죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=234429"},{"id":"P:233045","kind":"P","label":"2017도10007","title":"의료법위반[호스피스 의료기관에서 근무하는 의사인 피고인이 부재중에 입원환자가 사망한 경우 간호사인 피고인들에게 환자의 사망 여부를 확인한 다음 사망진단서를 작성하여 유족들에게 발급하도록 하여 무면허 의료행위로 인한 의료법위반 및 이에 대한 교사로 기소된 사안]","court":"대법원","date":"2022.12.29","caseType":"형사","basis":"참조조문","text":"[1] 구 의료법 제27조 제1항에서 정한 ‘의료행위’의 의미 / 의사 등이 간호사에게 의료행위의 실시를 개별적으로 지시하거나 위임한 적이 없는데도 간호사가 그의 주도 아래 전반적인 의료행위의 실시 여부를 결정하고 그 의료행위의 실시과정에도 의사 등이 지시·관여하지 않은 경우, 구 의료법 제27조 제1항이 금지하는 무면허 의료행위에 해당하는지 여부 / 사망진단은 의사가 직접 수행해야 하는 의료행위인지 여부 및 의사 등의 개별적 지도·감독이 있는 경우, 간호사가 사망진단을 할 수 있는지 여부 [2] 의료행위에 해당하는 어떠한 시술행위가 무면허로 행하여졌으나 사회상규에 위배되지 아니하는 행위로서 위법성이 조각되는 경우","url":"https://www.law.go.kr/precInfoP.do?precSeq=233045"},{"id":"P:233095","kind":"P","label":"2022도12494","title":"절도(인정된죄명:사기)","court":"대법원","date":"2022.12.29","caseType":"형사","basis":"참조조문","text":"[1] 형법상 ‘절취’의 의미 및 사기죄에서 처분행위가 갖는 역할과 기능 / 피기망자의 의사에 기초한 어떤 행위를 통해 행위자 등이 재물 또는 재산상의 이익을 취득하였다고 평가할 수 있는 경우, 사기죄에서 말하는 처분행위가 인정되는지 여부 / 피기망자와 재산상의 피해자가 같은 사람이 아닌 경우에 사기죄가 성립하려면 피기망자가 피해자를 위하여 그 재산을 처분할 수 있는 권능을 갖거나 그 지위에 있어야 하는지 여부 [2] 피해자 甲은 드라이버를 구매하기 위해 특정 매장에 방문하였다가 지갑을 떨어뜨렸는데, 10분쯤 후 피고인이 같은 매장에서 우산을 구매하고 계산을 마친 뒤, 지갑을 발견하여 습득한 매장 주인 乙로부터 \"이 지갑이 선생님 지갑이 맞느냐?\"라는 질문을 받자 \"내 것이 맞다.\"라고 대답한 후 이를 교부받아 가지고 간 사안에서, 乙의 행위는 사기죄에서 말하는 처분행위에 해당하고, 피고인의 행위를 절취행위로 평가할 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=233095"},{"id":"P:233093","kind":"P","label":"2022도10660","title":"아동·청소년의성보호에관한법률위반(상습성착취물제작·배포등)·아동복지법위반(아동에대한음행강요·매개·성희롱등)·아동·청소년의성보호에관한법률위반(성착취물소지)·미성년자의제유사강간","court":"대법원","date":"2022.12.29","caseType":"형사","basis":"참조조문","text":"[1] 신설된 포괄일죄 처벌법규가 시행되기 이전의 행위에 대하여 신설된 법규를 적용하여 처벌할 수 있는지 여부 및 이는 신설된 처벌법규가 상습범을 처벌하는 구성요건인 경우에도 마찬가지인지 여부 [2] 공소장변경이 허용되는 범위 / 공소사실의 동일성이 인정되지 않는 범죄사실을 공소사실로 추가하는 취지의 공소장변경신청이 있는 경우, 법원이 취할 조치 / 공소사실의 동일성을 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=233093"},{"id":"P:234057","kind":"P","label":"2021도2088","title":"횡령","court":"대법원","date":"2022.12.29","caseType":"형사","basis":"참조조문","text":"[1] 형법 제335조 제1항에서 정하는 ‘반환의 거부’의 의미 및 판단 기준 / 반환거부에 정당한 이유가 있는 경우, 불법영득의 의사가 인정되는지 여부 [2] 주류업체 甲 주식회사의 사내이사인 피고인이 피해자를 상대로 주류대금 청구소송을 제기한 민사 분쟁 중 피해자가 착오로 피고인이 관리하는 甲 회사 명의 계좌로 금원을 송금하여 피고인이 이를 보관하게 되었는데, 피고인은 피해자로부터 위 금원이 착오송금된 것이라는 사정을 문자메시지를 통해 고지받아 위 금원을 반환해야 할 의무가 있었음에도, 피해자와 상계 정산에 관한 합의 없이 피고인이 주장하는 주류대금 채권액을 임의로 상계 정산한 후 반환을 거부하여 횡령죄로 기소된 사안에서, 피고인이 피해자의 착오로 甲 회사 명의 계좌로 송금된 금원 중 甲 회사의 피해자에 대한 채권액에 상응하는 부분에 관하여 반환을 거부한 행위는 정당한 상계권의 행사로 볼 여지가 있으므로, 피고인의 반환거부행위가 횡령행위와 같다고 보아 불법영득의사를 인정한 원심판결에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=234057"},{"id":"P:233091","kind":"P","label":"2022도8592","title":"도박공간개설","court":"대법원","date":"2022.12.29","caseType":"형사","basis":"참조조문","text":"[1] 형법 제49조 단서에 근거하여 몰수·추징을 선고하려면 몰수·추징의 요건이 공소가 제기된 공소사실과 관련되어 있어야 하는지 여부 및 공소가 제기되지 아니한 별개의 범죄사실을 법원이 인정하여 그에 관하여 몰수·추징을 선고할 수 있는지 여부 / 이러한 법리는 형법 제48조의 몰수·추징 규정에 대한 특별규정인 범죄수익은닉의 규제 및 처벌 등에 관한 법률 제8조 내지 제10조의 규정에 따른 몰수·추징의 경우에도 마찬가지로 적용되는지 여부 [2] 피고인이 영리의 목적으로 도박공간을 개설하였다는 공소사실이 제1심 및 원심에서 유죄로 인정되었는데, 그로 인한 범죄수익의 추징과 관련하여 피고인이 직접 도박에 참가하여 얻은 수익 부분에 대한 추징 여부가 문제 된 사안에서, 도박공간을 개설한 자가 도박에 참가하여 얻은 수익을 도박공간개설로 얻은 범죄수익으로 몰수하거나 추징할 수 없다는 이유로, 전체 범죄수익 중 피고인이 직접 도박에 참가하여 얻은 수익을 도박공간개설의 범죄로 인한 추징 대상에서 제외하고 그 차액만을 추징한 원심의 판단이 정당하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=233091"},{"id":"P:238263","kind":"P","label":"2021도16922","title":"횡령","court":"대법원","date":"2022.12.29","caseType":"형사","basis":"참조조문","text":"[1] 형법 제355조 제1항에서 정한 ‘반환의 거부’의 의미 및 반환의 거부가 횡령죄를 구성하려면 반환거부행위가 횡령행위와 같다고 볼 수 있을 정도에 이르러야 하는지 여부 / 횡령죄에서 ‘불법영득의 의사’의 의미 및 반환거부에 정당한 이유가 있는 경우 불법영득의 의사가 인정되는지 여부 [2] 예금계좌에 금전이 착오로 잘못 송금되어 입금된 경우, 수취인과 송금인 사이에 신의칙상 보관관계가 성립한다는 이유만으로 송금인이 수취인에게 금전의 수수를 수반하는 사무처리를 위임하였다고 보아 수취인의 송금인에 대한 상계권 행사가 당초 위임한 취지에 반한다고 볼 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=238263"},{"id":"P:233811","kind":"P","label":"2022노331","title":"마약류관리에관한법률위반(향정)·마약류관리에관한법률위반(대마)","court":"대구고등법원","date":"2022.12.22","caseType":"형사","basis":"판례내용","text":"피고인이 ‘자신의 주거에서 향정신성의약품인 LSD를 투약하여 사용하였다.’는 마약류 관리에 관한 법률 위반의 공소사실로 기소되었는데, 피고인은 당초 ‘자신의 주거에서 대마 불상량을 재배하였다.’는 범죄사실로 발부된 압수·수색영장에 의하여 피고인의 주거지를 압수·수색한 경찰관 甲에게 공소사실에 관하여 자백하였고, 이에 부합하는 증거로는 증인 甲의 법정진술 중 ‘피고인이 수사기관에서 LSD 투약 사실을 자백하였다.’는 취지의 진술 등이 있는 사안에서, 피고인에 대한 압수·수색영장의 범죄사실은 LSD 투약과는 관련이 없음에도 피고인이 진술거부권을 고지받지 않은 상태에서 공소사실에 관하여 자백한 점 등의 사정을 종합하면, 피고인이 甲에게 한 자백진술이 특히 신빙할 수 있는 상태에서 이루어졌다고 보기 어려워 증거능력이 없다는 등의 이유로 공소사실을 무죄로 판단한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=233811"},{"id":"P:233049","kind":"P","label":"2020도16420","title":"사기·전자금융거래법위반·교통사고처리특례법위반(치상)·도로교통법위반(무면허운전)·도로교통법위반(음주운전)","court":"대법원","date":"2022.12.22","caseType":"형사","basis":"참조조문","text":"[1] 범죄의 성립과 처벌에 관하여 규정한 형벌법규 자체 또는 그로부터 수권 내지 위임을 받은 법령의 변경에 따라 범죄를 구성하지 아니하게 되거나 형이 가벼워진 경우, 종전 법령이 범죄로 정하여 처벌한 것이 부당하였다거나 과형이 과중하였다는 반성적 고려에 따라 변경된 것인지를 따지지 않고 원칙적으로 형법 제1조 제2항과 형사소송법 제326조 제4호가 적용되는지 여부 / 이러한 법리는, 형벌법규가 고시 등 행정규칙·행정명령, 조례 등에 구성요건의 일부를 수권 내지 위임한 경우에도 그 고시 등 규정이 위임입법의 한계를 벗어나지 않는 한 마찬가지인지 여부 / 해당 형벌법규 자체 또는 그로부터 수권 내지 위임을 받은 법령이 아닌 다른 법령이 변경된 경우, 형법 제1조 제2항과 형사소송법 제326조 제4호를 적용하기 위한 요건 / 스스로 유효기간을 구체적인 일자나 기간으로 특정하여 효력의 상실을 예정하고 있던 법령이 그 유효기간을 경과함으로써 더 이상 효력을 갖지 않게 된 경우가 형법 제1조 제2항과 형사소송법 제326조 제4호에서 말하는 ‘법령의 변경’에 해당하는지 여부 [2] 피고인이 도로교통법 위반죄로 처벌받은 전력이 있음에도 술에 취한 상태로 전동킥보드를 운전하였다고 하여 구 도로교통법 위반으로 기소되었는데, 구 도로교통법이 개정되어 원심판결 선고 후에 개정 도로교통법이 시행되면서 제2조 제19호의2 및 제21호의2에서 전동킥보드와 같","url":"https://www.law.go.kr/precInfoP.do?precSeq=233049"},{"id":"P:240763","kind":"P","label":"2020노591","title":"특정범죄가중처벌등에관한법률위반(조세)·특정경제범죄가중처벌등에관한법률위반(횡령)·조세범처벌법위반","court":"서울고등법원","date":"2022.12.20","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=240763"},{"id":"P:238829","kind":"P","label":"2021고단5588","title":"마약류관리에관한법률위반(향정)·특수상해(인정된죄명상해)·재물손괴","court":"서울중앙지방법원","date":"2022.12.20","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238829"},{"id":"P:239829","kind":"P","label":"2022고정929","title":"상해·건조물침입","court":"서울중앙지방법원","date":"2022.12.20","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=239829"},{"id":"P:233057","kind":"P","label":"2017도19229","title":"모욕[피고인이 인터넷 포털사이트 뉴스 댓글 란에 피해자에 대하여 “국민호텔녀”, “퇴물” 등의 표현을 사용하여 모욕하였다고 기소된 사안]","court":"대법원","date":"2022.12.15","caseType":"형사","basis":"참조조문","text":"[1] 모욕죄의 보호법익 및 모욕의 의미 / 표현의 자유와 명예보호 사이의 한계를 설정할 때 고려할 사항 / 공적 관심사에 대한 표현의 자유 보장과 개인의 사적 법익 및 인격권 보호라는 두 법익이 충돌하였을 때 규제의 폭과 방법을 정하는 방법 / 표현이 다의적이거나 의미가 확정되지 않은 신조어인 경우, 그러한 표현이 모욕적 표현에 해당하는지 판단하는 방법 / 모욕죄의 구성요건에 해당하는 표현이 사회상규에 위배되는지 판단하는 기준 / 연예인의 사생활에 대한 모욕적인 표현에 대하여 표현의 자유를 근거로 모욕죄의 구성요건에 해당하지 않거나 사회상규에 위배되지 않는다고 판단하는 데에 신중할 필요가 있는지 여부 [2] 피고인이 인터넷 포털사이트 뉴스 댓글난에 연예인인 피해자를 ‘국민호텔녀’로 지칭하는 댓글을 게시하여 모욕죄로 기소된 사안에서, ‘국민호텔녀’라는 표현은 피해자의 사생활을 들추어 피해자가 종전에 대중에게 호소하던 청순한 이미지와 반대의 이미지를 암시하면서 피해자를 성적 대상화하는 방법으로 비하하는 것으로서 여성 연예인인 피해자의 사회적 평가를 저하시킬 만한 모멸적인 표현으로 평가할 수 있고, 정당한 비판의 범위를 벗어난 것으로서 정당행위로 보기도 어렵다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=233057"},{"id":"P:238269","kind":"P","label":"2020도14049","title":"할부거래에관한법률위반","court":"대법원","date":"2022.12.15","caseType":"형사","basis":"판례내용","text":"[1] 선불식 할부거래업자는 선수금 예치기관에 선불식 할부계약을 체결한 회원들에 관한 정보를 사실대로 고지할 의무가 있는지 여부 및 일부 회원들의 가입자 정보 등 관련 자료를 제출하지 않고 누락한 채 선수금 등의 자료를 제출한 경우, 소비자피해보상보험계약 등을 체결 또는 유지함에 있어 거짓으로 선수금 등의 자료를 제출한 것인지 여부 [2] 항소이유의 철회는 명백히 이루어져야만 효력이 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=238269"},{"id":"P:239961","kind":"P","label":"2022고합25","title":"통신비밀보호법위반·위치정보의보호및이용등에관한법률위반·자동차수색","court":"대구지방법원경주지원","date":"2022.12.15","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=239961"},{"id":"P:618275","kind":"P","label":"2022고단99","title":"업무상배임·사전자기록등위작·위작사전자기록등행사","court":"서울남부지방법원","date":"2022.12.08","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=618275"},{"id":"P:237977","kind":"P","label":"2022고합45","title":"아동·청소년의성보호에관한법률위반(위계등유사성행위)·아동·청소년의성보호에관한법률위반(성매수등)·아동·청소년의성보호에관한법률위반(성착취물제작·배포등)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등)·미성년자의제강간·미성년자의제유사강간·아동복지법위반(아동에대한음행강요·매개·성희롱등)·성매매알선등행위의처벌에관한법률위반(성매매)·부착명령","court":"춘천지방법원원주지원","date":"2022.12.08","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=237977"},{"id":"P:234807","kind":"P","label":"2022노834","title":"성폭력범죄의처벌등에관한특례법위반(주거침입강제추행)","court":"수원고등법원","date":"2022.12.06","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=234807"},{"id":"P:238285","kind":"P","label":"2022도10024","title":"폭력행위등처벌에관한법률위반(상습특수폭행)·폭력행위등처벌에관한법률위반(상습특수재물손괴등)·업무방해·특정범죄가중처벌등에관한법률위반(운전자폭행등)·폭력행위등처벌에관한법률위반(상습폭행)","court":"대법원","date":"2022.11.30","caseType":"형사","basis":"판례내용","text":"경범죄 처벌법상 범칙금제도의 의의 / 경찰서장이 범칙행위에 대하여 통고처분을 하였는데 통고처분에서 정한 범칙금 납부기간이 지나지 않은 경우, 경찰서장이 즉결심판을 청구하거나 검사가 동일한 범칙행위에 대하여 공소를 제기할 수 있는지 여부 / 이때 공소를 제기할 수 없는 범칙행위의 범위","url":"https://www.law.go.kr/precInfoP.do?precSeq=238285"},{"id":"P:232583","kind":"P","label":"2022도1410","title":"재물손괴[타인의 토지 지상에 건물을 신축행위에 대하여, 토지에 관한 재물손괴죄로 기소한 사건]","court":"대법원","date":"2022.11.30","caseType":"형사","basis":"참조조문","text":"재물손괴죄의 성립요건 및 영득죄와의 구별 / 다른 사람의 소유물을 본래의 용법에 따라 무단으로 사용·수익하는 행위 때문에 소유자가 물건의 효용을 누리지 못하게 된 경우, 재물손괴죄에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=232583"},{"id":"P:612051","kind":"P","label":"2019고합980","title":"특정경제범죄가중처벌등에관한법률위반(사기)(일부변경된죄명사기)·업무방해","court":"서울중앙지방법원","date":"2022.11.25","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=612051"},{"id":"P:609317","kind":"P","label":"2022노257","title":"금융실명거래및비밀보장에관한법률위반·개인정보보호법위반","court":"서울중앙지방법원","date":"2022.11.25","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=609317"},{"id":"P:234269","kind":"P","label":"2022노2157","title":"특정범죄가중처벌등에관한법률위반(보복협박등)·스토킹범죄의처벌등에관한법률위반·가정폭력범죄의처벌등에관한특례법위반","court":"서울고등법원","date":"2022.11.24","caseType":"형사","basis":"참조조문","text":"피고인이 별거 중인 배우자 甲을 찾아가 협박하였다는 가정폭력행위로 법원으로부터 100m 이내 접근금지, 전기통신 이용 접근금지의 임시조치 결정을 받았음에도 1개월여 동안 지속적·반복적으로 甲에게 문자메시지 또는 사진 파일을 전송하거나 甲의 휴대전화에 부재중 전화 표시가 나타나게 하고 甲의 주거지 옥상에 올라가는 등의 방법으로 임시조치를 이행하지 않음과 동시에 스토킹행위를 하였다고 하여 가정폭력범죄의 처벌 등에 관한 특례법 위반 및 스토킹범죄의 처벌 등에 관한 법률 위반 등으로 기소된 사안에서, 피고인이 정보통신망을 통하여 직접 음향 등을 송신하는 행위뿐만 아니라 전화를 이용하여 상대방 전화기가 만들어 낸 음향 등을 도달하게 하는 행위 역시 스토킹행위에 해당하고, 지속적·반복적으로 상대방 휴대전화에 부재중 전화 표시가 나타나게 한 행위는 글이나 부호 등을 도달하게 하는 행위만큼이나 불안감·공포심을 일으키는 것이라는 등의 이유로, 공소사실 전부를 유죄로 인정한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=234269"},{"id":"P:241617","kind":"P","label":"2022노1","title":"특정경제범죄가중처벌등에관한법률위반(사기)방조·개인정보보호법위반·정보통신망이용촉진및정보보호등에관한법률위반방조","court":"부산고등법원창원재판부","date":"2022.11.23","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=241617"},{"id":"P:234365","kind":"P","label":"2020노3595","title":"실화","court":"대구지방법원","date":"2022.11.18","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=234365"},{"id":"P:614623","kind":"P","label":"2020노3595","title":"실화","court":"대구지방법원","date":"2022.11.18","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=614623"},{"id":"P:606357","kind":"P","label":"2022노12","title":"추행","court":"의정부지방법원","date":"2022.11.17","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606357"},{"id":"P:232027","kind":"P","label":"2022도7290","title":"감염병의예방및관리에관한법률위반·위계공무집행방해·공무상표시무효교사","court":"대법원","date":"2022.11.17","caseType":"형사","basis":"판례내용","text":"[1] 죄형법정주의에 따른 형벌법규의 해석 원칙 [2] 감염병의 예방 및 관리에 관한 법률 제18조 제3항에서 정한 ‘역학조사’의 의미 / 같은 항 제1호에서 정한 ‘역학조사를 거부하는 행위’가 성립하려면 행위자나 그의 공범에 대하여 같은 항에서 정한 ‘역학조사’가 실시되었음이 전제되어야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=232027"},{"id":"P:234433","kind":"P","label":"2022도8257","title":"폭력행위등처벌에관한법률위반(공동상해)·업무방해·특수상해","court":"대법원","date":"2022.11.17","caseType":"형사","basis":"판례내용","text":"[1] 공소사실의 특정을 요구하는 취지 및 특정 정도 / 범죄의 ‘일시’가 공소시효 완성 여부를 판별할 수 없을 정도로 개괄적으로 기재된 경우, 공소사실의 특정 여부 [2] 공소사실에 특정되지 아니한 부분이 있는 경우, 법원이 취할 조치","url":"https://www.law.go.kr/precInfoP.do?precSeq=234433"},{"id":"P:231967","kind":"P","label":"2022도8662","title":"사기","court":"대법원","date":"2022.11.17","caseType":"형사","basis":"참조조문","text":"[1] 형법 제49조 단서에 근거하여 몰수를 선고하기 위해서는 몰수의 요건이 공소가 제기된 공소사실과 관련되어 있어야 하는지 여부 및 공소가 제기되지 않은 별개의 범죄사실을 법원이 인정하여 그에 관하여 몰수나 추징을 선고할 수 있는지 여부 [2] 부패재산의 몰수 및 회복에 관한 특례법 제6조 제1항, 제3조 제1항, 제2조 제3호에서 정한 몰수·추징의 원인이 되는 범죄사실은 공소제기된 범죄사실에 한정되고, ‘범죄피해재산’은 그 공소제기된 범죄사실 피해자로부터 취득한 재산 또는 그 재산의 보유·처분에 의하여 얻은 재산에 한정되며, 그 피해자의 피해회복이 심히 곤란하다고 인정되는 경우에만 몰수·추징이 허용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=231967"},{"id":"P:237979","kind":"P","label":"2021노2868","title":"아동·청소년의성보호에관한법률위반(음란물제작·배포등)방조","court":"광주지방법원","date":"2022.11.16","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=237979"},{"id":"P:619415","kind":"P","label":"2021노475","title":"특정범죄가중처벌등에관한법률위반(국고등손실)방조·위계공무집행방해·허위공문서작성·허위작성공문서행사·특정범죄가중처벌등에관한법률위반(국고등손실)·업무상배임","court":"대전고등법원","date":"2022.11.11","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619415"},{"id":"P:233291","kind":"P","label":"2022노1599","title":"아동·청소년의성보호에관한법률위반(강간등치상)[인정된죄명아동·청소년의성보호에관한법률위반(위계등간음)·아동·청소년의성보호에관한법률위반(준강간)]","court":"서울고등법원","date":"2022.11.08","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233291"},{"id":"P:232825","kind":"P","label":"2022노1406","title":"도로교통법위반(음주운전)","court":"서울고등법원","date":"2022.11.03","caseType":"형사","basis":"판례내용","text":"甲이 운전 중 다른 차량을 들이받고 사고 직후 출동한 경찰관으로부터 호흡측정기에 의한 음주측정을 요구받아 음주측정을 하였고, 음주측정 결과에 이의를 제기하며 혈액채취를 요구하여 ‘채혈동의 및 확인서’에 서명을 하고 병원에서 경찰 입회 아래 혈액을 채취하였는데, 임의제출서, 압수조서 및 소유권포기서에 날인하지 않고 압수목록을 교부받지 않은 채 곧바로 귀가하여, 경찰이 같은 날 오후 甲의 주소지로 찾아가 임의제출서, 압수조서 및 소유권포기서에 날인을 요구하자 이를 거부하였고, 위와 같이 채취한 혈액 감정에 따른 혈중알코올농도를 기초로 도로교통법 위반으로 기소된 사안에서, 위와 같이 채취한 甲의 혈액은 위법수집증거에 해당하지 않고, 위 혈액을 기초로 하여 획득한 2차 증거인 혈중알코올감정서 역시 증거능력이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=232825"},{"id":"P:231791","kind":"P","label":"2020도12563","title":"금융실명거래및비밀보장에관한법률위반방조","court":"대법원","date":"2022.10.27","caseType":"형사","basis":"참조조문","text":"[1] 구 금융실명거래 및 비밀보장에 관한 법률 제3조 제3항, 제6조 제1항에서 불법·탈법적 목적에 의한 타인 실명의 금융거래를 처벌하는 취지 / 위 규정에서 말하는 ‘그 밖의 탈법행위’의 의미 및 이에 해당하는지 판단하는 기준 [2] 방조범의 성립에 필요한 고의의 내용 / 목적범인 구 금융실명거래 및 비밀보장에 관한 법률 제6조 제1항 위반죄의 방조범 성립에 필요한 고의의 내용","url":"https://www.law.go.kr/precInfoP.do?precSeq=231791"},{"id":"P:238321","kind":"P","label":"2022도1718","title":"아동학대범죄의처벌등에관한특례법위반(아동복지시설종사자등의아동학대가중처벌)","court":"대법원","date":"2022.10.27","caseType":"형사","basis":"판례내용","text":"[1] 아동복지법 제71조 제1항 제2호, 제17조 제3호에서 금지·처벌하는 ‘신체적 학대행위’에 해당하는지 판단하는 기준 [2] 교사인 피고인이 학교에서 13~14세의 중학생들에게 3회에 걸쳐 체벌을 가함으로써 신체적 학대행위를 하였다고 하여 아동학대범죄의 처벌 등에 관한 특례법 위반으로 기소된 사안에서, 피고인의 행위가 위 법이 가중처벌하는 ‘아동의 신체에 손상을 주거나 신체의 건강 및 발달을 해치는 신체적 학대행위’에 해당하는지를 판단할 때에도 초·중등교육법 시행령과 해당 학교의 생활지도 규정이 적용되므로, 위 법령과 규정에서 금지하는 수단과 방법을 사용하여 체벌을 하였다면 훈육 또는 지도 목적으로 행하였더라도 신체적 학대행위에 해당한다는 이유로, 이와 달리 보아 공소사실을 무죄로 판단한 원심판결에 법리오해 및 심리미진의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=238321"},{"id":"P:231801","kind":"P","label":"2019도14421","title":"출판물에의한명예훼손·모욕","court":"대법원","date":"2022.10.27","caseType":"형사","basis":"참조조문","text":"[1] 어떤 글이 모욕적 표현을 담고 있더라도 사회상규에 위배되지 않는 행위로서 위법성이 조각될 수 있는 경우 / 인터넷 등 공간에서 작성된 단문의 글이라도 마찬가지로 위법성이 조각될 가능성이 큰 경우 / 이때 사회상규에 위배되는지 판단하는 기준 [2] 지역버스노동조합 조합원인 피고인이 자신의 페이스북에 집회 일정을 알리면서 노동조합 집행부인 피해자 甲과 乙을 지칭하며 \"버스노조 악의 축, 甲과 乙 구속수사하라!!\"라는 표현을 적시하여 피해자들을 모욕하였다는 내용으로 기소된 사안에서, 위 표현이 피해자들의 사회적인 평가를 저해시킬 만한 경멸적인 표현에 해당하는 것으로 보이지만, 제반 사정을 종합할 때 피고인이 노동조합 집행부의 공적 활동과 관련한 자신의 의견을 담은 게시글을 작성하면서 그러한 표현을 한 것은 사회상규에 위배되지 않는 정당행위로서 위법성이 조각된다고 볼 여지가 크다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=231801"},{"id":"P:231795","kind":"P","label":"2020도15105","title":"정치관여·직권남용권리행사방해·뇌물수수·대통령기록물관리에관한법률위반·군사기밀보호법위반","court":"대법원","date":"2022.10.27","caseType":"형사","basis":"참조조문","text":"[1] 직권남용권리행사방해죄에서 ‘직권의 남용’의 의미와 판단 기준 [2] 공무원의 위법·부당한 직무행위가 형사처벌의 대상인 ‘직권남용’에 해당하는지 판단할 때 고려할 사항 / 구체적 사건에서 직권남용 여부를 판단하는 기준 [3] 직권남용권리행사방해죄의 성립요건 / 직권남용권리행사방해죄에서 ‘권리행사를 방해한다.’는 것의 의미 및 이에 해당하려면 구체화된 권리의 현실적인 행사가 방해된 경우라야 하는지 여부 / 직권남용 행위의 상대방이 공무원이거나 법령에 따라 일정한 공적 임무를 부여받고 있는 공공기관 등의 임직원인 경우, 상대방이 직권에 대응하여 어떠한 일을 한 것이 의무 없는 일인지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=231795"},{"id":"P:238313","kind":"P","label":"2022도10402","title":"위계공무집행방해·경범죄처벌법위반·응급의료에관한법률위반·업무방해·공무집행방해·모욕","court":"대법원","date":"2022.10.27","caseType":"형사","basis":"참조조문","text":"거짓신고로 인한 경범죄 처벌법 위반죄와 위계에 의한 공무집행방해죄의 성립 요건 및 보호법익 / 거짓신고 행위가 원인이 되어 상대방인 공무원이 범죄가 발생한 것으로 오인함으로 인하여 공무원이 그러한 사정을 알았더라면 하지 않았을 대응조치를 취하기에 이른 경우, 위계에 의한 공무집행방해죄가 성립하는지 여부 / 거짓신고가 ‘위계’의 수단·방법·태양의 하나가 된 경우, 위계에 의한 공무집행방해죄와 별도로 거짓신고로 인한 경범죄 처벌법 위반죄가 성립하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=238313"},{"id":"P:238319","kind":"P","label":"2021도12279","title":"금융실명거래및비밀보장에관한법률위반방조","court":"대법원","date":"2022.10.27","caseType":"형사","basis":"참조조문","text":"[1] 구 금융실명거래 및 비밀보장에 관한 법률 제3조 제3항, 제6조 제1항에서 불법·탈법적 목적에 의한 타인 실명의 금융거래를 처벌하는 취지 / 위 규정에서 정한 ‘그 밖의 탈법행위’의 의미 및 이에 해당하는지 판단하는 기준 [2] 방조범의 성립에 필요한 고의의 내용 / 목적범인 구 금융실명거래 및 비밀보장에 관한 법률 제6조 제1항 위반죄의 방조범 성립에 필요한 고의의 내용","url":"https://www.law.go.kr/precInfoP.do?precSeq=238319"},{"id":"P:233055","kind":"P","label":"2022두44354","title":"거부처분취소","court":"대법원","date":"2022.10.27","caseType":"일반행정","basis":"판결요지","text":"[1] 법해석의 방법과 한계 [2] 특정경제범죄 가중처벌 등에 관한 법률 제14조 제1항 제2호에서 정한 ‘징역형의 집행유예기간이 종료된 날부터 2년’은 취업제한기간의 종기를 규정한 것으로서 집행유예기간이 취업제한기간에 포함되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=233055"},{"id":"P:231805","kind":"P","label":"2019도10516","title":"폭력행위등처벌에관한법률위반(공동주거침입)·업무방해","court":"대법원","date":"2022.10.27","caseType":"형사","basis":"참조조문","text":"근로자의 쟁의행위가 형법상 정당행위에 해당하기 위한 요건 / 이러한 기준은 쟁의행위의 목적을 알리는 등 적법한 쟁의행위에 통상 수반되는 부수적 행위가 형법상 정당행위에 해당하는지를 판단할 때에도 동일하게 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=231805"},{"id":"P:238311","kind":"P","label":"2021도1965","title":"금융실명거래및비밀보장에관한법률위반방조","court":"대법원","date":"2022.10.27","caseType":"형사","basis":"참조조문","text":"[1] 구 금융실명거래 및 비밀보장에 관한 법률 제3조 제3항, 제6조 제1항에서 불법·탈법적 목적에 의한 타인 실명의 금융거래를
