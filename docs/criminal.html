살인의 죄","deleted":false,"text":"제255조(예비, 음모) 제250조와 제253조의 죄를 범할 목적으로 예비 또는 음모한 자는 10년 이하의 징역에 처한다.","kind":"L"},{"id":"L:256","label":"법 제256조","title":"자격정지의 병과","chapter":"제2편 각칙 제24장 살인의 죄","deleted":false,"text":"제256조(자격정지의 병과) 제250조, 제252조 또는 제253조의 경우에 유기징역에 처할 때에는 10년 이하의 자격정지를 병과할 수 있다.","kind":"L"},{"id":"L:257","label":"법 제257조","title":"상해, 존속상해","chapter":"제2편 각칙 제25장 상해와 폭행의 죄","deleted":false,"text":"①사람의 신체를 상해한 자는 7년 이하의 징역, 10년 이하의 자격정지 또는 1천만원 이하의 벌금에 처한다. <개정 1995.12.29>\n②자기 또는 배우자의 직계존속에 대하여 제1항의 죄를 범한 때에는 10년 이하의 징역 또는 1천500만원 이하의 벌금에 처한다. <개정 1995.12.29>\n③전 2항의 미수범은 처벌한다.\n제257조(상해, 존속상해)","kind":"L"},{"id":"L:258","label":"법 제258조","title":"중상해, 존속중상해","chapter":"제2편 각칙 제25장 상해와 폭행의 죄","deleted":false,"text":"①사람의 신체를 상해하여 생명에 대한 위험을 발생하게 한 자는 1년 이상 10년 이하의 징역에 처한다.\n②신체의 상해로 인하여 불구 또는 불치나 난치의 질병에 이르게 한 자도 전항의 형과 같다.\n③자기 또는 배우자의 직계존속에 대하여 전2항의 죄를 범한 때에는 2년 이상 15년 이하의 징역에 처한다. <개정 2016.1.6>\n제258조(중상해, 존속중상해)","kind":"L"},{"id":"L:258-2","label":"법 제258조의2","title":"특수상해","chapter":"제2편 각칙 제25장 상해와 폭행의 죄","deleted":false,"text":"① 단체 또는 다중의 위력을 보이거나 위험한 물건을 휴대하여 제257조제1항 또는 제2항의 죄를 범한 때에는 1년 이상 10년 이하의 징역에 처한다.\n② 단체 또는 다중의 위력을 보이거나 위험한 물건을 휴대하여 제258조의 죄를 범한 때에는 2년 이상 20년 이하의 징역에 처한다.\n③ 제1항의 미수범은 처벌한다.\n제258조의2(특수상해)","kind":"L"},{"id":"L:259","label":"법 제259조","title":"상해치사","chapter":"제2편 각칙 제25장 상해와 폭행의 죄","deleted":false,"text":"①사람의 신체를 상해하여 사망에 이르게 한 자는 3년 이상의 유기징역에 처한다. <개정 1995.12.29>\n②자기 또는 배우자의 직계존속에 대하여 전항의 죄를 범한 때에는 무기 또는 5년 이상의 징역에 처한다.\n제259조(상해치사)","kind":"L"},{"id":"L:260","label":"법 제260조","title":"폭행, 존속폭행","chapter":"제2편 각칙 제25장 상해와 폭행의 죄","deleted":false,"text":"①사람의 신체에 대하여 폭행을 가한 자는 2년 이하의 징역, 500만원 이하의 벌금, 구류 또는 과료에 처한다. <개정 1995.12.29>\n②자기 또는 배우자의 직계존속에 대하여 제1항의 죄를 범한 때에는 5년 이하의 징역 또는 700만원 이하의 벌금에 처한다. <개정 1995.12.29>\n③제1항 및 제2항의 죄는 피해자의 명시한 의사에 반하여 공소를 제기할 수 없다. <개정 1995.12.29>\n제260조(폭행, 존속폭행)","kind":"L"},{"id":"L:261","label":"법 제261조","title":"특수폭행","chapter":"제2편 각칙 제25장 상해와 폭행의 죄","deleted":false,"text":"제261조(특수폭행) 단체 또는 다중의 위력을 보이거나 위험한 물건을 휴대하여 제260조제1항 또는 제2항의 죄를 범한 때에는 5년 이하의 징역 또는 1천만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:262","label":"법 제262조","title":"폭행치사상","chapter":"제2편 각칙 제25장 상해와 폭행의 죄","deleted":false,"text":"제262조(폭행치사상) 제260조와 제261조의 죄를 지어 사람을 사망이나 상해에 이르게 한 경우에는 제257조부터 제259조까지의 예에 따른다.","kind":"L"},{"id":"L:263","label":"법 제263조","title":"동시범","chapter":"제2편 각칙 제25장 상해와 폭행의 죄","deleted":false,"text":"제263조(동시범) 독립행위가 경합하여 상해의 결과를 발생하게 한 경우에 있어서 원인된 행위가 판명되지 아니한 때에는 공동정범의 예에 의한다.","kind":"L"},{"id":"L:264","label":"법 제264조","title":"상습범","chapter":"제2편 각칙 제25장 상해와 폭행의 죄","deleted":false,"text":"제264조(상습범) 상습으로 제257조, 제258조, 제258조의2, 제260조 또는 제261조의 죄를 범한 때에는 그 죄에 정한 형의 2분의 1까지 가중한다. <개정 2016.1.6>","kind":"L"},{"id":"L:265","label":"법 제265조","title":"자격정지의 병과","chapter":"제2편 각칙 제25장 상해와 폭행의 죄","deleted":false,"text":"제265조(자격정지의 병과) 제257조제2항, 제258조, 제258조의2, 제260조제2항, 제261조 또는 전조의 경우에는 10년 이하의 자격정지를 병과할 수 있다. <개정 2016.1.6>","kind":"L"},{"id":"L:266","label":"법 제266조","title":"과실치상","chapter":"제2편 각칙 제26장 과실치사상의 죄","deleted":false,"text":"①과실로 인하여 사람의 신체를 상해에 이르게 한 자는 500만원 이하의 벌금, 구류 또는 과료에 처한다. <개정 1995.12.29>\n②제1항의 죄는 피해자의 명시한 의사에 반하여 공소를 제기할 수 없다. <개정 1995.12.29>\n제266조(과실치상)","kind":"L"},{"id":"L:267","label":"법 제267조","title":"과실치사","chapter":"제2편 각칙 제26장 과실치사상의 죄","deleted":false,"text":"제267조(과실치사) 과실로 인하여 사람을 사망에 이르게 한 자는 2년 이하의 금고 또는 700만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:268","label":"법 제268조","title":"업무상과실ㆍ중과실 치사상","chapter":"제2편 각칙 제26장 과실치사상의 죄","deleted":false,"text":"제268조(업무상과실ㆍ중과실 치사상) 업무상과실 또는 중대한 과실로 사람을 사망이나 상해에 이르게 한 자는 5년 이하의 금고 또는 2천만원 이하의 벌금에 처한다.","kind":"L"},{"id":"L:269","label":"법 제269조","title":"낙태","chapter":"제2편 각칙 제27장 낙태의 죄","deleted":false,"text":"①부녀가 약물 기타 방법으로 낙태한 때에는 1년 이하의 징역 또는 200만원 이하의 벌금에 처한다. <개정 1995.12.29>\n②부녀의 촉탁 또는 승낙을 받어 낙태하게 한 자도 제1항의 형과 같다. <개정 1995.12.29>\n③제2항의 죄를 범하여 부녀를 상해에 이르게 한때에는 3년 이하의 징역에 처한다. 사망에 이르게 한때에는 7년 이하의 징역에 처한다. <개정 1995.12.29>\n제269조(낙태)","kind":"L"},{"id":"L:270","label":"법 제270조","title":"의사 등의 낙태, 부동의낙태","chapter":"제2편 각칙 제27장 낙태의 죄","deleted":false,"text":"①의사, 한의사, 조산사, 약제사 또는 약종상이 부녀의 촉탁 또는 승낙을 받어 낙태하게 한 때에는 2년 이하의 징역에 처한다. <개정 1995.12.29>\n②부녀의 촉탁 또는 승낙없이 낙태하게 한 자는 3년 이하의 징역에 처한다\n③제1항 또는 제2항의 죄를 범하여 부녀를 상해에 이르게 한때에는 5년 이하의 징역에 처한다. 사망에 이르게 한때에는 10년 이하의 징역에 처한다. <개정 1995.12.29>\n④전 3항의 경우에는 7년 이하의 자격정지를 병과한다.\n제270조(의사 등의 낙태, 부동의낙태)","kind":"L"},{"id":"L:271","label":"법 제271조","title":"유기, 존속유기","chapter":"제2편 각칙 제28장 유기와 학대의 죄","deleted":false,"text":"① 나이가 많거나 어림, 질병 그 밖의 사정으로 도움이 필요한 사람을 법률상 또는 계약상 보호할 의무가 있는 자가 유기한 경우에는 3년 이하의 징역 또는 500만원 이하의 벌금에 처한다.\n② 자기 또는 배우자의 직계존속에 대하여 제1항의 죄를 지은 경우에는 10년 이하의 징역 또는 1천500만원 이하의 벌금에 처한다.\n③ 제1항의 죄를 지어 사람의 생명에 위험을 발생하게 한 경우에는 7년 이하의 징역에 처한다.\n④ 제2항의 죄를 지어 사람의 생명에 위험을 발생하게 한 경우에는 2년 이상의 유기징역에 처한다.\n제271조(유기, 존속유기)","kind":"L"},{"id":"L:272","label":"법 제272조","title":"","chapter":"제2편 각칙 제28장 유기와 학대의 죄","deleted":true,"text":"제272조 삭제 <2023.8.8>","kind":"L"},{"id":"L:273","label":"법 제273조","title":"학대, 존속학대","chapter":"제2편 각칙 제28장 유기와 학대의 죄","deleted":false,"text":"①자기의 보호 또는 감독을 받는 사람을 학대한 자는 2년 이하의 징역 또는 500만원 이하의 벌금에 처한다. <개정 1995.12.29>\n②자기 또는 배우자의 직계존속에 대하여 전항의 죄를 범한 때에는 5년 이하의 징역 또는 700만원 이하의 벌금에 처한다. <개정 1995.12.29>\n제273조(학대, 존속학대)","kind":"L"},{"id":"L:274","label":"법 제274조","title":"아동혹사","chapter":"제2편 각칙 제28장 유기와 학대의 죄","deleted":false,"text":"제274조(아동혹사) 자기의 보호 또는 감독을 받는 16세 미만의 자를 그 생명 또는 신체에 위험한 업무에 사용할 영업자 또는 그 종업자에게 인도한 자는 5년 이하의 징역에 처한다. 그 인도를 받은 자도 같다.","kind":"L"},{"id":"L:275","label":"법 제275조","title":"유기등 치사상","chapter":"제2편 각칙 제28장 유기와 학대의 죄","deleted":false,"text":"① 제271조 또는 제273조의 죄를 범하여 사람을 상해에 이르게 한 때에는 7년 이하의 징역에 처한다. 사망에 이르게 한 때에는 3년 이상의 유기징역에 처한다. <개정 2023.8.8>\n②자기 또는 배우자의 직계존속에 대하여 제271조 또는 제273조의 죄를 범하여 상해에 이르게 한 때에는 3년 이상의 유기징역에 처한다. 사망에 이르게 한 때에는 무기 또는 5년이상의 징역에 처한다.\n제275조(유기등 치사상)","kind":"L"},{"id":"L:276","label":"법 제276조","title":"체포, 감금, 존속체포, 존속감금","chapter":"제2편 각칙 제29장 체포와 감금의 죄","deleted":false,"text":"①사람을 체포 또는 감금한 자는 5년 이하의 징역 또는 700만원 이하의 벌금에 처한다. <개정 1995.12.29>\n②자기 또는 배우자의 직계존속에 대하여 제1항의 죄를 범한 때에는 10년 이하의 징역 또는 1천500만원 이하의 벌금에 처한다. <개정 1995.12.29>\n제276조(체포, 감금, 존속체포, 존속감금)","kind":"L"},{"id":"L:277","label":"법 제277조","title":"중체포, 중감금, 존속중체포, 존속중감금","chapter":"제2편 각칙 제29장 체포와 감금의 죄","deleted":false,"text":"①사람을 체포 또는 감금하여 가혹한 행위를 가한 자는 7년 이하의 징역에 처한다.\n②자기 또는 배우자의 직계존속에 대하여 전항의 죄를 범한 때에는 2년 이상의 유기징역에 처한다.\n제277조(중체포, 중감금, 존속중체포, 존속중감금)","kind":"L"},{"id":"L:278","label":"법 제278조","title":"특수체포, 특수감금","chapter":"제2편 각칙 제29장 체포와 감금의 죄","deleted":false,"text":"제278조(특수체포, 특수감금) 단체 또는 다중의 위력을 보이거나 위험한 물건을 휴대하여 전 2조의 죄를 범한 때에는 그 죄에 정한 형의 2분의 1까지 가중한다.","kind":"L"},{"id":"L:279","label":"법 제279조","title":"상습범","chapter":"제2편 각칙 제29장 체포와 감금의 죄","deleted":false,"text":"제279조(상습범) 상습으로 제276조 또는 제277조의 죄를 범한 때에는 전조의 예에 의한다.","kind":"L"},{"id":"L:280","label":"법 제280조","title":"미수범","chapter":"제2편 각칙 제29장 체포와 감금의 죄","deleted":false,"text":"제280조(미수범) 전4조의 미수범은 처벌한다.","kind":"L"},{"id":"L:281","label":"법 제281조","title":"체포ㆍ감금등의 치사상","chapter":"제2편 각칙 제29장 체포와 감금의 죄","deleted":false,"text":"①제276조 내지 제280조의 죄를 범하여 사람을 상해에 이르게 한 때에는 1년 이상의 유기징역에 처한다. 사망에 이르게 한 때에는 3년 이상의 유기징역에 처한다.\n②자기 또는 배우자의 직계존속에 대하여 제276조 내지 제280조의 죄를 범하여 상해에 이르게 한 때에는 2년 이상의 유기징역에 처한다. 사망에 이르게 한 때에는 무기 또는 5년이상의 징역에 처한다.\n제281조(체포ㆍ감금등의 치사상)","kind":"L"},{"id":"L:282","label":"법 제282조","title":"자격정지의 병과","chapter":"제2편 각칙 제29장 체포와 감금의 죄","deleted":false,"text":"제282조(자격정지의 병과) 본장의 죄에는 10년 이하의 자격정지를 병과할 수 있다.","kind":"L"},{"id":"L:283","label":"법 제283조","title":"협박, 존속협박","chapter":"제2편 각칙 제30장 협박의 죄","deleted":false,"text":"①사람을 협박한 자는 3년 이하의 징역, 500만원 이하의 벌금, 구류 또는 과료에 처한다. <개정 1995.12.29>\n②자기 또는 배우자의 직계존속에 대하여 제1항의 죄를 범한 때에는 5년 이하의 징역 또는 700만원 이하의 벌금에 처한다. <개정 1995.12.29>\n③제1항 및 제2항의 죄는 피해자의 명시한 의사에 반하여 공소를 제기할 수 없다. <개정 1995.12.29>\n제283조(협박, 존속협박)","kind":"L"},{"id":"L:284","label":"법 제284조","title":"특수협박","chapter":"제2편 각칙 제30장 협박의 죄","deleted":false,"text":"제284조(특수협박) 단체 또는 다중의 위력을 보이거나 위험한 물건을 휴대하여 전조제1항, 제2항의 죄를 범한 때에는 7년 이하의 징역 또는 1천만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:285","label":"법 제285조","title":"상습범","chapter":"제2편 각칙 제30장 협박의 죄","deleted":false,"text":"제285조(상습범) 상습으로 제283조제1항, 제2항 또는 전조의 죄를 범한 때에는 그 죄에 정한 형의 2분의 1까지 가중한다.","kind":"L"},{"id":"L:286","label":"법 제286조","title":"미수범","chapter":"제2편 각칙 제30장 협박의 죄","deleted":false,"text":"제286조(미수범) 전3조의 미수범은 처벌한다.","kind":"L"},{"id":"L:287","label":"법 제287조","title":"미성년자의 약취, 유인","chapter":"제2편 각칙 제31장 약취(略取), 유인(誘引) 및 인신매매의 죄","deleted":false,"text":"제287조(미성년자의 약취, 유인) 미성년자를 약취 또는 유인한 사람은 10년 이하의 징역에 처한다.","kind":"L"},{"id":"L:288","label":"법 제288조","title":"추행 등 목적 약취, 유인 등","chapter":"제2편 각칙 제31장 약취(略取), 유인(誘引) 및 인신매매의 죄","deleted":false,"text":"① 추행, 간음, 결혼 또는 영리의 목적으로 사람을 약취 또는 유인한 사람은 1년 이상 10년 이하의 징역에 처한다.\n② 노동력 착취, 성매매와 성적 착취, 장기적출을 목적으로 사람을 약취 또는 유인한 사람은 2년 이상 15년 이하의 징역에 처한다.\n③ 국외에 이송할 목적으로 사람을 약취 또는 유인하거나 약취 또는 유인된 사람을 국외에 이송한 사람도 제2항과 동일한 형으로 처벌한다.\n제288조(추행 등 목적 약취, 유인 등)","kind":"L"},{"id":"L:289","label":"법 제289조","title":"인신매매","chapter":"제2편 각칙 제31장 약취(略取), 유인(誘引) 및 인신매매의 죄","deleted":false,"text":"① 사람을 매매한 사람은 7년 이하의 징역에 처한다.\n② 추행, 간음, 결혼 또는 영리의 목적으로 사람을 매매한 사람은 1년 이상 10년 이하의 징역에 처한다.\n③ 노동력 착취, 성매매와 성적 착취, 장기적출을 목적으로 사람을 매매한 사람은 2년 이상 15년 이하의 징역에 처한다.\n④ 국외에 이송할 목적으로 사람을 매매하거나 매매된 사람을 국외로 이송한 사람도 제3항과 동일한 형으로 처벌한다.\n제289조(인신매매)","kind":"L"},{"id":"L:290","label":"법 제290조","title":"약취, 유인, 매매, 이송 등 상해ㆍ치상","chapter":"제2편 각칙 제31장 약취(略取), 유인(誘引) 및 인신매매의 죄","deleted":false,"text":"① 제287조부터 제289조까지의 죄를 범하여 약취, 유인, 매매 또는 이송된 사람을 상해한 때에는 3년 이상 25년 이하의 징역에 처한다.\n② 제287조부터 제289조까지의 죄를 범하여 약취, 유인, 매매 또는 이송된 사람을 상해에 이르게 한 때에는 2년 이상 20년 이하의 징역에 처한다.\n제290조(약취, 유인, 매매, 이송 등 상해ㆍ치상)","kind":"L"},{"id":"L:291","label":"법 제291조","title":"약취, 유인, 매매, 이송 등 살인ㆍ치사","chapter":"제2편 각칙 제31장 약취(略取), 유인(誘引) 및 인신매매의 죄","deleted":false,"text":"① 제287조부터 제289조까지의 죄를 범하여 약취, 유인, 매매 또는 이송된 사람을 살해한 때에는 사형, 무기 또는 7년 이상의 징역에 처한다.\n② 제287조부터 제289조까지의 죄를 범하여 약취, 유인, 매매 또는 이송된 사람을 사망에 이르게 한 때에는 무기 또는 5년 이상의 징역에 처한다.\n제291조(약취, 유인, 매매, 이송 등 살인ㆍ치사)","kind":"L"},{"id":"L:292","label":"법 제292조","title":"약취, 유인, 매매, 이송된 사람의 수수ㆍ은닉 등","chapter":"제2편 각칙 제31장 약취(略取), 유인(誘引) 및 인신매매의 죄","deleted":false,"text":"① 제287조부터 제289조까지의 죄로 약취, 유인, 매매 또는 이송된 사람을 수수(授受) 또는 은닉한 사람은 7년 이하의 징역에 처한다.\n② 제287조부터 제289조까지의 죄를 범할 목적으로 사람을 모집, 운송, 전달한 사람도 제1항과 동일한 형으로 처벌한다.\n제292조(약취, 유인, 매매, 이송된 사람의 수수ㆍ은닉 등)","kind":"L"},{"id":"L:293","label":"법 제293조","title":"","chapter":"제2편 각칙 제31장 약취(略取), 유인(誘引) 및 인신매매의 죄","deleted":true,"text":"제293조 삭제 <2013.4.5>","kind":"L"},{"id":"L:294","label":"법 제294조","title":"미수범","chapter":"제2편 각칙 제31장 약취(略取), 유인(誘引) 및 인신매매의 죄","deleted":false,"text":"제294조(미수범) 제287조부터 제289조까지, 제290조제1항, 제291조제1항과 제292조제1항의 미수범은 처벌한다.","kind":"L"},{"id":"L:295","label":"법 제295조","title":"벌금의 병과","chapter":"제2편 각칙 제31장 약취(略取), 유인(誘引) 및 인신매매의 죄","deleted":false,"text":"제295조(벌금의 병과) 제288조부터 제291조까지, 제292조제1항의 죄와 그 미수범에 대하여는 5천만원 이하의 벌금을 병과할 수 있다.","kind":"L"},{"id":"L:295-2","label":"법 제295조의2","title":"형의 감경","chapter":"제2편 각칙 제31장 약취(略取), 유인(誘引) 및 인신매매의 죄","deleted":false,"text":"제295조의2(형의 감경) 제287조부터 제290조까지, 제292조와 제294조의 죄를 범한 사람이 약취, 유인, 매매 또는 이송된 사람을 안전한 장소로 풀어준 때에는 그 형을 감경할 수 있다.","kind":"L"},{"id":"L:296","label":"법 제296조","title":"예비, 음모","chapter":"제2편 각칙 제31장 약취(略取), 유인(誘引) 및 인신매매의 죄","deleted":false,"text":"제296조(예비, 음모) 제287조부터 제289조까지, 제290조제1항, 제291조제1항과 제292조제1항의 죄를 범할 목적으로 예비 또는 음모한 사람은 3년 이하의 징역에 처한다.","kind":"L"},{"id":"L:296-2","label":"법 제296조의2","title":"세계주의","chapter":"제2편 각칙 제31장 약취(略取), 유인(誘引) 및 인신매매의 죄","deleted":false,"text":"제296조의2(세계주의) 제287조부터 제292조까지 및 제294조는 대한민국 영역 밖에서 죄를 범한 외국인에게도 적용한다.","kind":"L"},{"id":"L:297","label":"법 제297조","title":"강간","chapter":"제2편 각칙 제32장 강간과 추행의 죄","deleted":false,"text":"제297조(강간) 폭행 또는 협박으로 사람을 강간한 자는 3년 이상의 유기징역에 처한다. <개정 2012.12.18>","kind":"L"},{"id":"L:297-2","label":"법 제297조의2","title":"유사강간","chapter":"제2편 각칙 제32장 강간과 추행의 죄","deleted":false,"text":"제297조의2(유사강간) 폭행 또는 협박으로 사람에 대하여 구강, 항문 등 신체(성기는 제외한다)의 내부에 성기를 넣거나 성기, 항문에 손가락 등 신체(성기는 제외한다)의 일부 또는 도구를 넣는 행위를 한 사람은 2년 이상의 유기징역에 처한다.","kind":"L"},{"id":"L:298","label":"법 제298조","title":"강제추행","chapter":"제2편 각칙 제32장 강간과 추행의 죄","deleted":false,"text":"제298조(강제추행) 폭행 또는 협박으로 사람에 대하여 추행을 한 자는 10년 이하의 징역 또는 1천500만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:299","label":"법 제299조","title":"준강간, 준강제추행","chapter":"제2편 각칙 제32장 강간과 추행의 죄","deleted":false,"text":"제299조(준강간, 준강제추행) 사람의 심신상실 또는 항거불능의 상태를 이용하여 간음 또는 추행을 한 자는 제297조, 제297조의2 및 제298조의 예에 의한다. <개정 2012.12.18>","kind":"L"},{"id":"L:300","label":"법 제300조","title":"미수범","chapter":"제2편 각칙 제32장 강간과 추행의 죄","deleted":false,"text":"제300조(미수범) 제297조, 제297조의2, 제298조 및 제299조의 미수범은 처벌한다. <개정 2012.12.18>","kind":"L"},{"id":"L:301","label":"법 제301조","title":"강간 등 상해ㆍ치상","chapter":"제2편 각칙 제32장 강간과 추행의 죄","deleted":false,"text":"제301조(강간 등 상해ㆍ치상) 제297조, 제297조의2 및 제298조부터 제300조까지의 죄를 범한 자가 사람을 상해하거나 상해에 이르게 한 때에는 무기 또는 5년 이상의 징역에 처한다. <개정 2012.12.18>","kind":"L"},{"id":"L:301-2","label":"법 제301조의2","title":"강간등 살인ㆍ치사","chapter":"제2편 각칙 제32장 강간과 추행의 죄","deleted":false,"text":"제301조의2(강간등 살인ㆍ치사) 제297조, 제297조의2 및 제298조부터 제300조까지의 죄를 범한 자가 사람을 살해한 때에는 사형 또는 무기징역에 처한다. 사망에 이르게 한 때에는 무기 또는 10년 이상의 징역에 처한다. <개정 2012.12.18>","kind":"L"},{"id":"L:302","label":"법 제302조","title":"미성년자 등에 대한 간음","chapter":"제2편 각칙 제32장 강간과 추행의 죄","deleted":false,"text":"제302조(미성년자 등에 대한 간음) 미성년자 또는 심신미약자에 대하여 위계 또는 위력으로써 간음 또는 추행을 한 자는 5년 이하의 징역에 처한다.","kind":"L"},{"id":"L:303","label":"법 제303조","title":"업무상위력 등에 의한 간음","chapter":"제2편 각칙 제32장 강간과 추행의 죄","deleted":false,"text":"①업무, 고용 기타 관계로 인하여 자기의 보호 또는 감독을 받는 사람에 대하여 위계 또는 위력으로써 간음한 자는 7년 이하의 징역 또는 3천만원 이하의 벌금에 처한다. <개정 1995.12.29, 2012.12.18, 2018.10.16>\n②법률에 의하여 구금된 사람을 감호하는 자가 그 사람을 간음한 때에는 10년 이하의 징역에 처한다. <개정 2012.12.18, 2018.10.16>\n제303조(업무상위력 등에 의한 간음)","kind":"L"},{"id":"L:304","label":"법 제304조","title":"","chapter":"제2편 각칙 제32장 강간과 추행의 죄","deleted":true,"text":"제304조 삭제 <2012.12.18>","kind":"L"},{"id":"L:305","label":"법 제305조","title":"미성년자에 대한 간음, 추행","chapter":"제2편 각칙 제32장 강간과 추행의 죄","deleted":false,"text":"① 13세 미만의 사람에 대하여 간음 또는 추행을 한 자는 제297조, 제297조의2, 제298조, 제301조 또는 제301조의2의 예에 의한다. <개정 1995.12.29, 2012.12.18, 2020.5.19>\n② 13세 이상 16세 미만의 사람에 대하여 간음 또는 추행을 한 19세 이상의 자는 제297조, 제297조의2, 제298조, 제301조 또는 제301조의2의 예에 의한다. <신설 2020.5.19>\n제305조(미성년자에 대한 간음, 추행)","kind":"L"},{"id":"L:305-2","label":"법 제305조의2","title":"상습범","chapter":"제2편 각칙 제32장 강간과 추행의 죄","deleted":false,"text":"제305조의2(상습범) 상습으로 제297조, 제297조의2, 제298조부터 제300조까지, 제302조, 제303조 또는 제305조의 죄를 범한 자는 그 죄에 정한 형의 2분의 1까지 가중한다. <개정 2012.12.18>","kind":"L"},{"id":"L:305-3","label":"법 제305조의3","title":"예비, 음모","chapter":"제2편 각칙 제32장 강간과 추행의 죄","deleted":false,"text":"제305조의3(예비, 음모) 제297조, 제297조의2, 제299조(준강간죄에 한정한다), 제301조(강간 등 상해죄에 한정한다) 및 제305조의 죄를 범할 목적으로 예비 또는 음모한 사람은 3년 이하의 징역에 처한다.","kind":"L"},{"id":"L:306","label":"법 제306조","title":"","chapter":"제2편 각칙 제32장 강간과 추행의 죄","deleted":true,"text":"제306조 삭제 <2012.12.18>","kind":"L"},{"id":"L:307","label":"법 제307조","title":"명예훼손","chapter":"제2편 각칙 제33장 명예에 관한 죄","deleted":false,"text":"①공연히 사실을 적시하여 사람의 명예를 훼손한 자는 2년 이하의 징역이나 금고 또는 500만원 이하의 벌금에 처한다. <개정 1995.12.29>\n②공연히 허위의 사실을 적시하여 사람의 명예를 훼손한 자는 5년 이하의 징역, 10년 이하의 자격정지 또는 1천만원 이하의 벌금에 처한다. <개정 1995.12.29>\n제307조(명예훼손)","kind":"L"},{"id":"L:308","label":"법 제308조","title":"사자의 명예훼손","chapter":"제2편 각칙 제33장 명예에 관한 죄","deleted":false,"text":"제308조(사자의 명예훼손) 공연히 허위의 사실을 적시하여 사자의 명예를 훼손한 자는 2년 이하의 징역이나 금고 또는 500만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:309","label":"법 제309조","title":"출판물 등에 의한 명예훼손","chapter":"제2편 각칙 제33장 명예에 관한 죄","deleted":false,"text":"①사람을 비방할 목적으로 신문, 잡지 또는 라디오 기타 출판물에 의하여 제307조제1항의 죄를 범한 자는 3년 이하의 징역이나 금고 또는 700만원 이하의 벌금에 처한다. <개정 1995.12.29>\n②제1항의 방법으로 제307조제2항의 죄를 범한 자는 7년 이하의 징역, 10년 이하의 자격정지 또는 1천500만원 이하의 벌금에 처한다. <개정 1995.12.29>\n제309조(출판물 등에 의한 명예훼손)","kind":"L"},{"id":"L:310","label":"법 제310조","title":"위법성의 조각","chapter":"제2편 각칙 제33장 명예에 관한 죄","deleted":false,"text":"제310조(위법성의 조각) 제307조제1항의 행위가 진실한 사실로서 오로지 공공의 이익에 관한 때에는 처벌하지 아니한다.","kind":"L"},{"id":"L:311","label":"법 제311조","title":"모욕","chapter":"제2편 각칙 제33장 명예에 관한 죄","deleted":false,"text":"제311조(모욕) 공연히 사람을 모욕한 자는 1년 이하의 징역이나 금고 또는 200만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:312","label":"법 제312조","title":"고소와 피해자의 의사","chapter":"제2편 각칙 제33장 명예에 관한 죄","deleted":false,"text":"①제308조와 제311조의 죄는 고소가 있어야 공소를 제기할 수 있다. <개정 1995.12.29>\n②제307조와 제309조의 죄는 피해자의 명시한 의사에 반하여 공소를 제기할 수 없다. <개정 1995.12.29>\n제312조(고소와 피해자의 의사)","kind":"L"},{"id":"L:313","label":"법 제313조","title":"신용훼손","chapter":"제2편 각칙 제34장 신용, 업무와 경매에 관한 죄","deleted":false,"text":"제313조(신용훼손) 허위의 사실을 유포하거나 기타 위계로써 사람의 신용을 훼손한 자는 5년 이하의 징역 또는 1천500만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:314","label":"법 제314조","title":"업무방해","chapter":"제2편 각칙 제34장 신용, 업무와 경매에 관한 죄","deleted":false,"text":"①제313조의 방법 또는 위력으로써 사람의 업무를 방해한 자는 5년 이하의 징역 또는 1천500만원 이하의 벌금에 처한다. <개정 1995.12.29>\n②컴퓨터등 정보처리장치 또는 전자기록등 특수매체기록을 손괴하거나 정보처리장치에 허위의 정보 또는 부정한 명령을 입력하거나 기타 방법으로 정보처리에 장애를 발생하게 하여 사람의 업무를 방해한 자도 제1항의 형과 같다. <신설 1995.12.29>\n제314조(업무방해)","kind":"L"},{"id":"L:315","label":"법 제315조","title":"경매, 입찰의 방해","chapter":"제2편 각칙 제34장 신용, 업무와 경매에 관한 죄","deleted":false,"text":"제315조(경매, 입찰의 방해) 위계 또는 위력 기타 방법으로 경매 또는 입찰의 공정을 해한 자는 2년 이하의 징역 또는 700만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:316","label":"법 제316조","title":"비밀침해","chapter":"제2편 각칙 제35장 비밀침해의 죄","deleted":false,"text":"①봉함 기타 비밀장치한 사람의 편지, 문서 또는 도화를 개봉한 자는 3년 이하의 징역이나 금고 또는 500만원 이하의 벌금에 처한다. <개정 1995.12.29>\n②봉함 기타 비밀장치한 사람의 편지, 문서, 도화 또는 전자기록등 특수매체기록을 기술적 수단을 이용하여 그 내용을 알아낸 자도 제1항의 형과 같다. <신설 1995.12.29>\n제316조(비밀침해)","kind":"L"},{"id":"L:317","label":"법 제317조","title":"업무상비밀누설","chapter":"제2편 각칙 제35장 비밀침해의 죄","deleted":false,"text":"①의사, 한의사, 치과의사, 약제사, 약종상, 조산사, 변호사, 변리사, 공인회계사, 공증인, 대서업자나 그 직무상 보조자 또는 차등의 직에 있던 자가 그 직무처리중 지득한 타인의 비밀을 누설한 때에는 3년 이하의 징역이나 금고, 10년 이하의 자격정지 또는 700만원 이하의 벌금에 처한다. <개정 1995.12.29, 1997.12.13>\n②종교의 직에 있는 자 또는 있던 자가 그 직무상 지득한 사람의 비밀을 누설한 때에도 전항의 형과 같다.\n제317조(업무상비밀누설)","kind":"L"},{"id":"L:318","label":"법 제318조","title":"고소","chapter":"제2편 각칙 제35장 비밀침해의 죄","deleted":false,"text":"제318조(고소) 본장의 죄는 고소가 있어야 공소를 제기할 수 있다. <개정 1995.12.29>","kind":"L"},{"id":"L:319","label":"법 제319조","title":"주거침입, 퇴거불응","chapter":"제2편 각칙 제36장 주거침입의 죄","deleted":false,"text":"①사람의 주거, 관리하는 건조물, 선박이나 항공기 또는 점유하는 방실에 침입한 자는 3년 이하의 징역 또는 500만원 이하의 벌금에 처한다. <개정 1995.12.29>\n②전항의 장소에서 퇴거요구를 받고 응하지 아니한 자도 전항의 형과 같다.\n제319조(주거침입, 퇴거불응)","kind":"L"},{"id":"L:320","label":"법 제320조","title":"특수주거침입","chapter":"제2편 각칙 제36장 주거침입의 죄","deleted":false,"text":"제320조(특수주거침입) 단체 또는 다중의 위력을 보이거나 위험한 물건을 휴대하여 전조의 죄를 범한 때에는 5년 이하의 징역에 처한다.","kind":"L"},{"id":"L:321","label":"법 제321조","title":"주거ㆍ신체 수색","chapter":"제2편 각칙 제36장 주거침입의 죄","deleted":false,"text":"제321조(주거ㆍ신체 수색) 사람의 신체, 주거, 관리하는 건조물, 자동차, 선박이나 항공기 또는 점유하는 방실을 수색한 자는 3년 이하의 징역에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:322","label":"법 제322조","title":"미수범","chapter":"제2편 각칙 제36장 주거침입의 죄","deleted":false,"text":"제322조(미수범) 본장의 미수범은 처벌한다.","kind":"L"},{"id":"L:323","label":"법 제323조","title":"권리행사방해","chapter":"제2편 각칙 제37장 권리행사를 방해하는 죄","deleted":false,"text":"제323조(권리행사방해) 타인의 점유 또는 권리의 목적이 된 자기의 물건 또는 전자기록등 특수매체기록을 취거, 은닉 또는 손괴하여 타인의 권리행사를 방해한 자는 5년 이하의 징역 또는 700만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:324","label":"법 제324조","title":"강요","chapter":"제2편 각칙 제37장 권리행사를 방해하는 죄","deleted":false,"text":"①폭행 또는 협박으로 사람의 권리행사를 방해하거나 의무없는 일을 하게 한 자는 5년 이하의 징역 또는 3천만원 이하의 벌금에 처한다. <개정 1995.12.29, 2016.1.6>\n② 단체 또는 다중의 위력을 보이거나 위험한 물건을 휴대하여 제1항의 죄를 범한 자는 10년 이하의 징역 또는 5천만원 이하의 벌금에 처한다. <신설 2016.1.6>\n제324조(강요)","kind":"L"},{"id":"L:324-2","label":"법 제324조의2","title":"인질강요","chapter":"제2편 각칙 제37장 권리행사를 방해하는 죄","deleted":false,"text":"제324조의2(인질강요) 사람을 체포ㆍ감금ㆍ약취 또는 유인하여 이를 인질로 삼아 제3자에 대하여 권리행사를 방해하거나 의무없는 일을 하게 한 자는 3년 이상의 유기징역에 처한다.","kind":"L"},{"id":"L:324-3","label":"법 제324조의3","title":"인질상해ㆍ치상","chapter":"제2편 각칙 제37장 권리행사를 방해하는 죄","deleted":false,"text":"제324조의3(인질상해ㆍ치상) 제324조의2의 죄를 범한 자가 인질을 상해하거나 상해에 이르게 한 때에는 무기 또는 5년 이상의 징역에 처한다.","kind":"L"},{"id":"L:324-4","label":"법 제324조의4","title":"인질살해ㆍ치사","chapter":"제2편 각칙 제37장 권리행사를 방해하는 죄","deleted":false,"text":"제324조의4(인질살해ㆍ치사) 제324조의2의 죄를 범한 자가 인질을 살해한 때에는 사형 또는 무기징역에 처한다. 사망에 이르게 한 때에는 무기 또는 10년 이상의 징역에 처한다.","kind":"L"},{"id":"L:324-5","label":"법 제324조의5","title":"미수범","chapter":"제2편 각칙 제37장 권리행사를 방해하는 죄","deleted":false,"text":"제324조의5(미수범) 제324조 내지 제324조의4의 미수범은 처벌한다.","kind":"L"},{"id":"L:324-6","label":"법 제324조의6","title":"형의 감경","chapter":"제2편 각칙 제37장 권리행사를 방해하는 죄","deleted":false,"text":"제324조의6(형의 감경) 제324조의2 또는 제324조의3의 죄를 범한 자 및 그 죄의 미수범이 인질을 안전한 장소로 풀어준 때에는 그 형을 감경할 수 있다.","kind":"L"},{"id":"L:325","label":"법 제325조","title":"점유강취, 준점유강취","chapter":"제2편 각칙 제37장 권리행사를 방해하는 죄","deleted":false,"text":"① 폭행 또는 협박으로 타인의 점유에 속하는 자기의 물건을 강취(强取)한 자는 7년 이하의 징역 또는 10년 이하의 자격정지에 처한다.\n② 타인의 점유에 속하는 자기의 물건을 취거(取去)하는 과정에서 그 물건의 탈환에 항거하거나 체포를 면탈하거나 범죄의 흔적을 인멸할 목적으로 폭행 또는 협박한 때에도 제1항의 형에 처한다.\n③ 제1항과 제2항의 미수범은 처벌한다.\n제325조(점유강취, 준점유강취)","kind":"L"},{"id":"L:326","label":"법 제326조","title":"중권리행사방해","chapter":"제2편 각칙 제37장 권리행사를 방해하는 죄","deleted":false,"text":"제326조(중권리행사방해) 제324조 또는 제325조의 죄를 범하여 사람의 생명에 대한 위험을 발생하게 한 자는 10년 이하의 징역에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:327","label":"법 제327조","title":"강제집행면탈","chapter":"제2편 각칙 제37장 권리행사를 방해하는 죄","deleted":false,"text":"제327조(강제집행면탈) 강제집행을 면할 목적으로 재산을 은닉, 손괴, 허위양도 또는 허위의 채무를 부담하여 채권자를 해한 자는 3년 이하의 징역 또는 1천만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:328","label":"법 제328조","title":"친족 사이의 범행과 고소","chapter":"제2편 각칙 제37장 권리행사를 방해하는 죄","deleted":false,"text":"① 제323조의 죄를 지은 사람이 피해자의 친족인 경우에는 고소가 있어야 공소를 제기할 수 있다. 이 경우 「형사소송법」 제224조 및 「군사법원법」 제266조에도 불구하고 자기 또는 배우자의 직계존속을 고소할 수 있다. <개정 2025.12.31>\n② 삭제 <2025.12.31>\n③ 피해자의 친족이 아닌 공범에 대해서는 제1항을 적용하지 아니한다. <개정 2025.12.31>\n제328조(친족 사이의 범행과 고소)","kind":"L"},{"id":"L:329","label":"법 제329조","title":"절도","chapter":"제2편 각칙 제38장 절도와 강도의 죄","deleted":false,"text":"제329조(절도) 타인의 재물을 절취한 자는 6년 이하의 징역 또는 1천만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:330","label":"법 제330조","title":"야간주거침입절도","chapter":"제2편 각칙 제38장 절도와 강도의 죄","deleted":false,"text":"제330조(야간주거침입절도) 야간에 사람의 주거, 관리하는 건조물, 선박, 항공기 또는 점유하는 방실(房室)에 침입하여 타인의 재물을 절취(竊取)한 자는 10년 이하의 징역에 처한다.","kind":"L"},{"id":"L:331","label":"법 제331조","title":"특수절도","chapter":"제2편 각칙 제38장 절도와 강도의 죄","deleted":false,"text":"① 야간에 문이나 담 그 밖의 건조물의 일부를 손괴하고 제330조의 장소에 침입하여 타인의 재물을 절취한 자는 1년 이상 10년 이하의 징역에 처한다.\n② 흉기를 휴대하거나 2명 이상이 합동하여 타인의 재물을 절취한 자도 제1항의 형에 처한다.\n제331조(특수절도)","kind":"L"},{"id":"L:331-2","label":"법 제331조의2","title":"자동차등 불법사용","chapter":"제2편 각칙 제38장 절도와 강도의 죄","deleted":false,"text":"제331조의2(자동차등 불법사용) 권리자의 동의없이 타인의 자동차, 선박, 항공기 또는 원동기장치자전거를 일시 사용한 자는 3년 이하의 징역, 500만원 이하의 벌금, 구류 또는 과료에 처한다.","kind":"L"},{"id":"L:332","label":"법 제332조","title":"상습범","chapter":"제2편 각칙 제38장 절도와 강도의 죄","deleted":false,"text":"제332조(상습범) 상습으로 제329조 내지 제331조의2의 죄를 범한 자는 그 죄에 정한 형의 2분의 1까지 가중한다. <개정 1995.12.29>","kind":"L"},{"id":"L:333","label":"법 제333조","title":"강도","chapter":"제2편 각칙 제38장 절도와 강도의 죄","deleted":false,"text":"제333조(강도) 폭행 또는 협박으로 타인의 재물을 강취하거나 기타 재산상의 이익을 취득하거나 제삼자로 하여금 이를 취득하게 한 자는 3년 이상의 유기징역에 처한다.","kind":"L"},{"id":"L:334","label":"법 제334조","title":"특수강도","chapter":"제2편 각칙 제38장 절도와 강도의 죄","deleted":false,"text":"①야간에 사람의 주거, 관리하는 건조물, 선박이나 항공기 또는 점유하는 방실에 침입하여 제333조의 죄를 범한 자는 무기 또는 5년 이상의 징역에 처한다. <개정 1995.12.29>\n②흉기를 휴대하거나 2인 이상이 합동하여 전조의 죄를 범한 자도 전항의 형과 같다.\n제334조(특수강도)","kind":"L"},{"id":"L:335","label":"법 제335조","title":"준강도","chapter":"제2편 각칙 제38장 절도와 강도의 죄","deleted":false,"text":"제335조(준강도) 절도가 재물의 탈환에 항거하거나 체포를 면탈하거나 범죄의 흔적을 인멸할 목적으로 폭행 또는 협박한 때에는 제333조 및 제334조의 예에 따른다.","kind":"L"},{"id":"L:336","label":"법 제336조","title":"인질강도","chapter":"제2편 각칙 제38장 절도와 강도의 죄","deleted":false,"text":"제336조(인질강도) 사람을 체포ㆍ감금ㆍ약취 또는 유인하여 이를 인질로 삼아 재물 또는 재산상의 이익을 취득하거나 제3자로 하여금 이를 취득하게 한 자는 3년 이상의 유기징역에 처한다.","kind":"L"},{"id":"L:337","label":"법 제337조","title":"강도상해, 치상","chapter":"제2편 각칙 제38장 절도와 강도의 죄","deleted":false,"text":"제337조(강도상해, 치상) 강도가 사람을 상해하거나 상해에 이르게 한때에는 무기 또는 7년 이상의 징역에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:338","label":"법 제338조","title":"강도살인ㆍ치사","chapter":"제2편 각칙 제38장 절도와 강도의 죄","deleted":false,"text":"제338조(강도살인ㆍ치사) 강도가 사람을 살해한 때에는 사형 또는 무기징역에 처한다. 사망에 이르게 한 때에는 무기 또는 10년 이상의 징역에 처한다.","kind":"L"},{"id":"L:339","label":"법 제339조","title":"강도강간","chapter":"제2편 각칙 제38장 절도와 강도의 죄","deleted":false,"text":"제339조(강도강간) 강도가 사람을 강간한 때에는 무기 또는 10년 이상의 징역에 처한다. <개정 2012.12.18>","kind":"L"},{"id":"L:340","label":"법 제340조","title":"해상강도","chapter":"제2편 각칙 제38장 절도와 강도의 죄","deleted":false,"text":"①다중의 위력으로 해상에서 선박을 강취하거나 선박내에 침입하여 타인의 재물을 강취한 자는 무기 또는 7년 이상의 징역에 처한다.\n②제1항의 죄를 범한 자가 사람을 상해하거나 상해에 이르게 한때에는 무기 또는 10년 이상의 징역에 처한다. <개정 1995.12.29>\n③제1항의 죄를 범한 자가 사람을 살해 또는 사망에 이르게 하거나 강간한 때에는 사형 또는 무기징역에 처한다. <개정 1995.12.29, 2012.12.18>\n제340조(해상강도)","kind":"L"},{"id":"L:341","label":"법 제341조","title":"상습범","chapter":"제2편 각칙 제38장 절도와 강도의 죄","deleted":false,"text":"제341조(상습범) 상습으로 제333조, 제334조, 제336조 또는 전조제1항의 죄를 범한 자는 무기 또는 10년 이상의 징역에 처한다.","kind":"L"},{"id":"L:342","label":"법 제342조","title":"미수범","chapter":"제2편 각칙 제38장 절도와 강도의 죄","deleted":false,"text":"제342조(미수범) 제329조 내지 제341조의 미수범은 처벌한다.","kind":"L"},{"id":"L:343","label":"법 제343조","title":"예비, 음모","chapter":"제2편 각칙 제38장 절도와 강도의 죄","deleted":false,"text":"제343조(예비, 음모) 강도할 목적으로 예비 또는 음모한 자는 7년 이하의 징역에 처한다.","kind":"L"},{"id":"L:344","label":"법 제344조","title":"친족간의 범행","chapter":"제2편 각칙 제38장 절도와 강도의 죄","deleted":false,"text":"제344조(친족간의 범행) 제328조의 규정은 제329조 내지 제332조의 죄 또는 미수범에 준용한다.","kind":"L"},{"id":"L:345","label":"법 제345조","title":"자격정지의 병과","chapter":"제2편 각칙 제38장 절도와 강도의 죄","deleted":false,"text":"제345조(자격정지의 병과) 본장의 죄를 범하여 유기징역에 처할 경우에는 10년 이하의 자격정지를 병과할 수 있다.","kind":"L"},{"id":"L:346","label":"법 제346조","title":"동력","chapter":"제2편 각칙 제38장 절도와 강도의 죄","deleted":false,"text":"제346조(동력) 본장의 죄에 있어서 관리할 수 있는 동력은 재물로 간주한다.","kind":"L"},{"id":"L:347","label":"법 제347조","title":"사기","chapter":"제2편 각칙 제39장 사기와 공갈의 죄","deleted":false,"text":"① 사람을 기망하여 재물의 교부를 받거나 재산상의 이익을 취득한 자는 20년 이하의 징역 또는 5천만원 이하의 벌금에 처한다. <개정 2025.12.23>\n②전항의 방법으로 제삼자로 하여금 재물의 교부를 받게 하거나 재산상의 이익을 취득하게 한 때에도 전항의 형과 같다.\n제347조(사기)","kind":"L"},{"id":"L:347-2","label":"법 제347조의2","title":"컴퓨터등 사용사기","chapter":"제2편 각칙 제39장 사기와 공갈의 죄","deleted":false,"text":"제347조의2(컴퓨터등 사용사기) 컴퓨터등 정보처리장치에 허위의 정보 또는 부정한 명령을 입력하거나 권한 없이 정보를 입력ㆍ변경하여 정보처리를 하게 함으로써 재산상의 이익을 취득하거나 제3자로 하여금 취득하게 한 자는 20년 이하의 징역 또는 5천만원 이하의 벌금에 처한다. <개정 2025.12.23>","kind":"L"},{"id":"L:348","label":"법 제348조","title":"준사기","chapter":"제2편 각칙 제39장 사기와 공갈의 죄","deleted":false,"text":"① 미성년자의 사리분별력 부족 또는 사람의 심신장애를 이용하여 재물을 교부받거나 재산상 이익을 취득한 자는 20년 이하의 징역 또는 5천만원 이하의 벌금에 처한다. <개정 2025.12.23>\n② 제1항의 방법으로 제3자로 하여금 재물을 교부받게 하거나 재산상 이익을 취득하게 한 경우에도 제1항의 형에 처한다.\n제348조(준사기)","kind":"L"},{"id":"L:348-2","label":"법 제348조의2","title":"편의시설부정이용","chapter":"제2편 각칙 제39장 사기와 공갈의 죄","deleted":false,"text":"제348조의2(편의시설부정이용) 부정한 방법으로 대가를 지급하지 아니하고 자동판매기, 공중전화 기타 유료자동설비를 이용하여 재물 또는 재산상의 이익을 취득한 자는 3년 이하의 징역, 500만원 이하의 벌금, 구류 또는 과료에 처한다.","kind":"L"},{"id":"L:349","label":"법 제349조","title":"부당이득","chapter":"제2편 각칙 제39장 사기와 공갈의 죄","deleted":false,"text":"① 사람의 곤궁하고 절박한 상태를 이용하여 현저하게 부당한 이익을 취득한 자는 3년 이하의 징역 또는 1천만원 이하의 벌금에 처한다.\n② 제1항의 방법으로 제3자로 하여금 부당한 이익을 취득하게 한 경우에도 제1항의 형에 처한다.\n제349조(부당이득)","kind":"L"},{"id":"L:350","label":"법 제350조","title":"공갈","chapter":"제2편 각칙 제39장 사기와 공갈의 죄","deleted":false,"text":"①사람을 공갈하여 재물의 교부를 받거나 재산상의 이익을 취득한 자는 10년 이하의 징역 또는 2천만원 이하의 벌금에 처한다. <개정 1995.12.29>\n②전항의 방법으로 제삼자로 하여금 재물의 교부를 받게 하거나 재산상의 이익을 취득하게 한 때에도 전항의 형과 같다.\n제350조(공갈)","kind":"L"},{"id":"L:350-2","label":"법 제350조의2","title":"특수공갈","chapter":"제2편 각칙 제39장 사기와 공갈의 죄","deleted":false,"text":"제350조의2(특수공갈) 단체 또는 다중의 위력을 보이거나 위험한 물건을 휴대하여 제350조의 죄를 범한 자는 1년 이상 15년 이하의 징역에 처한다.","kind":"L"},{"id":"L:351","label":"법 제351조","title":"상습범","chapter":"제2편 각칙 제39장 사기와 공갈의 죄","deleted":false,"text":"제351조(상습범) 상습으로 제347조 내지 전조의 죄를 범한 자는 그 죄에 정한 형의 2분의 1까지 가중한다.","kind":"L"},{"id":"L:352","label":"법 제352조","title":"미수범","chapter":"제2편 각칙 제39장 사기와 공갈의 죄","deleted":false,"text":"제352조(미수범) 제347조 내지 제348조의2, 제350조, 제350조의2와 제351조의 미수범은 처벌한다. <개정 2016.1.6>","kind":"L"},{"id":"L:353","label":"법 제353조","title":"자격정지의 병과","chapter":"제2편 각칙 제39장 사기와 공갈의 죄","deleted":false,"text":"제353조(자격정지의 병과) 본장의 죄에는 10년 이하의 자격정지를 병과할 수 있다.","kind":"L"},{"id":"L:354","label":"법 제354조","title":"친족간의 범행, 동력","chapter":"제2편 각칙 제39장 사기와 공갈의 죄","deleted":false,"text":"제354조(친족간의 범행, 동력) 제328조와 제346조의 규정은 본장의 죄에 준용한다.","kind":"L"},{"id":"L:355","label":"법 제355조","title":"횡령, 배임","chapter":"제2편 각칙 제40장 횡령과 배임의 죄","deleted":false,"text":"①타인의 재물을 보관하는 자가 그 재물을 횡령하거나 그 반환을 거부한 때에는 5년 이하의 징역 또는 1천500만원 이하의 벌금에 처한다. <개정 1995.12.29>\n②타인의 사무를 처리하는 자가 그 임무에 위배하는 행위로써 재산상의 이익을 취득하거나 제삼자로 하여금 이를 취득하게 하여 본인에게 손해를 가한 때에도 전항의 형과 같다.\n제355조(횡령, 배임)","kind":"L"},{"id":"L:356","label":"법 제356조","title":"업무상의 횡령과 배임","chapter":"제2편 각칙 제40장 횡령과 배임의 죄","deleted":false,"text":"제356조(업무상의 횡령과 배임) 업무상의 임무에 위배하여 제355조의 죄를 범한 자는 10년 이하의 징역 또는 3천만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:357","label":"법 제357조","title":"배임수증재","chapter":"제2편 각칙 제40장 횡령과 배임의 죄","deleted":false,"text":"① 타인의 사무를 처리하는 자가 그 임무에 관하여 부정한 청탁을 받고 재물 또는 재산상의 이익을 취득하거나 제3자로 하여금 이를 취득하게 한 때에는 5년 이하의 징역 또는 1천만원 이하의 벌금에 처한다. <개정 2016.5.29>\n② 제1항의 재물 또는 재산상 이익을 공여한 자는 2년 이하의 징역 또는 500만원 이하의 벌금에 처한다. <개정 2020.12.8>\n③ 범인 또는 그 사정을 아는 제3자가 취득한 제1항의 재물은 몰수한다. 그 재물을 몰수하기 불가능하거나 재산상의 이익을 취득한 때에는 그 가액을 추징한다. <개정 2016.5.29, 2020.12.8>\n제357조(배임수증재)","kind":"L"},{"id":"L:358","label":"법 제358조","title":"자격정지의 병과","chapter":"제2편 각칙 제40장 횡령과 배임의 죄","deleted":false,"text":"제358조(자격정지의 병과) 전3조의 죄에는 10년 이하의 자격정지를 병과할 수 있다.","kind":"L"},{"id":"L:359","label":"법 제359조","title":"미수범","chapter":"제2편 각칙 제40장 횡령과 배임의 죄","deleted":false,"text":"제359조(미수범) 제355조 내지 제357조의 미수범은 처벌한다.","kind":"L"},{"id":"L:360","label":"법 제360조","title":"점유이탈물횡령","chapter":"제2편 각칙 제40장 횡령과 배임의 죄","deleted":false,"text":"①유실물, 표류물 또는 타인의 점유를 이탈한 재물을 횡령한 자는 1년 이하의 징역이나 300만원 이하의 벌금 또는 과료에 처한다. <개정 1995.12.29>\n②매장물을 횡령한 자도 전항의 형과 같다.\n제360조(점유이탈물횡령)","kind":"L"},{"id":"L:361","label":"법 제361조","title":"친족간의 범행, 동력","chapter":"제2편 각칙 제40장 횡령과 배임의 죄","deleted":false,"text":"제361조(친족간의 범행, 동력) 제328조와 제346조의 규정은 본장의 죄에 준용한다.","kind":"L"},{"id":"L:362","label":"법 제362조","title":"장물의 취득, 알선 등","chapter":"제2편 각칙 제41장 장물에 관한 죄","deleted":false,"text":"①장물을 취득, 양도, 운반 또는 보관한 자는 7년 이하의 징역 또는 1천500만원 이하의 벌금에 처한다. <개정 1995.12.29>\n②전항의 행위를 알선한 자도 전항의 형과 같다.\n제362조(장물의 취득, 알선 등)","kind":"L"},{"id":"L:363","label":"법 제363조","title":"상습범","chapter":"제2편 각칙 제41장 장물에 관한 죄","deleted":false,"text":"①상습으로 전조의 죄를 범한 자는 1년 이상 10년 이하의 징역에 처한다.\n②제1항의 경우에는 10년 이하의 자격정지 또는 1천500만원 이하의 벌금을 병과할 수 있다. <개정 1995.12.29>\n제363조(상습범)","kind":"L"},{"id":"L:364","label":"법 제364조","title":"업무상과실, 중과실","chapter":"제2편 각칙 제41장 장물에 관한 죄","deleted":false,"text":"제364조(업무상과실, 중과실) 업무상과실 또는 중대한 과실로 인하여 제362조의 죄를 범한 자는 1년 이하의 금고 또는 500만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:365","label":"법 제365조","title":"친족 사이의 범행","chapter":"제2편 각칙 제41장 장물에 관한 죄","deleted":false,"text":"① 제362조부터 제364조까지의 죄를 지은 사람이 피해자의 친족인 경우에는 제328조를 준용한다.\n② 제362조부터 제364조까지의 죄를 지은 사람이 본범과 배우자, 직계혈족ㆍ동거친족 또는 그 배우자의 관계인 경우에는 그 형을 감경하거나 면제할 수 있다. 다만, 신분관계가 없는 공범에 대해서는 예외로 한다.\n제365조(친족 사이의 범행)","kind":"L"},{"id":"L:366","label":"법 제366조","title":"재물손괴등","chapter":"제2편 각칙 제42장 손괴의 죄","deleted":false,"text":"제366조(재물손괴등) 타인의 재물, 문서 또는 전자기록등 특수매체기록을 손괴 또는 은닉 기타 방법으로 기 효용을 해한 자는 3년이하의 징역 또는 700만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:367","label":"법 제367조","title":"공익건조물파괴","chapter":"제2편 각칙 제42장 손괴의 죄","deleted":false,"text":"제367조(공익건조물파괴) 공익에 공하는 건조물을 파괴한 자는 10년 이하의 징역 또는 2천만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:368","label":"법 제368조","title":"중손괴","chapter":"제2편 각칙 제42장 손괴의 죄","deleted":false,"text":"①전2조의 죄를 범하여 사람의 생명 또는 신체에 대하여 위험을 발생하게 한 때에는 1년 이상 10년 이하의 징역에 처한다.\n②제366조 또는 제367조의 죄를 범하여 사람을 상해에 이르게 한 때에는 1년 이상의 유기징역에 처한다. 사망에 이르게 한 때에는 3년 이상의 유기징역에 처한다. <개정 1995.12.29>\n제368조(중손괴)","kind":"L"},{"id":"L:369","label":"법 제369조","title":"특수손괴","chapter":"제2편 각칙 제42장 손괴의 죄","deleted":false,"text":"①단체 또는 다중의 위력을 보이거나 위험한 물건을 휴대하여 제366조의 죄를 범한 때에는 5년 이하의 징역 또는 1천만원 이하의 벌금에 처한다. <개정 1995.12.29>\n②제1항의 방법으로 제367조의 죄를 범한 때에는 1년 이상의 유기징역 또는 2천만원 이하의 벌금에 처한다. <개정 1995.12.29>\n제369조(특수손괴)","kind":"L"},{"id":"L:370","label":"법 제370조","title":"경계침범","chapter":"제2편 각칙 제42장 손괴의 죄","deleted":false,"text":"제370조(경계침범) 경계표를 손괴, 이동 또는 제거하거나 기타 방법으로 토지의 경계를 인식 불능하게 한 자는 3년 이하의 징역 또는 500만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:371","label":"법 제371조","title":"미수범","chapter":"제2편 각칙 제42장 손괴의 죄","deleted":false,"text":"제371조(미수범) 제366조, 제367조와 제369조의 미수범은 처벌한다.","kind":"L"},{"id":"L:372","label":"법 제372조","title":"동력","chapter":"제2편 각칙 제42장 손괴의 죄","deleted":false,"text":"제372조(동력) 본장의 죄에는 제346조를 준용한다.","kind":"L"},{"id":"X:형사소송법","kind":"X","label":"형사소송법","title":"","chapter":"","text":""},{"id":"X:군사법원법","kind":"X","label":"군사법원법","title":"","chapter":"","text":""},{"id":"P:624699","kind":"P","label":"2025고단6389","title":"부정청탁및금품등수수의금지에관한법률위반","court":"서울중앙지방법원","date":"2026.08.26","caseType":"형사","basis":"판례내용","text":"학원 수학강사와 교재개발실장인 피고인 甲과 乙이 현직 교원인 피고인 丙과 丁으로부터 수학 문항을 공급받기로 하고, 피고인 甲과 乙은 피고인 丙과 丁이 제작한 수학 문항을 제공받는 대가로 총 20회에 걸쳐 금품을 송금하고 피고인 丙과 丁은 이를 송금받음으로써 ‘부정청탁 및 금품등 수수의 금지에 관한 법률’에서 정한 금품 등의 수수 금지를 위반했다는 공소사실로 기소된 사안에서, 피고인들이 주고받은 금품은 반대급부, 즉 문항의 제작에 상응하는 것으로서 사적 거래로 인한 채무의 이행에 해당하므로 같은 법 제8조 제3항 제3호가 적용되어 같은 조 제1항의 수수 금지 금품에 해당하지 않는다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=624699"},{"id":"L:58-2","kind":"L","label":"법 제58조의2","title":"현행 조문에 없음(구법 조문 번호)","chapter":"","deleted":true,"ghost":true,"text":""},{"id":"P:624959","kind":"P","label":"2026도2207","title":"업무방해·명예훼손","court":"대법원","date":"2026.08.13","caseType":"형사","basis":"참조조문","text":"[1] 업무방해죄에서 말하는 ‘위력’의 의미 및 위력에 해당하는지 판단하는 기준 / 업무방해죄의 성립에 업무방해의 결과가 실제로 발생함을 요하는지 여부 [2] 피고인이 어린이집 원장 甲과의 분쟁 과정에서 甲이 영유아 통학을 위해 운행하던 어린이통학버스의 신고증명서가 자신에게 있음을 이용하여 이를 관할 관청에 임의로 반납하여 해당 차량이 운행되지 못하게 함으로써 甲의 어린이집 운영 업무를 방해하였다는 내용으로 기소된 사안에서, 피고인의 행위는 어린이집 운영을 위해 어린이통학버스의 운행이 필요한 甲의 자유의사를 제압하기에 충분한 세력으로서 업무방해죄에서 말하는 ‘위력’의 행사에 해당하고, 이로 인해 甲의 어린이집 운영 업무가 방해될 위험은 이미 발생하였다는 등의 이유로, 같은 취지의 원심판단이 정당하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=624959"},{"id":"P:624315","kind":"P","label":"2022도5937","title":"상관모욕","court":"대법원","date":"2026.07.22","caseType":"형사","basis":"참조조문","text":"[1] 군형법 제64조 제2항 상관모욕죄는 불특정 또는 다수인이 인식할 수 있는 상태에서 상관을 모욕함으로써 성립하는지 여부 및 ‘문서, 도화 또는 우상을 공시하거나 연설하는 것’에 해당하거나 이에 상응하는 정도의 공연한 방법으로 상관을 모욕하는 경우에만 성립하는지 여부 [2] 해군 소속 함정에서 전탐장으로 근무하는 피고인이, 해상에서 기지로 입항 중이던 함정 조타실에서 정장이자 상관인 대위 甲에게 함정 입항에 관하여 의견 제시를 하였으나 甲이 이를 받아들이지 않자 화가 나, 하사 乙 등 3인이 듣고 있는 가운데 \"여기 지휘관 엉망이다. 권고도 듣지 않는다.\"라고 말하면서 착용하고 있던 헤드셋을 벗어 책상에 집어 던지는 방법으로 군형법상 상관인 甲을 모욕하였다는 내용으로 기소된 사안에서, 피고인의 행위는 문서, 도화 또는 우상을 공시하거나 연설하는 것 또는 이에 상응하는 정도의 공연한 방법으로 상관을 모욕한 것이라고 볼 수 없어 군형법 제64조 제2항 상관모욕죄에 해당하지 않는다는 이유로, 이와 달리 본 원심판단에 상관모욕죄 성립에서 공연성에 관한 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=624315"},{"id":"P:623843","kind":"P","label":"2026도2366","title":"특정범죄가중처벌등에관한법률위반(뇌물)·범죄수익은닉의규제및처벌등에관한법률위반·뇌물공여·범죄수익은닉의규제및처벌등에관한법률위반방조·산림기술진흥및관리에관한법률위반","court":"대법원","date":"2026.07.09","caseType":"형사","basis":"판례내용","text":"[1] 검찰청법 제4조 제1항 제1호 단서에서 검사가 수사를 개시하여 1차적 수사를 직접 담당할 수 있는 범죄를 제한한 취지 / 검찰청법 제4조 제2항에서 검사가 기소할 수 있는 범위를 제한한 취지 [2] 검찰청법 제4조 제2항 본문의 ‘수사개시’의 의미 [3] 검찰수사관이 어떤 범죄에 관한 수사에 착수한 경우가 검찰청법 제4조 제2항 본문의 ‘검사 자신의 수사개시’에 해당하는지 여부 및 검찰수사관이 그와 같이 수사에 착수한 범죄의 수사를 마친 후 검사에게 송치한 경우가 검찰청법 제4조 제2항 단서의 ‘사법경찰관이 송치한 범죄’에 해당하는지 여부 [4] 검사가 자신이 수사개시한 범죄에 대하여 공소를 제기하는 경우, 검찰청법 제4조 제2항에 반하여 위법한지 여부 및 그러한 공소제기는 ‘그 절차가 법률의 규정을 위반하여 무효’인 경우에 해당하여 공소기각 판결의 대상이 되는지 여부 / 공소기각 판결이 확정된 이후, 수사개시를 하지 아니한 다른 검사가 적법한 공소제기권자로서 재기소를 할 수도 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=623843"},{"id":"P:623717","kind":"P","label":"2026모683","title":"추징보전청구인용결정에대한재항고","court":"대법원","date":"2026.07.09","caseType":"형사","basis":"참조조문","text":"[1] 부패재산의 몰수 및 회복에 관한 특례법 제6조의 범죄피해재산 관련 추징의 경우, 범죄행위와의 관련성을 가진 재산으로 한정하지 않고 같은 법 제5조에 따라 피고인의 일반재산을 대상으로 집행할 수 있는지 여부 [2] 부패재산의 몰수 및 회복에 관한 특례법 제5조 또는 제6조에 따라 추징해야 할 경우에 해당한다고 판단할 만한 상당한 이유가 있는 경우로서 추징재판을 집행할 수 없게 될 염려가 있거나 집행이 현저히 곤란하게 될 염려가 있다고 인정되는 경우, 피고인 또는 피의자의 일반재산을 ‘기소 후 또는 기소 전 추징보전명령’의 대상으로 할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=623717"},{"id":"P:623841","kind":"P","label":"2026도6500","title":"특수공무집행방해·허위공문서작성·허위작성공문서행사·대통령기록물관리에관한법률위반·공용서류손상·직권남용권리행사방해·대통령등의경호에관한법률위반교사·범인도피교사","court":"대법원","date":"2026.07.09","caseType":"형사","basis":"참조조문","text":"[1] 대통령의 헌법상 불소추특권에 관한 헌법 제84조에 따라 대통령이 범한 내란 또는 외환의 죄 이외의 죄에 대한 재직 중 수사까지 전면적으로 금지되는지 여부 [2] 고위공직자범죄수사처 설치 및 운영에 관한 법률 제2조 제4호 목에서 관련범죄 중 하나로 규정한 ‘고위공직자범죄 수사 과정에서 인지한 그 고위공직자범죄와 직접 관련성이 있는 죄로서 해당 고위공직자가 범한 죄’에서 ‘수사 과정에서 인지한’ 및 ‘직접’의 의미 / 위 규정이 수사 과정에서 인지한 관련범죄를 수사대상에 포함한 취지 및 ‘수사 과정에서 인지한 직접 관련성 있는 범죄’에 해당하는지 판단하는 방법 [3] 국무위원의 국무회의에 관한 심의권이 법령상 보호되어야 할 이익인지 여부 / 형법 제123조 직권남용권리행사방해죄의 보호대상인 ‘권리’의 의미 및 직권의 ‘남용’에 해당하는지 판단하는 기준 / 직권남용권리행사방해죄가 성립하기 위해서는 직권남용 행위로 인한 권리행사 방해의 결과가 발생해야 하는지 여부 [4] 사법심사의 대상에서 제외하는 고도의 정치성을 띤 국가행위인 이른바 ‘통치행위’의 개념을 인정하는 것은 지극히 신중해야 하는지 여부 [5] 공무원이 직권을 남용하여 사람으로 하여금 어떠한 일을 하게 한 때에 상대방이 공무원 또는 유관기관의 임직원인 경우, 직권남용권리행사방해죄의 법령상 의무 없는 일을 하게 한 때에 해당하는지 판단하는 기준 [6] 군사상 비밀을 요하는","url":"https://www.law.go.kr/precInfoP.do?precSeq=623841"},{"id":"P:622963","kind":"P","label":"2024도6945","title":"아동복지법위반(아동학대)","court":"대법원","date":"2026.06.25","caseType":"형사","basis":"판례내용","text":"아동복지법 제17조 제5호에서 금지하는 ‘아동의 정신건강 및 발달에 해를 끼치는 정서적 학대행위’의 의미 및 어떠한 행위가 이에 해당하는지 판단하는 방법","url":"https://www.law.go.kr/precInfoP.do?precSeq=622963"},{"id":"P:622989","kind":"P","label":"2025도13722","title":"횡령","court":"대법원","date":"2026.06.25","caseType":"형사","basis":"참조조문","text":"[1] 횡령죄에서 말하는 ‘보관’의 의미 / 횡령죄의 성립에 필요한 위탁관계는 횡령죄로 보호할 만한 가치 있는 신임에 의한 것으로 한정되는지 여부 [2] 재물의 보관에 관한 위탁관계 설정이 약정 등 법률행위에 근거한 경우, 그 위탁관계가 횡령죄로 보호할 만한 가치 있는 신임에 의한 것이 아니라고 보기 위해서는 그 위탁관계를 형사법적으로 보호하는 것이 전체 법질서상 허용하기 어려운 정도에 이르러야 하는지 여부 [3] 위탁자가 다른 사람 이름으로 개설된 예금계좌를 이용하여 금융거래를 하면서 그 차명계좌에 돈을 보관하되 계좌 명의인인 수탁자는 이를 임의로 사용하지 않기로 하는 약정을 체결한 경우, 위탁자가 채무초과 상태에서 차명계좌를 이용하였다는 사정만으로 그 약정에 따른 재물 위탁행위가 강제집행면탈죄의 실행행위 등과 같이 범죄 실현의 수단으로서 이루어진 것이라고 볼 수 있는지 여부 / 이때 차명계좌에 보관된 돈의 위탁행위가 범죄 실현의 수단으로 이루어진 것인지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=622989"},{"id":"P:622987","kind":"P","label":"2024도12616","title":"특수협박","court":"대법원","date":"2026.06.25","caseType":"형사","basis":"참조조문","text":"[1] 형법 제20조에서 정한 ‘사회상규에 위배되지 아니하는 행위’의 의미 / 정당행위의 성립 요건 및 어떠한 행위가 정당행위로서 위법성이 조각되는지 판단하는 방법 / 어떠한 행위가 범죄구성요건에 해당하지만 정당행위라는 이유로 위법성이 조각된다는 것의 의미 [2] 피고인이 자신의 주거지에 찾아와 자신을 폭행하는 甲에 대항하여 주먹으로 甲의 얼굴을 폭행한 후, 싱크대 위에 있던 부엌칼을 가져와 \"변태 새끼야 죽고 싶으면 너나 죽어, 죽고 싶으면 와 봐라.\"라며 위해를 가할 듯이 위협함으로써 위험한 물건을 휴대하여 甲을 협박하였다는 특수협박의 공소사실로 기소된 사안에서, 전체적으로 보아 피고인의 행위는 예고 없이 집에 찾아와 폭력을 행사하고 나아가 가위를 들어 생명과 신체에 대한 위해를 가하겠다고 협박하는 甲의 계속되는 부당한 공격에 맞서 수동적, 소극적 차원에서 행한 행위로, 그 목적의 정당성, 수단이나 방법의 상당성, 보호이익과 침해이익 사이의 법익균형성, 긴급성, 보충성 등 정당행위의 요건을 갖춘 것으로서 사회통념상 용인되는 범위를 크게 벗어나지 않는 행위라고 평가할 여지가 크다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=622987"},{"id":"P:624007","kind":"P","label":"2024노3084","title":"아동복지법위반(아동학대)","court":"의정부지방법원","date":"2026.06.19","caseType":"형사","basis":"참조조문","text":"초등학교 담임교사인 피고인이, 자기 반 학생 甲이 율동시간에 율동을 하지 않는다는 이유로 \"야 일어나.\"라며 소리를 지르고 甲의 팔을 위로 세게 잡아 일으키려 함으로써 아동인 甲에게 신체적 학대행위를 하였다는 아동복지법 위반 공소사실이 제1심 및 환송 전 제2심에서 유죄로 인정되자 피고인이 이에 불복하여 상고하였고, 환송 전 제2심의 판단에 법리오해 등의 잘못이 있다는 대법원 환송판결에 따라 환송 후 제2심이 진행된 사안에서, 제반 사정을 종합할 때 피고인이 고의로 아동의 신체에 손상을 주거나 신체의 건강 및 발달에 해를 끼치는 신체적 학대행위를 하였다고 볼 수 없다는 이유로, 이와 달리 본 제1심판결을 파기하고 공소사실을 무죄로 판단한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=624007"},{"id":"P:623069","kind":"P","label":"2025도11170","title":"범인도피방조·도로교통법위반(음주운전)","court":"대법원","date":"2026.06.18","caseType":"형사","basis":"참조조문","text":"[1] 벌금 이상의 형에 해당하는 죄를 범한 범인을 위해 타인이 허위로 자백하여 범인도피죄를 범하는 것을 범인 스스로 방조하는 경우, 방어권 남용으로 범인도피방조죄가 성립하는지 여부 / 이러한 대법원의 현재 법리는 타당하여 유지되어야 하는지 여부 [2] 피고인이 자신의 차량 조수석에 친구 甲을 태우고 음주운전을 하다가 교통사고를 일으켰는데, 동승한 甲이 피고인에게 \"내가 운전한 것으로 해주겠다.\"라고 말하자, 피고인은 이에 동의하고 차량 뒷좌석으로 이동한 후 甲이 조수석에서 운전석으로 옮겨 탈 수 있게 하여 마치 甲이 운전한 것과 같은 외관을 만든 다음, 피고인이 보험회사에 전화하여 \"甲이 운전하였다.\"라고 말하고, 甲은 신고를 받고 출동한 경찰관에게 \"내가 운전했다.\"라고 말하며 음주측정에 응함으로써 피고인이 甲의 범인도피행위를 방조하였다는 내용으로 기소된 사안에서, 피고인은 위와 같은 행위를 통하여 甲이 피고인을 위해 경찰관에게 그 자신이 운전자라고 허위로 진술하는 것을 용이하게 하였고, 그로 인해 벌금 이상의 형에 해당하는 도로교통법 위반죄를 범한 진범의 발견을 방해하여 형사사법 작용에 중대한 장애를 초래할 위험이 발생하였으므로, 피고인의 방조행위는 방어권 남용으로서 범인도피방조죄에 해당한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=623069"},{"id":"P:623017","kind":"P","label":"2026도2358","title":"개인정보보호법위반","court":"대법원","date":"2026.06.05","caseType":"형사","basis":"판례내용","text":"[1] 불고불리 원칙과 법원의 심판 범위 / 공소장에 기재된 공소사실과 적용법조가 서로 다른 구성요건이나 법률적 평가를 전제로 하는 등 조화롭지 않고 부정합성을 드러내어 유무죄 판단에 영향을 미치거나 피고인의 방어권 행사에 지장을 초래할 정도에 이른 경우, 법원이 취할 조치 [2] 검사가 피고인을 구 개인정보 보호법 위반으로 기소하면서, 공소장에 피고인이 甲의 동의가 없다는 사정을 알면서도 이동통신 가입자에 대한 개인정보 처리 업무를 담당하던 乙에게 ‘통신사 조회시스템을 이용하여 甲의 전화번호를 조회한 뒤 알려달라.’고 요구하여 乙로부터 그 정보를 제공받았다는 공소사실을 기재하고, ‘같은 법 제71조 제1호, 제17조 제1항 제2호 등’을 적용법조로 기재한 사안에서, 공소장 기재 내용에 관한 서로 다른 해석이 가능하여 공소제기의 취지가 명료하지 않고 그로 인해 피고인의 방어권 행사에도 지장이 초래될 수 있는 경우이므로, 원심은 소송관계를 명료하게 하기 위해 검사에게 석명을 구하고, 그에 따라 공소제기의 취지가 명료해지면 거기에 맞추어 범죄구성요건 충족 여부를 심리한 후 유무죄를 판단했어야 한다는 이유로, 이러한 조치를 취하지 않은 채 공소사실을 유죄로 인정한 원심판단에 법리오해 및 심리미진의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=623017"},{"id":"P:622251","kind":"P","label":"2023도14750","title":"모욕[길에서 시비가 되어 행인들이 지켜보는 가운데 큰 소리로 욕설을 하여 모욕죄로 기소된 사안에서 모욕죄 인정 여부]","court":"대법원","date":"2026.05.29","caseType":"형사","basis":"참조조문","text":"[1] 모욕죄의 보호법익 / 모욕죄에서 ‘모욕’의 의미 및 어떠한 표현이 모욕에 해당하는지 판단하는 기준 / 상대방을 불쾌하게 할 수 있는 무례하고 예의에 벗어난 정도의 표현이거나 상대방에 대한 부정적ㆍ비판적 의견이나 감정을 나타내면서 경미한 수준의 추상적 표현이나 욕설이 사용된 경우, 모욕죄의 구성요건에 해당하는지 여부 / 모욕죄의 구성요건 해당 여부를 평가할 때 고려할 사항 / 발언자 자신의 불만이나 분노감정을 표출하는 표현, 관용적 또는 단발적이거나 즉흥적ㆍ충동적 욕설 등 상대방의 주관적 감정이나 정서에 해당하는 명예감정과 인격권을 침해하는 행위를 모욕죄의 모욕에 해당한다고 단정할 수 있는지 여부 [2] 甲 병원 총괄이사인 피고인이 병원 앞길에서 甲 병원에 대해 1인 시위를 진행하는 乙과 시비를 하던 중 그곳을 지나가던 행인들이 지켜보는 가운데 乙에게 \"야, 이 개새끼야.\"라고 큰 소리로 욕설을 하여 乙을 모욕하였다는 내용으로 기소된 사안에서, 제반 사정을 종합하면 피고인의 위 발언은 乙의 행동에 대응하여 이에 대한 불만이나 분노감정을 거칠게 나타내면서 한 단발적이거나 즉흥적ㆍ충동적 욕설에 해당하여, 乙의 주관적 감정이나 정서를 상하게 하는 등 명예감정을 침해할 만한 표현으로 보일 뿐, 객관적으로 乙의 인격적 가치에 대한 사회적 평가를 저하시킬 만한 모욕행위에 해당하지 않는다는 이유로, 이와 달리 본 원심판단에 법리오해의 잘못이","url":"https://www.law.go.kr/precInfoP.do?precSeq=622251"},{"id":"P:622111","kind":"P","label":"2018다296229","title":"단체교섭청구의소[도급인이 사내하청업체 소속 근로자들이 속한 노동조합에 대하여 단체교섭의무를 부담하는지 문제 된 사건]","court":"대법원","date":"2026.05.21","caseType":"민사","basis":"판례내용","text":"구 노동조합 및 노동관계조정법 제2조가 적용되는 사안에서, ‘단체교섭의무를 부담하는 사용자’는 ‘사용종속관계가 있는 자, 즉 근로자와의 사이에 그를 지휘ㆍ감독하면서 그로부터 근로를 제공받고 그 대가로서 임금을 지급하는 것을 목적으로 하는 명시적이거나 묵시적인 근로계약관계를 맺고 있는 자’를 말한다는 취지의 종전 대법원 법리가 유지되어야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=622111"},{"id":"P:622241","kind":"P","label":"2025노907","title":"통신비밀보호법위반(예비적 죄명: 통신비밀보호법위반방조)·정보통신망이용촉진및정보보호등에관한법률위반·위치정보의보호및이용등에관한법률위반","court":"부산고등법원","date":"2026.05.20","caseType":"형사","basis":"참조조문","text":"위치정보 서비스 등을 제공하는 사업체인 甲 회사의 실질적 운영자 피고인 등이 불특정 다수인에게 녹음기능 등을 가진 애플리케이션을 판매하고, 앱 구매자들이 피감시자의 휴대전화에 앱을 설치하면 피감시자와 그 상대방의 통화내용이 녹음되어 甲 회사 데이터 서버에 저장되게 하는 방법으로 앱 구매자들과 공모하여 공개되지 아니한 타인 간의 대화를 녹음ㆍ청취하였다는 통신비밀보호법 위반 등으로 기소된 사안에서, 제반 사정을 종합하면 피고인은 ‘사실상 그 주된 사용용도가 도청인 앱을 구매자들에게 고액에 판매하면서 설치방법이나 사용법을 메신저를 통하여 설명하고, 실시간으로 도청 파일이 저장되는 스토리지 서버를 관리하여 구매자들이 그 서버에 접속하여 피감시자들의 전화통화를 몰래 감청하게 함으로써’ 같은 법 제3조 제1항 위반의 구성요건 행위를 구체적으로 실행하였고, 피고인에게 앱 구매자들과의 순차적ㆍ암묵적 공모관계 및 그에 터 잡은 범죄에 대한 본질적 기여를 통한 기능적 행위지배가 인정된다는 이유로, 피고인에게 유죄를 인정한 제1심판단이 정당하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=622241"},{"id":"P:622119","kind":"P","label":"2025도21859","title":"자본시장과금융투자업에관한법률위반·범죄수익은닉의규제및처벌등에관한법률위반·특정범죄가중처벌등에관한법률위반(조세)·조세범처벌법위반·특정경제범죄가중처벌등에관한법률위반(횡령)·특정범죄가중처벌등에관한법률위반(허위세금계산서교부등)·여신전문금융업법위반[장외파생상품인 차액결제거래(CFD)를 통한 시세조종성 주문에 대하여 시세조종행위로 인한 자본시장과금융투자업에관한법률위반죄가 성립하는지 여부가 문제 된 사건]","court":"대법원","date":"2026.05.20","caseType":"형사","basis":"참조조문","text":"[1] 구 자본시장과 금융투자업에 관한 법률상 시세조종행위 금지 규정은 문언상 직접 ‘상장증권 또는 장내파생상품’에 대한 시세조종행위에 해당하는 통정매매 등 행위를 하거나 이를 위탁 또는 수탁하는 경우에만 적용되는 것으로 한정하고 있는지 여부 및 시세조종행위를 금지하는 입법 목적 / ‘상장증권 또는 장내파생상품’의 매매 등이 상당한 비율로 예상되는 장외파생상품 등을 이용한 주문이 증권사 등을 거쳐 곧바로 상장증권 또는 장내파생상품에 대한 시세조종행위에 해당하는 통정매매 등 주문으로 이어진 경우, 시세조종행위로 인한 구 자본시장과 금융투자업에 관한 법률 위반죄가 성립하는지 여부 [2] 피고인들이 무등록 투자일임업을 위한 조직 일원과 공모하여 장외파생상품인 차액결제거래 계좌를 이용해 통정매매, 고가매수, 물량소진, 허수매수 등의 시세조종 주문을 제출하여, 총 8개 종목에 대한 주가를 인위적으로 상승시키거나 주가 하락을 방어하는 방법으로 시세를 조종하여 부당이득을 취득하였다는 내용으로 기소된 사안에서, 위 계좌를 이용한 피고인들의 주문에 관하여 시세조종행위로 인한 구 자본시장과 금융투자업에 관한 법률 위반죄가 성립한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=622119"},{"id":"P:621901","kind":"P","label":"2025도3012","title":"모욕[모욕죄의 구성요건 해당 여부가 문제 된 사건]","court":"대법원","date":"2026.05.08","caseType":"형사","basis":"참조조문","text":"[1] 모욕죄의 보호법익 / 모욕죄에서 ‘모욕’의 의미 및 어떠한 표현이 모욕에 해당하는지 판단하는 기준 / 상대방을 불쾌하게 할 수 있는 무례하고 예의에 벗어난 정도의 표현이거나 상대방에 대한 부정적ㆍ비판적 의견이나 감정을 나타내면서 경미한 수준의 추상적 표현이나 욕설이 사용된 경우, 모욕죄의 구성요건에 해당하는지 여부 / 모욕죄의 구성요건 해당 여부를 평가할 때 고려하여야 할 사항 [2] 피고인이 아파트 내 생활문화센터 회의실에서 입주민들이 지켜보는 가운데 甲을 향해 \"야, 야, 친구냐? 어린놈의 새끼가 어디서 건방지게.\"라는 등의 욕설을 하여 공연히 甲을 모욕하였다는 내용으로 기소된 사안에서, 제반 사정을 종합하면 위 발언은 甲의 반말 사용에 대한 불편한 감정을 다소 거칠게 표현한 것에 불과할 뿐, 객관적으로 甲의 인격적 가치에 대한 사회적 평가를 저하시킬 만한 모욕행위에 해당하지 않는다는 등의 이유로, 이와 달리 피고인의 위 발언이 형법 제311조의 ‘모욕’에 해당한다고 본 원심판단에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=621901"},{"id":"P:620409","kind":"P","label":"2026도459","title":"범죄단체가입·범죄단체활동·사기·자본시장과금융투자업에관한법률위반","court":"대법원","date":"2026.04.30","caseType":"형사","basis":"판례내용","text":"[1] 자본시장과 금융투자업에 관한 법률 제8조의2 제1항에서 정한 ‘금융투자상품시장’에 증권 등의 매매가 실제로 이루어지는 시장뿐만 아니라, 통상의 주의력을 가진 평균적인 시장 참여자들이 증권 등의 매매가 실제로 이루어진다고 인식할 만한 외관을 갖춘 시장도 포함되는지 여부 [2] 자본시장과 금융투자업에 관한 법률상 ‘통상의 주의력을 가진 평균적인 시장 참여자들이 증권 등의 매매가 실제로 이루어진다고 인식할 만한 외관을 갖춘 시장’인지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=620409"},{"id":"P:620423","kind":"P","label":"2026도541","title":"아동·청소년의성보호에관한법률위반(영리목적성착취물판매등)·아동·청소년의성보호에관한법률위반(성착취물배포등)·성폭력범죄의처벌등에관한특례법위반(영리목적카메라등이용촬영물반포등)·아동·청소년의성보호에관한법률위반(성착취물소지등)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등)·성폭력범죄의처벌등에관한특례법위반(허위영상물편집·반포등)·정보통신망이용촉진및정보보호등에관한법률위반(음란물유포)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영물소지등)·성폭력범죄의처벌등에관한특례법위반(허위영상물소지등)","court":"대법원","date":"2026.04.30","caseType":"형사","basis":"판례내용","text":"성폭력범죄의 처벌 등에 관한 특례법 위반죄와 성폭력범죄의 처벌 등에 관한 특례법 위반죄가 이른바 계속범인지 여부 / 카메라 등 이용 촬영물이나 허위영상물을 자기가 지배할 수 있는 상태에 두고 지배관계를 지속시키는 행위가 계속된 경우, 신설된 각 처벌법규 시행 이후의 소지 행위를 각 성폭력범죄의 처벌 등에 관한 특례법 위반죄와 성폭력범죄의 처벌 등에 관한 특례법 위반죄로 처벌할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=620423"},{"id":"P:620417","kind":"P","label":"2025도21522","title":"산업기술의유출방지및보호에관한법률위반·부정경쟁방지및영업비밀보호에관한법률위반(영업비밀국외누설등)·업무상배임·부정경쟁방지및영업비밀보호에관한법률위반","court":"대법원","date":"2026.04.30","caseType":"형사","basis":"참조조문","text":"2019. 1. 8. 개정되고 2019. 7. 9. 시행된 부정경쟁방지 및 영업비밀보호에 관한 법률 제18조 제1항 제1호 목 위반죄의 구성요건 / 위 법 시행일 이전에 영업비밀 보유자로부터 영업비밀을 삭제하거나 반환할 것을 요구받고 그 영업비밀을 보유한 행위를 위 규정으로 처벌하는 것이 형벌법규의 소급효금지 원칙에 위배되는지 여부 및 위 법 시행일 이후까지 그 영업비밀 보유행위가 계속되었더라도 마찬가지인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=620417"},{"id":"P:624065","kind":"P","label":"2026노212","title":"특수공무집행방해, 허위공문서작성, 허위작성공문서행사, 대통령기록물관리에관한법률위반, 공용서류손상, 직권남용권리행사방해, 대통령등의경호에관한법률위반교사, 범인도피교사","court":"서울고등법원","date":"2026.04.29","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=624065"},{"id":"P:619423","kind":"P","label":"2025도12357","title":"결혼중개업의관리에관한법률위반","court":"대법원","date":"2026.04.16","caseType":"형사","basis":"참조조문","text":"[1] 결혼중개업의 관리에 관한 법률 제26조 제2항 제6호, 제12조 제1항의 적용 대상이 되는 ‘결혼중개업자’의 의미 / 국제결혼중개업의 등록을 한 자가 ‘법인’인 경우, 그 법인 사업주가 결혼중개업자가 되는지 여부 및 그 법인의 대표자나 대리인, 사용인, 종업원 등도 결혼중개업자에 포함되는지 여부 [2] 결혼중개업의 관리에 관한 법률 제27조 양벌규정의 취지 / 결혼중개업자가 아니면서 해당 업무를 실제로 집행하는 자가 같은 법 제26조 제2항 제6호, 제12조 제1항의 위반행위를 한 경우, 위 양벌규정에 따라 실제 위반 행위자를 벌하는 외에 그 위반행위의 이익귀속주체가 되는 법인 사업주인 결혼중개업자도 처벌할 수 있는지 여부 / 양벌규정에서의 ‘법인 사업주’와 ‘행위자’의 관계에 대하여 형법 총칙의 공범관계에 관한 규정이 적용되는지 여부 [3] 불고불리의 원칙과 법원의 심판 범위 / 검사가 어떠한 행위를 기소한 것인지 판단하는 기준 / 공소제기의 취지가 오해를 불러일으키거나 명료하지 못한 경우, 법원이 취할 조치 / 하나의 공소장에 기재된 ‘공소사실’과 ‘적용법조’가 상이한 구성요건이나 법률적 평가를 전제로 하는 등 조화롭지 않거나 부정합성을 드러내어 유무죄 등의 판단에 영향을 미치거나 피고인의 방어권 행사에 지장을 초래할 정도에 이른 경우, 법원은 검사에게 공소사실 및 적용법조의 문제점이나 오류 등에 관한 석명을 요구하여 공소","url":"https://www.law.go.kr/precInfoP.do?precSeq=619423"},{"id":"P:619505","kind":"P","label":"2024도12341","title":"특수협박·특수주거침입·스토킹범죄의처벌등에관한법률위반·보호관찰명령","court":"대법원","date":"2026.04.16","caseType":"형사","basis":"참조조문","text":"[1] 특수협박죄에서 ‘협박’, 위험한 물건을 ‘휴대하여’의 의미 및 위험한 물건을 휴대하여 협박을 하면 가중처벌을 하는 이유 / 위험한 물건을 휴대하여 협박하였다고 하려면 적어도 범행 현장에 있는 위험한 물건을 사실상 지배하면서 언제든지 그 물건을 사용하여 고지한 해악의 실현가능성을 높일 수 있었음이 인정되어야 하는지 여부 및 이에 해당하는지 판단하는 기준 [2] 피고인이 甲에게 앙심을 품고 과도 2개와 점화용 라이터 3개를 갖고 甲이 거주하는 아파트 건물로 들어간 다음 그곳 비상계단을 걸어 올라가 甲의 주거지 현관문 앞에 위 물건들을 놓아둠으로써 위험한 물건을 휴대하여 甲을 협박하였다는 특수협박의 공소사실로 기소된 사안에서, 피고인의 위와 같은 행위가 협박에 해당하고 피고인에게 협박의 고의도 인정되나, 피고인이 과도와 라이터를 그 용도대로 사용하려는 의도 아래 사실상 지배한 상태로 협박을 하여 고지하는 해악의 실현가능성을 높였다고 볼 수 없어, 피고인이 위험한 물건인 과도와 라이터를 협박 범행에 이용하였더라도 이를 ‘휴대하여’ 甲을 협박하였다고 할 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=619505"},{"id":"P:624541","kind":"P","label":"2026노525","title":"변호사법위반","court":"서울고등법원","date":"2026.04.16","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=624541"},{"id":"P:619491","kind":"P","label":"2026도2108","title":"스토킹범죄의처벌등에관한법률위반·스토킹방지및피해자보호등에관한법률위반방조·모욕·폭력행위등처벌에관한법률위반(공동상해)","court":"대법원","date":"2026.04.16","caseType":"형사","basis":"판례내용","text":"[1] 스토킹범죄의 처벌 등에 관한 법률 제2조 제2호에서 정한 스토킹범죄가 성립하기 위한 요건 및 스토킹범죄의 구성요건 중 ‘지속적'과 ‘반복적'의 의미 / 특정한 행위가 짧은 시간의 단속적인 행위에 그치거나 일회성 내지 비연속적인 단발성 행위가 여러 번 이루어진 것에 불과한 경우, 위 법 위반죄로 처벌할 수 있는지 여부 [2] 피고인이 승합차를 운행하던 중 우연히 피해자가 운전하는 차량을 발견하고 약 3km의 거리를 약 10분간 따라다녔고 약 2개월 반가량 지난 후 승합차 조수석에 타고 가던 중 피해자를 발견하고 불법유턴으로 차량의 방향을 돌려 자신의 휴대폰 카메라로 피해자의 모습 등을 촬영하는 방법으로 접근하여 피해자에게 불안감과 공포심을 일으키는 스토킹행위를 했다는 공소사실로 기소된 사안에서, 스토킹범죄의 구성요건 중 ‘지속성’과 ‘반복성’에 관한 증명이 이루어졌다고 보기 어려운데도, ‘스토킹범죄’에 해당한다고 본 원심판단에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=619491"},{"id":"P:622877","kind":"P","label":"2025노1707","title":"자살방조·자살방조미수·미성년자유인·실종아동등의보호및지원에관한법률위반·자살예방및생명존중문화조성을위한법률위반·부착명령·보호관찰명령","court":"수원고등법원","date":"2026.04.09","caseType":"형사","basis":"참조조문","text":"피고인이 정보통신망을 통해 자살유발정보를 유통하여 甲의 자살을 방조하고, 미성년자인 乙을 자신의 주거지로 유인한 다음 재차 자살방조행위를 하려다가 미수에 그쳤으며, 유인된 가출 아동 乙을 경찰관서의 장에게 신고하지 아니하고 약 7시간 동안 임의로 데리고 있었다는 내용의 자살예방 및 생명존중문화 조성을 위한 법률 위반, 자살방조, 자살방조미수, 미성년자유인, 실종아동등의 보호 및 지원에 관한 법률 위반 공소사실에 대하여, 제1심이 그중 실종아동등의 보호 및 지원에 관한 법률 위반 부분을 무죄로 판단하면서 나머지 부분을 모두 유죄로 인정하자, 피고인은 자살방조미수 부분에 법리오해가 있다는 이유로, 검사는 실종아동등의 보호 및 지원에 관한 법률 위반 부분에 사실오인 및 법리오해가 있다는 이유로 각각 항소한 사안에서, 피고인의 항소는 기각하고, 검사의 항소를 받아들여 실종아동등의 보호 및 지원에 관한 법률 위반 부분을 유죄로 인정한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=622877"},{"id":"P:618703","kind":"P","label":"2026모510","title":"항소기각결정에대한재항고[항소이유서 미제출에 따른 항소기각의 결정을 다투는 사건]","court":"대법원","date":"2026.04.03","caseType":"형사","basis":"참조조문","text":"[1] 항소인이 항소이유서를 그 제출기간 내에 제출하지 아니한 경우에도 직권조사사유가 있는 때에는 항소법원은 항소기각 결정을 하여서는 아니 되고 직권으로 심리하여 법정의 항소이유가 있다고 인정하는 때에는 원심판결을 파기하여야 하는지 여부 및 이때 ‘직권조사사유’의 의미 [2] 동일한 피고인에 대한 수 개의 범죄사실 중 일부에 대하여 먼저 공소가 제기되고 나머지 범죄사실에 대하여 별도로 공소가 제기됨으로써 이를 심리한 각 제1심법원이 공소제기된 사건별로 별개의 형을 선고하였는데, 이 중 어느 한 사건이 항소심법원에 계속되는 동안에 금고 이상의 형에 처한 다른 사건의 판결이 별개의 절차에서 확정된 경우, 항소심법원은 직권으로 제1심판결을 파기하고 피고인에게 형법 제37조 후단의 경합범에 관한 처벌례를 적용하여야 하는지 여부 [3] 피고인은 사기의 범죄사실로 제1심에서 벌금형을 받고 항소하였는데, 공소장과 증거에 의하면 피고인이 별건 사기죄로 제1심에서 징역형을 선고받아 항소심 계속 중이고, 별건 사기죄에 대하여 징역형을 선고한 판결이 사기의 범죄사실에 대한 항소심인 원심 계속 중 확정됨으로써 별건 사기죄의 판결 확정 전에 범한 사기의 범죄사실이 별건 사기죄와 형법 제37조 후단의 경합범 관계에 있게 된 사안에서, 제1심판결에 사후적으로 직권조사사유가 발생하였으므로, 피고인이 적법한 기간 내에 항소이유서를 제출하지 않았더라도 원심은 직권으","url":"https://www.law.go.kr/precInfoP.do?precSeq=618703"},{"id":"P:618653","kind":"P","label":"2025도16559","title":"강제추행[현역 군인에 대하여 성폭력처벌법 제16조 제2항 단서가 정한 이수명령을 부과할 수 없는 특별한 사정이 있다고 보아 이수명령을 병과하지 아니한 사건]","court":"대법원","date":"2026.04.02","caseType":"형사","basis":"참조조문","text":"[1] 현역 군인 등 군법 적용 대상자에 대하여, 보호관찰 등에 관한 법률에 따른 보호관찰, 사회봉사, 수강명령이나 성폭력범죄의 처벌 등에 관한 특례법 제16조에 따른 이수명령을 명할 수 있는지 여부 / 형사판결 선고 시 ‘군법 적용 대상자’의 신분에 있더라도 보호관찰 등이나 이수명령을 병과하는 당해 형사판결이 확정됨에 따라 법령에 의하여 당연히 그 신분을 상실하는 것이 예정되어 있는 경우, 법원이 신분 상실의 원인이 되는 형을 선고할 때 보호관찰 등이나 이수명령을 부과할 수 있는지 여부 [2] 현역 군인으로 군법 적용 대상자인 피고인에 대한 강제추행 공소사실에 대하여, 원심이 이를 유죄로 판단하여 벌금 800만 원을 선고하면서도 성폭력범죄의 처벌 등에 관한 특례법 제16조 제9항에 의하여 준용되는 보호관찰 등에 관한 법률 제56조, 제64조 제1항에 따라 피고인에 대하여 이수명령을 부과할 수 없는 특별한 사정이 있다고 보아 이수명령을 병과하지 아니한 사안에서, 원심판결 선고 당시 현역으로 복무 중인 부사관인 피고인에 대하여 벌금 800만 원을 선고한 원심판결이 확정되는 경우, 피고인은 구 군인사법 제40조 제1항 제4호, 제10조 제2항 제6호의3 등에 의하여 현역 군인 신분을 당연히 상실하게 되므로, 원심판결 선고 시에 피고인이 군법 적용 대상자에 해당한다는 사정은 성폭력범죄의 처벌 등에 관한 특례법 제16조 제2항 단서에서 정한","url":"https://www.law.go.kr/precInfoP.do?precSeq=618653"},{"id":"P:618701","kind":"P","label":"2023도5440","title":"폭행[책상을 뒤엎은 것이 폭행인지가 문제 된 사건]","court":"대법원","date":"2026.04.02","caseType":"형사","basis":"참조조문","text":"[1] 폭행죄에서 말하는 ‘폭행’의 의미 및 반드시 피해자의 신체에 접촉함을 요하는지 여부 / 피해자의 신체에 접촉하지 않은 사안에서 사람에 대한 유형력의 행사가 ‘폭행’에 해당하는지 판단하는 기준 [2] 피고인과 甲은 아파트 입주자대표회의의 회장과 감사 사이인데, 피고인이 입주자대표회의 회의실에서 회의록 작성과 관련하여 甲과 시비하던 중 화가 나 양손으로 앞에 놓인 책상을 甲이 서 있던 방향으로 뒤집어엎어 甲을 폭행하였다는 내용으로 기소된 사안에서, 피고인이 한 행위의 부수적인 결과로 甲에게 책상 파편 일부가 튀었다는 사정을 비롯하여 검사가 제출한 증거들에서 알 수 있는 사정들만으로는 피고인이 甲을 폭행하였다거나, 피고인에게 폭행의 고의가 있었던 것으로 단정할 수 없다는 이유로, 이와 달리 보아 피고인에게 유죄를 인정한 원심판단에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=618701"},{"id":"P:623089","kind":"P","label":"2025도12988","title":"특정경제범죄가중처벌등에관한법률위반(사기)·사문서위조·위조사문서행사·공직선거법위반","court":"대법원","date":"2026.03.12","caseType":"형사","basis":"참조조문","text":"범죄구성요건의 주관적 요소로서 ‘미필적 고의’의 의미 / 미필적 고의의 요건 및 행위자에게 미필적 고의가 있었는지 판단하는 방법 / 미필적 고의의 존재에 대한 증명책임 소재 및 유죄를 인정하기 위한 증거의 증명력 정도","url":"https://www.law.go.kr/precInfoP.do?precSeq=623089"},{"id":"P:623085","kind":"P","label":"2025도21916","title":"절도","court":"대법원","date":"2026.03.12","caseType":"형사","basis":"참조조문","text":"판결이 확정되기 전 그 판결에서 선고한 형기만큼 구금되었다가 구속취소로 출소한 후 아직 판결이 확정되지 않고 있는 동안 저지른 범죄가 그 판결로써 확정된 범죄와의 관계에서 형법 제35조 누범에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=623085"},{"id":"P:618177","kind":"P","label":"2025도13141","title":"금융실명거래및비밀보장에관한법률위반·개인정보보호법위반[갑이 을을 상대로 제기한 민사소송과 병이 을을 상대로 제기한 민사소송에서 을의 소송대리인이 각각의 사건에서 재판부를 통해 확인한 갑과 병의 은행 거래내역 등을 다른 사건에서 증거자료로 제출한 경우, 금융실명거래 및 비밀보장에 관한 법률 및 개인정보 보호법 위반죄에 대하여 형법 제20조에 따라 위법성이 조각되는지 여부]","court":"대법원","date":"2026.02.26","caseType":"형사","basis":"참조조문","text":"[1] 재판과정에서 소송상 필요한 주장의 증명이나 범죄혐의에 대한 방어권 행사를 위하여 금융거래정보 또는 개인정보가 포함된 소송서류나 증거를 법원에 제출하는 경우, 금융실명거래 및 비밀보장에 관한 법률 및 개인정보 보호법 위반죄에 대하여 형법 제20조에 따라 위법성이 조각될 수 있는지 여부 및 이때 정당행위에 해당하는지 판단하는 방법 [2] 甲이 乙을 상대로 제기한 민사소송과 丙이 乙을 상대로 제기한 민사소송의 소송대리를 맡은 피고인이 제2 민사사건에서 재판부를 통해 확인한 甲의 은행 거래내역을 제출하고, 제1 민사사건에서 丙의 소득금액증명, 재판부를 통해 확인한 丙의 은행 거래내역을 증거자료로 제출하여 업무상 알게 된 개인정보를 누설함과 동시에 법원의 제출명령에 따라 알게 된 거래정보 등을 목적 외의 용도로 이용했다는 공소사실로 기소된 사안에서, 피고인이 甲의 거래내역, 丙의 소득금액증명 및 거래내역을 법원에 제출한 것은 비록 구 금융실명거래 및 비밀보장에 관한 법률 제6조 제1항 위반죄 및 구 개인정보 보호법 제71조 제5호 위반죄의 구성요건에 해당하더라도, 형법 제20조에 따라 위법성이 조각될 소지가 충분하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=618177"},{"id":"P:622697","kind":"P","label":"2026도354","title":"절도","court":"대법원","date":"2026.02.26","caseType":"형사","basis":"참조조문","text":"피고인이 직계존속인 피해자들의 주거지 안방에서 금고와 재물을 절취해 갔다는 절도의 공소사실로 기소되었고, 이에 대해서는 형법 제344조에 의해 형법 제328조가 준용되는데, 헌법재판소가 2024. 6. 27. 구 형법 제328조 제1항에 대해 헌법불합치결정을 선고함에 따라 2025. 12. 31. 법률 제21307호로 개정ㆍ시행된 형법 제328조 제1항은 절도죄를 범한 사람이 피해자의 친족인 경우를 친고죄로 규정하면서, 그 부칙 제2조에서 형법 제328조 개정규정을 2024. 6. 27. 이후에 최초로 지은 범죄부터 적용하도록 정한 사안에서, 피고인은 피해자들의 직계비속으로 2024. 6. 27. 이후인 2024. 12. 10. 절도 범행을 저질렀고, 피고인의 변호인은 제1심판결 선고 전에 제1심법원에 ‘피해자들은 피고인의 처벌을 원하지 않는다.’는 취지가 기재된 피해자들 명의의 합의서와 처벌불원서를 제출한 사정 및 형법 제328조 제1항의 개정 경과와 개정 내용 등을 종합하면 공소사실에는 형법 제328조 개정규정이 적용되어 피해자들의 고소가 있어야 공소를 제기할 수 있는데 피해자들은 고소를 취소하였으므로, 원심은 제1심판결을 취소하고 공소사실에 대해 공소기각판결을 선고하였어야 한다는 이유로, 이와 달리 제1심판결과 마찬가지로 유죄로 판단한 원심판결에 친고죄에서 ‘고소의 취소’에 관한 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=622697"},{"id":"P:618083","kind":"P","label":"2025도8286","title":"건설산업기본법위반·독점규제및공정거래에관한법률위반[건설산업기본법 제95조 제1호 위반죄의 죄수가 문제 된 사건]","court":"대법원","date":"2026.02.26","caseType":"형사","basis":"참조조문","text":"건설산업기본법 제95조 제1호가 형법 제315조의 특별규정인지 여부 및 건설산업기본법 제95조 제1호 위반죄의 보호법익 / 수 개의 건설공사 입찰들에서 이루어진 건설산업기본법 제95조 제1호 위반행위의 죄수 및 포괄일죄가 성립하는 경우 / 같은 입찰 시행자가 건설업을 영위하면서 발주하는 동종ㆍ유사의 건설공사에 관하여 계속적으로 시행한 일련의 입찰에서 수 개의 건설산업기본법 제95조 제1항 위반행위가 있는 경우, 그로 인하여 저해되는 피해법익의 동일 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=618083"},{"id":"P:618077","kind":"P","label":"2025도4422","title":"강제추행·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등)[압수된 증거의 증거능력이 문제 된 사건]","court":"대법원","date":"2026.02.26","caseType":"형사","basis":"판례내용","text":"[1] 법관이 압수ㆍ수색영장을 발부하면서 ‘압수할 물건’을 특정하기 위하여 기재한 문언은 엄격하게 해석하여야 하는지 여부 / 압수ㆍ수색영장에 기재된 ‘압수할 물건’에 포함되어 있지 아니한 물건에 대한 압수가 위법한지 여부 및 사후에 법원으로부터 압수ㆍ수색영장이 발부되었거나 피고인이나 변호인이 이를 증거로 함에 동의한 경우 그 위법성이 치유되는지 여부 [2] 피의자ㆍ피고인과 변호인 사이에 생성된 형사사건에 관한 법률자문 서류 등에 대한 압수가 허용되는지 여부 / 예외적으로 법률자문 서류 등에 대한 압수가 허용되는 경우 및 이에 해당하는지 판단하는 기준 [3] 헌법과 형사소송법이 정한 절차에 따르지 아니하고 수집된 증거와 이를 기초로 획득된 2차적 증거를 유죄 인정의 증거로 삼을 수 있는지 여부 / 위 증거를 유죄 인정의 증거로 사용할 수 있는 예외적인 경우 및 이에 해당하는지를 판단할 때 고려할 사항과 그러한 특별한 사정이 존재한다는 점에 대한 증명책임 소재 / 수사기관이 위법하게 수집한 1차적 증거가 수사개시의 단서가 되었거나 사실상 유일한 증거 또는 핵심증거이고 위법의 정도 역시 상당할뿐더러, 피고인이 수사기관에서 1차적 증거를 제시받거나 1차적 증거의 내용을 전제로 신문받은 바가 있는 경우, 2차적 증거인 피고인의 법정진술을 유죄 인정의 증거로 사용할 수 있는지 여부 / 이때 피고인의 법정진술을 유죄 인정의 증거로 사용할 수 있는","url":"https://www.law.go.kr/precInfoP.do?precSeq=618077"},{"id":"P:618227","kind":"P","label":"2024도11156","title":"특정범죄가중처벌등에관한법률위반(허위세금계산서교부등)·특정범죄가중처벌등에관한법률위반(조세)(인정된죄명:조세범처벌법위반)·조세범처벌법위반·특정경제범죄가중처벌등에관한법률위반(횡령)·특정경제범죄가중처벌등에관한법률위반(사기)·특정범죄가중처벌등에관한법률위반(조세)방조(인정된죄명:조세범처벌법위반방조)·조세범처벌법위반방조·특정범죄가중처벌등에관한법률위반(허위세금계산서교부등)방조[조세포탈죄에 있어서 납세의무자가 아닌 행위자의 고의의 의미 및 판단 기준이 쟁점이 된 사건]","court":"대법원","date":"2026.02.26","caseType":"형사","basis":"판례내용","text":"[1] 조세범 처벌법 제3조 제1항의 조세포탈죄에서 범의의 내용 / 법인세 포탈로 인한 조세포탈죄에서 법인세 포탈의 결과 발생 여부 및 이에 대한 행위자의 인식 유무는 납세의무자인 각 법인별로 구분하여 판단하는지 여부 / 복수의 법인들 업무에 관여한 조세범 처벌법 제18조에서 정한 행위자가 마치 그 법인들 사이에 거래가 있었던 것처럼 허위의 외관을 만든 후 그 거래 관련 비용을 매입처로 가장한 특정 법인의 손금에 산입하여 법인세를 신고한 경우, 특정 법인에 대한 법인세 포탈의 결과 발생 및 행위자의 조세포탈 범의를 인정할 수 있는지 여부 [2] 피고인 甲이 납세의무자인 피고인 乙 주식회사에 대한 법인세를 신고하면서 피고인 丙 주식회사로부터 수취한 세금계산서의 용역비용 및 피고인 丁 등에 대한 세전 급여비용을 허위로 과다 계상함으로써 피고인 乙 회사가 납부해야 할 법인세를 낮게 신고하여, 피고인 甲은 사기나 기타 부정한 행위로 피고인 乙 회사의 법인세를 포탈하였다는 조세범 처벌법 위반으로, 피고인 丁 등은 자신의 명의를 대여하는 등의 방법으로 피고인 甲의 조세포탈 범행을 용이하게 하여 이를 방조하였다는 조세범 처벌법 위반 방조로, 피고인 乙 회사는 실운영자인 피고인 甲이 위와 같은 위반행위를 하였다는 조세범 처벌법 위반으로 각각 기소된 사안에서, 피고인 乙 회사의 법인세 전액에 관하여 조세포탈의 결과가 발생하였고 행위자인 피고인 甲의 ","url":"https://www.law.go.kr/precInfoP.do?precSeq=618227"},{"id":"P:618195","kind":"P","label":"2024도14998","title":"사기·사전자기록등위작·위작사전자기록등행사·개인정보보호법위반[보험가입 및 고객 관리를 위하여 고객의 개인정보를 수집한 보험설계사가 개인정보처리자에 해당하는지 여부가 문제 된 사건][압수된 증거의 증거능력이 문제 된 사건]","court":"대법원","date":"2026.02.26","caseType":"형사","basis":"참조조문","text":"[1] 어떤 주체가 업무를 목적으로 개인정보파일을 운용하기 위하여 개인정보를 수집, 보유, 이용하는 등 개인정보처리에 해당하는 행위를 실제로 하였다는 사정만으로 당연히 구 개인정보 보호법 제18조 제1항의 수범자인 ‘개인정보처리자’에 해당하는지 여부 / 구 개인정보 보호법상 ‘개인정보처리자’에 해당하는지 판단하는 기준 및 이때 고려하여야 할 사항 [2] 피고인은 甲 보험회사 소속 보험설계사로 위촉되어 활동하던 사람이고, 乙은 당시 피고인을 통해 甲 보험회사의 보험상품에 가입한 사람인데, 피고인이 丙과 공모한 다음 丙이 甲 보험회사 상담원에게 전화하여 마치 乙인 것처럼 행세하면서 피고인이 보험설계사로서 보험 가입 및 고객 관리를 위해 수집한 乙의 생년월일, 주소, 연락처 등을 이용하여 乙이 가입한 보험의 특약 해지, 주 계약 보장내용 변경 등을 신청함으로써 乙의 개인정보를 수집 목적의 범위를 초과하여 이용하였다는 구 개인정보 보호법 위반으로 기소된 사안에서, 피고인이 乙의 개인정보를 수집한 적이 있다는 등의 사정만으로 개인정보처리자라는 전제 아래 피고인의 행위가 같은 법 제71조 제2호, 제18조 제1항 위반죄에 해당한다고 본 원심판단에 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=618195"},{"id":"P:624499","kind":"P","label":"2025고합1194","title":"변호사법위반","court":"서울중앙지방법원","date":"2026.02.13","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=624499"},{"id":"P:616707","kind":"P","label":"2024도9475","title":"업무상배임·사전자기록등위작·위작사전자기록등행사[권한 있는 사람이 권한을 남용하여 전자기록에 관한 시스템에 정보를 입력하였는데 입력된 내용이 진실에 부합하는 경우 사전자기록등위작죄에서 말하는 위작의 범위에 해당하는지 여부]","court":"대법원","date":"2026.02.12","caseType":"형사","basis":"참조조문","text":"사전자기록등위작죄에서 말하는 ‘위작’의 범위에 사전자기록 등 특수매체기록 작성 등에 관하여 권한 없는 사람이 전자기록을 작출하는 등의 경우는 물론 권한 있는 사람이 권한을 남용하여 전자기록에 관한 시스템에 ‘허위’의 정보를 입력한 경우도 포함될 수 있는지 여부 및 권한 있는 사람이 권한을 남용하여 입력하더라도 입력된 내용이 진실에 부합하여 ‘허위’의 정보에 해당한다고 볼 수 없는 경우가 이에 포함되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=616707"},{"id":"P:622835","kind":"P","label":"2025노129","title":"강간","court":"광주고등법원","date":"2026.02.12","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=622835"},{"id":"P:622691","kind":"P","label":"2025도20396","title":"마약류관리에관한법률위반(향정)","court":"대법원","date":"2026.02.12","caseType":"형사","basis":"판례내용","text":"피고인과 공범관계가 있는 다른 피의자에 대하여 검사 이외의 수사기관이 작성한 피의자신문조서가 형사소송법 제312조 제4항의 요건을 갖추었더라도 해당 피고인이 공판기일에서 그 조서의 내용을 부인한 경우, 이를 유죄 인정의 증거로 사용할 수 있는지 여부 / 여기서 말하는 ‘공범’에 강학상 필요적 공범 내지 대향범도 포함되는지 여부 및 위 규정에서 ‘그 내용을 인정할 때’의 의미","url":"https://www.law.go.kr/precInfoP.do?precSeq=622691"},{"id":"P:622685","kind":"P","label":"2025도18126","title":"횡령·절도·조세범처벌법위반·특수상해·컴퓨터등사용사기·여신전문금융업법위반·사기미수","court":"대법원","date":"2026.02.12","caseType":"형사","basis":"참조조문","text":"[1] 횡령죄가 위태범인지 여부 및 보관 중인 타인의 재물을 담보로 제공하는 행위가 그 재물에 대한 소유권 침해의 결과가 발생하지 않더라도 횡령죄가 성립하는지 여부 [2] 형법 제355조 제1항에서 정하는 ‘반환의 거부’의 의미 / 횡령죄가 성립하는 반환거부행위의 정도 / 횡령죄에서 불법영득 의사의 의미 및 횡령한 재물을 사후에 반환하거나 변상, 보전하는 의사가 있더라도 불법영득의 의사를 인정할 수 있는지 여부 [3] 수개의 범죄사실 중 일부에 대하여는 유죄, 나머지에 대하여는 무죄를 선고한 항소심 판결에 대하여 피고인 및 검사 쌍방이 상고를 제기하였으나 유죄 부분에 대한 피고인의 상고는 이유 없고 무죄 부분에 대한 검사의 상고만 이유 있고, 항소심이 유죄로 인정한 죄와 무죄로 인정한 죄가 형법 제37조 전단의 경합범 관계에 있는 경우, 파기의 범위","url":"https://www.law.go.kr/precInfoP.do?precSeq=622685"},{"id":"P:616247","kind":"P","label":"2025도15970","title":"사기·도로교통법위반(음주운전)·도로교통법위반(무면허운전)","court":"대법원","date":"2026.01.29","caseType":"형사","basis":"참조조문","text":"금고 이상의 형을 선고받아 그 집행이 종료되거나 면제된 후 3년 내에 금고 이상에 해당하는 죄를 범한 경우, 그 후 그 형이 형의 실효 등에 관한 법률 제7조에 따라 실효되었더라도 형법 제35조 제1항에서 정한 누범사유에 여전히 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=616247"},{"id":"P:616237","kind":"P","label":"2023도18308","title":"공무상비밀누설·외교상기밀누설·외교상기밀탐지·외교상기밀수집","court":"대법원","date":"2026.01.29","caseType":"형사","basis":"참조조문","text":"형법 제113조 제1항 외교상기밀누설죄에서 말하는 ‘외교상 기밀’의 의미 및 외교상 기밀에 해당하기 위한 요건","url":"https://www.law.go.kr/precInfoP.do?precSeq=616237"},{"id":"P:616507","kind":"P","label":"2025도18022","title":"모해위증(인정된죄명:위증)","court":"대법원","date":"2026.01.29","caseType":"형사","basis":"참조조문","text":"[1] 모해위증죄에 관한 형법 제152조 제2항에서 정한 ‘징계’의 의미 및 이때 국가와 징계대상자 사이의 관계 [2] 학교법인 등이 사립학교 교원에 대하여 징계권을 행사한 경우, 이에 관한 사건이 형법 제152조 제2항의 ‘징계사건’에 포함되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=616507"},{"id":"P:622057","kind":"P","label":"2023도8410","title":"모욕","court":"대법원","date":"2026.01.29","caseType":"형사","basis":"참조조문","text":"[1] 모욕죄의 보호법익 / 모욕죄에서 ‘모욕’의 의미 및 어떠한 표현이 모욕에 해당하는지 판단하는 기준 / 상대방을 불쾌하게 할 수 있는 무례하고 예의에 벗어난 정도의 표현이거나 상대방에 대한 부정적ㆍ비판적 의견 또는 감정을 나타내면서 경미한 수준의 추상적 표현이나 욕설이 사용된 경우, 모욕죄의 구성요건에 해당하는지 여부 [2] 피고인과 甲은 아파트 입주예정자 비상대책위원회에서 함께 활동하다가 각각 동대표로 당선되었는데, 피고인이 입주민들로 구성된 인터넷 카페나 입주민 모임 등에서 甲의 회계처리 방식 등에 대해 이의를 제기하면서 서로 갈등관계에 놓이게 되자, 아파트 입주민들에게 \"비대위 안에 X맨이 ○○○이었어요. 이제 생각해보니까 다 퍼즐이 맞아가지고 지금 소름이 끼쳐요.\"라고 여러 번 말하거나 \"甲이 시공사 X맨이다.\"라고 말함으로써 甲을 모욕하였다는 내용으로 기소된 사안에서, ‘X맨’이라는 표현은 조직 내부에서 반대세력을 돕는 사람을 비꼬는 정도의 의미로 일상생활이나 언론 등에서 자주 거론되며 비교적 가볍게 사용되는 추상적 표현인 점을 비롯하여 피고인, 甲, 상대방의 지위와 관계, 발언에 이르게 된 동기나 경위 등 제반 사정을 종합하면, 피고인의 발언은 객관적으로 드러난 일정한 전제사실을 기초로 甲의 행위와 처신 등에 대해 의혹을 제기하고 甲에 대한 부정적ㆍ비판적 의견이나 감정을 나타내면서 경미한 수준의 추상적 표현을 사용한 ","url":"https://www.law.go.kr/precInfoP.do?precSeq=622057"},{"id":"P:619485","kind":"P","label":"2025노2282","title":"가. 스토킹범죄의처벌등에관한법률위반  나. 스토킹방지및피해자보호등에관한법률위반방조 다. 모욕 라. 폭력행위등처벌에관한법률위반(공동상해)","court":"창원지방법원","date":"2026.01.20","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619485"},{"id":"P:624103","kind":"P","label":"2025고합1010","title":"특수공무집행방해, 허위공문서작성, 허위작성공문서행사, 대통령기록물관리에관한법률위반, 공용서류손상, 직권남용권리행사방해, 대통령등의경호에관한법률위반교사, 범인도피교사","court":"서울중앙지방법원","date":"2026.01.16","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=624103"},{"id":"P:615949","kind":"P","label":"2024도7611","title":"권리행사방해","court":"대법원","date":"2026.01.15","caseType":"형사","basis":"참조조문","text":"[1] 권리행사방해죄에서 말하는 ‘자기의 물건’의 의미 및 자기의 물건인지 판단하는 기준 [2] 당사자 사이에 자동차의 소유권을 등록명의자 아닌 자가 보유하기로 약정한 경우, 제3자에 대한 관계에서 자동차의 소유자 [3] 권리행사방해죄에서 공유물은 범인의 지분비율 범위에서는 ‘자기의 물건’에 해당하는지 여부 [4] 피고인과 甲의 공동명의로 등록된 자동차의 공유자로서 실제 운행자인 피고인이, 피해자 乙 주식회사로부터 자동차 구입자금 중 일부를 甲 명의로 대출받으면서 乙 회사 앞으로 자동차에 저당권을 설정해 주었는데, 그 후 丙으로부터 돈을 차용하면서 丙에게 자동차를 담보로 제공하여 인도함으로써 乙 회사의 권리행사를 방해하였다는 공소사실로 기소된 사안에서, 피고인과 甲의 공유물인 자동차는 피고인의 지분비율 범위에서는 권리행사방해죄에서 정한 ‘자기의 물건’에 해당하고, 乙 회사의 근저당권은 자동차 중 피고인 지분 또한 그 목적으로 하므로, 피고인이 丙에게 자동차를 담보로 인도한 것은 ‘자기의 물건’을 은닉하여 乙 회사의 권리행사를 방해한 것에 해당할 여지가 많다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=615949"},{"id":"P:622061","kind":"P","label":"2025도13231","title":"산업기술의유출방지및보호에관한법률위반·부정경쟁방지및영업비밀보호에관한법률위반(영업비밀국외누설등)·부정경쟁방지및영업비밀보호에관한법률위반(영업비밀누설등)·업무상배임","court":"대법원","date":"2026.01.15","caseType":"형사","basis":"참조조문","text":"[1] 행위자가 부정한 이익을 얻거나 영업비밀 보유자에 손해를 입힐 목적으로 영업비밀을 아직 알지 못하는 상대방에게 이를 알려주거나 넘겨주는 경우, 상대방과 함께 그 영업비밀을 사용하기로 공모하였거나 실제로 함께 영업비밀을 사용하였는지 등을 불문하고, 이를 알려주거나 넘겨주는 행위를 한 자에게는 영업비밀 누설로 인한 부정경쟁방지 및 영업비밀보호에 관한 법률 제18조 위반죄가, 영업비밀을 알게 되거나 넘겨받은 상대방에게는 영업비밀 취득으로 인한 같은 법 제18조 위반죄가 각각 성립하는지 여부 [2] 항소심이 경합범으로 공소제기된 수 개의 범죄사실 중 일부에 대하여 유죄, 일부에 대하여 무죄를 각 선고하였는데, 무죄 부분에 대하여는 검사가 상고하였으나 유죄 부분에 대하여는 피고인과 검사 모두 상고하지 아니한 경우, 상고심에서 이를 파기할 때의 파기 범위","url":"https://www.law.go.kr/precInfoP.do?precSeq=622061"},{"id":"P:615965","kind":"P","label":"2025도17027","title":"사기·국민기초생활보장법위반","court":"대법원","date":"2026.01.15","caseType":"형사","basis":"참조조문","text":"[1] 범죄의 성립과 처벌에 관하여 규정한 형벌법규 자체 또는 그로부터 수권 내지 위임을 받은 법령의 변경에 따라 범죄를 구성하지 않게 되거나 형이 가벼워진 경우, 형법 제1조 제2항과 형사소송법 제326조 제4호가 적용되는지 여부 / 형벌법규가 고시 등에 구성요건의 일부를 수권 내지 위임한 경우에도 마찬가지인지 여부 / 형벌법규 자체 또는 그로부터 수권 내지 위임을 받은 법령이 아닌 다른 법령이 변경된 경우, 형법 제1조 제2항과 형사소송법 제326조 제4호를 적용하기 위한 요건 [2] 피고인 甲과 피고인 乙이 공모하여 차량가액이 소득인정액으로 산입되는 자동차를 상용했음에도 차량 사용 현황을 피해자 지방자치단체에 고지하지 않은 채 생계급여 및 주거급여를 송금받아 편취함과 동시에 거짓이나 그 밖에 부정한 방법으로 급여를 받았다는 사기 및 국민기초생활 보장법 위반의 공소사실로 기소되었는데, 소득환산액 산정에서 일반재산으로 보는 자동차의 구체적인 범위를 정하고 있는 보건복지부고시가 ‘배기량 1,600cc 미만으로 연식이 10년 이상인 자동차’에서 공소사실 위반행위 이후 ‘배기량 2,000cc 미만으로 연식이 10년 이상 또는 차량가액이 500만 원 미만인 자동차’로 개정된 사안에서, 공소사실에 대하여 ‘범죄 후 법령 개폐로 형이 폐지’된 것으로 보아 형사소송법 제326조 제4호에 따라 판결로써 면소를 선고했어야 한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=615965"},{"id":"P:615967","kind":"P","label":"2025도11906","title":"산업기술의유출방지및보호에관한법률위반·부정경쟁방지및영업비밀보호에관한법률위반(영업비밀국외누설등)·업무상배임","court":"대법원","date":"2026.01.15","caseType":"형사","basis":"판결요지","text":"행위자가 부정한 이익을 얻거나 영업비밀 보유자에게 손해를 입힐 목적으로 영업비밀을 아직 알지 못하는 상대방에게 이를 알려주거나 넘겨주는 경우, 상대방과 함께 그 영업비밀을 사용하기로 공모했거나 실제로 함께 영업비밀을 사용했는지 등을 불문하고 부정경쟁방지 및 영업비밀보호에 관한 법률 제18조 위반죄가 성립하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=615967"},{"id":"P:624105","kind":"P","label":"2025노509","title":"특정범죄가중처벌등에관한법률위반(뇌물)·범죄수익은닉의규제및처벌등에관한법률위반·뇌물공여·범죄수익은닉의규제및처벌등에관한법률위반방조·산림기술진흥및관리에관한법률위반·특정경제범죄가중처벌등에관한법률위반(횡령)·업무상횡령","court":"대구고등법원","date":"2026.01.14","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=624105"},{"id":"P:615943","kind":"P","label":"2023도8339","title":"개인정보보호법위반·금융실명거래및비밀보장에관한법률위반","court":"대법원","date":"2026.01.08","caseType":"형사","basis":"판례내용","text":"[1] 임직원, 파견근로자, 시간제근로자 등 개인정보처리자의 지휘ㆍ감독을 받아 개인정보를 처리하는 자인 개인정보취급자가 개인정보처리자의 업무 수행을 위하여 개인정보를 이전받는 경우, 구 개인정보 보호법 제19조에서 정한 ‘개인정보처리자로부터 개인정보를 제공받은 자’에 해당하는지 여부 [2] 구 개인정보 보호법 제19조에서 말하는 ‘개인정보처리자로부터 개인정보를 제공받은 자’의 의미 및 ‘제공받은 목적’의 의미 / 개인정보처리자가 구 개인정보 보호법 제17조, 제18조를 위반하여 개인정보를 제공한 경우, 그 개인정보를 제공받은 자를 같은 법 제19조의 ‘개인정보처리자로부터 개인정보를 제공받은 자’에 해당한다고 보아 그 위반을 이유로 같은 법 제71조 제2호로 처벌할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=615943"},{"id":"P:616025","kind":"P","label":"2025도13674","title":"특정범죄가중처벌등에관한법률위반(조세)(피고인2,3,4에대하여일부인정된죄명:조세범처벌법위반방조)·특정범죄가중처벌등에관한법률위반(허위세금계산서교부등)·특정경제범죄가중처벌등에관한법률위반(횡령)·업무상횡령·업무상배임·조세범처벌법위반","court":"대법원","date":"2026.01.08","caseType":"형사","basis":"판례내용","text":"실물거래 없이 세금계산서를 수수하는 행위를 처벌하는 구 조세범 처벌법 제10조 제3항 제1호의 취지 및 이때 ‘실물거래가 있다.’는 것의 의미 / 실물거래가 존재하는 상태에서 세금계산서가 발급된 것으로 인정하기 위한 요건 / 구 조세범 처벌법 제10조 제3항의 행위주체가 재화나 용역의 공급 없이 세금계산서의 수수를 업으로 하는 이른바 ‘자료상’만으로 한정되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=616025"},{"id":"P:615703","kind":"P","label":"2024도3387","title":"전자장치부착등에관한법률위반","court":"대법원","date":"2025.12.24","caseType":"형사","basis":"판례내용","text":"[1] 법원이 부착명령에 관하여 전자장치 부착 등에 관한 법률 제9조의2 제1항 제1호에 따라 ‘전자장치 부착기간 중 준수기간을 정하여 야간 등 특정 시간대에 주거지 이외로 외출을 삼갈 것’이라는 준수사항을 부과한 경우, 그 준수사항의 의미 / 같은 법 제39조 제3항에서 정한 정당한 사유가 있는지를 판단할 때 고려할 사항 [2] 피고인이 ‘야간 등 특정 시간대에 주거지 이외로 외출을 삼갈 것’이라는 외출제한 준수사항을 부과받아 보호관찰관으로부터 위 준수사항의 내용, 부과된 준수사항 위반 시 형사처벌 내용 등에 대하여 교육을 받고, 매일 00:00 이전 귀가할 것을 지도받았으며, 앞으로 생업이나 병원 진료 등 외출 사유가 발생할 경우 사전에 담당자에게 보고하고 준수사항 일시조정 신청서를 작성하도록 안내받았음에도, 단란주점에서 음주 후 택시를 잡을 수 없어 도보로 귀가하면서 10분 동안 준수사항을 위반하였다는 내용으로 기소된 사안에서, 피고인의 행위는 전자장치 부착 등에 관한 법률 제9조의2 제1항 제1호의 준수사항을 정당한 사유 없이 위반한 때에 해당하고, 피고인에게 위 준수사항 위반의 고의 또한 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=615703"},{"id":"P:621917","kind":"P","label":"2025도16733","title":"교통사고처리특례법위반(치상)·도로교통법위반(음주운전)·도로교통법위반(무면허운전)·도로교통법위반","court":"대법원","date":"2025.12.24","caseType":"형사","basis":"참조조문","text":"[1] 이미 선고된 판결의 내용을 실질적으로 변경하는 재판서 경정이 허용되는지 여부 [2] 피고인의 도로교통법 위반 등의 범죄사실에 징역 1년 6월을 선고한 제1심판결에 대해 피고인이 양형부당을 이유로 항소하였는데, 그 후 원심판결 선고 전에 피고인에게 징역 1년을 선고한 별도의 판결이 확정되었고, 원심은 위 범죄사실이 판결이 확정된 죄와 형법 제37조 후단 경합범 관계에 있어 형법 제39조 제1항에 따라 동시에 판결할 경우와 형평을 고려할 필요가 있다고 설시하면서도 제1심의 양형이 부당하지 않다는 이유로 피고인의 항소를 기각하면서 그 주문에서, 범죄사실 부분의 범죄전력에 판결이 확정된 죄를 추가하고, 법령의 적용 부분에 ‘1. 경합범처리 형법 제37조 후단, 제39조 제1항 본문’을 추가하는 것으로 제1심판결을 경정한 사안에서, 제1심판결의 이유에 제1심이 전혀 심리ㆍ판단하지 아니한 형법 제37조 후단 경합범에 관한 범죄전력을 범죄사실에 기재하고 이에 대한 법령의 적용을 추가하는 취지로 제1심판결을 경정하는 것은, 이미 선고된 제1심판결의 내용을 실질적으로 변경하는 것으로서 경정의 범위를 벗어나기 때문에 허용되지 않는다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=621917"},{"id":"P:619543","kind":"P","label":"2025노2686","title":"도박공간개설, 개인정보보호법위반","court":"의정부지방법원","date":"2025.12.19","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619543"},{"id":"P:622303","kind":"P","label":"2025노1517","title":"범죄단체가입, 범죄단체활동, 사기, 자본시장과금융투자업에관한법률위반","court":"서울남부지방법원","date":"2025.12.18","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=622303"},{"id":"P:622349","kind":"P","label":"2025노71","title":"아동·청소년의성보호에관한법률위반(영리목적성착취물판매등), 아동·청소년의성보호에관한법률위반(성착취물배포등), 성폭력범죄의처벌등에관한특례법위반(영리목적카메라등이용촬영물반포등), 아동·청소년의성보호에관한법률위반(성착취물소지등), 성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등), 성폭력범죄의처벌등에관한특례법위반(허위영상물편집·반포등), 정보통신망이용촉진및정보보호등에관한법률위반(음란물유포), 성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영물소지등), 성폭력범죄의처벌등에관한특례법위반(허위영상물소지등)","court":"광주고등법원","date":"2025.12.17","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=622349"},{"id":"P:621925","kind":"P","label":"2025도15459","title":"업무방해(인정된 죄명: 폭행)·도로교통법위반","court":"대법원","date":"2025.12.11","caseType":"형사","basis":"참조조문","text":"[1] 업무방해죄와 공무집행방해죄를 구별하는 기준 / 형법상 ‘공무원’의 의미 [2] 구청 소속 공무직 근로자인 甲이 노점상 단속 업무를 하면서 사진을 찍자, 피고인이 甲의 신분증을 빼앗고 甲의 팔목을 잡아 비틀어 위력으로 甲의 업무를 방해하였다는 내용으로 기소된 사안에서, 甲은 시 내부규정에 근거하여 시장과 근로계약을 체결하였고, 위 근로계약에 근거하여 구청 건설과 소속 공무직원으로서 노점상 현장을 촬영하여 담당 공무원에게 단속을 요청하거나 자진철거를 권유하는 등의 업무를 담당하였으며, 달리 甲이 법령의 근거에 기하여 위 사무에 종사한 것이라고 볼 만한 자료가 없는 점 등을 종합하면, 甲은 법령의 근거에 기하여 지방자치단체 등의 사무에 종사하는 형법상 공무원이라고 보기 어려워, 공무원이 아닌 甲이 한 노점상 단속 지원 업무는 공무집행방해죄의 보호대상이 되는 ‘공무원이 직무상 수행하는 공무’가 아니라 업무방해죄에서의 업무에 해당한다는 이유로, 이와 달리 본 원심판결에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=621925"},{"id":"P:614339","kind":"P","label":"2025도10910","title":"살인미수","court":"대법원","date":"2025.12.11","caseType":"형사","basis":"참조조문","text":"[1] 헌법이 선언한 공정한 재판을 받을 권리의 내용 및 피고인이 양형과 관련하여 자신에게 유리한 주장을 하고 자료를 제출할 수 있는 기회를 충분히 보장하는 것도 공정한 재판을 받을 권리에 포함되는지 여부 / 법원이 소년에 대한 형사사건을 심리할 때 유의할 사항 및 활용할 수 있는 제도 / 장애인인 피고인이 형사재판절차에서 조력을 요청하는 경우 법원이 고려할 사항 및 취할 조치 / 법원이 정신적 장애인인 소년에 대한 형사사건의 심리 및 처분 등을 판단할 때 유의할 사항 [2] 피고인이 자신의 정신적 장애를 밝히거나 이를 이유로 심신장애, 치료의 필요성 등을 주장하는 것을 ‘죄를 반성하거나 후회하고 있지 않다는 인격적 비난요소’로 보아 가중적 양형의 조건으로 삼는 것이 허용될 수 있는지 여부 및 이때 가중적 양형의 조건으로 참작하는 경우, 피고인의 정신적 장애 상태에 관한 면밀하고도 충분한 심리가 뒷받침되어야 하는지 여부 [3] 소년이자 정신적 장애인인 피고인이 이성적으로 좋아하게 된 甲이 자신을 만나주지 않고 친구 관계마저 끊으려고 하자 甲을 살해하기로 마음먹고 망치, 과도 등을 소지 후 甲의 머리를 망치로 내리치고, 과도로 甲의 얼굴, 목 등을 수회 찔러 살해하려고 하였으나, 주변에 있던 시민들이 이를 제지하는 바람에 미수에 그쳤다는 내용으로 기소된 사안에서, 피고인의 정신질환은 범행에 어느 정도 영향을 미쳤다고 볼 여지가 있고, ","url":"https://www.law.go.kr/precInfoP.do?precSeq=614339"},{"id":"P:614347","kind":"P","label":"2025도8460","title":"전기통신금융사기피해방지및피해금환급에관한특별법위반·범죄수익은닉의규제및처벌등에관한법률위반","court":"대법원","date":"2025.12.11","caseType":"형사","basis":"참조조문","text":"공동정범으로 공소가 제기된 범죄사실을 방조범으로 인정하면서 공동정범 부분에 대하여는 판결 이유에서 무죄로 판단한 제1심판결 전부에 대하여 검사가 항소를 제기하였으나 항소이유서에서 양형부당을 주장하였을 뿐 무죄로 판단된 공동정범 부분에 대하여는 아무런 언급을 하지 아니한 경우, 무죄 부분이 항소심의 심판대상이 되는지 여부 및 무죄 부분에 관한 제1심판결의 위법이 직권조사사유 또는 직권심판사항에 해당하는지 여부 / 이때 항소심법원이 직권으로 무죄로 판단된 공동정범 부분을 유죄로 인정하여 처벌하는 것이 허용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=614347"},{"id":"P:621921","kind":"P","label":"2025도4777","title":"사기·업무상배임·민간임대주택에관한특별법위반·사문서위조·위조사문서행사·공인중개사법위반·자격모용사문서작성·자격모용작성사문서행사·횡령·사기방조","court":"대법원","date":"2025.12.11","caseType":"형사","basis":"참조조문","text":"주택임대관리업 등을 목적으로 설립된 甲 주식회사의 대표이사, 이사, 부장인 피고인들이 공모하여, 도시형 생활주택과 오피스텔 등을 소유한 부동산 임대인들과 사이에 피고인들이 임대차계약 체결 등 부동산을 위탁관리하되 임대인들을 대리하여 임대차계약을 체결한 경우 이른바 ‘보장금’을 임대인들에게 지급하고 피고인들은 임차인들이 지급하는 최초 1개월분 차임을 임대인들로부터 수수료로 지급받는 내용의 ‘영업위탁계약’을 체결한 후 소유자들을 대리하여 임차인인 피해자들과 임대차계약을 체결하였는데, 사실은 甲 회사 설립 무렵부터 회사 보유 자산이 전혀 없었고, 임차인들로부터 지급받는 임대차보증금이 유일한 수입원으로서 그 임대차보증금에서 ‘보장금’을 공제하고 남은 금액으로 임대인들에게 지급할 차임, 회사 운영비, 인건비 등에 충당하는 이른바 ‘돌려막기’를 하는 상황이었으므로, 피고인들이 소유자들을 대리하여 부동산을 임대하고 임대차보증금을 지급받더라도 임대차계약 종료 시 피해자들에게 임대차보증금을 반환할 의사나 능력이 없었음에도 피해자들을 속여 임대차보증금 및 월차임을 교부받아 이를 편취하였다는 내용으로 기소된 사안에서, 피고인들은 임대차계약 체결 시 ‘임대차보증금 반환에 대한 책임은 甲 회사에서 책임지기로 한다.’는 등 甲 회사가 피해자들에게 임대차보증금을 반환한다는 별도 특약을 하였으므로, 甲 회사는 임대차계약상 임대인의 임대차보증금 반환의무와 중첩된 ","url":"https://www.law.go.kr/precInfoP.do?precSeq=621921"},{"id":"P:624569","kind":"P","label":"2024노8747","title":"청소년보호법위반","court":"수원지방법원","date":"2025.12.08","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=624569"},{"id":"P:619285","kind":"P","label":"2025노731","title":"동물보호법위반, 재물손괴","court":"창원지방법원","date":"2025.12.05","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619285"},{"id":"P:613165","kind":"P","label":"2024도6213","title":"공무상표시무효","court":"대법원","date":"2025.12.04","caseType":"형사","basis":"참조조문","text":"[1] 형법 제140조 제1항 공무상표시무효죄의 성립 요건 / 집행관이 부동산에 관하여 점유이전금지가처분을 집행하면서 그 집행 취지가 기재된 고시문을 부동산에 부착한 이후에 가처분 채무자가 다른 사람에게 부동산의 점유를 이전하는 경우, 공무상표시무효죄에 해당하는지 여부 [2] 피고인은 甲 등과 공동 투자하여 부동산을 甲 명의로 경락받아 소유권이전등기를 마쳤고, 乙은 그 이전부터 부동산으로 진입하는 출입구에 화물차를 주차하고 그 위에 컨테이너를 올려 관리하는 방법으로 부동산을 점유하면서 유치권을 행사해 왔는바, 甲이 乙을 채무자로 하는 부동산 점유이전금지가처분 결정을 받아 집행을 위임하자, 집행관이 가처분을 집행하면서 그 집행 취지가 기재된 고시문을 컨테이너에 부착하였고, 이후 乙은 법원으로부터 ‘甲에게 부동산을 인도하라.’는 명령을 받았는데, 피고인은 甲과 부동산 관련 분쟁이 생기자 乙과 공모하여, 乙로부터 부동산에 있던 컨테이너를 매수하여 자신이 직접 컨테이너를 점유함으로써 부동산의 점유 일부를 이전받는 방법으로 부동산 점유이전금지가처분 집행의 효용을 해하였다는 공소사실로 기소된 사안에서, 피고인이 乙로부터 부동산의 점유를 일부 이전받음으로써 공무원이 그 직무에 관하여 실시한 가처분 집행 표시의 효용을 해하였다고 볼 여지가 충분하다는 이유로, 이와 달리 본 원심판단에 공무상표시무효죄의 성립 등에 관한 법리오해의 잘못이 있다고 한 사","url":"https://www.law.go.kr/precInfoP.do?precSeq=613165"},{"id":"P:618249","kind":"P","label":"2025도13016","title":"상관상해(인정된죄명:상관폭행)·상관폭행·폭행","court":"대법원","date":"2025.12.04","caseType":"형사","basis":"참조조문","text":"부사관으로 군인인 피고인이 후배 부사관인 9명의 피해자들을 총 31회에 걸쳐 폭행하였다는 공소사실로 기소된 사안에서, 범행 당시 피고인과 피해자들은 모두 군인이었고, 범행 장소는 중대 생활관, 자동화 사격장, 해상훈련장 등으로서 군사기지 및 군사시설 보호법 제2조에서 규정한 군사기지 또는 군사시설일 가능성이 크므로, 원심으로서는 범행이 ‘군인이 군사기지, 군사시설에서 군인을 폭행한 경우’에 해당하여 군형법 제60조의6에 따라 형법 제260조 제3항의 적용이 배제되는지를 살펴보았어야 한다는 이유로, 이에 관하여 심리하지 않은 채 형법 제260조 제3항을 적용하여 공소를 기각한 원심판단에 반의사불벌죄 등에 관한 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=618249"},{"id":"P:613259","kind":"P","label":"2020도949","title":"특정경제범죄가중처벌등에관한법률위반(사기)·사기·의료법위반·국민건강보험법위반·사기방조·의료법위반방조·국민건강보험법위반방조","court":"대법원","date":"2025.12.04","caseType":"형사","basis":"판례내용","text":"[1] 의료법 제33조 제8항 본문에서 규정한 ‘1인 1기관 개설ㆍ운영 원칙’의 취지 / 1인 1기관 개설ㆍ운영 원칙에 반하는 행위 중 ‘의료기관의 중복 개설’ 및 ‘의료기관의 중복 운영’의 의미 [2] 의료기관을 운영하는 의료인이 의료법인의 이사 등의 지위에서 의료법인 명의로 개설된 다른 의료기관의 경영사항에 관하여 의사 결정 권한을 보유하면서 관련 업무를 처리하거나 처리하도록 한 사정만으로 중복 개설ㆍ운영 금지의 취지를 저해하여 의료법 제33조 제8항 본문을 위반하였다고 볼 수 있는지 여부 / 의료기관을 운영하는 의료인 개인이 의료법인 명의의 의료기관을 포함하여 둘 이상의 의료기관의 운영을 실질적으로 지배ㆍ관리함으로써 의료법 제33조 제8항 본문을 위반하였다고 인정하기 위한 요건 및 이에 해당하는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=613259"},{"id":"P:613245","kind":"P","label":"2024도11353","title":"업무상횡령·업무상배임·사립학교법위반","court":"대법원","date":"2025.12.04","caseType":"형사","basis":"참조조문","text":"[1] 횡령죄 등 재산범죄에서 일정기간 반복하여 행하여진 각 범행이 포괄일죄로 되기 위한 요건 및 각 범행이 포괄일죄가 되는지를 판단할 때 고려하여야 할 사항 / 범의의 단일성과 계속성을 판단하는 기준 [2] 업무상배임죄의 구성요건 중 ‘본인에게 재산상의 손해를 가한다.’는 것의 의미 및 재산상의 손실을 야기한 임무위배행위가 동시에 그 손실을 보상할 만한 재산상의 이익을 준 경우, 재산상 손해의 유무 / 배임행위로 인하여 본인에게 재산상 손해를 가하였으나 행위자 또는 제3자가 재산상 이익을 취득한 사실이 없는 경우, 업무상배임죄의 성립 여부 / 업무상배임죄에서 ‘불법이득의사’의 의미 및 불법이득의사가 있었다는 점에 대한 증명책임 소재와 증명 정도 [3] 구 사립학교법에서 학교법인의 회계를 분리하고 있는 취지 및 특히 ‘교비회계’의 다른 회계로의 전용을 금지하는 취지 / 학교법인의 이사 등이 업무상 임무에 위배하여 동일한 학교법인의 교비회계로 편입하여야 할 수입을 다른 회계로 편입하였다는 사정만으로 업무상배임죄에서 ‘본인’에 해당하는 학교법인이 재산상의 손해를 입었다거나 행위자 또는 제3자가 재산상의 이익을 취득하게 된다고 볼 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=613245"},{"id":"P:622125","kind":"P","label":"2024노5872","title":"가. 산업기술의유출방지및보호에관한법률위반 나. 부정경쟁방지및영업비밀보호에관한법률위반(영업비밀국외누설등) 다. 업무상배임 라. 부정경쟁방지및영업비밀보호에관한법률위반","court":"수원지방법원","date":"2025.11.21","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=622125"},{"id":"P:614395","kind":"P","label":"2025고합241","title":"재물손괴","court":"서울북부지방법원","date":"2025.11.18","caseType":"형사","basis":"참조조문","text":"빌라의 반장인 피고인이 다른 입주민들과의 반상회 결의에 따라 공용부분인 빌라 주차장 중 일부에 빌라 거주자인 甲이 자신의 지정 주차구역이라는 취지로 설치한 甲 소유의 시가 불상의 주차표지판을 떼어내 버리는 방법으로 그 효용을 해하였다는 내용으로 기소된 후 국민참여재판으로 진행된 사안에서, 제반 사정을 종합할 때 피고인의 주차표지판 제거 행위는 형법 제20조에 정한 사회상규에 위배되지 않는 정당행위에 해당하여 위법성이 조각된다는 이유로, 피고인에게 무죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=614395"},{"id":"P:614389","kind":"P","label":"2024고단3486","title":"사기","court":"서울북부지방법원","date":"2025.11.06","caseType":"형사","basis":"참조조문","text":"피고인이 자신이 건물 2층에서 운영하던 고시텔의 각 객실마다 많은 양의 빈대가 발생하고 있다는 위생상태를 숨긴 채 고시텔에 관하여 甲과 ‘고시텔의 시설 및 영업권을 권리금 1억 원으로 하여 양수·양도한다.’는 취지의 권리 양수·양도계약을 체결하고 甲으로 하여금 고시텔의 건물주와 임대차계약을 체결하도록 함으로써 甲을 속여 권리금 1억 원을 편취하였다는 사기의 공소사실로 기소된 사안에서, 양수·양도계약 체결 및 이행 당시 고시텔에 많은 양의 빈대가 발생하여 정상적인 거주가 어려운 상태였고, 피고인은 이를 알고 있었음에도 甲에게 전혀 알리지 않음으로써 甲을 기망하였다는 이유로, 피고인에게 유죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=614389"},{"id":"P:613067","kind":"P","label":"2025도9717","title":"재물손괴·폭행·상해·스토킹범죄의처벌등에관한법률위반·성폭력범죄의처벌등에관한특례법위반(통신매체이용음란)·도로교통법위반(음주운전)","court":"대법원","date":"2025.11.06","caseType":"형사","basis":"판례내용","text":"항소심에서 제1심의 양형이 과중하다고 인정하여 제1심판결을 파기하면서 제1심의 형과 같은 형을 그대로 선고한 경우, 판결의 이유와 주문이 저촉모순되는 위법이 있는지 여부 / 확정판결 전후의 범죄에 대하여 주문 2개를 선고한 제1심판결에 대한 항소심의 심리ㆍ판단 방법 및 이때 제1심의 양형이 과중하다고 인정하여 제1심판결 전부를 파기한 경우, 항소심은 제1심판결의 각 주문보다 개별적으로 가벼운 형을 각 선고하여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=613067"},{"id":"P:613071","kind":"P","label":"2025도12963","title":"존속학대·재물손괴·절도·특정범죄가중처벌등에관한법률위반(운전자폭행등)·주거침입","court":"대법원","date":"2025.11.06","caseType":"형사","basis":"참조조문","text":"부양의무의 대상인 직계존속이 존속학대죄의 객체가 될 수 있는지 여부 / 직계존속에 대한 성년후견이 개시되어 부양의무를 지는 직계비속 외에 별도의 성년후견인이 있는 경우, 그 직계비속이 직계존속을 학대하면 존속학대죄에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=613071"},{"id":"P:618465","kind":"P","label":"2025노137","title":"간음유인·미성년자의제강간·실종아동등의보호및지원에관한법률위반","court":"서울고등법원춘천재판부","date":"2025.11.05","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=618465"},{"id":"P:614589","kind":"P","label":"2025고단1523","title":"상해·특수상해","court":"서울북부지방법원","date":"2025.10.29","caseType":"형사","basis":"참조조문","text":"피고인 甲은 01:40경 주유소 벽에 방뇨하여 주유소 직원인 피고인 乙로부터 ‘노상방뇨를 하지 말아라.’는 말을 듣게 되자 화가 나, 주유소 사무실에 앉아 있던 피고인 乙에게 다가가 왼쪽 손으로 피고인 乙의 목을 붙잡아 누르고, 계속하여 피고인 甲을 뒤쫓아 나온 피고인 乙을 손으로 밀쳐 바닥에 넘어뜨린 다음 주먹으로 피고인 乙의 얼굴을 수회 때리고 발로 몸을 수회 밟아 피고인 乙에게 약 20일간의 치료를 요하는 비골의 폐쇄성 골절의 상해를 가하였다는 내용으로, 피고인 乙은 사무실에서 피고인 甲으로부터 목이 눌리는 등 폭행당하자 책상 위에 놓여있던 위험한 물건인 30cm 길이의 고무망치를 오른쪽 손에 쥐고 피고인 甲의 머리 부분을 향해 강하게 1회 내리쳐 약 2주간의 치료를 요하는 두피의 열린 상처의 상해를 가하였다는 내용으로 기소된 사안에서, 피고인 甲에게 유죄를, 피고인 乙에게는 무죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.
