처벌하는 취지 / 위 규정에서 말하는 ‘그 밖의 탈법행위’의 의미 및 이에 해당하는지 판단하는 기준 [2] 방조범의 성립에 필요한 고의의 내용 / 목적범인 구 금융실명거래 및 비밀보장에 관한 법률 제6조 제1항 위반죄의 방조범 성립에 필요한 고의의 내용","url":"https://www.law.go.kr/precInfoP.do?precSeq=238311"},{"id":"P:237267","kind":"P","label":"2022고단373","title":"폭력행위등처벌에관한법률위반(공동폭행)·정보통신망이용촉진및정보보호등에관한법률위반(명예훼손)·공갈미수","court":"제주지방법원","date":"2022.10.26","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=237267"},{"id":"P:238505","kind":"P","label":"2021노4485","title":"모욕","court":"대구지방법원","date":"2022.10.21","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238505"},{"id":"P:233909","kind":"P","label":"2022노1342","title":"마약류관리에관한법률위반(향정)","court":"서울중앙지방법원","date":"2022.10.20","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233909"},{"id":"P:238213","kind":"P","label":"2020도13344","title":"사서명위조·위조사서명행사·공문서부정행사","court":"대법원","date":"2022.10.14","caseType":"형사","basis":"참조조문","text":"[1] 공문서부정행사죄의 보호법익 및 법적 성격 / 사용권한자와 용도가 특정되어 있는 공문서를 사용권한 없는 자가 사용하였으나 공문서의 본래 용도에 따른 사용이 아닌 경우, 공문서부정행사죄가 성립하는지 여부 [2] 피고인이 조세범 처벌법 위반 사건으로 조사를 받던 중 자신이 甲인 것처럼 행세하기 위하여 甲의 국가유공자증을 조사 담당 공무원에게 제시하여 공문서부정행사로 기소된 사안에서, 국가유공자증의 본래 용도는 제시인이 국가유공자법에 따라 등록된 국가유공자로서 관련 혜택을 받을 수 있는 자격이 있음을 증명하는 것이고 신분의 동일성을 증명하는 것이 아니라고 보아 공소사실을 무죄로 판단한 원심판결을 수긍한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=238213"},{"id":"P:238207","kind":"P","label":"2016도13175","title":"일반교통방해·폭력행위등처벌에관한법률위반(공동주거침입)·집회및시위에관한법률위반","court":"대법원","date":"2022.10.14","caseType":"형사","basis":"판례내용","text":"집회 및 시위에 관한 법률상 관할 경찰관서장이 해산명령을 할 때에는 해산사유가 같은 법 제20조 제1항 각호 중 어느 사유에 해당하는지 구체적으로 고지하여야 하는지 여부 / 해산명령을 하면서 구체적인 해산사유를 고지하지 아니하거나 정당하지 아니한 사유를 고지하면서 해산명령을 한 경우, 이에 따르지 아니한 행위가 같은 법 제20조 제2항 위반죄를 구성하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=238207"},{"id":"P:238215","kind":"P","label":"2022도1229","title":"약사법위반·사기방조·국민건강보험법위반방조","court":"대법원","date":"2022.10.14","caseType":"형사","basis":"판례내용","text":"[1] 검사가 제1심 무죄판결에 대한 항소장의 ‘항소의 이유’란에 ‘사실오인 및 법리오해’ 등으로만 기재하고 항소이유서 제출기간 내에 항소이유서를 제출하지 않은 경우 또는 항소이유서에 단지 항소심에서 공소장변경을 한다는 취지와 변경된 공소사실에 대하여 유죄의 증명이 충분하다는 취지의 주장만 한 경우, 적법한 항소이유의 기재가 있는 것인지 여부 [2] 검사가 일부 유죄, 일부 무죄가 선고된 제1심판결에 대하여 항소하면서 항소장의 ‘항소의 범위’란에 ‘전부’라고 기재하였으나 적법한 기간 내에 제출된 항소이유서에는 제1심판결 중 무죄 부분에 대한 항소이유만 기재한 경우, 유죄 부분에 대하여는 법정기간 내에 항소이유서를 제출하지 아니한 경우에 해당하는지 여부 [3] 실체적 경합범으로 기소되어 전부 무죄가 선고된 제1심판결에 대하여 검사가 전부 항소한 경우, 적법한 항소이유의 주장이 있었는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=238215"},{"id":"P:234017","kind":"P","label":"2022노190","title":"명예훼손","court":"서울중앙지방법원","date":"2022.10.06","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=234017"},{"id":"P:231737","kind":"P","label":"2021도14514","title":"공문서부정행사","court":"대법원","date":"2022.09.29","caseType":"형사","basis":"참조조문","text":"[1] 형법 제230조 공문서부정행사죄를 적용함에 있어 범행의 주체, 객체 및 태양을 되도록 엄격하게 해석하여 처벌범위를 합리적인 범위 내로 제한하여야 하는지 여부 / 사용권한자와 용도가 특정되어 있는 공문서를 사용권한 없는 자가 사용한 경우에도 그 공문서 본래의 용도에 따른 사용이 아닌 경우, 공문서부정행사죄가 성립하는지 여부 [2] 장애인사용자동차표지를 사용할 권한이 없는 사람이 장애인전용주차구역에 주차하는 등 장애인사용자동차에 대한 지원을 받을 것으로 합리적으로 기대되는 상황이 아닌 경우, 단순히 이를 자동차에 비치하였더라도 공문서부정행사죄가 성립하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=231737"},{"id":"P:236905","kind":"P","label":"2022노189","title":"특정범죄가중처벌등에관한법률위반(위험운전치상)·도로교통법위반(음주운전)","court":"서울동부지방법원","date":"2022.09.29","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=236905"},{"id":"P:234865","kind":"P","label":"2022고단227","title":"마약류관리에관한법률위반(향정)","court":"대구지방법원","date":"2022.09.27","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=234865"},{"id":"P:233525","kind":"P","label":"2022노1176","title":"절도(인정된죄명사기)","court":"서울중앙지방법원","date":"2022.09.26","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233525"},{"id":"P:232083","kind":"P","label":"2019도19067","title":"독점규제및공정거래에관한법률위반·특정경제범죄가중처벌등에관한법률위반(횡령)[피고인1에대하여일부인정된죄명:특정경제범죄가중처벌등에관한법률위반(배임)·업무상횡령·일부예비적죄명:특정경제범죄가중처벌등에관한법률위반(배임)·피고인2에대하여인정된죄명:특정경제범죄가중처벌등에관한법률위반(배임)]·특정경제범죄가중처벌등에관한법률위반(배임)(일부인정된죄명:업무상배임)·업무방해","court":"대법원","date":"2022.09.16","caseType":"형사","basis":"참조조문","text":"[1] 2013. 8. 13. 개정 전의 독점규제 및 공정거래에 관한 법률상 부당한 자산·상품 등 지원행위에서 ‘현저히 낮거나 높은 대가로 제공 또는 거래하거나 현저한 규모로 제공 또는 거래하여 과다한 경제상 이익을 제공’한 것인지, 2013. 8. 13. 개정된 독점규제 및 공정거래에 관한 법률상 부당한 자산·상품 등 지원행위에서 ‘상당히 낮거나 높은 대가로 제공 또는 거래하거나 상당한 규모로 제공 또는 거래하여 과다한 경제상 이익을 제공’한 것인지, 부당한 거래단계 추가 등 행위에서 ‘다른 사업자와 직접 상품·용역을 거래하면 상당히 유리함에도 특수관계인이나 다른 회사를 거래단계에 추가하거나 거쳐서 거래하여 과다한 경제상 이익을 제공’한 것인지를 판단하는 방법 / 여기서 급부와 반대급부가 현저히 또는 상당히 유리한지를 판단하는 기준이 되는 ‘정상가격’의 의미 [2] 법 개정 전후에 걸친 포괄일죄에 대한 법령 적용 [3] 2013. 8. 13. 개정된 독점규제 및 공정거래에 관한 법률 제23조 제1항 제5호, 2014. 2. 11. 개정된 독점규제 및 공정거래에 관한 시행령 제36조 제1항 [별표 1의2] 제8호 목이 정한 ‘기타의 사업활동방해’에 해당하기 위한 요건 및 이때 ‘부당성’의 유무를 판단하는 방법","url":"https://www.law.go.kr/precInfoP.do?precSeq=232083"},{"id":"P:232783","kind":"P","label":"2022도5827","title":"권리행사방해교사","court":"대법원","date":"2022.09.15","caseType":"형사","basis":"참조조문","text":"[1] 교사범이 성립하려면 정범의 범죄행위가 인정되어야 하는지 여부 [2] 자기의 소유가 아닌 물건이 권리행사방해죄의 객체가 될 수 있는지 여부 / 물건의 소유자가 아닌 사람이 소유자의 권리행사방해 범행의 공범이 될 수 있는 경우","url":"https://www.law.go.kr/precInfoP.do?precSeq=232783"},{"id":"P:618241","kind":"P","label":"2018나24881","title":"손해배상(기)·손해배상(기)","court":"광주고등법원","date":"2022.09.14","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=618241"},{"id":"P:619271","kind":"P","label":"2021고합318","title":"건축물관리법위반·업무상과실치사·업무상과실치상·산업안전보건법위반","court":"광주지방법원","date":"2022.09.07","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619271"},{"id":"P:233819","kind":"P","label":"2021노2436","title":"아동복지법위반(아동유기·방임)","court":"서울고등법원","date":"2022.09.01","caseType":"형사","basis":"판례내용","text":"피해아동의 친모이자 보호자인 甲이 30일간 아동을 초등학교에 등교시키지 아니하여 그의 교육을 소홀히 하는 방임행위를 하였다는 이유로 아동복지법 위반으로 기소된 사안에서, 검사가 제출한 증거만으로는 甲이 아동복지법상 방임행위를 하였다는 점이 합리적 의심의 여지 없이 증명되었다고 할 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=233819"},{"id":"P:230877","kind":"P","label":"2019도7370","title":"모욕","court":"대법원","date":"2022.08.31","caseType":"형사","basis":"참조조문","text":"[1] 모욕죄의 보호법익 및 ‘모욕’의 의미 / 어떠한 표현이 모욕죄의 모욕에 해당하는지 판단하는 기준 / 상대방을 불쾌하게 할 수 있는 무례하고 예의에 벗어난 정도의 표현이거나 상대방에 대한 부정적·비판적 의견이나 감정을 나타내면서 경미한 수준의 추상적 표현이나 욕설이 사용된 경우, 모욕죄의 구성요건에 해당하는지 여부 / 모욕죄의 구성요건을 해석·적용할 때 고려하여야 할 사항 [2] 사업소 소장인 피고인이 직원들에게 甲이 관리하는 다른 사업소의 문제를 지적하는 내용의 카카오톡 문자메시지를 발송하면서 \"甲은 정말 야비한 사람인 것 같습니다.\"라고 표현하여 甲을 모욕하였다는 내용으로 기소된 사안에서, 제반 사정에 비추어 볼 때 위 표현은 피고인의 甲에 대한 부정적·비판적 의견이나 감정이 담긴 경미한 수준의 추상적 표현에 불과할 뿐 甲의 외부적 명예를 침해할 만한 표현이라고 단정하기 어렵다는 이유로, 이와 달리 본 원심판결에 형법상 모욕의 의미에 관한 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=230877"},{"id":"P:232789","kind":"P","label":"2022모1466","title":"집행유예취소인용결정에대한재항고","court":"대법원","date":"2022.08.31","caseType":"형사","basis":"참조조문","text":"형의 선고가 효력을 잃은 다음에는 형법 제64조 제2항에서 정한 사유로 집행유예의 선고를 취소할 수 있는지 여부 및 이러한 법리는 원결정에 대한 집행정지 효력이 있는 즉시항고 또는 재항고로 말미암아 아직 집행유예의 선고 취소 결정의 효력이 발생하기 전의 상태에서 상소심 절차가 진행되는 중에 유예기간이 지난 경우에도 마찬가지인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=232789"},{"id":"P:230871","kind":"P","label":"2020도1007","title":"통신비밀보호법위반","court":"대법원","date":"2022.08.31","caseType":"형사","basis":"판례내용","text":"통신비밀보호법 제14조 제1항의 금지를 위반하는 행위는 같은 법 제3조 제1항 위반행위에 해당하여 같은 법 제16조 제1항 제1호의 처벌대상이 되는지 여부 / 통신비밀보호법 제3조 제1항이 공개되지 않은 타인 간의 대화를 녹음 또는 청취하지 못하도록 한 취지 / 대화에 원래부터 참여하지 않는 제3자가 일반 공중이 알 수 있도록 공개되지 않은 타인 간의 발언을 녹음하거나 전자장치 또는 기계적 수단을 이용하여 청취하는 것이 통신비밀보호법 제3조 제1항에 위반되는지 여부 / 통신비밀보호법상 ‘공개되지 않았다.’는 것을 판단하는 방법","url":"https://www.law.go.kr/precInfoP.do?precSeq=230871"},{"id":"P:231757","kind":"P","label":"2018다212610","title":"손해배상(기)","court":"대법원","date":"2022.08.30","caseType":"민사","basis":"판례내용","text":"구 국가안전과 공공질서의 수호를 위한 대통령긴급조치의 발령·적용·집행으로 강제수사를 받거나 유죄판결을 선고받고 복역함으로써 개별 국민이 입은 손해에 대하여 국가배상책임이 인정되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=231757"},{"id":"P:232793","kind":"P","label":"2022도3717","title":"업무상배임","court":"대법원","date":"2022.08.25","caseType":"형사","basis":"참조조문","text":"업무상배임죄의 성립요건 중 ‘재산상 이익 취득’과 ‘재산상 손해 발생’의 관계 / 업무상배임죄가 성립하려면 재산상 이익과 손해 사이에 서로 대응하는 관계에 있는 등 일정한 관련성이 인정되어야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=232793"},{"id":"P:237129","kind":"P","label":"2022노1504","title":"스토킹범죄의처벌등에관한법률위반·정보통신망이용촉진및정보보호등에관한법률위반","court":"부산지방법원","date":"2022.08.25","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=237129"},{"id":"P:230899","kind":"P","label":"2020도16897","title":"모욕","court":"대법원","date":"2022.08.25","caseType":"형사","basis":"참조조문","text":"[1] 어떤 글이 모욕적 표현을 담고 있는 경우에도 사회상규에 위배되지 않는 행위로서 위법성이 조각될 수 있는 경우 / 인터넷 등 공간에서 작성된 단문의 글이라도 마찬가지로 위법성이 조각될 수 있는 경우 / 이때 사회상규에 위배되는지 판단하는 기준 [2] 피고인이 자신의 페이스북에 甲에 대한 비판적인 글을 게시하면서 \"철면피, 파렴치, 양두구육, 극우부패세력\"이라는 표현을 사용하여 甲을 모욕하였다는 내용으로 기소된 사안에서, 피고인이 사용한 위 표현이 모욕적 표현으로서 모욕죄의 구성요건에는 해당하나, 제반 사정을 종합할 때 피고인이 甲의 공적 활동과 관련한 자신의 의견을 담은 게시글을 작성하면서 위 표현을 한 것은 사회상규에 위배되지 않는 행위로서 위법성이 조각된다고 볼 여지가 크다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=230899"},{"id":"P:230897","kind":"P","label":"2020도12944","title":"개발제한구역의지정및관리에관한특별조치법위반·식품위생법위반·수도법위반·하천법위반[피고인이 2016년 음식점 영업장 면적을 변경하고도 변경신고를 하지 않은 채 영업을 계속한 행위가 식품위생법 제37조 제4항 위반죄에 해당하는지가 문제된 사안]","court":"대법원","date":"2022.08.25","caseType":"형사","basis":"판례내용","text":"식품위생법 제37조 제4항, 제97조 제1호, 식품위생법 시행령 제25조 제1항 제8호, 제26조 제4호의 취지 / 영업장의 면적을 변경하는 행위를 하였음에도 당시 법령인 식품위생법 제37조 제4항, 식품위생법 시행령 제26조 제4호에 따라 영업장 면적 변경신고를 하지 않은 채 영업을 계속하는 경우, 식품위생법 제97조 제1호의 처벌대상이 되는지 여부 및 이는 영업장 면적을 변경신고 사항으로 명시한 구 식품위생법 시행령이 시행되기 이전에 일반음식점 영업신고가 된 경우에도 마찬가지인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=230897"},{"id":"P:230889","kind":"P","label":"2022도3801","title":"성폭력범죄의처벌등에관한특례법위반(주거침입강제추행)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영물소지등)·공연음란","court":"대법원","date":"2022.08.25","caseType":"형사","basis":"참조조문","text":"[1] 결합범인 성폭력범죄의 처벌 등에 관한 특례법 위반죄가 성립하려면 주거침입죄 내지 건조물침입죄에 해당하여야 하는지 여부 / 주거침입죄의 보호법익 / 주거침입죄의 구성요건적 행위인 ‘침입’의 의미 및 침입행위에 해당하는지 판단하는 기준 [2] 아파트와 같은 공동주택 내부의 엘리베이터, 공용 계단, 복도 등 공용 부분이 주거침입죄의 객체인 ‘사람의 주거’에 해당하는지 여부 / 거주자가 아닌 외부인이 공동주택의 공용 부분에 출입한 것이 공동주택 거주자들에 대한 주거침입에 해당하는지 판단하는 기준 / 아파트 등 공동주택의 공동현관에 공동주택 거주자의 사실상 주거의 평온상태를 해치는 행위태양으로 출입한 것이 공동주택 거주자들에 대한 주거침입에 해당하는지 여부 [3] 일반인의 출입이 허용된 상가 등 영업장소에 영업주의 승낙을 받아 통상적인 출입방법으로 들어간 것이 건조물침입죄에서 규정하는 침입행위에 해당하는지 여부 / 이때 행위자가 범죄 등을 목적으로 영업장소에 출입하였거나 영업주가 행위자의 실제 출입 목적을 알았더라면 출입을 승낙하지 않았을 것이라는 사정이 있더라도 마찬가지인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=230889"},{"id":"P:238745","kind":"P","label":"2021가합583102","title":"손해배상(기)","court":"서울중앙지방법원","date":"2022.08.24","caseType":"민사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238745"},{"id":"P:233295","kind":"P","label":"2022노540","title":"성폭력범죄의처벌등에관한특례법위반(촬영물등이용협박)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등)·성폭력범죄의처벌등에관한특례법위반(촬영물등이용강요)·공갈미수","court":"서울고등법원","date":"2022.08.17","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233295"},{"id":"P:235035","kind":"P","label":"2022노207","title":"농수산물의원산지표시등에관한법률위반","court":"부산고등법원","date":"2022.08.17","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=235035"},{"id":"P:233331","kind":"P","label":"2022노842","title":"사기·여신전문금융업법위반","court":"서울중앙지방법원","date":"2022.08.17","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233331"},{"id":"P:233913","kind":"P","label":"2022노31","title":"살인·협박·부착명령·보호관찰명령","court":"광주고등법원제주재판부","date":"2022.08.17","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233913"},{"id":"P:599845","kind":"P","label":"2021노1851","title":"성폭력범죄의처벌등에관한특례법위반(통신매체이용음란)","court":"서울동부지방법원","date":"2022.08.12","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=599845"},{"id":"P:232801","kind":"P","label":"2022도2076","title":"공무집행방해·공용물건손상","court":"대법원","date":"2022.08.11","caseType":"형사","basis":"참조조문","text":"구 가정폭력범죄의 처벌 등에 관한 특례법 제5조 제1호에 규정된 응급조치인 ‘가정폭력행위자와 피해자의 분리조치’에 피해자의 동의를 필요로 하는지 여부 및 피해자가 분리조치를 희망하지 않거나 동의하지 않는다는 의사를 표명한 경우, 경찰관이 현장 상황에 따라 분리조치를 할 때 장애가 되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=232801"},{"id":"P:612023","kind":"P","label":"2021노4092","title":"업무방해·주택법위반·주민등록법위반·사기·공인중개사법위반","court":"부산지방법원","date":"2022.08.08","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=612023"},{"id":"P:227727","kind":"P","label":"2020도13705","title":"특정범죄가중처벌등에관한법률위반(절도)","court":"대법원","date":"2022.07.28","caseType":"형사","basis":"참조조문","text":"징역형의 집행유예를 선고한 판결이 확정된 후 선고의 실효 또는 취소 없이 유예기간을 경과함에 따라 형 선고의 효력이 소멸되어 그 확정판결이 특정범죄 가중처벌 등에 관한 법률 제5조의4 제5항에서 정한 ‘징역형’에 해당하지 않음에도, 위 확정판결에 적용된 형벌 규정에 대한 위헌결정 취지에 따른 재심판결에서 다시 징역형의 집행유예가 선고·확정된 후 유예기간이 경과되지 않은 경우, 위 재심판결이 위 조항에서 정한 ‘징역형’에 포함되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=227727"},{"id":"P:232911","kind":"P","label":"2020도8421","title":"명예훼손","court":"대법원","date":"2022.07.28","caseType":"형사","basis":"참조조문","text":"형법 제310조에서 정한 위법성 조각사유의 요건 중 ‘진실한 사실’ 및 ‘오로지 공공의 이익에 관한 때’의 의미 / 적시된 사실이 ‘공공의 이익’에 관한 것인지 판단하는 기준 / 사실적시의 내용이 사회 일반의 일부 이익에만 관련된 사항이거나 개인에 관한 사항이라도 공익성이 인정되는 경우 및 사인의 경우 공공의 이익에 관련되는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=232911"},{"id":"P:232909","kind":"P","label":"2022도5659","title":"성폭력범죄의처벌등에관한특례법위반(통신매체이용음란)·야간건조물침입절도","court":"대법원","date":"2022.07.28","caseType":"형사","basis":"참조조문","text":"[1] 원심판결에 법리오해 등의 위법이 있다는 주장이 적법한 상고이유가 아닌 경우, 이를 주장하는 상고이유에 직권발동을 촉구하는 의미는 있는지 여부 [2] 일반인의 출입이 허용된 영업점에 영업주의 승낙을 받아 통상적인 출입방법으로 들어간 것이 주거침입죄에서 정하는 침입행위에 해당하는지 여부 및 이때 행위자가 범죄 등을 목적으로 영업점에 출입하였거나 영업주가 행위자의 실제 출입 목적을 알았더라면 출입을 승낙하지 않았을 것이라는 사정이 있더라도 마찬가지인지 여부 / 건조물침입을 구성요건으로 하는 야간건조물침입절도죄에서 건조물침입에 해당하는지를 판단할 때에도 같은 법리가 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=232909"},{"id":"P:600063","kind":"P","label":"2022노75","title":"폭력행위등처벌에관한법률위반(단체등의구성·활동)·폭력행위등처벌에관한법률위반(공동상해)·특수협박·특수상해·폭력행위등처벌에관한법률위반(공동폭행)·폭력행위등처벌에관한법률위반(공동협박)·도로교통법위반(무면허운전)·사기·폭력행위등처벌에관한법률위반(공동상해)교사·특수폭행·상해·범인도피·사문서위조·도로교통법위반(음주운전)","court":"광주고등법원","date":"2022.07.28","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=600063"},{"id":"P:232903","kind":"P","label":"2022도419","title":"재물손괴·건조물침입","court":"대법원","date":"2022.07.28","caseType":"형사","basis":"참조조문","text":"행위자가 거주자의 승낙을 받아 주거에 들어갔으나 범죄 등을 목적으로 한 출입이거나 거주자가 행위자의 실제 출입 목적을 알았더라면 출입을 승낙하지 않았을 것이라는 사정이 인정되는 경우, 행위자의 출입행위가 주거침입죄에서 규정하는 침입행위에 해당하기 위한 요건","url":"https://www.law.go.kr/precInfoP.do?precSeq=232903"},{"id":"P:232031","kind":"P","label":"2021노2521","title":"공직선거법위반","court":"서울고등법원","date":"2022.07.22","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=232031"},{"id":"P:232033","kind":"P","label":"2022노288","title":"특정범죄가중처벌등에관한법률위반(보복협박등)(일부인정된죄명협박)·정보통신망이용촉진및정보보호등에관한법률위반(명예훼손)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영물소지등)","court":"서울고등법원","date":"2022.07.22","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=232033"},{"id":"P:605555","kind":"P","label":"2022노824","title":"마약류관리에관한법률위반(향정)","court":"창원지방법원","date":"2022.07.21","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=605555"},{"id":"P:607171","kind":"P","label":"2021노1758","title":"강제추행","court":"서울동부지방법원","date":"2022.07.15","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=607171"},{"id":"P:232635","kind":"P","label":"2022노33","title":"마약류관리에관한법률위반(대마)·마약류관리에관한법률위반(향정)","court":"수원고등법원","date":"2022.07.15","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=232635"},{"id":"P:232935","kind":"P","label":"2022도5129","title":"주택법위반·공인중개사법위반","court":"대법원","date":"2022.07.14","caseType":"형사","basis":"참조조문","text":"[1] 법관의 서명날인이 없는 재판서에 의한 판결은 형사소송법 제383조 제1호가 정한 ‘판결에 영향을 미친 법률의 위반이 있는 때’에 해당하여 파기되어야 하는지 여부 [2] 공인중개사법 제10조의2의 취지 및 공인중개사법 위반죄와 상상적 경합관계에 있는 다른 범죄에 대하여 처벌받는 가장 무거운 죄가 공인중개사법 위반죄인지를 묻지 않고 공인중개사법 위반죄와 상상적 경합관계에 있는 모든 죄를 통틀어 공인중개사법 위반죄로 취급하여 하나의 형을 선고하여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=232935"},{"id":"P:223835","kind":"P","label":"2021도16578","title":"자동차관리법위반","court":"대법원","date":"2022.07.14","caseType":"형사","basis":"참조조문","text":"자동차관리법 제71조 제1항에 따라 부정사용이 금지되는 ‘폐차사실 증명서류’에 자동차해체재활용업자가 자동차 소유자로부터 폐차 요청을 받은 경우에 자동차를 인수하고 발급하는 폐차인수증명서가 포함되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=223835"},{"id":"P:223823","kind":"P","label":"2021두62287","title":"체육지도자자격취소처분취소의소","court":"대법원","date":"2022.07.14","caseType":"일반행정","basis":"판례내용","text":"체육지도자의 자격취소에 관한 구 국민체육진흥법 제12조 제1항 제4호에서 정한 ‘제11조의5 각호의 어느 하나에 해당하는 경우’의 의미 및 체육지도자가 금고 이상의 형의 집행유예를 선고받은 후 집행유예기간이 경과하는 등의 사유로 자격취소처분 이전에 결격사유가 해소된 경우에도 행정청은 체육지도자의 자격을 취소해야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=223823"},{"id":"P:232939","kind":"P","label":"2017도20911","title":"사기·입찰방해·국가기술자격법위반","court":"대법원","date":"2022.07.14","caseType":"형사","basis":"참조조문","text":"[1] 사기죄의 성립요건 / 사기죄의 주관적 구성요건인 불법영득의 의사 내지 편취의 범의 유무를 판단하는 기준 / 도급계약에서 편취의 범의가 있었는지 판단하는 기준 시점 및 판단 방법 [2] 사기죄의 보호법익 / 기망행위에 의하여 국가적 또는 공공적 법익이 침해되었다는 사정만으로 사기죄가 성립하는지 여부 / 도급계약 당시 관련 영업 또는 업무를 규제하는 행정법규나 입찰 참가자격, 계약절차 등에 관한 규정을 위반한 사정만으로 도급계약 체결행위가 기망행위에 해당한다고 단정할 수 있는지 여부 및 이때 심리·판단하여야 할 사항","url":"https://www.law.go.kr/precInfoP.do?precSeq=232939"},{"id":"P:231749","kind":"P","label":"2021노414","title":"업무상배임[변경된죄명:특정경제범죄가중처벌등에관한법률위반(배임)]·횡령","court":"대구고등법원","date":"2022.07.07","caseType":"형사","basis":"참조조문","text":"공동주택사업을 시행하는 甲 주식회사의 이사 및 직원으로 재직 중 乙 지구 사업 관련 자료들을 작성하였던 피고인들이, 甲 회사와 동종영업을 목적으로 하는 丙 주식회사의 임원으로 취임한 후 위 자료들을 이용하여 丁 지구 사업을 추진함으로써 丙 회사로 하여금 재산상 이익을 취득하게 하고 甲 회사에 丁 지구 사업에 관한 사업기회를 상실하는 손해를 가하였다고 하여 특정경제범죄 가중처벌 등에 관한 법률 위반으로 기소된 사안에서, 검사가 제출한 증거만으로는 피고인들이 업무상배임죄에서 말하는 업무상 임무를 위배하였다거나 그로 인하여 甲 회사에 손해가 발생하였다는 점이 증명되었다고 보기 어렵다는 이유로 공소사실을 무죄로 판단한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=231749"},{"id":"P:233339","kind":"P","label":"2020노3067","title":"협박","court":"서울중앙지방법원","date":"2022.07.07","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233339"},{"id":"P:237271","kind":"P","label":"2022고단906","title":"특정범죄가중처벌등에관한법률위반(도주치상)·마약류관리에관한법률위반(향정)·도로교통법위반(사고후미조치)·도로교통법위반(무면허운전)","court":"서울북부지방법원","date":"2022.07.06","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=237271"},{"id":"P:234463","kind":"P","label":"2022도3044","title":"사기·주택법위반·전자서명법위반·사문서위조·위조사문서행사·교통사고처리특례법위반(치상)·도로교통법위반(음주운전)","court":"대법원","date":"2022.06.30","caseType":"형사","basis":"판례내용","text":"[1] 주택법 제65조 제1항 제2호에서 주택공급질서의 교란행위로서 금지하고 있는 ‘입주자저축 증서 등의 양도행위’의 의미 [2] 주택법 제65조 제1항 제2호의 ‘입주자저축 증서’ 양도·양수 행위에 주택청약종합저축 계좌가 개설된 은행에 연계된 ‘공인인증서’를 양도·양수한 행위도 포함되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=234463"},{"id":"P:232803","kind":"P","label":"2022도4108","title":"특정경제범죄가중처벌등에관한법률위반(사기)·약사법위반","court":"대법원","date":"2022.06.30","caseType":"형사","basis":"참조조문","text":"[1] 약사법 제20조 제1항 규정의 입법 취지 및 위 조항에 따라 금지되는 약국 개설행위의 의미 / 약사의 자격이 없는 일반인이 필요한 자금을 투자하여 시설을 갖추고 유자격 약사를 고용하여 그 명의로 약국 개설신고를 한 행위가 약사 아닌 자가 약국을 개설한 경우에 해당하는지 여부 및 개설신고가 약사 명의로 되었다거나 개설신고 명의인인 약사가 직접 의약품 제조·판매 등의 행위를 한 경우, 달리 보아야 하는지 여부 [2] 약사법 제20조 제1항을 위반하여 적법하게 개설되지 않은 약국에서 의약품을 조제하는 등의 요양급여를 실시한 경우, 국민건강보험법상 요양급여비용을 적법하게 지급받을 자격이 있는지 여부 / 약사가 아닌 자가 개설한 약국이 마치 약사법에 의하여 적법하게 개설된 요양기관인 것처럼 국민건강보험공단에 요양급여비용의 지급을 청구하여 이를 지급받을 경우, 사기죄가 성립하는지 여부 및 약국의 개설 명의인인 약사가 직접 의약품을 조제·판매하고 환자들을 상대로 복약지도를 한 경우, 달리 보아야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=232803"},{"id":"P:223363","kind":"P","label":"2020도7866","title":"마약류불법거래방지에관한특례법위반방조","court":"대법원","date":"2022.06.30","caseType":"형사","basis":"참조조문","text":"[1] 대향범에 대하여 공범에 관한 형법 총칙 규정이 적용되는지 여부 및 이러한 법리는 처벌규정의 구성요건 자체에서 2인 이상의 서로 대향된 행위의 존재를 전제로 하는지 여부 / 구성요건상으로는 단독으로 실행할 수 있는 형식으로 되어 있는데 단지 구성요건이 대향범의 형태로 실행되는 경우, 대향범에 관한 법리가 적용되는지 여부 [2] 마약류 불법거래 방지에 관한 특례법 제7조 제1항에서 정한 ‘불법수익 등의 출처 또는 귀속관계를 숨기거나 가장’하는 행위의 의미 / 정범의 이러한 행위에 가담하는 행위에 형법 총칙의 공범 규정이 적용되는지 여부 [3] 방조범에서 말하는 ‘방조’의 의미 및 방조범 성립에 필요한 고의의 내용 / 정범의 마약류 불법거래 방지에 관한 특례법상 ‘불법수익 등의 은닉 및 가장’ 범행의 방조범 성립에 요구되는 고의의 내용","url":"https://www.law.go.kr/precInfoP.do?precSeq=223363"},{"id":"P:223369","kind":"P","label":"2017도21286","title":"횡령","court":"대법원","date":"2022.06.30","caseType":"형사","basis":"참조조문","text":"횡령죄에서 말하는 ‘보관’의 의미 / 횡령죄의 성립에 필요한 위탁관계는 횡령죄로 보호할 만한 가치 있는 신임에 의한 것으로 한정되는지 여부 및 위탁관계가 있는지 판단하는 기준 / 재물의 위탁행위가 범죄의 실행행위나 준비행위 등과 같이 범죄 실현의 수단으로서 이루어진 경우, 그러한 행위를 통해 형성된 위탁관계가 횡령죄로 보호할 만한 가치 있는 신임에 의한 것인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=223369"},{"id":"P:223347","kind":"P","label":"2022도32","title":"도로교통법위반(음주운전)·범인도피교사·보험사기방지특별법위반·범인도피","court":"대법원","date":"2022.06.30","caseType":"형사","basis":"판례내용","text":"도로교통법 위반죄로 형사처벌을 받은 전력이 있는 피고인이 술에 취한 상태에서 자동차를 운전하였다는 공소사실에 대하여, 원심이 도로교통법 제148조의2 제1항, 제44조 제1항을 적용하여 유죄를 선고한 제1심판결을 유지하였는데, 원심판결 선고 후 헌법재판소가 도로교통법 제148조의2 제1항 중 ‘제44조 제1항 또는 제2항을 1회 이상 위반한 사람으로서 다시 같은 조 제1항을 위반한 사람’에 관한 부분에 대하여 위헌결정을 선고한 사안에서, 공소사실은 구 도로교통법 제148조의2 제1항 중 ‘제44조 제2항을 위반한 사람으로서 다시 같은 조 제1항을 위반한 사람’에 관한 부분이 적용되는 경우로서, 원심으로서는 공소사실에 적용되어야 하는 법률조항을 명확히 하고, 그 위헌 여부, 공소장 변경절차의 필요 유무 등에 관하여 심리·판단하였어야 한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=223347"},{"id":"P:232817","kind":"P","label":"2022도3771","title":"농수산물의원산지표시에관한법률위반·특정경제범죄가중처벌등에관한법률위반(사기)(피고인1에대한예비적죄명:사기)·사기","court":"대법원","date":"2022.06.30","caseType":"형사","basis":"참조조문","text":"[1] 사기로 인한 특정경제범죄 가중처벌 등에 관한 법률 위반죄를 적용함에 있어 유의하여야 할 사항 / 사기로 편취한 재물 또는 재산상의 이익의 가액을 구체적으로 산정할 수 없는 경우, 특정경제범죄 가중처벌 등에 관한 법률 위반죄로 처벌할 수 있는지 여부 [2] 대규모유통업체가 기망행위의 상대방 겸 그로 인한 착오 및 처분행위의 주체로서 사기 범행의 피해자임이 인정되기 위한 요건 / 특약매입거래의 성격과 형사처벌의 전제가 되는 재산범죄의 특성 등에 비추어 매입·판매된 상품의 하자에 따르는 기망 및 착오와 그로 인한 금원 편취를 구성요건요소로 하는 사기죄 성립에 있어 고려하여야 할 사항","url":"https://www.law.go.kr/precInfoP.do?precSeq=232817"},{"id":"P:223351","kind":"P","label":"2021도244","title":"특정경제범죄가중처벌등에관한법률위반(사기)·자본시장과금융투자업에관한법률위반·근로기준법위반·근로자퇴직급여보장법위반·위계공무집행방해","court":"대법원","date":"2022.06.30","caseType":"형사","basis":"참조조문","text":"변호인 또는 변호인이 되려는 자의 접견교통권 행사의 한계 및 접견교통권이 한계를 일탈한 것이어서 허용될 수 없다고 판단할 때 고려할 사항 / 피고인의 변호인 접견교통권 행사가 한계를 일탈한 규율위반행위에 해당하는 것을 넘어 위계공무집행방해죄의 ‘위계’에 해당하기 위한 요건","url":"https://www.law.go.kr/precInfoP.do?precSeq=223351"},{"id":"P:232819","kind":"P","label":"2022도1452","title":"사기·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등)","court":"대법원","date":"2022.06.30","caseType":"형사","basis":"판례내용","text":"법관이 압수·수색영장을 발부하면서 ‘압수할 물건’을 특정하기 위하여 기재한 문언은 엄격하게 해석하여야 하는지 여부 / 수사기관이 압수·수색영장에 적힌 ‘수색할 장소’에 있는 컴퓨터 등 정보처리장치에 저장된 전자정보 외에 원격지 서버에 저장된 전자정보를 압수·수색하기 위해서는 압수·수색영장에 적힌 ‘압수할 물건’에 별도로 원격지 서버 저장 전자정보가 특정되어 있어야 하는지 여부 / 압수·수색영장에 적힌 ‘압수할 물건’에 컴퓨터 등 정보처리장치 저장 전자정보만 기재되어 있는 경우, 컴퓨터 등 정보처리장치를 이용하여 원격지 서버 저장 전자정보를 압수할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=232819"},{"id":"P:223355","kind":"P","label":"2021도8361","title":"직무유기","court":"대법원","date":"2022.06.30","caseType":"형사","basis":"참조조문","text":"공무원이 태만이나 착각 등으로 직무를 성실히 수행하지 않은 경우 또는 직무를 소홀하게 수행하였기 때문에 성실한 직무수행을 못한 데 지나지 않는 경우, 직무유기죄가 성립하는지 여부 및 근무기간을 정하여 임용된 공무원의 무단이탈로 인한 직무유기죄 성립 여부를 판단할 때 고려할 사항","url":"https://www.law.go.kr/precInfoP.do?precSeq=223355"},{"id":"P:232815","kind":"P","label":"2022도3784","title":"자본시장과금융투자업에관한법률위반·특정경제범죄가중처벌등에관한법률위반(배임)·업무상배임·업무상배임미수","court":"대법원","date":"2022.06.30","caseType":"형사","basis":"참조조문","text":"[1] 신주인수권부사채 발행업무를 담당하는 사람과 신주인수권부사채 인수인이 사전에 공모하여 제3자로부터 차용한 돈으로 인수대금을 납입하고 신주인수권부사채 발행절차를 마친 직후 곧바로 이를 인출하여 직간접적으로 위 차용금 채무의 변제에 사용하는 등 실질적으로 신주인수권부사채 인수대금이 납입되지 않았음에도 신주인수권부사채를 발행한 경우, 신주인수권부사채의 발행업무를 담당하는 사람과 신주인수권부사채 인수인이 업무상배임죄의 죄책을 지는지 여부 및 이때 그 손해액 [2] 검사가 재판의 이유만을 다투기 위하여 상소할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=232815"},{"id":"P:232811","kind":"P","label":"2021도17712","title":"사기·자격모용사문서작성·자격모용작성사문서행사","court":"대법원","date":"2022.06.30","caseType":"형사","basis":"참조조문","text":"[1] 자격모용사문서작성죄의 보호법익과 성립요건 / 주식회사의 대표 자격으로 계약을 하는 경우, 위 죄의 성립에 필요한 대표관계의 표시 정도 [2] 자격모용사문서작성죄에서 ‘행사할 목적’의 의미 / 사문서를 작성하는 자가 주식회사의 대표로서의 자격을 모용하여 문서를 작성한다는 것을 인식·용인하면서 그 문서를 진정한 문서로서 어떤 효용에 쓸 목적으로 사문서를 작성한 경우, 자격모용사문서작성죄의 행사의 목적과 고의를 인정할 수 있는지 여부 및 이때 문서행사의 상대방이 자격모용 사실을 알았거나, 작성자가 그 문서에 모용한 자격과 무관한 직인을 날인하였다는 등의 사정이 있더라도 마찬가지인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=232811"},{"id":"P:233301","kind":"P","label":"2021노392","title":"특정범죄가중처벌등에관한법률위반(허위세금계산서교부등)·조세범처벌법위반","court":"대전고등법원","date":"2022.06.24","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233301"},{"id":"P:232667","kind":"P","label":"2021노1841","title":"사기","court":"서울동부지방법원","date":"2022.06.23","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=232667"},{"id":"P:619379","kind":"P","label":"2020노4940","title":"산업기술의유출방지및보호에관한법률위반·부정경쟁방지및영업비밀보호에관한법률위반","court":"수원지방법원","date":"2022.06.23","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619379"},{"id":"P:223303","kind":"P","label":"2017도3829","title":"횡령","court":"대법원","date":"2022.06.23","caseType":"형사","basis":"참조조문","text":"[1] 채권양도인이 채무자에게 채권양도 통지를 하는 등으로 채권양도의 대항요건을 갖추어 주지 않은 채 채무자로부터 양도한 채권을 추심하여 수령한 금전에 관하여 채권양수인을 위해 보관하는 자의 지위에 있는지 여부 및 채권양도인이 위 금전을 임의로 처분한 경우 횡령죄가 성립하는지 여부 [2] 건물의 임차인인 피고인이 임대인 甲에 대한 임대차보증금반환채권을 乙에게 양도하였는데도 甲에게 채권양도 통지를 하지 않고 甲으로부터 남아 있던 임대차보증금을 반환받아 보관하던 중 개인적인 용도로 사용하여 이를 횡령하였다는 내용으로 기소된 사안에서, 임대차보증금으로 받은 금전의 소유권은 피고인에게 귀속하고, 피고인이 乙을 위한 보관자 지위가 인정될 수 있는 신임관계에 있다고 볼 수 없어 횡령죄가 성립하지 않는다는 이유로, 이와 달리 보아 공소사실을 유죄로 인정한 원심판결에 채권양도에서 횡령죄의 성립 등에 관한 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=223303"},{"id":"P:232731","kind":"P","label":"2022노81","title":"마약류관리에관한법률위반(향정)","court":"서울고등법원","date":"2022.06.23","caseType":"형사","basis":"판례내용","text":"피고인 甲이 자신의 주거지에서 메트암페타민을 피고인 乙에게 무상으로 건네주고, 피고인 乙은 피고인 甲으로부터 위와 같이 무상으로 건네받아 필로폰을 수수하였다고 하여 마약류 관리에 관한 법률 위반으로 기소된 사안에서, 피고인 甲이 필로폰을 피고인 乙에게 건네준 사실은 인정되나, 이는 피고인 甲이 공동으로 필로폰을 수입한 丙에게 전달하기 위하여 자신의 밑에서 일하던 피고인 乙에게 필로폰을 가지고 있다가 자신의 지시에 따라 제3자에게 전달하라는 취지로 건네준 것으로 보일 뿐, 검사가 제출한 증거들만으로는 피고인 乙이 피고인 甲으로부터 필로폰의 처분권이나 사실상 자기의 것과 같이 사용·처분할 수 있는 지배관계를 갖기에 이르렀다고 인정하기에 부족하다는 이유로 공소사실을 무죄로 판단한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=232731"},{"id":"P:231609","kind":"P","label":"2021노490","title":"특정범죄가중처벌등에관한법률위반(향정)·마약류관리에관한법률위반(대마)","court":"부산고등법원","date":"2022.06.22","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=231609"},{"id":"P:238761","kind":"P","label":"2022노116","title":"업무방해·입찰방해","court":"서울남부지방법원","date":"2022.06.21","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238761"},{"id":"P:233527","kind":"P","label":"2021노2325","title":"도박공간개설","court":"의정부지방법원","date":"2022.06.21","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233527"},{"id":"P:232597","kind":"P","label":"2021도7087","title":"폭력행위등처벌에관한법률위반(공동주거침입)·절도·공무집행방해","court":"대법원","date":"2022.06.16","caseType":"형사","basis":"참조조문","text":"[1] 주거침입죄의 구성요건적 행위인 ‘침입’의 의미 및 침입행위에 해당하는지 판단하는 기준 / 행위자가 거주자의 승낙을 받아 주거에 들어갔으나 범죄 등을 목적으로 한 출입이거나 거주자가 행위자의 실제 출입 목적을 알았더라면 출입을 승낙하지 않았을 것이라는 사정이 인정되는 경우, 행위자의 출입행위가 주거침입죄에서 규정하는 침입행위에 해당하기 위한 요건 [2] 피고인들이 공동하여 시청에 이르러 150여 명의 조합원들과 함께 위 건물 안으로 들어가 1층 로비 바닥에 앉아 구호를 외치며 소란을 피움으로써 시청 건물 관리자의 의사에 반하여 건조물에 침입하였다는 내용으로 기소된 사안에서, 관리자의 의사를 주된 근거로 건조물침입죄의 성립을 인정한 원심판단에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=232597"},{"id":"P:232669","kind":"P","label":"2021노2852","title":"폭력행위등처벌에관한법률위반(공동상해)·업무방해·폭행·특수상해·특수협박·강요·상해","court":"창원지방법원","date":"2022.06.16","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=232669"},{"id":"P:222679","kind":"P","label":"2022도2236","title":"미성년자약취·사체은닉미수","court":"대법원","date":"2022.06.16","caseType":"형사","basis":"판례내용","text":"형사재판에서 범죄사실을 인정하기 위한 증거의 증명력 정도 / 법정형이 무거운 범죄의 경우 간접증거에 의하여 유죄를 인정하기 위한 증명의 정도 / 증명력에 한계가 있는 간접증거만이 존재하고, 범인으로 지목되고 있는 자에게 범행을 저지를 만한 동기가 발견되지 않는 경우의 증거평가방법 / 유전자검사나 혈액형검사 등 과학적 증거방법의 증명력","url":"https://www.law.go.kr/precInfoP.do?precSeq=222679"},{"id":"P:232593","kind":"P","label":"2021도16591","title":"업무방해","court":"대법원","date":"2022.06.16","caseType":"형사","basis":"참조조문","text":"정치적인 의사표현을 위한 집회나 행위가 헌법 제21조에 따라 보장되는 정치적 표현의 자유나 헌법 제10조에 내재된 일반적 행동의 자유의 관점 등에서 보호받을 가능성이 있더라도 전체 법질서상 용인될 수 없을 정도로 사회적 상당성을 갖추지 못한 경우, 그 행위 자체가 위법한 세력의 행사로서 형법 제314조 제1항의 업무방해죄에서 말하는 위력의 개념에 포섭될 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=232593"},{"id":"P:222713","kind":"P","label":"2020다208997","title":"손해배상(기)","court":"대법원","date":"2022.06.09","caseType":"민사","basis":"참조조문","text":"명의수탁자가 3자간 등기명의신탁에 따라 매도인으로부터 소유권이전등기를 넘겨받은 부동산을 자기 마음대로 처분한 경우, 형사상 횡령죄로 처벌되는지와 관계없이 명의수탁자는 명의신탁자에 대하여 민사상 불법행위책임을 부담하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=222713"},{"id":"P:232601","kind":"P","label":"2022도2817","title":"수도불통·업무방해","court":"대법원","date":"2022.06.09","caseType":"형사","basis":"참조조문","text":"구 형법 제195조에서 규정한 수도불통죄의 대상이 되는 ‘수도 기타 시설’의 의미","url":"https://www.law.go.kr/precInfoP.do?precSeq=232601"},{"id":"P:222707","kind":"P","label":"2021도14878","title":"도로교통법위반(음주측정거부)·교통사고처리특례법위반·도로교통법위반(무면허운전)","court":"대법원","date":"2022.06.09","caseType":"형사","basis":"판례내용","text":"도로교통법 위반죄로 1회 이상 형사처벌을 받은 전력이 있는 피고인이 음주측정을 요구받고도 이에 응하지 않았다는 도로교통법 위반의 공소사실에 대하여, 원심이 도로교통법 제148조의2 제1항, 제44조 제2항을 적용하여 유죄를 선고하였는데, 원심판결 선고 후 헌법재판소가 도로교통법 제148조의2 제1항 중 ‘제44조 제1항을 1회 이상 위반한 사람으로서 다시 같은 조 제2항을 위반한 사람’에 관한 부분에 대하여 위헌결정을 선고한 사안에서, 위 법률조항 부분은 소급하여 효력을 상실하였으므로 해당 법조를 적용하여 기소한 피고사건은 죄가 되지 않는 경우에 해당한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=222707"},{"id":"P:222705","kind":"P","label":"2016도11744","title":"노동조합및노동관계조정법위반·업무방해·폭력행위등처벌에관한법률위반(공동강요)·폭력행위등처벌에관한법률위반(공동주거침입)(피고인6에대하여인정된죄명:주거침입)·재물손괴","court":"대법원","date":"2022.06.09","caseType":"형사","basis":"참조조문","text":"[1] 연장근로의 집단적 거부와 같이 사용자의 업무를 저해함과 동시에 근로자들의 권리행사로서의 성격을 아울러 가지는 행위가 노동조합 및 노동관계조정법상 쟁의행위에 해당하는지 판단하는 기준 / 이는 휴일근로 거부의 경우에도 마찬가지인지 여부 [2] 甲 노동조합의 간부인 피고인들이 주요방위산업체로 지정된 乙 주식회사와 임금단체협상을 진행하면서 乙 회사의 방산물자 생산부서 근로자인 조합원들을 포함하여 연장근로, 휴일근로를 집단적으로 거부하도록 결정함으로써 위 조합원들과 공모하여 방산물자를 생산하는 업무에 종사하는 자의 쟁의행위 금지 규정을 위반하였다고 하여 노동조합 및 노동관계조정법 위반으로 기소된 사안에서, 제반 사정을 종합하면 단체협상 기간에 甲 노동조합의 지침에 따라 연장근로·휴일근로가 이루어지지 않았더라도 방산물자 생산부서 조합원들이 쟁의행위를 하였다고 볼 수 없고, 이를 전제로 피고인들에게 공동정범의 책임을 물을 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=222705"},{"id":"P:232599","kind":"P","label":"2021도16521","title":"특정범죄가중처벌등에관한법률위반(위험운전치상)·도로교통법위반(음주측정거부)·도로교통법위반","court":"대법원","date":"2022.06.09","caseType":"형사","basis":"판례내용","text":"도로교통법 위반죄로 1회 이상 형사처벌을 받은 전력이 있는 피고인이 정당한 사유 없이 경찰공무원의 음주측정요구에 응하지 않았다는 도로교통법 위반의 공소사실에 대하여, 원심이 구 도로교통법 제148조의2 제1항, 제44조 제1항, 제2항을 적용하여 유죄로 인정하였는데, 원심판결 선고 후 헌법재판소가 구 도로교통법 제148조의2 제1항 중 ‘제44조 제1항을 1회 이상 위반한 사람으로서 다시 같은 조 제2항을 위반한 사람’에 관한 부분에 대하여 위헌결정을 선고한 사안에서, 위 법률조항 부분은 소급하여 효력을 상실하였으므로 해당 법조를 적용하여 기소한 피고사건은 죄가 되지 않는 경우에 해당한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=232599"},{"id":"P:238519","kind":"P","label":"2020고단3212","title":"장애인차별금지및권리구제등에관한법률위반·부동산실권리자명의등기에관한법률위반·사문서위조·위조사문서행사","court":"서울북부지방법원","date":"2022.06.08","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238519"},{"id":"P:600309","kind":"P","label":"2022노225","title":"게임산업진흥에관한법률위반","court":"대구지방법원","date":"2022.05.26","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=600309"},{"id":"P:232605","kind":"P","label":"2021도12218","title":"업무상과실치사","court":"대법원","date":"2022.05.26","caseType":"형사","basis":"참조조문","text":"[1] 업무상과실치사죄의 성립요건 [2] 형사재판에서 유죄를 인정하기 위한 증거의 증명력 정도","url":"https://www.law.go.kr/precInfoP.do?precSeq=232605"},{"id":"P:221957","kind":"P","label":"2021도2488","title":"특정경제범죄가중처벌등에관한법률위반(배임)","court":"대법원","date":"2022.05.26","caseType":"형사","basis":"참조조문","text":"법원이 선임한 부재자 재산관리인이 그 관리대상인 부재자의 재산에 대한 범죄행위에 관하여 법원으로부터 고소권 행사에 관한 허가를 얻은 경우, 형사소송법 제225조 제1항에서 정한 법정대리인으로서 적법한 고소권자에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=221957"},{"id":"P:234553","kind":"P","label":"2021노3842","title":"허위공문서작성·허위작성공문서행사","court":"대전지방법원","date":"2022.05.25","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=234553"},{"id":"P:235055","kind":"P","label":"2022고단285","title":"스토킹범죄의처벌등에관한법률위반·정보통신망이용촉진및정보보호등에관한법률위반","court":"부산지방법원동부지원","date":"2022.05.24","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=235055"},{"id":"P:234731","kind":"P","label":"2017도3884","title":"무고·사문서위조·위조사문서행사","court":"대법원","date":"2022.05.13","caseType":"형사","basis":"판결요지","text":"[1] 판결 선고의 종료 시점 / 재판장이 주문을 낭독한 이후라도 선고가 종료되기 전까지는 일단 낭독한 주문의 내용을 정정하여 다시 선고할 수 있는지 여부 및 이러한 변경 선고가 허용되는 경우 [2] 제1심 재판장이 선고기일에 법정에서 ‘피고인을 징역 1년에 처한다.’는 주문을 낭독한 뒤 상소기간 등에 관한 고지를 하던 중 피고인이 ‘재판이 개판이야, 재판이 뭐 이 따위야.’ 등의 말과 욕설을 하면서 난동을 부려 교도관이 피고인을 제압하여 구치감으로 끌고 갔는데, 제1심 재판장은 그 과정에서 피고인에게 원래 선고를 듣던 자리로 돌아올 것을 명하였고, 법정경위가 구치감으로 따라 들어가 피고인을 다시 법정으로 데리고 나오자, 제1심 재판장이 피고인에게 ‘선고가 아직 끝난 것이 아니고 선고가 최종적으로 마무리되기까지 이 법정에서 나타난 사정 등을 종합하여 선고형을 정정한다.’는 취지로 말하며 징역 3년을 선고한 사안에서, 위 변경 선고는 위법하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=234731"},{"id":"P:233349","kind":"P","label":"2020노2809","title":"국민체육진흥법위반(도박등)방조·외국환거래법위반","court":"광주지방법원","date":"2022.05.12","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233349"},{"id":"P:222811","kind":"P","label":"2021노549","title":"아동·청소년의성보호에관한법률위반(음란물제작·배포등)방조·아동·청소년의성보호에관한법률위반(음란물소지)·아동·청소년의성보호에관한법률위반(성착취물소지)","court":"대구고등법원","date":"2022.05.12","caseType":"형사","basis":"판례내용","text":"피고인이 아동·청소년이용음란물 및 아동·청소년성착취물인 동영상과 사진 파일을 인터넷을 통해 다운로드받아 컴퓨터 하드디스크에 저장하여 소지하였다는 아동·청소년의 성보호에 관한 법률 위반의 공소사실로 기소되었는데, 수사기관은 ‘피고인이 텔레그램 N번방 그룹 및 채널에서 N번방 운영진이 제작·배포한 아동·청소년이용음란물을 정보통신기기 내 저장시키는 방법으로 소지하였다.’는 혐의사실로 발부받은 압수·수색영장을 집행하여 피고인의 컴퓨터 하드디스크를 압수하였고, 여기에서 N번방과 관련 없이 아동·청소년이 등장하는 사진 및 동영상 등의 음란물 파일이 다수 발견되자 이를 선별·압수한 다음 그 전자정보를 복사한 CD 및 그 출력본을 공소사실에 대한 증거로 제출한 사안에서, 위 CD 및 그 출력본은 증거능력이 인정된다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=222811"},{"id":"P:232613","kind":"P","label":"2021도16876","title":"권리행사방해","court":"대법원","date":"2022.05.12","caseType":"형사","basis":"참조조문","text":"여러 사람의 권리의 목적이 된 자기의 물건을 취거, 은닉 또는 손괴함으로써 그 여러 사람의 권리행사를 방해한 경우, 권리자별로 각각 권리행사방해죄가 성립하는지 여부 및 각 죄의 죄수 / 여러 명의 유류분권리자가 각자의 유류분반환청구권을 보전하기 위하여 부동산에 대한 가압류결정을 받아 가압류등기가 마쳐진 경우, 위 부동산은 유류분권리자들 각자의 유류분반환청구권 집행을 보전하기 위한 가압류의 목적이 되는지 여부 및 이는 유류분권리자들이 가압류를 개별적으로 신청하였는지 공동으로 신청하였는지에 따라 달라지는지 여부 / 형법 제328조 제1항에 따른 형면제 요건에 해당하는지 판단하는 방법","url":"https://www.law.go.kr/precInfoP.do?precSeq=232613"},{"id":"P:232609","kind":"P","label":"2022도3265","title":"사기·사기미수·업무방해·전자금융거래법위반·주민등록법위반·사문서위조·위조사문서행사","court":"대법원","date":"2022.05.12","caseType":"형사","basis":"참조조문","text":"[1] 위계에 의한 업무방해죄에서 ‘위계’의 의미 / 컴퓨터 등 정보처리장치에 정보를 입력하는 등의 행위가 입력된 정보 등을 바탕으로 업무를 담당하는 사람의 오인, 착각 또는 부지를 일으킬 목적으로 행해진 경우, 위계에 해당할 수 있는지 여부 및 이때 업무와 관련하여 오인, 착각 또는 부지를 일으킨 상대방이 없었던 경우, 위계가 있었다고 볼 수 있는지 여부 [2] 피고인 1명이 자동화기기에서 전화금융사기 편취금을 성명불상의 전화금융사기 조직원이 지정한 계좌로 입금하는 것임에도 전화금융사기 조직원으로부터 제공받은 제3자 명의 주민등록번호를 이용해 마치 여러 명이 각각 피해자 금융기관의 한도를 준수하면서 정상적으로 입금하는 것처럼 가장하여 피고인이 성명불상자의 전화금융사기 조직원과 공모하여 위계로써 피해자 은행들의 자동화기기 무통장·무카드 입금거래 업무를 방해하였다는 공소사실로 기소된 사안에서, 그 입금거래 과정에 은행 직원 등 다른 사람의 업무가 관여되었다고 볼 만한 사정이 없다는 이유로, 피고인의 행위가 업무방해죄의 위계에 해당한다고 할 수 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=232609"},{"id":"P:221765","kind":"P","label":"2021도1533","title":"정보통신망이용촉진및정보보호등에관한법률위반(정보통신망침해등)·컴퓨터등장애업무방해·저작권법위반·정보통신망이용촉진및정보보호등에관한법률위반","court":"대법원","date":"2022.05.12","caseType":"형사","basis":"참조조문","text":"[1] 구 정보통신망 이용촉진 및 정보보호 등에 관한 법률 제48조 제1항의 입법 취지 및 서비스제공자로부터 권한을 부여받은 이용자가 아닌 제3자가 정보통신망에 접속한 경우, 그에게 접근권한이 있는지 판단하는 기준 / 정보통신망에 대하여 서비스제공자가 접근권한을 제한하고 있는지 판단하는 방법 [2] 저작권법 제93조 제1항, 제2항의 입법 취지 / 데이터베이스제작자의 권리가 침해되었는지 판단하는 방법 / 데이터베이스의 개별 소재 또는 상당한 부분에 이르지 못하는 부분의 반복적이거나 특정한 목적을 위한 체계적 복제 등에 의한 데이터베이스제작자의 권리 침해는 데이터베이스의 개별 소재 또는 상당하지 않은 부분에 대한 반복적이고 체계적인 복제 등으로 결국 상당한 부분의 복제 등을 한 것과 같은 결과를 발생하게 한 경우에 한하여 인정되는지 여부 [3] 형법 제314조 제2항의 ‘컴퓨터 등 장애 업무방해죄’에서 말하는 ‘허위의 정보 또는 부정한 명령의 입력’, ‘기타 방법’의 의미 / 위 죄가 성립하기 위하여 정보처리에 장애가 현실적으로 발생하여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=221765"},{"id":"P:235057","kind":"P","label":"2022고합40","title":"농수산물의원산지표시등에관한법률위반","court":"부산지방법원동부지원","date":"2022.05.10","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=235057"},{"id":"P:232719","kind":"P","label":"2020도12239","title":"위계공무집행방해·불실기재여권행사·여권법위반","court":"대법원","date":"2022.04.28","caseType":"형사","basis":"참조조문","text":"[1] 위계에 의한 공무집행방해죄에서 ‘위계’의 의미 [2] 불실기재 여권행사죄에서 ‘허위신고’ 및 ‘불실의 사실’의 의미 / 여권 등 공정증서원본에 기재된 사항이 불실기재에 해당하는지 판단하는 기준 [3] 외국인 여자가 대한민국에 입국하여 취업 등을 하기 위한 방편으로 대한민국 국민인 남자와 혼인신고를 하였으나 당사자 사이에 혼인의 합의가 없는 경우, 구 국적법 제3조 제1호에 따라 대한민국 국적을 취득하는지 여부 / 이때 대한민국 국적을 취득한 것처럼 인적 사항을 기재하여 대한민국 여권을 발급받은 다음 이를 출입국심사 담당공무원에게 제출한 경우, 위계에 의한 공무집행방해죄 및 불실기재 여권행사죄가 성립하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=232719"},{"id":"P:232615","kind":"P","label":"2022도1717","title":"성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영물소지등)·주거침입","court":"대법원","date":"2022.04.28","caseType":"형사","basis":"참조조문","text":"[1] 주거침입죄의 구성요건적 행위인 ‘침입’의 의미 및 침입에 해당하는지 판단하는 기준 / 행위자가 거주자의 승낙을 받아 주거에 들어갔으나 범죄 등을 목적으로 한 출입이거나 거주자가 행위자의 실제 출입 목적을 알았더라면 출입을 승낙하지 않았을 것이라는 사정이 인정되는 경우, 행위자의 출입행위가 주거침입죄에서 규정하는 침입행위에 해당하기 위한 요건 [2] 피고인이 피해자의 안방에 CCTV 카메라와 동영상 저장장치를 부착한 TV인 사실을 숨기고 피해자에게 TV를 설치해주겠다면서 안방까지 들어가 피해자의 주거에 침입하였다는 내용으로 기소된 사안에서, 피해자의 사실상 평온상태가 침해되었다고 볼 만한 사정이 없다는 이유로, 피고인의 출입이 비록 범죄 등의 목적을 숨기고 한 것이라도 주거침입죄가 성립하지 않는다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=232615"},{"id":"P:235911","kind":"P","label":"2019도9177","title":"공전자기록등불실기재·불실기재공전자기록등행사·불실기재여권행사·출입국관리법위반","court":"대법원","date":"2022.04.28","caseType":"형사","basis":"참조조문","text":"[1] 불실기재 여권행사죄에서 ‘허위신고’ 및 ‘불실의 사실’의 의미 / 여권 등 공정증서원본에 기재된 사항이 불실기재에 해당하는지 판단하는 기준 [2] 출입국관리법 제7조 제1항, 제28조 제1항에서 정한 ‘유효한 여권’의 의미 및 타인 또는 허무인 명의의 여권이 이에 포함되는지 여부 [3] 외국인 여자가 대한민국에 입국하여 취업 등을 하기 위한 방편으로 대한민국 국민인 남자와 혼인신고를 하였으나 당사자 사이에 혼인의 합의가 없는 경우, 구 국적법 제3조 제1호에 따라 대한민국 국적을 취득하는지 여부 / 이때 대한민국 국적을 취득한 것처럼 인적사항을 기재하여 대한민국 여권을 발급받은 다음 이를 출입국심사를 받을 때 담당 공무원에게 제출한 경우, 불실기재 여권행사죄 및 출입국관리법 제7조 제1항, 제28조 제1항 위반죄가 성립하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=235911"},{"id":"P:222639","kind":"P","label":"2019도3047","title":"추행","court":"대법원","date":"2022.04.21","caseType":"형사","basis":"판례내용","text":"[1] 동성인 군인 사이의 항문성교나 그 밖에 이와 유사한 행위가 사적 공간에서 자발적 의사 합치에 따라 이루어지는 등 군이라는 공동사회의 건전한 생활과 군기를 직접적·구체적으로 침해한 것으로 보기 어려운 경우, 군형법 제92조의6이 적용되는지 여부 [2] 군인인 피고인 甲은 자신의 독신자 숙소에서 군인 乙과 서로 키스, 구강성교나 항문성교를 하는 방법으로 추행하고, 군인인 피고인 丙은 자신의 독신자 숙소에서 동일한 방법으로 피고인 甲과 추행하였다고 하여 군형법 위반으로 기소된 사안에서, 피고인들과 乙은 모두 남성 군인으로 당시 피고인들의 독신자 숙소에서 휴일 또는 근무시간 이후에 자유로운 의사를 기초로 한 합의에 따라 항문성교나 그 밖의 성행위를 한 점 등에 비추어 피고인들의 행위는 군형법 제92조의6에서 처벌대상으로 규정한 ‘항문성교나 그 밖의 추행’에 해당하지 않는다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=222639"},{"id":"P:220283","kind":"P","label":"2021노824","title":"미성년자의제강간","court":"수원고등법원","date":"2022.04.15","caseType":"형사","basis":"참조조문","text":"피고인이 카카오톡 오픈채팅방을 통해 미성년자 甲을 알게 된 후 당시 13세 이상 16세 미만으로 알고 있던 甲을 룸카페에서 만나 1회 간음하여 미성년자의제강간의 공소사실로 기소된 사안에서, 검사가 제출한 증거만으로는 피고인이 당시 甲이 13세 미만인 사실을 미필적으로라도 인식하고 있었다고 볼 수 없어 형법 제305조 제1항의 미성년자의제강간죄는 인정되지 아니하고, 한편 피고인은 甲의 나이를 13세 이상 16세 미만으로 인식하였으나 실제 甲의 나이가 11세인 경우이므로 피고인에게 형법 제305조 제2항 미성년자의제강간죄의 기수가 성립한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=220283"},{"id":"P:232107","kind":"P","label":"2022도649","title":"사기방조·전자금융거래법위반·금융실명거래및비밀보장에관한법률위반","court":"대법원","date":"2022.04.14","caseType":"형사","basis":"참조조문","text":"[1] 형법상 방조행위의 의미 및 그 성립 범위 [2] 방조범 성립에 필요한 고의의 의미와 내용 및 그 증명 방법","url":"https://www.law.go.kr/precInfoP.do?precSeq=232107"},{"id":"P:220303","kind":"P","label":"2021도17744","title":"명예훼손","court":"대법원","date":"2022.04.14","caseType":"형사","basis":"참조조문","text":"작업장의 책임자인 피고인이 甲으로부터 작업장에서 발생한 성추행 사건에 대해 보고받은 사실이 있음에도, 직원 5명이 있는 회의 자리에서 상급자로부터 경과보고를 요구받으면서 과태료 처분에 관한 책임을 추궁받자 이에 대답하는 과정에서 ‘甲은 성추행 사건에 대해 애초에 보고한 사실이 없다. 그런데도 이를 수사기관 등에 신고하지 않았다고 과태료 처분을 받는 것은 억울하다.’는 취지로 발언함으로써 허위사실을 적시하여 甲의 명예를 훼손하였다는 내용으로 기소된 사안에서, 피고인에게 유죄를 인정한 원심판결에 명예훼손죄의 고의와 사실의 적시에 관한 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=220303"},{"id":"P:232101","kind":"P","label":"2020도18305","title":"조세범처벌법위반·특정범죄가중처벌등에관한법률위반(허위세금계산서교부등)","court":"대법원","date":"2022.04.14","caseType":"형사","basis":"참조조문","text":"[1] 세금계산서합계표를 제출할 필요가 없는 전자세금계산서 발급분에 관하여 세금계산서합계표를 제출하였는데 그 부분 거래가 허위로 발급된 전자세금계산서에 관한 것인 경우, 구 조세범 처벌법 제10조 제3항 제3호의 ‘부가가치세법에 따른 매출·매입처별 세금계산서합계표를 거짓으로 기재하여 정부에 제출한 행위’에 해당하는지 여부 [2] 구 조세범 처벌법 제3조 제1항에서 정한 조세포탈죄의 ‘고의’를 인정하기 위한 요건 [3] 구 형법 제59조 제1항 단서에서 정한 ‘자격정지 이상의 형을 받은 전과’의 의미 / 형의 집행유예를 선고받은 사람이 구 형법 제65조에 의하여 그 선고가 실효 또는 취소됨이 없이 정해진 유예기간을 무사히 경과하여 형의 선고가 효력을 잃게 된 경우, 구 형법 제59조 제1항 단서에서 정한 선고유예 결격사유인 ‘자격정지 이상의 형을 받은 전과가 있는 자’에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=232101"},{"id":"P:233351","kind":"P","label":"2021고단2251","title":"사기·여신전문금융업법위반","court":"서울중앙지방법원","date":"2022.04.14","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233351"},{"id":"P:234033","kind":"P","label":"2021노154","title":"모욕","court":"서울중앙지방법원","date":"2022.04.14","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=234033"},{"id":"P:233529","kind":"P","label":"2022고합7","title":"미성년자의제유사강간·아동·청소년의성보호에관한법률위반(성착취물소지)·아동복지법위반(아동에대한음행강요·매개·성희롱등)","court":"수원지방법원","date":"2022.04.14","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233529"},{"id":"P:232089","kind":"P","label":"2022도1266","title":"마약류관리에관한법률위반(향정)","court":"대법원","date":"2022.04.14","caseType":"형사","basis":"판례내용","text":"2019. 12. 3. 개정으로 신설된 구 마약류 관리에 관한 법률 제40조의2 제2항에 따른 수강명령 또는 이수명령은 그 시행일인 2020. 12. 4. 이후에 마약류를 투약, 흡연 또는 섭취한 사람에 대하여 부과할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=232089"},{"id":"P:234555","kind":"P","label":"2021노1976","title":"자동차관리법위반","court":"대전지방법원","date":"2022.04.13","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=234555"},{"id":"P:231543","kind":"P","label":"2021도8900","title":"전자기록등내용탐지","court":"대법원","date":"2022.03.31","caseType":"형사","basis":"참조조문","text":"[1] 전자기록등내용탐지죄 등의 범죄에 행위 객체로 규정된 ‘전자기록 등 특수매체기록’의 의미 / 그 자체로서 객관적·고정적 의미를 가지면서 독립적으로 쓰이는 것이 아니라 개인 또는 법인이 전자적 방식에 의한 정보의 생성·처리·저장·출력을 목적으로 구축하여 설치·운영하는 시스템에서 쓰임으로써 예정된 증명적 기능을 수행하는 것이 ‘전자기록’에 포함되는지 여부 [2] 인터넷 계정의 아이디 및 비밀번호가 전자기록등내용탐지죄의 행위 객체인 ‘전자기록 등 특수매체기록’에 해당하는지 여부 [3] 봉함 기타 비밀장치가 되어 있지 아니한 전자기록 등 특수매체기록을 기술적 수단을 동원하여 그 내용을 알아낸 경우, 전자기록등내용탐지죄가 성립하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=231543"},{"id":"P:227239","kind":"P","label":"2018도15213","title":"위계공무집행방해·폭력행위등처벌에관한법률위반(공동주거침입)","court":"대법원","date":"2022.03.31","caseType":"형사","basis":"참조조문","text":"[1] 법령에서 일정한 행위를 금지하면서 이를 위반하는 행위에 대한 벌칙을 정하고 공무원으로 하여금 금지규정의 위반 여부를 감시·단속하도록 한 경우, 공무원의 감시·단속을 피하여 금지규정을 위반한 행위가 위계에 의한 공무집행방해죄에 해당하는지 여부 [2] 녹음·녹화 등을 할 수 있는 전자장비가 교정시설의 안전 또는 질서를 해칠 우려가 있는 금지물품에 해당하여 반입을 금지할 필요가 있는 경우, 수용자가 아닌 사람이 교도관의 검사·단속을 피하여 위와 같은 금지물품을 교정시설 내로 반입한 행위가 위계에 의한 공무집행방해죄를 구성하는지 여부 [3] 관리자에 의해 출입이 통제되는 건조물에 관리자의 승낙을 받아 건조물에 통상적인 출입방법으로 들어갔으나 이러한 승낙의 의사표시에 기망이나 착오 등의 하자가 있는 경우, 건조물침입죄가 성립하는지 여부 / 이때 관리자가 행위자의 실제 출입 목적을 알았더라면 출입을 승낙하지 않았을 사정이 있더라도 마찬가지인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=227239"},{"id":"P:230791","kind":"P","label":"2021노468","title":"도로교통법위반(음주측정거부)","court":"춘천지방법원강릉지원","date":"2022.03.24","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=230791"},{"id":"P:222641","kind":"P","label":"2017도18272","title":"주거침입","court":"대법원","date":"2022.03.24","caseType":"형사","basis":"참조조문","text":"[1] 주거침입죄의 구성요건적 행위인 ‘침입’의 의미 및 침입에 해당하는지 판단하는 기준 / 행위자가 거주자의 승낙을 받아 주거에 들어갔으나 범죄 등을 목적으로 한 출입이거나 거주자가 행위자의 실제 출입 목적을 알았더라면 출입을 승낙하지 않았을 것이라는 사정이 인정되는 경우, 행위자의 출입행위가 주거침입죄에서 규정하는 침입행위에 해당하기 위한 요건 / 일반인의 출입이 허용된 음식점에 영업주의 승낙을 받아 통상적인 출입방법으로 들어간 경우, 주거침입죄에서 규정하는 침입행위에 해당하는지 여부 및 이때 행위자가 범죄 등을 목적으로 음식점에 출입하였거나 영업주가 행위자의 실제 출입 목적을 알았더라면 출입을 승낙하지 않았을 것이라는 사정이 인정되더라도 마찬가지인지 여부 [2] 피고인들이 공모하여, 甲, 乙이 운영하는 각 음식점에서 인터넷 언론사 기자 丙을 만나 식사를 대접하면서 丙이 부적절한 요구를 하는 장면 등을 확보할 목적으로 녹음·녹화장치를 설치하거나 장치의 작동 여부 확인 및 이를 제거하기 위하여 각 음식점의 방실에 들어감으로써 甲, 乙의 주거에 침입하였다는 내용으로 기소된 사안에서, 피고인들이 각 음식점 영업주로부터 승낙을 받아 통상적인 출입방법에 따라 각 음식점의 방실에 들어간 것은 주거침입죄에서 규정하는 침입행위에 해당하지 아니하고, 설령 다른 손님인 丙과의 대화 내용과 장면을 녹음·녹화하기 위한 장치를 설치하거나 장치의 작동 여","url":"https://www.law.go.kr/precInfoP.do?precSeq=222641"},{"id":"P:605529","kind":"P","label":"2022고단23","title":"마약류관리에관한법률위반(향정)","court":"창원지방법원진주지원","date":"2022.03.22","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=605529"},{"id":"P:227221","kind":"P","label":"2021도13883","title":"공무집행방해(인정된 죄명: 폭행)","court":"대법원","date":"2022.03.17","caseType":"형사","basis":"참조조문","text":"[1] 공무집행방해죄에서 ‘직무를 집행하는’의 의미 / 공무집행방해죄의 전제인 ‘공무원의 적법한 공무집행’인지 판단하는 기준 [2] 시청 청사 내 주민생활복지과 사무실에 술에 취한 상태로 찾아가 소란을 피우던 피고인을 소속 공무원 甲과 乙이 제지하며 밖으로 데리고 나가려 하자, 피고인이 甲과 乙의 멱살을 잡고 수회 흔든 다음 휴대전화를 휘둘러 甲의 뺨을 때림으로써 시청 공무원들의 주민생활복지에 대한 통합조사 및 민원 업무에 관한 정당한 직무집행을 방해하였다는 공소사실로 기소된 사안에서, 피고인의 행위는 시청 소속 공무원들의 적법한 직무집행을 방해한 행위에 해당하므로 공무집행방해죄를 구성한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=227221"},{"id":"P:227223","kind":"P","label":"2021도16232","title":"강간치상·마약류관리에관한법률위반(향정)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영)·강제추행·특정경제범죄가중처벌등에관한법률위반(사기)·사기·공문서위조·위조공문서행사·부착명령","court":"대법원","date":"2022.03.17","caseType":"형사","basis":"판례내용","text":"마약류 관리에 관한 법률 제4조 제2항 제1호에 의하여 허용되는 마약류의 ‘취급’과 취급이 허용되는 대상 / 마약류취급의료업자로부터 위 법에 따라 자신에 대한 투약 용도로 제공받아 소지하게 된 마약류를 자신이 아닌 다른 사람 등에게 투약하거나 다른 사람 등의 투약을 위하여 제공하는 행위가 제4조 제1항에 의하여 금지된 것으로서 제61조 제1항 제5호의 처벌대상에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=227223"},{"id":"P:220243","kind":"P","label":"2021도2180","title":"상표법위반·업무상배임[타인의 상표가 부착된 제품을 무상으로 제공한 경우 상표법위반죄에 해당하는지 여부가 문제된 사건]","court":"대법원","date":"2022.03.17","caseType":"형사","basis":"판례내용","text":"[1] 상표법상 ‘상표의 사용’ 및 ‘상품’의 의미 [2] 피고인 甲은 상표권자의 허락 없이 상표를 임의로 표시한 수건을 주문·제작하여 그중 일부를 거래처에 판매하고 일부를 다른 거래처에 사은품 내지 판촉용으로 제공하였으며, 피고인 乙은 위 수건이 상표권자의 허락 없이 임의로 제작된 것임을 알면서도 그중 일부를 거래처에 제공하여 상표법 위반으로 기소된 사안에서, 수건의 외관·품질 및 거래 현황 등에 비추어 위 수건은 ‘상품’에 해당하고, 그중 일부가 사은품 또는 판촉물로서 무상으로 제공되었더라도 위 수건에 상표를 표시하거나 상표가 표시된 수건을 양도하는 행위는 상표법상 ‘상표의 사용’에 해당한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=220243"},{"id":"P:227185","kind":"P","label":"2018도18872","title":"업무상배임·게임산업진흥에관한법률위반","court":"대법원","date":"2022.03.11","caseType":"형사","basis":"참조조문","text":"[1] 죄형법정주의 원칙이 적용되는 형벌법규의 해석 원칙 [2] 게임산업진흥에 관한 법률 시행령 제18조의3 제3호 목에서 정한 ‘게임물의 비정상적인 이용’의 의미 및 게임제공업자 내부에서 권한을 부여받아 게임머니 등을 생산·획득하는 경우도 이에 포함되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=227185"},{"id":"P:231031","kind":"P","label":"2021노2006","title":"성폭력범죄의처벌등에관한특례법위반(주거침입강제추행)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영물소지등)·공연음란·위헌심판제청","court":"서울고등법원","date":"2022.03.10","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=231031"},{"id":"P:219929","kind":"P","label":"2019도4938","title":"성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영)","court":"대법원","date":"2022.02.17","caseType":"형사","basis":"판례내용","text":"[1] 수사기관이 전자정보를 담은 매체를 피의자로부터 임의제출 받아 압수하면서 거기에 담긴 정보 중 무엇을 제출하는지 명확히 확인하지 않은 경우, 압수의 대상이 되는 정보의 범위 / 수사기관이 피의자로부터 범죄혐의사실과 관련된 전자정보와 그렇지 않은 전자정보가 섞인 매체를 임의제출 받아 사무실 등지에서 정보를 탐색·복제·출력하는 경우, 피의자 측에 참여의 기회를 보장하고 압수된 전자정보가 특정된 목록을 교부해야 하는지 여부 및 그러한 조치를 하지 않았더라도 압수·수색이 적법하다고 볼 수 있는 경우 [2] 피고인이 휴대전화로 성명 불상 피해자들의 신체를 그 의사에 반하여 촬영하거나, 짧은 치마를 입고 횡단보도 앞에서 신호를 기다리던 피해자의 다리를 몰래 촬영하여 성폭력범죄의 처벌 등에 관한 특례법 위반으로 기소되었는데, 8번 범행 피해자의 신고를 받고 출동한 경찰관이 현장에서 피고인으로부터 임의제출 받아 압수한 휴대전화를 사무실에서 탐색하는 과정에서 1~7번 범행의 영상을 발견한 사안에서, 제반 사정을 종합하면 1~7번 범행으로 촬영한 영상의 출력물과 파일 복사본을 담은 시디는 임의제출에 의해 적법하게 압수된 전자정보에서 생성된 것으로서 증거능력이 인정된다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=219929"},{"id":"P:219943","kind":"P","label":"2020도68","title":"근로기준법위반","court":"대법원","date":"2022.02.11","caseType":"형사","basis":"판례내용","text":"[1] 구 근로기준법 제35조 제3호에 대한 헌법재판소 위헌결정에 헌법재판소법 제47조 제3항에 따른 소급효가 인정되는지 여부 / 구 근로기준법 제35조 제3호는 위헌결정일인 2015. 12. 23.부터 효력을 상실하여 사용자는 월급근로자의 근무기간에 관계없이 같은 법 제26조 본문에 따라 근로자에게 30일 전에 해고의 예고를 하거나 30일분의 통상임금에 해당하는 해고예고수당을 지급할 의무를 부담하고 이를 위반하면 같은 법 제110조 제1호에 따라 형사처벌의 대상이 되는지 여부 [2] 2019. 1. 15. 법률 제16270호로 개정된 근로기준법 제26조 제1호의 적용 범위가 위 조항의 시행일인 2019. 1. 15. 이후 근로계약을 체결한 근로자로 한정되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=219943"},{"id":"P:231555","kind":"P","label":"2021도10827","title":"명예훼손","court":"대법원","date":"2022.02.11","caseType":"형사","basis":"참조조문","text":"형법 제310조에서 규정한 위법성 조각사유의 요건 중 ‘진실한 사실’ 및 ‘오로지 공공의 이익에 관한 때’의 의미 / 적시된 사실이 ‘공공의 이익’에 관한 것인지 판단하는 기준 / 사실적시의 내용이 사회 일반의 일부 이익에만 관련되거나 개인에 관한 사항인 경우, ‘공공의 이익’에 관한 것인지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=231555"},{"id":"P:220271","kind":"P","label":"2021고합177","title":"공인회계사법위반","court":"서울중앙지방법원","date":"2022.02.10","caseType":"형사","basis":"참조조문","text":"공인회계사인 피고인들이, 비공개회사인 甲 주식회사의 주식을 매입한 투자자 乙 회사와 용역계약을 맺고 乙 회사의 의뢰로 甲 회사에 대한 자기자본가치 및 매입 주식의 공정시장가치 평가업무를 수행하는 과정에서 乙 회사로부터 매수청구권을 행사할 때 유리하도록 乙 회사가 결정하는 평가방법, 평가인자 및 가격에 따라 가치평가를 해달라는 부탁을 받고 乙 회사에 유리하게 높게 평가된 가격으로 기재된 허위의 평가보고서를 작성해 주고 용역비 명목의 돈을 받음으로써 고의로 허위보고를 함과 동시에 부정한 청탁을 받고 금품을 수수하거나 乙 회사가 부정한 방법으로 부당한 금전상의 이득을 얻도록 가담하였다고 하여 공인회계사법 위반으로 기소된 사안에서, 피고인들에게 무죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=220271"},{"id":"P:615757","kind":"P","label":"2019노115","title":"저작권법위반","court":"서울동부지방법원","date":"2022.02.10","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=615757"},{"id":"P:219703","kind":"P","label":"2020두32364","title":"의사면허취소처분취소","court":"대법원","date":"2022.02.10","caseType":"일반행정","basis":"판결요지","text":"의료인이 ‘불법 리베이트 수수에 대한 처벌 조항’에 따른 의료법 위반죄와 형법상 배임수재죄에 대하여 상상적 경합범에 관한 형법 제40조가 적용되어 하나의 금고 이상의 형을 선고받은 경우, 의료법 제65조 제1항 제1호, 제8조 제4호에 정한 의료인 면허취소사유에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=219703"},{"id":"P:233355","kind":"P","label":"2021고합349","title":"성폭력범죄의처벌등에관한특례법위반(촬영물등이용협박)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등)·성폭력범죄의처벌등에관한특례법위반(촬영물등이용강요)·공갈미수","court":"서울북부지방법원","date":"2022.02.08","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233355"},{"id":"P:219309","kind":"P","label":"2021도15334","title":"도시및주거환경정비법위반","court":"대법원","date":"2022.01.27","caseType":"형사","basis":"참조조문","text":"[1] 정비사업의 시행에 관하여 공개하여야 할 서류 및 그 ‘관련 자료’를 규정하고 이를 위반한 조합임원 등을 처벌하는 구 도시 및 주거환경정비법 제86조 제6호, 제81조 제1항, 도시 및 주거환경정비법 제138조 제1항 제7호, 제124조 제1항의 입법 취지 / 구 도시 및 주거환경정비법 제81조 제1항 각호, 도시 및 주거환경정비법 제124조 제1항 각호에 명시된 공개대상 서류의 ‘관련 자료’를 해석하는 기준 [2] ‘속기록’이 구 도시 및 주거환경정비법 제81조 제1항 제3호, 도시 및 주거환경정비법 제124조 제1항 제3호에서 정한 의사록의 ‘관련 자료’에 포함되는지 여부 [3] ‘자금수지보고서’가 도시 및 주거환경정비법 제124조 제1항 제9호에서 정한 결산보고서의 ‘관련 자료’에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=219309"},{"id":"P:231565","kind":"P","label":"2021도8833","title":"업무상배임(인정된죄명:업무상배임미수)","court":"대법원","date":"2022.01.27","caseType":"형사","basis":"참조조문","text":"[1] 배임죄의 실행의 착수시기 및 기수시기 / 배임죄의 객관적 구성요건요소인 손해 발생 또는 배임죄의 보호법익인 피해자의 재산상 이익의 침해 여부를 판단하는 기준 [2] 형사소송법 제254조 제4항에서 공소사실의 특정을 요구하는 취지 및 공소사실의 특정 정도","url":"https://www.law.go.kr/precInfoP.do?precSeq=231565"},{"id":"P:219339","kind":"P","label":"2021고합456","title":"신체수색","court":"대구지방법원","date":"2022.01.26","caseType":"형사","basis":"참조조문","text":"피고인이 자신이 운영하는 서점 내에서 아동 甲이 문구류인 펜을 훔친 것으로 오인하여 甲을 다른 사람들이 보이지 않는 서점 구석의 책상이 있는 곳으로 데리고 간 다음 甲을 책상 앞에 세워 두고 자신은 의자에 앉아 甲에게 ‘CCTV로 보고 있었는데, 펜을 훔치는 거 봤다.’고 말하면서 甲이 입고 있던 패딩과 조끼의 주머니에 손을 넣어 뒤져 그 안에 펜이 들어 있는지 확인함으로써 甲의 신체를 수색하였다는 내용으로 기소된 사안에서, 피고인의 행위에 위법성이 없다는 이유로 무죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=219339"},{"id":"P:599933","kind":"P","label":"2021고단1390","title":"업무상배임·사문서위조·위조사문서행사·상표법위반","court":"서울서부지방법원","date":"2022.01.26","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=599933"},{"id":"P:600349","kind":"P","label":"2020노2657","title":"업무방해","court":"서울중앙지방법원","date":"2022.01.21","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=600349"},{"id":"P:232059","kind":"P","label":"2021고합582","title":"특정범죄가중처벌등에관한법률위반(보복협박등)(인정된죄명협박)·정보통신망이용촉진및정보보호등에관한법률위반(명예훼손)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영물소지등)","court":"인천지방법원","date":"2022.01.21","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=232059"},{"id":"P:612021","kind":"P","label":"2020노2818","title":"업무방해·재물손괴","court":"서울남부지방법원","date":"2022.01.20","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=612021"},{"id":"P:601911","kind":"P","label":"2021고단2651","title":"교통사고처리특례법위반(치상)","court":"대구지방법원서부지원","date":"2022.01.19","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=601911"},{"id":"P:605171","kind":"P","label":"2020노3001","title":"사기·무고·배상명령신청","court":"의정부지방법원","date":"2022.01.18","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=605171"},{"id":"P:616727","kind":"P","label":"2020노2941","title":"업무방해·컴퓨터등사용사기(인정된죄명:사기)","court":"의정부지방법원","date":"2022.01.18","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=616727"},{"id":"P:219723","kind":"P","label":"2019다282197","title":"손해배상(국)","court":"대법원","date":"2022.01.14","caseType":"민사","basis":"참조조문","text":"[1] 수사기관의 피의사실 공표행위가 허용되기 위한 요건 및 그 위법성 조각 여부의 판단 기준 / 수사기관이 발표한 피의사실에 ‘범죄를 구성하지 않는 사실관계’까지 포함되어 있고, 발표 내용에 비추어 피의사실은 부수적인 것에 불과하고 ‘범죄를 구성하지 않는 사실관계’가 주된 것인 경우, 피의사실 공표행위가 위법하다고 보아야 하는지 여부 [2] 압수물에 대한 몰수의 선고가 포함되지 않은 판결이 선고되어 확정된 경우, 검사에게 압수물을 환부하여야 할 의무가 당연히 발생하는지 여부 및 피압수자 등 환부를 받을 자가 압수 후 소유권을 포기하는 등으로 실체법상의 권리를 상실하거나, 수사기관에 대하여 환부청구권 포기의 의사표시를 한 경우, 수사기관의 압수물 환부의무가 면제되는지 여부 [3] 가해행위와 이로 인한 현실적인 손해의 발생 사이에 시간적 간격이 있는 불법행위에 기한 손해배상채권의 경우, 장기소멸시효의 기산점이 되는 ‘불법행위를 한 날’의 의미 [4] 부패의 염려가 있거나 보관하기 어려운 압수물에 대하여 형사소송법 제130조 제3항에서 정한 요건을 갖추지 않은 폐기처분이 위법한지 여부 [5] 수사기관이 형사소송법 제130조 제2항, 제3항 및 제219조의 요건을 충족하지 않는데도 위법하게 압수물을 폐기한 이후 형사재판에서 무죄판결이 확정되어 위법한 폐기로 인해 압수물의 환부를 받지 못한 피압수자에게 손해가 발생한 경우, 수사기관의 위법한","url":"https://www.law.go.kr/precInfoP.do?precSeq=219723"},{"id":"P:223455","kind":"P","label":"2021노26","title":"성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영)","court":"의정부지방법원","date":"2022.01.14","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=223455"},{"id":"P:231569","kind":"P","label":"2021도14015","title":"가정폭력범죄의처벌등에관한특례법위반","court":"대법원","date":"2022.01.14","caseType":"형사","basis":"참조조문","text":"피고인이 접근금지, 문언송신금지 등을 명한 임시보호명령을 위반하여 피해자의 주거지에 접근하고 문자메시지를 보낸 사안에서, 임시보호명령을 위반한 주거지 접근이나 문자메시지 송신을 피해자가 양해 내지 승낙했더라도 가정폭력범죄의 처벌 등에 관한 특례법 위반죄의 구성요건에 해당하고 형법 제20조의 정당행위로 볼 수 없다는 이유로 가정폭력범죄의 처벌 등에 관한 특례법 위반죄를 인정한 원심판결을 정당하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=231569"},{"id":"P:233359","kind":"P","label":"2021노1666","title":"재물손괴","court":"의정부지방법원","date":"2022.01.14","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233359"},{"id":"P:231639","kind":"P","label":"2021고단1432","title":"폭력행위등처벌에관한법률위반(공동강요)","court":"대전지방법원서산지원","date":"2022.01.13","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=231639"},{"id":"P:231579","kind":"P","label":"2021도11257","title":"공전자기록등불실기재·불실기재공전자기록등행사","court":"대법원","date":"2022.01.13","caseType":"형사","basis":"참조조문","text":"공전자기록 등 불실기재죄의 구성요건인 ‘불실의 사실기재’는 당사자의 허위신고에 의하여 이루어져야 하는지 여부 및 법원의 촉탁에 의하여 등기를 마친 경우에도 그 전제절차에 허위적 요소가 있으면 위 죄가 성립하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=231579"},{"id":"P:233361","kind":"P","label":"2020노2928","title":"업무상과실치사","court":"서울중앙지방법원","date":"2022.01.13","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233361"},{"id":"P:231581","kind":"P","label":"2016도9596","title":"성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영)","court":"대법원","date":"2022.01.13","caseType":"형사","basis":"판례내용","text":"[1] 수사기관이 정보저장매체와 거기에 저장된 전자정보를 임의제출의 방식으로 압수할 때 임의제출자의 의사에 따른 전자정보 압수의 대상과 범위가 명확하지 않거나 이를 알 수 없는 경우, 임의제출에 따른 압수의 동기가 된 범죄혐의사실과 관련되고 이를 증명할 수 있는 최소한의 가치가 있는 전자정보에 한하여 압수의 대상이 되는지 여부 / 휴대전화를 이용한 불법촬영 범죄의 경우, 그 안에 저장되어 있는 같은 유형의 전자정보에서 발견되는 간접증거나 정황증거는 범죄혐의사실과 구체적·개별적 연관관계가 인정될 수 있는지 여부 [2] 압수의 대상이 되는 전자정보와 그렇지 않은 전자정보가 혼재된 정보저장매체나 복제본을 임의제출받은 수사기관이 정보저장매체 등을 수사기관 사무실 등으로 옮겨 탐색·복제·출력하는 일련의 과정에서, 피압수자 측에 참여의 기회를 보장하고 압수된 전자정보의 파일 명세가 특정된 압수목록을 작성·교부하는 등의 적절한 조치를 취하지 않은 경우, 압수·수색의 적법 여부 및 이때 정보저장매체 또는 복제본에서 범죄혐의사실과 관련된 전자정보만을 복제·출력하였더라도 마찬가지인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=231581"},{"id":"P:221787","kind":"P","label":"2021노393","title":"특정범죄가중처벌등에관한법률위반(운전자폭행등)(인정된죄명상해)·재물손괴·특정범죄가중처벌등에관한법률위반(도주치상)·도로교통법위반(사고후미조치)·도로교통법위반(음주운전)·도로교통법위반(무면허운전)·특정범죄가중처벌등에관한법률위반(위험운전치상)","court":"부산고등법원","date":"2022.01.13","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=221787"},{"id":"P:231583","kind":"P","label":"2021도14471","title":"주택법위반·공인중개사법위반","court":"대법원","date":"2022.01.13","caseType":"형사","basis":"참조조문","text":"[1] 공인중개사법 위반죄와 다른 죄의 경합범에 대하여 벌금형을 선고하는 경우, 이를 분리 심리하여 형을 따로 선고하도록 규정한 구 공인중개사법 제10조의2의 취지 / 공인중개사법 위반죄와 다른 죄의 경합범에 대하여 징역형을 선고하는 경우에도 구 공인중개사법 제10조의2를 유추적용하여 형을 분리 선고하여야 하는지 여부 [2] 공인중개사법 위반죄와 다른 범죄가 상상적 경합관계에 있는 경우, 모든 죄를 통틀어 하나의 형을 선고하여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=231583"},{"id":"P:219741","kind":"P","label":"2021도11110","title":"자본시장과금융투자업에관한법률위반·증거은닉교사·특정경제범죄가중처벌등에관한법률위반(횡령)·업무상횡령·사문서위조·위조사문서행사·주식회사등의외부감사에관한법률위반·사기","court":"대법원","date":"2022.01.13","caseType":"형사","basis":"참조조문","text":"[1] 주권상장법인의 주식 등 대량보유·변동 보고의무 위반으로 인한 자본시장과 금융투자업에 관한 법률 위반죄가 진정부작위범에 해당하는지 여부 / 위 죄의 공동정범은 그 의무가 수인에게 공통으로 부여되어 있는데도 수인이 공모하여 전원이 그 의무를 이행하지 않았을 때 성립하는지 여부 [2] 주권상장법인의 주식 등 변경 보고의무 위반으로 인한 자본시장과 금융투자업에 관한 법률 위반죄가 진정부작위범에 해당하는지 여부 / 위 죄의 공동정범은 그 의무가 수인에게 공통으로 부여되어 있는데도 수인이 공모하여 전원이 그 의무를 이행하지 않았을 때 성립하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=219741"},{"id":"P:219719","kind":"P","label":"2021도13108","title":"사기","court":"대법원","date":"2022.01.13","caseType":"형사","basis":"참조조문","text":"[1] 검사가 공소장변경허가신청서를 제출하지 않고 공소사실에 대한 검사의 의견을 기재한 서면을 제출한 경우, 이를 곧바로 공소장변경허가신청서를 제출한 것으로 볼 수 있는지 여부 [2] 공소장의 기재가 불분명한 경우, 법원이 취할 조치 [3] 경합범 관계에 있는 공소사실 중 판결주문이 수 개일 때 피고인과 검사가 일부에 대하여만 상소한 경우, 상소심에서 이를 파기할 때의 파기 범위 / 경합범 관계에 있는 공소사실 중 일부 유죄, 일부 무죄를 선고하여 판결주문이 수 개일 때 검사가 판결 전부에 대하여 상소한 경우, 상소심에서 이를 파기할 때 유죄 부분과 파기되는 무죄 부분을 함께 파기하여야 하는지 여부 및 이때 경합범 관계에 있는 공소사실이라도 개별적으로 파기되는 부분과 불가분의 관계에 있는 부분만을 파기하여야 하는 경우 [4] 학부모들 및 대한민국에 대한 사기로 기소된 피고인에 대하여 제1심법원이 피해자 대한민국에 대한 사기 부분에 대하여 무죄를 선고하고 피해자 학부모들에 대한 사기 부분에 대하여 공소를 기각하자 검사가 제1심판결 전부에 대하여 항소를 제기한 사안에서, 제1심판결 중 공소기각 부분을 파기하는 이상 제1심판결 중 무죄 부분도 함께 파기하여야 한다고 본 원심판단에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=219719"},{"id":"P:228413","kind":"P","label":"2020누52759","title":"해임처분취소","court":"서울고등법원","date":"2022.01.13","caseType":"일반행정","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=228413"},{"id":"P:231593","kind":"P","label":"2021오12","title":"경범죄처벌법위반","court":"대법원","date":"2021.12.30","caseType":"형사","basis":"판례내용","text":"피고인이 112신고를 받고 출동한 경찰관에게 못된 장난을 하여 공무수행 중인 자의 업무를 방해하였다는 공소사실에 대하여, 경범죄 처벌법 제3조 제2항 제3호를 적용하여 피고인을 벌금 500,000원에 처한 약식명령이 확정된 후 비상상고가 제기된 사안에서, 위 죄의 법정형은 \"200,000원 이하의 벌금, 구류 또는 과료\"이므로 그중 벌금형을 선택할 경우 벌금액은 200,000원을 초과할 수 없어 원판결이 법령을 위반한 경우에 해당한다는 이유로, 원판결을 파기하고 다시 벌금 200,000원을 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=231593"},{"id":"P:219871","kind":"P","label":"2017도15175","title":"노동조합및노동관계조정법위반","court":"대법원","date":"2021.12.30","caseType":"형사","basis":"참조조문","text":"교원 노동조합인 피고인 甲 노동조합의 대표자 피고인 乙이, 해직 교원에게 조합원 자격을 인정하는 피고인 甲 노동조합 규약이 구 교원의 노동조합 설립 및 운영 등에 관한 법률 제2조에 위반된다는 이유로 고용노동부장관으로부터 시정명령을 받고도 이를 이행하지 아니하였다는 구 노동조합 및 노동관계조정법 위반의 공소사실이 제1심 및 원심에서 유죄로 인정되었는데, 원심판결 선고 후 구 교원의 노동조합 설립 및 운영 등에 관한 법률이 2021. 1. 5. 개정되면서 종전까지 금지하던 해직 교원의 교원 노동조합 가입을 허용하는 것으로 법령이 변경된 사안에서, 피고인들의 시정명령 위반행위는 형법 제1조 제2항의 ‘범죄 후 법령의 변경에 의하여 그 행위가 범죄를 구성하지 아니한 때’에 해당한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=219871"},{"id":"P:219809","kind":"P","label":"2021도9680","title":"재물손괴","court":"대법원","date":"2021.12.30","caseType":"형사","basis":"참조조문","text":"[1] 형법 제20조에 정하여진 ‘사회상규에 위배되지 아니하는 행위’의 의미 및 정당행위의 성립요건 / 어떠한 행위가 범죄구성요건에 해당하지만 정당행위로 위법성이 조각된다는 것의 의미 [2] 甲 아파트 입주자대표회의 회장인 피고인이 자신의 승인 없이 동대표들이 관리소장과 함께 게시한 입주자대표회의 소집공고문을 뜯어내 제거함으로써 그 효용을 해하였다고 하여 재물손괴로 기소된 사안에서, 피고인이 위 공고문을 손괴한 조치는, 그에 선행하는 위법한 공고문 작성 및 게시에 따른 위법상태의 구체적 실현이 임박한 상황하에서 그 위법성을 바로잡기 위한 것으로 사회통념상 허용되는 범위를 크게 넘어서지 않는 행위로 볼 수 있다는 이유로, 이와 달리 본 원심판단에 정당행위에 관한 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=219809"},{"id":"P:219859","kind":"P","label":"2021도11924","title":"직권남용권리행사방해·공무상비밀누설","court":"대법원","date":"2021.12.30","caseType":"형사","basis":"참조조문","text":"공무상비밀누설죄에서 ‘법령에 의한 직무상 비밀’ 및 ‘누설’의 의미 / 공무상비밀누설죄의 보호법익 / 공무원이 직무상 알게 된 비밀을 그 직무와의 관련성 혹은 필요성에 기하여 해당 직무의 집행과 관련 있는 다른 공무원에게 직무집행의 일환으로 전달한 행위가 비밀의 누설에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=219859"},{"id":"P:231591","kind":"P","label":"2021오24","title":"모욕·경범죄처벌법위반","court":"대법원","date":"2021.12.30","caseType":"형사","basis":"참조조문","text":"피고인이 112신고를 받고 출동한 경찰관을 모욕하고, 있지 않은 범죄를 경찰관에게 거짓으로 신고하였다는 공소사실에 대하여, 형법 제311조, 경범죄 처벌법 제3조 제3항 제2호, 형법 제37조, 제38조를 적용하여 피고인을 벌금 3,000,000원에 처한 약식명령이 확정된 후 비상상고가 제기된 사안에서, 위 각 죄의 법정형은 \"1년 이하의 징역이나 금고 또는 2,000,000원 이하의 벌금\", \"600,000원 이하의 벌금, 구류 또는 과료\"이므로 그중 벌금형을 선택할 경우 벌금액은 위 법조에서 정한 벌금형의 다액을 합산한 2,600,000원을 초과할 수 없어 원판결이 법령을 위반한 경우에 해당한다는 이유로, 원판결을 파기하고 다시 벌금 2,600,000원을 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=231591"},{"id":"P:219907","kind":"P","label":"2020노1052","title":"근로기준법위반·근로자퇴직급여보장법위반","court":"춘천지방법원","date":"2021.12.24","caseType":"형사","basis":"판례내용","text":"甲 교회의 담임목사인 피고인이, 피고인에 의해 甲 교회의 전도사로 임명된 후 5년 8개월여 동안 근무하다가 사직한 乙의 임금 일부와 퇴직금을 퇴직일로부터 14일 이내에 지급하지 아니하였다고 하여 근로기준법 위반 및 근로자퇴직급여 보장법 위반으로 기소된 사안에서, 제반 사정을 종합하면 乙은 근로기준법상 근로자에 해당한다는 이유로 미지급 임금 및 퇴직금에 관한 공소사실을 유죄로 인정한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=219907"},{"id":"P:227179","kind":"P","label":"2021노3426","title":"국민체육진흥법위반","court":"대구지방법원","date":"2021.12.24","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=227179"},{"id":"P:238481","kind":"P","label":"2020노70","title":"정보통신망이용촉진및정보보호등에관한법률위반(명예훼손)","court":"수원고등법원","date":"2021.12.23","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238481"},{"id":"P:223461","kind":"P","label":"2021노2538","title":"공갈·특수협박·협박·특수상해·특수폭행·상해","court":"대전지방법원","date":"2021.12.22","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=223461"},{"id":"P:231643","kind":"P","label":"2021고합94","title":"아동·청소년의성보호에관한법률위반(성착취물소지등)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영물소지등)","court":"대전지방법원서산지원","date":"2021.12.22","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=231643"},{"id":"P:611997","kind":"P","label":"2021노402","title":"공익사업을위한토지등의취득및보상에관한법률위반","court":"춘천지방법원","date":"2021.12.17","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=611997"},{"id":"P:241619","kind":"P","label":"2021고합182","title":"특정경제범죄가중처벌등에관한법률위반(사기)방조(일부인정된죄명사기방조)·개인정보보호법위반·정보통신망이용촉진및정보보호등에관한법률위반방조","court":"창원지방법원","date":"2021.12.16","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=241619"},{"id":"P:231605","kind":"P","label":"2017도18591","title":"배임수재·배임증재·범죄수익은닉의규제및처벌등에관한법률위반·대부업등의등록및금융이용자보호에관한법률위반·자본시장과금융투자업에관한법률위반·조세범처벌법위반·업무상배임","court":"대법원","date":"2021.12.16","caseType":"형사","basis":"판례내용","text":"[1] 구 대부업 등의 등록 및 금융이용자 보호에 관한 법률 제2조 제2호에서 말하는 ‘대부중개’의 의미 / 주선의 대상이 된 거래가 금전의 대부에 해당하면, 그 대부행위가 같은 법 제2조 제1호 단서, 같은 법 시행령 제2조 각호에 따라 ‘대부업’의 범위에서 제외되는 경우라도 주선행위 자체는 ‘대부중개’에 해당하는지 여부 [2] 구 대부업 등의 등록 및 금융이용자 보호에 관한 법률에서 정한 ‘대부중개’에 해당하는지 판단하는 기준 / 대부중개업 등록을 하지 않은 자가 대부의 거래당사자에게 어떠한 용역을 제공한 경우, 그 용역이 대부중개에 해당하는지에 따라 해당 용역의 제공 및 그 용역에 대한 대가 수수가 처벌 대상이 되는지가 결정되는지 여부 및 이때 특정 용역의 제공행위가 대부중개에 해당하는지 판단하는 방법","url":"https://www.law.go.kr/precInfoP.do?precSeq=231605"},{"id":"P:219775","kind":"P","label":"2020도9789","title":"특정경제범죄가중처벌등에관한법률위반(횡령)[인정된죄명:특정경제범죄가중처벌등에관한법률위반(배임)]","court":"대법원","date":"2021.12.16","caseType":"형사","basis":"참조조문","text":"[1] 가상자산 권리자의 착오나 가상자산 운영 시스템의 오류 등으로 법률상 원인관계 없이 다른 사람의 가상자산 전자지갑에 가상자산이 이체된 경우, 가상자산을 이체받은 사람이 신임관계에 기초하여 가상자산을 보존하거나 관리하는 지위에 있는지 여부 / 가상자산이 ‘재산상 이익’에 해당하는지 여부 및 가상자산에 대해 형법을 적용하면서 법정화폐와 동일하게 보호해야 하는지 여부 / 원인불명으로 재산상 이익인 가상자산을 이체받은 자가 가상자산을 사용·처분한 경우, 신의칙을 근거로 배임죄로 처벌할 수 있는지 여부 [2] 피고인이 알 수 없는 경위로 甲의 특정 거래소 가상지갑에 들어 있던 비트코인을 자신의 계정으로 이체받은 후 이를 자신의 다른 계정으로 이체하여 재산상 이익을 취득하고 甲에게 손해를 가하였다고 하여 특정경제범죄 가중처벌 등에 관한 법률 위반의 예비적 공소사실로 기소된 사안에서, 비트코인이 법률상 원인관계 없이 甲으로부터 피고인 명의의 전자지갑으로 이체되었더라도 피고인이 신임관계에 기초하여 甲의 사무를 맡아 처리하는 것으로 볼 수 없는 이상 甲에 대한 관계에서 ‘타인의 사무를 처리하는 자’에 해당하지 않는다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=219775"},{"id":"P:238075","kind":"P","label":"2021노115","title":"특정경제범죄가중처벌등에관한법률위반(사기)·특정경제범죄가중처벌등에관한법률위반(횡령)·업무상횡령·의료법위반·특정경제범죄가중처벌등에관한법률위반(사기)방조·의료법위반방조","court":"대구고등법원","date":"2021.12.15","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238075"},{"id":"P:239091","kind":"P","label":"2021노818","title":"특정경제범죄가중처벌등에관한법률위반(알선수재)","court":"서울고등법원","date":"2021.12.15","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=239091"},{"id":"P:220273","kind":"P","label":"2021가합503052","title":"손해배상(국)","court":"서울중앙지방법원","date":"2021.12.09","caseType":"민사","basis":"판례내용","text":"공사립 중등학교교사 등 임용시험 응시자 甲 등이 임용시험 직전 코로나바이러스감염증-19 확진 판정을 받았는데, 교육부장관의 위임을 받은 각 시·도 교육감이 확진자의 임용시험 응시를 제한함에 따라 甲 등이 임용시험에 응시하지 못하였고, 이에 甲 등이 국가를 상대로 위 응시제한이 위법하다는 이유로 손해배상을 구한 사안에서, 교육부장관의 위임을 받은 각 시·도 교육감이 법률유보원칙, 과잉금지원칙, 평등의 원칙을 위반하여 甲 등에 대하여 위 임용시험 응시를 제한하였으며, 이는 국가배상책임을 질 만큼 객관적 정당성을 잃었으므로, 국가는 국가배상법 제2조 제1항에 따라 甲 등이 입은 정신적 손해를 배상할 책임이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=220273"},{"id":"P:221897","kind":"P","label":"2021노253","title":"강도·폭행·업무방해·부착명령·보호관찰명령","court":"부산고등법원창원재판부","date":"2021.12.08","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=221897"},{"id":"P:231645","kind":"P","label":"2021고합247","title":"특정범죄가중처벌등에관한법률위반(향정)·마약류관리에관한법률위반(대마)","court":"부산지방법원","date":"2021.11.26","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=231645"},{"id":"P:227175","kind":"P","label":"2021노770","title":"사문서위조·위조사문서행사","court":"울산지방법원","date":"2021.11.26","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=227175"},{"id":"P:219823","kind":"P","label":"2021도2486","title":"공무상비밀누설","court":"대법원","date":"2021.11.25","caseType":"형사","basis":"참조조문","text":"공무상비밀누설죄에서 ‘법령에 의한 직무상 비밀’ 및 ‘누설’의 의미 / 공무상비밀누설죄의 보호법익 / 공무원이 직무상 알게 된 비밀을 그 직무와의 관련성 혹은 필요성에 기하여 해당 직무의 집행과 관련 있는 다른 공무원에게 직무집행의 일환으로 전달한 행위가 비밀의 누설에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=219823"},{"id":"P:219847","kind":"P","label":"2016도3452","title":"새마을금고법위반·업무상배임·특정경제범죄가중처벌등에관한법률위반(배임)(인정된죄명:업무상배임)","court":"대법원","date":"2021.11.25","caseType":"형사","basis":"참조조문","text":"[1] 업무상배임죄가 성립하려면 재산상 이익과 손해 사이에 서로 대응하는 관계에 있는 등 일정한 관련성이 인정되어야 하는지 여부 [2] 업무상배임죄에서 행위자나 제3자가 취득하는 재산상 이익의 의미 / 임무위배행위로 인하여 본인에게 재산상 손해를 가하였으나 행위자나 제3자가 재산상 이익을 취득한 사실이 없는 경우, 업무상배임죄가 성립하는지 여부 [3] 甲 새마을금고 임원인 피고인이 새마을금고의 여유자금 운용에 관한 규정을 위반하여 금융기관으로부터 원금 손실의 위험이 있는 금융상품을 매입함으로써 甲 금고에 액수 불상의 재산상 손해를 가하고 금융기관에 수수료 상당의 재산상 이익을 취득하게 하였다고 하여 업무상배임으로 기소된 사안에서, 피고인의 임무위배행위로 甲 금고에 액수 불상의 재산상 손해가 발생하였더라도 금융기관이 취득한 수수료 상당의 이익을 그와 관련성 있는 재산상 이익이라고 인정할 수 없고, 또한 위 수수료 상당의 이익은 배임죄에서의 재산상 이익에 해당한다고 볼 수도 없다는 이유로, 이와 달리 보아 공소사실을 유죄로 판단한 원심판결에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=219847"},{"id":"P:219867","kind":"P","label":"2021도10981","title":"특정경제범죄가중처벌등에관한법률위반(배임)(피고인들에 대하여 일부 인정된 죄명: 업무상배임)·업무상횡령·주택법위반","court":"대법원","date":"2021.11.25","caseType":"형사","basis":"참조조문","text":"[1] 형벌법규의 적용대상이 행정법규가 규정한 사항을 내용으로 하는 경우, 행정법규 규정의 해석 원칙 [2] 주택법 제102조 제13호에서 정한 ‘제54조 제1항을 위반하여 주택을 공급한 자’의 의미 / 주택법에 따라 주택건설사업계획의 승인을 받을 것을 예정하고 사업을 시행하려는 자가 아직 그 승인을 받기 전인 경우, 주택법 제54조 제1항에서 정한 ‘사업주체’에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=219867"},{"id":"P:219791","kind":"P","label":"2021도10903","title":"저작권법위반방조","court":"대법원","date":"2021.11.25","caseType":"형사","basis":"참조조문","text":"[1] 전송의 방법으로 공중송신권을 침해하는 게시물이나 그 게시물이 위치한 웹페이지 등에 연결되는 링크를 한 행위자가, 정범이 공중송신권을 침해한다는 사실을 충분히 인식하면서 그러한 링크를 인터넷 사이트에 영리적·계속적으로 게시하는 등으로 공중의 구성원이 개별적으로 선택한 시간과 장소에서 침해 게시물에 쉽게 접근할 수 있도록 하는 정도의 링크 행위를 한 경우, 공중송신권 침해의 방조범이 성립하는지 여부 [2] ‘법률의 착오’에 관한 형법 제16조의 취지 및 이때 ‘정당한 이유’가 있는지 판단하는 기준 [3] 법률 위반 행위 중간에 일시적으로 판례에 따라 그 행위가 처벌대상이 되지 않는 것으로 해석된 적이 있었다는 사정만으로 자신의 행위가 처벌되지 않는 것으로 믿은 데에 ‘정당한 이유’가 있다고 할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=219791"},{"id":"P:228507","kind":"P","label":"2021두46414","title":"수입통관보류처분취소","court":"대법원","date":"2021.11.25","caseType":"세무","basis":"판례내용","text":"[1] 구 관세법 제234조 제1호가 규정하는 ‘풍속을 해치는’의 의미와 판단 기준 [2] 아동·청소년의 성보호에 관한 법률 제2조 제5호의 의미와 규정 취지 [3] 甲이 여성의 신체 외관을 본뜬 전신 인형 형태의 남성용 자위기구를 수입신고 하였으나, 관할 세관장이 구 관세법 제234조 제1호 에 해당한다는 이유로 위 물품의 수입통관을 보류하는 처분을 한 사안에서, 위 물품은 구 관세법 제234조 제1호가 규정한 ‘풍속을 해치는 물품’에 해당한다고 볼 여지가 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=228507"},{"id":"P:219833","kind":"P","label":"2021두46421","title":"수입통관보류처분취소","court":"대법원","date":"2021.11.25","caseType":"세무","basis":"판례내용","text":"[1] 구 관세법 제234조 제1호가 규정하는 ‘풍속을 해치는’의 의미와 판단 기준 [2] 아동·청소년의 성보호에 관한 법률 제2조 제5호의 의미와 규정 취지 [3] 甲이 여성의 신체 외관을 본뜬 전신 인형 형태의 남성용 자위기구를 수입신고 하였으나, 관할 세관장이 구 관세법 제234조 제1호 등에 해당한다는 이유로 위 물품의 수입통관을 보류하는 처분을 한 사안에서, 위 물품은 구 관세법 제234조 제1호가 규정한 ‘풍속을 해치는 물품’에 해당한다고 볼 여지가 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=219833"},{"id":"P:219841","kind":"P","label":"2018도1346","title":"강요[피고인이 피해자 주택 대문 바로 앞에 차량을 주차하여 피해자가 차량을 주차장에 출입할 수 없도록 한 것이 강요죄의 폭행에 해당하는지 문제된 사건]","court":"대법원","date":"2021.11.25","caseType":"형사","basis":"참조조문","text":"[1] 강요죄에서 ‘폭행’의 의미 및 사람에 대한 간접적인 유형력의 행사를 강요죄의 폭행으로 평가하기 위하여 고려해야 할 사항 [2] 피고인이 甲과 공모하여 甲 소유의 차량을 乙 소유 주택 대문 바로 앞부분에 주차하는 방법으로 乙이 차량을 주택 내부의 주차장에 출입시키지 못하게 함으로써 乙의 차량 운행에 관한 권리행사를 방해하였다는 내용으로 기소된 사안에서, 피고인이 乙을 폭행하여 차량 운행에 관한 권리행사를 방해하였다고 평가하기 어렵다는 이유로, 이와 달리 본 원심판결에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=219841"},{"id":"P:228497","kind":"P","label":"2019도7342","title":"성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영)","court":"대법원","date":"2021.11.25","caseType":"형사","basis":"판례내용","text":"[1] 전자정보를 압수하고자 하는 수사기관이 정보저장매체와 거기에 저장된 전자정보를 임의제출의 방식으로 압수할 때 임의제출자의 의사에 따른 전자정보 압수의 대상과 범위가 명확하지 않거나 이를 알 수 없는 경우, 임의제출에 따른 압수의 동기가 된 범죄혐의사실과 관련되고 이를 증명할 수 있는 최소한의 가치가 있는 전자정보에 한하여 압수의 대상이 되는지 여부 및 이때 범죄혐의사실과의 관련성이 인정되는 범위 [2] 휴대전화를 이용한 불법촬영 범죄와 같이 범죄의 속성상 해당 범행의 상습성이 의심되거나 성적 기호 내지 경향성의 발현에 따른 일련의 범행의 일환으로 이루어진 것으로 의심되고, 범행의 직접증거가 휴대전화 안에 이미지 파일이나 동영상 파일의 형태로 남아 있을 개연성이 있는 경우, 그 안에 저장되어 있는 같은 유형의 전자정보에서 발견되는 간접증거나 정황증거는 범죄혐의사실과 구체적·개별적 연관관계가 인정될 수 있는지 여부 [3] 피의자가 소유·관리하는 정보저장매체를 피의자 아닌 피해자 등 제3자가 임의제출하는 경우, 임의제출의 동기가 된 범죄혐의사실과 구체적·개별적 연관관계가 있는 전자정보에 한하여 압수의 대상이 되는 것으로 더욱 제한적으로 해석하여야 하는지 여부 [4] 압수의 대상이 되는 전자정보와 그렇지 않은 전자정보가 혼재된 정보저장매체나 복제본을 임의제출받은 수사기관이 정보저장매체 등을 수사기관 사무실 등으로 옮겨 탐색·복제·출력하","url":"https://www.law.go.kr/precInfoP.do?precSeq=228497"},{"id":"P:221821","kind":"P","label":"2021노1914","title":"마약류관리에관한법률위반(향정)·출입국관리법위반","court":"창원지방법원","date":"2021.11.25","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=221821"},{"id":"P:237277","kind":"P","label":"2021노2136","title":"업무방해·전자금융거래법위반","court":"인천지방법원","date":"2021.11.25","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=237277"},{"id":"P:220353","kind":"P","label":"2021노83","title":"강간치상·마약류관리에관한법률위반(향정)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영)·강제추행·특정경제범죄가중처벌등에관한법률위반(사기)·사기·공문서위조·위조공문서행사·부착명령","court":"부산고등법원","date":"2021.11.24","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=220353"},{"id":"P:228437","kind":"P","label":"2020노433","title":"자동차관리법위반","court":"서울북부지방법원","date":"2021.11.18","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=228437"},{"id":"P:234495","kind":"P","label":"2020노1436","title":"명예훼손·모욕·업무방해·폭행","court":"서울서부지방법원","date":"2021.11.18","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=234495"},{"id":"P:219849","kind":"P","label":"2021도7831","title":"특정경제범죄가중처벌등에관한법률위반(사기)(예비적죄명:조세범처벌법위반)·사기미수·사문서위조·위조사문서행사·전자금융거래법위반·사기(예비적죄명:조세범처벌법위반)·사기방조(예비적죄명:조세범처벌법위반방조)","court":"대법원","date":"2021.11.11","caseType":"형사","basis":"참조조문","text":"기망행위에 의하여 국가적 또는 공공적 법익을 침해한 경우, 형법상 사기죄가 성립하기 위한 요건 / 기망행위에 의하여 조세를 포탈하거나 조세의 환급·공제를 받은 경우, 형법상 사기죄가 성립하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=219849"},{"id":"P:219875","kind":"P","label":"2021노802","title":"주거침입·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영)·상해","court":"울산지방법원","date":"2021.11.05","caseType":"형사","basis":"판례내용","text":"피고인이 별거 상태로 이혼소송 중이던 배우자 甲이 거주하는 원룸에 베란다를 통해 들어가 甲이 乙과 속옷만 입고 침대에 나란히 누워 끌어안고 있는 장면을 자신의 휴대전화로 촬영함으로써 甲, 乙의 의사에 반하여 성적 욕망 또는 수치심을 유발할 수 있는 甲, 乙의 신체를 촬영하였다고 하여 성폭력범죄의 처벌 등에 관한 특례법 위반으로 기소된 사안에서, 제반 사정을 종합하면 피고인이 甲, 乙의 성적 수치심을 유발할 수 있는 신체 부위를 촬영하였다고 인정할 수 있으므로, 이와 달리 보아 공소사실을 무죄로 판단한 제1심판결에 사실오인 또는 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=219875"},{"id":"P:234005","kind":"P","label":"2021노54","title":"업무방해·위증·증거위조교사·건설산업기본법위반·위계공무집행방해","court":"대구고등법원","date":"2021.11.04","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=234005"},{"id":"P:218449","kind":"P","label":"2020도1942","title":"개인정보보호법위반부정처사후수뢰·형사사법절차전자화촉진법위반·공무상비밀누설·직무유기·위계공무집행방해·무고·성매매알선등행위의처벌에관한법률위반(성매매)","court":"대법원","date":"2021.10.28","caseType":"형사","basis":"판례내용","text":"구 개인정보 보호법 제74조 제2항 양벌규정의 취지 및 위 양벌규정에 의하여 개인정보처리자 아닌 행위자도 같은 법 제71조 제2호, 제18조 제1항 벌칙규정의 적용대상이 되는지 여부 / ‘법인격 없는 공공기관’을 위 양벌규정에 의하여 처벌할 수 있는지 여부 및 이 경우 행위자를 위 양벌규정으로 처벌할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=218449"},{"id":"P:227111","kind":"P","label":"2020노2055","title":"도시및주거환경정비법위반","court":"서울북부지방법원","date":"2021.10.28","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=227111"},{"id":"P:219555","kind":"P","label":"2021도10010","title":"공갈·사기·도박·특수중감금·폭행","court":"대법원","date":"2021.10.28","caseType":"형사","basis":"참조조문","text":"반의사불벌죄에서 처벌을 희망하는 의사표시의 철회 또는 처벌을 희망하지 않는 의사표시를 할 수 있는 시기 / 피해자가 처벌을 희망하지 않는 의사표시나 처벌을 희망하는 의사표시의 철회를 하였다고 인정하기 위한 요건 / 처벌을 희망하지 않는 의사표시의 부존재가 법원의 직권조사사항에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=219555"},{"id":"P:219557","kind":"P","label":"2021도7538","title":"강제추행(예비적죄명:폭행)","court":"대법원","date":"2021.10.28","caseType":"형사","basis":"참조조문","text":"[1] ‘추행’의 의미 및 추행에 해당하는지 판단하는 기준 / 추행행위에 해당하기 위해서는 대상자가 성적 수치심이나 혐오감을 반드시 실제로 느껴야 하는지 여부 [2] 피고인이 아파트 놀이터의 의자에 앉아 전화통화를 하고 있던 甲의 뒤로 몰래 다가가 甲의 머리카락 및 옷 위에 소변을 보아 강제추행하였다는 내용으로 기소된 사안에서, 피고인이 처음 보는 여성인 甲의 뒤로 몰래 접근하여 성기를 드러내고 甲을 향한 자세에서 甲의 등 쪽에 소변을 본 행위는 객관적으로 일반인에게 성적 수치심이나 혐오감을 일으키게 하고 선량한 성적 도덕관념에 반하는 행위로서 甲의 성적 자기결정권을 침해하는 추행행위에 해당한다고 볼 여지가 있고, 행위 당시 甲이 이를 인식하지 못하였더라도 마찬가지라는 이유로, 이와 달리 보아 공소사실을 무죄로 판단한 원심판결에 법리오해 및 심리미진의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=219557"},{"id":"P:219559","kind":"P","label":"2016도3986","title":"업무방해","court":"대법원","date":"2021.10.28","caseType":"형사","basis":"참조조문","text":"업무방해죄에서 말하는 ‘위력’의 의미 및 위력에 해당하는지 판단하는 기준 / 업무방해죄가 성립하기 위해서는 업무방해의 결과가 실제로 발생하여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=219559"},{"id":"P:233531","kind":"P","label":"2020고단583","title":"폭력행위등처벌에관한법률위반(공동상해)·업무방해·폭행(공소기각)·특수상해·특수협박·강요·상해·도로교통법위반(음주측정거부)·약사법위반·폭력행위등처벌에관한법률위반(공동재물손괴등)·도로교통법위반(무면허운전)","court":"창원지방법원밀양지원","date":"2021.10.26","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233531"},{"id":"P:602007","kind":"P","label":"2020노5733","title":"주택법위반·위헌심판제청","court":"수원지방법원","date":"2021.10.22","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=602007"},{"id":"P:240629","kind":"P","label":"2020노1148","title":"허위진단서작성·업무상과실치사","court":"울산지방법원","date":"2021.10.21","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=240629"},{"id":"P:223463","kind":"P","label":"2021노1048","title":"도로교통법위반(음주측정거부)·교통사고처리특례법위반·도로교통법위반(무면허운전)","court":"창원지방법원","date":"2021.10.21","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=223463"},{"id":"P:227065","kind":"P","label":"2021도8719","title":"특정범죄자에대한보호관찰및전자장치부착등에관한법률위반·재물손괴","court":"대법원","date":"2021.10.14","caseType":"형사","basis":"참조조문","text":"형법 제37조 후단의 경합범 중 아직 판결을 받지 아니한 죄가 이미 판결이 확정된 죄와 동시에 판결할 수 없었던 경우, 형법 제39조 제1항에 따라 동시에 판결할 경우와 형평을 고려하여 형을 선고하거나 형을 감경 또는 면제할 수 있는지 여부 / 판결이 확정된 선거범죄와 확정되지 아니한 다른 죄에 대하여 형법 제39조 제1항이 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=227065"},{"id":"P:219619","kind":"P","label":"2016도16343","title":"특정경제범죄가중처벌등에관한법률위반(사기)ㆍ사기ㆍ시설물의안전관리에관한특별법위반ㆍ뇌물공여","court":"대법원","date":"2021.10.14","caseType":"형사","basis":"참조조문","text":"[1] 구 시설물의 안전관리에 관한 특별법 제9조의3에서 금지하는 ‘명의대여’의 의미 / 어떤 안전진단전문기관의 명의로 도급된 안전진단 용역의 전부 또는 대부분을 다른 사람이 맡아서 수행하였으나 안전진단전문기관 자신이 안전진단 용역에 실질적으로 관여할 의사로 수급하였고 용역 수행 과정에 실질적으로 관여하여 온 경우, 명의대여에 해당하는지 여부 및 이때 안전진단전문기관이 안전진단 용역의 수행에 실질적으로 관여하였는지 판단하는 기준 [2] 사기죄의 성립 요건 / 사기죄의 주관적 구성요건인 불법영득의 의사 내지 편취의 범의 유무를 판단하는 기준 및 특히 도급계약에서 편취의 범의가 있었는지 판단하는 기준 시점과 판단 방법 [3] 사기죄의 보호법익 / 기망행위에 의하여 국가적 또는 공공적 법익이 침해되었다는 사정만으로 사기죄가 성립하는지 여부 / 도급계약 당시 관련 영업 또는 업무를 규제하는 행정법규나 입찰 참가자격, 계약절차 등에 관한 규정을 위반한 사정만으로 도급계약을 체결한 행위가 기망행위에 해당한다고 단정할 수 있는지 여부 및 이때 심리ㆍ판단하여야 할 사항 [4] 안전진단전문기관으로 등록된 甲 주식회사를 운영하는 피고인 乙이 안전진단 용역을 낙찰받으면 나머지 피고인들이 운영하는 독립채산 하도급 업체들에 도급금액의 약 60%로 하도급하기로 나머지 피고인들과 공모한 다음, 甲 회사 명의로 다수의 안전진단 용역 입찰에 참가하여 마치 甲 회사","url":"https://www.law.go.kr/precInfoP.do?precSeq=219619"},{"id":"P:219571","kind":"P","label":"2021도9693","title":"전기통신사업법위반","court":"대법원","date":"2021.10.14","caseType":"형사","basis":"판례내용","text":"전기통신사업법 제30조 본문 및 제2조 제6호에서 정한 ‘타인의 통신을 매개’한다는 것과 ‘타인의 통신용으로 제공’한다는 것의 의미 / 통신이 매개되거나 전기통신역무를 제공받은 타인이 통신의 매개 또는 제공을 요청하였거나 통신의 매개 또는 제공 행위에 관여하였던 경우 또는 매개 또는 제공 행위를 한 자와 공범 관계에 있는 경우에도 매개 또는 제공 행위는 위 각 조항에서 정한 ‘타인의 통신을 매개’하는 행위 또는 ‘타인의 통신용으로 제공’하는 행위에 해당할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=219571"},{"id":"P:227063","kind":"P","label":"2021도7168","title":"국민체육진흥법위반ㆍ정보통신망이용촉진및정보보호등에관한법률위반(음란물유포)","court":"대법원","date":"2021.10.14","caseType":"형사","basis":"참조조문","text":"[1] 형법 제48조에서 몰수의 대상으로 규정한 ‘물건’의 의미 [2] 피고인이 甲, 乙과 공모하여 정보통신망을 통하여 음란한 화상 또는 영상을 배포하고, 도박 사이트를 홍보하였다는 공소사실로 기소되었는데, 원심이 공소사실을 유죄로 인정하면서 피고인이 범죄행위에 이용한 웹사이트 매각을 통해 취득한 대가를 추징한 사안에서, 피고인이 위 웹사이트 매각을 통해 취득한 대가는 형법 제48조 제1항 제2호, 제2항이 규정한 추징의 대상에 해당하지 않는다는 이유로, 이와 달리 보아 위 웹사이트 매각대금을 추징한 원심판결에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=227063"},{"id":"P:227045","kind":"P","label":"2017도10634","title":"부동산가격공시및감정평가에관한법률위반[감정평가업자가 아닌 피고인들이 법원 행정재판부로부터 수용 대상 토지상에 재배되고 있는 산양삼의 손실보상액 평가를 의뢰받고 감정서를 작성하여 제출한 사건]","court":"대법원","date":"2021.10.14","caseType":"형사","basis":"참조조문","text":"구 부동산 가격공시 및 감정평가에 관한 법률에서 감정평가사 자격을 갖춘 사람만이 감정평가업을 독점적으로 영위할 수 있도록 한 취지 / 민사소송법 제335조에 따른 법원의 감정인 지정결정 또는 같은 법 제341조 제1항에 따른 법원의 감정촉탁을 받은 경우, 감정평가업자가 아닌 사람이더라도 그 감정사항에 포함된 토지 등의 감정평가를 할 수 있는지 여부 및 이러한 행위가 형법 제20조의 정당행위에 해당하여 위법성이 조각되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=227045"},{"id":"P:227059","kind":"P","label":"2021다242154","title":"토지인도[토지인도청구가 권리남용에 해당하는지 판단방법]","court":"대법원","date":"2021.10.14","caseType":"민사","basis":"참조조문","text":"[1] 일반 공중의 통행에 공용된 도로의 통행을 방해함으로써 특정인의 통행 자유를 침해한 경우, 민법상 불법행위에 해당하는지 여부 및 이때 침해를 받은 자가 통행방해 행위의 금지를 소구할 수 있는지 여부 [2] 형법 제185조의 일반교통방해죄에서 말하는 ‘육로’의 의미 및 어떤 도로가 일반 공중의 통행에 제공된 도로에 해당하는 경우, 일반 공중의 교통안전 등 자유로운 통행이 형법상 일반교통방해죄의 보호법익으로 보장되는지 여부 [3] 권리의 행사에 해당하는 외관을 지닌 어떠한 행위가 권리남용에 해당하는지 판단하는 기준 [4] 일반 공중의 통행에 공용되는 도로 부지의 소유자가 이를 점유ㆍ관리하는 지방자치단체를 상대로 도로의
