 철거, 점유 이전 또는 통행금지를 청구하는 것이 권리남용에 해당하는지 여부 [5] 甲 주식회사가 마을 주민 등의 통행로로 주요 마을안길의 일부를 이루고 있는 토지가 위치한 부동산을 매수하였고, 그 후 乙 지방자치단체가 통행로 부분을 도로로 포장하여 현재까지 마을 주민들과 차량 등의 통행로로 사용되고 있는데, 甲 회사가 乙 지방자치단체를 상대로 도로 부분의 인도를 구한 사안에서, 제반 사정에 비추어 甲 회사의 청구는 객관적으로 사회질서에 위반되는 것으로서 권리남용에 해당하거나 신의칙에 반하여 허용되지 않는다고 본 원심판단이 정당하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=227059"},{"id":"P:227049","kind":"P","label":"2018도2993","title":"공무집행방해·일반교통방해·집회및시위에관한법률위반","court":"대법원","date":"2021.10.14","caseType":"형사","basis":"참조조문","text":"[1] 공무집행방해죄의 전제인 ‘공무집행의 적법성’의 요건과 판단 기준 [2] 구 경찰관 직무집행법 제6조 제1항에 따른 경찰관의 제지 조치가 범죄의 예방을 위한 경찰 행정상 즉시강제에 해당하는지 여부 [3] 피고인들을 포함한 ‘甲 주식회사 희생자 추모와 해고자 복직을 위한 범국민대책위원회’가 덕수궁 대한문 화단 앞 인도를 불법적으로 점거한 뒤 천막ㆍ분향소 등을 설치하고 농성을 계속하다가 관할 구청이 행정대집행으로 농성 장소에 있던 물건을 치웠음에도 대책위 관계자들이 이에 대한 항의의 일환으로 기자회견 명목의 집회를 개최하려고 하자, 출동한 경찰 병력이 농성 장소를 둘러싼 채 대책위 관계자들의 농성 장소 진입을 제지하는 과정에서 피고인들이 경찰관을 밀치는 등으로 공무집행을 방해하였다는 내용으로 기소된 사안에서, 경찰의 농성 장소에 대한 점거와 대책위의 집회 개최를 제지한 직무집행이 ‘위법한 공무집행’이라고 본 원심판단에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=227049"},{"id":"P:602009","kind":"P","label":"2021노104","title":"도시및주거환경정비법위반","court":"서울남부지방법원","date":"2021.10.14","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=602009"},{"id":"P:218377","kind":"P","label":"2021고합247","title":"폭행치사ㆍ폭행","court":"광주지방법원","date":"2021.10.08","caseType":"형사","basis":"참조조문","text":"피고인과 甲은 일용근로를 함께하는 관계로서, 피고인이 밤에 인력사무소 숙소에서 잠을 자던 중 甲이 술에 취한 상태로 찾아와 주먹과 발로 피고인을 때리고, 부엌에서 칼을 찾으려고 시도하다가 헤어스프레이 통으로 甲 자신의 머리를 여러 번 내리쳐 자해를 하는 등 위협적인 행동을 하자, 유도의 조르기 기술과 유사한 방법을 사용하여 왼팔로 甲의 목을 감아 바닥에 넘어뜨리고, 계속하여 오른손으로 甲의 목을 감은 왼팔을 잡아 甲의 목을 약 10분 동안 조르듯이 압박하였는데, 甲은 일시적으로 심정지를 일으켰다가 병원으로 후송되어 치료를 받다가 5일 뒤에 사망한 사안에서, 피고인의 행위는 사회통념상 허용될 만한 정도의 상당성이 없어 정당방위나 긴급피난에 해당하지 않고, 정황에 따라 그 형을 감경하거나 면제할 수 있는 과잉방위 또는 과잉피난에 해당한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=218377"},{"id":"P:220381","kind":"P","label":"2020노3201","title":"공무집행방해(인정된죄명:폭행)","court":"창원지방법원","date":"2021.09.30","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=220381"},{"id":"P:218701","kind":"P","label":"2020도3996","title":"업무상과실치사ㆍ업무상과실치상ㆍ산업안전보건법위반[대형 조선소 작업 현장에서 크레인끼리 충돌하여 근로자들이 사망 및 부상당한 사건]","court":"대법원","date":"2021.09.30","caseType":"형사","basis":"판례내용","text":"[1] 구 산업안전보건법에서 정한 안전ㆍ보건조치 의무를 위반하였는지 판단하는 방법 [2] 대규모 조선소 작업 현장에서 크레인 간 충돌 사고로 여러 명의 근로자들이 사망하거나 부상당하여 사업주인 甲 주식회사와 협력업체 대표 乙이 구 산업안전보건법 위반으로 기소된 사안에서, 甲 회사 등에게는 구 산업안전보건법 제23조 등 규정에 따라 크레인 간 충돌로 인한 산업안전사고 예방에 합리적으로 필요한 정도의 안전조치 의무가 부과되어 있다고 해석되는데, 甲 회사 등은 작업계획서에 충돌 사고를 방지할 수 있는 구체적인 조치를 포함시키지 않는 등 그 의무를 다하지 아니하였다고 보아, 이와 달리 공소사실을 무죄로 판단한 원심판결에 구 산업안전보건법 제23조에서 정한 사업주의 안전조치 의무 등에 관한 법리오해의 위법이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=218701"},{"id":"P:219581","kind":"P","label":"2020도2641","title":"배임증재","court":"대법원","date":"2021.09.30","caseType":"형사","basis":"참조조문","text":"[1] 2016. 5. 29. 개정된 형법 제357조 제1항에서 배임수재죄의 구성요건에 ‘제3자로 하여금 재물이나 재산상 이익을 취득하게 하는 행위’를 추가한 취지 / 개정 형법 제357조 제1항에서 정한 ‘제3자’에 사무처리를 위임한 ‘타인’이 포함되는지 여부 [2] 신문사 기자들이 홍보성 기사를 게재하는 대가로 기자들이 소속된 신문사들이 피고인으로부터 돈을 교부받은 사안에서, 배임증재죄의 성립을 부정한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=219581"},{"id":"P:218705","kind":"P","label":"2019도17102","title":"배임수재ㆍ부정청탁및금품등수수의금지에관한법률위반[신문사 기자들이 홍보성 기사를 작성해달라는 청탁을 받고 소속 신문사 계좌로 금원을 입금 받은 행위가 배임수재죄에 해당하는지 여부가 문제된 사건]","court":"대법원","date":"2021.09.30","caseType":"형사","basis":"참조조문","text":"[1] 배임수재죄에서 ‘부정한 청탁’의 의미 및 판단 기준 / 보도의 대상이 되는 자가 언론사 소속 기자에게 ‘유료 기사’ 게재를 청탁하는 행위가 배임수재죄의 부정한 청탁에 해당하는지 여부 및 ‘유료 기사’의 내용이 객관적 사실과 부합하더라도 마찬가지인지 여부 [2] 2016. 5. 29. 개정된 형법 제357조 제1항에서 배임수재죄의 구성요건에 ‘제3자로 하여금 재물이나 재산상 이익을 취득하게 하는 행위’를 추가한 취지 / 개정 형법 제357조 제1항에서 정한 ‘제3자’에 사무처리를 위임한 타인이 포함되는지 여부 및 부정한 청탁에 따른 재물이나 재산상 이익이 외형상 사무처리를 위임한 타인에게 지급된 것으로 보이더라도 배임수재죄가 성립할 수 있는 경우","url":"https://www.law.go.kr/precInfoP.do?precSeq=218705"},{"id":"P:219615","kind":"P","label":"2021도5777","title":"아동·청소년의성보호에관한법률위반(강간등치상)","court":"대법원","date":"2021.09.30","caseType":"형사","basis":"참조조문","text":"[1] 사실심법원이 갖는 양형에 관한 재량의 내재적 한계 [2] 사실심 변론종결 후 검사나 피해자 등에 의해 피고인에게 불리한 새로운 양형조건에 관한 자료가 법원에 제출된 경우, 사실심법원이 취할 조치 [3] 아동·청소년의 성보호에 관한 법률 위반죄로 1심에서 유죄가 인정되어 징역 4년을 선고받은 피고인의 항소심에서, 변론종결 후 제출된 피해자의 사망진단서를 근거로 피해자가 피고인의 범행으로 인한 고통 때문에 자살하였다고 단정한 뒤, 변론을 재개하여 새로운 양형조건에 관하여 추가로 심리하지 않은 채 이를 가중적 양형조건의 중대한 변경 사유로 보아 제1심판결을 파기하고 양형기준의 권고형을 넘어 징역 9년을 선고한 사안에서, 원심의 조치에 변론종결 후 피고인에게 불리한 양형자료가 제출된 경우 사실심법원이 취해야 할 양형심리절차에 관한 법리를 오해한 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=219615"},{"id":"P:221827","kind":"P","label":"2021고합123","title":"특정범죄가중처벌등에관한법률위반(운전자폭행등)·재물손괴·특정범죄가중처벌등에관한법률위반(도주치상)·도로교통법위반(사고후미조치)·도로교통법위반(음주운전)·도로교통법위반(무면허운전)·특정범죄가중처벌등에관한법률위반(위험운전치상)·배상명령신청","court":"부산지방법원","date":"2021.09.24","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=221827"},{"id":"P:219635","kind":"P","label":"2021도5000","title":"아동학대범죄의처벌등에관한특례법위반(아동학대치사)·아동복지법위반(상습아동학대)","court":"대법원","date":"2021.09.16","caseType":"형사","basis":"참조조문","text":"피해아동 甲의 친모인 피고인 乙이 자신과 연인관계인 피고인 丙과 공모하여 甲을 지속적으로 학대함으로써 사망에 이르게 하였다는 공소사실에 대하여 구 아동학대범죄의 처벌 등에 관한 특례법 제4조, 제2조 제4호 목, 형법 제257조 제1항, 제30조를 적용법조로 공소가 제기된 사안에서, 구 아동학대범죄의 처벌 등에 관한 특례법 제4조, 제2조 제4호 목 내지 목은 보호자가 같은 법 제2조 제4호 목 내지 목에서 정한 아동학대범죄를 범하여 그 아동을 사망에 이르게 한 경우를 처벌하는 규정으로 형법 제33조 본문의 ‘신분관계로 인하여 성립될 범죄’에 해당하므로, 피고인 丙에 대해 형법 제33조 본문에 따라 구 아동학대범죄의 처벌 등에 관한 특례법 위반죄의 공동정범이 성립하고 같은 법 제4조에서 정한 형에 따라 과형이 이루어져야 한다는 이유로, 이와 달리 피고인 丙 대하여 형법 제33조 단서를 적용하여 형법 제259조 제1항의 상해치사죄에서 정한 형으로 처단한 원심판단에 법리오해의 위법이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=219635"},{"id":"P:233369","kind":"P","label":"2018고합119","title":"특정범죄가중처벌등에관한법률위반(허위세금계산서교부등)·조세범처벌법위반","court":"대전지방법원홍성지원","date":"2021.09.16","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233369"},{"id":"P:217781","kind":"P","label":"2015도12632","title":"특수공무집행방해치상·업무방해·폭력행위등처벌에관한법률위반(공동재물손괴등)·건조물침입","court":"대법원","date":"2021.09.16","caseType":"형사","basis":"참조조문","text":"[1] 공무집행방해죄에서 ‘적법한 공무집행’의 의미와 판단 기준 / 공무원이 구체적 상황에 비추어 그 인적ㆍ물적 능력의 범위 내에서 적절한 조치라는 판단에 따라 직무를 수행한 경우, 그 위법 여부 [2] 쟁의행위가 업무방해죄에 해당한다는 정을 알면서 제3자가 쟁의행위의 실행을 용이하게 한 경우, 업무방해방조죄가 성립할 수 있는지 여부 / 위법한 쟁의행위에 대한 조력행위가 업무방해방조에 해당하는지 판단할 때 유의하여야 할 사항 [3] 방조범이 성립하기 위한 요건 / 정범의 범죄 실현과 밀접한 관련이 없는 행위를 도와준 데 지나지 않는 경우, 방조범이 성립하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=217781"},{"id":"P:217785","kind":"P","label":"2019도18394","title":"뇌물수수ㆍ허위공문서작성ㆍ허위작성공문서행사","court":"대법원","date":"2021.09.16","caseType":"형사","basis":"참조조문","text":"[1] 공문서를 작성하는 과정에서 법령 등을 잘못 적용하거나 적용하여야 할 법령 등을 적용하지 아니한 잘못이 있으나 그 적용의 전제가 된 사실관계에 관하여 거짓된 기재가 없는 경우, 허위공문서작성죄가 성립하는지 여부 및 그와 같은 잘못이 공무원의 고의에 기한 것이라도 마찬가지인지 여부 [2] 지방자치단체에서 발주ㆍ시행한 교량 공사의 현장감독관인 피고인이, ‘지방자치단체 입찰 및 계약 집행기준’에 따르면 자재의 제작이 완료되었더라도 현장에 반입되어 시공되지 않은 이상 기성부분으로 인정할 수 없고 예외적으로 제작 공장에서 기성검사를 실시ㆍ합격한 경우에 한하여 50% 한도 내에서만 기성고 비율을 인정하여야 함에도, 현장에 반입되지 않아 그 시공이 이루어지지 않은 교량 구조물인 ‘주탑’이 100% 제작되었음을 전제로 공사 전체의 기성고 비율과 기성부분 준공액을 산정ㆍ기재함으로써 허위의 기성검사조서를 작성하였다는 내용으로 기소된 사안에서, 위 조서에는 위 기준 적용의 전제가 되는 사실관계, 즉 주탑 등 자재의 제작 및 현장 반입 여부 등에 관하여 아무런 기재가 없으므로 피고인이 위 기준 적용의 전제가 되는 사실관계에 관하여 허위로 기재할 여지가 없다는 등의 이유로, 위 조서가 허위의 공문서에 해당한다고 본 원심판단에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=217785"},{"id":"P:226987","kind":"P","label":"2021고단2713","title":"국민체육진흥법위반","court":"대구지방법원","date":"2021.09.14","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=226987"},{"id":"P:219383","kind":"P","label":"2021도2030","title":"직권남용권리행사방해","court":"대법원","date":"2021.09.09","caseType":"형사","basis":"참조조문","text":"[1] 공무원이 동일한 사안에 관한 일련의 직무집행 과정에서 단일하고 계속된 범의로 일정 기간 계속하여 저지른 직권남용행위에 대하여는 그 상대방이 여러 명이더라도 포괄일죄가 성립할 수 있는지 여부 및 개별 사안에서 포괄일죄가 성립하는지 판단하는 기준 [2] 직권남용권리행사방해죄에서 말하는 ‘사람으로 하여금 의무 없는 일을 하게 한 때’의 의미 / 공무원이 자신의 직무권한에 속하는 사항에 관하여 실무 담당자로 하여금 직무집행을 보조하게 하는 행위가 ‘의무 없는 일을 하게 한 때’에 해당하는 경우 및 이에 해당하는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=219383"},{"id":"P:217431","kind":"P","label":"2020도6085","title":"폭력행위등처벌에관한법률위반(공동재물손괴등)·폭력행위등처벌에관한법률위반(공동주거침입)·폭력행위등처벌에관한법률위반(공동상해)","court":"대법원","date":"2021.09.09","caseType":"형사","basis":"참조조문","text":"[1] 공동거주자 중 한 사람이 법률적인 근거 기타 정당한 이유 없이 다른 공동거주자가 공동생활의 장소에 출입하는 것을 금지하였는데 다른 공동거주자가 이에 대항하여 공동생활의 장소에 들어간 경우, 주거침입죄가 성립하는지 여부 및 그 공동거주자가 공동생활의 장소에 출입하기 위하여 출입문의 잠금장치를 손괴하는 등 다소간의 물리력을 행사하여 그 출입을 금지한 공동거주자의 사실상 평온상태를 해쳤더라도 마찬가지인지 여부 / 이때 그 공동거주자의 승낙을 받아 공동생활의 장소에 함께 들어간 외부인의 출입 및 이용행위가 전체적으로 그의 출입을 승낙한 공동거주자의 통상적인 공동생활 장소의 출입 및 이용행위의 일환이자 이에 수반되는 행위로 평가할 수 있는 경우, 그 외부인에 대하여 주거침입죄가 성립하는지 여부 [2] 피고인 甲은 처 乙과의 불화로 인해 乙과 공동생활을 영위하던 아파트에서 짐 일부를 챙겨 나왔는데, 그 후 자신의 부모인 피고인 丙, 丁과 함께 아파트에 찾아가 출입문을 열 것을 요구하였으나 乙은 외출한 상태로 乙의 동생인 戊가 출입문에 설치된 체인형 걸쇠를 걸어 문을 열어 주지 않자 공동하여 걸쇠를 손괴한 후 아파트에 침입하였다고 하여 폭력행위 등 처벌에 관한 법률 위반으로 기소된 사안에서, 아파트에 대한 공동거주자의 지위를 계속 유지하고 있던 피고인 甲에게 주거침입죄가 성립한다고 볼 수 없고, 피고인 丙, 丁에 대하여도 같은 법 위반죄가","url":"https://www.law.go.kr/precInfoP.do?precSeq=217431"},{"id":"P:217449","kind":"P","label":"2019도16421","title":"미성년자유인(인정된죄명:미성년자약취)","court":"대법원","date":"2021.09.09","caseType":"형사","basis":"참조조문","text":"[1] 미성년자약취죄의 구성요건요소로서 ‘약취’의 의미 및 약취에 해당하는지 판단하는 기준 [2] 부모가 이혼하였거나 별거하는 상황에서 미성년의 자녀를 부모의 일방이 평온하게 보호ㆍ양육하고 있는데, 상대방 부모가 폭행, 협박 또는 불법적인 사실상의 힘을 행사하여 그 보호ㆍ양육 상태를 깨뜨리고 자녀를 자기 또는 제3자의 사실상 지배하에 옮긴 행위가 미성년자에 대한 약취죄를 구성하는지 여부 [3] 피고인과 甲은 각각 한국과 프랑스에서 따로 살며 이혼소송 중인 부부로서 자녀인 피해아동 乙은 프랑스에서 甲과 함께 생활하였는데, 피고인이 乙을 면접교섭하기 위하여 그를 보호ㆍ양육하던 甲으로부터 乙을 인계받아 국내로 데려온 후 면접교섭 기간이 종료하였음에도 乙을 데려다주지 아니한 채 甲과 연락을 두절한 후 법원의 유아인도명령 등에도 불응한 사안에서, 피고인의 행위가 미성년자약취죄의 약취행위에 해당한다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=217449"},{"id":"P:234953","kind":"P","label":"2017도19025","title":"저작권법위반방조","court":"대법원","date":"2021.09.09","caseType":"형사","basis":"판례내용","text":"[1] 공중송신권을 침해하는 게시물이나 그 게시물이 위치한 웹페이지 등에 연결되는 링크를 한 행위가 공중송신권 침해에 해당하는지 여부 [2] 정범이 공중송신권을 침해하는 게시물을 인터넷 웹사이트 서버 등에 업로드하여 공중의 구성원이 개별적으로 선택한 시간과 장소에서 접근할 수 있도록 이용에 제공한 후 침해 게시물을 서버에서 삭제하는 등으로 게시를 철회하지 않는 경우, 정범의 범죄행위가 방조의 대상이 될 수 있는지 여부 / 공중송신권을 침해하는 게시물인 영상저작물에 연결되는 링크를 자신이 운영하는 사이트에 영리적ㆍ계속적으로 게시한 행위가 전송의 방법으로 공중송신권을 침해한 정범의 범죄를 방조한 행위에 해당하는지 여부 / 공중송신권 침해에 대한 방조가 성립하지 않는 경우","url":"https://www.law.go.kr/precInfoP.do?precSeq=234953"},{"id":"P:217423","kind":"P","label":"2020도12630","title":"주거침입","court":"대법원","date":"2021.09.09","caseType":"형사","basis":"참조조문","text":"[1] 외부인이 공동거주자의 일부가 부재중에 주거 내에 현재하는 거주자의 현실적인 승낙을 받아 통상적인 출입방법에 따라 공동주거에 들어갔으나 부재중인 다른 거주자의 추정적 의사에 반하는 경우, 주거침입죄가 성립하는지 여부 [2] 피고인이 甲의 부재중에 甲의 처 乙과 혼외 성관계를 가질 목적으로 乙이 열어 준 현관 출입문을 통하여 甲과 乙이 공동으로 거주하는 아파트에 들어간 사안에서, 피고인이 乙로부터 현실적인 승낙을 받아 통상적인 출입방법에 따라 주거에 들어갔으므로 주거의 사실상 평온상태를 해치는 행위태양으로 주거에 들어간 것이 아니어서 주거에 침입한 것으로 볼 수 없고, 피고인의 주거 출입이 부재중인 甲의 의사에 반하는 것으로 추정되더라도 주거침입죄의 성립 여부에 영향을 미치지 않는다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=217423"},{"id":"P:219389","kind":"P","label":"2016도88","title":"모욕","court":"대법원","date":"2021.09.09","caseType":"형사","basis":"참조조문","text":"[1] 형법 제20조에서 정한 ‘사회상규에 위배되지 아니하는 행위’의 의미 및 정당행위의 성립 요건 / 어떤 글이나 발언이 모욕적 표현을 담고 있더라도 사회상규에 위배되지 않는 행위로서 위법성이 조각될 수 있는 경우 [2] 피고인들이 소속 노동조합 위원장 甲을 ‘어용’, ‘앞잡이’ 등으로 지칭하여 표현한 현수막, 피켓 등을 장기간 반복하여 일반인의 왕래가 잦은 도로변 등에 게시한 사안에서, ‘어용’이란 자신의 이익을 위하여 권력자나 권력 기관에 영합하여 줏대 없이 행동하는 것을 낮잡아 이르는 말, ‘앞잡이’란 남의 사주를 받고 끄나풀 노릇을 하는 사람을 뜻하는 말로서 언제나 위 표현들이 지칭된 상대방에 대한 모욕에 해당한다거나 사회상규에 비추어 허용되지 않는 것은 아니지만, 제반 사정에 비추어 피고인들의 위 행위는 甲에 대한 모욕적 표현으로서 사회상규에 위배되지 않는 행위로 보기 어렵다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=219389"},{"id":"P:217459","kind":"P","label":"2020도12017","title":"법정소동·공무집행방해·일반교통방해·집회및시위에관한법률위반","court":"대법원","date":"2021.08.26","caseType":"형사","basis":"참조조문","text":"법정소동죄 등을 규정한 형법 제138조에서의 ‘법원의 재판’에 ‘헌법재판소의 심판’을 포함시키는 해석이 피고인에게 불리한 확장해석이나 유추해석에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=217459"},{"id":"P:217455","kind":"P","label":"2021도6416","title":"명예훼손","court":"대법원","date":"2021.08.26","caseType":"형사","basis":"참조조문","text":"[1] 형법 제310조에서 정한 ‘오로지 공공의 이익에 관한 때’의 의미 및 판단 기준 [2] 징계 업무 담당 직원인 피고인이 피해자에 대한 징계절차 회부 사실이 기재된 문서를 근무현장 방재실 등의 게시판에 게시함으로써 공연히 피해자의 명예를 훼손하였다는 내용으로 기소된 사안에서, 피해자에 대한 징계절차 회부 사실을 공지하는 것이 회사 내부의 원활하고 능률적인 운영의 도모라는 공공의 이익에 관한 것으로 볼 수 없다는 이유로, 이와 달리 본 원심판단에 명예훼손죄에서의 ‘공공의 이익’에 관한 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=217455"},{"id":"P:606241","kind":"P","label":"2019노422","title":"성폭력범죄의처벌등에관한특례법위반(친족관계에의한강간)[예비적죄명:성폭력범죄의처벌등에관한특례법위반(친족관계에의한준강간)]","court":"대전고등법원","date":"2021.08.20","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606241"},{"id":"P:217317","kind":"P","label":"2020도14576","title":"상관모욕","court":"대법원","date":"2021.08.19","caseType":"형사","basis":"참조조문","text":"[1] 어떠한 글이 모욕적 표현을 포함하는 판단이나 의견을 담고 있더라도 형법 제20조의 정당행위에 해당하여 위법성이 조각되는 경우 / 군형법상 상관모욕죄의 보호법익 및 상관에 대한 모욕적 표현이 형법 제20조에 의하여 위법성이 조각될 수 있는지 판단하는 방법 [2] 부사관 교육생이던 피고인이 동기들과 함께 사용하는 단체채팅방에서 지도관이던 피해자가 목욕탕 청소 담당에게 과실 지적을 많이 한다는 이유로 “도라이 ㅋㅋㅋ 습기가 그렇게 많은데”라는 글을 게시하여 공연히 상관인 피해자를 모욕하였다는 내용으로 기소된 사안에서, ‘도라이’는 상관인 피해자를 경멸적으로 비난한 것으로 모욕적인 언사라고 볼 수 있으나, 피고인의 위 표현은 동기 교육생들끼리 고충을 토로하고 의견을 교환하는 사이버공간에서 상관인 피해자에 대하여 일부 부적절한 표현을 사용하게 된 것에 불과하고 이로 인하여 군의 조직질서와 정당한 지휘체계가 문란하게 되었다고 보이지 않으므로, 이러한 행위는 사회상규에 위배되지 않는다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=217317"},{"id":"P:226945","kind":"P","label":"2020노1756","title":"직권남용권리행사방해·공무상비밀누설","court":"서울고등법원","date":"2021.08.19","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=226945"},{"id":"P:227753","kind":"P","label":"2020노644","title":"특정경제범죄가중처벌등에관한법률위반(배임)(변경된 죄명: 택일적으로 업무상횡령 또는 업무상배임)ㆍ특정경제범죄가중처벌등에관한법률위반(횡령)(변경된 죄명: 택일적으로 업무상횡령 또는 업무상배임)ㆍ업무상횡령","court":"수원고등법원","date":"2021.08.18","caseType":"형사","basis":"참조조문","text":"채무자인 피고인이 채권자 甲의 기존 채권을 투자금으로 전환하여 공동으로 분양받은 乙 상가에 관하여 甲과 ‘피고인은 乙 상가를 매각하여 매각대금 중 일정 금액 이상을 甲에게 지급하고, 매각 후 차익이 발생할 시에는 투자금액에 비례하여 분배한다.’는 내용의 합의서를 작성하였음에도, 자신의 단독명의로 乙 상가에 대한 소유권이전등기를 마치고 乙 상가를 임의로 담보로 제공하여 대출을 받은 후 이를 제3자에게 매도함으로써 피고인과 甲을 조합원으로 한 丙 조합에 손해를 가하고 조합재산을 횡령하였다고 하여 업무상배임 또는 업무상횡령의 택일적 공소사실로 기소된 사안에서, 제반 사정을 종합하면 丙 조합이 성립되었다고 볼 수 없으므로, 피고인이 丙 조합의 업무집행자로서 조합의 사무를 처리하는 자의 지위에 있다거나 丙 조합을 위한 보관자의 지위에 있지 않다는 이유로 공소사실을 전부 무죄로 판단한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=227753"},{"id":"P:238773","kind":"P","label":"2020노2050","title":"근로자퇴직급여보장법위반","court":"서울북부지방법원","date":"2021.08.13","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238773"},{"id":"P:219419","kind":"P","label":"2020두40693","title":"퇴직급여환수및제한지급처분취소","court":"대법원","date":"2021.08.12","caseType":"일반행정","basis":"판례내용","text":"[1] 공무원연금법 제65조 제1항 제1호에서 정한 사유에 해당하면 행정청은 퇴직급여 및 퇴직수당의 감액 여부 또는 비율을 선택할 재량을 가지지 못하고 공무원연금법 시행령 제61조 제1항 제1호에서 정한 비율대로 퇴직급여와 퇴직수당을 감액하여 지급하는 급여제한처분을 할 의무가 있는지 여부 및 같은 법 제37조 제1항 제1문에 근거한 급여환수처분 역시 행정청이 환수 여부 또는 범위를 선택할 재량을 가지지 못하는 기속행위인지 여부 / 이때 공무원연금법에 따른 급여환수·제한처분에도 ‘수익적 행정처분 직권취소·철회 제한 법리’가 적용되는지 여부 [2] 공무원이었던 자가 범한 재직 중 범죄가 퇴직 후 범죄와 경합범으로 함께 기소되어 하나의 금고 이상의 형을 받은 경우, 공무원연금법 제65조 제1항 제1호에서 정한 ‘재직 중의 사유로 금고 이상의 형이 확정된 때’에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=219419"},{"id":"P:219417","kind":"P","label":"2021도5990","title":"국제조세조정에관한법률위반","court":"대법원","date":"2021.08.12","caseType":"형사","basis":"판례내용","text":"2014. 12. 23. 개정된 구 국제조세조정에 관한 법률 제34조의2 제1항 본문은 개정 법 시행일이 속하는 2015년도에 보유하고 있는 해외금융계좌를 신고하여야 하는 경우부터 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=219417"},{"id":"P:217333","kind":"P","label":"2020도17796","title":"성폭력범죄의처벌등에관한특례법위반(주거침입유사강간)ㆍ폭행ㆍ강제추행미수","court":"대법원","date":"2021.08.12","caseType":"형사","basis":"참조조문","text":"[1] 주거침입강제추행죄 및 주거침입강간죄 등이 주거침입죄를 범한 후에 사람을 강간하는 등의 행위를 하여야 하는 일종의 신분범인지 여부 및 그 실행의 착수시기 [2] 유사강간죄의 실행의 착수시기","url":"https://www.law.go.kr/precInfoP.do?precSeq=217333"},{"id":"P:622867","kind":"P","label":"2021고정350","title":"의료법위반","court":"수원지방법원성남지원","date":"2021.08.12","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=622867"},{"id":"P:226935","kind":"P","label":"2021노14","title":"자본시장과금융투자업에관한법률위반·보조금관리에관한법률위반·업무상횡령·사기·허위작성공문서행사·금융실명거래및비밀보장에관한법률위반·범죄수익은닉의규제및처벌등에관한법률위반·업무방해·위계공무집행방해·위조사문서행사·증거은닉교사·증거인멸교사·증거위조교사·사문서위조·위조공문서행사(인정된죄명허위작성공문서행사)","court":"서울고등법원","date":"2021.08.11","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=226935"},{"id":"P:236807","kind":"P","label":"2020노7245","title":"교통사고처리특례법위반(치상)","court":"수원지방법원","date":"2021.08.11","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=236807"},{"id":"P:220037","kind":"P","label":"2021노345","title":"자본시장과금융투자업에관한법률위반·증거은닉교사·특정경제범죄가중처벌등에관한법률위반(횡령)·업무상횡령·사문서위조·위조사문서행사·주식회사등의외부감사에관한법률위반·사기","court":"서울고등법원","date":"2021.08.10","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=220037"},{"id":"P:217367","kind":"P","label":"2021도3520","title":"사기ㆍ사문서위조ㆍ전기통신사업법위반","court":"대법원","date":"2021.07.29","caseType":"형사","basis":"판례내용","text":"전기통신사업법 제30조 본문에서 정한 ‘타인의 통신을 매개’한다는 것과 ‘타인의 통신용으로 제공’한다는 것의 의미 / 통신이 매개되거나 전기통신역무를 제공받은 타인이 통신의 매개 또는 제공을 요청하였거나 통신의 매개 또는 제공 행위에 관여하였던 경우에도 그 매개 또는 제공 행위가 위 조항 본문에서 정한 ‘타인의 통신을 매개’하는 행위 또는 ‘타인의 통신용으로 제공’하는 행위에 해당할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=217367"},{"id":"P:218877","kind":"P","label":"2020도16276","title":"전기통신사업법위반","court":"대법원","date":"2021.07.29","caseType":"형사","basis":"판례내용","text":"전기통신사업법 제30조 본문에서 정한 ‘타인의 통신을 매개’한다는 것의 의미 / 매개되는 통신의 당사자가 통신의 매개를 요청하거나 통신 매개 행위에 관여하더라도 위 조항 본문이 정한 ‘타인의 통신을 매개’하는 행위에 해당하는지 여부 및 매개되는 통신의 당사자가 통신 매개 행위자와의 관계에서 다른 범죄행위의 공범에 해당하더라도 그 통신 매개 행위는 위 조항 본문에서 금지하는 행위에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=218877"},{"id":"P:218871","kind":"P","label":"2021도3756","title":"마약류관리에관한법률위반(향정)","court":"대법원","date":"2021.07.29","caseType":"형사","basis":"판례내용","text":"영장 발부의 사유로 된 범죄 혐의사실과 무관한 별개의 증거를 압수한 경우 이를 유죄 인정의 증거로 사용할 수 있는지 여부 및 압수·수색의 목적이 된 범죄나 이와 관련된 범죄의 경우 압수·수색의 결과를 유죄의 증거로 사용할 수 있는지 여부 / ‘압수·수색영장의 범죄 혐의사실과 관계있는 범죄’의 의미 및 이때 혐의사실과의 ‘객관적 관련성’이 인정되는 범위","url":"https://www.law.go.kr/precInfoP.do?precSeq=218871"},{"id":"P:220111","kind":"P","label":"2020노2392","title":"저작권법위반방조","court":"의정부지방법원","date":"2021.07.23","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=220111"},{"id":"P:221905","kind":"P","label":"2021고합20","title":"강도·폭행·업무방해·부착명령·보호관찰명령","court":"창원지방법원통영지원","date":"2021.07.22","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=221905"},{"id":"P:233919","kind":"P","label":"2020노4371","title":"사기·전자금융거래법위반·전기통신사업법위반·횡령","court":"인천지방법원","date":"2021.07.22","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233919"},{"id":"P:220113","kind":"P","label":"2021노24","title":"특정경제범죄가중처벌등에관한법률위반(배임)(피고인들에대하여일부인정된죄명:업무상배임)·업무상횡령·주택법위반·사전자기록등변작·변작사전자기록등행사","court":"대전고등법원청주재판부","date":"2021.07.22","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=220113"},{"id":"P:230803","kind":"P","label":"2020노2940","title":"국가정보원직원법위반","court":"서울중앙지방법원","date":"2021.07.21","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=230803"},{"id":"P:218881","kind":"P","label":"2018도16587","title":"공직선거법위반·정보통신망이용촉진및정보보호등에관한법률위반(명예훼손)","court":"대법원","date":"2021.07.21","caseType":"형사","basis":"참조조문","text":"‘선거범’과 ‘선거범이 아닌 다른 죄’의 경합범에 대하여 이를 분리하여 형을 따로 선고하도록 규정한 공직선거법 제18조 제3항의 취지 / 이때 선거범과 상상적 경합관계에 있는 모든 죄는 통틀어 선거범으로 취급하여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=218881"},{"id":"P:217387","kind":"P","label":"2020도10970","title":"폐기물관리법위반","court":"대법원","date":"2021.07.21","caseType":"형사","basis":"참조조문","text":"[1] 형법 제48조에서 규정한 몰수ㆍ추징의 대상인 ‘범인이 범죄행위로 인하여 취득한 물건’에서 ‘취득’의 의미 [2] 원심이 피고인들에게 ‘사업장폐기물배출업체로부터 인수받은 폐기물을 폐기물관리법에 따라 허가 또는 승인을 받거나 신고한 폐기물처리시설이 아닌 곳에 매립하였다.’는 범죄행위를 인정하면서 피고인들이 사업장폐기물배출업체로부터 받은 돈을 형법 제48조에 따라 몰수ㆍ추징한 사안에서, 피고인들이 폐기물을 불법적으로 매립할 목적으로 돈을 받고 폐기물을 인수하였다는 사정만을 근거로 위 돈이 범죄행위로 인하여 생하였거나 이로 인하여 취득된 것이라고 본 원심판결에 몰수ㆍ추징에 관한 법리오해 등의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=217387"},{"id":"P:622893","kind":"P","label":"2021고정180","title":"의료법위반","court":"서울서부지방법원","date":"2021.07.21","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=622893"},{"id":"P:226919","kind":"P","label":"2021노177","title":"재물손괴","court":"서울남부지방법원","date":"2021.07.20","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=226919"},{"id":"P:218849","kind":"P","label":"2018도11349","title":"일반교통방해","court":"대법원","date":"2021.07.15","caseType":"형사","basis":"참조조문","text":"‘집회 및 시위에 관한 법률’에 의하여 적법한 신고를 마치고 도로에서 집회나 시위를 하였으나 당초 신고된 범위를 현저히 일탈하거나 같은 법 제12조에 의한 조건을 중대하게 위반하여 도로 교통을 방해함으로써 통행을 불가능하게 하거나 현저하게 곤란하게 하는 경우, 일반교통방해죄가 성립하는지 여부 및 이때 집회 및 시위의 참가자에게 일반교통방해죄가 성립하기 위한 요건","url":"https://www.law.go.kr/precInfoP.do?precSeq=218849"},{"id":"P:221831","kind":"P","label":"2021고단1678","title":"마약류관리에관한법률위반(향정)·출입국관리법위반","court":"창원지방법원","date":"2021.07.14","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=221831"},{"id":"P:220039","kind":"P","label":"2020노357","title":"특정경제범죄가중처벌등에관한법률위반(사기)[택일적죄명특정경제범죄가중처벌등에관한법률위반(횡령)·예비적죄명:특정경제범죄가중처벌등에관한법률위반(배임)]·특정경제범죄가중처벌등에관한법률위반(공갈)","court":"서울고등법원","date":"2021.07.09","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=220039"},{"id":"P:216967","kind":"P","label":"2021도2993","title":"아동ㆍ청소년의성보호에관한법률위반(음란물제작ㆍ배포등)ㆍ아동ㆍ청소년의성보호에관한법률위반(유사성행위)ㆍ아동ㆍ청소년의성보호에관한법률위반(강제추행)ㆍ아동복지법위반(아동에대한음행강요ㆍ매개ㆍ성희롱등)ㆍ아동ㆍ청소년의성보호에관한법률위반(음란물소지)","court":"대법원","date":"2021.07.08","caseType":"형사","basis":"참조조문","text":"아동ㆍ청소년이용음란물을 제작한 자가 그 음란물을 소지하게 되는 경우, 아동ㆍ청소년의 성보호에 관한 법률 위반죄는 같은 법 위반죄에 흡수되는지 여부 / 아동ㆍ청소년이용음란물을 제작한 자가 제작에 수반된 소지행위를 벗어나 사회통념상 새로운 소지가 있었다고 평가할 수 있는 별도의 소지행위를 개시한 경우, 같은 법 위반죄와 별개의 같은 법 위반죄에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=216967"},{"id":"P:216965","kind":"P","label":"2014도12104","title":"배임미수","court":"대법원","date":"2021.07.08","caseType":"형사","basis":"참조조문","text":"수분양권 매도인이 매매계약에 따라 ‘매수인에게 수분양권을 이전할 의무’를 부담하는 경우, 매수인에 대한 관계에서 ‘타인의 사무를 처리하는 자’에 해당하는지 여부 / 수분양권 매도인이 위와 같은 의무를 이행하지 아니하고 수분양권 또는 이에 근거하여 향후 소유권을 취득하게 될 목적물을 미리 제3자에게 처분한 경우, 형법상 배임죄가 성립하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=216965"},{"id":"P:223467","kind":"P","label":"2020고단715","title":"공갈·특수협박·협박·특수상해·특수폭행·상해","court":"대전지방법원서산지원","date":"2021.07.08","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=223467"},{"id":"P:218739","kind":"P","label":"2015도19696","title":"배임·사기","court":"대법원","date":"2021.06.30","caseType":"형사","basis":"참조조문","text":"[1] 배임죄의 주체인 ‘타인의 사무를 처리하는 자’의 의미 [2] 지입차주가 자신이 실질적으로 소유하거나 처분권한을 가지는 자동차에 관하여 지입회사와 지입계약을 체결함으로써 지입회사에 그 자동차의 소유권등록 명의를 신탁하고 운송사업용 자동차로서 등록 및 그 유지 관련 사무의 대행을 위임한 경우, 지입회사 운영자가 지입차주와의 관계에서 ‘타인의 사무를 처리하는 자’의 지위에 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=218739"},{"id":"P:240797","kind":"P","label":"2020노114","title":"준강간미수","court":"광주고등법원제주재판부","date":"2021.06.23","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=240797"},{"id":"P:220117","kind":"P","label":"2020노3521","title":"특정범죄자에대한보호관찰및전자장치부착등에관한법률위반·재물손괴","court":"부산지방법원","date":"2021.06.17","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=220117"},{"id":"P:608413","kind":"P","label":"2021고정277","title":"개인정보보호법위반","court":"대전지방법원","date":"2021.06.17","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=608413"},{"id":"P:237283","kind":"P","label":"2021고단3038","title":"업무방해·전자금융거래법위반","court":"인천지방법원","date":"2021.06.10","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=237283"},{"id":"P:227799","kind":"P","label":"2020노475","title":"직무유기","court":"대전지방법원","date":"2021.06.09","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=227799"},{"id":"P:220047","kind":"P","label":"2020노2026","title":"특정경제범죄가중처벌등에관한법률위반(사기)(예비적죄명:조세범처벌법위반)·사기미수·사문서위조·위조사문서행사·전자금융거래법위반·사기(예비적죄명조세범처벌법위반)·사기방조(예비적죄명:조세범처벌법위반방조)","court":"서울고등법원","date":"2021.06.04","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=220047"},{"id":"P:216699","kind":"P","label":"2016다34007","title":"소유권말소등기","court":"대법원","date":"2021.06.03","caseType":"민사","basis":"참조조문","text":"명의수탁자가 양자간 명의신탁에 따라 명의신탁자로부터 소유권이전등기를 넘겨받은 부동산을 임의로 처분한 경우, 형사상 횡령죄의 성립 여부와 관계없이 명의신탁자에 대하여 민사상 불법행위책임을 부담하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=216699"},{"id":"P:218333","kind":"P","label":"2021도1349","title":"특정범죄가중처벌등에관한법률위반(절도)〔인정된 죄명: 절도〕","court":"대법원","date":"2021.06.03","caseType":"형사","basis":"참조조문","text":"특정범죄 가중처벌 등에 관한 법률 제5조의4 제5항에서 정한 ‘징역형’에 형법 제332조 상습절도죄로 처벌받은 전력도 포함되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=218333"},{"id":"P:216721","kind":"P","label":"2020도15529","title":"업무상배임미수","court":"대법원","date":"2021.05.27","caseType":"형사","basis":"참조조문","text":"업무상배임죄가 부작위에 의해서도 성립할 수 있는지 여부 및 그러한 부작위를 실행의 착수로 인정하기 위한 요건 / 이때 행위자는 부작위 당시 자신에게 주어진 임무를 위반한다는 점과 그 부작위로 인해 손해가 발생할 위험이 있다는 점을 인식하여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=216721"},{"id":"P:603861","kind":"P","label":"2019고단5958","title":"관세법위반·의료기기법위반","court":"의정부지방법원","date":"2021.05.26","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=603861"},{"id":"P:226891","kind":"P","label":"2020노151","title":"선박안전법위반·배임수재","court":"부산고등법원","date":"2021.05.26","caseType":"형사","basis":"판례내용","text":"해상화물운송 등을 사업 목적으로 하는 피고인 甲 주식회사의 대표이사 피고인 乙, 해사본부장 피고인 丙, 공무감독 피고인 丁, 戊가 피고인 甲 회사의 실질적 소유로서 출항하여 외국항구에 정박 중인 2척의 철광석 운반선들을 점검한 후 위 선박들에서 평형수 탱크 사이의 횡격벽에 발생한 변형이나 평형수 탱크 균열, 상갑판 균열 등의 감항성 결함을 발견하고도 이를 해양수산부장관에게 신고하지 아니하였다고 하여 구 선박안전법 위반으로 기소되었는데, 같은 법 제74조 제1항에서 정한 ‘감항성의 결함’이 감항성 ‘흠결’을 의미하는지, 감항성 ‘결여’를 의미하는지가 문제 된 사안에서, 감항성의 결함은 감항성 흠결을 의미하고, 위 선박들에 발생한 횡격벽 변형이나 상갑판 균열 등은 감항성의 결함에 해당한다는 등의 이유로, 피고인들 모두에게 유죄를 인정한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=226891"},{"id":"P:605239","kind":"P","label":"2020노1601","title":"특정범죄가중처벌등에관한법률위반(허위세금계산서교부등)·조세범처벌법위반","court":"서울고등법원","date":"2021.05.20","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=605239"},{"id":"P:218831","kind":"P","label":"2020노63","title":"특정범죄가중처벌등에관한법률위반(허위세금계산서교부등)(피고인 3에 대하여 인정된 죄명: 조세범처벌법위반)ㆍ조세범처벌법위반","court":"서울고등법원","date":"2021.05.20","caseType":"형사","basis":"참조조문","text":"피고인 甲 주식회사가 그 사용인들이 재화 또는 용역의 공급 없이 허위의 세금계산서를 발급하거나 발급받고, 공급가액을 부풀려 거짓으로 기재한 세금계산서를 발급하였다고 하여 양벌규정에 따라 각 조세범 처벌법 위반으로 기소되었는데, 제1심이 공소사실을 유죄로 인정하여 피고인 甲 회사에 대해 벌금형을 부과하면서 ‘형법 제37조 전단, 조세범 처벌법 제20조’를 적용한 다음, 각 세금계산서의 공급가액에 부가가치세 세율 10%를 곱한 금액의 2 내지 3배에 해당하는 금액의 한도 내에서 각 벌금을 정한 후 그 합계액을 벌금으로 정한 사안에서, 양벌규정에 따라 벌금형이 부과되는 법인에 대하여 조세범 처벌법 제20조를 적용함으로써 형법 제38조 제1항 제2호 중 벌금경합에 관한 제한가중규정을 적용하지 않는 것은 허용될 수 없으므로, 제1심판결 중 피고인 甲 회사에 대한 유죄 부분은 조세범 처벌법 제20조의 적용 범위에 관한 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=218831"},{"id":"P:601873","kind":"P","label":"2020노2310","title":"아동·청소년의성보호에관한법률위반(음란물제작·배포등)[인정된죄명:아동·청소년의성보호에관한법률위반(음란물소지)]·사기","court":"의정부지방법원","date":"2021.05.13","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=601873"},{"id":"P:611995","kind":"P","label":"2021고정38","title":"공익사업을위한토지등의취득및보상에관한법률위반","court":"춘천지방법원원주지원","date":"2021.05.07","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=611995"},{"id":"P:218343","kind":"P","label":"2019도13764","title":"재물손괴","court":"대법원","date":"2021.05.07","caseType":"형사","basis":"참조조문","text":"[1] 재물손괴죄의 구성요건 중 ‘기타 방법’ 및 ‘재물의 효용을 해한다.’의 의미 / 재물의 효용을 해하는 것인지 판단하는 기준 [2] 피고인이 평소 자신이 굴삭기를 주차하던 장소에 甲의 차량이 주차되어 있는 것을 발견하고 甲의 차량 앞에 철근콘크리트 구조물을, 뒤에 굴삭기 크러셔를 바짝 붙여 놓아 甲이 17~18시간 동안 차량을 운행할 수 없게 된 사안에서, 차량 앞뒤에 쉽게 제거하기 어려운 구조물 등을 붙여 놓은 행위는 차량에 대한 유형력 행사로 보기에 충분하고, 차량 자체에 물리적 훼손이나 기능적 효용의 멸실 내지 감소가 발생하지 않았더라도 甲이 위 구조물로 인해 차량을 운행할 수 없게 됨으로써 일시적으로 본래의 사용목적에 이용할 수 없게 된 이상 차량 본래의 효용을 해한 경우라고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=218343"},{"id":"P:218401","kind":"P","label":"2020노773","title":"명예훼손ㆍ업무방해","court":"대구지방법원","date":"2021.05.07","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=218401"},{"id":"P:218119","kind":"P","label":"2020노5182","title":"명예훼손","court":"수원지방법원","date":"2021.05.07","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=218119"},{"id":"P:601443","kind":"P","label":"2021노260","title":"상해","court":"인천지방법원","date":"2021.05.04","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=601443"},{"id":"P:616603","kind":"P","label":"2019고단4173","title":"사기·횡령·권리행사방해","court":"대전지방법원","date":"2021.04.30","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=616603"},{"id":"P:226875","kind":"P","label":"2020도16369","title":"마약류불법거래방지에관한특례법위반(인정된 죄명: 마약류불법거래방지에관한특례법위반방조)ㆍ마약류관리에관한법률위반(향정)","court":"대법원","date":"2021.04.29","caseType":"형사","basis":"참조조문","text":"마약류 불법거래 방지에 관한 특례법 제6조를 위반하여 마약류를 수출입ㆍ제조ㆍ매매하는 행위 등을 업으로 하는 범죄행위의 정범이 그 범죄행위로 얻은 수익은 같은 법 제13조부터 제16조까지의 규정에 따라 몰수ㆍ추징의 대상이 되는지 여부 / 위 정범으로부터 대가를 받고 판매할 마약을 공급하는 방법으로 위 범행을 용이하게 한 방조범이 정범의 위 범죄행위로 인한 수익을 정범과 공동으로 취득하였다고 평가할 수 없는 경우, 방조행위로 얻은 재산 등에 한하여 몰수, 추징할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=226875"},{"id":"P:218361","kind":"P","label":"2019도14338","title":"공공단체등위탁선거에관한법률위반","court":"대법원","date":"2021.04.29","caseType":"형사","basis":"판례내용","text":"[1] 구 공공단체등 위탁선거에 관한 법률 제23조에서 말하는 ‘선거운동’의 의미 및 판단 기준 [2] 구 공공단체등 위탁선거에 관한 법률 제24조 제1항, 제2항에서 선거운동을 제한적으로만 허용하고 그 외의 선거운동을 일체 금지하는 취지 [3] 구 공공단체등 위탁선거에 관한 법률 제24조 제1항, 제66조 제1호에서 후보자 아닌 자의 선거운동을 전면 금지하고 이를 위반하는 행위를 처벌하는 취지 / 후보자가 제3자로 하여금 자신을 보조하여 선거운동을 하게 한 경우, 제3자의 행위가 같은 법 제24조 제1항에서 금지하는 ‘후보자 아닌 자의 선거운동’에 해당하는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=218361"},{"id":"P:215443","kind":"P","label":"2020고합222","title":"유기치사","court":"울산지방법원","date":"2021.04.23","caseType":"형사","basis":"참조조문","text":"택시 기사인 피고인이 자정 무렵 술에 취한 승객 甲을 태운 후 甲의 요구에 따라 목적지를 변경하며 진행하다가 자동차전용도로 갓길 부근에 이르러 甲이 하차를 요구하면서 차량 문을 열려고 하자 갓길에 甲을 하차시킴으로써, 甲이 약 30분간 방향감각을 잃고 도로에서 헤매다가 하차지점으로부터 약 600m 떨어진 자동차전용도로의 2차로를 따라 걷던 중 乙이 운전하는 자동차에 들이받히는 사고로 즉시 그곳에서 사망에 이르렀다고 하여 유기치사로 기소된 사안에서, 제반 사정을 종합하면 피고인이 야간에 자동차전용도로에서 甲을 하차하게 하고 별다른 조치 없이 현장을 떠났더라도 당시 甲이 술에 취하여 부조를 요하는 상태였음을 인식하였다는 점이 합리적 의심의 여지 없이 증명되지 않았다는 이유로 무죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=215443"},{"id":"P:238531","kind":"P","label":"2021노393","title":"마약류관리에관한법률위반(향정)·마약류관리에관한법률위반(대마)","court":"수원지방법원","date":"2021.04.23","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238531"},{"id":"P:241327","kind":"P","label":"2020노1023","title":"국민체육진흥법위반(도박개장등)·도박공간개설","court":"제주지방법원","date":"2021.04.22","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=241327"},{"id":"P:236087","kind":"P","label":"2019고단4434","title":"야간건조물침입절도","court":"서울중앙지방법원","date":"2021.04.20","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=236087"},{"id":"P:233921","kind":"P","label":"2020고단10994","title":"사기·횡령·배상명령신청","court":"인천지방법원","date":"2021.04.15","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=233921"},{"id":"P:226847","kind":"P","label":"2020도16468","title":"사기ㆍ전자금융거래법위반","court":"대법원","date":"2021.04.15","caseType":"형사","basis":"참조조문","text":"[1] 전자금융거래법 제6조 제3항 제2호에서 정한 ‘접근매체의 대여’ 및 ‘대가’의 의미 / 전자금융거래법 제6조 제3항 제2호 위반죄가 성립하기 위하여 접근매체를 대여하는 자는 접근매체 대여에 대응하는 경제적 이익을 수수ㆍ요구 또는 약속하면서 접근매체를 대여한다는 인식을 가져야 하는지 여부 [2] 피고인이 성명불상자로부터 ‘대출이 가능하고, 대출 원리금 상환에 필요한 체크카드를 보내주면 대출을 해 주겠다.’는 연락을 받고 그에게 피고인 명의의 체크카드를 비밀번호와 함께 교부함으로써 접근매체를 대여하였다고 하여 전자금융거래법 위반으로 기소된 사안에서, 제반 사정을 종합하면 피고인은 대출금 및 이자를 지급하기 위해 필요하다는 성명불상자의 기망으로 체크카드를 교부한 사람으로서 대출의 대가로 접근매체를 대여했다거나 체크카드를 교부할 당시 그러한 인식을 하였다고 단정하기 어렵다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=226847"},{"id":"P:216981","kind":"P","label":"2020도15194","title":"상습사기ㆍ업무방해","court":"대법원","date":"2021.04.01","caseType":"형사","basis":"판례내용","text":"경범죄 처벌법상 범칙금제도의 의의 / 경찰서장이 범칙행위에 대하여 통고처분을 하였는데 통고처분에서 정한 범칙금 납부기간이 지나지 아니한 경우, 경찰서장이 즉결심판을 청구하거나 검사가 동일한 범칙행위에 대하여 공소를 제기할 수 있는지 여부 / 범칙자가 범칙금 납부기간이 지나도록 범칙금을 납부하지 않아 경찰서장이 즉결심판을 청구한 경우, 검사가 동일한 범칙행위에 대하여 공소를 제기할 수 있는지 여부 / 경찰서장이 범칙행위에 대한 형사소추를 위하여 이미 한 통고처분을 임의로 취소할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=216981"},{"id":"P:215153","kind":"P","label":"2017도17643","title":"모욕","court":"대법원","date":"2021.03.25","caseType":"형사","basis":"참조조문","text":"[1] 모욕죄에서 말하는 ‘모욕’의 의미 / 어떤 글이 모욕적 표현을 담고 있더라도 사회상규에 위배되지 않는 행위로서 위법성이 조각될 수 있는 경우 / 특정 사안에 대한 의견을 공유하는 인터넷 게시판 등의 공간에서 작성된 단문의 글에 모욕적 표현이 포함되어 있더라도 그 글을 작성한 행위가 사회상규에 위배되지 않는 행위로서 위법성이 조각되는 경우 [2] 인터넷 신문사 소속 기자 甲이 작성한 기사가 인터넷 포털 사이트의 ‘핫이슈’ 난에 게재되자, 피고인이 “이런걸 기레기라고 하죠?”라는 댓글을 게시함으로써 공연히 甲을 모욕하였다는 내용으로 기소된 사안에서, ‘기레기’는 모욕적 표현에 해당하나, 위 댓글의 내용, 작성 시기와 위치, 위 댓글 전후로 게시된 다른 댓글의 내용과 흐름 등을 종합하면, 위 댓글을 작성한 행위는 사회상규에 위배되지 않는 행위로서 형법 제20조에 의하여 위법성이 조각된다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=215153"},{"id":"P:216985","kind":"P","label":"2020도18285","title":"아동ㆍ청소년의성보호에관한법률위반(음란물제작ㆍ배포등)ㆍ정보통신망이용촉진및정보보호등에관한법률위반ㆍ아동ㆍ청소년의성보호에관한법률위반(강제추행)ㆍ아동복지법위반(아동에대한음행강요ㆍ매개ㆍ성희롱등)","court":"대법원","date":"2021.03.25","caseType":"형사","basis":"참조조문","text":"[1] 아동ㆍ청소년으로 하여금 스스로 자신을 대상으로 하는 음란물을 촬영하게 하고 직접 촬영행위를 하지 않았더라도 구 아동ㆍ청소년의 성보호에 관한 법률 제11조 제1항의 처벌 대상인 아동ㆍ청소년이용음란물 ‘제작’에 해당하는 경우 및 그 기수 시기 [2] 구 아동ㆍ청소년의 성보호에 관한 법률 제11조 제1항의 처벌 대상인 ‘아동ㆍ청소년이용음란물 제작’에서 해당 영상을 직접 촬영할 것을 요하지 아니하는 취지 [3] 공동정범의 성립 요건 및 주관적 요건으로서 ‘공동가공의 의사’의 내용 / 피고인이 주관적 요소인 공동가공의 의사를 부인하는 경우, 그 증명 방법","url":"https://www.law.go.kr/precInfoP.do?precSeq=216985"},{"id":"P:226839","kind":"P","label":"2020노2029","title":"특수상해","court":"부산지방법원","date":"2021.03.25","caseType":"형사","basis":"참조조문","text":"피고인에 대하여 특수강도죄 등으로 징역 2년 6월을 선고한 판결 및 폭행죄로 벌금 70만 원, 도로교통법 위반죄로 벌금 200만 원에 처한 각 약식명령이 확정되었고, 피고인이 징역형에 따라 복역하던 중 검사의 지휘에 의하여 53일간 각 벌금형 미납에 따른 노역장유치의 집행을 받은 다음 징역형의 잔여 형기를 복역한 후 출소하였는데, 출소일로부터 3년 내에 특수상해 범행을 저질러 누범 및 집행유예 결격에 해당하는지 문제 된 사안에서, 피고인이 검사의 형집행순서 변경 지휘에 따라 징역형과 각 벌금형의 집행을 모두 마친 후에 출소하였더라도 징역형의 집행은 그 집행종료 예정일에 종료되고, 피고인이 실제 출소일로부터 3년이 지나기 전에 특수상해 범행을 저질렀더라도 징역형의 집행 종료일로부터 이미 3년이 지났으므로 피고인이 누범에 해당하거나 집행유예 결격에 해당하지 않는다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=226839"},{"id":"P:215151","kind":"P","label":"2016도14995","title":"특수공무집행방해치상·특수공무집행방해·특수공용물건손상·일반교통방해·집회및시위에관한법률위반·명예훼손","court":"대법원","date":"2021.03.25","caseType":"형사","basis":"참조조문","text":"[1] 명예훼손죄에서 ‘사실의 적시’의 의미 및 보고나 진술이 사실인지 의견인지 판단하는 기준 / 객관적으로 피해자의 사회적 평가를 저하시키는 사실에 관한 발언이 보도, 소문이나 제3자의 말을 인용하는 방법으로 단정적인 표현이 아닌 전문 또는 추측의 형태로 표현되었으나 표현 전체의 취지로 보아 사실이 존재할 수 있다는 것을 암시하는 방식으로 이루어진 경우, 사실을 적시한 것으로 보아야 하는지 여부 및 공적 인물과 관련된 공적 관심사에 관하여 의혹을 제기하는 형태의 표현행위를 암시에 의한 사실의 적시로 평가할 때 유의할 사항 [2] 기자회견 등 공개적인 발언으로 인한 명예훼손죄가 성립하는지 판단할 때 고려하여야 할 사항 / 정부 또는 국가기관의 정책결정이나 업무수행과 관련된 사항을 주된 내용으로 하는 발언으로 그에 관여한 공직자 개인에 대한 명예훼손죄가 성립하는지 여부 및 판단 기준 [3] 피고인이 세월호 참사 국민대책회의 공동위원장이자 ‘4월 16일의 약속 국민연대’ 상임운영위원으로서 언론사 기자와 시민 등을 상대로 기자회견을 하던 중 ‘세월호 참사 당일 7시간 동안 대통령 甲이 마약이나 보톡스를 했다는 의혹이 사실인지 청와대를 압수ㆍ수색해서 확인했으면 좋겠다.’는 취지로 발언함으로써 허위사실을 적시하여 甲의 명예를 훼손하였다는 내용으로 기소된 사안에서, 위 발언은 ‘甲이 마약을 하거나 보톡스 주사를 맞고 있어 직무수행을 하지 않았다","url":"https://www.law.go.kr/precInfoP.do?precSeq=215151"},{"id":"P:227881","kind":"P","label":"2020다280326","title":"주위토지통행권확인","court":"대법원","date":"2021.03.11","caseType":"민사","basis":"참조조문","text":"[1] 일반 공중의 통행에 공용된 도로의 통행을 방해함으로써 특정인의 통행의 자유를 침해한 경우, 민법상 불법행위에 해당하는지 여부 및 이때 침해를 받은 자가 통행방해 행위의 금지를 소구할 수 있는지 여부 [2] 형법 제185조의 일반교통방해죄에서 말하는 ‘육로’의 의미 및 어떤 도로가 일반 공중의 통행에 공용된 도로에 해당하는 경우, 일반 공중의 자유로운 통행이 형법상 일반교통방해죄에 의해서도 보장되는지 여부 [3] 어떤 도로가 일반 공중의 자유로운 통행이 보장된 공로인 경우, 공로에 이미 연결되어 있는 토지의 소유자에게 그 공로의 통행을 위하여 민법 제219조의 주위토지통행권을 인정할 필요가 있는지 여부 [4] 甲 지방자치단체가 乙 사찰로 출입하는 유일한 통행로로서 사찰의 승려, 신도, 탐방객 및 인근 주민들이 이용하고 있던 도로를 농어촌도로 정비법 제2조 제1항의 농어촌도로로 지정하고 30년 이상 관리하고 있었는데, 위 도로가 있는 임야를 임의경매절차에서 매수한 丙이 불특정 다수인의 통행을 제한하려고 하자 乙 사찰이 丙을 상대로 통행권 확인 및 통행방해 금지를 구한 사안에서, 위 도로는 일반 공중의 통행에 제공된 공로에 해당한다고 봄이 타당하고, 위 도로 자체가 공로인 이상 乙 사찰은 일상생활상 필요한 범위 내에서 도로를 자유로이 통행하는 것이 보장되며, 주위토지통행권이 인정될 필요는 없다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=227881"},{"id":"P:214595","kind":"P","label":"2020도14666","title":"사기ㆍ사기미수ㆍ공문서위조ㆍ위조공문서행사ㆍ사문서위조ㆍ위조사문서행사","court":"대법원","date":"2021.03.11","caseType":"형사","basis":"참조조문","text":"금융위원회의 설치 등에 관한 법률 제29조, 제69조 제1항에서 정한 금융감독원 집행간부인 금융감독원장 명의의 문서가 공문서인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=214595"},{"id":"P:214597","kind":"P","label":"2020도12583","title":"특정범죄가중처벌등에관한법률위반(국고등손실)[피고인1·피고인3에대한예비적죄명및피고인2에대한일부예비적죄명:특정경제범죄가중처벌등에관한법률위반(횡령)·피고인2·피고인10에대한일부예비적죄명:업무상횡령·피고인2에대한일부예비적죄명:업무상배임·피고인2·피고인3에대하여일부인정된죄명:업무상횡령]·위증·국가정보원법위반(피고인9에대하여일부변경된죄명:강요)·업무방해·노동조합및노동관계조정법위반·업무상횡령·뇌물공여·허위공문서작성·허위작성공문서행사·정보통신망이용촉진및정보보호등에관한법률위반(명예훼손)","court":"대법원","date":"2021.03.11","caseType":"형사","basis":"참조조문","text":"[1] 국고금 관리법 제7조에 따라 중앙관서장의 직접 사용이 금지되는 ‘소관 수입’의 의미 [2] 직권남용권리행사방해죄에서 말하는 ‘직권남용’의 의미 및 직권의 ‘남용’에 해당하는지 판단하는 기준 / 직권남용권리행사방해죄에서 말하는 ‘사람으로 하여금 의무 없는 일을 하게 한 때’의 의미 / 공무원이 자신의 직무권한에 속하는 사항에 관하여 실무 담당자로 하여금 직무집행을 보조하게 하는 행위가 ‘의무 없는 일을 하게 한 때’에 해당하는 경우 및 이에 해당하는지 판단하는 기준 [3] 국가정보원법에 직권남용권리행사방해죄에 관한 처벌 규정을 별도로 두고 있는 취지 / 직권남용으로 인한 국가정보원법 위반죄가 성립하는지 판단할 때 고려하여야 할 사항 [4] 직권남용으로 인한 국가정보원법 위반죄의 객체인 ‘사람’의 의미 [5] 수 개의 범죄행위가 포괄일죄를 구성하는 경우 및 이때 공소시효의 기산점 [6] 국가정보원 직원이 동일한 사안에 관한 일련의 직무집행 과정에서 단일하고 계속된 범의로 일정 기간 계속하여 저지른 직권남용행위에 대하여는 그 상대방이 수인이라도 포괄일죄가 성립할 수 있는지 여부 및 개별 사안에서 포괄일죄가 성립하는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=214597"},{"id":"P:214605","kind":"P","label":"2020다229239","title":"토지인도","court":"대법원","date":"2021.03.11","caseType":"민사","basis":"참조조문","text":"[1] 일반 공중의 통행에 공용된 도로의 통행을 방해함으로써 특정인의 통행의 자유를 침해한 경우, 민법상 불법행위에 해당하는지 여부 및 이때 침해를 받은 자가 통행방해 행위의 금지를 소구할 수 있는지 여부 [2] 형법 제185조의 일반교통방해죄에서 말하는 ‘육로’의 의미 및 어떤 도로가 일반 공중의 통행에 공용된 도로에 해당하는 경우, 일반 공중의 자유로운 통행이 형법상 일반교통방해죄에 의해서도 보장되는지 여부 [3] 일반 공중의 통행에 공용되는 도로 부지의 소유자가 이를 점유ㆍ관리하는 지방자치단체를 상대로 도로의 철거, 점유 이전 또는 통행금지를 청구하는 것이 권리남용에 해당하는지 여부 [4] 甲 지방자치단체가 乙 사찰로 출입하는 유일한 통행로로서 사찰의 승려, 신도, 탐방객 및 인근 주민들이 이용하고 있던 도로를 농어촌도로 정비법 제2조 제1항의 농어촌도로로 지정하고 30년 이상 관리하고 있었는데, 위 도로가 있는 임야를 임의경매절차에서 매수한 丙이 甲 지방자치단체를 상대로 도로의 철거 및 인도를 구한 사안에서, 위 도로는 일반 공중의 통행에 공용되는 도로, 즉 공로에 해당한다고 봄이 타당하고, 丙의 청구는 권리남용이라고 볼 여지가 큰데도, 이와 달리 본 원심판단에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=214605"},{"id":"P:234343","kind":"P","label":"2020도16527","title":"재물손괴","court":"대법원","date":"2021.03.11","caseType":"형사","basis":"참조조문","text":"형법 제20조에서 정한 ‘사회상규에 위배되지 아니하는 행위’의 의미 및 정당행위를 인정하기 위한 요건 / 어떠한 행위가 정당한 행위로서 위법성이 조각되는 것인지 판단하는 기준 및 구체적인 사안에서 정당행위로 인정되기 위한 긴급성이나 보충성의 정도","url":"https://www.law.go.kr/precInfoP.do?precSeq=234343"},{"id":"P:214591","kind":"P","label":"2018오2","title":"폭력행위등처벌에관한법률위반(변경된죄명:특수감금)","court":"대법원","date":"2021.03.11","caseType":"형사","basis":"판례내용","text":"비상상고 제도의 의의와 기능 / 형사소송법이 정한 비상상고이유인 ‘그 사건의 심판이 법령에 위반한 때’의 의미 및 단순히 법령을 적용하는 과정에서 전제가 되는 사실을 오인함에 따라 법령위반의 결과를 초래한 경우가 여기에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=214591"},{"id":"P:216993","kind":"P","label":"2019도1721","title":"사기ㆍ횡령","court":"대법원","date":"2021.03.11","caseType":"형사","basis":"참조조문","text":"부동산 실권리자명의 등기에 관한 법률을 위반한 이른바 양자간 명의신탁의 경우, 명의수탁자가 명의신탁자에 대한 관계에서 ‘타인의 재물을 보관하는 자’의 지위에 있는지 여부 및 이때 명의수탁자가 신탁받은 부동산을 임의로 처분하면 명의신탁자에 대한 관계에서 횡령죄가 성립하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=216993"},{"id":"P:214575","kind":"P","label":"2019오1","title":"폭력행위등처벌에관한법률위반(인정된 죄명: 특수감금)[형제복지원 비상상고 사건]","court":"대법원","date":"2021.03.11","caseType":"형사","basis":"판례내용","text":"상급심의 파기판결에 의해 효력을 상실한 재판이 형사소송법 제441조에 따른 비상상고의 대상이 될 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=214575"},{"id":"P:214587","kind":"P","label":"2019두57831","title":"의료기관개설허가취소처분취소","court":"대법원","date":"2021.03.11","caseType":"일반행정","basis":"판례내용","text":"[1] 의료법 제64조 제1항 제8호에 해당하는 경우, 관할 행정청은 반드시 해당 의료기관에 대하여 개설 허가 취소처분을 해야 하는지 여부 [2] 법인이 개설한 의료기관에서 거짓으로 진료비를 청구하였다는 범죄사실로 법인의 대표자가 금고 이상의 형을 선고받고 형이 확정된 경우, 의료법 제64조 제1항 제8호에 따라 진료비 거짓 청구가 이루어진 해당 의료기관의 개설 허가 취소처분을 해야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=214587"},{"id":"P:214219","kind":"P","label":"2020도3694","title":"상습폭행(인정된 죄명: 폭행)ㆍ아동복지법위반(상습아동학대)[인정된 죄명: 아동복지법위반(아동학대)]","court":"대법원","date":"2021.02.25","caseType":"형사","basis":"판례내용","text":"[1] 공소시효를 정지ㆍ연장ㆍ배제하는 특례조항을 신설하면서 소급적용에 관한 명시적인 경과규정을 두지 않은 경우, 그 조항을 소급하여 적용할 수 있는지 판단하는 방법 [2] 아동학대범죄의 공소시효 정지 규정인 아동학대범죄의 처벌 등에 관한 특례법 제34조의 취지 / 같은 법 제34조 제1항은 완성되지 않은 공소시효의 진행을 일정한 요건에서 장래를 향하여 정지시키는 것인지 여부 및 그 시행일 당시 범죄행위가 종료되었으나 아직 공소시효가 완성되지 않은 아동학대범죄에 대해서도 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=214219"},{"id":"P:213717","kind":"P","label":"2016도18761","title":"사기·횡령","court":"대법원","date":"2021.02.18","caseType":"형사","basis":"참조조문","text":"[1] 횡령죄에서 말하는 ‘보관’의 의미 / 횡령죄 성립에 필요한 법률상 또는 사실상의 위탁관계는 횡령죄로 보호할 만한 가치 있는 신임에 의한 것으로 한정되는지 여부 및 위탁관계가 있는지 판단하는 기준 [2] 부동산 실권리자명의 등기에 관한 법률을 위반하여 명의신탁자가 그 소유인 부동산의 등기명의를 명의수탁자에게 이전하는 이른바 양자간 명의신탁의 경우, 명의수탁자가 명의신탁자에 대한 관계에서 ‘타인의 재물을 보관하는 자’의 지위에 있는지 여부 및 이때 명의수탁자가 신탁받은 부동산을 임의로 처분하면 명의신탁자에 대한 관계에서 횡령죄가 성립하는지 여부 / 이러한 법리는, 부동산 명의신탁이 같은 법 시행 전에 이루어졌고 같은 법에서 정한 유예기간 내에 실명등기를 하지 아니함으로써 그 명의신탁약정 및 이에 따라 행하여진 등기에 의한 물권변동이 무효로 된 후에 처분행위가 이루어진 경우에도 마찬가지로 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=213717"},{"id":"P:614635","kind":"P","label":"2018노2230","title":"위계공무집행방해·출입국관리법위반","court":"창원지방법원","date":"2021.02.17","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=614635"},{"id":"P:217593","kind":"P","label":"2020노1337","title":"사기ㆍ사문서위조ㆍ전기통신사업법위반","court":"서울동부지방법원","date":"2021.02.17","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=217593"},{"id":"P:234377","kind":"P","label":"2018노2230","title":"위계공무집행방해·출입국관리법위반","court":"창원지방법원","date":"2021.02.17","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=234377"},{"id":"P:230809","kind":"P","label":"2019노3688","title":"강제추행","court":"의정부지방법원","date":"2021.02.15","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=230809"},{"id":"P:213725","kind":"P","label":"2019도18700","title":"도시및주거환경정비법위반","court":"대법원","date":"2021.02.10","caseType":"형사","basis":"판례내용","text":"[1] 정비사업 시행과 관련한 서류 및 자료를 공개하여야 할 의무 또는 조합원 등의 열람ㆍ복사 요청에 따라야 할 의무를 규정하고 이를 위반하는 행위를 처벌하는 도시 및 주거환경정비법 제124조 제1항, 제4항, 제138조 제1항 제7호의 입법 취지 [2] ‘조합원의 전화번호’가 도시 및 주거환경정비법 제124조 제4항에 따른 열람ㆍ복사의 대상인지 여부 [3] ‘조합원별 신축건물 동호수 배정 결과’가 도시 및 주거환경정비법 제124조 제4항에 따른 열람ㆍ복사의 대상인지 여부 [4] 정비사업조합의 ‘조합원’이자 ‘감사’인 사람이 정비사업 관련 자료의 열람ㆍ복사를 요청한 경우, 조합임원은 도시 및 주거환경정비법 제124조 제4항에 따라 열람ㆍ복사를 허용할 의무를 부담하는지 여부 및 이를 위반하여 열람ㆍ복사를 허용하지 않는 경우에는 같은 법 제138조 제1항 제7호에 따라 형사처벌의 대상이 되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=213725"},{"id":"P:219915","kind":"P","label":"2020도12103","title":"수뢰후부정처사(일부 인정된 죄명: 뇌물수수)·공무상비밀누설·증거인멸교사","court":"대법원","date":"2021.02.04","caseType":"형사","basis":"참조조문","text":"수뢰후부정처사죄를 정한 형법 제131조 제1항의 구성요건 중 ‘형법 제129조 및 제130조의 죄를 범하여’의 의미 / 단일하고도 계속된 범의 아래 일정 기간 반복하여 일련의 뇌물수수 행위와 부정한 행위가 행하여졌고 뇌물수수 행위와 부정한 행위 사이에 인과관계가 인정되며 피해법익도 동일한 경우, 최후의 부정한 행위 이후에 저질러진 뇌물수수 행위도 최후의 부정한 행위 이전의 뇌물수수 행위 및 부정한 행위와 함께 수뢰후부정처사죄의 포괄일죄로 처벌하여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=219915"},{"id":"P:238127","kind":"P","label":"2020고합7","title":"특정경제범죄가중처벌등에관한법률위반(사기)·특정경제범죄가중처벌등에관한법률위반(횡령)·업무상횡령·의료법위반·특정경제범죄가중처벌등에관한법률위반(사기)방조·의료법위반방조","court":"대구지방법원포항지원","date":"2021.02.04","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=238127"},{"id":"P:226799","kind":"P","label":"2019도10999","title":"특정범죄가중처벌등에관한법률위반(허위세금계산서교부등)·관세법위반·조세범처벌법위반","court":"대법원","date":"2021.02.04","caseType":"형사","basis":"참조조문","text":"[1] 제1심판결에 대하여 항소가 된 경우 판결의 확정력이 미치는 시간적 한계 [2] 매입처별세금계산서합계표에 기재된 매입처의 공급가액에 해당하는 실물거래가 전혀 존재하지 않거나 일부 실물거래가 존재하더라도 전체적으로 공급가액을 부풀려 허위로 기재한 합계표를 정부에 제출한 경우, 그 가공 혹은 허위의 공급가액 부분 전체에 관하여 위 허위기재를 내용으로 하는 구 조세범 처벌법 제10조 제3항 제3호에 해당하는지 여부 / 이때 통정하여 일부 실물거래가 존재하나 전체적으로 공급가액을 부풀려 거짓으로 기재한 매입처별세금계산서합계표를 정부에 제출한 부분에 대하여는 같은 조 제2항 제2호가 별도로 성립하는지 여부 및 양자의 죄수관계","url":"https://www.law.go.kr/precInfoP.do?precSeq=226799"},{"id":"P:222837","kind":"P","label":"2020노1139","title":"특정경제범죄가중처벌등에관한법률위반(배임)","court":"서울고등법원","date":"2021.02.04","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=222837"},{"id":"P:226789","kind":"P","label":"2018도9781","title":"준강제추행","court":"대법원","date":"2021.02.04","caseType":"형사","basis":"참조조문","text":"[1] 형법 제299조에서 규정한 준강제추행죄의 보호법익 [2] 준강간죄 및 준강제추행죄에서 말하는 ‘심신상실’, ‘항거불능’ 상태의 의미 / 피해자가 깊은 잠에 빠져 있거나 술·약물 등에 의해 일시적으로 의식을 잃은 상태 또는 완전히 의식을 잃지는 않았더라도 그와 같은 사유로 정상적인 판단능력과 대응·조절능력을 행사할 수 없는 상태에 있는 경우, 준강간죄 및 준강제추행죄에서의 심신상실 또는 항거불능 상태에 해당하는지 여부 [3] ‘알코올 블랙아웃’의 의미 및 의식상실과의 구별 / 음주로 심신상실 상태에 있는 피해자에 대하여 준강간 또는 준강제추행을 하였음을 이유로 기소된 피고인이 ‘피해자가 범행 당시 의식상실 상태가 아니었고 그 후 기억하지 못할 뿐이다.’라는 취지에서 알코올 블랙아웃을 주장하는 경우, 범행 당시 피해자가 심신상실 또는 항거불능 상태에 있었는지 판단하는 기준 / 피해사실 전후의 객관적 정황상 피해자가 심신상실 등이 의심될 정도로 비정상적인 상태에 있었음이 밝혀진 경우 혹은 피해자와 피고인의 관계 등에 비추어 피해자가 정상적인 상태하에서라면 피고인과 성적 관계를 맺거나 이에 수동적으로나마 동의하리라고 도저히 기대하기 어려운 사정이 인정되는 경우, 피해자의 단편적인 모습만으로 피해자가 단순히 ‘알코올 블랙아웃’에 해당하여 심신상실 상태에 있지 않았다고 단정할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=226789"},{"id":"P:217509","kind":"P","label":"2020노133","title":"아동ㆍ청소년의성보호에관한법률위반(음란물제작ㆍ배포등) ㆍ 아동ㆍ청소년의성보호에관한법률위반(유사성행위) ㆍ 아동ㆍ청소년의성보호에관한법률위반(강제추행) ㆍ 아동복지법위반(아동에대한음행강요ㆍ매개ㆍ성희롱등) ㆍ 아동ㆍ청소년의성보호에관한법률위반(음란물소지)","court":"서울고등법원춘천재판부","date":"2021.02.03","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=217509"},{"id":"P:220057","kind":"P","label":"2020노531","title":"공무상비밀누설","court":"서울고등법원","date":"2021.01.29","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=220057"},{"id":"P:237627","kind":"P","label":"2020고단421","title":"업무방해","court":"서울중앙지방법원","date":"2021.01.28","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=237627"},{"id":"P:213171","kind":"P","label":"2020도2642","title":"증거위조·위조증거사용","court":"대법원","date":"2021.01.28","caseType":"형사","basis":"참조조문","text":"[1] 증거위조죄에서 말하는 ‘증거’의 의미 / 형 또는 징계의 경중에 관계있는 정상을 인정하는 데 도움이 될 자료가 증거위조죄의 증거에 포함되는지 여부 [2] 증거위조죄에서 말하는 ‘위조’의 의미 / 사실의 증명을 위해 작성된 문서가 그 사실에 관한 내용이나 작성명의 등에 아무런 허위가 없는 경우, ‘증거위조’에 해당하는지 여부 및 사실증명에 관한 문서가 형사사건 또는 징계사건에서 허위의 주장에 관한 증거로 제출되어 그 주장을 뒷받침하게 되더라도 마찬가지인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=213171"},{"id":"P:241171","kind":"P","label":"2020노870","title":"사기미수·도시및주거환경정비법위반","court":"서울북부지방법원","date":"2021.01.26","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=241171"},{"id":"P:220131","kind":"P","label":"2019고합138","title":"특정경제범죄가중처벌등에관한법률위반(배임)(피고인1,피고인2에대하여일부인정된죄명:업무상배임)·업무상횡령·주택법위반·사전자기록등변작·변작사전자기록등행사","court":"청주지방법원","date":"2021.01.22","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=220131"},{"id":"P:220387","kind":"P","label":"2020고합77","title":"강간치상·마약류관리에관한법률위반(향정)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영)·강제추행·특정경범죄가중처벌등에관한법률위반(사기)·사기·공문서위조·위조공문서행사·부착명령·배상명령신청","court":"울산지방법원","date":"2021.01.22","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=220387"}],"edges":[{"source":"L:5","target":"L:225","kind":"cites","weight":1},{"source":"L:5","target":"L:230","kind":"cites","weight":1},{"source":"L:5","target":"L:238","kind":"cites","weight":1},{"source":"L:33","target":"L:30","kind":"cites","weight":1},{"source":"L:33","target":"L:32","kind":"cites","weight":1},{"source":"L:50","target":"L:41","kind":"cites","weight":1},{"source":"L:56","target":"L:34","kind":"cites","weight":1},{"source":"L:59","target":"L:51","kind":"cites","weight":1},{"source":"L:61","target":"L:59-2","kind":"cites","weight":1},{"source":"L:62","target":"L:51","kind":"cites","weight":1},{"source":"L:64","target":"L:62","kind":"cites","weight":1},{"source":"L:64","target":"     { selector: "node.gone", style: { "background-opacity": 0.25, "border-width": 0.6, "border-color": t.muted, "border-style": "dashed", color: t.fg } },
    { selector: "node.chapter", style: { label: "data(ch)", width: 1, height: 1, "background-opacity": 0, "font-family": "Nanum Myeongjo, serif", "font-weight": 700, "font-size": 9, color: t.muted, "text-wrap": "wrap", "text-max-width": 70, "line-height": 1.3, "text-background-color": t.bg, "text-background-opacity": 0.8, "text-background-padding": 2, events: "no", "min-zoomed-font-size": 4 } },
    { selector: "edge", style: { "curve-style": "haystack", "haystack-radius": 0, width: grow(0.5), opacity: 0.39 } },
    { selector: "edge.delegates", style: { "line-color": t.decree, width: grow(0.8), opacity: 0.8 } },

    { selector: "edge.precedent", style: { "line-color": t.prec, opacity: 0.32 } },
    { selector: "edge.external", style: { "line-color": t.ext, opacity: 0.62 } },
    { selector: ".faded", style: { opacity: 0.07 } },

const cy = cytoscape({
  container: document.getElementById("cy"),
  elements, layout: { name: "preset" }, style: style(tokens()),
  minZoom: 0.01, maxZoom: 8, wheelSensitivity: 0.25, boxSelectionEnabled: false, autoungrabify: true,
});
const fitAll = (animate = false) => animate
  ? cy.animate({ fit: { eles: cy.elements(":visible"), padding: 16 }, duration: 300 })
  : cy.fit(cy.elements(":visible"), 16);
/* 장 이름은 확대와 상관없이 화면에서 11px로 보이게 하고, 이웃 장 이름과 겹치면 조문이 적은 장 쪽을 숨긴다 */
function chapterLabels() {
  const z = cy.zoom(), fs = Math.max(3, 11 / z);
  const chs = cy.nodes(".chapter");
  chs.style({ "font-size": fs, "text-max-width": fs * 8, "text-background-padding": fs * 0.2, "text-opacity": 1, "text-background-opacity": 0.8 });
  const kept = [], gap = fs * 0.4;
  const hit = (a, b) => a.x1 - gap < b.x2 && b.x1 - gap < a.x2 && a.y1 - gap < b.y2 && b.y1 - gap < a.y2;
  chs.sort((a, b) => G.chapters[+b.id().slice(2)].count - G.chapters[+a.id().slice(2)].count).forEach(n => {
    // 한글 한 글자를 대략 글자 크기만큼 넓다고 보고, text-max-width에서 줄바꿈되는 상자를 어림한다
    const len = [...n.data("ch")].length, w = Math.min(len, 8) * fs, h = Math.ceil(len / 8) * fs * 1.3, p = n.position();
    const bb = { x1: p.x - w / 2, x2: p.x + w / 2, y1: p.y - h / 2, y2: p.y + h / 2 };
    if (kept.some(k => hit(k, bb))) n.style({ "text-opacity": 0, "text-background-opacity": 0 }); else kept.push(bb);
  });
}
let growQueued = false;
function updateGrow() {
  const g = Math.max(1, 0.45 / cy.zoom());
  if (Math.abs(g - GROW) / GROW < 0.05 || growQueued) return;
  growQueued = true;
  requestAnimationFrame(() => { GROW = Math.max(1, 0.45 / cy.zoom()); growQueued = false; cy.style().update(); });
}
cy.on("zoom", () => { chapterLabels(); updateGrow(); });
const restyle = () => { cy.style(style(tokens())); chapterLabels(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", restyle);
new MutationObserver(restyle).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

/* ---------- 필터 ---------- */
const kinds = ["delegates", "cites", "precedent", "external"];
function applyFilters() {
  cy.batch(() => {
    for (const k of kinds) {
      const on = document.getElementById("t-" + k).checked;
      cy.edges("." + k).style("display", on ? "element" : "none");
    }
    const showP = document.getElementById("t-precedent").checked;
    const showX = document.getElementById("t-external").checked;
    cy.nodes(".P").style("display", showP ? "element" : "none");
    cy.nodes(".X").style("display", showX ? "element" : "none");
  });
  if (current) select(current, false);
}
kinds.forEach(k => document.getElementById("t-" + k).addEventListener("change", applyFilters));

/* ---------- 선택과 패널 ---------- */
let current = null;
const panel = document.getElementById("panel");

const narrow = matchMedia("(max-width: 960px)");
const FOCUS_MAX = 2.5;
// 선택한 조문과 이웃을 그래프 중 실제로 보이는 부분(화면 밖·바닥 시트 아래 제외)에 맞춘다. 연결이 적어도 FOCUS_MAX배 넘게 확대하지 않는다.
function focusOn(eles) {
  const box = cy.container().getBoundingClientRect();
  const floor = panel.classList.contains("sheet") ? panel.getBoundingClientRect().top : innerHeight;
  const top = Math.max(box.top, 0), bottom = Math.min(box.bottom, floor);
  const vis = { y: top - box.top, w: box.width, h: Math.max(160, bottom - top) };
  const bb = eles.boundingBox(), pad = 36;
  const z = Math.min(FOCUS_MAX, (vis.w - 2 * pad) / Math.max(bb.w, 1), (vis.h - 2 * pad) / Math.max(bb.h, 1));
  const pan = { x: vis.w / 2 - z * (bb.x1 + bb.w / 2), y: vis.y + vis.h / 2 - z * (bb.y1 + bb.h / 2) };
  cy.animate({ zoom: z, pan, duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 350 });
}
function setSheet(on) {
  panel.classList.toggle("sheet", on);
  document.body.classList.toggle("sheet-open", on);
}

function select(id, move = true) {
  current = id;
  setHash(id);
  const n = cy.$id(id);
  cy.batch(() => {
    cy.elements().removeClass("hl sel").addClass("faded");
    const hood = n.closedNeighborhood().filter(el => el.style("display") !== "none");
    hood.removeClass("faded").addClass("hl");
    n.addClass("sel");
  });
  renderNode(byId.get(id));
  setSheet(narrow.matches);
  if (!move) return;
  if (narrow.matches) { // 그래프 윗부분을 화면 맨 위로 올려, 시트 위로 그래프가 보이게 한다
    const t = cy.container().getBoundingClientRect().top;
    if (Math.abs(t) > 4) window.scrollTo({ top: scrollY + t, behavior: "instant" });
  }
  focusOn(n.closedNeighborhood(":visible"));
}
function clearSel() {
  current = null;
  setHash(null);
  cy.elements().removeClass("faded hl sel");
  setSheet(false);
  renderHome();
}
cy.on("tap", "node", e => { if (!e.target.hasClass("chapter")) select(e.target.id()); });
cy.on("tap", e => { if (e.target === cy) clearSel(); });
document.getElementById("reset").addEventListener("click", () => { clearSel(); fitAll(true); });

const lawUrl = n => {
  const name = MAIN.replace(/\s/g, "") + ({ L: "", D: "시행령", R: "시행규칙" }[n.kind]);
  return "https://www.law.go.kr/법령/" + name + "/" + n.label.replace(/^(법|영|규칙) /, "");
};
const color = k => ({ L: "var(--law)", D: "var(--decree)", R: "var(--rule)", P: "var(--prec)", X: "var(--ext)" }[k]);

function itemBtn(n, extra = "") {
  const title = n.kind === "P" ? `${n.court || ""} ${fmtDate(n.date)} ${n.title || ""}` : (n.title || "");
  return `<button class="item" type="button" data-id="${esc(n.id)}"><span class="no"><span class="dot" style="background:${color(n.kind)}"></span>${esc(n.label)}</span><span class="t">${esc(title)}</span><span class="n">${extra}</span></button>`;
}
function group(title, list, limit = 12) {
  if (!list.length) return "";
  const shown = list.slice(0, limit).map(([n, extra]) => itemBtn(n, extra)).join("");
  const rest = list.length > limit ? `<button class="item more" type="button" data-more>외 ${list.length - limit}건 더 보기</button><div class="list" hidden>${list.slice(limit).map(([n, extra]) => itemBtn(n, extra)).join("")}</div>` : "";
  return `<section><h3>${esc(title)} · ${list.length}</h3><div class="list">${shown}${rest}</div></section>`;
}
const neigh = (id, dir, kind) => ((dir === "out" ? outE : inE).get(id) || []).filter(e => e.kind === kind)
  .map(e => [byId.get(dir === "out" ? e.target : e.source), e.weight > 1 ? "×" + e.weight : ""]);
const sortArt = l => l.sort((a, b) => (a[0].kind === b[0].kind ? artKey(a[0].id) - artKey(b[0].id) : a[0].kind.localeCompare(b[0].kind)));
const sortPrec = l => l.sort((a, b) => (b[0].date || "").localeCompare(a[0].date || ""));

function renderNode(n) {
  let html = "";
  if (isArt(n.kind)) {
    html += `<div><div class="kindtag"><span class="chip" style="--k:${color(n.kind)}">${KIND[n.kind].long}</span>${esc(n.chapter || "")}</div>
      <h2>${esc(n.label)}${n.title ? " (" + esc(n.title) + ")" : ""}</h2></div>`;
    if (n.ghost) html += `<p class="note">현행 법에는 이 번호의 조문이 없습니다. 판례가 개정 전 조문 번호로 인용한 것입니다.</p>`;
    else if (n.deleted) html += `<p class="note">현행 법에서 삭제된 조문입니다. 이 조문을 다룬 판례는 삭제 전 조문을 인용한 것입니다.</p>`;
    else html += `<div class="lawtext">${esc(n.text.replace(/^제\d+조(의\d+)?\([^)]*\)\s*/, ""))}</div>
      <a class="note" href="${lawUrl(n)}" target="_blank" rel="noopener">국가법령정보센터에서 보기 ↗</a>`;
    html += group(n.kind === "L" ? "하위 법령에 위임" : "위임 근거 (법)", sortArt(neigh(n.id, n.kind === "L" ? "out" : "in", "delegates")));
    html += group("이 조문이 인용하는 조문", sortArt(neigh(n.id, "out", "cites")));
    html += group("이 조문을 인용하는 조문", sortArt(neigh(n.id, "in", "cites")));
    html += group("인용하는 다른 법령", neigh(n.id, "out", "external"));
    html += group("이 조문을 다룬 판례", sortPrec(neigh(n.id, "in", "precedent").map(([p]) => [p, p.court === "대법원" ? "대법원" : ""])), 15);
  } else if (n.kind === "P") {
    html += `<div><div class="kindtag"><span class="chip" style="--k:var(--prec)">${esc(n.court || "법원")}</span>${[fmtDate(n.date) && esc(fmtDate(n.date)) + " 선고", esc(n.caseType || "")].filter(Boolean).join(" · ")}</div>
      <h2>${esc(n.label)}</h2><div class="note">${esc(n.title)}</div></div>`;
    if (n.text) html += `<section><h3>판시사항</h3><div class="lawtext">${esc(n.text)}</div></section>`;
    html += `<p class="note">조문 연결 근거: ${esc(n.basis)}${n.basis === "판례내용" ? " (판결문 본문에서 자동 추출)" : ""}. <a href="${esc(n.url)}" target="_blank" rel="noopener">판결문 보기 ↗</a></p>`;
    html += group("인용한 조문", sortArt(neigh(n.id, "out", "precedent")), 30);
  } else {
    html += `<div><div class="kindtag"><span class="chip" style="--k:var(--ext)">다른 법령</span></div><h2>${esc(n.label)}</h2></div>`;
    html += group("이 법령을 인용하는 조문", sortArt(neigh(n.id, "in", "external")));
  }
  panel.innerHTML = `<div><button class="btn" type="button" id="back">← 전체 요약으로</button></div>` + html;
  panel.scrollTop = 0;
}

function rank(title, note, rows, colorVar) {
  const max = Math.max(...rows.map(r => r[1]));
  return `<section><h3>${esc(title)}</h3>${note ? `<p class="note" style="margin:0 0 6px">${note}</p>` : ""}<div class="list">${rows.map(([n, v]) =>
    `<button class="item" type="button" data-id="${esc(n.id)}"><span class="no">${esc(n.label)}</span><span class="t">${esc(n.title)}</span><span class="n">${v}</span><span class="bar" style="background:${colorVar};width:${(v / max * 100).toFixed(1)}%"></span></button>`).join("")}</div></section>`;
}
function renderHome() {
  const lawN = G.nodes.filter(n => n.kind === "L" && !n.ghost);
  const top = (fn, k = 8) => lawN.map(n => [n, fn(n.id)]).filter(r => r[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, k);
  const inCites = id => (inE.get(id) || []).filter(e => e.kind === "cites").reduce((s, e) => s + e.weight, 0);
  const dels = id => (outE.get(id) || []).filter(e => e.kind === "delegates").length;
  panel.innerHTML = `
    <div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4.5V3M4.6 6.1 3.5 5M3 10.5H4.5M14.5 5l-1 1.1"/><path d="m9 9 11 3.6-4.6 1.8L13.6 19z"/></svg>
      <p>그래프에서 조문이나 판례를 클릭하여 상세 내용을 확인하세요.</p></div>
    <div><div class="kindtag">읽는 법</div>
    <p class="note" style="margin:4px 0 0">파란 원이 법 조문(숫자는 조 번호), 주황 네모가 시행령 조문${hasRule ? ", 청록 세모가 시행규칙 조문" : ""}, 보라 마름모가 판례입니다. 하위 법령과 판례는 자신이 연결된 법 조문 쪽에 놓여 있어, 판례가 몰린 방향이 곧 분쟁이 많은 조문입니다. 큰 마름모는 대법원 판결입니다.</p></div>
    ${rank("판례가 가장 많이 다룬 조문", "", top(precCount), "var(--prec)")}
    ${rank("법 안에서 가장 많이 인용되는 조문", "", top(inCites), "var(--cite)")}
    ${rank(hasRule ? "시행령·시행규칙 위임이 가장 많은 조문" : "시행령 위임이 가장 많은 조문", "", top(dels, 6), "var(--decree)")}`;
}
panel.addEventListener("click", e => {
  const more = e.target.closest("[data-more]");
  if (more) { more.nextElementSibling.hidden = false; more.remove(); return; }
  if (e.target.closest("#back")) { clearSel(); fitAll(true); return; }
  const b = e.target.closest("[data-id]");
  if (b) select(b.dataset.id);
});

/* ---------- 검색 ---------- */
const q = document.getElementById("q"), results = document.getElementById("results");
const smallQ = matchMedia("(max-width: 600px)");
q.dataset.long = q.placeholder;
const setPlaceholder = () => { q.placeholder = smallQ.matches ? "조문·제목·사건번호 (예: 17, 영 3)" : q.dataset.long; };
setPlaceholder();
smallQ.addEventListener("change", setPlaceholder);
narrow.addEventListener("change", () => setSheet(narrow.matches && current !== null));
function search(s) {
  s = s.trim();
  if (!s) return [];
  let kind = null, m;
  if ((m = s.match(/^(법|영|시행령|규칙|시행규칙)\s*(.*)$/))) { kind = m[1] === "법" ? "L" : /규칙/.test(m[1]) ? "R" : "D"; s = m[2]; }
  const num = s.match(/^제?\s*(\d+)\s*(?:조)?\s*(?:의\s*(\d+))?$/);
  const out = [];
  for (const n of G.nodes) {
    if (kind && n.kind !== kind) continue;
    let score = 0;
    if (num && isArt(n.kind)) {
      const id = n.kind + ":" + (+num[1]) + (num[2] ? "-" + (+num[2]) : "");
      if (n.id === id) score = { L: 100, D: 90, R: 85 }[n.kind];
      else if (n.id.startsWith(n.kind + ":" + (+num[1]) + "-") && !num[2]) score = 40;
    }
    if (!score && s.length >= 2) {
      if (n.label.includes(s)) score = 60;
      else if ((n.title || "").includes(s)) score = 50;
      else if (n.kind === "L" && n.text.includes(s)) score = 10;
    }
    if (score) out.push([score, n]);
  }
  return out.sort((a, b) => b[0] - a[0] || artKey(a[1].id.replace(/^P:.*/, "Z:0")) - artKey(b[1].id.replace(/^P:.*/, "Z:0"))).slice(0, 12).map(r => r[1]);
}
q.addEventListener("input", () => {
  const list = search(q.value);
  results.hidden = !list.length;
  results.innerHTML = list.map(n => itemBtn(n)).join("");
});
q.addEventListener("keydown", e => {
  if (e.key === "Enter") { const first = results.querySelector("[data-id]"); if (first) first.click(); }
  if (e.key === "Escape") { results.hidden = true; }
});
document.getElementById("q-clear").addEventListener("click", () => {
  q.value = "";
  results.hidden = true;
  results.innerHTML = "";
  q.focus();
});
// 숨겨 둔 종류(판례·다른 법령)를 고르면 그 종류를 다시 켠다
function reveal(n) {
  if (n.kind === "P" && !document.getElementById("t-precedent").checked) { document.getElementById("t-precedent").checked = true; applyFilters(); }
  if (n.kind === "X" && !document.getElementById("t-external").checked) { document.getElementById("t-external").checked = true; applyFilters(); }
}
results.addEventListener("click", e => {
  const b = e.target.closest("[data-id]");
  if (!b) return;
  reveal(byId.get(b.dataset.id));
  results.hidden = true;
  select(b.dataset.id);
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) results.hidden = true; });

/* ---------- 머리말·각주 ---------- */
const M = G.meta, cnt = k => G.nodes.filter(n => n.kind === k && !n.ghost).length, ecnt = k => G.edges.filter(e => e.kind === k).length;
const d8 = s => `${s.slice(0, 4)}. ${+s.slice(4, 6)}. ${+s.slice(6)}.`;
const T = M.tiers, tierList = ["L", "D", "R"].filter(k => T[k]);
document.getElementById("eyebrow").textContent = tierList.map(k => `${{ L: "법률", D: "시행령", R: "시행규칙" }[k]} ${d8(T[k].efYd)}`).join(" · ") + " 시행본 기준";
document.getElementById("stats").innerHTML = [
  ["var(--law)", "법 조문", cnt("L")], ["var(--decree)", "시행령 조문", cnt("D")], ...(hasRule ? [["var(--rule)", "시행규칙 조문", cnt("R")]] : []), ["var(--prec)", "판례", cnt("P")], ["var(--ext)", "다른 법령", cnt("X")],
].map(([c, l, v]) => `<span><span class="dot" style="background:${c}"></span>${l} <b>${v}</b></span>`).join("") +
  `<span>위임 <b>${ecnt("delegates")}</b> · 조문 인용 <b>${ecnt("cites")}</b> · 판례 연결 <b>${ecnt("precedent")}</b></span>`;

const setHash = id => history.replaceState(null, "", id ? "#" + encodeURI(id) : location.pathname + location.search);
function fromHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (!id) { if (current) clearSel(); return; }
  if (!byId.has(id) || id === current) return;
  reveal(byId.get(id));
  select(id);
}
