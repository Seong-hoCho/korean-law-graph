<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>형법 참조 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
/* Layout: 법 조문을 장(章) 순서대로 둥글게 놓은 '조문 바퀴' — 안쪽 원이 법, 그 바깥이 시행령, 가장 바깥이 판례·다른 법령. 넓은 화면은 오른쪽 패널, 좁은 화면은 아래 패널(선택 중에는 바닥 시트)에 선택한 조문의 연결 관계를 보여 준다. */
:root {
  --bg: #f2eee4;
  --surface: #fffdf7;
  --fg: #231f19;
  --muted: #675e51;
  --line: #dbd2c2;
  --law: #1f4b89;
  --decree: #b26b12;
  --prec: #8a3a6c;
  --rule: #2c8577;
  --ext: #7d7264;
  --cite: #3d7cb5;
  --sel: var(--fg); /* 선택·초점 표시는 따로 강조색을 두지 않고 먹색 */
  --font-display: "Nanum Myeongjo", "Noto Serif KR", "Batang", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16140f; --surface: #1f1c16; --fg: #ece6da; --muted: #a59c8c; --line: #353026;
    --law: #76a0db; --decree: #e3a14a; --prec: #d27fb2; --rule: #5cc2b1; --ext: #b3a898; --cite: #7fb2e3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16140f; --surface: #1f1c16; --fg: #ece6da; --muted: #a59c8c; --line: #353026;
  --law: #76a0db; --decree: #e3a14a; --prec: #d27fb2; --rule: #5cc2b1; --ext: #b3a898; --cite: #7fb2e3;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.55;
  word-break: keep-all; overflow-wrap: break-word;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 40px;
}
.wrap { max-width: 1440px; margin: 0 auto; display: grid; gap: 24px; }
header { display: grid; gap: 6px; }
.eyebrow { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(33px, 3.4vw, 46px); line-height: 1.2; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 70ch; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.stats b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

/* 넓은 화면은 패널을 그래프 왼쪽에, 좁은 화면은 문서 순서대로 그래프 아래에 */
.main { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 24px; align-items: start; }
.main > .panel { order: -1; }
@media (max-width: 960px) { .main { grid-template-columns: minmax(0, 1fr); } .main > .panel { order: 0; } }

.stage { background: var(--surface); border-radius: 2px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
/* 초점 표시: 바깥선 대신 상자 면 색 틈 + 먹색 반투명 고리 */
:root { --ring: 0 0 0 2px var(--surface), 0 0 0 4px color-mix(in srgb, var(--sel) 55%, transparent); --ease: 160ms cubic-bezier(.2, .7, .3, 1); }
:where(button, a, input, [tabindex]):focus-visible { outline: none; box-shadow: var(--ring); }

.search { position: relative; flex: 1 1 220px; min-width: 0; }
.search input { width: 100%; font: inherit; font-size: 13px; height: 36px; padding: 0 34px 0 34px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg);
  transition: border-color var(--ease), background-color var(--ease), box-shadow var(--ease); }
.search input::placeholder { color: var(--muted); }
.search input:hover { border-color: color-mix(in srgb, var(--muted) 55%, var(--line)); }
.search input:focus { background: var(--surface); border-color: var(--muted); }
.search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }
.search-icon { position: absolute; left: 11px; top: 18px; translate: 0 -50%; width: 15px; height: 15px; color: var(--muted); pointer-events: none; }
.search-clear { position: absolute; right: 5px; top: 18px; translate: 0 -50%; width: 26px; height: 26px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer;
  transition: background-color var(--ease), color var(--ease); }
.search-clear:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); color: var(--fg); }
.search-clear svg { width: 14px; height: 14px; }
/* 검색어가 없으면(placeholder가 보이면) 지우기 버튼을 숨긴다 */
.search input:placeholder-shown ~ .search-clear { display: none; }
.results { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 2px; max-height: 300px; overflow-y: auto; box-shadow: 0 8px 24px rgb(0 0 0 / .12); }
/* 연결 종류 칩: 켜지면 종류 색이 은은하게 깔리고, 꺼지면 테두리만 남는다 (--c는 HTML에서 종류마다 지정) */
.toggles { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; }
label.tog { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 10px; border: 1px solid var(--line); border-radius: 999px;
  color: var(--muted); background: transparent; cursor: pointer; user-select: none;
  transition: background-color var(--ease), border-color var(--ease), color var(--ease), box-shadow var(--ease); }
label.tog:hover { border-color: color-mix(in srgb, var(--c) 45%, var(--line)); color: var(--fg); }
label.tog input { position: absolute; inset: 0; margin: 0; opacity: 0; appearance: none; -webkit-appearance: none; cursor: pointer; border-radius: inherit; }
label.tog:has(input:checked) { color: var(--fg); background: color-mix(in srgb, var(--c) 13%, var(--surface)); border-color: color-mix(in srgb, var(--c) 50%, var(--line)); }
label.tog:has(input:checked):hover { background: color-mix(in srgb, var(--c) 20%, var(--surface)); }
label.tog:has(input:focus-visible) { box-shadow: var(--ring); }
label.tog input:focus-visible { box-shadow: none; }
.swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; background: var(--c); opacity: .35; transition: opacity var(--ease); }
label.tog:has(input:checked) .swatch { opacity: 1; }
/* :has를 모르는 브라우저는 체크박스를 그대로 보여 준다 */
@supports not selector(:has(*)) {
  label.tog input { position: static; opacity: 1; appearance: auto; -webkit-appearance: checkbox; accent-color: var(--fg); }
  .swatch { opacity: 1; }
}
.btn { font: inherit; font-size: 12.5px; padding: 6px 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 6px; cursor: pointer;
  transition: background-color var(--ease), border-color var(--ease), color var(--ease), box-shadow var(--ease); }
.btn:hover { border-color: var(--muted); background: color-mix(in srgb, var(--fg) 5%, var(--bg)); }
.btn:active { background: color-mix(in srgb, var(--fg) 9%, var(--bg)); }
.canvas { position: relative; }
.canvas .btn { position: absolute; top: 10px; right: 10px; z-index: 2; background: var(--surface); }
#cy { width: 100%; height: min(78vh, 820px); min-height: 440px; }
@media (max-width: 600px) {
  body { padding-block: 20px 32px; }
  .wrap, .main { gap: 16px; }
  h1 { font-size: 33px; }
  header { gap: 4px; }
  .lede { font-size: 13px; }
  .stats { font-size: 12.5px; gap: 2px 12px; }
  .toolbar { padding: 8px 10px; gap: 8px; }
  .toggles { gap: 4px 10px; }
  .swatch { width: 10px; }
  #cy { height: 70svh; min-height: 360px; }
  aside.panel { padding: 16px; }
}

aside.panel { background: var(--surface); border-radius: 2px; padding: 22px; display: grid; gap: 16px; min-width: 0; max-height: calc(min(78vh, 820px) + 63px); overflow-y: auto; }
@media (max-width: 960px) {
  aside.panel { max-height: none; }
  /* 선택 중에는 패널을 바닥 시트로 띄워, 그래프와 원문을 한 화면에서 본다 */
  aside.panel.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-height: 45svh; border-radius: 2px 2px 0 0; border-top: 1px solid var(--line);
    box-shadow: 0 -6px 24px rgb(0 0 0 / .16); padding: 14px max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  body.sheet-open { padding-bottom: calc(45svh + 32px); }
}
.panel h2 { font-family: var(--font-display); font-size: 22px; margin: 0; line-height: 1.25; text-wrap: balance; }
.panel h3 { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; margin: 0 0 6px; }
.kindtag { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
/* 종류 색(주황·청록 등)은 글자 대비가 모자라므로 테두리에만 쓰고 글자는 본문색 */
.chip { display: inline-flex; align-items: center; font-size: 11px; padding: 1px 7px; border-radius: 1px; border: 1px solid var(--k, currentColor); color: var(--fg); }
.lawtext { white-space: pre-wrap; font-size: 13px; line-height: 1.65; background: var(--bg); border-radius: 1px; padding: 10px 12px; max-height: 260px; overflow-y: auto; }
.list { display: grid; gap: 2px; }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: baseline; text-align: left; font: inherit; font-size: 13px; padding: 8px 6px; border: 0; background: none; color: var(--fg); border-radius: 1px; cursor: pointer; width: 100%; }
.item { transition: background-color var(--ease); }
.item:hover { background: var(--bg); }
.item:active { background: color-mix(in srgb, var(--fg) 7%, var(--bg)); }
/* 패널 빈 상태: 아무것도 선택하지 않았을 때 맨 위 안내 */
.empty { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 18px 12px 20px; border: 1px dashed var(--line); border-radius: 2px; color: var(--muted); }
.empty svg { width: 30px; height: 30px; color: var(--law); }
.empty p { margin: 0; font-size: 13px; max-width: 22em; text-wrap: balance; }
.item .no { font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.item .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 4px; border-radius: 1px; margin-top: 3px; grid-column: 2 / 4; }
.more { font-size: 12px; color: var(--muted); padding: 2px 6px; }
.note { font-size: 12.5px; color: var(--muted); }
a { color: var(--law); }
footer { font-size: 12.5px; color: var(--muted); display: grid; gap: 6px; max-width: 90ch; }
footer p { margin: 0; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1>형법 참조 지도</h1>
    <p class="lede">형법 조문을 장 순서대로 둥글게 놓고, 하위 법령 위임·조문 인용·판례 연결을 한 그림에 모았습니다. 조문이나 판례를 누르면 연결된 것만 남고 원문과 연결 목록이 나옵니다.</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="main">
    <section class="stage" aria-label="참조 그래프">
      <div class="toolbar">
        <div class="search">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="조문 번호·제목·사건번호 검색 (예: 17, 영 3, 국외 이전, 2023도)" autocomplete="off" aria-label="검색">
          <button class="search-clear" id="q-clear" type="button" aria-label="검색어 지우기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
          <div class="results" id="results" hidden></div>
        </div>
        <div class="toggles" role="group" aria-label="연결 종류">
          <label class="tog" style="--c:var(--decree)"><input type="checkbox" id="t-delegates" checked><span class="swatch"></span>위임</label>
          <label class="tog" style="--c:var(--cite)"><input type="checkbox" id="t-cites" checked><span class="swatch"></span>조문 인용</label>
          <label class="tog" style="--c:var(--prec)"><input type="checkbox" id="t-precedent" checked><span class="swatch"></span>판례</label>
          <label class="tog" style="--c:var(--ext)"><input type="checkbox" id="t-external"><span class="swatch"></span>다른 법령</label>
        </div>
      </div>
      <div class="canvas">
        <div id="cy"></div>
        <button class="btn" id="reset" type="button">전체 보기</button>
      </div>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>

  <footer id="foot"></footer>
</div>

<script>
const G = {"meta":{"main":"형법","tiers":{"L":{"name":"형법","efYd":"20261002","promul":"20260929"}},"precedentsListed":1000,"precedentsTotal":10531,"precedentsUnavailable":30,"precedentsFrom":"2021.01.22","precedentBasis":{"참조조문":376,"판결요지":4,"판례내용":529,"없음":61},"source":"법제처 국가법령정보 공동활용 Open API (DRF)"},"nodes":[{"id":"L:1","label":"법 제1조","title":"범죄의 성립과 처벌","chapter":"제1편 총칙 제1장 형법의 적용범위","deleted":false,"text":"① 범죄의 성립과 처벌은 행위 시의 법률에 따른다.\n② 범죄 후 법률이 변경되어 그 행위가 범죄를 구성하지 아니하게 되거나 형이 구법(舊法)보다 가벼워진 경우에는 신법(新法)에 따른다.\n③ 재판이 확정된 후 법률이 변경되어 그 행위가 범죄를 구성하지 아니하게 된 경우에는 형의 집행을 면제한다.\n제1조(범죄의 성립과 처벌)","kind":"L"},{"id":"L:2","label":"법 제2조","title":"국내범","chapter":"제1편 총칙 제1장 형법의 적용범위","deleted":false,"text":"제2조(국내범) 본법은 대한민국영역내에서 죄를 범한 내국인과 외국인에게 적용한다.","kind":"L"},{"id":"L:3","label":"법 제3조","title":"내국인의 국외범","chapter":"제1편 총칙 제1장 형법의 적용범위","deleted":false,"text":"제3조(내국인의 국외범) 본법은 대한민국영역외에서 죄를 범한 내국인에게 적용한다.","kind":"L"},{"id":"L:4","label":"법 제4조","title":"국외에 있는 내국선박 등에서 외국인이 범한 죄","chapter":"제1편 총칙 제1장 형법의 적용범위","deleted":false,"text":"제4조(국외에 있는 내국선박 등에서 외국인이 범한 죄) 본법은 대한민국영역외에 있는 대한민국의 선박 또는 항공기내에서 죄를 범한 외국인에게 적용한다.","kind":"L"},{"id":"L:5","label":"법 제5조","title":"외국인의 국외범","chapter":"제1편 총칙 제1장 형법의 적용범위","deleted":false,"text":"1. 내란의 죄\n2. 외환의 죄\n3. 국기에 관한 죄\n4. 통화에 관한 죄\n5. 유가증권, 우표와 인지에 관한 죄\n6. 문서에 관한 죄중 제225조 내지 제230조\n7. 인장에 관한 죄중 제238조\n제5조(외국인의 국외범) 본법은 대한민국영역외에서 다음에 기재한 죄를 범한 외국인에게 적용한다.","kind":"L"},{"id":"L:6","label":"법 제6조","title":"대한민국과 대한민국국민에 대한 국외범","chapter":"제1편 총칙 제1장 형법의 적용범위","deleted":false,"text":"제6조(대한민국과 대한민국국민에 대한 국외범) 본법은 대한민국영역외에서 대한민국 또는 대한민국국민에 대하여 전조에 기재한 이외의 죄를 범한 외국인에게 적용한다. 단 행위지의 법률에 의하여 범죄를 구성하지 아니하거나 소추 또는 형의 집행을 면제할 경우에는 예외로 한다.","kind":"L"},{"id":"L:7","label":"법 제7조","title":"외국에서 집행된 형의 산입","chapter":"제1편 총칙 제1장 형법의 적용범위","deleted":false,"text":"제7조(외국에서 집행된 형의 산입) 죄를 지어 외국에서 형의 전부 또는 일부가 집행된 사람에 대해서는 그 집행된 형의 전부 또는 일부를 선고하는 형에 산입한다.","kind":"L"},{"id":"L:8","label":"법 제8조","title":"총칙의 적용","chapter":"제1편 총칙 제1장 형법의 적용범위","deleted":false,"text":"제8조(총칙의 적용) 본법 총칙은 타법령에 정한 죄에 적용한다. 단, 그 법령에 특별한 규정이 있는 때에는 예외로 한다.","kind":"L"},{"id":"L:9","label":"법 제9조","title":"형사미성년자","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"제9조(형사미성년자) 14세되지 아니한 자의 행위는 벌하지 아니한다.","kind":"L"},{"id":"L:10","label":"법 제10조","title":"심신장애인","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"①심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니한다.\n②심신장애로 인하여 전항의 능력이 미약한 자의 행위는 형을 감경할 수 있다. <개정 2018.12.18>\n③위험의 발생을 예견하고 자의로 심신장애를 야기한 자의 행위에는 전2항의 규정을 적용하지 아니한다.\n제10조(심신장애인)","kind":"L"},{"id":"L:11","label":"법 제11조","title":"청각 및 언어 장애인","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"제11조(청각 및 언어 장애인) 듣거나 말하는 데 모두 장애가 있는 사람의 행위에 대해서는 형을 감경한다.","kind":"L"},{"id":"L:12","label":"법 제12조","title":"강요된 행위","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"제12조(강요된 행위) 저항할 수 없는 폭력이나 자기 또는 친족의 생명, 신체에 대한 위해를 방어할 방법이 없는 협박에 의하여 강요된 행위는 벌하지 아니한다.","kind":"L"},{"id":"L:13","label":"법 제13조","title":"고의","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"제13조(고의) 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 다만, 법률에 특별한 규정이 있는 경우에는 예외로 한다.","kind":"L"},{"id":"L:14","label":"법 제14조","title":"과실","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"제14조(과실) 정상적으로 기울여야 할 주의(注意)를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.","kind":"L"},{"id":"L:15","label":"법 제15조","title":"사실의 착오","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"① 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.\n② 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다.\n제15조(사실의 착오)","kind":"L"},{"id":"L:16","label":"법 제16조","title":"법률의 착오","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"제16조(법률의 착오) 자기의 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다.","kind":"L"},{"id":"L:17","label":"법 제17조","title":"인과관계","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"제17조(인과관계) 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다.","kind":"L"},{"id":"L:18","label":"법 제18조","title":"부작위범","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"제18조(부작위범) 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.","kind":"L"},{"id":"L:19","label":"법 제19조","title":"독립행위의 경합","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"제19조(독립행위의 경합) 동시 또는 이시의 독립행위가 경합한 경우에 그 결과발생의 원인된 행위가 판명되지 아니한 때에는 각 행위를 미수범으로 처벌한다.","kind":"L"},{"id":"L:20","label":"법 제20조","title":"정당행위","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"제20조(정당행위) 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.","kind":"L"},{"id":"L:21","label":"법 제21조","title":"정당방위","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"① 현재의 부당한 침해로부터 자기 또는 타인의 법익(法益)을 방위하기 위하여 한 행위는 상당한 이유가 있는 경우에는 벌하지 아니한다.\n② 방위행위가 그 정도를 초과한 경우에는 정황(情況)에 따라 그 형을 감경하거나 면제할 수 있다.\n③ 제2항의 경우에 야간이나 그 밖의 불안한 상태에서 공포를 느끼거나 경악(驚愕)하거나 흥분하거나 당황하였기 때문에 그 행위를 하였을 때에는 벌하지 아니한다.\n제21조(정당방위)","kind":"L"},{"id":"L:22","label":"법 제22조","title":"긴급피난","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"①자기 또는 타인의 법익에 대한 현재의 위난을 피하기 위한 행위는 상당한 이유가 있는 때에는 벌하지 아니한다.\n②위난을 피하지 못할 책임이 있는 자에 대하여는 전항의 규정을 적용하지 아니한다.\n③전조 제2항과 제3항의 규정은 본조에 준용한다.\n제22조(긴급피난)","kind":"L"},{"id":"L:23","label":"법 제23조","title":"자구행위","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"① 법률에서 정한 절차에 따라서는 청구권을 보전(保全)할 수 없는 경우에 그 청구권의 실행이 불가능해지거나 현저히 곤란해지는 상황을 피하기 위하여 한 행위는 상당한 이유가 있는 때에는 벌하지 아니한다.\n② 제1항의 행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다.\n제23조(자구행위)","kind":"L"},{"id":"L:24","label":"법 제24조","title":"피해자의 승낙","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"제24조(피해자의 승낙) 처분할 수 있는 자의 승낙에 의하여 그 법익을 훼손한 행위는 법률에 특별한 규정이 없는 한 벌하지 아니한다.","kind":"L"},{"id":"L:25","label":"법 제25조","title":"미수범","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"①범죄의 실행에 착수하여 행위를 종료하지 못하였거나 결과가 발생하지 아니한 때에는 미수범으로 처벌한다.\n②미수범의 형은 기수범보다 감경할 수 있다.\n제25조(미수범)","kind":"L"},{"id":"L:26","label":"법 제26조","title":"중지범","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"제26조(중지범) 범인이 실행에 착수한 행위를 자의(自意)로 중지하거나 그 행위로 인한 결과의 발생을 자의로 방지한 경우에는 형을 감경하거나 면제한다.","kind":"L"},{"id":"L:27","label":"법 제27조","title":"불능범","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"제27조(불능범) 실행의 수단 또는 대상의 착오로 인하여 결과의 발생이 불가능하더라도 위험성이 있는 때에는 처벌한다. 단, 형을 감경 또는 면제할 수 있다.","kind":"L"},{"id":"L:28","label":"법 제28조","title":"음모, 예비","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"제28조(음모, 예비) 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.","kind":"L"},{"id":"L:29","label":"법 제29조","title":"미수범의 처벌","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"제29조(미수범의 처벌) 미수범을 처벌할 죄는 각칙의 해당 죄에서 정한다.","kind":"L"},{"id":"L:30","label":"법 제30조","title":"공동정범","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"제30조(공동정범) 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.","kind":"L"},{"id":"L:31","label":"법 제31조","title":"교사범","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"①타인을 교사하여 죄를 범하게 한 자는 죄를 실행한 자와 동일한 형으로 처벌한다.\n②교사를 받은 자가 범죄의 실행을 승낙하고 실행의 착수에 이르지 아니한 때에는 교사자와 피교사자를 음모 또는 예비에 준하여 처벌한다.\n③교사를 받은 자가 범죄의 실행을 승낙하지 아니한 때에도 교사자에 대하여는 전항과 같다.\n제31조(교사범)","kind":"L"},{"id":"L:32","label":"법 제32조","title":"종범","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"①타인의 범죄를 방조한 자는 종범으로 처벌한다.\n②종범의 형은 정범의 형보다 감경한다.\n제32조(종범)","kind":"L"},{"id":"L:33","label":"법 제33조","title":"공범과 신분","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"제33조(공범과 신분) 신분이 있어야 성립되는 범죄에 신분 없는 사람이 가담한 경우에는 그 신분 없는 사람에게도 제30조부터 제32조까지의 규정을 적용한다. 다만, 신분 때문에 형의 경중이 달라지는 경우에 신분이 없는 사람은 무거운 형으로 벌하지 아니한다.","kind":"L"},{"id":"L:34","label":"법 제34조","title":"간접정범, 특수한 교사, 방조에 대한 형의 가중","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"①어느 행위로 인하여 처벌되지 아니하는 자 또는 과실범으로 처벌되는 자를 교사 또는 방조하여 범죄행위의 결과를 발생하게 한 자는 교사 또는 방조의 예에 의하여 처벌한다.\n②자기의 지휘, 감독을 받는 자를 교사 또는 방조하여 전항의 결과를 발생하게 한 자는 교사인 때에는 정범에 정한 형의 장기 또는 다액에 그 2분의 1까지 가중하고 방조인 때에는 정범의 형으로 처벌한다.\n제34조(간접정범, 특수한 교사, 방조에 대한 형의 가중)","kind":"L"},{"id":"L:35","label":"법 제35조","title":"누범","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"① 금고(禁錮) 이상의 형을 선고받아 그 집행이 종료되거나 면제된 후 3년 내에 금고 이상에 해당하는 죄를 지은 사람은 누범(累犯)으로 처벌한다.\n② 누범의 형은 그 죄에 대하여 정한 형의 장기(長期)의 2배까지 가중한다.\n제35조(누범)","kind":"L"},{"id":"L:36","label":"법 제36조","title":"판결선고후의 누범발각","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"제36조(판결선고후의 누범발각) 판결선고후 누범인 것이 발각된 때에는 그 선고한 형을 통산하여 다시 형을 정할 수 있다. 단, 선고한 형의 집행을 종료하거나 그 집행이 면제된 후에는 예외로 한다.","kind":"L"},{"id":"L:37","label":"법 제37조","title":"경합범","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"제37조(경합범) 판결이 확정되지 아니한 수개의 죄 또는 금고 이상의 형에 처한 판결이 확정된 죄와 그 판결확정전에 범한 죄를 경합범으로 한다. <개정 2004.1.20>","kind":"L"},{"id":"L:38","label":"법 제38조","title":"경합범과 처벌례","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"① 경합범을 동시에 판결할 때에는 다음 각 호의 구분에 따라 처벌한다.\n1. 가장 무거운 죄에 대하여 정한 형이 사형, 무기징역, 무기금고인 경우에는 가장 무거운 죄에 대하여 정한 형으로 처벌한다.\n2. 각 죄에 대하여 정한 형이 사형, 무기징역, 무기금고 외의 같은 종류의 형인 경우에는 가장 무거운 죄에 대하여 정한 형의 장기 또는 다액(多額)에 그 2분의 1까지 가중하되 각 죄에 대하여 정한 형의 장기 또는 다액을 합산한 형기 또는 액수를 초과할 수 없다. 다만, 과료와 과료, 몰수와 몰수는 병과(倂科)할 수 있다.\n3. 각 죄에 대하여 정한 형이 무기징역, 무기금고 외의 다른 종류의 형인 경우에는 병과한다.\n② 제1항 각 호의 경우에 징역과 금고는 같은 종류의 형으로 보아 징역형으로 처벌한다.\n제38조(경합범과 처벌례)","kind":"L"},{"id":"L:39","label":"법 제39조","title":"판결을 받지 아니한 경합범, 수개의 판결과 경합범, 형의 집행과 경합범","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"①경합범중 판결을 받지 아니한 죄가 있는 때에는 그 죄와 판결이 확정된 죄를 동시에 판결할 경우와 형평을 고려하여 그 죄에 대하여 형을 선고한다. 이 경우 그 형을 감경 또는 면제할 수 있다. <개정 2005.7.29>\n② 삭제 <2005.7.29>\n③경합범에 의한 판결의 선고를 받은 자가 경합범 중의 어떤 죄에 대하여 사면 또는 형의 집행이 면제된 때에는 다른 죄에 대하여 다시 형을 정한다.\n④전 3항의 형의 집행에 있어서는 이미 집행한 형기를 통산한다.\n제39조(판결을 받지 아니한 경합범, 수개의 판결과 경합범, 형의 집행과 경합범)","kind":"L"},{"id":"L:40","label":"법 제40조","title":"상상적 경합","chapter":"제1편 총칙 제2장 죄","deleted":false,"text":"제40조(상상적 경합) 한 개의 행위가 여러 개의 죄에 해당하는 경우에는 가장 무거운 죄에 대하여 정한 형으로 처벌한다.","kind":"L"},{"id":"L:41","label":"법 제41조","title":"형의 종류","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"1. 사형\n2. 징역\n3. 금고\n4. 자격상실\n5. 자격정지\n6. 벌금\n7. 구류\n8. 과료\n9. 몰수\n제41조(형의 종류) 형의 종류는 다음과 같다.","kind":"L"},{"id":"L:42","label":"법 제42조","title":"징역 또는 금고의 기간","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"제42조(징역 또는 금고의 기간) 징역 또는 금고는 무기 또는 유기로 하고 유기는 1개월 이상 30년 이하로 한다. 단, 유기징역 또는 유기금고에 대하여 형을 가중하는 때에는 50년까지로 한다. <개정 2010.4.15>","kind":"L"},{"id":"L:43","label":"법 제43조","title":"형의 선고와 자격상실, 자격정지","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"①사형, 무기징역 또는 무기금고의 판결을 받은 자는 다음에 기재한 자격을 상실한다.\n1. 공무원이 되는 자격\n2. 공법상의 선거권과 피선거권\n3. 법률로 요건을 정한 공법상의 업무에 관한 자격\n4. 법인의 이사, 감사 또는 지배인 기타 법인의 업무에 관한 검사역이나 재산관리인이 되는 자격\n②유기징역 또는 유기금고의 판결을 받은 자는 그 형의 집행이 종료하거나 면제될 때까지 전항 제1호 내지 제3호에 기재된 자격이 정지된다. 다만, 다른 법률에 특별한 규정이 있는 경우에는 그 법률에 따른다. <개정 2016.1.6>\n제43조(형의 선고와 자격상실, 자격정지)","kind":"L"},{"id":"L:44","label":"법 제44조","title":"자격정지","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"①전조에 기재한 자격의 전부 또는 일부에 대한 정지는 1년 이상 15년 이하로 한다.\n②유기징역 또는 유기금고에 자격정지를 병과한 때에는 징역 또는 금고의 집행을 종료하거나 면제된 날로부터 정지기간을 기산한다.\n제44조(자격정지)","kind":"L"},{"id":"L:45","label":"법 제45조","title":"벌금","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"제45조(벌금) 벌금은 5만원 이상으로 한다. 다만, 감경하는 경우에는 5만원 미만으로 할 수 있다. <개정 1995.12.29>","kind":"L"},{"id":"L:46","label":"법 제46조","title":"구류","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"제46조(구류) 구류는 1일 이상 30일 미만으로 한다.","kind":"L"},{"id":"L:47","label":"법 제47조","title":"과료","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"제47조(과료) 과료는 2천원 이상 5만원 미만으로 한다. <개정 1995.12.29>","kind":"L"},{"id":"L:48","label":"법 제48조","title":"몰수의 대상과 추징","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"① 범인 외의 자의 소유에 속하지 아니하거나 범죄 후 범인 외의 자가 사정을 알면서 취득한 다음 각 호의 물건은 전부 또는 일부를 몰수할 수 있다.\n1. 범죄행위에 제공하였거나 제공하려고 한 물건\n2. 범죄행위로 인하여 생겼거나 취득한 물건\n3. 제1호 또는 제2호의 대가로 취득한 물건\n② 제1항 각 호의 물건을 몰수할 수 없을 때에는 그 가액(價額)을 추징한다.\n③ 문서, 도화(圖畵), 전자기록(電磁記錄) 등 특수매체기록 또는 유가증권의 일부가 몰수의 대상이 된 경우에는 그 부분을 폐기한다.\n제48조(몰수의 대상과 추징)","kind":"L"},{"id":"L:49","label":"법 제49조","title":"몰수의 부가성","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"제49조(몰수의 부가성) 몰수는 타형에 부가하여 과한다. 단, 행위자에게 유죄의 재판을 아니할 때에도 몰수의 요건이 있는 때에는 몰수만을 선고할 수 있다.","kind":"L"},{"id":"L:50","label":"법 제50조","title":"형의 경중","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"① 형의 경중은 제41조 각 호의 순서에 따른다. 다만, 무기금고와 유기징역은 무기금고를 무거운 것으로 하고 유기금고의 장기가 유기징역의 장기를 초과하는 때에는 유기금고를 무거운 것으로 한다.\n② 같은 종류의 형은 장기가 긴 것과 다액이 많은 것을 무거운 것으로 하고 장기 또는 다액이 같은 경우에는 단기가 긴 것과 소액이 많은 것을 무거운 것으로 한다.\n③ 제1항 및 제2항을 제외하고는 죄질과 범정(犯情)을 고려하여 경중을 정한다.\n제50조(형의 경중)","kind":"L"},{"id":"L:51","label":"법 제51조","title":"양형의 조건","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"1. 범인의 연령, 성행, 지능과 환경\n2. 피해자에 대한 관계\n3. 범행의 동기, 수단과 결과\n4. 범행 후의 정황\n제51조(양형의 조건) 형을 정함에 있어서는 다음 사항을 참작하여야 한다.","kind":"L"},{"id":"L:52","label":"법 제52조","title":"자수, 자복","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"① 죄를 지은 후 수사기관에 자수한 경우에는 형을 감경하거나 면제할 수 있다.\n② 피해자의 의사에 반하여 처벌할 수 없는 범죄의 경우에는 피해자에게 죄를 자복(自服)하였을 때에도 형을 감경하거나 면제할 수 있다.\n제52조(자수, 자복)","kind":"L"},{"id":"L:53","label":"법 제53조","title":"정상참작감경","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"제53조(정상참작감경) 범죄의 정상(情狀)에 참작할 만한 사유가 있는 경우에는 그 형을 감경할 수 있다.","kind":"L"},{"id":"L:54","label":"법 제54조","title":"선택형과 정상참작감경","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"제54조(선택형과 정상참작감경) 한 개의 죄에 정한 형이 여러 종류인 때에는 먼저 적용할 형을 정하고 그 형을 감경한다.","kind":"L"},{"id":"L:55","label":"법 제55조","title":"법률상의 감경","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"①법률상의 감경은 다음과 같다. <개정 2010.4.15>\n1. 사형을 감경할 때에는 무기 또는 20년 이상 50년 이하의 징역 또는 금고로 한다.\n2. 무기징역 또는 무기금고를 감경할 때에는 10년 이상 50년 이하의 징역 또는 금고로 한다.\n3. 유기징역 또는 유기금고를 감경할 때에는 그 형기의 2분의 1로 한다.\n4. 자격상실을 감경할 때에는 7년 이상의 자격정지로 한다.\n5. 자격정지를 감경할 때에는 그 형기의 2분의 1로 한다.\n6. 벌금을 감경할 때에는 그 다액의 2분의 1로 한다.\n7. 구류를 감경할 때에는 그 장기의 2분의 1로 한다.\n8. 과료를 감경할 때에는 그 다액의 2분의 1로 한다.\n②법률상 감경할 사유가 수개있는 때에는 거듭 감경할 수 있다.\n제55조(법률상의 감경)","kind":"L"},{"id":"L:56","label":"법 제56조","title":"가중ㆍ감경의 순서","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"1. 각칙 조문에 따른 가중\n2. 제34조제2항에 따른 가중\n3. 누범 가중\n4. 법률상 감경\n5. 경합범 가중\n6. 정상참작감경\n제56조(가중ㆍ감경의 순서) 형을 가중ㆍ감경할 사유가 경합하는 경우에는 다음 각 호의 순서에 따른다.","kind":"L"},{"id":"L:57","label":"법 제57조","title":"판결선고전 구금일수의 통산","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"①판결선고전의 구금일수는 그 전부를 유기징역, 유기금고, 벌금이나 과료에 관한 유치 또는 구류에 산입한다. <개정 2014.12.30>\n②전항의 경우에는 구금일수의 1일은 징역, 금고, 벌금이나 과료에 관한 유치 또는 구류의 기간의 1일로 계산한다.\n제57조(판결선고전 구금일수의 통산)","kind":"L"},{"id":"L:58","label":"법 제58조","title":"판결의 공시","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"①피해자의 이익을 위하여 필요하다고 인정할 때에는 피해자의 청구가 있는 경우에 한하여 피고인의 부담으로 판결공시의 취지를 선고할 수 있다.\n② 피고사건에 대하여 무죄의 판결을 선고하는 경우에는 무죄판결공시의 취지를 선고하여야 한다. 다만, 무죄판결을 받은 피고인이 무죄판결공시 취지의 선고에 동의하지 아니하거나 피고인의 동의를 받을 수 없는 경우에는 그러하지 아니하다. <개정 2014.12.30>\n③ 피고사건에 대하여 면소의 판결을 선고하는 경우에는 면소판결공시의 취지를 선고할 수 있다. <신설 2014.12.30>\n제58조(판결의 공시)","kind":"L"},{"id":"L:59","label":"법 제59조","title":"선고유예의 요건","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"① 1년 이하의 징역이나 금고, 자격정지 또는 벌금의 형을 선고할 경우에 제51조의 사항을 고려하여 뉘우치는 정상이 뚜렷할 때에는 그 형의 선고를 유예할 수 있다. 다만, 자격정지 이상의 형을 받은 전과가 있는 사람에 대해서는 예외로 한다.\n② 형을 병과할 경우에도 형의 전부 또는 일부에 대하여 선고를 유예할 수 있다.\n제59조(선고유예의 요건)","kind":"L"},{"id":"L:59-2","label":"법 제59조의2","title":"보호관찰","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"①형의 선고를 유예하는 경우에 재범방지를 위하여 지도 및 원호가 필요한 때에는 보호관찰을 받을 것을 명할 수 있다.\n②제1항의 규정에 의한 보호관찰의 기간은 1년으로 한다.\n제59조의2(보호관찰)","kind":"L"},{"id":"L:60","label":"법 제60조","title":"선고유예의 효과","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"제60조(선고유예의 효과) 형의 선고유예를 받은 날로부터 2년을 경과한 때에는 면소된 것으로 간주한다.","kind":"L"},{"id":"L:61","label":"법 제61조","title":"선고유예의 실효","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"①형의 선고유예를 받은 자가 유예기간 중 자격정지 이상의 형에 처한 판결이 확정되거나 자격정지 이상의 형에 처한 전과가 발견된 때에는 유예한 형을 선고한다. <개정 1995.12.29>\n②제59조의2의 규정에 의하여 보호관찰을 명한 선고유예를 받은 자가 보호관찰기간중에 준수사항을 위반하고 그 정도가 무거운 때에는 유예한 형을 선고할 수 있다. <신설 1995.12.29>\n제61조(선고유예의 실효)","kind":"L"},{"id":"L:62","label":"법 제62조","title":"집행유예의 요건","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"①3년 이하의 징역이나 금고 또는 500만원 이하의 벌금의 형을 선고할 경우에 제51조의 사항을 참작하여 그 정상에 참작할 만한 사유가 있는 때에는 1년 이상 5년 이하의 기간 형의 집행을 유예할 수 있다. 다만, 금고 이상의 형을 선고한 판결이 확정된 때부터 그 집행을 종료하거나 면제된 후 3년까지의 기간에 범한 죄에 대하여 형을 선고하는 경우에는 그러하지 아니하다. <개정 2005.7.29, 2016.1.6>\n②형을 병과할 경우에는 그 형의 일부에 대하여 집행을 유예할 수 있다.\n제62조(집행유예의 요건)","kind":"L"},{"id":"L:62-2","label":"법 제62조의2","title":"보호관찰, 사회봉사ㆍ수강명령","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"①형의 집행을 유예하는 경우에는 보호관찰을 받을 것을 명하거나 사회봉사 또는 수강을 명할 수 있다.\n②제1항의 규정에 의한 보호관찰의 기간은 집행을 유예한 기간으로 한다. 다만, 법원은 유예기간의 범위내에서 보호관찰기간을 정할 수 있다.\n③사회봉사명령 또는 수강명령은 집행유예기간내에 이를 집행한다.\n제62조의2(보호관찰, 사회봉사ㆍ수강명령)","kind":"L"},{"id":"L:63","label":"법 제63조","title":"집행유예의 실효","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"제63조(집행유예의 실효) 집행유예의 선고를 받은 자가 유예기간 중 고의로 범한 죄로 금고 이상의 실형을 선고받아 그 판결이 확정된 때에는 집행유예의 선고는 효력을 잃는다. <개정 2005.7.29>","kind":"L"},{"id":"L:64","label":"법 제64조","title":"집행유예의 취소","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"①집행유예의 선고를 받은 후 제62조 단행의 사유가 발각된 때에는 집행유예의 선고를 취소한다. <개정 1995.12.29>\n②제62조의2의 규정에 의하여 보호관찰이나 사회봉사 또는 수강을 명한 집행유예를 받은 자가 준수사항이나 명령을 위반하고 그 정도가 무거운 때에는 집행유예의 선고를 취소할 수 있다. <신설 1995.12.29>\n제64조(집행유예의 취소)","kind":"L"},{"id":"L:65","label":"법 제65조","title":"집행유예의 효과","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"제65조(집행유예의 효과) 집행유예의 선고를 받은 후 그 선고의 실효 또는 취소됨이 없이 유예기간을 경과한 때에는 형의 선고는 효력을 잃는다.","kind":"L"},{"id":"L:66","label":"법 제66조","title":"사형","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"제66조(사형) 사형은 교정시설 안에서 교수(絞首)하여 집행한다.","kind":"L"},{"id":"L:67","label":"법 제67조","title":"징역","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"제67조(징역) 징역은 교정시설에 수용하여 집행하며, 정해진 노역(勞役)에 복무하게 한다.","kind":"L"},{"id":"L:68","label":"법 제68조","title":"금고와 구류","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"제68조(금고와 구류) 금고와 구류는 교정시설에 수용하여 집행한다.","kind":"L"},{"id":"L:69","label":"법 제69조","title":"벌금과 과료","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"①벌금과 과료는 판결확정일로부터 30일내에 납입하여야 한다. 단, 벌금을 선고할 때에는 동시에 그 금액을 완납할 때까지 노역장에 유치할 것을 명할 수 있다.\n②벌금을 납입하지 아니한 자는 1일 이상 3년 이하, 과료를 납입하지 아니한 자는 1일 이상 30일 미만의 기간 노역장에 유치하여 작업에 복무하게 한다.\n제69조(벌금과 과료)","kind":"L"},{"id":"L:70","label":"법 제70조","title":"노역장 유치","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"① 벌금이나 과료를 선고할 때에는 이를 납입하지 아니하는 경우의 노역장 유치기간을 정하여 동시에 선고하여야 한다. <개정 2020.12.8>\n② 선고하는 벌금이 1억원 이상 5억원 미만인 경우에는 300일 이상, 5억원 이상 50억원 미만인 경우에는 500일 이상, 50억원 이상인 경우에는 1천일 이상의 노역장 유치기간을 정하여야 한다. <신설 2014.5.14, 2020.12.8>\n제70조(노역장 유치)","kind":"L"},{"id":"L:71","label":"법 제71조","title":"유치일수의 공제","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"제71조(유치일수의 공제) 벌금이나 과료의 선고를 받은 사람이 그 금액의 일부를 납입한 경우에는 벌금 또는 과료액과 노역장 유치기간의 일수(日數)에 비례하여 납입금액에 해당하는 일수를 뺀다.","kind":"L"},{"id":"L:72","label":"법 제72조","title":"가석방의 요건","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"① 징역이나 금고의 집행 중에 있는 사람이 행상(行狀)이 양호하여 뉘우침이 뚜렷한 때에는 무기형은 20년, 유기형은 형기의 3분의 1이 지난 후 행정처분으로 가석방을 할 수 있다.\n② 제1항의 경우에 벌금이나 과료가 병과되어 있는 때에는 그 금액을 완납하여야 한다.\n제72조(가석방의 요건)","kind":"L"},{"id":"L:73","label":"법 제73조","title":"판결선고 전 구금과 가석방","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"① 형기에 산입된 판결선고 전 구금일수는 가석방을 하는 경우 집행한 기간에 산입한다.\n② 제72조제2항의 경우에 벌금이나 과료에 관한 노역장 유치기간에 산입된 판결선고 전 구금일수는 그에 해당하는 금액이 납입된 것으로 본다.\n제73조(판결선고 전 구금과 가석방)","kind":"L"},{"id":"L:73-2","label":"법 제73조의2","title":"가석방의 기간 및 보호관찰","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"①가석방의 기간은 무기형에 있어서는 10년으로 하고, 유기형에 있어서는 남은 형기로 하되, 그 기간은 10년을 초과할 수 없다.\n②가석방된 자는 가석방기간중 보호관찰을 받는다. 다만, 가석방을 허가한 행정관청이 필요가 없다고 인정한 때에는 그러하지 아니하다.\n제73조의2(가석방의 기간 및 보호관찰)","kind":"L"},{"id":"L:74","label":"법 제74조","title":"가석방의 실효","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"제74조(가석방의 실효) 가석방 기간 중 고의로 지은 죄로 금고 이상의 형을 선고받아 그 판결이 확정된 경우에 가석방 처분은 효력을 잃는다.","kind":"L"},{"id":"L:75","label":"법 제75조","title":"가석방의 취소","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"제75조(가석방의 취소) 가석방의 처분을 받은 자가 감시에 관한 규칙을 위배하거나, 보호관찰의 준수사항을 위반하고 그 정도가 무거운 때에는 가석방처분을 취소할 수 있다.","kind":"L"},{"id":"L:76","label":"법 제76조","title":"가석방의 효과","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"①가석방의 처분을 받은 후 그 처분이 실효 또는 취소되지 아니하고 가석방기간을 경과한 때에는 형의 집행을 종료한 것으로 본다. <개정 1995.12.29>\n②전2조의 경우에는 가석방중의 일수는 형기에 산입하지 아니한다.\n제76조(가석방의 효과)","kind":"L"},{"id":"L:77","label":"법 제77조","title":"형의 시효의 효과","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"제77조(형의 시효의 효과) 형(사형은 제외한다)을 선고받은 자에 대해서는 시효가 완성되면 그 집행이 면제된다. <개정 2023.8.8>","kind":"L"},{"id":"L:78","label":"법 제78조","title":"형의 시효의 기간","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"1. 삭제<2023.8.8>\n2. 무기의 징역 또는 금고: 20년\n3. 10년 이상의 징역 또는 금고: 15년\n4. 3년 이상의 징역이나 금고 또는 10년 이상의 자격정지: 10년\n5. 3년 미만의 징역이나 금고 또는 5년 이상의 자격정지: 7년\n6. 5년 미만의 자격정지, 벌금, 몰수 또는 추징: 5년\n7. 구류 또는 과료: 1년\n제78조(형의 시효의 기간) 시효는 형을 선고하는 재판이 확정된 후 그 집행을 받지 아니하고 다음 각 호의 구분에 따른 기간이 지나면 완성된다. <개정 2017.12.12, 2020.12.8, 2023.8.8>","kind":"L"},{"id":"L:79","label":"법 제79조","title":"형의 시효의 정지","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"①시효는 형의 집행의 유예나 정지 또는 가석방 기타 집행할 수 없는 기간은 진행되지 아니한다. <개정 2014.5.14>\n② 시효는 형이 확정된 후 그 형의 집행을 받지 아니한 사람이 형의 집행을 면할 목적으로 국외에 있는 기간 동안은 진행되지 아니한다. <신설 2014.5.14, 2023.8.8>\n제79조(형의 시효의 정지)","kind":"L"},{"id":"L:80","label":"법 제80조","title":"형의 시효의 중단","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"제80조(형의 시효의 중단) 시효는 징역, 금고 및 구류의 경우에는 수형자를 체포한 때, 벌금, 과료, 몰수 및 추징의 경우에는 강제처분을 개시한 때에 중단된다.","kind":"L"},{"id":"L:81","label":"법 제81조","title":"형의 실효","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"제81조(형의 실효) 징역 또는 금고의 집행을 종료하거나 집행이 면제된 자가 피해자의 손해를 보상하고 자격정지 이상의 형을 받음이 없이 7년을 경과한 때에는 본인 또는 검사의 신청에 의하여 그 재판의 실효를 선고할 수 있다.","kind":"L"},{"id":"L:82","label":"법 제82조","title":"복권","chapter":"제1편 총칙 제3장 형","deleted":false,"text":"제82조(복권) 자격정지의 선고를 받은 자가 피해자의 손해를 보상하고 자격정지 이상의 형을 받음이 없이 정지기간의 2분의 1을 경과한 때에는 본인 또는 검사의 신청에 의하여 자격의 회복을 선고할 수 있다.","kind":"L"},{"id":"L:83","label":"법 제83조","title":"기간의 계산","chapter":"제1편 총칙 제4장 기간","deleted":false,"text":"제83조(기간의 계산) 연(年) 또는 월(月)로 정한 기간은 연 또는 월 단위로 계산한다.","kind":"L"},{"id":"L:84","label":"법 제84조","title":"형기의 기산","chapter":"제1편 총칙 제4장 기간","deleted":false,"text":"①형기는 판결이 확정된 날로부터 기산한다.\n②징역, 금고, 구류와 유치에 있어서는 구속되지 아니한 일수는 형기에 산입하지 아니한다.\n제84조(형기의 기산)","kind":"L"},{"id":"L:85","label":"법 제85조","title":"형의 집행과 시효기간의 초일","chapter":"제1편 총칙 제4장 기간","deleted":false,"text":"제85조(형의 집행과 시효기간의 초일) 형의 집행과 시효기간의 초일은 시간을 계산함이 없이 1일로 산정한다.","kind":"L"},{"id":"L:86","label":"법 제86조","title":"석방일","chapter":"제1편 총칙 제4장 기간","deleted":false,"text":"제86조(석방일) 석방은 형기종료일에 하여야 한다.","kind":"L"},{"id":"L:87","label":"법 제87조","title":"내란","chapter":"제2편 각칙 제1장 내란의 죄","deleted":false,"text":"1. 우두머리는 사형, 무기징역 또는 무기금고에 처한다.\n2. 모의에 참여하거나 지휘하거나 그 밖의 중요한 임무에 종사한 자는 사형, 무기 또는 5년 이상의 징역이나 금고에 처한다. 살상, 파괴 또는 약탈 행위를 실행한 자도 같다.\n3. 부화수행(附和隨行)하거나 단순히 폭동에만 관여한 자는 5년 이하의 징역이나 금고에 처한다.\n제87조(내란) 대한민국 영토의 전부 또는 일부에서 국가권력을 배제하거나 국헌을 문란하게 할 목적으로 폭동을 일으킨 자는 다음 각 호의 구분에 따라 처벌한다.","kind":"L"},{"id":"L:88","label":"법 제88조","title":"내란목적의 살인","chapter":"제2편 각칙 제1장 내란의 죄","deleted":false,"text":"제88조(내란목적의 살인) 대한민국 영토의 전부 또는 일부에서 국가권력을 배제하거나 국헌을 문란하게 할 목적으로 사람을 살해한 자는 사형, 무기징역 또는 무기금고에 처한다.","kind":"L"},{"id":"L:89","label":"법 제89조","title":"미수범","chapter":"제2편 각칙 제1장 내란의 죄","deleted":false,"text":"제89조(미수범) 전2조의 미수범은 처벌한다.","kind":"L"},{"id":"L:90","label":"법 제90조","title":"예비, 음모, 선동, 선전","chapter":"제2편 각칙 제1장 내란의 죄","deleted":false,"text":"①제87조 또는 제88조의 죄를 범할 목적으로 예비 또는 음모한 자는 3년 이상의 유기징역이나 유기금고에 처한다. 단, 그 목적한 죄의 실행에 이르기 전에 자수한 때에는 그 형을 감경 또는 면제한다.\n②제87조 또는 제88조의 죄를 범할 것을 선동 또는 선전한 자도 전항의 형과 같다.\n제90조(예비, 음모, 선동, 선전)","kind":"L"},{"id":"L:91","label":"법 제91조","title":"국헌문란의 정의","chapter":"제2편 각칙 제1장 내란의 죄","deleted":false,"text":"1. 헌법 또는 법률에 정한 절차에 의하지 아니하고 헌법 또는 법률의 기능을 소멸시키는 것\n2. 헌법에 의하여 설치된 국가기관을 강압에 의하여 전복 또는 그 권능행사를 불가능하게 하는 것\n제91조(국헌문란의 정의) 본장에서 국헌을 문란할 목적이라 함은 다음 각호의 1에 해당함을 말한다.","kind":"L"},{"id":"L:92","label":"법 제92조","title":"외환유치","chapter":"제2편 각칙 제2장 외환의 죄","deleted":false,"text":"제92조(외환유치) 외국과 통모하여 대한민국에 대하여 전단을 열게 하거나 외국인과 통모하여 대한민국에 항적한 자는 사형 또는 무기징역에 처한다.","kind":"L"},{"id":"L:93","label":"법 제93조","title":"여적","chapter":"제2편 각칙 제2장 외환의 죄","deleted":false,"text":"제93조(여적) 적국과 합세하여 대한민국에 항적한 자는 사형에 처한다.","kind":"L"},{"id":"L:94","label":"법 제94조","title":"모병이적","chapter":"제2편 각칙 제2장 외환의 죄","deleted":false,"text":"①적국을 위하여 모병한 자는 사형 또는 무기징역에 처한다.\n②전항의 모병에 응한 자는 무기 또는 5년 이상의 징역에 처한다.\n제94조(모병이적)","kind":"L"},{"id":"L:95","label":"법 제95조","title":"시설제공이적","chapter":"제2편 각칙 제2장 외환의 죄","deleted":false,"text":"①군대, 요새, 진영 또는 군용에 공하는 선박이나 항공기 기타 장소, 설비 또는 건조물을 적국에 제공한 자는 사형 또는 무기징역에 처한다.\n②병기 또는 탄약 기타 군용에 공하는 물건을 적국에 제공한 자도 전항의 형과 같다.\n제95조(시설제공이적)","kind":"L"},{"id":"L:96","label":"법 제96조","title":"시설파괴이적","chapter":"제2편 각칙 제2장 외환의 죄","deleted":false,"text":"제96조(시설파괴이적) 적국을 위하여 전조에 기재한 군용시설 기타 물건을 파괴하거나 사용할 수 없게 한 자는 사형 또는 무기징역에 처한다.","kind":"L"},{"id":"L:97","label":"법 제97조","title":"물건제공이적","chapter":"제2편 각칙 제2장 외환의 죄","deleted":false,"text":"제97조(물건제공이적) 군용에 공하지 아니하는 병기, 탄약 또는 전투용에 공할 수 있는 물건을 적국에 제공한 자는 무기 또는 5년 이상의 징역에 처한다.","kind":"L"},{"id":"L:98","label":"법 제98조","title":"적국을 위한 간첩","chapter":"제2편 각칙 제2장 외환의 죄","deleted":false,"text":"① 적국을 위하여 적국의 지령, 사주, 그 밖의 의사 연락 하에 국가기밀을 탐지ㆍ수집ㆍ누설ㆍ전달ㆍ중개하거나 이를 방조한 자는 사형, 무기 또는 7년 이상의 징역에 처한다. <개정 2026.3.12>\n② 삭제 <2026.3.12>\n제98조(적국을 위한 간첩)","kind":"L"},{"id":"L:98-2","label":"법 제98조의2","title":"외국 등을 위한 간첩","chapter":"제2편 각칙 제2장 외환의 죄","deleted":false,"text":"제98조의2(외국 등을 위한 간첩) 외국 또는 이에 준하는 단체(이하 \"외국등\"이라 한다)를 위하여 외국등의 지령, 사주, 그 밖의 의사 연락 하에 국가기밀을 탐지ㆍ수집ㆍ누설ㆍ전달ㆍ중개하거나 이를 방조한 자는 3년 이상의 유기징역에 처한다.","kind":"L"},{"id":"L:99","label":"법 제99조","title":"일반이적","chapter":"제2편 각칙 제2장 외환의 죄","deleted":false,"text":"제99조(일반이적) 제92조부터 제98조까지에 기재한 이외에 대한민국의 군사상 이익을 해하거나 적국에 군사상 이익을 공여한 자는 무기 또는 3년 이상의 징역에 처한다.","kind":"L"},{"id":"L:100","label":"법 제100조","title":"미수범","chapter":"제2편 각칙 제2장 외환의 죄","deleted":false,"text":"제100조(미수범) 제92조부터 제98조까지, 제98조의2 및 제99조의 미수범은 처벌한다.","kind":"L"},{"id":"L:101","label":"법 제101조","title":"예비, 음모, 선동, 선전","chapter":"제2편 각칙 제2장 외환의 죄","deleted":false,"text":"① 제92조부터 제98조까지, 제98조의2 또는 제99조의 죄를 범할 목적으로 예비 또는 음모한 자는 2년 이상의 유기징역에 처한다. 다만, 그 목적한 죄의 실행에 이르기 전에 자수한 때에는 그 형을 감경 또는 면제한다.\n② 제92조부터 제98조까지, 제98조의2 또는 제99조의 죄를 선동 또는 선전한 자도 제1항의 형과 같다.\n제101조(예비, 음모, 선동, 선전)","kind":"L"},{"id":"L:102","label":"법 제102조","title":"준적국","chapter":"제2편 각칙 제2장 외환의 죄","deleted":false,"text":"제102조(준적국) 제93조부터 제98조까지 및 제99조부터 제101조까지의 죄에 있어서는 대한민국에 적대하는 외국등은 적국으로 간주한다.","kind":"L"},{"id":"L:103","label":"법 제103조","title":"전시군수계약불이행","chapter":"제2편 각칙 제2장 외환의 죄","deleted":false,"text":"①전쟁 또는 사변에 있어서 정당한 이유없이 정부에 대한 군수품 또는 군용공작물에 관한 계약을 이행하지 아니한 자는 10년 이하의 징역에 처한다.\n②전항의 계약이행을 방해한 자도 전항의 형과 같다.\n제103조(전시군수계약불이행)","kind":"L"},{"id":"L:104","label":"법 제104조","title":"동맹국","chapter":"제2편 각칙 제2장 외환의 죄","deleted":false,"text":"제104조(동맹국) 본장의 규정(제98조의2는 제외한다)은 동맹국에 대한 행위에 적용한다.","kind":"L"},{"id":"L:104-2","label":"법 제104조의2","title":"","chapter":"제2편 각칙 제2장 외환의 죄","deleted":true,"text":"제104조의2 삭제 <1988.12.31>","kind":"L"},{"id":"L:105","label":"법 제105조","title":"국기, 국장의 모독","chapter":"제2편 각칙 제3장 국기에 관한 죄","deleted":false,"text":"제105조(국기, 국장의 모독) 대한민국을 모욕할 목적으로 국기 또는 국장을 손상, 제거 또는 오욕한 자는 5년 이하의 징역이나 금고, 10년 이하의 자격정지 또는 700만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:106","label":"법 제106조","title":"국기, 국장의 비방","chapter":"제2편 각칙 제3장 국기에 관한 죄","deleted":false,"text":"제106조(국기, 국장의 비방) 전조의 목적으로 국기 또는 국장을 비방한 자는 1년 이하의 징역이나 금고, 5년 이하의 자격정지 또는 200만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:107","label":"법 제107조","title":"외국원수에 대한 폭행 등","chapter":"제2편 각칙 제4장 국교에 관한 죄","deleted":false,"text":"①대한민국에 체재하는 외국의 원수에 대하여 폭행 또는 협박을 가한 자는 7년 이하의 징역이나 금고에 처한다.\n②전항의 외국원수에 대하여 모욕을 가하거나 명예를 훼손한 자는 5년 이하의 징역이나 금고에 처한다.\n제107조(외국원수에 대한 폭행 등)","kind":"L"},{"id":"L:108","label":"법 제108조","title":"외국사절에 대한 폭행 등","chapter":"제2편 각칙 제4장 국교에 관한 죄","deleted":false,"text":"①대한민국에 파견된 외국사절에 대하여 폭행 또는 협박을 가한 자는 5년 이하의 징역이나 금고에 처한다.\n②전항의 외국사절에 대하여 모욕을 가하거나 명예를 훼손한 자는 3년 이하의 징역이나 금고에 처한다\n제108조(외국사절에 대한 폭행 등)","kind":"L"},{"id":"L:109","label":"법 제109조","title":"외국의 국기, 국장의 모독","chapter":"제2편 각칙 제4장 국교에 관한 죄","deleted":false,"text":"제109조(외국의 국기, 국장의 모독) 외국을 모욕할 목적으로 그 나라의 공용에 공하는 국기 또는 국장을 손상, 제거 또는 오욕한 자는 2년 이하의 징역이나 금고 또는 300만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:110","label":"법 제110조","title":"피해자의 의사","chapter":"제2편 각칙 제4장 국교에 관한 죄","deleted":false,"text":"제110조(피해자의 의사) 제107조 내지 제109조의 죄는 그 외국정부의 명시한 의사에 반하여 공소를 제기할 수 없다. <개정 1995.12.29>","kind":"L"},{"id":"L:111","label":"법 제111조","title":"외국에 대한 사전","chapter":"제2편 각칙 제4장 국교에 관한 죄","deleted":false,"text":"①외국에 대하여 사전한 자는 1년 이상의 유기금고에 처한다.\n②전항의 미수범은 처벌한다.\n③제1항의 죄를 범할 목적으로 예비 또는 음모한 자는 3년 이하의 금고 또는 500만원 이하의 벌금에 처한다. 단 그 목적한 죄의 실행에 이르기 전에 자수한 때에는 감경 또는 면제한다. <개정 1995.12.29>\n제111조(외국에 대한 사전)","kind":"L"},{"id":"L:112","label":"법 제112조","title":"중립명령위반","chapter":"제2편 각칙 제4장 국교에 관한 죄","deleted":false,"text":"제112조(중립명령위반) 외국간의 교전에 있어서 중립에 관한 명령에 위반한 자는 3년 이하의 금고 또는 500만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:113","label":"법 제113조","title":"외교상기밀의 누설","chapter":"제2편 각칙 제4장 국교에 관한 죄","deleted":false,"text":"①외교상의 기밀을 누설한 자는 5년 이하의 징역 또는 1천만원 이하의 벌금에 처한다. <개정 1995.12.29>\n②누설할 목적으로 외교상의 기밀을 탐지 또는 수집한 자도 전항의 형과 같다.\n제113조(외교상기밀의 누설)","kind":"L"},{"id":"L:114","label":"법 제114조","title":"범죄단체 등의 조직","chapter":"제2편 각칙 제5장 공안(公安)을 해하는 죄","deleted":false,"text":"제114조(범죄단체 등의 조직) 사형, 무기 또는 장기 4년 이상의 징역에 해당하는 범죄를 목적으로 하는 단체 또는 집단을 조직하거나 이에 가입 또는 그 구성원으로 활동한 사람은 그 목적한 죄에 정한 형으로 처벌한다. 다만, 형을 감경할 수 있다.","kind":"L"},{"id":"L:115","label":"법 제115조","title":"소요","chapter":"제2편 각칙 제5장 공안(公安)을 해하는 죄","deleted":false,"text":"제115조(소요) 다중이 집합하여 폭행, 협박 또는 손괴의 행위를 한 자는 1년 이상 10년 이하의 징역이나 금고 또는 1천500만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:116","label":"법 제116조","title":"다중불해산","chapter":"제2편 각칙 제5장 공안(公安)을 해하는 죄","deleted":false,"text":"제116조(다중불해산) 폭행, 협박 또는 손괴의 행위를 할 목적으로 다중이 집합하여 그를 단속할 권한이 있는 공무원으로부터 3회 이상의 해산명령을 받고 해산하지 아니한 자는 2년 이하의 징역이나 금고 또는 300만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:116-2","label":"법 제116조의2","title":"공중협박","chapter":"제2편 각칙 제5장 공안(公安)을 해하는 죄","deleted":false,"text":"① 불특정 또는 다수의 사람의 생명, 신체에 위해를 가할 것을 내용으로 공연히 공중을 협박한 사람은 5년 이하의 징역 또는 2천만원 이하의 벌금에 처한다.\n② 상습으로 제1항의 죄를 범한 때에는 그 죄에 정한 형의 2분의 1까지 가중한다.\n③ 제1항 및 제2항의 미수범은 처벌한다.\n제116조의2(공중협박)","kind":"L"},{"id":"L:116-3","label":"법 제116조의3","title":"공공장소 흉기소지","chapter":"제2편 각칙 제5장 공안(公安)을 해하는 죄","deleted":false,"text":"제116조의3(공공장소 흉기소지) 정당한 이유 없이 도로ㆍ공원 등 불특정 또는 다수의 사람이 이용하거나 통행할 수 있는 공공장소에서 사람의 생명, 신체에 위해를 가할 수 있는 흉기를 소지하고 이를 드러내어 공중에게 불안감 또는 공포심을 일으킨 사람은 3년 이하의 징역 또는 1천만원 이하의 벌금에 처한다.","kind":"L"},{"id":"L:117","label":"법 제117조","title":"전시공수계약불이행","chapter":"제2편 각칙 제5장 공안(公安)을 해하는 죄","deleted":false,"text":"①전쟁, 천재 기타 사변에 있어서 국가 또는 공공단체와 체결한 식량 기타 생활필수품의 공급계약을 정당한 이유없이 이행하지 아니한 자는 3년 이하의 징역 또는 500만원 이하의 벌금에 처한다. <개정 1995.12.29>\n②전항의 계약이행을 방해한 자도 전항의 형과 같다.\n③전 2항의 경우에는 그 소정의 벌금을 병과할 수 있다.\n제117조(전시공수계약불이행)","kind":"L"},{"id":"L:118","label":"법 제118조","title":"공무원자격의 사칭","chapter":"제2편 각칙 제5장 공안(公安)을 해하는 죄","deleted":false,"text":"제118조(공무원자격의 사칭) 공무원의 자격을 사칭하여 그 직권을 행사한 자는 3년 이하의 징역 또는 700만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:119","label":"법 제119조","title":"폭발물 사용","chapter":"제2편 각칙 제6장 폭발물에 관한 죄","deleted":false,"text":"① 폭발물을 사용하여 사람의 생명, 신체 또는 재산을 해하거나 그 밖에 공공의 안전을 문란하게 한 자는 사형, 무기 또는 7년 이상의 징역에 처한다.\n② 전쟁, 천재지변 그 밖의 사변에 있어서 제1항의 죄를 지은 자는 사형이나 무기징역에 처한다.\n③ 제1항과 제2항의 미수범은 처벌한다.\n제119조(폭발물 사용)","kind":"L"},{"id":"L:120","label":"법 제120조","title":"예비, 음모, 선동","chapter":"제2편 각칙 제6장 폭발물에 관한 죄","deleted":false,"text":"①전조제1항, 제2항의 죄를 범할 목적으로 예비 또는 음모한 자는 2년 이상의 유기징역에 처한다. 단, 그 목적한 죄의 실행에 이르기 전에 자수한 때에는 그 형을 감경 또는 면제한다.\n②전조제1항, 제2항의 죄를 범할 것을 선동한 자도 전항의 형과 같다.\n제120조(예비, 음모, 선동)","kind":"L"},{"id":"L:121","label":"법 제121조","title":"전시폭발물제조 등","chapter":"제2편 각칙 제6장 폭발물에 관한 죄","deleted":false,"text":"제121조(전시폭발물제조 등) 전쟁 또는 사변에 있어서 정당한 이유없이 폭발물을 제조, 수입, 수출, 수수 또는 소지한 자는 10년 이하의 징역에 처한다.","kind":"L"},{"id":"L:122","label":"법 제122조","title":"직무유기","chapter":"제2편 각칙 제7장 공무원의 직무에 관한 죄","deleted":false,"text":"제122조(직무유기) 공무원이 정당한 이유없이 그 직무수행을 거부하거나 그 직무를 유기한 때에는 1년 이하의 징역이나 금고 또는 3년 이하의 자격정지에 처한다.","kind":"L"},{"id":"L:123","label":"법 제123조","title":"직권남용","chapter":"제2편 각칙 제7장 공무원의 직무에 관한 죄","deleted":false,"text":"제123조(직권남용) 공무원이 직권을 남용하여 사람으로 하여금 의무없는 일을 하게 하거나 사람의 권리행사를 방해한 때에는 5년 이하의 징역, 10년 이하의 자격정지 또는 1천만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:123-2","label":"법 제123조의2","title":"법왜곡","chapter":"제2편 각칙 제7장 공무원의 직무에 관한 죄","deleted":false,"text":"1. 법령의 적용 요건이 충족되지 아니함을 알면서도 이를 적용하거나, 적용되어야 할 법령임을 알면서도 이를 적용하지 아니하여 의도적으로 재판 및 수사의 결과에 영향을 미친 경우. 다만, 법령 해석의 합리적 범위에서 이루어진 재량적 판단은 이에 해당하지 아니한다.\n2. 사건에 관한 증거를 인멸, 은닉, 위조 또는 변조하거나 위조 또는 변조된 증거를 그 사정을 알면서 재판 또는 수사에 사용한 경우\n3. 폭행, 협박, 위계, 그 밖의 방법으로 위법하게 증거를 수집하거나, 적법한 증거가 존재하지 아니함을 알면서도 범죄사실을 인정한 경우\n제123조의2(법왜곡) 형사사건의 재판에 관여하는 법관, 공소를 제기하거나 유지하는 검사 또는 범죄수사에 관한 직무를 수행하는 자가 타인에게 위법 또는 부당하게 이익을 주거나 권익을 해할 목적으로 재판 또는 수사 중인 형사사건에 관하여 다음 각 호의 어느 하나에 해당하는 행위를 한 경우에는 10년 이하의 징역과 10년 이하의 자격정지에 처한다.","kind":"L"},{"id":"L:124","label":"법 제124조","title":"불법체포, 불법감금","chapter":"제2편 각칙 제7장 공무원의 직무에 관한 죄","deleted":false,"text":"①재판, 검사직무, 경찰 기타 인신구속에 관한 직무를 행하는 자 또는 이를 보조하는 자가 그 직권을 남용하여 사람을 체포 또는 감금한 때에는 7년 이하의 징역과 10년 이하의 자격정지에 처한다. <개정 2026.9.29>\n②전항의 미수범은 처벌한다.\n제124조(불법체포, 불법감금)","kind":"L"},{"id":"L:125","label":"법 제125조","title":"폭행, 가혹행위","chapter":"제2편 각칙 제7장 공무원의 직무에 관한 죄","deleted":false,"text":"제125조(폭행, 가혹행위) 재판, 검사직무, 경찰 그 밖에 인신구속에 관한 직무를 수행하는 자 또는 이를 보조하는 자가 그 직무를 수행하면서 형사피의자나 그 밖의 사람에 대하여 폭행 또는 가혹행위를 한 경우에는 5년 이하의 징역과 10년 이하의 자격정지에 처한다. <개정 2026.9.29>","kind":"L"},{"id":"L:126","label":"법 제126조","title":"피의사실공표","chapter":"제2편 각칙 제7장 공무원의 직무에 관한 죄","deleted":false,"text":"제126조(피의사실공표) 검사직무, 경찰 그 밖에 범죄수사에 관한 직무를 수행하는 자 또는 이를 감독하거나 보조하는 자가 그 직무를 수행하면서 알게 된 피의사실을 공소제기 전에 공표(公表)한 경우에는 3년 이하의 징역 또는 5년 이하의 자격정지에 처한다. <개정 2026.9.29>","kind":"L"},{"id":"L:127","label":"법 제127조","title":"공무상 비밀의 누설","chapter":"제2편 각칙 제7장 공무원의 직무에 관한 죄","deleted":false,"text":"제127조(공무상 비밀의 누설) 공무원 또는 공무원이었던 자가 법령에 의한 직무상 비밀을 누설한 때에는 2년 이하의 징역이나 금고 또는 5년 이하의 자격정지에 처한다.","kind":"L"},{"id":"L:128","label":"법 제128조","title":"선거방해","chapter":"제2편 각칙 제7장 공무원의 직무에 관한 죄","deleted":false,"text":"제128조(선거방해) 공소청(광역공소청, 지방공소청 및 지방공소청 지청을 포함한다), 중대범죄수사청, 경찰 또는 군의 직에 있는 공무원이 법령에 의한 선거에 관하여 선거인, 입후보자 또는 입후보자되려는 자에게 협박을 가하거나 기타 방법으로 선거의 자유를 방해한 때에는 10년 이하의 징역과 5년 이상의 자격정지에 처한다. <개정 2026.9.29>","kind":"L"},{"id":"L:129","label":"법 제129조","title":"수뢰, 사전수뢰","chapter":"제2편 각칙 제7장 공무원의 직무에 관한 죄","deleted":false,"text":"①공무원 또는 중재인이 그 직무에 관하여 뇌물을 수수, 요구 또는 약속한 때에는 5년 이하의 징역 또는 10년 이하의 자격정지에 처한다.\n②공무원 또는 중재인이 될 자가 그 담당할 직무에 관하여 청탁을 받고 뇌물을 수수, 요구 또는 약속한 후 공무원 또는 중재인이 된 때에는 3년 이하의 징역 또는 7년 이하의 자격정지에 처한다.\n제129조(수뢰, 사전수뢰)","kind":"L"},{"id":"L:130","label":"법 제130조","title":"제삼자뇌물제공","chapter":"제2편 각칙 제7장 공무원의 직무에 관한 죄","deleted":false,"text":"제130조(제삼자뇌물제공) 공무원 또는 중재인이 그 직무에 관하여 부정한 청탁을 받고 제3자에게 뇌물을 공여하게 하거나 공여를 요구 또는 약속한 때에는 5년 이하의 징역 또는 10년 이하의 자격정지에 처한다.","kind":"L"},{"id":"L:131","label":"법 제131조","title":"수뢰후부정처사, 사후수뢰","chapter":"제2편 각칙 제7장 공무원의 직무에 관한 죄","deleted":false,"text":"①공무원 또는 중재인이 전2조의 죄를 범하여 부정한 행위를 한 때에는 1년 이상의 유기징역에 처한다.\n②공무원 또는 중재인이 그 직무상 부정한 행위를 한 후 뇌물을 수수, 요구 또는 약속하거나 제삼자에게 이를 공여하게 하거나 공여를 요구 또는 약속한 때에도 전항의 형과 같다.\n③공무원 또는 중재인이었던 자가 그 재직 중에 청탁을 받고 직무상 부정한 행위를 한 후 뇌물을 수수, 요구 또는 약속한 때에는 5년 이하의 징역 또는 10년 이하의 자격정지에 처한다.\n④전3항의 경우에는 10년 이하의 자격정지를 병과할 수 있다.\n제131조(수뢰후부정처사, 사후수뢰)","kind":"L"},{"id":"L:132","label":"법 제132조","title":"알선수뢰","chapter":"제2편 각칙 제7장 공무원의 직무에 관한 죄","deleted":false,"text":"제132조(알선수뢰) 공무원이 그 지위를 이용하여 다른 공무원의 직무에 속한 사항의 알선에 관하여 뇌물을 수수, 요구 또는 약속한 때에는 3년 이하의 징역 또는 7년 이하의 자격정지에 처한다.","kind":"L"},{"id":"L:133","label":"법 제133조","title":"뇌물공여 등","chapter":"제2편 각칙 제7장 공무원의 직무에 관한 죄","deleted":false,"text":"① 제129조부터 제132조까지에 기재한 뇌물을 약속, 공여 또는 공여의 의사를 표시한 자는 5년 이하의 징역 또는 2천만원 이하의 벌금에 처한다.\n② 제1항의 행위에 제공할 목적으로 제3자에게 금품을 교부한 자 또는 그 사정을 알면서 금품을 교부받은 제3자도 제1항의 형에 처한다.\n제133조(뇌물공여 등)","kind":"L"},{"id":"L:134","label":"법 제134조","title":"몰수, 추징","chapter":"제2편 각칙 제7장 공무원의 직무에 관한 죄","deleted":false,"text":"제134조(몰수, 추징) 범인 또는 사정을 아는 제3자가 받은 뇌물 또는 뇌물로 제공하려고 한 금품은 몰수한다. 이를 몰수할 수 없을 경우에는 그 가액을 추징한다.","kind":"L"},{"id":"L:135","label":"법 제135조","title":"공무원의 직무상 범죄에 대한 형의 가중","chapter":"제2편 각칙 제7장 공무원의 직무에 관한 죄","deleted":false,"text":"제135조(공무원의 직무상 범죄에 대한 형의 가중) 공무원이 직권을 이용하여 본장 이외의 죄를 범한 때에는 그 죄에 정한 형의 2분의 1까지 가중한다. 단 공무원의 신분에 의하여 특별히 형이 규정된 때에는 예외로 한다.","kind":"L"},{"id":"L:136","label":"법 제136조","title":"공무집행방해","chapter":"제2편 각칙 제8장 공무방해에 관한 죄","deleted":false,"text":"①직무를 집행하는 공무원에 대하여 폭행 또는 협박한 자는 5년 이하의 징역 또는 1천만원 이하의 벌금에 처한다. <개정 1995.12.29>\n②공무원에 대하여 그 직무상의 행위를 강요 또는 조지하거나 그 직을 사퇴하게 할 목적으로 폭행 또는 협박한 자도 전항의 형과 같다.\n제136조(공무집행방해)","kind":"L"},{"id":"L:137","label":"법 제137조","title":"위계에 의한 공무집행방해","chapter":"제2편 각칙 제8장 공무방해에 관한 죄","deleted":false,"text":"제137조(위계에 의한 공무집행방해) 위계로써 공무원의 직무집행을 방해한 자는 5년 이하의 징역 또는 1천만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:138","label":"법 제138조","title":"법정 또는 국회회의장모욕","chapter":"제2편 각칙 제8장 공무방해에 관한 죄","deleted":false,"text":"제138조(법정 또는 국회회의장모욕) 법원의 재판 또는 국회의 심의를 방해 또는 위협할 목적으로 법정이나 국회회의장 또는 그 부근에서 모욕 또는 소동한 자는 3년 이하의 징역 또는 700만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:139","label":"법 제139조","title":"인권옹호직무방해","chapter":"제2편 각칙 제8장 공무방해에 관한 죄","deleted":false,"text":"제139조(인권옹호직무방해) 경찰의 직무를 행하는 자 또는 이를 보조하는 자가 인권옹호에 관한 검사의 직무집행을 방해하거나 그 명령을 준수하지 아니한 때에는 5년 이하의 징역 또는 10년 이하의 자격정지에 처한다.","kind":"L"},{"id":"L:140","label":"법 제140조","title":"공무상비밀표시무효","chapter":"제2편 각칙 제8장 공무방해에 관한 죄","deleted":false,"text":"①공무원이 그 직무에 관하여 실시한 봉인 또는 압류 기타 강제처분의 표시를 손상 또는 은닉하거나 기타 방법으로 그 효용을 해한 자는 5년 이하의 징역 또는 700만원 이하의 벌금에 처한다. <개정 1995.12.29>\n②공무원이 그 직무에 관하여 봉함 기타 비밀장치한 문서 또는 도화를 개봉한 자도 제1항의 형과 같다. <개정 1995.12.29>\n③공무원이 그 직무에 관하여 봉함 기타 비밀장치한 문서, 도화 또는 전자기록등 특수매체기록을 기술적 수단을 이용하여 그 내용을 알아낸 자도 제1항의 형과 같다. <신설 1995.12.29>\n제140조(공무상비밀표시무효)","kind":"L"},{"id":"L:140-2","label":"법 제140조의2","title":"부동산강제집행효용침해","chapter":"제2편 각칙 제8장 공무방해에 관한 죄","deleted":false,"text":"제140조의2(부동산강제집행효용침해) 강제집행으로 명도 또는 인도된 부동산에 침입하거나 기타 방법으로 강제집행의 효용을 해한 자는 5년 이하의 징역 또는 700만원 이하의 벌금에 처한다.","kind":"L"},{"id":"L:141","label":"법 제141조","title":"공용서류 등의 무효, 공용물의 파괴","chapter":"제2편 각칙 제8장 공무방해에 관한 죄","deleted":false,"text":"①공무소에서 사용하는 서류 기타 물건 또는 전자기록등 특수매체기록을 손상 또는 은닉하거나 기타 방법으로 그 효용을 해한 자는 7년 이하의 징역 또는 1천만원 이하의 벌금에 처한다. <개정 1995.12.29>\n②공무소에서 사용하는 건조물, 선박, 기차 또는 항공기를 파괴한 자는 1년 이상 10년 이하의 징역에 처한다.\n제141조(공용서류 등의 무효, 공용물의 파괴)","kind":"L"},{"id":"L:142","label":"법 제142조","title":"공무상 보관물의 무효","chapter":"제2편 각칙 제8장 공무방해에 관한 죄","deleted":false,"text":"제142조(공무상 보관물의 무효) 공무소로부터 보관명령을 받거나 공무소의 명령으로 타인이 관리하는 자기의 물건을 손상 또는 은닉하거나 기타 방법으로 그 효용을 해한 자는 5년 이하의 징역 또는 700만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:143","label":"법 제143조","title":"미수범","chapter":"제2편 각칙 제8장 공무방해에 관한 죄","deleted":false,"text":"제143조(미수범) 제140조 내지 전조의 미수범은 처벌한다.","kind":"L"},{"id":"L:144","label":"법 제144조","title":"특수공무방해","chapter":"제2편 각칙 제8장 공무방해에 관한 죄","deleted":false,"text":"①단체 또는 다중의 위력을 보이거나 위험한 물건을 휴대하여 제136조, 제138조와 제140조 내지 전조의 죄를 범한 때에는 각조에 정한 형의 2분의 1까지 가중한다.\n②제1항의 죄를 범하여 공무원을 상해에 이르게 한 때에는 3년 이상의 유기징역에 처한다. 사망에 이르게 한 때에는 무기 또는 5년 이상의 징역에 처한다. <개정 1995.12.29>\n제144조(특수공무방해)","kind":"L"},{"id":"L:145","label":"법 제145조","title":"도주, 집합명령위반","chapter":"제2편 각칙 제9장 도주와 범인은닉의 죄","deleted":false,"text":"① 법률에 따라 체포되거나 구금된 자가 도주한 경우에는 1년 이하의 징역에 처한다.\n② 제1항의 구금된 자가 천재지변이나 사변 그 밖에 법령에 따라 잠시 석방된 상황에서 정당한 이유없이 집합명령에 위반한 경우에도 제1항의 형에 처한다.\n제145조(도주, 집합명령위반)","kind":"L"},{"id":"L:146","label":"법 제146조","title":"특수도주","chapter":"제2편 각칙 제9장 도주와 범인은닉의 죄","deleted":false,"text":"제146조(특수도주) 수용설비 또는 기구를 손괴하거나 사람에게 폭행 또는 협박을 가하거나 2인 이상이 합동하여 전조제1항의 죄를 범한 자는 7년 이하의 징역에 처한다.","kind":"L"},{"id":"L:147","label":"법 제147조","title":"도주원조","chapter":"제2편 각칙 제9장 도주와 범인은닉의 죄","deleted":false,"text":"제147조(도주원조) 법률에 의하여 구금된 자를 탈취하거나 도주하게 한 자는 10년 이하의 징역에 처한다.","kind":"L"},{"id":"L:148","label":"법 제148조","title":"간수자의 도주원조","chapter":"제2편 각칙 제9장 도주와 범인은닉의 죄","deleted":false,"text":"제148조(간수자의 도주원조) 법률에 의하여 구금된 자를 간수 또는 호송하는 자가 이를 도주하게 한 때에는 1년 이상 10년 이하의 징역에 처한다.","kind":"L"},{"id":"L:149","label":"법 제149조","title":"미수범","chapter":"제2편 각칙 제9장 도주와 범인은닉의 죄","deleted":false,"text":"제149조(미수범) 전4조의 미수범은 처벌한다.","kind":"L"},{"id":"L:150","label":"법 제150조","title":"예비, 음모","chapter":"제2편 각칙 제9장 도주와 범인은닉의 죄","deleted":false,"text":"제150조(예비, 음모) 제147조와 제148조의 죄를 범할 목적으로 예비 또는 음모한 자는 3년 이하의 징역에 처한다.","kind":"L"},{"id":"L:151","label":"법 제151조","title":"범인은닉과 친족간의 특례","chapter":"제2편 각칙 제9장 도주와 범인은닉의 죄","deleted":false,"text":"①벌금 이상의 형에 해당하는 죄를 범한 자를 은닉 또는 도피하게 한 자는 3년 이하의 징역 또는 500만원 이하의 벌금에 처한다. <개정 1995.12.29>\n②친족 또는 동거의 가족이 본인을 위하여 전항의 죄를 범한 때에는 처벌하지 아니한다. <개정 2005.3.31>\n제151조(범인은닉과 친족간의 특례)","kind":"L"},{"id":"L:152","label":"법 제152조","title":"위증, 모해위증","chapter":"제2편 각칙 제10장 위증과 증거인멸의 죄","deleted":false,"text":"①법률에 의하여 선서한 증인이 허위의 진술을 한 때에는 5년 이하의 징역 또는 1천만원 이하의 벌금에 처한다. <개정 1995.12.29>\n②형사사건 또는 징계사건에 관하여 피고인, 피의자 또는 징계혐의자를 모해할 목적으로 전항의 죄를 범한 때에는 10년 이하의 징역에 처한다.\n제152조(위증, 모해위증)","kind":"L"},{"id":"L:153","label":"법 제153조","title":"자백, 자수","chapter":"제2편 각칙 제10장 위증과 증거인멸의 죄","deleted":false,"text":"제153조(자백, 자수) 전조의 죄를 범한 자가 그 공술한 사건의 재판 또는 징계처분이 확정되기 전에 자백 또는 자수한 때에는 그 형을 감경 또는 면제한다.","kind":"L"},{"id":"L:154","label":"법 제154조","title":"허위의 감정, 통역, 번역","chapter":"제2편 각칙 제10장 위증과 증거인멸의 죄","deleted":false,"text":"제154조(허위의 감정, 통역, 번역) 법률에 의하여 선서한 감정인, 통역인 또는 번역인이 허위의 감정, 통역 또는 번역을 한 때에는 전2조의 예에 의한다.","kind":"L"},{"id":"L:155","label":"법 제155조","title":"증거인멸 등과 친족간의 특례","chapter":"제2편 각칙 제10장 위증과 증거인멸의 죄","deleted":false,"text":"①타인의 형사사건 또는 징계사건에 관한 증거를 인멸, 은닉, 위조 또는 변조하거나 위조 또는 변조한 증거를 사용한 자는 5년 이하의 징역 또는 700만원 이하의 벌금에 처한다. <개정 1995.12.29>\n②타인의 형사사건 또는 징계사건에 관한 증인을 은닉 또는 도피하게 한 자도 제1항의 형과 같다. <개정 1995.12.29>\n③피고인, 피의자 또는 징계혐의자를 모해할 목적으로 전2항의 죄를 범한 자는 10년 이하의 징역에 처한다.\n④친족 또는 동거의 가족이 본인을 위하여 본조의 죄를 범한 때에는 처벌하지 아니한다. <개정 2005.3.31>\n제155조(증거인멸 등과 친족간의 특례)","kind":"L"},{"id":"L:156","label":"법 제156조","title":"무고","chapter":"제2편 각칙 제11장 무고의 죄","deleted":false,"text":"제156조(무고) 타인으로 하여금 형사처분 또는 징계처분을 받게 할 목적으로 공무소 또는 공무원에 대하여 허위의 사실을 신고한 자는 10년 이하의 징역 또는 1천500만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:157","label":"법 제157조","title":"자백ㆍ자수","chapter":"제2편 각칙 제11장 무고의 죄","deleted":false,"text":"제157조(자백ㆍ자수) 제153조는 전조에 준용한다.","kind":"L"},{"id":"L:158","label":"법 제158조","title":"장례식등의 방해","chapter":"제2편 각칙 제12장 신앙에 관한 죄","deleted":false,"text":"제158조(장례식등의 방해) 장례식, 제사, 예배 또는 설교를 방해한 자는 3년 이하의 징역 또는 500만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:159","label":"법 제159조","title":"시체 등의 오욕","chapter":"제2편 각칙 제12장 신앙에 관한 죄","deleted":false,"text":"제159조(시체 등의 오욕) 시체, 유골 또는 유발(遺髮)을 오욕한 자는 2년 이하의 징역 또는 500만원 이하의 벌금에 처한다.","kind":"L"},{"id":"L:160","label":"법 제160조","title":"분묘의 발굴","chapter":"제2편 각칙 제12장 신앙에 관한 죄","deleted":false,"text":"제160조(분묘의 발굴) 분묘를 발굴한 자는 5년 이하의 징역에 처한다.","kind":"L"},{"id":"L:161","label":"법 제161조","title":"시체 등의 유기 등","chapter":"제2편 각칙 제12장 신앙에 관한 죄","deleted":false,"text":"① 시체, 유골, 유발 또는 관 속에 넣어 둔 물건을 손괴(損壞), 유기, 은닉 또는 영득(領得)한 자는 7년 이하의 징역에 처한다.\n② 분묘를 발굴하여 제1항의 죄를 지은 자는 10년 이하의 징역에 처한다.\n제161조(시체 등의 유기 등)","kind":"L"},{"id":"L:162","label":"법 제162조","title":"미수범","chapter":"제2편 각칙 제12장 신앙에 관한 죄","deleted":false,"text":"제162조(미수범) 전2조의 미수범은 처벌한다.","kind":"L"},{"id":"L:163","label":"법 제163조","title":"변사체 검시 방해","chapter":"제2편 각칙 제12장 신앙에 관한 죄","deleted":false,"text":"제163조(변사체 검시 방해) 변사자의 시체 또는 변사(變死)로 의심되는 시체를 은닉하거나 변경하거나 그 밖의 방법으로 검시(檢視)를 방해한 자는 700만원 이하의 벌금에 처한다.","kind":"L"},{"id":"L:164","label":"법 제164조","title":"현주건조물 등 방화","chapter":"제2편 각칙 제13장 방화와 실화의 죄","deleted":false,"text":"① 불을 놓아 사람이 주거로 사용하거나 사람이 현존하는 건조물, 기차, 전차, 자동차, 선박, 항공기 또는 지하채굴시설을 불태운 자는 무기 또는 3년 이상의 징역에 처한다.\n② 제1항의 죄를 지어 사람을 상해에 이르게 한 경우에는 무기 또는 5년 이상의 징역에 처한다. 사망에 이르게 한 경우에는 사형, 무기 또는 7년 이상의 징역에 처한다.\n제164조(현주건조물 등 방화)","kind":"L"},{"id":"L:165","label":"법 제165조","title":"공용건조물 등 방화","chapter":"제2편 각칙 제13장 방화와 실화의 죄","deleted":false,"text":"제165조(공용건조물 등 방화) 불을 놓아 공용(公用)으로 사용하거나 공익을 위해 사용하는 건조물, 기차, 전차, 자동차, 선박, 항공기 또는 지하채굴시설을 불태운 자는 무기 또는 3년 이상의 징역에 처한다.","kind":"L"},{"id":"L:166","label":"법 제166조","title":"일반건조물 등 방화","chapter":"제2편 각칙 제13장 방화와 실화의 죄","deleted":false,"text":"① 불을 놓아 제164조와 제165조에 기재한 외의 건조물, 기차, 전차, 자동차, 선박, 항공기 또는 지하채굴시설을 불태운 자는 2년 이상의 유기징역에 처한다.\n② 자기 소유인 제1항의 물건을 불태워 공공의 위험을 발생하게 한 자는 7년 이하의 징역 또는 1천만원 이하의 벌금에 처한다.\n제166조(일반건조물 등 방화)","kind":"L"},{"id":"L:167","label":"법 제167조","title":"일반물건 방화","chapter":"제2편 각칙 제13장 방화와 실화의 죄","deleted":false,"text":"① 불을 놓아 제164조부터 제166조까지에 기재한 외의 물건을 불태워 공공의 위험을 발생하게 한 자는 1년 이상 10년 이하의 징역에 처한다.\n② 제1항의 물건이 자기 소유인 경우에는 3년 이하의 징역 또는 700만원 이하의 벌금에 처한다.\n제167조(일반물건 방화)","kind":"L"},{"id":"L:168","label":"법 제168조","title":"연소","chapter":"제2편 각칙 제13장 방화와 실화의 죄","deleted":false,"text":"①제166조제2항 또는 전조제2항의 죄를 범하여 제164조, 제165조 또는 제166조제1항에 기재한 물건에 연소한 때에는 1년 이상 10년 이하의 징역에 처한다.\n②전조제2항의 죄를 범하여 전조제1항에 기재한 물건에 연소한 때에는 5년 이하의 징역에 처한다.\n제168조(연소)","kind":"L"},{"id":"L:169","label":"법 제169조","title":"진화방해","chapter":"제2편 각칙 제13장 방화와 실화의 죄","deleted":false,"text":"제169조(진화방해) 화재에 있어서 진화용의 시설 또는 물건을 은닉 또는 손괴하거나 기타 방법으로 진화를 방해한 자는 10년 이하의 징역에 처한다.","kind":"L"},{"id":"L:170","label":"법 제170조","title":"실화","chapter":"제2편 각칙 제13장 방화와 실화의 죄","deleted":false,"text":"① 과실로 제164조 또는 제165조에 기재한 물건 또는 타인 소유인 제166조에 기재한 물건을 불태운 자는 1천500만원 이하의 벌금에 처한다.\n② 과실로 자기 소유인 제166조의 물건 또는 제167조에 기재한 물건을 불태워 공공의 위험을 발생하게 한 자도 제1항의 형에 처한다.\n제170조(실화)","kind":"L"},{"id":"L:171","label":"법 제171조","title":"업무상실화, 중실화","chapter":"제2편 각칙 제13장 방화와 실화의 죄","deleted":false,"text":"제171조(업무상실화, 중실화) 업무상과실 또는 중대한 과실로 인하여 제170조의 죄를 범한 자는 3년 이하의 금고 또는 2천만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:172","label":"법 제172조","title":"폭발성물건파열","chapter":"제2편 각칙 제13장 방화와 실화의 죄","deleted":false,"text":"①보일러, 고압가스 기타 폭발성있는 물건을 파열시켜 사람의 생명, 신체 또는 재산에 대하여 위험을 발생시킨 자는 1년 이상의 유기징역에 처한다.\n②제1항의 죄를 범하여 사람을 상해에 이르게 한 때에는 무기 또는 3년 이상의 징역에 처한다. 사망에 이르게 한 때에는 무기 또는 5년 이상의 징역에 처한다.\n제172조(폭발성물건파열)","kind":"L"},{"id":"L:172-2","label":"법 제172조의2","title":"가스ㆍ전기등 방류","chapter":"제2편 각칙 제13장 방화와 실화의 죄","deleted":false,"text":"①가스, 전기, 증기 또는 방사선이나 방사성 물질을 방출, 유출 또는 살포시켜 사람의 생명, 신체 또는 재산에 대하여 위험을 발생시킨 자는 1년 이상 10년 이하의 징역에 처한다.\n②제1항의 죄를 범하여 사람을 상해에 이르게 한 때에는 무기 또는 3년 이상의 징역에 처한다. 사망에 이르게 한 때에는 무기 또는 5년 이상의 징역에 처한다.\n제172조의2(가스ㆍ전기등 방류)","kind":"L"},{"id":"L:173","label":"법 제173조","title":"가스ㆍ전기등 공급방해","chapter":"제2편 각칙 제13장 방화와 실화의 죄","deleted":false,"text":"①가스, 전기 또는 증기의 공작물을 손괴 또는 제거하거나 기타 방법으로 가스, 전기 또는 증기의 공급이나 사용을 방해하여 공공의 위험을 발생하게 한 자는 1년 이상 10년 이하의 징역에 처한다. <개정 1995.12.29>\n②공공용의 가스, 전기 또는 증기의 공작물을 손괴 또는 제거하거나 기타 방법으로 가스, 전기 또는 증기의 공급이나 사용을 방해한 자도 전항의 형과 같다. <개정 1995.12.29>\n③제1항 또는 제2항의 죄를 범하여 사람을 상해에 이르게 한 때에는 2년 이상의 유기징역에 처한다. 사망에 이르게 한 때에는 무기 또는 3년이상의 징역에 처한다. <개정 1995.12.29>\n제173조(가스ㆍ전기등 공급방해)","kind":"L"},{"id":"L:173-2","label":"법 제173조의2","title":"과실폭발성물건파열등","chapter":"제2편 각칙 제13장 방화와 실화의 죄","deleted":false,"text":"①과실로 제172조제1항, 제172조의2제1항, 제173조제1항과 제2항의 죄를 범한 자는 5년 이하의 금고 또는 1천500만원 이하의 벌금에 처한다.\n②업무상과실 또는 중대한 과실로 제1항의 죄를 범한 자는 7년 이하의 금고 또는 2천만원 이하의 벌금에 처한다.\n제173조의2(과실폭발성물건파열등)","kind":"L"},{"id":"L:174","label":"법 제174조","title":"미수범","chapter":"제2편 각칙 제13장 방화와 실화의 죄","deleted":false,"text":"제174조(미수범) 제164조제1항, 제165조, 제166조제1항, 제172조제1항, 제172조의2제1항, 제173조제1항과 제2항의 미수범은 처벌한다.","kind":"L"},{"id":"L:175","label":"법 제175조","title":"예비, 음모","chapter":"제2편 각칙 제13장 방화와 실화의 죄","deleted":false,"text":"제175조(예비, 음모) 제164조제1항, 제165조, 제166조제1항, 제172조제1항, 제172조의2제1항, 제173조제1항과 제2항의 죄를 범할 목적으로 예비 또는 음모한 자는 5년 이하의 징역에 처한다. 단 그 목적한 죄의 실행에 이르기 전에 자수한 때에는 형을 감경 또는 면제한다. <개정 1995.12.29>","kind":"L"},{"id":"L:176","label":"법 제176조","title":"타인의 권리대상이 된 자기의 물건","chapter":"제2편 각칙 제13장 방화와 실화의 죄","deleted":false,"text":"제176조(타인의 권리대상이 된 자기의 물건) 자기의 소유에 속하는 물건이라도 압류 기타 강제처분을 받거나 타인의 권리 또는 보험의 목적물이 된 때에는 본장의 규정의 적용에 있어서 타인의 물건으로 간주한다.","kind":"L"},{"id":"L:177","label":"법 제177조","title":"현주건조물등에의 일수","chapter":"제2편 각칙 제14장 일수와 수리에 관한 죄","deleted":false,"text":"①물을 넘겨 사람이 주거에 사용하거나 사람이 현존하는 건조물, 기차, 전차, 자동차, 선박, 항공기 또는 광갱을 침해한 자는 무기 또는 3년 이상의 징역에 처한다.\n②제1항의 죄를 범하여 사람을 상해에 이르게 한 때에는 무기 또는 5년 이상의 징역에 처한다. 사망에 이르게 한 때에는 무기 또는 7년 이상의 징역에 처한다.\n제177조(현주건조물등에의 일수)","kind":"L"},{"id":"L:178","label":"법 제178조","title":"공용건조물 등에의 일수","chapter":"제2편 각칙 제14장 일수와 수리에 관한 죄","deleted":false,"text":"제178조(공용건조물 등에의 일수) 물을 넘겨 공용 또는 공익에 공하는 건조물, 기차, 전차, 자동차, 선박, 항공기 또는 광갱을 침해한 자는 무기 또는 2년 이상의 징역에 처한다.","kind":"L"},{"id":"L:179","label":"법 제179조","title":"일반건조물 등에의 일수","chapter":"제2편 각칙 제14장 일수와 수리에 관한 죄","deleted":false,"text":"①물을 넘겨 전2조에 기재한 이외의 건조물, 기차, 전차, 자동차, 선박, 항공기 또는 광갱 기타 타인의 재산을 침해한 자는 1년 이상 10년 이하의 징역에 처한다.\n②자기의 소유에 속하는 전항의 물건을 침해하여 공공의 위험을 발생하게 한 때에는 3년 이하의 징역 또는 700만원 이하의 벌금에 처한다. <개정 1995.12.29>\n③제176조의 규정은 본조의 경우에 준용한다.\n제179조(일반건조물 등에의 일수)","kind":"L"},{"id":"L:180","label":"법 제180조","title":"방수방해","chapter":"제2편 각칙 제14장 일수와 수리에 관한 죄","deleted":false,"text":"제180조(방수방해) 수재에 있어서 방수용의 시설 또는 물건을 손괴 또는 은닉하거나 기타 방법으로 방수를 방해한 자는 10년 이하의 징역에 처한다.","kind":"L"},{"id":"L:181","label":"법 제181조","title":"과실일수","chapter":"제2편 각칙 제14장 일수와 수리에 관한 죄","deleted":false,"text":"제181조(과실일수) 과실로 인하여 제177조 또는 제178조에 기재한 물건을 침해한 자 또는 제179조에 기재한 물건을 침해하여 공공의 위험을 발생하게 한 자는 1천만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:182","label":"법 제182조","title":"미수범","chapter":"제2편 각칙 제14장 일수와 수리에 관한 죄","deleted":false,"text":"제182조(미수범) 제177조 내지 제179조제1항의 미수범은 처벌한다.","kind":"L"},{"id":"L:183","label":"법 제183조","title":"예비, 음모","chapter":"제2편 각칙 제14장 일수와 수리에 관한 죄","deleted":false,"text":"제183조(예비, 음모) 제177조 내지 제179조제1항의 죄를 범할 목적으로 예비 또는 음모한 자는 3년 이하의 징역에 처한다.","kind":"L"},{"id":"L:184","label":"법 제184조","title":"수리방해","chapter":"제2편 각칙 제14장 일수와 수리에 관한 죄","deleted":false,"text":"제184조(수리방해) 둑을 무너뜨리거나 수문을 파괴하거나 그 밖의 방법으로 수리(水利)를 방해한 자는 5년 이하의 징역 또는 700만원 이하의 벌금에 처한다.","kind":"L"},{"id":"L:185","label":"법 제185조","title":"일반교통방해","chapter":"제2편 각칙 제15장 교통방해의 죄","deleted":false,"text":"제185조(일반교통방해) 육로, 수로 또는 교량을 손괴 또는 불통하게 하거나 기타 방법으로 교통을 방해한 자는 10년 이하의 징역 또는 1천500만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:186","label":"법 제186조","title":"기차, 선박 등의 교통방해","chapter":"제2편 각칙 제15장 교통방해의 죄","deleted":false,"text":"제186조(기차, 선박 등의 교통방해) 궤도, 등대 또는 표지를 손괴하거나 기타 방법으로 기차, 전차, 자동차, 선박 또는 항공기의 교통을 방해한 자는 1년 이상의 유기징역에 처한다.","kind":"L"},{"id":"L:187","label":"법 제187조","title":"기차 등의 전복 등","chapter":"제2편 각칙 제15장 교통방해의 죄","deleted":false,"text":"제187조(기차 등의 전복 등) 사람의 현존하는 기차, 전차, 자동차, 선박 또는 항공기를 전복, 매몰, 추락 또는 파괴한 자는 무기 또는 3년 이상의 징역에 처한다.","kind":"L"},{"id":"L:188","label":"법 제188조","title":"교통방해치사상","chapter":"제2편 각칙 제15장 교통방해의 죄","deleted":false,"text":"제188조(교통방해치사상) 제185조 내지 제187조의 죄를 범하여 사람을 상해에 이르게 한 때에는 무기 또는 3년 이상의 징역에 처한다. 사망에 이르게 한 때에는 무기 또는 5년 이상의 징역에 처한다.","kind":"L"},{"id":"L:189","label":"법 제189조","title":"과실, 업무상과실, 중과실","chapter":"제2편 각칙 제15장 교통방해의 죄","deleted":false,"text":"①과실로 인하여 제185조 내지 제187조의 죄를 범한 자는 1천만원 이하의 벌금에 처한다. <개정 1995.12.29>\n②업무상과실 또는 중대한 과실로 인하여 제185조 내지 제187조의 죄를 범한 자는 3년 이하의 금고 또는 2천만원 이하의 벌금에 처한다. <개정 1995.12.29>\n제189조(과실, 업무상과실, 중과실)","kind":"L"},{"id":"L:190","label":"법 제190조","title":"미수범","chapter":"제2편 각칙 제15장 교통방해의 죄","deleted":false,"text":"제190조(미수범) 제185조 내지 제187조의 미수범은 처벌한다.","kind":"L"},{"id":"L:191","label":"법 제191조","title":"예비, 음모","chapter":"제2편 각칙 제15장 교통방해의 죄","deleted":false,"text":"제191조(예비, 음모) 제186조 또는 제187조의 죄를 범할 목적으로 예비 또는 음모한 자는 3년 이하의 징역에 처한다.","kind":"L"},{"id":"L:192","label":"법 제192조","title":"먹는 물의 사용방해","chapter":"제2편 각칙 제16장 먹는 물에 관한 죄","deleted":false,"text":"① 일상생활에서 먹는 물로 사용되는 물에 오물을 넣어 먹는 물로 쓰지 못하게 한 자는 1년 이하의 징역 또는 500만원 이하의 벌금에 처한다.\n② 제1항의 먹는 물에 독물(毒物)이나 그 밖에 건강을 해하는 물질을 넣은 사람은 10년 이하의 징역에 처한다.\n제192조(먹는 물의 사용방해)","kind":"L"},{"id":"L:193","label":"법 제193조","title":"수돗물의 사용방해","chapter":"제2편 각칙 제16장 먹는 물에 관한 죄","deleted":false,"text":"① 수도(水道)를 통해 공중이 먹는 물로 사용하는 물 또는 그 수원(水原)에 오물을 넣어 먹는 물로 쓰지 못하게 한 자는 1년 이상 10년 이하의 징역에 처한다.\n② 제1항의 먹는 물 또는 수원에 독물 그 밖에 건강을 해하는 물질을 넣은 자는 2년 이상의 유기징역에 처한다.\n제193조(수돗물의 사용방해)","kind":"L"},{"id":"L:194","label":"법 제194조","title":"먹는 물 혼독치사상","chapter":"제2편 각칙 제16장 먹는 물에 관한 죄","deleted":false,"text":"제194조(먹는 물 혼독치사상) 제192조제2항 또는 제193조제2항의 죄를 지어 사람을 상해에 이르게 한 경우에는 무기 또는 3년 이상의 징역에 처한다. 사망에 이르게 한 경우에는 무기 또는 5년 이상의 징역에 처한다.","kind":"L"},{"id":"L:195","label":"법 제195조","title":"수도불통","chapter":"제2편 각칙 제16장 먹는 물에 관한 죄","deleted":false,"text":"제195조(수도불통) 공중이 먹는 물을 공급하는 수도 그 밖의 시설을 손괴하거나 그 밖의 방법으로 불통(不通)하게 한 자는 1년 이상 10년 이하의 징역에 처한다.","kind":"L"},{"id":"L:196","label":"법 제196조","title":"미수범","chapter":"제2편 각칙 제16장 먹는 물에 관한 죄","deleted":false,"text":"제196조(미수범) 제192조제2항, 제193조제2항과 전조의 미수범은 처벌한다.","kind":"L"},{"id":"L:197","label":"법 제197조","title":"예비, 음모","chapter":"제2편 각칙 제16장 먹는 물에 관한 죄","deleted":false,"text":"제197조(예비, 음모) 제192조제2항, 제193조제2항 또는 제195조의 죄를 범할 목적으로 예비 또는 음모한 자는 2년 이하의 징역에 처한다.","kind":"L"},{"id":"L:198","label":"법 제198조","title":"아편 등의 제조 등","chapter":"제2편 각칙 제17장 아편에 관한 죄","deleted":false,"text":"제198조(아편 등의 제조 등) 아편, 몰핀 또는 그 화합물을 제조, 수입 또는 판매하거나 판매할 목적으로 소지한 자는 10년 이하의 징역에 처한다.","kind":"L"},{"id":"L:199","label":"법 제199조","title":"아편흡식기의 제조 등","chapter":"제2편 각칙 제17장 아편에 관한 죄","deleted":false,"text":"제199조(아편흡식기의 제조 등) 아편을 흡식하는 기구를 제조, 수입 또는 판매하거나 판매할 목적으로 소지한 자는 5년 이하의 징역에 처한다.","kind":"L"},{"id":"L:200","label":"법 제200조","title":"세관 공무원의 아편 등의 수입","chapter":"제2편 각칙 제17장 아편에 관한 죄","deleted":false,"text":"제200조(세관 공무원의 아편 등의 수입) 세관의 공무원이 아편, 몰핀이나 그 화합물 또는 아편흡식기구를 수입하거나 그 수입을 허용한 때에는 1년 이상의 유기징역에 처한다.","kind":"L"},{"id":"L:201","label":"법 제201조","title":"아편흡식 등, 동장소제공","chapter":"제2편 각칙 제17장 아편에 관한 죄","deleted":false,"text":"①아편을 흡식하거나 몰핀을 주사한 자는 5년 이하의 징역에 처한다.\n②아편흡식 또는 몰핀 주사의 장소를 제공하여 이익을 취한 자도 전항의 형과 같다.\n제201조(아편흡식 등, 동장소제공)","kind":"L"},{"id":"L:202","label":"법 제202조","title":"미수범","chapter":"제2편 각칙 제17장 아편에 관한 죄","deleted":false,"text":"제202조(미수범) 전4조의 미수범은 처벌한다.","kind":"L"},{"id":"L:203","label":"법 제203조","title":"상습범","chapter":"제2편 각칙 제17장 아편에 관한 죄","deleted":false,"text":"제203조(상습범) 상습으로 전5조의 죄를 범한 때에는 각조에 정한 형의 2분의 1까지 가중한다.","kind":"L"},{"id":"L:204","label":"법 제204조","title":"자격정지 또는 벌금의 병과","chapter":"제2편 각칙 제17장 아편에 관한 죄","deleted":false,"text":"제204조(자격정지 또는 벌금의 병과) 제198조 내지 제203조의 경우에는 10년 이하의 자격정지 또는 2천만원 이하의 벌금을 병과할 수 있다. <개정 1995.12.29>","kind":"L"},{"id":"L:205","label":"법 제205조","title":"아편 등의 소지","chapter":"제2편 각칙 제17장 아편에 관한 죄","deleted":false,"text":"제205조(아편 등의 소지) 아편, 몰핀이나 그 화합물 또는 아편흡식기구를 소지한 자는 1년 이하의 징역 또는 500만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:206","label":"법 제206조","title":"몰수, 추징","chapter":"제2편 각칙 제17장 아편에 관한 죄","deleted":false,"text":"제206조(몰수, 추징) 본장의 죄에 제공한 아편, 몰핀이나 그 화합물 또는 아편흡식기구는 몰수한다. 그를 몰수하기 불능한 때에는 그 가액을 추징한다.","kind":"L"},{"id":"L:207","label":"법 제207조","title":"통화의 위조 등","chapter":"제2편 각칙 제18장 통화에 관한 죄","deleted":false,"text":"①행사할 목적으로 통용하는 대한민국의 화폐, 지폐 또는 은행권을 위조 또는 변조한 자는 무기 또는 2년 이상의 징역에 처한다.\n②행사할 목적으로 내국에서 유통하는 외국의 화폐, 지폐 또는 은행권을 위조 또는 변조한 자는 1년 이상의 유기징역에 처한다.\n③행사할 목적으로 외국에서 통용하는 외국의 화폐, 지폐 또는 은행권을 위조 또는 변조한 자는 10년 이하의 징역에 처한다.\n④위조 또는 변조한 전3항 기재의 통화를 행사하거나 행사할 목적으로 수입 또는 수출한 자는 그 위조 또는 변조의 각 죄에 정한 형에 처한다.\n제207조(통화의 위조 등)","kind":"L"},{"id":"L:208","label":"법 제208조","title":"위조통화의 취득","chapter":"제2편 각칙 제18장 통화에 관한 죄","deleted":false,"text":"제208조(위조통화의 취득) 행사할 목적으로 위조 또는 변조한 제207조 기재의 통화를 취득한 자는 5년 이하의 징역 또는 1천500만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:209","label":"법 제209조","title":"자격정지 또는 벌금의 병과","chapter":"제2편 각칙 제18장 통화에 관한 죄","deleted":false,"text":"제209조(자격정지 또는 벌금의 병과) 제207조 또는 제208조의 죄를 범하여 유기징역에 처할 경우에는 10년 이하의 자격정지 또는 2천만원 이하의 벌금을 병과할 수 있다. <개정 1995.12.29>","kind":"L"},{"id":"L:210","label":"법 제210조","title":"위조통화 취득 후의 지정행사","chapter":"제2편 각칙 제18장 통화에 관한 죄","deleted":false,"text":"제210조(위조통화 취득 후의 지정행사) 제207조에 기재한 통화를 취득한 후 그 사정을 알고 행사한 자는 2년 이하의 징역 또는 500만원 이하의 벌금에 처한다.","kind":"L"},{"id":"L:211","label":"법 제211조","title":"통화유사물의 제조 등","chapter":"제2편 각칙 제18장 통화에 관한 죄","deleted":false,"text":"①판매할 목적으로 내국 또는 외국에서 통용하거나 유통하는 화폐, 지폐 또는 은행권에 유사한 물건을 제조, 수입 또는 수출한 자는 3년 이하의 징역 또는 700만원 이하의 벌금에 처한다. <개정 1995.12.29>\n②전항의 물건을 판매한 자도 전항의 형과 같다.\n제211조(통화유사물의 제조 등)","kind":"L"},{"id":"L:212","label":"법 제212조","title":"미수범","chapter":"제2편 각칙 제18장 통화에 관한 죄","deleted":false,"text":"제212조(미수범) 제207조, 제208조와 전조의 미수범은 처벌한다.","kind":"L"},{"id":"L:213","label":"법 제213조","title":"예비, 음모","chapter":"제2편 각칙 제18장 통화에 관한 죄","deleted":false,"text":"제213조(예비, 음모) 제207조제1항 내지 제3항의 죄를 범할 목적으로 예비 또는 음모한 자는 5년 이하의 징역에 처한다. 단, 그 목적한 죄의 실행에 이르기 전에 자수한 때에는 그 형을 감경 또는 면제한다.","kind":"L"},{"id":"L:214","label":"법 제214조","title":"유가증권의 위조 등","chapter":"제2편 각칙 제19장 유가증권, 우표와 인지에 관한 죄","deleted":false,"text":"①행사할 목적으로 대한민국 또는 외국의 공채증서 기타 유가증권을 위조 또는 변조한 자는 10년 이하의 징역에 처한다.\n②행사할 목적으로 유가증권의 권리의무에 관한 기재를 위조 또는 변조한 자도 전항의 형과 같다.\n제214조(유가증권의 위조 등)","kind":"L"},{"id":"L:215","label":"법 제215조","title":"자격모용에 의한 유가증권의 작성","chapter":"제2편 각칙 제19장 유가증권, 우표와 인지에 관한 죄","deleted":false,"text":"제215조(자격모용에 의한 유가증권의 작성) 행사할 목적으로 타인의 자격을 모용하여 유가증권을 작성하거나 유가증권의 권리 또는 의무에 관한 사항을 기재한 자는 10년 이하의 징역에 처한다.","kind":"L"},{"id":"L:216","label":"법 제216조","title":"허위유가증권의 작성 등","chapter":"제2편 각칙 제19장 유가증권, 우표와 인지에 관한 죄","deleted":false,"text":"제216조(허위유가증권의 작성 등) 행사할 목적으로 허위의 유가증권을 작성하거나 유가증권에 허위사항을 기재한 자는 7년 이하의 징역 또는 3천만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:217","label":"법 제217조","title":"위조유가증권 등의 행사 등","chapter":"제2편 각칙 제19장 유가증권, 우표와 인지에 관한 죄","deleted":false,"text":"제217조(위조유가증권 등의 행사 등) 위조, 변조, 작성 또는 허위기재한 전3조 기재의 유가증권을 행사하거나 행사할 목적으로 수입 또는 수출한 자는 10년 이하의 징역에 처한다.","kind":"L"},{"id":"L:218","label":"법 제218조","title":"인지ㆍ우표의 위조등","chapter":"제2편 각칙 제19장 유가증권, 우표와 인지에 관한 죄","deleted":false,"text":"①행사할 목적으로 대한민국 또는 외국의 인지, 우표 기타 우편요금을 표시하는 증표를 위조 또는 변조한 자는 10년 이하의 징역에 처한다. <개정 1995.12.29>\n②위조 또는 변조된 대한민국 또는 외국의 인지, 우표 기타 우편요금을 표시하는 증표를 행사하거나 행사할 목적으로 수입 또는 수출한 자도 제1항의 형과 같다. <개정 1995.12.29>\n제218조(인지ㆍ우표의 위조등)","kind":"L"},{"id":"L:219","label":"법 제219조","title":"위조인지ㆍ우표등의 취득","chapter":"제2편 각칙 제19장 유가증권, 우표와 인지에 관한 죄","deleted":false,"text":"제219조(위조인지ㆍ우표등의 취득) 행사할 목적으로 위조 또는 변조한 대한민국 또는 외국의 인지, 우표 기타 우편요금을 표시하는 증표를 취득한 자는 3년 이하의 징역 또는 1천만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:220","label":"법 제220조","title":"자격정지 또는 벌금의 병과","chapter":"제2편 각칙 제19장 유가증권, 우표와 인지에 관한 죄","deleted":false,"text":"제220조(자격정지 또는 벌금의 병과) 제214조 내지 제219조의 죄를 범하여 징역에 처하는 경우에는 10년 이하의 자격정지 또는 2천만원 이하의 벌금을 병과할 수 있다.","kind":"L"},{"id":"L:221","label":"법 제221조","title":"소인말소","chapter":"제2편 각칙 제19장 유가증권, 우표와 인지에 관한 죄","deleted":false,"text":"제221조(소인말소) 행사할 목적으로 대한민국 또는 외국의 인지, 우표 기타 우편요금을 표시하는 증표의 소인 기타 사용의 표지를 말소한 자는 1년 이하의 징역 또는 300만원 이하의 벌금에 처한다.","kind":"L"},{"id":"L:222","label":"법 제222조","title":"인지ㆍ우표유사물의 제조 등","chapter":"제2편 각칙 제19장 유가증권, 우표와 인지에 관한 죄","deleted":false,"text":"①판매할 목적으로 대한민국 또는 외국의 공채증서, 인지, 우표 기타 우편요금을 표시하는 증표와 유사한 물건을 제조, 수입 또는 수출한 자는 2년 이하의 징역 또는 500만원 이하의 벌금에 처한다. <개정 1995.12.29>\n②전항의 물건을 판매한 자도 전항의 형과 같다.\n제222조(인지ㆍ우표유사물의 제조 등)","kind":"L"},{"id":"L:223","label":"법 제223조","title":"미수범","chapter":"제2편 각칙 제19장 유가증권, 우표와 인지에 관한 죄","deleted":false,"text":"제223조(미수범) 제214조 내지 제219조와 전조의 미수범은 처벌한다.","kind":"L"},{"id":"L:224","label":"법 제224조","title":"예비, 음모","chapter":"제2편 각칙 제19장 유가증권, 우표와 인지에 관한 죄","deleted":false,"text":"제224조(예비, 음모) 제214조, 제215조와 제218조제1항의 죄를 범할 목적으로 예비 또는 음모한 자는 2년 이하의 징역에 처한다.","kind":"L"},{"id":"L:225","label":"법 제225조","title":"공문서등의 위조ㆍ변조","chapter":"제2편 각칙 제20장 문서에 관한 죄","deleted":false,"text":"제225조(공문서등의 위조ㆍ변조) 행사할 목적으로 공무원 또는 공무소의 문서 또는 도화를 위조 또는 변조한 자는 10년 이하의 징역에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:226","label":"법 제226조","title":"자격모용에 의한 공문서 등의 작성","chapter":"제2편 각칙 제20장 문서에 관한 죄","deleted":false,"text":"제226조(자격모용에 의한 공문서 등의 작성) 행사할 목적으로 공무원 또는 공무소의 자격을 모용하여 문서 또는 도화를 작성한 자는 10년 이하의 징역에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:227","label":"법 제227조","title":"허위공문서작성등","chapter":"제2편 각칙 제20장 문서에 관한 죄","deleted":false,"text":"제227조(허위공문서작성등) 공무원이 행사할 목적으로 그 직무에 관하여 문서 또는 도화를 허위로 작성하거나 변개한 때에는 7년 이하의 징역 또는 2천만원 이하의 벌금에 처한다.","kind":"L"},{"id":"L:227-2","label":"법 제227조의2","title":"공전자기록위작ㆍ변작","chapter":"제2편 각칙 제20장 문서에 관한 죄","deleted":false,"text":"제227조의2(공전자기록위작ㆍ변작) 사무처리를 그르치게 할 목적으로 공무원 또는 공무소의 전자기록등 특수매체기록을 위작 또는 변작한 자는 10년 이하의 징역에 처한다.","kind":"L"},{"id":"L:228","label":"법 제228조","title":"공정증서원본 등의 부실기재","chapter":"제2편 각칙 제20장 문서에 관한 죄","deleted":false,"text":"①공무원에 대하여 허위신고를 하여 공정증서원본 또는 이와 동일한 전자기록등 특수매체기록에 부실의 사실을 기재 또는 기록하게 한 자는 5년 이하의 징역 또는 1천만원 이하의 벌금에 처한다. <개정 1995.12.29>\n②공무원에 대하여 허위신고를 하여 면허증, 허가증, 등록증 또는 여권에 부실의 사실을 기재하게 한 자는 3년 이하의 징역 또는 700만원 이하의 벌금에 처한다. <개정 1995.12.29>\n제228조(공정증서원본 등의 부실기재)","kind":"L"},{"id":"L:229","label":"법 제229조","title":"위조등 공문서의 행사","chapter":"제2편 각칙 제20장 문서에 관한 죄","deleted":false,"text":"제229조(위조등 공문서의 행사) 제225조 내지 제228조의 죄에 의하여 만들어진 문서, 도화, 전자기록등 특수매체기록, 공정증서원본, 면허증, 허가증, 등록증 또는 여권을 행사한 자는 그 각 죄에 정한 형에 처한다.","kind":"L"},{"id":"L:230","label":"법 제230조","title":"공문서 등의 부정행사","chapter":"제2편 각칙 제20장 문서에 관한 죄","deleted":false,"text":"제230조(공문서 등의 부정행사) 공무원 또는 공무소의 문서 또는 도화를 부정행사한 자는 2년 이하의 징역이나 금고 또는 500만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:231","label":"법 제231조","title":"사문서등의 위조ㆍ변조","chapter":"제2편 각칙 제20장 문서에 관한 죄","deleted":false,"text":"제231조(사문서등의 위조ㆍ변조) 행사할 목적으로 권리ㆍ의무 또는 사실증명에 관한 타인의 문서 또는 도화를 위조 또는 변조한 자는 5년 이하의 징역 또는 1천만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:232","label":"법 제232조","title":"자격모용에 의한 사문서의 작성","chapter":"제2편 각칙 제20장 문서에 관한 죄","deleted":false,"text":"제232조(자격모용에 의한 사문서의 작성) 행사할 목적으로 타인의 자격을 모용하여 권리ㆍ의무 또는 사실증명에 관한 문서 또는 도화를 작성한 자는 5년 이하의 징역 또는 1천만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:232-2","label":"법 제232조의2","title":"사전자기록위작ㆍ변작","chapter":"제2편 각칙 제20장 문서에 관한 죄","deleted":false,"text":"제232조의2(사전자기록위작ㆍ변작) 사무처리를 그르치게 할 목적으로 권리ㆍ의무 또는 사실증명에 관한 타인의 전자기록등 특수매체기록을 위작 또는 변작한 자는 5년 이하의 징역 또는 1천만원 이하의 벌금에 처한다.","kind":"L"},{"id":"L:233","label":"법 제233조","title":"허위진단서등의 작성","chapter":"제2편 각칙 제20장 문서에 관한 죄","deleted":false,"text":"제233조(허위진단서등의 작성) 의사, 한의사, 치과의사 또는 조산사가 진단서, 검안서 또는 생사에 관한 증명서를 허위로 작성한 때에는 3년 이하의 징역이나 금고, 7년 이하의 자격정지 또는 3천만원 이하의 벌금에 처한다.","kind":"L"},{"id":"L:234","label":"법 제234조","title":"위조사문서등의 행사","chapter":"제2편 각칙 제20장 문서에 관한 죄","deleted":false,"text":"제234조(위조사문서등의 행사) 제231조 내지 제233조의 죄에 의하여 만들어진 문서, 도화 또는 전자기록등 특수매체기록을 행사한 자는 그 각 죄에 정한 형에 처한다.","kind":"L"},{"id":"L:235","label":"법 제235조","title":"미수범","chapter":"제2편 각칙 제20장 문서에 관한 죄","deleted":false,"text":"제235조(미수범) 제225조 내지 제234조의 미수범은 처벌한다. <개정 1995.12.29>","kind":"L"},{"id":"L:236","label":"법 제236조","title":"사문서의 부정행사","chapter":"제2편 각칙 제20장 문서에 관한 죄","deleted":false,"text":"제236조(사문서의 부정행사) 권리ㆍ의무 또는 사실증명에 관한 타인의 문서 또는 도화를 부정행사한 자는 1년 이하의 징역이나 금고 또는 300만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:237","label":"법 제237조","title":"자격정지의 병과","chapter":"제2편 각칙 제20장 문서에 관한 죄","deleted":false,"text":"제237조(자격정지의 병과) 제225조 내지 제227조의2 및 그 행사죄를 범하여 징역에 처할 경우에는 10년 이하의 자격정지를 병과할 수 있다. <개정 1995.12.29>","kind":"L"},{"id":"L:237-2","label":"법 제237조의2","title":"복사문서등","chapter":"제2편 각칙 제20장 문서에 관한 죄","deleted":false,"text":"제237조의2(복사문서등) 이 장의 죄에 있어서 전자복사기, 모사전송기 기타 이와 유사한 기기를 사용하여 복사한 문서 또는 도화의 사본도 문서 또는 도화로 본다.","kind":"L"},{"id":"L:238","label":"법 제238조","title":"공인 등의 위조, 부정사용","chapter":"제2편 각칙 제21장 인장에 관한 죄","deleted":false,"text":"①행사할 목적으로 공무원 또는 공무소의 인장, 서명, 기명  또는 기호를 위조 또는 부정사용한 자는 5년 이하의 징역에 처한다.\n②위조 또는 부정사용한 공무원 또는 공무소의 인장, 서명, 기명 또는 기호를 행사한 자도 전항의 형과 같다.\n③전 2항의 경우에는 7년 이하의 자격정지를 병과할 수 있다.\n제238조(공인 등의 위조, 부정사용)","kind":"L"},{"id":"L:239","label":"법 제239조","title":"사인등의 위조, 부정사용","chapter":"제2편 각칙 제21장 인장에 관한 죄","deleted":false,"text":"①행사할 목적으로 타인의 인장, 서명, 기명 또는 기호를 위조 또는 부정사용한 자는 3년 이하의 징역에 처한다.\n②위조 또는 부정사용한 타인의 인장, 서명, 기명 또는 기호를 행사한 때에도 전항의 형과 같다.\n제239조(사인등의 위조, 부정사용)","kind":"L"},{"id":"L:240","label":"법 제240조","title":"미수범","chapter":"제2편 각칙 제21장 인장에 관한 죄","deleted":false,"text":"제240조(미수범) 본장의 미수범은 처벌한다.","kind":"L"},{"id":"L:241","label":"법 제241조","title":"","chapter":"제2편 각칙 제22장 성풍속에 관한 죄","deleted":true,"text":"제241조 삭제 <2016.1.6>","kind":"L"},{"id":"L:242","label":"법 제242조","title":"음행매개","chapter":"제2편 각칙 제22장 성풍속에 관한 죄","deleted":false,"text":"제242조(음행매개) 영리의 목적으로 사람을 매개하여 간음하게 한 자는 3년 이하의 징역 또는 1천500만원 이하의 벌금에 처한다. <개정 1995.12.29, 2012.12.18>","kind":"L"},{"id":"L:243","label":"법 제243조","title":"음화반포등","chapter":"제2편 각칙 제22장 성풍속에 관한 죄","deleted":false,"text":"제243조(음화반포등) 음란한 문서, 도화, 필름 기타 물건을 반포, 판매 또는 임대하거나 공연히 전시 또는 상영한 자는 1년 이하의 징역 또는 500만원 이하의 벌금에 처한다.","kind":"L"},{"id":"L:244","label":"법 제244조","title":"음화제조 등","chapter":"제2편 각칙 제22장 성풍속에 관한 죄","deleted":false,"text":"제244조(음화제조 등) 제243조의 행위에 공할 목적으로 음란한 물건을 제조, 소지, 수입 또는 수출한 자는 1년 이하의 징역 또는 500만원 이하의 벌금에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:245","label":"법 제245조","title":"공연음란","chapter":"제2편 각칙 제22장 성풍속에 관한 죄","deleted":false,"text":"제245조(공연음란) 공연히 음란한 행위를 한 자는 1년 이하의 징역, 500만원 이하의 벌금, 구류 또는 과료에 처한다. <개정 1995.12.29>","kind":"L"},{"id":"L:246","label":"법 제246조","title":"도박, 상습도박","chapter":"제2편 각칙 제23장 도박과 복표에 관한 죄","deleted":false,"text":"① 도박을 한 사람은 1천만원 이하의 벌금에 처한다. 다만, 일시오락 정도에 불과한 경우에는 예외로 한다.\n② 상습으로 제1항의 죄를 범한 사람은 3년 이하의 징역 또는 2천만원 이하의 벌금에 처한다.\n제246조(도박, 상습도박)","kind":"L"},{"id":"L:247","label":"법 제247조","title":"도박장소 등 개설","chapter":"제2편 각칙 제23장 도박과 복표에 관한 죄","deleted":false,"text":"제247조(도박장소 등 개설) 영리의 목적으로 도박을 하는 장소나 공간을 개설한 사람은 5년 이하의 징역 또는 3천만원 이하의 벌금에 처한다.","kind":"L"},{"id":"L:248","label":"법 제248조","title":"복표의 발매 등","chapter":"제2편 각칙 제23장 도박과 복표에 관한 죄","deleted":false,"text":"① 법령에 의하지 아니한 복표를 발매한 사람은 5년 이하의 징역 또는 3천만원 이하의 벌금에 처한다.\n② 제1항의 복표발매를 중개한 사람은 3년 이하의 징역 또는 2천만원 이하의 벌금에 처한다.\n③ 제1항의 복표를 취득한 사람은 1천만원 이하의 벌금에 처한다.\n제248조(복표의 발매 등)","kind":"L"},{"id":"L:249","label":"법 제249조","title":"벌금의 병과","chapter":"제2편 각칙 제23장 도박과 복표에 관한 죄","deleted":false,"text":"제249조(벌금의 병과) 제246조제2항, 제247조와 제248조제1항의 죄에 대하여는 1천만원 이하의 벌금을 병과할 수 있다.","kind":"L"},{"id":"L:250","label":"법 제250조","title":"살인, 존속살해","chapter":"제2편 각칙 제24장 살인의 죄","deleted":false,"text":"①사람을 살해한 자는 사형, 무기 또는 5년 이상의 징역에 처한다.\n②자기 또는 배우자의 직계존속을 살해한 자는 사형, 무기 또는 7년 이상의 징역에 처한다. <개정 1995.12.29>\n제250조(살인, 존속살해)","kind":"L"},{"id":"L:251","label":"법 제251조","title":"","chapter":"제2편 각칙 제24장 살인의 죄","deleted":true,"text":"제251조 삭제 <2023.8.8>","kind":"L"},{"id":"L:252","label":"법 제252조","title":"촉탁, 승낙에 의한 살인 등","chapter":"제2편 각칙 제24장 살인의 죄","deleted":false,"text":"① 사람의 촉탁이나 승낙을 받아 그를 살해한 자는 1년 이상 10년 이하의 징역에 처한다.\n② 사람을 교사하거나 방조하여 자살하게 한 자도 제1항의 형에 처한다.\n제252조(촉탁, 승낙에 의한 살인 등)","kind":"L"},{"id":"L:253","label":"법 제253조","title":"위계 등에 의한 촉탁살인 등","chapter":"제2편 각칙 제24장 살인의 죄","deleted":false,"text":"제253조(위계 등에 의한 촉탁살인 등) 전조의 경우에 위계 또는 위력으로써 촉탁 또는 승낙하게 하거나 자살을 결의하게 한 때에는 제250조의 예에 의한다.","kind":"L"},{"id":"L:254","label":"법 제254조","title":"미수범","chapter":"제2편 각칙 제24장 살인의 죄","deleted":false,"text":"제254조(미수범) 제250조, 제252조 및 제253조의 미수범은 처벌한다.","kind":"L"},{"id":"L:255","label":"법 제255조","title":"예비, 음모","chapter":"제2편 각칙 제24장
