do?precSeq=614589"},{"id":"P:612967","kind":"P","label":"2025고단1523","title":"상해·특수상해","court":"서울북부지방법원","date":"2025.10.29","caseType":"형사","basis":"참조조문","text":"피고인 甲은 01:40경 주유소 벽에 방뇨하여 주유소 직원인 피고인 乙로부터 ‘노상방뇨를 하지 말아라.’는 말을 듣게 되자 화가 나, 주유소 사무실에 앉아 있던 피고인 乙에게 다가가 왼쪽 손으로 피고인 乙의 목을 붙잡아 누르고, 계속하여 피고인 甲을 뒤쫓아 나온 피고인 乙을 손으로 밀쳐 바닥에 넘어뜨린 다음 주먹으로 피고인 乙의 얼굴을 수회 때리고 발로 몸을 수회 밟아 피고인 乙에게 약 20일간의 치료를 요하는 비골의 폐쇄성 골절의 상해를 가하였다는 내용으로, 피고인 乙은 사무실에서 피고인 甲으로부터 목이 눌리는 등 폭행당하자 책상 위에 놓여있던 위험한 물건인 30cm 길이의 고무망치를 오른쪽 손에 쥐고 피고인 甲의 머리 부분을 향해 강하게 1회 내리쳐 약 2주간의 치료를 요하는 두피의 열린 상처의 상해를 가하였다는 내용으로 기소된 사안에서, 피고인 甲에게 유죄를, 피고인 乙에게는 무죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=612967"},{"id":"P:617185","kind":"P","label":"2024노3921","title":"모해위증(인정된죄명:위증)","court":"대구지방법원","date":"2025.10.17","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=617185"},{"id":"P:613013","kind":"P","label":"2025도1549","title":"성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영물소지등)","court":"대법원","date":"2025.10.16","caseType":"형사","basis":"판례내용","text":"전자정보가 제3자 소유·관리의 정보저장매체에 그 내용이 동일하게 복제되어 임의제출되는 경우, 복제 전자정보 임의제출자 외에 원본 전자정보 관리처분권자를 실질적 피압수자로 평가하여 그에게 참여권을 인정하여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=613013"},{"id":"P:618201","kind":"P","label":"2025다212302","title":"선박등인도·부당이득금","court":"대법원","date":"2025.09.25","caseType":"민사","basis":"참조조문","text":"영해 및 접속수역법 제8조 제1항의 몰수 규정이 형법 총칙상 몰수에 대한 특별규정인지 여부 및 외국선박의 승무원이나 그 밖의 승선자가 어로 행위로 인한 영해 및 접속수역법 위반에 제공한 선박 등에 대하여는 소유자나 공범 여부 등과 관계없이 이를 몰수할 수 있는지 여부 / 피고인 이외의 제3자의 소유에 속하는 물건의 경우, 몰수를 선고한 판결의 효력이 재판을 받지 아니한 제3자의 소유권에 미치는지 여부 / 영해 및 접속수역법 위반으로 몰수가 선고된 외국선박 등에 대하여 소유권에 기초하여 이를 압수하고 있는 대한민국을 상대로 인도를 청구하는 경우, 소유자 아닌 승무원이나 승선자에 대한 몰수판결을 들어 외국선박 소유자의 인도청구를 배척할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=618201"},{"id":"P:612997","kind":"P","label":"2025도6070","title":"개인정보보호법위반","court":"대법원","date":"2025.09.25","caseType":"형사","basis":"참조조문","text":"구 개인정보 보호법상 허용된 권한 초과 개인정보 유출 금지에도 불구하고 재판 과정에서 소송상 필요한 주장의 증명이나 범죄혐의에 대한 방어권 행사를 위하여 개인정보가 포함된 소송서류나 증거를 법원에 제출하는 경우 및 고소·고발 또는 수사절차에서 범죄혐의 소명이나 방어권 행사를 위하여 개인정보가 포함된 증거자료를 수사기관에 제출하는 경우가 사회상규에 위배되지 않는 행위에 해당하여 형법 제20조에 따라 위법성이 조각될 수 있는지 여부 및 이러한 정당행위에 해당하는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=612997"},{"id":"P:609585","kind":"P","label":"2024도18174","title":"사기·업무방해","court":"대법원","date":"2025.09.25","caseType":"형사","basis":"참조조문","text":"사기죄의 성립에 일반적ㆍ전형적으로 위계에 의한 업무방해행위가 수반되는지 여부 / 행위자가 대출금 교부를 전후하여 이루어진 일련의 위계행위를 통해 은행의 대출 심사 및 대출금 환수 여부 심사 등에 관한 전반적인 업무를 방해한 경우, 은행의 대출 담당 직원을 기망하여 대출금을 교부받은 사기죄와 별개로 위계에 의한 업무방해죄가 성립하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=609585"},{"id":"P:623935","kind":"P","label":"2023노7985","title":"공무상비밀누설","court":"수원지방법원","date":"2025.09.25","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=623935"},{"id":"P:616621","kind":"P","label":"2024노507","title":"사기·국민기초생활보장법위반","court":"전주지방법원","date":"2025.09.23","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=616621"},{"id":"P:616547","kind":"P","label":"2025노163","title":"공직선거법위반","court":"부산고등법원","date":"2025.09.17","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=616547"},{"id":"P:619487","kind":"P","label":"2024고단353","title":"가. 스토킹범죄의처벌등에관한법률위반 나. 스토킹방지및피해자보호등에관한법률위반방조 다. 모욕 라. 폭력행위등처벌에관한법률위반(공동상해)","court":"창원지방법원밀양지원","date":"2025.09.16","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619487"},{"id":"P:609475","kind":"P","label":"2025도11062","title":"마약류관리에관한법률위반(향정)[합성대마 사용의 불능미수죄가 성립하는지 문제된 사건]","court":"대법원","date":"2025.09.11","caseType":"형사","basis":"참조조문","text":"‘불능미수’의 의미 및 불능미수의 요건 중 ‘결과의 발생이 불가능’하다는 것의 의미 / 구 마약류 관리에 관한 법률 제59조 제1항 제5호에서 금지하는 행위가 미수에 그친 경우, 같은 법 제59조 제3항을 적용하여 미수범으로 처벌할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=609475"},{"id":"P:609467","kind":"P","label":"2022도493","title":"공익사업을위한토지등의취득및보상에관한법률위반[수용되는 토지에 있는 지장물을 소유한 자가 이주대책의 미수립·실시를 이유로 지장물을 인도·이전하지 않은 사건]","court":"대법원","date":"2025.09.11","caseType":"형사","basis":"참조조문","text":"공익사업을 위한 토지 등의 취득 및 보상에 관한 법률 제95조의2 제2호, 제43조를 위반하여 토지소유자 등이 수용 개시일 이후 토지 또는 물건을 인도·이전하지 않더라도 토지소유자 등의 인도·이전거절행위가 형법 제20조의 정당행위에 해당하여 위법성이 조각될 수 있는 경우 및 그 판단 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=609467"},{"id":"P:613023","kind":"P","label":"2025도6356","title":"특정범죄가중처벌등에관한법률위반(뇌물)·특정경제범죄가중처벌등에관한법률위반(배임)·직권남용권리행사방해","court":"대법원","date":"2025.09.11","caseType":"형사","basis":"참조조문","text":"[1] 재산상 이익의 가액을 기준으로 가중 처벌하는 특정경제범죄 가중처벌 등에 관한 법률 제3조의 적용을 전제로 이득액을 산정할 때 유의하여야 할 사항 / 업무상배임으로 취득한 재산상 이익이 있더라도 이득액을 구체적으로 산정할 수 없는 경우, 같은 법 제3조를 적용할 수 있는지 여부 [2] 업무상배임죄에서 ‘본인에게 재산상 손해를 가한다.’는 것의 의미 및 이는 ‘행위자나 제3자가 취득하는 재산상 이익’에 대하여도 동일하게 적용되는지 여부 [3] 지방자치단체를 당사자로 하는 계약에 관한 법률에 따른 물품의 제조·구매계약에서 지방자치단체를 위하여 계약을 체결할 임무가 있는 공무원이 업무상의 임무에 위배하여 물품의 규격 또는 사양을 당초 계획과 달리 부당하게 변경함으로써 예정보다 증가된 가격으로 제3자와 계약을 체결한 경우, 제3자가 취득한 이득액","url":"https://www.law.go.kr/precInfoP.do?precSeq=613023"},{"id":"P:616721","kind":"P","label":"2025노672","title":"사기·도로교통법위반(음주운전)·도로교통법위반(무면허운전)","court":"서울중앙지방법원","date":"2025.09.11","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=616721"},{"id":"P:609527","kind":"P","label":"2024도12420","title":"특정금융거래정보의보고및이용등에관한법률위반·업무방해·외국환거래법위반[가상자산 재정거래를 위하여 모은 자금을 외국환은행을 통하여 외국으로 송금한 사건]","court":"대법원","date":"2025.09.11","caseType":"형사","basis":"판례내용","text":"[1] 외국환거래법령에서 무등록 외국환업무를 업으로 한 사람을 처벌하는 취지 / 외국환거래법 제8조 제1항, 제3항을 위반하여 기획재정부장관에게 등록하지 않고 같은 법 제3조 제1항 제16호 목의 외국환업무인 ‘대한민국과 외국 간의 지급·추심 및 수령’을 업으로 하였는지 판단하는 기준 [2] 구 특정 금융거래정보의 보고 및 이용 등에 관한 법률 제17조 제1항, 제7조 제1항에서 정한 ‘가상자산거래를 영업으로 한 가상자산사업자’에 해당하는지 판단하는 기준 / 불특정 다수인 고객이나 이용자의 편익을 위하여 가상자산거래를 하고 그 대가를 받는 행위를 계속·반복하는 자를 가상자산사업자로 볼 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=609527"},{"id":"P:609497","kind":"P","label":"2022도10256","title":"업무방해·주택법위반·주민등록법위반·공인중개사법위반[검사의 수사개시 가능 범위가 문제된 사건]","court":"대법원","date":"2025.09.11","caseType":"형사","basis":"참조조문","text":"구 검사의 수사개시 범죄 범위에 관한 규정 제3조에서 정한 범죄가 모법인 구 검찰청법 제4조 제1항 제1호 단서 목에서 정하는 범죄의 해석상 가능한 범위를 넘어선 것으로서 무효인지 여부 / 구 검찰청법 제4조 제1항 제1호 단서에서 검사가 수사를 개시하여 1차적 수사를 직접 담당할 수 있는 범죄를 제한한 취지 / 검사가 구 검찰청법 제4조 제1항 제1호 단서에 따라 수사권 행사가 불가능한 범죄에 관하여 수사를 개시한 후 1차적 수사를 하는 것은 수사절차에 위법이 있는 경우인지 여부 / 구 검찰청법 제4조 제1항 제1호 단서를 위반하여 개시된 수사절차에 이어진 공소제기는 ‘그 절차가 법률의 규정을 위반하여 무효’인 경우에 해당하여 공소기각 판결의 대상이 되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=609497"},{"id":"P:609495","kind":"P","label":"2022도1665","title":"업무방해·재물손괴[업무방해죄의 보호대상이 되는 ‘업무’의 의미와 범위가 문제된 사건]","court":"대법원","date":"2025.09.11","caseType":"형사","basis":"참조조문","text":"형법상 업무방해죄의 보호대상이 되는 ‘업무’의 의미 / 현수막 등을 설치하여 어떠한 사실이나 의견 등을 알리는 것이 업무방해죄에 의하여 보호되는 ‘업무’에 해당할 수 있는 경우 및 이에 해당하는지 판단하는 기준 / 서로 대립하는 관계에서 단순히 자신의 의견을 개진하거나 상대방에 대한 반대 입장을 표시하는 것을 방해하는 행위를 형법상 업무방해죄로 처벌하는 것은 신중하게 이루어져야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=609495"},{"id":"P:609561","kind":"P","label":"2025고단1110","title":"여객자동차운수사업법위반","court":"인천지방법원","date":"2025.09.10","caseType":"형사","basis":"참조조문","text":"자동차대여사업자 등인 피고인들이 상호 업무제휴계약을 맺고 공모하여, 외국항공사인 甲 항공과 체결한 ‘甲 항공 일등석 및 비즈니스석 승객 대상 서울지역 운송서비스 계약’에 따라 甲 항공으로부터 VIP 고객의 이름, 입출국 시간, 승하차 장소, 연락처 등 정보를 제공받은 다음 사업용자동차인 소위 ‘렌터카’와 운전기사를 제공하여 불특정 다수의 고객들을 상대로 공항에서 서울, 경기 일원의 호텔 또는 주거지 등을 오가며 여객운송을 하고 운송료를 지급받는 방법으로 관할 관청의 면허를 받지 않고 사업용자동차를 사용하여 유상으로 여객을 운송하는 등 여객자동차운송사업을 경영함으로써 여객자동차 운수사업법을 위반하였다는 내용으로 기소된 사안에서, 피고인들에게 유죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=609561"},{"id":"P:614633","kind":"P","label":"2025고단1110","title":"여객자동차운수사업법위반","court":"인천지방법원","date":"2025.09.10","caseType":"형사","basis":"참조조문","text":"자동차대여사업자 등인 피고인들이 상호 업무제휴계약을 맺고 공모하여, 외국항공사인 甲 항공과 체결한 ‘甲 항공 일등석 및 비즈니스석 승객 대상 서울지역 운송서비스 계약’에 따라 甲 항공으로부터 VIP 고객의 이름, 입출국 시간, 승하차 장소, 연락처 등 정보를 제공받은 다음 사업용자동차인 소위 ‘렌터카’와 운전기사를 제공하여 불특정 다수의 고객들을 상대로 공항에서 서울, 경기 일원의 호텔 또는 주거지 등을 오가며 여객운송을 하고 운송료를 지급받는 방법으로 관할 관청의 면허를 받지 않고 사업용자동차를 사용하여 유상으로 여객을 운송하는 등 여객자동차운송사업을 경영함으로써 여객자동차 운수사업법을 위반하였다는 내용으로 기소된 사안에서, 피고인들에게 유죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=614633"},{"id":"P:616559","kind":"P","label":"2025노774","title":"범죄수익은닉의규제및처벌등에관한법률위반","court":"서울남부지방법원","date":"2025.09.04","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=616559"},{"id":"P:612955","kind":"P","label":"2025도7814","title":"범죄단체가입·범죄단체활동·특정경제범죄가중처벌등에관한법률위반(사기)·전기통신금융사기피해금환급에관한특별법위반·사기·범죄수익은닉의규제및처벌등에관한법률위반","court":"대법원","date":"2025.09.04","caseType":"형사","basis":"참조조문","text":"전기통신금융사기 피해 방지 및 피해금 환급에 관한 특별법상 전기통신금융사기죄의 규정이 형법상 사기죄 규정에 대하여 특별법 관계에 있는지 여부 및 1개의 행위가 전기통신금융사기죄와 사기죄의 각 구성요건을 충족하는 경우의 죄수관계","url":"https://www.law.go.kr/precInfoP.do?precSeq=612955"},{"id":"P:612949","kind":"P","label":"2023도10410","title":"군인등강제추행·상관모욕","court":"대법원","date":"2025.09.04","caseType":"형사","basis":"판례내용","text":"[1] ‘추행’의 의미 및 어떤 행위가 추행에 해당하는지 판단하는 기준 [2] 직장 등 공동체 내에서 구성원 사이에 발생한 신체접촉 행위가 의례적·사회적으로 상당한 범주를 다소 벗어나 부적절한 성적 언동으로 받아들여질 여지가 있으나 상대방의 의사에 반하는 유형력 행사로서 성적 자유를 침해하는 정도에까지 이르지 않는 경우, 강제추행죄에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=612949"},{"id":"P:614709","kind":"P","label":"2024재고합2","title":"포고령위반","court":"창원지방법원마산지원","date":"2025.09.03","caseType":"형사","basis":"참조조문","text":"망 피고인에 대하여 ‘피고인 등이 1947. 8.경 이른바 하곡수집에 반대하여, 하곡수집 업무에 불응한 면장 등을 체포·호송하던 경찰관들을 습격하고, 그에 이어 지서로 복귀한 경찰관들을 습격하여 소요를 야기하는 한편 공무집행을 방해하였다.’는 공소사실을 유죄로 인정하여 1948. 2. 27. 공무집행방해 및 경상남도공고 제12호 위반죄 등으로 징역 1년을 선고한 판결이 확정되었는데, 그 후 피고인의 자가 재심대상판결에 적용된 태평양미국육군총사령부 1945. 9. 7. 포고 제2호는 죄형법정주의에 반하여 위헌·무효로서 재심사유가 있다고 주장하며 재심을 청구한 사안에서, 위 포고 제2호는 재심대상판결에 직접 적용되거나 경상남도공고 제12호의 상위 법령으로서 재심대상판결에 적용되어 피고인의 형벌에 관한 법령에 포함되고, 나아가 죄형법정주의에 위배되어 위헌·무효이며, 경상남도공고 제12호의 경우 권한 있는 입법기관에 의하여 유효하게 제정·공포되었다고 보기 어려워 그 자체로 위헌·무효이므로, 재심대상판결에는 형사소송법 제420조 제5호에서 정한 재심사유가 인정된다는 등의 이유로, 재심대상판결 전부에 대해 재심개시결정을 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=614709"},{"id":"P:612975","kind":"P","label":"2024재고합2","title":"포고령위반","court":"창원지방법원마산지원","date":"2025.09.03","caseType":"형사","basis":"참조조문","text":"망 피고인에 대하여 ‘피고인 등이 1947. 8.경 이른바 하곡수집에 반대하여, 하곡수집 업무에 불응한 면장 등을 체포·호송하던 경찰관들을 습격하고, 그에 이어 지서로 복귀한 경찰관들을 습격하여 소요를 야기하는 한편 공무집행을 방해하였다.’는 공소사실을 유죄로 인정하여 1948. 2. 27. 공무집행방해 및 경상남도공고 제12호 위반죄 등으로 징역 1년을 선고한 판결이 확정되었는데, 그 후 피고인의 자가 재심대상판결에 적용된 태평양미국육군총사령부 1945. 9. 7. 포고 제2호는 죄형법정주의에 반하여 위헌·무효로서 재심사유가 있다고 주장하며 재심을 청구한 사안에서, 위 포고 제2호는 재심대상판결에 직접 적용되거나 경상남도공고 제12호의 상위 법령으로서 재심대상판결에 적용되어 피고인의 형벌에 관한 법령에 포함되고, 나아가 죄형법정주의에 위배되어 위헌·무효이며, 경상남도공고 제12호의 경우 권한 있는 입법기관에 의하여 유효하게 제정·공포되었다고 보기 어려워 그 자체로 위헌·무효이므로, 재심대상판결에는 형사소송법 제420조 제5호에서 정한 재심사유가 인정된다는 등의 이유로, 재심대상판결 전부에 대해 재심개시결정을 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=612975"},{"id":"P:619545","kind":"P","label":"2025고단1185","title":"도박공간개설, 개인정보보호법위반","court":"의정부지방법원남양주지원","date":"2025.08.27","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619545"},{"id":"P:617207","kind":"P","label":"2025노860","title":"업무상과실치사·산업안전보건법위반·중대재해처벌등에관한법률위반(산업재해치사)","court":"대전지방법원","date":"2025.08.27","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=617207"},{"id":"P:614645","kind":"P","label":"2025고단949","title":"정보통신망이용촉진및정보보호등에관한법률위반(명예훼손)·전기통신기본법위반","court":"부산지방법원","date":"2025.08.20","caseType":"형사","basis":"참조조문","text":"피고인 甲과 피고인 乙은 자신들이 운영하는 후원계좌가 표기된 채널 등 여러 동영상 플랫폼 채널에 공항으로 착륙 도중 발생한 여객기 사고와 관련하여 실제 발생한 사고임에도 위 사고가 실제로 발생하지 않았고 언론보도 내용과 영상이 조작된 것이어서 유가족이 실제 희생자의 가족이 아니라는 취지의 동영상을 여러 번에 걸쳐 게시하여 정보통신망 이용촉진 및 정보보호 등에 관한 법률 위반 및 전기통신기본법 위반으로 기소된 사안에서, 피고인들에게 유죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=614645"},{"id":"P:609563","kind":"P","label":"2025고단949","title":"정보통신망이용촉진및정보보호등에관한법률위반(명예훼손)·전기통신기본법위반","court":"부산지방법원","date":"2025.08.20","caseType":"형사","basis":"참조조문","text":"피고인 甲과 피고인 乙은 자신들이 운영하는 후원계좌가 표기된 채널 등 여러 동영상 플랫폼 채널에 공항으로 착륙 도중 발생한 여객기 사고와 관련하여 실제 발생한 사고임에도 위 사고가 실제로 발생하지 않았고 언론보도 내용과 영상이 조작된 것이어서 유가족이 실제 희생자의 가족이 아니라는 취지의 동영상을 여러 번에 걸쳐 게시하여 정보통신망 이용촉진 및 정보보호 등에 관한 법률 위반 및 전기통신기본법 위반으로 기소된 사안에서, 피고인들에게 유죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=609563"},{"id":"P:616713","kind":"P","label":"2025노276","title":"마약류관리에관한법률위반(향정)","court":"제주지방법원","date":"2025.08.19","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=616713"},{"id":"P:616697","kind":"P","label":"2025노42-1","title":"폭력행위등처벌에관한법률위반(단체등의구성·활동)·공갈미수·전기통신금융사기피해방지및피해금환급에관한특별법위반방조","court":"광주고등법원전주재판부","date":"2025.08.18","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=616697"},{"id":"P:608471","kind":"P","label":"2022도8664","title":"산업기술의유출방지및보호에관한법률위반·부정경쟁방지및영업비밀보호에관한법률위반[외국법인이 양벌규정에 따라 기소된 사건]","court":"대법원","date":"2025.08.14","caseType":"형사","basis":"참조조문","text":"[1] 양벌규정에 따라 처벌되는 행위자와 행위자 아닌 법인 또는 개인 간의 관계 / 양벌규정에 따라 처벌받는 법인에 대하여 대한민국 형벌규정이 적용되어 대한민국 법원에 재판권이 있는지를 판단할 때 고려하여야 할 사항 [2] 피해회사는 대한민국 법인이고, 피고인 회사는 외국법인으로 서로 경쟁업체인데, 피해회사에서 근무하다가 피고인 회사에 입사한 종업원들이 피고인 회사의 업무에 관하여 피해회사의 영업비밀을 누설·취득하거나 산업기술을 유출·공개·외국사용하였다는 구 부정경쟁방지 및 영업비밀보호에 관한 법률 및 구 산업기술의 유출방지 및 보호에 관한 법률 위반행위와 관련하여 피고인 회사가 양벌규정에 따라 기소되어 그 재판권이 문제 된 사안에서, 피고인 회사에 대하여 대한민국의 재판권이 있다고 판단한 원심의 결론이 정당하다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=608471"},{"id":"P:612961","kind":"P","label":"2025도6266","title":"특정범죄가중처벌등에관한법률위반(뇌물)(인정된죄명:배임수재)·뇌물수수(인정된죄명:배임수재)","court":"대법원","date":"2025.08.14","caseType":"형사","basis":"참조조문","text":"[1] 특정범죄 가중처벌 등에 관한 법률 제3조의 ‘공무원의 직무에 속한 사항’의 의미 및 구체적인 행위가 공무원의 직무에 속하는지 결정할 때 고려할 사항 [2] 법률의 시행령이 형사처벌에 관한 사항을 규정하면서 법률의 명시적인 위임 범위를 벗어나 처벌 대상을 확장하는 경우, 위임입법의 한계를 벗어나 무효인지 여부 [3] 형법 제129조에서 정한 ‘공무원’의 의미 [4] 국립대학교 교수인 피고인이 한국토지주택공사의 기술심사평가위원으로 위촉 후 위 공사의 입찰에 참여한 업체로부터 금품을 수수하여 기소된 사안에서, 피고인이 입찰에 참여한 업체로부터 금품을 수수하였더라도 이는 피고인의 교육공무원 지위와는 직무관련성이 인정되지 않고, 피고인에게 국가를 당사자로 하는 계약에 관한 법령상 공무원 의제규정이 적용되지 않으며, 내부 사무처리 기준 등에 직무상 근거를 둔 한국토지주택공사의 기술심사평가위원은 형법 제129조의 공무원에 해당할 수 없다고 본 원심판단을 수긍한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=612961"},{"id":"P:612957","kind":"P","label":"2025도7142","title":"성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영물반포등)·공갈·무고교사·정보통신망이용촉진및정보보호등에관한법률위반·절도","court":"대법원","date":"2025.08.14","caseType":"형사","basis":"판례내용","text":"[1] 법원이 적법하게 공판의 심리를 종결한 뒤 검사가 공소장변경허가신청을 한 경우, 반드시 공판의 심리를 재개하여 공소장변경을 허가하여야 하는지 여부 및 이는 변론재개신청과 함께 된 것이라도 마찬가지인지 여부 [2] 휴대전화 영상통화기능을 이용하여 통화하는 일방 당사자가 자신의 신체를 직접 휴대전화 카메라에 비춰 생성한 영상정보를 상대방에게 전송한 경우, 성폭력범죄의 처벌 등에 관한 특례법 제14조 제2항 후단에서 정한 ‘촬영대상자의 의사에 반하지 아니한 경우의 촬영물’에 해당하는지 여부 / 영상통화 상대방이 이와 같이 전송된 영상정보를 휴대전화 녹화기능을 이용하여 녹화·저장한 동영상이 위 조항 후단에서 정한 촬영물의 ‘복제물’에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=612957"},{"id":"P:612959","kind":"P","label":"2025도6811","title":"전기통신금융사기피해방지및피해금환급에관한특별법위반·사기","court":"대법원","date":"2025.08.14","caseType":"형사","basis":"참조조문","text":"[1] 전기통신금융사기 피해 방지 및 피해금 환급에 관한 특별법상 전기통신금융사기죄의 규정이 형법상 사기죄의 규정에 대하여 특별법의 관계에 있는지 여부 / 1개의 행위가 전기통신금융사기죄와 사기죄의 각 구성요건을 충족하는 경우의 죄수관계","url":"https://www.law.go.kr/precInfoP.do?precSeq=612959"},{"id":"P:608551","kind":"P","label":"2022도15547","title":"특정범죄가중처벌등에관한법률위반(국고등손실)방조·특정범죄가중처벌등에관한법률위반(국고등손실)[특정범죄가중처벌등에관한법률위반(국고등손실)죄 및 그 방조죄의 성립 여부가 문제된 사건]","court":"대법원","date":"2025.08.14","caseType":"형사","basis":"참조조문","text":"[1] 특정범죄 가중처벌 등에 관한 법률 제5조에 규정된 국고등손실죄의 성립 요건 및 범의의 내용 / 국고등손실죄의 범의를 인정하기 위한 요건 [2] 방조범 성립의 전제요건으로 먼저 정범의 범죄행위가 인정되어야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=608551"},{"id":"P:622301","kind":"P","label":"2025고단1612","title":"범죄단체가입, 범죄단체활동, 사기, 자본시장과금융투자업에관한법률위반","court":"서울남부지방법원","date":"2025.08.13","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=622301"},{"id":"P:624001","kind":"P","label":"2024노1881","title":"횡령","court":"광주지방법원","date":"2025.08.13","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=624001"},{"id":"P:624107","kind":"P","label":"2024고합511","title":"특정범죄가중처벌등에관한법률위반(뇌물)·범죄수익은닉의규제및처벌등에관한법률위반·뇌물공여·범죄수익은닉의규제및처벌등에관한법률위반방조·산림기술진흥및관리에관한법률위반·특정경제범죄가중처벌등에관한법률위반(횡령)·업무상횡령·특정범죄가중처벌등에관한법률위반(알선수재)·업무상횡령방조","court":"대구지방법원","date":"2025.07.25","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=624107"},{"id":"P:616695","kind":"P","label":"2019노96","title":"특정범죄가중처벌등에관한법률위반(조세)(피고인2·피고인3·피고인4에대하여일부인정된죄명조세범처벌법위반방조)·특정범죄가중처벌등에관한법률위반(허위세금계산서교부등)·특정경제범죄가중처벌등에관한법률위반(횡령)·업무상횡령·업무상배임·조세범처벌법위반","court":"대전고등법원","date":"2025.07.23","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=616695"},{"id":"P:612065","kind":"P","label":"2023도17590","title":"개인정보보호법위반","court":"대법원","date":"2025.07.18","caseType":"형사","basis":"참조조문","text":"[1] 재판과정에서 소송상 필요한 주장의 증명이나 범죄혐의에 대한 방어권 행사를 위하여 개인정보가 포함된 소송서류나 증거를 법원에 제출하는 경우, 고소ㆍ고발 또는 수사절차에서 범죄혐의의 소명이나 방어권의 행사를 위하여 개인정보가 포함된 증거자료를 수사기관에 제출하는 경우가 사회상규에 위배되지 않는 행위에 해당하여 형법 제20조에 따라 위법성이 조각될 수 있는지 여부 및 이에 해당하는지 판단하는 기준 [2] 피고인이 퇴사한 조합의 조합장을 고발하며 수사기관에 CCTV 영상자료 등 개인정보가 담긴 자료들을 고발장에 첨부하여 함께 제출함으로써 개인정보를 처리하거나 처리하였던 자로서 업무상 알게 된 개인정보를 누설하였다는 내용으로 기소된 사안에서, 피고인의 위 행위가 정당행위에 해당하지 않는다고 본 원심판단에 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=612065"},{"id":"P:607821","kind":"P","label":"2023도3673","title":"개인정보보호법위반[가처분 사건의 채무자가 법원에 입주민들의 개인정보가 기재된 입주자카드를 제출한 사건]","court":"대법원","date":"2025.07.18","caseType":"형사","basis":"참조조문","text":"구 개인정보 보호법상 개인정보 누설, 제공 금지 규정에도 불구하고 재판과정에서 소송상 필요한 주장의 증명이나 범죄혐의에 대한 방어권 행사를 위하여 개인정보가 포함된 소송서류나 증거를 법원에 제출하는 경우, 고소·고발 또는 수사절차에서 범죄혐의의 소명이나 방어권의 행사를 위하여 개인정보가 포함된 증거자료를 수사기관에 제출하는 경우가 사회상규에 위배되지 않는 행위에 해당하여 형법 제20조에 따라 위법성이 조각될 수 있는지 여부 및 이에 해당하는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=607821"},{"id":"P:607815","kind":"P","label":"2024노1932","title":"마약류관리에관한법률위반(향정)·재물손괴·특수재물손괴·특수재물손괴미수·사기","court":"서울남부지방법원","date":"2025.07.17","caseType":"형사","basis":"판례내용","text":"발달장애 및 정신질환이 있는 피고인이 향정신성의약품인 메트암페타민 일정량을 은박지 또는 유리에 올려놓고 라이터로 가열하여 발생한 연기를 코로 흡입하거나 일회용 주사기에 넣고 생수로 희석한 다음 팔에 주사하는 방법으로 4회에 걸쳐 필로폰을 투약하였다는 마약류 관리에 관한 법률 위반의 공소사실로 기소된 후 제1심에서 유죄를 선고받고 범행을 전부 부인하며 항소하였는데, 당시 수사기관이 피고인으로부터 임의제출 형식으로 제출받아 압수한 소변·모발·유리조각 등 관련 증거들의 증거능력 유무가 다투어진 사안에서, 소변·모발·유리조각 제출의 임의성이 증명되었다고 볼 수 없으므로 이들 증거는 수사기관이 위법하게 취득한 증거로서 증거능력이 없고, 위법하게 압수된 소변·모발·유리조각에 기초하여 수집한 2차 증거들 역시 모두 증거능력이 없다는 등의 이유로, 공소사실을 무죄로 판단한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=607815"},{"id":"P:614521","kind":"P","label":"2024노1932","title":"마약류관리에관한법률위반(향정)·재물손괴·특수재물손괴·특수재물손괴미수·사기","court":"서울남부지방법원","date":"2025.07.17","caseType":"형사","basis":"판례내용","text":"발달장애 및 정신질환이 있는 피고인이 향정신성의약품인 메트암페타민 일정량을 은박지 또는 유리에 올려놓고 라이터로 가열하여 발생한 연기를 코로 흡입하거나 일회용 주사기에 넣고 생수로 희석한 다음 팔에 주사하는 방법으로 4회에 걸쳐 필로폰을 투약하였다는 마약류 관리에 관한 법률 위반의 공소사실로 기소된 후 제1심에서 유죄를 선고받고 범행을 전부 부인하며 항소하였는데, 당시 수사기관이 피고인으로부터 임의제출 형식으로 제출받아 압수한 소변·모발·유리조각 등 관련 증거들의 증거능력 유무가 다투어진 사안에서, 소변·모발·유리조각 제출의 임의성이 증명되었다고 볼 수 없으므로 이들 증거는 수사기관이 위법하게 취득한 증거로서 증거능력이 없고, 위법하게 압수된 소변·모발·유리조각에 기초하여 수집한 2차 증거들 역시 모두 증거능력이 없다는 등의 이유로, 공소사실을 무죄로 판단한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=614521"},{"id":"P:607845","kind":"P","label":"2025도978","title":"절도(인정된죄명:재물손괴·횡령)[권원없이 식재한 수목의 과실을 수취한 행위가 재물손괴죄 또는 횡령죄에 해당하는지 문제 된 사건]","court":"대법원","date":"2025.07.17","caseType":"형사","basis":"참조조문","text":"[1] 재물손괴죄의 성립요건 및 영득죄와의 구별 / 다른 사람의 소유물을 본래의 용법에 따라 무단으로 사용·수익하는 행위가 재물손괴죄에 해당하는지 여부 [2] 횡령죄의 구성요건 중 ‘보관’의 의미 / 횡령죄의 성립에 필요한 법률상 또는 사실상의 위탁신임관계는 횡령죄로 보호할 만한 가치 있는 신임에 의한 것으로 한정되는지 여부 및 이러한 위탁관계가 있는지 판단하는 기준 [3] 피고인이 피해자 甲이 다른 사람과 공동소유하는 토지에 권원 없이 사과나무 등 과수를 식재하고 2021. 10.경 및 2022. 10.경 두 차례에 걸쳐 사과를 수취하여 사과나무를 손괴하거나 사과를 횡령하였다는 내용으로 기소된 사안에서, 사과나무의 천연과실인 사과를 수취하는 것은 원물인 사과나무를 본래의 용법에 따라 사용하는 것이므로 사과나무의 효용 자체를 침해한다고 볼 수 없고, 사과나무를 점유하는 피고인과 甲 사이에 횡령죄로 보호할 만한 가치 있는 위탁신임관계가 형성되어 피고인에게 사과나무의 과실인 사과를 甲을 위하여 그대로 보관·유지해야 할 의무가 있다고 보기 어렵다는 등의 이유로, 사과나무에 대한 재물손괴죄와 사과에 대한 횡령죄가 모두 성립하지 않는다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=607845"},{"id":"P:612133","kind":"P","label":"2025도5236","title":"횡령·사전자기록등위작교사·위작사전자기록등행사교사·사전자기록등위작·위작사전자기록등행사","court":"대법원","date":"2025.07.17","caseType":"형사","basis":"참조조문","text":"[1] 횡령죄에서 재물의 보관은 위탁관계에 기인할 것을 요하는지 여부 및 위탁관계의 발생 원인 / 횡령죄에서 타인을 위하여 재물을 보관하게 된 원인은 반드시 소유자의 위탁행위로 인한 것임을 요하는지 여부 [2] 항소심이 경합범으로 공소제기된 수 개의 범죄사실 중 일부에 대하여 유죄, 일부에 대하여 무죄를 선고하고 무죄 부분에 대하여는 검사가 상고하였으나 유죄 부분에 대하여는 피고인과 검사 모두 상고하지 아니한 경우, 상고심에서 이를 파기할 때의 파기 범위","url":"https://www.law.go.kr/precInfoP.do?precSeq=612133"},{"id":"P:612089","kind":"P","label":"2023도5553","title":"부동산강제집행효용침해","court":"대법원","date":"2025.07.16","caseType":"형사","basis":"참조조문","text":"[1] 부동산강제집행효용침해죄의 구성요건 중 ‘기타 방법’ 및 ‘강제집행의 효용을 해하는 것’의 의미 [2] 부동산 인도청구 집행의 상대방 및 목적물을 제3자가 점유하고 있는 경우 민사집행법 제258조에 의한 인도 집행을 할 수 있는지 여부 / 법원의 강제집행의 효력 및 위법한 인도명령의 집행으로 점유를 취득한 경우에도 그 점유는 보호되어야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=612089"},{"id":"P:612095","kind":"P","label":"2025도4876","title":"사문서위조·위조사문서행사·전기통신사업법위반","court":"대법원","date":"2025.07.16","caseType":"형사","basis":"참조조문","text":"[1] 형법 제48조에서 몰수의 대상으로 규정한 ‘물건’의 의미 / 범죄행위로 인하여 생겼거나 취득한 물건이 특정되지 않는 경우, 이를 몰수하거나 그 가액을 추징할 수 있는지 여부 [2] 피고인들이 공모하여 외국인 개인정보 유통 브로커로부터 매입한 외국인등록증 이미지 파일로 ‘선불 이동전화 가입신청서’를 위조·행사하여 선불 이동전화를 개통하고, 개통한 회선 명의자의 정보를 이용하여 개설한 인터넷 사이트 계정을 판매하며, 휴대전화 개통수수료 및 인터넷 계정 판매수익을 은행 계좌로 송금·이체 받은 사안에서, 위 수익금은 형법 제48조 제1항의 ‘물건’이라고 보기 어려워 형법상 추징 대상에 해당하지 않는다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=612095"},{"id":"P:619533","kind":"P","label":"2024노2093","title":"결혼중개업의관리에관한법률위반","court":"의정부지방법원","date":"2025.07.10","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619533"},{"id":"P:616623","kind":"P","label":"2024노3151","title":"산업기술의유출방지및보호에관한법률위반·부정경쟁방지및영업비밀보호에관한법률위반(영업비밀국외누설등)·업무상배임","court":"서울고등법원","date":"2025.07.03","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=616623"},{"id":"P:612927","kind":"P","label":"2025로52","title":"재판의집행에관한이의기각결정에대한즉시항고","court":"부산지방법원","date":"2025.07.02","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=612927"},{"id":"P:612111","kind":"P","label":"2025도4689","title":"전자금융거래법위반·전기통신사업법위반·공전자기록등불실기재·불실기재공전자기록등행사·상법위반","court":"대법원","date":"2025.06.26","caseType":"형사","basis":"참조조문","text":"2022. 1. 4. 개정·시행된 범죄수익은닉의 규제 및 처벌 등에 관한 법률이 구 범죄수익은닉의 규제 및 처벌 등에 관한 법률과 달리 일정한 법정형 이상의 범죄를 범죄수익 환수의 대상이 되는 ‘중대범죄’로 정한 취지 / 형사법상 몰수를 갈음하는 추징이 형벌적 성격을 가지는지 여부 / 몰수·추징의 요건을 정한 범죄수익은닉의 규제 및 처벌 등에 관한 법률 및 같은 법 부칙 제2조를 해석할 때 고려할 사항 / 2022. 1. 4. 개정된 범죄수익은닉의 규제 및 처벌 등에 관한 법률의 몰수·추징에 관한 규정은 같은 법 시행 후 발생한 범죄행위부터 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=612111"},{"id":"P:622273","kind":"P","label":"2025고합8","title":"아동·청소년의성보호에관한법률위반(영리목적성착취물판매등), 아동·청소년의성보호에관한법률위반(성착취물배포등), 성폭력범죄의처벌등에관한특례법위반(영리목적카메라등이용촬영물반포등), 아동·청소년의성보호에관한법률위반(성착취물소지등), 성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영물반포등), 성폭력범죄의처벌등에관한특례법위반(허위영상물반포등), 정보통신망이용촉진및정보보호등에관한법률위반(음란물유포), 성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영물소지등), 성폭력범죄의처벌등에관한특례법위반(허위영상물소지등)","court":"제주지방법원","date":"2025.06.26","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=622273"},{"id":"P:607223","kind":"P","label":"2025도3061","title":"도주[도주죄의 성립을 인정하기 위해서는 범행주체가 실행에 착수할 당시 체포자의 실력적 지배 아래 있어야 하는지 문제 된 사건]","court":"대법원","date":"2025.06.26","caseType":"형사","basis":"참조조문","text":"진정신분범인 형법 제145조 제1항 도주죄에서 ‘법률에 따라 체포된 자’의 의미 / 도주죄의 성립을 인정하기 위해서는 범행주체가 실행에 착수할 당시 체포자의 실력적 지배 아래에 있었어야 하는지 여부 및 여기에 해당하는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=607223"},{"id":"P:607295","kind":"P","label":"2024도8067","title":"직권남용권리행사방해·공무상비밀누설[공무상비밀누설죄에서 법령에 의한 직무상 비밀에 해당하는지 문제된 사건]","court":"대법원","date":"2025.06.26","caseType":"형사","basis":"참조조문","text":"[1] 공무상비밀누설죄의 구성요건 중 ‘법령에 의한 직무상 비밀’의 의미 / 공무상비밀누설죄의 보호법익 / 수사기관이 특정 사건에 대하여 내사 또는 수사를 진행하고 있는 상태에서, 검사가 수사의 대상, 방법 등에 관하여 사법경찰관리에게 지휘한 내용을 기재한 수사지휘서의 기재 내용과 이에 관계된 수사상황이 수사기관 내부의 비밀에 해당하는지 여부 [2] 경찰관인 피고인이 경찰서 청문감사관으로 재직 중 해당 경찰서 수사과 직원으로부터 피고인의 아들 甲이 고소당한 사건 기록을 건네받아 검사의 수사지휘서 등을 열람·확인한 후 甲에게 전화하여 ‘수사지휘서에 구속 이야기가 없다. 구속될 일 없으니 걱정하지 마라.’고 말해 주어 공무상 비밀을 누설하였다는 내용으로 기소된 사안에서, 공소사실을 무죄로 판단한 원심판결에 공무상비밀누설죄에서의 ‘직무상 비밀’ 등에 관한 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=607295"},{"id":"P:608489","kind":"P","label":"2024노1360","title":"약사법위반","court":"울산지방법원","date":"2025.06.18","caseType":"형사","basis":"참조조문","text":"의약품 등으로 임상시험을 하려는 자는 그에 관한 계획서를 작성하여 식품의약품안전처장의 승인을 받아야 함에도, 항암 치료를 위해 개발 중인 특정 의약품의 개발자이자 연구책임자인 피고인이 임상시험 계획 승인을 받지 않고 항암시약을 피고인의 체내에 투여한 다음 신체에 나타나는 변화와 이상반응을 관찰함으로써 약사법을 위반하였다는 내용으로 기소된 사안에서, 연구자가 의약품의 유효성을 증명하기 위해 스스로 자신의 몸에 의약품을 투약하는 방식의 자기실험 역시 승인을 받아야 하는 임상시험으로 보아야 하나, 피고인의 행위가 약사법 위반죄의 구성요건에 해당하더라도 사회통념상 허용될 만한 상당성이 있는 행위로서 정당행위에 해당한다는 이유로, 피고인에게 무죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=608489"},{"id":"P:615743","kind":"P","label":"2025노218","title":"살인미수","court":"수원고등법원","date":"2025.06.18","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=615743"},{"id":"P:614627","kind":"P","label":"2024노1360","title":"약사법위반","court":"울산지방법원","date":"2025.06.18","caseType":"형사","basis":"참조조문","text":"의약품 등으로 임상시험을 하려는 자는 그에 관한 계획서를 작성하여 식품의약품안전처장의 승인을 받아야 함에도, 항암 치료를 위해 개발 중인 특정 의약품의 개발자이자 연구책임자인 피고인이 임상시험 계획 승인을 받지 않고 항암시약을 피고인의 체내에 투여한 다음 신체에 나타나는 변화와 이상반응을 관찰함으로써 약사법을 위반하였다는 내용으로 기소된 사안에서, 연구자가 의약품의 유효성을 증명하기 위해 스스로 자신의 몸에 의약품을 투약하는 방식의 자기실험 역시 승인을 받아야 하는 임상시험으로 보아야 하나, 피고인의 행위가 약사법 위반죄의 구성요건에 해당하더라도 사회통념상 허용될 만한 상당성이 있는 행위로서 정당행위에 해당한다는 이유로, 피고인에게 무죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=614627"},{"id":"P:619199","kind":"P","label":"2024노737","title":"개인정보보호법위반","court":"서울동부지방법원","date":"2025.06.13","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619199"},{"id":"P:606945","kind":"P","label":"2024노2513","title":"산업안전보건법위반·업무상과실치사·중대재해처벌등에관한법률위반(산업재해치사)","court":"창원지방법원","date":"2025.06.13","caseType":"형사","basis":"참조조문","text":"선박 건조·수리업을 영위하는 피고인 甲 주식회사는 자사 조선소 플로팅도크 내에 있던 컨테이너 운반선의 화물창 내부 핸드레일 보수공사를 관계수급인 회사에 하도급하였는데, 도급사업주인 피고인 甲 회사의 대표이사로서 경영책임자인 피고인 乙, 조선소장으로서 안전보건관리책임자인 피고인 丙, 수리사업팀 이사로서 선박수리업무 총괄책임자인 피고인 丁, 수리사업팀 의장담당자인 피고인 戊 등이 공동의 업무상과실로써 위 선박의 화물창 내부에 들어가 안전난간 보수공사를 준비 중이던 관계수급인의 근로자 己를 안전난간 소실구간을 통해 약 8m 아래 바닥으로 추락하여 사망에 이르게 함과 동시에, 도급에 따른 산업재해 예방의무와 산업재해 예방을 위한 안전조치의무를 위반하고 중대재해 처벌 등에 관한 법률상의 안전 및 보건 확보의무를 위반함으로써 근로자 己가 보수공사 현장에서 추락하여 사망하는 중대산업재해에 이르게 하였다고 하여 업무상과실치사, 산업안전보건법 위반 및 중대재해 처벌 등에 관한 법률 위반으로 기소된 사안에서, 피고인들 전원에게 유죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=606945"},{"id":"P:614587","kind":"P","label":"2024노2513","title":"산업안전보건법위반·업무상과실치사·중대재해처벌등에관한법률위반(산업재해치사)","court":"창원지방법원","date":"2025.06.13","caseType":"형사","basis":"참조조문","text":"선박 건조·수리업을 영위하는 피고인 甲 주식회사는 자사 조선소 플로팅도크 내에 있던 컨테이너 운반선의 화물창 내부 핸드레일 보수공사를 관계수급인 회사에 하도급하였는데, 도급사업주인 피고인 甲 회사의 대표이사로서 경영책임자인 피고인 乙, 조선소장으로서 안전보건관리책임자인 피고인 丙, 수리사업팀 이사로서 선박수리업무 총괄책임자인 피고인 丁, 수리사업팀 의장담당자인 피고인 戊 등이 공동의 업무상과실로써 위 선박의 화물창 내부에 들어가 안전난간 보수공사를 준비 중이던 관계수급인의 근로자 己를 안전난간 소실구간을 통해 약 8m 아래 바닥으로 추락하여 사망에 이르게 함과 동시에, 도급에 따른 산업재해 예방의무와 산업재해 예방을 위한 안전조치의무를 위반하고 중대재해 처벌 등에 관한 법률상의 안전 및 보건 확보의무를 위반함으로써 근로자 己가 보수공사 현장에서 추락하여 사망하는 중대산업재해에 이르게 하였다고 하여 업무상과실치사, 산업안전보건법 위반 및 중대재해 처벌 등에 관한 법률 위반으로 기소된 사안에서, 피고인들 전원에게 유죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=614587"},{"id":"P:606815","kind":"P","label":"2023도11395","title":"아동·청소년의성보호에관한법률위반(성착취물소지등)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영물소지등)[디지털 성범죄에서 압수수색의 혐의사실과의 객관적 관련성 인정 여부가 문제된 사건]","court":"대법원","date":"2025.06.12","caseType":"형사","basis":"판례내용","text":"전자정보 또는 전자정보저장매체에 대한 압수수색에서 혐의사실과 관련된 전자정보인지 판단할 때는 구체적·개별적 연관관계를 살펴보아야 하는지 여부 / 스마트폰 등을 이용한 불법촬영 등의 범죄의 경우, 그 안에 저장된 같은 유형의 전자정보에서 발견되는 간접증거나 정황증거는 혐의사실과 구체적·개별적 연관관계가 인정될 수 있는지 여부 / 이러한 법리는 압수수색의 혐의사실이 디지털 성범죄인 경우에 그 혐의사실과 같거나 근접한 시기에 또는 시간적 단절 없이 행하는 동종 유형이나 유사한 수법의 디지털 성범죄와 관련된 전자정보 또는 다른 목적과 수단 관계에 있는 디지털 성범죄와 관련된 전자정보에도 적용될 수 있는지 여부 / 수사기관이 영장 집행 당시까지 알거나 알 수 있었던 사정에 비추어 혐의사실과의 관련성을 판단하여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=606815"},{"id":"P:606797","kind":"P","label":"2024도14039","title":"성폭력범죄의처벌등에관한특례법위반(촬영물등이용협박)[‘촬영물 등’이 피해자를 대상으로 한 것이 아닌 경우에도 「성폭력범죄의 처벌 등에 관한 특례법」 위반(촬영물등이용협박)죄가 성립하는지 문제된 사건]","court":"대법원","date":"2025.06.12","caseType":"형사","basis":"참조조문","text":"구 성폭력범죄의 처벌 등에 관한 특례법 제14조의3 제1항에서 정한 ‘촬영물 등을 이용하여’의 의미 / 실제로 촬영, 제작, 복제 등의 방법으로 만들어진 바 있는 촬영물 등을 방편 또는 수단으로 삼아 유포가능성 등 공포심을 일으킬 수 있을 정도의 해악을 고지한 경우, 같은 법 제14조의3 제1항의 죄가 성립하는지 여부 및 촬영물 등이 피해자를 대상으로 한 것이 아닌 경우에도 위 죄가 성립하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=606797"},{"id":"P:618245","kind":"P","label":"2024노366","title":"특정경제범죄가중처벌등에관한법률위반(사기)","court":"부산고등법원","date":"2025.06.12","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=618245"},{"id":"P:618467","kind":"P","label":"2025고합28","title":"간음유인·미성년자의제강간·실종아동등의보호및지원에관한법률위반","court":"춘천지방법원원주지원","date":"2025.06.12","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=618467"},{"id":"P:612131","kind":"P","label":"2024도17056","title":"폭행·미성년자유인","court":"대법원","date":"2025.06.12","caseType":"형사","basis":"참조조문","text":"[1] 미성년자유인죄의 성립요건 / 미성년자가 보호감독자나 그로부터 보호감독을 위임받은 자의 사실적 지배하에 있는 경우, 보호감독자 등이 미성년자유인죄의 기망 대상이 될 수 있는지 여부 [2] 미성년자를 보호·감독하는 사람이 미성년자유인죄의 주체가 될 수 있는 경우 / 부모가 이혼하였거나 별거하는 상황에서 미성년의 자녀를 부모의 일방이 평온하게 보호·양육하고 있는데, 상대방 부모가 기망 또는 유혹을 수단으로 하여 미성년자나 보호감독자를 꾀어 자녀를 자기 또는 제3자의 사실상 지배하에 옮긴 행위가 미성년자에 대한 유인죄를 구성하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=612131"},{"id":"P:622331","kind":"P","label":"2024노5228","title":"사기","court":"수원지방법원","date":"2025.06.11","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=622331"},{"id":"P:609311","kind":"P","label":"2025노69","title":"강요·강제추행·유사강간·강요미수·성폭력범죄의처벌등에관한특례법위반(촬영물등이용협박)·성폭력범죄의처벌등에관한특례법위반(촬영물등이용강요)·아동·청소년의성보호에관한법률위반(성착취물제작등)·아동·청소년의성보호에관한법률위반(성착취물제작·배포등)·미성년자의제강제추행·미성년자의제유사강간·아동복지법위반(아동에대한음행강요·매개·성희롱등)·사기·아동·청소년의성보호에관한법률위반(성착취물소지등)·미성년자의제강제추행미수·부착명령·보호관찰명령","court":"부산고등법원","date":"2025.06.11","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=609311"},{"id":"P:615761","kind":"P","label":"2024노1141","title":"조세범처벌법위반·사기","court":"청주지방법원","date":"2025.06.05","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=615761"},{"id":"P:615867","kind":"P","label":"2023노1899","title":"중소기업협동조합법위반","court":"서울남부지방법원","date":"2025.06.05","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=615867"},{"id":"P:613303","kind":"P","label":"2024노563","title":"재물손괴·폭행·상해·스토킹범죄의처벌등에관한법률위반·성폭력범죄의처벌등에관한특례법위반(통신매체이용음란)·도로교통법위반(음주운전)","court":"서울서부지방법원","date":"2025.05.29","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=613303"},{"id":"P:612129","kind":"P","label":"2024오3","title":"특정범죄가중처벌등에관한법률위반(운전자폭행등)","court":"대법원","date":"2025.05.29","caseType":"형사","basis":"판례내용","text":"형사소송법 제441조에서 비상상고의 이유로 정한 ‘그 사건의 심판이 법령에 위반한 것’의 의미 및 단순히 법령 적용의 전제사실을 오인함에 따라 법령위반의 결과를 초래한 것과 같은 경우가 이에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=612129"},{"id":"P:612083","kind":"P","label":"2024도14555","title":"명예훼손·모욕","court":"대법원","date":"2025.05.29","caseType":"형사","basis":"참조조문","text":"[1] 형법 제310조의 위법성조각사유 요건 중 ‘진실한 사실’ 및 ‘오로지 공공의 이익에 관한 때’의 의미 / 적시된 사실이 ‘공공의 이익’에 관한 것인지 판단하는 기준 / 행위자의 주요한 동기나 목적인 공공의 이익에 부수적으로 다른 사익적 목적이나 동기가 내포되어 있는 경우, 형법 제310조의 적용 여부 [2] 사실적시의 내용이 사회 일반의 일부 이익에만 관련된 사항이거나 개인에 관한 사항이라도 공익성이 인정되는 경우 / 사인의 경우 공공의 이익에 관련되는지 판단하는 기준 [3] 모욕죄의 보호법익 및 ‘모욕’의 의미 / 어떠한 표현이 모욕죄의 ‘모욕’에 해당하는지 판단하는 기준 / 상대방을 불쾌하게 할 수 있는 무례하고 예의에 벗어난 정도의 표현이거나 상대방에 대한 부정적·비판적 의견이나 감정을 나타내면서 경미한 수준의 추상적 표현이나 욕설이 사용된 경우, 모욕죄의 구성요건에 해당하는지 여부 / 모욕죄의 구성요건을 해석·적용할 때 개인의 인격권과 표현의 자유가 함께 고려되어야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=612083"},{"id":"P:613049","kind":"P","label":"2025노123","title":"특정범죄가중처벌등에관한법률위반(향정)·마약류불법거래방지에관한특례법위반","court":"수원고등법원","date":"2025.05.28","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=613049"},{"id":"P:612943","kind":"P","label":"2024노1416","title":"특정경제범죄가중처벌등에관한법률위반(사기)·사기·범죄수익은닉의규제및처벌등에관한법률위반·외국환거래법위반·특정경제범죄가중처벌등에관한법률위반(재산국외도피)","court":"수원고등법원","date":"2025.05.21","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=612943"},{"id":"P:615861","kind":"P","label":"2025노110","title":"전기통신금융사기피해방지및피해금환급에관한특별법위반·범죄수익은닉의규제및처벌등에관한법률위반","court":"대전고등법원","date":"2025.05.16","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=615861"},{"id":"P:606185","kind":"P","label":"2025도470","title":"마약류관리에관한법률위반(향정)[형법 제37조 후단의 경합범 전과 해당 여부가 문제된 사건]","court":"대법원","date":"2025.05.15","caseType":"형사","basis":"참조조문","text":"형법 제37조 후단의 경합범에서 ‘판결이 확정된 죄’의 의미 / 집행유예를 선고한 확정판결에 의한 형의 선고가 형법 제65조에 따라 그 효력을 잃었으나 확정판결을 받은 죄의 존재가 이에 의하여 소멸되지 않는 경우, 위 확정판결을 받은 죄가 형법 제37조 후단에서 정한 ‘판결이 확정된 죄’에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=606185"},{"id":"P:606187","kind":"P","label":"2025도1084","title":"무고·폭행[무고죄에서 ‘신고된 사실’ 자체가 형사처분의 원인이 될 수 있는지가 문제된 사건]","court":"대법원","date":"2025.05.15","caseType":"형사","basis":"참조조문","text":"허위의 사실을 신고한 행위가 무고죄를 구성하기 위하여는 ‘신고된 사실’ 자체가 형사처분 또는 징계처분의 원인이 될 수 있어야 하는지 여부 및 이때 ‘징계처분’의 의미 / 허위의 사실을 신고하였으나 신고된 사실이 사법적 법률행위의 성격을 가진 징계처분의 원인에 불과한 경우, 무고죄가 성립하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=606187"},{"id":"P:606189","kind":"P","label":"2024도16239","title":"부패방지및국민권익위원회의설치와운영에관한법률위반·농지법위반·공무상비밀누설[공무원이 업무처리 중 알게 된 택지 개발 정보를 이용하여 지인들로 하여금 토지를 취득하게 하는 등의 행위로 기소된 사건]","court":"대법원","date":"2025.05.15","caseType":"형사","basis":"참조조문","text":"[1] 법조경합의 한 형태인 특별관계의 의미 및 법조경합인지 실질적 수죄인지 판단하는 기준 / 공직자가 업무처리 중 알게 된 비밀을 이용하여 재물 또는 재산상 이익을 취득하거나 제3자로 하여금 취득하게 한 경우, 구 부패방지 및 국민권익위원회의 설치와 운영에 관한 법률 제86조 제1항 위반죄만 성립하는지 여부 및 별도로 형법상 공무상비밀누설죄가 성립하는지 여부 [2] 군사법원법상 압수의 대상 / 신분적 재판권에 관하여 군사법원법 제2조가 정한 군인, 군무원 등이 아닌 사람이 소유·소지·보관하고 있는 물건도 해당 압수·수색영장의 범죄 혐의사실과의 관련성과 압수할 필요성이 인정되는 경우에는 군사법원법상 압수의 대상이 될 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=606189"},{"id":"P:615737","kind":"P","label":"2024노769","title":"교통사고처리특례법위반(치상)·도로교통법위반(음주운전)","court":"창원지방법원","date":"2025.05.13","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=615737"},{"id":"P:605983","kind":"P","label":"2024도20848","title":"특정금융거래정보의보고및이용등에관한법률위반·외국환거래법위반[「특정 금융거래정보의 보고 및 이용 등에 관한 법률」에 따른 신고 없이 가상자산거래를 영업으로 한 사건]","court":"대법원","date":"2025.05.01","caseType":"형사","basis":"참조조문","text":"구 특정 금융거래정보의 보고 및 이용 등에 관한 법률 부칙 제5조에 의하여 신고의무가 유예된 기간 동안 가상자산거래를 한 가상자산사업자가 같은 법 제17조 제1항의 ‘제7조 제1항을 위반하여 신고를 하지 아니하고 가상자산거래를 영업으로 한 자’에 해당하는지 여부 / 신고의무 유예기간 동안의 가상자산거래 영업행위가 신고의무 유예기간 경과 후 성립하는 같은 법 제17조 제1항 위반죄와 포괄하여 일죄가 되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=605983"},{"id":"P:605941","kind":"P","label":"2021도11938","title":"성폭력범죄의처벌등에관한특례법위반(친족관계에의한강간)[예비적죄명:성폭력범죄의처벌등에관한특례법위반(친족관계에의한준강간)][친족관계에 의한 성폭력범죄에서 피해자가 심리적 항거불능 또는 현저한 항거곤란 상태에 있었는지 여부가 문제된 사건]","court":"대법원","date":"2025.05.01","caseType":"형사","basis":"참조조문","text":"[1] 성폭력범죄의 처벌 등에 관한 특례법 제5조 제1항, 제3항에서 친족관계에서의 강간 또는 준강간행위를 가중처벌하는 취지 / 친족관계에 의한 성폭력범죄를 심리할 때 고려하여야 할 사항 [2] 형법 제299조 준강간죄의 보호법익 / 준강간죄의 구성요건인 ‘항거불능’ 상태의 의미 및 특별한 친족관계나 정신적·경제적 지배·예속관계 등으로 우월적 지위에 있는 피고인이 상당한 기간 동안 계속적으로 행한 폭력, 성적 학대나 감시와 통제 등의 점진적·누적적 영향으로 말미암아 열악한 지위에 놓이게 된 피해자에게 심리적 항거불능 또는 현저한 항거곤란이 인정될 수 있는 경우 / 피고인의 성적 침해행위 당시 피해자가 심리적 항거불능 또는 현저한 항거곤란 상태에 있었는지 판단하는 기준","url":"https://www.law.go.kr/precInfoP.do?precSeq=605941"},{"id":"P:605949","kind":"P","label":"2024도15290","title":"특정경제범죄가중처벌등에관한법률위반(횡령)·특정경제범죄가중처벌등에관한법률위반(배임)(인정된죄명:업무상배임)·주식회사의외부감사에관한법률위반·특정경제범죄가중처벌등에관한법률위반(횡령)방조·대부업의등록및금융이용자보호에관한법률위반[양벌규정에서 사업주와 행위자의 관계가 공범에 해당하여 공소시효 정지에 관한 형사소송법 제253조 제2항이 적용되는지 여부가 문제된 사건]","court":"대법원","date":"2025.05.01","caseType":"형사","basis":"참조조문","text":"공소시효의 정지에 관한 형사소송법 제253조 제2항의 ‘공범’을 해석할 때 고려하여야 할 사항 / 형사소송법 제253조 제2항의 ‘공범’에 양벌규정에서 사업주와 행위자 관계에 있는 사람이 포함되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=605949"},{"id":"P:616561","kind":"P","label":"2024고단4580","title":"범죄수익은닉의규제및처벌등에관한법률위반","court":"서울남부지방법원","date":"2025.04.30","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=616561"},{"id":"P:619283","kind":"P","label":"2025노688","title":"도로교통법위반(음주운전)·전자장치부착등에관한법률위반","court":"의정부지방법원","date":"2025.04.29","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619283"},{"id":"P:609339","kind":"P","label":"2024노3404","title":"성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등)·성폭력범죄의처벌등에관한특례법위반(허위영상물편집·반포등)·성폭력범죄의처벌등에관한특례법위반(비밀준수등)","court":"서울중앙지방법원","date":"2025.04.29","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=609339"},{"id":"P:609603","kind":"P","label":"2024도14169","title":"정보통신망이용촉진및정보보호등에관한법률위반(일부인정된죄명및일부변경된죄명:게임산업진흥에관한법률위반)·업무방해","court":"대법원","date":"2025.04.24","caseType":"형사","basis":"참조조문","text":"[1] 구 범죄수익은닉의 규제 및 처벌 등에 관한 법률상 몰수·추징의 대상인 ‘범죄행위에 의하여 생긴 재산’에 중대범죄의 범죄행위에 의하여 새로 만들어진 재산뿐만 아니라 그러한 범죄행위에 의하여 취득한 재산도 포함되는지 여부 [2] 피고인이 공범들과 공모하여 대금을 받고 온라인게임에서 설정된 제한 등을 무력화하는 프로그램을 게임이용자들에게 판매하고, 구매자인 게임이용자들은 이를 실행하여 게임에서 설정된 제한 등을 무력화함으로써 피해자 게임회사들로 하여금 핵프로그램을 통제하기 위한 패치프로그램 및 보안프로그램 설치비용을 지출하게 하는 등 정상적인 게임 운영 업무를 방해하였다는 공소사실이 제1심 및 원심에서 유죄로 인정된 후 추징의 범위가 문제 된 사안에서, 핵프로그램을 판매하는 피고인과 이를 구매하여 이용한 게임이용자들이 함께 업무방해죄의 공동정범이 된다면 피고인이 취득한 핵프로그램 판매대금도 업무방해죄에 의하여 취득한 재산으로서 구 범죄수익은닉의 규제 및 처벌 등에 관한 법률에 따른 추징의 대상이라는 등의 이유로, 이와 달리 본 원심판결에 같은 법 제10조의 추징에 관한 법리오해 등의 잘못이 있다고 한 사례 [3] 주형과 몰수·추징을 선고한 항소심판결 중 몰수·추징 부분에 관해서만 파기사유가 있을 경우, 상고심의 파기 범위 / 이때 항소심이 몰수·추징을 선고하지 아니하였음을 이유로 파기하는 경우, 상고심의 파기 범위","url":"https://www.law.go.kr/precInfoP.do?precSeq=609603"},{"id":"P:605973","kind":"P","label":"2021도1336","title":"업무상횡령·사립학교법위반[사립대학교 총장이 변호사비용 등을 교비회계에서 지출한 경우 사립학교법위반죄와 업무상횡령죄의 성립 여부가 문제된 사건]","court":"대법원","date":"2025.04.24","caseType":"형사","basis":"참조조문","text":"[1] 사립학교법이 학교법인의 회계를 분리하는 취지 및 특히 학교회계 중 교비회계의 다른 회계로의 전용을 금지하는 취지 [2] 사립학교법상 교비회계에서의 소송비용 지출은 학교의 운영 또는 교육과 관련이 있는 것 중에서도 일정 범위로 엄격하게 제한되어야 하는지 여부 / 변호사비용 등 소송비용을 교비회계에 속하는 수입에서 지출할 수 있는지 판단하는 기준 [3] 사립학교의 교비회계에 속하는 수입을 당해 학교의 교육에 직접 필요한 용도가 아닌 다른 용도에 사용한 경우, 횡령죄가 성립하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=605973"},{"id":"P:605951","kind":"P","label":"2024도16766","title":"특정범죄가중처벌등에관한법률위반(뇌물)·뇌물수수·사전뇌물수수[시장정비사업조합의 임원을 뇌물죄에서의 ‘공무원’으로 볼 수 있는지 여부가 문제된 사건]","court":"대법원","date":"2025.04.24","caseType":"형사","basis":"참조조문","text":"시장정비사업조합의 임원에 대하여 구 전통시장 및 상점가 육성을 위한 특별법 제4조 제1항에 따라 도시 및 주거환경정비법 제134조의 공무원 의제 규정이 준용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=605951"},{"id":"P:612921","kind":"P","label":"2024노3318","title":"성폭력범죄의처벌등에관한특례법위반(친족관계에의한강간)·성폭력범죄의처벌등에관한특례법위반(친족관계에의한준강간)·성폭력범죄의처벌등에관한특례법위반(친족관계에의한강제추행)·특정범죄가중처벌등에관한법률위반(보복협박등)·특수폭행·스토킹범죄의처벌등에관한법률위반","court":"서울고등법원","date":"2025.04.24","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=612921"},{"id":"P:605855","kind":"P","label":"2024고단518","title":"저작권법위반","court":"대구지방법원안동지원","date":"2025.04.16","caseType":"형사","basis":"참조조문","text":"피고인 甲은 피고인 乙로부터 피고인 乙이 운영하는 음식점에 사용할 ‘호랑이 및 까치가 그려져 있는 벽화’를 제작하여 달라는 의뢰를 받고 丙에게 저작권이 있는 미술저작물과 유사한 벽화를 그려 피고인 乙의 음식점 내부 벽면에 설치하였고, 피고인 乙은 丙의 법률대리인을 통한 저작재산권 침해 주장 취지의 내용증명을 수령하고도 위와 같이 설치된 벽화를 자신의 음식점에 9개월여 동안 전시함으로써 피고인들이 丙의 저작재산권을 복제 또는 전시의 방법으로 침해하였다는 저작권법 위반으로 기소된 사안에서, 피고인들에게 유죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=605855"},{"id":"P:605729","kind":"P","label":"2025도1302","title":"사기[검사의 공소장변경허가신청을 허가한 원심의 조치가 적법한지 여부가 문제된 사건]","court":"대법원","date":"2025.04.15","caseType":"형사","basis":"참조조문","text":"[1] 공소장변경이 허용되는 범위 / 공소사실의 동일성이 인정되지 않는 범죄사실을 공소사실로 추가하는 취지의 공소장변경신청이 있는 경우, 법원은 그 변경신청을 기각하여야 하는지 여부 [2] 검사가 ‘피고인이 2019. 12. 10.경 피해자 甲에게 1억 원을 수표로 인출해 주면 300억 원의 자금을 유치하여 그중 5억 원을 주겠다고 거짓말을 하여, 甲으로부터 2019. 12. 18.경부터 2020. 1. 3.경 사이에 수표로 합계 1억 원을 편취하였다.’는 공소사실로 기소하였다가, 그 후 원심에서 ‘피고인은 피해자 乙을 기망하여 투자금 명목으로 금원을 편취하기로 甲, 丙과 순차 공모한 다음, 丙이 2019. 12. 13.경 乙에게 비자금창고와 관련된 작업비용 1억 원을 투자하면 수익금 5억 원을 지급하겠다고 거짓말하고, 피고인과 甲, 丙이 2019. 12. 17.경 乙을 만난 자리에서 마치 자신들이 비자금창고 관계자들인 것처럼 행세하여 乙로부터 2019. 12. 17.경 수표로 합계 1억 원을 편취하였다.’는 공소사실로 변경하는 공소장변경허가신청을 한 사안에서, 검사의 공소장변경을 받아들여 이를 유죄로 인정한 원심판결에 공소사실의 동일성, 공소장변경 등에 관한 법리오해의 잘못이 있다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=605729"},{"id":"P:605725","kind":"P","label":"2024도18718","title":"마약류관리에관한법률위반(향정)·마약류관리에관한법률위반(대마)·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등)[피고인이 두 사람에게 각각 피고인의 휴대전화로 피해자와의 성관계 동영상을 재생하여 시청하게 한 것이 「성폭력범죄의 처벌 등에 관한 특례법」(이하 ‘성폭력처벌법’) 제14조 제2항의 ‘공공연하게 상영’한 경우에 해당하는지 여부가 문제된 사건]","court":"대법원","date":"2025.04.15","caseType":"형사","basis":"판례내용","text":"[1] 성폭력범죄의 처벌 등에 관한 특례법 제14조 제2항의 입법 취지 / 위 조항의 보호법익 및 그중 ‘성적 자유’의 의미 [2] 성폭력범죄의 처벌 등에 관한 특례법 제14조 제2항에서 요구하는 ‘공공연하게’ 촬영물 등을 상영했다고 하려면 ‘불특정 또는 다수인’이 촬영물 등을 시청할 수 있는 상태에 이르러야 하는지 여부 및 이때 ‘다수인’인지 판단하는 방법","url":"https://www.law.go.kr/precInfoP.do?precSeq=605725"},{"id":"P:605767","kind":"P","label":"2024도16921","title":"업무방해","court":"대법원","date":"2025.04.15","caseType":"형사","basis":"참조조문","text":"[1] 업무방해죄에서 ‘위력’의 의미 및 위력에 해당하는지 판단하는 기준 [2] 헌법상 표현의 자유의 보장과 한계 및 정부 또는 국가기관의 정책결정이나 업무수행과 관련된 사항 등 공적 관심사에 대한 표현행위가 형법 제314조 제1항의 업무방해죄에서 말하는 위력의 행사에 해당하는지 판단할 때 고려할 사항","url":"https://www.law.go.kr/precInfoP.do?precSeq=605767"},{"id":"P:605811","kind":"P","label":"2024도15789","title":"특정경제범죄가중처벌등에관한법률위반(수재등)·특정경제범죄가중처벌등에관한법률위반(증재등)·특정경제범죄가중처벌등에관한법률위반(수재등)방조[금융회사등의 임직원이 변호사비를 대납받거나 황금도장을 수수하는 등으로 직무에 관하여 금품이나 그 밖의 이익을 수수·요구·약속하였는지 여부가 문제된 사건]","court":"대법원","date":"2025.04.10","caseType":"형사","basis":"판례내용","text":"[1] 금융회사 등의 임직원이 직접 금품이나 그 밖의 이익을 받지 아니하고 공여자로 하여금 다른 사람에게 금품이나 그 밖의 이익을 공여하도록 한 경우, 특정경제범죄 가중처벌 등에 관한 법률 제5조 제1항 위반죄가 성립하기 위한 요건 / 이는 금품이나 그 밖의 이익을 요구하거나 약속하는 행위의 경우에도 마찬가지인지 여부 [2] 형사소송법 제215조 제1항에 따라 영장에 의하여 압수·수색·검증을 할 수 있는 요건인 ‘해당 사건과 관계가 있다고 인정할 수 있는 것’의 의미 및 이때 압수수색영장의 범죄혐의사실과 객관적 관련성이 인정되는 범위 / 객관적 관련성을 인정할 수 있는 구체적·개별적 연관관계가 있는 경우인지 판단하는 기준 / 수사기관이 헌법과 형사소송법이 정한 절차에 따르지 않고 수집한 증거와 이를 기초로 획득한 2차적 증거를 유죄 인정의 증거로 삼을 수 있는지 여부 및 법원이 위 증거를 유죄 인정의 증거로 사용할 수 있는 예외적인 경우","url":"https://www.law.go.kr/precInfoP.do?precSeq=605811"},{"id":"P:606379","kind":"P","label":"2024고정1395","title":"도로교통법위반(음주운전)","court":"수원지방법원","date":"2025.04.10","caseType":"형사","basis":"참조조문","text":"피고인이 건물 지하 1층의 주차장 출구 차단기에서부터 인근 도로에 이르기까지 약 10m 구간에서 술에 취한 상태로 자동차를 운전하였다는 도로교통법 위반으로 기소되었는데, 당시 피고인은 음주 후 귀가를 위하여 지하 주차장에서 대리기사 甲을 호출하여 甲이 피고인을 뒷좌석에 태운 채 운전을 시작하였으나 차단기 앞에서 주차요금 지불 등으로 시비가 붙어 甲이 차량을 경사 구간에 둔 채 내리자, 피고인이 차량을 운전하여 차단기를 통과하면서 주차요금을 지불하고 주차장을 빠져나온 다음 도로에 차량을 주차하고 차량 뒷좌석으로 이동하여 다른 대리기사를 물색하던 중 甲의 신고로 출동한 경찰관이 피고인에 대해 음주측정을 한 사안에서, 피고인의 행위가 긴급피난 또는 과잉피난에 해당하여 위법성이 조각된다는 이유로 피고인에게 무죄를 선고한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=606379"},{"id":"P:605891","kind":"P","label":"2024고합637","title":"살인미수·법정소동·위헌심판제청","court":"서울남부지방법원","date":"2025.04.04","caseType":"형사","basis":"참조조문","text":"피고인은 甲에게 비트코인 등 가상자산을 예치하였다가 이를 반환받지 못하는 피해를 입었는데, 甲이 피고인을 포함한 다수인으로부터 가상자산을 예치받아 편취하였다는 특정경제범죄 가중처벌 등에 관한 법률 위반 등의 공소사실로 구속 기소되어 재판을 받게 되자 공판기일에 매번 참석하여 재판을 방청하면서 甲이 범행을 부인하는 모습 등에 불만을 갖고 있던 중, 과도와 면장갑을 가방에 넣어 숨기는 방법으로 법원 출입구 보안 검색대를 통과한 후 甲의 재판이 진행될 법정에 들어가 방청석 맨 앞줄에 앉아 있다가 甲 등에 대한 재판이 진행 중인 틈을 타 甲의 뒤로 다가가 왼손으로 甲의 머리채를 잡아 왼쪽으로 젖혀 목이 드러나게 한 다음 오른손에 쥐고 있던 과도를 위에서 아래 방향으로 5회 연속으로 내리찍어 甲을 살해하려 하였으나 甲에게 상해만 입게 하여 미수에 그침과 동시에 위 소동으로 인해 재판이 중단되었다는 살인미수 및 법정소동의 공소사실로 기소된 사안에서, 공소사실을 유죄로 인정한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=605891"},{"id":"P:605375","kind":"P","label":"2021도4355","title":"특수상해[형 집행순서변경에 관한 검사의 지휘로 형 집행 종료일이 늦어짐에 따라 출소 후 범행이 누범 및 집행유예결격에 해당하는지 여부가 문제된 사안]","court":"대법원","date":"2025.03.27","caseType":"형사","basis":"참조조문","text":"[1] 형 집행을 지휘하는 주체인 검사가 형의 집행순서변경에 관한 권한을 행사할 수 있는 범위 [2] 형의 집행순서변경에 관한 검사의 지휘가 재량을 일탈·남용한 것으로서 위법한지 여부의 기준 시점 및 판단 기준 / 형의 집행순서변경 후에 수형자가 새로운 범죄행위를 하였다는 등의 우연한 사정을 이유로 그러한 사정이 발생한 때를 기준으로 사후적인 관점에서 집행순서변경이 수형자에게 미친 영향의 유불리를 평가하여 집행순서변경에 관한 지휘의 위법성을 판단할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=605375"},{"id":"P:605329","kind":"P","label":"2024도20290","title":"강도치상·특정범죄가중처벌등에관한법률위반(절도)[「특정범죄 가중처벌 등에 관한 법률」(이하 ‘특정범죄가중법’) 제5조의4 제6항에서 정한 ‘상습적으로 절도죄 등으로 실형을 선고받고’의 의미가 문제된 사건]","court":"대법원","date":"2025.03.27","caseType":"형사","basis":"참조조문","text":"특정범죄 가중처벌 등에 관한 법률 제5조의4 제6항에서 정한 ‘상습적으로 형법 제329조부터 제331조까지의 죄나 그 미수죄로 실형을 선고받고’의 의미 / 상습범이 아닌 형법 제329조부터 제331조까지의 죄나 그 미수죄 등 기본 구성요건의 범죄로 처벌받은 데 그쳤으나 그 범죄가 상습성의 발현에 의한 것인 경우, 특정범죄 가중처벌 등에 관한 법률 제5조의4 제6항이 적용되는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=605329"},{"id":"P:605289","kind":"P","label":"2024도18441","title":"사기[카드론 대출에서 사기죄의 기망행위 성립 여부가 문제된 사건]","court":"대법원","date":"2025.03.27","caseType":"형사","basis":"참조조문","text":"[1] 사기죄의 성립요건인 ‘기망행위’의 의미 / 사람에 대한 기망행위를 수반하지 않는 경우, 사기죄로 처벌할 수 있는지 여부 [2] 피고인이 정상적으로 대출금을 반환할 의사나 능력이 없음에도 휴대전화에 설치된 카드회사의 애플리케이션을 통해 카드론 대출을 신청하여 대출금을 자신의 계좌로 송금받는 방법으로 총 2회에 걸쳐 카드회사들을 기망하여 카드회사들로부터 대출금을 편취하였다는 공소사실로 기소된 사안에서, 피고인의 행위는 사람에 대한 기망행위를 수반하지 않아 사기죄에 해당하지 않는다고 한 사례","url":"https://www.law.go.kr/precInfoP.do?precSeq=605289"},{"id":"P:606229","kind":"P","label":"2024노3692","title":"공직선거법위반","court":"서울고등법원","date":"2025.03.26","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=606229"},{"id":"P:608361","kind":"P","label":"2024노732","title":"전기통신금융사기피해방지및피해금환급에관한특별법위반·사기·사기미수","court":"대전고등법원","date":"2025.03.21","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=608361"},{"id":"P:605069","kind":"P","label":"2023도10405","title":"성폭력범죄의처벌등에관한특례법위반(강간등치상)·마약류관리에관한법률위반(향정)[성폭력범죄의 처벌 등에 관한 특례법 위반(강간등치상)죄의 미수범 인정 여부가 문제된 사건]","court":"대법원","date":"2025.03.20","caseType":"형사","basis":"참조조문","text":"성폭력범죄의 처벌 등에 관한 특례법 제4조 제1항에서 정한 특수강간의 죄를 범한 경우뿐만 아니라 특수강간의 실행에 착수하였으나 미수에 그친 경우라도, 이로 인하여 피해자가 상해를 입었으면 같은 법 제8조 제1항의 특수강간치상죄가 성립하는지 여부 / 특수강간치상죄의 미수범 성립을 부정하는 대법원의 현재 법리는 타당하여 유지되어야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=605069"},{"id":"P:606769","kind":"P","label":"2024도12209","title":"사기","court":"대법원","date":"2025.03.13","caseType":"형사","basis":"참조조문","text":"[1] 형법 제10조 제1항 ‘심신상실자’ 및 같은 조 제2항 ‘심신미약자’의 의미 / 사물변별능력이나 의사결정능력이 사실의 인식능력이나 기억능력과 반드시 일치하는 것인지 여부 [2] 형법 제10조에 규정된 ‘심신장애’의 요건 / 심신장애 유무의 판단이 법률문제인지 여부 및 법원은 전문감정인의 의견에 구속되지 않고 독자적으로 판단할 수 있는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=606769"},{"id":"P:606785","kind":"P","label":"2021도12274","title":"강제추행·재물손괴","court":"대법원","date":"2025.03.13","caseType":"형사","basis":"참조조문","text":"국가공무원법상 성폭력범죄의 처벌 등에 관한 특례법 제2조에 따른 성폭력범죄와 다른 죄의 경합범에 대하여 벌금형을 선고하는 경우에는 이를 분리 선고하여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=606785"},{"id":"P:605079","kind":"P","label":"2024도19846","title":"컴퓨터등사용사기[친족상도례에 의한 형 면제 여부가 문제된 사건]","court":"대법원","date":"2025.03.13","caseType":"형사","basis":"참조조문","text":"[1] 형벌에 관한 법률 또는 법률조항이더라도 처벌되지 않는 사유를 규정한 경우, 이러한 법률조항에 대한 위헌결정에 헌법재판소법 제47조 제3항에 따른 소급효가 인정되는지 여부 및 위 법률조항은 같은 법 제47조 제2항에 따라 위헌결정이 있는 날부터 효력을 상실하는지 여부 [2] 형벌조각사유로서 형의 면제를 규정한 형법 제328조 제1항은 위 법률조항에 대한 헌법재판소 2024. 6. 27. 헌법불합치결정이 있는 날부터 효력을 상실하는지 여부 [3] 컴퓨터등사용사기죄에서 ‘정보처리’ 및 ‘재산상 이익 취득’의 의미 / 가맹점이나 금융기관 등의 인터넷 사이트 또는 휴대전화 애플리케이션 등에 접속하여 타인의 승낙 없이 타인의 인적사항과 타인 명의의 신용카드 번호 및 그 비밀번호 등을 입력하는 방법으로 물품이나 서비스 이용대금 등을 결제하거나 금융기관 등으로부터 신용대출을 받음으로써 재산상 이익을 취득하는 행위가 가맹점이나 대출금융기관 등에 대한 컴퓨터등사용사기죄에 해당하는지 여부 [4] 공소사실의 기재가 오해를 불러일으키거나 명료하지 못한 경우, 법원은 검사에 대하여 석명권을 행사하여 그 취지를 명확하게 하여야 하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=605079"},{"id":"P:606783","kind":"P","label":"2024도20879","title":"강제추행·방실침입","court":"대법원","date":"2025.03.13","caseType":"형사","basis":"참조조문","text":"사실심법원이 형법 제51조에서 정한 양형조건으로 포섭되지 않는 별도의 범죄사실에 해당하는 사정을 증거 없이 핵심적인 형벌가중적 양형조건으로 삼아 형의 양정을 한 경우, 그 부당성을 다투는 피고인의 주장이 적법한 상고이유에 해당하는지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=606783"},{"id":"P:606753","kind":"P","label":"2024도19045","title":"강간·주거침입·폭행(인정된죄명:강간미수)·보호관찰명령","court":"대법원","date":"2025.03.13","caseType":"형사","basis":"판례내용","text":"탄핵증거에 엄격한 증거조사가 필요한지 여부 및 법정에서 이에 대한 증거조사는 필요한지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=606753"},{"id":"P:617205","kind":"P","label":"2024고단10","title":"업무상과실치사·산업안전보건법위반·중대재해처벌등에관한법률위반(산업재해치사)","court":"대전지방법원홍성지원","date":"2025.02.28","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=617205"},{"id":"P:604743","kind":"P","label":"2021도7108","title":"특정범죄가중처벌등에관한법률위반(허위세금계산서교부등)·조세범처벌법위반[실제 거래의 주체가 아닌 타인 명의로 세금계산서를 발급·수수한 경우 구 「조세범처벌법」(2018. 12. 31. 법률 제16108호로 개정되기 전의 것, 이하 ‘구 「조세범처벌법」’) 제10조의 거짓 세금계산서 발급 등에 해당하는지 여부가 문제된 사건]","court":"대법원","date":"2025.02.27","caseType":"형사","basis":"참조조문","text":"세금계산서의 기재나 매출·매입처별세금계산서합계표의 작성·제출이 제3자 명의로 되어 있음에도 예외적으로 실제로 사업체를 운영하면서 재화 등을 공급하거나 공급받는 거래행위를 한 사람을 세금계산서를 발급·수수하고 매출·매입처별세금계산서합계표를 작성·제출하는 주체로 볼 수 있는지를 판단할 때 고려하여야 할 사항 및 판단 기준 / 이는 부가가치세법에 따른 세금계산서 및 매출·매입처별세금계산서합계표와 유사한 기능을 수행하는 소득세법과 법인세법에 따른 계산서, 매출·매입처별계산서합계표에 있어서도 마찬가지인지 여부","url":"https://www.law.go.kr/precInfoP.do?precSeq=604743"},{"id":"P:619323","kind":"P","label":"2022노329","title":"건축물관리법위반·업무상과실치사·업무상과실치상·산업안전보건법위반","court":"광주고등법원","date":"2025.02.21","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=619323"},{"id":"P:618449","kind":"P","label":"2024노1726","title":"강제추행·성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등)","court":"전주지방법원","date":"2025.02.20","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=618449"},{"id":"P:609367","kind":"P","label":"2024노1830","title":"특정금융거래정보의보고및이용등에관한법률위반·외국환거래법위반·사기방조·범죄수익은닉의규제및처벌등에관한법률위반","court":"서울북부지방법원","date":"2025.02.19","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=609367"},{"id":"P:608421","kind":"P","label":"2024노3033","title":"공무집행방해·재물손괴·아동복지법위반(아동에대한음행강요·매개·성희롱등)·성폭력범죄의처벌등에관한특례법위반(통신매체이용음란)","court":"대전지방법원","date":"2025.02.19","caseType":"형사","basis":"판례내용","text":"","url":"https://www.law.go.kr/precInfoP.do?precSeq=608421"},{"id":"P:603537","kind":"P","label":"2023도1907","title":"관세법위반·의료기기법위반[관세법 제269조 제2항 제1호, 제241조 제1항의 밀수입죄에서의 ‘세관장에게 신고를 하지 아니하고 물품을 수입한 자’의 해석이 문제된 사건]","court":"대법원","date":"2025.02.13","caseType":"형사","basis":"판례내용","text":"관세법 제269조 제2항 제1호의 처벌조항 중 ‘
